BANK.push({"cat": CA, "type": "single", "stem": "Which statement best distinguishes growth from development?", "opts": [{"t": "Growth is an increase in size, while development is function changing from simple to complex", "c": true, "r": "Correct. Growth is size; development is function and gradual change, simple to complex, in an orderly sequence."}, {"t": "Growth is function changing over time, while development is only an increase in body size", "c": false, "r": "Incorrect. That reverses the two terms; size belongs to growth and function to development."}, {"t": "Growth and development are the same process and both stop once a child reaches school age", "c": false, "r": "Incorrect. They are related but distinct, and development continues across the whole lifespan."}, {"t": "Growth follows a set sequence, while development happens in a random order for each person", "c": false, "r": "Incorrect. Development is orderly and sequential, although its rate is highly individual."}], "tp": "Growth = size. Development = function, simple to complex, lifelong and orderly. Rate is individual.", "kt": ["Development", "Growth"]});

BANK.push({"cat": CA, "type": "single", "stem": "An infant controls the head and trunk before controlling the hands and feet. Which pattern is this?", "opts": [{"t": "Cephalocaudal development, in which growth and control proceed from the head downward", "c": true, "r": "Correct. Head-to-toe is cephalocaudal; the infant head is large compared with the rest of the body."}, {"t": "Proximodistal development, in which growth proceeds from the center outward to the limbs", "c": false, "r": "Incorrect. Center-outward is proximodistal, a different directional pattern than head-to-toe."}, {"t": "Sensorimotor development, in which learning occurs through senses and motor activity only", "c": false, "r": "Incorrect. Sensorimotor is a Piaget cognitive stage, not a directional pattern of body growth."}, {"t": "Psychosocial development, in which a task is resolved at each stage across the lifespan", "c": false, "r": "Incorrect. That describes Erikson stages, not the head-to-toe direction of physical growth."}], "tp": "Cephalocaudal = head to toe. Proximodistal = center outward.", "kt": ["Cephalocaudal", "Proximodistal"]});

BANK.push({"cat": CA, "type": "single", "stem": "Which statement about life expectancy is accurate?", "opts": [{"t": "It estimates years a person will probably live from averages of people with similar traits", "c": true, "r": "Correct. Life expectancy is a probability estimate from similar groups; an exact span cannot be predicted."}, {"t": "It states the exact number of years a newborn will live if no accident occurs in childhood", "c": false, "r": "Incorrect. A newborn's exact years cannot be predicted; only estimates from group averages are made."}, {"t": "It has fallen steadily in the United States since sanitation and immunizations first spread", "c": false, "r": "Incorrect. It rose sharply since the early 1900s with sanitation, medications, immunizations and nutrition."}, {"t": "It is the same for every population group, because income and geography do not affect it", "c": false, "r": "Incorrect. It differs by group and geography; higher-income households live about 3 to 7 years longer."}], "tp": "Life expectancy in 2019 as printed: men 76.3 years, women 81.4 years; females outlive males by about 5 years.", "kt": ["Life expectancy"]});

BANK.push({"cat": CA, "type": "single", "stem": "Which statement about teratogens is accurate?", "opts": [{"t": "Drugs, alcohol, viruses, and cigarette smoke can interfere with normal prenatal development", "c": true, "r": "Correct. Those are the named teratogens; cigarette smoke raises the incidence of low-birth-weight babies."}, {"t": "Teratogens act only after birth, when the newborn first meets agents in the outside world", "c": false, "r": "Incorrect. Teratogens interfere with prenatal development, before birth, in the unborn child."}, {"t": "Teratogens explain nearly all unfavorable pregnancy outcomes in every pregnant population", "c": false, "r": "Incorrect. The chapter attributes a possible 5% to 25% of unfavorable outcomes to teratogens."}, {"t": "Inherited diseases such as Tay-Sachs are caused when a mother is exposed to cigarette smoke", "c": false, "r": "Incorrect. Tay-Sachs is an inherited abnormality, not a result of a teratogen exposure."}], "tp": "Teratogens: drugs, alcohol, viruses, cigarette smoke. Possible 5% to 25% of unfavorable outcomes.", "kt": ["Teratogen"]});

BANK.push({"cat": CA, "type": "single", "stem": "Which statement about sex determination is accurate?", "opts": [{"t": "The ovum always carries an X, so a Y from the fertilizing sperm produces a boy and an X a girl", "c": true, "r": "Correct. The ovum always gives X; the sperm carries X or Y, and that decides the sex of the child."}, {"t": "The ovum carries either an X or a Y, so the mother alone decides the sex of the future child", "c": false, "r": "Incorrect. The ovum always carries X; variation comes from the sperm, which carries X or Y."}, {"t": "Each parent contributes 46 chromosomes, so the child ends up with a total of 92 chromosomes", "c": false, "r": "Incorrect. Each parent contributes one of each pair, for a total of 46 chromosomes in 23 pairs."}, {"t": "Identical twins can have different chromosome combinations, because environment alters them", "c": false, "r": "Incorrect. Identical twins share the exact combination of chromosomes, called the karyotype."}], "tp": "46 chromosomes, 23 pairs. Ovum = X always; sperm = X or Y.", "kt": ["Zygote"]});

BANK.push({"cat": CA, "type": "single", "stem": "A household includes parents, their children, and a grandmother who shares responsibilities. Which family type is this?", "opts": [{"t": "Extended family, because relatives beyond the nuclear unit live in the same household there", "c": true, "r": "Correct. Extended family is the nuclear family plus additional members living in the same household."}, {"t": "Nuclear family, because any household built around parents and children counts as nuclear", "c": false, "r": "Incorrect. Once grandparents or other relatives join the household, the type is extended family."}, {"t": "Blended family, because children from earlier marriages have been combined in one household", "c": false, "r": "Incorrect. A blended family combines children from previous marriages after parents remarry."}, {"t": "Grandfamily, because the grandmother alone heads the household and raises the grandchildren", "c": false, "r": "Incorrect. In a grandfamily the grandparents head the household; here the parents are present."}], "tp": "Nuclear = parents and children alone. Extended = nuclear plus other relatives in the household.", "kt": ["Extended family", "Nuclear family"]});

BANK.push({"cat": CA, "type": "multi", "stem": "Which qualities belong to a functional family, as listed in the chapter? Select all that apply.", "opts": [{"t": "A sense of commitment toward promoting the well-being of every member of the family unit", "c": true, "r": "Correct. Commitment to members' well-being is one of the 12 printed qualities of functional families."}, {"t": "Effective communication between individuals and a positive outlook during difficult times", "c": true, "r": "Correct. Effective communication and a positive outlook are both on the Box 24.3 quality list."}, {"t": "Flexibility to adapt to changes, with a variety of coping techniques available for problems", "c": true, "r": "Correct. Flexibility, varied coping techniques and varied resources are printed functional qualities."}, {"t": "Strict rigid rules enforced by one parent, with little openness to any outside influence", "c": false, "r": "Incorrect. That describes the autocratic pattern, not a quality on the functional family list."}, {"t": "One adult making most decisions alone while other adults simply carry out those decisions", "c": false, "r": "Incorrect. Single-person dominance describes patriarchal or matriarchal patterns, not Box 24.3."}, {"t": "Keeping the same family roles unchanged even after births, deaths, or divorces occur later", "c": false, "r": "Incorrect. Families must rearrange roles when circumstances change; rigidity is a risk sign."}], "tp": "Box 24.3: commitment, appreciation, quality time, purpose, harmony, communication, values, coping, problem solving, positive outlook, flexibility, resources."});

BANK.push({"cat": CA, "type": "multi", "stem": "Which findings are listed as common signs of stress in children? Select all that apply.", "opts": [{"t": "Mood swings, acting-out behavior, and a change in eating or sleeping patterns at home", "c": true, "r": "Correct. Mood swings, acting out and changed eating or sleeping are printed Box 24.4 signs."}, {"t": "Frequent physical complaints such as headaches or other unexplained somatic symptoms", "c": true, "r": "Correct. Frequent unexplained physical complaints are a printed sign of stress in children."}, {"t": "Excessive clinging to parents, thumb sucking, bedwetting, or return to earlier behavior", "c": true, "r": "Correct. Clinging, thumb sucking, bedwetting and regression to earlier behavior are listed."}, {"t": "Steady weight gain, longer sleep, and a new interest in playing with unfamiliar children", "c": false, "r": "Incorrect. Those are not on the stress sign list; stress changes eating and sleeping patterns."}, {"t": "Advanced vocabulary, early toilet control, and finishing homework well ahead of schedule", "c": false, "r": "Incorrect. Early achievement is not a stress sign; regression to earlier behavior is the sign."}, {"t": "Quiet compliance with every rule and no questions asked about a new school or routine", "c": false, "r": "Incorrect. Stress surfaces as behavior change; quiet compliance alone is not a listed sign."}], "tp": "Box 24.4 stress signs: mood swings, acting out, eating/sleeping change, somatic complaints, clinging, thumb sucking, bedwetting, regression."});

BANK.push({"cat": CB, "type": "single", "stem": "An infant whose basic needs are met consistently learns to trust caregivers. Which Erikson task is this?", "opts": [{"t": "Basic trust versus mistrust, the task of infancy from birth to about one year of age here", "c": true, "r": "Correct. Infancy is trust versus mistrust; responsive care for nourishment, warmth and contact builds trust."}, {"t": "Autonomy versus shame and doubt, the task of toddlerhood from about one to three years", "c": false, "r": "Incorrect. Autonomy is the toddler task, built on self-sufficiency in toileting, feeding and walking."}, {"t": "Initiative versus guilt, the task of the preschool years from about four to six years old", "c": false, "r": "Incorrect. Initiative is preschool; infants are working on trust, not on undertaking adult-like activities."}, {"t": "Industry versus inferiority, the task of school age from about seven to eleven years old", "c": false, "r": "Incorrect. Industry is about competence and productivity at school age, long after infancy ends."}], "tp": "Erikson: infant = trust vs mistrust. Unmet needs in infancy lead to mistrust.", "kt": ["Basic trust vs. mistrust"]});

BANK.push({"cat": CB, "type": "single", "stem": "A 2-year-old insists on feeding herself and says no often. Which Erikson task fits best?", "opts": [{"t": "Autonomy versus shame and doubt, as the toddler learns self-sufficiency in daily skills", "c": true, "r": "Correct. The toddler task is autonomy; toileting, feeding, walking and talking build self-sufficiency."}, {"t": "Initiative versus guilt, as the preschool child tries activities beyond limits set for her", "c": false, "r": "Incorrect. Initiative belongs to preschool; this child's age and self-feeding fit the toddler task."}, {"t": "Identity versus role confusion, as the adolescent works out sexual and career identities", "c": false, "r": "Incorrect. Identity is the adolescent task, not a task of a 2-year-old learning self-care skills."}, {"t": "Intimacy versus isolation, as the young adult seeks companionship and love with a partner", "c": false, "r": "Incorrect. Intimacy is young adulthood; a toddler's negativism is normal autonomy behavior instead."}], "tp": "Toddler = autonomy vs shame and doubt. The word no gives the toddler a sense of control."});

BANK.push({"cat": CB, "type": "single", "stem": "Which pairing of Erikson task and stage is correct?", "opts": [{"t": "Industry versus inferiority with school age, when a child works to feel competent and productive", "c": true, "r": "Correct. School-age children eagerly learn to be competent and productive, or feel inferior at tasks."}, {"t": "Initiative versus guilt with school age, when a child works to feel competent and productive", "c": false, "r": "Incorrect. Initiative versus guilt is the preschool task; school age is industry versus inferiority."}, {"t": "Generativity versus stagnation with adolescence, when a teen works out a personal identity", "c": false, "r": "Incorrect. Generativity is middle adulthood; adolescence is identity versus role confusion instead."}, {"t": "Ego integrity versus despair with middle age, when an adult reviews a whole life for meaning", "c": false, "r": "Incorrect. Ego integrity versus despair is late adulthood, not middle adulthood as stated here."}], "tp": "School age = industry vs inferiority. Feedback from others shapes competent versus incompetent self-concept."});

BANK.push({"cat": CB, "type": "single", "stem": "Which behavior shows Piaget's preoperational thought?", "opts": [{"t": "A 4-year-old centers on one aspect of an object and sees the world only from her own view", "c": true, "r": "Correct. Preoperational thought is egocentric, centers on a single aspect, and uses symbols and trial and error."}, {"t": "A 9-year-old sorts objects by two traits at once and explains a cause-and-effect sequence", "c": false, "r": "Incorrect. Focusing on more than one task and cause-and-effect fit concrete operational thought."}, {"t": "A 15-year-old reasons through a hypothetical problem with a systematic scientific method", "c": false, "r": "Incorrect. Systematic abstract problem solving is formal operational thought, from about age 12 on."}, {"t": "A 6-month-old learns that a toy still exists after it is hidden completely under a blanket", "c": false, "r": "Incorrect. Object permanence develops in the sensorimotor stage, from birth to about 2 years."}], "tp": "Preoperational, 2 to 7 years: egocentric, single-aspect centering, symbols, present-tense time.", "kt": ["Egocentrism"]});

BANK.push({"cat": CB, "type": "single", "stem": "Which behavior shows concrete operational thought?", "opts": [{"t": "A 9-year-old classifies objects, follows cause and effect, and takes another child's viewpoint", "c": true, "r": "Correct. Concrete operations, 7 to 11 years, bring logical operations, classification and other viewpoints."}, {"t": "A 4-year-old insists a taller glass must hold more, judging only by the height of the liquid", "c": false, "r": "Incorrect. Centering on one aspect is preoperational thinking, not concrete operational thought."}, {"t": "A 13-year-old debates an ethical question by weighing ideas that may never actually happen", "c": false, "r": "Incorrect. Abstract and hypothetical reasoning is formal operational thought, not concrete thought."}, {"t": "A 1-year-old uses senses and movement alone to learn about objects placed within her reach", "c": false, "r": "Incorrect. Learning through senses and motor activity alone is the sensorimotor stage of infancy."}], "tp": "Concrete operations, 7 to 11: logical, classification, cause-and-effect, still tied to concrete perceptions."});

BANK.push({"cat": CB, "type": "single", "stem": "A toddler says up to be picked up, using one word for a whole message. Which term fits?", "opts": [{"t": "Holophrase, a one-word sentence used at one to two years to convey a complete message here", "c": true, "r": "Correct. Holophrases are one-word sentences such as up that carry a complete message at ages 1 to 2."}, {"t": "Telegraphic speech, a two-word phrase that omits articles and pronouns, such as mommy milk", "c": false, "r": "Incorrect. Telegraphic speech is two-word phrases; a single word carrying a message is a holophrase."}, {"t": "Egocentrism, a way of thinking in which the world is seen only from the child's own viewpoint", "c": false, "r": "Incorrect. Egocentrism is a thinking pattern of the preoperational stage, not a one-word utterance."}, {"t": "Jargon, the unintelligible babbling speech that peaks in an infant at about eighteen months", "c": false, "r": "Incorrect. Jargon is unintelligible; this single word carries a clear, complete intended message."}], "tp": "Holophrase = one word, whole message. Telegraphic speech = two-word phrases with small words omitted.", "kt": ["Holophrase", "Telegraphic speech"]});

var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */

function startTest() {
  var ms = document.getElementsByName("mode"), i;

  S.shuf = $("shf").checked;

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {

  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");

    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {

      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }

    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {

      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
