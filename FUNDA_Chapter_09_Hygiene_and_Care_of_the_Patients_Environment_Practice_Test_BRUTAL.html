 CB: {

 },
 CC: {

 },
 CF: {

   "multi": 1,
   "order": 1
  }
 }
};

BANK.push({ cat: CA, type: "single", kt: ["Personal hygiene"],
  stem: "A nurse enters to give a morning bath and the patient, a recent immigrant, quietly says she bathes fully once a week at home and feels uneasy being bathed by someone else. Which action should the nurse take first?",
  opts: [ O("Ask what would make her most comfortable during the bath today", true, "Correct. Framework: Maslow, psychosocial needs with cultural safety. Preferences and cultural practices are assessed first, and patients are asked what makes them comfortable during a bath."), O("Explain that daily bathing is the unit routine for every patient", false, "Imposing the routine ignores cultural variables and the rule against being judgmental about different practices."), O("Document the refusal and return at the evening care round instead", false, "Recording a refusal without exploring comfort skips the assessment that bathing care begins with."), O("Ask the family to persuade her that daily bathing is healthier", false, "Recruiting family pressure overrides the patient's own preferences, which change only if health is jeopardized.") ],
  tp: "Cultural variables shape hygiene; ask what makes the patient comfortable and never convey disapproval." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "During a bed bath a nurse notices the patient wincing, has new bruising on one forearm, and seems withdrawn compared with yesterday. Why does the chapter treat bath time as assessment time?",
  opts: [ O("Close contact lets the nurse assess body systems and emotional state", true, "Correct. Framework: Nursing Process, assessment. Bathing involves close contact and lets the nurse assess physical and emotional state, all body systems, and self-care ability."), O("Bathing is the only time a nurse may legally observe the skin", false, "Skin is assessed at every bath, but observation is not restricted to bath time."), O("The bath replaces the need for a separate head-to-toe assessment", false, "Bath findings feed the assessment; they do not cancel other scheduled assessments."), O("Findings during a bath are documented only if the patient reports them", false, "The nurse's own observations during care are assessment data whether reported or not.") ],
  tp: "Every hygiene task is an assessment in disguise: skin, systems, emotional state, and self-care ability." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A nurse with chipped polish, dangling earrings, and artificial nails is assigned to bathe a newborn-adjacent postpartum patient. Which correction is required before care?",
  opts: [ O("Remove the artificial nails and chipped polish and secure small earrings only", true, "Correct. Framework: safety first. Pathogens trapped under artificial nails can cause serious infections, especially in newborns; chipped polish is removed and only small unobtrusive earrings are worn."), O("Perform extra hand hygiene and keep the nails because care is brief", false, "Hand hygiene does not remove the reservoir under artificial nails; they are prohibited in most facilities."), O("Wear gloves for the entire shift so the nails are never exposed", false, "Gloves do not make prohibited nail coverings acceptable for patient care."), O("Remove only the earrings, because jewelry is the sole concern listed", false, "Earrings are part of it, but nails and chipped polish are the infection risks named in Box 9.3.") ],
  tp: "Box 9.3: nails short and clean, no artificial nails or coverings, polish removed when it chips, one pair of small earrings." });

BANK.push({ cat: CA, type: "multi", kt: [],
  stem: "A patient who values modesty tells the nurse she dreads perineal care. Which actions reflect the chapter's cultural guidance on touch? Select all that apply.",
  opts: [ O("Ask the patient what makes her most comfortable during the care", true, "Correct. The chapter directs nurses to ask patients what makes them most comfortable during a bath."), O("Stay within the rules of touch that are culturally defined here", true, "Correct. Touch rules are culturally defined, and care stays within them."), O("Use touch with discernment and watch the patient's reaction to it", true, "Correct. The nurse is mindful of reactions and avoids being perceived as intrusive."), O("Explain that clinical routines override personal feelings about touch", false, "Forcing touch and dismissing beliefs conflicts with the chapter's guidance."), O("Assign the care without discussion so the patient worries less", false, "Silence avoids nothing; preferences are asked about and honored where health allows.") ],
  tp: "Individual preferences usually fit into care without harming health; forcing touch helps no one." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Two call lights activate together: a bedside light glowing steadily and a bathroom light flashing rapidly. The patient in the bathroom was ambulating to the toilet after a sitz bath. Which call should the nurse answer first?",
  opts: [ O("The flashing bathroom call, because it signals a more serious need", true, "Correct. Framework: safety first, stable vs unstable. The bathroom call light flashes off and on quickly to denote a call of a more serious nature, while the bedside light typically does not flash."), O("The steady bedside call, because it was likely pressed first today", false, "Order of pressing does not set priority; the flashing signal carries the higher acuity."), O("Neither call yet, because both patients were stable at last rounds", false, "A flashing bathroom call after ambulation can mean a fall or syncope; delay is unsafe."), O("The bedside call, because bathroom calls are usually routine needs", false, "The chapter assigns the bathroom flashing call the more serious meaning, not a routine one.") ],
  tp: "Answer calls as soon as possible, and triage the flashing bathroom call ahead of a steady bedside call." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A patient with a fractured pelvis is found sitting at the edge of the bed with both side rails fully raised on the long-term care unit, calling it being locked in. Which statement guides the nurse's response?",
  opts: [ O("Full side rails count as a restraint form in long-term care settings", true, "Correct. Framework: least restrictive. Full side rails are considered a form of restraint in long-term care, so their use follows restraint considerations rather than routine habit."), O("Side rails are protective devices and can never act as restraints", false, "The chapter states the opposite for full rails in long-term care."), O("Rails become restraints only when the patient asks to get up", false, "The classification does not depend on whether the patient has asked to rise."), O("Raising all rails is required whenever a patient sits at the edge", false, "Rails aid positioning and exit support; blanket full-rail use is not the rule.") ],
  tp: "Never leave the bedside while a rail is lowered, and teach the patient to leave the bed at its lowest level." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A patient with chronic pulmonary disease is restless in a warm room at 78 degrees while an older, acutely ill roommate is shivering under one blanket. Which action best fits the chapter's comfort factors?",
  opts: [ O("Lower the room toward the cooler end and warm the older patient with covers", true, "Correct. Framework: Maslow, physiologic comfort. The recommended range is 68 to 74 degrees; patients with chronic pulmonary problems prefer cooler air, while older and acutely ill patients need more warmth."), O("Raise the room temperature until the older patient stops shivering today", false, "Heating the whole room worsens the pulmonary patient's comfort; individual warming is the adjustment."), O("Move the pulmonary patient next to the window draft for cooler air", false, "Ventilation matters, but patients are protected from drafts rather than placed in them."), O("Leave the temperature, because room settings cannot be changed per patient", false, "Temperature, ventilation, noise, and odors are factors the nurse actively controls.") ],
  tp: "Room temperature 68 to 74 degrees Fahrenheit; infants, older adults, and the acutely ill need warmer conditions." });

BANK.push({ cat: CB, type: "single", kt: ["Semi-Fowler's position"],
  stem: "A patient recovering from a lumbar puncture this morning asks to sit fully upright to eat lunch. The provider's note says the patient cannot tolerate high positions. Which position should the nurse set?",
  opts: [ O("Semi-Fowler position with the head raised about 30 degrees", true, "Correct. Framework: safety first. Semi-Fowler at approximately 30 degrees is used for patients who cannot tolerate Fowler or high Fowler, and is sometimes ordered after lumbar puncture."), O("High Fowler position with the head raised a full 90 degrees", false, "A full upright position is exactly what this patient cannot tolerate."), O("Trendelenburg position with the whole bed tilted head-down", false, "A head-down tilt serves drainage or venous return, not post-puncture eating."), O("Flat position with the frame parallel to the floor for eating", false, "Flat is used for vertebral injuries and immediately after lumbar puncture, but eating flat risks aspiration; semi-Fowler is the tolerated eating compromise here.") ],
  tp: "Fowler and high Fowler aid eating and lung expansion; semi-Fowler is the fallback when those are not tolerated." });

BANK.push({ cat: CB, type: "order", kt: [],
  stem: "A nurse is preparing a room for a newly admitted patient. Place the actions in the correct order.",
  items: [ { t: "Set the bed at its lowest level and lock the wheels before the patient arrives", r: "Correct first step. A low, locked bed prevents falls and unwanted bed movement at transfer." }, { t: "Place the call light within the patient's reach and teach its use", r: "Correct second step. The patient must be able to summon help from the moment of arrival." }, { t: "Store hygiene supplies and personal articles in the bedside stand", r: "Correct third step. The bedside stand holds basins, towels, toothbrush, and personal articles." }, { t: "Clean the overbed table surface before the first meal tray arrives", r: "Correct fourth step. The tabletop is cleaned before meals and before and after procedures." } ],
  tp: "Room setup order: safe bed first, then call access, then supplies, then a clean eating and work surface. Framework: safety first." });

BANK.push({ cat: CB, type: "matrix", kt: [],
  stem: "For each patient need, select the bed position from Table 9.1 that matches it.",
  cols: ["Fowler or high Fowler", "Semi-Fowler", "Flat"],
  rows: [ { t: "Eating a meal while preventing aspiration during swallowing", a: 0, r: "Fowler to high Fowler is the eating position listed for aspiration prevention." }, { t: "Resting after a lumbar puncture when high positions are not tolerated", a: 1, r: "Semi-Fowler at about 30 degrees is sometimes ordered after lumbar puncture." }, { t: "Lying with a vertebral injury awaiting further provider orders", a: 2, r: "The flat position is used for vertebral injuries and in cervical traction." }, { t: "Performing breathing exercises to promote full lung expansion", a: 0, r: "Fowler positions benefit breathing exercises by promoting full lung expansion." } ],
  tp: "Table 9.1 positions are chosen by purpose: aspiration and lungs, puncture tolerance, or spinal protection." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "An 84-year-old patient with diabetes and reduced sensation in the hands is scheduled for a tub bath. The water tests at 118 degrees Fahrenheit. Which action should the nurse take first?",
  opts: [ O("Cool the water to the ordered tub range before the patient enters", true, "Correct. Framework: safety first. Impaired circulation or neurologic change can blunt an older patient's temperature sensing, so the nurse verifies safe water, about 109.4 degrees for a tub bath, before immersion."), O("Let the patient test the water, since adults judge heat accurately", false, "This patient's sensation is reduced; self-testing is exactly the safeguard that fails here."), O("Add bath oil to protect the skin, then help the patient step in", false, "Bath oil is discouraged for safety, and it does nothing about water that is too hot."), O("Shorten the soak to five minutes so the hot water matters less", false, "Shortening time does not make overly hot water safe for insensate skin.") ],
  tp: "Older adults: warmer room, minimal drafts, careful draping, and nurse-checked water temperatures." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "During a bed bath, a nurse reaches the legs of a patient with a history of deep vein thrombosis. Which technique is required for this patient's lower extremities?",
  opts: [ O("Use circular, gentle strokes and do not massage the legs at all", true, "Correct. Framework: safety first. Long firm strokes are contraindicated with DVT or hypercoagulation; gentle circular strokes are used so the clot is not dislodged, and legs are never massaged."), O("Use long, firm strokes to promote circulation in the affected leg", false, "Long firm strokes are the contraindicated technique for this history."), O("Massage the calf firmly to check for tenderness before washing it", false, "Massage can move a clot and cause an embolus; it is never done on lower extremities."), O("Skip washing the legs entirely until the provider clears the bath", false, "The bath continues with the modified gentle technique; it is not cancelled.") ],
  tp: "Never massage lower extremities: massage can dislodge a clot and cause a possible embolus." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "A patient with an IV infusing in the left arm needs a gown change before a complete bed bath. Which sequence is correct?",
  opts: [ O("Remove the gown from the right arm first, then lower the IV bag over the left", true, "Correct. Framework: safety first. The gown comes off the unaffected side first; then the container is lowered and the gown slides over the affected arm, tubing, and container without disconnecting."), O("Remove the gown from the left arm first so the IV site is freed early", false, "Starting on the IV side risks pulling the tubing; the unaffected side goes first."), O("Disconnect the tubing briefly, change the gown, then reconnect it", false, "The tubing is not disconnected for a gown change."), O("Cut the gown sleeve off the left arm to avoid moving the IV bag", false, "Cutting clothing is unnecessary; lowering the bag and sliding the gown works.") ],
  tp: "After the gown change, rehang the container or reset the pump and check the flow rate." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "A febrile patient at 103.4 degrees Fahrenheit is ordered a tepid sponge bath. Twenty minutes in, the temperature reads 99.4 degrees and the patient begins shivering under uncovered skin. Which action is correct?",
  opts: [ O("Cover unsponged parts and stop once temperature sits slightly above normal", true, "Correct. Framework: Nursing Process, evaluation. Unsponged parts stay covered because shivering raises heat production, and the bath continues only until temperature falls to slightly above normal."), O("Switch to cold water so the temperature falls faster from here", false, "Cold water causes chilling and shivering; tepid water at 98.6 degrees is specified."), O("Continue until the temperature reaches 97 degrees for a full effect", false, "The bath stops at slightly above normal because temperature keeps dropping afterward on its own."), O("Move the wet cloths from the axilla and groin to the forehead only", false, "Cloths belong at the axilla and groin where vessels lie close to the surface.") ],
  tp: "Tepid sponge bath: reassess temperature and pulse every 15 minutes and refresh cloths at axilla and groin." });

BANK.push({ cat: CC, type: "single", kt: ["Sitz bath"],
  stem: "A patient returns from perineal surgery and is ordered sitz baths three times daily. Midway through the first bath the patient reports dizziness, with a rapid, weak pulse. Which action should the nurse take first?",
  opts: [ O("Help the patient out safely, keep the call light in reach, and monitor closely", true, "Correct. Framework: ABCs and safety first. Rapid or weak pulse, tachypnea, vertigo, and syncope are the sitz bath warning signs; the patient is never left unsafe and is observed for weakness."), O("Add hotter water to the basin so the treatment finishes sooner", false, "Raising heat worsens vasodilation symptoms in a patient already dizzy with a weak pulse."), O("Leave briefly to chart the first bath while the patient recovers", false, "A symptomatic patient is never left alone unless safe; the call light stays within reach."), O("Encourage the patient to stand and walk back to bed unassisted", false, "A patient reporting vertigo after a sitz bath needs assistance, not unassisted ambulation.") ],
  tp: "Sitz bath: 20 to 30 minutes, water concentrated in the perineal area, legs and shoulders covered against chilling." });

BANK.push({ cat: CC, type: "multi", kt: [],
  stem: "Which actions are required safety checks for a patient taking a tub bath? Select all that apply.",
  opts: [ O("Check on the patient every five minutes while the bath continues", true, "Correct. The printed rule is to check the patient every 5 minutes."), O("Limit the time in the tub to no more than twenty minutes total", true, "Correct. Patients are not allowed to remain in the tub more than 20 minutes."), O("Place a nonskid mat on the tub floor and a disposable mat outside", true, "Correct. Both mats are part of tub and shower setup for fall prevention."), O("Teach the patient the call signal and the use of safety bars", true, "Correct. Call signal and safety bar instruction are printed steps."), O("Add bath oil to the water to keep the skin from drying out", false, "Use of bath oil in the water is discouraged for safety.") ],
  tp: "Watch for vertigo and syncope; assist back to bed if the patient reports weakness, diaphoresis, or unsteady gait." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "An older adult patient in long-term care has dry, flaky skin and asks for a long hot bath with strong detergent soap every morning. Which response best fits the chapter?",
  opts: [ O("Individualize bath type, frequency, and soap, and rehydrate skin with lotions", true, "Correct. Framework: Nursing Process, planning. Too-frequent bathing and detergent soaps harm older skin, so bath type, frequency, and soap follow individual needs, with lotions and fluids for rehydration."), O("Agree, because daily full baths are required for all older adults", false, "Daily complete bathing is not required; North American custom is not a clinical mandate for this skin."), O("Substitute a towel bath daily so the soap question no longer matters", false, "Changing the method does not address frequency, soap choice, or rehydration."), O("Tell the patient bathing will drop to once weekly without discussion", false, "Preferences are discussed and individualized, not imposed in either direction.") ],
  tp: "Aging skin: thinner epidermis, less subcutaneous fat, and drier skin from reduced oil and sweat gland activity." });

BANK.push({ cat: CC, type: "dropdown", kt: [],
  stem: "A nurse is assigning baths on a medical unit. Complete each assignment. [[0]] [[1]]",
  blanks: [ { o: [ O("Complete bed bath for the patient who is totally dependent after surgery", true, "Correct. A complete bed bath is for patients who are totally dependent and require total assistance."), O("Partial bed bath for the patient who is totally dependent after surgery", false, "Partial assistance fits a patient who can bathe many regions alone."), O("Towel bath only for the patient who is totally dependent after surgery", false, "A towel bath is a method option, not the defining assignment for total dependence.") ] }, { o: [ O("Help with feet and back for the patient who bathes most regions alone", true, "Correct. A partial bed bath helps with areas the patient cannot reach, such as feet and back."), O("Full bath by the nurse for the patient who bathes most regions alone", false, "Doing everything removes the self-care independence the chapter protects."), O("No bath at all for the patient who bathes most regions alone", false, "Unreachable areas still need nursing help; the bath is partial, not omitted.") ] } ],
  tp: "Match the bath to capability: total dependence gets a complete bed bath; partial ability gets targeted help." });

function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {

}
function score(i) {

function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
