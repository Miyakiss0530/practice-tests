BANK.push({ cat: CA, type: "single", kt: ["pericarditis","friction rub"], stem: "A patient reports sharp chest pain a few days after a viral illness. On auscultation at the left sternal border near the apex, the nurse hears a scratchy, sandpaper-like sound. Which interpretation is correct?", opts: [
    O("A pericardial friction rub: the inflamed pericardial membranes are rubbing, the signature sound of pericarditis.", true, "Pain plus a friction rub is the chapter's pericarditis pairing, and the listening post (left sternal border near the apex) matches the named address for the sound."),

BANK.push({ cat: CA, type: "single", kt: ["cardiac tamponade"], stem: "A patient with a known pericardial effusion is being monitored on the unit. Which change should the nurse report immediately as progression toward cardiac tamponade?", opts: [
    O("Falling blood pressure with a rising pulse and worsening shortness of breath - the squeezed heart is failing to fill and pump.", true, "Tamponade is a filling failure: the non-stretching sac lets fluid compress the heart until it cannot relax, fill, or eject enough blood - falling output with compensatory racing pulse and breathlessness is the trajectory the chapter describes."),
    O("The friction rub becoming louder and easier to hear over the left sternal border near the apex.", false, "A louder rub means the inflamed membranes are still in contact - uncomfortable, but it is the DISAPPEARANCE of the rub under growing fluid that accompanies the dangerous turn."),
    O("A slow temperature rise from 99.1 degrees to 99.8 degrees over the last 24 hours.", false, "A modest temperature drift does not describe mechanical compression; tamponade announces itself through filling and output, not fever."),
    O("The patient reporting this morning that his chest pain has now completely resolved.", false, "Pain resolution under a growing effusion can mean fluid is separating the membranes - it is not reassurance, and paired with output signs it is part of the danger pattern.")
  ], tp: "ANSWER KEY — Correct answer: Falling blood pressure with a rising pulse and worsening shortness of breath - the squeezed heart is failing to fill and pump.. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });
BANK.push({ cat: CB, type: "single", kt: ["ventricular hypertrophy"], stem: "A patient with chronic hypertension asks why his provider is so insistent on lowering his blood pressure 'for my heart's sake.' Which explanation is correct?", opts: [
    O("High aortic pressure forces his left ventricle to overwork; the muscle hypertrophies, and if the pressure is not lowered the ventricle will eventually weaken and fail as a pump.", true, "The chapter's causal chain in full: pressure load -> harder work -> enlargement -> failure. Lowering the pressure interrupts the chain at its first link."),
    O("Sustained high pressure stretches the wall of the left atrium until it weakens and tears, and lowering the pressure prevents that tear.", false, "The pressure story belongs to the VENTRICLE ejecting into the aorta; atrial tearing is not the chapter's mechanism at all."),
    O("Hypertension makes his coronary arteries constrict and stay constricted permanently, and the prescribed drugs simply reopen them.", false, "Coronary flow problems in this chapter are plaque/spasm stories; the hypertension-heart link taught here is ventricular overwork and hypertrophy."),
    O("Lowering his blood pressure will shrink his heart back to normal, because hypertrophy is just extra fluid stored in the muscle.", false, "Hypertrophy is muscle ENLARGEMENT from work, not edema; the point of pressure control is to stop the progression toward failure, not to drain fluid.")
  ], tp: "ANSWER KEY — Correct answer: High aortic pressure forces his left ventricle to overwork; the muscle hypertrophies, and if the pressure is not lowered the ventricle will eventually weaken and fail as a pump.. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });
BANK.push({ cat: CB, type: "single", kt: ["left atrial appendage"], stem: "A patient with atrial fibrillation is told a small sac in his left atrium may be clipped off during surgery. Which explanation is correct?", opts: [
    O("The left atrial appendage is a site of thrombus formation in atrial fibrillation, so removing it removes a clot source.", true, "The chapter's one appendage fact: function unclear, but it harbors thrombus in AFib and 'therefore is sometimes clipped off surgically' - the explanation is prevention of clot formation at a known site."),
    O("The appendage produces the hormone that causes his irregular rhythm, and clipping stops its secretion.", false, "The appendage secretes no rhythm hormone in this chapter; the rhythm problem is electrical (conduction system), and the clip addresses CLOTS."),

    O("Clipping the appendage widens the mitral valve so more blood can enter the ventricle.", false, "The appendage is a sac in the atrial WALL, unrelated to valve width; mitral narrowing would be stenosis, a different problem entirely.")

BANK.push({ cat: CC, type: "single", kt: ["stenosis"], stem: "A patient is diagnosed with a stenotic aortic valve, and his blood pressure remains uncontrolled. Which chamber outcome should the nurse monitor for?", opts: [
    O("Left ventricular hypertrophy progressing toward failure - the ventricle must force blood through the narrowed valve against high pressure.", true, "Stenosis loads the pumping chamber behind it: for the aortic valve that is the LV, and the chapter names this exact surveillance - hypertrophy then failure, 'especially when blood pressure stays uncontrolled behind a stenotic aortic valve.'"),

  ], tp: "ANSWER KEY — Correct answer: Left ventricular hypertrophy progressing toward failure - the ventricle must force blood through the narrowed valve against high pressure.. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });
BANK.push({ cat: CC, type: "single", kt: ["incompetent valve"], stem: "Echocardiography shows a patient's aortic valve is incompetent. Which statement explains the consequence for his left ventricle?", opts: [
    O("Blood pumped into the aorta leaks back into the left ventricle, so the ventricle must pump the same blood again - extra volume work every beat.", true, "The chapter's worked example: incompetence = regurgitation = re-pumping. The LV's workload rises not from pressure but from handling the same blood twice."),

BANK.push({ cat: CC, type: "single", kt: ["murmur"], stem: "During a routine assessment, a nurse hears a heart sound that was not present at the patient's last visit - a blowing extra sound between the normal lubb-dupp. Which action is most appropriate?", opts: [
    O("Document and report the new murmur - changed heart sounds are the chapter's marker that a valve has become stenotic or incompetent.", true, "Auscultation is the front-line valve assessment in this chapter: 'abnormal heart sounds are called murmurs,' and a NEW one is a reportable change in valve function, not background noise."),

BANK.push({ cat: CC, type: "single", kt: ["S1"], stem: "A student asks the nurse why the 'lubb' is heard best at the apex of the patient's heart. Which explanation is correct?", opts: [
    O("S1 is made by the AV valves closing at the start of ventricular contraction, and the apex is their listening post.", true, "Sound source plus surface anatomy: the AV valves (tricuspid/mitral) close to open the contraction phase, and S1 carries best at the apex; S2 (semilunar closure) carries best at the base."),

BANK.push({ cat: CC, type: "single", kt: ["gallop rhythm"], stem: "A nurse auscultates a patient's heart and hears, in addition to lubb-dupp, two extra sounds that together resemble a galloping horse. Which documentation is correct?", opts: [
    O("Gallop rhythm - both S3 and S4 are present, the extra sounds of rapid blood flow into the ventricles.", true, "The chapter's definition exactly: S3 and S4 are vibrations from rapid ventricular filling, and when BOTH occur the rhythm is called a gallop."),

BANK.push({ cat: CD, type: "single", kt: ["angina"], stem: "A patient with coronary artery disease develops chest pain radiating to his left shoulder and down his left arm whenever he climbs stairs; it eases within minutes when he stops and rests. Which interpretation and action fit?", opts: [
    O("This is angina: plaque-narrowed arteries, already maximally dilated at rest, cannot raise flow for exertion - rest him and report the pattern.", true, "Exertion-on/rest-off is the angina signature: demand rises, the fixed narrowing cannot answer, ischemia hurts (with the chapter's classic left-sided radiation) - and rest relieves it by cutting the muscle's oxygen need."),

BANK.push({ cat: CD, type: "single", kt: ["myocardial infarction"], stem: "A man arrives clutching his fist over his sternum, sweating profusely, nauseated, and describing severe crushing chest pain 'like an elephant sitting on my chest.' Which principle governs the nurse's response?", opts: [

  ], tp: "ANSWER KEY — Correct answer: Time is muscle: a completely blocked coronary artery is killing myocardial cells now, so minimizing time to intervention limits the damage.. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });
BANK.push({ cat: CD, type: "single", kt: ["myocardial infarction"], stem: "An 82-year-old woman tells the nurse she has felt 'just exhausted' for two days with heartburn and an upset stomach. She has no chest pain. Which assessment stance is correct?", opts: [

  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 16: Anatomy of the Heart</h1>';
  h += '<div class="sub">Brutal mode | Herlihy, Anatomy & Physiology | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
