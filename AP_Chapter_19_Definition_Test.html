<script>
/* ============ QUESTION BANK (DEFINITION TEST) ============ */
/* Herlihy Chapter 19: Functions of the Blood Vessels — definition and meaning items. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Blood Pressure Numbers and Measurement";
var CB = "What Determines Blood Pressure";
var CC = "Reflex and Hormonal Control";
var CD = "Capillary Exchange and Edema";
var CE = "Redistribution, Temperature, and Aging";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = ["blood pressure", "systolic pressure", "diastolic pressure", "pulse pressure", "mean arterial blood pressure", "Korotkoff sounds", "cardiac output", "systemic vascular resistance", "vasodilation", "vasoconstriction", "baroreceptor reflex", "baroreceptors", "postural hypotension", "reflex tachycardia", "Valsalva maneuver", "oncotic pressure", "filtration", "diffusion", "edema", "hypervolemia"];
var BLUEPRINT = {"Blood Pressure Numbers and Measurement": {"name": "Blood Pressure Numbers and Measurement", "count": 7, "types": {"single": 6, "multi": 1}}, "What Determines Blood Pressure": {"name": "What Determines Blood Pressure", "count": 6, "types": {"single": 5, "order": 1}}, "Reflex and Hormonal Control": {"name": "Reflex and Hormonal Control", "count": 9, "types": {"single": 7, "multi": 1, "matrix": 1}}, "Capillary Exchange and Edema": {"name": "Capillary Exchange and Edema", "count": 9, "types": {"single": 7, "multi": 1, "dropdown": 1}}, "Redistribution, Temperature, and Aging": {"name": "Redistribution, Temperature, and Aging", "count": 3, "types": {"single": 2, "multi": 1}}};
BANK.push({ cat: CA, type: "single", kt: ["systolic pressure", "diastolic pressure", "pulse pressure"], stem: "A reading is charted as 116/72 mm Hg. Which statement correctly interprets each part of this reading?", opts: [O("The systolic pressure is 116 mm Hg, the diastolic pressure is 72 mm Hg, and the pulse pressure is 44 mm Hg.", true, "All three values follow from the reading: top number is systolic, bottom number is diastolic, and pulse pressure is their difference, 116 minus 72."), O("The systolic pressure is 72 mm Hg, the diastolic pressure is 116 mm Hg, and the pulse pressure is 44 mm Hg.", false, "The numbers are reversed: systole produces the higher pressure, so 116 is systolic and 72 is diastolic."), O("The systolic pressure is 116 mm Hg, the diastolic pressure is 72 mm Hg, and the pulse pressure is 188 mm Hg.", false, "Pulse pressure is a difference, not a sum: 116 minus 72 is 44, whereas 188 comes from adding the two numbers."), O("The systolic pressure is 44 mm Hg, the diastolic pressure is 116 mm Hg, and the pulse pressure is 72 mm Hg.", false, "44 is the calculated pulse pressure, not a measured systolic value, and the measured values keep their positions.")], tp: "One reading carries three values: systolic on top, diastolic on the bottom, and pulse pressure as the gap between them. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CA, type: "single", kt: ["mean arterial blood pressure"], stem: "Which formula correctly gives the mean arterial blood pressure (MABP) for any reading?", opts: [O("Two-thirds of the diastolic pressure plus one-third of the systolic pressure for that reading.", true, "MABP weights diastole twice because the organs are perfused during the longer diastolic phase; the formula is 2/3 diastolic plus 1/3 systolic."), O("One-half of the diastolic pressure plus one-half of the systolic pressure for that reading.", false, "A simple average weights the two phases equally, which is not how the chapter calculates MABP."), O("Two-thirds of the systolic pressure plus one-third of the diastolic pressure for that reading.", false, "The larger weight belongs to diastole, not systole; this version reverses the two fractions."), O("The systolic pressure minus the diastolic pressure, divided by the pulse pressure of the reading.", false, "Systolic minus diastolic gives pulse pressure itself; dividing it by pulse pressure cannot give MABP.")], tp: "MABP = 2/3 diastolic + 1/3 systolic — diastole carries the double weight. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CA, type: "single", kt: ["mean arterial blood pressure"], stem: "A client's blood pressure is 120/80 mm Hg. What is the mean arterial blood pressure?", opts: [O("94 mm Hg, from two-thirds of 80 plus one-third of 120.", true, "Two-thirds of 80 is about 53 and one-third of 120 is 40; together they give about 94 mm Hg, the chapter's worked value."), O("100 mm Hg, from one-half of 80 plus one-half of 120.", false, "100 is the simple average of the two numbers; MABP weights diastole more heavily than systole."), O("40 mm Hg, from 120 minus 80 divided by one whole unit.", false, "40 mm Hg is the pulse pressure for this reading, not the mean arterial pressure."), O("107 mm Hg, from two-thirds of 120 plus one-third of 80.", false, "This applies the double weight to systole; the double weight belongs to the diastolic value.")], tp: "For 120/80, MABP is 94 mm Hg — the value the organs actually feel. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CA, type: "single", kt: ["Korotkoff sounds"], stem: "During cuff deflation, the nurse hears the first soft tapping sounds at 116 mm Hg and the sounds disappear at 72 mm Hg. What do these two points represent?", opts: [O("The first sound marks systolic pressure and the disappearance of sound marks diastolic pressure.", true, "Korotkoff sounds begin when blood first spurts through the partly opened artery (systolic) and end when flow is fully open again (diastolic)."), O("The first sound marks diastolic pressure and the disappearance of sound marks systolic pressure.", false, "The order is reversed: the higher systolic value is always reached first as cuff pressure falls."), O("The first sound marks pulse pressure and the disappearance of sound marks mean arterial pressure.", false, "Neither point is a calculated value; both are pressures read directly from the gauge during deflation."), O("The first sound marks venous pressure and the disappearance of sound marks capillary pressure.", false, "The cuff is placed over the brachial artery, so both points describe arterial pressure, not venous or capillary pressure.")], tp: "First tap = systolic; sounds gone = diastolic. The sounds themselves are the Korotkoff sounds. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CA, type: "single", kt: ["blood pressure"], stem: "Which statement correctly describes normal blood pressure values in the chapter?", opts: [O("A normal adult reading is a systolic pressure below 120 mm Hg with a diastolic pressure below 80 mm Hg.", true, "The chapter sets normal adult pressure at less than 120 systolic and less than 80 diastolic."), O("A normal adult reading is a systolic pressure below 140 mm Hg with a diastolic pressure below 100 mm Hg.", false, "Those cutoffs are higher than the chapter's normal limits of less than 120 and less than 80."), O("A normal adult reading is the same 95/65 mm Hg value the chapter gives for a healthy 2-year-old child.", false, "95/65 is the chapter's normal value for a 2-year-old; adult and child normals are not the same."), O("A normal adult reading requires a systolic pressure above 120 mm Hg to keep the organs well perfused.", false, "Normal is below, not above, 120 systolic; higher resting values move the person away from normotensive.")], tp: "Adult normal: under 120 over under 80. Child normal in the chapter: 95/65 at age 2. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CA, type: "single", kt: ["blood pressure"], stem: "Which statement about pressure in different vessels is correct?", opts: [O("Pressure is highest in the aorta, falls across the arterioles and capillaries, and is near 0 mm Hg in large veins.", true, "Pressure declines steadily from the aorta through the smaller vessels, reaching about 0 mm Hg in the large veins, and that gradient drives flow."), O("Pressure is highest in the large veins, falls in the capillaries, and is near 0 mm Hg inside the aorta.", false, "This reverses the gradient: the aorta, closest to the left ventricle, holds the highest pressure."), O("Pressure stays at 116/72 mm Hg in every vessel, so the same normal value applies to capillaries and veins.", false, "116/72 is normal only for large arteries; capillary pressure is much lower and venous pressure is near zero."), O("Pressure rises as blood moves from the arteries into the capillaries, which is what pushes blood forward.", false, "Blood flows because pressure falls from the arterial side to the venous side, not because it rises.")], tp: "Highest in the aorta, about zero in the large veins — the falling gradient is what moves the blood. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CA, type: "multi", kt: ["blood pressure"], stem: "A nurse is preparing to measure a client's blood pressure accurately. Which actions follow the chapter's measurement guidance? Select all that apply.", opts: [O("Use a cuff that is the proper size for the client's arm.", true, "Proper cuff size is one of the chapter's stated requirements for an accurate recording."), O("Position the client sitting with the feet on the floor.", true, "The chapter specifies a seated position with feet on the floor during the recording."), O("Keep the client from talking while the reading is taken.", true, "The chapter states the person should not be talking during the measurement."), O("Base a new diagnosis on this one single recorded reading.", false, "The chapter is explicit: diagnosis and treatment are never based on a single blood pressure recording."), O("Repeat the reading later if the first value seems unusually high.", true, "The chapter advises recording the pressure a second or third time after the patient has relaxed, guarding against white coat hypertension.")], tp: "Accurate technique: right cuff, seated, feet down, no talking, and never diagnose from one reading. [Framework: Safety First]" });
BANK.push({ cat: CB, type: "single", kt: ["cardiac output", "systemic vascular resistance"], stem: "Which equation correctly states what determines blood pressure?", opts: [O("Blood pressure equals cardiac output multiplied by systemic vascular resistance.", true, "The chapter's central equation: pressure is the product of the heart-side output and the vessel-side resistance."), O("Blood pressure equals cardiac output divided by systemic vascular resistance.", false, "The relationship is a product, not a quotient; dividing would predict pressure falls as resistance rises."), O("Blood pressure equals heart rate multiplied by systemic vascular resistance alone.", false, "Heart rate is only one part of cardiac output; stroke volume must also be included through cardiac output."), O("Blood pressure equals stroke volume divided by the total length of the blood vessels.", false, "Vessel length is normally ignored in resistance, and stroke volume alone is not the equation's first term.")], tp: "Blood pressure = cardiac output x systemic vascular resistance. Every other topic in the chapter hangs on this equation. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CB, type: "single", kt: ["cardiac output"], stem: "Which change would be expected to raise cardiac output and therefore raise blood pressure?", opts: [O("A faster heart rate together with a stronger force of myocardial contraction.", true, "Faster rate raises output directly, and stronger contraction raises stroke volume; both raise cardiac output and pressure."), O("A slower heart rate together with a weaker force of myocardial contraction.", false, "Both changes lower cardiac output, so pressure would fall rather than rise."), O("A faster heart rate together with a much smaller volume ejected at each beat.", false, "The fall in stroke volume works against the faster rate, so this pairing does not reliably raise output."), O("A slower heart rate together with no change at all in the volume ejected per beat.", false, "A slower rate with unchanged stroke volume lowers cardiac output and lowers pressure.")], tp: "Cardiac output rises when rate rises or contraction strengthens — and pressure follows output. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CB, type: "single", kt: ["systemic vascular resistance"], stem: "In the chapter's garden-hose analogy, what do the nozzle and the hose represent?", opts: [O("The nozzle represents the arterioles and the hose represents the larger blood vessels.", true, "Arterioles act as nozzles that set resistance, while the large vessels correspond to the hose behind them."), O("The nozzle represents the large veins and the hose represents the smallest capillaries.", false, "Veins sit at the near-zero end of the gradient and capillaries are exchange vessels, not the resistance nozzles."), O("The nozzle represents the left ventricle and the hose represents the aorta leaving the heart.", false, "The ventricle is the pump in this system; the analogy assigns the nozzle role to the arterioles."), O("The nozzle represents the capillary pores and the hose represents the lymphatic vessels.", false, "Capillary pores belong to filtration, and lymph vessels return leftover fluid; neither is the hose-and-nozzle pair.")], tp: "Hose = large vessels; nozzle = arterioles. Resistance lives in the arterioles. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CB, type: "single", kt: ["vasodilation", "vasoconstriction"], stem: "Which pair of definitions correctly contrasts vasodilation and vasoconstriction?", opts: [O("Vasodilation is arteriolar muscle relaxing to widen the vessel; vasoconstriction is that muscle contracting to narrow it.", true, "Relaxation widens diameter and lowers resistance and pressure; contraction narrows diameter and raises resistance and pressure."), O("Vasodilation is arteriolar muscle contracting to narrow the vessel; vasoconstriction is that muscle relaxing to widen it.", false, "The two definitions are swapped: dilation widens, constriction narrows."), O("Vasodilation is widening of the large veins only; vasoconstriction is narrowing of the capillary pores only.", false, "Resistance is set by arteriolar smooth muscle, not by veins or capillary pores."), O("Vasodilation is a rise in blood volume over days; vasoconstriction is a fall in blood volume over days.", false, "Volume changes belong to the slow hormonal mechanisms, not to these two vessel-diameter terms.")], tp: "Dilation = relax, widen, pressure down. Constriction = contract, narrow, pressure up. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CB, type: "single", kt: ["systemic vascular resistance"], stem: "According to the chapter's obesity discussion, why does excess fat tissue raise blood pressure?", opts: [O("Extra fat adds miles of new vessels and secretes hormones that constrict vessels, raising resistance.", true, "Both effects raise systemic vascular resistance: greater total vessel length and fat-secreted constricting hormones."), O("Extra fat lowers systemic vascular resistance, and the heart raises pressure to compensate for the fall.", false, "Fat raises, not lowers, resistance through added vessel length and constricting hormones."), O("Extra fat blocks the baroreceptors in the carotid sinus so the medulla can no longer sense pressure.", false, "The chapter does not describe fat blocking receptors; its mechanism runs through vessel length and hormones."), O("Extra fat removes plasma proteins from the blood, lowering oncotic pressure throughout the circulation.", false, "Protein loss describes nephrotic syndrome and edema, not the chapter's obesity mechanism for hypertension.")], tp: "Obesity raises SVR two ways — more vessel miles and constricting hormones — so the chapter's prescription is weight loss. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CC, type: "single", kt: ["baroreceptors"], stem: "Which description of the baroreceptors is correct?", opts: [O("They are pressure receptors in the walls of the aortic arch and the carotid sinus.", true, "Baroreceptors sit in the aortic arch and carotid sinus walls and sense sudden changes in blood pressure."), O("They are pressure receptors in the walls of the vena cava and the right atrium only.", false, "The chapter places them in the aortic arch and carotid sinus, on the high-pressure arterial side."), O("They are stretch receptors inside the capillary walls of the skeletal muscles.", false, "Capillaries are exchange vessels; the pressure receptors of this reflex are in the aorta and carotid sinus."), O("They are hormone receptors on the arterioles that respond to aldosterone levels.", false, "Baroreceptors are mechanical pressure sensors feeding a nerve reflex, not hormone receptors.")], tp: "Baroreceptors live in the aortic arch and carotid sinus and sense sudden pressure change. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CC, type: "single", kt: ["baroreceptor reflex"], stem: "Sensory information from activated baroreceptors reaches the brain by which route?", opts: [O("Along cranial nerves IX (glossopharyngeal) and X (vagus) to the medulla oblongata.", true, "The afferent arm of the reflex travels on CN IX and CN X into the medulla oblongata of the brain stem."), O("Along cranial nerves V (trigeminal) and VII (facial) to the medulla oblongata.", false, "CN V and CN VII are not the reflex's sensory route; the chapter names CN IX and CN X."), O("Along the spinal accessory nerve directly to the heart and the arterioles.", false, "That describes a motor route out, not the sensory route in, and the spinal accessory nerve is not named."), O("Through the bloodstream, carried by epinephrine released from the adrenal medulla.", false, "Epinephrine prolongs the response hormonally; the sensory message itself travels by nerve, on CN IX and X.")], tp: "In on IX and X, interpreted in the medulla, out on autonomic motor nerves. [Framework: Nursing Process/ADPIE]" });
BANK.push({ cat: CC, type: "single", kt: ["baroreceptor reflex"], stem: "When blood pressure suddenly falls, which response does the baroreceptor reflex produce?", opts: [O("Sympathetic activation that speeds the SA node, strengthens contraction, and constricts the arterioles.", true, "Sympathetic firing raises heart rate and stroke volume and adds vasoconstriction, raising both output and resistance."), O("Parasympathetic activation that slows the SA node, weakens contraction, and dilates the arterioles.", false, "That vagal pattern is the answer to a pressure rise, not a pressure fall."), O("Sympathetic activation that slows the SA node while the parasympathetic nerves dilate the vessels.", false, "A falling pressure calls for a faster rate and narrower vessels, the opposite of both halves here."), O("No autonomic response at all, because the reflex only reacts when blood pressure rises too high.", false, "The reflex works in both directions; hemorrhage is the chapter's example of the falling-pressure response.")], tp: "Pressure down = sympathetic up: faster, stronger, tighter. Pressure up = vagal. Do not swap them. [Framework: Acute vs Chronic]" });
BANK.push({ cat: CC, type: "single", kt: ["baroreceptor reflex", "vasodilation"], stem: "When blood pressure suddenly rises, why do the blood vessels dilate?", opts: [O("Sympathetic firing to the vessels becomes less active while the vagal discharge slows the heart.", true, "Vessels hold no parasympathetic nerves; their dilation in this response comes from reduced sympathetic activity."), O("Parasympathetic nerves running to the vessels directly order the arteriolar muscle to relax.", false, "The chapter is explicit that blood vessels do not contain parasympathetic nerves."), O("The baroreceptors release a hormone into the blood that forces every arteriole to widen.", false, "Baroreceptors send nerve signals; the dilation here follows reduced sympathetic firing, not a receptor hormone."), O("Rising pressure physically stretches the arterioles open until the vessel walls finally rupture.", false, "Stretching to rupture describes damage from hypertension, not the reflex's controlled dilation.")], tp: "High-pressure dilation = sympathetic letting go, not parasympathetic pushing — vessels have no parasympathetic supply. [Framework: Nursing Process/ADPIE]" });

  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
