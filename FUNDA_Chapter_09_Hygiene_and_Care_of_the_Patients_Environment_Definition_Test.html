BANK.push({ cat: CA, type: "single", kt: ["Personal hygiene"],
  stem: "Which statement most accurately describes personal hygiene?",
  opts: [ O("Self-care measures people use to maintain health and prevent disease", true, "Correct. That is the chapter wording for personal hygiene."), O("Care the nurse performs only when a patient is totally dependent", false, "Hygiene includes the patient's own self-care; dependence only changes who helps."), O("A set of tasks scheduled once daily for every hospital patient", false, "Hygiene care is scheduled at four times of day and adjusted to the patient."), O("Techniques used only to cleanse the skin, hair, and perineal area", false, "Hygiene also covers hands, feet, eyes, ears, nose, mouth, back rub, and bedmaking.") ],
  tp: "Personal hygiene = self-care measures used to maintain health and prevent disease." });

BANK.push({ cat: CA, type: "single", kt: ["Medical asepsis"],
  stem: "Medical asepsis is best described as which of the following?",
  opts: [ O("Clean technique that inhibits growth and spread of pathogens", true, "Correct. Medical asepsis is clean technique aimed at pathogenic microorganisms."), O("Sterile technique that removes every microorganism present", false, "That describes surgical asepsis; medical asepsis inhibits growth and spread."), O("Hand hygiene performed only before invasive procedures begin", false, "Clean technique runs through all hygienic practices, not one procedure moment."), O("Isolation used for patients known to carry infectious disease", false, "Isolation precautions are separate; asepsis here is routine clean technique.") ],
  tp: "Hygienic practices promote medical asepsis, also called clean technique." });

BANK.push({ cat: CA, type: "multi", kt: [],
  stem: "Which factors influence a patient's personal hygiene practices? Select all that apply.",
  opts: [ O("Body image and the patient's concept of physical appearance", true, "Correct. Box 9.1 lists body image as an influencing factor."), O("Cultural variables and the practices of the patient's group", true, "Correct. Cultural variables shape bathing and hygiene practices."), O("Personal preferences about when to bathe, shave, and shampoo", true, "Correct. Individual preferences are a listed influencing factor."), O("Socioeconomic status and the resources available to the patient", true, "Correct. Economic resources influence the type and extent of hygiene resources used."), O("The nurse's preferred routine for the unit's morning schedule", false, "The nurse's preference is not a patient factor in Box 9.1; patient choice guides timing.") ],
  tp: "Box 9.1: body image, social practice, socioeconomic status, personal preferences, knowledge, physical condition, cultural variables." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A patient from a culture that bathes completely once a week declines a daily bath. Which statement reflects the chapter's guidance?",
  opts: [ O("Individual preferences usually fit into care without harming health", true, "Correct. Preferences generally do not affect health significantly and fit into nursing care."), O("Daily bathing is required regardless of the patient's usual practice", false, "The chapter warns against being judgmental about different hygienic practices."), O("The patient's practice shows a knowledge deficit needing correction", false, "A different cultural practice is not automatically a knowledge deficit."), O("The nurse should document the patient as noncompliant with hygiene", false, "Declining a bath that conflicts with custom is a preference, not noncompliance.") ],
  tp: "Avoid being judgmental; change preferences only when health needs are jeopardized." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which statement about touch during hygiene care is accurate?",
  opts: [ O("Cultural uses of touch are usually unspoken and learned behavior", true, "Correct. Touch rules are culturally defined, unspoken, and learned."), O("A back rub is a neutral act that comforts patients in all cultures", false, "North Americans may feel uneasy during a back rub; touch is not neutral everywhere."), O("Perineal care carries no special cultural meaning for any patient", false, "Some Chinese Americans view tasks such as perineal care as unclean."), O("Touch should be applied the same way to every patient for fairness", false, "The nurse stays within culturally defined rules and asks what is comfortable.") ],
  tp: "Use touch with discernment; ask patients what makes them most comfortable during a bath." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which nurse appearance item is prohibited in most facilities because pathogens collect beneath it?",
  opts: [ O("Artificial nails and nail coverings worn during patient care", true, "Correct. Pathogens trapped under artificial nails can cause serious infections, especially in newborns."), O("A plain wedding band without stones worn on the ring finger", false, "A plain engagement or wedding ring without stones is permitted."), O("One pair of small, unobtrusive earrings worn in the ears", false, "One pair of small unobtrusive earrings is permitted by Box 9.3."), O("Hair pulled back off the collar in a contained hairstyle", false, "Contained hair off the collar is required, not prohibited.") ],
  tp: "Box 9.3: keep nails short and clean; artificial nails and coverings are prohibited in most facilities." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which statement about rings for nursing personnel is accurate?",
  opts: [ O("Only a plain engagement or wedding ring without stones is worn", true, "Correct. Stones harbor microorganisms; in operating and delivery rooms rings are not worn at all."), O("Any ring is acceptable if hand hygiene is performed carefully", false, "Stones harbor microorganisms regardless of hand hygiene technique."), O("Rings with small stones are allowed outside procedural areas", false, "The rule is rings without stones; procedural areas remove rings entirely."), O("Wedding rings must be removed for every routine patient contact", false, "A plain band may be worn generally; removal applies to areas such as operating and delivery rooms.") ],
  tp: "Stones harbor microorganisms — plain band only, and no rings at all in operating or delivery rooms." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Complete morning care is best described as which set of tasks?",
  opts: [ O("Bath or shower, oral, foot, nail and hair care, back rub, gown and linen change", true, "Correct. That is the printed content of morning, or complete a.m., care."), O("Bedpan or urinal, washing hands and face, and help with oral care only", false, "That shorter list is early morning care, before breakfast or tests."), O("Washing hands and face, oral care, bedpan, and straightening bed linen", false, "That list matches afternoon care, not the complete morning round."), O("Changing soiled linen, washing face and hands, oral care, back massage", false, "That evening set is HS care, given to help the patient relax for sleep.") ],
  tp: "Morning care after breakfast is the complete round: bath, oral/foot/nail/hair care, back rub, clean gown and linens." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Evening, or HS, care is defined by which purpose and timing?",
  opts: [ O("Care before bedtime that helps the patient relax and promotes sleep", true, "Correct. HS care is hour-of-sleep care aimed at relaxation."), O("Care on admission that orients the patient to the room and call light", false, "Admission orientation is a different activity, not HS care."), O("Care after breakfast that includes the full bath and linen change", false, "That describes morning care, performed after breakfast."), O("Care before surgery that prepares the skin at the operative site", false, "Preoperative skin preparation is not the definition of HS care.") ],
  tp: "HS care: change soiled linens and gown, wash face, hands and back, oral hygiene, bedpan, back massage." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "The recommended room temperature for optimal patient comfort is which range?",
  opts: [ O("68 to 74 degrees Fahrenheit for most patients in the room", true, "Correct. The chapter range is 68°F to 74°F (20°C to 23°C)."), O("60 to 66 degrees Fahrenheit for most patients in the room", false, "That range is cooler than the recommended comfort range."), O("75 to 82 degrees Fahrenheit for most patients in the room", false, "That range is warmer than recommended except for patients needing extra warmth."), O("Any temperature the thermostat reaches during the day shift", false, "Temperature is a controlled comfort factor, not an incidental one.") ],
  tp: "Infants, older adults, and the acutely ill usually need warmer temperatures; active and chronic pulmonary patients prefer cooler." });

BANK.push({ cat: CB, type: "single", kt: ["Fowler's position"],
  stem: "Fowler's position is accurately described as which of the following?",
  opts: [ O("Head of bed at 45 degrees or more, up to 90 degrees upright", true, "Correct. Fowler's to high Fowler's runs from 45 degrees to full upright at 90 degrees."), O("Head of bed at approximately 30 degrees above the mattress", false, "Approximately 30 degrees is semi-Fowler's, also called low Fowler's."), O("Whole bed tilted downward toward the head with no mid break", false, "A whole-bed tilt toward the head is Trendelenburg's position."), O("Whole bed frame held parallel with the floor for the patient", false, "A frame parallel with the floor is the flat position.") ],
  tp: "Fowler's/high Fowler's: eating and drinking to prevent aspiration, and breathing exercises for full lung expansion." });

BANK.push({ cat: CB, type: "single", kt: ["Reverse Trendelenburg's position"],
  stem: "Reverse Trendelenburg's position is used for which purposes?",
  opts: [ O("Promoting gastric emptying and preventing esophageal reflux", true, "Correct. Table 9.1 also lists facilitating arterial flow to the lower extremities."), O("Facilitating venous return in poor peripheral circulation", false, "Venous return and postural drainage are uses of Trendelenburg's, the opposite tilt."), O("Keeping the spine aligned after a vertebral injury occurs", false, "Vertebral injuries call for the flat position, not a tilted frame."), O("Preventing aspiration during eating and drinking episodes", false, "Aspiration prevention during meals is a Fowler's position use.") ],
  tp: "Reverse Trendelenburg's: whole frame tilts toward the foot; not commonly used." });

BANK.push({ cat: CB, type: "multi", kt: [],
  stem: "Which statements about the hospital bed and call system are accurate? Select all that apply.",
  opts: [ O("A bathroom call light flashes quickly, signaling a more serious call", true, "Correct. The flashing bathroom call denotes a more serious nature; the bedside light typically does not flash."), O("Full side rails count as a form of restraint in long-term care", true, "Correct. The chapter states full side rails are a restraint form in long-term care settings."), O("Wheel locks on the bed prevent unwanted movement of the bed", true, "Correct. Locks on the wheels are a listed bed safety feature."), O("A removable headboard allows access to the head during CPR", true, "Correct. The removable headboard gives the team access during cardiopulmonary resuscitation."), O("Side rails may stay down while the nurse steps away briefly", false, "The nurse never leaves the bedside of a patient in bed if a side rail is lowered.") ],
  tp: "Bed safety: lowest position for exit, call light within reach, never leave a lowered rail unattended." });

  stem: "The overbed table is best described as which of the following?",
  opts: [ O("A wheeled, height-adjustable surface used for procedures and meal trays", true, "Correct. It adjusts over bed or chair and serves as work space and meal surface."), O("A fixed stand that stores basins, towels, and personal articles", false, "That storage description fits the bedside stand, not the overbed table."), O("A chair reserved for visitors who remain with the patient", false, "Visitor seating describes the lounge or recliner chair in the room."), O("A storage cabinet for clean linens kept outside the room", false, "Linen storage is not the overbed table's described function.") ],
  tp: "Clean the overbed tabletop before and after procedures and before meals." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "A complete bed bath is defined as a bath for which type of patient?",
  opts: [ O("A totally dependent patient who requires total assistance", true, "Correct. The complete bed bath serves patients who cannot bathe themselves."), O("A patient who needs help only with the back and the feet", false, "Help with unreachable areas defines the partial bed bath instead."), O("A patient who can shower independently with supervision", false, "A supervised shower is not a bed bath at all."), O("A patient receiving a therapeutic soak for skin lesions", false, "Therapeutic tub baths are ordered treatments, not the complete bed bath.") ],
  tp: "As the patient's condition improves, the complete bed bath steps down to partial assistance." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "Water for a complete bed bath is prepared at which temperature and fill level?",
  opts: [ O("110 to 115 degrees Fahrenheit, basin filled two-thirds full", true, "Correct. Skill 9.1 specifies 110°F–115°F and a two-thirds-full basin."), O("98 to 102 degrees Fahrenheit, basin filled two-thirds full", false, "98°F–102°F is sitz bath water, not bed bath water."), O("105 to 109 degrees Fahrenheit, basin filled completely full", false, "105°F–109°F is perineal care water, and overfilling risks spillage."), O("115 to 120 degrees Fahrenheit, basin filled halfway full", false, "115°F–120°F is towel bath water; the bed bath basin is two-thirds full.") ],
  tp: "Bed bath: 110°F–115°F (43°C–46°C); do not overfill the basin, to prevent spillage." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "Which statement about the towel bath is accurate?",
  opts: [ O("It uses 2000 mL of water at 115 to 120 degrees with 30 mL of concentrate", true, "Correct. One pump stroke measures the 30 mL of concentrate for the towel bath."), O("It uses a dry towel worked over the skin without any solution", false, "The towel is soaked in the measured concentrate solution inside a plastic bag."), O("It is reserved for patients who can stand at the sink unaided", false, "The towel bath is a bed bathing method using a large rolled towel."), O("Its warming effect works even when the towel has gone cold", false, "If the towel is not warm, the sauna-like effect is lost and the patient is chilled.") ],
  tp: "Towel bath: towel 3 × 7.5 ft; skin dries in 2–3 seconds when done properly." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "A tepid sponge bath for temperature reduction is performed with which details?",
  opts: [ O("Tepid water at 98.6 degrees, wet cloths placed at axilla and groin", true, "Correct. Vessels lie close to the surface at the axilla and groin, aiding cooling."), O("Cold water below 60 degrees, wet cloths placed on the forehead", false, "Cold water causes chilling and shivering; tepid water at 98.6°F is used."), O("Hot water at 113 degrees, wet cloths placed along the spine", false, "Hot water would raise, not lower, body temperature."), O("Warm water at 110 degrees, with the whole body left uncovered", false, "Unsponged parts stay covered, because shivering increases heat production.") ],
  tp: "Reassess temperature and pulse every 15 minutes; stop when temperature falls to slightly above normal." });

BANK.push({ cat: CC, type: "single", kt: ["Sitz bath"],
  stem: "Which statement about sitz baths is accurate?",

  tp: "Watch during a sitz bath for rapid or weak pulse, tachypnea, vertigo, or syncope; never leave the patient unsafe." });

BANK.push({ cat: CC, type: "multi", kt: [],
  stem: "Which statements describe hygiene care adjustments for older adults? Select all that apply.",
  opts: [ O("Warmer room temperature and careful draping to prevent chilling", true, "Correct. Older adults chill easily during bathing and when uncovered."), O("Caution with water temperature because sensation may be reduced", true, "Correct. Impaired circulation or neurologic change can blunt temperature sensing, risking burns."), O("Perineal care daily and after each episode of incontinence", true, "Correct. That frequency is the printed rule for older adult perineal care."), O("Rehydration of skin with lotions because aging skin is drier", true, "Correct. Oil and sweat gland activity decreases with aging, drying the skin."), O("Daily detergent-soap baths to keep thinning skin fully clean", false, "Too-frequent bathing and detergent soaps harm older skin; type and frequency are individualized.") ],
  tp: "Incontinence of urine or stool is NOT an expected result of the aging process." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "Which statement about incontinence in older adults is accurate?",
  opts: [ O("Incontinence of urine or stool is not an expected result of aging", true, "Correct. The chapter states this directly; it is never written off as normal aging."), O("Incontinence develops in every patient as the bladder ages", false, "Aging changes voiding patterns, but incontinence itself is not expected."), O("Incontinence requires no skin care unless redness is visible", false, "Meticulous skin care is needed because urine and feces irritate skin chemically."), O("Incontinence is managed best by delaying toileting responses", false, "The aging patient often needs an immediate response to a bedpan or toilet request.") ],

  tp: "That 2-hour figure drives the every-2-hours turning schedule for bed-confined patients." });

  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
