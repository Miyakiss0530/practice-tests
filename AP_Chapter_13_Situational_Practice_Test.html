BANK.push({ cat: CA, type: "single", kt: ["nociceptor"], stem: "A patient with diabetes mellitus and peripheral neuropathy is found with a large blister on his heel from new shoes; he says he never felt it. Which teaching is the priority for this patient?", opts: [
    O("Inspect both feet daily and never walk barefoot, because damaged pain sensation lets injuries go unnoticed until they infect.", true, "Diabetic neuropathy distorts pain sensation, so a blister can expand, infect, and turn gangrenous unnoticed - daily inspection replaces the missing alarm. Framework: prevention beats rescue when the warning system itself is broken."),
    O("Soak the feet in hot water each evening to restore circulation and speed up the return of normal sensation to the feet.", false, "Hot soaks risk burns in a foot that cannot feel temperature extremes, and soaking does not restore damaged nerves; the danger is unnoticed injury, not poor soaking habits."),
    O("Massage the heel firmly several times a day to break up the blister and stimulate the pain receptors back to work.", false, "Pressure on damaged tissue worsens injury; receptors damaged by neuropathy are not reawakened by massage, and the blister needs protection, not pressure."),
    O("Wear tighter shoes so the pressure is felt more clearly and the patient can notice problems sooner.", false, "Ill-fitting shoes caused this injury; tighter shoes add pressure and friction to tissue whose warning system is already unreliable.")
  ], tp: "ANSWER KEY — Correct answer: Inspect both feet daily and never walk barefoot, because damaged pain sensation lets injuries go unnoticed until they infect.. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });
BANK.push({ cat: CA, type: "single", kt: ["referred pain"], stem: "A 58-year-old patient in the emergency department reports an aching pain that began in his left shoulder and now runs down his left arm into his fourth and fifth fingers. He is pale and anxious. Which action should the nurse take first?", opts: [
    O("Treat the report as possible heart pain, keep the patient resting, and obtain cardiac monitoring and provider evaluation immediately.", true, "Visceral pain from the heart shares sensory pathways with the shoulder and left arm, so this pattern is read as cardiac until proven otherwise; rest lowers the heart's oxygen demand while evaluation starts."),
    O("Apply a heating pad to the shoulder and reassess the pain in one hour to see whether it behaves like a muscle strain.", false, "Waiting an hour on a classic referred cardiac pattern gambles with ischemic heart muscle; the pain of a heart attack is driven by oxygen deprivation of cardiac muscle, and restoring blood flow is time-critical."),
    O("Massage the arm and shoulder and encourage the patient to move the arm through its full range of motion.", false, "Movement increases oxygen demand and does nothing for visceral pain sharing the arm's pathways; the pattern points away from a simple muscle problem."),
    O("Give the patient his prescribed antacid and chart the pain as indigestion, since it is aching rather than crushing.", false, "Aching quality does not exclude the heart as the source; referred pain is defined by the mismatch between where pain is felt and where it originates.")
  ], tp: "ANSWER KEY — Correct answer: Treat the report as possible heart pain, keep the patient resting, and obtain cardiac monitoring and provider evaluation immediately.. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });
BANK.push({ cat: CA, type: "single", kt: ["projection","phantom limb pain"], stem: "Two days after a below-knee amputation, a patient tells the nurse, 'My missing foot throbs all night - I know it sounds crazy.' Which response is best?", opts: [
    O("'The pain is real. The severed nerve endings keep signaling the brain, which projects the feeling back to where the leg was; it usually fades as the nerves heal.'", true, "Phantom limb pain is projection at work: severed nerve endings keep sending sensory information to the parietal lobe, and the brain projects it back to the missing limb. It is real, common, and usually diminishes with healing."),
    O("'That cannot be pain, because the foot is gone and there are no receptors left to fire. Try to think about something else and it should pass within a few days.'", false, "Dismissing the report denies a documented phenomenon; the brain experiences the sensation even though the limb is absent, and the patient needs explanation, not contradiction."),
    O("'Throbbing in a missing limb usually means the stump is infected or healing badly, so I will notify the surgeon to examine it and possibly reopen it.'", false, "Phantom pain is an expected projection effect, not a sign that mandates reopening the stump; stump infection is judged by stump findings, not by projected pain."),
    O("'The feeling means the nerves were permanently damaged during the surgery, and this pain will likely stay at the same level for the rest of your life.'", false, "For most amputees the pain diminishes as the severed nerves heal, although a phantom presence often remains; declaring it permanent is inaccurate and hopeless.")
  ], tp: "ANSWER KEY — Correct answer: 'The pain is real. The severed nerve endings keep signaling the brain, which projects the feeling back to where the leg was; it usually fades as the nerves heal.'. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });
BANK.push({ cat: CA, type: "single", kt: ["spinothalamic tract"], stem: "A patient with severe right-lower-quadrant pain is guarding and rates the pain 9 of 10. The provider has not yet examined him, and appendicitis is suspected. He begs for 'the strong pain shot right now.' Which action is most appropriate?", opts: [
    O("Assess and document the pain fully and notify the provider promptly, explaining that masking the pain before the cause is found can delay needed surgery.", true, "RLQ pain is a valuable diagnostic clue for appendicitis; relieving pain without finding the cause can delay surgery until the appendix ruptures and causes life-threatening peritonitis. Prompt assessment and provider notification protect the diagnostic value of the pain."),
    O("Give the full prescribed opioid dose immediately, because an unrelieved 9-of-10 pain score always outranks diagnostic concerns.", false, "The score is real and must be addressed, but the chapter's warning is specific: pain relief that erases the clue before evaluation can delay the appendectomy this patient may need."),
    O("Tell the patient pain medicine is not allowed for abdominal pain and offer him an ice pack and a darkened room instead.", false, "Pain is not simply 'not allowed'; the nursing move is rapid assessment and provider involvement in the decision, not a blanket refusal with comfort measures only."),
    O("Give half the dose, document the pain as improved, and let the provider examine him at the next scheduled rounds.", false, "Partial masking plus delayed examination keeps both harms: the clue is blunted and the surgical decision waits on a routine schedule.")
  ], tp: "ANSWER KEY — Correct answer: Assess and document the pain fully and notify the provider promptly, explaining that masking the pain before the cause is found can delay needed surgery.. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });
BANK.push({ cat: CB, type: "multi", kt: ["olfaction","anosmia"], stem: "A patient recovering from a head injury has lost his sense of smell. Which safety teaching points should the nurse include? Select all that apply.", opts: [
    O("Install smoke and gas detectors and check them monthly, since you cannot rely on smelling smoke or leaking gas.", true, "Smell is a protective warning sense for smoke and gas; with olfaction gone, devices must do the warning work instead."),
    O("Ask a family member to check expiration dates and sniff stored food, because spoiled food will not warn you.", true, "Spoiled food is normally caught by smell; without it, another person's nose or strict date-checking must substitute before eating."),
    O("Taste each cleaning chemical before using it to be sure it is the right product.", false, "Tasting chemicals is itself dangerous; labels and storage discipline, not taste, identify household chemicals safely."),
    O("Keep the stove burners on low at all times so any leak stays too small to matter.", false, "Leaving burners on creates the very gas hazard the patient can no longer detect; appliances belong off when not in use."),
    O("Ventilate the kitchen and bathroom well, since harsh fumes will not register as strongly as before.", true, "Harsh odors normally trigger both smell and trigeminal warning; a patient without smell loses the early cue to leave or ventilate a space.")
  ], tp: "ANSWER KEY — Correct answer: Install smoke and gas detectors and check them monthly, since you cannot rely on smelling smoke or leaking gas.; Ask a family member to check expiration dates and sniff stored food, because spoiled food will not warn you.; Ventilate the kitchen and bathroom well, since harsh fumes will not register as strongly as before.. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });

BANK.push({ cat: CC, type: "single", kt: ["olfaction"], stem: "A nurse entering a patient's room notices the patient's breath has a distinctly fruity, acetone-like odor. The patient is a known diabetic who has been vomiting and breathing rapidly. Which action is most appropriate?", opts: [
    O("Check the patient's blood glucose and notify the provider, treating the breath odor as a cue of diabetic ketoacidosis.", true, "The chapter names acetone breath as a diagnostic smell of diabetic ketoacidosis; combined with vomiting and rapid breathing, it demands glucose data and provider notification."),

BANK.push({ cat: CC, type: "multi", kt: ["gustation"], stem: "A patient receiving radiation therapy for head and neck cancer reports that 'food tastes like cardboard' and she is losing weight. Which nursing actions are appropriate? Select all that apply.", opts: [
    O("Assess her weight trend and oral intake and involve the dietitian in planning appealing, nutrient-dense meals.", true, "Drugs and radiation often change or destroy taste, and the loss of taste affects appetite and nutrition - intake and weight must be tracked and supported."),

BANK.push({ cat: CB, type: "single", kt: ["proprioception"], stem: "A nurse is teaching a preterm infant's parents about kangaroo care before discharge. Which statement by a parent indicates correct understanding?", opts: [
    O("'Holding our baby skin-to-skin inside my shirt will calm her, help keep her warm, and help her feed better.'", true, "Kangaroo care - skin-to-skin contact in the parent's blouse or shirt - calms the preterm infant, stabilizes temperature, and improves feeding; touch is the first sensory system to develop and is essential to thriving."),

BANK.push({ cat: CD, type: "multi", kt: ["conjunctivitis"], stem: "A school nurse is teaching parents during an outbreak of 'pink eye' in a kindergarten class. Which statements should the nurse include? Select all that apply.", opts: [

BANK.push({ cat: CD, type: "order", kt: ["lacrimal apparatus"], stem: "The nurse is reviewing tear flow with a patient who has a blocked tear duct. Place the structures in the order tears travel through them.", items: [{"t":"Lacrimal gland","r":"Tears are secreted by the lacrimal gland, which sits in the upper lateral part of the orbit."},{"t":"Lacrimal ducts","r":"Tears leave the gland through the lacrimal ducts and wash across the surface of the eye toward the nose."},{"t":"Lacrimal puncta","r":"Tears drain through the small openings called the lacrimal puncta at the inner eye."},{"t":"Lacrimal canal","r":"From the puncta, tears pass into the lacrimal canals on their way down."},{"t":"Nasolacrimal duct","r":"The nasolacrimal duct finally empties into the nasal cavity; tears normally reach the back of the throat and are swallowed."}], tp: "ANSWER KEY — Correct answer: the sequence: 1. Lacrimal gland 2. Lacrimal ducts 3. Lacrimal puncta 4. Lacrimal canal 5. Nasolacrimal duct. DETAILED RATIONALE — undefined The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — undefined" });

    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
