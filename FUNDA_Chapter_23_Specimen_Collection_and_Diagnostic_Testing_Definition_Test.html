<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Consent, Preparation and Allergy Safety";
var CB = "GI, Barium and Contrast Studies";
var CC = "Scans, Imaging, Scopes and Punctures";
var CD = "Specimen Collection and Urine Specimens";
var CE = "Stool, Sputum, Cultures and Blood Collection";
var CF = "ECG, Nursing Process, Delegation and Home Care";
var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 2
  }
 },
 CB: {
  "name": CB,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 2
  }
 },
 CC: {
  "name": CC,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 2
  }
 },
 CD: {
  "name": CD,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 2
  }
 },
 CE: {
  "name": CE,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 2
  }
 },
 CF: {
  "name": CF,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 2
  }
 }
};

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about informed consent for a diagnostic test is accurate?",
  opts: [ O("The provider explains benefits and risks; the nurse reinforces that explanation", true, "Correct. Disclosure of the procedure, method, benefits, and risks is primarily the provider's responsibility; reinforcing it is the nurse's role."), O("The nurse explains benefits and risks; the provider only signs the consent form", false, "Incorrect. The roles are reversed in this option; disclosure belongs to the provider."), O("The provider explains the test only when the patient asks a direct question first", false, "Incorrect. Disclosure is owed before consent, not only on request."), O("The nurse obtains consent by describing only the benefits the test can offer", false, "Incorrect. Consent requires risks and alternatives too, not benefits alone.") ],
  tp: "Informed consent is the patient's most important right: competent understanding of what will be done, the risks, and the alternatives, explained by the provider and reinforced by the nurse." });

BANK.push({ cat: CA, type: "single",
  stem: "Which test traditionally requires additional, specific consent beyond the consent for treatment signed on admission?",
  opts: [ O("HIV testing for the patient", true, "Correct. HIV testing and invasive procedures traditionally require additional, specific consent."), O("Routine urinalysis testing", false, "Incorrect. A routine urinalysis is covered by the general admission consent."), O("Fingerstick glucose testing", false, "Incorrect. Capillary glucose checks are noninvasive routine care under admission consent."), O("Plain chest radiography exam", false, "Incorrect. A chest x-ray is a routine noninvasive study under admission consent.") ],
  tp: "Admission consent covers most diagnostic tests; HIV testing and invasive procedures traditionally need additional specific consent, and the patient may withdraw consent at any time." });

BANK.push({ cat: CA, type: "multi",
  stem: "A patient is being prepared for a diagnostic examination tomorrow. Which pieces of information does the patient need before the test? Select all that apply.",
  opts: [ O("Whether nothing by mouth is required, such as NPO after midnight", true, "Correct. Fasting requirements are essential pre-test information."), O("Whether medications are withheld until the examination is completed", true, "Correct. The patient must know which medications are held and for how long."), O("Whether a special room or special equipment is required for the test", true, "Correct. Location and equipment needs are part of preparing the patient."), O("Whether medications are needed before or during the test itself", true, "Correct. Premedication needs are part of what an informed patient is told."), O("The exact laboratory value the test result will show for the patient", false, "Incorrect. Results cannot be known or promised before the test is performed.") ],
  tp: "An informed patient is better prepared to participate: NPO status, held medications, special room or equipment, and medications needed before or during the test." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient develops flushing, itching, and urticaria during a dye study. How is this reaction classified in the chapter?",
  opts: [ O("A mild reaction to the iodine contrast medium", true, "Correct. Flushing, itching, and urticaria are the printed mild-reaction signs."), O("A moderate reaction to the iodine contrast medium", false, "Incorrect. The moderate tier is dyspnea and bronchospasm."), O("A severe reaction to the iodine contrast medium", false, "Incorrect. The severe tier is respiratory distress, falling blood pressure, shock, and death."), O("A delayed reaction to the iodine contrast medium", false, "Incorrect. Delayed reactions appear hours later, not during the injection.") ],
  tp: "Dye reaction tiers: mild = flushing, itching, urticaria; moderate = dyspnea and bronchospasm; severe = respiratory distress, hypotension, shock, death. Keep oxygen and endotracheal equipment on hand." });

BANK.push({ cat: CA, type: "single",
  stem: "Which finding fits the chapter's description of a delayed reaction to contrast dye?",
  opts: [ O("Urticaria appearing 2 to 6 hours after the test ends", true, "Correct. Delayed reactions such as urticaria usually occur within 2 to 6 hours after the test."), O("Urticaria appearing 2 to 6 minutes after the test ends", false, "Incorrect. Minutes-scale onset describes an immediate reaction, not a delayed one."), O("Urticaria appearing 2 to 6 days after the test ends", false, "Incorrect. The printed delayed window is hours, not days."), O("Urticaria appearing only while the dye is being injected", false, "Incorrect. A reaction during injection is immediate, not delayed.") ],
  tp: "Teach every dye-study patient the signs of a delayed reaction (for example urticaria within 2-6 hours) and to notify the provider if they occur." });

BANK.push({ cat: CA, type: "single",
  stem: "Why does the nurse assess a patient for tattoos before a CT or MRI scan?",
  opts: [ O("Older tattoo dyes contain metal that can burn or irritate skin during scans", true, "Correct. Metallic components in older body art can cause burning or skin irritation with CT and MRI; report findings to radiology."), O("Tattoo ink blocks the scanner from producing any usable image of the area", false, "Incorrect. The concern is metal-related burning and irritation, not total image loss."), O("Tattoos indicate the patient is allergic to the iodine contrast medium used", false, "Incorrect. Tattoos do not diagnose a dye allergy; allergy history is assessed separately."), O("Tattooed skin cannot be cleaned with the antiseptic used before the scan", false, "Incorrect. Skin cleansing is not the issue raised by tattoos in the chapter.") ],
  tp: "Assess for tattoos before CT/MRI: older dyes contain metal and can burn or irritate; report the finding to radiology." });

BANK.push({ cat: CA, type: "multi",
  stem: "Which factors does the chapter list as causes of inaccurate diagnostic test results? Select all that apply.",
  opts: [ O("Insufficient cleansing of the bowel before the examination", true, "Correct. Inadequate bowel cleansing is a listed accuracy factor."), O("Failure to maintain the required fasting before the test", true, "Correct. Broken fasting requirements are a listed accuracy factor."), O("Delay in delivering the collected specimen to the laboratory", true, "Correct. Delayed delivery is a listed accuracy factor."), O("Improper timing of when the specimen was collected", true, "Correct. Wrong collection timing is a listed accuracy factor."), O("The patient asking questions about the purpose of the test", false, "Incorrect. Patient questions do not harm accuracy; teaching improves preparation.") ],
  tp: "Box 23.3 accuracy killers: insufficient bowel cleansing, broken fasting, incorrect specimen preparation, missing requisition, delayed delivery, improper amount or timing, and absent consent." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient with a shellfish allergy is scheduled for a study that uses iodine dye. Which statement is accurate?",
  opts: [ O("A shellfish allergy makes an iodine dye reaction likely in this patient", true, "Correct. Patients allergic to shellfish are likely to react to iodine dye; allergy is suspected in any patient with a known iodine or shellfish allergy."), O("A shellfish allergy rules out any reaction because the substances differ", false, "Incorrect. The chapter treats shellfish allergy as a warning sign for dye reaction."), O("A shellfish allergy matters only if the patient also has asthma symptoms", false, "Incorrect. No second condition is required for the allergy to matter."), O("A shellfish allergy requires the study to be cancelled in every patient", false, "Incorrect. Facilities may premedicate with an antihistamine or steroid, or use hypoallergenic contrast media.") ],
  tp: "Assess iodine and shellfish allergies before every dye study; options include premedication or hypoallergenic contrast media." });

BANK.push({ cat: CB, type: "single",
  stem: "During bowel preparation for a barium enema, how does the nurse judge that cleansing is adequate?",
  opts: [ O("The fecal return has become similar to clear water", true, "Correct. Return similar to clear water means preparation is adequate."), O("The fecal return still contains large solid waste", false, "Incorrect. Large solid fecal waste still being evacuated means preparation is inadequate."), O("The patient reports feeling completely exhausted", false, "Incorrect. Exhaustion is a risk of the preparation in elderly patients, not a sign of adequacy."), O("The patient has finished one full glass of water", false, "Incorrect. One glass is far short of the day-before fluid regimen of a glass every hour for 8-10 hours.") ],
  tp: "Clear-water return = adequate bowel preparation; solid waste still coming = inadequate, so notify the radiologist or provider, who may extend the preparation." });

BANK.push({ cat: CB, type: "single",
  stem: "Which teaching point is correct for a patient after a barium study?",
  opts: [ O("Stools will look white until all of the barium has been excreted", true, "Correct. Barium makes stools white; color returns to normal when evacuation is complete."), O("Stools will look black and tarry until the barium is fully excreted", false, "Incorrect. Black, tarry stools indicate old blood from higher in the GI tract, not barium."), O("A laxative is never given because barium leaves the body on its own", false, "Incorrect. Laxatives are often ordered after barium studies because barium can cause constipation."), O("Fluid intake should be restricted until the stool color returns to normal", false, "Incorrect. Fluid intake is encouraged after barium studies to help evacuation.") ],
  tp: "After barium: white stools until it is excreted, encourage fluids, and expect a laxative order because barium can constipate." });

BANK.push({ cat: CB, type: "multi",
  stem: "After a colonoscopy, which findings must the nurse watch for and report? Select all that apply.",
  opts: [ O("Abdominal pain, tenderness, or distention after the procedure", true, "Correct. These findings can indicate colon perforation and must be reported."), O("A decrease in blood pressure with an increase in pulse rate", true, "Correct. That vital-sign pair is the chapter's indication of hemorrhage after colonoscopy."), O("Gross blood present in the stools after the procedure", true, "Correct. Stools are examined for gross blood after colonoscopy."), O("Gas pains from air that was introduced during the procedure", false, "Incorrect. Gas pains from insufflated air are expected after colonoscopy, not a reportable complication by themselves.") ],
  tp: "Post-colonoscopy watch: perforation (pain, distention, tenderness), hemorrhage (BP down, pulse up, gross blood in stool); gas pains alone are expected." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about a kidney, ureter, and bladder (KUB) x-ray is accurate?",
  opts: [ O("It is scheduled before any barium studies and needs no fasting", true, "Correct. The KUB uses no GI contrast, requires no fasting or sedation, and is scheduled before barium studies."), O("It is scheduled after barium studies so the bowel is outlined", false, "Incorrect. The order is reversed: KUB comes before barium studies."), O("It requires NPO status after midnight and sedation for comfort", false, "Incorrect. No fasting or sedation is required for a KUB."), O("It uses an iodine contrast medium injected before the filming", false, "Incorrect. No GI contrast media is used for a KUB.") ],
  tp: "KUB: no contrast, no fasting, no sedation, radiopaque clothing removed, and it is done before any barium studies; IVP and GI studies follow it." });

BANK.push({ cat: CB, type: "single",
  stem: "For an intravenous pyelogram (IVP), why is fluid restriction necessary before the test?",
  opts: [ O("So the dye will be taken up by the kidneys for the study", true, "Correct. For IVP, fluid restriction is necessary for the dye to be taken up by the kidneys."), O("So the bladder will stay completely full during the study", false, "Incorrect. Bladder filling is the amniocentesis rule before 20 weeks, not the IVP rule."), O("So the patient will not need to void during the filming", false, "Incorrect. Voiding convenience is not the stated reason for restriction."), O("So the cathartics given before the test work more slowly", false, "Incorrect. Cathartics are given to clear the bowel; restriction serves dye uptake by the kidneys.") ],
  tp: "IVP specifics: do it before barium studies, check iodine/shellfish allergy and BUN/creatinine, NPO after midnight, and restrict fluids so the kidneys take up the dye." });

BANK.push({ cat: CB, type: "single",
  stem: "Before arteriography, the nurse marks the sites of the peripheral pulses with a pen. What is the purpose of this action?",
  opts: [ O("It enables comparison of the pulses after the procedure", true, "Correct. Marking the pulse sites enables postprocedure assessment and comparison."), O("It shows the radiologist where to insert the arterial catheter", false, "Incorrect. The marks are for pulse assessment, not for choosing the puncture site."), O("It prevents the dye from leaking out at the puncture site", false, "Incorrect. Marking has no effect on dye leakage; pressure and bed rest address the puncture site."), O("It identifies which extremity must be kept immobilized after", false, "Incorrect. Immobilization follows the puncture site; the pen marks locate pulses for assessment.") ],
  tp: "Arteriography and cardiac catheterization both use pre-marked pulse sites so postprocedure pulses can be compared with baseline." });

BANK.push({ cat: CB, type: "multi",
  stem: "Which nursing actions are correct after cardiac catheterization? Select all that apply.",
  opts: [ O("Keep the affected extremity extended and immobilized to decrease bleeding", true, "Correct. Extension and immobilization of the affected extremity decrease bleeding."), O("Assess pulses in both extremities and compare with the preprocedure marks", true, "Correct. Pulses in both extremities are compared with the preprocedure marking and findings."), O("Instruct the patient to report numbness, tingling, pain, or loss of function", true, "Correct. The patient is taught to report these signs in the involved extremity immediately."), O("Encourage rest for about 4 to 6 hours and encourage fluid intake", true, "Correct. Rest 4-6 hours, fluids, and urinary output monitoring are printed aftercare."), O("Have the patient ambulate the unit within the first 30 minutes", false, "Incorrect. Early ambulation works against bleeding control; rest is prescribed instead.") ],
  tp: "Post-cardiac cath: monitor the site for bleeding, rest 4-6 hours, extremity extended and immobilized, serial neurovascular checks against the pre-marked baseline." });

BANK.push({ cat: CB, type: "single",
  stem: "A gallbladder series uses Telepaque tablets the day before the examination. Which administration rule is correct?",
  opts: [ O("Tablets are taken one at a time, 15 minutes apart, and never crushed", true, "Correct. Multiple tablets are taken one at a time with a 15-minute interval between each, and are not crushed."), O("Tablets are crushed together and taken in one dose with a full meal", false, "Incorrect. Crushing and single-dose administration both violate the printed rule."), O("Tablets are taken all at once on the morning of the examination", false, "Incorrect. They are taken the day before, usually early in the evening, one at a time."), O("Tablets are taken with a fatty meal to speed gallbladder emptying", false, "Incorrect. The evening meal before the examination is fat-free, not fatty.") ],
  tp: "Gallbladder series: fat-free evening meal, Telepaque tablets the day before one at a time 15 minutes apart, uncrushed; assess iodine allergy and hepatic or renal failure." });

BANK.push({ cat: CC, type: "single",
  stem: "Which finding must be resolved before a patient enters the MRI scanner?",
  opts: [ O("The patient has an implanted cardiac pacemaker in place", true, "Correct. A pacemaker is a listed contraindication to MRI, along with aneurysm clips, plates, spinal cord stimulators, and shrapnel."), O("The patient wears a removable gold wedding band today", false, "Incorrect. Removable metal is simply taken off and stored safely; it is not a contraindication."), O("The patient ate a full breakfast earlier this morning", false, "Incorrect. MRI has no food or fluid restrictions."), O("The patient reports mild anxiety in enclosed spaces", false, "Incorrect. Claustrophobia is managed with anxiolytic medication, not treated as a contraindication.") ],
  tp: "MRI safety: screen for pacemaker, aneurysm clips, plates, spinal cord stimulator, and shrapnel; remove all metal; no food or fluid restrictions." });

BANK.push({ cat: CC, type: "single",
  stem: "A patient with diabetes is scheduled for a PET scan. Which instruction follows the chapter?",
  opts: [ O("Take the pretest insulin dose at a meal 3 to 4 hours before the test", true, "Correct. Patients with diabetes take their pretest insulin at a meal 3-4 hours before PET."), O("Skip all insulin on the day before and the day of the examination", false, "Incorrect. The chapter directs a timed pretest dose, not omission of insulin."), O("Eat a high-glucose meal right before entering the scanner room", false, "Incorrect. High glucose levels can decrease accuracy and invalidate PET results."), O("Take the insulin dose immediately after the scan is completed", false, "Incorrect. The printed timing is at a meal 3-4 hours before the test.") ],
  tp: "PET rules: no alcohol, caffeine, tobacco, sedatives, or tranquilizers for 24 hours; empty the bladder; diabetics take insulin at a meal 3-4 hours before because high glucose invalidates results." });

BANK.push({ cat: CC, type: "single",
  stem: "After bronchoscopy with anesthetic sprayed on the throat, when may the patient eat or drink?",
  opts: [ O("Only after the gag reflex has returned, about 2 to 4 hours later", true, "Correct. Nothing is taken until the gag reflex returns, tested with an applicator stick at the back of the pharynx."), O("As soon as the patient says the throat no longer feels numb", false, "Incorrect. The gag reflex must be tested objectively, not judged by the patient's feeling."), O("Immediately, as long as the first sips are warm saline gargles", false, "Incorrect. Gargles soothe a sore throat later; intake waits for the gag reflex."), O("Only after the written report is received, in 2 to 7 days", false, "Incorrect. The 2-7 day figure is the report turnaround, not the eating restriction.") ],
  tp: "After bronchoscopy or gastroscopy with throat anesthetic: no food or fluids until the gag reflex returns (2-4 hours); report bronchospasm or laryngospasm immediately." });

BANK.push({ cat: CC, type: "multi",
  stem: "Which actions are correct after a liver biopsy? Select all that apply.",
  opts: [ O("Position the patient on the right side for about 1 to 2 hours", true, "Correct. Right-side positioning compresses the liver capsule against the chest wall, decreasing hemorrhage or bile leak risk."), O("Keep the patient on bed rest for a full 24 hours after the test", true, "Correct. Bed rest for 24 hours is the printed aftercare."), O("Watch for increased pulse and decreased blood pressure as bleeding signs", true, "Correct. That vital-sign pattern indicates hemorrhage after liver biopsy."), O("Tell the patient to avoid coughing or straining after the procedure", true, "Correct. Coughing and straining raise intraabdominal pressure and are to be avoided."), O("Encourage heavy lifting the next day to restore normal activity", false, "Incorrect. Strenuous activity and heavy lifting are avoided for 1-2 weeks.") ],
  tp: "Liver biopsy: coagulation profile must be normal first, right side 1-2 hours, bed rest 24 hours, watch for hemorrhage and peritonitis, and report chest pain with dyspnea as possible pneumothorax." });

  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 23: Specimen Collection and Diagnostic Testing - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
