 },

BANK.push({"cat": CA, "type": "single", "kt": [], "stem": "A 68-year-old patient admitted an hour ago for pneumonia, temperature 101.2 F, pulse 104, keeps asking what will happen next and whether family can visit. Which action should the nurse take first?", "opts": [{"t": "Answer the simple questions directly and orient the patient to routines and visiting", "c": true, "r": "Correct. Framework: Maslow safety first. Fear of the unknown is the most common admission reaction; direct answers and orientation restore control and lessen anxiety."}, {"t": "Ask the provider for a sedative order so the patient can rest through the evening", "c": false, "r": "Medication is not the chapter intervention for admission anxiety; explanation and orientation come first."}, {"t": "Tell the patient the provider will explain everything during rounds tomorrow morning", "c": false, "r": "Delaying simple answers leaves the fear of the unknown unaddressed for a full day."}, {"t": "Complete the full admission paperwork before answering any of the patient questions", "c": false, "r": "Paperwork matters, but a careless or impersonal routine heightens anxiety and reduces cooperation."}], "tp": "First contact sets the tone: convey concern, answer simple questions, orient to bed, call system, meals, and visiting."});

BANK.push({"cat": CA, "type": "single", "kt": [], "stem": "A newly admitted patient tears up when the ID band is applied and says she feels like a number, not a person. Which response should the nurse use?", "opts": [{"t": "Explain the band protects safety by giving positive identification for every procedure", "c": true, "r": "Correct. Framework: therapeutic communication with Maslow esteem needs. Explaining the safety purpose addresses loss of identity while keeping identification intact."}, {"t": "Remove the band until the patient feels ready to wear it during the hospital stay", "c": false, "r": "Removing the band removes the positive identification used in all procedures and medication administration."}, {"t": "Tell the patient every patient complains about the band and she will get used to it", "c": false, "r": "Dismissing the feeling is impersonal and heightens anxiety rather than preserving dignity."}, {"t": "Write a nickname on the band so the patient feels less like a number on the unit", "c": false, "r": "The band carries the full name and date of birth for identification; nicknames undermine that purpose."}], "tp": "Loss of identity: explain the ID band as a safety procedure, learn the name quickly, address the patient formally."});

BANK.push({"cat": CA, "type": "single", "kt": [], "stem": "A 4-year-old admitted for asthma cries constantly and clings to the doorway when his mother steps out to sign papers. Which action should the nurse take?", "opts": [{"t": "Encourage the mother to stay with the child and involve her in the admission process", "c": true, "r": "Correct. Framework: Maslow belonging and love needs. Parental presence prevents separation anxiety and gives the child security; the parent is also the most reliable information source."}, {"t": "Take the child to the playroom and keep the mother out until he settles down alone", "c": false, "r": "Separating the child longer intensifies separation anxiety rather than relieving it."}, {"t": "Perform the scheduled blood draw now while the mother is out of the room signing", "c": false, "r": "Invasive procedures belong in a treatment room, and removing support during one adds distress."}, {"t": "Tell the mother children adjust faster when parents visit only at scheduled hours", "c": false, "r": "The guide encourages parents to stay with the hospitalized child, not to limit presence."}], "tp": "Young children express separation anxiety as crying; parents staying is the prevention, not a reward for calming down."});

BANK.push({"cat": CA, "type": "single", "kt": [], "stem": "An 82-year-old admitted patient with hearing and vision limits is increasingly agitated, answering questions before they are finished and calling out repeatedly. Which approach should the nurse use?", "opts": [{"t": "Converse slowly and clearly, allow time to answer, and involve her in the care plan", "c": true, "r": "Correct. Framework: safety first with dignity. Hearing may be less acute and processing slower; rushing or family answering for her worsens fear and loss of control."}, {"t": "Ask the daughter to answer all questions so the admission can move along more quickly", "c": false, "r": "The guide directs staff to wait for the patient to answer rather than letting family answer for her."}, {"t": "Speak louder and faster and finish her sentences so she feels the team is efficient", "c": false, "r": "Louder and faster speech plus finishing sentences increases agitation in a patient with sensory limits."}, {"t": "Keep the room dark and visitors away until the agitation resolves on its own later", "c": false, "r": "Isolation removes the significant support people the guide says remain an important resource."}], "tp": "Older adults: slow clear speech, no rushing, patient answers, dignity maintained, involve in plan of care, referrals via social service."});

BANK.push({"cat": CA, "type": "single", "kt": [], "stem": "A patient observes the Sabbath from sundown Friday to sundown Saturday and avoids electronic equipment during that time. The unit relies on an electronic call device. Which action should the nurse take?", "opts": [{"t": "Find an alternative to the electronic equipment for this patient during the Sabbath", "c": true, "r": "Correct. Framework: culturally competent care. The guide directs the nurse to find alternatives to electronic equipment during Sabbath observance when possible."}, {"t": "Explain that unit policy requires the device and no exception can be made for anyone", "c": false, "r": "The guide directs accommodation of religious practice where possible, not a blanket refusal."}, {"t": "Document noncompliance if the patient declines to use the electronic call device", "c": false, "r": "Following a religious observance is not noncompliance; alternatives should be arranged."}, {"t": "Ask the family to stay at the bedside continuously so no call device is ever needed", "c": false, "r": "Making family provide round-the-clock coverage shifts a nursing responsibility onto visitors."}], "tp": "Culture and religion intertwine for some patients; assess beliefs on admission and maintain cultural practices as much as possible."});

BANK.push({"cat": CA, "type": "single", "kt": [], "stem": "During admission the nurse finds leaves tucked in a patient's clothing and on the body. The patient says they help keep health. Which action is most appropriate?", "opts": [{"t": "Leave the leaves in place and assist the patient in maintaining the cultural practice", "c": true, "r": "Correct. Framework: culturally competent care. Some cultures hold that leaves have special significance in healing; the nurse assists patients in maintaining cultural practices as much as possible."}, {"t": "Remove and discard the leaves because they do not appear on the medication record", "c": false, "r": "Discarding a healing practice item without cause disrespects the belief the chapter describes."}, {"t": "Bag the leaves with the valuables and document them as a possible infection source", "c": false, "r": "The guide presents the practice neutrally as a cultural belief to accommodate, not a hazard to confiscate."}, {"t": "Tell the patient the practice can continue at home but not inside a health facility", "c": false, "r": "The guide directs assisting with cultural practices in the facility, not banning them."}], "tp": "Cultural commonalities vary by individual; ask and accommodate rather than assuming or removing."});

BANK.push({"cat": CA, "type": "single", "kt": [], "stem": "A nurse greets a new admission with, 'Hi Honey, let us get you settled, Pops is down the hall.' The patient stiffens. Which correction should the charge nurse make?", "opts": [{"t": "Address the patient as Mr. with the last name and avoid terms of endearment entirely", "c": true, "r": "Correct. Framework: professional communication. Adults are addressed by title and last name unless they grant permission otherwise, and terms of endearment are never appropriate."}, {"t": "Use the first name right away so the patient feels the unit is warm and informal", "c": false, "r": "A first name is used only at the patient's request, not as a default greeting."}, {"t": "Keep endearments for older patients because they usually find them comforting", "c": false, "r": "The guide trap is explicit: terms of endearment are never appropriate for any patient."}, {"t": "Ask the roommate what the patient likes to be called and use that name instead", "c": false, "r": "The form of address comes from the patient, not from a roommate."}], "tp": "Introduce yourself with first name and title; address the patient by title and surname."});

BANK.push({"cat": CA, "type": "multi", "kt": [], "stem": "A 79-year-old patient is admitted after a fall, lives alone, and keeps saying she will never get back home. Which nursing actions support this patient on admission? Select all that apply.", "opts": [{"t": "Help the patient maintain dignity and involve her in the plan of care decisions", "c": true, "r": "Correct. The guide lists dignity and involvement in the plan of care as special considerations for older adults."}, {"t": "Adjust facility routines to meet the patient desires whenever that is possible", "c": true, "r": "Correct. Adjusting routines to the patient's desires is a listed special consideration."}, {"t": "Arrange referral contact with social service for home nursing or homemaking help", "c": true, "r": "Correct. Referrals for home nursing, therapy, homemaking, and nutrition programs go through social service."}, {"t": "Reassure her that discharge destination is decided by the team without her input", "c": false, "r": "Excluding her input increases the loss of control and dependency the guide warns about."}, {"t": "Limit family contact during the first days so she adapts to the facility routine", "c": false, "r": "Significant support people remain accessible and helpful; limiting contact worsens belonging needs."}], "tp": "Older adults often fear they cannot return home; dignity, involvement, routine flexibility, and social service referrals are the response. Framework: Maslow belonging and esteem."});

BANK.push({"cat": CB, "type": "single", "kt": [], "stem": "The unit is notified a patient will arrive by stretcher in 10 minutes and will need oxygen. Which room preparation is correct?", "opts": [{"t": "Bed in the high position, oxygen in place and ready, room neat with care items set", "c": true, "r": "Correct. Framework: safety first. A stretcher arrival needs the high bed position, and special equipment such as oxygen is in place and ready on arrival."}, {"t": "Bed in the low position, oxygen requested after arrival, room cleaned after settling", "c": false, "r": "Low position fits wheelchair or walking arrivals; equipment and a ready room should precede arrival."}, {"t": "Bed in the high position, oxygen stored in the supply room for the family to fetch", "c": false, "r": "Oxygen must be in place and ready, not stored for family to retrieve."}, {"t": "Bed flat with the head raised, oxygen tubing coiled on the visitor chair for later", "c": false, "r": "The rule is bed height by arrival method, with equipment ready at the bedside."}], "tp": "A ready room makes the patient feel expected and welcome and builds the therapeutic relationship."});

BANK.push({"cat": CB, "type": "single", "kt": [], "stem": "A patient admitted by telephone yesterday arrives today. During that call she was told to leave jewelry and large sums of money at home. What must the nurse do on arrival?", "opts": [{"t": "Verify the records and the ID band with the patient for accuracy before proceeding", "c": true, "r": "Correct. Framework: safety first, positive identification. After telephone admission, records and ID band are verified with the patient on arrival."}, {"t": "Apply a new ID band without checking it because the records were done by phone", "c": false, "r": "Skipping verification defeats the accuracy check telephone admission requires."}, {"t": "Repeat the entire intake by phone from the bedside before the patient is settled", "c": false, "r": "The intake was gathered by phone; arrival requires verification, not repetition."}, {"t": "Send the patient to the laboratory first and verify the band when she returns up", "c": false, "r": "Identification is verified before tests are performed, not after them."}], "tp": "Telephone admission: instructions cover arrival time, items to bring, and items to leave at home; verify on arrival."});

BANK.push({"cat": CB, "type": "single", "kt": [], "stem": "An unconscious patient arrives from the emergency department to the ICU. The admitting office still needs demographic and insurance information. Which action is appropriate?", "opts": [{"t": "Obtain the information from a family member, usually next of kin or the representative", "c": true, "r": "Correct. Framework: Nursing Process, assessment through the available source. In ED admissions the next of kin or health care representative provides admitting information."}, {"t": "Delay all treatment until the patient wakes and can supply the information personally", "c": false, "r": "Immediate treatment takes priority over routine admission procedures in the ED pathway."}, {"t": "Complete the forms from the ambulance run sheet and skip family contact entirely", "c": false, "r": "The guide assigns this information role to family or the representative, not the run sheet alone."}, {"t": "Ask the roommate in the ICU bay to confirm the patient identity and insurance plan", "c": false, "r": "A roommate is not a source for another patient's identifying or insurance information."}], "tp": "ED admissions may go directly to SCU, ICU, CCU, or burn unit; identification of an unconscious patient waits for family or legal guardian."});

BANK.push({"cat": CB, "type": "single", "kt": [], "stem": "A patient says she wants to refuse a proposed treatment and asks what rights she has. Which admission information covers this question?", "opts": [{"t": "The Patient Self-Determination Act information on accepting or refusing treatment", "c": true, "r": "Correct. Framework: patient rights and advocacy. The 1991 Act addresses the right to accept or reject medical treatment and advance directive information."}, {"t": "The HIPAA receipt form the patient signed when the admission paperwork began today", "c": false, "r": "HIPAA covers privacy information and signed receipt, not treatment refusal rights."}, {"t": "The clothing and valuables list the patient signed when the admission began today", "c": false, "r": "The valuables list tracks property disposition, not treatment rights."}, {"t": "The interagency transfer form used when a patient moves between two facilities", "c": false, "r": "Transfer forms document moves between facilities, not the right to refuse treatment."}], "tp": "Medicare and Medicaid facilities must present advance directive information and refer requests to the appropriate resource."});

BANK.push({"cat": CB, "type": "single", "kt": [], "stem": "Admission data pulled from the electronic health record shows an old address and a stopped medication. Which action should the admitting nurse take?", "opts": [{"t": "Verify the record information with the patient so the data are current and accurate", "c": true, "r": "Correct. Framework: Nursing Process, assessment validation. The admitting department and nurse must verify EHR information with the patient."}, {"t": "Use the record as printed because electronic data are always current and accurate", "c": false, "r": "The guide requires verification precisely because record data may be outdated."}, {"t": "Delete the entire admission form and restart it from a blank paper form instead", "c": false, "r": "Verification and correction are required, not wholesale deletion of the record."}, {"t": "Ask the next shift to verify the information during the morning medication pass", "c": false, "r": "Verification belongs to the admission process, not a deferred next-shift task."}], "tp": "The EHR expedites admission, but staff verify its data with the patient for currency and accuracy."});

BANK.push({"cat": CB, "type": "dropdown", "kt": [], "stem": "Two patients arrive at the same time. Complete each arrival setup correctly. [[0]] [[1]]", "blanks": [{"o": [{"t": "Set the bed in the high position for the patient arriving on a stretcher now", "c": true, "r": "Correct. Stretcher arrivals use the high bed position."}, {"t": "Set the bed in the low position for the patient arriving on a stretcher now", "c": false, "r": "Low position is for wheelchair or walking arrivals."}, {"t": "Set the bed flat without height change for the patient arriving by stretcher", "c": false, "r": "The guide specifies high position, not an unchanged flat bed."}]}, {"o": [{"t": "Set the bed in the low position for the patient arriving by wheelchair today", "c": true, "r": "Correct. Wheelchair or walking arrivals use the low bed position."}, {"t": "Set the bed in the high position for the patient arriving by wheelchair today", "c": false, "r": "High position fits stretcher arrivals, not wheelchair arrivals."}, {"t": "Raise the head fully upright for the patient arriving by wheelchair today", "c": false, "r": "Head elevation is not the arrival height rule for this method."}]}], "tp": "Bed position by arrival method is a classic trap: high for stretcher, low for wheelchair or walking."});

BANK.push({"cat": CC, "type": "single", "kt": [], "stem": "A patient is admitted in critical condition, blood pressure 84/52, pulse 128, respirations 28. The family is upset that the full health history is not being taken. Which explanation is correct?", "opts": [{"t": "Only the most pertinent information is collected now and the rest is obtained later", "c": true, "r": "Correct. Framework: ABCs and acute vs chronic priority. In critical condition, only the most pertinent information is collected immediately; remaining information comes later."}, {"t": "The full history must be completed before any ordered care can begin for the patient", "c": false, "r": "Completing a full history first would delay urgent care for an unstable patient."}, {"t": "The history will be skipped entirely because critical patients do not need one done", "c": false, "r": "The history is deferred, not skipped; remaining information is obtained later."}, {"t": "The family must complete the entire history alone in the waiting room right away", "c": false, "r": "Family can supply information, but the guide plan is pertinent data now and the rest later."}], "tp": "Critical admission: pertinent data immediately, care as ordered begins, full data collection follows when the patient stabilizes."});

BANK.push({"cat": CC, "type": "single", "kt": [], "stem": "During admission questioning, the nurse suspects abuse. The patient glances at her partner before every answer. Which action should the nurse take?", "opts": [{"t": "Provide privacy and ask family members to leave the room during the questioning", "c": true, "r": "Correct. Framework: safety first. Privacy lets the patient answer openly and honestly without fear of the family member hearing the answers."}, {"t": "Continue the questioning with the partner present so answers can be confirmed fast", "c": false, "r": "A suspected abuser in the room silences honest answers; privacy is the Skill 11.1 step."}, {"t": "Postpone all admission questions until a social worker visits on the following day", "c": false, "r": "The step is to provide privacy during this admission, not to abandon the assessment."}, {"t": "Ask the partner to step out only if the patient verbally requests it in front of him", "c": false, "r": "Requiring the patient to request it in front of the partner defeats the protection."}], "tp": "Skill 11.1 step 9: provide privacy if the patient desires or abuse is suspected; invite family back once the patient is settled."});

    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
