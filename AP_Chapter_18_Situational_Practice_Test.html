<script>
/* ============ QUESTION BANK (HARD / BRUTAL MODE) ============ */
/* Herlihy Chapter 18: Anatomy of the Blood Vessels and Special Circulations — situational practice test.
   Brutal clinical vignettes only; facts strictly from the verified Ch 18 study guide content. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Two Circuits and Vessel Classes";
var CB = "Vessel Layers and Vessel Jobs";
var CC = "The Aorta and Arterial Branches";
var CD = "Veins and Venous Return";
var CE = "Head and Brain Circulation";
var CF = "Hepatic Portal Circulation";
var CG = "Fetal Circulation";
var CH = "Pulse Assessment";
var CATS = [CA, CB, CC, CD, CE, CF, CG, CH];
var KEYTERMS = ["Pulmonary circulation", "Systemic circulation", "Capillaries", "Tunica media", "Resistance vessels", "Capacitance vessels", "Venous valves", "Skeletal muscle pump", "Aorta", "Brachiocephalic artery", "Dorsalis pedis artery", "Median cubital vein", "Great saphenous vein", "Jugular vein distention (JVD)", "Venous hum", "Esophageal varices", "Subclavian steal syndrome", "Hepatic portal system", "Kupffer cells", "Umbilical vein", "Ductus venosus", "Foramen ovale", "Ductus arteriosus", "Pulse deficit"];
var BLUEPRINT = {
  CA: { name: CA, count: 3 }, CB: { name: CB, count: 5 }, CC: { name: CC, count: 8 },
  CD: { name: CD, count: 13 }, CE: { name: CE, count: 5 }, CF: { name: CF, count: 4 },
  CG: { name: CG, count: 5 }, CH: { name: CH, count: 4 }
};

BANK.push({ cat: CA, type: "single", kt: ["Capillaries"],
  stem: "A nursing student asks why the blood a nurse draws from a patient's vein looks darker and more bluish than blood seen in a pulsing arterial bleed. Which explanation by the nurse is correct?",
  opts: [
    O("At the capillary level the blood gave up its oxygen to the tissues, so the blood leaving the tissues in the veins is oxygen-poor and bluish", true, "Exchange happens in the capillaries: blood surrenders oxygen to the tissues there, so venous blood downstream is unoxygenated and appears bluish — the figures show capillary color running red to purple to blue for this reason."),
    O("The vein walls stain the blood a darker color as it passes through the valves on its way back toward the heart", false, "Valves direct flow and prevent backflow; they do not change the blood's color. The color change comes from oxygen being given up at the capillaries."),
    O("Blood turns blue because venous pressure drops to almost zero, and low pressure changes the color of hemoglobin", false, "Venous pressure does fall to almost 0 mm Hg, but pressure does not set the color — loss of oxygen at the tissue capillaries does."),
    O("The blood is darker because the lungs add carbon dioxide to it each time it passes through the pulmonary circuit", false, "Carbon dioxide is unloaded (removed) at the lungs in the pulmonary circuit, not added; the dark venous color reflects oxygen surrendered to the tissues systemically.")
  ],
  tp: "Capillaries surrender oxygen to tissues, so blood leaving the tissues is oxygen-poor and bluish in the veins. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "multi", kt: ["Systemic circulation", "Pulmonary circulation"],
  stem: "A nurse is teaching a newly diagnosed cardiac patient how the two circulations divide the work of the circuit. Which statements should the nurse include? Select all that apply.",
  opts: [
    O("The pulmonary circulation loads oxygen and unloads carbon dioxide as blood passes through the lungs.", true, "Pulmonary circulation carries oxygen-poor blood from the right ventricle to the lungs, where oxygen is loaded and carbon dioxide is unloaded."),
    O("The systemic circulation delivers oxygen and nutrients to the cells and picks up carbon dioxide and waste.", true, "The systemic circuit supplies the rest of the body, delivering oxygen and nutrients and collecting carbon dioxide and waste products."),
    O("A capillary lies close to every cell, so each cell receives a continuous supply of oxygen and nutrients.", true, "Because capillaries are so numerous, one is close to every cell, giving every cell a continuous supply."),
    O("The systemic circulation is the smaller of the two circuits and serves only the heart muscle itself.", false, "Systemic is the LARGER circulation serving the rest of the body; the heart muscle is supplied by the coronary arteries off the ascending aorta."),
    O("The pulmonary circulation returns oxygenated blood to the right side of the heart to be pumped to the body.", false, "Oxygenated pulmonary blood returns to the LEFT side of the heart; the right side receives unoxygenated venous return.")
  ],
  tp: "Pulmonary: right ventricle → lungs (load O2, unload CO2) → left heart. Systemic: the larger circuit serving every cell via nearby capillaries. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "order",
  stem: "A drop of oxygenated blood leaves the left ventricle on its way to a toe and back. Place the vessel classes it passes through in the correct order.",
  items: [
    { t: "Arteries, conducting blood away from the heart under high pressure", r: "Blood leaving the heart travels first through the arteries, the conductance vessels." },
    { t: "Arterioles, whose smooth muscle adjusts diameter and resistance", r: "Large arteries branch into smaller arteries and finally the arterioles, the resistance vessels." },
    { t: "Capillaries, where oxygen, nutrients, gases, and wastes are exchanged", r: "Capillaries receive blood from the arterioles and perform exchange with the interstitial fluid." },
    { t: "Venules, the smallest veins collecting blood from the capillaries", r: "Blood leaving the capillaries enters the venules, the smallest veins." },
    { t: "Veins, returning blood to the right atrium with the help of valves and muscle pumps", r: "Venules converge into larger veins, and the largest veins empty into the right atrium." }
  ],
  tp: "Flow order: artery → arteriole → capillary → venule → vein → right atrium. Classes are set by direction of flow. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single",
  stem: "During a procedure, a nicked artery spurts blood forcefully with each heartbeat while a nicked vein oozes slowly and steadily. Which vessel property best explains the difference the nurse observes?",
  opts: [
    O("Arteries have thick, tough, elastic walls built to withstand the high pressure of blood pumped from the ventricles, while venous pressure falls to almost 0 mm Hg", true, "The large arteries' thick elastic walls match their high-pressure conductance role; veins are low-pressure storage vessels, so their bleeding oozes rather than spurts."),
    O("Arteries contain one-way valves that snap open with each heartbeat, while veins have no valves to control the flow of blood", false, "Valves are a venous feature, not an arterial one — most veins contain one-way valves; the pressure difference, not valves, explains spurting versus oozing."),
    O("Arteries are located superficially where they are easy to nick, while veins run deep and protected so they bleed less", false, "The pattern is reversed: arteries usually run deep and protected while many veins are superficial — and depth does not explain the force of the bleeding."),
    O("Arterial blood is thicker than venous blood because it carries more oxygen, so it is pushed out in visible spurts", false, "Oxygen content changes blood color, not thickness or spurting; the spurts track ventricular ejection pressure in a high-pressure vessel.")
  ],
  tp: "Spurting = high arterial pressure in thick elastic walls; oozing = venous pressure near 0 mm Hg. Structure matches pressure. [Framework: Safety First]" });

BANK.push({ cat: CB, type: "single", kt: ["Resistance vessels"],
  stem: "A patient's arterioles are widely dilated after rewarming. The nurse explains to a student what this means for blood flow. Which statement is correct?",
  opts: [
    O("A wider arteriole offers less resistance, so blood flows through it more easily than through a narrowed one", true, "Arterioles change diameter by contracting and relaxing: a dilated vessel offers less resistance and a constricted vessel offers increased resistance — the resistance-vessel role."),
    O("A wider arteriole offers more resistance, because a larger opening lets more blood press against the vessel walls", false, "The relationship runs the other way: narrow vessels increase resistance, wide vessels decrease it."),
    O("Arteriole diameter does not affect resistance at all, because resistance is set entirely by the thickness of the tunica media", false, "Diameter changes from the media's smooth muscle contracting and relaxing are precisely how arterioles alter resistance to flow."),
    O("A wider arteriole stores more blood for the tissues, because dilated arterioles act as the body's capacitance vessels", false, "Storage (capacitance) is the veins' role — about 70% of blood volume sits on the venous side; arterioles regulate resistance.")
  ],
  tp: "Dilated arteriole = less resistance; constricted = more. Arterioles are the adjustable resistance vessels. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "multi", kt: ["Skeletal muscle pump", "Venous valves"],
  stem: "A 78-year-old patient who sits in a chair most of the day reports that her ankles swell by evening and her legs feel heavy. Which teaching points should the nurse give her? Select all that apply.",
  opts: [
    O("Walk regularly during the day, because contracting leg muscles squeeze the large veins and push blood toward the heart.", true, "The skeletal muscle pump only works when muscles contract; walking opens the venous valves and forces blood heartward, improving venous return."),
    O("Do ankle-pump and leg exercises while sitting, because muscle contraction moves venous blood even without walking.", true, "Any contraction of the leg muscles surrounding the large veins activates the pump and helps return blood from the legs."),
    O("Avoid sitting motionless for long stretches, because pooled blood in the legs promotes stagnation and clot formation.", true, "Exercise improves venous return and prevents stagnation of blood and thrombosis; motionless sitting lets blood pool in the low-pressure veins."),
    O("Keep the legs perfectly still as much as possible, because movement wears out the one-way valves in the veins.", false, "Valves are opened BY muscle contraction; stillness, not movement, is the problem — relaxed muscles let flow slow until the valves close."),
    O("Expect the swelling because venous pressure in the legs is higher than arterial pressure by the end of the day.", false, "Venous pressure is much LOWER than arterial — near 0 mm Hg — which is exactly why the legs need the muscle pump's outside help.")
  ],
  tp: "Evening ankle swelling in a sitter = a quiet muscle pump. Walking and ankle pumps reopen valves and return blood; stillness invites stagnation and thrombosis. [Framework: Safety First]" });

BANK.push({ cat: CB, type: "single", kt: ["Venous valves"],
  stem: "A cashier who stands at a register for 10-hour shifts asks why her legs, rather than her arms, are developing distended, twisted superficial veins. Which explanation by the nurse is best?",
  opts: [
    O("Leg veins carry the most one-way valves because blood must climb from the ankles against gravity, and long motionless standing lets blood pool and stretch those superficial veins", true, "Valves are most numerous in the lower extremities, where they prevent backflow and move blood up from the ankles; prolonged standing pools blood in superficial leg veins until they become distended and twisted — varicose veins."),
    O("Leg veins contain no valves at all, so blood falls backward all day and stretches the superficial veins of the legs", false, "Leg veins have the MOST valves, not none; the problem is pooling against gravity during motionless standing, not absent valves."),
    O("Arteries in the legs pump extra blood into the superficial veins during standing, and the added arterial pressure twists them", false, "Arteries do not pump blood into veins; arterial and venous systems meet only at the capillaries, and venous pooling is a low-pressure phenomenon."),
    O("The superficial veins of the legs are actually arterioles that dilated after years of standing, which makes them look twisted", false, "Varicose veins are veins — distended and twisted superficial VEINS; arterioles are small muscular arteries and are not the vessels involved.")
  ],
  tp: "Varicose veins form in superficial leg veins where valves fight gravity; motionless standing pools blood and stretches the walls. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single", kt: ["Capacitance vessels"],
  stem: "A patient who has lost a significant amount of blood is compensating: the chart notes the veins are constricted. The nurse explains this compensation to the family. Which statement is accurate?",
  opts: [
    O("About 70% of the blood volume is stored on the venous side, and venoconstriction moves that stored blood to the heart for circulation", true, "Veins are capacitance (storage) vessels holding about 70% of total blood volume; when stored blood is needed, the veins constrict and move it to the heart."),
    O("About 70% of the blood volume is stored in the arterioles, and their constriction pushes stored blood into the capillaries", false, "Storage is venous, not arteriolar — arterioles regulate resistance; the 70% reservoir sits on the venous side of the circulation."),
    O("The veins constrict to raise venous pressure above arterial pressure so the heart receives blood faster than it ejects it", false, "Venoconstriction mobilizes stored volume; it does not raise venous pressure above arterial pressure — venous pressure is normally near 0 mm Hg."),
    O("The veins constrict because their valves have failed, and the constriction is a sign the compensation is breaking down", false, "Venoconstriction here is the compensation itself — a normal capacitance response that shifts stored blood centrally when it is needed.")
  ],
  tp: "Capacitance in action: blood loss → venoconstriction releases the venous reservoir (about 70% of volume) to the heart. [Framework: Stable vs Unstable]" });

BANK.push({ cat: CC, type: "single",
  stem: "After a cardiac catheterization through the wrist, the nurse will assess the patient's radial pulse every 15 minutes. Why is the radial artery practical for this repeated assessment?",
  opts: [
    O("The distal radial artery comes close to the surface at the wrist, making its pulse easy to palpate repeatedly", true, "The radial artery runs close to the surface at the wrist — which is why the radial pulse is the site most often used for pulse assessment."),
    O("The radial artery is the largest artery in the body, so its pulse remains palpable even when other pulses disappear", false, "The aorta is the largest artery (garden-hose diameter); the radial is a small forearm artery chosen because it lies close to the surface at the wrist."),
    O("The radial artery carries blood that has not yet mixed with venous blood, so it gives the purest pulse reading", false, "Arterial blood does not mix with venous blood in a normal circuit at all; site choice is about surface closeness, not purity."),
    O("The radial artery is a superficial vein at the wrist, so it can be checked without disturbing the catheter dressing", false, "The radial is an ARTERY — the continuation of the brachial division at the elbow — not a superficial vein.")
  ],
  tp: "Radial pulse works because the distal radial artery lies close to the surface at the wrist. Site choice follows anatomy. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["Brachiocephalic artery"],
  stem: "A patient studying her anatomy diagram asks why it shows a brachiocephalic artery only on the right side. Which answer by the nurse is correct?",
  opts: [
    O("There is no left brachiocephalic artery; on the left, the common carotid and subclavian arteries arise directly from the aortic arch", true, "The brachiocephalic exists only on the right, giving off the right common carotid and right subclavian; the left common carotid and left subclavian branch directly from the arch."),
    O("The left brachiocephalic artery is present but hidden behind the heart in most diagrams, so artists usually leave it out", false, "It is not a drawing omission — anatomically there is no left brachiocephalic artery; the left-sided branches come straight off the arch."),
    O("There is no left brachiocephalic VEIN either, so the entire left side drains through the azygos vein into the vena cava", false, "There IS a left brachiocephalic vein; the asymmetry rule applies to the artery, and the azygos drains the thorax, not the left head and arm."),
    O("The left brachiocephalic artery was present before birth but closed with the other fetal structures after delivery", false, "The fetal structures that close are the ductus venosus, foramen ovale, and ductus arteriosus — the brachiocephalic pattern is simply right-sided from the start.")
  ],
  tp: "Right-only brachiocephalic artery; left common carotid + left subclavian come directly off the arch. (Left brachiocephalic vein DOES exist.) [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single",
  stem: "A pre-nursing student traces the brachial artery back to the aorta on a model. Which chain shows the correct indirect route the chapter describes?",
  opts: [
    O("Aorta → arch → brachiocephalic artery → subclavian artery → axillary artery → brachial artery", true, "The brachial arises indirectly: aorta to arch to brachiocephalic to subclavian to axillary, then entering the arm as the brachial artery."),
    O("Aorta → ascending aorta → coronary artery → subclavian artery → axillary artery → brachial artery", false, "The coronary arteries branch into the heart muscle itself and end there — no blood reaches the arm through a coronary artery."),
    O("Aorta → arch → left common carotid artery → subclavian artery → axillary artery → brachial artery", false, "The left common carotid ascends to the head and neck; the right-sided route to the arm runs through the brachiocephalic artery."),
    O("Aorta → descending aorta → axillary artery → subclavian artery → brachial artery", false, "The descending aorta heads down through the trunk, and the order is subclavian BEFORE axillary on the way to the arm.")
  ],
  tp: "Brachial route: aorta → arch → brachiocephalic → subclavian → axillary → brachial. Coronaries, by contrast, arise directly from the ascending aorta. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["Dorsalis pedis artery"],
  stem: "A 64-year-old patient with diabetes is admitted for a foot ulcer. The nurse cannot palpate a dorsalis pedis pulse on the affected foot. Which action should the nurse take first?",
  opts: [
    O("Assess the posterior tibial pulse and compare both feet, then report the absent dorsalis pedis pulse to the provider", true, "An absent pulse can mean the artery is blocked or occluded; with poor arterial circulation to the feet — common in patients with diabetes — the dorsalis pedis may be undetectable, so complete the foot circulation assessment and report it."),
    O("Document 'dorsalis pedis absent, expected in diabetes' and continue routine care without further assessment", false, "An undetectable dorsalis pedis in a patient with a foot ulcer is a circulation finding that must be fully assessed and reported, not normalized away."),
    O("Massage the foot vigorously to stimulate the anterior tibial artery until the pulse becomes palpable", false, "Massage cannot reopen an occluded artery, and vigorous rubbing risks damaging an already compromised, ulcerated foot."),
    O("Apply a heating pad to the foot to dilate the vessels and recheck the pulse in one hour", false, "Delaying a full assessment for an hour postpones reporting a possible occlusion; assess the other foot pulses and notify the provider now.")
  ],
  tp: "Absent dorsalis pedis in a diabetic foot = possible arterial occlusion. Finish the pulse comparison and report it — do not normalize it. [Framework: Safety First]" });

BANK.push({ cat: CC, type: "multi",
  stem: "The nurse reviews a diagram of the abdominal aorta with a student. Which branches should the student identify as arising from the abdominal aorta? Select all that apply.",
  opts: [
    O("The celiac trunk, dividing into the gastric, splenic, and hepatic arteries", true, "The celiac trunk is an abdominal aorta branch supplying stomach, spleen, and liver through its three divisions."),
    O("The superior mesenteric artery, supplying most of the small intestine and part of the large intestine", true, "The superior mesenteric artery is an abdominal aorta branch to the midgut territory described in the chapter."),
    O("The inferior mesenteric artery, supplying the other part of the large intestine", true, "The inferior mesenteric artery arises from the abdominal aorta to supply the remaining large intestine."),
    O("The two renal arteries, supplying the right and left kidneys, with gonadal and lumbar branches nearby", true, "The paired renal arteries branch from the abdominal aorta to the kidneys, along with gonadal and lumbar branches."),
    O("The intercostal arteries, supplying the intercostal muscles between the ribs and the organs of the thorax", false, "Intercostal arteries arise from the THORACIC aorta above the diaphragm, not from the abdominal aorta."),
    O("The coronary arteries, supplying oxygenated blood to the myocardium of the heart in both ventricles", false, "The coronary arteries arise from the ASCENDING aorta just beyond the aortic semilunar valve, far above the abdomen.")
  ],
  tp: "Abdominal aorta branches: celiac trunk, superior + inferior mesenteric, renal (plus gonadal, lumbar). Intercostals = thoracic; coronaries = ascending. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single",
  stem: "A patient recovering from a procedure behind the knee (popliteal region) asks why the nurse keeps checking the pulse on the top of his foot. Which response is best?",

  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
