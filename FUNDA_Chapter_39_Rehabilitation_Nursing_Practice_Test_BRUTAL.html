 }
};

BANK.push({"cat": CA, "type": "single", "stem": "A 58-year-old patient 3 weeks after a stroke says, 'Just do everything for me; I will never manage on my own.' The patient's left hand can grip a washcloth and the right side is strong. Which of the following actions should the nurse take first?", "tp": "Focus on abilities rather than disabilities: make the most of what remains intact. Framework: Nursing Process/ADPIE.", "opts": [{"t": "Ask the family to perform all hygiene care during their afternoon visiting hours today", "c": false, "r": "Incorrect. Family participation is encouraged, but the patient's own practice builds the independence targeted."}, {"t": "Set up bathing supplies and have the patient wash with the strong side, assisting only as needed", "c": true, "r": "Correct. Rehabilitation focuses on abilities that remain intact and builds independence from them. Framework: Maslow (self-esteem through mastery) with safety first."}, {"t": "Complete the full bed bath for the patient so therapy time is not lost this morning", "c": false, "r": "Incorrect. Doing the task for the patient reinforces dependence and wastes the abilities that remain intact."}, {"t": "Tell the patient that recovery depends entirely on attitude and leave the supplies nearby", "c": false, "r": "Incorrect. Encouragement alone, without structured use of remaining abilities, is not rehabilitation care."}]});

BANK.push({"cat": CA, "type": "single", "stem": "A patient is admitted to a rehabilitation unit at 10:00 on Monday after a hip fracture. By which time must the interdisciplinary team have the comprehensive plan ready for review and revision?", "tp": "Comprehensive plan: initiated within 24 hours of admission; ready for review and revision within 3 days. Framework: Nursing Process/ADPIE.", "opts": [{"t": "At discharge, when the home environment is fully known to the team", "c": false, "r": "Incorrect. The plan reflects the discharge environment from the start and is reviewed within 3 days."}, {"t": "The following Monday, within 1 week of admission to the unit", "c": false, "r": "Incorrect. One week exceeds the 3-day review and revision deadline."}, {"t": "Tuesday, within 24 hours of the patient's admission to the unit", "c": false, "r": "Incorrect. Twenty-four hours is the deadline to initiate the plan, not to have it ready for review."}, {"t": "Thursday, within 3 days of the patient's admission to the unit", "c": true, "r": "Correct. The plan, initiated within 24 hours, must be ready for team review and revision within 3 days of admission. Framework: Nursing Process/ADPIE (planning)."}]});

BANK.push({"cat": CA, "type": "single", "stem": "A rehabilitation team reviews a goal written as 'Patient will get better soon.' Which revision makes the goal acceptable for the comprehensive plan of care?", "tp": "Plan goals: measurable, functional or behavioral, time-framed, responsible member listed, reflecting the discharge environment. Framework: Nursing Process/ADPIE.", "opts": [{"t": "Add the patient's diagnosis to the goal so the medical problem is clearly identified", "c": false, "r": "Incorrect. A diagnosis does not make a goal measurable or functional in wording."}, {"t": "Move the goal to the discharge summary so the home setting can shape its wording", "c": false, "r": "Incorrect. The plan reflects the discharge environment now; the goal itself still needs measurement and a time frame."}, {"t": "Rewrite it as a measurable, functional goal with a stated time frame for achievement", "c": true, "r": "Correct. Goals must be measurable, described in functional or behavioral terms, and have associated time frames. Framework: Nursing Process/ADPIE (planning)."}, {"t": "Keep the wording but assign two team members to share responsibility for the goal", "c": false, "r": "Incorrect. Listing responsible members is required, but it does not fix an unmeasurable, timeless goal."}]});

BANK.push({"cat": CA, "type": "single", "stem": "A 71-year-old with Parkinson disease has attended rehabilitation for 2 months. Function has plateaued, but the patient now dresses independently and reports enjoying weekly community outings. Which statement indicates an understanding of the rehabilitation goals?", "tp": "Cornerstones: quality of life over quantity, community reentry, independence, functional outcomes. Framework: Maslow.", "opts": [{"t": "'Success here means the team will keep doing my dressing until I feel ready.'", "c": false, "r": "Incorrect. Independence in dressing is itself a functional outcome to maintain, not hand back."}, {"t": "'Success here means I stay alive longer, whatever my daily function looks like.'", "c": false, "r": "Incorrect. Goals focus on improving quality of life rather than increasing quantity of life."}, {"t": "'Success here means my quality of life and community participation, not a cure.'", "c": true, "r": "Correct. Goals target quality of life, function, and community reentry rather than cure or quantity of life. Framework: Maslow (self-actualization)."}, {"t": "'Success here means my disease will be reversed if I keep attending therapy.'", "c": false, "r": "Incorrect. Many rehabilitation conditions are irreversible; the focus is adaptation to the condition."}]});

BANK.push({"cat": CA, "type": "multi", "stem": "A nurse plans care for a newly admitted rehabilitation patient with a chronic, disabling condition. Which actions belong in the initial plan? Select all that apply.", "tp": "Assessment by observation of ADLs; patient and family at the center; conferences held regularly. Framework: Nursing Process/ADPIE.", "opts": [{"t": "Write goals around the patient's unique strengths, needs, abilities, and preferences", "c": true, "r": "Correct. Individual goals incorporate the patient's unique strengths, needs, abilities, and preferences."}, {"t": "Delay all planning until the patient's function stops changing from day to day", "c": false, "r": "Incorrect. The comprehensive plan is initiated within 24 hours of admission, not delayed for stability."}, {"t": "Schedule evaluation and family conferences on a regular basis during the program", "c": true, "r": "Correct. Evaluation conferences and family conferences take place regularly."}, {"t": "Include the patient and family as active participants in planning the care program", "c": true, "r": "Correct. Active participation of patient and family is integral to planning and to the discharge process."}, {"t": "Assess the patient's ability to perform ADLs safely, by observing tasks such as bathing", "c": true, "r": "Correct. Assessment is best done by observing the patient complete basic tasks; this sets the level of independence. Framework: Nursing Process/ADPIE (assessment)."}]});

BANK.push({"cat": CA, "type": "order", "stem": "A nurse is following the chapter's five-step education approach for a patient learning wheelchair transfers. Place the steps in the correct order.", "tp": "Five-step education approach: assess, plan, implement, document, evaluate and revise. Framework: Nursing Process/ADPIE.", "items": [{"t": "Assess the patient's and the family's needs, abilities, and concerns first", "r": "Step 1: assess needs, abilities, and concerns. Framework: Nursing Process/ADPIE."}, {"t": "Plan interventions on the basis of those needs, abilities, and concerns", "r": "Step 2: plan interventions based on the assessment."}, {"t": "Implement the educational plan with the patient and the family involved", "r": "Step 3: implement the educational plan."}, {"t": "Document the educational process in the patient's record as required", "r": "Step 4: document the educational process."}, {"t": "Evaluate the learning and revise the educational plan as needed next", "r": "Step 5: evaluate and revise the plan."}]});

BANK.push({"cat": CA, "type": "single", "stem": "A patient with multiple sclerosis asks why rehabilitation is being offered when the condition cannot be cured. Which response by the nurse is most accurate?", "tp": "Care versus cure: many conditions are irreversible, so care focuses on adaptation. Framework: Maslow.", "opts": [{"t": "'Rehabilitation focuses on adapting to the condition and maximizing the function you have.'", "c": true, "r": "Correct. Care versus cure: irreversible conditions shift the focus to adaptation rather than resolution. Framework: Nursing Process/ADPIE (implementation)."}, {"t": "'Rehabilitation will return you to exactly the life you had before this diagnosis.'", "c": false, "r": "Incorrect. Goals are reshaped realistically; adaptation, not exact restoration, is the target for irreversible conditions."}, {"t": "'Rehabilitation is mainly a way to reduce the cost of your long-term care over time.'", "c": false, "r": "Incorrect. Cost is an issue in rehabilitation, but the patient's benefit is adaptation and function."}, {"t": "'Rehabilitation continues your treatment until the underlying disease process is cured.'", "c": false, "r": "Incorrect. That promises a cure the chapter's care-versus-cure issue explicitly does not assume."}]});

BANK.push({"cat": CA, "type": "single", "stem": "A hospital administrator questions the cost of starting rehabilitation in the first days of a patient's illness. Which benefit should the nurse cite from the chapter?", "tp": "Planning should ideally begin in the first days of illness; early entry is beneficial. Framework: Nursing Process/ADPIE.", "opts": [{"t": "Early entry removes the need for the interdisciplinary team in later phases", "c": false, "r": "Incorrect. The interdisciplinary team remains central throughout rehabilitation."}, {"t": "Early entry allows the family to stop participating in the patient's care plan", "c": false, "r": "Incorrect. Family participation is integral, especially through discharge planning."}, {"t": "Early entry guarantees the patient will return to productive employment later", "c": false, "r": "Incorrect. Return to employment is one possible view of success, never a guarantee."}, {"t": "Early entry reduces ICU and acute-care length of stay and lessens declines", "c": true, "r": "Correct. Early rehabilitation brings cost savings through reduced ICU and acute-care stays and lessens physical or mental declines. Framework: safety first (preventing decline)."}]});

BANK.push({"cat": CB, "type": "single", "stem": "During a team conference, a patient's exercise program needs redesign, equipment for independent living needs review, and swallowing must be reassessed. Which assignment of tasks is correct?", "tp": "Table 39.1 roles: PT = exercise; OT = independent living and equipment; speech-language pathologist = communication and swallowing. Framework: Nursing Process/ADPIE.", "opts": [{"t": "Physical therapist redesigns exercise, occupational therapist reviews equipment, speech-language pathologist reassesses swallowing", "c": true, "r": "Correct. PT designs exercise programs, OT assesses independent living needs and adapts equipment, and the speech-language pathologist assesses communication and swallowing. Framework: Nursing Process/ADPIE (planning)."}, {"t": "Clinical psychologist redesigns exercise, recreation therapist reviews equipment, physiatrist reassesses swallowing today", "c": false, "r": "Incorrect. The psychologist evaluates emotional status and the recreation therapist plans leisure activities."}, {"t": "Rehabilitation RN redesigns exercise, chaplain reviews equipment, vocational counselor reassesses swallowing this week", "c": false, "r": "Incorrect. None of those assignments matches Table 39.1 roles."}, {"t": "Occupational therapist redesigns exercise, physical therapist reviews equipment, rehabilitation RN reassesses swallowing today", "c": false, "r": "Incorrect. That rotates each task to the wrong discipline."}]});

BANK.push({"cat": CB, "type": "single", "stem": "A night-shift rehabilitation nurse notices a patient's new, slight change in swallowing during an evening snack that no daytime discipline has documented. Which action best reflects the rehabilitation nurse's unique contribution?", "tp": "Rehabilitation nurses reinforce teaching 24/7 and notice small changes because of constant exposure. Framework: safety first.", "opts": [{"t": "Ask the family to watch swallowing at meals so the nurse can cover other patients tonight", "c": false, "r": "Incorrect. Observation for safety changes is a nursing responsibility, not delegated to visitors."}, {"t": "Wait for the speech-language pathologist's next scheduled visit before mentioning the change", "c": false, "r": "Incorrect. A swallowing change is a safety issue to report now, not at the next scheduled visit."}, {"t": "Document and report the change, then reinforce the team's swallowing precautions overnight", "c": true, "r": "Correct. Nurses are with the patient 24 hours a day and notice small, often imperceptible changes; they reinforce other disciplines' teaching around the clock. Framework: safety first."}, {"t": "Change the patient's diet consistency independently and inform the team at discharge", "c": false, "r": "Incorrect. Diet changes belong to the team plan; the nurse reports and reinforces, and discharge is far too late."}]});

BANK.push({"cat": CB, "type": "single", "stem": "A rehabilitation unit wants to move from summed, discipline-specific outcomes toward shared goals with problem solving that crosses discipline lines, while each discipline still does its own work. Which model is the unit adopting?", "tp": "Interdisciplinary = most common today; multidisciplinary = bounded and summed; transdisciplinary = blurred and cross-trained. Framework: Nursing Process/ADPIE.", "opts": [{"t": "The interdisciplinary model, the one most commonly used in rehabilitation hospitals today", "c": true, "r": "Correct. Interdisciplinary teams collaborate on goals, expand problem solving beyond discipline boundaries, and keep discipline-specific work toward attainment. Framework: Nursing Process/ADPIE (planning)."}, {"t": "The multidisciplinary model, the older model defined by clear boundaries between disciplines", "c": false, "r": "Incorrect. Multidisciplinary outcomes are the sum of each discipline's efforts, which is what the unit is leaving."}, {"t": "The primary nursing model, defined by one nurse coordinating all care around the clock daily", "c": false, "r": "Incorrect. That is not one of the three rehabilitation team models in the chapter."}, {"t": "The transdisciplinary model, defined by blurred boundaries and cross-training of all members", "c": false, "r": "Incorrect. The unit is not blurring boundaries or cross-training; disciplines keep their own work."}]});

BANK.push({"cat": CB, "type": "multi", "stem": "Which statements by a new rehabilitation nurse show an understanding of the role? Select all that apply.", "tp": "Rehabilitation nursing is also an attitude: intrinsic worth transcends the disability. Framework: Maslow.", "opts": [{"t": "'I provide comfort, therapy, and education and support adaptive capabilities.'", "c": true, "r": "Correct. Rehabilitation nurses provide comfort, therapy, and education and promote achievable independence."}, {"t": "'I reinforce the other disciplines' teaching around the clock, every day of the week.'", "c": true, "r": "Correct. Round-the-clock reinforcement of teaching is the rehabilitation nurse's essential contribution. Framework: Nursing Process/ADPIE (implementation)."}, {"t": "'I offer encouragement regularly and put the patient in charge of his own care.'", "c": true, "r": "Correct. Encouragement and putting the individual in charge, rather than taking charge, define the role's attitude."}, {"t": "'I take over tasks the patient finds frustrating so progress is never slowed down.'", "c": false, "r": "Incorrect. Taking over contradicts putting the patient in charge of own care."}, {"t": "'I work only on the rehabilitation unit, since this specialty has no other settings.'", "c": false, "r": "Incorrect. Rehabilitation nursing spans clinics, home health, hospitals, skilled nursing, and other settings."}]});

BANK.push({"cat": CB, "type": "single", "stem": "A patient tells the rehabilitation nurse, 'I want to practice my dressing skills in the evening too, not just in morning therapy.' Which role is the nurse fulfilling by working this request into the plan of care?", "tp": "Box 39.2: educator, provider of care, collaborator, patient advocate. Framework: Nursing Process/ADPIE.", "opts": [{"t": "Provider of care, performing a holistic assessment and overseeing physical care", "c": false, "r": "Incorrect. The action is advocacy about the patient's wishes, not assessment or physical care."}, {"t": "Educator, reinforcing teaching delivered by other members of the health care team", "c": false, "r": "Incorrect. No teaching content is being reinforced in this action."}, {"t": "Patient advocate, listening to the patient's wishes and incorporating the request", "c": true, "r": "Correct. The advocate actively listens to needs and wishes and seeks to incorporate the patient's requests in the plan. Framework: Nursing Process/ADPIE (planning)."}, {"t": "Collaborator, streamlining the interactions of the health care team members", "c": false, "r": "Incorrect. Collaboration concerns team interactions and realistic goals, not this specific request."}]});

BANK.push({"cat": CB, "type": "dropdown", "stem": "A team is documenting roles for a new admission. Complete the assignments: The team leader and program coordinator is the [[0]], and the member listed as the key member of the team is the [[1]].", "tp": "Physiatrist leads; patient is the key member who participates in goal setting. Framework: Nursing Process/ADPIE.", "blanks": [{"o": [{"t": "physiatrist, the rehabilitation physician on the team", "c": true, "r": "Correct. The physiatrist is team leader and coordinator of the program. Framework: Nursing Process/ADPIE."}, {"t": "rehabilitation RN, the coordinator and educator here", "c": false, "r": "Incorrect. The RN coordinates care and educates, but the physician team leader is the physiatrist."}, {"t": "clinical psychologist, the emotional evaluator on staff", "c": false, "r": "Incorrect. The psychologist assesses the mental health continuum, not team leadership."}]}, {"o": [{"t": "patient, who participates in goal setting for the plan", "c": true, "r": "Correct. The patient is the key member, participates in goal setting, and takes control of own life. Framework: Nursing Process/ADPIE."}, {"t": "family, who directs all goal setting for the care plan", "c": false, "r": "Incorrect. The family is central and participates, but the key member listed is the patient."}, {"t": "physiatrist, who sets every goal for the care plan alone", "c": false, "r": "Incorrect. Goals are collaborative; the physiatrist leads the team but does not set goals alone."}]}]});

BANK.push({"cat": CB, "type": "single", "stem": "An LPN/LVN on a rehabilitation unit is assigned a stable patient who needs reinforcement of transfer teaching given earlier by the RN and therapist. Which action is within the LPN/LVN role in Table 39.1?", "tp": "Rehabilitation LPN/LVN: care provider, patient advocate, reinforces education, assists in treatment plan. Framework: Nursing Process/ADPIE.", "opts": [{"t": "Reinforce the education and assist in implementing the established treatment plan", "c": true, "r": "Correct. The rehabilitation LPN/LVN provides support, reinforces education, and assists in the treatment plan and its implementation as the patient's advocate. Framework: Nursing Process/ADPIE (implementation)."}, {"t": "Perform the initial comprehensive admission assessment and set the patient's goals", "c": false, "r": "Incorrect. The interdisciplinary admission assessment and goal setting are team and RN-level functions in the chapter."}, {"t": "Redesign the transfer program and rewrite the interdisciplinary plan of care today", "c": false, "r": "Incorrect. Designing programs and leading plan revision belong to the therapists and RN/physiatrist team roles."}, {"t": "Decline the assignment because LPNs/LVNs have no role on a rehabilitation team", "c": false, "r": "Incorrect. Table 39.1 lists the rehabilitation LPN/LVN as care provider and patient advocate."}]});

BANK.push({"cat": CB, "type": "single", "stem": "A patient's spouse asks who will help the patient plan leisure activities and renew interest in hobbies. Which team member should the nurse name?", "tp": "Community reentry includes participation in social and recreational activities. Framework: Maslow.", "opts": [{"t": "The clinical psychologist, who evaluates the patient's emotional status and attitudes", "c": false, "r": "Incorrect. The psychologist is the emotional evaluator, not the recreation planner."}, {"t": "The occupational therapist, who assesses independent living needs and adapts equipment", "c": false, "r": "Incorrect. The occupational therapist addresses independent living and equipment, not leisure planning."}, {"t": "The therapeutic recreation therapist, who plans leisure activities for the patient", "c": true, "r": "Correct. The therapeutic recreation therapist is the recreation planner who promotes the patient's interest in activities. Framework: Maslow (social needs)."}, {"t": "The vocational rehabilitation counselor, who plans training for the patient's employment", "c": false, "r": "Incorrect. The vocational counselor addresses employment training, not leisure planning."}]});

  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 39: Rehabilitation Nursing</h1>';
  h += '<div class="sub">Brutal mode | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
