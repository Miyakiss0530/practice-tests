<script>
/* ============ QUESTION BANK (HARD / BRUTAL MODE) ============ */
/* Herlihy Chapter 18: Anatomy of the Blood Vessels and Special Circulations — definition test.
   Definitions and meanings only, per the verified Ch 18 study guide content. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Two Circuits and Vessel Classes";
var CB = "Vessel Layers and Vessel Jobs";
var CC = "The Aorta and Arterial Branches";
var CD = "Veins and Venous Return";
var CE = "Head and Brain Circulation";
var CF = "Hepatic Portal Circulation";
var CG = "Fetal Circulation";
var CH = "Pulse Assessment";
var CATS = [CA, CB, CC, CD, CE, CF, CG, CH];
var KEYTERMS = ["Pulmonary circulation", "Systemic circulation", "Arteries", "Arterioles", "Capillaries", "Veins", "Venules", "Tunica intima", "Tunica media", "Tunica adventitia", "Conductance vessels", "Resistance vessels", "Exchange vessels", "Capacitance vessels", "Venous valves", "Skeletal muscle pump", "Aorta", "Brachiocephalic artery", "Celiac trunk", "Superior mesenteric artery", "Median cubital vein", "Great saphenous vein", "Jugular vein distention (JVD)", "Venous hum", "Varicose veins", "Internal carotid arteries", "Basilar artery", "Circle of Willis", "Subclavian steal syndrome", "Hepatic portal system", "Portal vein", "Hepatic sinusoids", "Kupffer cells", "Umbilical vein", "Umbilical arteries", "Ductus venosus", "Foramen ovale", "Ductus arteriosus", "Pulse", "Pulse deficit"];
var BLUEPRINT = {
  CA: { name: CA, count: 2 }, CB: { name: CB, count: 5 }, CC: { name: CC, count: 7 },
  CD: { name: CD, count: 8 }, CE: { name: CE, count: 4 }, CF: { name: CF, count: 4 },
  CG: { name: CG, count: 4 }, CH: { name: CH, count: 2 }
};

BANK.push({ cat: CA, type: "single", kt: ["Pulmonary circulation", "Systemic circulation"],
  stem: "Which pairing correctly matches each circulation with the route it describes?",
  opts: [
    O("Pulmonary: right ventricle to the lungs and back to the left heart; systemic: the larger circuit supplying the rest of the body", true, "Pulmonary circulation carries oxygen-poor blood from the right ventricle to the lungs and returns oxygenated blood to the left side of the heart; systemic circulation is the larger circuit to the rest of the body."),
    O("Pulmonary: the larger circuit supplying the rest of the body; systemic: right ventricle to the lungs and back to the left heart", false, "The two are reversed here — the systemic circuit is the larger one to the body, and the pulmonary circuit runs between the right ventricle, lungs, and left heart."),
    O("Pulmonary: left ventricle to the body tissues and back to the right heart; systemic: right ventricle to the lungs only", false, "The pulmonary circuit does not start at the left ventricle, and the systemic circuit is not confined to the lungs — both halves of this pairing are wrong."),
    O("Pulmonary: blood supply to the liver from the digestive organs; systemic: blood supply to the brain through the circle of Willis", false, "Those describe the hepatic portal system and the cerebral supply — special circulations, not the two main circuits of the chapter.")
  ],
  tp: "Pulmonary = right ventricle → lungs → left heart. Systemic = the larger circuit to the rest of the body. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "single", kt: ["Arteries", "Veins"],
  stem: "A vessel carries oxygen-poor blood from the right ventricle toward the lungs. It is classified as an artery. Which principle explains the classification?",
  opts: [
    O("Vessels are classified by the direction blood flows — away from the heart makes it an artery, regardless of oxygen content", true, "Arteries are defined as carrying blood away from the heart and veins as carrying blood back to it; oxygen content and color coding do not define the class."),
    O("Vessels are classified by their color in diagrams — this vessel must actually be carrying oxygenated blood to be an artery", false, "Color coding is only a diagram convention (most arteries red, most veins blue); it is not the classifying principle, and this vessel carries oxygen-poor blood."),
    O("Vessels are classified by wall thickness alone — any thick-walled vessel leaving a ventricle is automatically called an artery", false, "Wall structure differs between classes, but the chapter defines the classes by direction of flow relative to the heart, not by wall thickness."),
    O("Vessels are classified by the pressure inside them — high-pressure vessels are arteries and low-pressure vessels are veins", false, "Pressure differs between the circuits, but the defining rule in the chapter is direction: away from the heart versus back to the heart.")
  ],
  tp: "Artery vs vein is decided by DIRECTION of flow (away from vs back to the heart), never by oxygen content or color. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single", kt: ["Capillaries", "Tunica media", "Tunica adventitia"],
  stem: "Which vessel is the exception to the three-layer rule, having a wall of only endothelium resting on a basement membrane?",
  opts: [
    O("The capillary, whose single endothelial layer on a basement membrane is what allows exchange with the tissues", true, "Capillaries are the exception: endothelium on a basement membrane only — no tunica media and no tunica adventitia — and that thinness permits exchange."),
    O("The arteriole, whose wall drops the outer layers so that smooth muscle alone can change the vessel diameter", false, "Arterioles keep three layers; they are small arteries composed mostly of smooth muscle, not a single endothelial layer."),
    O("The venule, whose wall is reduced to a single endothelial layer because pressure on the venous side is so low", false, "Venules have thin walls with the three layers present; the single-layer exception belongs to the capillaries."),
    O("The vein, whose wall contains endothelium only because it relies on valves instead of layers to move blood", false, "Veins have all three layers — thinner and less elastic than an artery's — plus valves; they are not endothelium-only vessels.")
  ],
  tp: "Every vessel except the capillary has three tunics; the capillary wall is endothelium on a basement membrane only. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "multi", kt: ["Tunica intima", "Tunica media", "Tunica adventitia"],
  stem: "Which statements about the three tunics (layers) of a blood vessel wall are correct? Select all that apply.",
  opts: [
    O("The tunica intima is an endothelial lining whose slick surface is continuous with the endocardium of the heart.", true, "The intima is the innermost endothelium, continuous with the heart's inner lining, so blood flows smoothly along it."),
    O("The tunica media is the thickest layer and is composed primarily of elastic tissue and smooth muscle.", true, "The media is the middle and thickest layer; its elastic tissue and smooth muscle vary with the vessel's function."),
    O("The tunica adventitia is the outer layer of tough connective tissue that supports and protects the vessel.", true, "The adventitia is the outermost tough connective-tissue layer with a support and protection role."),
    O("The tunica media of a vein is thicker than the tunica media of an artery of the same size.", false, "Reversed: a vein's media is much thinner than an artery's, because venous pressure is much lower than arterial pressure."),
    O("The capillary wall is built from all three tunics arranged in very thin proportions.", false, "Capillaries have no media or adventitia at all — only endothelium on a basement membrane.")
  ],
  tp: "Intima = inner endothelium (continuous with endocardium); media = middle, thickest, elastic + smooth muscle; adventitia = outer protective connective tissue. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single", kt: ["Resistance vessels"],
  stem: "An arteriole constricts so its diameter narrows. What happens to resistance to blood flow, and what job name does this give the arterioles?",
  opts: [
    O("Resistance increases; arterioles are called resistance vessels because diameter changes alter resistance to flow", true, "A narrowed vessel offers increased resistance and a dilated vessel offers less — that diameter control is why arterioles are the resistance vessels."),
    O("Resistance decreases; arterioles are called resistance vessels because they store blood for later release into the circuit", false, "Constriction raises, not lowers, resistance — and storing blood is the capacitance job of the veins, not the arterioles."),
    O("Resistance stays the same; arterioles are called resistance vessels because their thick walls resist bursting under pressure", false, "Resistance changes with diameter; the name comes from controlling flow resistance, not from resisting rupture."),
    O("Resistance increases; arterioles are called exchange vessels because the higher pressure forces fluid out into the tissues", false, "Exchange vessels are the capillaries; arteriole constriction raises resistance, which is the resistance-vessel role.")
  ],
  tp: "Constricted arteriole = higher resistance; dilated = lower. Diameter control earns arterioles the name resistance vessels. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single", kt: ["Capacitance vessels"],
  stem: "What does it mean that veins are called capacitance vessels?",
  opts: [
    O("They hold or store blood — about 70% of the total blood volume sits on the venous side and can be mobilized by venoconstriction", true, "Capacitance refers to storage: roughly 70% of total blood volume is on the venous side, and venoconstriction moves that stored blood to the heart when needed."),
    O("They conduct blood at the highest pressure in the circuit, holding pressure steady as the ventricles eject blood", false, "Conducting blood from the heart is the arteries' job, and venous pressure falls to almost 0 mm Hg — veins are low-pressure storage vessels."),
    O("They exchange gases and nutrients with the tissues, holding dissolved substances until the cells need them", false, "Exchange is the capillaries' job; capacitance refers to storing blood volume, not dissolved substances."),
    O("They resist changes in blood flow by narrowing and widening, holding total peripheral resistance constant", false, "Changing diameter to alter resistance is the arterioles' resistance-vessel role, not venous capacitance.")
  ],
  tp: "Capacitance = storage. Veins hold about 70% of total blood volume and release it by venoconstriction. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single", kt: ["Skeletal muscle pump", "Venous valves"],
  stem: "Venous pressure falls to almost 0 mm Hg, yet blood still returns from the legs to the heart. Which mechanism does the chapter credit for this?",
  opts: [
    O("The skeletal muscle pump: contracting leg muscles squeeze the large veins, opening one-way valves and forcing blood toward the heart", true, "With pressure near zero, veins need outside help: muscle contraction squeezes the veins, valves open to let blood move heartward and close during relaxation to prevent backflow."),
    O("The respiratory pump of the diaphragm, which the chapter names as the sole mechanism returning venous blood from the legs", false, "The chapter's named mechanism is the skeletal muscle pump working with venous one-way valves, not a diaphragm pump."),
    O("Venoconstriction alone, which raises venous pressure back up to arterial levels so blood can flow uphill to the heart", false, "Venoconstriction mobilizes stored blood but does not raise venous pressure to arterial levels; the muscle pump plus valves move leg blood heartward."),
    O("Gravity drainage from the legs, which pulls pooled venous blood downward and then into the inferior vena cava", false, "Gravity works against return from the legs; the chapter credits muscle contraction squeezing the veins and one-way valves preventing backflow.")
  ],
  tp: "Venous pressure ≈ 0 mm Hg, so return depends on the skeletal muscle pump plus one-way valves — exercise improves venous return. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["Aorta"],
  stem: "Which statement about the aorta is correct?",
  opts: [
    O("It originates in the left ventricle, averages the diameter of a garden hose, and ends by splitting into two common iliac arteries", true, "The aorta — mother of all arteries — leaves the left ventricle, arches and descends, and ends in the pelvis by splitting into the right and left common iliac arteries."),
    O("It originates in the right ventricle, averages the diameter of a drinking straw, and ends by splitting into two common iliac arteries", false, "The aorta originates in the LEFT ventricle, not the right, and its average diameter is that of a garden hose, much wider than a straw."),
    O("It originates in the left atrium, receives the venae cavae, and ends by splitting into the two subclavian arteries at the neck", false, "The venae cavae empty into the right atrium, and the aorta begins at the left ventricle and ends at the common iliac split in the pelvis."),
    O("It originates in the left ventricle and ends at the diaphragm, where the thoracic aorta becomes the superior vena cava", false, "Below the diaphragm the aorta continues as the abdominal aorta; it never becomes the superior vena cava, a vein of the upper body.")
  ],
  tp: "Aorta: left ventricle origin, garden-hose diameter, all systemic arteries branch from it directly or indirectly, ends at the common iliac split. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "dropdown", kt: ["Aorta"],
  stem: "Complete each statement about naming the aorta, choosing the best option for each blank.<br>The first segment, rising from the left ventricle to the arch<br>[[0]]<br>The descending aorta above the diaphragm<br>[[1]]<br>The descending aorta below the diaphragm<br>[[2]]<br>The curved segment between the ascending and descending parts<br>[[3]]",
  blanks: [
    { o: [O("Ascending aorta", true, "By its path, the aorta begins as the ascending aorta, rising from the left ventricle to the arch."), O("Thoracic aorta", false, "Thoracic aorta names the descending part above the diaphragm, not the first rising segment."), O("Abdominal aorta", false, "Abdominal aorta names the descending part below the diaphragm.")] },
    { o: [O("Thoracic aorta", true, "By body cavity, the descending aorta above the diaphragm is the thoracic aorta."), O("Ascending aorta", false, "The ascending aorta is the first segment rising from the left ventricle, before the arch."), O("Abdominal aorta", false, "The abdominal aorta is below the diaphragm; above it is thoracic.")] },
    { o: [O("Abdominal aorta", true, "By body cavity, the descending aorta below the diaphragm is the abdominal aorta."), O("Thoracic aorta", false, "The thoracic aorta is above the diaphragm, not below it."), O("Arch of the aorta", false, "The arch is the curved segment at the top, not the part below the diaphragm.")] },
    { o: [O("Arch of the aorta", true, "The aorta curves in an archlike fashion between the ascending and descending parts — the arch of the aorta."), O("Ascending aorta", false, "The ascending aorta is the straight first segment before the curve."), O("Thoracic aorta", false, "The thoracic aorta is the descending part in the chest, after the arch ends.")] }
  ],
  tp: "Path naming: ascending → arch → descending. Cavity naming: thoracic above the diaphragm, abdominal below it. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["Brachiocephalic artery"],
  stem: "Which artery named in the chapter exists on the right side of the body only, with no left-sided counterpart artery?",
  opts: [
    O("The brachiocephalic artery, the large first arch branch supplying the right head and neck and the right arm and hand", true, "There is a brachiocephalic artery only on the right; the left side is supplied by branches arising directly from the arch. Note there IS a left brachiocephalic vein."),
    O("The common carotid artery, because the left side of the head and neck receives blood only from the vertebral arteries", false, "There are right AND left common carotid arteries — the right arises from the brachiocephalic, the left directly from the arch."),
    O("The subclavian artery, because the left shoulder and upper arm are supplied entirely by the axillary artery instead", false, "There are right and left subclavian arteries; the left arises from the aortic arch and the right from the brachiocephalic artery."),
    O("The vertebral artery, because only the right vertebral artery forms, and it alone joins to become the basilar artery", false, "There are two vertebral arteries, one from each subclavian, and the pair joins to form the single basilar artery.")
  ],
  tp: "No LEFT brachiocephalic artery — but there is a left brachiocephalic vein. A classic trap pairing. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "multi",
  stem: "Which vessels are the three branches of the aortic arch, in the order blood meets them? Select all that apply.",
  opts: [
    O("The brachiocephalic artery, the first and largest branch, on the right side", true, "First arch branch: the brachiocephalic artery, supplying the right head/neck and right arm regions."),
    O("The left common carotid artery, arising directly from the highest part of the arch", true, "Second arch branch: the left common carotid, arising directly from the aorta unlike the right common carotid."),
    O("The left subclavian artery, arising from the arch to supply the left shoulder and arm", true, "Third arch branch: the left subclavian artery; the right subclavian instead extends from the brachiocephalic."),
    O("The right common carotid artery, arising directly from the arch as its own branch", false, "The right common carotid arises from the brachiocephalic artery — it is not a direct arch branch."),
    O("The coronary arteries, arising from the arch to supply the myocardium of the heart", false, "The coronary arteries arise from the ascending aorta immediately beyond the aortic semilunar valve, not from the arch.")
  ],
  tp: "Arch branches in order: brachiocephalic → left common carotid → left subclavian. Coronaries belong to the ascending aorta. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["Celiac trunk"],
  stem: "The celiac trunk is a short artery off the abdominal aorta. Into which three arteries does it divide?",
  opts: [
    O("The gastric artery to the stomach, the splenic artery to the spleen, and the hepatic artery to the liver", true, "The celiac trunk divides into exactly these three: gastric (stomach), splenic (spleen), and hepatic (liver)."),
    O("The renal artery to the kidney, the gonadal artery to the gonads, and the lumbar artery to the lower back", false, "Renal, gonadal, and lumbar arteries are other branches of the abdominal aorta — they do not come off the celiac trunk."),
    O("The mesenteric artery to the intestines, the phrenic artery to the diaphragm, and the iliac artery to the pelvis", false, "The mesenteric arteries are separate aorta branches, and the iliac arteries come from the aorta's terminal split — none are celiac branches."),
    O("The gastric artery to the stomach, the pancreatic artery to the pancreas, and the colic artery to the colon", false, "Only the gastric artery in this list is a celiac branch; the other two celiac branches are the splenic and hepatic arteries.")
  ],
  tp: "Celiac trunk = gastric + splenic + hepatic (stomach, spleen, liver). [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["Superior mesenteric artery"],
  stem: "Which pairing of the two mesenteric arteries with their territories is correct?",
  opts: [
    O("Superior mesenteric: most of the small intestine and part of the large intestine; inferior mesenteric: the other part of the large intestine", true, "The superior mesenteric artery supplies most of the small intestine plus part of the large intestine; the inferior mesenteric supplies the remaining part of the large intestine."),
    O("Superior mesenteric: the stomach and spleen; inferior mesenteric: most of the small intestine and part of the large intestine", false, "Stomach and spleen are supplied by celiac trunk branches (gastric and splenic), and the small-intestine territory belongs to the superior, not inferior, mesenteric."),
    O("Superior mesenteric: the other part of the large intestine only; inferior mesenteric: the liver and the gallbladder region", false, "The superior mesenteric's main territory is the small intestine, and the liver is supplied by the hepatic artery from the celiac trunk."),
    O("Superior mesenteric: the right and left kidneys; inferior mesenteric: the pelvic organs and external reproductive organs", false, "Kidneys are supplied by the renal arteries and pelvic organs by the internal iliac artery — neither pairing describes the mesenteric arteries.")
  ],
  tp: "Superior mesenteric = most of small intestine + part of large intestine. Inferior mesenteric = the other part of large intestine. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single",
  stem: "Tracing one artery from the shoulder to the hand, which sequence is correct?",
  opts: [

    O("Popliteal artery, behind the knee", true, "Popliteal (behind the knee) is one of the nine named pulse points."),
    O("Posterior tibial artery — one of the nine pulse points", true, "Posterior tibial is one of the nine named pulse points."),
    O("Apical pulse at the heart's apex", false, "The apex is auscultated for the apical RATE used in pulse-deficit comparison; the nine palpated pulse points are arterial sites, and the apex is not among them."),
    O("Median cubital vein at the front of the elbow", false, "The median cubital is a VEIN used for blood draws — veins do not provide a palpable arterial pulse point.")
  ],
  tp: "Nine pulse points: temporal, facial, common carotid, brachial, radial, femoral, popliteal, posterior tibial, dorsalis pedis. Radial is used most often. [Framework: Nursing Process/ADPIE]" });

/* ============ ENGINE (ES5) ============ */
var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 18: Anatomy of the Blood Vessels and Special Circulations</h1>';
  h += '<div class="sub">Brutal mode | Herlihy, Anatomy & Physiology | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
