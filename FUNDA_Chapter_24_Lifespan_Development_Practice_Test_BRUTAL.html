BANK.push({"cat": CA, "type": "single", "stem": "Parents of a healthy 4-month-old worry because an older sibling sat at 5 months while this infant still needs support. Which response should the nurse give first?", "opts": [{"t": "Explain that sequence is predictable while timing is individual, then review this infant's own pattern", "c": true, "r": "Correct. Patterns are predictable but rate is highly individualized; falling off the child's own pattern is the flag. Framework: Nursing Process, assessment and family teaching."}, {"t": "Tell the parents the infant is delayed and needs a developmental workup before the next visit", "c": false, "r": "Incorrect. Needing support at 4 months fits the sequence; sitting steadily without support comes near the end of month 7."}, {"t": "Advise daily sitting drills until the infant matches the older sibling's five month milestone", "c": false, "r": "Incorrect. Children should not be pushed to sit before adequate muscle strength is achieved."}, {"t": "Reassure the parents that milestones never matter, so no follow-up of development is needed", "c": false, "r": "Incorrect. Milestones do matter; the pattern and the child's own trajectory are what get watched."}], "tp": "Sequence fixed, rate individual. Compare the child with the predictable sequence, not with a sibling. Framework: Nursing Process."});

BANK.push({"cat": CA, "type": "single", "stem": "A couple planning pregnancy both carry a gene for an inherited disease and ask what help is available before they decide. Which action should the nurse take first?", "opts": [{"t": "Connect the couple with genetic counseling so likelihood and testing options can be reviewed", "c": true, "r": "Correct. A genetic counselor reviews the likelihood of an inherited disease and testing informs future decisions. Framework: Nursing Process, referral before decisions."}, {"t": "Tell the couple testing is routine for everyone and schedule it without reviewing their history", "c": false, "r": "Incorrect. Testing is offered based on risk factors such as age, medical history and ethnicity, not as a routine assumption."}, {"t": "Advise the couple to avoid pregnancy entirely, because a carrier result settles the decision now", "c": false, "r": "Incorrect. Counseling provides information for the couple's own decision making; it does not make the decision for them."}, {"t": "Wait until after birth to test the newborn, because prenatal information cannot change any plan", "c": false, "r": "Incorrect. Testing before pregnancy decisions is the printed purpose of genetic testing and counseling."}], "tp": "Genetic testing is risk-based and supports future decision making. Supportive services should be available for hard results. Framework: Nursing Process."});

BANK.push({"cat": CA, "type": "single", "stem": "A pregnant patient smokes a pack daily and uses alcohol on weekends. Which of the following actions should the nurse take first?", "opts": [{"t": "Flag both exposures for the provider and teach that smoke raises the risk of a low-birth-weight baby", "c": true, "r": "Correct. Drugs, alcohol, viruses and cigarette smoke are teratogens; smoke is tied to low birth weight. Framework: safety first, teratogen exposure."}, {"t": "Document the habits without reporting them, because exposures matter only after the baby is born", "c": false, "r": "Incorrect. Teratogens interfere with prenatal development, so identification and flagging happen during pregnancy."}, {"t": "Focus only on the alcohol, because cigarette smoke has no named effect on the unborn baby here", "c": false, "r": "Incorrect. Cigarette smoke is a named teratogen with a named low-birth-weight effect in the chapter."}, {"t": "Tell the patient exposures explain every possible poor outcome, so further screening is pointless", "c": false, "r": "Incorrect. Teratogens account for a possible 5% to 25% of unfavorable outcomes, not every outcome."}], "tp": "Teratogen exposures are identified and flagged for the provider. Framework: safety first.", "kt": ["Teratogen"]});

BANK.push({"cat": CA, "type": "single", "stem": "A 6-year-old whose parents just divorced tells the nurse the split happened because he was bad. Which response is most therapeutic?", "opts": [{"t": "Reassure him the divorce is not his fault and encourage him to talk about his feelings openly", "c": true, "r": "Correct. Younger children often believe they caused the divorce and feel lost and abandoned. Framework: Maslow, emotional safety and age-appropriate reassurance."}, {"t": "Ask him to carry messages between his parents so he can hear both sides of the disagreement", "c": false, "r": "Incorrect. Children must not be used as pawns or go-betweens between divorcing parents, as printed."}, {"t": "Tell him his parents will likely reunite soon, because most children hope for that outcome anyway", "c": false, "r": "Incorrect. Many children hold reconciliation fantasies for a long time; feeding the fantasy is not the teaching."}, {"t": "Change the subject to schoolwork, because young children recover faster when feelings stay unspoken", "c": false, "r": "Incorrect. The printed tips say encourage children to talk about their feelings and seek help if needed."}], "tp": "Box 24.5: talk about feelings, no go-betweens, no negative talk about an ex-spouse in front of children, reassure it is not the child's fault. Framework: Maslow."});

BANK.push({"cat": CA, "type": "multi", "stem": "A nurse assesses a family after a father's job loss. Which findings raise concern for family violence risk? Select all that apply.", "opts": [{"t": "Financial strain combined with social isolation from relatives, friends, and community supports", "c": true, "r": "Correct. Financial strain and social isolation are printed risk factors related to family violence."}, {"t": "A parent with low self-esteem who was abused as a child and now uses harsh, punitive discipline", "c": true, "r": "Correct. Low self-esteem, a history of abuse, and harsh punitive parenting are printed risk findings."}, {"t": "Unreasonable expectations of the children combined with poor self-control during disagreements", "c": true, "r": "Correct. Unreasonable expectations, immaturity and lack of self-control are printed parent characteristics."}, {"t": "A democratic pattern in which both adults share decisions and support each other's individuality", "c": false, "r": "Incorrect. Joint decision making is a functional pattern, not a printed violence risk factor."}, {"t": "Grandparents living in the home who share responsibilities for childcare and household tasks", "c": false, "r": "Incorrect. Extended family sharing responsibilities is a family type, not a violence risk factor."}, {"t": "A family that rearranges roles after the job loss so the other parent can increase work hours", "c": false, "r": "Incorrect. Rearranging roles after a change is adaptive; rigidity, not flexibility, is the concern."}], "tp": "Violence risk factors: financial strain, isolation, low self-esteem, history of abuse. Framework: safety first, family assessment."});

BANK.push({"cat": CA, "type": "single", "stem": "A grandmother heads a household raising three grandchildren, and the family lives below the poverty line. Which action should the nurse take first?", "opts": [{"t": "Screen the family for resource needs and include the grandmother as a primary caregiver in teaching", "c": true, "r": "Correct. About a third of grandfamilies include a parent, 21% live below poverty, and real caregivers get teaching. Framework: Nursing Process, assessment of the actual family."}, {"t": "Direct all teaching to the children's mother, even though she does not live in the home full time", "c": false, "r": "Incorrect. Teaching goes to the real caregivers in the household, which here is the grandmother heading it."}, {"t": "Document the home as a nuclear family, because children living with relatives count the same way", "c": false, "r": "Incorrect. This is a grandfamily, a distinct type; mislabeling hides who provides care and decides."}, {"t": "Focus the visit only on the children's vaccines, because income level does not affect health needs", "c": false, "r": "Incorrect. The chapter directs screening grandfamilies for resource needs, not just health needs."}], "tp": "Grandfamilies: nearly 8 million children; 21% below the poverty line. Framework: Nursing Process."});

BANK.push({"cat": CA, "type": "matrix", "stem": "For each household, select the family type that matches the description.", "cols": ["Nuclear family", "Extended family", "Blended family", "Social contract family"], "rows": [{"t": "Married parents and their biological children living alone in their own apartment", "a": 0, "r": "Correct. Parents and their children in an independent household form a nuclear family."}, {"t": "Parents, their children, and two grandparents sharing one house and its responsibilities", "a": 1, "r": "Correct. Nuclear plus additional relatives in the same household is an extended family."}, {"t": "A mother and father who each brought children from earlier marriages into one new home", "a": 2, "r": "Correct. Combining children from previous marriages after remarriage forms a blended family."}, {"t": "Two unrelated adults living together without a legal commitment but sharing family roles", "a": 3, "r": "Correct. Cohabitation without legal commitment, sharing roles, is a social contract family."}], "tp": "Family types decide who provides care, who decides, and who needs teaching. Framework: Nursing Process."});

BANK.push({"cat": CB, "type": "single", "stem": "A hospitalized 20-month-old screams when her mother leaves and rejects comfort food and toys from staff. Which interpretation should guide the nurse's first action?", "opts": [{"t": "Keep the child's usual rituals and routines and support the mother's presence when she returns", "c": true, "r": "Correct. Toddlers feel safer when usual rituals and routines are followed during hospitalization. Framework: Maslow, security needs of the toddler stage."}, {"t": "Tell the mother her visits cause the outbursts, so visits should be shortened until discharge day", "c": false, "r": "Incorrect. Separation distress reflects the stage, not harm from visiting; routine and caregiver presence help."}, {"t": "Offer the child a choice between two unsafe options so she feels more control over the unit", "c": false, "r": "Incorrect. Choices are offered only when either option is acceptable; unsafe choices are not offered."}, {"t": "Ignore every outburst completely, including episodes where the child could hurt herself or others", "c": false, "r": "Incorrect. Negativism is best ignored unless the child or others are in danger of harm, as printed."}], "tp": "Toddler autonomy: rituals give consistent structure. Temper tantrums come from frustration and limited impulse control. Framework: Maslow."});

BANK.push({"cat": CB, "type": "single", "stem": "A 5-year-old refuses a procedure, saying the machine will bite him, and asks the same question repeatedly. Which approach should the nurse take first?", "opts": [{"t": "Use concrete, present-tense words, one idea at a time, and let him handle safe equipment first", "c": true, "r": "Correct. Preoperational children conceptualize time in present terms and need concrete, single-idea communication. Framework: Nursing Process, developmentally matched communication."}, {"t": "Explain the full abstract physiology behind the procedure so he can reason through his fears", "c": false, "r": "Incorrect. Abstract reasoning arrives at formal operational thought, years after the preschool stage."}, {"t": "Tell him his fear proves he is being babyish compared with the older children on the unit", "c": false, "r": "Incorrect. Egocentrism and magical thinking are normal at this stage, not misbehavior to shame."}, {"t": "Promise the procedure will not happen at all, then let the treatment team surprise him later", "c": false, "r": "Incorrect. Breaking trust damages care; concrete preparation in present terms is the chapter approach."}], "tp": "Match communication to the Piaget stage: concrete and present for preoperational children. Framework: Nursing Process."});

BANK.push({"cat": CB, "type": "single", "stem": "A 10-year-old with a chronic illness asks why his dose changed when a taller classmate takes a different amount. Which explanation fits his stage?", "opts": [{"t": "Use his own concrete numbers and a sorting activity so he can classify and compare the two cases", "c": true, "r": "Correct. Concrete operational children classify, sort, and use cause and effect on specific perceptions. Framework: Nursing Process, stage-matched teaching."}, {"t": "Use a hypothetical debate about future treatment choices he might face as an adult someday", "c": false, "r": "Incorrect. Hypothetical and abstract reasoning belong to formal operations in adolescence, not this stage."}, {"t": "Give only one-idea commands with no reasons, because he cannot yet link a cause with an effect", "c": false, "r": "Incorrect. That undersells concrete operations; this child can recognize cause-and-effect relationships."}, {"t": "Let him decide his own dose changes, because industry means children set their medical plans", "c": false, "r": "Incorrect. Industry is about competence and productivity, not independent control of prescribed dosing."}], "tp": "School age: praise and encouragement build industry. Concrete examples carry the teaching. Framework: Nursing Process."});

BANK.push({"cat": CB, "type": "single", "stem": "Parents ask why their 3-year-old is still not talking while a neighbor's child speaks in sentences. Which of the following actions should the nurse take first?", "opts": [{"t": "Arrange evaluation by a physician for possible hearing loss or other speech disturbance now", "c": true, "r": "Correct. Not talking by age 3 requires evaluation for hearing loss or pathologic speech disturbance. Framework: safety first, screening flag over reassurance."}, {"t": "Reassure the parents that all children talk by age five, so waiting another two years is fine", "c": false, "r": "Incorrect. The printed threshold is age 3; waiting years misses the evaluation window the chapter sets."}, {"t": "Advise the parents to stop reading aloud, because listening has replaced the need to practice", "c": false, "r": "Incorrect. Parents are advised to keep reading to the child to expand language and comprehension."}, {"t": "Tell the parents firstborn children talk latest, so birth order fully explains this child's delay", "c": false, "r": "Incorrect. As printed, firstborn children develop language earlier than later-born children, not later."}], "tp": "Language delay is a screening flag: not talking by 3 years means evaluation. Framework: safety first."});

BANK.push({"cat": CB, "type": "order", "stem": "Place these developmental achievements in the order they appear across childhood.", "items": [{"t": "Learns an object still exists when it is hidden from sight", "r": "First, in the sensorimotor stage of infancy: object permanence."}, {"t": "Uses one word to carry a complete message to a caregiver", "r": "Second, at 1 to 2 years: the holophrase."}, {"t": "Centers on one aspect of an object and views the world egocentrically", "r": "Third, in preoperational thought from 2 to 7 years."}, {"t": "Classifies and sorts facts and recognizes cause-and-effect relationships", "r": "Fourth, in concrete operational thought from 7 to 11 years."}, {"t": "Solves hypothetical problems with a systematic, scientific approach", "r": "Fifth, in formal operational thought from about age 12 on."}], "tp": "Piaget sequence: sensorimotor, preoperational, concrete operational, formal operational. Framework: Nursing Process."});

BANK.push({"cat": CB, "type": "dropdown", "stem": "A nurse matches three children with Erikson tasks. Complete each match using the chapter table. [[0]] [[1]] [[2]]", "blanks": [{"o": [{"t": "Eight-month-old who calms when fed and held consistently: trust versus mistrust", "c": true, "r": "Correct. Infancy is basic trust versus mistrust, built by responsive care."}, {"t": "Eight-month-old who calms when fed and held consistently: autonomy versus shame", "c": false, "r": "Incorrect. Autonomy is the toddler task, not the infant task."}, {"t": "Eight-month-old who calms when fed and held consistently: initiative versus guilt", "c": false, "r": "Incorrect. Initiative is the preschool task in the table."}]}, {"o": [{"t": "Nine-year-old proud of a finished science project: industry versus inferiority", "c": true, "r": "Correct. School age is industry versus inferiority, centered on competence."}, {"t": "Nine-year-old proud of a finished science project: identity versus role confusion", "c": false, "r": "Incorrect. Identity is the adolescent task, not school age."}, {"t": "Nine-year-old proud of a finished science project: intimacy versus isolation", "c": false, "r": "Incorrect. Intimacy is the young adult task in the table."}]}, {"o": [{"t": "Fifty-year-old mentoring junior staff at work: generativity versus stagnation", "c": true, "r": "Correct. Middle adulthood is generativity versus stagnation."}, {"t": "Fifty-year-old mentoring junior staff at work: ego integrity versus despair", "c": false, "r": "Incorrect. Ego integrity is the late adulthood task."}, {"t": "Fifty-year-old mentoring junior staff at work: trust versus mistrust all over again", "c": false, "r": "Incorrect. Trust is the infant task that opens the sequence."}]}], "tp": "Erikson pairs: trust, autonomy, initiative, industry, identity, intimacy, generativity, ego integrity."});

  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
