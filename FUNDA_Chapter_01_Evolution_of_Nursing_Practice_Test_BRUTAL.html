BANK.push({ cat: CD, type: "single", stem: "A patient arrives dyspneic with an oxygen saturation of 88 percent on room air, a respiratory rate of 28, and anxiety about a scheduled family visit. Which of the following actions should the nurse take first?", tp: "Framework: Maslow - physiologic base first; oxygenation before belonging or esteem.", opts: [ O("Arrange the family visit first, because love and belonging needs outrank breathing needs on the pyramid", false, "Incorrect. Belonging sits above the physiologic base; a saturation of 88 percent is the urgent need."), O("Document the saturation and recheck it at the next routine vital sign round later in the shift", false, "Incorrect. A saturation of 88 percent with dyspnea needs action now, not routine rechecking."), O("Apply oxygen as ordered, sit the patient upright, and reassess breathing before arranging the visit", true, "Correct. Maslow framework: physiologic needs at the base, here oxygenation, are met before belonging needs like a family visit."), O("Ask the patient about self-esteem goals for recovery, because esteem drives all other needs in care", false, "Incorrect. Esteem is a higher level; it does not outrank oxygenation in a dyspneic patient.") ] });
BANK.push({ cat: CD, type: "single", stem: "A postoperative patient has a pain score of 8 of 10, has not eaten since surgery, and keeps asking when his wife can stay overnight. Which need should the nurse address first?", tp: "Framework: Maslow - meet the base first, then advance up the pyramid.", opts: [ O("His pain and nutrition needs, because physiologic needs form the base of the hierarchy of needs", true, "Correct. Maslow framework: severe pain and no intake are physiologic base needs and come first."), O("His long-term life goals, because self-actualization is the ultimate aim of all nursing care given", false, "Incorrect. Self-actualization is the top of the pyramid, reached after lower needs are met."), O("His wish for his wife to stay, because belonging needs must be settled before any physical care", false, "Incorrect. Belonging is level three; it is addressed after physiologic and safety needs."), O("His confidence about recovery, because esteem needs determine whether physical care will succeed", false, "Incorrect. Esteem is a higher level and does not precede pain control and nutrition.") ] });
BANK.push({ cat: CD, type: "single", stem: "A nurse is planning care for a patient who is stable, pain free, eating well, and wearing a call light within reach, but who feels isolated and tearful. Which action best fits the patient's current position in Maslow's hierarchy?", tp: "Framework: Maslow - once base and safety are met, work the next level up: love and belonging.", opts: [ O("Increase the frequency of vital sign checks, because physiologic monitoring always remains the priority", false, "Incorrect. The patient is stable with base needs met; extra monitoring does not address isolation."), O("Ask the provider for a sedative order, because tearfulness in a stable patient is a safety emergency", false, "Incorrect. Tearfulness from isolation is not an emergency warranting sedation as a first step."), O("Facilitate a family video call and a visit from a friend the patient has been missing this week", true, "Correct. Maslow framework: with physiologic and safety needs met, love and belonging is the next level to support."), O("Begin discharge teaching about wound care, because education is always the nurse's first intervention", false, "Incorrect. Teaching matters, but the unmet need presented here is belonging, not knowledge.") ] });
BANK.push({ cat: CD, type: "single", stem: "A newly admitted patient is homeless, has not eaten in two days, and is worried about where he will sleep after discharge. Which statement by the nurse shows correct use of Maslow's model?", tp: "Framework: Maslow - base needs first; patients may rank needs by their own values.", opts: [ O("Shelter is an esteem need, so it should be addressed only after he joins a support group on the unit", false, "Incorrect. Shelter relates to safety and security, a lower level than belonging or esteem."), O("Food and shelter come before we work on his confidence and long-term goals for his health", true, "Correct. Maslow framework: the patient ranks needs by his situation; basic physiologic and safety needs come first."), O("Confidence and life goals come first, because higher needs motivate patients to eat and find shelter", false, "Incorrect. Higher needs enhance life but are not requirements that precede the base needs."), O("Every patient ranks needs identically, so his homelessness does not change the plan of care at all", false, "Incorrect. The chapter notes each patient may prioritize needs according to his own value system.") ] });
BANK.push({ cat: CD, type: "multi", stem: "A nurse is assessing factors that can move a patient along the wellness-illness continuum. Which factors should the nurse include in this assessment? Select all that apply.", tp: "Framework: Nursing Process/ADPIE - assess all six continuum factors: age, gender, family, stressors, culture, economics.", opts: [ O("The brand of monitor used on the unit and the software version in the electronic health record", false, "Incorrect. Equipment brands and software versions are not factors on the continuum list."), O("Ethnic and cultural influences and the patient's economic status at the time of this admission", true, "Correct. Cultural influences and economic status complete the chapter's factor list."), O("The patient's age and gender and how each one influences the current level of wellness shown", true, "Correct. Age and gender are two of the six continuum factors the chapter lists."), O("The color of the patient's room and the visiting hours posted on the door of the nursing unit", false, "Incorrect. Room color and posted hours are unit features, not the listed personal factors."), O("Family relationships and emotional stressors the patient is experiencing during this illness", true, "Correct. Family relationships and emotional stressors are listed continuum factors.") ] });
BANK.push({ cat: CD, type: "single", stem: "A clinic nurse teaches a patient with newly diagnosed diabetes about carbohydrate choices, and the chart shows two recent glucose readings of 212 and 238 mg/dL. The stated goal is fewer episodes of high blood sugar. This teaching is an example of which level of prevention?", tp: "Framework: Nursing Process/ADPIE - secondary spots a present disease and slows its impact.", opts: [ O("No prevention level, because glucose readings make this a diagnostic activity instead of prevention", false, "Incorrect. The readings support the goal; the teaching itself is the chapter's secondary example."), O("Primary prevention, because all diet teaching counts as a wellness activity in any care setting", false, "Incorrect. The patient already has diabetes; primary prevention seeks to avoid disease states."), O("Tertiary prevention, because diabetes is a serious chronic problem that needs lifelong management", false, "Incorrect. Tertiary is management of care for serious problems, not this chapter's teaching example."), O("Secondary prevention, because the disease is present and the teaching aims to reduce its impact", true, "Correct. Nursing Process framework: disease is present, so teaching that reduces hyperglycemia episodes is secondary prevention in this chapter.") ] });
BANK.push({ cat: CD, type: "single", stem: "A community clinic offers mammograms, colonoscopies, and glucose screening to adults who have no symptoms and no known disease. As this chapter classifies screening programs, this clinic day is which level of prevention?", tp: "Chapter trap: screening is printed as PRIMARY prevention here, even though many other texts split it differently.", opts: [ O("Tertiary prevention, because imaging and lab equipment are used in managing serious health problems", false, "Incorrect. Tertiary manages care for serious problems already present, not screening of well adults."), O("Secondary prevention, because every screening test is performed to find a disease that is present", false, "Incorrect. That is the common trap; this chapter prints screening programs under primary prevention."), O("Primary prevention, because the chapter groups preventive screening programs with wellness activities", true, "Correct. As printed in this chapter, preventive screening programs are listed under primary prevention."), O("No prevention level, because a screening day is an administrative event rather than a health activity", false, "Incorrect. The chapter explicitly recognizes screening programs inside its prevention levels.") ] });
BANK.push({ cat: CD, type: "single", stem: "A patient with advanced heart failure and major loss of function is enrolled in a program that coordinates his medications, diet, activity limits, and follow-up visits to protect the function he has left. This program is which level of prevention?", tp: "Framework: Maslow plus prevention levels - Tertiary Treats the damage and protects what function is left.", opts: [ O("Primary prevention, because coordinated programs keep well people from developing any disease at all", false, "Incorrect. This patient already has advanced disease; primary prevention aims to avoid disease."), O("No prevention level, because prevention ends once a patient develops an advanced chronic condition", false, "Incorrect. Tertiary prevention exists precisely for serious problems already present."), O("Tertiary prevention, because it manages care for a serious problem and reduces further loss of function", true, "Correct. Tertiary prevention is management of care for serious health problems, improving quality of life and protecting remaining function."), O("Secondary prevention, because the program teaches behaviors that may keep the condition from worsening", false, "Incorrect. Secondary reduces impact of a present condition; coordinated management of serious loss is tertiary.") ] });
BANK.push({ cat: CD, type: "single", stem: "A nurse is caring for a patient whose care so far has focused only on a fractured leg. The patient is also grieving a spouse, worried about medical bills, and asking for a chaplain. Which action shows holistic care?", tp: "Framework: holistic care - five needs assessed together, with referrals when the condition dictates.", opts: [ O("Defer every concern until discharge, because holistic care is a discharge planning activity only here", false, "Incorrect. Holistic assessment begins during care, not only at discharge planning."), O("Assess the leg only, because the other concerns belong to departments outside the nursing unit team", false, "Incorrect. Holistic care is all-inclusive; the nurse coordinates referrals rather than ignoring needs."), O("Assess the bills only, because economic need is the highest need in the holistic model of patient care", false, "Incorrect. No single need outranks the rest in holistic care; all five are considered together."), O("Assess the physical injury together with the emotional, social, economic, and spiritual needs shown", true, "Correct. Holistic care counts five needs together: physical, emotional, social, economic, and spiritual, and this patient shows all five.") ] });
BANK.push({ cat: CE, type: "single", stem: "An LPN is unsure whether a new task falls within her role on a medical unit. Which source should she check to decide?", tp: "Framework: safety first - scope comes from the nurse practice act of the state of employment.", opts: [ O("The preference of the patient, who can authorize any task he requests from a licensed nurse today", false, "Incorrect. Patient preference cannot expand a nurse's legal scope of practice."), O("The nurse practice act of the state where she is employed, which defines her scope of practice", true, "Correct. Safety first framework: the LPN/LVN practices within the scope defined by the state's nurse practice act where she works."), O("The policy of a neighboring hospital, which sets the regional custom for practical nursing tasks", false, "Incorrect. A neighboring facility's policy does not define legal scope of practice."), O("The practice act of the state where she went to school, which follows her wherever she is employed", false, "Incorrect. Scope follows the state of employment, not the state where she trained.") ] });
BANK.push({ cat: CE, type: "single", stem: "A patient needs oxygen started, a ventilator checked, and blood drawn for a blood gas analysis. Which team member should the nurse expect to perform these tasks?", tp: "Framework: Nursing Process/ADPIE - match the task to the role the chapter assigns it to.", opts: [ O("The respiratory therapist, who administers oxygen, maintains ventilators, and draws blood gases", true, "Correct. Those tasks are the respiratory therapist role as printed: oxygen, ventilators, blood gas analysis, and pulmonary function tests."), O("The dietitian, who determines the foods that meet the nutritional requirements of each patient", false, "Incorrect. The dietitian role is nutritional, not respiratory equipment and blood gases."), O("The unit secretary, who prepares records, orders supplies, and schedules tests for the care unit", false, "Incorrect. The unit secretary supports the unit clerically and does not perform these clinical tasks."), O("The social worker, who counsels patients with social, emotional, or environmental problems daily", false, "Incorrect. The social worker role is counseling, not oxygen or ventilator management.") ] });
BANK.push({ cat: CE, type: "multi", stem: "A charge nurse is reducing the cost of care on a unit without lowering its quality. Which actions support that goal? Select all that apply.", tp: "Framework: least cost without harm - economical materials and time, knowledgeable efficient care.", opts: [ O("Using unit materials economically and avoiding waste of supplies during routine patient care tasks", true, "Correct. The chapter states nurses keep costs down by using materials and time economically."), O("Providing knowledgeable and efficient patient care so problems are caught and handled promptly", true, "Correct. Knowledgeable, efficient care is the chapter's second stated way nurses control cost."), O("Keeping patients in the hospital longer than the clinical pathway allows, to be extra cautious", false, "Incorrect. Case management aims to reduce length of stay while attaining the planned outcomes."), O("Ordering extra costly tests for every patient so no diagnosis can possibly be missed on the unit", false, "Incorrect. Ordering unnecessary costly tests mirrors defensive medicine and raises cost for all."), O("Stockpiling supplies in patient rooms so they are always close at hand during the night shift", false, "Incorrect. Stockpiling wastes materials and works against economical use of supplies.") ] });
BANK.push({ cat: CE, type: "single", stem: "A physician orders a panel of costly imaging studies for a low-risk patient and tells the nurse, honestly, that the studies are not medically needed but protect against a lawsuit. This practice is an example of which concept?", tp: "Defensive medicine raises everyone's cost; it is not careful medicine.", opts: [ O("Cross training, a method that teaches workers to perform duties across traditional role boundaries", false, "Incorrect. Cross training concerns worker roles, not a physician's ordering motives."), O("Articulation, a planning method that lets students advance without repeating prior coursework", false, "Incorrect. Articulation is an education concept, unrelated to test ordering for legal protection."), O("Case management, a model that maps expected outcomes against a designated time frame for care", false, "Incorrect. Case management coordinates outcomes in a time frame; it does not order unneeded tests."), O("Defensive medicine, an overly cautious practice that raises the cost of care for all patients", true, "Correct. Defensive medicine is ordering costly tests and procedures that are not medically necessary to protect against litigation.") ] });
BANK.push({ cat: CE, type: "single", stem: "A hospital trains one worker to ambulate patients and take vital signs and also to transcribe orders and order unit supplies. The stated purpose is fewer employees without lower quality. This is an example of which delivery method?", tp: "Cross training most often pairs clerical support staff and UAP; purpose is fewer employees, same quality.", opts: [ O("Cross training, in which a worker performs duties that cross traditional role boundaries at work", true, "Correct. Cross training combines UAP tasks such as ambulating and vital signs with clerical duties such as transcribing orders and ordering supplies."), O("Case management, in which an RN coordinates a caseload against a clinical pathway time frame", false, "Incorrect. Case management is RN coordination of a caseload, not one worker doing two job types."), O("Primary nursing, in which one nurse delivers every aspect of care to an assigned patient alone", false, "Incorrect. The chapter does not describe this arrangement; the two-job worker is cross training."), O("Accreditation, in which a program voluntarily meets criteria set above the state minimum level", false, "Incorrect. Accreditation concerns education programs, not combining unit job duties.") ] });
BANK.push({ cat: CE, type: "single", stem: "A member of a health maintenance organization asks why she pays the same amount each month whether she is seen twice or not at all. Which response by the nurse is accurate?", tp: "HMO = fixed, prepaid rate; shown to provide high quality at low cost.", opts: [ O("Members prepay only for nursing care, because physicians bill separately under every HMO contract", false, "Incorrect. The prepaid model in the chapter includes medical and nursing care together."), O("Members pay only for emergency services, because routine care is billed to the hospital directly", false, "Incorrect. The prepaid rate covers inpatient and outpatient treatment, not emergencies only."), O("Members receive care for a fixed, prepaid rate that covers medical, nursing, and hospital services", true, "Correct. HMO care is provided to members for a fixed, prepaid rate covering medical care, nursing care, tests, and hospitalization."), O("Members are billed per service, so her monthly amount should change after every clinic visit made", false, "Incorrect. Per-service billing is the opposite of the fixed prepaid HMO model described.") ] });
BANK.push({ cat: CE, type: "single", stem: "An uninsured patient tells the nurse he skips routine and preventive care and uses the emergency department when he is in crisis, and also for mild problems. Which statement about this pattern matches the chapter?", tp: "Framework: acute vs chronic - delayed care converts routine needs into costly crisis care.", opts: [ O("Uninsured patients receive the most preventive care, because emergency departments provide it freely", false, "Incorrect. The chapter says cost limits their preventive and routine care, increasing crisis care."), O("Uninsured patients often delay care until crisis and use emergency services for routine needs too", true, "Correct. The chapter states uninsured patients are often limited to crisis care and frequently use emergency services for mild and routine needs."), O("Uninsured patients mainly use occupational health clinics, which replace emergency care in the US", false, "Incorrect. Occupational health is a community service example, not this patient's pattern."), O("Uninsured patients are unaffected by cost, because insurance status does not change care patterns", false, "Incorrect. Rising insurance cost and lack of coverage are named drivers of this pattern.") ] });
BANK.push({ cat: CF, type: "single", stem: "An LPN on a rehabilitation unit is working under the direction of the RN. A stable patient's UAP asks what she may be assigned. Which assignment is appropriate for the UAP?", tp: "Framework: safety first - delegate routine, stable tasks to UAP; keep assessment, teaching, and planning licensed.", opts: [ O("Assessing the patient's lung sounds and deciding whether the oxygen flow rate should be changed", false, "Incorrect. Assessment and clinical decisions belong to licensed staff, not to the UAP role."), O("Teaching the patient a new insulin technique and evaluating whether the teaching was understood", false, "Incorrect. Teaching and evaluating learning are licensed nursing responsibilities, not UAP tasks."), O("Revising the interdisciplinary care plan after reviewing the patient's newest lab results today", false, "Incorrect. Care plan revision is a team and licensed-staff function, not a UAP assignment."), O("Assisting the stable patient with a routine bath and repositioning, under licensed supervision", true, "Correct. Safety first framework: UAP are educated to assist licensed staff in providing care and perform under RN supervision; routine bathing and repositioning fit that role.") ] });
BANK.push({ cat: CF, type: "single", stem: "A patient on a medical unit tells the nurse, 'I do not want that procedure, even though my doctor recommends it.' The patient is alert and understands the consequences the provider explained. Which action should the nurse take?", tp: "Framework: Nursing Process/ADPIE plus patient rights - refusal by a capable patient is respected and documented.", opts: [ O("Ask the family to override the patient, because relatives decide when a patient is in a hospital bed", false, "Incorrect. An alert patient who can decide keeps the decision; family does not override him."), O("Proceed with preparing the patient, because a signed general consent covers every later procedure", false, "Incorrect. A general consent does not remove the right to refuse a specific treatment."), O("Respect the refusal, document it, and notify the provider so the consequences discussion is complete", true, "Correct. The Patient Care Partnership assures the right to consent to or refuse a treatment, and the doctor should explain the medical consequences of refusing."), O("Tell the patient refusal is not allowed until discharge, because hospital rules require full treatment", false, "Incorrect. No such rule exists; involvement in care includes the right to refuse treatment.") ] });
BANK.push({ cat: CF, type: "single", stem: "A patient who cannot currently make decisions has a signed document naming her son to make health care decisions for her, and a separate written document stating the care she wants if she is dying. Which pairing is correct for the nurse's documentation?", tp: "Power of attorney names the decision maker; living will states the wishes. Do not swap them.", opts: [ O("The son is named by a health care power of attorney; her wishes are written in a living will", true, "Correct. The health care power of attorney designates another person to decide; the living will is the written advance directive stating the care wanted if seriously ill or dying."), O("The son is named by a living will; her wishes are written in a health care power of attorney form", false, "Incorrect. That swaps the pair: the person is designated by the power of attorney document."), O("Both documents are replaced by the Resident's Bill of Rights once she enters a hospital unit today", false, "Incorrect. The Resident's Bill of Rights is a separate long-term care document, not a replacement."), O("Both documents are part of her nursing pin records from the school where she trained as a nurse", false, "Incorrect. Pinning records are a school rite of passage and have nothing to do with these documents.") ] });
BANK.push({ cat: CF, type: "single", stem: "A resident of a long-term care facility asks for a copy of the document that clarifies her rights to respect and dignity in that setting. Which document should the staff provide and explain?", tp: "Long-term care trap: Resident's Bill of Rights, not the hospital Patient Care Partnership.", opts: [ O("The clinical pathway, the document that maps expected outcomes against a hospital time frame", false, "Incorrect. A pathway maps hospitalization expectations; it is not a rights document."), O("The nurse practice act, the state law that defines scope of practice for each level of nursing", false, "Incorrect. The practice act governs nurses, not the resident's own rights document."), O("The Patient Care Partnership, the hospital document that replaced the old Patient's Bill of Rights", false, "Incorrect. The Partnership is the hospital document; long-term care uses its own resident document."), O("The Resident's Bill of Rights, the separate document used for people in long-term care settings", true, "Correct. The Resident's Bill of Rights clarifies the needs and rights of the individual in a long-term care environment, and staff should provide and explain copies.") ] });
BANK.push({ cat: CF, type: "single", stem: "A patient recovering from surgery can wash his face and feed himself but cannot yet bathe fully or dress his lower body. The nurse plans care to help him reach total self-care. Which theory is guiding this plan?", tp: "Theory match: self-care deficit = Orem. Adaptation = Roy. Environment = Nightingale.", opts: [ O("Nightingale's theory, in which the nurse manipulates the environment for reparative processes", false, "Incorrect. Nightingale centers on the environment, not on the patient's self-care deficit."), O("Orem's theory, in which nursing is needed when a patient cannot fulfill his own self-care needs", true, "Correct. Orem's self-care deficit theory: nursing becomes necessary when the patient is unable to fulfill biological, psychological, developmental, or social needs, aiming at total self-care."), O("Roy's theory, in which the nurse assesses demands and helps the patient adapt to those demands", false, "Incorrect. Roy centers on adaptation to demands, not on attaining total self-care."), O("Parse's theory, in which humans are unitary beings participating in an open health experience", false, "Incorrect. Parse centers on unitary humans and health as a continual open process.") ] });
BANK.push({ cat: CF, type: "single", stem: "A nurse caring for a patient from another culture asks about the patient's own health practices and builds the plan around them, treating caring itself as central to the care. Which theory is guiding this nurse?", tp: "Theory match: transcultural + caring central = Leininger.", opts: [ O("Orem's theory, which helps a patient attain total self-care when needs cannot be met unaided alone", false, "Incorrect. Orem centers on self-care deficits, not on transcultural care and caring."), O("Benner's theory, which helps a patient cope with the stressors that illness brings into daily life", false, "Incorrect. Benner and Wrubel center on caring for coping, not on transcultural care."), O("Leininger's theory, which provides transcultural care with caring as the central focus of practice", true, "Correct. Leininger's theory provides care consistent with transcultural nursing knowledge, with caring as the central and unifying domain."), O("Roy's theory, which identifies demands on the patient and helps the patient adapt to each demand", false, "Incorrect. Roy centers on adaptation, not on culture-based caring as the central domain.") ] });
BANK.push({ cat: CF, type: "multi", stem: "An interdisciplinary team is using a care plan for a patient whose condition keeps changing. Which statements about that care plan are accurate? Select all that apply.", tp: "Framework: Nursing Process/ADPIE - the care plan is a living document, revised as the condition warrants.", opts: [ O("The plan is fixed at admission, because changing it would fragment the care the team is providing", false, "Incorrect. The interdisciplinary approach prevents fragmentation by coordinating, and the plan changes."), O("The plan is a living document, and changes should occur as the patient's condition warrants them", true, "Correct. Because conditions change, the plan is adjusted; it is called a living document."), O("The plan helps ensure continuity and consistency of care and eliminates duplication of services", true, "Correct. Those are the plan's stated goals: guide care, ensure continuity, eliminate duplication."), O("The plan is developed by the team in cooperation with the patient and sometimes the family too", true, "Correct. The care plan is developed by the interdisciplinary team in cooperation with the patient."), O("The plan belongs to the physician alone, because only the physician may identify patient goals", false, "Incorrect. The team and patient build the plan together; it is not a physician-only document.") ] });
BANK.push({ cat: CF, type: "single", stem: "A nurse charts a patient's treatment and response carefully at the end of the shift. A student asks why documentation matters beyond the team reading it. Which response is most accurate?", tp: "Documentation has two purposes: record progress for the team, and chronicle events for future care. It is a legal record.", opts: [ O("Documentation is a private memory aid for the nurse, and it is discarded when the patient is discharged", false, "Incorrect. The record is permanent and becomes part of the patient's health history for future care."), O("Documentation is the formal and legal record of the care received and the patient's response to it", true, "Correct. Documentation serves as the permanent record of progress and treatment and is considered the formal and legal record of care and response."), O("Documentation is required only when a patient complains, so routine care needs no written record", false, "Incorrect. Documentation is routine and continuous, not complaint-driven."), O("Documentation is mainly a billing worksheet, kept so the hospital can charge insurers accurately", false, "Incorrect. Billing is separate; the record's purposes are progress tracking and a chronicle of events.") ] });
BANK.push({ cat: CF, type: "single", stem: "A new graduate wears her school pin and tells a patient, 'This pin is my license to practice here.' Which correction by the preceptor is accurate?", tp: "Pinning grants nothing: no degree, no license. First US pins: Bellevue, 1880.", opts: [ O("The pin becomes a license once the employer files a copy with the hospital's nursing office staff", false, "Incorrect. Filing a pin copy with an employer does not create licensure."), O("The pin is a license for the first year only, until the graduate takes the examination a second time", false, "Incorrect. There is no provisional pin license; practice requires the state-issued license."), O("The pin is a license in the state where the school sits, but it must be renewed every two years", false, "Incorrect. A pin is never a license in any state and has no renewal process."), O("The pin is a rite of passage from graduation; licensure comes from the state after the examination", true, "Correct. Pinning does not bestow degree completion or state licensure; the license comes from the state after passing the licensure examination.") ] });
BANK.push({ cat: CF, type: "single", stem: "A unit manager removes nursing caps from the dress code. Which reasons given by staff match the chapter's account of why caps declined?", tp: "Cap decline: informal uniforms, catching on equipment, hair loss, washing chore, men entering, bacteria concerns.", opts: [ O("Caps were banned by state law in 1903, when the first licensure laws required a standard uniform", false, "Incorrect. No such cap ban is in the chapter; the decline followed World War II gradually."), O("Caps were replaced because patients could not tell nurses apart from other staff on a busy unit", false, "Incorrect. Identification is a uniform and nametag issue; cap decline reasons are practical ones."), O("Caps caught on equipment, caused friction hair loss for some nurses, and raised bacteria concerns", true, "Correct. The chapter lists caps catching on equipment, hair loss from friction, chore of washing and starching, and concerns about caps harboring bacteria."), O("Caps disappeared because schools stopped graduating nurses after the Cadet Nurse Corps program ended", false, "Incorrect. Graduation continued; the cap faded as uniforms became more informal.") ] });
BANK.push({ cat: CF, type: "single", stem: "A patient says she cannot tell which staff members are nurses. Which facility practice best addresses this, based on the chapter?", tp: "Professional appearance matters: patients feel more confident when they can easily distinguish nurses.", opts: [ O("Asking nurses to introduce themselves at discharge, because identification matters only at that time", false, "Incorrect. Patients need to identify nurses throughout care, not only at discharge."), O("A dress code with assigned uniform colors by staff group, plus nametags and identification badges", true, "Correct. Agencies use dress codes, colors assigned to different health care groups, and required nametags and identification badges so patients can distinguish nurses."), O("Requiring every nurse to wear the traditional white cap, because the cap alone identifies the nurse", false, "Incorrect. Caps have largely disappeared; identification today comes from dress codes and badges."), O("Posting a staff photo board in the manager's office, where patients may request to view it on visits", false, "Incorrect. A board in an office does not help a patient in bed distinguish staff at the bedside.") ] });
BANK.push({ cat: CC, type: "single", stem: "A nursing student is choosing between two practical nursing programs. Program A meets her state's minimum standards and its graduates may sit for licensure. Program B also holds a voluntary national review with standards above the state's. Which statement is accurate?", tp: "Approval = state minimum, required. Accreditation = voluntary, often far higher. Graduates of nonaccredited programs may face transfer and funding challenges.", opts: [ O("Neither review affects licensure, because graduates of any program may sit for the examination", false, "Incorrect. Graduates must complete a state-approved program to be eligible for licensure."), O("Both reviews are the same process, so a program needs only one of them before enrolling students", false, "Incorrect. Approval and accreditation are different processes run by different bodies."), O("Program A is an approved program; Program B's extra review is accreditation, which is voluntary", true, "Correct. Approval satisfies the state agency's minimum standards and makes graduates eligible for licensure; accreditation is a voluntary review against higher preestablished criteria."), O("Program A is an accredited program; Program B's state review is approval, which is fully voluntary", false, "Incorrect. That swaps the pair: state minimum approval is the requirement, accreditation is voluntary.") ] });
BANK.push({ cat: CC, type: "single", stem: "An LPN with five years of long-term care experience is starting an associate degree RN program. She asks whether her prior coursework can count. Which response is accurate?", tp: "Articulation: up to 50% credit at each step, LPN to associate and associate to baccalaureate.", opts: [ O("Articulation applies only to hospital orientation, because colleges do not recognize PN coursework", false, "Incorrect. Articulation is a curricular collaboration between nursing programs, not orientation."), O("Articulation may let her receive up to half the program credit for learning she already completed", true, "Correct. Articulation can give an LPN/LVN as much as 50 percent credit toward an associate degree, in 1-plus-1 or 2-plus-2 style programs, without repeating coursework."), O("Articulation lets her skip the NCLEX-RN entirely, because her PN license converts automatically", false, "Incorrect. Educational credit does not waive the RN licensure examination."), O("Articulation requires her to repeat every course, because prior practical coursework never transfers", false, "Incorrect. Articulation exists precisely to lessen duplication of learning experiences.") ] });
BANK.push({ cat: CC, type: "single", stem: "A graduate of a state-approved practical nursing program asks what happens after she passes her licensure examination. Which response is accurate?", tp: "Path: approved program, apply, board approves, pass NCLEX-PN, license issued. LVN = Texas and California.", opts: [ O("She is issued a ranked numerical score, and employers hire only graduates in the top scoring group", false, "Incorrect. The result is pass; numerical scores are no longer given for the examination."), O("She is issued a license as an LPN, or as an LVN if she is in Texas or California, with a pass result", true, "Correct. On passing the computerized examination, the graduate is issued a license as an LPN or as an LVN in Texas and California; numerical scores are no longer given."), O("She may practice for one year without a license, because approval of her program acts as her license", false, "Incorrect. Program approval makes her eligible to apply; the license comes after passing."), O("She is issued a license as an RN, because practical and registered licenses are interchangeable now", false, "Incorrect. PN and RN licenses are different levels with different practice acts and scopes.") ] });
BANK.push({ cat: CC, type: "single", stem: "An experienced LPN wants a pay increase tied to her growing clinical expertise and leadership, without changing jobs. Her hospital asks for an organized account of her education and accomplishments. Which pairing is correct?", tp: "Career ladder = advancement plus compensation for expertise. Portfolio = organized account of education and accomplishments.", opts: [ O("She is using accreditation, and the organized account she submits is her program's self-study report", false, "Incorrect. Accreditation reviews education programs, not an individual nurse's advancement."), O("She is using articulation, and the organized account she submits is her clinical pathway document", false, "Incorrect. Articulation is educational credit between programs, and a pathway maps hospital care."), O("She is using the career ladder, and the organized account she submits is her professional portfolio", true, "Correct. The career ladder allows advancement and recognition of clinical expertise with financial compensation, and nurses apply by submitting a portfolio."), O("She is using cross training, and the organized account she submits is her caseload assignment sheet", false, "Incorrect. Cross training combines job duties; it is not an expertise-based advancement model.") ] });
BANK.push({ cat: CC, type: "multi", stem: "A school counselor is explaining the 2010 IOM Future of Nursing report to students. Which statements are accurate? Select all that apply.", tp: "IOM 2010: 80% goal, 49% then, 56% in 2017, smoother transitions. NLN 2014: LPN/LVN valued team member.", opts: [ O("The report was released by the National League for Nurses as its 2014 position paper on LPNs", false, "Incorrect. The 2014 LPN recognition paper was the NLN; the IOM report was 2010."), O("The report emphasized smoother transitions to higher degrees for nurses who began as UAP staff", true, "Correct. It recognized pathways from unlicensed assistive personnel onward and smoother transitions."), O("The report set a goal that 80 percent of working nurses be prepared with a baccalaureate degree", true, "Correct. The IOM goal was 80 percent baccalaureate-prepared nurses in the workforce."), O("Baccalaureate-prepared nurses rose from 49 percent at the report to 56 percent when checked in 2017", true, "Correct. The chapter gives 49 percent at the report and 56 percent at the 2017 reevaluation."), O("The report required every LPN to complete a baccalaureate degree before renewing a state license", false, "Incorrect. The report promoted workforce change; it did not impose that license requirement.") ] });
BANK.push({ cat: CC, type: "single", stem: "A new LPN asks why her state requires licensure at all, when her program already tested her skills. Which response matches the chapter?", tp: "Licensure exists to protect the health and safety of the public.", opts: [ O("Licensing laws are enacted to rank schools, so the public can choose the highest ranked program", false, "Incorrect. School oversight is approval and accreditation; licensure protects the public."), O("Licensing laws are enacted to protect the public from unqualified practitioners entering practice", true, "Correct. The chapter states licensing laws protect the public from unqualified practitioners, managed by state agencies such as boards of nursing."), O("Licensing laws are enacted to guarantee graduates a job in the state where they completed training", false, "Incorrect. Licensure regulates entry to practice; it does not guarantee employment."), O("Licensing laws are enacted to set hospital pay scales so all nurses earn the same wage statewide", false, "Incorrect. Pay is an institutional matter; licensure is about public protection.") ] });
BANK.push({ cat: CA, type: "single", stem: "A unit has rising infection rates. A nurse manager applies the lesson of Nightingale's Crimean War work. Which action set best reflects that lesson?", tp: "Framework: safety first - Nightingale's change was hygiene and sanitation, measured in mortality.", opts: [ O("Recruit untrained volunteers quickly, because extra hands matter more than any cleaning routine", false, "Incorrect. Untrained volunteers were the problem in wartime care, not Nightingale's lesson."), O("Clean the units, launder clothes and linens regularly, and track the resulting infection numbers", true, "Correct. At Scutari, cleaning units and washing clothes regularly was followed by a significant drop in mortality; Nightingale nurses added hygiene, observation, and record keeping."), O("Dim the lights on night rounds and carry a lamp, because the lamp itself symbolizes safer care", false, "Incorrect. The lamp is a symbol from night rounds; the mortality drop followed hygiene changes."), O("Restrict visitors completely, because families were the main source of infection in Crimea then", false, "Incorrect. The chapter credits cleaning and laundry, not visitor bans, for the change at Scutari.") ] });
BANK.push({ cat: CA, type: "single", stem: "A hospital educator is describing conditions on a ward before nursing reform: dirty, crowded rooms, untrained caregivers, and patients who caught new diseases there. Which label from the chapter fits this ward?", tp: "Pesthouse = pre-reform hospital: dirty, overcrowded, untrained, high infection and mortality.", opts: [ O("A Nightingale school, a separate teaching unit that kept complete records on every student nurse", false, "Incorrect. A Nightingale school was an education reform, not a dirty pre-reform ward."), O("A Cadet unit, a World War Two training ward that prepared nurses in an abbreviated program format", false, "Incorrect. The Cadet Nurse Corps was a 20th-century training program, not an 1800s ward."), O("A settlement house, a neighborhood center where public health nurses visited families in the city", false, "Incorrect. Settlement houses belong to Wald's public health work, not pre-reform hospitals."), O("A pesthouse, the name given to early 19th-century hospitals with high infection and death rates", true, "Correct. Pesthouses were dirty, overcrowded early hospitals where care was untrained and infection and mortality rates were high.") ] });
BANK.push({ cat: CB, type: "single", stem: "A preceptor asks a student which American leader to credit in a presentation slide about the first nursing records and today's documentation system. Which answer is correct?", tp: "Richards = records. Robb = graded system. Nutting = curriculum concepts. Dock = organization with Robb.", opts: [ O("Mary Adelaide Nutting, who developed curriculum concepts and guidelines for student nurses then", false, "Incorrect. Nutting worked on curriculum concepts, not on the first records system."), O("Linda Richards, the first trained nurse in America, who developed the first records system used", true, "Correct. Richards is credited with the first nursing and hospital records and with our present-day documentation system."), O("Lavinia Dock, who helped organize the superintendents' society that became a national league", false, "Incorrect. Dock's work was organizational with Robb, not the first records system."), O("Isabel Hampton Robb, who organized the first graded system of theory and practice in the schools", false, "Incorrect. Robb's contribution was the graded curriculum system and a founding role at a journal.") ] });
BANK.push({ cat: CB, type: "single", stem: "A rural clinic is honoring the leader whose nurses rode on horseback to deliver obstetric care to mothers in the hills of Kentucky. Which leader and service should the clinic name?", tp: "Breckinridge = Frontier Nursing Service, horseback midwifery, Kentucky hills.", opts: [ O("Mary Ann Ball and the diet kitchen service, which she organized for soldiers during the Civil War", false, "Incorrect. Ball championed soldiers with diet kitchens, laundries, and ambulance service."), O("Dorothea Dix and the Union Army nurse service, which she superintended during the Civil War years", false, "Incorrect. Dix superintended Union Army female nurses and crusaded for the mentally ill."), O("Mary Breckinridge and the Frontier Nursing Service, which she established for those Kentucky mothers", true, "Correct. Breckinridge pioneered nurse-midwifery and established the Frontier Nursing Service for mothers in the hills of Kentucky, reached on horseback."), O("Clara Barton and the American Red Cross service, which she developed in the year 1881 in America", false, "Incorrect. Barton developed the Red Cross, not the Kentucky frontier midwifery service.") ] });
BANK.push({ cat: CB, type: "multi", stem: "A nursing instructor is reviewing why wartime repeatedly changed nursing education. Which statements match the chapter? Select all that apply.", tp: "War pattern: demand spike, untrained volunteers, education response. WWII first opened nursing education to men.", opts: [ O("In World War One, demand outran supply and untrained women again volunteered to give care", true, "Correct. In 1917 the supply could not meet demand and untrained women volunteered again."), O("Nursing leaders responded in World War One by quickly establishing the Army School of Nursing", true, "Correct. Leaders moved quickly to establish the Army School of Nursing for that reason."), O("After World War Two, civilian hospital nurses were paid more than nurses in military service", false, "Incorrect. The chapter says prestige, pay, and advancement were greater in military service."), O("In World War Two, the Cadet Nurse Corps provided an abbreviated, federally supported program", true, "Correct. The Cadet Nurse Corps was the abbreviated, federally subsidized World War II program."), O("Federally supported wartime programs in World War Two first offered men a nursing education", true, "Correct. For the first time, those programs offered men an education and career in nursing.") ] });
BANK.push({ cat: CB, type: "single", stem: "A male nursing student reports feeling isolated, says instructors do not include masculine styles of caring, and notes there are few male role models. Which statement about his experience matches the chapter?", tp: "Men in nursing: under 10%; attrition higher in school and after licensure; isolation, stereotypes, few role models.", opts: [ O("His reports match the reasons given for higher attrition of men in nursing education programs", true, "Correct. The chapter lists social isolation, stereotypes, instructors not incorporating masculine caring styles, and lack of male role models among reasons men leave."), O("His reports show he should transfer, because recruitment programs for men have been discontinued", false, "Incorrect. Education and professional settings run programs to attract and recruit men."), O("His reports will resolve once he graduates, because men leave practice less often than women do", false, "Incorrect. The chapter says men are also more likely to leave the profession once licensed."), O("His reports are unusual, because men now make up more than half of nurses in the United States", false, "Incorrect. Fewer than 10 percent of nurses identify as male, per the chapter's AACN figure.") ] });
BANK.push({ cat: CD, type: "order", stem: "A nurse is prioritizing a patient's needs using Maslow's hierarchy. Place the needs in the order they should be addressed, from the base of the pyramid upward:", tp: "Framework: Maslow - base first: Physiologic, Safety, Love, Esteem, Self-actualization. Please Serve Lunch Early, Sir.", items: [ {t: "Physiologic needs such as nutrition, elimination, oxygenation, and sexuality", r: "Base of the pyramid; these must be met before advancing upward."}, {t: "Safety and security needs such as stability, protection, and freedom from fear", r: "Second level, addressed after physiologic needs are met."}, {t: "Love and belongingness needs such as affection and acceptance by peers", r: "Third level, after safety and security are established."}, {t: "Esteem needs such as self-respect, self-confidence, and feelings of self-worth", r: "Fourth level, above love and belongingness."}, {t: "Self-actualization, the full use of the individual's own talents and abilities", r: "Top of the pyramid; it enhances life rather than sustaining it."} ] });
BANK.push({ cat: CC, type: "order", stem: "A practical nursing student is mapping the road from graduation to practice. Place the steps in the correct order:", tp: "Framework: Nursing Process/ADPIE applied to licensure - approved program first, license last; the exam result is pass only.", items: [ {t: "Complete the course of study in a state-approved practical nursing program", r: "First: eligibility begins with a state-approved program."}, {t: "Apply for the licensure examination, with approval by the state board of nursing", r: "Second: the graduate applies and the board approves the application."}, {t: "Sit for and pass the computerized NCLEX-PN examination with a pass result", r: "Third: the exam is computerized and reported as pass, with no numerical score."}, {t: "Receive the state-issued license as an LPN, or as an LVN in Texas or California", r: "Last: the license is issued only after the examination is passed."} ] });
BANK.push({ cat: CA, type: "order", stem: "A student is building a timeline display for a nursing history class. Place the milestones in chronological order:", tp: "History order check: Nightingale school 1860, first licensure 1903, PN registration 1914, Partnership 2003.", items: [ {t: "1860 - Nightingale opens her school at Saint Thomas Hospital in London, England", r: "Earliest here: the Nightingale Plan school, 1860."}, {t: "1903 - North Carolina, New Jersey, New York, and Virginia mandate licensure", r: "Second: the first four licensure states, 1903."}, {t: "1914 - Mississippi passes the first registration laws for practical nurses", r: "Third: PN registration followed RN licensing laws, in 1914."}, {t: "2003 - The Patient Care Partnership replaces the Patient's Bill of Rights", r: "Last: the AHA replacement document, 2003."} ] });
BANK.push({ cat: CD, type: "dropdown", stem: "A nurse educator is classifying activities for a community health fair. Complete each statement: A glucose screening booth for adults with no known disease is classified in this chapter as [[0]]. Diet teaching for a man whose diabetes is already diagnosed is classified as [[1]]. A coordinated care program for a woman with serious heart failure is classified as [[2]].", tp: "Framework: Nursing Process/ADPIE - Primary Prevents, Secondary Spots and slows, Tertiary Treats and protects function.", blanks: [ { o: [ O("secondary prevention", false, "Incorrect. Secondary acts on a disease already present."), O("tertiary prevention", false, "Incorrect. Tertiary manages serious problems already present."), O("primary prevention", true, "Correct. This chapter lists preventive screening programs under primary prevention.") ] }, { o: [ O("secondary prevention", true, "Correct. The chapter's example: diet teaching in diagnosed diabetes to reduce hyperglycemia is secondary."), O("primary prevention", false, "Incorrect. Primary seeks to avoid disease; this disease is already present."), O("tertiary prevention", false, "Incorrect. Tertiary is management of care for serious problems, not this teaching.") ] }, { o: [ O("tertiary prevention", true, "Correct. Coordinated management of a serious problem, protecting function, is tertiary."), O("secondary prevention", false, "Incorrect. Secondary reduces impact of a present condition; full care management of serious illness is tertiary."), O("primary prevention", false, "Incorrect. Primary seeks to avoid disease states in well people.") ] } ] });

  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
