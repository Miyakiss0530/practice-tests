<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.wrap{max-width:820px;margin:0 auto;padding:12px}

.btn{display:inline-block;border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:600;cursor:pointer;color:#fff;background:#6d28d9;margin:4px 6px 4px 0}

.qh{display:flex;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qn{font-weight:700;color:#3b1a8a;margin-right:10px}
.chip{background:#ece7fb;color:#4c1d95;border-radius:20px;padding:3px 10px;font-size:12px;margin-right:auto}
.flag{border:1px solid #c9bdf0;background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;color:#4c1d95;cursor:pointer}
.flag.on{background:#fde68a;border-color:#f59e0b;color:#7c4a03}
.scen{background:#f5f2ff;border-left:4px solid #6d28d9;padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:15px}
.qt{font-size:12px;color:#6b64a0;margin-bottom:4px}
.stem{font-size:17px;font-weight:600;margin-bottom:12px}

.opt .ot{font-size:15px;flex:1}

.rat{display:block;font-size:13px;color:#3d3a55;margin-top:5px}
.oi{display:flex;align-items:center;border:2px solid #ddd5f7;border-radius:12px;padding:8px;margin-bottom:8px}
.oi .num{min-width:28px;height:28px;border-radius:50%;background:#6d28d9;color:#fff;text-align:center;line-height:28px;font-weight:700;margin-right:10px;font-size:14px}
.oi .ot{flex:1;font-size:15px}
.oi button{border:1px solid #c9bdf0;background:#f5f2ff;border-radius:8px;font-size:16px;width:40px;height:40px;margin-left:6px;color:#4c1d95}
.oi.good{border-color:#16a34a;background:#ecfdf3}
.oi.bad{border-color:#dc2626;background:#fef2f2}
select{font-size:15px;padding:6px 8px;border-radius:8px;border:2px solid #b9a8ee;background:#fff;color:#1f1b3a;max-width:100%}

select.bad{border-color:#dc2626;background:#fef2f2}
.ddstem{font-size:17px;line-height:2.1;margin-bottom:10px}
.ddrow{border:2px solid #ddd5f7;border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.ddlabel{font-size:15px;font-weight:600;margin-bottom:6px}

.leg{background:#f5f2ff;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}

.mrow{display:flex;align-items:center;justify-content:space-between;border:2px solid #ddd5f7;border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:15px}
.mrow.good{border-color:#16a34a;background:#ecfdf3}
.mrow.bad{border-color:#dc2626;background:#fef2f2}
.mrow span.mt{flex:1;margin-right:10px}
.fbx{font-size:13px;color:#3d3a55;margin:-2px 0 8px 4px}
.res{border-radius:10px;padding:8px 12px;font-weight:700;margin:10px 0 8px}
.res.ok{background:#dcfce7;color:#14532d}
.res.part{background:#fef3c7;color:#78350f}
.res.no{background:#fee2e2;color:#7f1d1d}
.tp{background:#eef2ff;border-left:4px solid #4338ca;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.nav{display:flex;flex-wrap:wrap}
.nav button{width:38px;height:38px;margin:3px;border-radius:9px;border:2px solid #ddd5f7;background:#fff;color:#3b1a8a;font-weight:700;font-size:13px}
.nav button.ans{background:#ddd5f7}
.nav button.fl{border-color:#f59e0b;box-shadow:inset 0 -4px 0 #f59e0b}
.nav button.cur{background:#6d28d9;color:#fff;border-color:#6d28d9}
.nav button.ok{background:#bbf7d0;border-color:#16a34a}
.nav button.part{background:#fde68a;border-color:#f59e0b}
.nav button.bad{background:#fecaca;border-color:#dc2626}
.big{font-size:42px;font-weight:800;color:#4c1d95}
.cb{height:12px;background:#e6e1f7;border-radius:6px;overflow:hidden;margin:3px 0 10px}
.cb div{height:12px;background:#6d28d9}
.small{font-size:13px;color:#5b5486}
</style>

<body>
<div id="app"></div>
<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Hospice Philosophy, History and Admission";
var CB = "Palliative Care and the Interdisciplinary Team";
var CC = "Pain Assessment and Management";
var CD = "Symptom Management: GI, Nutrition and Breathing";
var CE = "Approaching Death, Psychosocial, Spiritual and Ethics";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 9,
  "types": {
   "single": 7,
   "multi": 2
  }
 },
 CB: {
  "name": CB,
  "count": 10,
  "types": {
   "single": 9,
   "multi": 1
  }
 },
 CC: {
  "name": CC,
  "count": 10,
  "types": {
   "single": 8,
   "multi": 2
  }
 },
 CD: {
  "name": CD,
  "count": 10,
  "types": {
   "single": 8,
   "multi": 2
  }
 },
 CE: {
  "name": CE,
  "count": 8,
  "types": {
   "single": 7,
   "multi": 1
  }
 }
};

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about the primary team assigned to each hospice patient is accurate?",
  opts: [ O("It includes only the medical director and nurse coordinator, who carry out every aspect of the plan by themselves daily", false, "Incorrect. The primary team is broader, and the interdisciplinary team shares responsibility for the plan."), O("It excludes the family from decisions because the professionals alone develop and supervise the plan of care for the patient", false, "Incorrect. The team includes the family in all decisions and care planning throughout the illness."), O("It includes the patient's own provider, the primary hospice nurse, social worker, aide, volunteer, and spiritual leader", true, "Correct. The primary team combines the patient's own provider with assigned hospice nurse, worker, aide, volunteer, and leader."), O("It meets only at admission, sets the plan once, and never revises it even when the patient's condition changes markedly", false, "Incorrect. Regular frequent meetings review conditions, revise the plan as needed, and judge its effectiveness.") ],
  tp: "Primary team per patient: own provider, primary nurse, social worker, aide, volunteer, spiritual leader." });

BANK.push({ cat: CC, type: "single",
  stem: "Which statement about pain medication in hospice is accurate?",
  opts: [ O("The dose is kept fixed at the starting level even as pain increases with progression of the patient's disease", false, "Incorrect. Doses are titrated, slowly increased to the therapeutic level, as pain increases over time."), O("Proper pain relief is provided on a regular around-the-clock basis, with rescue medication for breakthrough pain", true, "Correct. Box 40.3: around-the-clock relief, with medication available for breakthrough episodes."), O("Nonpharmacologic interventions are excluded once an opioid is started, because they interfere with drug action", false, "Incorrect. Nonpharmacologic interventions should be included in the plan alongside the medications."), O("Pain medication is given only when the patient asks twice, so that tolerance and addiction are avoided in care", false, "Incorrect. Withholding creates undermedication; fears of addiction and tolerance are addressed by monitoring.") ],
  tp: "Around-the-clock dosing plus breakthrough rescue; titrate the dose to effect." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about the medical director is accurate?",
  opts: [ O("The director determines methods of payment, admits every patient, and assigns each primary team to the patient", false, "Incorrect. Admitting patients, assigning teams, and payment methods belong to the nurse coordinator."), O("The director acts as consultant and mediator for the provider and does not take the place of that provider", true, "Correct. The medical director consults, mediates, certifies eligibility with the team, and oversees palliative care."), O("The director replaces the patient's own health care provider once the patient is admitted to the hospice program", false, "Incorrect. The chapter states directly that the director does not take the place of the patient's provider."), O("The director personally provides all daily nursing care, bathing, and hygiene for every patient on the service", false, "Incorrect. Daily personal care belongs to nurses and aides; the director holds medical oversight.") ],
  tp: "Medical director: consultant and mediator who certifies eligibility; never a replacement provider." });

BANK.push({ cat: CD, type: "single",
  stem: "Which statement about hypodermoclysis is accurate?",
  opts: [ O("Fluids are given intravenously through a central line, with dextrose infused by pump for the patient at home now", false, "Incorrect. The route is subcutaneous, not central intravenous, and the fluid named is normal saline."), O("Fluids are given rectally by retention enema, repeated until the patient no longer shows signs of dehydration at all", false, "Incorrect. Rectal fluids are not the method described; the butterfly needle goes into subcutaneous tissue."), O("Fluids are given by mouth in small sips each hour, with ice chips used between drinks for the patient who is nauseated", false, "Incorrect. Oral sips are a separate comfort measure; hypodermoclysis is a subcutaneous infusion method."), O("Fluids are given subcutaneously through a butterfly needle, with normal saline infused by gravity for the patient", true, "Correct. Hypodermoclysis gives 0.9 percent sodium chloride subcutaneously by gravity through a butterfly needle.") ],
  tp: "Hypodermoclysis: 0.9% sodium chloride, subcutaneous, butterfly needle, gravity infusion." });

BANK.push({ cat: CE, type: "single",
  stem: "Which statement about spiritual care in hospice is accurate?",
  opts: [ O("Spiritual assessment is optional when symptoms are controlled, because unrest only appears with uncontrolled symptoms", false, "Incorrect. Spiritual and psychosocial problems are interrelated and surface especially with uncontrolled symptoms."), O("The nurse should open every visit by sharing personal religious beliefs, whether or not the patient requests that view", false, "Incorrect. Personal beliefs are shared only if the patient specifically requests that perspective."), O("Spiritual issues are referred to the spiritual coordinator, and beliefs are not used to share personal views unasked", true, "Correct. Referral to the coordinator, a nonjudgmental stance, and no unasked sharing of personal beliefs are directed."), O("Depression, bitterness, and anger in a dying patient are never signs of unmet spiritual needs in the chapter's view at all", false, "Incorrect. Those symptoms are listed as in some cases indicative of unmet spiritual needs.") ],
  tp: "Spiritual care: refer to the coordinator, stay nonjudgmental, share personal beliefs only when asked." });

BANK.push({ cat: CD, type: "single",
  stem: "Which statement about eating at the end of life is accurate?",
  opts: [ O("Forcing small amounts is acceptable when the caregiver believes eating will prolong the patient's life somewhat", false, "Incorrect. Caregiver belief does not override the rule; reassurance that anorexia is part of dying is the response."), O("Artificial hydration and tube feedings reliably improve long-term outcome and quality of life at the end stage", false, "Incorrect. They may slow cachexia but can do more harm than good, and the long-term result does not change."), O("Forcing a patient to eat or drink is never acceptable, because it can compromise dignity and harm well-being", true, "Correct. The chapter states this in the strongest terms: never force food or fluids on an unwilling patient."), O("Weighing the patient daily is encouraged, because tracking weight loss motivates the patient to eat more each day", false, "Incorrect. The chapter advises avoiding weighing, since attention to weight loss depresses and discourages.") ],
  tp: "Never force food or fluids; avoid routine weighing; anorexia is part of the end-of-dying process." });

BANK.push({ cat: CD, type: "single",
  stem: "Which teaching point about opioids and bowel care is accurate?",
  opts: [ O("Patients who receive opioids should avoid laxatives, because bowel function returns once pain is controlled", false, "Incorrect. The opposite is taught; senna is given routinely when the patient takes pain medication."), O("A decrease in oral intake means bowel movements stop entirely, so no bowel plan is needed at the end of life", false, "Incorrect. Even without oral intake, bowel movements can still occur in some cases, so care continues."), O("Constipation care is a minor comfort issue that never causes symptoms beyond the bowel itself in these patients", false, "Incorrect. Constipation can cause abdominal pain, nausea, and vomiting, and more distress than pain itself."), O("Patients who receive opioids should also take laxatives, because opioids pose a risk of constipation", true, "Correct. The chapter teaching is explicit: opioid patients should also take laxatives for bowel care.") ],
  tp: "Opioids require a bowel regimen; assess bowel sounds, discomfort, and firmness before active treatment." });

BANK.push({ cat: CE, type: "single",
  stem: "Which vital sign pattern is expected as death approaches?",
  opts: [ O("Decreased blood pressure with an elevated pulse, changes the family is told are normal and not uncomfortable", true, "Correct. Table 40.4 pairs decreased blood pressure and elevated pulse with reassurance to the family."), O("Increased blood pressure with a slowed pulse, changes the family is told signal recovery and improving strength", false, "Incorrect. Approaching death lowers blood pressure and raises pulse; it does not signal recovery."), O("Stable blood pressure and pulse until the final minute, with no change in breathing pattern noted at any point", false, "Incorrect. Breathing becomes irregular with apnea periods, and vital signs change before death."), O("Elevated blood pressure with an elevated temperature, treated as infection until proven otherwise by the team", false, "Incorrect. The listed pattern is decreased pressure and elevated pulse, presented as normal and expected.") ],
  tp: "Approaching death: blood pressure falls, pulse rises; family is told this is normal and not uncomfortable." });

BANK.push({ cat: CC, type: "multi",
  stem: "Which statements about the fears surrounding opioid use in hospice are accurate? Select all that apply.",
  opts: [ O("The myths and fears named are addiction, tolerance, and respiratory depression in the dying patient", true, "Correct. Addiction, tolerance, and respiratory depression are the three fears the chapter names."), O("Ineffective pain management is usually associated with undermedication resulting from common myths and fears", true, "Correct. The chapter links poor control to undermedication driven by myths and fears about opioids."), O("The correct response to fear of addiction is to stop the opioid and rely only on acetaminophen doses", false, "Incorrect. Stopping the opioid abandons control; monitoring and reassurance are the chapter response."), O("Careful expert monitoring, reassurance, and support from the hospice team can relieve these fears", true, "Correct. Expert monitoring plus reassurance and support are how the team relieves these fears."), O("Large doses of opioids are uncommon and unnecessary, and patients should be told control is unlikely", false, "Incorrect. Teaching states the opposite: large doses are common and necessary to achieve control.") ],
  tp: "Undermedication from myths (addiction, tolerance, respiratory depression) is the usual problem." });

BANK.push({ cat: CA, type: "single",
  stem: "Which set of findings meets the stated criteria for admission to hospice?",
  opts: [ O("Terminal illness with no prognosis stated, the caregiver alone consents, and the patient is kept unaware of the plan", false, "Incorrect. A documented prognosis is required, and the patient and caregiver must understand and agree to the plan."), O("Terminal illness certified at twelve months or less to live, the family desires the services, and curative care continues", false, "Incorrect. The prognosis limit is six months, the patient must desire services, and care becomes palliative."), O("Chronic illness with a good prognosis, the provider desires the services, and life-support measures are planned routinely", false, "Incorrect. Hospice requires a terminal prognosis; a good prognosis and routine life support do not qualify."), O("Terminal illness certified at six months or less to live, the patient desires the services, and care will be palliative", true, "Correct. Certification, the patient's own desire, and agreement to palliative-only care are the admission criteria.") ],
  tp: "Admission: certified prognosis of 6 months or less, patient desire, and informed agreement to palliative care." });

BANK.push({ cat: CA, type: "single",
  stem: "Which distribution of primary diagnoses served by hospice is accurate?",
  opts: [ O("Cancer accounts for about sixty percent, dementia about thirty percent, and cardiac and lung disease about five percent of cases", false, "Incorrect. Those proportions are far off; cancer is the largest group but only about thirty percent."), O("Cardiac and lung disease account for about sixteen percent, cancer about twenty-nine percent, and dementia about thirty percent", false, "Incorrect. Dementia is the 15.6 percent group; cardiac and lung diseases together are almost 28.6 percent."), O("Cancer accounts for about thirty percent, dementia about sixteen percent, and cardiac and lung disease about twenty-nine percent", true, "Correct. The chapter figures are cancer 30.1 percent, dementia-related 15.6 percent, cardiac and lung almost 28.6 percent."), O("Dementia accounts for about thirty percent, cancer about sixteen percent, and cardiac and lung disease about twenty-nine percent", false, "Incorrect. Cancer and dementia are swapped here; cancer is 30.1 percent and dementia is 15.6 percent.") ],
  tp: "Diagnoses: cancer 30.1%, dementia-related 15.6%, cardiac and lung almost 28.6%." });

BANK.push({ cat: CD, type: "single",
  stem: "Which statement about nausea and vomiting management is accurate?",
  opts: [ O("Assume the cause is always the opioid and stop it, without assessing obstruction, constipation, or food smells", false, "Incorrect. Causes include obstruction, tumor, uncontrolled pain, constipation, smells, and anxiety."), O("Encourage the patient to eat immediately during active vomiting so peristalsis is kept moving through the episode", false, "Incorrect. Eating is discouraged for a short time after vomiting until peristalsis stabilizes again."), O("Serve large, spicy, strong-smelling meals in the patient's room to stimulate appetite once vomiting has stopped", false, "Incorrect. After vomiting, small light bland meals are served; strong-smelling and spicy foods are avoided."), O("Assess the cause and remove it if possible, and monitor labs so electrolyte imbalances are corrected promptly", true, "Correct. Cause assessment and removal, plus laboratory monitoring for electrolytes, anchor nausea management.") ],
  tp: "Nausea: find and remove the cause; small bland meals; rest after eating; IV antiemetics in acute phases." });

BANK.push({ cat: CC, type: "single",
  stem: "Which drug-and-indication pairing from the chapter's hospice medication table is accurate?",
  opts: [ O("Senna is used for emesis, and lorazepam is used for fever and headache in the hospice patient population served", false, "Incorrect. Emesis drugs are droperidol and prochlorperazine; fever and headache pair with acetaminophen."), O("Fentanyl transdermal is used for mild pain only, and acetaminophen is used for severe pain in hospice patients", false, "Incorrect. The fentanyl patch is for moderate to severe pain; acetaminophen covers fever and headache."), O("Droperidol is used for constipation, and prochlorperazine is used for anxiety in the population served by hospice", false, "Incorrect. Both droperidol and prochlorperazine are listed for emesis, not constipation or anxiety."), O("Senna is used for constipation, and lorazepam is used for anxiety in the hospice patient population served", true, "Correct. Table 40.3 pairs senna with constipation and lorazepam with anxiety, each with its own cautions.") ],
  tp: "Table 40.3: senna-constipation, lorazepam-anxiety, droperidol/prochlorperazine-emesis, fentanyl-moderate/severe pain." });

BANK.push({ cat: CB, type: "single",
  stem: "Which members make up the core interdisciplinary hospice team?",
  opts: [ O("Hospice pharmacist, hospice aide, hospice volunteer, and bereavement coordinator working together as the core team", false, "Incorrect. Those roles belong to the primary team listing; the core team is the first set named here."), O("Medical director, nurse coordinator, social worker, and spiritual coordinator working together as the core team", true, "Correct. These four roles are listed as the core interdisciplinary team in Table 40.1 of the chapter."), O("Primary health care provider, primary nurse, primary aide, and primary volunteer working together as the core team", false, "Incorrect. Those are members of the primary team assigned to each patient, not the core team."), O("Volunteer coordinator, nutrition consultant, physical therapist, and speech pathologist as the core team", false, "Incorrect. These are supporting services, valuable but not the four core interdisciplinary roles.") ],
  tp: "Core team: medical director, nurse coordinator, social worker, spiritual coordinator." });

BANK.push({ cat: CD, type: "single",
  stem: "A patient develops nausea shortly after starting an opioid for pain. Which response is accurate?",
  opts: [ O("Discontinue the opioid at once, because nausea at initiation proves the patient cannot tolerate the drug class", false, "Incorrect. The chapter directs the opposite response: add the antiemetic and continue the opioid."), O("Use an antiemetic rather than discontinuing the opioid, because this nausea usually subsides after a time", true, "Correct. Opioid-start nausea is common and temporary; the best response is an antiemetic, not stopping pain control."), O("Force fluids and a full meal, because nausea on an empty stomach always resolves once the patient has eaten well", false, "Incorrect. Forcing food or fluids is never acceptable and compromises dignity and well-being."), O("Withhold all antiemetics for a week, because combining them with opioids is prohibited in hospice care settings", false, "Incorrect. Antiemetics may be administered with the opioid analgesic; combinations are often needed.") ],
  tp: "Opioid-start nausea: antiemetic, do not stop the opioid; the nausea usually subsides." });

BANK.push({ cat: CA, type: "single",
  stem: "Dame Cicely Saunders is associated with which contribution to hospice care?",
  opts: [ O("Creating the Medicare Hospice Benefit in 1983 so that hospice services became reimbursable for patients", false, "Incorrect. The benefit date is 1983, but it was a payment policy, not Saunders' personal contribution."), O("Founding more than forty-three hundred hospice programs serving well over a million patients in the United States", false, "Incorrect. Those are current US program totals, the result of many providers, clergy, and volunteers."), O("Renewing hospice in London in the 1960s by improving pain management and symptom control for dying patients", true, "Correct. Saunders, a nurse and physician, devoted her work to pain and symptom control for the dying."), O("Opening the first hospice program in the United States in Connecticut in the early years of the 1970s decade", false, "Incorrect. The first US program opened in Connecticut in 1971; Saunders worked in London, not Connecticut.") ],
  tp: "Saunders: London, 1960s, St Christopher's opened 1968; first US program: Connecticut, 1971." });

BANK.push({ cat: CD, type: "multi",
  stem: "Which factors are named as contributing to constipation in terminally ill patients? Select all that apply.",
  opts: [ O("Poor dietary intake and poor fluid intake during the course of the patient's terminal illness", true, "Correct. Poor diet and poor fluid intake are listed contributors to constipation in this chapter."), O("Hypercalcemia, hypokalemia, and tumor compression of the bowel affecting the patient's comfort", true, "Correct. Both electrolyte problems and tumor compression of the bowel are named contributors."), O("Routine use of senna and stool softeners started together with the patient's opioid medication", false, "Incorrect. Those agents relieve and prevent constipation; they are treatments, not contributors."), O("Excessive oral hydration and a high-fiber diet taken consistently throughout the illness course", false, "Incorrect. Excess intake is not listed; the problem pattern is poor intake of food and of fluids."), O("Use of opioids for pain control and a decrease in the patient's overall physical activity level", true, "Correct. Opioids and decreased activity are named contributors that the nurse can anticipate.") ],
  tp: "Constipation contributors: poor diet/fluids, hypercalcemia, hypokalemia, tumor compression, opioids, inactivity." });

BANK.push({ cat: CB, type: "single",
  stem: "Which role description matches the nurse coordinator?",
  opts: [ O("A professional with grief experience who assesses the bereaved survivor and facilitates support groups for families", false, "Incorrect. Bereaved-survivor support belongs to the bereavement coordinator, a different team role."), O("A licensed pharmacist who evaluates drug interactions, doses, administration times, and routes for the patient", false, "Incorrect. Drug consultation belongs to the hospice pharmacist, not to the nurse coordinator role."), O("A registered nurse who admits patients, explains the service, assigns the primary team, and manages patient care", true, "Correct. Table 40.1 gives the nurse coordinator those functions: explain, admit, assign, and manage care."), O("A liaison to the spiritual community who coordinates spiritual support and assists with funeral planning services", false, "Incorrect. Spiritual liaison and funeral support belong to the spiritual coordinator on the core team.") ],
  tp: "Nurse coordinator: RN who explains the service, admits patients, assigns the primary team, manages care." });

function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 40: Hospice Care - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
