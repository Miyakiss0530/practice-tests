<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Signs, Symptoms, Disease Origins and Risk Factors";
var CB = "Disease Terms, Inflammation and Frequently Noted Signs";
var CC = "Examination Role, Equipment, Positions and Interview";
var CD = "Assessment Techniques, History and Review of Systems";
var CE = "Neurologic, Skin, Chest and Breath Sounds";
var CF = "Heart, Pulses, Abdomen, Edema and Communication";
var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 5,
  "types": {
   "single": 4,
   "multi": 1
  }
 },
 CB: {
  "name": CB,
  "count": 5,
  "types": {
   "single": 4,
   "multi": 1
  }
 },
 CC: {
  "name": CC,
  "count": 6,
  "types": {
   "single": 5,
   "multi": 1
  }
 },
 CD: {
  "name": CD,
  "count": 9,
  "types": {

   "single": 5,
   "dropdown": 1,
   "matrix": 1
  }
 },
 CE: {
  "name": CE,
  "count": 15,
  "types": {
   "dropdown": 1,
   "single": 11,
   "matrix": 1,
   "multi": 2
  }
 },
 CF: {
  "name": CF,
  "count": 13,
  "types": {
   "single": 9,
   "multi": 1,
   "dropdown": 1,
   "order": 1,
   "matrix": 1
  }
 }
};

BANK.push({ cat: CA, type: "single",
  stem: "A patient tells the nurse, 'My stomach feels like a knife is stabbing it,' while pointing to the upper abdomen. The nurse also notes a rash and a temperature of 100.8 degrees F. Which documentation is correct?",
  opts: [ O("Quote the patient's stabbing description as subjective data and chart the rash and temperature as signs", true, "Correct. The patient's words are subjective symptom data; rash and measured temperature are objective signs. Framework named in the teaching point."), O("Chart the stabbing description as a sign because the patient pointed to where the pain is located today", false, "Incorrect. Pointing localizes the symptom but the felt description remains the patient's subjective perception."), O("Convert the patient's words to a medical pain term so later readers are not influenced by the wording", false, "Incorrect. Subjective data and chief complaints are recorded in the patient's own words to avoid bias."), O("Chart the rash and temperature as symptoms because both were found while the patient reported the pain", false, "Incorrect. Timing does not change the category; findings the nurse sees or measures are objective signs.") ],
  tp: "Document symptoms in the patient's own words with onset, course, character, and aggravating or alleviating factors; signs are what the nurse observes and measures. Framework: Nursing Process/ADPIE (assessment data classification)" });

BANK.push({ cat: CA, type: "multi",
  stem: "A 58-year-old patient smokes a pack daily, sleeps 4 hours nightly, sunbathes weekly, is 62 years old, and has a parent who died of cancer. Which findings should the nurse target first in a risk-reduction teaching plan? Select all that apply.",
  opts: [ O("Daily smoking, because it is a lifestyle risk the patient can change starting now", true, "Correct. Smoking is modifiable and is the most preventable cause of death in society."), O("Short nightly sleep, because insufficient rest is a modifiable lifestyle risk factor", true, "Correct. Insufficient rest and sleep are listed lifestyle risk factors that can be changed."), O("Weekly sunbathing, because it raises skin cancer risk and the habit can be changed", true, "Correct. Sunbathing is a lifestyle risk factor for skin cancer and is modifiable."), O("The patient's age of 62 years, because aging is the easiest risk factor to reverse", false, "Incorrect. Age is a risk category but it is not modifiable."), O("The parent's cancer history, because family history can be changed by teaching alone", false, "Incorrect. Family history is a genetic risk factor and cannot be modified; it guides screening and vigilance.") ],
  tp: "Risk factors fall into four categories: genetic and physiologic, age, environment, and lifestyle. Presence raises the chance of disease; it does not guarantee it. Framework: Maslow (prevention and health promotion before disease treatment)" });

BANK.push({ cat: CA, type: "single",
  stem: "A newborn has a condition traced to failure to develop normally during the first 2 months of pregnancy after maternal infection and poor nutrition. The parents ask whether this means the condition was inherited. Which response is most accurate?",
  opts: [ O("'This condition appeared at birth and is linked to development before birth, not to a gene passed from you.'", true, "Correct. Congenital conditions appear at birth or shortly after, are not caused by genetic abnormalities, and involve factors such as maternal infection, drugs, alcohol, malnutrition, radiation, or inadequate oxygen."), O("'Yes, conditions present at birth are passed genetically, like cystic fibrosis and sickle cell anemia are.'", false, "Incorrect. Cystic fibrosis and sickle cell anemia are hereditary examples; presence at birth alone does not mean genetic transmission."), O("'No, a condition from this time period is caused only by microorganisms invading the body after delivery.'", false, "Incorrect. Invasion by microorganisms describes infectious origin, not abnormal embryonic development."), O("'This is a metabolic condition, because endocrine dysfunction before birth disrupts metabolic balance.'", false, "Incorrect. Metabolic origin involves dysfunction such as pancreatic islet or thyroid dysfunction, not the developmental failure described.") ],
  tp: "Congenital = present at birth, not genetic, from failure to develop normally in the embryonic stage or first 2 months of pregnancy. Framework: Nursing Process/ADPIE (accurate patient teaching during assessment)" });

BANK.push({ cat: CA, type: "single",
  stem: "During a health history, a patient with a new lung mass says, 'The provider said it is growing fast and spreading into nearby tissue.' Which origin description should the nurse understand this to match?",
  opts: [ O("A malignant neoplastic process, because abnormal new tissue grows rapidly and invades nearby tissue", true, "Correct. Neoplastic growth is abnormal new tissue; malignant neoplasms rapidly grow and invade and are a serious threat to health."), O("A benign neoplastic process, because new tissue growth always stays limited to its original site only", false, "Incorrect. Some neoplasms are benign, but rapid growth with invasion is the malignant pattern in the chapter."), O("An inflammatory process, because the body is reacting to an injurious agent with an allergic response", false, "Incorrect. Inflammatory origin is a reaction to an injurious agent such as microorganisms or allergens, not invasive new growth."), O("A traumatic process, because physical trauma is the most common reason new tissue invades nearby areas", false, "Incorrect. Traumatic origin follows physical or emotional trauma such as a motor vehicle accident, not invasive tissue growth.") ],
  tp: "Neoplastic = abnormal growth of new tissue, benign or malignant; malignant growth rapidly grows and invades. Framework: Safety first (recognizing a serious threat to health in the history)" });

BANK.push({ cat: CB, type: "single",
  stem: "A patient with a hot, reddened, swollen knee reports pain and cannot bend the joint. Creamy yellow-green drainage is present. Which set of findings should the nurse report as the cardinal signs present here?",
  opts: [ O("Redness, swelling, heat, pain, purulent drainage, and loss of function in the affected knee joint", true, "Correct. All six universal cardinal signs of infection and inflammation are present in this vignette."), O("Redness, swelling, heat, and pain only, because drainage and function are not part of this sign group", false, "Incorrect. Purulent drainage and loss of function complete the cardinal list given in the chapter."), O("Fever, rapid pulse, rapid breathing, and pain only, because vital signs define the local sign group here", false, "Incorrect. Those are systemic vital-sign changes; the cardinal signs are the local findings listed in the chapter."), O("Itching, rash, nausea, and pain only, because the patient reported each of these findings personally", false, "Incorrect. Itching and nausea are symptoms from Table 13.1 examples, not the cardinal sign set for inflammation.") ],
  tp: "Cardinal signs of infection and inflammation: erythema, edema, heat, pain, purulent drainage, and loss of function. Framework: ABCs and safety first (complete recognition of an infectious process)" });

BANK.push({ cat: CB, type: "single",
  stem: "A patient returns 3 days after starting therapy and says all signs of a long-standing illness have completely disappeared. The provider continues monitoring rather than discharging the patient as cured. Which concept explains this plan?",
  opts: [ O("Remission, because the disease characteristics can disappear partly or completely without a cure", true, "Correct. Remission is partial or complete disappearance of clinical and subjective characteristics, spontaneous or from therapy; it is not a cure, and the disease described was long-standing, i.e., chronic."), O("Acute disease, because an illness that disappears after treatment must have begun abruptly this week", false, "Incorrect. The illness was long-standing, which fits chronic disease; disappearance after therapy fits remission."), O("Functional disease, because disappearing findings prove no structural problem ever existed in the body", false, "Incorrect. Functional disease means no structural or physiologic abnormality is found on examination; that is not shown here."), O("Organic disease, because a structural change in an organ is required before monitoring can be stopped", false, "Incorrect. Organic disease describes structural change interfering with function; it does not explain continued monitoring after disappearance.") ],
  tp: "Chronic disease persists over a long period; remission is disappearance of its characteristics, not proof of cure. Framework: Acute vs chronic (long-standing course changes the interpretation)" });

BANK.push({ cat: CB, type: "multi",
  stem: "A nurse assesses a wound with increased redness and warmth. Which explanations from the chapter support these two findings? Select all that apply.",
  opts: [ O("Blood flow to the damaged area has increased, producing both the redness and the warmth felt", true, "Correct. Erythema and heat are the result of increased blood flow to the damaged area."), O("Capillary walls near the damage have become more permeable as tissue chemicals are released", true, "Correct. Damaged tissue releases chemicals that make capillary walls more permeable, letting WBCs and plasma move in."), O("White blood cells are moving into the area to digest microorganisms and cellular debris there", true, "Correct. Neutrophils move to the affected area and digest microorganisms and cellular debris as part of the response."), O("Fluid is collecting in the tissues, and that collection is the direct cause of the redness seen", false, "Incorrect. Excess tissue fluid causes edema and pressure pain; redness and heat come from increased blood flow."), O("Function of the area was lost first, and resting the part then caused the vessels to dilate widely", false, "Incorrect. Loss of function imposes rest as a result of the response; it is not the cause of the redness and heat.") ],
  tp: "Inflammatory response: increased flow causes erythema and heat; permeability lets WBCs and plasma enter; excess fluid causes edema and pain; loss of function rests the area. Framework: Nursing Process/ADPIE (analyzing cues before intervening)" });

BANK.push({ cat: CB, type: "single",
  stem: "A patient's stool is described as dark black and tarry, and the vomitus looks like coffee grounds. Which interpretation should the nurse act on?",
  opts: [ O("Both findings can indicate bleeding in the intestinal tract or stomach and need prompt reporting", true, "Correct. Table 13.1 states dark black, tarry stools mean bleeding in the intestinal tract and coffee-ground vomitus indicates bleeding in the stomach."), O("Both findings are expected after most meals and only need routine documentation at shift change", false, "Incorrect. These are not expected findings; bright red blood would indicate active or gastric bleeding, and these darker forms also signal bleeding."), O("The tarry stool shows lower tract bleeding is active now, and the vomitus finding can be disregarded", false, "Incorrect. Bright red blood indicates active lower bleeding; tarry stool means intestinal tract bleeding, and the vomitus also matters."), O("The coffee-ground vomitus shows the stomach is empty, so the stool finding alone determines the plan", false, "Incorrect. Coffee-ground vomitus indicates stomach bleeding; it adds concern rather than canceling the stool finding.") ],
  tp: "Stool and vomit color traps: tarry black stool = intestinal bleeding; bright red = active lower bleeding; coffee-ground vomitus = stomach bleeding; bright red vomitus = possible gastric hemorrhage. Framework: Safety first (bleeding cues require prompt reporting)" });

BANK.push({ cat: CC, type: "single",
  stem: "A male provider is about to perform a gynecologic examination. Which action should the nurse take first?",
  opts: [ O("Remain in attendance during the examination, as many facilities require for this type of exam", true, "Correct. The nurse should not leave the patient alone, most examiners appreciate a nurse in attendance, and many facilities require a female nurse present when a male provider performs a gynecologic examination."), O("Leave the room once the patient is positioned so the patient has privacy during the examination", false, "Incorrect. Privacy is protected by draping and discretion, not by leaving the patient alone during the exam."), O("Ask the patient to assume the lithotomy position for the full preparation period before the exam", false, "Incorrect. Lithotomy is embarrassing and uncomfortable, so time in it is minimized, not extended during preparation."), O("Obtain the Pap smear slides after the examination so the provider is not delayed at the start time", false, "Incorrect. Supplies such as Pap smear slides are confirmed and obtained before the examination begins.") ],
  tp: "Pre-exam: verify consent, prerequisites, supplies, appropriate room with stirrups for a gynecologic exam, positioning ability, and specimen needs; do not leave the patient alone. Framework: Safety first (attendance, privacy, and patient protection)" });

BANK.push({ cat: CC, type: "single",
  stem: "A frail, weakened patient cannot sit up for assessment of the lungs and upper body. Which position should the nurse use instead?",
  opts: [ O("Supine with the head of the bed elevated, because this patient cannot maintain a sitting position", true, "Correct. Table 13.2 lists this exact alternative for physically weakened patients unable to sit."), O("Prone with the face turned to one side, because this position best expands the lungs for assessment", false, "Incorrect. Prone is used only for hip extension and is tolerated poorly by patients with respiratory difficulties."), O("Knee-chest with the hips raised high, because this position exposes the posterior chest most fully now", false, "Incorrect. Knee-chest provides maximum rectal exposure and is embarrassing and uncomfortable; it is not a lung position."), O("Lithotomy with the legs in stirrups, because this position keeps a weakened patient from falling down", false, "Incorrect. Lithotomy exposes the female genitalia and genital tract for speculum insertion, not the lungs or upper body.") ],
  tp: "Sitting gives full lung expansion and symmetry; the weakened patient alternative is supine with head of bed elevated. Framework: Stable vs unstable (matching position to the patient's strength)" });

BANK.push({ cat: CC, type: "single",
  stem: "A patient becomes short of breath whenever the head of the bed is lowered flat. The nurse needs to assess the abdomen. Which adjustment keeps the assessment valid?",
  opts: [ O("Use supine or dorsal recumbent with the head of the bed raised as this patient needs for breathing", true, "Correct. The supine table entry directs raising the head of the bed if the patient becomes short of breath easily; dorsal recumbent relaxes abdominal muscles, with knees flexed for comfort."), O("Place the patient prone for the abdominal assessment so the back muscles support the breathing effort", false, "Incorrect. Prone is only for hip extension assessment and is tolerated poorly with respiratory difficulty."), O("Keep the patient fully flat until the abdominal assessment ends, then raise the head of the bed again", false, "Incorrect. A patient who becomes short of breath easily should have the head of bed raised; breathing takes priority over a flat position."), O("Move the patient to knee-chest so abdominal contents shift and the abdomen is easier to palpate today", false, "Incorrect. Knee-chest is for maximum rectal exposure, is embarrassing and uncomfortable, and would worsen breathing.") ],
  tp: "Position limitations are safety data: dyspnea changes the position plan; dorsal recumbent relaxes the abdomen and knees flexed eases painful disorders. Framework: ABCs (breathing outranks completing the abdominal position)" });

BANK.push({ cat: CC, type: "single",
  stem: "At the start of an interview, a patient keeps asking how the hospital bed works and appears distracted. Which action best follows the chapter's interview guidance?",
  opts: [ O("Answer the pressing question about the bed first, then begin the assessment questions with the patient", true, "Correct. Answering pressing questions first meets immediate needs; a patient distracted by the bed thinks about that more than the questions."), O("Repeat the assessment questions more slowly until the patient stops asking about the hospital bed", false, "Incorrect. Slowing down does not remove the distraction; meeting the immediate need first is the chapter guidance."), O("Tell the patient the bed will be explained after the 30-minute interview has been fully completed", false, "Incorrect. Deferring a pressing question leaves the patient distracted; the chapter directs answering it first."), O("Ask a family member to answer the assessment questions while the patient figures out the bed alone", false, "Incorrect. The health history comes from the patient; family data supplements but does not replace the patient's answers.") ],
  tp: "Interview technique: introduce name, role, purpose, and time; answer pressing questions first; sit at eye level; use the patient's preferred name; nonjudgmental language, reflection, and restating clarify communication. Framework: Maslow (immediate comfort and control needs before data collection)" });

BANK.push({ cat: CC, type: "multi",
  stem: "Which interview behaviors build trust and a therapeutic relationship during assessment? Select all that apply.",
  opts: [ O("Conducting the interview in a private, well-lit setting while remaining objective and compassionate", true, "Correct. A private, well-lit setting with compassion, concern, and objectivity is the chapter standard."), O("Sitting or standing at eye level and using the name the patient wishes to be addressed by today", true, "Correct. Eye level enhances comfort, and using the patient's chosen name is a listed technique."), O("Using nonjudgmental responses such as 'Yes, I see' that encourage the patient to keep talking", true, "Correct. Nonjudgmental language encourages communication without the patient feeling threatened."), O("Promising to keep detailed family information from every other member of the care team entirely", false, "Incorrect. Information is shared only with caregivers who need it to provide care; it is not withheld from the team providing care."), O("Continuing questions without pause when the patient becomes uncomfortable or unstable in bed", false, "Incorrect. The nurse pauses the interview if necessary, stabilizes the patient, and ensures comfort and safety before proceeding.") ],
  tp: "Trust is the last step of initiating the relationship; professionalism, privacy, eye contact, and approving nods facilitate exchange of information. Framework: Safety first (pause and stabilize before continuing the interview)" });

BANK.push({ cat: CD, type: "order",
  stem: "Place the steps of preparing for and starting a physical assessment in the correct order.",
  items: [ { t: "Wash hands thoroughly before beginning the physical assessment of the patient", r: "Hand hygiene comes first, before beginning the assessment, per CDC standard precautions guidance in the chapter." }, { t: "Give the patient the opportunity to empty the bladder before the examination", r: "Voiding before the exam makes the patient more comfortable and allows easier abdominal assessment." }, { t: "Obtain vital signs, pain rating, height, and weight at the start of the examination", r: "Vital signs are obtained at the beginning and give clues to areas needing detailed assessment; height and weight are measured then and compared with stated values." }, { t: "Begin the head-to-toe sequence with the neurologic assessment of the patient", r: "The head-to-toe assessment begins with neurologic assessment, then skin, hair, head, and neck." } ],
  tp: "Assessment setup: hand hygiene, bladder emptying, vital signs including pain as the fifth vital sign, then a systematic head-to-toe sequence performed the same way each time. Framework: Nursing Process/ADPIE (ordered assessment sequence)" });

BANK.push({ cat: CD, type: "order",
  stem: "Place the head-to-toe assessment areas in the correct order as listed in the chapter.",
  items: [ { t: "Neurologic assessment, then skin, hair, head, and neck assessment", r: "Neurologic assessment is first in the head-to-toe sequence." }, { t: "Eyes, ears, nose, and mouth as part of the head assessment", r: "The head assessment includes eyes, ears, nose, and mouth after the opening neurologic and skin steps." }, { t: "Chest, back, arms, and then the abdomen of the patient", r: "Chest, back, and arms come before the abdomen in the listed order." }, { t: "Perineal area, then the legs, and finally the feet", r: "Perineal area, legs, and feet complete the sequence in that order." } ],
  tp: "Head-to-toe order: neurologic, skin, hair, head/neck (eyes, ears, nose, mouth), chest, back, arms, abdomen, perineal area, legs, feet. Painful areas are assessed last; assessment is continuous, not one-time. Framework: Nursing Process/ADPIE (systematic sequence prevents omissions)" });

BANK.push({ cat: CD, type: "single",
  stem: "Midway through a head-to-toe assessment, the nurse reaches a markedly tender abdomen that makes the patient guard and grimace. A colleague suggests finishing that area first next time. Which principle should guide the plan for the next assessment?",

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
