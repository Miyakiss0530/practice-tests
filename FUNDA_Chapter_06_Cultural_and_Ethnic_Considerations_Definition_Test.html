<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Culture, Bias, and Competence";
var CB = "Race, Ethnicity, Gender, and Disability";
var CC = "Communication, Space, and Time";
var CD = "Belief Systems and Culturally Congruent Care";
var CATS = [CA, CB, CC, CD];
var KEYTERMS = [];

 CA: {

   "multi": 2
  }
 },
 CB: {
  "name": CB,

   "multi": 2
  }
 },
 CC: {
  "name": CC,

 },
 CD: {
  "name": CD,

  "types": {
   "single": 12,
   "multi": 1
  }
 }
};
BANK.push({ cat: CA, type: "single", stem: "Which statement about culture is accurate?", opts: [{"t": "Culture is learned from birth through language and socialization in the family", "c": true, "r": "Correct. Box 6.1 lists culture as learned, beginning at birth, through language and socialization."}, {"t": "Culture is inherited genetically and stays fixed throughout a person's lifetime", "c": false, "r": "Wrong. Cultural behavior is socially acquired, not genetically inherited."}, {"t": "Culture is chosen by each adult and can be changed at will like clothing styles", "c": false, "r": "Wrong. Culture is learned inside the family system from birth, not picked at will."}, {"t": "Culture is the same for every member of a group in every part of daily living", "c": false, "r": "Wrong. Members of one culture vary because of individual differences."}], tp: "Box 6.1: culture is learned, dynamic, shared in patterns, and an adaptation to location." });
BANK.push({ cat: CA, type: "multi", stem: "Which are characteristics of culture as listed in Box 6.1? Select all that apply.", opts: [{"t": "Culture is learned, beginning at birth, through language and socialization", "c": true, "r": "Correct. This is Box 6.1 characteristic one."}, {"t": "Culture tends to be dynamic and ever changing across the generations", "c": true, "r": "Correct. This is Box 6.1 characteristic two."}, {"t": "Culture is an adaptation to conditions in a specific location or place", "c": true, "r": "Correct. This is Box 6.1 characteristic four."}, {"t": "Culture is carried in the genes and passed down only through heredity", "c": false, "r": "Wrong. Culture is learned and socially acquired, not genetic."}, {"t": "Culture stays exactly the same because traditions never change at all", "c": false, "r": "Wrong. Culture is described as dynamic and ever changing."}], tp: "Members of a culture also share patterns present in every culture, such as communication and family systems." });
BANK.push({ cat: CA, type: "single", stem: "The description of the United States as a pot of vegetable soup conveys that:", opts: [{"t": "Many distinct groups are combined while each piece keeps its own identity", "c": true, "r": "Correct. The soup image keeps pieces distinct, unlike the melting pot image."}, {"t": "All groups blend completely until everyone shares identical values and beliefs", "c": false, "r": "Wrong. Complete blending is the melting pot image the chapter moves away from."}, {"t": "Each cultural group should give up its customs when entering American society", "c": false, "r": "Wrong. The soup image preserves distinct pieces rather than erasing them."}, {"t": "Society works best when one group's practices are adopted by all other groups", "c": false, "r": "Wrong. No culture is superior to another; each is evaluated on its own merits."}], tp: "Melting pot = blended until the same. Vegetable soup = distinct pieces in one rich assortment." });
BANK.push({ cat: CA, type: "single", stem: "Health disparities are best described as:", opts: [{"t": "Preventable negative outcomes that fall hardest on disadvantaged populations", "c": true, "r": "Correct. That is the chapter definition of health disparities."}, {"t": "Inevitable genetic differences in health that no intervention could ever change", "c": false, "r": "Wrong. Disparities are described as preventable and extend beyond genetic differences."}, {"t": "Differences in hospital food and room choice offered to patients at admission", "c": false, "r": "Wrong. Disparities concern health outcomes in disadvantaged populations."}, {"t": "Equal health outcomes shared evenly across every racial and ethnic population", "c": false, "r": "Wrong. Disparities are unequal, preventable outcomes, not equal ones."}], tp: "Racial and ethnic differences remain risk factors beyond expected genetic and biological differences." });
BANK.push({ cat: CA, type: "single", stem: "Which statement distinguishes unconscious bias from cultural bias?", opts: [{"t": "Unconscious bias is unintentional, while cultural bias holds one's own culture as best", "c": true, "r": "Correct. Unconscious bias is unintentional; cultural bias is believing one's own culture is best."}, {"t": "Unconscious bias is deliberate, while cultural bias happens entirely by accident", "c": false, "r": "Wrong. The chapter calls unconscious bias unintentional, not deliberate."}, {"t": "Unconscious bias affects only patients, while cultural bias affects hiring alone", "c": false, "r": "Wrong. Unconscious bias also affects hiring and team relationships."}, {"t": "Unconscious bias can be cured in a day, while cultural bias never changes at all", "c": false, "r": "Wrong. Neither claim appears in the chapter; awareness is the work described."}], tp: "A stereotype is a fixed idea or image of a person or culture that is not easily changed." });
BANK.push({ cat: CA, type: "single", stem: "A stereotype is best described as:", opts: [{"t": "An idea or image of a person or culture that is not easily changed by facts", "c": true, "r": "Correct. That is the chapter's wording for a stereotype."}, {"t": "A careful assessment of one individual patient done before any care is planned", "c": false, "r": "Wrong. A stereotype is a fixed shortcut, the opposite of individual assessment."}, {"t": "A professional interpreter's summary of what a patient said during an interview", "c": false, "r": "Wrong. Interpretation is a language service, not a stereotype."}, {"t": "A shared pattern such as a family system that is present in every known culture", "c": false, "r": "Wrong. Shared patterns are a characteristic of culture, not a stereotype."}], tp: "Never assess by stereotype: judge each patient as an individual, in a holistic manner." });
BANK.push({ cat: CA, type: "single", stem: "Cultural competence requires the nurse to:", opts: [{"t": "Become aware of her own beliefs and how they relate to the beliefs of others", "c": true, "r": "Correct. Awareness of one's own beliefs in relation to others is cultural competence."}, {"t": "Treat every patient in exactly the same way so that care is always fully equal", "c": false, "r": "Wrong. The chapter states it is not possible to act the same with all patients and give individualized care."}, {"t": "Memorize the customs of every culture before speaking with any new patient", "c": false, "r": "Wrong. Competence begins with self-awareness, not memorizing every culture."}, {"t": "Set her own beliefs aside permanently and adopt each patient's beliefs fully", "c": false, "r": "Wrong. The nurse recognizes her beliefs and their limits; she does not adopt the patient's."}], tp: "Self-assessment identifies the personal beliefs that can limit care for other cultures." });
BANK.push({ cat: CA, type: "single", stem: "Transcultural nursing is best described as:", opts: [{"t": "Integrating understanding of cultural variables into all aspects of nursing care", "c": true, "r": "Correct. That is the chapter's definition of transcultural nursing."}, {"t": "Assigning nurses only to patients who come from their own cultural background", "c": false, "r": "Wrong. Transcultural nursing is about integrating understanding, not matching backgrounds."}, {"t": "Using a professional interpreter for every patient who speaks a second language", "c": false, "r": "Wrong. Interpreters are one tool; transcultural nursing covers all aspects of care."}, {"t": "Following one standard routine for every patient regardless of cultural needs", "c": false, "r": "Wrong. A single rigid routine ignores the variables transcultural nursing integrates."}], tp: "Strive for a high level of transcultural nursing in day-to-day practice." });
BANK.push({ cat: CA, type: "multi", stem: "Which factors explain why members of the same culture may behave differently? Select all that apply.", opts: [{"t": "Age and the amount of interaction between younger and older generations", "c": true, "r": "Correct. Both are listed sources of variation within a culture."}, {"t": "Religion, dialect or language spoken, and socioeconomic background history", "c": true, "r": "Correct. All three are listed sources of variation."}, {"t": "Geographic location of origin or of the person's current place of residence", "c": true, "r": "Correct. Location is a listed source of variation."}, {"t": "The patient's blood type and the season in which the patient was born abroad", "c": false, "r": "Wrong. Neither blood type nor birth season is listed."}, {"t": "Whether the patient prefers morning or evening appointments at the clinic", "c": false, "r": "Wrong. Appointment preference is not a listed source of cultural variation."}], tp: "Also listed: degree of adopting the current country's values, and gender identity and roles." });
BANK.push({ cat: CA, type: "single", stem: "Which statement about subcultures is accurate?", opts: [{"t": "A subculture shares the primary culture's traits but has its own distinct patterns", "c": true, "r": "Correct. A subculture shares many characteristics yet is distinguished by its own patterns and ideals."}, {"t": "A subculture exists only outside the United States and never inside its borders", "c": false, "r": "Wrong. Subcultures exist even among Americans here for several generations, such as Appalachia versus New York City."}, {"t": "A subculture is a group whose members reject every value of the primary culture", "c": false, "r": "Wrong. A subculture shares many characteristics with the primary culture."}, {"t": "A subculture is formed only by people who arrived in the country most recently", "c": false, "r": "Wrong. Length of residence does not define a subculture."}], tp: "Understanding variables and accepting each person as an individual are the first steps in holistic care." });
BANK.push({ cat: CA, type: "single", stem: "Increasing diversity among health care providers has been shown to:", opts: [{"t": "Improve care delivery, most notably for patients at risk of poor health outcomes", "c": true, "r": "Correct. The improvement is most notable in patients typically more at risk of negative outcomes."}, {"t": "Remove the need for nurses to learn about the cultures of their own patients", "c": false, "r": "Wrong. Provider diversity does not replace learning about patients' cultures."}, {"t": "Eliminate unconscious bias from hiring practices in a single hiring cycle", "c": false, "r": "Wrong. Bias in hiring is described as an ongoing problem, not an eliminated one."}, {"t": "Guarantee that every patient is cared for by someone of the same background", "c": false, "r": "Wrong. Diversity improves delivery; it does not promise matched backgrounds."}], tp: "Black, Hispanic, LGBT, and disabled health care workers are underrepresented compared with the general population." });
BANK.push({ cat: CB, type: "single", stem: "Race and ethnicity differ in that:", opts: [{"t": "Race is shared biological traits, while ethnicity is shared social and cultural heritage", "c": true, "r": "Correct. Race = biological physical characteristics and hereditary factors; ethnicity = common social and cultural heritage."}, {"t": "Race is shared heritage and customs, while ethnicity is shared blood and heredity", "c": false, "r": "Wrong. That reverses the two definitions given in the chapter."}, {"t": "Race is chosen by the individual, while ethnicity is assigned by the census bureau", "c": false, "r": "Wrong. Neither term is defined by personal choice or census assignment."}, {"t": "Race covers language and dress, while ethnicity covers only physical body traits", "c": false, "r": "Wrong. Language, religion, dress, music, and food are shared social practices of ethnicity."}], tp: "Race = biology shared. Ethnicity = heritage shared." });
BANK.push({ cat: CB, type: "single", stem: "Which census change did Table 6.1 record for the Hispanic or Latino population?", opts: [{"t": "It rose from 12.5 percent of the population in 2000 to 16.3 percent in 2010", "c": true, "r": "Correct. Table 6.1 prints 12.5% in 2000 and 16.3% in 2010 for Hispanic or Latino of any race."}, {"t": "It fell from 16.3 percent of the population in 2000 to 12.5 percent in 2010", "c": false, "r": "Wrong. The direction is reversed; the share rose over the decade."}, {"t": "It stayed at 12.5 percent of the population across both census count years", "c": false, "r": "Wrong. The table shows an increase, not a flat share."}, {"t": "It rose from 2.4 percent of the population in 2000 to 2.9 percent in 2010", "c": false, "r": "Wrong. Those figures belong to the two-or-more-races group."}], tp: "White share fell 75.1% to 72.4%; Asian growth was the largest at +43.3%." });
BANK.push({ cat: CB, type: "single", stem: "A professional interpreter is preferred over a family member because family interpreting risks:", opts: [{"t": "Bias, inaccuracy, and loss of confidentiality during personal health discussions", "c": true, "r": "Correct. The chapter names bias, inaccuracy, and compromised confidentiality."}, {"t": "Extra billing charges that the hospital must pass on to the patient's family", "c": false, "r": "Wrong. Cost is not the reason the chapter gives."}, {"t": "Longer appointments, because relatives tend to talk more than professionals do", "c": false, "r": "Wrong. Appointment length is not the stated concern."}, {"t": "Confusion, because relatives always speak a different dialect than the patient", "c": false, "r": "Wrong. Dialect difference is not the reason given in the chapter."}], tp: "Adults may refuse to answer personal questions honestly when a child or grandchild translates." });
BANK.push({ cat: CB, type: "single", stem: "Sexual orientation and gender identity differ in that:", opts: [{"t": "Orientation is attraction to others, while identity is the internal sense of self", "c": true, "r": "Correct. Orientation = attraction felt toward others; identity = internal sense of self as male, female, neither, or both."}, {"t": "Orientation is the internal sense of self, while identity is attraction to others", "c": false, "r": "Wrong. That reverses the chapter's contrast between the two terms."}, {"t": "Orientation covers clothing and dress, while identity covers surgical decisions", "c": false, "r": "Wrong. The chapter states sexuality is not about how someone feels or dresses, and identity is not about clothes, partners, or surgery."}, {"t": "Orientation is documented with pronouns, while identity is never documented at all", "c": false, "r": "Wrong. Both are handled respectfully in care and documentation."}], tp: "Sexuality is about attraction, not about how someone feels or dresses." });
BANK.push({ cat: CB, type: "single", stem: "In documentation, the abbreviation MTF (M2F) indicates a patient who:", opts: [{"t": "Identifies as a woman but was born with male genitalia, a trans woman or female", "c": true, "r": "Correct. MTF means male to female, documented as trans woman or trans female."}, {"t": "Identifies as a man but was born with female genitalia, a trans man or male", "c": false, "r": "Wrong. That describes FTM, female to male."}, {"t": "Is questioning identity and has asked that no label be placed in the chart", "c": false, "r": "Wrong. Questioning is part of LGBTQ+, not the meaning of MTF."}, {"t": "Was born with both sets of genitalia and identifies as neither male nor female", "c": false, "r": "Wrong. That is not the chapter's definition of MTF documentation."}], tp: "Mirror pair: FTM / F2M = trans man, born with female genitalia, identifies as male." });
BANK.push({ cat: CB, type: "multi", stem: "Members of the LGBT community face increased risk of which problems? Select all that apply.", opts: [{"t": "Substance abuse linked to social stigma and discrimination in daily life", "c": true, "r": "Correct. Substance abuse is a listed increased risk."}, {"t": "Mental health problems, including a higher risk of suicide in this group", "c": true, "r": "Correct. Mental health problems and suicide are listed risks."}, {"t": "Victimization and violence directed at them because of social stigma", "c": true, "r": "Correct. Increased victimization and violence are listed."}, {"t": "Lactose intolerance occurring at rates far above every other population", "c": false, "r": "Wrong. Lactose intolerance is discussed for other groups, not as an LGBT risk."}, {"t": "Sickle cell anemia occurring more often than in any ancestry group listed", "c": false, "r": "Wrong. Sickle cell anemia is linked to African ancestry in the chapter."}], tp: "Acceptance improves mental health and safety for members of this community." });
BANK.push({ cat: CB, type: "single", stem: "Per the CDC wording in this chapter, a disability is a condition of body or mind that makes it harder to:", opts: [{"t": "Do certain activities and interact with the world, limiting participation daily", "c": true, "r": "Correct. The CDC definition pairs activity limitation with participation restrictions."}, {"t": "Qualify for health insurance coverage through an employer or public program", "c": false, "r": "Wrong. Insurance qualification is not part of the CDC definition quoted."}, {"t": "Communicate only in writing rather than speaking with health care providers", "c": false, "r": "Wrong. The definition is broader than communication alone."}, {"t": "Recover fully from an illness within the usual expected healing time frame", "c": false, "r": "Wrong. The definition concerns activities and participation, not healing time."}], tp: "26% of US adults, roughly 1 in 4, have some form of disability; mobility and cognition are most common." });
BANK.push({ cat: CB, type: "multi", stem: "Which barriers to health care do adults with disabilities commonly face? Select all that apply.", opts: [{"t": "Transportation difficulties getting to and from health care appointments", "c": true, "r": "Correct. Transportation is a listed barrier."}, {"t": "Financial concerns related to insurance coverage or payment for their care", "c": true, "r": "Correct. Financial concerns are a listed barrier."}, {"t": "Communication challenges when trying to obtain or understand health care", "c": true, "r": "Correct. Communication challenges are a listed barrier."}, {"t": "A complete absence of any modifiable risk factors in their daily health", "c": false, "r": "Wrong. The chapter states they have more modifiable risk factors, not fewer."}, {"t": "Refusal of all teaching because they have no interest in their own health", "c": false, "r": "Wrong. The chapter cites missed teaching opportunities, not patient refusal."}], tp: "Adults with disabilities have higher rates of obesity, smoking, heart disease, and diabetes." });
BANK.push({ cat: CB, type: "single", stem: "Within disability culture, disability is viewed as a condition that:", opts: [{"t": "Does not need to be fixed, but needs to be accommodated in the environment", "c": true, "r": "Correct. Disability culture views disability as a human condition to accommodate, not fix."}, {"t": "Must be corrected before the person can take part in community life fully", "c": false, "r": "Wrong. That fixing view is the opposite of the disability culture perspective."}, {"t": "Belongs only to people born with a condition, never to those injured later", "c": false, "r": "Wrong. Acquired disability, such as after stroke, is part of the same discussion."}, {"t": "Is defined only by family members rather than by the person who lives with it", "c": false, "r": "Wrong. The view described belongs to disability culture itself."}], tp: "Making the environment more accessible lets people do more; helping independence improves health and safety." });
BANK.push({ cat: CB, type: "single", stem: "Ableism is best described as:", opts: [{"t": "Discrimination and prejudice that define a person by their disability alone", "c": true, "r": "Correct. Ableism defines the person by the disability and prefers people without disabilities."}, {"t": "A communication method that uses boards, gestures, and pictures with patients", "c": false, "r": "Wrong. Those are alternative communication methods, not ableism."}, {"t": "A legal duty to provide an advocate for every patient at every appointment", "c": false, "r": "Wrong. Offering an advocate is respectful practice, not ableism."}, {"t": "The practice of sitting at eye level when speaking with a patient in a chair", "c": false, "r": "Wrong. Sitting at eye level is recommended etiquette, not discrimination."}], tp: "Directing questions to a companion instead of the patient is the chapter's health care example of ableism." });

BANK.push({ cat: CC, type: "single", stem: "A present-oriented patient is most likely to:", opts: [{"t": "Meet a current urgent need before preparing for a less immediate future need", "c": true, "r": "Correct. Present orientation satisfies the current, more urgent need first."}, {"t": "Take preventive medication faithfully now to avoid an illness years from now", "c": false, "r": "Wrong. That is the chapter's example of future orientation."}, {"t": "Keep every appointment exactly on time regardless of competing family needs", "c": false, "r": "Wrong. Punctuality is a separate time pattern from orientation."}, {"t": "Refuse all treatment because the future holds no meaning for the patient", "c": false, "r": "Wrong. Present orientation is about priority of needs, not refusal of care."}], tp: "Present orientation can make chronic-illness follow-through hard: rent or food now can outweigh prevention later." });

}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 6: Cultural and Ethnic Considerations - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
</html>
