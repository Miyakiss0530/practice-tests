<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Rehabilitation Philosophy, Goals and Plans";
var CB = "Rehabilitation Team and Nursing Roles";
var CC = "Family, Culture and Specialty Rehabilitation";
var CD = "PTSD and Polytrauma";

var KEYTERMS = [];

 CA: {

 },
 CB: {

 },
 CD: {

 },
 CE: {

 },
 CF: {

 }
};

BANK.push({"cat": CA, "type": "single", "stem": "Which statement best describes the underlying philosophy of rehabilitation nursing?", "opts": [{"t": "Care is centered on completing tasks the patient can no longer perform", "c": false, "r": "Incorrect. Doing tasks for the patient works against independence and the abilities focus."}, {"t": "Care is centered on curing the condition that caused the disability", "c": false, "r": "Incorrect. Many conditions are irreversible; the focus is adaptation, not cure."}, {"t": "Care is centered on making the most of abilities that remain intact", "c": true, "r": "Correct. The chapter philosophy is to focus on abilities rather than disabilities."}, {"t": "Care is centered on limiting family involvement to scheduled visits only", "c": false, "r": "Incorrect. Family participation is encouraged and the family is a focus of rehabilitation efforts."}], "tp": "Focus on abilities rather than disabilities, and continually make the most of abilities that remain intact."});

BANK.push({"cat": CA, "type": "single", "stem": "A condition that lasts 3 months or longer, with periods of remission and exacerbation, is accurately called which of the following?", "opts": [{"t": "A functional limitation, because the patient cannot perform a daily living task", "c": false, "r": "Incorrect. Functional limitation is loss of ability to perform ADLs, not a duration definition."}, {"t": "An impairment only, because any lasting condition is a structural abnormality", "c": false, "r": "Incorrect. Impairment is loss or abnormality of structure or function, not the 3-month course."}, {"t": "A chronic illness, because duration and course both fit the chapter definition", "c": true, "r": "Correct. Chronic illness lasts 3 months or longer and can remit and exacerbate."}, {"t": "An acute illness, because the onset was abrupt and the course is self-limiting", "c": false, "r": "Incorrect. Acute illness is abrupt and self-limiting; duration here is prolonged."}], "tp": "Chronic illness: a condition or state lasting 3 months or longer, with periods of remission and exacerbation."});

BANK.push({"cat": CA, "type": "single", "stem": "A patient has lost the ability to participate in employment and community events because of a physical impairment. Which term is most accurate?", "opts": [{"t": "Chronicity, the tendency of a condition to persist indefinitely", "c": false, "r": "Incorrect. Chronicity describes persistence over time, not participation loss."}, {"t": "Impairment, the loss of a body structure noted on examination", "c": false, "r": "Incorrect. Impairment names the underlying loss or abnormality, not the lost participation."}, {"t": "Functional limitation, the loss of one specific daily living task", "c": false, "r": "Incorrect. Functional limitation is about performing tasks or ADLs, not life-activity participation."}, {"t": "Disability, the loss of participation in major life activities", "c": true, "r": "Correct. Disability is loss of ability to participate in major life activities such as employment and community events."}], "tp": "Impairment = structure/function loss; disability = lost participation in major life activities; functional limitation = lost ADL performance."});

BANK.push({"cat": CA, "type": "multi", "stem": "Which statements are accurate about rehabilitation goals? Select all that apply.", "opts": [{"t": "Goals assist the patient with home and community reentry planning", "c": true, "r": "Correct. Home and community reentry is a stated criterion of rehabilitation goals."}, {"t": "Goals promote wellness while working to minimize complications", "c": true, "r": "Correct. Promoting wellness and minimizing complications is a stated goal criterion."}, {"t": "Goals aim to increase the quantity of life as the first priority", "c": false, "r": "Incorrect. Goals focus on quality of life rather than quantity of life."}, {"t": "Goals maximize the quality of life of the patient being served", "c": true, "r": "Correct. Maximizing quality of life is a criterion of every rehabilitation goal."}, {"t": "Goals are set by the team alone and then presented to the patient", "c": false, "r": "Incorrect. Goal setting is collaborative, with the patient and family at the center."}], "tp": "Rehabilitation goals are personal, collaborative, measurable in effect, and aimed at quality of life, function, and community reentry."});

BANK.push({"cat": CA, "type": "single", "stem": "Under Commission on Accreditation of Rehabilitation Facilities timing, the individualized comprehensive rehabilitation plan must be initiated within which time frame?", "opts": [{"t": "Within 24 hours of the patient's hospital admission to the unit", "c": true, "r": "Correct. The comprehensive plan is initiated within 24 hours of admission."}, {"t": "Within 3 days of the patient's hospital admission to the unit", "c": false, "r": "Incorrect. Three days is the deadline for the plan to be ready for team review and revision."}, {"t": "Within 1 week of the patient's hospital admission to the unit", "c": false, "r": "Incorrect. One week is too late for both the initiation and the review deadlines."}, {"t": "Within 24 hours of the patient's discharge from the hospital", "c": false, "r": "Incorrect. The timing runs from admission, not from discharge."}], "tp": "Plan initiated within 24 hours of admission; ready for team review and revision within 3 days."});

BANK.push({"cat": CA, "type": "single", "stem": "Which feature must every goal in the comprehensive rehabilitation plan have?", "opts": [{"t": "Goals are written in general terms so any clinician can interpret them", "c": false, "r": "Incorrect. Vague goals cannot be measured or evaluated against a time frame."}, {"t": "Goals are kept separate from the environment the patient returns to", "c": false, "r": "Incorrect. The plan reflects the environment where the patient will go after discharge."}, {"t": "Goals are assigned without naming the team member responsible for them", "c": false, "r": "Incorrect. The responsible team member or members must be listed in the plan."}, {"t": "Goals are measurable, stated in functional terms, with time frames", "c": true, "r": "Correct. Goals must be measurable, described in functional or behavioral terms, and have time frames."}], "tp": "Comprehensive plan goals: measurable, functional or behavioral, time-framed, with responsible team members listed."});

BANK.push({"cat": CA, "type": "single", "stem": "Which statement accurately contrasts acute and chronic illness as the chapter presents them?", "opts": [{"t": "Acute illness is abrupt and self-limiting; chronic illness persists indefinitely", "c": true, "r": "Correct. Acute illnesses resolve or end in death; chronic illnesses persist for an extended, indefinite period."}, {"t": "Acute and chronic illness differ only in the age group that they usually affect", "c": false, "r": "Incorrect. The contrast is onset and course, not age group alone."}, {"t": "Acute illness persists indefinitely; chronic illness is abrupt and self-limiting", "c": false, "r": "Incorrect. That reverses the chapter's contrast between the two courses."}, {"t": "Acute illness always allows full function; chronic illness always removes function", "c": false, "r": "Incorrect. Patients with chronic illness often still function, with some limitation."}], "tp": "Chronicity: acute = abrupt, self-limiting; chronic = abrupt or insidious onset, persisting indefinitely."});

BANK.push({"cat": CA, "type": "multi", "stem": "Which items are cornerstones that help a rehabilitation patient reach the goals? Select all that apply.", "opts": [{"t": "Functional ability, with progress measured by functional outcomes", "c": true, "r": "Correct. Progress in rehabilitation is measured in terms of functional outcomes."}, {"t": "Community reentry through social and recreational participation", "c": true, "r": "Correct. Community reentry is a named cornerstone of rehabilitation."}, {"t": "Prevention and wellness aimed at avoiding further complications", "c": true, "r": "Correct. Prevention and wellness is a named cornerstone."}, {"t": "Dependence, with the team directing all care decisions long term", "c": false, "r": "Incorrect. Independence, not dependence, is the cornerstone; patients direct their own care."}, {"t": "Patient and family education as an essential program component", "c": true, "r": "Correct. Knowledge and skills through education are essential to the program."}], "tp": "Cornerstones include focus on the individual, community reentry, independence, functional ability, team approach, quality of life, prevention and wellness, change, adaptation, and education."});

BANK.push({"cat": CA, "type": "single", "stem": "Which statistic matches the chapter's account of chronic illness in the United States?", "opts": [{"t": "113 million Americans, about 40% of the population, have chronic illness", "c": true, "r": "Correct. The chapter gives 113 million Americans, 40% of the population."}, {"t": "80 million Americans, about 40% of the population, have chronic illness", "c": false, "r": "Incorrect. The printed figure is 113 million, not 80 million."}, {"t": "113 million Americans, about 90% of the population, have chronic illness", "c": false, "r": "Incorrect. Ninety percent is the share of health care expenditures, not of the population."}, {"t": "40 million Americans, about 80% of the population, have chronic illness", "c": false, "r": "Incorrect. Eighty percent describes adults aged 65 and older with chronic disease, not the whole population."}], "tp": "113 million Americans (40%) have a chronic illness; about 90% of health care expenditures go to chronic conditions; 80% of those 65 and older live with chronic disease."});

BANK.push({"cat": CA, "type": "single", "stem": "Rehabilitation is described in the chapter as a bridge for the patient. Between which two states does it span the gap?", "opts": [{"t": "Between acute care and long-term care, and between cure and comfort", "c": false, "r": "Incorrect. The bridge image is about the patient's experience, not care settings."}, {"t": "Between admission and discharge, and between hospital and home care", "c": false, "r": "Incorrect. Those are care transitions, not the chapter's bridge image."}, {"t": "Between childhood and adulthood, and between dependence and old age", "c": false, "r": "Incorrect. Rehabilitation spans the life continuum but the bridge wording is about usefulness and hope."}, {"t": "Between uselessness and usefulness, hopelessness and hopefulness", "c": true, "r": "Correct. Rehabilitation bridges uselessness to usefulness, hopelessness to hopefulness, and despair to happiness."}], "tp": "Rehabilitation is a bridge spanning uselessness to usefulness, hopelessness to hopefulness, despair to happiness."});

BANK.push({"cat": CB, "type": "single", "stem": "Which team member is the rehabilitation physician who serves as team leader and coordinator of the program?", "opts": [{"t": "The physiatrist, who leads and coordinates the rehabilitation program", "c": true, "r": "Correct. The physiatrist is the rehabilitation physician, team leader, and coordinator."}, {"t": "The rehabilitation RN, who leads and coordinates the rehabilitation program", "c": false, "r": "Incorrect. The rehabilitation RN is coordinator and educator, but the physician leader is the physiatrist."}, {"t": "The clinical psychologist, who leads and coordinates the program overall", "c": false, "r": "Incorrect. The psychologist is the emotional evaluator, not the team leader."}, {"t": "The vocational counselor, who leads and coordinates the program overall", "c": false, "r": "Incorrect. The vocational counselor is the vocational planner for employment training."}], "tp": "Physiatrist = rehabilitation physician and team leader; the patient is the key member of the team."});

BANK.push({"cat": CB, "type": "single", "stem": "Which role belongs to the rehabilitation RN in Table 39.1?", "opts": [{"t": "Coordinator and educator who promotes patient independence daily", "c": true, "r": "Correct. The rehabilitation RN coordinates, educates patient and family, provides support, and promotes independence."}, {"t": "Recreation planner who organizes leisure activities for the patient", "c": false, "r": "Incorrect. Planning leisure activities belongs to the therapeutic recreation therapist."}, {"t": "Vocational planner who obtains training for new or current employment", "c": false, "r": "Incorrect. Vocational planning belongs to the vocational rehabilitation counselor."}, {"t": "Emotional evaluator who assesses the mental health continuum position", "c": false, "r": "Incorrect. Assessing the mental health continuum belongs to the clinical psychologist."}], "tp": "Rehabilitation RN: coordinator, educator; Rehabilitation LPN/LVN: care provider and patient advocate who reinforces education."});

BANK.push({"cat": CB, "type": "single", "stem": "A therapist recommends equipment modifications and adapts equipment after assessing independent living needs. Which team member is this?", "opts": [{"t": "The physical therapist, who designs the patient's exercise program", "c": false, "r": "Incorrect. The physical therapist designs exercise programs and provides training."}, {"t": "The speech-language pathologist, who assesses swallowing abilities", "c": false, "r": "Incorrect. The speech-language pathologist assesses communication and swallowing and designs communication programs."}, {"t": "The occupational therapist, who assesses independent living needs", "c": true, "r": "Correct. The occupational therapist assesses independent living needs and adapts equipment."}, {"t": "The therapeutic recreation therapist, who plans leisure activities", "c": false, "r": "Incorrect. The recreation therapist plans leisure activities, not equipment adaptation."}], "tp": "Occupational therapist = independent living needs and equipment; physical therapist = exercise program; speech-language pathologist = communication and swallowing."});

BANK.push({"cat": CB, "type": "single", "stem": "Which description matches the interdisciplinary rehabilitation team model?", "opts": [{"t": "Members keep clear boundaries and pursue discipline-specific goals separately", "c": false, "r": "Incorrect. Clear boundaries and discipline-specific goals describe the multidisciplinary model."}, {"t": "Members collaborate on shared goals, problem-solving beyond discipline boundaries", "c": true, "r": "Correct. The interdisciplinary team collaborates on goals and expands problem solving beyond individual disciplines."}, {"t": "Members blur all boundaries, cross-train, and share each other's tasks freely", "c": false, "r": "Incorrect. Blurred boundaries and cross-training describe the transdisciplinary model."}, {"t": "Members report outcomes as the simple sum of each discipline's separate work", "c": false, "r": "Incorrect. Summed separate outcomes describe the multidisciplinary model."}], "tp": "Interdisciplinary = most commonly used today in rehabilitation hospitals; multidisciplinary = summed, bounded; transdisciplinary = blurred, cross-trained."});

BANK.push({"cat": CB, "type": "single", "stem": "Which description matches the transdisciplinary rehabilitation team model?", "opts": [{"t": "Boundaries blur between disciplines, with cross-training and flexibility", "c": true, "r": "Correct. Transdisciplinary teams blur boundaries and cross-train to minimize duplication of effort."}, {"t": "Boundaries stay clear between disciplines, with discipline-specific goals", "c": false, "r": "Incorrect. Clear boundaries describe the multidisciplinary model."}, {"t": "Boundaries expand for problem solving while discipline work stays distinct", "c": false, "r": "Incorrect. Expanded problem solving with discipline-specific work describes the interdisciplinary model."}, {"t": "Boundaries are set by the physician, who assigns each discipline its goals", "c": false, "r": "Incorrect. No model in the chapter is defined by physician-set boundaries."}], "tp": "Transdisciplinary: blurring of boundaries, cross-training, and flexibility to minimize duplication of effort."});

BANK.push({"cat": CB, "type": "multi", "stem": "Which statements describe the rehabilitation nurse accurately? Select all that apply.", "opts": [{"t": "Puts the individual in charge of his or her own care when possible", "c": true, "r": "Correct. The role is to put the individual in charge of own care rather than taking charge."}, {"t": "Reinforces other disciplines' teaching 24 hours a day, 7 days a week", "c": true, "r": "Correct. Round-the-clock reinforcement of other disciplines' teaching is the rehabilitation nurse's unique role."}, {"t": "Works only in rehabilitation hospitals and in no other care settings", "c": false, "r": "Incorrect. Rehabilitation nursing is practiced across the continuum, including home health and outpatient settings."}, {"t": "Takes charge of the patient's care so the patient can rest completely", "c": false, "r": "Incorrect. That contradicts the role of putting the individual in charge of own care."}, {"t": "Notices small, often imperceptible changes because of constant exposure", "c": true, "r": "Correct. Constant 24-hour exposure lets rehabilitation nurses notice small changes."}], "tp": "The rehabilitation nurse reinforces teaching 24/7, encourages regularly, and puts the patient in charge of own care."});

BANK.push({"cat": CB, "type": "single", "stem": "Which set lists roles the rehabilitation nurse may take on, as the chapter names them?", "opts": [{"t": "Team leader, exercise designer, recreation planner, and evaluator only", "c": false, "r": "Incorrect. That mixes the physiatrist, physical therapist, and recreation roles."}, {"t": "Assessor only, with all teaching and advocacy left to other disciplines", "c": false, "r": "Incorrect. Educator and patient advocate are core rehabilitation nurse roles in Box 39.2."}, {"t": "Educator, caregiver, counselor, care coordinator, and patient advocate", "c": true, "r": "Correct. The chapter lists educator, caregiver, counselor, care coordinator, case manager, patient advocate, consultant, researcher, administrator, and expert witness."}, {"t": "Surgeon, pharmacist, dietitian, chaplain, and vocational planner only", "c": false, "r": "Incorrect. Those are other team members' roles, not the nurse's listed roles."}], "tp": "Box 39.2 roles: educator, provider of care, collaborator, patient advocate — within a wider role list."});

function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 39: Rehabilitation Nursing - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
