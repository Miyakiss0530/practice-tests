<script>
/* ============ QUESTION BANK (SITUATIONAL / BRUTAL - HERLIHY A&P CHAPTER 3: CELLS) ============ */
/* Second/third-order clinical vignettes only, plus one unfolding NGN case (grp NGN1,
   6 linked questions: recognize -> analyze -> prioritize -> generate -> take action -> evaluate).
   Facts only from the verified guide. No option defines or glosses a key term. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Membrane Transport in Clinical Care";
var CB = "Tonicity, IV Fluids and Swelling";
var CC = "Organelles, Immobility and Aging";
var CD = "Cell Cycle, Tumors and Drug Therapy";
var CE = "NGN Case Study: Cerebral Edema";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = ["diffusion","facilitated diffusion","osmosis","filtration","phagocytosis","exocytosis","isotonic","hypotonic","hypertonic","hemolysis","mannitol","lysosomes","cilia","microvilli","mitochondria","mitosis","G0 phase","metastasis","apoptosis","necrosis"];
var BLUEPRINT = {
  CA: { name: CA, count: 8, types: { single: 6, multi: 1, dropdown: 1 } },
  CB: { name: CB, count: 8, types: { single: 6, multi: 2 } },
  CC: { name: CC, count: 7, types: { single: 6, multi: 1 } },
  CD: { name: CD, count: 7, types: { single: 5, multi: 1, dropdown: 1 } },
  CE: { name: CE, count: 6, types: { single: 4, multi: 2 } }
};

/* ---------- MEMBRANE TRANSPORT IN CLINICAL CARE ---------- */
BANK.push({ cat: CA, type: "single",
  stem: "A client with pneumonia has an alveolar oxygen level higher than the oxygen level in the surrounding capillary blood, and a blood carbon dioxide level higher than the alveolar level. Which statement predicts gas movement correctly?",
  opts: [
    O("Oxygen moves from the alveolus into the blood while carbon dioxide moves from the blood into the alveolus, each following its own concentration difference", true, "Correct - each gas follows its own gradient downhill: oxygen is more concentrated in the alveolus, carbon dioxide is more concentrated in the blood, so they cross in opposite directions at the same time."),
    O("Oxygen and carbon dioxide both move from the alveolus into the blood together, because gases always travel in the same direction across the same membrane surface", false, "Gases do not travel as a pair; each moves by its own concentration difference, and here the two gradients point in opposite directions."),
    O("Carbon dioxide moves from the alveolus into the blood while oxygen moves from the blood into the alveolus, because waste gases pull fresh gases behind them as they cross", false, "The directions are reversed: oxygen enters the blood because the alveolus holds more of it, and carbon dioxide leaves the blood for the same reason in reverse."),
    O("Neither gas moves until the client takes a supplemental oxygen breath, because gas exchange across the alveolar membrane requires an input of energy to get started", false, "This exchange is passive and continuous; it runs on concentration differences alone and needs no energy input or triggering breath.")
  ],
  tp: "ANSWER KEY: Oxygen alveolus-to-blood, carbon dioxide blood-to-alveolus, simultaneously. DETAILED RATIONALE: One membrane, two independent gradients, two opposite directions - the paired-travel, reversed-direction, and energy-required options each break the gradient rule. PRIORITY FRAMEWORK: Concentration Gradient - predict each substance's direction separately, from its own high side." });

BANK.push({ cat: CA, type: "single",
  stem: "A student nurse watches a white blood cell surround and take in a bacterium at a wound site and asks why the bacterium could not simply cross the membrane the way glucose does. Which explanation by the nurse is correct?",
  opts: [
    O("The bacterium is a solid particle too large to cross by the usual routes, so the membrane must surround and engulf it to bring it inside the cell", true, "Correct - engulfing handles particles too large for diffusion routes; the white blood cell takes the bacterium in whole, and lysosomes then kill it."),
    O("The bacterium is a liquid droplet, so the membrane must first dissolve it in the lipid layer before any part of it can enter the white blood cell", false, "A bacterium is a solid particle, not a droplet, and solids are engulfed whole - nothing here dissolves in the lipid layer."),
    O("The bacterium carries the wrong charge for the membrane pores, so the cell spends ATP to widen the pores until the bacterium can squeeze through them", false, "Pores pass water and small dissolved substances; no pore widening admits a whole bacterium - size, not charge, forces engulfing."),
    O("The bacterium could have crossed like glucose, but the white blood cell engulfs it only because engulfing is faster than waiting for it to diffuse inward", false, "Speed is not the issue; a particle this large has no diffusion route at all, so engulfing is the only way in.")
  ],
  tp: "ANSWER KEY: The bacterium is too large for diffusion routes and must be engulfed. DETAILED RATIONALE: Droplet, pore-charge, and speed explanations misidentify the barrier - particle size is what removes every passive route and requires engulfing. PRIORITY FRAMEWORK: Structure-Function - match the cargo's size to the only mechanism that can move it." });

BANK.push({ cat: CA, type: "single",
  stem: "Pancreatic cells synthesize a protein, wrap it in membrane, and release it for use outside the pancreas. A client asks how the finished protein leaves the cell. Which sequence should the nurse describe?",
  opts: [
    O("The protein is built at the ribosomes, finished and wrapped by the Golgi apparatus, then carried in a vesicle that fuses with the cell membrane and expels it", true, "Correct - build (ribosomes/rough ER), finish and wrap (Golgi into a secretory vesicle), then the vesicle fuses with the membrane and the protein is expelled - the chapter's own pancreatic example."),
    O("The protein is built by the Golgi apparatus, finished at the ribosomes, then dissolved in the lipid layer of the membrane so it can seep slowly out of the cell", false, "The build/finish order is reversed and proteins do not seep through lipid; ribosomes build first, the Golgi finishes, and exit is by vesicle fusion."),
    O("The protein is wrapped by a lysosome, carried to the nucleus for inspection, then pushed out through a nuclear pore into the fluid surrounding the whole pancreas", false, "Lysosomes digest rather than wrap exports, the nucleus inspects nothing, and nuclear pores serve the nucleus - export uses a vesicle at the cell membrane."),
    O("The protein leaves by drifting from high concentration inside the cell to low concentration outside the cell, crossing the bare membrane without any wrapping at all", false, "Unwrapped drifting describes simple diffusion of small substances; a finished protein product exits packaged, by vesicle fusion with the membrane.")
  ],
  tp: "ANSWER KEY: Ribosomes build, Golgi wraps, vesicle fuses and expels. DETAILED RATIONALE: Reversed order, lysosome/nucleus detours, and unwrapped drifting each break the printed protein line or its exit step. PRIORITY FRAMEWORK: Nursing Process (sequence) - trace the product through every station in order before answering." });

BANK.push({ cat: CA, type: "single",
  stem: "A nurse is teaching a client about how cells move substances. One of the client's cells already contains a large amount of potassium, and still more potassium will be moved into this cell from the surrounding fluid, where potassium is scarce. Which conclusion is correct?",
  opts: [
    O("This movement can only happen with an input of ATP energy, because the potassium is being moved toward the side that already holds more of it", true, "Correct - moving a substance from low concentration to high concentration is uphill work; the chapter's pump example is exactly this potassium situation, and it costs ATP."),
    O("This movement will happen on its own with no energy cost, because potassium always drifts toward whichever side of the membrane holds less of it at the time", false, "Drifting toward the side holding less is downhill diffusion - the opposite direction from the one described, where potassium moves toward the fuller side."),
    O("This movement will be carried out by a helper molecule at no energy cost, because helper molecules specialize in moving substances into cells that are already full", false, "A helper molecule only speeds a downhill trip; it cannot carry a substance uphill into an already-full cell - that requires a pump and ATP."),
    O("This movement is impossible under any conditions, because a cell that already holds a large amount of a substance can never accept any more of that same substance", false, "It is not impossible - it is expensive; with ATP invested, the pump moves additional potassium in against the gradient.")
  ],
  tp: "ANSWER KEY: Uphill into an already-full cell requires a pump and ATP. DETAILED RATIONALE: Free drift and helper options both describe downhill-only processes, and impossibility ignores the pump; direction relative to the gradient decides the energy cost. PRIORITY FRAMEWORK: Concentration Gradient - if the destination side is fuller, budget ATP before predicting movement." });

BANK.push({ cat: CA, type: "single",
  stem: "During a client's circulation assessment, the nurse reviews a capillary model: blood pressure is higher inside the vessel than in the surrounding tissue space, and water and dissolved substances are observed leaving the blood through tiny pores in the capillary wall. Which interpretation is correct?",
  opts: [
    O("Pressure inside the capillary is pushing water and dissolved substances out through the pores into the tissue spaces", true, "Correct - this is the chapter's capillary picture: a thin wall with many little pores, and pressure pushing fluid and solute out into the tissues, like the syringe-with-holes model."),
    O("Water is being pulled out of the capillary toward leaked protein in the tissue, while dissolved substances remain trapped inside the blood by the capillary wall", false, "Protein pulling water describes swelling after tissue injury; here the stated driver is pressure, and dissolved substances leave WITH the water through the pores."),
    O("Water and dissolved substances are drifting out because their concentration is lower in the tissue than in the blood, and pressure plays no role in this movement", false, "Concentration drift is diffusion; the stem gives a pressure difference and pore flow, which is the pressure-driven mechanism, not a concentration one."),
    O("The vessel wall cells are spending ATP to pump water and dissolved substances uphill into the tissue, working against the pressure inside the capillary itself", false, "No ATP is spent and nothing moves uphill; the movement is passive, driven by the higher pressure inside the vessel.")
  ],
  tp: "ANSWER KEY: Capillary pressure pushes water and solute out through the pores. DETAILED RATIONALE: Protein-pull, concentration-drift, and ATP-pump options name three other mechanisms; the pressure difference plus pores in the stem identify this one. PRIORITY FRAMEWORK: Terminology Precision in application - identify the driving force given in the data before naming the process." });

BANK.push({ cat: CA, type: "single",
  stem: "A client asks the nurse why two prescribed drugs behave differently in the body: one is lipid soluble and the other is water soluble. Which prediction about the lipid-soluble drug is correct?",
  opts: [
    O("It can dissolve in the lipid portion of cell membranes, so its distribution through the body differs from that of the water-soluble drug", true, "Correct - the chapter's pharmacology link: drugs are classified as lipid soluble or water soluble, and solubility determines distribution throughout the body; lipid-soluble substances cross the lipid layer directly."),
    O("It must wait for a membrane pore large enough to admit it, because no substance of any kind can pass through the lipid portion of the membrane itself", false, "Lipid-soluble substances are precisely the ones that DO dissolve through the lipid portion; pores are the route for water and water-soluble substances."),
    O("It will be engulfed by cell membranes before entering any cell, because lipid-soluble substances are always taken in as wrapped particles by the cell surface", false, "Engulfing is reserved for particles too large for other routes; a dissolved lipid-soluble drug crosses the lipid layer directly, unwrapped."),
    O("It behaves exactly like the water-soluble drug in the body, because solubility is a laboratory property that has no effect on how a drug is distributed at all", false, "The chapter states the opposite: solubility determines distribution, so the two drugs predictably behave differently.")
  ],
  tp: "ANSWER KEY: Lipid-soluble drugs dissolve through the lipid layer, and solubility shapes distribution. DETAILED RATIONALE: Pore-waiting, engulfing, and no-effect options deny the membrane's two-route design or the chapter's printed pharmacology link. PRIORITY FRAMEWORK: Structure-Function - predict a substance's route from its solubility before predicting its spread." });

BANK.push({ cat: CA, type: "multi",
  stem: "A nurse reviews four client scenarios. Which scenarios describe passive transport? Select all that apply.",
  opts: [
    O("Perfume scent spreading across a room until it can be smelled evenly everywhere in the room.", true, "Correct - the chapter's own diffusion picture: movement from high to low concentration with no energy spent."),
    O("Glucose being carried across a membrane by a helper molecule, moving toward the side with less glucose.", true, "Correct - helper-assisted movement that stays downhill is still passive; no ATP is spent."),
    O("Water leaving a capillary for the tissue spaces because pressure inside the vessel is higher.", true, "Correct - pressure-driven movement through the pores is passive; the pressure, not the cell's ATP, does the work."),
    O("A cell taking in additional potassium from fluid where potassium is scarce, concentrating it further.", false, "Moving potassium toward the fuller side is uphill pump work that requires ATP - active, not passive."),
    O("A pancreatic cell expelling finished protein as a vesicle fuses with its membrane.", false, "Expelling products by vesicle fusion is an active mechanism requiring energy input.")
  ],
  tp: "ANSWER KEY: Scent spreading, helper-carried glucose downhill, and pressure-driven capillary flow. DETAILED RATIONALE: Both false scenarios spend cellular energy - uphill potassium pumping and vesicle expulsion - while the three correct ones run on gradients or pressure alone. PRIORITY FRAMEWORK: Concentration Gradient - audit the energy: if ATP is spent, the process is not passive." });

BANK.push({ cat: CA, type: "dropdown",
  stem: "A client scenario is given for each row. Choose the transport process that fits it.<br><br>Oxygen crossing from an alveolus into the blood<br>[[0]]<br><br>A white blood cell taking in a whole bacterium<br>[[1]]<br><br>Fluid leaving a capillary under pressure<br>[[2]]<br><br>A cell expelling a finished protein product<br>[[3]]",
  blanks: [
    { o: [O("Simple downhill movement along a concentration difference", true, "Oxygen crosses because the alveolus holds more of it than the blood - a downhill concentration trip with no help and no ATP."),
           O("Engulfing of a particle by the surrounding cell membrane", false, "Engulfing is for large particles; oxygen is a small lipid-soluble gas that crosses directly."),
           O("Expulsion of contents when a vesicle fuses with the membrane", false, "Expulsion moves products OUT of a cell; oxygen here moves INTO the blood across the alveolar membrane.")] },
    { o: [O("Engulfing of a particle by the surrounding cell membrane", true, "A whole bacterium is far too large for pores or lipid crossing, so the white blood cell surrounds and engulfs it."),
           O("Simple downhill movement along a concentration difference", false, "A bacterium cannot drift across a membrane down a gradient; its size removes that route entirely."),
           O("Pushing of fluid through pores by a pressure difference", false, "Pressure pushes water and small dissolved substances through pores; it cannot push a whole bacterium into a cell.")] },
    { o: [O("Pushing of fluid through pores by a pressure difference", true, "Capillary pressure pushes water and dissolved substances out through the wall's pores into the tissue spaces."),
           O("Engulfing of a particle by the surrounding cell membrane", false, "Nothing is engulfed at the capillary wall; fluid is pushed through pores by pressure."),
           O("Expulsion of contents when a vesicle fuses with the membrane", false, "No vesicle is involved; capillary fluid leaves by pressure-driven flow through pores.")] },
    { o: [O("Expulsion of contents when a vesicle fuses with the membrane", true, "Finished protein leaves the pancreatic cell when its membrane-bound vesicle fuses with the cell membrane and releases it."),
           O("Simple downhill movement along a concentration difference", false, "A packaged protein product does not drift bare across the membrane; it exits by vesicle fusion."),
           O("Pushing of fluid through pores by a pressure difference", false, "Pressure filtration moves water and small solutes; it does not deliver a wrapped protein product out of a cell.")] }
  ],
  tp: "ANSWER KEY: Oxygen - downhill gradient; bacterium - engulfing; capillary fluid - pressure through pores; protein - vesicle expulsion. DETAILED RATIONALE: Each scenario carries its own signature - a gradient, an oversized particle, a pressure difference, or a packaged product - and each wrong option belongs to a different scenario in the same set. PRIORITY FRAMEWORK: Structure-Function - read the cargo and the driving force, then name the process." });

/* ---------- TONICITY, IV FLUIDS AND SWELLING ---------- */
BANK.push({ cat: CB, type: "single",
  stem: "A newly hired nurse prepares to hang a bag labeled sterile water for a client's intravenous infusion. The experienced nurse intervenes. Which explanation should the experienced nurse give first?",
  opts: [
    O("Pure water must not be given intravenously, because water would rush into the red blood cells and burst them", true, "Correct - pure water is the chapter's hypotonic example; given IV it sends water into RBCs until they lyse, so the bag must not hang."),
    O("Pure water must not be given intravenously, because it would pull water out of the red blood cells and shrivel them", false, "Pulling water out and shriveling cells is the hypertonic pattern; pure water is more dilute than the cell, so water moves IN, not out."),
    O("Pure water is safe intravenously if it is infused very slowly, because the kidneys can remove the extra water as it arrives", false, "Rate does not change what the fluid does at the red cell membrane; the chapter's rule is that pure water is not administered IV at all."),
    O("Pure water is safe intravenously if the client is dehydrated, because thirsty cells absorb the water before it can do any harm", false, "Dehydration does not protect red cells from a hypotonic infusion; the bursting risk is the reason for the blanket rule.")
  ],
  tp: "ANSWER KEY: Stop the infusion - pure water bursts red blood cells. DETAILED RATIONALE: The shriveling option reverses the water direction, and the slow-rate and dehydration options invent exceptions the chapter does not allow. PRIORITY FRAMEWORK: Safety First - prevent hemolysis; tonicity of anything entering a vein is verified before it hangs." });

BANK.push({ cat: CB, type: "single",
  stem: "A client with increased pressure inside the skull from brain swelling is ordered an intravenous hypertonic solution. The family asks how a fluid in the vein can shrink swelling in the brain. Which explanation is correct?",
  opts: [
    O("The solution makes the blood more concentrated than the brain tissue, so water is drawn out of the tissue into the blood and the swelling decreases", true, "Correct - the chapter's printed example (mannitol): hypertonic blood pulls water out of swollen brain tissue by osmosis, and cerebral edema decreases."),
    O("The solution makes the blood more dilute than the brain tissue, so extra water leaves the blood and dilutes the pressure building inside the skull", false, "Dilute blood would send water TOWARD the tissue, worsening swelling; the ordered solution works because it is more concentrated, not more dilute."),
    O("The solution is pumped directly into the brain tissue by the infusion, where it absorbs the extra fluid that has collected around the injured cells", false, "The fluid stays in the bloodstream; it works across the tissue boundary by drawing water out, not by entering the brain to soak fluid up."),
    O("The solution blocks the membrane pores of the brain cells, so no more water can enter them while the body slowly removes the swelling on its own", false, "No pore blocking is involved; water leaves the tissue because the blood side has become the more concentrated side.")
  ],
  tp: "ANSWER KEY: Concentrated blood draws water out of the swollen brain. DETAILED RATIONALE: Dilution reverses the gradient the wrong way, direct-entry misplaces the fluid, and pore-blocking invents a mechanism - water follows the concentrated side. PRIORITY FRAMEWORK: ABCs / Safety - in cerebral edema, move water out of the brain first; the gradient is the treatment." });

BANK.push({ cat: CB, type: "single",
  stem: "A client receives several liters of normal saline (0.9% NaCl) intravenously for fluid loss. The client asks why this fluid does not swell or shrink the red blood cells the way plain water would. Which response is correct?",
  opts: [
    O("This fluid matches the concentration inside the cells, so water does not shift in either direction on balance and the cells keep their normal size", true, "Correct - normal saline is one of the chapter's printed isotonic solutions; matching concentration means no net water movement and no change in RBC size."),
    O("This fluid is saltier than the inside of the cells, but the salt cannot cross the membrane, so the cells are protected from any change in their size", false, "A fluid saltier than the cell interior would pull water OUT and shrink the cells; normal saline protects size by matching, not exceeding, the interior."),
    O("This fluid is weaker than the inside of the cells, but the red cell membranes are strong enough to resist the water that tries to enter them from it", false, "A weaker fluid sends water in until cells burst - membrane strength does not rescue them; normal saline is not weaker than the cell interior."),
    O("This fluid contains glucose that coats the red blood cells, and the coating keeps water from crossing their membranes in either direction while it infuses", false, "No coating exists in this explanation; normal saline works by equal concentration, and glucose coating plays no part in the chapter's account.")
  ],
  tp: "ANSWER KEY: Matching concentration means no net water shift and stable cell size. DETAILED RATIONALE: Saltier and weaker options describe the two harmful tonicity patterns, and the coating option invents a barrier; equality is the whole mechanism. PRIORITY FRAMEWORK: Safety - choose fluids that hold cell volume steady when the goal is volume replacement." });

BANK.push({ cat: CB, type: "single",

var Q = [];

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}

  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
