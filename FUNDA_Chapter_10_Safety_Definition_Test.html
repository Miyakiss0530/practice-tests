<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Safety Basics, Falls, and Lifespan Risks";
var CB = "Safety Reminder Devices and Restraint-Free Care";
var CC = "Environmental Hazards, Violence, Fire, and Poisoning";
var CD = "Disasters, Terrorism, and the Nursing Process";
var CATS = [CA, CB, CC, CD];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {

 },
 CB: {

 },
 CC: {

 },
 CD: {

   "multi": 2
  }
 }
};
BANK.push({ cat: CA, type: "single", stem: "Which statement best describes a safe environment in a health care facility?", opts: [{"t": "Freedom from equipment, with prevention of alarms, monitors, tubing, cords, and bed devices", "c": false, "r": "Wrong. Equipment stays; the nurse manages its hazards rather than removing it."}, {"t": "Freedom from visitors, with prevention of noise, questions, interruptions, and extra traffic", "c": false, "r": "Wrong. Visitors are part of the safety team, not a hazard to eliminate."}, {"t": "Freedom from complaints, with prevention of lawsuits, audits, surveys, fines, and penalties", "c": false, "r": "Wrong. The definition is about patient injury, not legal or survey outcomes."}, {"t": "Freedom from injury, with prevention of falls, electrical injuries, fires, burns, and poisoning", "c": true, "r": "Correct. The chapter defines a safe environment as freedom from injury plus prevention of falls, electrical injury, fire, burns, and poisoning."}], tp: "A safe environment also means helping patients feel safe, not only preventing physical injury." });
BANK.push({ cat: CA, type: "single", stem: "Which event meets The Joint Commission definition of a sentinel event?", opts: [{"t": "A patient fall onto a padded mat with no injury found on assessment", "c": false, "r": "Wrong. A fall without death or harm does not meet the definition."}, {"t": "A medication error caught by the pharmacist before it reaches the patient", "c": false, "r": "Wrong. No harm occurred, so this near miss is not a sentinel event."}, {"t": "A family complaint about slow call-light response during the night shift", "c": false, "r": "Wrong. A service complaint is not a patient safety event with harm."}, {"t": "A medication error that leads to the death of an individual patient", "c": true, "r": "Correct. A sentinel event is a patient safety event resulting in death, permanent harm, or severe temporary harm; a fatal medication error qualifies."}], tp: "Sentinel events also include procedure errors causing death and inappropriate application of safety reminder devices." });
BANK.push({ cat: CA, type: "single", stem: "The national patient safety goals released each year by The Joint Commission are best described as goals that are:", opts: [{"t": "Based on insurance company surveys and developed from a review of billing patterns", "c": false, "r": "Wrong. Billing patterns play no part in setting the safety goals."}, {"t": "Based on evidence-based practices and developed from a review of national databases", "c": true, "r": "Correct. The goals rest on evidence-based practice and national database review, and assist facilities in maintaining patient safety."}, {"t": "Based on each facility's own preferences and developed from a review of local staffing", "c": false, "r": "Wrong. The goals are national and evidence-based, not local preferences."}, {"t": "Based on patient satisfaction scores and developed from a review of visitor comments", "c": false, "r": "Wrong. Satisfaction scores are not the basis of the safety goals."}], tp: "Reporting of certain sentinel events to The Joint Commission is required, with a review and an improvement plan." });
BANK.push({ cat: CA, type: "single", stem: "A fall risk assessment is performed at which times?", opts: [{"t": "Only during the night shift, and whenever a new nurse assumes care of the patient group", "c": false, "r": "Wrong. Timing follows admission and condition change, not shift patterns."}, {"t": "On admission to the facility or unit, and again only at the time of discharge from care", "c": false, "r": "Wrong. Discharge-only reassessment misses changes that occur mid-stay."}, {"t": "Only after a patient has fallen, and whenever the family requests a formal safety review", "c": false, "r": "Wrong. Assessment is proactive on admission, not only after a fall."}, {"t": "On admission to the facility or unit, and whenever a significant change in condition occurs", "c": true, "r": "Correct. The assessment is done on admission and repeated whenever a significant change in the patient's condition has occurred."}], tp: "Facilities require fall precautions when a set number of fall-tool questions are answered yes." });
BANK.push({ cat: CA, type: "multi", stem: "Which questions appear on the sample fall assessment tool in Box 10.2? Select all that apply.", opts: [{"t": "Does the patient have type O blood recorded in the medical chart?", "c": false, "r": "Wrong. Blood type is not a fall-tool question."}, {"t": "Does the patient experience bowel or bladder incontinence daily?", "c": true, "r": "Correct. Bowel or bladder incontinence is question 8 on the tool."}, {"t": "Is the patient taller than six feet when measured standing up?", "c": false, "r": "Wrong. Height is not a fall-tool question."}, {"t": "Does the patient have an intravenous line or other attached tubing?", "c": true, "r": "Correct. IV lines, chest tubes, oxygen lines, and other tubing are question 9."}, {"t": "Is there a history of a fall or falls within the past year?", "c": true, "r": "Correct. A fall in the past year is question 1 on the tool."}, {"t": "Is the patient age 70 years or older at the time of admission?", "c": true, "r": "Correct. Age 70 years or older is question 7 on the tool."}], tp: "The tool also asks about unsteady gait, high-risk medications, altered mental status, dizziness, and sensory problems." });
BANK.push({ cat: CA, type: "single", stem: "Which safety task must the nurse keep rather than delegate to unlicensed assistive personnel?", opts: [{"t": "Locking the wheels of the bed and keeping it in the low position", "c": false, "r": "Wrong. Bed position and locked wheels are delegable safety measures."}, {"t": "Checking that the patient is wearing nonskid footwear for walking", "c": false, "r": "Wrong. Confirming nonskid footwear is a delegable safety measure."}, {"t": "Placing the call bell and personal items within the patient's reach", "c": false, "r": "Wrong. Environmental safety precautions like this can be delegated."}, {"t": "Assessing the patient for risk of fall or injury on the unit", "c": true, "r": "Correct. Fall and injury risk assessment requires the critical thinking and knowledge application unique to the nurse and is not delegated."}], tp: "When delegating, the nurse still stresses mobility limits, specific risk measures, and what to do if a patient starts to fall." });
BANK.push({ cat: CA, type: "single", stem: "For the patient at risk for injury, Care Plan 10.1 directs the nurse to offer fluids and a commode, bedpan, or urinal at which interval?", opts: [{"t": "Every 2 hours while the patient is awake, unless fluids are contraindicated", "c": true, "r": "Correct. Fluids and toileting are offered every 2 hours while awake unless contraindicated."}, {"t": "Every 6 hours while the patient is awake, unless fluids are contraindicated", "c": false, "r": "Wrong. Six hours is far longer than the care plan interval."}, {"t": "Every 4 hours while the patient is awake, unless fluids are contraindicated", "c": false, "r": "Wrong. The care plan interval is every 2 hours, not every 4."}, {"t": "Every 1 hour while the patient is awake, unless fluids are contraindicated", "c": false, "r": "Wrong. Hourly offers exceed the care plan's stated interval."}], tp: "The same care plan adds a room near the nurses' station, bed in low position, and clutter-free, well-lit surroundings." });
BANK.push({ cat: CA, type: "single", stem: "Seizure care is split between delegation and nursing judgment. Which part is NOT delegated?", opts: [{"t": "Assessment of airway patency, breathing, and circulatory status during a seizure", "c": true, "r": "Correct. Interventions during a seizure are not delegated; airway, breathing, and circulation assessment needs the nurse's critical thinking."}, {"t": "Setting up seizure precautions for a patient identified as at risk for seizures", "c": false, "r": "Wrong. Setting up precautions may be delegated to trained UAP."}, {"t": "Keeping the bedside area clear of clutter for a patient at risk for seizures", "c": false, "r": "Wrong. Environmental preparation can be delegated to trained UAP."}, {"t": "Placing padded side rails and suction equipment at the bedside before any event", "c": false, "r": "Wrong. Equipment setup is part of delegable seizure precautions."}], tp: "During a seizure: never restrain the patient and never place anything in the patient's mouth." });
BANK.push({ cat: CA, type: "single", stem: "Which vision change of aging raises fall risk because the patient misreads visual cues?", opts: [{"t": "Wider peripheral fields, with even light sensitivity and stable depth judgment", "c": false, "r": "Wrong. The chapter lists losses in these areas, not gains."}, {"t": "Sharper distance vision, with faster glare recovery and strong acuity at night", "c": false, "r": "Wrong. Aging changes reduce, rather than sharpen, these visual abilities."}, {"t": "Altered depth perception, with glare sensitivity and poor acuity in dim light", "c": true, "r": "Correct. Altered depth perception, increased glare sensitivity, and decreased acuity in dim light cause misperception of visual cues."}, {"t": "Faster dark adaptation, with reduced glare problems and precise step judgment", "c": false, "r": "Wrong. Dark adaptation and glare tolerance worsen with aging."}], tp: "Hearing loss adds risk because horns, alarms, and spoken warnings may not be heard." });
BANK.push({ cat: CA, type: "single", stem: "As printed in this chapter, orthostatic hypotension in the older adult is a drop of:", opts: [{"t": "15 mm Hg in systolic pressure and 15 mm Hg in diastolic pressure", "c": false, "r": "Wrong. The printed pair is 25 systolic and 10 diastolic."}, {"t": "10 mm Hg in systolic pressure and 25 mm Hg in diastolic pressure", "c": false, "r": "Wrong. The two numbers are reversed in this option."}, {"t": "25 mm Hg in systolic pressure and 10 mm Hg in diastolic pressure", "c": true, "r": "Correct. The chapter prints orthostatic hypotension as a drop of 25 mm Hg systolic and 10 mm Hg diastolic."}, {"t": "20 mm Hg in systolic pressure and 20 mm Hg in diastolic pressure", "c": false, "r": "Wrong. The printed pair is 25 systolic and 10 diastolic."}], tp: "Antihypertensives, diuretics, and antihistamines all raise this risk; teach patients to rise slowly." });
BANK.push({ cat: CA, type: "multi", stem: "Which changes of aging increase an older adult's need for safety precautions? Select all that apply.", opts: [{"t": "Stronger grip strength with quicker reflexes when startled by a loud noise", "c": false, "r": "Wrong. Reflexes and strength decline rather than improve."}, {"t": "Loss of sensitivity to heat, cold, and foreign objects in the periphery", "c": true, "r": "Correct. Peripheral vascular changes blunt heat and cold sensation, raising burn and tissue-damage risk."}, {"t": "Slowed reaction time with altered gait and altered sense of balance", "c": true, "r": "Correct. Muscle and joint changes slow reaction time and alter gait and balance, so stumbling becomes a fall."}, {"t": "Improved night vision with faster recovery after exposure to bright glare", "c": false, "r": "Wrong. Night vision and glare recovery decline with aging."}, {"t": "Sedatives, hypnotics, and tranquilizers slowing the patient's reaction time", "c": true, "r": "Correct. These medications affect reaction time and increase injury risk in older adults."}, {"t": "Anemia, orthostatic hypotension, and heart block raising syncope risk", "c": true, "r": "Correct. These cardiovascular changes increase syncope, which increases falls."}], tp: "Older adults also under-report over-the-counter drugs, which can potentiate or block prescription drug effects." });
BANK.push({ cat: CB, type: "single", stem: "A safety reminder device is best described as a device used to:", opts: [{"t": "Support a patient while walking, such as a belt held by the nurse during ambulation", "c": false, "r": "Wrong. A gait belt supports ambulation rather than immobilizing."}, {"t": "Measure a patient's movement at night, such as a sensor mat placed under the sheet", "c": false, "r": "Wrong. Sensor mats alarm; they do not immobilize the patient."}, {"t": "Immobilize a patient or a part of the patient's body, such as the arms or hands", "c": true, "r": "Correct. An SRD is any of numerous devices used to immobilize a patient or a body part; SRDs were formerly called restraints."}, {"t": "Remind a patient of visiting hours, such as a printed schedule posted on the wall", "c": false, "r": "Wrong. The name is misleading; the device physically immobilizes."}], tp: "Patient safety and the safety of others are the only reasons an SRD is used." });
BANK.push({ cat: CB, type: "multi", stem: "Which problems follow from the use of safety reminder devices? Select all that apply.", opts: [{"t": "Disuse weakness that leaves the patient less steady and more fall-prone", "c": true, "r": "Correct. Disuse increases disability, weakness, and unsteadiness, raising fall risk."}, {"t": "Immobility problems such as dehydration, infection, and incontinence", "c": true, "r": "Correct. SRDs contribute to immobility and its problems: dehydration, health care-associated infection, and incontinence."}, {"t": "Increased restlessness, disorientation, agitation, and anxiety in patients", "c": true, "r": "Correct. SRD use tends to increase restlessness, disorientation, agitation, anxiety, and powerlessness."}, {"t": "Faster discharge because mobility goals are met ahead of the schedule", "c": false, "r": "Wrong. SRDs reduce mobility and delay, not speed, recovery."}, {"t": "Improved orientation because the patient feels securely held in place", "c": false, "r": "Wrong. SRDs increase disorientation rather than improving it."}, {"t": "Skin and circulation problems where patients pull against the devices", "c": true, "r": "Correct. Patients pull against SRDs, causing skin and circulation problems."}], tp: "Keep SRD use and the amount of restraint to a minimum; alternatives come first." });
BANK.push({ cat: CB, type: "single", stem: "A bed or chair alarm protects the patient mainly by:", opts: [{"t": "Alerting staff when the patient tries to get out of bed or a chair without assistance", "c": true, "r": "Correct. The alarm alerts staff to unassisted rising, reducing the risk of falling from a bed, chair, or wheelchair."}, {"t": "Recording the patient's movements so the care team can review them the next morning", "c": false, "r": "Wrong. The alarm sounds in the moment; it is not a recording tool."}, {"t": "Preventing the patient from moving by holding the patient firmly in the bed or chair", "c": false, "r": "Wrong. An alarm alerts; it does not physically hold the patient."}, {"t": "Waking the patient with a loud tone so the patient returns to bed without staff help", "c": false, "r": "Wrong. The alarm summons staff; the patient is not expected to self-correct."}], tp: "Some long-term care facilities now view bed and chair alarms as a form of restraint." });
BANK.push({ cat: CB, type: "single", stem: "A wander guard is the right device for which patient?", opts: [{"t": "A surgical patient at risk for falling during the first walk after anesthesia", "c": false, "r": "Wrong. That risk calls for a gait belt and assistance, not an exit alarm."}, {"t": "A postoperative patient at risk for pulling out an endotracheal tube in the ICU", "c": false, "r": "Wrong. That risk calls for limb SRDs, not an exit alarm."}, {"t": "A toddler at risk for displacing an intravenous line during a hospital stay", "c": false, "r": "Wrong. That risk calls for an elbow SRD, not an exit alarm."}, {"t": "A confused long-term care resident at risk for leaving the facility unsupervised", "c": true, "r": "Correct. The wander guard is worn on the wrist or ankle and alarms when a resident at risk for elopement leaves the facility."}], tp: "Elopement is leaving the facility without permission or necessary supervision." });
BANK.push({ cat: CB, type: "single", stem: "Applying a safety reminder device without a physician's order or without reasonable cause exposes the nurse to charges of:", opts: [{"t": "Negligent homicide of the patient under the nurse's care at the time", "c": false, "r": "Wrong. The charge named in the skill is false imprisonment."}, {"t": "Insurance fraud against the facility at the time of the application", "c": false, "r": "Wrong. The charge named in the skill is false imprisonment."}, {"t": "False imprisonment of the patient under the nurse's care at the time", "c": true, "r": "Correct. The skill warns that applying an SRD without an order or reasonable cause incurs the risk of charges of false imprisonment."}, {"t": "Battery against the patient under the nurse's care at the time", "c": false, "r": "Wrong. The charge named in the skill is false imprisonment."}], tp: "Assess the need first, try alternatives, and obtain the order; some facilities require renewal every 24 hours." });
BANK.push({ cat: CB, type: "single", stem: "A vest safety reminder device is fitted correctly when:", opts: [{"t": "The V-shaped opening sits in back and the straps cross over the patient's chest", "c": false, "r": "Wrong. Backward placement risks choking; straps tie to the bed frame or behind the wheelchair."}, {"t": "The V-shaped opening sits in front and two fingers fit between vest and skin", "c": false, "r": "Wrong. Two fingers is the gait-belt check; the vest check is a fist."}, {"t": "The V-shaped opening sits in front and a fist fits between vest and patient", "c": true, "r": "Correct. The V opening goes in front, and proper fit leaves room for a fist between the vest and the patient."}, {"t": "The V-shaped opening sits in back and a fist fits between vest and patient", "c": false, "r": "Wrong. Worn backward, the vest can choke a restless patient."}], tp: "While a vest SRD is on, monitor respiratory status; restriction can cause respiratory distress." });
BANK.push({ cat: CB, type: "single", stem: "Wrist safety reminder device ties are secured in which way?", opts: [{"t": "With a quick-release knot, to the side rails on both sides of the patient's bed", "c": false, "r": "Wrong. The knot is right, but side rails are the wrong anchor point."}, {"t": "With a quick-release knot, to the bed frame portion that moves with the patient", "c": true, "r": "Correct. Ties go to the frame that moves with the patient when the bed is adjusted, secured with a quick-release knot."}, {"t": "With a regular tight knot, to the side rails on both sides of the patient's bed", "c": false, "r": "Wrong. Ties never go to side rails, and a tight knot can constrict and impede circulation."}, {"t": "With a regular tight knot, to the bed frame portion that moves with the patient", "c": false, "r": "Wrong. The anchor is right, but the knot must be quick-release for emergencies."}], tp: "Slack of 1 to 2 inches allows movement; palpate pulses below the SRD to confirm circulation." });
BANK.push({ cat: CB, type: "single", stem: "Routine care of a patient in an extremity safety reminder device includes:", opts: [{"t": "Removing it from one extremity at a time at least every 8 hours, for 5 minutes", "c": false, "r": "Wrong. The interval is every 2 hours, not every 8 hours."}, {"t": "Removing it from all extremities at once at least every 2 hours, for 5 minutes", "c": false, "r": "Wrong. Removal is one extremity at a time, never all at once."}, {"t": "Removing it from one extremity at a time at least every 2 hours, for 30 minutes", "c": false, "r": "Wrong. The removal period is 5 minutes, not 30 minutes."}, {"t": "Removing it from one extremity at a time at least every 2 hours, for 5 minutes", "c": true, "r": "Correct. Remove the SRD one extremity at a time at least every 2 hours for 5 minutes of supervised movement."}], tp: "Never leave the patient unattended during temporary removal; use the time to reposition and inspect skin." });
BANK.push({ cat: CB, type: "single", stem: "With an extremity safety reminder device in place, the extremity distal to the device is assessed at which interval?", opts: [{"t": "Every 15 minutes, or more often if the patient's condition requires it", "c": false, "r": "Wrong. The stated interval is every 30 minutes."}, {"t": "Every 30 minutes, or more often if the patient's condition requires it", "c": true, "r": "Correct. Assess the extremity distal to an extremity SRD every 30 minutes or more frequently."}, {"t": "Every 120 minutes, or more often if the patient's condition requires it", "c": false, "r": "Wrong. The stated interval is every 30 minutes."}, {"t": "Every 60 minutes, or more often if the patient's condition requires it", "c": false, "r": "Wrong. The stated interval is every 30 minutes."}], tp: "Monitor position, circulation, skin condition, and mental status frequently while any SRD is in use." });

BANK.push({ cat: CB, type: "single", stem: "For a mummy restraint used during an infant's procedure, which rule applies?", opts: [{"t": "The person applying the restraint should not be the child's parent or guardian", "c": true, "r": "Correct. When a child must be restrained for a procedure, the applier should not be the parent or guardian."}, {"t": "The person applying the restraint should be a student nurse observing the procedure", "c": false, "r": "Wrong. The rule concerns the parent or guardian, not students."}, {"t": "The person applying the restraint should always be the child's parent or guardian", "c": false, "r": "Wrong. The parent or guardian should not be the one applying it."}, {"t": "The person applying the restraint should be the oldest nurse on the hospital unit", "c": false, "r": "Wrong. Seniority is not the rule; relationship to the child is."}], tp: "Remain with the infant during a mummy restraint and remove it immediately after treatment ends." });
BANK.push({ cat: CB, type: "single", stem: "Under the Omnibus Budget Reconciliation Act of 1987, long-term care facilities must follow which rule?", opts: [{"t": "Routine use of safety reminder devices in long-term care is decided by each aide", "c": false, "r": "Wrong. A physician's written order with duration and circumstances is required."}, {"t": "Routine use of safety reminder devices in long-term care is encouraged by the act", "c": false, "r": "Wrong. The act prohibits routine use; it does not encourage it."}, {"t": "Routine use of safety reminder devices in long-term care is prohibited by the act", "c": true, "r": "Correct. OBRA 1987, effective October 1, 1990, prohibits routine SRD use in long-term care facilities."}, {"t": "Routine use of safety reminder devices in long-term care is billed as a daily extra", "c": false, "r": "Wrong. Billing plays no part in the act's restraint rules."}], tp: "OBRA allows SRDs only for the physical safety of the resident or others, after other interventions fail." });

BANK.push({ cat: CB, type: "single", stem: "An elbow safety reminder device is used mainly to:", opts: [{"t": "Keep an adult's chest expanded so the adult cannot slump forward in a chair", "c": false, "r": "Wrong. Chest support describes a vest device, not an elbow device."}, {"t": "Keep a child's elbow straight so the child cannot disturb tubes or dressings", "c": true, "r": "Correct. Elbow SRDs prevent elbow flexion so children cannot disturb tubes, catheters, and dressings."}, {"t": "Keep a child's wrist padded so the child cannot scratch healing skin lesions", "c": false, "r": "Wrong. The elbow device holds the elbow straight; it is not wrist padding."}, {"t": "Keep an adult's ankle aligned so the adult cannot turn the foot while sleeping", "c": false, "r": "Wrong. Ankle alignment is not the purpose of an elbow device."}], tp: "The elbow SRD is fabric with slots for tongue blades that hold the elbow straight." });

BANK.push({ cat: CC, type: "single", stem: "Type IV latex hypersensitivity is best described as:", opts: [{"t": "A delayed, cell-mediated reaction with redness, itching, and hives for up to 48 hours", "c": true, "r": "Correct. Type IV is a cell-mediated allergic reaction lasting up to 48 hours, its severity set by latex protein amount and individual sensitivity."}, {"t": "A delayed, antibody-driven reaction with joint pain, fever, and hives for up to 48 hours", "c": false, "r": "Wrong. Type IV is cell-mediated, not antibody-driven."}, {"t": "A rapid, systemic reaction with bronchospasm, hypotension, and possible cardiac arrest", "c": false, "r": "Wrong. That systemic picture describes Type I, the true latex allergy."}, {"t": "A nonallergic skin response to chemicals used during the processing of latex products", "c": false, "r": "Wrong. That nonallergic response is contact dermatitis, not Type IV."}], tp: "For patients with suspected latex sensitivity, use exclusively latex-free products and check supply kits for latex items." });

var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */

  }

  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';

      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }

    }
    if (fb) {

      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {

    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';

      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {

      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
