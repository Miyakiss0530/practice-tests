<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Urinary Catheters and Drainage Systems";
var CB = "Catheterization, Catheter Care, and Removal";
var CC = "Incontinence, Bladder Training, and Irrigation";
var CD = "Nasogastric Tubes and Gastric Procedures";
var CE = "Bowel Elimination, Enemas, and Rectal Tubes";

var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {

  "count": 10,

  }
 },
 CB: {
  "name": CB,

 },
 CC: {

 },
 CD: {

 CE: {

 },
 CF: {

 }
};

BANK.push({ cat: CA, type: "single", kt: [], stem: "Which statement about catheter sizes in the French system is accurate?", opts: [ O("Sizes run from 3 to 34 Fr, with adult sizes ranging from 14 to 18 Fr", true, "Correct. The chapter gives the full range as 3 to 34 Fr and the adult range as 14 to 18 Fr."), O("Sizes run from 3 to 34 Fr, with adult sizes ranging from 8 to 10 Fr", false, "Incorrect. The 8 Fr figure starts the teenager range; adults are 14 to 18 Fr."), O("Sizes run from 14 to 34 Fr, with child sizes ranging from 14 to 18 Fr", false, "Incorrect. Children are 3 to 8 Fr, and the full range starts at 3 Fr."), O("Sizes run from 3 to 18 Fr, with adult sizes ranging from 20 to 24 Fr", false, "Incorrect. The range extends to 34 Fr, and adults are 14 to 18 Fr, not 20 to 24.") ], tp: "French sizes: overall 3-34 Fr; children 3-8; teenagers 8-14; adults 14-18." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "Which statement about catheter sizes larger than 18 Fr is accurate?", opts: [ O("They are used after urinary surgery and most facilities require an order", true, "Correct. Larger sizes follow urinary or prostate surgery or a stretched urethra, and most facilities require a provider order."), O("They are used for routine adult drainage and never require any special order", false, "Incorrect. Routine adult drainage uses 14 to 18 Fr; larger sizes need an order in most facilities."), O("They are used for small children whose urethras need gentle gradual dilation", false, "Incorrect. Children use 3 to 8 Fr, the smallest sizes in the chapter range."), O("They are used only for ureter drainage, which the nurse performs at the bedside", false, "Incorrect. Catheterizing the ureters or kidneys belongs to the primary care provider.") ], tp: "Over 18 Fr = post-surgical or stretched urethra, and a provider order in most facilities." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "Which description matches a Foley indwelling catheter?", opts: [ O("A balloon near its tip is inflated inside the bladder for continuous drainage", true, "Correct. The Foley balloon is inflated after insertion into the bladder and holds it for continuous drainage."), O("A tapered curved tip is advanced past an enlarged prostate gland into the bladder", false, "Incorrect. That describes the coude catheter, used when prostate enlargement is suspected."), O("A mushroom tip is seated inside the renal pelvis to drain urine from the kidney", false, "Incorrect. Malecot and de Pezzer mushroom catheters drain the renal pelvis of the kidney."), O("Multiple openings near its tip are opened and closed for intermittent drainage", false, "Incorrect. The Robinson catheter has multiple tip openings for intermittent drainage.") ], tp: "Foley = balloon inflated in the bladder, continuous drainage." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "Which catheter is selected when enlargement of the prostate gland is suspected?", opts: [ O("A coude catheter with a tapered tip and a curved guiding stylet design", true, "Correct. The coude tapered tip and curved stylet assist insertion past an enlarged prostate."), O("A Robinson catheter with several openings arranged around its drainage tip", false, "Incorrect. Robinson openings facilitate intermittent drainage; they do not address prostate enlargement."), O("A whistle-tip catheter with one slanted and enlarged opening at its very tip", false, "Incorrect. The whistle tip is an alternate tip design, not the prostate-enlargement choice."), O("A simple urethral catheter with a straight single lumen for one-time drainage", false, "Incorrect. A straight catheter is for one-time drainage and lacks the tapered guiding tip.") ], tp: "Coude = tapered curved tip for suspected prostate enlargement." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "Which statement about a three-way indwelling catheter is accurate?", opts: [ O("Its third lumen is used for irrigation of the urinary bladder lumen system", true, "Correct. Figure 15.1 identifies the third lumen of the three-way catheter as the irrigation lumen."), O("Its third lumen is used for inflating the balloon that anchors the catheter tip", false, "Incorrect. The balloon has its own inflation port; the third lumen is for bladder irrigation."), O("Its third lumen is used for measuring the pressure inside the urinary bladder", false, "Incorrect. The chapter assigns the third lumen to irrigation, not pressure measurement."), O("Its third lumen is used for collecting a sterile urine specimen from the bladder", false, "Incorrect. Specimens are taken from the cleansed drainage port, not a third lumen.") ], tp: "Three-way catheter: the third lumen irrigates the bladder." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "Which statement about the Purewick female external catheter is accurate?", opts: [ O("It must not be used with retention or when output needs close monitoring", true, "Correct. The chapter states plainly: do not use it for urinary retention or when output needs close monitoring."), O("It must not be used after surgery or when a patient is ordered to bedrest", false, "Incorrect. Less mobile or nonmobile patients after surgery or on bedrest are its intended users."), O("It must not be changed more often than once during each full week of use", false, "Incorrect. It is changed every 8 to 12 hours or when soiled, with skin monitoring."), O("It must not be placed against the meatus, because suction injures that tissue", false, "Incorrect. The soft gauze portion is placed against the patient at the urinary meatus.") ], tp: "Purewick: low continuous suction, change every 8-12 hours, never for retention or close output monitoring." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "Which statement describes a suprapubic catheter accurately?", opts: [ O("It enters through the abdominal wall above the symphysis pubis surgically", true, "Correct. The suprapubic catheter is inserted surgically through the abdominal wall above the symphysis pubis."), O("It enters through the urinary meatus and is advanced along the full urethra", false, "Incorrect. That route describes urethral catheterization, not a suprapubic diversion."), O("It enters through a small stoma created for the diversion of fecal contents", false, "Incorrect. A suprapubic catheter diverts urine; fecal diversions are bowel ostomies."), O("It enters through the external genitalia and is secured with an adhesive sheath", false, "Incorrect. That describes an external condom drainage system, not a surgical diversion.") ], tp: "Suprapubic = through the abdominal wall above the symphysis pubis, placed surgically, sterile closed drainage." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "Which statement about a closed urinary drainage system is accurate?", opts: [ O("It stays closed after placement and is opened only for ordered irrigation", true, "Correct. The system is not opened after placement unless open irrigation is necessary, and then only with a specific provider order."), O("It stays closed after placement and is opened each shift for routine draining", false, "Incorrect. Draining is done through the port; opening the system breaks the closed protection."), O("It stays closed after placement and is opened whenever a specimen is requested", false, "Incorrect. Specimens are withdrawn through the cleansed port with a sterile needle and syringe."), O("It stays closed after placement and is opened daily to check for tube patency", false, "Incorrect. Patency is checked without routinely opening the system; opening invites infection.") ], tp: "Closed system prevents urinary tract infection - keep it closed." });

BANK.push({ cat: CA, type: "multi", kt: [], stem: "Which statements about patients at risk for urinary elimination problems are accurate? Select all that apply.", opts: [ O("Patients after surgery of the bladder, the prostate, or the vagina are at risk", true, "Correct. Surgery of those structures is a listed risk group in the chapter."), O("Patients with prostatic hypertrophy, urethral stricture, or a tumor are at risk", true, "Correct. Obstructive conditions of the tract are a listed risk group."), O("Patients with neurologic trauma or neurologic deficits are at risk for problems", true, "Correct. Neurologic trauma and deficits are a listed risk group."), O("Patients who are critically ill with multisystem problems are at risk as well", true, "Correct. Critical illness with multisystem problems is a listed risk group."), O("Patients with a single uncomplicated sprained ankle and no other history are at risk", false, "Incorrect. An isolated minor injury with no urinary involvement is not a listed risk group.") ], tp: "At-risk: bladder/prostate/vaginal surgery, hypertrophy/stricture/tumor, neurologic trauma or deficits, critical multisystem illness." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "Which statement about the condom catheter is accurate?", opts: [ O("It is an external drainage system, not a true catheter entering the urethra", true, "Correct. The chapter stresses it is not a true catheter; it connects to the external male genitalia."), O("It is an indwelling catheter, anchored inside the bladder by a small balloon", false, "Incorrect. Balloon anchoring describes an indwelling Foley catheter, not the external system."), O("It is a surgical diversion, placed through the abdominal wall by a surgeon", false, "Incorrect. Surgical placement through the abdominal wall describes a suprapubic catheter."), O("It is a suction device, held against the meatus by low continuous suctioning", false, "Incorrect. Low continuous suction describes the Purewick female external system.") ], tp: "Condom catheter: external, for incontinent men, limits infection risk, remove daily for skin inspection." });

BANK.push({ cat: CB, type: "multi", kt: [], stem: "Which actions belong to the standard steps performed before every procedure in this chapter? Select all that apply.", opts: [ O("Check the provider order and review the facility policy for the procedure", true, "Correct. Many nursing interventions require an order, so the order and policy are checked first."), O("Identify the patient by the name band, using name, birth date, or both items", true, "Correct. Identification uses the name band with name, birth date, or both."), O("Perform hand hygiene and don clean gloves per CDC and OSHA policy guidance", true, "Correct. Hand hygiene and clean gloves are standard before-procedure steps."), O("Evaluate the patient first, because every skill opens with an assessment section", true, "Correct. Each skill box opens with assessment to gather baseline data."), O("Document the patient response and the outcomes before the procedure has begun", false, "Incorrect. Response and outcomes are documented after the procedure, not before it.") ], tp: "Before every skill: order and policy, identification, explanation, assessment, hand hygiene, equipment, privacy." });

BANK.push({ cat: CB, type: "multi", kt: [], stem: "Which actions belong to the standard steps performed after every procedure in this chapter? Select all that apply.", opts: [ O("Place the patient in a position of comfort with needed items within easy reach", true, "Correct. Comfort positioning and items within reach are after-procedure steps."), O("Raise the side rails and lower the bed down to its lowest possible position", true, "Correct. Rails up and bed at its lowest position are after-procedure safety steps."), O("Perform hand hygiene after removing gloves and other protective barrier items", true, "Correct. Hand hygiene after glove removal is the most important technique against spread of microorganisms."), O("Document the response, the outcomes, and all patient teaching that was provided", true, "Correct. Documentation covers response, expected or unexpected outcomes, and teaching."), O("Leave the bed raised at working height so the next procedure can start sooner", false, "Incorrect. The bed is lowered to its lowest position when the procedure ends.") ], tp: "After every skill: comfort, rails up, bed lowest, hand hygiene, document, report unexpected outcomes." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "Which pair of insertion depths for urinary catheterization is accurate?", opts: [ O("Male patients 6 to 7 inches; female patients 2 to 4 inches into the bladder", true, "Correct. Male insertion is 6-7 inches (15-18 cm) and female insertion is 2-4 inches (5-10 cm), as printed."), O("Male patients 2 to 4 inches; female patients 6 to 7 inches into the bladder", false, "Incorrect. The depths are reversed; the male urethra takes the longer insertion."), O("Male patients 4 to 6 inches; female patients 4 to 6 inches into the bladder", false, "Incorrect. The chapter prints different depths for male and female patients."), O("Male patients 8 to 10 inches; female patients 5 to 7 inches into the bladder", false, "Incorrect. Those figures exceed the printed insertion depths for both sexes.") ], tp: "Insertion depth: male 6-7 in, female 2-4 in; advance at least 1.5 in farther once urine flows." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "Which action is correct once urine flow is established during catheter insertion?", opts: [ O("Advance the catheter at least one and one-half inches farther into the bladder", true, "Correct. Advancing at least 1.5 inches farther after flow ensures correct bladder placement before balloon inflation."), O("Advance the catheter at least four and one-half inches farther into the bladder", false, "Incorrect. The printed advance after flow is at least 1.5 inches, not 4.5 inches."), O("Withdraw the catheter about one and one-half inches to seat it in the urethra", false, "Incorrect. The catheter is advanced farther, never withdrawn to seat in the urethra."), O("Inflate the balloon at once, before advancing, so the catheter cannot slip out", false, "Incorrect. Inflation before confirming bladder placement risks urethral injury.") ], tp: "After urine flows: advance at least 1.5 inches farther, then inflate the balloon with 10 mL sterile water." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "Which statement about routine catheter care is accurate?", opts: [ O("Care is given at least twice daily, cleansing the first 2 inches of catheter", true, "Correct. Routine care is at least twice a day and includes cleansing the first 2 inches of the catheter."), O("Care is given at least once weekly, cleansing the first 6 inches of catheter", false, "Incorrect. Care is twice daily, not weekly, and the routine cleansing length is 2 inches."), O("Care is given only after bowel movements, cleansing the full catheter length", false, "Incorrect. Care is also scheduled twice daily; bowel movements are an added trigger, not the only one."), O("Care is given at least four times daily, cleansing the first 8 inches of tubing", false, "Incorrect. The printed frequency is at least twice daily, not four times daily.") ], tp: "Catheter care: at least twice daily and after bowel movements; cleanse the first 2 inches (4 inches with a sterile kit)." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "Which statement about collecting a urine specimen from a catheter is accurate?", opts: [ O("Cleanse the drainage port, then withdraw urine with a sterile needle and syringe", true, "Correct. The port is cleansed with alcohol and urine is withdrawn with a sterile needle and a 10-mL syringe."), O("Cleanse the drainage bag, then pour urine from the bag into a sterile specimen cup", false, "Incorrect. Urine sitting in the bag is not used; the specimen comes from the port."), O("Disconnect the tubing, then collect urine dripping from the open catheter end", false, "Incorrect. Disconnecting breaks the closed system; the port is used instead."), O("Cleanse the drainage port, then withdraw urine with a clean household teaspoon", false, "Incorrect. A sterile needle and 10-mL syringe are used, per standard precautions.") ], tp: "Specimen: cleanse the port, sterile needle, 10-mL syringe - never from the drainage bag." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "Which statement about voiding after an indwelling catheter is removed is accurate?", opts: [ O("Most patients void within 8 hours, and the provider is notified if they do not", true, "Correct. Most patients void adequately within 8 hours after removal; failure to void is reported for further orders."), O("Most patients void within 1 hour, and the provider is notified if they do not", false, "Incorrect. The printed window is 8 hours, not 1 hour."), O("Most patients void within 24 hours, and no report is needed during that period", false, "Incorrect. The window is 8 hours, and the provider must be notified if the patient does not void."), O("Most patients void within 3 days, matching the delayed infection symptom window", false, "Incorrect. Three days relates to possible infection signs, not the expected first voiding window.") ], tp: "After removal: expect voiding within 8 hours; record time, amount, and color of the first void." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "Which statement about infection signs after catheter removal is accurate?", opts: [ O("Signs may not appear for 2 or more days and may develop 2 to 3 days later", true, "Correct. Infection signs are delayed; they may develop 2-3 days after removal, possibly after discharge home."), O("Signs appear within the first hour and resolve before the end of the same shift", false, "Incorrect. The chapter warns signs are delayed by days, not confined to the first hour."), O("Signs appear only while the catheter remains in place and never after removal", false, "Incorrect. Signs can develop after removal, which is why discharge teaching matters."), O("Signs appear exactly 8 hours after removal in nearly every affected patient", false, "Incorrect. Eight hours is the voiding window, not the infection-sign timeline.") ], tp: "UTI signs after removal: urgency, burning, frequency, small amounts - teach them, because they may start 2-3 days later at home." });

BANK.push({ cat: CB, type: "multi", kt: [], stem: "Which catheter tasks may be delegated to unlicensed assistive personnel in some settings? Select all that apply.", opts: [ O("Perineal care and cleaning of the catheter tubing for a stable patient case", true, "Correct. Perineal care and tubing cleaning may be delegated."), O("Removal of a urinary catheter in the few facilities whose policy allows it", true, "Correct. Catheter removal may be delegated in few facilities; evaluation and teaching stay with the nurse."), O("Urine specimen collection from a catheter in some settings, per facility policy", true, "Correct. Specimen collection from a catheter may be delegated in some settings."), O("Catheter irrigation for a patient whose tubing is blocked by sediment or clots", false, "Incorrect. Irrigation requires the knowledge of a nurse and is not delegated."), O("First-time catheterization of an acute care patient with urethral trauma history", false, "Incorrect. First-time and trauma catheterizations require the critical thinking of a nurse.") ], tp: "Delegation: perineal care, some removal and specimen collection may be delegated; irrigation, first-time, and trauma catheterization may not." });

    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 15: Elimination and Gastric Intubation - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
