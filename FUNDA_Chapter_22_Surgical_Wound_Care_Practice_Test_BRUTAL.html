<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Wound Types, Classification, and Healing Phases";
var CB = "Healing Intentions and Factors That Impair Healing";
var CC = "Exudate, Drainage, and Infection";
var CD = "Dressings, Irrigation, and Wound Care Skills";
var CE = "Complications: Hemorrhage, Dehiscence, and Evisceration";
var CF = "Drains, VAC, Bandages, Binders, and Removal";
var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 6,
  "types": {
   "single": 5,
   "matrix": 1
  }
 },
 CB: {
  "name": CB,
  "count": 7,
  "types": {
   "single": 6,
   "multi": 1
  }
 },
 CC: {
  "name": CC,
  "count": 7,
  "types": {
   "single": 5,
   "multi": 1,
   "dropdown": 1
  }
 },
 CD: {
  "name": CD,
  "count": 9,
  "types": {
   "order": 1,
   "single": 7,
   "matrix": 1
  }
 },
 CE: {
  "name": CE,
  "count": 11,
  "types": {
   "single": 7,
   "multi": 3,
   "order": 1
  }
 },
 CF: {
  "name": CF,
  "count": 10,
  "types": {
   "single": 9,
   "dropdown": 1
  }
 }
};

BANK.push({ cat: CA, type: "single",
  stem: "A 58-year-old is 2 days post colon resection. The operative note shows the bowel was entered under controlled conditions with no spillage and no infection. Which wound class should the nurse expect in the chart?",
  opts: [ O("Class II, from controlled entry into the bowel", true, "Correct. Controlled entry into the alimentary tract without contamination is Class II."), O("Class I, since the skin was closed with staples", false, "Incorrect. Closure method does not set the class; tract entry rules out Class I."), O("Class III, since the bowel holds stool bacteria", false, "Incorrect. Class III needs gross spillage, fresh trauma, or a major technique break."), O("Class IV, since the colon was opened in surgery", false, "Incorrect. Class IV needs an old wound, devitalized tissue, or perforation.") ],
  tp: "Class II (clean contaminated): tract entered under controlled conditions, no infection or major break. Framework: nursing process — match assessed facts to the classification criteria." });

BANK.push({ cat: CA, type: "single",
  stem: "During an appendectomy the appendix ruptures and stool spills into the field before closure. The circulating nurse asks how this changes the wound classification. Which response is accurate?",
  opts: [ O("Perforated viscera places it in Class IV, dirty", true, "Correct. The decision tree lists perforated viscera under Class IV, dirty and infected."), O("It stays Class I because surgery was scheduled", false, "Incorrect. A scheduled start does not keep a wound clean once viscera perforate."), O("It stays Class II since entry was controlled at", false, "Incorrect. Rupture with spillage is not controlled entry without contamination."), O("Class is set only by the length of the incision", false, "Incorrect. Class is set by contamination level, not incision length.") ],
  tp: "Ruptured appendix / perforated viscera and gross spillage push the wound to Class III-IV risk; printed Class IV covers perforated viscera. Framework: safety first — contamination level drives infection precautions." });

BANK.push({ cat: CA, type: "single",
  stem: "A 70-year-old arrives with a knife wound from 7 hours ago; the tissue at the edges is dark and nonviable and pus is present. Which classification and risk statement fit this wound?",
  opts: [ O("Class IV, with infection risk nearing 39 percent", true, "Correct. An old wound with devitalized tissue and purulence is Class IV, and contaminated wound risk nears 39%."), O("Class I, with infection risk under 5 percent now", false, "Incorrect. Under 5% is the clean wound risk; this wound is old, devitalized, and purulent."), O("Class II, with infection risk under 5 percent now", false, "Incorrect. Class II is controlled surgical tract entry, not an old traumatic wound."), O("Class III, with no added infection risk expected", false, "Incorrect. Contamination of traumatic origin significantly elevates infection risk.") ],
  tp: "Class IV: old wound over 4-6 hours with retained devitalized tissue and existing infection; contaminated wounds carry infection risk nearing 39%. Framework: acute vs chronic / unstable first." });

BANK.push({ cat: CA, type: "single",
  stem: "On postop day 1 a patient's incision is red, warm, swollen, and tender, with no drainage and a temperature of 99.1 F. Which interpretation is most accurate?",
  opts: [ O("Expected inflammatory phase findings on day one", true, "Correct. Erythema, heat, edema, and pain are the cardinal inflammatory signs, and edges look inflamed for 2 to 3 days."), O("Wound infection needing an immediate culture now", false, "Incorrect. Infection is labeled by purulent drainage; these are expected day-one inflammatory signs."), O("Dehiscence beginning at the incision line today", false, "Incorrect. Dehiscence peaks on days 5 to 12 and is warned by serosanguineous drainage."), O("A keloid forming at the incision line this early", false, "Incorrect. Keloids form in the maturation phase, weeks later, not on day one.") ],
  tp: "Edges normally appear inflamed for the first 2-3 days; inflammatory phase signs are expected early. Framework: expected vs unexpected findings — do not treat an expected phase as infection." });

BANK.push({ cat: CA, type: "single",
  stem: "A nurse teaches a patient on postop day 8 that the incision is gaining strength as collagen builds. The patient asks when the wound will be as strong as before surgery. Which answer is accurate?",
  opts: [ O("Strength builds for up to a year and rarely fully", true, "Correct. Healing can take up to a year, and wounds rarely regain full original strength."), O("Full original strength returns by postop day ten", false, "Incorrect. Sutures come out at 7 to 10 days, but full strength takes far longer."), O("Full original strength returns at three full weeks", false, "Incorrect. At about 3 weeks fibroblasts exit; strength keeps building for months."), O("Strength is complete once the staples are removed", false, "Incorrect. Staple removal at 7 to 10 days does not mean healing is complete.") ],
  tp: "Healing can take up to a year and healed wounds rarely return to pre-surgery strength; collagen rises days 5-25. Framework: nursing process — teach from the assessed healing phase." });

BANK.push({ cat: CA, type: "matrix",
  stem: "A nurse reviews four healing findings. Match each finding to the phase in which it mainly occurs.",
  cols: ["Hemostasis / Inflammatory", "Reconstructive / Maturation"],
  rows: [ { t: "Platelets adhere to the vessel wall and a fibrin web traps red cells", a: 0, r: "Correct. Clot formation with platelets and fibrin is hemostasis." }, { t: "White cells move in and engulf bacteria and other organisms present", a: 0, r: "Correct. Leukocyte phagocytosis is an inflammatory phase event." }, { t: "Myofibroblasts produce collagen and the wound visibly contracts shut", a: 1, r: "Correct. Collagen production and contraction mark the reconstructive phase." }, { t: "Fibroblasts exit and collagen cross links to strengthen the tissue", a: 1, r: "Correct. Fibroblast exit and cross-linking mark the maturation phase." } ],
  tp: "Phases in order: hemostasis, inflammatory, reconstructive, maturation. Framework: nursing process — phase recognition drives expected-finding judgments." });

BANK.push({ cat: CB, type: "single",
  stem: "A 64-year-old with a large open abdominal wound has edges far apart; the plan is to let the cavity fill with soft pink fleshy tissue. Which healing intention and scar should the nurse teach about?",
  opts: [ O("Secondary intention, with a large scar expected", true, "Correct. Widely separated edges heal by granulation under secondary intention, leaving a large scar."), O("Primary intention, with a fine scar expected now", false, "Incorrect. Primary intention needs edges close together with little tissue lost."), O("Tertiary intention, with later suture closure set", false, "Incorrect. Tertiary intention is closed later by suturing granulation layers together."), O("Secondary intention, with no scar expected at all", false, "Incorrect. Secondary intention leaves a large scar, not no scar.") ],
  tp: "Secondary intention: edges not approximated, granulation fills the cavity, large scar. Framework: nursing process — teaching matches the assessed wound type." });

BANK.push({ cat: CB, type: "single",
  stem: "A wound that was closed at surgery became infected, was opened, allowed to granulate, and is now scheduled for suturing. Which intention describes this course?",
  opts: [ O("Tertiary intention, closed later after granulating", true, "Correct. Opened, granulated, then sutured closed is tertiary intention, with a deeper wider scar."), O("Primary intention, closed once at the first surgery", false, "Incorrect. The later reopening and second closure move this out of primary intention."), O("Secondary intention, healing open with no closure", false, "Incorrect. Secondary intention wounds are not sutured closed after granulating."), O("Tertiary intention, closed with glue at the bedside", false, "Incorrect. Tertiary closure is by suturing granulation layers, not bedside glue.") ],
  tp: "If a primarily closed wound becomes infected, is opened, granulates, and is then sutured, that is tertiary intention. Framework: nursing process — classify by the actual course, not the first closure." });

BANK.push({ cat: CB, type: "single",
  stem: "A malnourished patient after bowel surgery eats poorly. Which meal tray best supports wound repair per this chapter?",
  opts: [ O("Grilled meat, spinach, strawberries, fortified cereal", true, "Correct. This tray covers protein, vitamin A, vitamin C, and zinc sources named in the chapter."), O("Clear broth, gelatin, tea, and plain white toast only", false, "Incorrect. This tray lacks the protein, vitamins A and C, and zinc needed for repair."), O("Fried snacks, soda, candy, and a plain hot dog bun only", false, "Incorrect. This tray provides calories without the named repair nutrients."), O("Water, ice chips, and a small cup of black coffee only", false, "Incorrect. This is essentially no nutrition for a patient who needs repair nutrients.") ],
  tp: "Protein, vitamins A and C, and zinc assist repair: meats, peanut butter, legumes; leafy/yellow-orange produce; strawberries, tomatoes, cruciferous vegetables; fortified cereals, red meat, seafood. Framework: Maslow — physiologic nutrition needs support healing." });

BANK.push({ cat: CB, type: "single",
  stem: "A patient who smokes a pack daily asks why the surgeon keeps mentioning smoking and the incision. Which explanation matches Table 22.1?",
  opts: [ O("Smoking cuts working hemoglobin and wound oxygen", true, "Correct. Smoking reduces functional hemoglobin, decreasing tissue oxygenation needed for repair."), O("Smoking mainly dries the skin around the incision", false, "Incorrect. The printed harm is oxygen delivery and clotting changes, not skin dryness."), O("Smoking only matters if the patient also has diabetes", false, "Incorrect. Smoking impairs healing on its own in Table 22.1."), O("Smoking speeds healing but raises scar thickness a lot", false, "Incorrect. Smoking impairs healing; keloid overgrowth is a separate maturation issue.") ],
  tp: "Smoking reduces functional hemoglobin and tissue oxygenation, raises platelet aggregation and hypercoagulability, and impairs oxygen release. Framework: nursing process — teach the printed mechanism, not a generic warning." });

BANK.push({ cat: CB, type: "single",
  stem: "A patient on long-term steroids has a new incision with almost no redness or swelling on day 3. Which nursing action is most appropriate?",
  opts: [ O("Observe closely since steroid use can mask signs", true, "Correct. Steroids suppress inflammation, so the nurse observes carefully despite few visible signs."), O("Chart the wound as infection free and stop checks", false, "Incorrect. Absent signs on steroids do not prove the wound is infection free."), O("Stop the steroid dose until the wound fully heals", false, "Incorrect. The nurse does not stop prescribed steroids; careful observation is the action."), O("Apply extra tape layers to protect the quiet wound", false, "Incorrect. Extra tape risks skin irritation and does not address masked infection.") ],
  tp: "Drugs row: steroids reduce the inflammatory response, so signs of inflammation are not always obvious — observe carefully; vitamin A can counteract steroid effects. Framework: safety first — a blunted response hides infection." });

BANK.push({ cat: CB, type: "multi",
  stem: "A 72-year-old with diabetes and a foot incision is at risk for poor healing. Which actions match Table 22.1 for diabetes? Select all that apply.",
  opts: [ O("Teach measures to avoid cuts or breaks in skin", true, "Correct. The table directs teaching preventive measures to avoid skin breaks."), O("Provide preventive foot care on a regular basis", true, "Correct. Preventive foot care is a printed diabetes intervention."), O("Support blood sugar control to limit vessel harm", true, "Correct. Controlling blood sugar reduces the physiologic changes of diabetes."), O("Encourage barefoot walking to toughen the feet up", false, "Incorrect. Barefoot walking risks the cuts and breaks the patient must avoid."), O("Skip glucose checks once the incision looks pink", false, "Incorrect. Blood sugar control remains part of care while healing continues.") ],
  tp: "Diabetes interventions: prevent cuts or breaks in skin, preventive foot care, control blood sugar. Framework: safety first — prevention in a high-risk patient." });

BANK.push({ cat: CB, type: "single",
  stem: "A patient with an abdominal incision coughs hard during teaching. Which instruction best protects the suture line?",
  opts: [ O("Hold a pillow firmly over the incision to splint", true, "Correct. Splinting the incisional area during coughing lessens intraabdominal pressure."), O("Bear down hard to clear the lungs in one effort", false, "Incorrect. Bearing down raises intraabdominal pressure and stresses the incision."), O("Lie flat and suppress every cough until discharge", false, "Incorrect. Coughing is needed for lung clearance; splinting makes it safer."), O("Remove the binder so the abdomen can move freely", false, "Incorrect. Support, not removal, protects the suture line during coughing.") ],
  tp: "Splinting with a pillow, rolled bath blanket, or palms lessens intraabdominal pressure; wound stress from coughing can disrupt the wound. Framework: safety first — prevent dehiscence before it occurs." });

BANK.push({ cat: CC, type: "single",
  stem: "Two hours after surgery a dressing shows bright red drainage that is spreading, and the patient's pulse is 118. Which action should the nurse take first?",
  opts: [ O("Inspect dressing and under the patient, check vitals", true, "Correct. Bright red drainage means active bleeding; inspect everywhere blood can pool and monitor vitals."), O("Reinforce the dressing and recheck at shift change", false, "Incorrect. Spreading bright red drainage with tachycardia needs immediate inspection, not waiting."), O("Remove the dressing to find the bleeding vessel now", false, "Incorrect. Until the surgeon orders a change, reinforce soiled dressings rather than removing them."), O("Give the ordered oral fluids and document the color", false, "Incorrect. Fluids and charting do not come before inspecting for hemorrhage.") ],
  tp: "Bright red sanguineous drainage indicates active bleeding; inspect the wound, dressing, and area under the patient, monitor vitals, and escalate. Framework: ABCs / safety first — active bleeding outranks routine tasks." });

BANK.push({ cat: CC, type: "single",
  stem: "A postoperative patient's dressing stays dry, but the nurse finds a large pool of blood under the patient's back and buttocks. Which principle explains this finding?",
  opts: [ O("Exudate follows gravity and pools under the patient", true, "Correct. Drainage follows gravity, so blood can collect under the patient while the dressing stays dry."), O("A dry dressing proves the incision is not bleeding", false, "Incorrect. This finding disproves that assumption; internal or dependent bleeding hides under the patient."), O("Blood under the patient is expected and needs no act", false, "Incorrect. Pooled blood signals hemorrhage and requires monitoring and reporting."), O("The pool means the dressing was applied far too tight", false, "Incorrect. Dressing tightness does not explain dependent pooling of blood.") ],
  tp: "Exudate follows the flow of gravity, so the dressing can stay dry while blood flows away under the patient; always inspect under the patient. Framework: safety first — a dry dressing never rules out hemorrhage." });

BANK.push({ cat: CC, type: "single",
  stem: "Drainage totals 340 mL in the first 24 hours after surgery. The drainage is serosanguineous with no odor. Which action is required?",
  opts: [ O("Report the amount to the provider immediately now", true, "Correct. More than 300 mL in the first 24 hours is abnormal and is reported immediately."), O("Chart the amount and report it at the next rounds", false, "Incorrect. The 300 mL rule requires immediate reporting, not routine rounding."), O("Reinforce the dressing and stop measuring output", false, "Incorrect. Output measurement continues, and this amount must be reported now."), O("Restrict fluids so the drainage amount falls down", false, "Incorrect. Fluids support healing; the response to excess drainage is reporting.") ],
  tp: "Greater than 300 mL in the first 24 hours is abnormal and reported immediately, whatever the type. Framework: safety first — the volume rule triggers escalation." });

BANK.push({ cat: CC, type: "single",
  stem: "On day 5 a patient's incision edges are bright red and swollen, drainage is thick yellow-green with a strong smell, and temperature is 101.8 F. Which action comes first?",
  opts: [ O("Culture the exudate and report the findings promptly", true, "Correct. A pungent odor with purulent drainage signals infection; culture confirms the organism for therapy."), O("Chart it as normal inflammation for the first days", false, "Incorrect. Normal edge inflammation fades after 2 to 3 days; bright red swollen edges on day 5 with pus signal infection."), O("Apply a transparent film to seal the drainage inside", false, "Incorrect. Transparent film is not absorbent and must not be used on draining wounds."), O("Irrigate until clear and cover with a dry dressing", false, "Incorrect. Culture comes before irrigation washes the organism away.") ],
  tp: "Infection picture at the 4-6 day incubation window: purulent drainage and odor mean infection is likely — perform a wound culture and report. Framework: nursing process — confirm the organism, then therapy follows." });

BANK.push({ cat: CC, type: "single",
  stem: "A Penrose drain is draining onto the dressing. Which monitoring method is correct for this open drain?",
  opts: [ O("Circle and date the drainage area on the dressing", true, "Correct. Circling and dating the area lets later observations be compared accurately."), O("Remove the soiled dressing each hour to weigh it up", false, "Incorrect. Soiled dressings are reinforced, not removed, until the surgeon orders a change."), O("Compress the drain reservoir every eight hours now", false, "Incorrect. A Penrose is an open gravity drain with no reservoir to compress."), O("Measure the drain output in a graduated cylinder on", false, "Incorrect. Penrose drainage collects in the dressing and is tracked by the circled area.") ],
  tp: "Monitor a Penrose drain by circling and dating the drainage area on the dressing and comparing later; until the surgeon orders a change, reinforce, never remove, soiled dressings. Framework: nursing process — measure change over time." });

BANK.push({ cat: CC, type: "multi",
  stem: "Which findings together indicate a wound infection is developing? Select all that apply.",
  opts: [ O("Fever with tenderness and pain at the wound site", true, "Correct. Fever plus site tenderness and pain are printed infection signs."), O("Elevated white blood cell count on the lab report", true, "Correct. An infection process is usually identified by an elevated WBC count."), O("Purulent drainage with an odor from the wound bed", true, "Correct. Purulent drainage with odor is a printed infection sign."), O("Edges brightly red and swollen after day three on", true, "Correct. Infected wound edges become brightly erythematous and edematous."), O("Clear thin drainage that lessens each day in amount", false, "Incorrect. Lessening serous drainage is the normal late healing pattern.") ],
  tp: "Infection: fever, tenderness and pain at the site, edema, elevated WBC, purulent drainage with odor, brightly erythematous edematous edges. Framework: nursing process — cluster cues before concluding infection." });

  opts: [ O("Remain with the patient and get the provider notified", true, "Correct. The nurse stays and ensures the provider is notified immediately."), O("Position low Fowler with the knees slightly flexed on", true, "Correct. This position relieves wound pressure and limits further protrusion."), O("Cover bowel with warm saline moistened sterile dressing", true, "Correct. Warm sterile saline keeps the organ moist and limits contamination."), O("Keep the patient NPO for surgical correction of wound", true, "Correct. Surgical repair is required, so the patient stays NPO."), O("Give oral pain medicine with a full glass of water now", false, "Incorrect. The patient is NPO; oral intake waits for the surgical plan.") ],
  tp: "Box 22.3 plan: remain with patient, notify provider, low-Fowler's knees flexed, warm moist sterile saline dressing, NPO, monitor vitals and organ color, reassure. Framework: safety first — generate only actions that protect the exposed organ." });

BANK.push({ cat: CE, type: "order", grp: "case1", scen: "CASE STUDY — Mr. Daniel R., 66 years old, BMI 34, had open abdominal surgery for a bowel resection 6 days ago. His incision is closed with staples. He has a chronic cough and vomited twice this morning. At 0900 the nurse notes new pale pink watery drainage soaking a 4-inch area of the dressing, which was dry at 0600. Vital signs: T 99.4 F, HR 104, BP 128/76, RR 20. He rates incision pain 6 of 10 and says the incision 'feels different today.'",
  stem: "CASE STUDY 5 of 6 — TAKE ACTION: Place the nurse's actions in the best order once the bowel is seen protruding.",
  items: [ { t: "Remain with the patient and have a coworker notify the provider", r: "First. Evisceration is an emergency; the nurse stays and notification goes out at once." }, { t: "Place the patient in low-Fowler's position with knees slightly flexed", r: "Second. Positioning relieves pressure on the wound and limits further protrusion." }, { t: "Cover the protruding bowel with a warm, moist, sterile saline dressing", r: "Third. The moist sterile cover protects the organ from drying and contamination." }, { t: "Keep the patient NPO and monitor vitals, organ color, and oxygen readings", r: "Fourth. NPO readies the patient for surgery while perfusion is monitored." }, { t: "Reassure the patient and explain what will happen next in care", r: "Fifth. Emotional support and explanation follow the protective actions." } ],
  tp: "Order: stay and call for notification, position low-Fowler's knees flexed, cover with warm moist sterile saline dressing, keep NPO and monitor vitals/organ color, then reassure and explain. Framework: ABCs — protect the organ and perfusion before comfort measures." });

BANK.push({ cat: CE, type: "single", grp: "case1", scen: "CASE STUDY — Mr. Daniel R., 66 years old, BMI 34, had open abdominal surgery for a bowel resection 6 days ago. His incision is closed with staples. He has a chronic cough and vomited twice this morning. At 0900 the nurse notes new pale pink watery drainage soaking a 4-inch area of the dressing, which was dry at 0600. Vital signs: T 99.4 F, HR 104, BP 128/76, RR 20. He rates incision pain 6 of 10 and says the incision 'feels different today.'",
  stem: "CASE STUDY 6 of 6 — EVALUATE OUTCOMES: Twenty minutes later the bowel under the moist dressing looks dusky and the pulse is 122 with BP 98/60. Which evaluation is correct?",
  opts: [ O("Perfusion is worsening, escalate to surgeon at once", true, "Correct. A dusky organ with shock vitals means the response is not working; escalate now."), O("The moist dressing is working since pain is unchanged", false, "Incorrect. Dusky color and shock vitals show worsening, whatever the pain score."), O("Remove the dressing to inspect the bowel more closely", false, "Incorrect. The moist cover stays on; exposure dries and contaminates the organ."), O("Wait for the next routine vital sign check in an hour", false, "Incorrect. Shock signs require immediate escalation, not the routine schedule.") ],
  tp: "Organ color change plus tachycardia and falling BP signal compromised perfusion and hypovolemic shock — escalate to the surgeon immediately. Framework: ABCs — evaluate perfusion, not just the dressing." });

/* ============ ENGINE (ES5) ============ */
var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 22: Surgical Wound Care</h1>';
  h += '<div class="sub">Brutal mode | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
