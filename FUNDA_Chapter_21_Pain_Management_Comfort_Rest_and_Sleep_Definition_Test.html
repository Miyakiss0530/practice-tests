<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Pain Concepts and Types";
var CB = "Pain Assessment and Comfort";
var CC = "Pain Treatment and Delivery";
var CD = "Rest and Sleep";
var CATS = [CA, CB, CC, CD];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 12,
  "types": {
   "single": 10,
   "multi": 2
  }
 },
 CB: {
  "name": CB,
  "count": 12,
  "types": {
   "single": 11,
   "multi": 1
  }
 },
 CC: {
  "name": CC,
  "count": 12,
  "types": {
   "single": 11,
   "multi": 1
  }
 },
 CD: {
  "name": CD,
  "count": 12,
  "types": {
   "single": 10,
   "multi": 2
  }
 }
};

BANK.push({ cat: CA, type: "single",
  stem: "Which statement matches McCaffery and Pasero's practical description of pain in this chapter?",
  opts: [ O("Pain is a value the nurse assigns to a patient after observing the patient's behavior", false, "Incorrect. Only the person with pain is the expert on that pain; the nurse does not assign its reality."), O("Pain is an unpleasant sensory experience tied only to visible tissue damage at one site", false, "Incorrect. Pain may occur with no tissue damage, and no predictable link exists between injury and pain felt."), O("Pain is whatever the experiencing person says it is, existing whenever he says it does", true, "Correct. That is the practical description printed in the chapter, and nurses are obliged to believe the patient."), O("Pain is present only when abnormal vital signs confirm what the patient reports feeling", false, "Incorrect. Vital signs return to baseline within about an hour even when severe pain continues.") ],
  tp: "McCaffery and Pasero: pain is whatever the experiencing person says it is, existing whenever he says it does." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement matches the International Association for the Study of Pain definition printed in this chapter?",
  opts: [ O("Pain is a purely emotional reaction that occurs only after physical healing is complete", false, "Incorrect. The definition joins sensory and emotional experience; it is not purely emotional."), O("Pain is a cardinal symptom that appears only during the active phase of inflammation", false, "Incorrect. Pain is a warning and a cardinal symptom of inflammation, but that is not the IASP definition."), O("Pain is a measurable body response that rises and falls in step with the amount of injury", false, "Incorrect. The chapter states no predictable relationship exists between identifiable injury and pain."), O("Pain is an unpleasant sensory and emotional experience linked with actual or potential tissue damage", true, "Correct. The IASP definition covers sensory and emotional components and actual or potential damage.") ],
  tp: "IASP: an unpleasant sensory and emotional experience associated with actual or potential tissue damage." });

BANK.push({ cat: CA, type: "single",
  stem: "Who is the expert on a patient's pain, according to this chapter?",
  opts: [ O("The nurse, who compares the patient's report with the objective signs on assessment", false, "Incorrect. The nurse assesses and believes the report, but the patient remains the expert."), O("The family, who know the patient's usual responses and can speak for the patient best", false, "Incorrect. Family help with planning, but expertise about the pain stays with the patient."), O("The health care provider, who can judge pain from the extent of tissue damage present", false, "Incorrect. Pain is not determined by tissue damage alone, so the provider is not the expert."), O("Only the person with pain, for its location, duration, intensity, quality, and pattern", true, "Correct. The chapter names the patient as the only expert on those features of the pain.") ],
  tp: "Only the person with pain is the expert on its location, duration, intensity, quality, and pattern." });

BANK.push({ cat: CA, type: "single",
  stem: "Which example is referred pain, as the term is used in this chapter?",
  opts: [ O("Burning pain felt along a damaged nerve pathway in a patient with diabetic neuropathy now", false, "Incorrect. That describes neuropathic pain along a nerve, not pain felt at a distant site."), O("Dull pain felt across the whole abdomen in a patient who cannot point to one painful spot", false, "Incorrect. Poorly localized pain is still felt in the region of the problem, not referred."), O("Coronary insufficiency pain felt in the left shoulder, left arm, or jaw, away from the heart", true, "Correct. Referred pain is felt at a site other than the injured or diseased organ or body part."), O("Incisional pain felt exactly at the surgical site where the tissue was cut during surgery", false, "Incorrect. Pain felt at the injured site itself is localized pain, not referred pain.") ],
  tp: "Referred pain is felt at a site other than the injured or diseased organ; coronary pain may be felt in the left shoulder, arm, or jaw." });

BANK.push({ cat: CA, type: "single",
  stem: "Which pairing of duration with pain type is correct in this chapter?",
  opts: [ O("Acute pain generally lasts less than 6 months; chronic pain generally lasts longer than 6 months", true, "Correct. Six months is the chapter's dividing line between acute and chronic pain."), O("Acute pain generally lasts less than 6 days; chronic pain generally lasts longer than 6 days", false, "Incorrect. The chapter uses 6 months, not 6 days, as the dividing line for these types."), O("Acute pain generally lasts less than 6 weeks; chronic pain generally lasts longer than 6 weeks", false, "Incorrect. The chapter uses 6 months, not 6 weeks, as the dividing line for these types."), O("Acute pain generally lasts longer than 6 months; chronic pain lasts less than 6 months", false, "Incorrect. The durations are reversed in that pairing; check the 6-month dividing line.") ],
  tp: "Acute pain: less than 6 months. Chronic pain: longer than 6 months." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about acute pain is accurate?",
  opts: [ O("It builds slowly over years and is linked with depression and low self-esteem changes", false, "Incorrect. Depression and low self-esteem build with chronic pain, not acute pain."), O("It signals that tissue damage has occurred and no longer serves any warning purpose", false, "Incorrect. That statement describes chronic pain, which signals damage has occurred."), O("It warns of actual or potential tissue damage and resolves as the known cause heals", true, "Correct. Acute pain is intense, short, and protective, and it resolves as healing occurs."), O("It produces no autonomic response, so pulse and blood pressure stay at baseline levels", false, "Incorrect. Acute pain floods the body with epinephrine in a fight-or-flight response.") ],
  tp: "Acute pain warns of actual or potential tissue damage; anxiety is usually associated with it." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about chronic pain is accurate?",
  opts: [ O("Fatigue and sleep disturbance stay separate from it and never change how it is felt", false, "Incorrect. Fatigue, sleep disturbance, and depression act together and change pain perception."), O("Anxiety and a fight-or-flight surge of epinephrine are the responses most tied to it", false, "Incorrect. Anxiety and the sympathetic surge belong to acute pain, not chronic pain."), O("Tissue damage sufficient to explain it can always be found on careful examination now", false, "Incorrect. Many patients describe chronic pain for which little or no tissue damage is found."), O("Depression, low self-esteem, and changes in role and social interaction develop with it", true, "Correct. Those psychosocial changes build up over the prolonged course of chronic pain.") ],
  tp: "Chronic pain is linked with depression, fatigue, sleep disturbance, low self-esteem, and role changes; it is also a risk factor for suicide." });

BANK.push({ cat: CA, type: "multi",
  stem: "Which statements about chronic pain are accurate? Select all that apply.",
  opts: [ O("It is proven to be psychological when no tissue damage can be found to explain its level", false, "Incorrect. Failure to find tissue damage is not proof that pain is of psychological origin."), O("It does not serve as a warning of tissue damage; it signals that such damage has occurred", true, "Correct. Unlike acute pain, chronic pain has lost the warning function described here."), O("It triggers a sustained fight-or-flight response that keeps vital signs elevated for days", false, "Incorrect. The fight-or-flight surge belongs to acute pain and settles within about an hour."), O("It may be linked to arthritis, back injuries, fibromyalgia, accidents, or nerve conditions", true, "Correct. Those sources are named in the chapter for chronic pain and its prolonged course."), O("It generally lasts longer than 6 months and may be continuous or intermittent in pattern", true, "Correct. Duration over 6 months, continuous or intermittent, is the chapter's description.") ],
  tp: "Chronic pain: longer than 6 months, no warning function, linked to arthritis, back injury, fibromyalgia, accidents, and neurologic conditions." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement describes gate control theory accurately?",
  opts: [ O("When spinal cord gates are removed, the brain acknowledges every stimulus as painful now", false, "Incorrect. The theory concerns gates opening, closing, and partially opening, not removal."), O("When spinal cord gates are closed, pain impulses are blocked from reaching the brain", true, "Correct. Gating mechanisms in the dorsal horn block some impulses when the gates close."), O("When spinal cord gates are open, pain impulses are blocked before they reach the brain", false, "Incorrect. Open gates let pain impulses flow freely; closed gates block transmission."), O("When spinal cord gates are closed, every pain impulse passes through to the brain at once", false, "Incorrect. Closed gates block impulses; that statement describes the open-gate state instead.") ],
  tp: "Gate control: gates open = pain felt; gates closed = impulse blocked; partial openings admit only some impulses." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about endorphins is accurate?",
  opts: [ O("They are synthetic drugs given by injection when natural pain relief has failed completely", false, "Incorrect. Endorphins are morphine-like substances the body itself produces in the pituitary and CNS."), O("They lower the pain threshold so that mild stimuli are felt as painful during times of stress", false, "Incorrect. A person appears to feel less pain when endorphin levels are higher, not more pain."), O("They attach to prostaglandin sites in injured tissue and increase transmission of impulses", false, "Incorrect. Prostaglandin inhibition is the nonopioid mechanism; endorphins act at opioid sites."), O("They attach to opioid receptor sites in the brain and inhibit transmission of pain impulses", true, "Correct. Stress and pain activate endorphins, which then inhibit pain impulse transmission.") ],
  tp: "Endorphins are potent polypeptides found in the pituitary gland and CNS; TENS, acupuncture, and placebos may cause their release." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about cutaneous stimulation and the gate is accurate?",
  opts: [ O("Cold applications block pain only after the painful area has first been warmed thoroughly", false, "Incorrect. Cold applications themselves are listed among the stimuli that close the gate."), O("Back rubs and warm compresses open the gate wider so pain reaches awareness more quickly", false, "Incorrect. Those stimuli close gates to painful stimuli; they do not open them wider."), O("Auditory and visual distraction remove tissue damage so the painful stimulus disappears", false, "Incorrect. Distraction moves pain from the center of attention; it does not remove damage."), O("Pressure from back rubs, heat, and cold can close gates to painful stimuli for a period", true, "Correct. Pain and other sensations share large-nerve pathways, so cutaneous input can block pain.") ],
  tp: "Cutaneous stimulation (back rubs, heat, cold) closes gates; auditory or visual distraction makes pain more tolerable." });

BANK.push({ cat: CA, type: "multi",
  stem: "Which findings are behavioral characteristics of a patient in pain in Box 21.1? Select all that apply.",
  opts: [ O("Has narrowed focus, reduced attention span, and impaired thought processes at times", true, "Correct. Narrowed focus and impaired thought processes are listed in Box 21.1 here."), O("Shows distraction behavior such as moaning, rocking, crying, pacing, or restlessness", true, "Correct. Those distraction behaviors are listed behavioral characteristics of pain."), O("Always shows a clear outward expression of pain that staff can recognize at a glance", false, "Incorrect. The chapter warns some patients show no outward expression of pain at all."), O("Maintains normal social contact and seeks out conversation to report the pain level", false, "Incorrect. Patients in pain may withdraw from social contact and avoid conversation."), O("Guards the painful area and is self-protective about movement near that area there", true, "Correct. Guarding and self-protective behavior are listed behavioral characteristics.") ],
  tp: "Box 21.1 behaviors include guarding, narrowed focus, withdrawal, distraction behavior, facial mask of pain, and altered muscle tone; some patients show no outward expression." });

BANK.push({ cat: CB, type: "single",
  stem: "Under the fifth vital sign approach, which pain finding is reported to the health care team?",
  opts: [ O("A pain rating of 4 or greater on a scale of 0 to 10, like a temperature higher than 100 F", true, "Correct. The chapter pairs a rating of 4 or greater with a temperature higher than 100 F (37.8 C)."), O("A pain rating of 10 on a scale of 0 to 10 only, like a temperature higher than 104 F here", false, "Incorrect. Only the worst possible rating is far above the printed threshold of 4."), O("A pain rating of 1 or greater on a scale of 0 to 10, like a temperature higher than 98.6 F", false, "Incorrect. A rating of 1 is not the chapter's reporting threshold under this approach."), O("A pain rating of 7 or greater on a scale of 0 to 10, like a temperature higher than 102 F", false, "Incorrect. Waiting for 7 delays action; the printed reporting threshold is 4 or greater.") ],
  tp: "Pain is the fifth vital sign; a rating of 4 or greater is reported, and most patients need a level of 4 or less to function well." });

BANK.push({ cat: CB, type: "single",
  stem: "In the HILDA pain assessment guide, the letter A stands for which assessment element?",
  opts: [ O("Amount of pain medication taken in the last 24 hours and the effect that it produced", false, "Incorrect. Medication name, dose, frequency, and effect are assessed, but A is not amount."), O("Anxiety level reported by the patient and the coping methods the patient usually uses", false, "Incorrect. Coping and sociocultural data matter, but A covers aggravating/alleviating factors."), O("Associated symptoms present with the pain, such as nausea, itching, or urinary retention", false, "Incorrect. Associated symptoms are checked in the guide, but they are not the letter A."), O("Aggravating and alleviating factors: what makes the pain worse and what makes it better", true, "Correct. A in HILDA covers aggravating and alleviating factors for the patient's pain.") ],
  tp: "HILDA: H = how it feels, I = intensity, L = location, D = duration, A = aggravating/alleviating factors." });

BANK.push({ cat: CB, type: "single",
  stem: "Which set lists the HILDA elements in the order printed in the guide?",
  opts: [ O("How it feels, Inspection, Location, Diagnosis, Associated symptoms present with pain now", false, "Incorrect. I is intensity and D is duration in the guide's HILDA sequence here."), O("History, Inspection, Listening, Diagnosis, Action plan for the next nursing shift listed", false, "Incorrect. HILDA is a pain assessment guide, not that history-and-plan sequence."), O("How it feels, Intensity, Location, Duration, Aggravating and alleviating factors listed", true, "Correct. H-I-L-D-A follows feelings, intensity, location, duration, then factors."), O("How long, Intensity, Location, Description, Amount of medication taken for relief listed", false, "Incorrect. H covers how the pain feels, not how long, and A is not an amount.") ],
  tp: "Use HILDA to ask about feel, intensity (now and worst in 24 hours), location, duration, and aggravating/alleviating factors, plus effects on sleep, appetite, energy, activity, relationships, and mood." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about the numeric pain rating scale is accurate?",
  opts: [ O("The patient marks a letter grade, with A for no pain and F for the worst pain felt now", false, "Incorrect. The numeric scale uses numbers from 0 to 10, not letter grades at all."), O("The patient chooses a number, with 0 for no pain and 10 for the worst pain imaginable", true, "Correct. The numeric 0-to-10 scale is the most frequently used of the rating scales."), O("The patient chooses a number, with 0 for worst pain and 10 for no pain at the moment", false, "Incorrect. The anchors are reversed in that statement; 0 is no pain and 10 is worst."), O("The nurse chooses a number after observing the patient, with 10 for no pain shown now", false, "Incorrect. The patient chooses the number; the scale is not scored by observation alone.") ],
  tp: "Numeric scale: 0 = no pain, 10 = worst pain imaginable; it is the most frequently used rating scale." });

BANK.push({ cat: CB, type: "single",
  stem: "Which rule for using a pain rating scale is correct?",
  opts: [ O("Any scale is acceptable as long as the nurse documents which brand of scale was used", false, "Incorrect. The rule is about using the same scale, not about documenting a brand name."), O("The same scale must always be used with the same patient, and by all staff in a setting", true, "Correct. Consistency of the scale, for the patient and the setting, is the printed rule."), O("A different scale may be used at each visit so the patient does not memorize answers", false, "Incorrect. Changing scales prevents valid comparison of the patient's ratings over time."), O("Scales should be switched to a faces format whenever the patient's rating seems too high", false, "Incorrect. A high rating is believed and acted on; it is not a reason to switch scales.") ],
  tp: "Same scale for the same patient every time, and all personnel in a setting use the same scale; ensure hearing aid and glasses are in place." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about the FACES pain rating scale is accurate?",
  opts: [ O("The Joint Commission developed the FACES scale to audit pain care in accredited hospitals", false, "Incorrect. TJC sets pain standards; Wong and Baker developed the FACES scale for children."), O("Wong and Baker developed the FACES scale, a verbal descriptive format, to assess children", true, "Correct. The FACES scale uses facial expressions and was developed for assessing children."), O("McCaffery and Pasero developed the FACES scale as part of the HILDA assessment guide tool", false, "Incorrect. McCaffery and Pasero are linked with the pain description and HILDA-era guidance, not FACES."), O("Wong and Baker developed the FACES scale, a numeric format, to assess older adults only", false, "Incorrect. FACES is a facial-expression (verbal descriptive) format developed for children.") ],
  tp: "Fig. 21.8 samples: A visual analog, B numeric, C verbal descriptive; Wong and Baker developed FACES for children." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement describes the visual analog scale accurately?",
  opts: [ O("The patient marks a spot on a horizontal line, with intensity increasing left to right", true, "Correct. The mark on the line shows current pain intensity on the visual analog scale."), O("The patient squeezes a dynamometer, and grip strength is converted into a pain score now", false, "Incorrect. No grip device is part of the sample pain scales printed in this chapter here."), O("The patient picks a word such as mild or severe, and the nurse converts it to a number", false, "Incorrect. Picking a descriptive word belongs to the verbal descriptive approach, not this one."), O("The patient picks a face that matches the pain, and the nurse records the face number", false, "Incorrect. Picking a face describes the facial-expression scale, not the visual analog scale.") ],
  tp: "Visual analog scale: mark on a horizontal line; intensity increases as the line moves from left to right." });

BANK.push({ cat: CB, type: "single",
  stem: "Which set lists physiologic objective signs of pain from Box 21.3?",
  opts: [ O("Rigid body position, restlessness, frowning, grimacing, and clenched teeth or fists now", false, "Incorrect. Those are behavioral signs in Box 21.3, not the physiologic set asked for."), O("Crying, moaning, rocking, pacing, and seeking out different activities or other people", false, "Incorrect. Those are distraction behaviors, a behavioral category, not physiologic signs."), O("Narrowed focus, impaired thought processes, and withdrawal from social contact at times", false, "Incorrect. Those are behavioral characteristics from Box 21.1, not physiologic signs."), O("Increased pulse, increased respiratory depth and rate, increased blood pressure readings", true, "Correct. Those sympathetic changes are the physiologic signs listed in Box 21.3 here.") ],
  tp: "Box 21.3 physiologic signs also include diaphoresis, pallor, dilated pupils, muscle tension, and nausea/vomiting when pain is severe." });

    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 21: Pain Management, Comfort, Rest, and Sleep - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
