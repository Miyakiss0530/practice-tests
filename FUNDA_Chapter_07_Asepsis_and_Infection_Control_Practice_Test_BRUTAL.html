var KEYTERMS = ["asepsis", "medical asepsis", "surgical asepsis", "chain of infection", "reservoir", "portal of exit", "portal of entry", "fomite", "virulence", "Gram stain", "culture and sensitivity", "inflammation", "standard precautions", "antiseptic", "disinfectant", "sterilization"];
var BLUEPRINT = {
 CA: {

   "order": 1,

 },
 CB: {

 CE: {

 },

 }

BANK.push({ cat: CA, type: "single",
  stem: "A nurse is preparing to insert an indwelling urinary catheter for a postoperative patient with urinary retention. Which technique should the nurse use for this procedure?",
  opts: [ O("Clean technique, because a closed drainage system keeps the urine sterile afterward anyway", false, "The closed system helps later, but insertion itself is an invasive procedure requiring sterile technique."), O("Sterile technique, with the full sterile field, sterile gloves, and sterile equipment ready", true, "Correct. Urinary catheter insertion is a chapter example of surgical asepsis. Framework: safety first."), O("Clean gloves only, because the urinary tract flushes organisms out with the urine flow daily", false, "Urine flow is a defense, but it does not make an invasive insertion a clean procedure."), O("Sterile gloves alone, with clean drapes and a clean catheter kit opened on the bedside table", false, "Sterile gloves over a contaminated setup still break sterile technique at the field.") ],
  tp: "Framework: safety first. Invasive procedures (catheter insertion, wound care, injections) get surgical asepsis; daily activities get medical asepsis." });

BANK.push({ cat: CA, type: "multi",
  stem: "A nurse reviews four newly admitted patients. Which patients are at greater risk for infection? Select all that apply.",
  opts: [ O("A patient receiving chemotherapy for cancer, with a low white cell count noted", true, "Correct. Chemotherapy is a printed risk booster that reduces immunologic function."), O("A patient with diabetes whose admission glucose reading is markedly elevated", true, "Correct. High glucose encourages bacterial growth and raises infection risk."), O("A patient admitted with open skin areas found across both lower legs at intake", true, "Correct. Open skin areas break the first line of defense against entry."), O("A patient taking immunosuppressant therapy for an autoimmune disease process", true, "Correct. Immunosuppressant therapy is a printed risk booster in this chapter."), O("A patient who reports sleeping well and eating three balanced meals every day", false, "Good sleep and nutrition support resistance; lack of sleep and poor nutrition raise risk.") ],
  tp: "Framework: Maslow, physiologic needs. Screen every admission against the risk list: immune status, open skin, devices, sleep, nutrition." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient with wound drainage is coughing without covering the mouth, and visitors keep handling the soiled dressing. Which link of the chain can the nurse break fastest at this bedside?",
  opts: [ O("The infectious agent, by changing the antibiotic before the culture result returns", false, "Drug changes wait on identification; the fastest bedside break is not the agent link."), O("The mode of transmission, through hand hygiene and containing the drainage now", true, "Correct. Transmission is the link the nurse controls most often. Framework: Nursing Process, intervention."), O("The host, by arranging immunization for every visitor before the next visiting hour", false, "Host resistance matters, but it cannot be raised faster than transmission can be blocked."), O("The reservoir, by discharging the patient to a setting with fewer microorganisms", false, "Discharge is not a bedside break, and reservoirs are managed in place with Box 7.1 measures.") ],
  tp: "Framework: Nursing Process. Trace all six links, then break the fastest one, most often transmission via hand hygiene." });

BANK.push({ cat: CA, type: "order",
  stem: "Place the six links of the chain of infection in the correct order, from first to last.",
  items: [ { t: "Infectious agent", r: "First link: the pathogen itself, such as bacteria, viruses, yeasts, fungi, or protozoa." }, { t: "Reservoir", r: "Second link: the place where the pathogen grows and reproduces." }, { t: "Portal of exit", r: "Third link: the route the pathogen takes out of the reservoir." }, { t: "Mode of transmission", r: "Fourth link: the vehicle that carries the pathogen, such as hands or a needle." }, { t: "Portal of entry", r: "Fifth link: the route the pathogen uses to enter the new host." }, { t: "Host", r: "Sixth link: the susceptible person or animal the pathogen reaches last." } ],
  tp: "Framework: Nursing Process, assessment. Agent, Reservoir, Exit, Transmission, Entry, Host; break any link and transmission stops." });

BANK.push({ cat: CA, type: "dropdown",
  stem: "Classify each task by the aseptic technique it requires. Task one is a urinary catheter insertion: [[0]] Task two is a routine morning bath for a stable patient: [[1]]",
  blanks: [ { o: [ O("Surgical asepsis with a sterile field and sterile gloves throughout the task", true, "Correct. Catheter insertion is invasive, so it requires the sterile technique."), O("Medical asepsis with clean gloves and freshly laundered linen for the task", false, "Clean technique is not enough for an invasive catheter insertion."), O("No aseptic technique, because the drainage bag keeps the system closed later", false, "The closed system is maintained after insertion; insertion still needs sterile technique.") ] }, { o: [ O("Surgical asepsis with a sterile field and sterile gloves throughout the task", false, "Bathing is a daily activity; sterile technique is reserved for invasive procedures."), O("Medical asepsis with clean gloves and freshly laundered linen for the task", true, "Correct. Bathing is routine daily care performed with the clean technique."), O("No aseptic technique, because bathing only touches the patient's intact skin", false, "Intact skin still carries transient organisms; bathing uses medical asepsis.") ] } ],
  tp: "Framework: safety first. Classify the procedure before care begins: daily activities are clean, invasive procedures are sterile." });

BANK.push({ cat: CA, type: "matrix", cols: ["Medical asepsis", "Surgical asepsis"],
  stem: "For each task, select the aseptic technique the chapter assigns to it.",
  rows: [ { t: "Giving a bed bath to a stable patient", a: 0, r: "Bathing is a daily activity performed under clean technique." }, { t: "Inserting an indwelling urinary catheter", a: 1, r: "Catheter insertion is an invasive procedure requiring sterile technique." }, { t: "Changing a sterile wound dressing", a: 1, r: "Wound care is a chapter example of surgical asepsis." }, { t: "Helping a patient brush the teeth", a: 0, r: "Oral care is routine daily care under medical asepsis." }, { t: "Giving an intramuscular injection", a: 1, r: "Injections are listed among the surgical asepsis procedures." } ],
  tp: "Framework: safety first. The technique follows the task, not the nurse's preference or the time available." });

BANK.push({ cat: CA, type: "single",
  stem: "A nurse finds unwashed hands, uncovered wound drainage, soiled linen piled on a chair, and a patient with decaying teeth on one unit. Which finding set should the nurse address as reservoirs first?",
  opts: [ O("All four findings, because each one is a named site where pathogens grow", true, "Correct. The chapter names unwashed hands, wound drainage, soiled linen, and decaying teeth as growth sites. Framework: safety first."), O("Only the wound drainage, because the other findings cannot grow pathogens", false, "Each named finding is an ideal area for pathogenic growth, not just the drainage."), O("Only the decaying teeth, because oral organisms are the most virulent ones", false, "Virulence varies by organism; the reservoir problem covers all four findings."), O("None of the findings, because reservoirs exist only outside the care facility", false, "Facilities concentrate ill carriers, so reservoirs inside the unit spread organisms easily.") ],
  tp: "Framework: safety first. Shrink the reservoir with Box 7.1 measures: contain drainage, bag soiled linen, enforce hand hygiene." });

BANK.push({ cat: CB, type: "single",
  stem: "A culture report returns showing the wound organism is resistant to the antibiotic a patient has received for 2 days. Which action should the nurse take first?",
  opts: [ O("File the report in the chart and reassess the wound at the next scheduled round", false, "A resistant report is the nurse's checkpoint; filing it without acting delays the drug change."), O("Alert the provider and expect a change to an antibiotic listed as sensitive", true, "Correct. The report drives the change. Framework: Nursing Process, intervention after assessment of results."), O("Stop the antibiotic independently and wait for the next routine provider visit", false, "The nurse alerts the provider; stopping therapy independently is outside this checkpoint role."), O("Double the current dose so the resistant organism is exposed to more of the drug", false, "Resistance is not overcome by doubling; the drug itself must change to a sensitive one.") ],
  tp: "Framework: Nursing Process. Review every C&S report against the current order; resistant means alert and expect a change." });

BANK.push({ cat: CB, type: "single",
  stem: "A patient with a suspected bacterial infection is prescribed a first antibiotic dose in 30 minutes, and no specimen has been collected yet. Which action should the nurse take first?",
  opts: [ O("Collect the specimen for culture before the first antimicrobial dose is given", true, "Correct. Identify the type first so the organism is alive to grow and be tested. Framework: Nursing Process, assessment first."), O("Give the dose early, then collect the specimen once the drug level peaks in blood", false, "A dose first can kill or suppress the organism the culture needs to identify."), O("Skip the culture, because the provider chose the antibiotic from experience already", false, "The experience-based choice is temporary; the C&S is what confirms or changes it."), O("Collect the specimen from the drainage bag so the patient is not disturbed at all", false, "Specimens come from body secretions and discharges collected correctly, not from a drainage bag.") ],
  tp: "Framework: Nursing Process, ADPIE. Collect correctly, transfer to the culture medium, then let sensitivity testing pick the drug." });

BANK.push({ cat: CB, type: "single",
  stem: "On day 3, a patient says, 'You changed my antibiotic, so the first one must have been a mistake.' Which response by the nurse is most appropriate?",
  opts: [ O("You are right to be upset; I will ask the provider why the wrong drug was ordered", false, "The first drug was not an error; agreeing with that framing teaches the wrong lesson."), O("The first drug was a best judgment; the culture has now pinpointed a better one", true, "Correct. Explain the change in a way that assures the patient the first prescription was not erroneous. Framework: therapeutic communication."), O("The laboratory made an error on the first day, and this drug corrects that error now", false, "No laboratory error is described; the system worked as designed over up to 3 days."), O("Antibiotics are always changed on day 3, so there is nothing more to explain here", false, "Changes follow the sensitivity report, not a fixed day-3 schedule.") ],
  tp: "Framework: therapeutic communication. C&S results take up to 3 days; the change is the system working, not a mistake." });

BANK.push({ cat: CB, type: "single",
  stem: "A hiker presents with a tick attached to the skin of the forearm after a day in a wooded area. Which action should the nurse take?",
  opts: [ O("Crush the tick firmly against the skin so it cannot release any more organisms", false, "The chapter is explicit: the tick must not be crushed or squeezed during removal."), O("Remove the tick without crushing or squeezing it, as promptly as possible now", true, "Correct. The longer a tick stays attached, the more likely infection becomes. Framework: safety first."), O("Leave the tick attached until the patient can be seen again at a follow-up visit", false, "Attachment time drives risk; waiting for a later visit increases the chance of infection."), O("Squeeze the tick until it detaches, then apply pressure to the bite site afterward", false, "Squeezing is the prohibited move, whatever is done to the site afterward.") ],
  tp: "Framework: safety first. Rocky Mountain spotted fever comes from Rickettsia rickettsii, carried by the wood tick." });

BANK.push({ cat: CB, type: "single",
  stem: "A worker is brought in after a suspected inhalation exposure to Bacillus anthracis spores at a mail facility. Which hand hygiene action should the nurse take?",
  opts: [ O("Use an alcohol-based hand rub, because it has excellent germicidal activity overall", false, "Alcohol has poor activity against spores; the anthrax exception requires soap and water."), O("Wash the hands with soap and water, using the physical action of washing and rinsing", true, "Correct. Alcohols, chlorhexidine, and iodophors have poor activity against spores. Framework: safety first."), O("Use an antimicrobial towelette, because it combines cleansing with an antiseptic agent", false, "Towelettes are not a substitute for sanitizer or antimicrobial soap, and spores demand washing."), O("Apply chlorhexidine and let it air dry, because drying completes the antiseptic effect", false, "Chlorhexidine is named among the agents with poor activity against anthrax spores.") ],
  tp: "Framework: safety first. Spore rule: for suspected Bacillus anthracis exposure, soap and water washing is what works." });

BANK.push({ cat: CB, type: "single",
  stem: "A patient with influenza-like symptoms, temperature 100.8 F, body aches, and a runny nose demands an antibiotic 'to knock this out.' Which action should the nurse take?",
  opts: [ O("Request an antibiotic, because refusing will damage the patient's trust in the team", false, "Antibiotics are not effective against viruses; giving in teaches the wrong lesson."), O("Explain that antibiotics do not work on viruses and offer symptom relief measures", true, "Correct. Viral care is fluids, rest, lozenges, analgesics, nasal rinses, and compresses. Framework: patient education."), O("Suggest the patient take a leftover antibiotic at home for the first three days only", false, "A leftover antibiotic does not treat a virus and is never the nurse's suggestion."), O("Tell the patient nothing can be done at all until the illness runs its full course", false, "The illness is self-limiting, but symptom remedies matched to the report are real care.") ],
  tp: "Framework: patient education. Teach which early signs of secondary bacterial infection to report to the practitioner." });

BANK.push({ cat: CB, type: "single",
  stem: "An immunocompromised patient receiving chemotherapy has a superficial fungal infection of the skin that is now spreading and deepening. Which action should the nurse take?",
  opts: [ O("Reassure the patient that fungal infections stay superficial and need no reporting", false, "In the immunocompromised, fungal infections can penetrate deeper and become fatal."), O("Report the spreading infection to the provider promptly as a significant finding", true, "Correct. A spreading fungal infection in this patient is a report-it finding. Framework: acute vs chronic, unstable first."), O("Apply an over-the-counter cream and recheck the area at the end of the work week", false, "Waiting a week on a deepening infection in a defenseless host is unsafe."), O("Start an antibacterial agent, because fungi and bacteria respond to the same drugs", false, "Fungi require antifungal agents; antibacterial drugs do not treat them.") ],
  tp: "Framework: stable vs unstable. Watch the immunocompromised patient hardest across the whole pathogen family set." });

BANK.push({ cat: CB, type: "single",
  stem: "A patient newly admitted has a wound colonized with MRSA and also has a severely weakened immune system from chemotherapy. Which statement reflects the nurse's priority concern?",
  opts: [ O("Facility MRSA strains are often multidrug resistant, narrowing the drug choices", true, "Correct. MRSA plus immunocompromise is the chapter's highest-risk pairing. Framework: safety first."), O("MRSA spreads mainly by casual contact, so the patient's roommate needs no review", false, "Casual-contact language belongs to anthrax teaching; MRSA risk here is resistance plus host weakness."), O("The sensitivity report will not help, because resistant organisms ignore all testing", false, "The sensitivity report is exactly what decides which drug still works."), O("The patient's own flora caused this, so transmission precautions are unnecessary", false, "Colonization with a resistant facility strain still demands transmission control.") ],
  tp: "Framework: safety first. For MRSA, the medication lesson is the resistance itself; the C&S report decides the drug." });

BANK.push({ cat: CB, type: "single",
  stem: "A laboratory report for a sputum specimen states the organism retained the Gram stain dye after the solvent step. Which interpretation should the nurse document?",
  opts: [ O("The organism is gram-positive, because the dye color was retained on the slide", true, "Correct. Retained color after solvent is the gram-positive result. Framework: Nursing Process, assessment data."), O("The organism is gram-negative, because the dye color was retained on the slide", false, "Gram-negative organisms lose the color when the solvent is applied."), O("The organism is a virus, because only viruses hold dye against a solvent wash", false, "The Gram stain is a bacterial identification method, not a viral test."), O("The organism needs no culture, because the stain alone names the effective drug", false, "No drug is chosen from the Gram stain alone; culture and sensitivity name the drug.") ],
  tp: "Framework: Nursing Process. The Gram stain narrows the field; the C&S report names the drug the organism is sensitive to." });

BANK.push({ cat: CC, type: "single",
  stem: "A nurse finishes vital signs on a patient in contact precautions and carries the blood pressure cuff toward the next patient's room. Which action should the nurse take?",
  opts: [ O("Use the cuff on the next patient, because vital signs do not involve body fluids", false, "Cuffs are named fomites; articles contacting the isolation patient are contaminated."), O("Leave dedicated equipment in the room, or disinfect it before another patient's use", true, "Correct. Dedicated equipment stays in the room when possible. Framework: safety first, chain of infection."), O("Shake the cuff out in the hallway to clear any organisms before the next reading", false, "Shaking moves organisms into the air; it never decontaminates equipment."), O("Place the cuff on the clean supply shelf so it is ready for the next nurse on shift", false, "A contaminated fomite on the clean shelf contaminates the clean supply area.") ],
  tp: "Framework: safety first. Indirect contact travels by fomite; break the transmission link at the equipment." });

BANK.push({ cat: CC, type: "single",
  stem: "While making a bed, a nurse drops a clean sheet on the floor of the patient's room. Which action should the nurse take?",
  opts: [ O("Pick it up, shake it out once, and use it, because it was clean a moment ago still", false, "Shaking linens spreads organisms, and anything dropped on the floor is treated as soiled."), O("Discard the sheet into the laundry bag as soiled, even though it had been clean", true, "Correct. The floor is one of the dirtiest areas; even clean linen that drops is discarded. Framework: safety first."), O("Use the sheet for the foot of the bed only, where the patient has the least contact", false, "There is no clean-enough zone on a contaminated sheet; it is soiled, full stop."), O("Fold the sheet and return it to the linen cart for the next patient's bed change", false, "Returning a floor-dropped sheet to the cart spreads contamination to clean stock.") ],
  tp: "Framework: safety first. Floor rule and air rule: never shake linens, use damp dusting, squat rather than kneel." });

      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
