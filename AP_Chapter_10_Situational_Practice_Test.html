<script>
/* ============ QUESTION BANK — SITUATIONAL (BRUTAL) ============ */
/* Herlihy Chapter 10: Nervous Tissue and Brain — situational items only, facts from the audited study guide. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Brain Overview";
var CB = "Cerebellum Limbic System and Sleep";
var CC = "Diencephalon and Brain Stem";
var CD = "Nervous System Organization";
var CE = "Neuroglia and Support Cells";
var CF = "Protecting the CNS";
var CG = "The Cerebrum";
var CH = "The Nerve Impulse";
var CI = "The Neuron";
var CJ = "The Synapse and Neurotransmitters";
var CATS = [CA, CB, CC, CD, CE, CF, CG, CH, CI, CJ];
var KEYTERMS = ["Action potential", "Threshold potential", "Saltatory conduction", "Blood-brain barrier", "Hydrocephalus", "Cerebrospinal fluid", "Basal nuclei", "Reticular activating system", "Broca's area", "Neuroglia"];
var BLUEPRINT = {};

/* ---------- NERVE IMPULSE ---------- */
BANK.push({ cat: CH, type: "single", kt: ["Action potential"],
  stem: "A stimulus applied to a neuron raises its membrane potential from −90 mV to −70 mV, and the signal fades away without firing. A second, stronger stimulus raises it to −60 mV and a full action potential follows. Which principle explains the difference?",
  opts: [
    O("The first stimulus never reached the threshold potential of −65 mV, so no action potential fired; the second crossed threshold and depolarized fully to +20 mV.", true, "Threshold is −65 mV: below it the signal decays and the cell returns to resting (−90 mV); at or above it, the neuron fully depolarizes to +20 mV. Framework: threshold/all-or-none reasoning."),
    O("The first stimulus repolarized the membrane too quickly, while the second stimulus kept sodium channels closed long enough to fire.", false, "Repolarization follows firing; the first stimulus simply never reached threshold, and firing requires Na+ channels to OPEN."),
    O("The first stimulus only depolarized the dendrites, while the second stimulus reached the axon terminals and released transmitter.", false, "The difference is the voltage reached (−70 vs −60 mV against a −65 mV threshold), not which part of the neuron was stimulated."),
    O("The first stimulus moved potassium into the cell, while the second stimulus moved potassium out of the cell to start the impulse.", false, "Depolarization is caused by Na+ moving IN; K+ efflux causes repolarization, the recovery phase.")
  ],
  tp: "Resting −90 mV → threshold −65 mV → fully depolarized +20 mV. Below threshold: no action potential, signal decays. Framework: threshold reasoning." });
BANK.push({ cat: CH, type: "single", kt: ["Depolarize", "Repolarize"],
  stem: "A nursing student charts the ionic events of an action potential as: 'Depolarization — potassium rushes out of the cell. Repolarization — the sodium-potassium pump restores the charge.' Which correction is accurate?",
  opts: [
    O("Depolarization is the rapid inward diffusion of Na+; repolarization is the rapid outward diffusion of K+ — the pumps only restore ion levels afterward.", true, "Na+ influx depolarizes (inside reaches +20 mV); K+ efflux repolarizes. The pumps are maintenance, not the cause of repolarization — a classic guide trap. Framework: mechanism discrimination."),
    O("The chart is correct as written, because potassium movement drives both phases of the action potential in sequence.", false, "K+ efflux drives only repolarization; depolarization is Na+ influx."),
    O("Depolarization is the rapid inward diffusion of K+; repolarization is the rapid outward diffusion of Na+ from the cell.", false, "Both ions are reversed: Na+ is the chief extracellular cation that rushes in; K+ is the chief intracellular cation that rushes out."),
    O("Repolarization is caused by acetylcholinesterase clearing the synapse, which resets the membrane charge of the neuron.", false, "AChE works at synapses on transmitters; it plays no role in membrane repolarization.")
  ],
  tp: "Depolarization = Na+ in. Repolarization = K+ out (NOT the pumps). Resting: K+ chief inside, Na+ chief outside. Framework: mechanism discrimination." });
BANK.push({ cat: CH, type: "single", kt: ["Saltatory conduction"],
  stem: "A patient with a demyelinating disease reports that signals in affected nerves have slowed dramatically. Which explanation connects the myelin loss to the slowed conduction?",
  opts: [
    O("Without myelin, the impulse can no longer jump node to node in saltatory conduction, so it travels much more slowly along the bare axon.", true, "Myelinated axons conduct by saltatory conduction — jumping between nodes of Ranvier — which is fast; bare axons conduct slowly and continuously. Framework: structure-function reasoning."),
    O("Without myelin, the axon can no longer produce neurotransmitters at its terminals, so the signal stops at the first synapse.", false, "Myelin insulates the axon shaft; transmitter production is a terminal function and is not what demyelination slows."),
    O("Without myelin, the nodes of Ranvier multiply along the axon, and the extra nodes delay the impulse at each stop.", false, "Nodes are the normal unmyelinated gaps; demyelination removes insulation rather than adding nodes."),
    O("Without myelin, the neuron's cell body shrinks, and a smaller cell body generates a weaker resting membrane potential.", false, "The resting potential is a membrane property; slowing comes from loss of node-to-node jumping, not cell-body size.")
  ],
  tp: "Myelin → saltatory (node-to-node) conduction = fast. Nodes of Ranvier are the UNmyelinated gaps. Framework: structure-function reasoning." });

/* ---------- NEURON / GLIA ---------- */
BANK.push({ cat: CI, type: "single", kt: ["Neuron"],
  stem: "A patient with a brain injury asks why damaged brain neurons are not replaced the way skin cells are. Which response by the nurse is accurate?",
  opts: [
    O("Neurons are nonmitotic — they do not divide or replace themselves — which is also why most primary CNS tumors arise from glial cells instead.", true, "Neurons cannot replace themselves; glia can divide, so most primary CNS tumors are glial (e.g., astrocytomas). Framework: cell-biology application."),
    O("Neurons are replaced constantly, but the replacement cells cannot form synapses, so function never returns after an injury.", false, "Neurons are nonmitotic and are not replaced at all; the premise of constant replacement is wrong."),
    O("Neurons divide only during sleep, when the glymphatic system clears enough waste to make room for new cells.", false, "The glymphatic system clears protein waste during sleep; it does not enable neuron division."),
    O("Neurons are replaced by Schwann cells migrating in from the peripheral nervous system after a brain injury occurs.", false, "Schwann cells are PNS cells; the CNS has no neurilemma and regenerates poorly for that reason.")
  ],
  tp: "Neurons = nonmitotic, irreplaceable. Most CNS tumors are glial. CNS lacks neurilemma → poor regeneration; PNS has one → better regeneration. Framework: cell-biology application." });
BANK.push({ cat: CE, type: "single", kt: ["Blood-brain barrier", "Astrocyte"],
  stem: "A patient with a CNS infection is started on an antibiotic, and the provider notes the drug was chosen because it can cross the blood-brain barrier. The patient asks why most antibiotics cannot simply be used. Which explanation is accurate?",
  opts: [
    O("Astrocytes and the selectively permeable capillary cells form a filter that blocks most antibiotics and harmful chemicals while letting oxygen and glucose through.", true, "The BBB is built from astrocytes plus selectively permeable capillaries: O2, glucose, certain ions (and alcohol) cross readily; most antibiotics and harmful chemicals are blocked. Framework: barrier-function reasoning."),
    O("The meninges wrap the brain in three layers that physically strain out any molecule larger than a glucose molecule.", false, "The meninges are protective coverings (the brain PAD); the selective filter is the astrocyte-capillary barrier."),
    O("Cerebrospinal fluid washes antibiotics out of the brain through the arachnoid villi faster than they can act.", false, "CSF drainage through arachnoid villi is normal circulation, not the reason drugs are excluded; the barrier blocks entry."),
    O("The choroid plexus destroys antibiotics while it forms cerebrospinal fluid inside the ventricles of the brain.", false, "The choroid plexus forms CSF; it does not destroy antibiotics.")
  ],
  tp: "BBB = astrocytes + selectively permeable capillaries. Crosses: O2, glucose, some ions, alcohol. Blocked: most antibiotics, harmful chemicals. Intrathecal injection bypasses it. Framework: barrier-function reasoning." });

/* ---------- CEREBRUM / BRAIN AREAS ---------- */
BANK.push({ cat: CG, type: "single", kt: ["Broca's area", "Aphasia"],
  stem: "After a stroke, a patient understands everything said to him and follows commands, but his speech comes out in broken, effortful phrases. Which area is most likely damaged?",
  opts: [
    O("Broca's area in the frontal lobe, the motor speech area — damage causes expressive aphasia with comprehension preserved.", true, "Broca's area (frontal lobe) produces speech; damage leaves understanding intact but speech broken — expressive aphasia. Framework: localization reasoning."),
    O("The postcentral gyrus in the parietal lobe — damage there blocks the sensory feedback needed to form words.", false, "The postcentral gyrus is the somatosensory area; it processes body sensation, not speech production."),
    O("The temporal lobe's hearing area — damage there prevents the patient from hearing his own words as he speaks.", false, "The temporal lobe serves hearing and smell; this patient hears and understands normally."),
    O("The occipital lobe's visual area — damage there prevents the patient from reading the words he wants to say.", false, "The occipital lobe is visual; the deficit described is speech production with intact comprehension.")
  ],
  tp: "Broca (frontal) = motor speech; broken speech + intact understanding = expressive aphasia. Precentral gyrus = motor (frontal), postcentral = sensory (parietal). Framework: localization reasoning." });
BANK.push({ cat: CC, type: "single", kt: ["Hypothalamus"],
  stem: "A patient with a hypothalamic tumor presents with unstable body temperature, intense thirst despite drinking, and disrupted sleep-wake patterns. Which explanation covers all three findings?",
  opts: [
    O("The hypothalamus regulates temperature, thirst, and wakefulness, so one lesion there can disturb all three functions at once.", true, "The hypothalamus is the diencephalon's regulator — temperature, hunger/thirst, and sleep-wake control all live there. Framework: localization reasoning (one lesion, many signs)."),
    O("The thalamus relays all sensory input, so a lesion there scrambles temperature sensation, thirst sensation, and sleep sensation.", false, "The thalamus is a relay station for sensory traffic; regulation of temperature and thirst belongs to the hypothalamus."),
    O("The medulla oblongata contains the vomiting center, and its dysfunction produces temperature and thirst instability.", false, "The medulla houses vital centers and the vomiting center, not temperature/thirst regulation."),
    O("The cerebellum coordinates temperature and thirst the way it coordinates movement and balance.", false, "The cerebellum coordinates movement, balance, and posture — not homeostatic regulation.")
  ],
  tp: "Hypothalamus = regulator (temperature, thirst, hunger, sleep-wake). Thalamus = relay. Medulla = vital centers + vomiting center. Framework: localization reasoning." });
BANK.push({ cat: CA, type: "single", kt: ["Parkinson disease", "Basal nuclei"],
  stem: "A patient develops a resting tremor, shuffling gait, and slowed movements. The provider explains the cause involves a neurotransmitter deficiency deep in the cerebrum and prescribes a dopamine-producing drug. Which structure is affected?",
  opts: [
    O("The basal nuclei, where dopamine deficiency produces Parkinson disease, the movement disorder also called shaking palsy.", true, "Basal nuclei + dopamine deficiency = Parkinson disease (dyskinesia with characteristic tremors — 'shaking palsy'); treatment supplies dopamine. Framework: localization + mechanism reasoning."),
    O("The cerebellum, where dopamine deficiency destroys coordination and produces the tremor and gait changes seen here.", false, "The cerebellum coordinates movement, but Parkinson disease is a basal nuclei dopamine problem, per the guide."),
    O("The frontal lobe motor cortex, where dopamine deficiency prevents voluntary movement signals from being generated.", false, "The motor cortex initiates voluntary movement; the described disorder maps to the basal nuclei and dopamine."),
    O("The limbic system, where dopamine deficiency alters emotion and produces the movement findings as a secondary effect.", false, "The limbic system governs emotion and memory, not this movement disorder.")
  ],
  tp: "Basal nuclei + low dopamine = Parkinson disease (shaking palsy); dopamine-producing drugs treat it. Framework: localization + mechanism reasoning." });
BANK.push({ cat: CB, type: "single", kt: ["Reticular activating system"],
  stem: "A patient who suffered a severe brain injury remains unresponsive. The care team explains that the system acting as the brain's 'volume dial' for consciousness has been depressed. Which system is being described, and what is its normal range?",
  opts: [
    O("The reticular activating system (RAS): full activation means awake and tuned in, diminished activity means sleep, and further depression means coma.", true, "The RAS dial runs awake → sleep → coma as activity falls; this patient's coma reflects a depressed RAS. Framework: system-function reasoning."),
    O("The glymphatic system: full activation means awake, diminished activity means sleep, and complete shutdown means coma.", false, "The glymphatic system clears protein waste and is 90% MORE active during sleep — the opposite pattern."),
    O("The limbic system: full activation means awake and alert, diminished activity means sleep, and further depression means coma.", false, "The limbic system handles emotion and memory, not the consciousness dial."),
    O("The corpus callosum: full activation connects the hemispheres for wakefulness, and its failure produces coma.", false, "The corpus callosum is the fiber tract joining the hemispheres; it does not set consciousness level.")
  ],
  tp: "RAS dial: awake → sleep → coma. Glymphatic clears waste mostly during sleep (90% more active). Framework: system-function reasoning." });
BANK.push({ cat: CB, type: "multi", kt: ["Memory"],
  stem: "A nursing student crams all night before an exam and blanks on material she 'knew' at 3 a.m. Which statements about memory explain her experience? Select all that apply.",
  opts: [
    O("Cramming loads short-term memory, which retains information only seconds to a few hours.", true, "Short-term memory lasts seconds to a few hours — cramming lands there and fades."),
    O("Studying spread over a longer period is what builds long-term memory, which lasts years to a lifetime.", true, "The guide's own study lesson: distributed study achieves the long-term effect."),
    O("Immediate memory holds information for only a few seconds at a time.", true, "Immediate memory = seconds — the shortest of the three categories."),
    O("REM sleep is when most dreaming occurs and when crammed material becomes permanent.", false, "REM is the dreaming stage; permanence comes from long-term encoding through spread-out study, not from one night's REM."),
    O("Melatonin released during cramming converts short-term memories into long-term storage.", false, "Melatonin initiates sleep; it does not convert memory categories.")
  ],
  tp: "Memory ladder: immediate (seconds) → short-term (seconds–hours; cramming) → long-term (years–lifetime; spread-out study). Framework: evidence-based study teaching." });

/* ---------- PROTECTION / CSF ---------- */
BANK.push({ cat: CF, type: "order", kt: ["Cerebrospinal fluid"],
  stem: "Place the path of cerebrospinal fluid in the order it flows, from formation to drainage.",
  items: [
    { t: "The choroid plexus in the ventricles forms CSF from blood vessels and ependymal cells", r: "CSF is formed by the choroid plexus suspended in each ventricle." },
    { t: "CSF circulates through the ventricles and the central canal of the spinal cord", r: "From the ventricles, CSF moves through the cord's central canal and around the CNS." },
    { t: "CSF fills the subarachnoid space between the arachnoid and pia mater, cushioning the CNS", r: "The subarachnoid space is where CSF circulates as a cushion." },
    { t: "Arachnoid villi drain the CSF into the dural sinuses", r: "Drainage is through arachnoid villi into the dural sinuses — the final step." }
  ],
  tp: "CSF path: choroid plexus forms it → ventricles/central canal → subarachnoid space → arachnoid villi drain to dural sinuses. Framework: process sequencing." });
BANK.push({ cat: CF, type: "single", kt: ["Meninges"],
  stem: "A patient with meningitis asks what the inflamed coverings around her brain actually are. Which description should the nurse give, from outermost to innermost?",
  opts: [
    O("Dura mater (tough 'hard mother'), arachnoid mater (spider-like middle layer), then pia mater (soft layer hugging the brain).", true, "The brain PAD: pia is closest to the brain, arachnoid in the middle, dura outermost — all inside the skull bone. Framework: structural sequencing."),
    O("Pia mater (tough outer layer), arachnoid mater (spider-like middle layer), then dura mater (soft layer hugging the brain).", false, "The names' meanings are swapped: dura = hard/tough and outermost; pia = soft/gentle and innermost."),
    O("Arachnoid mater (tough outer layer), dura mater (middle layer), then pia mater (soft layer hugging the brain).", false, "Arachnoid is the middle layer; dura is outermost."),
    O("Dura mater (soft layer hugging the brain), pia mater (middle layer), then arachnoid mater (tough outer layer).", false, "Only the middle/outside assignment of arachnoid is right by accident — dura is outer and tough, pia is inner and soft.")
  ],
  tp: "Meninges (brain PAD, inside-out): pia (soft, on brain) → arachnoid (web) → dura (hard, outer). Framework: structural sequencing." });
BANK.push({ cat: CD, type: "single", kt: ["Hypoglycemia"],
  stem: "A diabetic patient's blood glucose falls sharply. The first and worst symptoms are confusion, poor concentration, and irritability rather than muscle or gut complaints. Which fact explains this pattern?",
  opts: [
    O("The brain depends heavily on glucose and feels hypoglycemia first and worst, so CNS symptoms lead when glucose falls.", true, "The ~3-pound brain has an outsized glucose habit; hypoglycemia hits it first and hardest. Framework: organ-vulnerability reasoning."),
    O("The blood-brain barrier blocks glucose completely, so the brain starves before any other organ when glucose falls.", false, "Glucose crosses the BBB readily — that is precisely how the brain is fed; the issue is dependence, not blockade."),
    O("Neurons store large glycogen reserves that release sugar unevenly, causing confusion when the reserves empty.", false, "The brain's vulnerability comes from dependence on a continuous glucose supply, not from uneven storage release."),
    O("Hypoglycemia first damages the basal nuclei, and the confusion is an early sign of Parkinson-type dysfunction.", false, "Parkinson disease is a dopamine deficiency of the basal nuclei, unrelated to acute hypoglycemia symptoms.")
  ],
  tp: "Brain = glucose-dependent; hypoglycemia felt first/worst in the brain. Glucose crosses the BBB readily. Framework: organ-vulnerability reasoning." });
BANK.push({ cat: CJ, type: "single", kt: ["Synapse"],
  stem: "A patient's medication is designed to block acetylcholinesterase at cholinergic synapses. Which effect should the nurse predict?",
  opts: [
    O("Acetylcholine will remain active longer at the synapse, prolonging its effect on the postsynaptic cell.", true, "AChE is the inactivator that terminates ACh; blocking it leaves ACh working longer. Framework: pharmacology mechanism → predicted effect."),
    O("Acetylcholine will never be released from the vesicles, so the synapse will fall silent within minutes.", false, "Release is a presynaptic vesicle event; AChE blockade affects termination, not release."),
    O("The postsynaptic neuron will stop producing receptors, so the synapse will gradually stop responding.", false, "AChE blockade does not stop receptor production; it prolongs transmitter action."),
    O("Norepinephrine will replace acetylcholine at the synapse, converting it to an adrenergic junction.", false, "Blocking an enzyme does not swap one transmitter for another.")
  ],
  tp: "Synapse events: impulse arrives → vesicles release transmitter → binds receptors → inactivator (AChE) ends it. Block the inactivator → longer effect. Framework: mechanism prediction." });
BANK.push({ cat: CG, type: "single", kt: ["Cerebral lateralization"],
  stem: "Two stroke patients are compared: one cannot speak but paints detailed pictures; the other speaks fluently but cannot recognize faces or navigate familiar rooms. Which principle best explains the contrast?",
  opts: [
    O("Cerebral lateralization — the two hemispheres have different functional strengths, so the side of the lesion determines the deficit.", true, "Lateralization means left and right hemispheres differ functionally (language usually left-dominant); lesion side predicts the deficit pattern. Framework: localization reasoning."),
    O("Neuroplasticity — the undamaged hemisphere immediately rewires itself, so deficits reflect new functions rather than lost ones.", false, "Plasticity is gradual rewiring with experience; the immediate contrast reflects which hemisphere was damaged."),
    O("Saltatory conduction — impulses travel faster in one hemisphere, so the slower hemisphere's functions fail first after stroke.", false, "Saltatory conduction is an axon-level speed mechanism, not a hemispheric function difference."),
    O("Decussation of the corpus callosum — the fiber tract crosses all functions, so each side controls the opposite side's speech.", false, "The corpus callosum joins the hemispheres; it does not cross or swap their functions.")
  ],
  tp: "Lateralization = hemispheres differ functionally. Corpus callosum = connecting tract. Framework: localization reasoning." });

/* ---------- NGN CASE STUDY (grp) ---------- */
var CASE10 = "CASE10";

BANK.push({ cat: CF, type: "single", grp: CASE10, kt: ["Hydrocephalus"],

/* ============ ENGINE (ES5) ============ */
var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 10: Nervous Tissue and Brain — Situational Practice Test</h1>';
  h += '<div class="sub">Brutal mode | Herlihy, Anatomy &amp; Physiology | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
