<style>

.cb{height:12px;background:#e6e1f7;border-radius:6px;overflow:hidden;margin:3px 0 10px}
.cb div{height:12px;background:#6d28d9}

<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Purposes, Legal Basis, and Confidentiality";
var CB = "Electronic Records and Safeguards";
var CC = "Charting Rules, ISBAR, and Abbreviations";
var CD = "Charting Systems and Formats";
var CE = "Forms, Pathways, and Incident Reports";
var CF = "Home Health and Long-Term Care";
var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = ["chart", "charting", "auditors", "peer review", "diagnosis-related groups (DRGs)", "electronic health record (EHR)", "electronic medical record (EMR)", "personal health record (PHR)", "patient portal", "point-of-care charting", "ISBAR", "ISBARR", "narrative charting", "traditional (block) chart", "problem-oriented medical record (POMR)", "problem list", "SOAPIER", "focus charting", "DARE", "charting by exception (CBE)", "PIE", "Kardex", "incident report", "clinical (critical) pathway", "minimum data set (MDS)", "HIPAA"];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 8,
  "types": {
   "multi": 2,
   "single": 6
  }
 },
 CB: {
  "name": CB,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 2
  }
 },
 CC: {
  "name": CC,
  "count": 8,
  "types": {
   "single": 7,
   "multi": 1
  }
 },
 CD: {
  "name": CD,
  "count": 8,
  "types": {
   "single": 7,
   "multi": 1
  }
 },
 CE: {
  "name": CE,
  "count": 8,
  "types": {
   "single": 7,
   "multi": 1
  }
 },
 CF: {
  "name": CF,
  "count": 4,
  "types": {
   "multi": 1,
   "single": 3
  }
 }
};

BANK.push({ cat: CA, type: "multi", kt: ["chart"],
  stem: "Which of the following are among the five purposes of patient records? Select all that apply.",
  opts: [ O("Documented communication among the care team members", true, "Correct. Documented communication is purpose one."), O("Permanent record kept for accountability of care given", true, "Correct. A permanent record for accountability is purpose two."), O("Teaching using patient examples held in confidence", true, "Correct. Teaching is purpose four, with patient information kept confidential."), O("Research and data collection drawn from the records", true, "Correct. Research and data collection is the fifth purpose."), O("Marketing material used to advertise the facility's services", false, "Advertising is not one of the five purposes of the patient record."), O("Personal journaling space for staff working on the unit", false, "Staff journaling is not a purpose of the patient record.") ],
  tp: "Five purposes: documented communication, permanent record for accountability, legal record, teaching, research and data collection." });

BANK.push({ cat: CA, type: "single", kt: ["chart"],
  stem: "A nurse gives a treatment but writes nothing about it in the record. Which statement is accurate?",
  opts: [ O("A court treats the undocumented care as care not provided", true, "Correct. However excellent the care was, undocumented care is treated as care not provided."), O("A court accepts the nurse's memory as equal to a written entry", false, "Spoken information is easily lost or altered; memory does not carry the care in court."), O("The treatment counts if a coworker saw it and remembers it well", false, "Witness memory does not replace the written or electronic record."), O("The treatment counts once it is mentioned at the next shift report", false, "Shift report is spoken communication; the legal record is the chart entry.") ],
  tp: "If it was not documented, it was not provided - the legal thread of the whole chapter." });

BANK.push({ cat: CA, type: "single", kt: ["charting"],
  stem: "Which set lists exactly what an act of charting adds to the record?",
  opts: [ O("The intervention, the time it was rendered, and a signature with title", true, "Correct. That trio is what makes an entry count."), O("The diagnosis, the prognosis expected, and a signature with title", false, "Diagnosis and prognosis are not the three elements of a charting entry."), O("The intervention, the charge for it, and a signature with title", false, "Billing charges are not part of the trio that defines charting."), O("The order received, the time it was written, and the provider's initials", false, "The entry records the care giver's own signature and title, not the provider's initials.") ],
  tp: "Charting = intervention + time care was rendered + signature and title of the person who gave it." });

BANK.push({ cat: CA, type: "single", kt: ["diagnosis-related groups (DRGs)"],
  stem: "Which statement about diagnosis-related groups (DRGs) is accurate?",
  opts: [ O("They produce a fixed payment set by prospective payment rules", true, "Correct. Medicare and Medicaid prospective payment sets a fixed amount by DRG."), O("They produce a payment that rises with each extra hospital day", false, "DRG payment is fixed by category; it does not rise day by day."), O("They classify nurses by the severity of the patients they carry", false, "Acuity ratings, not DRGs, describe patient severity for staffing."), O("They classify charts by which documentation format a facility uses", false, "DRGs classify patients by age, diagnosis, and procedure, not chart formats.") ],
  tp: "DRGs classify by age, diagnosis, surgical procedure, and other information, in 25 major diagnostic categories." });

BANK.push({ cat: CA, type: "single", kt: ["auditors"],
  stem: "Which statement describes what auditors look for in a chart?",
  opts: [ O("Ordered care charted as given, with responses to it noted", true, "Correct. Missing responses to care-plan items and treatments are what auditors look for."), O("Neat handwriting and correct spelling in every single entry", false, "Legibility matters, but the auditor's check is ordered care given and responses noted."), O("Entries written in narrative form rather than on flow sheets", false, "Auditors do not require one note style over another."), O("Signatures from the provider on every nursing note in the chart", false, "Provider signatures are not the auditor's stated check.") ],
  tp: "Quality assurance audits evaluate services and results against accepted standards." });

BANK.push({ cat: CA, type: "single", kt: ["chart"],
  stem: "Who owns the original patient record, as stated in the chapter?",
  opts: [ O("The physician or the institution that holds the record", true, "Correct. The physician or institution owns the original record."), O("The patient, who may take the original record home at discharge", false, "Patients may request access and copies, but the original stays owned by the physician or institution."), O("The nurse who wrote the largest share of the entries in it", false, "Writing entries does not transfer ownership of the record."), O("The insurance carrier that paid for the patient's hospital stay", false, "Carriers may gain access with permission; they do not own the original.") ],
  tp: "Ownership and access are different: lawyers, courts, and the patient can all gain access through the stated procedures." });

BANK.push({ cat: CA, type: "multi", kt: ["HIPAA"],
  stem: "Which of the following statements about record access and confidentiality are accurate? Select all that apply.",
  opts: [ O("Lawyers can gain access with the patient's written permission", true, "Correct. Lawyers with written permission and courts can gain access."), O("The patient gains access by following the facility's policy", true, "Correct. A written request may be required, and review may happen with staff present."), O("Any staff member may read any record out of professional interest", false, "Personnel may not read a record, or let others read it, without a clinical reason."), O("A unique diagnosis counts as identifying patient information", true, "Correct. Identifiers include a unique diagnosis or past medical history, not just name and age."), O("Students may take identified printouts home to finish assignments", false, "No information leaves the clinical site; printouts with identifiers are shredded before leaving.") ],
  tp: "Confidentiality law named in the chapter: the Patient Care Partnership and HIPAA of 1996." });

BANK.push({ cat: CA, type: "single", kt: ["chart"],
  stem: "Which statement best describes what a legally protective record shows?",
  opts: [ O("Individualized, goal-directed care based on the nursing assessment", true, "Correct. The record must show individualized care and describe exactly what happened to the patient."), O("Identical, standardized entries repeated for every patient on the unit", false, "Repetition without individualization does not limit liability; the record must fit this patient."), O("Brief entries that leave out events the staff found embarrassing", false, "Omitting events weakens the record; it must describe exactly what happened."), O("Entries written mainly to praise the team that provided the care", false, "The record documents care and responses, not team praise.") ],
  tp: "Accurate documentation is one of the best defenses against legal claims over nursing care." });

BANK.push({ cat: CB, type: "single", kt: ["electronic health record (EHR)"],
  stem: "Which statement separates the EHR from the EMR?",
  opts: [ O("The EHR travels between facilities; the EMR stays within one", true, "Correct. Travel is the key difference between the two records."), O("The EHR is kept on paper; the EMR is kept in a computer system", false, "Both are electronic; the difference is how far the data travels."), O("The EHR is entered by patients; the EMR is entered by the care team", false, "Both are entered by the care team; the patient-entered record is the PHR."), O("The EHR holds only medications; the EMR holds the full chart", false, "Both hold the same chart content as paper; neither is limited to medications.") ],
  tp: "EHR = within plus between facilities. EMR = within one facility only." });

BANK.push({ cat: CB, type: "single", kt: ["personal health record (PHR)"],
  stem: "Which statement separates the PHR from the patient portal?",
  opts: [ O("The patient adds data to the PHR but cannot add data to the portal", true, "Correct. Adding information is the PHR's job; the portal is view and message only."), O("The patient adds data to the portal but cannot add data to the PHR", false, "That reverses the two: the portal accepts no patient-entered information."), O("The PHR is run by the facility; the portal is run by the patient", false, "The PHR is patient-maintained; the portal is provided by the facility."), O("The PHR shows no results; the portal shows every provider note", false, "Portals do not show provider anecdotal notes or nurses' notes.") ],
  tp: "Portal results appear only after the provider views and releases them, usually in 24 to 72 hours." });

BANK.push({ cat: CB, type: "multi", kt: ["electronic health record (EHR)"],
  stem: "Which of the following are gains of electronic records named in the chapter? Select all that apply.",
  opts: [ O("Increased efficiency in documenting and finding information", true, "Correct. Efficiency is a stated gain of the EHR."), O("Increased consistency and accuracy across the entries made", true, "Correct. Consistency and accuracy are stated gains."), O("Decreased costs compared with maintaining paper records", true, "Correct. Decreased costs are a stated gain."), O("Legibility that paper handwriting often fails to provide", true, "Correct. Legibility is a stated gain of electronic entry."), O("Freedom from any need to train staff on the system used", false, "Staff need initial and refresher training; even experienced hires must learn a new system.") ],
  tp: "Gains come with duties: software updates, refresher training, and learning the system's nomenclature." });

BANK.push({ cat: CB, type: "single", kt: ["point-of-care charting"],
  stem: "Which statement about point-of-care documentation is accurate?",
  opts: [ O("Bedside entry makes current data available to the whole team", true, "Correct. Bedside charting saves time and makes current information immediately available."), O("Bedside entry delays data until the end-of-shift upload occurs", false, "POC entry is immediate; that immediacy is its stated advantage."), O("Bedside entry may only be done by the nurse who admitted the patient", false, "Access routes vary by facility; POC is not limited to the admitting nurse."), O("Bedside entry removes the need for any free-text narrative note", false, "Entries are often flow-sheet format plus free-text narrative, not flow sheet alone.") ],
  tp: "Some POC systems auto-retrieve device data such as vital signs and file it in all relevant locations at once." });

BANK.push({ cat: CB, type: "single", kt: ["patient portal"],
  stem: "A patient asks why a new laboratory result is not yet visible in the portal. Which explanation is accurate?",
  opts: [ O("Results appear after the provider views and releases them", true, "Correct. Results usually appear about 24 to 72 hours after they are available, once released."), O("Results appear in the portal the moment the laboratory runs them", false, "Release by the provider comes first; the result is not posted instantly."), O("Results never appear; the portal shows appointments only", false, "The portal shows labs, radiology, test results, and medication lists once released."), O("Results appear only if the patient types them in from a printout", false, "Patients cannot add their own information to the portal at all.") ],
  tp: "Teach portal timing up front so a missing result is not read as a missing test." });

BANK.push({ cat: CB, type: "multi", kt: ["HIPAA"],
  stem: "Which of the following are safe computer documentation practices from Box 3.5? Select all that apply.",
  opts: [ O("Log off before walking away from any terminal you used", true, "Correct. Never leave a terminal unattended while logged on."), O("Shred printouts and keep a log of every copy generated", true, "Correct. Printouts are protected, logged and tracked, and shredded per protocol."), O("Share your password with a trusted coworker during a busy shift", false, "Passwords are never shared; anything entered under your password is credited to you."), O("Correct an electronic error by protocol, dated and initialed", true, "Correct. Follow facility policy, add the correct information, and date and initial the entry."), O("Delete a wrong entry and leave the space blank for clarity", false, "Part of the permanent record is never deleted without an in-file explanation.") ],
  tp: "Your password is your signature: every entry under it is credited to you." });

BANK.push({ cat: CB, type: "single", kt: ["HIPAA"],
  stem: "Which statement about faxing medical records is accurate?",
  opts: [ O("HIPAA allows faxing between providers; verify the number first", true, "Correct. Verify the fax number with the recipient; some facilities preprogram frequent numbers."), O("HIPAA forbids faxing records between any two health facilities", false, "Faxing between providers and facilities is allowed under HIPAA with safeguards."), O("Fax numbers may be dialed from memory without any verification step", false, "Verification with the recipient is the stated safeguard against incorrect dialing."), O("Fax use is growing as electronic record systems continue to spread", false, "Fax is being used less as EHR systems spread; safeguards still apply where it is used.") ],
  tp: "Password changes may be required at set intervals, such as every 90 days; some facilities use fingerprint scanners instead." });

BANK.push({ cat: CB, type: "single", kt: ["electronic health record (EHR)"],
  stem: "Which statement about accuracy in an electronic record is accurate?",
  opts: [ O("Pick-list data are only as accurate as the nurse's system knowledge", true, "Correct. Accuracy depends on the nurse's familiarity with the system's nomenclature."), O("Pick-list data are accurate by design, whatever the nurse selects", false, "A wrong pick enters wrong data; the system cannot correct the nurse's choice."), O("Standardized phrases remove the need to learn system terminology", false, "Standardized phrases carry classifications the nurse must learn before relying on them."), O("Experienced nurses hired from other facilities need no system training", false, "Even experienced new hires must learn a new system.") ],
  tp: "Informatics and terminology keep changing, so training is initial plus refresher, not one time." });

BANK.push({ cat: CC, type: "single", kt: ["ISBAR"],
  stem: "Which sequence gives the ISBAR steps in their correct order?",
  opts: [ O("Introduction, Situation, Background, Assessment, Recommendation", true, "Correct. That is the ISBAR order, from who you are to what you are asking for."), O("Introduction, Background, Situation, Recommendation, Assessment", false, "Situation comes before Background, and Assessment comes before Recommendation."), O("Situation, Introduction, Assessment, Background, Recommendation", false, "Introduction comes first; you say who you are before the situation."), O("Introduction, Situation, Assessment, Recommendation, Background", false, "Background comes third, before Assessment, not last.") ],
  tp: "End every ISBAR call with a clear, specific, answerable Recommendation." });

BANK.push({ cat: CC, type: "single", kt: ["ISBARR"],
  stem: "When does ISBAR become ISBARR?",
  opts: [ O("When an order is received and must be read back to the provider", true, "Correct. The extra R is read back, used to confirm the order was heard accurately."), O("When a handoff happens between two nurses on the same unit", false, "A routine handoff uses ISBAR; the read back is added for orders received."), O("When the patient asks the nurse to repeat the discharge teaching", false, "Teaching confirmation is not the read back step of ISBARR."), O("When a second nurse witnesses the note that was charted", false, "Witnessing a note is not part of the ISBAR method at all.") ],
  tp: "After the read back, chart the call, the information given, and the order received." });

BANK.push({ cat: CC, type: "multi", kt: ["charting"],
  stem: "Which of the following are named in the chapter as inappropriate documentation? Select all that apply.",
  opts: [ O("Charting care in advance, before the care is provided", true, "Correct. Charting in advance can lead to malpractice claims."), O("Failing to record verbal orders that were received by phone", true, "Correct. Failing to record verbal orders is listed as inappropriate."), O("Charting the wrong time for an event that occurred on the unit", true, "Correct. Wrong times, and events never charted at all, are listed."), O("Documenting incorrect data about the patient's condition", true, "Correct. Incorrect data in the record is listed as inappropriate."), O("Charting a late entry and labeling it as facility policy directs", false, "A properly labeled late entry follows policy; it is not inappropriate documentation.") ],
  tp: "Chart after care is provided, as soon and as often as necessary; never wait for end of shift on important changes." });

BANK.push({ cat: CC, type: "single", kt: ["charting"],
  stem: "How is an error in a handwritten entry corrected correctly?",
  opts: [ O("Draw one line through it, identify it per policy, record it correctly", true, "Correct. A single line keeps the entry readable and the correction honest."), O("Erase it fully, then write the correct words over the erased area", false, "Erasing makes charting illegible and looks like an attempt to hide information."), O("Cover it with correction fluid, then write the correction on top", false, "Correction fluid is never used on the record; it suggests defacing it."), O("Scratch it out until the original words cannot be read at all", false, "Scratching out destroys legibility and looks like hiding information.") ],
  tp: "On paper: permanent black ink only, since ink cannot be erased and black photocopies most legibly." });

BANK.push({ cat: CC, type: "single", kt: ["charting"],
  stem: "Which entry follows the chapter's rule for objective documentation?",
  opts: [ O("A note describing a white metal ring with a clear stone in it", true, "Correct. Describe items as seen; the chapter's example avoids calling it a diamond ring."), O("A note recording that the patient owns a valuable diamond ring", false, "That assumes what the item is; the rule is to describe what is seen."), O("A note stating the patient probably hid the ring before surgery", false, "Speculation, guessing, and assuming are prohibited in the record."), O("A note quoting what a visitor guessed the ring was worth", false, "A visitor's guess is not an objective description by the nurse.") ],
  tp: "Chart only what you hear, see, feel, or smell, and use direct quotes when appropriate." });

BANK.push({ cat: CC, type: "single", kt: ["charting"],
  stem: "Why are phrases such as 'status unchanged' and 'had good day' unacceptable?",
  opts: [ O("They are too general to carry the patient's actual condition", true, "Correct. Empty phrases are delete-or-overlook traps that document nothing specific."), O("They are too technical for other members of the care team", false, "Their flaw is vagueness, not technical language."), O("They use abbreviations that appear on the list to avoid", false, "These are plain words; the problem is that they say nothing about the patient."), O("They belong in the incident report rather than in the notes", false, "Incident reports cover unusual events; these phrases fail as notes, not as reports.") ],
  tp: "Be specific or do not write it: notes must be clear, concise, complete, and accurate." });

  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
