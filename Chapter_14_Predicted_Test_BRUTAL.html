    ["No — but only because carbonated drinks interfere with his Kuvan tablets, not because the sweetener itself affects his phenylalanine level", false, "Kuvan works by breaking down excess phenylalanine; the drink's problem is that aspartame adds phenylalanine, not a tablet interaction."]
  ], "ANSWER KEY — Correct answer: no — aspartame converts to phenylalanine and must be avoided in PKU, with labels read on every sugar-free product. DETAILED RATIONALE — Kuvan (sapropterin), given by mouth as tablets or powder in juice, helps break down excess phenylalanine but does not cancel dietary sources. Food exchange lists and labeled supermarket foods are the family's practical tools. PRIORITY FRAMEWORK — Safety-first prevention: a hidden ingredient is judged by what the body turns it into, not by the claim on the front of the package.");

M(C5, "A newborn on day 3 is lethargic, feeding poorly, hypotonic, and vomiting, with a noticeable sweet smell to his urine. Which conclusions and actions fit this picture? Select all that apply.", [
    ["Report the cluster promptly, because lethargy, poor feeding, low tone, vomiting, and a unique urine odor are the chapter's report-now signs in a newborn", true, "That exact cluster is the instruction for any newborn when a metabolic disorder is suspected; these disorders turn life-threatening fast once feeding starts."],
    ["Consider maple syrup urine disease, because sweet-smelling urine, sweat, and earwax are its signature clue", true, "The branched-chain amino acids leucine, isoleucine, and valine cannot be broken down in this disease, and the sweet odor is its hallmark."],
    ["Expect treatment aimed at clearing the amino acids and their metabolites, with a lifelong diet low in those amino acids", true, "Hydration and peritoneal dialysis bring serum levels down, and the low-leucine, low-isoleucine, low-valine diet is lifelong, with special formulas."],
    ["Reassure the parents that a sweet urine smell is a normal newborn finding that resolves as feeding establishes", false, "Sweet-smelling urine in the nursery is to be reported promptly; untreated, this disease can kill within about 2 weeks."],
    ["Plan to stop all milk feedings permanently, because milk elimination is the treatment for every metabolic disorder in this family", false, "Milk elimination is the galactosemia treatment; each metabolic disorder has its own dietary target, and swapping them is a wrong-context error."]
  ], "ANSWER KEY — Correct answers: report the cluster promptly, consider maple syrup urine disease from the sweet odor, and expect amino-acid clearance plus a lifelong low branched-chain amino acid diet. DETAILED RATIONALE — This infant also fits the disease course: healthy at birth, then feeding difficulties, loss of the Moro reflex, hypotonia, irregular respirations, and convulsions, with flare-ups often triggered by infection. Galactosemia is the milk-elimination disorder — lethargy, vomiting, diarrhea, failure to thrive, and jaundice once milk starts, treated by removing milk and lactose entirely. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): one signature clue (the odor) names the disorder inside a shared warning cluster.");

BANK.push({ cat: C5, type: "dropdown", stem: "The nurse teaches a family whose newborn has just been diagnosed with PKU. For each statement, choose the correct completion.<br><br>The infant's main food will be<br>[[0]]<br><br>Blood phenylalanine levels will be kept between<br>[[1]]<br><br>When the mother herself has PKU and plans a future pregnancy, her diet must restart<br>[[2]]", blanks: [
  { o: [O("A low-phenylalanine protein substitute such as Lofenalac", true, "Lofenalac is the infant formula on the PKU shelf; Phenex-2 serves adolescents, and partial breastfeeding plus Lofenalac is possible with careful monitoring."), O("A soy-protein formula with all milk products removed", false, "Soy and lactose-free formulas are the galactosemia substitutes; PKU needs a low-phenylalanine substitute, a different shelf."), O("Ordinary formula, with protein foods simply delayed", false, "Phenylalanine is in all protein foods, so ordinary formula feeds the buildup the treatment exists to prevent.")] },
  { o: [O("2 and 10 mg/dL", true, "The safety corridor: below 2 risks growth retardation, above 10 risks brain damage."), O("6 and 20 mg/dL", false, "Six is the maternal-pregnancy concern level and 20 describes untreated buildup scale; neither is the child's target corridor."), O("10 and 14 mg/dL", false, "Those numbers belong to bilirubin care (the home-phototherapy range), not to phenylalanine.")] },
  { o: [O("Before she conceives, because her own high levels can damage the fetal brain", true, "Maternal PKU teaching: the low-phenylalanine diet starts before conception, and her level above 6 mg/dL in pregnancy can affect fetal development."), O("Once her pregnancy test is positive, at the first prenatal visit", false, "Starting after conception repeats the folic-acid timing error — the fetal brain is exposed from the earliest weeks."), O("Only if the fetus is confirmed to have PKU on genetic testing", false, "Her high phenylalanine damages the fetal brain whether or not the fetus has PKU; the diet is not conditional on the baby's diagnosis.")] }
], tp: "ANSWER KEY — Correct answers: Lofenalac as the main food; levels kept at 2–10 mg/dL; a mother with PKU restarts the diet before conceiving. DETAILED RATIONALE — Three direction checks: the right disorder's formula, the two-sided corridor, and the before-conception timing that this chapter uses for both folic acid and maternal PKU. Genetic counseling supports the family for this child and for future planning. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): a teaching plan is built from the disorder's own numbers, not from a neighboring disorder's." });

S(C5, "A breastfed newborn develops lethargy, vomiting, hypotonia, diarrhea, and failure to thrive in her first week, with some jaundice. Testing shows galactose in her blood and urine with reduced enzyme activity in her red cells. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Stop the milk feedings and notify the provider, so lactose is removed while a lactose-free or soy-protein formula is arranged", true, "Elimination is the treatment: no milk and no lactose-containing foods, and breastfeeding stops. Early removal prevents cirrhosis, cataracts, and intellectual impairment — damage that is preventable, not reversible."],
    ["Record her intake, vomiting, stools, and daily weight to track the failure-to-thrive pattern", false, "Correct monitoring of the presenting picture; it continues under the new feeding plan, while removing the offending feed is the move that stops the accumulation."],
    ["Teach the parents which foods and formulas contain lactose so the elimination holds at home", false, "Correct discharge-level teaching for this disorder; it matters once the substitute feeding is running, not before the milk is stopped."],
    ["Arrange review of the confirmatory enzyme and galactose results with the provider and the family", false, "Correct follow-through on the diagnosis; the results are already in hand in this picture, so the review follows the feeding change it justifies."]
  ], "ANSWER KEY — Correct answer: stop the milk feedings first and notify the provider, eliminating lactose while a substitute formula is arranged. All four options are correct nursing actions — stopping the feed leads because every feeding adds more galactose. DETAILED RATIONALE — All three metabolic disorders share the missing-enzyme setup and the invisible-before-birth pattern, but each has its own substance and its own diet: phenylalanine corridor (PKU), branched-chain amino acids (maple syrup urine disease), galactose elimination (galactosemia). PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): in this family of disorders, naming the accumulating substance names the diet.");

S(C5, "The parents of a newborn diagnosed with PKU ask why their baby looked perfectly normal at birth if something was already wrong. All of the following are correct points — which one best answers their question?", [
    ["Metabolic defects can be invisible before birth, because symptoms begin only once the infant starts taking in nourishment", true, "That is the chapter's shared setup for this family of disorders: the missing enzyme matters only when feeding loads the substance it cannot break down."],
    ["The defect developed during delivery, when the stress of birth damaged the liver enzyme that handles this amino acid", false, "PKU is an autosomal recessive inherited defect, present from conception; delivery stress did not create it."],
    ["The baby was protected because the placenta removed the substance, and symptoms would have appeared even without any feeding at all", false, "The second half fails: symptoms track feeding, which is exactly why the screening timing is built around protein ingestion."],
    ["Newborns with this condition always show a musty odor and eczema at birth, so the nursery team should have caught it on day one", false, "The untreated picture — developmental lag at 1–6 months, failure to thrive, eczema, musty odor, seizures in about a third — unfolds over time; at birth the baby appears normal."]
  ], "ANSWER KEY — Correct answer: metabolic defects may be invisible before birth, with symptoms starting once nourishment begins. All four options sound plausible, but only the feeding-trigger explanation matches the chapter. DETAILED RATIONALE — Phenylalanine hydroxylase is the missing liver enzyme; without it phenylalanine cannot become tyrosine and builds toward 20 times normal, with phenylpyruvic acid spilling into the urine in the first weeks. Most affected children are blond and blue-eyed because phenylalanine is needed to make melanin. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): a normal-looking newborn does not clear a metabolic defect — the load test is feeding itself.");

S(C5, "A woman with PKU, now 8 weeks pregnant, says she stopped her diet years ago and feels fine, so she will restart it 'once the baby is bigger.' Her last phenylalanine level was 9 mg/dL. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Teach her that her level already exceeds the pregnancy concern point and arrange urgent dietitian and provider follow-up to restart the diet now", true, "In pregnancy, a maternal level above 6 mg/dL can affect fetal development, and the diet was supposed to restart before conception; at 9 mg/dL and 8 weeks, now is the corrective action."],
    ["Document her current level of 9 mg/dL, her statement that she stopped the diet years ago, and the foods she reports eating in a usual week now", false, "Correct documentation of the exposure history; it is recorded as the follow-up is arranged, because the level is already above the pregnancy concern point and time is the exposure."],
    ["Give her the food exchange list and the label-reading guidance she will use on the restarted diet, and review one day of her usual meals with her", false, "Correct teaching tools for this diet; they support the restart the dietitian will direct, so they follow the urgent referral rather than replacing it."],
    ["Schedule a repeat phenylalanine level for the coming weeks to track her response once the diet is restarted and the dietitian has set her targets", false, "Correct monitoring — frequent level checks are the management pattern — but a future level does not start the correction; the referral and the teaching do."]
  ], "ANSWER KEY — Correct answer: teach that 9 mg/dL already exceeds the 6 mg/dL pregnancy concern level and arrange urgent follow-up to restart the diet now. All four options are correct nursing actions — the urgent teaching and referral lead because every week of delay is fetal exposure. DETAILED RATIONALE — Maternal PKU is the chapter's second before-conception lesson, paired with folic acid: the window opens before pregnancy, and inside pregnancy the exposure is already running. Genetic counseling matters for this family as well. PRIORITY FRAMEWORK — Timed prevention: when a window has been missed, the correct move is immediate correction, not a later appointment with the same advice.");

/* ===== C6 — Down syndrome ===== */
S(C6, "A newborn shows upward-slanting, close-set eyes, a flat nose, a protruding tongue, a single transverse palmar crease, and a wide space between the first and second toes. He is floppy when held. Which interpretation ties the picture together?", [
    ["These are the recognizable features of Down syndrome, most often caused by an extra chromosome 21 from nondisjunction", true, "Trisomy 21 accounts for 95% of cases and produces exactly this feature set, with underdeveloped muscles and loose joints explaining the floppiness."],
    ["These features indicate a metabolic disorder, because several small differences at birth usually mean an enzyme is missing", false, "This is a chromosomal abnormality — too many chromosomes — not an inborn error of metabolism; the classification decides the workup and counseling."],
    ["These features are the expected look of a baby born to a mother over 35, and they fade as the baby grows over the first year", false, "Maternal age over 35 raises the risk; it does not make the features normal or temporary — growth and development run slower on a lasting pattern."],
    ["These features point to a perinatal injury from a difficult delivery, because the flat face and floppiness follow pressure on the head", false, "Nothing in the picture names a birth injury; the crease, toe spacing, tongue, and eye findings are a congenital chromosomal pattern present from development."]
  ], "ANSWER KEY — Correct answer: Down syndrome, most often trisomy 21 from nondisjunction. DETAILED RATIONALE — The other two genetic routes are mosaicism (late nondisjunction, a mix of cells, often less severely affected) and translocation (a piece of chromosome 21 attached to another chromosome). The condition occurs in about 1 in 700 live births and is the most common genetic cause of intellectual disability. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): a feature cluster is matched to its classification — chromosomal, metabolic, structural, blood, or perinatal injury.");

S(C6, "The floppy newborn above needs feeding. He has mucus pooling in his mouth and his tongue protrudes, interfering with his suck. All of the following are correct nursing actions — which one comes FIRST at this feeding?", [
    ["Bulb-suction the mucus before the feeding, because his hypotonia lets mucus accumulate and interfere with breathing and feeding", true, "Hypotonia care names this sequence: mucus accumulates and breathing suffers, so bulb suctioning may be needed before feedings. Airway and feeding readiness lead the round."],
    ["Wrap him warmly for the feeding, because his hypotonia exposes more surface area and heat loss is a real risk for him", false, "Correct thermal care for this baby, done as part of the feeding setup; it does not clear the mucus that is already pooling in his mouth."],
    ["Position and hold him with extra support, because his limp, flaccid muscles make ordinary holding unsafe for him", false, "Correct handling for a hypotonic infant and part of this same feeding; the pooled mucus is addressed before the feed begins."],
    ["Plan dietary measures for constipation, because the same low muscle tone that makes him floppy also slows his bowel", false, "Correct longer-term care for this condition; it belongs to the day's plan, not to the first move at a feeding with mucus in the mouth."]
  ], "ANSWER KEY — Correct answer: bulb-suction the mucus before the feeding first. All four options are correct nursing actions for a hypotonic infant with Down syndrome — suctioning leads because it protects breathing and feeding together. DETAILED RATIONALE — The protruding tongue interferes with sucking and leads to mouth breathing, dry cracked lips, and fissures, which is why feeding support is ongoing care for this baby. PRIORITY FRAMEWORK — ABCs (Airway first): inside a set of correct actions, clear the airway-adjacent problem before the comfort and planning items.");

M(C6, "Which anticipatory guidance belongs in the care plan for a newborn with Down syndrome and his family? Select all that apply.", [
    ["Expect development to progress steadily but more slowly, with milestones such as walking arriving later than typical", true, "The milestone table shows the pattern: walking at 22–24 months versus 12–15 months typical, with every skill shifted later on the same sequence."],
    ["Watch for congenital heart deformities, which are associated with this condition", true, "Heart deformities are a named association, alongside poor resistance to respiratory and ear infections."],
    ["Include the siblings in discussions and inform them about their brother's condition", true, "Young children sense parental distress and imagine worse than reality; open communication early prevents isolation and misconceptions."],
    ["Enroll him in competitive sports as soon as he can walk, to strengthen his loose joints and muscles", false, "The cervical spine is vulnerable to injury in this condition; the provider must be consulted before sports such as the Special Olympics."],
    ["Connect the family with the local Down syndrome support group and the national association", true, "Named resources for this family, offered from the start along with involvement in care and planning."],
    ["Teach that toilet training will follow the typical schedule, because self-help skills are unaffected", false, "Self-help skills are also delayed — bladder control at 36–48 months versus 24 months typical — so guidance must reset that expectation too."]
  ], "ANSWER KEY — Correct answers: slower-but-steady milestones, vigilance for associated heart deformities, including siblings in discussions, and connection to Down syndrome support resources. DETAILED RATIONALE — Health burdens to anticipate include speech and hearing problems, higher incidence of acute leukemia, and Alzheimer disease commonly in middle adult life; antibiotics have increased life span. Parents are involved in care from the start, which builds bonding. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): anticipatory guidance is built from the condition's own association list and its own milestone clock.");

S(C6, "A mother who delivered a baby with Down syndrome yesterday is quiet and tearful and has not yet held him. Which nursing approach is most appropriate?", [
    ["Sit with her, let her verbalize her concerns, and involve her in his care and planning from the start to build bonding", true, "The taught approach: nurses aware of their own feelings first, honest and tactful sharing, listening, and early involvement — small loving touches show the baby is cherished."],
    ["Keep the baby in the nursery until she asks for him, because bringing him to her before she is ready could deepen her sadness", false, "Withholding him works against the chapter's direction; involvement in care from the very start is what builds bonding, offered gently rather than forced."],
    ["Tell her that parents of these babies are usually happy within a day or two, so her feelings should pass quickly on their own", false, "Deep sadness is a named, expected response; predicting its quick end dismisses the grief work the nurse is meant to support."],
    ["Ask the father to do all the holding and feeding for now, because the mother needs complete rest after a difficult diagnosis", false, "Substituting the father removes the mother from the involvement that builds her bond; rest is arranged around participation, not instead of it."]
  ], "ANSWER KEY — Correct answer: listen, let her verbalize, and involve her in care and planning from the start. DETAILED RATIONALE — The counseling section is explicit that the nurse's own feelings come first, and that sharing an initial feeling of helplessness honestly and tactfully can itself help the parents. PRIORITY FRAMEWORK — Maslow (psychosocial needs): grief is met with presence and participation, not with distance or predictions.");

BANK.push({ cat: C6, type: "matrix", stem: "At a family teaching session for a newborn with Down syndrome, the nurse checks four facts the parents have read. Match each fact to the correct value or pattern.", cols: ["1 in 700 live births", "Low AFP, high hCG, low estriol, high inhibin-A", "22–24 months", "Mosaicism"], rows: [

  { t: "The age by which a child with this condition typically walks", a: 2, r: "Walking at 22–24 months versus 12–15 months typical — the milestone table's clearest illustration of the slower clock." },

S(C6, "Parents ask whether their daughter with Down syndrome will learn to feed and dress herself. Her chart notes she is now 12 months old and finger-feeding. Which answer is most accurate?", [
    ["Yes — independence comes on a slower clock: finger-feeding at about 12 months fits her pattern, with spoon use around 20 months and simple dressing at 4–5 years", true, "The self-help table gives her trajectory: finger-feeds 12 months, spoon and cup 20 months, fork 30 months, dresses self 48–60 months, brushes teeth 60 months."],
    ["Yes — self-help skills are the one area that follows the typical schedule, so she should use a spoon and cup within the next month", false, "Self-help is delayed on the same pattern as motor milestones; typical spoon and cup age is 13 months, hers is about 20 months."],
    ["No — children with this condition do not reach independent self-feeding, so the family should plan to feed her long-term", false, "The tables show steady progress to independence in every listed skill; the difference is timing, not attainment."],
    ["Only if her hypotonia resolves by age 2, because muscle tone is the single factor that decides whether self-help skills develop", false, "Hypotonia shapes handling and care, but the developmental tables describe expected progress with support, not a tone deadline that cancels it."]
  ], "ANSWER KEY — Correct answer: yes, on a slower clock — her 12-month finger-feeding matches the Down syndrome self-help pattern exactly. DETAILED RATIONALE — Steady progress on a delayed schedule is the honest hope this chapter teaches nurses to give: real milestones, real independence, later dates. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): judge a child's progress against her own condition's timetable, not against the typical chart alone.");

S(C6, "A prenatal patient at 16 weeks has quad-test results showing low alpha-fetoprotein, high hCG, low unconjugated estriol, and high inhibin-A. She asks what happens next. Which answer is correct?", [
    ["This pattern flags increased risk for Down syndrome, and amniocentesis can confirm the diagnosis; screening itself does not make the diagnosis", true, "The four values in exactly this arrangement are the Down pattern; a positive screen is followed by amniocentesis for confirmation."],
    ["This pattern confirms Down syndrome, so the next step is counseling about the diagnosis rather than any further testing", false, "Screening flags risk; it does not confirm. Skipping confirmation mislabels a screening tool as a diagnostic one."],
    ["This pattern flags an open neural tube defect, because alpha-fetoprotein is the marker measured for that condition in pregnancy", false, "Raised AFP points toward an open neural tube defect; here the AFP is low, inside a four-marker chromosomal pattern — the direction decides."],
    ["This pattern is reassuring, because low alpha-fetoprotein rules out the chromosomal conditions the test was ordered to screen for", false, "Low AFP is one quarter of the risk pattern, not a reassurance; read together, the four markers raise the flag."]
  ], "ANSWER KEY — Correct answer: the pattern flags increased Down syndrome risk, and amniocentesis can confirm. DETAILED RATIONALE — First-trimester screening uses nuchal translucency and the nasal bone; the second-trimester quad adds the four blood markers. AFP direction is a double-duty fact in this chapter: raised in amniotic fluid with an open neural tube defect, low in the Down screening pattern. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): a marker's meaning lives in its direction and its company, never in the marker alone.");


/* ===== C7 standalones — Rh/ABO, Coombs, hydrops ===== */
M(C7, "A prenatal nurse reviews the history of an Rh-negative patient in her third pregnancy. Which history items are sensitizing events or warning clues for hemolytic disease? Select all that apply.", [
    ["A previous ectopic pregnancy", true, "Ectopic pregnancy is one of the sensitizing events the history asks about, because fetal blood can reach the mother's circulation."],
    ["A previous abortion", true, "Abortion, spontaneous or therapeutic, is a listed sensitizing event and also a RhoGAM occasion."],
    ["A previous blood transfusion", true, "Transfusions are in the sensitizing-event history, since they can expose her to the Rh antigen."],
    ["An older child who had pathological jaundice as a newborn", true, "Other children with pathological jaundice or anemia as newborns are the family-history clue that disease has already occurred."],
    ["An older child who had physiological jaundice on day 3 that faded in a week", false, "Jaundice appearing after the first day and climbing gradually is the physiological pattern; it is the pathological picture that warns."],
    ["A first pregnancy with an Rh-positive baby and RhoGAM given on time", false, "RhoGAM given within its windows is prevention working as intended, not a sensitizing event; the risk story is exposure without prevention."]
  ], "ANSWER KEY — Correct answers: previous ectopic pregnancy, previous abortion, previous blood transfusion, and an older child with pathological newborn jaundice. DETAILED RATIONALE — Sensitization is cumulative: without RhoGAM, accumulated antibodies raise the risk with every pregnancy, because antibodies formed in one exposure cross the placenta in a later one. ABO incompatibility — most often a type O mother with a type A or B infant — is now more common than Rh disease but generally less severe, with the same treatment and nursing care. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): in this disease, the history is the first laboratory test.");

S(C7, "At a delivery, cord blood is drawn from an Rh-positive newborn of an Rh-negative mother, and the direct Coombs test is positive. A student asks what the result actually shows. Which answer is correct?", [
    ["The infant's red blood cells are already coated with the damaging antibodies, which is why the test is run on the baby's blood", true, "Direct means the baby's blood and coated cells; the cord sample at delivery detects the antibodies doing the damage."],
    ["The mother's blood contains circulating Rh antibodies, which is what a positive result on cord blood always demonstrates", false, "Circulating maternal antibodies are the indirect Coombs, run on the mother's blood — the pair is told apart by whose blood is tested."],
    ["The baby has formed his own antibodies against his mother's blood, and those are the antibodies coating the cells in the sample", false, "The damaging antibodies are maternal in origin; the newborn is the target of them, not their maker."],
    ["The result shows the baby's blood type is incompatible with the donor blood bank supply, so exchange transfusion cannot be done", false, "The test says nothing about donor supply; exchange transfusion with Rh-negative blood is a standard treatment step in this disease."]
  ], "ANSWER KEY — Correct answer: the direct Coombs on the infant's blood shows red cells already coated with damaging antibodies. DETAILED RATIONALE — The memory anchor holds both halves: direct = baby's blood, cells coated; indirect = mother's blood, antibodies circulating. The disease name itself, erythroblastosis fetalis, comes from the immature nucleated red cells flooding the circulation as the marrow compensates. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): for a paired test, whose sample it is decides what a positive result means.");

S(C7, "A fetus with severe hemolytic disease is delivered with generalized edema, an enlarged liver and spleen, and signs of heart failure. Which interpretation should guide his immediate care?", [
    ["This is hydrops fetalis, the severe end of hemolysis, where fetal hypoxia, anasarca, and heart failure follow the massive red cell destruction", true, "Progressive severe hemolysis produces exactly this picture; oxygen-carrying power falls and blood volume shrinks, so shock or heart failure can follow."],
    ["This is the expected appearance of a baby whose mother was sensitized, and it settles as the antibodies clear over the first week", false, "Edema with heart failure is the rare, severe presentation that early detection exists to prevent; it is an immediate-care picture, not a settling one."],
    ["This edema pattern shows the baby was overfed by a diabetic placenta, because generalized swelling is the hallmark of the macrosomic infant", false, "The macrosomic infant is oversized and puffy-faced from fat, not edematous with liver and spleen enlargement from hemolysis; the histories differ completely."],
    ["This picture means the exchange transfusion was given too late in a previous pregnancy and has now affected this baby as well", false, "Hydrops develops in the current fetus from his own hemolysis; it is not a carried-over effect of a sibling's treatment."]
  ], "ANSWER KEY — Correct answer: hydrops fetalis, the severe hemolysis picture of hypoxia, generalized edema, and heart failure. DETAILED RATIONALE — The immediate-exchange candidate in this chapter is exactly this infant: cardiac failure and edema from hemolytic disease get fresh whole blood right away. The condition is rare today because Rh disease is detected early, which is why the detection steps matter. PRIORITY FRAMEWORK — ABCs / safety-first prioritization: name the severity first, because severity sets the speed of everything that follows.");

BANK.push({ cat: C7, type: "order", stem: "Place the events of Rh sensitization and hemolytic disease in the order they occur across two pregnancies.", items: [
  { t: "An Rh-negative mother carries an Rh-positive fetus, and fetal blood leaks into her circulation", r: "Small leaks occur during pregnancy and a larger exposure comes at delivery." },
  { t: "The mother's immune system reads the Rh antigen as foreign and forms anti-Rh antibodies", r: "She is now sensitized — the exposure loads the immune system for the next pregnancy." },
  { t: "In a later pregnancy, the antibodies cross the placenta into the fetal circulation", r: "The antibodies formed earlier are small enough to cross and reach the next fetus." },
  { t: "The antibodies destroy fetal red blood cells, producing anemia and rapidly rising bilirubin", r: "Hemolysis is the final event — anemia, and possibly heart failure, with jaundice after birth." }
], tp: "ANSWER KEY — Correct order: fetal blood leaks to the Rh-negative mother → she forms anti-Rh antibodies → antibodies cross the placenta in a later pregnancy → fetal red cells are destroyed, causing anemia and rising bilirubin. DETAILED RATIONALE — The sequence is why one sensitizing pregnancy loads the gun for the next, and why RhoGAM is prevention aimed at the second step: stop antibody formation before it starts. Diagnosis follows the fetus with maternal titers and Doppler measurement of peak systolic velocity in the fetal middle cerebral artery. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): a two-pregnancy disease can only be interrupted if its order is understood." });

S(C7, "An Rh-negative mother received no RhoGAM after her last delivery. She is now pregnant again and asks why this pregnancy is watched so much more closely than her first. All of the following are correct points — which one is the central reason?", [
    ["Antibodies she may have formed after the last delivery can cross this placenta and destroy this baby's red blood cells, and the risk grows with each sensitized pregnancy", true, "That is the disease engine: accumulated antibodies raise the risk with every pregnancy, so this fetus is followed with titers and Doppler studies for anemia."],
    ["Her blood type may have changed after the last delivery, so the team must recheck whether she is still Rh-negative this time", false, "Blood type does not change with delivery; what changes is her antibody status, which is exactly what the monitoring tracks."],
    ["The RhoGAM she missed would have treated this baby in advance, so its absence means treatment must now start at the first prenatal visit", false, "RhoGAM is prevention for the mother, not advance treatment for a future baby; missing it raises risk, it does not create a treatment debt."],
    ["Second babies are always larger, so the concern is that this baby will outgrow the placenta and develop the glucose problems of a diabetic infant", false, "Size and glucose belong to the macrosomia story; the watch here is hemolysis — anemia, hydrops risk, and bilirubin — from her antibody status."]
  ], "ANSWER KEY — Correct answer: antibodies formed after the last delivery can cross this placenta and hemolyze this baby's red cells, with risk rising each sensitized pregnancy. All four options sound clinical, but only the antibody mechanism explains the intensified surveillance. DETAILED RATIONALE — Management follows the findings: induction of labor or intrauterine transfusion until the lungs mature, and after birth, hemoglobin and bilirubin levels decide on exchange transfusion; IVIG given at birth slows red cell destruction and reduces the need for exchange. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): surveillance intensity follows the mechanism that is actually running.");

/* ===== C8 standalones — IDM, ICH, TTN/MAS, NAS, home phototherapy ===== */
S(C8, "A 4,300 g newborn of a diabetic mother is jittery and tremulous at 3 hours of age, with a weak cry. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Check his blood glucose now, because jitteriness and tremors in this infant are hypoglycemia signs until the value proves otherwise", true, "His size already names him: over 4,082 g is macrosomia, and the infant of a diabetic mother crashes when the maternal glucose supply is cut but his insulin output stays high. Below 45 mg/dL confirms the danger."],
    ["Feed him early, because early feeding is both nutrition and a defense against the glucose fall these infants have after birth", false, "Correct and planned — early feeding is part of his care — but the value comes first, because it decides how urgently feeding and treatment must move."],
    ["Monitor his vital signs closely, because respiratory distress is on the complication list for infants of diabetic mothers", false, "Correct surveillance for this population; it runs alongside the glucose check, which answers the symptom he is showing right now."],
    ["Report his irritability and tremors to the provider as possible signs of a glucose problem needing orders", false, "Correct escalation, and it is stronger with the number in hand; the chapter's care pairs prompt reporting with frequent glucose checks through the first 2 days."]
  ], "ANSWER KEY — Correct answer: check his blood glucose first. All four options are correct nursing actions for an infant of a diabetic mother — the symptom he is displaying belongs to hypoglycemia, so its measurement leads. DETAILED RATIONALE — Maternal hyperglycemia drives fetal hyperinsulinism and excess growth; delivery cuts the glucose while the hypertrophied islets keep pumping insulin. Untreated hypoglycemia can cause rapid, permanent brain damage, and hypocalcemia and hyperbilirubinemia also occur in these infants. PRIORITY FRAMEWORK — Safety-first prioritization: measure the dangerous value the symptom is pointing at, then feed, monitor, and report around it.");

S(C8, "A preterm newborn who had a prolonged labor is lethargic, with poor muscle tone, a poor suck, a tense-feeling fontanel, and unequal pupils. He has had one episode of twitching. Which plan fits this picture?", [
    ["Treat this as intracranial hemorrhage care: incubator with oxygen and continuous observation, gentle minimal handling, head elevated, and phenobarbital available for the twitching", true, "The sign cluster is the hemorrhage picture — tone, suck, tense fontanel, unequal pupils, twitching — and its care is gentle, minimal, head-elevated, observed, with phenobarbital for twitching or convulsions and vitamin K to help control bleeding."],
    ["Treat this as a feeding problem first: feed him carefully and frequently, because poor suck and lethargy in a newborn are most often hunger", false, "Careful feeding is part of hemorrhage care because these infants vomit easily, but the tense fontanel and unequal pupils move this out of the feeding-problem category entirely."],
    ["Treat this as early sepsis and expect the twitching to stop once antibiotics alone have had a full day to work in his system", false, "Antibiotics may be given prophylactically in hemorrhage care, but they are not its center; the history of trauma or oxygen deprivation plus the pressure signs name the hemorrhage."],
    ["Treat this as bilirubin toxicity and start phototherapy, because lethargy, poor feeding, and twitching are the kernicterus sign list", false, "The kernicterus list shares lethargy and poor feeding, but it is driven by bilirubin approaching 20 mg/dL — this baby's story is birth trauma in a preterm infant with a tense fontanel and unequal pupils."]
  ], "ANSWER KEY — Correct answer: intracranial hemorrhage care — incubator, oxygen, continuous observation, gentle minimal handling, head elevated, phenobarbital for twitching. DETAILED RATIONALE — This is the most common type of birth injury, caused by trauma or anoxia and most frequent in preterm infants with fragile vessels. If a convulsion occurs, the nurse documents which body parts were involved, the side, severity, duration, and the baby's condition before and after. Mild symptoms carry a good chance of full recovery; massive hemorrhage can be fatal. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): overlapping sign lists are separated by the history and the two findings only one list owns — tense fontanel and unequal pupils.");

S(C8, "Two term newborns are tachypneic. Baby A, born by cesarean, has mild retractions and grunting that the team expects to clear in about 3 days. Baby B, born after fetal distress with meconium-stained fluid, has rales, rhonchi, and worsening distress. Which analysis is correct?", [
    ["Baby A fits transient tachypnea from slowly absorbed lung fluid, while Baby B fits meconium aspiration, which can require ventilation and NICU transfer", true, "The two trajectories must not be swapped: wet lung resolves suddenly after about 3 days on supportive care, while aspirated meconium drives distress that can linger for weeks and escalate."],
    ["Both babies have the same wet-lung condition, because tachypnea after birth always means lung fluid that has not yet been absorbed", false, "Meconium in the lungs is a different mechanism — stained fluid drawn in by gasping after distress — with a different course and ceiling of care."],
    ["Baby B's course will be the shorter one, because meconium is suctioned away at birth and the lungs are then clear within a day", false, "Suctioning helps, and deep endotracheal suctioning may be needed, but tachypnea after aspiration can linger for several weeks; the short course belongs to Baby A."],
    ["Baby A needs the NICU transfer, because cesarean-born babies with retractions always deteriorate before they improve on the ward", false, "Transient tachypnea after cesarean or rapid vaginal delivery is characteristically self-limited with warmth, energy conservation, and supplemental oxygen."]
  ], "ANSWER KEY — Correct answer: Baby A is transient tachypnea resolving in about 3 days; Baby B is meconium aspiration that may need ventilation and the NICU. DETAILED RATIONALE — Prevention in aspiration starts with surveillance: prompt recognition of fetal distress, with decelerations or loss of variability, and rapid delivery. Both babies get supportive care — warmth, oxygen, energy conservation — but only one has the benign clock. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): same presenting sign, two mechanisms, two clocks — the history tells them apart.");

S(C8, "A newborn whose mother used opiates through pregnancy is tremulous, hyperirritable, wakeful, sneezing, and yawning, with poor feeding and diarrhea on day 1. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Place him in a quiet environment, swaddled, with external stimuli reduced, as his withdrawal care begins", true, "The environment is the first treatment variable for a hyperirritable baby in withdrawal: quiet, swaddling, and reduced stimuli, with seizure observation running throughout."],
    ["Observe him closely for seizures and document the tremors, wakefulness, sneezing, and feeding pattern", false, "Correct surveillance and documentation for withdrawal; it proceeds continuously, while settling his environment is the opening move that can lower the irritability driving the signs."],
    ["Support his mother in his care, including breastfeeding guidance consistent with her methadone treatment", false, "Correct family care — breastfeeding is supported for a mother treated with methadone — and it is arranged as his withdrawal care is established, not before he is settled."],
    ["Offer small, supported feeding attempts and record his intake, stools, and diarrhea losses carefully", false, "Correct nutrition monitoring for a poor feeder with diarrhea; feeding attempts go better once the low-stimulation setup is in place around him."]
  ], "ANSWER KEY — Correct answer: place him in a quiet, swaddled, low-stimulation environment first. All four options are correct nursing actions for neonatal abstinence care — settling the environment leads because stimulation is what his over-firing nervous system cannot handle. DETAILED RATIONALE — Opiates, amphetamines, tranquilizers, and multiple illicit drugs all cross the placenta and produce dependence; after birth the supply stops and withdrawal begins, with possible long-term developmental and neurological effects. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): the environment itself is a treatment variable — turn it down for the baby whose nervous system is over-firing.");

BANK.push({ cat: C8, type: "matrix", stem: "A family is choosing between hospital and home phototherapy and asking about other bilirubin treatments. Match each statement to the correct fact.", cols: ["Home phototherapy fits this picture", "Metalloporphyrins (SnMP)", "Hospital phototherapy care", "Exchange transfusion fact"], rows: [

  { t: "After the second exchange, about 85% of the infant's original blood has been replaced", a: 3, r: "The exchange endpoint figure, reached with 10–20 mL aliquots totaling about twice the blood volume, capped at 500 mL." }

  "count": 7,
  "types": {
   "single": 5,
   "multi": 1,
   "matrix": 1
  }
 }
};

/* ============ ENGINE (ES5) ============ */
var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { shuffle(q.opts); S.resp.push(-1); }
    else if (q.type === "multi") { shuffle(q.opts); S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { shuffle(q.blanks[k].o); d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>OB Chapter 14: The Newborn With a Perinatal Injury or Congenital Malformation — Predicted Test</h1>';
  h += '<div class="sub">Brutal mode | Leifer, Introduction to Maternity and Pediatric Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order<br><span class="small">Answer choices always shuffle, even dropdowns. Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
