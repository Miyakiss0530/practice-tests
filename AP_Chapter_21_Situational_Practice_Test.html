<script>
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CATS = ["Lines and Types of Immunity", "First and Second Lines of Defense", "Cells Involved in Immunity", "Antigens, Antibodies, and Immune Responses", "Acquired Immunity, Vaccines, and Antibody Products", "When Immunity Goes Wrong and Transplants"];
var KEYTERMS = ["Abscess", "Acquired immunity", "Anaphylaxis", "Antibody titer", "Antitoxins", "Antivenoms", "Attenuated pathogen", "Booster shot", "Cell-mediated immunity (CMI)", "Contact dermatitis", "Eosinophils", "Epinephrine (adrenalin)", "Febrile seizures", "Fever (pyrexia)", "Graft-versus-host disease (GVHD)", "Granulocytopenia", "Helper T cells (CD4+ T cells)", "Herd immunity", "IgA", "Immune globulin", "Immune memory", "Infection", "Inflammation", "Pyrogens", "Secondary response", "Severe combined immunodeficiency (SCID)", "Toxoid", "Vaccine"];
var BLUEPRINT = {"Lines and Types of Immunity": {"name": "Lines and Types of Immunity", "count": 0, "types": {}}, "First and Second Lines of Defense": {"name": "First and Second Lines of Defense", "count": 7, "types": {"single": 6, "multi": 1}}, "Cells Involved in Immunity": {"name": "Cells Involved in Immunity", "count": 4, "types": {"single": 3, "multi": 1}}, "Antigens, Antibodies, and Immune Responses": {"name": "Antigens, Antibodies, and Immune Responses", "count": 4, "types": {"single": 3, "order": 1}}, "Acquired Immunity, Vaccines, and Antibody Products": {"name": "Acquired Immunity, Vaccines, and Antibody Products", "count": 7, "types": {"single": 6, "dropdown": 1}}, "When Immunity Goes Wrong and Transplants": {"name": "When Immunity Goes Wrong and Transplants", "count": 16, "types": {"single": 12, "multi": 3, "matrix": 1}}};
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "A roofer steps on a rusty nail that punctures his boot and foot. The wound is cleansed in the emergency department. Which statement by the nurse correctly predicts what happens next in his defense system?", "tp": "Breach of line one hands the fight to line two: phagocytosis, inflammation, fever, protective proteins, NK cells. [Framework: Nursing Process/ADPIE]", "opts": [{"t": "Because the skin barrier is breached, second-line processes \u2014 phagocytosis, inflammation, and fever if needed \u2014 will now engage the invaders.", "c": true, "r": "Destruction of mechanical barriers is an invitation to invasion; once line one is penetrated, the pathogen encounters the second line."}, {"t": "Because the skin barrier is breached, his lymphocytes will immediately produce a specific antibody response tailored to this one injury.", "c": false, "r": "The specific third line is not the immediate next step for a fresh breach, and antibody production takes the slow primary response."}, {"t": "Because the skin barrier is intact elsewhere, no further defense is needed once the wound surface is cleansed.", "c": false, "r": "A puncture is a destroyed barrier at that site; cleansing helps, but the second line is exactly what handles what entered."}, {"t": "Because the nail was removed quickly, the first line of defense will reseal itself before any microorganism can enter.", "c": false, "r": "The barrier was already penetrated when the nail went in; entry occurred at the moment of puncture."}]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "Two patients report redness, heat, swelling, and pain. Patient 1 fell against a hot exhaust pipe yesterday. Patient 2 has a thorn puncture from 3 days ago and now has a tender, walled-off collection draining thick yellow material. Which conclusion is correct?", "tp": "Same four signs, different irritants: inflammation is the response, infection is inflammation caused by a pathogen. [Framework: Nursing Process/ADPIE]", "kt": ["Inflammation", "Infection", "Abscess"], "opts": [{"t": "Both have inflammation, but only Patient 2's is an infection, because the irritant is a pathogen and pus with a walled-off abscess has formed.", "c": true, "r": "Inflammation is the response to any irritant (here, heat versus a pathogen); inflammation caused by a pathogen is an infection, and pus walled off is an abscess."}, {"t": "Both have infections, because redness, heat, swelling, and pain only occur when a pathogen is present in tissue.", "c": false, "r": "The four classic signs occur with non-pathogen irritants too \u2014 friction, heat, radiation, chemicals \u2014 so the signs alone do not prove infection."}, {"t": "Only Patient 1 has inflammation, because Patient 2's walled-off collection means the inflammatory response has already ended.", "c": false, "r": "The abscess is a product of ongoing inflammation and phagocyte warfare; walling off does not mean inflammation ended."}, {"t": "Neither has inflammation, because inflammation requires a fever, and neither patient has a documented temperature.", "c": false, "r": "Fever is a separate second-line process; local inflammation is defined by the tissue response and its four classic signs."}]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "A 4-year-old with an ear infection has a temperature of 102.8\u00b0F (39.3\u00b0C). She is shivering, her skin feels cool and clammy, and she says she is cold. Her mother asks why the child feels cold when her temperature is high. Which response by the nurse is correct?", "tp": "Rising set point = shiver, constrict, feel cold. Falling set point = dilate, sweat. Read the phase before you act. [Framework: Nursing Process/ADPIE]", "kt": ["Fever (pyrexia)", "Pyrogens"], "opts": [{"t": "Her thermostat has been reset higher, so her body is generating heat by shivering and saving heat by constricting skin vessels until she reaches the new set point.", "c": true, "r": "During the upward reset, shivering generates heat and skin vessels constrict to conserve it, so the child feels cold and clammy while the temperature climbs."}, {"t": "Her temperature reading must be wrong, because a child with a true fever would feel hot and flushed at this point in the illness.", "c": false, "r": "Cool, clammy skin with shivering is the expected picture during the reset-up phase, before the fever holds at the new set point."}, {"t": "Her body is losing the fever battle, so the nurse should pack her in ice to help her reach a normal temperature faster.", "c": false, "r": "Aggressive external cooling fights the body's regulated rise and is not the response the physiology calls for; monitoring and comfort are."}, {"t": "Her shivering means the fever is breaking, so the nurse should expect sweating and flushing within a few minutes.", "c": false, "r": "Sweating and skin vessel dilation mark the reset back down; shivering marks the reset upward, the opposite phase."}]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "A 3-year-old is brought in with a temperature of 105.4\u00b0F (40.8\u00b0C). The parent says, \"I read that fever helps fight infection, so I did not treat it.\" Which action is the nurse's priority?", "tp": "Fever helps \u2014 until it is very high. In a small child, very high means act: brain damage and febrile seizures are the stakes. [Framework: Safety First]", "kt": ["Febrile seizures"], "opts": [{"t": "Treat the fever now and notify the provider, because a temperature this high risks severe, irreversible brain damage and febrile seizures in a young child.", "c": true, "r": "The guide's caution is explicit: a very high fever must be reduced because of brain-damage risk, and high fever in children is frequently accompanied by febrile seizures."}, {"t": "Reassure the parent and continue to withhold treatment, because fever stimulates phagocytosis and slows pathogens at any temperature.", "c": false, "r": "Fever's benefits have a ceiling; at 105.4\u00b0F in a 3-year-old the documented dangers override the benefit argument."}, {"t": "Give the child a cool bath and recheck in 4 hours, because the main risk of high fever is dehydration from sweating.", "c": false, "r": "The priority risks named in the guide are brain damage and febrile seizures, and a 4-hour recheck leaves both unaddressed."}, {"t": "Ask the parent to keep a fever diary for 24 hours so the provider can see the pattern before deciding on treatment.", "c": false, "r": "Pattern-watching delays action on a temperature already in the range the guide says must be reduced."}]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "An adult with influenza has a temperature of 101.6\u00b0F (38.7\u00b0C) and asks the provider for 'something to bring the fever down fast.' The provider asks the nurse's view before ordering. Which statement reflects the guide's evidence?", "tp": "Moderate fever is a tool, not just a symptom: it feeds phagocytosis and starves pathogens. Very high fever is the exception. [Framework: Nursing Process/ADPIE]", "opts": [{"t": "Suppressing this moderate fever may prolong the infection, because fever stimulates phagocytosis and decreases the ability of certain pathogens to multiply.", "c": true, "r": "The guide states that evidence suggests reducing fever prolongs infection, and it lists fever's two benefits \u2014 more phagocytosis and slower pathogen multiplication."}, {"t": "Suppressing this moderate fever will shorten the infection, because a lower temperature lets phagocytes reach the tissues faster.", "c": false, "r": "The guide links fever reduction with prolonging infection, not shortening it, and fever itself stimulates phagocytosis."}, {"t": "The fever should be suppressed mainly to protect the brain, because any temperature above 101\u00b0F risks irreversible damage.", "c": false, "r": "The brain-damage caution applies to very high fever; 101.6\u00b0F is a moderate fever with documented benefits."}, {"t": "The fever is a sign the second line has failed, so suppressing it will let the third line take over the defense.", "c": false, "r": "Fever is itself a working second-line process, not evidence that the second line failed."}]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "A patient has a large, tense, walled-off collection at an old puncture site. The area is hot and painful, and the collection is not draining. Which plan should the nurse anticipate?", "tp": "The wall protects the body; a large abscess gets lanced and drained, never massaged open. [Framework: Safety First]", "kt": ["Abscess"], "opts": [{"t": "A surgical procedure to lance and drain the abscess, because a large abscess may require drainage rather than continued observation.", "c": true, "r": "The guide states directly that a large abscess may require a procedure in which it is lanced and drained."}, {"t": "Firm massage of the area several times a day to break up the wall so the contents spread into surrounding tissue.", "c": false, "r": "The wall is beneficial precisely because it restricts spread; breaking it up defeats the containment the body built."}, {"t": "Reassurance with no follow-up, because a walled-off collection always resolves on its own once it forms.", "c": false, "r": "Small collections may resolve, but the guide singles out the large abscess as the one that may need lancing and draining."}, {"t": "Application of a tight pressure dressing to force the collection back into the circulation for filtering by the spleen.", "c": false, "r": "Forcing infected debris into the circulation spreads the infection \u2014 the opposite of the abscess's protective purpose."}]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "multi", "stem": "A nurse assesses a patient 24 hours after a contaminated laceration. Which findings belong to the second line of defense now at work? Select all that apply.", "tp": "Second line roll call: phagocytosis, inflammation, fever, interferons/complement, NK cells. Skin is first; antibodies are third. [Framework: Nursing Process/ADPIE]", "opts": [{"t": "Neutrophils and macrophages are engulfing pathogens at the site, and dead cells are accumulating as pus.", "c": true, "r": "Phagocytosis is a second-line process, and pus is its debris: dead phagocytes, injured cells, pathogens, and secretions."}, {"t": "The injured vessels have dilated, bringing more blood to the area and producing redness and heat.", "c": true, "r": "Inflammation \u2014 vasodilation and hyperemia \u2014 is a second-line process."}, {"t": "Pyrogens have reset the hypothalamic thermostat, and the patient's temperature is elevated.", "c": true, "r": "Fever is a second-line process driven by phagocyte-released pyrogens."}, {"t": "Intact skin around the wound is preventing any further microorganisms from entering.", "c": false, "r": "Intact skin is a first-line mechanical barrier, not a second-line process."}, {"t": "Plasma cells are secreting antibodies matched to this specific pathogen.", "c": false, "r": "Antibody secretion by plasma cells is third-line specific immunity, not second line."}, {"t": "Complement proteins are attaching to bacterial membranes and punching holes in them.", "c": true, "r": "Complement is a second-line protective protein system that bursts bacteria and enhances phagocytosis."}]});
BANK.push({"cat": "Cells Involved in Immunity", "type": "single", "stem": "A patient receiving cancer chemotherapy has a markedly reduced granulocyte count. Over two weeks she develops one infection after another. Which explanation and priority are correct?", "tp": "Chemotherapy \u2192 granulocytopenia \u2192 secondary immunodeficiency \u2192 infection is the enemy. Watch for it relentlessly. [Framework: Safety First]", "kt": ["Granulocytopenia"], "opts": [{"t": "Her granulocytopenia is a drug-induced immune deficiency: with too few granulocytes, infections overwhelm her, so infection surveillance and protection take priority.", "c": true, "r": "The guide names granulocytopenia from cancer chemotherapy as the classic drug-induced (secondary) immunodeficiency, and overwhelming infection as the biggest problem."}, {"t": "Her infections mean the chemotherapy is destroying her memory cells, so she has lost immunity she built up over her lifetime.", "c": false, "r": "The named mechanism is granulocytopenia \u2014 too few granulocyte phagocytes \u2014 a numbers problem in the second line, not loss of memory cells."}, {"t": "Her infections are expected and self-limiting, so routine care without added infection precautions is appropriate.", "c": false, "r": "In a patient who cannot mount a defense, repeated infections are the danger the guide warns about, not a routine expectation."}, {"t": "Her granulocyte count will protect her once it recovers antibodies, because granulocytes secrete immunoglobulins.", "c": false, "r": "Granulocytes do not secrete antibodies; plasma cells derived from B cells do."}]});
BANK.push({"cat": "Cells Involved in Immunity", "type": "single", "stem": "A patient's laboratory report shows a notably elevated eosinophil count. The patient has no bacterial infection findings. Which interpretation is most consistent with the guide?", "tp": "One cell, one job in Table 21.1: eosinophils = parasites. Read the differential against the table. [Framework: Nursing Process/ADPIE]", "kt": ["Eosinophils"], "opts": [{"t": "Eosinophils destroy parasites, so an elevated count points the assessment toward a parasitic cause rather than a bacterial one.", "c": true, "r": "Table 21.1 gives eosinophils a single listed job: destroy parasites."}, {"t": "Eosinophils secrete histamine and heparin, so an elevated count points the assessment toward a clotting disorder.", "c": false, "r": "Histamine, leukotrienes, and heparin are secreted by basophils, not eosinophils."}, {"t": "Eosinophils secrete antibodies, so an elevated count shows the patient is mounting a strong antibody response.", "c": false, "r": "Antibodies are secreted by plasma cells; eosinophils are granular leukocytes with a parasite target."}, {"t": "Eosinophils present antigens to lymphocytes, so an elevated count shows antigen presentation is increased.", "c": false, "r": "Antigen presentation is the macrophage's second job, not the eosinophil's function."}]});
BANK.push({"cat": "Cells Involved in Immunity", "type": "single", "stem": "A patient with HIV has CD4+ T-cell counts of 640, then 385, then 190 over 18 months, with increasingly frequent serious infections. Which interpretation is correct?", "tp": "Helper T (CD4+) is the conductor of both orchestras. Lose it and both arms fail \u2014 that is the whole HIV story in this chapter. [Framework: Acute vs Chronic]", "kt": ["Helper T cells (CD4+ T cells)"], "opts": [{"t": "The falling CD4+ count tracks the progression of the infection, and because helper T cells drive both arms, both B- and T-cell function are failing.", "c": true, "r": "The guide: HIV attacks helper (CD4+) T cells, the count decreases as infection progresses, and both B- and T-cell activation depends on helper T activity \u2014 hence severe impairment of both arms and repeated serious infections."}, {"t": "The falling CD4+ count shows only the antibody arm is failing, because helper T cells are needed by B cells but not by T cells.", "c": false, "r": "Helper T-cell cytokines also activate cytotoxic T cells; both arms depend on the helper, which is why HIV is so devastating."}, {"t": "The infections are unrelated to the count, because CD4 is only a laboratory marker and plays no role in immune function.", "c": false, "r": "The guide calls the helper T cell a marker for immune function precisely because it runs both systems \u2014 the count and the infections are linked."}, {"t": "The count will recover once plasma cells increase antibody production to compensate for the missing T cells.", "c": false, "r": "Plasma cells cannot compensate: B-cell activation itself depends on helper T-cell cytokines, so the compensating arm is impaired too."}]});
BANK.push({"cat": "Cells Involved in Immunity", "type": "multi", "stem": "A nurse reviews the chart of a patient whose HIV infection is progressing. Which findings fit the guide's picture of advancing disease? Select all that apply.", "tp": "HIV progression = falling CD4+, serious repeated infections, and BOTH arms down because both need the helper. [Framework: Acute vs Chronic]", "opts": [{"t": "A CD4+ T-cell count that keeps decreasing at each monitoring visit.", "c": true, "r": "The guide states the CD4+ count decreases as HIV infection progresses."}, {"t": "Numerous and serious bouts of infection.", "c": true, "r": "The guide describes persons with HIV/AIDS experiencing numerous and serious infections because of widespread immune impairment."}, {"t": "Impaired B-cell function even though the virus does not directly attack B cells.", "c": true, "r": "B-cell activation depends on helper T-cell cytokines, so B-cell function fails when helper T cells are destroyed."}, {"t": "An increased antibody titer against every new pathogen the patient meets.", "c": false, "r": "With both arms impaired, responses to new pathogens weaken; rising titers to everything are not the picture."}, {"t": "Failure of cytotoxic T cells to activate against infected cells.", "c": true, "r": "Cytotoxic T-cell activation requires helper T-cell cytokines, so cell-mediated killing also fails."}]});
BANK.push({"cat": "Antigens, Antibodies, and Immune Responses", "type": "single", "stem": "A school nurse notes that a 9-year-old who had measles last year was exposed again during an outbreak but stayed well, while a classmate with no history became ill. The parent of the well child asks why. Which explanation is correct?", "tp": "Second exposure, no illness = memory cells driving a secondary response. Herd immunity protects the non-immune, not the already-immune. [Framework: Nursing Process/ADPIE]", "kt": ["Secondary response", "Immune memory"], "opts": [{"t": "During her first illness, memory cells formed; on this exposure they activated very quickly and produced many antibody-secreting plasma cells before illness could develop.", "c": true, "r": "This is the guide's own measles example of the secondary response: fast, many antibodies, no disease the second time."}, {"t": "Her antibody titer from last year stayed at its peak because antibodies, once made, are never used up or replaced and circulate at full strength indefinitely.", "c": false, "r": "Protection on re-exposure comes from memory cells rapidly making new plasma cells, not from a permanently frozen antibody level."}, {"t": "She is protected because classmates who were vaccinated created herd immunity that kept the virus away from her throughout the entire school year.", "c": false, "r": "Herd immunity is indirect protection of the non-immune; this child is herself immune through her own memory cells."}, {"t": "She stayed well because her first-line barriers have grown stronger with age, so the virus could not enter her body during this exposure.", "c": false, "r": "The virus did enter her environment and exposures occurred; the difference is her specific memory response, not her skin."}]});
BANK.push({"cat": "Antigens, Antibodies, and Immune Responses", "type": "single", "stem": "Before a clinical rotation, two students get measles antibody titers. Student A, who had measles as a child, has a high titer. Student B, never exposed and never vaccinated, has a very low titer. Which interpretation is correct?", "tp": "Titer = antibody level in blood for that antigen. High after disease, low when never exposed. [Framework: Nursing Process/ADPIE]", "kt": ["Antibody titer"], "opts": [{"t": "A's high antibody level reflects her earlier exposure to measles, and B's very low level shows she has no measles antibodies present, consistent with never having been exposed.", "c": true, "r": "The guide defines the antibody titer as the level of antibodies in the blood and gives this exact measles comparison."}, {"t": "The titer measures how many memory cells each student has, so B must have lost her memory cells at some point before birth or in early childhood.", "c": false, "r": "A titer measures antibody level, not a memory-cell count \u2014 and B never formed measles memory cells in the first place."}, {"t": "A's high titer means she is currently contagious and should be kept out of the clinical area until the level falls back to the normal range.", "c": false, "r": "A high titer from a childhood infection reflects past exposure and immunity, not current illness or contagiousness."}, {"t": "B's low titer means her immune system is deficient and she should be evaluated for immunodeficiency with a full workup and specialist referral.", "c": false, "r": "A low titer to one antigen she has never met is expected; immunodeficiency shows as repeated serious infections, not one low titer."}]});
BANK.push({"cat": "Antigens, Antibodies, and Immune Responses", "type": "single", "stem": "A mother asks why her breastfed newborn is protected from infections now but will still need her own vaccinations. Which response is correct?", "tp": "Borrowed antibodies protect the newborn briefly and silently \u2014 no production, no memory \u2014 so her own vaccines still matter. [Framework: Maslow]", "kt": ["IgA"], "opts": [{"t": "The baby received ready-made antibodies \u2014 across the placenta and IgA in breast milk \u2014 which protect briefly but do not make her body produce its own antibodies or memory cells.", "c": true, "r": "Naturally acquired passive immunity lasts about the first 6 months and the duration of breast-feeding; it does not stimulate the infant's own production, so her own active immunity must still be built."}, {"t": "The baby is protected for life because the mother's antibodies teach the baby's B cells which antibodies to make permanently, and those cells keep copying the mother's patterns for years.", "c": false, "r": "Passive antibodies teach nothing and form no memory; the guide lists this protection as short-term."}, {"t": "The baby needs vaccinations only if she stops breast-feeding before 6 months of age, because breast milk alone provides complete protection up to that point in her development.", "c": false, "r": "Even with breast-feeding, passive protection is temporary and produces no memory cells; vaccination builds her own active immunity."}, {"t": "The baby is protected because her own plasma cells are already producing a full range of antibodies at birth, covering every pathogen she is likely to meet in her first year.", "c": false, "r": "The protection described here is the mother's ready-made antibodies, not the newborn's own production."}]});
BANK.push({"cat": "Antigens, Antibodies, and Immune Responses", "type": "order", "stem": "A patient asks how his T cells will deal with a virus-infected cell. Place the four steps of T-cell activation in the correct order, from first to last.", "tp": "Four steps of CMI: origin/seeding in thymus and lymphatic tissue, macrophage antigen presentation, activation by antigen binding plus helper cytokines, then the clone. [Framework: Nursing Process/ADPIE]", "kt": ["Cell-mediated immunity (CMI)"], "items": [{"t": "T cells originate in red bone marrow, mature in the thymus gland, and seed lymphatic tissue, where they eventually encounter an antigen", "r": "Step 1: origin, maturation, and seeding come before any encounter."}, {"t": "A macrophage phagocytoses the pathogen, digests it, and pushes the antigen to its surface (antigen presentation)", "r": "Step 2: the macrophage presents the antigen; unpresented antigen cannot activate the T cell."}, {"t": "The antigen binds receptors on helper T cells and an unactivated cytotoxic T cell, and the helper T cell secretes cytokines that activate the cytotoxic T cell", "r": "Step 3: binding plus helper cytokines switch the cytotoxic T cell on."}, {"t": "The activated T cells divide repeatedly, producing a clone of cytotoxic T cells and memory T cells", "r": "Step 4: cloning multiplies the killers and banks the memory cells."}]});
BANK.push({"cat": "Acquired Immunity, Vaccines, and Antibody Products", "type": "single", "stem": "A parent asks why her infant needs a series of DTP injections instead of one shot. Which response by the nurse is correct?", "tp": "Series logic: prime (primary response, memory cells), then boost (secondary response, fast and many). [Framework: Nursing Process/ADPIE]", "kt": ["Booster shot", "Vaccine"], "opts": [{"t": "The first doses produce a slow primary response with few antibodies and form memory cells; later doses act as boosters that trigger the fast, large secondary response.", "c": true, "r": "Vaccination provides the initial exposure and memory-cell formation (primary response); a booster stimulates the secondary response with another dose of antigen."}, {"t": "Each dose contains ready-made antibodies, and the series is needed because those antibodies only last a few weeks at a time.", "c": false, "r": "DTP contains diphtheria and tetanus toxoids and pertussis vaccine \u2014 antigens, not ready-made antibodies; the infant makes her own."}, {"t": "The series is needed because an infant's B cells cannot form memory cells until after the first birthday.", "c": false, "r": "Memory cells form from the initial exposure at any of these doses; that formation is the stated purpose of vaccination."}, {"t": "One large dose would work, but it is split into a series only to make the injections less painful for the infant.", "c": false, "r": "The series is immunologic, not comfort-based: prime first, then boost the secondary response."}]});
BANK.push({"cat": "Acquired Immunity, Vaccines, and Antibody Products", "type": "single", "stem": "A parent declines the MMR vaccine, saying, \"Getting the real disease gives stronger immunity anyway.\" Which response uses the guide's concepts correctly?", "tp": "Natural versus artificial is about how it happened; both can be active. The vaccine's edge: antigen without the disease. [Framework: Maslow]", "kt": ["Attenuated pathogen"], "opts": [{"t": "Both routes produce active immunity, but the vaccine uses a killed or weakened pathogen that cannot cause the disease while still acting as an antigen and forming memory cells.", "c": true, "r": "Attenuated pathogens cannot cause disease when injected but still stimulate antibody production and memory \u2014 active immunity without the illness."}, {"t": "The parent is correct that only natural infection produces memory cells, so the vaccine offers just a few weeks of passive protection.", "c": false, "r": "Vaccination is active immunity: it stimulates the person's own antibodies and memory cells, the opposite of passive."}, {"t": "The vaccine actually gives passive immunity, which is why a booster is needed when the borrowed antibodies wear off.", "c": false, "r": "Boosters stimulate the secondary response of the person's own system; nothing is borrowed in a vaccine."}, {"t": "Natural infection is the artificially acquired route, and vaccination is the naturally acquired route, so the terms favor the parent.", "c": false, "r": "The routes are reversed: disease exposure is naturally acquired active; vaccination is artificially acquired active."}]});
BANK.push({"cat": "Acquired Immunity, Vaccines, and Antibody Products", "type": "single", "stem": "A nurse who is not immune to hepatitis B is stuck by a contaminated needle and receives immune globulin. Which teaching about this injection is correct?", "tp": "Immune globulin = borrowed antibodies: immediate, brief, silent. Know it cold \u2014 it is the classic passive-immunity trap. [Framework: Safety First]", "kt": ["Immune globulin"], "opts": [{"t": "It gives immediate protection because it contains ready-made antibodies from a donor, but the protection is short-lived because her body was not stimulated to make its own.", "c": true, "r": "The guide's clinical example is exactly this: immune globulin after hepatitis B exposure gives immediate, short-lived passive protection."}, {"t": "It will protect her for years because the injected antibodies will teach her B cells to keep producing them, and the protection will renew itself each time she is exposed at work.", "c": false, "r": "Injected antibodies do not stimulate the recipient's production and form no memory; that is why passive immunity is short-lived."}, {"t": "It works like a vaccine, using a weakened form of the hepatitis B virus to trigger her own primary immune response and form memory cells for the future.", "c": false, "r": "A weakened virus describes an attenuated vaccine (active); immune globulin is preformed antibody (passive)."}, {"t": "It neutralizes the virus's toxins but cannot help against the virus itself, so it offers no real protection and vaccination would have been the only useful option.", "c": false, "r": "Neutralizing toxins only describes antitoxins; immune globulin provides antibodies against the specific antigen, here hepatitis B."}]});
BANK.push({"cat": "Acquired Immunity, Vaccines, and Antibody Products", "type": "single", "stem": "A hiker treated with antivenom after a snakebite asks, \"So now I'm immune if it happens again?\" Which response is correct?", "tp": "Antivenom and antitoxin are antibodies in a syringe: they fight the poison now and leave no memory behind. [Framework: Nursing Process/ADPIE]", "kt": ["Antivenoms"], "opts": [{"t": "No. The antivenom supplied ready-made antibodies that combat the venom's effects now; his body made none of its own, so no lasting immunity or memory was formed.", "c": true, "r": "Antivenoms are antibody products \u2014 passive immunity \u2014 which protects immediately but briefly and does not stimulate the recipient's own production."}, {"t": "Yes. The antivenom acted as a vaccine, so his memory cells will produce a faster response to the next bite, and that response will be even stronger than the first one.", "c": false, "r": "Vaccines contain antigens and create memory; antivenom contains antibodies and creates none."}, {"t": "Yes, for about 6 months, the same length of time a newborn is protected by a mother's antibodies, after which the protection fades and cannot be renewed by another exposure.", "c": false, "r": "The 6-month figure belongs to naturally acquired passive immunity in infants; it does not turn antivenom into timed immunity of that length, and no memory forms either way."}, {"t": "No, because antivenom only neutralizes toxins made by bacteria and has no action against venom, so the treatment he received should not have been given for this bite.", "c": false, "r": "Antivenoms are defined by their action against snake venom; confusing them with antitoxins reverses the two products."}]});
BANK.push({"cat": "Acquired Immunity, Vaccines, and Antibody Products", "type": "single", "stem": "A patient with a deep, dirty wound who has never been vaccinated receives tetanus antitoxin (TAT). His wife asks how this differs from the tetanus shot their grandson gets. Which response is correct?", "tp": "TAT versus toxoid is the active/passive trap in one family: antibodies given versus antibodies made. [Framework: Safety First]", "kt": ["Antitoxins", "Toxoid"], "opts": [{"t": "He received ready-made antibodies that neutralize the tetanus toxin but do not affect the pathogen itself, while the grandson's toxoid vaccine makes his own body produce antibodies for long-term protection.", "c": true, "r": "Antitoxin = passive antibodies against the toxin only. Toxoid (in DTP) = altered toxin antigen that causes active, long-term immunity."}, {"t": "He received a weakened form of the tetanus bacterium that will stimulate his own antibody production over the next few weeks, while the grandson receives ready-made antibodies in each of his shots.", "c": false, "r": "The products are reversed: TAT is antibodies; the grandson's series uses tetanus toxoid, an antigen."}, {"t": "Both products work the same way and for the same length of time; the only differences are the dose size and the age of the person receiving the injection.", "c": false, "r": "They differ in mechanism (borrowed versus self-made antibodies) and in duration (short-lived versus long-term)."}, {"t": "His injection will form memory cells that protect him for life, while the grandson's protection fades within months and must be rebuilt with repeated doses throughout childhood.", "c": false, "r": "Memory and long life belong to the active (toxoid) route; the antitoxin's borrowed antibodies fade without memory."}]});
BANK.push({"cat": "Acquired Immunity, Vaccines, and Antibody Products", "type": "single", "stem": "A child with an immunodeficiency cannot receive vaccines. Her teacher explains that the child's classmates are being vaccinated before the school year. Which concept should the nurse reinforce with the family?", "tp": "Herd immunity is the shield other people's immunity builds around the child who cannot be vaccinated. [Framework: Maslow]", "kt": ["Herd immunity"], "opts": [{"t": "The classmates who are immune will not get the infection themselves, and that is what indirectly protects their non-immune classmate in the same classroom.", "c": true, "r": "That is the guide's herd-immunity definition: the immune majority provides indirect protection for the part of the population that is not immune."}, {"t": "Genetic immunity: the classmates' inherited species immunity will extend to the child while she is at school.", "c": false, "r": "Genetic immunity is an individual's inherited trait; it does not extend from one person to another."}, {"t": "Passive immunity: antibodies from the vaccinated classmates will transfer to the child through classroom contact.", "c": false, "r": "Classmates' vaccination does not transfer antibodies to her; the protection is indirect, by reducing the infection's spread."}, {"t": "Immunotolerance: the child's immune system will learn to tolerate the viruses because her classmates carry antibodies.", "c": false, "r": "Immunotolerance is self-recognition, unrelated to population-level protection."}]});
BANK.push({"cat": "Acquired Immunity, Vaccines, and Antibody Products", "type": "dropdown", "stem": "Classify each patient's immunity using the guide's Table 21.2 categories.<br>A 6-year-old who recovered from chickenpox last year<br>[[0]]<br>A newborn whose mother's antibodies crossed the placenta<br>[[1]]<br>A student who received the MMR vaccine in early childhood<br>[[2]]<br>A traveler injected with gamma globulin before a trip<br>[[3]]", "tp": "The 2x2 grid: natural/artificial (how) times active/passive (who made the antibodies). Disease = natural active; mother = natural passive; vaccine = artificial active; gamma globulin = artificial passive. [Framework: Nursing Process/ADPIE]", "kt": ["Acquired immunity"], "blanks": [{"o": [{"t": "Naturally acquired active immunity", "c": true, "r": "Recovering from the disease is exposure to live pathogens \u2014 naturally acquired, and his own body made the antibodies (active)."}, {"t": "Naturally acquired passive immunity", "c": false, "r": "Passive means borrowed antibodies, as from a mother; this child made his own during the illness."}, {"t": "Artificially acquired active immunity", "c": false, "r": "Artificial active is vaccination; no vaccine was involved in recovering from chickenpox."}, {"t": "Artificially acquired passive immunity", "c": false, "r": "Artificial passive is injected gamma globulin; nothing was injected here."}]}, {"o": [{"t": "Naturally acquired passive immunity", "c": true, "r": "Antibodies passed from mother to infant across the placenta and by breast-feeding are naturally acquired passive \u2014 short-term, no production by the infant."}, {"t": "Naturally acquired active immunity", "c": false, "r": "Active requires the infant's own antibody production; placental antibodies are the mother's."}, {"t": "Artificially acquired active immunity", "c": false, "r": "Nothing artificial or self-made here; this is maternal transfer."}, {"t": "Artificially acquired passive immunity", "c": false, "r": "Artificial passive is an injection of gamma globulin, not placental transfer."}]}, {"o": [{"t": "Artificially acquired active immunity", "c": true, "r": "Vaccination is artificially acquired, and because the body makes its own antibodies it is active and long-term."}, {"t": "Artificially acquired passive immunity", "c": false, "r": "Passive artificial is gamma globulin injection; a vaccine contains antigen, not antibodies."}, {"t": "Naturally acquired active immunity", "c": false, "r": "Natural active comes from getting the disease; the MMR route is a medical intervention."}, {"t": "Naturally acquired passive immunity", "c": false, "r": "No maternal antibodies are involved in a childhood vaccine."}]}, {"o": [{"t": "Artificially acquired passive immunity", "c": true, "r": "Injection with gamma globulin (ready-made antibodies) is artificially acquired passive: short-term, no stimulation of the recipient's own production."}, {"t": "Artificially acquired active immunity", "c": false, "r": "Active artificial is vaccination; gamma globulin supplies antibodies rather than stimulating them."}, {"t": "Naturally acquired passive immunity", "c": false, "r": "Natural passive is mother-to-infant transfer, not an injection before travel."}, {"t": "Naturally acquired active immunity", "c": false, "r": "No disease exposure and no self-made antibodies occurred here."}]}]});
BANK.push({"cat": "When Immunity Goes Wrong and Transplants", "type": "single", "stem": "The nurse is about to start a first dose of an IV antibiotic. The patient mentions, \"Penicillin gave me a bad reaction once, years ago, but I don't remember exactly what happened.\" Which action is the priority?", "tp": "Allergy history BEFORE the drug \u2014 especially antibiotics, especially penicillin. Vague history means stop and clarify, not slow-push and watch. [Framework: Safety First]", "kt": ["Anaphylaxis"], "opts": [{"t": "Hold the dose, get a full medication-allergy history, and clarify the reaction with the provider before any antibiotic is given.", "c": true, "r": "The guide: medication-allergy history is obtained before administering any drug, particularly antibiotics, and persons allergic to penicillin are at particular risk for anaphylaxis."}, {"t": "Give the dose slowly and watch the patient for the first 15 minutes, since the reaction history is vague and old.", "c": false, "r": "A vague penicillin history is exactly the risk the allergy-history rule exists for; test-dosing a possible anaphylaxis trigger is unsafe."}, {"t": "Give the dose as ordered, because a reaction that long ago will have been outgrown by now.", "c": false, "r": "Nothing in the guide supports outgrowing a drug allergy; the stated risk group is persons allergic to penicillin."}, {"t": "Ask the patient to sign a waiver accepting the risk, then give the dose with epinephrine drawn up at the bedside.", "c": false, "r": "A waiver does not replace the allergy history and clarification; epinephrine treats a reaction, it does not license provoking one."}]});
BANK.push({"cat": "When Immunity Goes Wrong and Transplants", "type": "single", "stem": "A warehouse worker develops itchy, red, erupting skin on both hands about 2 days after the facility switched to a new cleaning detergent, and the same thing happened the last time the detergent was used. Which explanation and action are correct?", "tp": "Delayed (about 48 hours) + T cells + skin + repeated chemical = contact dermatitis. Remove the trigger. [Framework: Nursing Process/ADPIE]", "kt": ["Contact dermatitis"], "opts": [{"t": "This is a delayed-reaction allergy: repeated skin exposure activated T cells that accumulated in the skin; removing the exposure removes the trigger.", "c": true, "r": "Contact dermatitis fits every cue: onset delayed about 48 hours, repeated chemical exposure (detergents are a named cause), T-cell accumulation, skin eruptions and inflammation."}, {"t": "This is an immediate IgE reaction, so he should carry epinephrine in case the next exposure closes his airway.", "c": false, "r": "Immediate reactions are IgE/mast-cell events on re-exposure with systemic effects; a 48-hour delayed skin eruption after repeated exposure is the T-cell delayed pattern."}, {"t": "This is an infection from a destroyed acid mantle, so he needs an antibiotic and a wound culture.", "c": false, "r": "Barrier destruction can invite infection, but the timing, repetition with the same chemical, and bilateral eruption pattern fit contact dermatitis."}, {"t": "This is an autoimmune reaction to his own skin, so he needs immunosuppressant therapy started promptly.", "c": false, "r": "Autoimmunity is failed self-recognition; this reaction tracks an external chemical trigger and resolves by removing it."}]});
BANK.push({"cat": "When Immunity Goes Wrong and Transplants", "type": "single", "stem": "A patient with rheumatoid arthritis asks, \"Why is my own body attacking my joints?\" Which explanation is correct?", "tp": "Autoimmunity = tolerance failure: self read as nonself. RA is the guide's named example. [Framework: Nursing Process/ADPIE]", "opts": [{"t": "His immune system has failed to recognize his own cells as self, so it produces antibodies against them \u2014 a failure of immunotolerance.", "c": true, "r": "The guide: when the immune system fails to identify self and mounts an attack on its own cells, that is the basis of autoimmune diseases such as rheumatoid arthritis."}, {"t": "His joints are being attacked because an allergen bound to IgE on mast cells in the joint tissue.", "c": false, "r": "IgE on mast cells describes the immediate allergic reaction, not the self-attack of autoimmunity."}, {"t": "His body is rejecting his joints the way a recipient rejects a transplanted kidney.", "c": false, "r": "Transplant rejection targets foreign tissue recognized as nonself; autoimmunity targets self tissue because self-recognition failed \u2014 the recognition error is opposite."}, {"t": "His immune system cannot mount a defense, so ordinary bacteria are destroying the joint tissue unchecked.", "c": false, "r": "That describes immunodeficiency; in autoimmunity the defense is mounted \u2014 against the wrong target."}]});
BANK.push({"cat": "When Immunity Goes Wrong and Transplants", "type": "single", "stem": "An infant with SCID has had repeated, serious infections since birth despite routine care. Which priority should guide the nursing plan?", "tp": "Cannot mount a defense = the plan is a shield: minimize exposure, watch for infection, escalate early. [Framework: Safety First]", "kt": ["Severe combined immunodeficiency (SCID)"], "opts": [{"t": "Protect the infant from exposure to pathogens relentlessly, because his immune system cannot mount a defense against them.", "c": true, "r": "SCID is the guide's example of a primary immunodeficiency: the system cannot mount a defense, and the clinical pattern is repeated, serious infections."}, {"t": "Encourage frequent visits from large family groups to stimulate his immune system through exposure.", "c": false, "r": "Exposure does not train a system that cannot respond; it only adds pathogens he cannot fight."}, {"t": "Rely on vaccination to build his immunity, since vaccines will form the memory cells he is missing.", "c": false, "r": "A system that cannot mount a defense cannot be assumed to answer a vaccine; the immediate priority is protection from exposure."}, {"t": "Expect the infections to lessen once his mother's antibodies return to protective levels.", "c": false, "r": "Maternal passive antibodies fade over the first months; they do not return, and they were never a lasting defense for this infant."}]});
BANK.push({"cat": "When Immunity Goes Wrong and Transplants", "type": "single", "stem": "An 84-year-old with a spreading leg wound and confusion has a temperature of 99.3\u00b0F (37.4\u00b0C). A new nurse says, \"At least there's no fever, so the infection can't be serious.\" Which correction is right?", "tp": "In the older adult, no fever does not mean no infection. Blunted fever response is an aging trap. [Framework: Acute vs Chronic]", "opts": [{"t": "Older adults often have a reduced fever response to infection, so a near-normal temperature does not rule out a serious infection in this patient.", "c": true, "r": "The guide's aging box: older adults often have reduced fever response and may have difficulty combating infection, alongside deficient T- and B-cell function and decreased macrophage activity."}, {"t": "The new nurse is correct, because fever is produced by pyrogens in every infection regardless of the patient's age.", "c": false, "r": "Pyrogens drive fever, but the aging hypothalamic response is blunted; age changes the rule for reading temperature."}, {"t": "The low temperature is explained by his stronger lymphocyte function, which is controlling the infection silently.", "c": false, "r": "Aging brings somewhat deficient T- and B-cell function, not stronger function."}, {"t": "His temperature is low because older adults produce more autoantibodies, which suppress the fever response.", "c": false, "r": "Increased autoantibodies in older adults relate to autoimmune disease risk, not to fever suppression."}]});
BANK.push({"cat": "When Immunity Goes Wrong and Transplants", "type": "multi", "stem": "Which changes in the aging immune system should the nurse expect when planning care for older adults? Select all that apply.", "tp": "Aging set: weaker T/B, weaker macrophages, blunted fever, more autoantibodies, slower recovery. [Framework: Acute vs Chronic]", "opts": [{"t": "T-cell and B-cell function is somewhat deficient, with depressed lymphocyte function.", "c": true, "r": "Stated directly in the guide's As You Age box."}, {"t": "Macrophage activity is decreased.", "c": true, "r": "Depressed lymphocyte function is accompanied by a decrease in macrophage activity."}, {"t": "Circulating autoantibodies are increased, contributing to more autoimmune disease.", "c": true, "r": "Older adults have increased levels of circulating autoantibodies, partly explaining their higher autoimmune disease rates."}, {"t": "Recovery from infections is slower, and infections are more likely to develop.", "c": true, "r": "The guide states older adults are more prone to infections and recover more slowly."}, {"t": "Fever responses to infection are stronger and appear earlier than in younger adults.", "c": false, "r": "The guide states the opposite: older adults often have a reduced fever response."}]});
BANK.push({"cat": "When Immunity Goes Wrong and Transplants", "type": "single", "stem": "Six months after a transplant, a patient develops a widespread skin rash, abdominal pain with diarrhea, and signs of liver involvement. The transplanted tissue came from a donor. Which interpretation is correct?", "tp": "Skin + gut + liver after transplant = the graft attacking the host. Direction is everything in transplant rejection. [Framework: Nursing Process/ADPIE]", "kt": ["Graft-versus-host disease (GVHD)"], "opts": [{"t": "The transplanted tissue is rejecting the host \u2014 graft-versus-host disease \u2014 in which transplanted T cells attack the skin, digestive tract, and liver.", "c": true, "r": "GVHD matches the guide's target organs exactly: skin, digestive tract, and liver, caused in part by transplanted T cells."}, {"t": "The patient's body is rejecting the transplanted tissue, and the rash and gut signs are the graft dying.", "c": false, "r": "Host-rejects-graft destroys the donated organ; here the patient's own skin, gut, and liver are under attack, which is the graft-versus-host direction."}, {"t": "The findings show an immediate allergic reaction to the transplant medications, mediated by IgE and mast cells.", "c": false, "r": "IgE/mast-cell reactions are immediate hypersensitivity events; this multi-organ pattern months later fits GVHD's named targets."}, {"t": "The findings are the expected result of his immunosuppressants working, and no report to the provider is needed.", "c": false, "r": "Immunosuppression raises infection risk, but new skin, gut, and liver involvement after transplant is the GVHD pattern and must be reported."}]});

    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
