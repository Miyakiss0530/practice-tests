BANK.push({ cat: CA, type: "single", kt: ["alignment"], stem: "A nurse bends from the waist with straight knees to pick up a 20-lb box of IV fluids from the floor, then twists to place it on a counter. A coworker watching identifies the injury risks in this lift. Which correction set addresses every error seen?", opts: [O("Flex the knees and hips with the back straight, face the counter squarely, and carry the box close to the midline", true, "Correct. Knee and hip flexion, no twisting, and a load held close fix all three errors. Framework: safety first."), O("Keep the knees straight but tighten the abdominal muscles, then twist slowly so the back muscles share the load evenly", false, "Tightened abdominals do not rescue a waist bend, and slow twisting still twists the spine."), O("Flex the knees and hips but hold the box at arm's length, so the shoulders rather than the back absorb the full weight", false, "Arm's-length holding increases the workload; the load belongs close to the body midline."), O("Flex one knee only and pivot on that foot while twisting, so the turn comes from the leg instead of from the trunk", false, "Pivoting during a loaded twist still rotates the spine under load; the nurse faces the work instead.")], tp: "Framework: safety first. Bend knees and hips, keep the back straight, face the work, carry close to the midline - never bend from the waist or twist." });
BANK.push({ cat: CA, type: "single", kt: ["ergonomics"], stem: "Two nurses must move a 210-lb patient who cannot assist from the bed to a stretcher. The unit's mechanical lift is available and the patient meets the criteria for its use, but a nurse suggests a manual lift to save time. Which action should the nurse take?", opts: [O("Use the mechanical lift for this transfer, because devices are used every time the patient's condition warrants one", true, "Correct. The standard is device use 100 percent of the time a lift is warranted. Framework: safety first."), O("Attempt the manual lift with both nurses, because two workers lifting together divide the workload by half anyway", false, "Halving a load that warrants a device still leaves an unsafe manual lift; the device standard governs."), O("Ask the patient to hold the side rails and pull, because any patient effort removes the need for lifting equipment", false, "This patient cannot assist; imagined patient effort does not change the device indication."), O("Delay the transfer until the next shift, because a warranted mechanical lift can be postponed without any consequence", false, "Delaying needed care is not a safe substitute; the lift is available now and should be used now.")], tp: "Framework: safety first. Mechanical lifting devices are used 100 percent of the time the patient's condition warrants a lift." });
BANK.push({ cat: CA, type: "single", kt: ["base of support"], stem: "A nurse prepares to boost a patient up in bed. The bed is at its lowest setting, and the nurse's back already aches from earlier lifts on this shift. Which action should the nurse take first?", opts: [O("Raise the bed to a comfortable working height before starting the move, to protect the back muscles", true, "Correct. Working height comes first; a low bed forces the back bend that causes injury. Framework: safety first."), O("Proceed at the low height but move quickly, because speed during the boost reduces the time the back is loaded", false, "Speed does not unload the back; working at a stressful height is the problem to fix first."), O("Ask the patient to push with the heels while the nurse pulls from the head of the bed at the low height", false, "Patient help does not correct a working height that stresses the nurse's back muscles."), O("Skip setting the abdominal and gluteal muscles, because an aching back means those muscles need full rest", false, "Setting the muscles before the move is a protective step and is never the step to skip.")], tp: "Framework: safety first. Adjust bed height to a comfortable working level before any move; set abdominal and gluteal muscles in preparation." });
BANK.push({ cat: CA, type: "single", stem: "A float nurse is asked to help transfer a patient whose total lift load she estimates at about 45 lb of body weight for her share. She recalls two different printed limits. Which statement guides her correctly?", opts: [O("NIOSH advises never lifting more than 35 lb of a patient's body weight, so she should get a device or more help", true, "Correct. The NIOSH figure is 35 lb of body weight; the 50-lb figure is a facility suggestion. Framework: safety first."), O("Facilities suggest a 50-lb limit, so a 45-lb share is acceptable manual lifting under the only number that applies", false, "The 50-lb figure is a facility suggestion; NIOSH's printed guidance caps body weight lifted at 35 lb."), O("Both printed limits allow this lift, because the limits apply to the patient's total weight and not to one share", false, "The limits concern the weight a worker lifts; a 45-lb share exceeds the 35-lb NIOSH guidance."), O("The limits do not apply to transfers at all, because they were written only for lifting boxes and supplies", false, "The NIOSH guidance is written for lifting a patient's body weight, which is exactly this task.")], tp: "Framework: safety first. Trap pair: facilities suggest 50 lb; NIOSH says never lift more than 35 lb of a patient's body weight." });
BANK.push({ cat: CA, type: "multi", stem: "A charge nurse audits a transfer and notes several technique findings. Which findings show correct body mechanics? Select all that apply.", opts: [O("The nurse stood directly in front of the patient, facing the work area squarely before starting the move", true, "Correct. Facing the work area prevents unnecessary twisting of the spine during the move."), O("The nurse widened the base of support in the direction of movement before beginning the transfer task", true, "Correct. A base widened toward the movement increases stability and reduces the effort needed."), O("The nurse used a pull sheet to slide the patient closer rather than lifting the patient off the surface", true, "Correct. Sliding with a pull sheet takes less effort than lifting and limits shearing on skin."), O("The person carrying the heaviest load counted to 3 so the team lifted at exactly the same moment now", true, "Correct. The heaviest-load person coordinates the count so simultaneous lifting minimizes each load."), O("The nurse reached above shoulder height for equipment mid-transfer rather than pausing to get a step stool", false, "Reaching above the shoulders is prohibited; a step stool is used for anything above chest level."), O("The nurse held the patient away from the body during the lift to keep the uniform clean and uncreased", false, "Holding a load away from the body increases the workload and the strain on the lifter.")], tp: "Framework: safety first. Face the work, widen the base toward the move, slide instead of lift, heaviest-load person counts to 3." });
BANK.push({ cat: CA, type: "single", stem: "A home health nurse finds a family caregiver lifting a patient from bed to chair daily with no equipment, back bent and arms fully extended. Which teaching is most appropriate?", opts: [O("Teach the caregiver correct body mechanics for the transfer and have the family practice it successfully before discharge home", true, "Correct. Home transfers are rehearsed in the hospital to success before the patient goes home. Framework: Nursing Process - teaching with return demonstration."), O("Tell the caregiver to hire a private aide for every transfer, because family members should never lift patients at home", false, "Family caregivers are taught and rehearsed at home transfers; hiring out is not the chapter plan."), O("Advise the caregiver to lift faster with the back bent, because a quick lift shortens the time the spine is loaded", false, "A bent-back fast lift keeps the two worst mechanics in place and adds momentum to the strain."), O("Suggest the patient stay in bed until strength returns, because bed rest is safer than any family-performed transfer", false, "Prolonged bed rest trades transfer risk for the full list of immobility complications.")], tp: "Framework: Nursing Process/ADPIE. Home caregivers learn body mechanics and the gait belt, and practice the transfer successfully in the hospital first." });
BANK.push({ cat: CA, type: "single", kt: ["ergonomics"], stem: "A new nurse asks why the unit insists on lift equipment when the staff already passed a body mechanics class. Which response by the preceptor is most accurate?", opts: [O("Most nursing injuries come from manual lifting, moving, and repositioning, so equipment takes on that force for the nurse", true, "Correct. Manual patient handling causes most injuries; devices absorb the energy and force. Framework: safety first."), O("Body mechanics classes are being phased out, because technique has been shown to have no effect on injury rates at all", false, "Technique still matters and is taught with equipment, not replaced by the claim it does nothing."), O("Lift equipment is mainly for patient comfort, because patients report less pain when a machine moves them between surfaces", false, "Comfort is a side benefit; the equipment exists because manual handling injures nurses."), O("Injury rates are highest among office staff, because seated work strains the back more than patient handling work does", false, "The injury data concern hospital and long-term care workers handling patients, not office staff.")], tp: "Framework: safety first. Ergonomics exists because manual lifting, moving, and repositioning cause most nursing injuries." });
BANK.push({ cat: CA, type: "order", stem: "A nurse plans a two-person lift of a heavy supply cart load onto a treatment cart. Put the nurse's preparation steps in the correct order.", items: [{t: "Think through the lift mentally to judge whether assistance is needed", r: "First: lift twice - the mental lift comes before the physical one and reveals the help needed."}, {t: "Arrange for adequate help and position feet shoulder width apart", r: "Second: adequate help is arranged and the base of support is set before any load is taken."}, {t: "Set the abdominal and gluteal muscles in preparation for the move", r: "Third: preparing the muscles for the load limits strain to the least possible level."}, {t: "Flex the knees, keep the back straight, and lift with the leg muscles", r: "Fourth: the lift itself uses the stronger leg muscles with the back kept straight and aligned."}, {t: "Carry the load close to the midline of the body to the treatment cart", r: "Last: a load carried close to the midline keeps the workload and strain at their lowest."}], tp: "Framework: safety first. Lift twice - mentally, then physically; set the base, set the muscles, lift with the legs, carry close." });
BANK.push({ cat: CB, type: "single", stem: "A postoperative patient in Fowler's position keeps sliding down toward the foot of the bed, and the nurse boosts her back up every hour. Which addition best addresses the cause?", opts: [O("Place a footboard or a firm pillow at the feet so the patient does not slip down in the bed", true, "Correct. Fowler's setup includes a footboard or firm pillow specifically to stop the sliding. Framework: Nursing Process - fix the setup, not the symptom."), O("Raise the head of the bed to 90 degrees, because a steeper angle wedges the patient against the mattress firmly", false, "90 degrees is the orthopneic angle; steepening Fowler's worsens sliding and changes the ordered position."), O("Place a pillow under the patient's knees, because flexed knees anchor the patient against sliding downward", false, "A pillow under the knees is prohibited; it pools venous blood and feeds clot formation."), O("Lower the head of the bed to 30 degrees, because semi-Fowler's is the correct angle for every postoperative patient", false, "Changing the position angle is not the printed fix; the missing piece is the foot support.")], tp: "Framework: Nursing Process/ADPIE. Fowler's 45-60 degrees plus a footboard or firm pillow stops the slide; pillows never go under the knees." });
BANK.push({ cat: CB, type: "single", stem: "A patient is ordered an enema, followed later by a rectal suppository if needed. Which position should the nurse use for both procedures?", opts: [O("Left Sims position, side-lying and partially on the abdomen with the knee and thigh drawn up on pillows", true, "Correct. Left Sims is the printed position for the enema procedure and rectal suppository. Framework: Nursing Process - position matches procedure."), O("Prone position, face down with the face to one side and a pillow placed under the lower legs for support", false, "Prone exposes the back, not the rectal area in the supported side-lying arrangement Sims gives."), O("Lithotomy position, supine with the feet in stirrups and the buttocks at the edge of the examining table", false, "Lithotomy serves examinations and procedures at a table, not bedside enema administration."), O("Dorsal recumbent position, supine with head and shoulders on a pillow and the knees bent and relaxed", false, "Dorsal recumbent is a resting supine variant; it does not give the left-side rectal access of Sims.")], tp: "Framework: Nursing Process/ADPIE. Left Sims: enema and rectal suppository position - side-lying, partially on the abdomen, upper leg drawn up." });
BANK.push({ cat: CB, type: "single", stem: "A patient with heart failure and worsening shortness of breath sits bolt upright, still struggling to breathe at 60 degrees. Which position change should the nurse make?", opts: [O("Raise the head of the bed to 90 degrees and help the patient lean forward onto a pillow on the overbed table", true, "Correct. Orthopneic positioning at 90 degrees with forward lean facilitates ease of breathing. Framework: ABCs - breathing first."), O("Lower the head of the bed flat, because a flat surface lets the diaphragm move without any abdominal pressure", false, "Flat positioning worsens breathing effort for this patient; upright forward lean is the relief position."), O("Place the patient in Trendelenburg's position, because head-low positioning is the standard answer for breathlessness", false, "Trendelenburg's presses the diaphragm with abdominal organs and is used less often for good reason."), O("Turn the patient prone with a pillow under the lower legs, because face-down rest reduces the work of breathing", false, "Prone is a resting position in this chapter, not the breathing-relief position for a cardiac patient.")], tp: "Framework: ABCs. Orthopneic - 90 degrees, leaning forward on a pillow on the overbed table - facilitates ease of breathing in cardiac and respiratory conditions." });
BANK.push({ cat: CB, type: "single", stem: "A patient recovering from total hip replacement must be kept with the legs apart while in bed. Which device maintains this?", opts: [O("An abductor splint, placed to maintain the legs in abduction after the total hip replacement surgery", true, "Correct. The abductor splint exists for exactly this post-hip-replacement purpose. Framework: safety first - protect the new joint."), O("A trochanter roll, placed along the lateral thighs to keep the legs from rolling toward each other now", false, "Trochanter rolls prevent external rotation in supine patients; they do not hold abduction."), O("A foot board, placed at the end of the bed to brace the feet and hold the legs apart at a fixed width", false, "Foot boards hold dorsiflexion against foot drop; they do not maintain leg abduction."), O("A hand roll, placed between the legs at the knees to cushion the skin while the legs rest separated", false, "Hand rolls maintain the hand and fingers; they are far too small to hold hip abduction.")], tp: "Framework: safety first. Device match: abductor splint maintains leg abduction after total hip replacement." });
BANK.push({ cat: CB, type: "multi", stem: "An unconscious patient will remain supine for several hours. Which positioning actions protect this patient? Select all that apply.", opts: [O("Place trochanter rolls parallel to the lateral thighs to reduce external rotation of the hips in bed", true, "Correct. Lateral thigh rolls are part of the supine setup and guard the hips from rotating outward."), O("Support the feet in dorsiflexion with a firm pillow or footboard to prevent foot drop from developing", true, "Correct. Dorsiflexion support is the standing prevention for foot drop in a supine immobile patient."), O("Place a small pillow or roll under the ankle to elevate the heel and reduce pressure on the heels", true, "Correct. Heel elevation off the surface reduces pressure and helps prevent skin impairment."), O("Place hand rolls in the hands to reduce extension of the fingers and abduction of the thumb joint", true, "Correct. Hand rolls in supine setup reduce finger extension and thumb abduction problems."), O("Plan to reposition the patient at least every 2 hours, because the patient cannot move independently", true, "Correct. Debilitated, unconscious, or paralyzed patients are repositioned at least every 2 hours."), O("Place a firm pillow under both knees to keep the legs comfortable in slight flexion for the whole period", false, "A pillow under the knees is never part of the setup; it pools venous blood in the lower legs.")], tp: "Framework: safety first. Supine protection set: trochanter rolls, dorsiflexion support, heel elevation, hand rolls, repositioning at least every 2 hours." });
BANK.push({ cat: CB, type: "matrix", stem: "Classify each patient need by the position that best serves it.", cols: ["Orthopneic position", "Sims position"], rows: [{t: "A patient with a respiratory condition who breathes easiest leaning forward over the overbed table", a: 0, r: "Correct. Orthopneic, at 90 degrees leaning on the table pillow, facilitates ease of breathing."}, {t: "A patient who needs an enema administered at the bedside this morning", a: 1, r: "Correct. Left Sims is the position for the enema procedure and rectal suppository."}, {t: "A patient with a cardiac condition who wants to sit on the bed edge with legs dangling to breathe", a: 0, r: "Correct. Orthopneic is also taken sitting at the bedside with legs dangling or propped on a chair."}, {t: "A patient resting on the side, partially on the abdomen, lower arm along the back for comfort", a: 1, r: "Correct. That arrangement - side-lying, partial abdomen, lower arm back - is the Sims position."}], tp: "Framework: Nursing Process - match the position to the need. Orthopneic eases breathing; Sims serves rectal procedures and side rest." });
BANK.push({ cat: CB, type: "dropdown", stem: "Complete the positioning orders for three patients. Patient A, resting after surgery with the head of bed up for comfort, is placed at [[0]]. Patient B, who needs the halfway version of the same position family, is placed at [[1]]. Patient C, short of breath and leaning on the overbed table, is placed at [[2]].", blanks: [{o: [O("45 to 60 degrees", true, "Correct. Fowler's position is head of bed raised 45 to 60 degrees."), O("about 30 degrees", false, "About 30 degrees is semi-Fowler's, the halfway version, not full Fowler's."), O("90 degrees", false, "90 degrees is the orthopneic angle for the patient leaning on the table.")]}, {o: [O("about 30 degrees", true, "Correct. Semi-Fowler's is head of bed raised approximately 30 degrees."), O("45 to 60 degrees", false, "45 to 60 degrees is full Fowler's, not the halfway version."), O("90 degrees", false, "90 degrees is orthopneic, far above the halfway version.")]}, {o: [O("90 degrees", true, "Correct. Orthopneic is sitting up at a 90-degree angle, leaning on the overbed table."), O("45 to 60 degrees", false, "45 to 60 degrees is Fowler's; the leaning-table position is fully upright."), O("about 30 degrees", false, "About 30 degrees is semi-Fowler's, too low for the orthopneic position.")]}], tp: "Angles anchor: Fowler's 45-60 degrees, semi-Fowler's about 30 degrees, orthopneic 90 degrees." });
BANK.push({ cat: CB, type: "single", kt: ["alignment"], stem: "After turning a debilitated patient to a lateral position, the nurse completes the follow-up assessment. Which set of findings must be assessed after every positioning?", opts: [O("Body alignment, comfort, skin integrity, breathing, and tolerance of the position the patient is now in", true, "Correct. Those five are the printed after-positioning assessment set. Framework: Nursing Process - evaluate after every intervention."), O("Blood pressure, pulse, respirations, temperature, and pain, taken in the new position before leaving the room", false, "A vital sign set is not the printed after-positioning checklist; alignment and skin lead this one."), O("Range of motion of all joints, muscle strength, gait, and posture, measured before the next scheduled turn", false, "That set is the general mobility assessment focus, not the after-each-positioning follow-up."), O("Color, temperature, movement, sensation, pulses, refill, and pain in the limb that was underneath the body", false, "That set is the CMS check for an injured limb, not the routine five-part positioning follow-up.")], tp: "Framework: Nursing Process/ADPIE. After positioning assess: alignment, comfort, skin integrity, breathing, and tolerance of the position." });
BANK.push({ cat: CB, type: "single", stem: "A nurse considers placing a patient in Trendelenburg's position for low blood pressure, recalling it was once used for shock. Which understanding is correct?", opts: [O("It is used less often now, because abdominal organs press the diaphragm and blood shunts to the brain over other organs", true, "Correct. Diaphragm pressure and brain-only shunting are the printed reasons it fell from shock use. Framework: ABCs - it compromises breathing."), O("It remains the first-line shock position, because raising the legs returns blood evenly to every vital organ at once", false, "The chapter states the opposite: it is used less often and shunts blood to the brain rather than all organs."), O("Its only remaining use is easing breathing, because the head-low angle takes pressure off the diaphragm fully", false, "Head-low positioning increases diaphragm pressure from abdominal organs; it does not ease breathing."), O("It is now used mainly for enemas, because the incline helps solution flow into the bowel by gravity alone", false, "Enemas use left Sims; Trendelenburg's remaining named use is venous distention for central line placement.")], tp: "Framework: ABCs. Trendelenburg's is used less often: diaphragm pressure plus shunting to the brain; still used for venous distention during central line placement." });
BANK.push({ cat: CC, type: "multi", stem: "A patient on day 6 of bed rest after surgery reports no bowel movement in 4 days, poor appetite, and abdominal fullness. Which nursing actions address the immobility effects shown? Select all that apply.", opts: [O("Encourage fluids and a well-balanced diet, and monitor intake, appetite, and bowel function each shift", true, "Correct. Intake, fluids, diet, and monitoring of bowel function target anorexia and constipation."), O("Use early, progressive ambulation, moving the patient from dangling toward steps and chair sitting", true, "Correct. Progressive ambulation restarts peristalsis and reverses the immobility driving the symptoms."), O("Encourage deep breathing and coughing exercises with spirometry on a daily basis while in bed", true, "Correct. Daily breathing exercises are part of the standing daily encouragements for immobile patients."), O("Keep the patient strictly in bed until the bowel moves, because walking slows an already sluggish bowel", false, "Bed rest is the cause of the slowed peristalsis; more of it deepens the constipation."), O("Place a pillow under the knees for comfort, because knee flexion helps the abdominal muscles expel stool", false, "Pillows under the knees are prohibited, and abdominal muscles expel stool when used, not when rested flexed.")], tp: "Framework: Nursing Process/ADPIE. Immobility slows peristalsis and weakens abdominal muscles; fluids, diet, monitoring, and progressive ambulation answer it." });
BANK.push({ cat: CC, type: "single", kt: ["orthostatic hypotension"], stem: "Before a first ambulation after 5 days of bed rest, a patient's lying blood pressure is 128/84. Two minutes after standing it is 104/72, and the patient reports feeling lightheaded. Which interpretation and action are correct?", opts: [O("This meets orthostatic hypotension, so the nurse sits the patient down and has the patient rise slowly in stages", true, "Correct. Systolic fell 24 and diastolic fell 12 within 3 minutes - both past the thresholds. Framework: safety first."), O("This is a normal standing response, so the nurse walks the patient to the hallway as planned for this morning", false, "A 24-point systolic fall with lightheadedness is not normal; walking on invites a fall."), O("This meets orthostatic hypotension only if the drop occurs after 10 minutes, so the nurse rechecks in 8 minutes", false, "The printed window is within 3 minutes of standing; waiting out the window misses the diagnosis."), O("This shows dehydration only, so the nurse gives oral fluids and proceeds with the walk once fluids are finished", false, "Fluids may help later care, but the finding meets the orthostatic definition and the walk stops now.")], tp: "Framework: safety first. Orthostatic hypotension: systolic down 20 or diastolic down 10 within 3 minutes of standing - sit the patient down, rise slowly." });
BANK.push({ cat: CC, type: "single", stem: "An older adult on blood pressure medication stands during a first walk, becomes dizzy and nauseated, and starts to sway. Which action should the nurse take first?", opts: [O("Ease the patient into a sitting position in a chair or onto the floor, rather than trying to hold the patient up", true, "Correct. A swaying patient is sat down or eased to the floor; holding up risks both falling. Framework: safety first."), O("Hold the patient upright by the gait belt until the dizziness passes, because sitting delays the ambulation goal", false, "Holding a fainting patient upright is the prohibited response; the patient is eased down."), O("Walk the patient quickly back to the bed, because returning to bed is faster than finding a chair in the hall", false, "Hurrying a swaying patient lengthens the fall distance; the nearest safe seat or the floor is used."), O("Call for a wheelchair and keep the patient standing with support, because a seated position must be a proper chair", false, "Waiting standing for equipment keeps the patient in the dangerous position; the floor is acceptable.")], tp: "Framework: safety first. Blood-pressure medicines raise orthostatic risk in older adults; a dizzy patient is eased to a chair or the floor, never held up." });
BANK.push({ cat: CC, type: "single", kt: ["capillary refill"], stem: "A nurse checks a casted leg and finds the foot pale and cool compared with the other foot, with a refill time of 5 seconds in this 40-year-old patient and new tingling. Which action should the nurse take first?", opts: [O("Report the findings promptly and continue frequent neurovascular checks, because color, temperature, refill, and sensation are all abnormal", true, "Correct. Pale, cool, delayed refill for this age, and tingling each fail the CMS normals. Framework: safety first - circulation is threatened."), O("Reassure the patient that tingling is expected under a cast, and recheck the leg at the end of the shift today", false, "Tingling is paresthesia, a warning finding; end-of-shift recheck abandons a threatened limb."), O("Elevate the leg on two pillows and apply a warm compress, because warmth restores color to a pale cool foot", false, "Neither step is the chapter response to abnormal CMS findings; reporting and monitoring are."), O("Document the findings as the baseline for this cast, because the first check after casting sets the normal values", false, "Abnormal findings do not become baseline by being first; they are compared with the unaffected limb.")], tp: "Framework: safety first. CMS normals: color matches the other side, skin warm, refill within 3 seconds (5 only in older adults), no numbness or tingling." });
BANK.push({ cat: CC, type: "single", kt: ["compartment syndrome"], stem: "A patient who runs and cycles daily reports leg pain and cramping during workouts with visible muscle bulging, all easing when the workout stops. Which understanding guides the nurse's teaching?", opts: [O("This pattern fits chronic compartment syndrome, which is not an emergency and is relieved by stopping activity and resting", true, "Correct. Exercise-driven pain, cramping, bulging, and numbness relieved by rest define the chronic form. Framework: Nursing Process - distinguish chronic from acute before alarming the patient."), O("This pattern signals acute compartment syndrome, so the patient needs emergency pressure relief within 6 hours today", false, "The acute form follows casts, fractures, burns, or crush injury - not a workout pattern relieved by rest."), O("This pattern shows thrombophlebitis, because leg pain with bulging veins during exercise always means an inflamed clot", false, "Bulging muscle during exercise with relief at rest is the chronic compartment picture, not a clot picture."), O("This pattern is normal athlete soreness, so the patient can ignore it because no numbness accompanies the pain here", false, "Numbness is part of this patient's pattern, and the chapter names this cluster as chronic compartment syndrome.")], tp: "Framework: Nursing Process/ADPIE. Chronic compartment syndrome: exercise pain and cramping, bulging, numbness - relieved by rest; NOT an emergency." });
BANK.push({ cat: CC, type: "matrix", stem: "Classify each immobility complication by the mechanism that produces it.", cols: ["Pooling or stasis of fluids", "Loss of use, weight bearing, or stimulation"], rows: [{t: "Thrombophlebitis - decreased venous circulation in a patient who has not walked in days", a: 0, r: "Correct. Venous pooling in the lower extremities inflames vessels and forms clots."}, {t: "Disuse osteoporosis - bones demineralizing in a patient kept off his feet for weeks", a: 1, r: "Correct. Lack of weight bearing causes the demineralization behind disuse osteoporosis."}, {t: "Hypostatic pneumonia - secretions settling in the lungs of a patient who lies flat all day", a: 0, r: "Correct. Decreased aeration and accumulated secretions lead to lung inflammation and infection."}, {t: "Muscle atrophy - muscles shrinking in a limb the patient has not used since surgery", a: 1, r: "Correct. Muscles decrease in size and strength when not continually used."}], tp: "Framework: Nursing Process - mechanism sorts the complication. When movement stops: peristalsis slows, secretions pool, venous blood pools, muscles waste, bone demineralizes." });
BANK.push({ cat: CC, type: "dropdown", stem: "Complete the neurovascular check on a 72-year-old patient with a leg cast. The nurse presses the nail bed for about [[0]] and expects the blood to return within [[1]]. The nurse also asks about numbness or tingling, because paresthesia can signal [[2]].", blanks: [{o: [O("3 to 5 seconds", true, "Correct. Pressure on the nail bed is applied for approximately 3 to 5 seconds."), O("1 to 2 seconds", false, "A 1-to-2-second press is too brief to blanch the nail bed for the check."), O("8 to 10 seconds", false, "Eight to ten seconds of pressure exceeds the printed technique.")]}, {o: [O("5 seconds in this older adult", true, "Correct. Return within 3 seconds is standard; 5 seconds is allowed for older adult patients."), O("3 seconds with no age allowance", false, "The 3-second standard carries a 5-second allowance for older adults like this patient."), O("8 seconds in this older adult", false, "Eight seconds is delayed at any age and would be reported, not expected.")]}, {o: [O("nerve or circulatory impairment", true, "Correct. Loss of sensation may indicate nerve or circulatory impairment."), O("normal cast settling after application", false, "Tingling under a cast is a warning finding, not a settling sign to expect."), O("expected pain relief from the analgesic", false, "Paresthesia is a sensation finding to assess, not a sign of analgesic effect.")]}], tp: "CMS numbers: press 3-5 seconds; return within 3 seconds, 5 seconds for older adults; compare with the unaffected limb." });
BANK.push({ cat: CC, type: "single", stem: "After a fall during ambulation, which documentation set is complete?", opts: [O("How the fall occurred, distance walked, tolerance before the fall, symptoms reported, and assistance needed while walking", true, "Correct. Those five elements are the printed fall documentation set, plus an incident report if required. Framework: Nursing Process - documentation completes the response."), O("The patient's statement that the fall was the patient's own fault, signed and placed in the front of the chart today", false, "Blame statements are not part of the fall record; the factual circumstances are what get documented."), O("Only the injuries found after the fall, because uninjured falls do not require any documentation at all on the unit", false, "Injured or not, the circumstances of the fall are reported and documented the same way."), O("The names of staff the patient blames for the fall, because the incident report must assign responsibility first", false, "Incident reporting records facts about the event, not blame assignments by the patient.")], tp: "Framework: Nursing Process/ADPIE. After any fall: report and document the how, the distance, prior tolerance, prior symptoms, and assistance level; incident report if required." });
BANK.push({ cat: CC, type: "single", stem: "A patient on prolonged bed rest is found with reddened skin over the sacrum that does not blanch, noted during a turn. Which action set fits the chapter's prevention plan going forward?", opts: [O("Reposition at least every 2 hours, inspect dependent skin surfaces after every move, and keep meticulous skin care daily", true, "Correct. Two-hour repositioning, skin inspection after moves, and meticulous skin care are the printed plan. Framework: safety first - pressure is the cause."), O("Massage the reddened area vigorously at each turn, because friction brings blood back into ischemic tissue quickly", false, "Vigorous massage of ischemic tissue is not the plan; pressure relief and inspection are."), O("Keep the patient on the back for longer stretches, because turning itself is what damaged the skin over the sacrum", false, "Staying on the back longer increases the unrelieved pressure that caused the ischemia."), O("Apply a pillow under the knees to float the sacrum, because knee flexion lifts the pelvis off the mattress surface", false, "Pillows under the knees are prohibited, and knee flexion does not float the sacrum.")], tp: "Framework: safety first. Pressure ulcer prevention: reposition at least every 2 hours, inspect previously dependent skin after every move, meticulous skin care." });
BANK.push({ cat: CD, type: "single", stem: "Midway through passive ROM of a shoulder, a patient winces and the nurse feels the joint resist and tighten into spasm. Which action should the nurse take?", opts: [O("Discontinue the exercise, because pain, resistance, or muscle spasm are the signals to stop ROM", true, "Correct. Any of the three stop signals ends the exercise; the joint is never pushed through. Framework: safety first."), O("Continue more slowly through the spasm, because finishing the full sequence matters more than a brief spasm", false, "The sequence never outranks the stop signals; pushing through spasm risks injury to the joint."), O("Increase the range slightly to stretch out the spasm, because a spasm means the joint needs more movement", false, "Stretching into a spasm is the opposite of the stop rule and can damage the structures."), O("Skip only that joint and double the repetitions on the next one, because total repetitions must stay the same", false, "Repetitions are not a quota to protect; the stopped joint is the finding that matters.")], tp: "Framework: safety first. ROM stops for pain, resistance, or muscle spasm - and UAP must stop and alert the nurse for the same signals." });
BANK.push({ cat: CD, type: "single", stem: "A stroke patient can lift the weak right arm only halfway. The nurse plans the ROM type that uses the patient's own strong left arm to exercise the right. Which type is this?", opts: [O("Active-assisted ROM, in which the patient uses the strong arm to exercise the weaker or paralyzed arm", true, "Correct. The strong limb assisting the weak limb is active-assisted ROM. Framework: Nursing Process - maximize patient independence."), O("Passive ROM, in which caregivers perform the movements for a patient who cannot move the limb at all", false, "Passive ROM uses no patient effort; this patient contributes with the strong arm."), O("Active ROM, in which the patient performs the movement of the weak arm entirely without any assistance", false, "The weak arm cannot complete the movement alone, so this is not fully active ROM."), O("Passive-assisted ROM, in which the patient moves the limb partway and the nurse finishes the full range", false, "Passive-assisted uses the nurse to finish; here the patient's own strong arm does the assisting.")], tp: "Framework: Nursing Process/ADPIE. Encourage the patient to be as independent as possible: active-assisted uses the strong arm on the weak arm." });
BANK.push({ cat: CD, type: "single", stem: "A patient returns from total knee replacement with a CPM machine at the bedside. The order reads flexion to a set degree at a set speed. Which action is correct?", opts: [O("Adjust the machine settings to the provider's ordered degree and speed of flexion and extension for this patient", true, "Correct. CPM settings follow the individual provider's orders. Framework: safety first - ordered parameters govern devices."), O("Set the machine to its maximum flexion, because faster restoration of range shortens the rehabilitation stay", false, "Maximum settings ignore the ordered degree and risk harm to the fresh surgical joint."), O("Let the patient set the speed by comfort alone, because the orders only suggest a starting point for therapy", false, "Comfort feedback matters, but the settings are adjusted according to the provider's orders."), O("Skip the machine because physical therapy is scheduled, since the two therapies are never used together", false, "Physical therapy typically accompanies CPM; scheduling PT does not cancel the ordered machine.")], tp: "Framework: safety first. CPM after knee arthroplasty: settings per provider orders for degree and speed; PT typically accompanies it." });
BANK.push({ cat: CD, type: "single", stem: "An older adult with arthritis tires quickly during a full head-to-toe ROM session and needs extra time in the mornings. Which plan fits this patient?", opts: [O("Separate the ROM exercises into two or more sessions to control fatigue, and allow extra morning time before activity", true, "Correct. Split sessions for fatigue and slower mornings are the printed older-adult adjustments. Framework: Nursing Process - adapt the plan to the patient."), O("Complete the whole sequence in one early session, because splitting sessions reduces the benefit of the exercises", false, "Forcing one long session ignores fatigue control, which the chapter names for older adults."), O("Skip neck exercises entirely for this patient, because no neck movement of any kind is allowed in older adults", false, "Only neck hyperextension carries a caution in older adults; neck movement is not banned."), O("Schedule ROM before the analgesic takes effect, because morning stiffness must be worked through without medication", false, "Pain is medicated before painful activity; stiffness is a reason for time and analgesia, not for skipping both.")], tp: "Framework: Nursing Process/ADPIE. Older adults: split ROM into sessions for fatigue, allow morning time, use caution with neck hyperextension." });
BANK.push({ cat: CD, type: "matrix", stem: "Classify each exercise description by the joint movement it performs.", cols: ["Dorsiflexion", "Plantar flexion"], rows: [{t: "The nurse moves the patient's foot so the toes point upward toward the shin", a: 0, r: "Correct. Toes pointed upward is dorsiflexion, the foot-drop prevention position."}, {t: "The nurse moves the patient's foot so the toes point downward away from the shin", a: 1, r: "Correct. Toes pointed downward is plantar flexion, the position that produces foot drop if maintained."}, {t: "The patient holds the foot up against a footboard during hours of bed rest", a: 0, r: "Correct. A footboard maintains the foot in dorsiflexion to prevent foot drop."}, {t: "A patient's unsupported foot rests pointed down for days and begins to stay that way", a: 1, r: "Correct. A foot maintained in plantar flexion develops foot drop, a plantar-flexion deformity."}], tp: "Ankle pair: dorsiflexion toes up prevents foot drop; plantar flexion toes down produces it when maintained." });
BANK.push({ cat: CD, type: "single", stem: "A nurse documents a ROM session. Which documentation is complete for this chapter?", opts: [O("Joints exercised, edema or pressure areas present, any discomfort, ROM limitations, and the patient's tolerance", true, "Correct. Those five elements are the printed ROM documentation set. Framework: Nursing Process - documentation closes the intervention."), O("Only the joints exercised and the time, because tolerance and discomfort are subjective and do not belong in the record", false, "Tolerance, discomfort, limitations, and skin findings are required parts of this documentation."), O("The patient's promise to exercise alone next time, because independence is the outcome the record must prove", false, "A promise is not the session record; findings from the session performed are what get charted."), O("The number of staff present for the session, because staffing is the detail auditors check in ROM notes most often", false, "Staffing is not among the five printed elements for ROM documentation.")], tp: "Framework: Nursing Process/ADPIE. ROM documentation: joints exercised, edema or pressure areas, discomfort, limitations, tolerance." });
BANK.push({ cat: CD, type: "single", stem: "A patient with painful shoulder joints asks to stay in one comfortable position all day to avoid pain. Which response follows the chapter?", opts: [O("Explain that joints must be exercised routinely, because remaining in a comfort position leads to contracture", true, "Correct. Comfort positioning without exercise produces abnormal shortening of muscle - contracture. Framework: Nursing Process - teaching addresses the long-term harm."), O("Agree to the plan for today, because pain during ROM is a signal that the joint should rest until pain resolves fully", false, "Pain is managed with analgesia before activity; all-day stillness is the contracture pathway."), O("Offer to perform all movements for the patient forever, because passive movement removes any need for the patient to move", false, "The goal is the patient's own independence; passive-only care is for patients who cannot move."), O("Suggest doubling tomorrow's session to make up for today, because missed range can be recovered in one long session", false, "Doubling a session is not the plan; routine daily exercise prevents the shortening.")], tp: "Framework: Nursing Process/ADPIE. Do not let joint pain park a patient in one position: immobility in a position of comfort leads to contracture." });
BANK.push({ cat: CD, type: "order", stem: "A nurse performs passive ROM for an immobile patient. Put the steps of the exercise period in the correct order.", items: [{t: "Review the care plan, gather gloves, provide privacy, and medicate for pain as needed", r: "First: preparation - record review, privacy, draping, bed height, and analgesia as needed."}, {t: "Position the patient comfortably sitting or lying and support the part above and below the joint", r: "Second: cradling support proximal and distal to the joint protects weaker joints and muscles."}, {t: "Move each joint through its full range in head-to-toe sequence, to resistance or pain only", r: "Third: the exercises run head-to-toe, each joint to the point of resistance or pain, never beyond."}, {t: "Repeat the full sequence five times during the exercise period as tolerated", r: "Fourth: the full sequence is repeated five times during the exercise period."}, {t: "Document joints exercised, discomfort, limitations, and the patient's tolerance", r: "Last: documentation records joints, edema or pressure areas, discomfort, limitations, and tolerance."}], tp: "Framework: Nursing Process/ADPIE. ROM sequence: prepare and medicate, support the joint, head-to-toe to resistance or pain, five repetitions, document." });
BANK.push({ cat: CE, type: "single", kt: ["base of support"], stem: "A nurse boosts a patient up in bed using a lift sheet with a colleague. Which technique set is correct?", opts: [O("Patient supine and flat, sheet rolled close to the body, hands near the upper arms and hips, move on a count of 3", true, "Correct. Flat surface, sheet rolled close, grip at upper arms and hips, patient lifts the head on 3. Framework: safety first."), O("Patient sitting at 60 degrees, sheet held loosely at its corners, hands at the shoulders, move whenever ready to pull", false, "A raised bed adds resistance, loose corners lose control, and the move is coordinated on a count."), O("Patient supine with a pillow under the knees, sheet bunched at the waist, one nurse pulling from the head alone", false, "Pillows under knees are prohibited, the sheet spans shoulders to thighs, and the move takes two nurses."), O("Patient turned fully prone, sheet slid under the chest, hands at the elbows, move on a count of 5 to spread the effort", false, "Boosting is done supine, not prone, and the coordinating count in this chapter is 3.")], tp: "Framework: safety first. Boosting: flat and supine, lift sheet shoulders to thighs rolled close, grip at upper arms and hips, head lifts on count of 3." });
BANK.push({ cat: CE, type: "single", kt: ["logrolling"], stem: "A patient returns from spinal surgery with orders to keep the spinal column aligned during all turns. Which turning method and setup are required?", opts: [O("Logrolling with at least one additional person, a pillow between the legs, and a pull sheet from shoulders to knees", true, "Correct. Logrolling turns the patient as one unit with help, leg pillow, and a shoulders-to-knees sheet. Framework: safety first - alignment protects the spine."), O("A standard turn toward the raised side rail, with one nurse pulling the far shoulder and hip in two separate motions", false, "Separate shoulder and hip motions twist the spinal column, which this patient's orders forbid."), O("A lift sheet turn by two nurses standing on opposite sides, rolling the patient toward whichever side is free", false, "In logrolling both nurses stand on the same side and turn with one continuous coordinated effort."), O("A solo turn using the trapeze bar, letting the patient pull the trunk around while the nurse guides the legs after", false, "The trapeze turn moves trunk and legs out of sequence; logrolling moves the body as one unit.")], tp: "Framework: safety first. Logrolling: extra help, head of bed lowered as tolerated, pillow between legs, pull sheet shoulders to knees, both nurses same side, count of 3." });
BANK.push({ cat: CE, type: "single", stem: "During a bed-to-chair transfer, a patient reaches to wrap both arms around the nurse's neck as she begins to stand. Which action should the nurse take?", opts: [O("Stop and reposition the patient's hands onto the nurse's shoulders before continuing the stand on the count of 3", true, "Correct. Hands belong on the shoulders; arms around the neck can injure the nurse's neck. Framework: safety first."), O("Allow the hold this once because the patient is frightened, and correct the hand placement after she is seated again", false, "A frightened patient's neck hold is exactly when injury happens; placement is corrected before the stand."), O("Have the patient grip the gait belt instead, because the belt gives a stronger hold than the nurse's shoulders do", false, "The patient pushes on the mattress and holds the shoulders; the belt is the nurse's grip on the patient."), O("Lower the patient back to the bed and cancel the transfer, because a wrong hand placement ends the attempt entirely", false, "The fix is repositioning the hands and proceeding safely, not abandoning a needed transfer.")], tp: "Framework: safety first. Hands on the nurse's shoulders, never around the neck; brace knees against the patient's knees; stand on the count of 3." });
BANK.push({ cat: CE, type: "single", stem: "Midway through a hallway walk, a patient says the room is spinning, knees buckling. The nurse is supporting the patient with a gait belt. Which action should the nurse take first?", opts: [O("Bring the patient close, rest the patient's buttocks on the nurse's leg, and slide the patient down that leg to the floor", true, "Correct. The falling patient is eased down the nurse's leg, protecting the head and controlling direction. Framework: safety first."), O("Hold the patient upright with the gait belt until a second nurse arrives with a wheelchair from the nursing station", false, "Holding a buckling patient upright risks a collapse; the patient is eased to the floor now."), O("Lower the patient by bending at the waist and guiding the shoulders down, keeping both feet planted side by side", false, "Waist bending under a falling load injures the nurse; feet apart, back straight, slide down the leg."), O("Step back and let the patient sit down independently, because guiding a fall can injure the nurse's back seriously", false, "Stepping back abandons control of the fall; easing down the leg protects patient and nurse.")], tp: "Framework: safety first. A falling patient is never caught or held up: ease the patient to the floor down your leg, protect the head, call for assistance." });
BANK.push({ cat: CE, type: "order", stem: "A nurse transfers a patient from bed to wheelchair. Put the steps in the correct order.", items: [{t: "Assess pulse and respirations, then help the patient dangle with feet touching the floor", r: "First: baseline vitals and dangling come before any stand; feet must touch the floor."}, {t: "Place the wheelchair at a right angle to the bed and lock its wheels", r: "Second: the chair is positioned with the seat facing the foot of the bed and wheels locked."}, {t: "Stand in front, grasp the gait belt at each side, and brace knees against the patient's knees", r: "Third: the nurse's stance and knee brace prevent the patient's feet from slipping."}, {t: "Have the patient push down on the mattress and stand on the count of 3 as the nurse straightens the knees", r: "Fourth: the patient pushes, the nurse pulls to standing by straightening the knees, not the back."}, {t: "Pivot with the strong side toward the chair and lower the patient as hips and knees bend", r: "Fifth: strong side leads the pivot; lowering bends hips and knees with buttocks to the chair back."}, {t: "Reassess pulse, respirations, and previously dependent skin surfaces after the move", r: "Last: post-transfer assessment covers vitals response and the skin that bore pressure."}], tp: "Framework: safety first. Chair transfer: baseline and dangle, chair locked at right angle, belt and knee brace, stand on 3, pivot strong side first, reassess." });
BANK.push({ cat: CE, type: "single", stem: "A patient who cannot assist at all must be moved from bed to gurney for a procedure. The bed and gurney are the same height with wheels locked. Which plan is correct?", opts: [O("Five nurses: two reaching over the bed, two standing close to the gurney, one at the foot, lifting on a count of 3", true, "Correct. The non-assisting gurney transfer is staffed and positioned exactly this way. Framework: safety first."), O("Two nurses sliding the patient across on a bath blanket, because equal heights remove the need for a lifting team", false, "Equal heights help, but a patient who cannot assist is moved with the five-nurse team lift."), O("Three nurses using a roller device alone, because the device carries the patient's full weight during the slide", false, "Roller devices assist in some facilities; they do not replace the printed team arrangement."), O("One nurse at the head pulling by the shoulders while the patient crosses both arms over the chest for safety", false, "Crossed arms are part of the real setup, but a one-nurse shoulder pull is never the method.")], tp: "Framework: safety first. Unable to assist, bed to gurney: folded sheet or blanket head to midthighs rolled close, arms crossed, five nurses, count of 3." });
BANK.push({ cat: CE, type: "multi", stem: "A frightened patient is being transferred with a mechanical lift for the first time and keeps asking what is happening. Which actions does the skill require? Select all that apply.", opts: [O("Explain what is happening continually throughout the process, because the lift can frighten the patient", true, "Correct. Continual explanation during the lift is a stated requirement of the skill."), O("Support the patient's head during the transfer while the patient is suspended in the sling attachment", true, "Correct. Head support during a sling transfer is a named safety rule for mechanical lifts."), O("Have two staff members present for the transfer, in line with what most facilities require for lifts", true, "Correct. Two staff during a mechanical lift transfer is the usual facility requirement."), O("Fold the patient's arms over the chest once the head of the bed is raised, before pumping the lift", true, "Correct. Arms folded over the chest in the sitting position prevents patient injury during the lift."), O("Raise the patient quickly to shorten the frightening part, because speed reduces the time spent suspended", false, "Speed is not the comfort measure; the valve is released slowly and explanation is continual."), O("Leave the sling straps attached after seating, because removing them could startle the patient further", false, "Straps and the lift are removed after the patient is lowered and the valve is closed.")], tp: "Framework: safety first. Mechanical lift: two staff, head supported, arms folded over the chest, explain continually, lower slowly by the valve." });
BANK.push({ cat: CE, type: "dropdown", stem: "Complete the plan for moving a patient up in bed with a lift sheet. The patient is placed [[0]] to create less resistance. The sheet is placed under the patient from [[1]]. The nurses grasp the sheet with hands near the patient's [[2]].", blanks: [{o: [O("supine with the head flat", true, "Correct. A flat supine surface creates less resistance for the move up in bed."), O("sitting at 60 degrees", false, "Sitting up adds resistance; the patient is flat for the boost."), O("prone with face to one side", false, "Boosting is never done prone; the patient lies supine.")]}, {o: [O("shoulders to thighs", true, "Correct. The lift sheet is rolled under the patient spanning shoulders to thighs."), O("waist to knees only", false, "A waist-to-knees sheet leaves the shoulders unsupported during the move."), O("neck to ankles fully", false, "The sheet spans shoulders to thighs, not the full body length.")]}, {o: [O("upper arms and hips", true, "Correct. Hands grip near the upper arms and hips with the sheet rolled close to the patient."), O("elbows and knees", false, "Grip points are the upper arms and hips, not the elbows and knees."), O("shoulders and ankles", false, "Ankle grips belong to a different transfer, not the lift-sheet boost.")]}], tp: "Lift sheet boost: flat and supine, sheet shoulders to thighs rolled close, grip at upper arms and hips, move on the count of 3." });
BANK.push({ cat: CE, type: "single", stem: "Before a first dangle after surgery, a nurse plans the sequence. Which statement about dangling is correct?", opts: [O("Pulse and respirations are assessed first for a baseline, the bed is lowered, and the legs swing off as the patient pivots to sitting", true, "Correct. Baseline vitals, lowest bed, and a one-motion pivot with legs swinging describe dangling. Framework: Nursing Process - baseline before activity."), O("The patient dangles only after walking to the chair once, because dangling is a rest step used between walks in the hallway", false, "Dangling precedes standing and walking; it is not a rest step inserted after a walk."), O("Slippers are put on after the patient is standing, because footwear interferes with swinging the legs off the bed edge", false, "Slippers go on while the patient is still in bed, before the stand, and legs are covered with a blanket."), O("The patient's feet may hang above the floor while dangling, because contact with the floor is only needed when standing", false, "Feet must touch the floor during dangling; dangling with feet hanging free is not the skill.")], tp: "Framework: Nursing Process/ADPIE. Dangling: baseline pulse and respirations, bed at lowest, pivot to sitting in one motion, feet touching the floor, slippers on in bed." });
BANK.push({ cat: CE, type: "single", stem: "Two nurses turn an immobile patient to the lateral position. Which detail protects the patient's skin during and after the turn?", opts: [O("A pad or pillow is placed between the legs, reducing pressure on the lower leg and avoiding skin-on-skin contact", true, "Correct. The between-legs pillow prevents skin breakdown from skin-on-skin contact and pressure. Framework: safety first - skin protection is built into the turn."), O("The patient is dragged across the sheet toward the nurse, because sliding friction warms the skin and improves its blood flow", false, "Dragging creates shearing forces that damage skin; a lift sheet slide is the protected method."), O("The lower leg is left resting directly on the upper leg, because bone-on-bone contact keeps the hips in proper alignment", false, "Skin on skin and unrelieved pressure are what the between-legs pillow exists to prevent."), O("The back pillow is omitted, because a pillow behind the back traps heat against the skin and raises breakdown risk", false, "A pillow folded lengthwise behind the back supports the lateral position and is part of the skill.")], tp: "Framework: safety first. Turning: move the patient to one side first, pillow between the legs, pillow under the head, back supported with a lengthwise pillow." });
BANK.push({ cat: CF, type: "single", stem: "A nurse delegates bed-to-chair transfers and ROM to a UAP who has demonstrated good body mechanics and safe lift use. The patient then needs teaching on using a new walker. Which action is correct?", opts: [O("The nurse performs the walker teaching personally, because teaching assistive device use is not delegated to UAP", true, "Correct. Device teaching requires a nurse; the transfers and ROM were properly delegated. Framework: Nursing Process - delegation follows the task, not the worker alone."), O("The UAP teaches the walker use, because demonstrated transfer skill qualifies the worker to teach related skills too", false, "Teaching is the carved-out exception; transfer competence does not extend to patient teaching."), O("The physical therapist must do all walker teaching, because nurses never teach assistive devices in this setting", false, "Nurses do teach device use; spinal cord and orthopedic patients learn from nurses or PT."), O("Walker teaching is postponed until discharge day, because device teaching is a discharge-only nursing activity", false, "Teaching happens during care when the device is introduced, not saved for discharge day.")], tp: "Framework: Nursing Process/ADPIE. Delegatable to competent UAP: position changes, ROM, transfers, lift transfers. Never delegated: teaching assistive device use." });
BANK.push({ cat: CF, type: "single", stem: "A UAP performing delegated ROM feels resistance and sees a muscle spasm in the patient's knee. Which action should the UAP take?", opts: [O("Stop the exercise and alert the LPN/LVN, because resistance or spasm means the nurse must reassess the patient", true, "Correct. UAP stop for resistance or spasm and the nurse reassesses before any further exercise. Framework: safety first."), O("Continue gently through the spasm, because delegated tasks must be completed once they have been started for the day", false, "Completing the task never outranks the stop signals; resistance and spasm end the exercise."), O("Note the spasm and finish the remaining repetitions, because the nurse reviews all ROM notes at the end of shift", false, "Charting and continuing is the failure mode; the instruction is stop and alert the nurse."), O("Switch to the other leg and report both legs together, because reporting mid-task delays the rest of the assignment", false, "The report is immediate for the affected joint; delay and task-shuffling are not the instruction.")], tp: "Framework: safety first. Delegated ROM: slow, support the joint, never past resistance, fatigue, or pain - stop and alert the nurse for resistance or spasm." });
BANK.push({ cat: CF, type: "multi", stem: "A nurse is preparing home care teaching for a family who will move and position a patient at home. Which points belong in the teaching? Select all that apply.", opts: [O("Use a gait belt and correct body mechanics for transfers, and make slow, gradual position changes every time", true, "Correct. Gait belt, body mechanics, and slow gradual changes are core home transfer teaching."), O("Change the patient's position every 1 to 2 hours and post a realistic turning schedule in the home", true, "Correct. The 1-to-2-hour home turning interval with a posted schedule is the printed home standard."), O("Do not attempt ambulation when the patient reports dizziness or lightheadedness at home before a walk", true, "Correct. Home caregivers are instructed not to ambulate a dizzy or lightheaded patient."), O("Remove home risks such as throw rugs, electric cords, and slippery floors before ambulation practice", true, "Correct. A home cleared of throw rugs, cords, and slippery floors is part of the home plan."), O("Fill the walker carrying bag fully before walks, because carrying supplies keeps the hands free and steady", false, "An overfilled walker bag can tip the walker forward; the caution is printed the other way."), O("Attempt transfers without practice sessions, because skills learned at home transfer better than hospital practice", false, "Family practice the transfer in the hospital and achieve success before taking the patient home.")], tp: "Framework: Nursing Process - teaching. Home mobility: gait belt and mechanics, turns every 1 to 2 hours with a posted schedule, no ambulation when dizzy, clear the home of risks." });
BANK.push({ cat: CF, type: "single", stem: "A patient with left shoulder trauma has the goal of self-assisting with dressing within 3 days, with pain down to 4 out of 10. Which intervention set serves this care plan?", opts: [O("Offer the analgesic 30 minutes before ROM exercises and schedule active ROM between meals and hygiene activities", true, "Correct. Analgesic timing plus ROM scheduled between meals and hygiene is the Care Plan 8.1 pattern. Framework: Nursing Process - interventions timed to the goal."), O("Offer the analgesic after ROM exercises end and schedule all exercises during meals to save nursing time today", false, "Post-exercise dosing misses the painful work, and exercising during meals fights the patient's rest and intake."), O("Perform all dressing and ROM for the patient until day 3, because assistance now guarantees the goal is met on time", false, "Doing everything for the patient builds dependence and defeats a self-assist goal outright."), O("Skip ROM on days the pain is above 4, because the outcome measure makes any higher pain a failed session to avoid", false, "Pain above target is managed with timed analgesia and exercises, not by cancelling the exercises.")], tp: "Framework: Nursing Process/ADPIE. Care Plan 8.1: analgesic 30 minutes before ROM so the peak lands as exercises begin; ROM between meals and hygiene." });
BANK.push({ cat: CF, type: "multi", stem: "A nurse notices a long-term care patient on prolonged bed rest keeps returning to one favorite position between scheduled turns. Which actions fit this patient? Select all that apply.", opts: [O("Assess the patient frequently and turn more often than the standard schedule when the pattern requires it", true, "Correct. Patients who revert to a favorite position are assessed often and turned more often as needed."), O("Use a lift sheet as often as possible for moves, to prevent shearing force on the patient's fragile skin", true, "Correct. Frequent lift-sheet use protects fragile skin from shearing in long-term care patients."), O("Let the patient assist with moving and positioning whenever possible, to promote the patient's independence", true, "Correct. Patient assistance in moves is encouraged whenever possible to protect independence."), O("Restrain the patient in the new position after each turn, because returning to a favorite position shows noncompliance", false, "Restraint is not a mobility intervention; the answer is assessment and more frequent turning."), O("Document the favorite position as the new baseline and stop turning, because the body chooses its best alignment", false, "A favored position still pools pressure; turning continues and increases, never stops.")], tp: "Framework: Nursing Process/ADPIE. Long-term care: revert-to-favorite-position patients get frequent assessment, extra turns, lift-sheet moves, and maximal self-assistance." });
BANK.push({ cat: CF, type: "single", stem: "At evaluation after a transfer, which data best tell the nurse about pain, motivation, and self-care potential?", opts: [O("The patient's behavioral response to the transfer, together with a pain rating on a scale of 1 to 10 after the move", true, "Correct. Behavior during transfer reveals pain, motivation, and self-care potential; the 1-to-10 rating gauges pain control needs. Framework: Nursing Process - evaluation uses observed response."), O("The time the transfer took compared with other patients, because faster transfers always show better self-care potential", false, "Speed comparisons between patients do not reveal this patient's pain or motivation."), O("The number of staff the transfer required, because needing fewer staff proves the patient's pain is fully controlled", false, "Staffing counts reflect safety planning, not the patient's pain experience or motivation."), O("The patient's weight trend for the week, because weight change is the outcome measure printed for transfer evaluation", false, "Weight trend is not the evaluation signal named for transfers in this chapter.")], tp: "Framework: Nursing Process/ADPIE. Evaluation: ask the patient to rate pain 1 to 10; the behavioral response to transfer reveals pain, motivation, and self-care potential." });
BANK.push({ cat: CC, type: "multi", kt: ["compartment syndrome"], grp: "case1", scen: "CASE STUDY - Mr. Alvarez, 58, is 8 hours post open reduction and internal fixation of a fractured right tibia and now wears a long-leg cast. Pain was 4 out of 10 at the last check. On this round the nurse finds: pain now 9 out of 10 and not relieved by the analgesic given 30 minutes ago, pain sharply worse when the toes are gently moved, a tight and full feeling in the calf, tingling in the foot, toes slightly pale compared with the left foot, and capillary refill of 4 seconds in the casted foot. The left foot is warm and pink with refill of 2 seconds.", stem: "CASE STUDY 1 of 6 - RECOGNIZE CUES: Which findings in this assessment require immediate action? Select all that apply.", opts: [O("Pain of 9 out of 10 that the analgesic given 30 minutes ago did not relieve", true, "Correct. Escalating pain unrelieved by analgesia is the earliest warning of rising compartment pressure. Framework: safety first."), O("Pain that sharpens when the toes of the casted foot are gently moved", true, "Correct. Pain when the muscle is stretched is the hallmark early cue of compartment syndrome. Framework: safety first."), O("A tight, full feeling in the calf of the casted leg reported by the patient", true, "Correct. A full or tight feeling in the muscle is a printed warning sign of the syndrome. Framework: safety first."), O("Tingling in the foot of the casted leg, new since the previous neurovascular check", true, "Correct. Tingling is paresthesia, one of the early sensory warnings in the limb. Framework: safety first."), O("Capillary refill of 2 seconds in the uninjured left foot with warm pink toes", false, "Incorrect. The left foot findings are the normal comparison standard, not a cue for action.")], tp: "Framework: safety first. Recognize cues: pain out of proportion and on stretch, tightness, and paresthesias come first - numbness and paralysis are late." });
BANK.push({ cat: CC, type: "single", kt: ["compartment syndrome"], grp: "case1", scen: "CASE STUDY - Mr. Alvarez, 58, is 8 hours post open reduction and internal fixation of a fractured right tibia and now wears a long-leg cast. Pain was 4 out of 10 at the last check. On this round the nurse finds: pain now 9 out of 10 and not relieved by the analgesic given 30 minutes ago, pain sharply worse when the toes are gently moved, a tight and full feeling in the calf, tingling in the foot, toes slightly pale compared with the left foot, and capillary refill of 4 seconds in the casted foot. The left foot is warm and pink with refill of 2 seconds.", stem: "CASE STUDY 2 of 6 - ANALYZE CUES: The nurse compares the two feet and links the cue cluster. Which interpretation is most accurate?", opts: [O("Rising pressure inside the fascia compartment of the casted leg is cutting off circulation to the muscle and nerves", true, "Correct. The cluster matches acute compartment syndrome: pressure climbs inside the closed fascia compartment. Framework: Nursing Process - analysis links cues to the mechanism."), O("The cast is simply tight from normal postoperative swelling, so the findings will resolve as the leg rests tonight", false, "Normal swelling does not produce unrelieved 9-out-of-10 pain with pain on stretch and paresthesia."), O("A blood clot has formed in the deep veins of the calf, and the foot findings come from venous pooling alone now", false, "Thrombophlebitis produces pooled-blood signs; pain on stretch and tightness point to compartment pressure."), O("The analgesic dose was too small for this patient, and the entire cluster is explained by undertreated routine pain", false, "Undertreated pain does not explain pain on passive stretch, tightness, tingling, and delayed refill together.")], tp: "Framework: Nursing Process/ADPIE. Analyze cues: a cast plus fracture plus this cluster means pressure inside an inelastic fascia compartment exceeding capillary pressure." });
BANK.push({ cat: CC, type: "single", grp: "case1", scen: "CASE STUDY - Mr. Alvarez, 58, is 8 hours post open reduction and internal fixation of a fractured right tibia and now wears a long-leg cast. Pain was 4 out of 10 at the last check. On this round the nurse finds: pain now 9 out of 10 and not relieved by the analgesic given 30 minutes ago, pain sharply worse when the toes are gently moved, a tight and full feeling in the calf, tingling in the foot, toes slightly pale compared with the left foot, and capillary refill of 4 seconds in the casted foot. The left foot is warm and pink with refill of 2 seconds.", stem: "CASE STUDY 3 of 6 - PRIORITIZE HYPOTHESES: Which problem is the nurse's priority for this patient right now?", opts: [O("Acute compartment syndrome in the casted leg, because irreversible muscle and nerve damage can occur within 6 hours", true, "Correct. The 6-hour window to irreversible damage makes this the priority problem. Framework: safety first - time-critical tissue threat outranks comfort goals."), O("Routine postoperative pain control, because the pain score is the highest abnormal number in the assessment set", false, "Pain here is a symptom of the pressure emergency; treating the score alone leaves pressure rising."), O("Risk for constipation from immobility, because the patient will be non-weight-bearing for several weeks of recovery", false, "Constipation is a real later risk, but it is chronic and slow next to a 6-hour tissue deadline."), O("Anxiety about the cast, because the patient keeps reporting sensations from the leg and asking for checks often", false, "Frequent reports are the warning system working; the reports describe a physical emergency, not anxiety.")], tp: "Framework: safety first, acute vs chronic. Compartment syndrome is the priority: irreversible muscle function loss can occur within 6 hours if compression is not reversed." });
BANK.push({ cat: CC, type: "multi", grp: "case1", scen: "CASE STUDY - Mr. Alvarez, 58, is 8 hours post open reduction and internal fixation of a fractured right tibia and now wears a long-leg cast. Pain was 4 out of 10 at the last check. On this round the nurse finds: pain now 9 out of 10 and not relieved by the analgesic given 30 minutes ago, pain sharply worse when the toes are gently moved, a tight and full feeling in the calf, tingling in the foot, toes slightly pale compared with the left foot, and capillary refill of 4 seconds in the casted foot. The left foot is warm and pink with refill of 2 seconds.", stem: "CASE STUDY 4 of 6 - GENERATE SOLUTIONS: Which actions belong in the nurse's plan for this patient? Select all that apply.", opts: [O("Remove the external pressure immediately by cutting away the cast material compressing the leg", true, "Correct. When an external device causes the syndrome, the pressure comes off immediately by cutting the device away."), O("Report the escalating findings to the provider immediately, because this is an emergency situation", true, "Correct. Escalating pain, paresthesia, and tightness are reported immediately as an emergency."), O("Continue frequent neurovascular checks comparing the casted limb with the unaffected limb each time", true, "Correct. CMS checks against the unaffected side track whether pressure is still rising."), O("Prepare for possible fasciotomy in case the pressure source is not relieved by removing the cast", true, "Correct. If other factors drive the syndrome, surgical release by fasciotomy may be required."), O("Increase the analgesic and reassess in 4 hours, because pain control is the measure of whether pressure is falling", false, "Analgesia does not release the compartment; waiting 4 hours burns most of the 6-hour window."), O("Wait for numbness to appear before acting, because numbness confirms the diagnosis beyond any doubt today", false, "Numbness is a late sign that may indicate permanent damage; acting waits for pain and stretch pain.")], tp: "Framework: safety first. Generate solutions: cut away the external pressure, report immediately, keep CMS checks frequent, prepare for fasciotomy if needed." });
BANK.push({ cat: CC, type: "single", grp: "case1", scen: "CASE STUDY - Mr. Alvarez, 58, is 8 hours post open reduction and internal fixation of a fractured right tibia and now wears a long-leg cast. Pain was 4 out of 10 at the last check. On this round the nurse finds: pain now 9 out of 10 and not relieved by the analgesic given 30 minutes ago, pain sharply worse when the toes are gently moved, a tight and full feeling in the calf, tingling in the foot, toes slightly pale compared with the left foot, and capillary refill of 4 seconds in the casted foot. The left foot is warm and pink with refill of 2 seconds.", stem: "CASE STUDY 5 of 6 - TAKE ACTION: Which action should the nurse carry out first for this patient?", opts: [O("Cut away the cast material causing the external pressure on the leg, and notify the provider of the emergency", true, "Correct. External pressure is removed immediately; reporting happens with the same urgency. Framework: ABCs/safety - circulation to the limb is the threatened system."), O("Give a second dose of analgesic and elevate the leg, then reassess the pain score in 30 minutes for a trend", false, "More analgesia treats the report of pain while pressure keeps destroying muscle and nerve."), O("Apply a fresh, snugger dressing over the cast edges, because loose edges can let swelling shift into the foot", false, "Adding compression over a compartment already under pressure worsens the ischemia."), O("Document the findings thoroughly and hand the concern to the next shift, because 8 hours post-op is still early", false, "Documentation and handoff without action spend the exact hours the tissue cannot spare.")], tp: "Framework: safety first. Take action: pressure from an external device comes off immediately - cut the device away; fasciotomy is for causes that are not an external device." });
BANK.push({ cat: CC, type: "single", kt: ["fasciotomy"], grp: "case1", scen: "CASE STUDY - Mr. Alvarez, 58, is 8 hours post open reduction and internal fixation of a fractured right tibia and now wears a long-leg cast. Pain was 4 out of 10 at the last check. On this round the nurse finds: pain now 9 out of 10 and not relieved by the analgesic given 30 minutes ago, pain sharply worse when the toes are gently moved, a tight and full feeling in the calf, tingling in the foot, toes slightly pale compared with the left foot, and capillary refill of 4 seconds in the casted foot. The left foot is warm and pink with refill of 2 seconds.", stem: "CASE STUDY 6 of 6 - EVALUATE OUTCOMES: Thirty minutes after the cast is cut away and the provider is notified, which finding shows the intervention is working?", opts: [O("Pain easing toward the earlier 4 out of 10, tingling fading, and refill returning toward the other foot's 2 seconds", true, "Correct. Falling pain, resolving paresthesia, and refill matching the unaffected side show pressure relief. Framework: Nursing Process - evaluation compares against the unaffected limb."), O("New numbness in the foot with loss of toe movement, because a quiet limb means the pain problem has settled at last", false, "Numbness and paralysis are late signs of permanent damage - the worst outcome, not relief."), O("Pain unchanged at 9 out of 10 but the patient now sleeping, because sleep proves the analgesic finally took effect", false, "Sleep with unchanged stretch pain and tightness means the pressure problem is still active."), O("Refill still 4 seconds with toes paler than before, because color changes lag behind pressure relief by many hours", false, "Worsening color and refill after pressure removal signal failure requiring escalation, likely fasciotomy.")], tp: "Framework: Nursing Process/ADPIE. Evaluate: relief shows as pain falling, paresthesia resolving, and CMS findings converging on the unaffected limb." });
