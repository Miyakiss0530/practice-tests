<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Hypoxia, Oxygen Basics & Delivery Devices";
var CB = "Oxygen Safety, COPD & Home Care";
var CC = "Oxygen Administration & Airway Suctioning";
var CD = "Tracheostomy & Artificial Airways";
var CATS = [CA, CB, CC, CD];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 21,
  "types": {
   "single": 14,
   "multi": 3,
   "dropdown": 2,
   "order": 1,
   "matrix": 1
  }
 },
 CB: {
  "name": CB,
  "count": 11,
  "types": {
   "single": 8,
   "multi": 2,
   "dropdown": 1
  }
 },
 CC: {
  "name": CC,
  "count": 13,
  "types": {
   "single": 9,
   "multi": 2,
   "order": 1,
   "matrix": 1
  }
 },
 CD: {
  "name": CD,
  "count": 15,
  "types": {
   "single": 11,
   "multi": 2,
   "order": 1,
   "dropdown": 1
  }
 }
};

BANK.push({ cat: CA, type: "single", stem: "CASE STUDY 1 of 6 — RECOGNIZE CUES: Which finding set requires the nurse's immediate attention first?", opts: [O("T 98.9 F, a dry cough, and a request to sit in the chair", false, "Incorrect. A normal temperature, a dry cough, and a chair request are stable findings; they do not signal failing oxygenation."), O("Family visiting, T 98.9 F, and a request for the television", false, "Incorrect. Visiting and television requests are comfort items; Maslow puts physiologic oxygen needs first."), O("Breakfast tray uneaten, T 98.9 F, and dry mucous membranes", false, "Incorrect. A missed meal and dry membranes need routine attention later; they are not the immediate hypoxia threat."), O("Restlessness, anxiety, HR 118, RR 28, and PaO2 62 mm Hg", true, "Correct. Restlessness and anxiety with tachycardia, deep tachypnea, and a PaO2 of 62 mm Hg are Box 14.2 hypoxia cues. ABCs framework: airway and breathing cues outrank every comfort cue.")], tp: "Recognize cues first: restlessness, anxiety, rising pulse and respirations, and a falling PaO2 mark hypoxia (ABCs).", grp: "case1", scen: "CASE STUDY — Mr. R., 68 years old, has COPD and is admitted with worsening shortness of breath. He is restless and anxious, says he cannot catch his breath, and has a dry, nonproductive cough. Vital signs: T 98.9 F, HR 118, RR 28 and deep, BP 152/88. Arterial blood gas on room air: PaO2 62 mm Hg. He sits upright in bed using accessory muscles, his mucous membranes look pale, and the monitor shows an occasionally irregular pulse. The provider orders oxygen by nasal cannula at 2 L/min, a repeat ABG in 1 hour, and continuous monitoring." });

BANK.push({ cat: CA, type: "single", stem: "CASE STUDY 2 of 6 — ANALYZE CUES: How should the nurse interpret the PaO2 of 62 mm Hg for this patient?", opts: [O("It is below the normal 80 to 100 mm Hg range and confirms tissue hypoxia risk", true, "Correct. PaO2 normally runs 80 to 100 mm Hg in arterial blood; 62 mm Hg is hypoxemia that fits his hypoxia cues. Nursing Process: analysis links the value to the cue cluster."), O("It is within the normal 80 to 100 mm Hg range expected for a 68-year-old adult", false, "Incorrect. A 70-year-old may run 80 to 85 mm Hg without significant change; 62 mm Hg is below even the age-adjusted range."), O("It is a venous value that cannot be compared with the arterial normal range set", false, "Incorrect. The result came from an arterial blood gas, so it is compared directly with the arterial range of 80 to 100 mm Hg."), O("It is above the normal 80 to 100 mm Hg range and suggests oxygen toxicity risk", false, "Incorrect. 62 mm Hg is below the range, not above it; oxygen toxicity is a risk of prolonged high oxygen, not this value.")], tp: "Analyze cues against the numbers: PaO2 normal 80 to 100 mm Hg; even in COPD, a value below 80 mm Hg is abnormal.", grp: "case1", scen: "CASE STUDY — Mr. R., 68 years old, has COPD and is admitted with worsening shortness of breath. He is restless and anxious, says he cannot catch his breath, and has a dry, nonproductive cough. Vital signs: T 98.9 F, HR 118, RR 28 and deep, BP 152/88. Arterial blood gas on room air: PaO2 62 mm Hg. He sits upright in bed using accessory muscles, his mucous membranes look pale, and the monitor shows an occasionally irregular pulse. The provider orders oxygen by nasal cannula at 2 L/min, a repeat ABG in 1 hour, and continuous monitoring." });

BANK.push({ cat: CA, type: "single", stem: "CASE STUDY 3 of 6 — PRIORITIZE HYPOTHESES: Which patient problem is the priority for Mr. R.?", opts: [O("Inability to tolerate activity from an oxygen supply and demand imbalance", false, "Incorrect. Activity intolerance is a real Box 14.3 problem, but it is a lower priority than the failing breathing pattern itself."), O("Inability to maintain adequate breathing pattern from respiratory fatigue", true, "Correct. Box 14.3 pairs this problem with respiratory muscle weakness, fatigue, and abnormal breathing patterns, all present here. ABCs framework: the breathing problem outranks anxiety and activity problems."), O("Compromised verbal communication related to the presence of a tracheostomy", false, "Incorrect. Mr. R. has no tracheostomy and is speaking; this Box 14.3 problem does not apply to him."), O("Anxiousness and fearfulness related to dyspnea and feelings of suffocation", false, "Incorrect. His anxiety is genuine and listed in Box 14.3, but Maslow and ABCs place the physiologic breathing failure first.")], tp: "Prioritize with ABCs: breathing pattern and oxygenation first; anxiety and activity problems follow.", grp: "case1", scen: "CASE STUDY — Mr. R., 68 years old, has COPD and is admitted with worsening shortness of breath. He is restless and anxious, says he cannot catch his breath, and has a dry, nonproductive cough. Vital signs: T 98.9 F, HR 118, RR 28 and deep, BP 152/88. Arterial blood gas on room air: PaO2 62 mm Hg. He sits upright in bed using accessory muscles, his mucous membranes look pale, and the monitor shows an occasionally irregular pulse. The provider orders oxygen by nasal cannula at 2 L/min, a repeat ABG in 1 hour, and continuous monitoring." });

BANK.push({ cat: CA, type: "multi", stem: "CASE STUDY 4 of 6 — GENERATE SOLUTIONS: Which actions should the nurse include in the plan for Mr. R.? Select all that apply.", opts: [O("Position the patient in semi-Fowler's position for maximum lung expansion", true, "Correct. Fowler's or semi-Fowler's positioning allows maximum lung expansion and is part of Skill 14.1. ABCs: positioning is a first-line breathing intervention."), O("Give a sedative so the patient rests and the respiratory rate settles", false, "Incorrect. Sedatives are given with caution around respiratory patients because they can depress the respiratory center."), O("Give oxygen by nasal cannula at the ordered rate of 2 L/min and monitor", true, "Correct. Oxygen is a drug given exactly as ordered; 2 L/min respects the COPD caution threshold while treating hypoxia."), O("Review the repeat arterial blood gas results when they are available", true, "Correct. ABG results confirm airway patency and the need for, and response to, oxygen therapy."), O("Raise the cannula flow to 6 L/min to correct the hypoxia more quickly", false, "Incorrect. In COPD the hypoxic drive drives breathing; flows greater than 2 L/min can eliminate that drive and breathing may stop.")], tp: "Generate solutions inside the order and the COPD limits: position, ordered 2 L/min, monitor, recheck the ABG.", grp: "case1", scen: "CASE STUDY — Mr. R., 68 years old, has COPD and is admitted with worsening shortness of breath. He is restless and anxious, says he cannot catch his breath, and has a dry, nonproductive cough. Vital signs: T 98.9 F, HR 118, RR 28 and deep, BP 152/88. Arterial blood gas on room air: PaO2 62 mm Hg. He sits upright in bed using accessory muscles, his mucous membranes look pale, and the monitor shows an occasionally irregular pulse. The provider orders oxygen by nasal cannula at 2 L/min, a repeat ABG in 1 hour, and continuous monitoring." });

BANK.push({ cat: CA, type: "dropdown", stem: "CASE STUDY 5 of 6 — TAKE ACTION: The nurse sets up the ordered oxygen for Mr. R. The flowmeter is set to [[0]], the humidifier is filled [[1]], and the patient is positioned [[2]].", blanks: [{ o: [O("4 L/min, midway within the cannula flow range", false, "Incorrect. Midway is still double the order; oxygen flow is never averaged or rounded by the nurse."), O("2 L/min, matching the provider order exactly", true, "Correct. Oxygen is treated as a drug: the flowmeter is set to the ordered 2 L/min, which also respects the COPD caution limit."), O("6 L/min, the highest rate the cannula allows", false, "Incorrect. 6 L/min triples the order and exceeds the COPD caution threshold of 2 L/min, risking loss of the hypoxic drive.")] }, { o: [O("with sterile saline, with bubbling verified first", false, "Incorrect. The bubbling check is right, but the fluid is wrong; humidifiers take distilled water, not saline."), O("with distilled water, with bubbling verified first", true, "Correct. Humidifiers are filled with distilled water only, and bubbling is verified before delivery to the patient."), O("with tap water, with bubbling verified before use", false, "Incorrect. Tap water is never used in a humidifier; distilled water decreases growth of microorganisms.")] }, { o: [O("in semi-Fowler's position for lung expansion", true, "Correct. Semi-Fowler's positioning allows maximum lung expansion while oxygen is delivered."), O("in Trendelenburg position with legs elevated", false, "Incorrect. Head-down positioning works against lung expansion and is never used to deliver oxygen therapy."), O("flat on the back with the head turned aside", false, "Incorrect. Flat positioning restricts lung expansion; it is reserved for situations such as an unconscious suctioning patient.")] }], tp: "Take action exactly as ordered: 2 L/min, distilled water with bubbling, semi-Fowler's position (ABCs plus COPD caution).", grp: "case1", scen: "CASE STUDY — Mr. R., 68 years old, has COPD and is admitted with worsening shortness of breath. He is restless and anxious, says he cannot catch his breath, and has a dry, nonproductive cough. Vital signs: T 98.9 F, HR 118, RR 28 and deep, BP 152/88. Arterial blood gas on room air: PaO2 62 mm Hg. He sits upright in bed using accessory muscles, his mucous membranes look pale, and the monitor shows an occasionally irregular pulse. The provider orders oxygen by nasal cannula at 2 L/min, a repeat ABG in 1 hour, and continuous monitoring." });

BANK.push({ cat: CA, type: "single", stem: "CASE STUDY 6 of 6 — EVALUATE OUTCOMES: One hour later, which evaluation finding shows Mr. R.'s hypoxia is worsening?", opts: [O("Respirations are regular at 18/min, pulse is 90, and he is conversing", false, "Incorrect. Regular breathing and comfortable conversation indicate adequate oxygenation, not deterioration."), O("Respirations are shallow at 10/min, pulse is 52, and he is drowsy", true, "Correct. Advancing hypoxia reverses the early pattern: respirations become shallow and slower and bradycardia develops, with falling consciousness. ABCs: report and act at once."), O("Respirations are even at 16/min, pulse is 84, and he is resting calmly", false, "Incorrect. Even respirations, a normal pulse, and calm rest show the therapy is working, not worsening hypoxia."), O("Respirations are unlabored at 20/min, pulse is 92, and color is pinker", false, "Incorrect. Unlabored breathing with improving color is an expected, improving response to oxygen therapy.")], tp: "Evaluate against the hypoxia timeline: early = fast and anxious; late = slow, shallow, bradycardic, drowsy (ABCs).", grp: "case1", scen: "CASE STUDY — Mr. R., 68 years old, has COPD and is admitted with worsening shortness of breath. He is restless and anxious, says he cannot catch his breath, and has a dry, nonproductive cough. Vital signs: T 98.9 F, HR 118, RR 28 and deep, BP 152/88. Arterial blood gas on room air: PaO2 62 mm Hg. He sits upright in bed using accessory muscles, his mucous membranes look pale, and the monitor shows an occasionally irregular pulse. The provider orders oxygen by nasal cannula at 2 L/min, a repeat ABG in 1 hour, and continuous monitoring." });

BANK.push({ cat: CA, type: "single", stem: "A provider orders a precise, controlled oxygen concentration for a patient with chronic lung disease. Which device should the nurse select?", opts: [O("Venturi mask at 4 to 10 L/min for a precise, controlled concentration", true, "Correct. The Venturi mask is the device chosen when a precise, controlled concentration is required; its range is 24% to 55%."), O("Nonrebreather mask at 6 to 15 L/min for a precise, controlled concentration", false, "Incorrect. The nonrebreather delivers the highest concentration, 70% to 100%, not a precise low controlled one."), O("Simple face mask at 5 to 8 L/min for a precise, controlled concentration", false, "Incorrect. The simple mask delivers 35% to 55% without the Venturi mask's controlled, precise delivery."), O("Nasal cannula at 1 to 6 L/min for a precise, controlled concentration", false, "Incorrect. The cannula is the most common device, but its delivery varies with breathing and is not the precise, controlled option.")], tp: "Device selection follows the goal: Venturi = precise and controlled; nonrebreather = highest FiO2." });

BANK.push({ cat: CA, type: "single", stem: "A patient with severe hypoxia needs the highest FiO2 available by mask while the provider is notified. Which setup should the nurse apply?", opts: [O("Venturi mask at 4 to 10 L/min delivering 24% to 55% oxygen", false, "Incorrect. The Venturi range of 24% to 55% serves controlled low-dose needs, not maximum oxygen delivery."), O("Oxymizer device at 1 to 15 L/min delivering 29% to 50% oxygen", false, "Incorrect. The oxymizer conserves oxygen for stable patients; 29% to 50% is far too low for severe hypoxia."), O("Nonrebreather mask at 6 to 15 L/min delivering 70% to 100% oxygen", true, "Correct. Table 14.1 gives the nonrebreather the highest range, 70% to 100% at 6 to 15 L/min. ABCs: maximize oxygen delivery while escalating care."), O("Partial rebreather mask at 6 to 12 L/min delivering 60% to 90% oxygen", false, "Incorrect. The partial rebreather tops out at 90%, below the nonrebreather range for this severe hypoxia.")], tp: "Highest mask FiO2 = nonrebreather, 70% to 100%; fill the reservoir bag before placing it." });

BANK.push({ cat: CA, type: "single", stem: "While checking a partial rebreather mask, the nurse sees the reservoir bag stay fully inflated through inhalation. What should the nurse do?", opts: [O("The mask is delivering too much oxygen; lower the flow rate below the order now", false, "Incorrect. The nurse never lowers flow below the provider order; the problem is assessed and corrected within the order."), O("The mask is functioning as expected; the reservoir should stay fully inflated", false, "Incorrect. That describes neither mask: the partial reservoir should almost collapse on inhalation."), O("The mask is functioning as expected; document the finding and recheck in 4 hours", false, "Incorrect. A non-moving reservoir means oxygen delivery is compromised now; waiting 4 hours leaves the patient under-oxygenated."), O("The mask is not functioning as expected; check the fit, seal, and flow rate now", true, "Correct. A properly working partial rebreather reservoir almost collapses on inhalation; a bag that never moves signals a fit, seal, or flow problem. Safety first: fix delivery before leaving the room.")], tp: "Reservoir behavior is the bedside function test: partial = almost collapses; nonrebreather = never totally collapses." });

BANK.push({ cat: CA, type: "single", stem: "A nonrebreather mask reservoir fills on exhalation and never totally collapses on inhalation. How should the nurse evaluate this finding?", opts: [O("The mask is leaking at the seal and the straps need immediate replacement", false, "Incorrect. The described reservoir pattern is normal function, not a seal leak; no intervention is needed for this finding."), O("The mask is malfunctioning and the reservoir bag should collapse fully", false, "Incorrect. Full collapse on inhalation would be wrong for a nonrebreather; that near-collapse belongs to the partial rebreather."), O("The mask is delivering room air only and the flow source needs checking", false, "Incorrect. A filling reservoir confirms oxygen flow is reaching the bag; the pattern described is proper function."), O("The mask is functioning properly and oxygen delivery is being maintained", true, "Correct. Filling on exhalation without totally collapsing on inhalation is the printed sign of a properly working nonrebreather mask. Nursing Process: this is an expected evaluation finding.")], tp: "Evaluate by the printed standard: nonrebreather reservoir never totally collapses on inhalation when working properly." });

BANK.push({ cat: CA, type: "single", stem: "An arterial blood gas for a 70-year-old patient shows a PaO2 of 83 mm Hg. The patient is alert with even respirations. What should the nurse do?", opts: [O("Accept the value as expected for age and continue routine monitoring", true, "Correct. The chapter notes a 70-year-old may run a PaO2 of 80 to 85 mm Hg without significant alterations in health. Stable vs unstable: this patient is stable."), O("Increase the oxygen flow beyond the order until the value exceeds 100", false, "Incorrect. Chasing a value above 100 mm Hg exceeds the order and risks oxygen toxicity; oxygen is dosed by order."), O("Repeat the blood gas immediately because the value must be a lab error", false, "Incorrect. The value matches the printed older-adult range, so there is no reason to suspect a lab error."), O("Report the value at once as severe hypoxia and prepare for intubation", false, "Incorrect. 83 mm Hg sits inside the age-expected band of 80 to 85 mm Hg; it is not severe hypoxia.")], tp: "Age-adjust the number: PaO2 80 to 85 mm Hg can be expected at 70 years; the overall range stays 80 to 100 mm Hg." });

BANK.push({ cat: CA, type: "single", stem: "A patient on oxygen was restless with HR 124 and RR 30 an hour ago. Now the patient is quiet, with HR 54, RR 9 and shallow, and is hard to arouse. Which action should the nurse take first?", opts: [O("Conclude the patient is finally resting and continue routine hourly rounding", false, "Incorrect. Quiet with bradycardia and shallow breathing at RR 9 is deterioration, not rest; rounding alone delays rescue."), O("Recognize advancing hypoxia, support the airway, and notify the provider at once", true, "Correct. The pattern flipped from compensation to failure: bradycardia, shallow slow respirations, and falling consciousness mark advancing hypoxia. ABCs framework: airway and breathing come first."), O("Document improvement because the pulse and respirations have both slowed down", false, "Incorrect. Slowing rates after a hypoxic surge signal decompensation and falling oxygen saturation, not improvement."), O("Remove the oxygen because the patient appears calm and no longer needs support", false, "Incorrect. Removing oxygen from a decompensating hypoxic patient worsens the emergency; support and escalate instead.")], tp: "Late hypoxia looks deceptively calm: slow pulse, shallow slow breathing, dropping consciousness = act now (ABCs)." });

BANK.push({ cat: CA, type: "single", stem: "The nurse notices the reservoirs on a patient's oxymizer are deflating during therapy. What is the correct interpretation and action?", opts: [O("Deflated reservoirs mean the flow is too low; double the ordered rate immediately", false, "Incorrect. The nurse never doubles an ordered rate; the device is inspected and the order is followed."), O("Deflated reservoirs raise the delivered percentage; document and continue therapy", false, "Incorrect. Deflation lowers, never raises, the delivered percentage; documenting and continuing leaves the patient short."), O("Deflated reservoirs do not affect delivery; recheck them at the end of the shift", false, "Incorrect. Reservoir inflation is what conserves oxygen in this device, so deflation is a same-moment problem."), O("Deflated reservoirs lower the delivered percentage; inspect and correct the device", true, "Correct. The chapter directs checking that oxymizer reservoirs do not deflate, because deflation lowers the percentage of oxygen delivered.")], tp: "Oxymizer check: reservoirs must stay inflated; deflation = lower FiO2 delivered." });

BANK.push({ cat: CA, type: "single", stem: "A patient's daughter asks the nurse to turn the oxygen up from the ordered 3 L/min because her father 'looks air hungry.' What should the nurse do?", opts: [O("Raise the rate only if the family signs the consent form at the bedside today", false, "Incorrect. Consent paperwork does not substitute for a provider order for a drug such as oxygen."), O("Turn the oxygen off until the provider can reassess the patient in person", false, "Incorrect. Stopping ordered oxygen harms a patient who looks air hungry; keep the order and escalate the assessment."), O("Keep the ordered rate, assess the patient fully, and notify the provider of findings", true, "Correct. Oxygen is a drug: the rate changes only on a provider order. Nursing Process: assess first, then escalate the findings to the provider."), O("Raise the rate to 5 L/min, reassess in one hour, and chart the family request", false, "Incorrect. A family request never authorizes a rate change; oxygen flow is adjusted only within a provider order.")], tp: "Family requests do not change drug orders: assess, keep the ordered rate, and report findings to the provider." });

BANK.push({ cat: CA, type: "single", stem: "The nurse sets an oxygen flowmeter and notices the top of the metal ball sits on the prescribed line. What should the nurse do?", opts: [O("Readjust so the middle of the ball sits on the prescribed line before use", true, "Correct. The flowmeter is read at the middle of the metal ball; the top reading overstates the set flow."), O("Readjust so the bottom of the ball sits on the prescribed line before use", false, "Incorrect. The bottom reading understates the flow; the chapter specifies the middle of the ball."), O("Turn the flow fully off and restart the entire oxygen setup from the wall", false, "Incorrect. A full restart wastes time; a simple readjustment to the middle-of-ball reading corrects it."), O("Leave the setting because the top of the ball is the correct reading point", false, "Incorrect. The chapter specifies the middle of the ball as the reading point, not the top.")], tp: "Flowmeter reading point: the MIDDLE of the metal ball on the line for the prescribed flow." });

BANK.push({ cat: CA, type: "single", stem: "During an assessment, the nurse notes digital clubbing in a patient with long-standing chronic lung disease. How should the nurse interpret this finding?", opts: [O("Clubbing points to chronic hypoxia rather than a new, acute oxygen problem", true, "Correct. Box 14.2 lists digital clubbing with chronic hypoxia; it develops over time. Acute vs chronic framework: this is a chronic marker, not tonight's emergency."), O("Clubbing points to oxygen toxicity from flows kept too high for many weeks", false, "Incorrect. Oxygen toxicity scars respiratory tissue and can cause blindness; it does not produce clubbing."), O("Clubbing points to a flowmeter error that has under-delivered for many weeks", false, "Incorrect. Clubbing reflects the patient chronic hypoxia, not a device reading error."), O("Clubbing points to an acute hypoxia episode that began within the last hour", false, "Incorrect. Clubbing cannot develop in an hour; acute hypoxia shows restlessness, tachycardia, and color change instead.")], tp: "Clubbing = chronic hypoxia sign. Acute hypoxia declares itself in behavior, vital signs, and color." });

BANK.push({ cat: CA, type: "multi", stem: "A 72-year-old patient with pneumonia is admitted. Which assessment findings match the chapter list of hypoxia signs? Select all that apply.", opts: [O("An irregular pulse rhythm noted while taking the apical pulse", true, "Correct. Box 14.2 lists cardiac dysrhythmias among the signs of hypoxia."), O("Calm, focused attention during a long teaching conversation", false, "Incorrect. Hypoxia decreases concentration and raises restlessness; calm focus argues against hypoxia."), O("Restlessness and new difficulty concentrating on conversation", true, "Correct. Box 14.2 lists restlessness and decreased ability to concentrate among the signs of hypoxia."), O("Bluish color of the mucous membranes seen on oral assessment", true, "Correct. Box 14.2 lists cyanosis, seen in the color of the mucous membranes, among the signs of hypoxia."), O("Pink mucous membranes with a slow, steady, regular pulse rate", false, "Incorrect. Pink membranes and a steady regular pulse are reassuring findings, not hypoxia signs.")], tp: "Box 14.2 in a real patient: behavior changes, dysrhythmias, cyanosis, falling concentration and consciousness." });

BANK.push({ cat: CA, type: "multi", stem: "The nurse teaches a hypoxic patient how to support oxygenation at home. Which instructions should the nurse include? Select all that apply.", opts: [O("Drink extra caffeinated, sugary drinks to stay well hydrated", false, "Incorrect. Drinks high in caffeine and sugar sometimes cause dehydration; fluids free of them are recommended."), O("Adjust the flow rate at home whenever breathing feels harder", false, "Incorrect. The dangers of adjusting the flow rate without notifying the provider are stressed in teaching."), O("Keep up fluid intake to help liquefy secretions for coughing", true, "Correct. Adequate fluid intake helps liquefy secretions so they can be coughed up."), O("Avoid dairy products because they tend to thicken secretions", true, "Correct. The chapter teaches avoiding dairy products, which tend to thicken secretions."), O("Ambulate or change positions often to help mobilize secretions", true, "Correct. The chapter teaches ambulating or changing positions frequently to mobilize secretions.")], tp: "Home oxygenation teaching: move often, fluids without caffeine or sugar, skip dairy, never self-adjust the flow." });

BANK.push({ cat: CA, type: "order", stem: "A nurse is preparing to administer oxygen by nasal cannula (Skill 14.1). Place the steps in the correct order.", items: [{"t": "Check the provider order and review the arterial blood gas results", "r": "First. The order is verified and ABG results are reviewed to confirm patency and the need for oxygen."}, {"t": "Auscultate lung sounds and observe for signs of hypoxia or distress", "r": "Second. Baseline lung sounds and Box 14.2 signs are gathered before oxygen is given."}, {"t": "Position the patient in Fowler's or semi-Fowler's position in bed", "r": "Third. Upright positioning for maximum lung expansion happens before the device is applied."}, {"t": "Set the flowmeter, verify humidifier bubbling, and apply the device", "r": "Fourth. Flow is set to the order, bubbling confirms humidification, and the device is placed."}, {"t": "Reassess lung sounds and document flow, method, and patient response", "r": "Fifth. Lung sounds are rechecked and the administration is documented after delivery."}], tp: "Skill 14.1 order: order and ABG, baseline assessment, position, set up and apply, reassess and document (ADPIE)." });

BANK.push({ cat: CA, type: "dropdown", stem: "Two oxygen orders arrive together. For the patient who needs a precise, controlled concentration, the nurse selects [[0]]. For the patient who needs the highest FiO2 a mask can deliver, the nurse selects [[1]].", blanks: [{ o: [O("a simple face mask run at 5 to 8 L/min", false, "Incorrect. The simple mask delivers 35% to 55% but without the Venturi mask controlled precision."), O("a nasal cannula run at 1 to 6 L/min", false, "Incorrect. Cannula delivery varies with the patient breathing pattern and is not precisely controlled."), O("a Venturi mask run at 4 to 10 L/min", true, "Correct. The Venturi mask delivers the precise, controlled concentration this patient needs.")] }, { o: [O("a nonrebreather mask run at 6 to 15 L/min", true, "Correct. The nonrebreather delivers 70% to 100%, the highest FiO2 available from a mask."), O("a partial rebreather run at 6 to 12 L/min", false, "Incorrect. The partial rebreather delivers 60% to 90%, high but below the nonrebreather range."), O("an oxymizer device run at 1 to 15 L/min", false, "Incorrect. The oxymizer delivers 29% to 50%; it conserves oxygen rather than maximizing it.")] }], tp: "Match device to goal: Venturi for precision, nonrebreather for maximum FiO2 (Table 14.1)." });

BANK.push({ cat: CA, type: "matrix", stem: "For each finding, select the mask it describes.", cols: ["Partial rebreather mask", "Nonrebreather mask"], rows: [{"t": "Reservoir almost collapses when the patient inhales", "a": 0, "r": "Correct for the partial rebreather: its reservoir almost collapses on inhalation when functioning properly."}, {"t": "Reservoir never totally collapses when the patient inhales", "a": 1, "r": "Correct for the nonrebreather: its reservoir never totally collapses on inhalation when functioning properly."}, {"t": "Delivers 60% to 90% oxygen at 6 to 12 L/min flow", "a": 0, "r": "Correct for the partial rebreather: Table 14.1 pairs it with 6 to 12 L/min and 60% to 90% oxygen."}, {"t": "Delivers 70% to 100% oxygen at 6 to 15 L/min flow", "a": 1, "r": "Correct for the nonrebreather: Table 14.1 pairs it with 6 to 15 L/min and 70% to 100% oxygen."}], tp: "Reservoir pair trap: partial almost collapses at 60% to 90%; nonrebreather never totally collapses at 70% to 100%." });

BANK.push({ cat: CB, type: "single", stem: "A patient's son lights a cigarette at the bedside while oxygen is running by nasal cannula. Which action should the nurse take first?", opts: [O("Allow one cigarette because the window in the room can be opened", false, "Incorrect. An open window does not make smoking safe around oxygen; combustion risk remains at any flow."), O("Ask the visitor to finish quickly, then post the warning signs", false, "Incorrect. Every second of smoking beside oxygen is a fire risk; the smoking stops now, signs come after."), O("Move the oxygen tubing away and let the visit continue as planned", false, "Incorrect. Moving tubing does not remove the hazard; the cigarette itself must be stopped."), O("Stop the smoking at once and explain that oxygen supports combustion", true, "Correct. Oxygen supports combustion, so the ignition source is removed immediately. Safety first framework: eliminate the fire hazard before any teaching or documentation.")], tp: "Oxygen plus ignition = stop first, teach second. Oxygen supports combustion at any flow rate." });

BANK.push({ cat: CB, type: "single", stem: "A patient on oxygen has dry, cracked lips and asks for petroleum jelly. Which response by the nurse is correct?", opts: [O("Use any lotion available because dry, cracked skin matters more than fire risk", false, "Incorrect. Skin care matters, but it is met with water-soluble products; fire risk is never traded away."), O("Use a water-soluble lubricant and keep petrolatum products away from oxygen", true, "Correct. Petrolatum products are avoided during oxygen use because of combustibility; mouth care uses moisturizing, water-soluble agents instead."), O("Use petroleum jelly sparingly because small amounts cannot support combustion", false, "Incorrect. Box 14.1 avoids petrolatum products outright during oxygen use; there is no safe small amount exception."), O("Stop the oxygen for one hour so petroleum jelly can be applied safely at night", false, "Incorrect. Ordered oxygen is never stopped for a cosmetic product; switch the product, not the therapy.")], tp: "Petrolatum and oxygen never mix. Frequent mouth care with water-soluble moisturizer treats dry, cracked lips." });

BANK.push({ cat: CB, type: "single", stem: "A patient receiving oxygen asks to use an electric razor and a heating pad at the bedside. Which action should the nurse take?", opts: [O("Refuse both items and explain the combustion risk while oxygen is running", true, "Correct. Box 14.1 avoids electrical appliances such as razors, blankets, and heating pads while oxygen is administered."), O("Allow both items if the oxygen flow stays at or below 2 L/min that shift", false, "Incorrect. Combustion precautions apply at every flow rate, not only above a threshold."), O("Allow the razor but refuse the pad because only pads are named in the box", false, "Incorrect. Razors are named in the same precaution list as heating pads; both are avoided."), O("Allow both items once the No Smoking sign is posted on the room door", false, "Incorrect. Signage warns people; it does not make spark-producing appliances safe beside oxygen.")], tp: "Electrical appliances and oxygen do not mix: razors, heating pads, and electric blankets are all avoided." });

BANK.push({ cat: CB, type: "single", stem: "During transport, the nurse finds a portable oxygen cylinder leaning unchained against a radiator. Which action is correct?", opts: [O("Secure the cylinder upright in a proper carrier away from the heat source", true, "Correct. Cylinders are secured in proper carriers so they cannot fall or tip, and they are kept away from heat sources such as radiators."), O("Lay the cylinder flat on the floor until the transport is ready to leave", false, "Incorrect. A loose cylinder on the floor can roll and become a projectile; it is secured upright instead."), O("Leave the cylinder because transport equipment is the family responsibility", false, "Incorrect. The nurse is responsible for ensuring oxygen is administered and stored safely, including during transport."), O("Move the cylinder closer to the radiator so the valve stays easy to reach", false, "Incorrect. Heat sources are a named hazard; cylinders are kept away from lamps and radiators, never closer.")], tp: "Cylinder rules: upright, secured, away from heat. An unsecured cylinder can become a projectile." });

BANK.push({ cat: CB, type: "single", stem: "A nurse is busy and asks a UAP to raise a patient's oxygen from 2 L/min to 3 L/min. Which statement describes the correct delegation decision?", opts: [O("The UAP adjusts the flow after the nurse explains the possible complications", false, "Incorrect. Instruction about complications supports delegating device placement, never flow-rate adjustment."), O("The nurse adjusts the flow personally; UAP may only place and adjust devices", true, "Correct. Adjustment of the oxygen flow rate is NOT delegated to UAP. Only correct placement and adjustment of devices may be delegated, after instruction."), O("The UAP adjusts the flow if the patient asks for more oxygen during the shift", false, "Incorrect. A patient request does not expand UAP scope; flow changes stay with the nurse and the provider order."), O("The UAP adjusts the flow whenever the nurse is busy with another patient", false, "Incorrect. Nurse workload never changes delegation law; the flow rate is the nurse responsibility at all times.")], tp: "Delegation trap: placement yes, flow rate never. The nurse adjusts flow and evaluates the response." });

BANK.push({ cat: CB, type: "single", stem: "The nurse evaluates home oxygen teaching for a patient with COPD. Which patient statement indicates an understanding of the teaching?", opts: [O("\"I will keep the flow at 2 L/min and call before changing it for any reason\"", true, "Correct. Home teaching stresses maintaining a constant flow rate and changing it only with the provider knowledge and advice. A statement of understanding keeps the rate and calls first."), O("\"I will share my tubing with my spouse when her breathing feels short too\"", false, "Incorrect. Oxygen is prescribed per patient and equipment is not shared; the spouse needs her own evaluation."), O("\"I will turn it up to 4 L/min on days when my breathing feels much harder\"", false, "Incorrect. Self-raising the flow is exactly what teaching warns against, and in COPD extra flow can remove the hypoxic drive."), O("\"I will turn it off at night because my drive works better while sleeping\"", false, "Incorrect. Turning oxygen off at night abandons the prescribed therapy; the flow stays constant as ordered.")], tp: "Understanding = constant ordered flow, changes only with provider knowledge. COPD makes self-titration dangerous." });

BANK.push({ cat: CB, type: "single", stem: "During a home oxygen visit, which finding requires the nurse to correct the setup?", opts: [O("Cylinders stored lying down, unchained, beside the living room radiator", true, "Correct. Home cylinders are stored upright and chained on appropriate holders, away from heat; this setup violates both rules and risks a projectile and fire."), O("Two complete sets of tubing stored in a clean, dry cabinet drawer", false, "Incorrect. Two complete tubing sets are recommended so one is available while the other is cleaned or repaired."), O("A three-pronged outlet available for the oxygen compressor plug", false, "Incorrect. A three-pronged outlet for the compressor is required to prevent electric shock; this finding is correct."), O("A No Smoking sign posted on both the front and the back entry doors", false, "Incorrect. Signs on all entry doors are exactly what home oxygen teaching requires; no correction is needed.")], tp: "Home check: cylinders upright and chained, signs on entry doors, two tubing sets, three-prong outlet, distilled water." });

BANK.push({ cat: CB, type: "single", stem: "An 84-year-old patient on a nasal cannula has reddened skin over both ears where the tubing rests. Which action should the nurse take?", opts: [O("Tighten the straps so the tubing stops moving across the reddened skin", false, "Incorrect. Tightening raises pressure on already impaired skin and worsens the breakdown risk."), O("Apply petroleum jelly over the ears and leave the tubing as it is now", false, "Incorrect. Petrolatum is avoided with oxygen, and leaving pressure unchanged lets the skin break down further."), O("Remove the cannula entirely and document the oxygen as refused by staff", false, "Incorrect. Ordered oxygen continues; the fix is mechanical, loosening, repositioning, and padding the tubing."), O("Loosen the straps, reposition the tubing, and add padding over the ears", true, "Correct. Older adults are at increased risk for skin impairment over the ears; early interventions are loosening straps, repositioning tubing, and adding padding.")], tp: "Cannula ear care in older adults: loosen, reposition, pad. Check nares and ears every 6 to 8 hours." });

BANK.push({ cat: CB, type: "multi", stem: "The nurse teaches a family starting home oxygen. Which instructions should the nurse include? Select all that apply.", opts: [O("Post a No Smoking sign on all entry doors of the house at home", true, "Correct. Home care teaching includes posting a No Smoking sign on all entry doors of the house."), O("Store the oxygen cylinders upright and chained in proper holders", true, "Correct. Cylinders are stored upright, chained on appropriate holders, so they do not fall over."), O("Keep one set of tubing only so supplies are never wasted at home", false, "Incorrect. Two complete sets are provided so one is available while the other is cleaned or repaired."), O("Fill humidifier bottles with distilled water every 24 hours", true, "Correct. Home humidifier bottles are filled with distilled water only, refilled every 24 hours."), O("Fill humidifier bottles with tap water when distilled runs out", false, "Incorrect. Tap water is never used in a humidifier, at home or in the facility; distilled water only.")], tp: "Home oxygen package: signs on doors, upright chained cylinders, distilled water every 24 hours, two tubing sets." });

BANK.push({ cat: CB, type: "multi", stem: "Which safety measures belong in the room of a patient receiving oxygen? Select all that apply.", opts: [O("Know the fire procedure and where the extinguishers are located", true, "Correct. Box 14.1 includes knowing the facility fire procedure and fire extinguisher locations."), O("Store spare cylinders beside the radiator to keep them within reach", false, "Incorrect. Cylinders are kept away from heat sources such as radiators and are secured so they cannot tip."), O("Check that electrical equipment is grounded with three-prong plugs", true, "Correct. Box 14.1 requires properly functioning, well-grounded electrical equipment and uncluttered cords."), O("Keep wool blankets on the bed because the patient feels cold often", false, "Incorrect. Wool blankets are on the avoid list during oxygen administration because of combustion risk."), O("Post Oxygen in Use signs where they are easily seen in the room", true, "Correct. Box 14.1 directs placing No Smoking or Oxygen in Use signs where they are easily seen.")], tp: "Box 14.1 at the bedside: signs visible, grounded equipment, fire procedure known, no wool, no heat-side cylinders." });

BANK.push({ cat: CB, type: "dropdown", stem: "A patient starting home oxygen is taught the safety rules. The patient is taught to keep the flow [[0]], to fill the humidifier [[1]], and to store cylinders [[2]].", blanks: [{ o: [O("at the prescribed rate unless the provider advises a change", true, "Correct. Home teaching stresses a constant flow rate, changed only with provider knowledge and advice."), O("lower at night so the respiratory drive stays stronger", false, "Incorrect. Lowering the flow at night abandons the prescription; the rate stays constant around the clock."), O("higher whenever breathing feels harder during the day", false, "Incorrect. Raising the flow at home without provider advice is the exact behavior teaching warns against.")] }, { o: [O("with distilled water, refilled every 24 hours at home", true, "Correct. Home humidifier bottles take distilled water only and are refilled every 24 hours."), O("with distilled water, refilled once every week at home", false, "Incorrect. The water is right but the schedule is wrong; home bottles are refilled every 24 hours."), O("with tap water, refilled every 24 hours at home", false, "Incorrect. The schedule is right but the water is wrong; tap water is never used in a humidifier.")] }, { o: [O("upright and chained so they cannot fall or tip over", true, "Correct. Cylinders are stored upright, chained on appropriate holders, to prevent falling."), O("beside the radiator so the valves stay easy to open", false, "Incorrect. Cylinders are kept away from heat sources such as radiators, never stored beside them."), O("lying flat under the bed so they cannot be tripped on", false, "Incorrect. Loose cylinders can roll and become projectiles; they are stored upright and secured.")] }], tp: "Home oxygen rules in one pass: constant rate, distilled water every 24 hours, upright chained cylinders." });

BANK.push({ cat: CC, type: "single", stem: "A nurse is about to administer oxygen to a newly admitted patient. Which action comes first?", opts: [O("Identify the patient by room number, then begin the oxygen at the ordered rate", false, "Incorrect. Room number is never an identifier; the bracelet and the patient stated name or birth date are used."), O("Explain the procedure first, then check the order after the oxygen is running", false, "Incorrect. Explanation is Step 4, after the order check and identification; oxygen never starts before the order is verified."), O("Check the provider order, then identify the patient by bracelet and stated name", true, "Correct. Standard Step 1 verifies the provider order before any procedure starts, and identification uses the bracelet plus the patient stating name or birth date."), O("Assemble the equipment first, then check the order if time permits that shift", false, "Incorrect. Equipment assembly is Step 8; order verification is Step 1 and is never skipped for time.")], tp: "Standard Steps order protects the patient: verify the order, identify, explain, assess, then proceed." });

BANK.push({ cat: CC, type: "single", stem: "Oxygen by cannula at 3 L/min was started at 0900. Which documentation is complete for this administration?", opts: [O("Date, time, flow rate, delivery method, respiratory status, and family response", false, "Incorrect. The response documented is the patient response to therapy, not the family response."), O("Date, time, room number, visitor names, respiratory status, and patient response", false, "Incorrect. Room number and visitor names are not oxygen documentation; flow rate and delivery method are missing here."), O("Date, time, flow rate, delivery method, respiratory status, and patient response", true, "Correct. Skill 14.1 documentation includes date, time, flow rate, method of delivery, evaluation of respiratory status, and the patient response, plus order changes, adverse reactions, skin condition, and teaching."), O("Date, time, flow rate, delivery method, meal intake, and the patient response", false, "Incorrect. Meal intake is not part of oxygen documentation; respiratory status evaluation is required instead.")], tp: "Document oxygen like a drug: date, time, flow, method, respiratory evaluation, response, skin, teaching." });

BANK.push({ cat: CC, type: "single", stem: "Before placing a reservoir mask on a patient, which step should the nurse complete?", opts: [O("Place the mask first and let the bag fill while the patient wears it in bed", false, "Incorrect. An unfilled bag delivers room air at first; the bag is filled before placement, not after."), O("Squeeze the reservoir bag empty before placing the mask on the patient face", false, "Incorrect. Emptying the bag defeats its purpose; the bag must be full of oxygen when the mask is placed."), O("Remove the reservoir bag because it interferes with the mask seal on the face", false, "Incorrect. The reservoir bag is what stores the oxygen that makes these masks high-concentration devices."), O("Cover the reservoir hole and let the bag fill completely before placing the mask", true, "Correct. Skill 14.1 directs covering the reservoir hole and allowing the bag to fill completely BEFORE the mask goes on the patient.")], tp: "Reservoir masks: fill the bag first, then place the mask. An empty bag means the first breaths are room air." });

BANK.push({ cat: CC, type: "single", stem: "A patient becomes panicky and pulls at a newly placed oxygen mask, saying it feels like suffocation. Which action should the nurse take?", opts: [O("Hold the mask firmly in place until the patient stops resisting the treatment", false, "Incorrect. Forcing the mask raises apprehension and fights the patient; the skill builds acceptance through patient control."), O("Tighten the straps quickly so the mask cannot be pulled away by the patient", false, "Incorrect. Tighter straps increase the trapped feeling and risk skin breakdown under the mask and straps."), O("Let the patient hold and place the mask to gain control and ease apprehension", true, "Correct. A mask can cause feelings of suffocation and apprehension; letting the patient hold and place it builds control and acceptance."), O("Remove the oxygen entirely and document the treatment as refused by patient", false, "Incorrect. Ordered oxygen is not abandoned at the first sign of apprehension; coaching and patient placement come first.")], tp: "Mask apprehension is expected: let the patient hold and place the mask; never force or strap down against panic." });

BANK.push({ cat: CC, type: "single", stem: "A patient on a nasal cannula becomes more dyspneic, and the nurse feels no oxygen flow at the prongs. Which action should the nurse take first?", opts: [O("Check the cannula for obstruction and confirm flow at the prescribed setting", true, "Correct. Skill 14.1 directs evaluating the cannula frequently for possible obstruction. Nursing Process: assess the equipment and airway before changing any therapy."), O("Increase the flow beyond the order and recheck the patient again in one hour", false, "Incorrect. Raising flow past the order without finding the cause can still deliver nothing through a blocked cannula."), O("Document the dyspnea and wait for the next scheduled respiratory assessment", false, "Incorrect. New dyspnea with no felt flow is an immediate assessment problem, not a wait-and-document finding."), O("Remove the cannula and switch to a mask without an order from the provider", false, "Incorrect. Changing the delivery device requires an order; the first step is checking the existing system.")], tp: "No flow felt = check for obstruction first. Equipment checks are part of every respiratory reassessment." });

BANK.push({ cat: CC, type: "single", stem: "A postoperative patient has gurgling respirations, is drooling and restless, and has vomitus in the mouth. Which action should the nurse take first?", opts: [O("Give oral fluids to wash the secretions down and reassess in thirty minutes", false, "Incorrect. Fluids given into an obstructed, gurgling airway risk aspiration; suctioning comes first."), O("Offer a sedative because restlessness is the main problem at this moment", false, "Incorrect. The restlessness here signals retained secretions and airway compromise, not a need for sedation."), O("Suction the oropharynx to clear the airway, then reassess breathing status", true, "Correct. Gurgling, drooling, restlessness, and vomitus are the Skill 14.5 signs that suctioning is needed. ABCs framework: clear the airway first, then reassess."), O("Lower the head of the bed flat and document the findings for the provider", false, "Incorrect. Flat positioning worsens drainage and aspiration risk; the patient is positioned to promote drainage and suctioned.")], tp: "Gurgling plus drooling plus vomitus plus restlessness = suction now (ABCs), then evaluate breathing and color." });

BANK.push({ cat: CC, type: "single", stem: "The nurse prepares nasotracheal suctioning for an adult patient. Which suction setup is correct?", opts: [O("Set suction at 160 to 180 mm Hg and use a 16-Fr to 18-Fr catheter size", false, "Incorrect. Pressures and sizes above the adult range raise the risk of trauma to the nasal and tracheal mucosa."), O("Set suction at 100 to 120 mm Hg and use a 10-Fr to 12-Fr catheter size", false, "Incorrect. 100 to 120 mm Hg with a 10-Fr to 12-Fr catheter is the child setup, below the adult ranges."), O("Set suction at 120 to 150 mm Hg and use a 12-Fr to 14-Fr catheter size", true, "Correct. Skill 14.5 pairs adults with 120 to 150 mm Hg of vacuum and a 12-Fr to 14-Fr catheter."), O("Set suction at 60 to 80 mm Hg and use a 6-Fr to 8-Fr catheter size here", false, "Incorrect. 60 to 80 mm Hg with a 6-Fr to 8-Fr catheter is the infant setup, too weak and too small for an adult.")], tp: "Suction by age: infants 60 to 80 and 6 to 8 Fr; children 100 to 120 and 10 to 12 Fr; adults 120 to 150 and 12 to 14 Fr." });

BANK.push({ cat: CC, type: "single", stem: "Before nasopharyngeal suctioning of an adult, how does the nurse determine the insertion length?", opts: [O("Measure from the earlobe to the tip of the nose; adult insertion is 16 cm", true, "Correct. The catheter is held between the earlobe and the tip of the nose without touching the face; the adult nasopharyngeal length is 16 cm."), O("Measure from the nose to the sternum; adult insertion is about 24 cm here", false, "Incorrect. Nose to sternum is not the measuring method, and 24 cm is the top of the nasotracheal adult range."), O("Insert until resistance stops the catheter; no measurement is needed first", false, "Incorrect. Length is measured before insertion for every route; blind advancement risks trauma and wrong placement."), O("Measure from the earlobe to the chin; adult insertion is about 16 cm here", false, "Incorrect. The landmark pair is earlobe to tip of nose, not earlobe to chin; the wrong landmark misjudges depth.")], tp: "Measure before you insert: earlobe to nose tip. Nasopharyngeal adult 16 cm; nasotracheal adult 20 to 24 cm." });

BANK.push({ cat: CC, type: "multi", stem: "A nurse is preparing to start oxygen by nasal cannula. Which actions should the nurse complete before applying the device? Select all that apply.", opts: [O("Auscultate lung sounds before the oxygen device is applied", true, "Correct. Lung sounds are auscultated before oxygen is administered, giving baseline data for later comparison."), O("Fill the humidifier with tap water before giving the oxygen", false, "Incorrect. Humidifiers are filled with distilled water only; tap water is never used."), O("Review the arterial blood gas results before giving oxygen", true, "Correct. ABG results are reviewed to confirm airway patency and determine the need for oxygen."), O("Position the patient upright in Fowler's for lung expansion", true, "Correct. The patient is positioned in Fowler's or semi-Fowler's position for maximum lung expansion."), O("Set the flow above the ordered rate before giving the oxygen", false, "Incorrect. The flow is set to the prescribed rate; exceeding the order is never part of preparation.")], tp: "Before the device goes on: baseline lungs, ABG review, upright position, distilled water, ordered flow (ADPIE)." });

BANK.push({ cat: CC, type: "multi", stem: "Which actions belong in the care of a patient wearing an oxygen mask? Select all that apply.", opts: [O("Check the skin under the mask only when the patient reports pain", false, "Incorrect. Mask skin checks are scheduled every 2 to 4 hours, not triggered by pain reports."), O("Use petroleum jelly under the straps to protect the skin there", false, "Incorrect. Petrolatum products are avoided during oxygen use because of combustibility."), O("Let the reservoir bag fill completely before placing the mask on", true, "Correct. For reservoir masks, the bag is filled completely before the mask is placed on the patient."), O("Place gauze or a cotton ball over the ears under the elastic straps", true, "Correct. Skill 14.1 places a cotton ball or gauze over the ears under the elastic straps to protect the skin."), O("Remove the mask and evaluate the underlying skin every 2 to 4 hours", true, "Correct. The mask is removed and the skin evaluated every 2 to 4 hours, clearing condensation and debris.")], tp: "Mask care bundle: skin every 2 to 4 hours, padding over the ears, reservoir filled before placement." });

BANK.push({ cat: CC, type: "order", stem: "A nurse is performing tracheostomy suctioning (Skill 14.2). Place the steps in the correct order.", items: [{"t": "Position the patient in semi-Fowler's and provide a way to communicate", "r": "First. Semi-Fowler's gives optimal lung expansion, and paper, pencil, or a board replaces speech during the procedure."}, {"t": "Preoxygenate with deep breaths or 100% oxygen before suctioning begins", "r": "Second. Preoxygenation prevents oxygen depletion during the suctioning passes."}, {"t": "Advance the catheter gently with no suction until resistance is met", "r": "Third. The thumb stays off the vent during insertion to protect the mucosa from suction injury."}, {"t": "Withdraw about 1 cm, then suction intermittently while rotating out", "r": "Fourth. After resistance, the catheter is withdrawn about 1 cm and suction is applied intermittently with rotation."}, {"t": "Let the patient rest, reapply oxygen, and re-auscultate the lung sounds", "r": "Fifth. Rest restores depleted oxygen, and lung sounds are rechecked to evaluate the suctioning."}], tp: "Trach suction sequence: position and communicate, preoxygenate, insert without suction, withdraw 1 cm and suction rotating, rest and recheck." });

BANK.push({ cat: CC, type: "matrix", stem: "For each suctioning task, select the glove and technique standard that applies.", cols: ["Clean gloves are sufficient", "Sterile gloves and technique required"], rows: [{"t": "Oropharyngeal suctioning with a Yankauer tip catheter", "a": 0, "r": "Correct. Oropharyngeal suctioning uses clean gloves and can even be delegated to UAP after instruction."}, {"t": "Nasopharyngeal suctioning with a suction catheter kit", "a": 1, "r": "Correct. Nasopharyngeal suctioning is done with sterile gloves and sterile technique."}, {"t": "Nasotracheal suctioning with a suction catheter kit", "a": 1, "r": "Correct. Nasotracheal suctioning is done with sterile gloves and sterile technique."}, {"t": "Oropharyngeal suctioning that UAP may be taught to do", "a": 0, "r": "Correct. Oropharyngeal suctioning is the delegable route, taught to UAP, patients, and families with clean technique."}], tp: "Glove line: mouth suctioning is clean technique; anything through the nose into the airway is sterile technique." });

BANK.push({ cat: CD, type: "single", stem: "Two hours after a tracheostomy is created, the patient's respirations are noisy and the pulse and respiratory rates are rising. Which action should the nurse take?", opts: [O("Suction now; noisy breathing with rising pulse and rate signals retained secretions", true, "Correct. In the first postoperative hours suctioning may be needed as often as every 5 minutes; noisy respirations with rising rates are the printed signal. ABCs: clear the airway."), O("Remove the inner cannula and leave it out so air can move more freely today", false, "Incorrect. The inner cannula is removed only briefly for cleaning and is reinserted and locked; leaving it out is not the response."), O("Wait for the scheduled care time because suctioning is done every 8 hours only", false, "Incorrect. Every 8 hours is the equipment change and cleaning interval, not the suctioning interval; suctioning is done as often as necessary."), O("Give a sedative first because the rising rates show anxiety rather than secretions", false, "Incorrect. Noisy respirations point to secretions in the airway; sedation would depress respirations and mask the problem.")], tp: "Early post-trach: expect frequent suctioning, sometimes every 5 minutes. Noisy plus rising rates = suction." });

BANK.push({ cat: CD, type: "single", stem: "A nurse plans tracheostomy care for a patient who also needs suctioning. Which sequence is correct?", opts: [O("Suction first if needed, clean the inner cannula, then change the ties last", true, "Correct. Suctioning is done before care so secretions do not soil the new dressing, and ties are changed after cleaning so the cannula is not expelled during cleaning."), O("Remove the outer cannula, clean the inner cannula, then change the ties last", false, "Incorrect. The outer cannula is never removed during care; only the inner cannula comes out for cleaning."), O("Clean the stoma first, remove both cannulas, then suction the airway deeply", false, "Incorrect. Removing both cannulas closes off the airway plan; the outer cannula always stays in place."), O("Change the ties first, clean the inner cannula, then suction if it is needed", false, "Incorrect. Ties changed first leave the tube unsecured during cleaning, risking expulsion of the cannula.")], tp: "Trach care order: suction, clean inner cannula, stoma care, ties LAST with the tube stabilized." });

BANK.push({ cat: CD, type: "single", stem: "During tracheostomy care, a forceful cough expels the outer cannula onto the drape. Which action should the nurse take first?", opts: [O("Push the soiled outer cannula back in and secure the ties more tightly", false, "Incorrect. The expelled cannula is contaminated; forcing it back introduces pathogens directly into the lower airway."), O("Hold the opening with a sterile hemostat and call for assistance at once", true, "Correct. A sterile hemostat kept at the bedside holds the tracheostomy open until a new outer cannula can be inserted. Safety first: a closing stoma is an airway emergency."), O("Cover the opening with a dry dressing and reassess the patient in 1 hour", false, "Incorrect. The stoma can close quickly; covering and waiting risks losing the airway entirely."), O("Insert the obturator alone and wait for the provider on morning rounds", false, "Incorrect. An obturator alone is not an airway; the opening is held with a hemostat and help is called now.")], tp: "Expelled outer cannula: hemostat in the stoma, call for help. Keep a hemostat and spare trach set at the bedside." });

BANK.push({ cat: CD, type: "single", stem: "The nurse inflates a tracheostomy cuff by the minimal-leak method. Which technique is correct?", opts: [O("Add 0.5 to 1 mL at a time until no leak is heard, then withdraw up to 0.5 mL", true, "Correct. Skill 14.3 inflates in 0.5 to 1 mL increments while listening at the sternal notch, then withdraws up to 0.5 mL to reach the minimal-leak point."), O("Remove all air permanently because any cuff pressure causes tissue necrosis", false, "Incorrect. The cuff is needed to seal the airway for ventilation and aspiration protection; it is managed, not abandoned."), O("Add air until the pilot balloon feels hard, then leave the syringe attached", false, "Incorrect. A hard balloon signals overinflation, and a syringe left attached can break the valve or stick it open."), O("Add 5 mL at a time until no leak is heard, then withdraw up to 5 mL at once", false, "Incorrect. Five-milliliter jumps overshoot the seal and raise pressure on the tracheal wall; increments are 0.5 to 1 mL.")], tp: "Minimal-leak method: stethoscope at the sternal notch, 0.5 to 1 mL steps, back off up to 0.5 mL to a slight leak." });

BANK.push({ cat: CD, type: "single", stem: "After inflating a tracheostomy cuff, the nurse finds the syringe still attached to the pilot balloon valve. Which action is correct?", opts: [O("Leave the syringe attached because it keeps extra air from leaking out slowly", false, "Incorrect. The attached syringe does the opposite of protecting the seal; it can stick the valve open and leak air."), O("Remove the syringe; leaving it attached may break the valve or stick it open", true, "Correct. Skill 14.3 warns that a syringe left on the pilot balloon valve may cause the valve to break or stick open; it is removed and discarded."), O("Leave the syringe attached so the next nurse can adjust the cuff more quickly", false, "Incorrect. Convenience never justifies the valve damage risk; the syringe comes off after every inflation check."), O("Tape the syringe to the pillow so the valve stays open for continuous drainage", false, "Incorrect. The valve is never held open; drainage is not a cuff function and an open valve loses the airway seal.")], tp: "Syringe off the pilot balloon, every time: an attached syringe can break the valve or stick it open." });

BANK.push({ cat: CD, type: "single", stem: "A patient with a new tracheostomy is frustrated and repeatedly mouths words the nurse cannot read. Which action should the nurse take?", opts: [O("Deflate the cuff permanently so the patient can talk whenever desired", false, "Incorrect. Permanent cuff deflation removes aspiration and ventilation protection; communication aids solve the problem safely."), O("Limit conversation because talking tires the patient and wastes oxygen", false, "Incorrect. Communication is a primary nursing responsibility with a tracheostomy; limiting it isolates the patient."), O("Offer paper and pencil or a board, and ask yes-or-no questions for now", true, "Correct. Communication care provides paper, pencil, or a board and organizes questions for yes-or-no answers by nodding or hand signals."), O("Ask the family to answer all questions on the patient behalf today", false, "Incorrect. The patient keeps a voice in care through writing and yes-or-no signals; family answers are a supplement, not a substitute.")], tp: "Trach communication: board or paper at the bedside, yes-or-no questions, call light in reach, explain every procedure." });

BANK.push({ cat: CD, type: "single", stem: "A tracheostomy collar patient has heavy condensation in the tubing, and the nurse can no longer see any mist. Which action should the nurse take?", opts: [O("Drain and clean the collar and tubing, and restore a visible mist at once", true, "Correct. Too much condensation creates problems with oxygen delivery and respiratory distress, and the mist must be visible at all times during collar therapy."), O("Raise the temperature setting higher so even more condensation will form", false, "Incorrect. Higher temperatures create more moisture and condensation, worsening the exact problem found."), O("Remove the collar for the shift because the patient is getting enough air", false, "Incorrect. Removing the collar deprives the patient of oxygen and humidification; the system is serviced, not abandoned."), O("Document the finding because condensation never affects oxygen delivery", false, "Incorrect. Excess condensation can obstruct delivery and cause respiratory distress; it is drained and cleaned frequently.")], tp: "Collar rule: mist visible at all times. Lost mist plus heavy condensation = drain, clean, and recheck connections." });

BANK.push({ cat: CD, type: "single", stem: "The nurse evaluates transtracheal catheter teaching. Which patient statement indicates an understanding of the teaching?", opts: [O("\"I will add a humidifier because the nasal passages still need the extra moisture\"", false, "Incorrect. Transtracheal delivery bypasses the nasopharynx, so additional humidification is unnecessary with this catheter."), O("\"I will remove the catheter for a week each month so the opening can rest well\"", false, "Incorrect. If the catheter is removed and not replaced within a timely manner, the opening may close over and the surgery must be repeated."), O("\"I will clean around the opening twice a day and watch for redness or swelling\"", true, "Correct. The transtracheal site is cleaned twice daily with a cotton-tipped applicator, and the patient inspects for erythema, edema, or excessive exudate."), O("\"I will expect the same catheter to last for a full year before it gets brittle\"", false, "Incorrect. A single transtracheal catheter lasts up to 3 months; after that it becomes brittle and must be replaced.")], tp: "Transtracheal facts: 8-Fr or 9-Fr, cleaned twice daily, lasts up to 3 months, no added humidification needed." });

BANK.push({ cat: CD, type: "multi", stem: "Which actions belong in ongoing care of a patient with a tracheostomy? Select all that apply.", opts: [O("Keep a spare sterile tracheostomy tube at the patient bedside", true, "Correct. A spare sterile tracheostomy tube is kept at the bedside, along with a sterile hemostat, for emergencies."), O("Turn and reposition the patient every 2 hours for lung expansion", true, "Correct. Turning and repositioning every 2 hours supports maximal ventilation and lung expansion."), O("Change the tracheostomy ties only when the family visits weekly", false, "Incorrect. Ties are changed whenever they are soiled, to lessen skin impairment, not on a weekly family schedule."), O("Change or clean respiratory equipment every 8 hours as scheduled", true, "Correct. All respiratory therapy equipment is changed or cleaned every 8 hours to minimize infection risk."), O("Keep the head of the bed flat to protect the tracheostomy ties", false, "Incorrect. The head of the bed is elevated to assist ventilation; flat positioning works against lung expansion.")], tp: "Ongoing trach care: reposition every 2 hours, equipment every 8 hours, spare tube and hemostat at the bedside." });
