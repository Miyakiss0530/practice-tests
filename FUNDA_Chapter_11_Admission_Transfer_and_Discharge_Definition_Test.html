<script>

 CD: {

 CE: {

 }

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which statement accurately describes the most common reaction patients have on admission?",
  opts: [ O("Fear of the unknown, linked to the safety need, is the most common reaction on admission", true, "Correct. The guide names fear of the unknown as the most common reaction, tied to Maslow safety."), O("Loneliness, linked to the esteem need, is the most common reaction on admission each time", false, "Loneliness is a common reaction, but it is not named the most common and it tracks belonging needs."), O("Loss of identity, linked to hunger needs, is the most common reaction on admission today", false, "Loss of identity threatens esteem, love, and belonging; it is not the most common reaction."), O("Disorientation, linked to the safety need, is the most common reaction on admission here", false, "Disorientation is a separate reaction: confusion about place, time, and identity.") ],
  tp: "Fear of the unknown is the MOST common admission reaction; simple explanations and direct answers restore a sense of control." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A patient says the wrist band makes her feel like a number instead of a person. Which concept does this statement illustrate?",
  opts: [ O("Loss of identity, threatening esteem, love, and belonging needs during the admission", true, "Correct. The guide ties the ID band reducing a patient to a name and number to loss of identity."), O("Separation anxiety, caused by being apart from familiar people and familiar surroundings", false, "Separation anxiety is about being separated from familiar surroundings and significant people."), O("Relocation stress, caused by moving an older adult from one unit to another unit nearby", false, "Relocation stress describes confusion and upset from moving, especially in older adults."), O("Fear of the unknown, caused by not knowing what procedure will happen next in the stay", false, "That reaction is about not knowing what lies ahead, not about feeling reduced to a number.") ],
  tp: "Explain the ID band as a necessary safety and positive-identification step; learn the patient's name quickly." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which description matches disorientation as the guide presents it?",
  opts: [ O("Mental confusion with inadequate or incorrect perception of place, time, and identity", true, "Correct. That is the guide wording for disorientation."), O("Fear and apprehension caused by separation from familiar surroundings and loved people", false, "That wording describes separation anxiety, not disorientation."), O("Feeling reduced to a name and number rather than being treated as a unique individual", false, "That wording describes loss of identity, not disorientation."), O("Worry about a health problem and about what the final outcome of treatment might be", false, "That is general concern on admission, not the specific confusion pattern of disorientation.") ],
  tp: "Disorientation = incorrect perception of place, time, and identity." });

BANK.push({ cat: CA, type: "multi", kt: [],
  stem: "Which statements about separation anxiety are accurate? Select all that apply.",
  opts: [ O("In young children it is generally expressed as crying during the separation period", true, "Correct. The guide states children generally express separation anxiety as crying."), O("In adults it can appear as being withdrawn or as being very talkative with staff", true, "Correct. Adults may be withdrawn or very talkative."), O("Parents should be encouraged to stay with a hospitalized child to prevent it", true, "Correct. Parental presence prevents separation anxiety and gives the child security."), O("It occurs only in young children and never in adults or in older adult patients", false, "The guide states adults and older adults often have this reaction too."), O("It is best treated by limiting visits so the patient adjusts to the facility alone", false, "The guide says the company of friends and loved ones is the best remedy, and visiting is encouraged.") ],
  tp: "Separation anxiety spans all ages; family presence and visiting are the chapter remedy." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which statement accurately defines empathy in the admission context?",
  opts: [ O("The ability to recognize and share the emotions and state of mind of another person", true, "Correct. That is the guide definition of empathy."), O("The ability to complete admission routines quickly without speaking to the patient", false, "Efficient routines matter only when paired with concern; speed alone is not empathy."), O("The ability to answer every family question before the patient has finished asking it", false, "Rushing answers is specifically discouraged with older patients; it is not empathy."), O("The ability to keep a professional distance by avoiding any warmth toward the patient", false, "The guide calls for a warm, caring attitude, courtesy, and empathy.") ],
  tp: "A warm, caring attitude with courtesy and empathy reduces the severity of common admission reactions." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which form of address follows the guide rule for an adult patient?",
  opts: [ O("Mr., Mrs., Ms., or Miss with the last name, unless the patient permits another form", true, "Correct. Adults are addressed by title and last name unless the patient grants permission otherwise."), O("The first name only, because it helps every adult patient feel relaxed and at home", false, "A first name is used only at the patient's request, not by default."), O("A familiar nickname from the chart, because it shows the nurse read the record first", false, "The guide directs staff to use the surname unless the patient directs otherwise."), O("Terms such as Honey or Pops, because they show warmth to an anxious adult patient", false, "Terms of endearment are never appropriate, per the guide trap list.") ],
  tp: "Title + last name by default; first name only at the patient's request; terms of endearment never." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which statement about older adults on admission is accurate?",
  opts: [ O("A change of environment can cause disorientation or altered sleep-wake patterns", true, "Correct. The guide lists both effects of the environment and routine change."), O("Family members should answer questions for them so the admission moves more quickly", false, "The guide says wait for the patient to answer rather than letting family answer for them."), O("Questions should be asked quickly because older adults process information instantly", false, "The guide says converse slowly and clearly because information may take longer to process."), O("Vision and hearing limits make older adults less likely to feel agitated or fearful", false, "The guide says those limits make older adults MORE likely to become agitated or fearful.") ],
  tp: "Older adults: speak slowly and clearly, do not rush, let the patient answer, involve them in the plan of care." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A patient who does not speak English arrives for admission unaccompanied by any bilingual family member. Which statement is accurate?",
  opts: [ O("An interpreter should be used for the admission process for this patient", true, "Correct. The guide states an interpreter should be used in exactly this situation."), O("Admission paperwork should proceed in English and be explained at discharge", false, "Waiting until discharge leaves the patient uninformed during the whole admission."), O("A bilingual housekeeper should be pulled in to interpret the medical content", false, "The guide calls for an interpreter, not an ad hoc staff substitute."), O("The patient should be asked to bring a family interpreter back the next day", false, "The guide directs use of an interpreter at admission when no bilingual family member is present.") ],
  tp: "No English + no bilingual family member on admission = use an interpreter." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which set of information does the admitting department representative obtain?",
  opts: [ O("Demographic, insurance, social security, and emergency contact information", true, "Correct. Those are the admitting department items named in the guide."), O("Vital signs, height, weight, and a full review of every body system assessed", false, "Those belong to the initial nursing assessment on the unit, not the admitting department."), O("Medication orders, laboratory orders, and the plan of care for the first day", false, "Orders and care planning are provider and RN work, not admitting-department intake."), O("Diet orders, activity orders, and follow-up appointments for after discharge", false, "Those are discharge-planning items, not what the admitting department collects.") ],
  tp: "Admitting department: demographics, insurance, social security number, emergency contacts — with privacy maintained." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which document must hospitals present to the patient or legal guardian at the time of admission?",
  opts: [ O("The Patient's Bill of Rights, as required by The Joint Commission and Medicare", true, "Correct. TJC and Medicare/Medicaid Services require presentation at admission."), O("The discharge summary, as required by The Joint Commission and Medicare rules", false, "A discharge summary is part of discharge planning, not an admission presentation."), O("The interagency transfer form, as required by The Joint Commission at admission", false, "That form is completed for a transfer to another facility, not at routine admission."), O("The AMA release form, as required by The Joint Commission for every admission", false, "The AMA form is used only when a patient leaves against medical advice.") ],
  tp: "Patient's Bill of Rights is presented at admission; the patient has the right to dignity, courtesy, and respect." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "What does the Patient Self-Determination Act of 1991 address?",
  opts: [ O("The right to accept or refuse medical treatment and advance directive information", true, "Correct. The guide states the 1991 Act addresses exactly those two areas."), O("The right to receive a private room and to choose the members of the care team", false, "Room choice and team choice are not what the Act addresses."), O("The right to transfer to any facility and to have the transfer paid in full", false, "Transfer rights and payment are not the subject of this Act."), O("The right to leave at any hour and to have all records destroyed on request", false, "Leaving AMA is a separate issue; the Act covers treatment choice and advance directives.") ],
  tp: "PSDA 1991: accept or refuse treatment + advance directive information; Medicare/Medicaid hospitals must provide it." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which statement about HIPAA at admission is accurate?",
  opts: [ O("Information is presented on admission and receipt is verified by a signature", true, "Correct. The guide states HIPAA information is given on admission and receipt is signed for."), O("Information is presented at discharge and receipt is verified by a signature", false, "HIPAA information in this chapter is an admission item, not a discharge item."), O("Information is mailed after discharge and no signature of receipt is required", false, "The guide requires presentation on admission with a verifying signature."), O("Information is posted in the lobby and patients are assumed to have read it", false, "Posting alone does not meet the guide's admission presentation and signature rule.") ],
  tp: "This chapter's HIPAA points are admission points: present the information, verify receipt by signature, protect privacy." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which description matches telephone admission?",
  opts: [ O("An admitting office calls the patient at home, usually the day before admission", true, "Correct. That is the guide description of telephone admission."), O("A nurse calls the patient at home, usually one week after a surgical procedure", false, "The call happens before admission, usually the day before, from the admitting office."), O("An admitting office calls the family at work, usually on the morning of discharge", false, "The call is to the patient at home before admission, not to family at discharge."), O("A provider calls the patient at home, usually the day after a hospital admission", false, "The timing and caller are both different in the guide description.") ],
  tp: "Telephone admission: records begun by phone the day before; verify records and ID band with the patient on arrival." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "How should the bed be positioned for a patient who will arrive on a stretcher?",
  opts: [ O("In the high position, ready for the stretcher arrival to the prepared room", true, "Correct. High position for a stretcher arrival."), O("In the low position, ready for the stretcher arrival to the prepared room", false, "Low position is for a patient arriving by wheelchair or walking."), O("In the flat position, ready for the stretcher arrival to the prepared room", false, "The guide specifies high position, not flat, for stretcher arrivals."), O("In the raised-head position, ready for the stretcher arrival to the room", false, "Head elevation is not the arrival rule; bed height is.") ],
  tp: "Bed trap: HIGH for stretcher, LOW for wheelchair or walking arrivals." });

BANK.push({ cat: CB, type: "multi", kt: [],
  stem: "Which items belong in the Box 11.1 room orientation? Select all that apply.",
  opts: [ O("How to call the nurse from the bed and from the bathroom area", true, "Correct. Box 11.1 includes calling from bed and bathroom."), O("How to adjust the bed and the lights in the patient room", true, "Correct. Box 11.1 includes bed and light adjustment."), O("The location of shower and bathroom facilities for the patient", true, "Correct. Box 11.1 includes shower and bathroom location."), O("How to operate the television provided in the patient room", true, "Correct. Box 11.1 includes television operation."), O("How to change the medication orders written by the provider", false, "Patients are never oriented to changing provider orders; that is not in Box 11.1.") ],
  tp: "Box 11.1: policies, call system, bed/lights, intercom, shower/bathroom, television, lounge, room-to-station relationship." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A patient arrives from the emergency department to a special care unit. Who usually provides the admitting office with the necessary information?",
  opts: [ O("A family member, usually the next of kin or the health care representative", true, "Correct. The guide names the next of kin or health care representative."), O("The patient, even when the patient is in critical condition on arrival", false, "In these situations the family member or representative provides the information."), O("The ambulance driver, using the run report completed during the transport", false, "The guide assigns this to family/next of kin or the representative, not the driver."), O("The receiving nurse, using the report received from the emergency nurse", false, "The receiving nurse confers for continuity, but the admitting office information comes from family.") ],
  tp: "ED admissions may go directly to SCU, ICU, CCU, or burn unit; family/next of kin supplies admitting information." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "By when must the RN admission assessment be completed, per The Joint Commission requirement in the guide?",
  opts: [ O("Within 24 hours of admission, with data collection aspects delegable to the LPN", true, "Correct. TJC requires the RN admission assessment within 24 hours; aspects of data collection may be delegated."), O("Within 4 hours of admission, with data collection aspects delegable to the LPN", false, "The guide timeframe is 24 hours, not 4 hours."), O("Within 48 hours of admission, with data collection aspects delegable to the LPN", false, "The guide timeframe is 24 hours, not 48 hours."), O("Within 72 hours of admission, with data collection aspects delegable to the LPN", false, "The guide timeframe is 24 hours, not 72 hours.") ],
  tp: "RN owns the admission assessment within 24 hours; the LPN/LVN may be delegated aspects of data collection only." });

BANK.push({ cat: CC, type: "multi", kt: [],
  stem: "Which items are part of the initial assessment and health history on admission? Select all that apply.",
  opts: [ O("Level of consciousness, vital signs, height, weight, and review of body systems", true, "Correct. Those are the initial assessment items named in the guide."), O("Reason for admission, illnesses, surgical procedures, and prior hospitalizations", true, "Correct. Those are health history items named in the guide."), O("Medications, allergies, eating habits, urinary and bowel patterns, sleep routine", true, "Correct. Those history items are all listed in the guide."), O("Language spoken, family members, interests, ADL ability, and patient occupation", true, "Correct. The guide adds language, family, interests, ADL ability, and occupation."), O("Stock portfolio, credit history, and the patient's preferred discharge vehicle", false, "Financial portfolio and vehicle preference are not admission history items in the guide.") ],
  tp: "History covers reason, illnesses/surgery, meds, allergies, eating, elimination, sleep, activity, language, family, ADLs, occupation." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "Which set lists the common patient problems for a newly admitted patient in the guide care plan?",
  opts: [ O("Anxiousness, Potential for Injury, Insufficient Knowledge, and Fearfulness listed", true, "Correct. Those four are the common newly-admitted problems in the guide."), O("Acute Pain, Impaired Mobility, Fluid Overload, and Risk for Infection listed here", false, "Those may fit other patients, but they are not the guide's newly-admitted set."), O("Caregiver Strain, Social Isolation, Hopelessness, and Spiritual Distress listed", false, "Those are not the four problems the guide names for a newly admitted patient."), O("Constipation, Insomnia, Nausea, and Impaired Skin Integrity listed for admission", false, "Those are not the four problems the guide names for a newly admitted patient.") ],
  tp: "New-admission problems: Anxiousness, Potential for Injury, Insufficient Knowledge Regarding Admission Process/Illness, Fearfulness." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "In Skill 11.1, which action opens and also closes the admission sequence at steps 1 and 15?",
  opts: [ O("Performing hand hygiene at the start and again near the end of the sequence", true, "Correct. Hand hygiene is step 1 and step 15, reducing spread of microorganisms."), O("Checking the ID band at the start and again near the end of the sequence", false, "ID band checking is step 4, not the opening and closing action."), O("Recording information at the start and again near the end of the sequence", false, "Recording is step 16, after the second hand hygiene."), O("Assessing immediate needs at the start and again near the end of the sequence", false, "Assessing immediate needs is step 5, not steps 1 and 15.") ],

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "What is the Skill 11.1 safety setup after the assessment, at step 12?",

  stem: "Which statement about patient valuables and medications on admission is accurate?",

  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
