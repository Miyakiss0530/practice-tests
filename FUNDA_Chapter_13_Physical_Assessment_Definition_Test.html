<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Signs, Symptoms, Disease Origins and Risk Factors";
var CB = "Disease Terms, Inflammation and Frequently Noted Signs";
var CC = "Examination Role, Equipment, Positions and Interview";
var CD = "Assessment Techniques, History and Review of Systems";
var CE = "Neurologic, Skin, Chest and Breath Sounds";
var CF = "Heart, Pulses, Abdomen, Edema and Communication";
var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 2
  }
 },
 CB: {
  "name": CB,
  "count": 8,
  "types": {
   "single": 7,
   "multi": 1
  }
 },
 CC: {
  "name": CC,
  "count": 8,
  "types": {
   "multi": 1,
   "single": 7
  }
 },
 CD: {
  "name": CD,
  "count": 8,
  "types": {
   "single": 5,
   "multi": 3
  }
 },
 CE: {
  "name": CE,
  "count": 8,
  "types": {
   "single": 8
  }
 },
 CF: {
  "name": CF,
  "count": 8,
  "types": {
   "single": 7,
   "multi": 1
  }
 }
};

BANK.push({ cat: CA, type: "single",
  stem: "A nurse measures a temperature of 101.2 degrees F and sees a reddened rash. How is this information classified?",
  opts: [ O("Objective data, because the nurse can see and measure both of the findings directly", true, "Correct. Signs are objective data perceived by the nurse and verifiable by observation and measurement."), O("Subjective data, because the patient must confirm that both findings feel abnormal", false, "Incorrect. Confirmation by the patient is not what makes data subjective; these were observed and measured."), O("Objective data only if another nurse repeats the same measurement at a later time", false, "Incorrect. Objective data can be verified by more than one person, but repeat measurement is not required first."), O("Subjective data, because all findings noted during an illness are patient symptoms", false, "Incorrect. Symptoms are what the patient perceives; findings the nurse observes or measures are signs.") ],
  tp: "Signs are objective data the nurse sees, hears, measures, or feels; symptoms are subjective data the patient perceives." });

BANK.push({ cat: CA, type: "multi",
  stem: "Which of the following are examples of symptoms as the chapter defines them? Select all that apply.",
  opts: [ O("Pain that the patient describes as stabbing in the upper abdomen area", true, "Correct. Pain is perceived by the patient and reported in the patient's own words, so it is subjective."), O("Nausea and a sore throat that the patient reports during the interview", true, "Correct. Nausea and sore throat are in the chapter list of subjective symptom examples."), O("A visible rash and drainage that the nurse observes on the patient's skin", false, "Incorrect. A rash and visible drainage are signs the nurse perceives, so they are objective data."), O("An abnormal lung sound that the nurse hears while using a stethoscope", false, "Incorrect. A sound the nurse hears is a sign; it is objective even though the patient cannot hear it."), O("Anxiety and ringing in the ears that the patient says have been present", true, "Correct. Anxiety and ringing in the ears are perceived by the patient and listed as symptom examples.") ],
  tp: "Symptoms listed in the chapter include pain, nausea, vertigo, sore throat, ringing in the ears, and anxiety." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement most accurately distinguishes drainage from exudate?",
  opts: [ O("Drainage removes fluids from a cavity or wound; exudate leaks from vessels into tissues", true, "Correct. Drainage is passive or active removal of fluids; exudate leaks out of blood vessels into nearby tissues."), O("Drainage leaks from vessels into tissues; exudate removes fluids through a closed system", false, "Incorrect. This reverses the two definitions; a closed urinary system is an example of drainage, not exudate."), O("Drainage contains only clear water; exudate is any fluid that a patient reports as present", false, "Incorrect. Exudate contains cells, proteins, and solid materials; it is observed, not merely reported."), O("Drainage occurs only with infection; exudate occurs only after a surgical procedure ends", false, "Incorrect. Neither definition is limited that way; exudate may ooze from cuts or areas of infection or inflammation.") ],
  tp: "Drainage = removal of fluids from a body cavity, wound, or discharge source. Exudate = fluid leaking from blood vessels into tissues, also called pus." });

BANK.push({ cat: CA, type: "single",
  stem: "A disease has no known cause despite study. Which term describes the cause status of that disease?",
  opts: [ O("Its etiology is unknown, because some diseases have no identified cause at this time", true, "Correct. Etiology is the cause of a disease, and the chapter states some diseases have an unknown etiology."), O("Its etiology is congenital, because every condition present at birth has a known cause", false, "Incorrect. Congenital describes appearing at birth or shortly after, not whether a cause is known."), O("Its etiology is hereditary, because an unknown cause is always passed down genetically", false, "Incorrect. Hereditary means transmitted genetically from parents to children; that is not stated here."), O("Its etiology is functional, because no structural change has been named in the stem here", false, "Incorrect. Functional describes manifestations without structural or physiologic abnormality on examination.") ],
  tp: "Etiology means the cause of a disease; some diseases have an unknown etiology." });

BANK.push({ cat: CA, type: "single",
  stem: "Which example matches a congenital origin of disease rather than a hereditary origin?",
  opts: [ O("Failure to develop normally in the embryonic stage after inadequate oxygen exposure", true, "Correct. Congenital conditions appear at birth or shortly after and are not caused by genetic abnormalities."), O("Cystic fibrosis passed genetically from both parents to a child born in this family", false, "Incorrect. Cystic fibrosis is listed as hereditary, transmitted genetically from parents to children."), O("Sickle cell anemia inherited through genes that are carried by members of the family", false, "Incorrect. Sickle cell anemia is a hereditary example in the origins table, not a congenital one."), O("Color blindness present because of a gene received from a parent before the birth date", false, "Incorrect. Color blindness is listed under hereditary origins; genetic transmission is the key point.") ],
  tp: "Hereditary = transmitted genetically (cystic fibrosis, sickle cell anemia, hemophilia). Congenital = present at birth, not genetic, from abnormal embryonic development." });

BANK.push({ cat: CA, type: "single",
  stem: "Diabetes mellitus is listed under which origin of disease in the chapter table?",
  opts: [ O("Metabolic, because pancreatic islet dysfunction causes loss of metabolic balance", true, "Correct. Metabolic diseases involve dysfunction and loss of metabolic balance, usually involving endocrine glands."), O("Deficiency, because the body lacks one specific nutrient in the daily diet intake", false, "Incorrect. Deficiency results from lack of a specific nutrient such as a mineral, vitamin, protein, fat, or carbohydrate."), O("Degenerative, because aging progressively wears down one part of the body over time", false, "Incorrect. Degenerative implies progressive degeneration with aging, as in osteoarthritis, not endocrine dysfunction."), O("Inflammatory, because the body reacts to an injurious agent with local inflammation", false, "Incorrect. Inflammatory origin is a reaction to an injurious agent such as microorganisms or an allergic response.") ],
  tp: "Metabolic origin: diabetes mellitus (pancreatic islets), hypothyroidism, and acromegaly are the chapter examples." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient has several risk factors for a disease. Which interpretation is accurate?",
  opts: [ O("The patient's chance of developing the disease is higher, but disease is not certain", true, "Correct. Presence of risk factors increases vulnerability; it does not necessarily mean disease will develop."), O("The patient will develop the disease unless every risk factor is removed completely", false, "Incorrect. Risk raises probability only; removing factors lowers risk but the chapter makes no certainty claim."), O("The risk factors explain the disease only if the patient already has clear symptoms", false, "Incorrect. Risk factors are assessed to address potential as well as actual problems; symptoms are not required."), O("The patient has no increased risk unless at least one factor is genetic in its origin", false, "Incorrect. Age, environment, and lifestyle factors also increase vulnerability without any genetic factor.") ],
  tp: "A risk factor increases vulnerability to illness or accident; it raises the chance, it does not guarantee disease." });

BANK.push({ cat: CA, type: "multi",
  stem: "Which risk factors in Box 13.1 are modifiable by the patient? Select all that apply.",
  opts: [ O("Smoking cigarettes on a regular daily basis for many years", true, "Correct. Smoking is a lifestyle risk factor the patient can change; it is the most preventable cause of death in society."), O("Age, which places an older adult at higher risk for fractures", false, "Incorrect. Age is not modifiable; osteoporosis in older adults is an age-category example."), O("Overeating and poor nutrition as part of a daily eating pattern", true, "Correct. Overeating and poor nutrition are lifestyle factors that can be modified."), O("Family history of cancer recorded in the patient's health history", false, "Incorrect. Family history is a genetic factor and cannot be changed by the patient."), O("Poor personal hygiene and insufficient rest and sleep each night", true, "Correct. Hygiene, rest, and sleep are lifestyle factors listed in Box 13.1 and can be changed.") ],
  tp: "Many environmental and lifestyle risk factors are modifiable; age and family history are not." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement accurately describes a chronic disease?",
  opts: [ O("It develops slowly and persists over a long period, often for a person's lifetime", true, "Correct. Chronic disease is slow to develop and long-lasting; diabetes mellitus is the chapter example."), O("It begins abruptly with severe signs and symptoms and then subsides with treatment", false, "Incorrect. That describes acute disease, such as an episode of appendicitis, not a chronic disease."), O("It disappears completely for a period and then is considered permanently cured later", false, "Incorrect. Disappearance of characteristics describes remission, which is not the same as a cure."), O("It causes a structural change in one organ that interferes with that organ's function", false, "Incorrect. A structural change interfering with function describes organic disease, a different term.") ],
  tp: "Chronic = slow onset, persists a long time or a lifetime. Acute = abrupt, marked intensity, then often subsides." });

BANK.push({ cat: CB, type: "single",
  stem: "Remission is best understood as which of the following?",
  opts: [ O("A partial or complete disappearance of the disease's clinical characteristics", true, "Correct. Remission may be spontaneous or a result of therapy, and it can be partial or complete."), O("A complete cure confirmed when all treatment for the disease has been stopped", false, "Incorrect. Remission does not mean cure; characteristics disappear but the disease is not declared cured."), O("A return of severe signs and symptoms after a period of quiet disease activity", false, "Incorrect. That describes a relapse or exacerbation pattern, the opposite direction from remission."), O("A structural repair of the damaged organ so that its function returns to normal", false, "Incorrect. Remission concerns disappearance of characteristics, not documented structural repair of an organ.") ],
  tp: "Remission = partial or complete disappearance of clinical and subjective characteristics of disease; not a cure." });

BANK.push({ cat: CB, type: "single",
  stem: "Examination fails to reveal any structural or physiologic abnormality, yet manifestations look like organic disease. This is classified as:",
  opts: [ O("Functional disease, because no structural abnormality is found on careful examination", true, "Correct. Functional disease mimics organic disease but careful examination reveals no structural or physiologic abnormality."), O("Organic disease, because the manifestations resemble those of a structural disorder", false, "Incorrect. Organic disease requires a structural change in an organ that interferes with its functioning."), O("Congenital disease, because the problem must have been present since the time of birth", false, "Incorrect. Nothing in the stem places the condition at birth; congenital is about timing and development."), O("Degenerative disease, because the body part involved must be wearing down with aging", false, "Incorrect. Degenerative disease implies progressive degeneration, often with aging, as in osteoarthritis.") ],
  tp: "Organic = structural change interfering with function. Functional = manifestations without structural or physiologic abnormality; many nervous and mental diseases are functional." });

BANK.push({ cat: CB, type: "multi",
  stem: "Which findings are among the universal (cardinal) signs of infection and inflammation? Select all that apply.",
  opts: [ O("Erythema and heat noted over the affected area of the body", true, "Correct. Erythema (redness) and heat are cardinal signs, resulting from increased blood flow to the damaged area."), O("Edema and pain present at the site of the affected tissue area", true, "Correct. Edema (swelling) and pain are cardinal signs; excess fluid raises pressure on sensitive nerve endings."), O("Purulent drainage and loss of function of the affected part", true, "Correct. Purulent drainage (pus) and loss of function complete the cardinal sign list in the chapter."), O("Bradycardia and a respiratory rate below the normal adult range", false, "Incorrect. Slow heart and breathing rates are vital-sign findings, not cardinal signs of inflammation at a site."), O("Jaundice visible in the skin and in the sclera of both of the eyes", false, "Incorrect. Jaundice is a frequently noted sign linked to bile flow obstruction, not a cardinal sign of inflammation.") ],
  tp: "Cardinal signs: erythema, edema, heat, pain, purulent drainage, and loss of function." });

BANK.push({ cat: CB, type: "single",
  stem: "Why do erythema and heat appear at an inflamed area?",
  opts: [ O("Increased blood flow to the damaged area brings warmth and visible redness there", true, "Correct. The chapter states erythema and heat result from increased blood flow to the damaged area."), O("White blood cells digesting debris release pigments that color the skin surface red", false, "Incorrect. Neutrophils digest microorganisms and debris; they do not create the redness and heat."), O("Fluid leaking into the tissues reflects light and makes the area appear much warmer", false, "Incorrect. Excess tissue fluid causes edema and pressure pain, not the redness and heat of inflammation."), O("Loss of function rests the area so that blood pools and the surface becomes hot there", false, "Incorrect. Loss of function imposes rest; it is a result in the response, not the cause of redness and heat.") ],
  tp: "Inflammation sequence: increased blood flow causes erythema and heat; permeable capillaries let WBCs and plasma move into tissues; excess fluid causes edema and pain." });

BANK.push({ cat: CB, type: "single",
  stem: "Purulent exudate is best described as an accumulation of which materials?",
  opts: [ O("Neutrophils, dead cells, bacteria, and other debris from the infectious process", true, "Correct. Purulent exudate is defined by that accumulation at the site of infection."), O("Clear plasma and water that leak from capillaries without any cellular material", false, "Incorrect. Clear fluid without cells does not match purulent exudate, which is pus from an infectious process."), O("Red blood cells that escape from a vessel and collect under the surface of the skin", false, "Incorrect. Blood collecting in subcutaneous tissues describes ecchymosis, a bruise, not purulent exudate."), O("Mucus produced in the large airways that gives a gurgling quality to breath sounds", false, "Incorrect. Mucus in large airways relates to sonorous wheezes, not to the composition of purulent exudate.") ],
  tp: "Purulent exudate = neutrophils, dead cells, bacteria, and debris; bacterial infection is the most common cause of purulent drainage." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about infection is accurate?",
  opts: [ O("It is caused by invasion of microorganisms that produce damage to body tissues", true, "Correct. Infection is invasion by bacteria, viruses, fungi, or parasites that produce tissue damage."), O("It is the body's protective response of tissues to irritation or to an injury", false, "Incorrect. That is inflammation, the protective tissue response, not the invasion itself."), O("It occurs only when a patient develops a fever above the normal temperature range", false, "Incorrect. Fever is a frequently noted sign; infection is defined by invasion and tissue damage, not by fever alone."), O("It is present whenever purulent drainage is seen at any site on the patient's body", false, "Incorrect. Purulent drainage is a cardinal sign, but infection is defined by microorganism invasion, not one sign alone.") ],
  tp: "Infection = invasion by microorganisms producing tissue damage. Inflammation = protective tissue response to irritation, injury, or invasion." });

BANK.push({ cat: CB, type: "single",
  stem: "A patient reports itching, and the nurse sees redness and a rash. Which pairing is correct?",
  opts: [ O("Pruritus is the reported symptom; erythema is a sign the nurse can observe directly", true, "Correct. Pruritus (itching) is perceived and reported; erythema and rash are visible signs that often accompany it."), O("Pruritus is a sign the nurse measures; erythema is a symptom only the patient feels", false, "Incorrect. This reverses them; itching is felt by the patient, redness is seen by the nurse."), O("Both findings are subjective because they were first noticed during the same visit", false, "Incorrect. Timing does not decide the category; who perceives the data decides it."), O("Both findings are objective because a rash can be confirmed by any other observer", false, "Incorrect. Only the rash and erythema are objective; the itching itself is the patient's perception.") ],
  tp: "Many signs accompany symptoms: the nurse often sees erythema and a rash when the patient reports pruritus." });

BANK.push({ cat: CC, type: "multi",
  stem: "Which actions are pre-examination responsibilities of the nurse assisting with a physical examination? Select all that apply.",
  opts: [ O("Verify that informed consent was obtained and the form has appropriate signatures", true, "Correct. Verifying consent and signatures is a listed pre-examination responsibility."), O("Confirm that all necessary supplies and equipment have been obtained for the provider", true, "Correct. The nurse confirms supplies and equipment are ready before the examination."), O("Verify that prerequisites are completed and that the results are available to review", true, "Correct. Checking prerequisites and result availability is part of preparing for the examination."), O("Decide which diagnosis the provider should record after the examination is finished", false, "Incorrect. Making the medical diagnosis is the provider's role, based on clustered signs and symptoms."), O("Leave the patient alone in the room while the equipment is gathered from storage", false, "Incorrect. The nurse should not leave the patient alone; assistance needs are determined in advance.") ],
  tp: "Pre-exam: verify consent, prerequisites and results, supplies/equipment, appropriate room, positioning ability, and specimen needs." });

BANK.push({ cat: CC, type: "single",
  stem: "Which equipment pairing is matched to its assessment use in this chapter?",
  opts: [ O("Snellen chart for vision screening and a tuning fork among the examination supplies", true, "Correct. Box 13.2 lists the eye chart (e.g., Snellen), tuning fork, ophthalmoscope, and otoscope as examination supplies."), O("Percussion hammer for listening to heart sounds and a speculum for viewing the retina", false, "Incorrect. A percussion hammer tests reflex response by tapping; listening uses a stethoscope, and a speculum is vaginal."), O("Sphygmomanometer for measuring body temperature and a tape measure for blood pressure", false, "Incorrect. The sphygmomanometer measures blood pressure; temperature uses a thermometer, not a tape measure."), O("Tongue depressor for palpating pulses and cotton applicators for measuring height now", false, "Incorrect. Pulses are palpated with fingertip pads; height uses the scale's measurement rod, not applicators.") ],
  tp: "Box 13.2 supplies include Snellen chart, ophthalmoscope, otoscope, percussion hammer, sphygmomanometer, stethoscope, tuning fork, and vaginal speculum." });

BANK.push({ cat: CC, type: "single",
  stem: "Why is the sitting position used to assess the head, neck, thorax, and heart?",
  opts: [ O("Sitting upright allows full lung expansion and better visualization of upper-body symmetry", true, "Correct. Table 13.2 gives full expansion of lungs and visualization of symmetry as the rationale for sitting."), O("Sitting relaxes the abdominal muscles so the abdomen can be assessed more comfortably", false, "Incorrect. Abdominal muscle relaxation is the rationale for dorsal recumbent, used for abdominal assessment."), O("Sitting gives maximal exposure of the genital tract for speculum insertion during exams", false, "Incorrect. Maximal genital exposure is the rationale for lithotomy, not for the sitting position."), O("Sitting flexes the hip and knee to improve exposure of the rectal area for examination", false, "Incorrect. Hip and knee flexion improving rectal exposure describes the Sims position rationale.") ],
  tp: "Sitting: full lung expansion and symmetry of upper body. A weakened patient who cannot sit is placed supine with the head of bed elevated." });

  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 13: Physical Assessment - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
