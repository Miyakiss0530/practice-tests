/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Safety Basics, Falls, and Lifespan Risks";
var CB = "Safety Reminder Devices and Restraint-Free Care";
var CC = "Environmental Hazards, Violence, Fire, and Poisoning";
var CD = "Disasters, Terrorism, and the Nursing Process";
var CATS = [CA, CB, CC, CD];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {

 },
 CB: {

  }
 },
 CC: {
  "name": CC,
  "count": 18,

   "single": 13,
   "order": 1,
   "matrix": 1,

 },

 }
};
BANK.push({ cat: CA, type: "single", stem: "An 80-year-old woman, postoperative day 1 after bowel surgery, received a narcotic for pain 40 minutes ago. The nurse enters and finds her standing at the bedside, gripping the IV pole, saying the room is spinning. Which of the following actions should the nurse take first?", opts: [O("Document the dizziness in the chart and return after finishing the medication pass", false, "Wrong. Documentation never outranks a patient actively at risk of falling."), O("Ask the patient to walk to the bathroom slowly while the nurse watches from here", false, "Wrong. Narcotics, recent surgery, and dizziness make unassisted walking unsafe now."), O("Leave the patient standing briefly while going to the desk to get a gait belt", false, "Wrong. Leaving an unsteady, dizzy patient standing alone invites the fall itself."), O("Ease the patient back into bed or a chair and stay with her while assessing her", true, "Correct. A patient who starts to fall or is unsteady is eased into a sitting position and supported; assessment follows once she is safe. Framework: safety first.")], tp: "Fall risk rises with anesthesia, sedatives, narcotics, unsteady gait, and balance problems; assess risk on admission and on any significant change. Framework: safety first." });
BANK.push({ cat: CA, type: "single", stem: "A nurse admits a 76-year-old man with pneumonia, an IV line, and a history of one fall last year. She is assigning care to unlicensed assistive personnel (UAP). Which task must the nurse keep for herself?", opts: [O("Making sure he wears nonskid footwear whenever he gets up to walk the hallway", false, "Wrong. Confirming nonskid footwear is a delegable safety precaution."), O("Keeping his bed locked, in the low position, with his call bell within easy reach", false, "Wrong. Environmental safety measures like bed position and call bell placement are delegable."), O("Keeping his pathway to the bathroom clear of clutter, books, and loose shoes", false, "Wrong. Clearing the environment is a delegable safety precaution."), O("Scoring his fall risk assessment and deciding the precautions his score requires", true, "Correct. Assessment for risk of fall or injury requires the critical thinking and knowledge application unique to the nurse and is not delegated. Framework: Nursing Process/ADPIE.")], tp: "When delegating, the nurse stresses the patient's mobility limits, the specific measures for that patient, and easing a falling patient to a chair or the floor. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CA, type: "multi", stem: "A patient scores high on the fall risk assessment. Which precautions from the chapter should the nurse put in place? Select all that apply.", opts: [O("Keep the room dim at all times so the patient rests and stays in bed through the shift", false, "Wrong. Adequate lighting is a Box 10.1 precaution; dim rooms raise fall risk."), O("Store the patient's shoes and magazines on the floor beside the bed for quick access", false, "Wrong. Floor clutter is a trip hazard that Box 10.1 says to remove."), O("Keep the bed in the low position with wheels locked whenever care is not being given", true, "Correct. Box 10.1: beds stay low except during care, with wheels locked on beds, wheelchairs, and gurneys."), O("Demonstrate the emergency call button and instruct the patient to use it for assistance", true, "Correct. Box 10.1: demonstrate the call system and teach the patient to call for help."), O("Turn on the bed alarm because this patient is restless and disoriented during the night", true, "Correct. Box 10.1: use the bed alarm for the restless, disoriented patient."), O("Place the bedside table within reach with telephone and eyeglasses easily accessible", true, "Correct. Box 10.1: frequently used items stay within easy reach of the patient.")], tp: "Box 10.1 also covers nonslip footwear, handrails, orienting the patient, and wiping spills promptly. Framework: safety first." });
BANK.push({ cat: CA, type: "single", stem: "A UAP is ambulating a patient with a gait belt when the patient says, 'I feel faint,' and her knees begin to buckle. Which action is correct for the UAP?", opts: [O("Hold the patient upright by the belt until the faint feeling passes on its own", false, "Wrong. A buckling patient is lowered, not held standing."), O("Let go of the belt and run to the nurses' station to report what is happening", false, "Wrong. Releasing the patient abandons her mid-fall; ease her down first."), O("Ease the patient into a sitting position on the floor and alert the nurse at once", true, "Correct. When a patient starts to fall during assisted ambulation, ease the patient into a sitting position in a chair or on the floor and alert the nurse. Framework: safety first."), O("Walk the patient quickly back to her room so she can lie down in her own bed", false, "Wrong. Continuing to walk a fainting patient risks a full fall.")], tp: "The delegation briefing for ambulation must include exactly this: how to ease a falling patient down and alert the nurse. Framework: safety first." });
BANK.push({ cat: CA, type: "single", stem: "Before ambulating a patient, the nurse applies a gait belt. Which check confirms the belt is fitted correctly?", opts: [O("No fingers fit between the gait belt and the patient's waist once it is secured", false, "Wrong. A belt with no finger space is too tight to be safe or comfortable."), O("One finger fits between the gait belt and the patient's waist once it is secured", false, "Wrong. The printed check is two fingers, not one."), O("Two fingers fit between the gait belt and the patient's waist once it is secured", true, "Correct. The worker should be able to fit two fingers between the gait belt and the patient's waist. Framework: safety first."), O("A full fist fits between the gait belt and the patient's waist once it is secured", false, "Wrong. A fist is the fit check for a vest SRD, not a gait belt.")], tp: "Walk on the patient's weaker side, grasp the belt at the patient's back, and walk slightly behind with knees and hips flexed. Framework: safety first." });
BANK.push({ cat: CA, type: "single", stem: "A toddler is admitted to a pediatric unit for observation. The nurse must turn away for a moment to obtain supplies from the cart at the bedside. Which action keeps the child safe?", opts: [O("Keep the child within reach and never leave the toddler unattended during the turn", true, "Correct. Never leave an infant or toddler unattended when turning to obtain supplies; use the crib or raised side rails. Framework: safety first."), O("Ask the toddler to stay still and promise a sticker if he does not move at all", false, "Wrong. A toddler cannot be relied on to self-protect by instruction."), O("Place the toddler on the examination table, which is too high for him to climb off", false, "Wrong. An unattended toddler on a high table is a fall waiting to happen."), O("Lower the side rails so the toddler can climb down safely if he becomes restless", false, "Wrong. Lowered rails invite the fall the rails exist to prevent.")], tp: "Growth and new motor skills keep raising a child's injury risk; each stage carries its own dangers. Framework: safety first." });
BANK.push({ cat: CA, type: "single", stem: "A mother is preparing to take her crawling 9-month-old home. Which statement by the mother indicates an understanding of the teaching?", opts: [O("'I will cover the electrical outlets and keep cords out of reach now that she crawls.'", true, "Correct. As infants learn to crawl, electrical sockets and cords become a danger; covering outlets matches the stage-specific risk. Framework: Nursing Process/ADPIE."), O("'I will turn pot handles toward the front of the stove so I can reach them faster.'", false, "Wrong. Pot handles are turned away from a child's reach to prevent burns."), O("'I will leave cleaning bottles under the sink because she cannot read the labels yet.'", false, "Wrong. Inability to read labels is exactly why cleaning items are a poisoning danger."), O("'I will leave her alone in the bathtub briefly because the water is only lukewarm.'", false, "Wrong. Bath water is a hazard by temperature and by leaving a child unattended at all.")], tp: "Infants in the oral stage put almost anything in their mouths; pool safety and burn prevention round out toddler teaching. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CA, type: "single", stem: "A patient with a seizure disorder begins a generalized seizure in the day room. The nurse is called to the scene. Which of the following actions should the nurse take first?", opts: [O("Send the UAP to assess the patient while the nurse finishes the medication pass", false, "Wrong. Seizure intervention is the nurse's role, not a delegated task."), O("Assess airway patency, breathing, and circulatory status while protecting the patient", true, "Correct. Interventions during a seizure are not delegated; airway, breathing, and circulation assessment requires the nurse's critical thinking. Framework: ABCs."), O("Hold the patient's arms firmly against the chair so the movements stop quickly", false, "Wrong. Never attempt to restrain a patient during a seizure."), O("Place a padded tongue blade between the patient's teeth to protect the airway", false, "Wrong. Never place anything in the mouth of a patient during a seizure.")], tp: "Setting up seizure precautions may be delegated to trained UAP; responding to the seizure itself may not. Framework: ABCs." });
BANK.push({ cat: CA, type: "single", stem: "During a home visit, an 82-year-old woman shows the nurse three prescription bottles plus 'just vitamins and pain pills from the store' that she never mentions to her doctor. Which risk should drive the nurse's plan?", opts: [O("Accidental poisoning from unreported over-the-counter drugs interacting with prescriptions", true, "Correct. Many older adults do not consider OTC products real medicine, fail to report them, and risk interactions that potentiate or interfere with prescription drugs. Framework: safety first."), O("Intentional overdose, because unreported medications always signal a plan to self-harm", false, "Wrong. Nothing here suggests intent; the pattern is under-reporting, a knowledge and safety gap."), O("Allergic reaction to vitamins, because store brands are not checked by any pharmacist", false, "Wrong. The chapter risk is interaction and administration error, not brand allergy."), O("Medication theft by visitors, because unreported medications are stored without records", false, "Wrong. Storage by visitors is not the risk this pattern presents.")], tp: "Medication organizers or dispensers help reduce home medication errors; visual changes also raise the risk of misread labels. Framework: safety first." });
BANK.push({ cat: CA, type: "single", stem: "An older adult's blood pressure drops 25 mm Hg systolic and 10 mm Hg diastolic on standing. He takes an antihypertensive and a diuretic. Which teaching is most important for this patient?", opts: [O("Stop both medications until the blood pressure readings return to a normal range", false, "Wrong. The nurse does not stop prescribed therapy; the fix is slow rising and monitoring."), O("Rise from bed or a chair slowly to prevent the dizziness of postural hypotension", true, "Correct. The chapter prints this drop as orthostatic hypotension, and teaching slow position change prevents the vertigo that leads to falls. Framework: safety first."), O("Drink a full glass of water only after dizziness has already caused a near fall", false, "Wrong. Waiting for a near fall is reactive; slow rising prevents the event."), O("Rise from bed or a chair quickly so blood flow returns to the head without delay", false, "Wrong. Rapid rising worsens postural hypotension and fall risk.")], tp: "Sedatives, hypnotics, tranquilizers, antihypertensives, diuretics, and antihistamines all raise older adults' injury risk. Framework: safety first." });
BANK.push({ cat: CA, type: "order", stem: "A nurse admits a patient after a syncopal fall at home. Place the nurse's safety actions in the correct order.", items: [{"t": "Complete the fall risk assessment for this patient on admission to the unit", "r": "First. A fall risk assessment is performed on admission, before precautions are chosen. Framework: Nursing Process/ADPIE."}, {"t": "Determine the fall precautions required by the answers on the assessment tool", "r": "Second. Facilities require precautions when the tool's yes answers reach the set number."}, {"t": "Set the bed low and locked, call bell in reach, and orient the patient to the room", "r": "Third. The environment is arranged to match the precautions the tool required."}, {"t": "Offer fluids and toileting every 2 hours while the patient is awake on the unit", "r": "Fourth. Scheduled fluids and toileting, from Care Plan 10.1, maintain the precautions over time."}], tp: "Assessment drives precautions; the environment and scheduled rounds carry them out. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CA, type: "single", stem: "A nurse gives a double dose of a medication through a decimal-point error, and the patient dies. The nurse manager reviews the event with the team. Which statement about this event is accurate?", opts: [O("It is a sentinel event; reporting includes a thorough review and a plan to prevent recurrence", true, "Correct. A medication error leading to death is a sentinel event; reporting requires a thorough review plus an improvement plan so the event does not recur. Framework: safety first."), O("It is a near miss; reporting includes a thorough review and a plan to prevent recurrence", false, "Wrong. The patient died, so this is far beyond a near miss."), O("It is a sentinel event; reporting is optional because the error was a simple decimal slip", false, "Wrong. Reporting of certain sentinel events to The Joint Commission is required."), O("It is a staffing incident; reporting is limited to the nurse's personnel file entry only", false, "Wrong. A death from a medication error is a patient safety event, not a personnel matter.")], tp: "Inappropriate application of safety reminder devices is also listed among sentinel event examples. Framework: safety first." });
BANK.push({ cat: CB, type: "single", stem: "An ICU patient with an endotracheal tube keeps pulling at the tube. Alternatives have failed, and the provider has ordered a wrist safety reminder device. Which application is correct?", opts: [O("Pad the wrist, form a clove hitch that will not tighten, and tie to the raised side rail", false, "Wrong. Ties never anchor to side rails; the rail moves separately and can injure the patient."), O("Pad the wrist, tie a regular tight knot, and tie to the moving bed frame securely", false, "Wrong. A tight knot can constrict and impede circulation; use a quick-release knot."), O("Skip the wrist padding, form a clove hitch, and tie to the moving bed frame snugly", false, "Wrong. Padding is required to decrease injury to the underlying skin."), O("Pad the wrist, form a clove hitch that will not tighten, and tie to the moving bed frame", true, "Correct. Padding protects skin, the clove hitch does not tighten when pulled, and ties anchor to the frame that moves with the patient, with a quick-release knot. Framework: safety first.")], tp: "Leave 1 to 2 inches of slack and palpate pulses below the device to confirm circulation. Framework: safety first." });
BANK.push({ cat: CB, type: "single", stem: "During rounds, a nurse finds a patient's wrist safety reminder device tied to the side rail with a tight, regular knot. The patient's fingers are cool. Which of the following actions should the nurse take first?", opts: [O("Remove the device entirely and leave the patient unrestrained without an assessment", false, "Wrong. Abrupt removal without assessment ignores why the device was ordered."), O("Loosen the knot slightly and leave the ties attached to the side rail as they are", false, "Wrong. Side-rail anchoring stays wrong even with a looser knot."), O("Assess the circulation of the hand and then re-secure the ties correctly to the bed frame", true, "Correct. Cool fingers signal possible constriction; assess circulation first, then anchor the ties to the frame that moves with the patient using a quick-release knot. Framework: ABCs."), O("Document the finding and recheck the hand again at the end of the current shift", false, "Wrong. Cool fingers need action now, not end-of-shift documentation.")], tp: "A tight knot potentially causes constriction and impedes circulation; assessment for constriction prevents neurovascular injury. Framework: ABCs." });
BANK.push({ cat: CB, type: "multi", stem: "A patient is wearing an extremity safety reminder device. Which nursing actions are required while it is in place? Select all that apply.", opts: [O("Monitor the device's position, circulation, skin condition, and mental status often", true, "Correct. Position, circulation, skin, and mental status are monitored frequently for safety."), O("Remove the device from one extremity at a time at least every 2 hours for 5 minutes", true, "Correct. Removal is one extremity at a time, at least every 2 hours, for 5 minutes of supervised movement."), O("Assess the extremity distal to the device every 30 minutes or more often as needed", true, "Correct. Follow-up care requires distal extremity assessment every 30 minutes or more frequently."), O("Remove all devices at once every 2 hours so the patient can move freely for a while", false, "Wrong. Removal is one extremity at a time, never all at once."), O("Massage the skin beneath the device and apply lotion during the removal periods", true, "Correct. Gentle massage increases circulation; lotion or powder may be applied during removal."), O("Stay with the patient during any temporary removal of the device for repositioning", true, "Correct. The patient is never left unattended during temporary removal of an SRD.")], tp: "Change the device when it is soiled or wet, and watch for tangled ties and pressure points from knots. Framework: safety first." });
BANK.push({ cat: CB, type: "single", stem: "A nurse finds that a vest safety reminder device was put on a restless patient with the V-shaped opening at the back. The patient is now pulling at the vest. Which of the following actions should the nurse take first?", opts: [O("Assess the patient's breathing and reapply the vest with the V opening in the front", true, "Correct. A vest worn backward can choke a restless patient; assess respiratory status, then reapply with the V in front and a fist of space. Framework: ABCs."), O("Tighten the vest straps so the patient cannot pull the vest out of its position", false, "Wrong. Tightening a backward vest raises the choking risk further."), O("Document the backward placement and correct it during the next scheduled removal", false, "Wrong. A choking hazard is corrected now, not at the next removal."), O("Add a second vest over the first one so the opening cannot shift during movement", false, "Wrong. Layering devices is not a correction and adds restriction.")], tp: "With any vest SRD, monitor respiratory status; restriction from the vest can cause respiratory distress. Framework: ABCs." });
BANK.push({ cat: CB, type: "single", stem: "The family of a long-term care resident with dementia asks the nurse to 'just put the vest on him every night so he stops wandering.' Which response follows the law and the chapter?", opts: [O("Agree to the nightly vest but chart it as a positioning aid rather than a restraint", false, "Wrong. Relabeling a device does not change what it is or the rules around it."), O("Agree to the nightly vest, because a family request replaces the need for an order here", false, "Wrong. Family request does not replace a physician's written order with duration and circumstances."), O("Explain that the vest can be used nightly as long as the family signs a consent form", false, "Wrong. Consent does not make routine use lawful under OBRA."), O("Explain that routine SRD use is prohibited in long-term care and offer alternatives first", true, "Correct. OBRA prohibits routine SRD use in long-term care; alternatives such as a room near the station, sitters, and toileting routines come first. Framework: least restrictive.")], tp: "OBRA permits SRDs in long-term care only for physical safety, after all other interventions have been attempted and documented. Framework: least restrictive." });
BANK.push({ cat: CB, type: "single", stem: "A nurse, worried about a confused patient, applies a wrist safety reminder device without a provider order and without documenting any assessment or alternatives. Which consequence does the chapter name for this action?", opts: [O("The nurse risks losing delegation privileges for restraining without an order today", false, "Wrong. The named consequence is a legal charge, not a privilege loss."), O("The nurse risks a sentinel event review for restraining without an order today", false, "Wrong. Sentinel review follows patient harm events; the named risk here is false imprisonment."), O("The nurse risks charges of false imprisonment for restraining without reasonable cause", true, "Correct. Applying an SRD without a physician's order or reasonable cause incurs the risk of charges of false imprisonment. Framework: safety first."), O("The nurse risks charges of battery for restraining without reasonable cause today", false, "Wrong. The charge named in the skill is false imprisonment.")], tp: "A comprehensive assessment of the need comes before any SRD, and most facilities require a specific provider order. Framework: safety first." });
BANK.push({ cat: CB, type: "dropdown", stem: "The nurse reviews safety reminder device care intervals for a patient with a wrist device. Distal circulation is assessed every [[0]]. The device is removed at least every [[1]] for [[2]].", blanks: [{"o": [O("30 minutes", true, "Correct. The extremity distal to an extremity SRD is assessed every 30 minutes or more often."), O("2 hours", false, "Wrong. Two hours is the removal interval, not the distal check interval."), O("15 minutes", false, "Wrong. The printed distal check interval is 30 minutes.")]}, {"o": [O("2 hours", true, "Correct. The SRD is removed at least every 2 hours."), O("8 hours", false, "Wrong. Eight hours far exceeds the removal interval."), O("30 minutes", false, "Wrong. Thirty minutes is the distal assessment interval.")]}, {"o": [O("5 minutes", true, "Correct. Each removal lasts 5 minutes and covers one extremity at a time."), O("30 minutes", false, "Wrong. The printed removal period is 5 minutes."), O("60 minutes", false, "Wrong. The printed removal period is 5 minutes.")]}], tp: "Never leave the patient unattended during removal; use the time to reposition, inspect skin, and massage. Framework: safety first." });
BANK.push({ cat: CB, type: "single", stem: "An infant needs an ear examination that requires her to hold still. The nurse prepares a mummy restraint. Which action is correct?", opts: [O("Ask the mother to hold the infant unwrapped while the examiner works quickly", false, "Wrong. The mummy restraint exists because holding alone does not keep the infant safely still."), O("Apply the wrap, then step out to prepare the next patient while the exam proceeds", false, "Wrong. The infant is never left unattended in the restraint."), O("Apply the blanket wrap, remain with the infant, and remove it right after the exam", true, "Correct. Remain with the infant during a mummy restraint and remove it immediately after treatment is complete. Framework: safety first."), O("Ask the mother to apply the wrap, since infants calm fastest in a parent's hands", false, "Wrong. The applier should not be the child's parent or guardian.")], tp: "If restraint must continue, remove it at least every 2 hours and perform range-of-motion exercises on all extremities. Framework: safety first." });
BANK.push({ cat: CB, type: "single", stem: "Which chart entry best documents safety reminder device care for a patient in a wrist device?", opts: [O("'1400: wrist SRD applied because the unit was busy; family not notified of the device.'", false, "Wrong. Staffing convenience is not a reason, and family notification belongs in the record."), O("'1400: wrist SRD applied per order for pulling at IV; skin intact, fingers warm, removal due 1600.'", true, "Correct. The entry captures the reason, the order, skin and circulation status, and the removal schedule. Framework: Nursing Process/ADPIE."), O("'1400: wrist SRD applied; patient resting quietly in bed; will recheck again tomorrow.'", false, "Wrong. No reason, order, circulation check, or removal plan is documented."), O("'1400: wrist SRD applied; ties secured to side rails; patient unable to reach call bell.'", false, "Wrong. Side-rail ties and an unreachable call bell are unsafe and wrongly documented as acceptable.")], tp: "Document reason, explanation to patient and family, duration, response, circulation and skin checks, continued need, and outcome. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CB, type: "order", stem: "A provider orders a safety reminder device for a patient who keeps climbing out of bed. Place the nurse's actions in the correct order.", items: [{"t": "Assess the patient's need for the device and review the order in the care plan", "r": "First. A comprehensive assessment of need comes before application, with the order checked in the record. Framework: Nursing Process/ADPIE."}, {"t": "Perform hand hygiene, identify the patient, and explain the procedure and its reason", "r": "Second. Hand hygiene, identification, and explanation decrease anxiety and enlist cooperation."}, {"t": "Apply the device gently with padding and a quick-release knot tied to the bed frame", "r": "Third. Application follows preparation: padding, quick-release knot, frame anchor, patient unable to untie it."}, {"t": "Assess the extremity distal to the device and plan removal at least every 2 hours", "r": "Fourth. Follow-up monitoring and scheduled removal complete the cycle of care."}], tp: "Applying a device without this sequence risks injury to the patient and charges of false imprisonment. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CB, type: "single", stem: "A long-term care resident with Alzheimer disease wears a wander guard. The alarm sounds at the facility exit as the resident reaches the door. Which statement shows the nurse understands this device?", opts: [O("'The wrist device tracks his exact location anywhere in the county once he has left.'", false, "Wrong. The device alarms at exit; it is not a tracking system."), O("'The wrist device locks the exit doors automatically when he walks toward them at night.'", false, "Wrong. The device alarms; it does not lock doors."), O("'The wrist device restrains him in his chair if he tries to stand up without calling.'", false, "Wrong. The wander guard does not restrain; bed and chair alarms cover rising."), O("'The wrist device alarms when he leaves the facility, because he is at risk for elopement.'", true, "Correct. The wander guard is worn on the wrist or ankle and alarms when a resident at risk for elopement leaves the facility. Framework: safety first.")], tp: "Wander guards especially benefit confused or disoriented residents who might try to leave unsupervised. Framework: safety first." });
BANK.push({ cat: CB, type: "multi", stem: "A confused patient keeps getting out of bed at night. Which restraint-free measures should the nurse try before any safety reminder device? Select all that apply.", opts: [O("Review the patient's medications for effects that add to the nighttime restlessness", true, "Correct. Box 10.3: evaluate all medications for their therapeutic effect and contribution to the problem."), O("Apply a vest device at bedtime each night as the unit's standing routine for confusion", false, "Wrong. A standing nightly device is routine restraint, the opposite of restraint-free care."), O("Assign the patient to a room near the nurses' station and observe the patient frequently", true, "Correct. Box 10.3: confused or disoriented patients go near the station with frequent observation."), O("Encourage family or a sitter to stay with the patient during the high-risk night hours", true, "Correct. Box 10.3: family, friends, or sitters provide supervision without a device."), O("Maintain a toileting routine so the patient is not rising alone to reach the bathroom", true, "Correct. Box 10.3: toileting routines remove a common reason for unassisted rising."), O("Provide diversional activities and an exercise and ambulation schedule during the day", true, "Correct. Box 10.3: diversional activity plus exercise and ambulation schedules reduce nighttime restlessness.")], tp: "Box 10.3 also covers orientation, visual and auditory stimuli, relaxation, and eliminating bothersome treatments early. Framework: least restrictive." });
BANK.push({ cat: CC, type: "single", stem: "A patient with a documented latex allergy is scheduled for a procedure. The nurse is setting up the room. Which of the following actions should the nurse take first?", opts: [O("Use standard latex gloves but change them twice as often during the procedure", false, "Wrong. Latex gloves are not worn at all when caring for a patient with latex allergy."), O("Ask the patient to confirm the allergy again while the standard kit is opened", false, "Wrong. Confirmation does not replace switching to latex-free supplies."), O("Use exclusively latex-free products and inspect every supply kit for latex items", true, "Correct. For patients at high risk or with suspected sensitivity, use latex-free products only, including gloves, and inspect kit contents for latex. Framework: safety first."), O("Use standard latex products but keep an antihistamine ready in case of hives", false, "Wrong. Prevention with latex-free products comes before rescue medication.")], tp: "Institutions stock latex-free procedure kits; question every patient about allergies and ask specifically about latex. Framework: safety first." });
BANK.push({ cat: CC, type: "single", stem: "A nurse notices redness, itching, and hives on her hands that began a day after a run of shifts wearing latex gloves and lasted about 48 hours. Which level of latex sensitivity fits this pattern?", opts: [O("Type IV hypersensitivity, the delayed cell-mediated reaction to latex protein", true, "Correct. Type IV is the cell-mediated, delayed reaction with redness, itching, and hives lasting up to 48 hours. Framework: Nursing Process/ADPIE."), O("Type II hypersensitivity, the antibody reaction against the nurse's own cells", false, "Wrong. The chapter's latex levels are contact dermatitis, Type IV, and Type I."), O("Type I hypersensitivity, the true allergy that can end in respiratory arrest", false, "Wrong. Type I is rapid and systemic, not a 48-hour delayed skin course."), O("Contact dermatitis, the nonallergic response to processing chemicals in latex", false, "Wrong. Contact dermatitis is nonallergic and lacks the hives of this allergic picture.")], tp: "Severity of Type IV depends on the amount and type of latex protein and the degree of individual sensitivity. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CC, type: "single", stem: "Minutes after a latex catheter is placed, a patient develops hives, generalized edema, coughing, bronchospasm, and a falling blood pressure. The nurse recognizes which emergency?", opts: [O("Contact dermatitis, a nonallergic skin response to chemicals in the catheter", false, "Wrong. Contact dermatitis stays at skin redness and itching."), O("Type IV hypersensitivity, a delayed reaction that will peak in about 48 hours", false, "Wrong. This collapse is immediate and systemic, not delayed."), O("Type I hypersensitivity, a true latex allergy that can progress to arrest", true, "Correct. Type I brings local and systemic signs up to laryngeal edema, hypotension, tachycardia, and respiratory or cardiac arrest. Framework: ABCs."), O("A panic response, a brief anxiety episode that settles once staff reassure him", false, "Wrong. Bronchospasm with hypotension is an allergic emergency, not anxiety.")], tp: "Runny eyes and nose, diarrhea, and nausea also belong to the Type I systemic picture. Framework: ABCs." });
BANK.push({ cat: CC, type: "order", stem: "A glass thermometer breaks and mercury spills on a treatment room floor. Place the nurse's actions in the correct order while trained personnel are on the way.", items: [{"t": "Evacuate the room, keeping only a housekeeping crew in the area if one is available", "r": "First. Step 1 of the spill procedure is evacuating the room. Framework: safety first."}, {"t": "Ventilate the area by closing interior doors and opening the outside windows", "r": "Second. Step 2 is ventilation: interior doors closed, outside windows open."}, {"t": "Mop the floor with a mercury-specific cleanser according to the agency policy", "r": "Third. Step 4 is mopping with a mercury-specific cleanser; the spill is never vacuumed."}, {"t": "Dispose of the collected mercury under local environmental safety regulations", "r": "Fourth. Step 5 is disposal per local environmental regulations, then agency policy follow-up."}], tp: "Mercury enters the body through inhalation and skin absorption and can affect the brain or kidneys. Framework: safety first." });
BANK.push({ cat: CC, type: "single", stem: "A housekeeper reaches for a vacuum cleaner to clean up a mercury spill. Which of the following actions should the nurse take?", opts: [O("Stop the vacuuming plan only if a patient is scheduled to enter the room soon", false, "Wrong. The ban on vacuuming the spill is unconditional."), O("Stop the vacuuming plan and direct the crew to the mercury spill procedure instead", true, "Correct. The procedure states plainly: do NOT vacuum the spill; evacuate, ventilate, mop with mercury cleanser, and dispose per regulations. Framework: safety first."), O("Allow the vacuuming if the vacuum has a special filter fitted for the task", false, "Wrong. No filter exception appears in the spill procedure."), O("Allow the vacuuming but open the windows so the fumes leave the room faster", false, "Wrong. Ventilation never makes vacuuming a mercury spill acceptable.")], tp: "The nurse must know whom to contact whenever exposure to a hazardous chemical such as mercury occurs. Framework: safety first." });
BANK.push({ cat: CC, type: "single", stem: "A nurse is assigned to a patient receiving internal radiation therapy. The patient's pregnant daughter and 16-year-old son arrive to visit. Which action is correct?", opts: [O("Restrict both visitors and delegate the patient's care to the UAP for this shift", false, "Wrong. Internal radiation care is not delegated; it requires the nurse's critical thinking."), O("Allow both visitors for 10 minutes, because brief visits carry no exposure rules", false, "Wrong. The restrictions have no brief-visit exception."), O("Restrict the son only, because pregnancy matters less than the visitor age rule", false, "Wrong. Both restrictions apply: no one under 18 and no one who is or may be pregnant."), O("Restrict both visitors and use time, distance, and shielding while giving the care", true, "Correct. Visitor restrictions bar anyone younger than 18 and anyone pregnant; the nurse limits time, maximizes distance, and uses shielding. Framework: safety first.")], tp: "Staff working near radiation routinely wear dosimeters tracking cumulative exposure; readings above the limit move staff to non-radiation areas. Framework: safety first." });
BANK.push({ cat: CC, type: "matrix", stem: "A charge nurse sorts four tasks for the shift. Classify each task by whether it may be delegated to trained UAP or must be performed by the nurse.", cols: ["May delegate to trained UAP", "Nurse must perform"], rows: [{"t": "Setting up seizure precautions at the bedside of a patient at risk for seizures", "a": 0, "r": "Setup of seizure precautions is delegable when the UAP has been trained appropriately."}, {"t": "Assessing a newly admitted patient's risk for falling during this admission", "a": 1, "r": "Fall risk assessment requires the nurse's critical thinking and is not delegated."}, {"t": "Assessing airway, breathing, and circulation while a patient is actively seizing", "a": 1, "r": "Interventions during a seizure are not delegated; ABC assessment is the nurse's role."}, {"t": "Providing care to a patient who is receiving internal radiation therapy today", "a": 1, "r": "Internal radiation care is not delegated; it requires the nurse's critical thinking."}], tp: "Delegation rule of the chapter: setup and environment can go to trained UAP; assessment and intervention judgment stay with the nurse. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CC, type: "single", stem: "A visitor in a patient's room becomes agitated, raises his voice, and clenches his fists. Which positioning and approach should the nurse use?", opts: [O("Stand directly in front of him, close enough to take his arm and guide him to sit", false, "Wrong. Touching and close range put the nurse within striking distance."), O("Match his volume so he can hear that the staff is serious about the unit rules", false, "Wrong. Raising the voice, arguing, and interrupting are all prohibited responses."), O("Stand beyond the reach of his arms and legs, near the door, hands free, speaking calmly", true, "Correct. Judge arm and leg length, stand out of striking range, stay near the door, keep hands free, stay calm, and do not touch or argue. Framework: safety first."), O("Stand between him and the door so he must calm down before he can leave the room", false, "Wrong. Blocking the exit traps both parties and escalates the threat.")], tp: "Wear a breakaway badge, know panic button and alarm locations, leave when able, and complete an incident report. Framework: safety first." });
BANK.push({ cat: CC, type: "multi", stem: "Which responsibilities belong to the nurse in a workplace violence prevention program? Select all that apply.", opts: [O("Understand and follow the facility's workplace violence prevention program fully", true, "Correct. Following safety and security measures and the prevention program is a listed nurse responsibility."), O("Voice safety and security concerns when a pattern of risk becomes apparent", true, "Correct. Voicing concerns is a listed nurse responsibility."), O("Skip reporting incidents that caused no injury, since they do not count as violence", false, "Wrong. Violence includes threats and gestures; unreported incidents hide the true picture."), O("Report violent incidents promptly and accurately whenever they occur on the unit", true, "Correct. Prompt, accurate reporting is a listed nurse responsibility, even when injuries are minor."), O("Serve on health and safety committees that review incidents of workplace violence", true, "Correct. Committee service reviewing incidents is a listed nurse responsibility."), O("Take part in training on recognizing and managing potentially violent situations", true, "Correct. Training participation is a listed nurse responsibility.")], tp: "Health care's days-away rate was 10.4 per 10,000 full-time workers versus 2.1 for all workers (BLS). Framework: safety first." });
BANK.push({ cat: CC, type: "single", stem: "A nurse smells smoke and finds a wastebasket of paper burning in an occupied patient room. Which of the following actions should the nurse take first?", opts: [O("Extinguish the fire with the unit extinguisher before moving anyone from the room", false, "Wrong. Extinguishing is last in RACE, after rescue, alarm, and confine."), O("Confine the fire by closing the room door and windows before moving anyone", false, "Wrong. Confining is third, after rescue and alarm."), O("Rescue and remove the patient who is in immediate danger from the room at once", true, "Correct. R in RACE is Rescue: remove all patients in immediate danger before anything else. Framework: safety first."), O("Activate the fire alarm at the pull station down the hall before moving anyone", false, "Wrong. Alarm activation is second; the patient in immediate danger is rescued first.")], tp: "Activate the alarm before attempting to extinguish even a minor fire; an ABC extinguisher works on any fire type. Framework: safety first." });

BANK.push({ cat: CC, type: "single", stem: "Smoke is filling the corridor outside a unit, and the horizontal route through the fire doors is blocked. A helpless patient must be moved down an interior stairway by one staff member. Which method fits?", opts: [O("The elevator carry, with the blanket extending 8 inches above the patient's head", false, "Wrong. Elevators are never used as an exit route during a fire."), O("The blanket drag, with the blanket extending 8 inches above the patient's head", true, "Correct. When vertical evacuation by stairway is necessary, one person can use the blanket drag; the patient comes headfirst with the blanket 8 inches above the head. Framework: safety first."), O("The universal carry, with the blanket extending 8 inches above the patient's head", false, "Wrong. The universal carry moves a patient from bed to floor, not down stairs."), O("The two-person swing, with the blanket extending 8 inches above the patient's head", false, "Wrong. The swing needs two staff and is not a stairway method.")], tp: "Move horizontally first; go vertical only when smoke or fire blocks the horizontal route. Framework: safety first." });
BANK.push({ cat: CC, type: "single", stem: "During a nursery evacuation, the nurse must move two infants quickly. Which method follows the chapter?", opts: [O("Place each infant alone in a separate crib and roll the cribs one at a time slowly", false, "Wrong. Two people can pull one crib together, but the bassinet-on-blanket method moves two at once."), O("Place both infants in one bassinet and carry the bassinet down the elevator shaft", false, "Wrong. Elevators are never used during a fire evacuation."), O("Carry one infant in each arm and walk both infants out of the unit separately", false, "Wrong. Arm carrying is not the chapter's infant evacuation method."), O("Place both infants in one bassinet with padding, set it on a blanket, and pull to safety", true, "Correct. Place two infants in each bassinet if possible with diaper or blanket padding, set the bassinet on a blanket, fold a pocket, and pull to safety. Framework: safety first.")], tp: "Two staff can also place babies in one crib and pull the crib to the prescribed area. Framework: safety first." });
BANK.push({ cat: CC, type: "single", stem: "A 3-year-old is brought in after drinking furniture polish. The parent asks whether to make the child vomit. Which of the following actions should the nurse take first?", opts: [O("Tell the parent to induce vomiting quickly so the polish leaves the stomach at once", false, "Wrong. Vomiting after polish ingestion raises the risk of internal burns."), O("Tell the parent not to induce vomiting and contact the poison control center for guidance", true, "Correct. Vomiting is not induced for furniture polish because it increases the risk of internal burns; poison control furnishes treatment guidelines. Framework: safety first."), O("Tell the parent to give syrup of ipecac and then drive the child to the clinic", false, "Wrong. Ipecac is no longer recommended for use."), O("Tell the parent to give the child milk and watch at home for the next few hours", false, "Wrong. Home watching delays the poison control guidance this ingestion needs.")], tp: "Vomiting is also never induced in an unconscious person, because of aspiration risk. Framework: safety first." });
BANK.push({ cat: CC, type: "multi", stem: "A nurse gathers the history for a child with a suspected poisoning. Which data belong in that history? Select all that apply.", opts: [O("The route of exposure, whether injected, ingested, inhaled, or absorbed via skin", true, "Correct. Box 10.11: identify the route, type, and amount of the poisonous substance."), O("The brand of the container and the store where the family purchased the product", false, "Wrong. Purchase details do not guide antidote or treatment decisions."), O("Allergies, prescribed medications, medical problems, and general health state", true, "Correct. Box 10.11: allergy, medication, and medical history are part of the data gathering."), O("The type and amount of the substance and how long ago the poisoning happened", true, "Correct. Box 10.11: type, amount, and time since exposure guide antidote and treatment choices."), O("The names of siblings who were in the home when the exposure event occurred", false, "Wrong. Sibling names are not part of the poisoning history."), O("Changes in mental status and any motor or sensory deficits found on assessment", true, "Correct. Box 10.11: assess for mental status changes and motor and sensory deficits.")], tp: "Notify the poison control center and follow facility protocols; monitor vital signs and treatment response afterward. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CC, type: "single", stem: "A parent tells the home health nurse, 'I keep syrup of ipecac in the cabinet, just in case one of the kids swallows something.' Which response is correct?", opts: [O("'Ipecac should not be kept at home; the first step is to call poison control instead.'", true, "Correct. The AAP and poison control centers recommend ipecac not be kept in homes; the first action in an ingestion is calling 1-800-222-1222. Framework: Nursing Process/ADPIE."), O("'That is a good plan; give it first and call poison control only if symptoms appear.'", false, "Wrong. Ipecac use at home is exactly what current guidance advises against."), O("'Keep it, but store it on a high shelf so the children cannot reach the bottle.'", false, "Wrong. Storage height does not fix the recommendation against keeping ipecac."), O("'That is a good plan; ipecac works best when given within the first five minutes.'", false, "Wrong. The chapter states ipecac is no longer recommended at all.")], tp: "Most pharmacies no longer carry ipecac syrup, and the FDA is considering prescription-only status. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CC, type: "single", stem: "A nurse finds the unit's sharps container filled past the fill line, with a needle protruding. Which action is correct?", opts: [O("Carry the container to the soiled utility room balanced on top of a linen cart", false, "Wrong. Transporting an overfilled container spreads the exposure risk to others."), O("Press the protruding needle down with a gloved hand so the lid can close tightly", false, "Wrong. Pushing on a protruding needle is how a stick occurs."), O("Empty half the contents into a second container so the first one can keep being used", false, "Wrong. Handling loose sharps contents multiplies exposure for everyone involved."), O("Stop using the container, report it, and use a fresh container for the next disposal", true, "Correct. Sticking a needle into an overfilled sharps container is a named cause of needlestick injury; the container must be replaced, not forced. Framework: safety first.")], tp: "Stray needles in linens or wastebaskets endanger housekeeping and laundry staff, not only caregivers. Framework: safety first." });
BANK.push({ cat: CC, type: "single", stem: "A newly hired nurse needs the hepatitis B vaccine series. Which schedule follows the CDC recommendations in the chapter?", opts: [O("Three doses: now, the second in 6 months, the third about 5 months after that", false, "Wrong. The second dose comes at 1 month, not 6 months."), O("Three doses: now, the second in 1 month, the third about 5 months after the second", true, "Correct. The 3-dose hepatitis B series runs now, 1 month, and approximately 5 months after dose 2, with anti-HBs testing 1 to 2 months after dose 3. Framework: Nursing Process/ADPIE."), O("Two doses: now, the second in 1 month, with no third dose required for staff", false, "Wrong. Hepatitis B for health care personnel is a 3-dose series."), O("One dose now, repeated every 10 years with the tetanus booster schedule", false, "Wrong. The 10-year booster rhythm belongs to Td, not hepatitis B.")], tp: "Also on the CDC list: influenza yearly, varicella 2 doses 4 weeks apart, and Tdap once with Td boosters every 10 years. Framework: Nursing Process/ADPIE." });
BANK.push({ cat: CD, type: "single", stem: "A tornado strikes a nearby town and casualties begin arriving at the emergency department in waves. Which action anchors the nurse's response?", opts: [O("Follow the facility disaster plan and carry out her assigned disaster responsibilities", true, "Correct. The disaster manual sets chain of command, call-back, assignments, and triage; knowing her own responsibilities saves valuable time. Framework: Nursing Process/ADPIE."), O("Follow the routine admission routine and carry out her usual assignment unchanged", false, "Wrong. A disaster activates the disaster plan, not business as usual."), O("Wait for the state governor's office to fax instructions before treating any arrivals", false, "Wrong. The facility plan, drills, and codes exist so response starts immediately."), O("Send stable inpatients home without assessment to make room for the new arrivals", false, "Wrong. Discharge or transfer follows assessment under the plan, never blanket release.")], tp: "This is an external disaster; the emergency department is the main focus of activity. Framework: Nursing Process/ADPIE." });

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
