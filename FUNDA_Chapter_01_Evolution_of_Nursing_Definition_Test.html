BANK.push({ cat: CA, type: "single", stem: "Which statement about the origin of the word nursing is accurate?", opts: [ O("It traces to the Latin nutrire, about nourishing, feeding, fostering and supporting people", true, "Correct. The chapter traces nursing to nutrire, with that nourishing and supporting sense."), O("It traces to the Greek word for hospital, about housing sick strangers in one large building", false, "Incorrect. That hospital-origin story is not the Latin nutrire origin the chapter gives."), O("It traces to the Latin word for cure, about removing disease from the body with medicine alone", false, "Incorrect. The root is about nourishing and fostering, not curing disease with medicine."), O("It traces to a Crimean army term, about carrying a lamp during night rounds on a ward of soldiers", false, "Incorrect. The lamp belongs to Nightingale's later image, not to the origin of the word.") ], tp: "Nursing comes from nutrire: to nourish, feed, foster and support." });
BANK.push({ cat: CA, type: "single", stem: "How did early civilizations in the chapter explain illness?", opts: [ O("Sickness showed an evil spirit had entered the body or showed divine disfavor by God", true, "Correct. Illness was read as an evil spirit entering the body or as a sign of divine disfavor."), O("Sickness showed a germ had entered the body through spoiled food or dirty drinking water", false, "Incorrect. Germ explanations came much later; early belief centered on spirits and God."), O("Sickness showed the four humors were balanced and the body needed rest, food and fresh air", false, "Incorrect. The chapter's early account is spiritual, centered on spirits and divine favor."), O("Sickness showed a vitamin was missing and the diet needed specific foods added each day", false, "Incorrect. Nutritional deficiency explanations are not the chapter's early-civilization account.") ], tp: "Early illness beliefs: evil spirits and divine disfavor, not germs." });
BANK.push({ cat: CA, type: "single", stem: "Which treatment set matches the medicine men described in the chapter?", opts: [ O("Purgatives, emetics, hot and cold applications, cautery, cupping and massage given to patients", true, "Correct. Those are the treatments the chapter lists for medicine men in early care."), O("Herbal teas only, bed rest only, prayer only and fasting only, with no physical treatment at all", false, "Incorrect. The chapter lists active physical measures such as cautery and cupping."), O("Insulin, dialysis, chemotherapy, radiation and ventilator support given to patients in hospitals", false, "Incorrect. Those belong to modern high-technology care, not to early medicine men."), O("Antibiotics, vaccines, blood transfusions, oxygen therapy and surgery given to patients daily", false, "Incorrect. Those are modern treatments, not the ritual-era measures in the chapter.") ], tp: "Medicine men: purgatives, emetics, cautery, cupping, massage, hot and cold." });
BANK.push({ cat: CA, type: "single", stem: "Which description fits the early 19th-century hospital in the chapter?", opts: [ O("A small home-based service where one family caregiver looked after a single paying patient only", false, "Incorrect. The chapter describes large dirty facilities, not one-to-one home care."), O("A university teaching center where students trained for one full year before touching patients", false, "Incorrect. Formal one-year training describes the later Nightingale school model."), O("A clean, quiet facility where trained graduates gave skilled care and few infections occurred", false, "Incorrect. That describes the reformed hospital Nightingale worked toward, not the pesthouse."), O("A dirty, overcrowded pesthouse where untrained providers gave care and infections spread easily", true, "Correct. Pesthouses were dirty and overcrowded, care was untrained, and mortality was high.") ], tp: "Pesthouse: dirty, overcrowded, untrained care, high infection and mortality." });
BANK.push({ cat: CA, type: "single", stem: "Which fact about Florence Nightingale is accurate?", opts: [ O("She joined the Kaiserswerth program in 1860 at age 40 and later led nurses to Pittsburgh", false, "Incorrect. The year was 1851 at age 31, and the war posting was Scutari, not Pittsburgh."), O("She wrote the first American licensure law in 1903 and led nurses during World War One", false, "Incorrect. Licensure in 1903 was a state action in America, long after her Crimean work."), O("She joined the Kaiserswerth program in 1851 at age 31 and later led nurses to Scutari", true, "Correct. She entered Kaiserswerth in 1851 at 31 and led 38 nurses to Scutari, Turkey."), O("She founded the first American nursing school in 1873 and led nurses during the Civil War", false, "Incorrect. The 1873 schools were American followers of her plan; she did not found them.") ], tp: "Nightingale: Kaiserswerth 1851, age 31; Scutari with 38 nurses." });
BANK.push({ cat: CA, type: "single", stem: "Which statement about the Nightingale Plan of 1860 is accurate?", opts: [ O("The school trained only physicians, placed graduates in a register, and lasted a single month", false, "Incorrect. It trained nurses for one year, not physicians for a single month."), O("The school ran separately from the hospital, was financially independent, and kept full records", true, "Correct. Independence kept the focus on education, and complete student records were kept."), O("The school admitted any applicant, required no references, and offered training of three months", false, "Incorrect. Admission was strict, with character references and proven capability required."), O("The school was run by the hospital, funded by ward fees, and kept no records on students", false, "Incorrect. The school was independent and record keeping was central to the plan.") ], tp: "Nightingale Plan: separate, financially independent school; strict admission; full records; 1-year training." });
BANK.push({ cat: CA, type: "multi", stem: "Which statements about Nightingale's work are accurate? Select all that apply.", opts: [ O("Her school at Saint Thomas Hospital in London opened in 1903 as the first licensed program", false, "Incorrect. The Saint Thomas school opened in 1860, decades before state licensure began."), O("Cleaning units and washing clothes regularly at Scutari was followed by a major fall in deaths", true, "Correct. Hygiene and sanitation changes at the Barrack Hospital cut the death rate greatly."), O("She is credited as the first nursing theorist and raised the image of nursing overall", true, "Correct. The chapter credits her as the first nursing theorist whose standards won respect."), O("Her night rounds with a lamp led soldiers to call her the Lady with the Lamp", true, "Correct. The lamp on night rounds gave her that name and became nursing's symbol."), O("Her graduate register was a state license that made it illegal to practice without it", false, "Incorrect. The register tracked graduates' employment; it was a seed of licensure, not a license.") ], tp: "Nightingale traps: the register was not a license, and the school year was 1860, not 1903." });
BANK.push({ cat: CA, type: "single", stem: "What did the Nightingale register record?", opts: [ O("Each patient's diagnosis, diet and daily temperature while staying on a hospital ward", false, "Incorrect. Patient charting is documentation; the register tracked the graduates themselves."), O("Each state's examination questions and pass rates for nurses seeking a practice license", false, "Incorrect. State testing pools came later in America and are not the Nightingale register."), O("Each student's family income, home address and personal references before admission day", false, "Incorrect. Admission screening used references, but the register followed employment after school."), O("Each graduate's places of employment after finishing the program at the school in London", true, "Correct. Records were kept on graduates' places of employment after graduation.") ], tp: "Register = where graduates went to work; the beginning of control over practicing nurses." });
BANK.push({ cat: CB, type: "single", stem: "Which pairing of leader and contribution is accurate?", opts: [ O("Clara Barton and the Frontier Nursing Service delivering babies in the hills of Kentucky", false, "Incorrect. The Frontier Nursing Service on horseback belongs to Mary Breckinridge."), O("Clara Barton and the first nursing records system used in hospitals across the whole country", false, "Incorrect. The first records and documentation system belong to Linda Richards."), O("Clara Barton and the development of the American Red Cross in the year 1881 in America", true, "Correct. Table 1.1 credits Clara Barton with developing the American Red Cross in 1881."), O("Clara Barton and the founding of the Henry Street Settlement for public health nursing work", false, "Incorrect. Henry Street and public health nursing belong to Lillian Wald, not Barton.") ], tp: "Pair anchors: Barton-Red Cross, Wald-Henry Street, Richards-records, Breckinridge-Frontier." });
BANK.push({ cat: CB, type: "single", stem: "Linda Richards is best known in the chapter for which contribution?", opts: [ O("Being the first trained nurse in America and developing the first nursing and hospital records", true, "Correct. Richards was America's first trained nurse and built the first records system."), O("Being superintendent of Union Army nurses and crusading for care of people with mental illness", false, "Incorrect. Those roles belong to Dorothea Dix, not to Linda Richards."), O("Being the first African American professional nurse and opening doors for other Black nurses", false, "Incorrect. That distinction belongs to Mary Eliza Mahoney, who graduated in 1879."), O("Being a founder of the American Journal of Nursing and grading theory and practice in schools", false, "Incorrect. The graded system and journal founding belong to Isabel Hampton Robb.") ], tp: "Richards = first trained nurse in America + first records/documentation system." });
BANK.push({ cat: CB, type: "single", stem: "Which statement about Mary Eliza Mahoney is accurate?", opts: [ O("She organized diet kitchens and ambulance services for soldiers during the American Civil War", false, "Incorrect. Diet kitchens, laundries and ambulance service belong to Mary Ann Ball."), O("She graduated in 1879 and became the first African American professional nurse in America", true, "Correct. Mahoney graduated from the New England Hospital for Women and Children in 1879."), O("She founded a settlement house in New York and started public health nursing in America then", false, "Incorrect. The settlement house and public health nursing belong to Lillian Wald."), O("She graduated in 1903 and became the first nurse licensed under a state practice act in America", false, "Incorrect. Her graduation was 1879, before the first state licensure laws of 1903.") ], tp: "Mahoney: 1879, first African American professional nurse." });
BANK.push({ cat: CB, type: "single", stem: "Which leader-match is correct for Lillian D. Wald?", opts: [ O("She developed the American Society of Superintendents with Dock to set standards in 1893", false, "Incorrect. That 1893 organization work belongs to Robb together with Lavinia Dock."), O("She developed public health nursing through the Henry Street Settlement in New York City", true, "Correct. Wald founded the Henry Street Settlement and developed public health nursing."), O("She developed the curriculum concepts and guidelines used by student nurses in schools", false, "Incorrect. Curriculum concepts and the International Council link belong to Mary Nutting."), O("She developed nurse-midwifery care for mothers in Kentucky, traveling to them on horseback", false, "Incorrect. Horseback midwifery in Kentucky belongs to Mary Breckinridge.") ], tp: "Wald = public health nursing + Henry Street Settlement." });
BANK.push({ cat: CB, type: "multi", stem: "Which statements about the first United States nursing schools are accurate? Select all that apply.", opts: [ O("All three schools required a state license from applicants before admission to training", false, "Incorrect. State licensure did not exist until 1903, thirty years after these schools."), O("The Connecticut Training School opened in New Haven in October of that same year, 1873", true, "Correct. Connecticut followed in October 1873, then Boston in November 1873."), O("The Boston Training School began at Massachusetts General Hospital in November 1873", true, "Correct. Boston was the November 1873 school, completing the trio of that year."), O("All three schools were opened and directed personally by Florence Nightingale herself", false, "Incorrect. They were modeled on her plan; Nightingale did not come to direct them."), O("Bellevue Hospital School of Nursing opened in May 1873 as the leading Nightingale Plan school", true, "Correct. Bellevue opened in May 1873 as the foremost US proponent of the Nightingale Plan.") ], tp: "1873 trio: Bellevue May, Connecticut October, Boston November - all Nightingale Plan." });
BANK.push({ cat: CB, type: "single", stem: "What did Pastor Theodore Fliedner do in the United States in 1849?", opts: [ O("He brought forty student nurses and helped start the first public hospital in New York City then", false, "Incorrect. He brought four deaconesses, and the hospital was in Pittsburgh, not New York."), O("He brought four trained deaconesses and helped start the first Protestant hospital in Pittsburgh", true, "Correct. Fliedner brought four Kaiserswerth deaconesses and the Pittsburgh Infirmary followed."), O("He wrote the first state nursing law and helped start the first licensure board in North Carolina", false, "Incorrect. State licensure laws began in 1903, more than fifty years after Fliedner's trip."), O("He founded the Cadet Nurse Corps and helped start abbreviated wartime training in Pittsburgh then", false, "Incorrect. The Cadet Nurse Corps belongs to World War II, not to 1849.") ], tp: "1849: Fliedner + 4 deaconesses; Pittsburgh Infirmary, now Passavant Hospital." });
BANK.push({ cat: CB, type: "single", stem: "Which statement about the Cadet Nurse Corps is accurate?", opts: [ O("It gave volunteer women a license without any training so they could staff military hospitals", false, "Incorrect. It still gave training; the concern in World War I was wholly untrained volunteers."), O("It gave an abbreviated training program in World War II to supply basic nursing care quickly", true, "Correct. The Cadet Nurse Corps was a federally backed abbreviated program in World War II."), O("It gave a four-year degree program in World War I to supply advanced practice nurses quickly", false, "Incorrect. It was abbreviated and in World War II, not a four-year World War I degree."), O("It gave British nurses a one-year London program modeled directly on the Nightingale Plan only", false, "Incorrect. It was an American World War II program, not a London Nightingale school.") ], tp: "Cadet Nurse Corps: World War II, abbreviated, federally subsidized." });
BANK.push({ cat: CB, type: "single", stem: "Which statement about the 1887 floor-nurse job description in Box 1.1 is accurate?", opts: [ O("Day duty ran for eight hours only, with two full days off guaranteed every single week", false, "Incorrect. The 1887 hours were 13-hour days, nothing like an eight-hour schedule."), O("A nurse was forbidden to clean floors, carry coal, fill lamps or make her own pen nibs daily", false, "Incorrect. Box 1.1 required exactly those chores: floors, coal, lamps and pen nibs."), O("Day duty ran from 7 in the morning to 8 in the evening, with Sunday partly off at midday", true, "Correct. Box 1.1 lists day duty 7 a.m. to 8 p.m., off Sunday from noon to 2 p.m."), O("A nurse earned a large raise each year and kept all pay without any rule about saving it", false, "Incorrect. The raise was 5 cents a day after 5 faultless years, and saving was required.") ], tp: "Box 1.1, 1887: 7 a.m.-8 p.m., housekeeping chores, save half of $30, 5-cent raise after 5 years." });
BANK.push({ cat: CC, type: "single", stem: "Which group of states first mandated nursing licensure, and in which year?", opts: [ O("Mississippi, Texas, California and Virginia together, in the year 1903 in the United States", false, "Incorrect. Mississippi, Texas and California are linked to PN and LVN naming, not the 1903 four."), O("Massachusetts, Connecticut, New York and Virginia, in the year 1873 in the United States", false, "Incorrect. 1873 is the year of the first Nightingale Plan schools, not of licensure."), O("North Carolina, New Jersey, New York and Virginia, in the year 1914 in the United States", false, "Incorrect. 1914 is Mississippi's first practical-nurse registration laws, not the 1903 group."), O("North Carolina, New Jersey, New York and Virginia, in the year 1903 in the United States", true, "Correct. Those four states mandated licensure first, in 1903: three N states plus Virginia.") ], tp: "First licensure: 1903, NC + NJ + NY + VA." });
BANK.push({ cat: CC, type: "single", stem: "Which statement contrasts an approved program with accreditation accurately?", opts: [ O("Approval is granted by a national accreditor; accreditation is granted by each state's own board", false, "Incorrect. Approval comes from the state agency; accrediting bodies run accreditation."), O("Approval is the state minimum for licensure eligibility; accreditation is a voluntary higher review", true, "Correct. Approval is the required state minimum; accreditation is voluntary and often higher."), O("Approval is a voluntary higher review; accreditation is the state minimum for licensure eligibility", false, "Incorrect. That reverses the pair: the state minimum is approval, not accreditation."), O("Approval and accreditation are two names for the same state review, both required for licensure", false, "Incorrect. They differ: one is the state minimum, the other a voluntary criteria review.") ], tp: "Approval = state minimum, required for licensure eligibility. Accreditation = voluntary, often higher." });
BANK.push({ cat: CC, type: "single", stem: "What does articulation do for a nurse moving up in education?", opts: [ O("It lets the nurse practice beyond state scope after completing a portfolio for the career ladder", false, "Incorrect. A portfolio supports career-ladder advancement; it does not expand legal scope."), O("It lets the nurse transfer a license between states without meeting the new state's own rules", false, "Incorrect. Articulation is about educational credit between programs, not license transfer."), O("It lets the nurse skip the licensure examination after finishing an approved nursing program", false, "Incorrect. Graduates of approved programs still apply for and pass the licensure exam."), O("It lets the nurse advance toward the next degree without repeating coursework already completed", true, "Correct. Articulation gives up to 50 percent credit and avoids repeating prior coursework.") ], tp: "Articulation: up to 50% credit, 1-plus-1 and 2-plus-2, no repeated coursework." });

function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 1: The Evolution of Nursing - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
</html>
