<script>
/* ============ QUESTION BANK — SITUATIONAL PRACTICE TEST (BRUTAL MODE) ============ */
/* Herlihy Chapter 7: Integumentary System and Body Temperature — realistic vignettes,
   second/third-order reasoning, prioritization, classic ATI phrasing, no pure recall.
   Includes one unfolding NGN case study (grp "case1", 6 linked questions).
   Facts ONLY from the verified Ch 7 guide content. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Skin Barrier, Layers, and Assessment Findings";
var CB = "Glands, Hair, and Nails in Clinical Findings";
var CC = "Temperature Regulation and Thermal Emergencies";
var CD = "Newborn Temperature Care";
var CE = "Burn Assessment and Care";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = ["dermis", "epidermis", "sebum", "apocrine glands", "eccrine glands", "alopecia", "clubbing", "hyperthermia", "pyrexia", "antipyretic", "hypothalamus", "radiation", "conduction", "convection", "evaporation", "nonshivering thermogenesis", "eschar", "rule of nines"];
var BLUEPRINT = {
  CA: { name: CA, count: 7, types: { single: 6, multi: 1 } },
  CB: { name: CB, count: 7, types: { single: 6, multi: 1 } },
  CC: { name: CC, count: 8, types: { single: 5, multi: 1, order: 1, dropdown: 1 } },
  CD: { name: CD, count: 4, types: { single: 3, multi: 1 } },
  CE: { name: CE, count: 10, types: { single: 7, multi: 3 } }
};

/* ---------- SKIN BARRIER, LAYERS, AND ASSESSMENT FINDINGS ---------- */
BANK.push({ cat: CA, type: "single",
  stem: "A 22-year-old client tells the nurse she is getting a tattoo and asks why the artist insists the needle must go deeper than the very surface of the skin. Which response by the nurse is correct?",
  opts: [
    O("The surface layer sheds continuously, so pigment placed there would be lost as the cells slough off", true, "The epidermis is in constant turnover, shedding about 40,000 cells per minute; the guide states tattoo ink must be deposited into the dermis because of the sloughing of the epidermis."),
    O("The surface layer contains the blood vessels, so pigment placed there would wash away in the blood", false, "The epidermis is avascular and contains no blood vessels; pigment loss at the surface is a shedding problem, not a washout problem."),
    O("The surface layer is waterproof, so the needle cannot deposit any pigment into it at all", false, "Keratin makes the skin water resistant, but needles do penetrate it; the issue is that pigment deposited there leaves with the shedding cells."),
    O("The surface layer grows inward, so pigment placed there would be pushed down into the fat layer", false, "Growth runs the other way: new cells are produced deep and push older cells up toward the surface, where they are shed.")
  ],
  tp: "ANSWER KEY — Correct answer: surface pigment is lost because the epidermis sheds continuously, so ink must reach the dermis. DETAILED RATIONALE — The epidermal conveyor belt moves cells from the dividing deep layer to the shedding surface layer, and anything stored in that belt rides it out of the body. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Nursing Process — assessment and analysis of structure before patient teaching." });

BANK.push({ cat: CA, type: "single",
  stem: "An 84-year-old patient has thin, translucent skin, bruises after minor bumps, and a small skin tear that is healing slowly. Which interpretation by the nurse is correct?",
  opts: [
    O("These findings fit aging change: thinner epidermis and dermis, fewer dermal vessels, and slower healing", true, "With aging the epidermal cells reproduce more slowly and the skin thins; the dermis loses collagen, elastin, and blood vessels, making the skin fragile, prone to small hemorrhages, and slower to heal."),
    O("These findings indicate a new bleeding disorder, because aging skin keeps its full thickness and speed", false, "Aging skin does not keep full thickness: thinning and vessel loss are the printed aging pattern, and they explain all three findings without a new disorder."),
    O("These findings show the subcutaneous layer has thickened, pushing vessels away from the skin surface", false, "The subcutaneous fat layer decreases with aging rather than thickening, which is part of why the skin wrinkles and temperature control weakens."),
    O("These findings mean the sebaceous glands are overactive, thinning the skin from the surface downward", false, "Sebaceous activity decreases with aging, producing dry skin and brittle hair; gland overactivity does not thin the skin or slow its healing.")
  ],
  tp: "ANSWER KEY — Correct answer: the findings fit the aging pattern of thinner skin, fewer dermal vessels, and slower healing. DETAILED RATIONALE — Aging changes arrive as a set across all three layers, and each finding in the stem maps to one printed change rather than to a new disease. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Nursing Process — assessment first: separate expected aging change from findings that need a workup." });

BANK.push({ cat: CA, type: "single",
  stem: "A farm worker is brought in after a day of spraying crops, with headache and nausea. His work clothes are soaked with the spray, and the triage nurse suspects pesticide poisoning. Which action is the priority?",
  opts: [
    O("Remove the soaked clothing and wash the skin thoroughly before continuing the assessment", true, "The skin absorbs toxins, including pesticides, and farm workers exposed to chemical sprays are commonly treated for pesticide poisoning; stopping continued absorption through the skin comes first."),
    O("Cover the soaked clothing with a gown and complete a full set of vital signs before any washing", false, "Vital signs matter, but leaving pesticide-soaked clothing against the skin lets absorption continue during the delay; decontamination of the skin is the time-critical step."),
    O("Apply a thick layer of lotion over the exposed skin to seal the surface before washing it later", false, "Skin lotions themselves can be absorbed, and sealing the surface traps the chemical against the skin instead of removing it."),
    O("Ask the patient to shower at home after discharge, since skin absorption is too slow to matter today", false, "The guide warns directly against underestimating absorption: toxins cross the skin readily enough to poison workers during a single workday.")
  ],
  tp: "ANSWER KEY — Correct answer: remove the soaked clothing and wash the skin to stop ongoing absorption. DETAILED RATIONALE — The same permeability that makes transdermal drug delivery possible makes toxin exposure dangerous; the barrier works both ways only until chemicals cross it. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Safety first — remove the ongoing exposure before completing lower-priority assessment steps." });

BANK.push({ cat: CA, type: "single",
  stem: "An 80-year-old patient receives a prescribed drug by subcutaneous injection each morning. The nurse notes the drug is taking noticeably longer to act than it did when the patient was younger. Which explanation is correct?",
  opts: [
    O("Blood vessels in the subcutaneous tissue decrease with aging, so the drug is absorbed more slowly", true, "The guide's aging notes state that blood vessels in the subcutaneous tissue decrease and drugs given by that route are absorbed more slowly."),
    O("The epidermis thickens with aging, so the needle no longer reaches the subcutaneous layer at all", false, "The epidermis thins with aging rather than thickening, and the injection does reach the layer; the delay is in absorption from the layer, not in placement."),
    O("The subcutaneous layer becomes part of the skin with aging, and skin tissue absorbs drugs slowly", false, "The subcutaneous layer is not part of the skin at any age; its loose connective and adipose tissue simply has fewer vessels in old age."),
    O("Sweat gland activity increases with aging and washes the injected drug back out through the pores", false, "Sweat gland activity decreases with aging, and sweat glands do not remove injected medication from the subcutaneous tissue.")
  ],
  tp: "ANSWER KEY — Correct answer: fewer subcutaneous blood vessels with aging slow absorption of the injected drug. DETAILED RATIONALE — Absorption speed follows vessel supply, and the aging section ties the slower effect directly to vessel loss in that layer. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Nursing Process — analysis: match an unexpected drug response to the age-related structural change." });

BANK.push({ cat: CA, type: "single",
  stem: "A 58-year-old patient reports a band of painful blistering lesions wrapping from the spine around one side of the trunk. She had chickenpox as a child. Which interpretation should guide the nurse's assessment?",
  opts: [
    O("The lesions follow the path of a nerve, fitting herpes zoster from the chickenpox virus", true, "Herpes zoster is an inflammation of nerves caused by the chickenpox virus, and it develops painful skin lesions along the path of the nerve — exactly this one-sided band."),
    O("The lesions follow the path of a blood vessel, fitting a drug reaction to a new medication", false, "The drug-reaction story in the guide is hives after penicillin; a nerve-path band of painful lesions is the shingles pattern, not a vessel or drug pattern."),
    O("The lesions follow a sebaceous gland line, fitting blocked glands infected with staphylococci", false, "Infected blocked glands produce individual pimples; they do not form a painful band wrapping one side of the trunk along a nerve."),
    O("The lesions follow a sweat gland line, fitting colored sweat trapped under the trunk skin", false, "Colored sweat is chromhidrosis, a change in sweat color; it does not produce painful blistering lesions along a nerve path.")
  ],
  tp: "ANSWER KEY — Correct answer: painful lesions along a nerve path fit herpes zoster from the chickenpox virus. DETAILED RATIONALE — Distribution is the diagnostic clue the skin offers here: lesions that trace a nerve announce a nerve-based disease rather than a gland or vessel problem. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Nursing Process — assessment: read the pattern of the finding before naming the condition." });

BANK.push({ cat: CA, type: "single",
  stem: "A warehouse worker shows the nurse a thickened patch across one palm and a cone-shaped overgrowth on the side of one toe. He wears tight boots and grips rough handles all shift. Which teaching is correct?",
  opts: [
    O("Constant rubbing speeds epidermal cell division in both spots; the toe lesion is shaped by the pressure point", true, "Constant irritation or rubbing increases the rate of epidermal cell division, producing a thickened callus, and constant rubbing of a toe by a poorly fitting shoe produces the conical overgrowth called a corn."),
    O("Both lesions are patches of dead tissue from pressure, and both should be cut away at the next visit", false, "These are overgrowths of living epidermal cells driven by friction, not dead tissue layers like burn eschar, and the teaching point is removing the friction source."),
    O("The palm patch comes from oil gland blockage, and the toe lesion comes from sweat gland blockage", false, "Gland blockage produces blackheads and pimples on the skin surface; thickened and conical friction lesions are epidermal growth responses, not gland problems."),
    O("Constant rubbing slows epidermal cell division in both spots, thinning the skin until it overgrows", false, "The direction is reversed: rubbing increases the division rate, and the increased production is what thickens the area.")
  ],
  tp: "ANSWER KEY — Correct answer: friction speeds epidermal division, thickening the palm and shaping the toe lesion. DETAILED RATIONALE — One mechanism explains both lesions, and the difference in shape follows the difference in how the friction is applied; fixing footwear and grip addresses the cause. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Nursing Process — planning: teach cause removal rather than lesion removal." });

BANK.push({ cat: CA, type: "multi",
  stem: "The nurse reviews four patients whose skin findings may signal something deeper. Which findings require prompt follow-up? Select all that apply.",
  opts: [
    O("A patient on a sulfa drug whose generalized rash is spreading and worsening by the hour", true, "A sulfa allergy rash can progress to Stevens-Johnson syndrome, a potentially lethal condition, so a spreading rash on a sulfa drug is a red-flag finding."),
    O("A patient with a severe staphylococcal infection whose skin looks scalded and is peeling", true, "Scalded skin syndrome is a severe generalized staphylococcal infection in which the skin appears scalded and peels off in layers."),
    O("A patient whose forearm blistered after lime juice was spilled on it before sun exposure", true, "Ultraviolet light on skin exposed to lime juice causes a phytophotodermatitis resembling a second-degree burn, and untreated it can cause irreversible hyperpigmentation."),
    O("A patient who developed hives within an hour of a first dose of penicillin at the clinic", true, "Hives are the guide's drug-reaction sign for penicillin allergy, and a new allergic reaction appearing in the clinic needs prompt follow-up."),
    O("A laborer with a thickened patch on the palm that has been stable and painless for months", false, "A stable callus from constant rubbing is a local epidermal response with no systemic story behind it; it does not carry the urgency of the other four findings.")
  ],
  tp: "ANSWER KEY — Correct answers: the spreading sulfa rash, the scalded peeling skin, the lime-and-sun blistering, and the new hives after penicillin. DETAILED RATIONALE — Four findings are the skin reporting drug reactions, severe infection, or a burn-like chemical injury; the stable callus is the one purely local, mechanical finding in the set. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Safety first — separate red-flag stories from benign local change during assessment." });

/* ---------- GLANDS, HAIR, AND NAILS IN CLINICAL FINDINGS ---------- */
BANK.push({ cat: CB, type: "single",
  stem: "A 15-year-old asks why her forehead has black dots while her chin has red, sore bumps, when both started during puberty. Which explanation by the nurse is correct?",
  opts: [
    O("Both start as blocked oil glands; the black dots dried in the air, and the sore bumps became infected", true, "Sebaceous glands block with accumulated sebum; exposed to air it dries and turns black, forming blackheads, and infection with staphylococci turns a blocked gland into a pimple. Puberty hormones drive the gland activity behind both."),
    O("Both start as blocked sweat glands; the black dots dried in the air, and the sore bumps became infected", false, "Sweat gland blockage is not the acne mechanism in the guide; the blocked secretion is sebum from sebaceous glands, and sebum is the word that does not belong to sweat glands."),
    O("The black dots are infected oil glands, and the sore bumps are dried sweat trapped under the skin", false, "The two lesions are crossed: blackness marks dried, air-exposed sebum without infection, and soreness with redness marks the infected lesion."),
    O("The black dots are pigment deposits from melanocytes, and the sore bumps are ingrown hair shafts", false, "Melanin pigment explains skin and hair color, not plugged pores; the plug is sebum and debris inside a blocked sebaceous gland.")
  ],
  tp: "ANSWER KEY — Correct answer: both lesions start as blocked sebaceous glands; air exposure makes blackheads and infection makes pimples. DETAILED RATIONALE — One gland, one secretion, two outcomes decided by air and bacteria — and puberty is the shared trigger because gland activity responds to its hormones. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Nursing Process — patient teaching built on the mechanism, not just the names." });

BANK.push({ cat: CB, type: "single",
  stem: "New parents point to oily yellow scales on their 3-week-old's scalp and ask if they should scrub them off with a brush. Which response by the nurse is correct?",
  opts: [
    O("The scales are cradle cap from oil glands oversecreting on the scalp during the newborn period", true, "When sebaceous glands on a newborn scalp oversecrete sebum, the oily scales produced are called cradle cap, named for the cradle period in which it occurs."),
    O("The scales are dried vernix that should have been washed off fully in the first bath after birth", false, "Vernix caseosa is the creamy fetal covering present at birth; scales appearing on the scalp at 3 weeks are ongoing sebaceous oversecretion, not leftover vernix."),
    O("The scales are dried sweat from glands that switched on at birth and are overworking the scalp", false, "The scales are oily, and the oil is sebum; sweat glands do not produce oily scaling on a newborn scalp."),
    O("The scales are dead surface cells clumped by scalp oil, the same finding adults call a blackhead", false, "Oil-clumped dead cells on the scalp are dandruff in the guide's terms, and a blackhead is a blocked gland on the skin; the newborn oversecretion finding is cradle cap.")
  ],
  tp: "ANSWER KEY — Correct answer: the scales are cradle cap from sebaceous oversecretion on the newborn scalp. DETAILED RATIONALE — Naming the finding correctly sets the teaching: this is a gland-activity finding of the newborn period, not a hygiene failure by the parents. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Nursing Process — assessment and teaching: name the finding before advising on care." });

BANK.push({ cat: CB, type: "single",
  stem: "A patient who lost all scalp hair during chemotherapy asks if it will grow back, and whether it will look the same. Which response is most accurate?",
  opts: [
    O("The drug destroyed the hair-producing cells; when treatment ends they regenerate and hair returns", true, "Anticancer drugs are so cytotoxic that they destroy hair-producing epithelial cells; when drug therapy is terminated, the cells regenerate and hair grows again."),
    O("The drug destroyed the hair-producing cells permanently, so the hair loss from treatment is final", false, "The guide's account is temporary loss: the producing cells regenerate after therapy ends, which is why regrowth is expected."),
    O("The hair fell out because the follicles closed; regrowth begins only if the follicles are reopened", false, "Follicle closure is not the mechanism; the drug kills the dividing epithelial cells that build the hair, and recovery follows their regeneration."),
    O("The hair loss means the treatment failed, because effective drugs do not affect the hair follicles", false, "Hair loss here signals the drug's cytotoxic reach, not its failure; rapidly dividing hair-producing cells are among the cells it destroys.")
  ],
  tp: "ANSWER KEY — Correct answer: the producing cells regenerate after treatment ends and hair grows back, possibly with a different color or texture. DETAILED RATIONALE — Regrowth can differ from the original hair in color or texture, a detail worth teaching so the patient is not surprised by the change. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Nursing Process — patient teaching: mechanism first, then the expected timeline and the possible change." });

BANK.push({ cat: CB, type: "single",
  stem: "A 67-year-old with chronic lung disease has enlarged fingertips, nails that are thick and curved, and a bluish tint to the nail beds. Which interpretation is the priority?",
  opts: [
    O("The nail and fingertip changes report long-standing poor oxygenation and need prompt reporting", true, "Chronic lung and heart disease cause clubbing, and bluish nails signal poor blood flow and poor oxygenation; together they are the nails reporting a chronic oxygen problem."),
    O("The nail and fingertip changes report a local fungal problem and need only routine reporting", false, "The guide ties this exact picture to chronic lung and heart disease and to insufficient oxygenated blood reaching the fingertips over time, not to a local nail problem."),
    O("The nail and fingertip changes report normal aging, because all nails thicken and curve with age", false, "Aging nails can become dull, brittle, hard, and thick, but enlarged fingertips with curved nails and a bluish tint are the clubbing and oxygenation findings, not the aging pattern."),
    O("The nail and fingertip changes report excess melanin in the nail bed and need cosmetic reporting", false, "Melanin is a skin and hair pigment; the bluish tint here is blood showing poor oxygenation through the nail, not pigment deposited in the bed.")
  ],
  tp: "ANSWER KEY — Correct answer: clubbed, bluish nails report chronic poor oxygenation and need prompt reporting. DETAILED RATIONALE — Nails should be examined for shape, curvature, adhesion, color, and thickness precisely because they report systemic oxygenation stories like this one. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — ABCs — oxygenation findings outrank cosmetic or routine interpretations." });

BANK.push({ cat: CB, type: "single",
  stem: "A 29-year-old woman is distressed by coarse hair growing on her chin and upper lip. Labs show elevated testosterone. Which statement correctly explains her finding?",
  opts: [
    O("Excess testosterone is driving excessive hair growth in a pattern the guide links to this hormone", true, "Hirsutism is excessive growth of hair, as when a woman has too much testosterone, including facial hair; hair growth and distribution are influenced by the sex hormones."),
    O("Excess testosterone is destroying her hair follicles, and the chin growth is regrowth after that loss", false, "Follicle destruction produces hair loss, the alopecia pattern; this patient has the opposite problem, excessive growth, with no loss described."),
    O("Excess estrogen is driving excessive hair growth, because estrogen produces facial hair at puberty", false, "The guide states plainly that estrogen does not have this effect; the testosterone surge is what produces facial hair growth."),

      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
