<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Vital Signs Basics and Temperature";
var CB = "Fever, Temperature Measurement, and Stethoscope";
var CC = "Pulse and Apical Pulse";
var CD = "Respirations and Oxygen Saturation";
var CE = "Blood Pressure, Height and Weight";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 7,
  "types": {
   "single": 6,
   "dropdown": 1
  }
 },
 CB: {
  "name": CB,
  "count": 9,
  "types": {
   "single": 7,
   "multi": 1,
   "order": 1
  }
 },
 CC: {
  "name": CC,
  "count": 10,
  "types": {
   "single": 6,
   "multi": 2,
   "order": 1,
   "matrix": 1
  }
 },
 CD: {
  "name": CD,
  "count": 8,
  "types": {
   "single": 5,
   "multi": 1,
   "dropdown": 1,
   "matrix": 1
  }
 },
 CE: {
  "name": CE,
  "count": 14,
  "types": {
   "single": 9,
   "multi": 2,
   "order": 1,
   "dropdown": 1,
   "matrix": 1
  }
 }
};

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A newly admitted patient's first vital signs are T 99.1 F oral, P 88, R 18, BP 128/82. Two hours later the nurse finds T 100.8 F, P 96, R 22, BP 134/84 and the patient says he feels 'funny.' Which of the following actions should the nurse take first?",
  opts: [ O("Compare the new set with the admission baseline, assess for a cause, and report the significant change", true, "Correct. Framework: Nursing Process/ADPIE. The baseline at initial contact is the comparison point; verify and communicate significant changes and assess when the patient reports feeling funny or different."), O("Chart the second set as the new baseline and reassess at the next routine four-hour round", false, "Incorrect. A rising set with a vague distress report is a trigger to assess and report now, not to relabel it a baseline."), O("Give a tepid sponge bath first, then decide whether the change is worth reporting later", false, "Incorrect. Interventions are documented, but assessment and reporting of a significant change come before comfort measures alone."), O("Repeat only the blood pressure, because temperature and pulse changes rarely matter together", false, "Incorrect. A temperature rise alters the other signs together - here pulse and respirations rose with it, as the chapter predicts.") ],
  tp: "Framework: Nursing Process/ADPIE - baseline comparison, assess the change, report it. A 1 degree F rise can add about 4 beats/min to pulse." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A postoperative patient is 2 hours out of surgery. Orders allow vital signs every 4 hours, but the patient is restless, pale, and his dressing has fresh bleeding. Pulse is 118, BP 96/58. Which action should the nurse take?",
  opts: [ O("Take a full set of vital signs now and more frequently, and report the change to the provider", true, "Correct. Framework: stable vs unstable, safety first. A condition change - hemorrhage signs with tachycardia and falling BP - requires more frequent signs and immediate reporting, regardless of the routine interval."), O("Wait for the next ordered four-hour check, because changing frequency requires a new order first", false, "Incorrect. Postoperative or worsening patients need signs every 5-10 minutes until stable; the routine order does not block reassessment."), O("Document the bleeding and encourage fluids, then reassess when the provider makes rounds", false, "Incorrect. Restlessness, pallor, tachycardia, and a falling BP with bleeding are hemorrhage cues that need immediate action."), O("Take only the temperature, because bleeding most often presents first as a rising temperature", false, "Incorrect. With hemorrhage, temperature usually decreases while pulse and respirations increase and BP falls.") ],
  tp: "Framework: stable vs unstable - worsening condition overrides the routine schedule. Hemorrhage: BP down, pulse/RR up, temperature down." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A nurse takes an oral temperature in a warm, humid room right after a patient finished a hot meal and gets 100.2 F. The patient feels well, pulse 78, respirations 16. Which action is most appropriate?",
  opts: [ O("Control the influencing factors, wait 20 to 30 minutes after the meal, and retake the oral temperature", true, "Correct. Framework: Nursing Process/ADPIE, assessment accuracy. Hot food and a warm humid room distort oral readings; wait 20-30 min after intake before measuring."), O("Report a fever immediately, because any oral reading above 100.4 is near enough to act upon", false, "Incorrect. 100.2 is below the 100.4 fever threshold and was taken under conditions known to falsify the reading."), O("Start tepid sponging and give acetaminophen as a precaution before repeating the reading", false, "Incorrect. Treating an unverified, factor-distorted reading reverses the assessment sequence."), O("Switch to a rectal temperature at once, because rectal readings are unaffected by any factor", false, "Incorrect. A distorted oral reading is first repeated under controlled conditions; site change is used if indicated after repeating.") ],
  tp: "Framework: Nursing Process/ADPIE - remove known distortions first (wait 20-30 min after hot/cold intake or smoking), then repeat." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A school-age child (age 8) has HR 92, RR 23, and systolic BP 96. A nursing student says all three are abnormal for a child. Which response is correct?",
  opts: [ O("All three fall within the Table 12.1 school-age ranges: HR 65 to 105, RR 22 to 24, systolic 90 to 100", true, "Correct. Framework: Nursing Process/ADPIE, age-based assessment. School-age (6-10 yr) normals are HR 65-105, RR 22-24, systolic 90-100, diastolic 60-64."), O("The heart rate is too slow, because a child of 8 should still have a rate of 120 to 160", false, "Incorrect. 120-160 is the neonate heart rate range, not the school-age range."), O("The respiratory rate is too fast, because children should breathe at the adult rate of 12 to 20", false, "Incorrect. The adult RR is 12-20; the school-age range printed is 22-24, so 23 is normal."), O("The systolic pressure is too low, because a child of 8 should read at least 130 systolic", false, "Incorrect. 130-140 systolic is the older adult row as printed; school-age systolic is 90-100.") ],
  tp: "Framework: Nursing Process/ADPIE - interpret every value against the age row in Table 12.1, never the adult row." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "An older adult living alone is found in a cold apartment in winter. Oral temperature is 95.4 F, pulse 58, respirations 11. He is slow to answer but arousable. Which interpretation is most accurate?",
  opts: [ O("This is a subnormal temperature needing warming measures and provider notification, not dismissal as normal aging", true, "Correct. Framework: safety first. The chapter notes 95 F is not unusual for some older patients in cold weather, but hypothermia is still abnormal - warm, cover, remove wet clothing, encourage warm liquids, and report."), O("This is the expected normal for an older adult in winter, so no action or follow-up is needed", false, "Incorrect. 'Not unusual' is not 'normal and safe' - subnormal temperature still gets warming interventions and reporting."), O("This is a fever equivalent in an older adult, so remove coverings and limit his activity at once", false, "Incorrect. Covering removal and activity limits are fever interventions; this patient's temperature is low, not high."), O("This reading must be an error, because adult temperature can never fall below 97 degrees F", false, "Incorrect. The normal range is 97-99.6, but hypothermia by definition falls below it and death is a risk below 93.2 F.") ],
  tp: "Framework: safety first - older adult 95 F in cold weather is a known pattern AND still hypothermia care: blankets, dry clothes, warm liquids, report." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A patient with pneumonia has T 102.6 F, flushed warm skin, glassy eyes, headache, thirst, pulse 112, and respirations 24. Which of the following actions should the nurse take first?",
  opts: [ O("Repeat the temperature to confirm it, assess for infection sites, and monitor at least every 4 hours", true, "Correct. Framework: Nursing Process/ADPIE. Repeat an abnormal reading, assess related data and possible infection sites (lungs, urine, throat, ears), and monitor at least every 4 hours while abnormal."), O("Give acetaminophen and recheck in the morning, because fever is a defense that needs no monitoring", false, "Incorrect. Fever is a defense, but a temperature of 102.6 with systemic signs still needs confirmation, site assessment, and q4h monitoring."), O("Cover the patient with extra blankets to support the chill phase until the fever breaks alone", false, "Incorrect. For elevated temperature the chapter directs removing or reducing external coverings and keeping linens dry - the opposite action."), O("Restrict all oral fluids until the temperature falls, to avoid adding heat to the body system", false, "Incorrect. The chapter directs increasing oral fluids if not contraindicated, and assessing added fluid needs.") ],
  tp: "Framework: Nursing Process/ADPIE - confirm, assess infection sites, monitor q4h, uncover, rest, fluids, acetaminophen as ordered." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A patient's temperature chart shows: day 1 spike to 103 F then 98.4 F, day 2 spike to 102.8 F then 98.6 F, day 3 spike to 103.1 F. Which fever pattern does this show?",
  opts: [ O("An intermittent pattern, because the temperature returns to normal values between daily spikes", true, "Correct. Intermittent fevers rise and fall, normal or subnormal in the morning and spiking in the afternoon."), O("A remittent pattern, because the temperature returns to normal values between daily spikes", false, "Incorrect. Remittent fevers fluctuate but do NOT return to normal until the patient is well - the classic swapped pair."), O("A constant pattern, because the temperature returns to normal values between daily spikes", false, "Incorrect. A constant fever remains elevated consistently and fluctuates very little."), O("A hypothermic pattern, because morning values in the 98s show the fever has resolved fully", false, "Incorrect. Morning normals between spikes are part of the intermittent pattern, not resolution or hypothermia.") ],
  tp: "Pattern trap: returning to normal between spikes = intermittent. Never returning to normal until well = remittent. Staying up = constant." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A febrile infant is disoriented during a temperature of 104.8 F, and the parent reports a brief convulsion at home. Which concern drives the nurse's priority action?",
  opts: [ O("Temperatures exceeding 105 F can damage normal body cells, and febrile children may convulse", true, "Correct. Framework: safety first, acute vs chronic. The chapter warns that temperatures over 105 F (40.5 C) can damage cells, and Box 12.5 lists disorientation, confusion, and convulsions in infants and children."), O("Fever at this level is purely protective, so the only action needed is oral hygiene teaching", false, "Incorrect. Oral hygiene is a comfort measure for prolonged fever, not the priority at 104.8 approaching the cell-damage threshold."), O("The convulsion proves the temperature was taken incorrectly, so retake it rectally and discharge", false, "Incorrect. Febrile convulsions in infants and children are a listed fever manifestation, not proof of measurement error."), O("The disorientation is expected with any fever, so fluids alone are the complete intervention", false, "Incorrect. Fluids help, but disorientation plus convulsion plus near-105 temperature requires provider notification and close monitoring.") ],
  tp: "Framework: safety first - fever >100.4 is fever; >105 risks cell damage. Febrile infants/children may have confusion or convulsions." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A comatose patient needs a temperature. The nurse also notes a rectal tumor in the chart history for another patient on the unit. Which site plan is correct?",
  opts: [ O("Use a non-oral site for the comatose patient, and avoid the rectal site for the patient with a rectal tumor", true, "Correct. Framework: safety first. Oral temperature is not attempted on comatose or disoriented patients; rectal is contraindicated with rectal disorders such as tumor or hemorrhoids or after rectal surgery."), O("Use the oral site for the comatose patient, and the rectal site for the patient with a tumor", false, "Incorrect. Both choices violate the chapter's site contraindications."), O("Use the rectal site for both patients, because rectal readings are always the most reliable", false, "Incorrect. Rectal is argued more reliable when oral cannot be obtained, but it is contraindicated for the tumor patient."), O("Use the oral site for both patients, because oral measurement never requires any cooperation", false, "Incorrect. Oral measurement requires the patient to hold the probe with lips closed - impossible for a comatose patient.") ],
  tp: "Framework: safety first - site selection is a contraindication check: no oral if comatose/disoriented/infant, no rectal after rectal surgery or with rectal disorder." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A nurse takes a rectal temperature on an adult. Which technique is correct?",
  opts: [ O("Glove, position in Sims with upper leg flexed, lubricate the red probe, insert 1.5 inches, and hold it throughout", true, "Correct. Rectal technique: Sims position, red rectal probe, lubricated tip, 1.5 inches in an adult, held the whole time, never forced."), O("Position supine, use the blue probe dry, insert 3 inches, and leave it while charting the pulse", false, "Incorrect. Blue is for oral/axillary, lubrication is required, adult depth is 1.5 inches, and the probe is held throughout."), O("Force the probe past resistance, because an inadequate insertion gives a falsely low reading", false, "Incorrect. The chapter is explicit: never force the thermometer; remove it and consider an alternative method."), O("Insert the probe without gloves, because the rectal area is considered a clean body site", false, "Incorrect. Gloves are worn for rectal measurement; there is a risk of body fluid exposure.") ],
  tp: "Rectal technique: gloves, Sims, red probe, lubricate, 1.5 inches adult, hold throughout, never force." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A tympanic reading is 96.9 F on a patient who just came in from winter cold and wears a hearing aid in that ear. The patient looks flushed. Which action should the nurse take?",
  opts: [ O("Remove the hearing aid, let the patient be indoors at least 10 minutes, replace the cover, and repeat the reading", true, "Correct. Framework: Nursing Process/ADPIE, measurement accuracy. Box 12.7: be indoors at least 10 min, remove hearing aids, assess after 10 min out of the cold; if a reading seems too low, replace the cover and repeat."), O("Chart 96.9 F as hypothermia and begin warming blankets before any other assessment step", false, "Incorrect. Acting on a reading taken under known distorting conditions skips the chapter's repeat procedure."), O("Switch ears and take the reading immediately, because ear temperature equalizes in seconds", false, "Incorrect. The environmental wait is 10 minutes, and the hearing-aid ear needs the aid removed first."), O("Add 1 degree to the reading and chart 97.9 F, because tympanic readings run low in winter", false, "Incorrect. Readings are never adjusted by arithmetic; the procedure is repeated under correct conditions.") ],
  tp: "Framework: Nursing Process/ADPIE - tympanic accuracy needs 10 min indoors, hearing aid out, clean intact cover/lens, tug pinna up/back adult, down/back child." });

BANK.push({ cat: CB, type: "multi", kt: [],
  stem: "A nurse is preparing to measure temperatures on a busy unit. Which actions are correct? Select all that apply.",
  opts: [ O("Wait 20 to 30 minutes after a patient drinks iced water before taking an oral temperature", true, "Correct. Hot/cold intake and smoking require a 20-30 minute wait before an oral reading."), O("Ensure a dry forehead before a temporal artery scan, sweeping the probe to behind the earlobe", true, "Correct. Temporal technique requires a dry forehead and a flush sweep ending just behind the earlobe."), O("Tug the ear pinna upward and back for an adult and down and back for a child for tympanic use", true, "Correct. Pinna direction differs by age exactly as stated in the skill."), O("Use the axillary site when the most accurate possible reading is the priority for this patient", false, "Incorrect. Axillary is the least accurate method; it is chosen for safety/non invasiveness, not accuracy."), O("Use a mercury glass thermometer from an old supply cart because it needs no probe cover at all", false, "Incorrect. Experts no longer recommend mercury-containing thermometers; facilities have discontinued them.") ],
  tp: "Measurement accuracy set: 20-30 min wait, dry forehead for temporal, pinna up/back adult vs down/back child, axillary least accurate, no mercury." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A nurse cannot hear heart sounds clearly. The tubing is 26 inches long, the earpieces point away from her face, and the room is noisy. Which correction set is right?",
  opts: [ O("Use 12 to 18 inch tubing, point earpieces toward the face following the ear canal, and quiet the room", true, "Correct. Framework: Nursing Process/ADPIE, equipment accuracy. Longer tubing decreases sound transmission; earpieces follow the canal pointing toward the face; nurse and patient stay quiet during auscultation."), O("Keep the long tubing for comfort, press the bell firmly into the chest, and talk through the sounds", false, "Incorrect. Firm bell pressure creates a diaphragm effect and loses low sounds; talking adds extraneous noise."), O("Clean the tubing with alcohol, drape it around the neck, and tap the diaphragm to test the bell side", false, "Incorrect. Alcohol dries and cracks the material, neck draping next to skin is discouraged, and tapping tests which side is active - not a fix for these problems."), O("Switch to the bell for high-pitched sounds, because the bell is the flat disk side of the chest piece", false, "Incorrect. The diaphragm is the flat disk for high-pitched sounds; the bell is bowl-shaped for low-pitched sounds.") ],
  tp: "Framework: Nursing Process/ADPIE - stethoscope setup: tubing 12-18 in, earpieces toward face, quiet room, diaphragm firm/high, bell light/low." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "A patient resting in bed has a radial pulse of 118, regular, 2+. He took his beta-blocker this morning and has no pain, fever, or bleeding noted. Which action should the nurse take first?",
  opts: [ O("Assess for related causes - recent exercise, low blood pressure, fever, oxygenation, dehydration - and report the rate", true, "Correct. Framework: Nursing Process/ADPIE. Box 12.10 for a pulse above normal: assess related data (exercise, low BP, elevated temperature, inadequate oxygenation, dehydration) and observe for dyspnea, chest pain, syncope, or edema."), O("Withhold the next beta-blocker dose, because a fast pulse proves the drug is not working at all", false, "Incorrect. Withholding decisions follow provider evaluation; beta-blockers lower rate, so tachycardia on one calls for cause assessment, not automatic withholding."), O("Chart the rate as expected, because any pulse under 120 at rest is considered a normal finding", false, "Incorrect. Over 100 is tachycardia by definition and must be assessed and reported, not normalized."), O("Take an apical pulse for 15 seconds to confirm, then document whichever rate is lower overall", false, "Incorrect. An irregular or abnormal pulse is assessed apically for a full minute; cherry-picking the lower number falsifies the record.") ],
  tp: "Framework: Nursing Process/ADPIE - tachycardia workup per Box 12.10: exercise? low BP? fever? oxygenation? dehydration? plus perfusion symptoms." });

BANK.push({ cat: CC, type: "single", kt: [],
  stem: "A patient on digoxin and a beta-blocker has a radial pulse of 52, irregular, and says he feels dizzy. Which of the following actions should the nurse take first?",
  opts: [ O("Assess the apical pulse for a full minute and hold related medication pending provider evaluation as indicated", true, "Correct. Framework: safety first. Box 12.10 for a pulse below normal: assess apically, check for digoxin, beta-blockers, and antidysrhythmics; it is sometimes necessary to withhold medication pending provider evaluation. Apical assessment is essential with digoxin and an irregular radial pulse."), O("Encourage the patient to walk the hallway to bring the rate up, then recheck it after exercise", false, "Incorrect. Exercising a dizzy, bradycardic, irregular patient risks a fall and syncope; assessment comes first."), O("Document bradycardia as an expected drug effect and give the next doses on schedule as ordered", false, "Incorrect. Dizziness plus irregular bradycardia on digoxin is exactly the combination the chapter flags for apical assessment and possible withholding."), O("Palpate both carotid pulses firmly to get the most accurate rate before calling the provider", false, "Incorrect. Both carotids are never palpated simultaneously - pressure can occlude blood supply to the brain.") ],
  tp: "Framework: safety first - bradycardia + digoxin/beta-blocker + symptoms: apical 60 s, assess meds, withhold pending provider evaluation, report." });

BANK.push({ cat: CC, type: "single", kt: [],

function build() {

  Q = flat;

    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;

}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {

  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }

  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }

}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }

      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
