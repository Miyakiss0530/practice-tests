<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Pain Concepts and Types";
var CB = "Pain Assessment and Comfort";
var CC = "Pain Treatment and Delivery";
var CD = "Rest and Sleep";

var KEYTERMS = [];

   "multi": 1,
   "order": 1,
   "matrix": 1

 },
 CB: {
  "name": CB,

  "types": {
   "single": 9,
   "multi": 2,
   "dropdown": 1,
   "matrix": 1
  }
 },
 CC: {
  "name": CC,
  "count": 21,
  "types": {
   "single": 16,
   "multi": 2,
   "order": 1,
   "dropdown": 2
  }
 },
 CD: {
  "name": CD,
  "count": 11,
  "types": {
   "single": 8,
   "multi": 1,
   "order": 1,
   "matrix": 1
  }
 }
};

BANK.push({ cat: CA, type: "single",
  stem: "A 34-year-old patient is 6 hours post appendectomy. He rates incisional pain 9 of 10, pulse 118, BP 152/88, respirations 24, pupils dilated, palms sweaty, and he is grimacing and splinting the incision. Which of the following actions should the nurse take first?",
  opts: [ O("Reassure him that vital signs will settle within an hour, so medication can wait until then", false, "Incorrect. Vitals do settle within about an hour even in severe pain, but that is no reason to delay relief. Framework: safety first."), O("Believe the report, give the ordered analgesic now, and plan reassessment after the dose", true, "Correct. Acute pain with sympathetic signs needs prompt relief before it escalates. Framework: Nursing Process/ADPIE and safety first - assess, intervene, reassess."), O("Document that he complains of pain this shift and recheck his pain rating at the next rounds", false, "Incorrect. That charting gives no useful information and delays treatment of severe acute pain. Framework: Nursing Process/ADPIE."), O("Ask him to prove the pain is severe by ambulating to the hallway before any medication is given", false, "Incorrect. Patients must not have to convince the team pain is real; interventions begin when pain is stated. Framework: Maslow - physiologic comfort first.") ],
  tp: "Framework: Nursing Process/ADPIE. Acute pain is intense, short, and sympathetic (raised pulse, BP, respirations, dilated pupils, diaphoresis); act as soon as pain occurs, before severity increases." });

BANK.push({ cat: CA, type: "single",
  stem: "A 71-year-old woman with rheumatoid arthritis for 9 years reports constant joint pain rated 6 of 10. She has lost interest in her church group, sleeps poorly, feels tired all day, and says she is 'no good to anyone anymore.' Which interpretation by the nurse is most accurate?",
  opts: [ O("Her withdrawal means she no longer wants pain treatment, so analgesics should be held from now on", false, "Incorrect. Withdrawal is a manifestation of chronic pain, not a refusal of treatment. Framework: Maslow - do not abandon the patient."), O("Because no new joint damage is seen today, her pain report is most likely psychological in origin", false, "Incorrect. Lack of tissue damage is not proof pain is psychological. Framework: safety first - believe the patient report."), O("Fatigue, sleep disturbance, and depression are acting together and intensifying her pain perception", true, "Correct. The chapter calls that trio synergistic in chronic pain, with low self-esteem and role changes. Framework: acute vs chronic - chronic pain pattern recognition."), O("Her pain has become acute again, so a fight-or-flight response explains all of these findings", false, "Incorrect. Fight-or-flight belongs to acute pain; her years-long course with mood and role changes fits chronic pain. Framework: acute vs chronic.") ],
  tp: "Framework: acute vs chronic. Chronic pain over 6 months signals damage has occurred and brings fatigue, sleep disturbance, depression, low self-esteem, and suicide risk that must be assessed." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient with metastatic cancer reports new back pain rated 10 of 10 and, when asked, says quietly that he sometimes wishes he 'would not wake up.' Vital signs are near baseline. Which of the following actions should the nurse take first?",
  opts: [ O("Stay with him, assess his mood and safety directly, and notify the provider of the statement promptly", true, "Correct. Chronic pain is a risk factor for suicide; a wish not to wake up needs direct safety assessment now. Framework: safety first."), O("Offer a distraction activity such as television and return at the end of the shift to reassess him", false, "Incorrect. Distraction does not answer a possible suicide cue in a patient with chronic cancer pain. Framework: safety first - acute risk over routine comfort."), O("Ask his family to confirm whether his pain is real before giving any additional analgesic doses", false, "Incorrect. The patient is the expert on his pain and must be believed without family confirmation. Framework: Nursing Process/ADPIE."), O("Reassure him that baseline vital signs show his pain cannot be as severe as he is reporting today", false, "Incorrect. Baseline vitals never rule out severe pain; the body returns to equilibrium within an hour. Framework: safety first.") ],
  tp: "Framework: safety first. Chronic pain sufferers (spinal pain, cancer, arthritis) carry increased suicide risk; McCaffery guideline 8 is keep trying and do not abandon the patient." });

BANK.push({ cat: CA, type: "single",
  stem: "A 58-year-old man clutching his chest says the pain is in his left jaw and down his left arm, rated 8 of 10. His hands and jaw show no injury. How should the nurse interpret and act on this finding?",
  opts: [ O("Reassure him that pain away from the heart cannot be cardiac and offer an oral analgesic only", false, "Incorrect. Referred pain is felt away from the diseased organ; distance from the heart does not exclude it. Framework: safety first."), O("Treat it as possible referred cardiac pain and act on it immediately as a priority finding", true, "Correct. Coronary insufficiency pain is the chapter's classic referred pain example: left shoulder, arm, or jaw. Framework: ABCs and safety first."), O("Ask him to point to the exact injured spot, and act only if he can localize the pain precisely", false, "Incorrect. Referred pain by definition is not felt at the injured organ, so precise local pointing is not required. Framework: Nursing Process/ADPIE."), O("Document it as poorly localized dental pain and schedule a routine dental review for tomorrow", false, "Incorrect. Jaw and arm pain with chest clutching fits the referred cardiac pattern, not a dental routine. Framework: ABCs.") ],
  tp: "Framework: ABCs. Referred pain is felt at a site other than the injured or diseased organ; coronary pain may be felt in the left shoulder, left arm, or jaw." });

BANK.push({ cat: CA, type: "multi",
  stem: "A nurse is caring for four patients. Which patients show findings consistent with acute pain rather than chronic pain? Select all that apply.",
  opts: [ O("A postoperative patient 1 day after surgery with raised pulse and BP, anxiety, and grimacing", true, "Correct. Short duration, sympathetic surge, and associated anxiety are the acute pain pattern."), O("A patient with back pain for 8 months who has withdrawn from work and family activities lately", false, "Incorrect. Duration over 6 months with role and social changes fits chronic pain, not acute pain."), O("A patient with fibromyalgia for 3 years who reports fatigue, poor sleep, and low mood most days", false, "Incorrect. Years-long pain with fatigue, sleep disturbance, and depression is the chronic pattern."), O("A patient with a fractured arm set yesterday who rates sharp pain 8 of 10 and guards the arm", true, "Correct. Recent injury, intense short pain, and guarding fit acute pain with a known healing cause."), O("A patient with arthritis for 5 years whose main change is low self-esteem and social withdrawal", false, "Incorrect. Low self-esteem and withdrawal developing over years are chronic pain manifestations.") ],
  tp: "Framework: acute vs chronic. Acute: under 6 months, warning, sympathetic fight-or-flight, anxiety. Chronic: over 6 months, depression, fatigue, sleep disturbance, role changes." });

BANK.push({ cat: CA, type: "single",
  stem: "During a dressing change, a patient cries, rocks in bed, and turns away from conversation, then later sits quietly with a blank face and says nothing. A coworker says, 'He cannot be in pain now - look at him.' Which response by the nurse is correct?",
  opts: [ O("Explain that rocking and crying earlier proved he exaggerates, so his reports can be discounted", false, "Incorrect. Distraction behaviors are genuine pain characteristics, not evidence of exaggeration. Framework: Maslow - believe the patient."), O("Explain that no outward expression does not mean no pain, and ask the patient to rate his pain", true, "Correct. Box 21.1 lists rocking, crying, and withdrawal, and warns some patients show no outward expression. Framework: Nursing Process/ADPIE - assess with the patient report."), O("Suggest charting a pain rating of 0 for this period because no behavioral signs are present now", false, "Incorrect. A rating comes from the patient on the scale, not from an absence of observed behaviors. Framework: Nursing Process/ADPIE."), O("Agree that quiet behavior proves the dressing change pain has resolved without medication now", false, "Incorrect. Quietness is not proof of relief; there is no specific picture of a patient in pain. Framework: safety first.") ],
  tp: "Framework: Nursing Process/ADPIE. Behavioral signs include guarding, narrowed focus, withdrawal, moaning, rocking, crying, pacing, grimacing, and altered muscle tone - and sometimes no outward expression at all." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient recovering from a burn injury says heat and cold packs and back rubs 'take the edge off' for a while, even though the burn itself is unchanged. Which explanation should the nurse give?",
  opts: [ O("The packs and rubs work only because the patient expects them to, so any object would work as well", false, "Incorrect. The chapter explains a gating mechanism and endorphin release, not expectation alone. Framework: safety first - accurate teaching."), O("Heat and cold stop the burn from producing prostaglandins, which ends the pain at its source fully", false, "Incorrect. Prostaglandin inhibition is the NSAID mechanism, not the gate effect of cutaneous stimulation. Framework: Nursing Process/ADPIE."), O("The packs and rubs repaired the burned tissue, so fewer pain impulses are being produced now", false, "Incorrect. The burn is unchanged; the relief comes from gating, not tissue repair. Framework: Nursing Process/ADPIE - teaching accuracy."), O("Cutaneous stimulation travels the same large-nerve pathways and can close the spinal gate to pain", true, "Correct. Gate control theory: pressure, heat, and cold close gates in the dorsal horn, blocking transmission. Framework: Nursing Process/ADPIE - patient teaching.") ],
  tp: "Framework: Nursing Process/ADPIE. Gate control theory also explains distraction: the brain cannot acknowledge pain while interpreting other stimuli, and thoughts, feelings, and memories alter the gate." });

BANK.push({ cat: CA, type: "single",
  stem: "A laboring patient using a TENS unit asks how it helps. Her partner asks whether it can stay on during continuous fetal monitoring with his implanted pacemaker nearby in the room. Which teaching by the nurse is correct?",
  opts: [ O("TENS is safe to share in the room because it has no effect on any implanted cardiac devices at all", false, "Incorrect. The chapter warns a TENS unit can interfere with a cardiac pacemaker device. Framework: safety first."), O("TENS delivers opioid medication through the skin electrodes directly into the spinal canal space", false, "Incorrect. TENS delivers mild electric current, not medication, through electrodes on the skin. Framework: safety first."), O("TENS works by heating deep tissues until the pain receptors in the area stop sending any signals", false, "Incorrect. TENS is an electrical stimulation device, not a deep-heating treatment for receptors. Framework: Nursing Process/ADPIE."), O("TENS sends mild current through skin electrodes to help close the spinal gate and may release endorphins", true, "Correct. TENS stimulates large fibers to close the gate and is hypothesized to stimulate endorphin production. Framework: Nursing Process/ADPIE - teaching.") ],
  tp: "Framework: safety first. TENS is used for postoperative or chronic pain with electrodes on or near the painful site; keep it away from pacemaker interference risk." });

BANK.push({ cat: CA, type: "order",
  stem: "A patient reports new surgical pain rated 7 of 10. Place the nurse's actions in the correct order.",
  items: [ { t: "Believe the report and assess location, intensity, and duration with the pain scale", r: "First comes belief plus assessment of the pain characteristics. Framework: Nursing Process/ADPIE - assessment first." }, { t: "Determine what relieves it, what worsens it, and which relief medications were taken", r: "Subjective data complete the assessment before choosing the intervention. Framework: Nursing Process/ADPIE." }, { t: "Give the ordered analgesic and add a noninvasive measure such as repositioning or cold", r: "Intervention follows assessment in the pain circle. Framework: Nursing Process/ADPIE - implementation." }, { t: "Reassess the pain rating and the effect of the measures after the intervention", r: "The chapter's circle is assessment, intervention, and reassessment. Framework: Nursing Process/ADPIE - evaluation." } ],
  tp: "Framework: Nursing Process/ADPIE. Assessment, intervention, and reassessment form a circle; without pain assessment, no relief measure is useful." });

BANK.push({ cat: CA, type: "matrix",
  stem: "For each finding, classify it as a feature of acute pain or chronic pain.",
  cols: ["Acute pain", "Chronic pain"],
  rows: [ { t: "Pain 2 days after surgery with raised pulse, raised BP, and anxiety", a: 0, r: "Acute: short duration, sympathetic surge, and anxiety. Framework: acute vs chronic." }, { t: "Pain for 2 years from arthritis with fatigue, poor sleep, and depression", a: 1, r: "Chronic: long duration with fatigue, sleep disturbance, and depression. Framework: acute vs chronic." }, { t: "Fight-or-flight flooding of the body with epinephrine after an injury", a: 0, r: "Acute: the autonomic epinephrine surge is the acute response. Framework: acute vs chronic." }, { t: "Low self-esteem with changes in role and social interaction over time", a: 1, r: "Chronic: those psychosocial changes build over a prolonged course. Framework: acute vs chronic." } ],
  tp: "Framework: acute vs chronic. Duration line is 6 months; acute warns of damage, chronic signals damage has occurred." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient with chronic back pain for 4 years tells the nurse, 'No scan has ever shown enough damage to explain how much I hurt, so maybe it is all in my head.' Which response by the nurse is most therapeutic?",
  opts: [ O("Explain that pain can arise from abnormal neural processing and that his report is believed", true, "Correct. Chronic pain may come from abnormal neural processing of stimuli, and nurses are obliged to believe the patient. Framework: Nursing Process/ADPIE - therapeutic communication."), O("Suggest he stop reporting the pain at each visit because repeated reports cannot change his care", false, "Incorrect. Reporting pain promptly is exactly what patients are taught to do for better management. Framework: Nursing Process/ADPIE."), O("Agree that without tissue damage the pain must have a psychological cause that needs counseling", false, "Incorrect. The chapter states inability to find damage is not proof of psychological origin. Framework: safety first."), O("Tell him the team will stop analgesics until imaging can prove a source for the pain he reports", false, "Incorrect. Withholding relief pending proof contradicts the duty to believe and treat reported pain. Framework: Maslow - comfort need first.") ],
  tp: "Framework: Maslow. The patient is the expert on his pain; empowering the patient as an active partner in reporting is an important nursing skill." });

BANK.push({ cat: CA, type: "single",
  stem: "A nurse is teaching a patient who rates daily arthritis pain 5 of 10 about endorphins. Which statement by the patient indicates an understanding of the teaching?",
  opts: [ O("My body makes its own morphine-like substances, and higher levels can make me feel less pain", true, "Correct. Endorphins are body-made polypeptides at opioid receptors; higher levels mean less pain felt. Framework: Nursing Process/ADPIE - evaluation of teaching."), O("Endorphins are a drug I will be prescribed, and the dose is raised when my pain gets worse", false, "Incorrect. Endorphins are produced by the body in the pituitary and CNS, not prescribed as a drug. Framework: safety first."), O("Endorphins lower my pain threshold, so stress makes every small stimulus feel more painful", false, "Incorrect. Stress and pain activate endorphins, and higher levels reduce felt pain, not raise it. Framework: Nursing Process/ADPIE."), O("My body makes prostaglandins that block pain, and higher levels can make me feel less pain now", false, "Incorrect. Prostaglandins sensitize pain nerves as inflammatory mediators; endorphins block pain. Framework: Nursing Process/ADPIE.") ],
  tp: "Framework: Nursing Process/ADPIE. TENS, acupuncture, and placebos may possibly cause release of endorphins." });

BANK.push({ cat: CA, type: "single",
  stem: "An aphasic patient after a stroke cannot describe pain verbally. He is restless, grimaces when turned, guards his right side, and his pulse is 104. Which of the following actions should the nurse take first?",
  opts: [ O("Chart pain as absent because the patient has not communicated any verbal complaint of pain today", false, "Incorrect. The defining characteristic includes nonverbal communication of pain, not words only. Framework: Nursing Process/ADPIE."), O("Wait until the patient can verbalize a pain rating before giving any comfort or relief measures", false, "Incorrect. The chapter directs recognition of discomfort signals in aphasic or semicomatoso patients. Framework: safety first."), O("Treat the cluster as discomfort cues, assess further, and pursue relief measures for the likely pain", true, "Correct. Knowing discomfort elements lets the nurse recognize signals when a patient cannot verbalize, as with aphasia. Framework: Nursing Process/ADPIE - assessment of nonverbal cues."), O("Ask the family to decide whether he is in pain, and act only on the family's judgment about it", false, "Incorrect. Family input helps, but the nurse must act on observed cues rather than defer entirely. Framework: Maslow - comfort need.") ],
  tp: "Framework: Nursing Process/ADPIE. Explore the patient's own concept of comfort, listen actively, and if one intervention fails, seek and apply alternatives - be diligent." });

BANK.push({ cat: CB, type: "single",
  stem: "A postoperative patient rates pain 8 of 10 at 2 p.m. The nurse gives morphine as ordered. At 3 p.m. his pulse, BP, and respirations are back to his morning baseline, but he still rates pain 7 of 10 and is grimacing. Which interpretation is correct?",
  opts: [ O("His grimacing must have another cause, because severe pain always keeps vital signs elevated", false, "Incorrect. Severe pain rarely keeps vitals elevated; facial expression is a key remaining clue. Framework: Nursing Process/ADPIE."), O("His report can be discounted until vital signs rise again, which confirms the pain objectively", false, "Incorrect. Waiting for vitals to rise abandons the patient; the patient report governs pain care. Framework: Maslow - believe the patient."), O("His report still stands; vitals normalize within an hour even in severe pain, so reassess and act", true, "Correct. The body seeks equilibrium; normal vitals never rule pain out, and the circle requires reassessment. Framework: Nursing Process/ADPIE - evaluation."), O("His baseline vital signs prove the morphine worked, so his rating of 7 should be charted as a 2", false, "Incorrect. Nurses never overwrite the patient's rating with a vital-sign estimate. Framework: safety first.") ],
  tp: "Framework: Nursing Process/ADPIE. Continuous severe pain may raise vitals again from time to time, but they rarely remain elevated." });

BANK.push({ cat: CB, type: "single",
  stem: "A nurse is assessing a patient who rates knee pain 6 of 10. Using the HILDA guide, which question set covers the guide completely?",
  opts: [ O("How the family rates the pain, intensity by vital signs, location of the chart, and drug dose given", false, "Incorrect. HILDA asks the patient, and intensity is the patient's rating, not a vital-sign estimate. Framework: safety first."), O("How it feels, intensity now and worst in 24 hours, location, duration, and what helps or worsens it", true, "Correct. That is H-I-L-D-A, plus effects on sleep, appetite, energy, activity, relationships, and mood. Framework: Nursing Process/ADPIE - complete assessment."), O("How much medication was taken last month, intake and output totals, and the next provider visit date", false, "Incorrect. Past medication name, dose, frequency, and effect matter, but that set is not the HILDA guide. Framework: Nursing Process/ADPIE."), O("How long ago surgery was, insurance coverage, last meal time, and discharge plans for this week", false, "Incorrect. Those items do not follow the HILDA pain assessment guide printed in the chapter. Framework: Nursing Process/ADPIE.") ],
  tp: "Framework: Nursing Process/ADPIE. Also check vital signs, past medication history, knowledge of pain, and use of noninvasive techniques; words for pain include dolor (Spanish) and douleur (French)." });

BANK.push({ cat: CB, type: "single",
  stem: "A patient who had been rating pain with the numeric scale is suddenly given a faces scale by a float nurse, and his recorded scores drop from 8 to 3 with no change in his condition. What is the problem with this practice?",

      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 21: Pain Management, Comfort, Rest, and Sleep</h1>';
  h += '<div class="sub">Brutal mode | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
