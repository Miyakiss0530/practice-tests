<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Communication Basics and Verbal Meaning";
var CB = "Nonverbal Communication and Congruence";
var CC = "Styles and the Therapeutic Relationship";
var CD = "Therapeutic Communication Techniques";
var CE = "Factors That Affect Communication";
var CF = "Blocks, Compromised Communication, and Special Situations";
var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = ["communication", "sender", "receiver", "verbal communication", "nonverbal communication", "assertive communication", "therapeutic communication", "active listening", "passive listening", "silence", "touch", "closed question", "open-ended question", "restating", "paraphrasing", "clarifying", "reflecting", "focusing", "summarizing", "aphasia", "expressive aphasia", "receptive aphasia"];

 },
 CB: {

 },

 }

BANK.push({ cat: CA, type: "single", kt: ["receiver"], stem: "Two nurses discuss a patient in the hallway outside her open door, calling her demanding. She overhears, then refuses her evening medications and turns away from both nurses. Which action should the nurse take first?", opts: [O("Acknowledge privately with the patient that she overheard the exchange and address the damaged trust directly", true, "Correct. She was an unintended receiver; repairing trust is the first step. Framework: Nursing Process - assessment of the damaged relationship before interventions."), O("Document that the patient is noncompliant with medications and notify the provider of the refusal this evening", false, "Documenting noncompliance skips the cause: the patient heard herself labeled and trust was damaged."), O("Reassign the patient to a nurse she has not met, so the medication refusal resolves without a difficult talk", false, "Reassignment avoids the repair conversation and leaves the original harm unaddressed."), O("Explain in the hallway that hallway reports are routine, so the patient should not take the comments personally", false, "A hallway explanation repeats the exposure problem and sounds like an excuse, not repair.")], tp: "Framework: Nursing Process/ADPIE. An overheard patient is an unintended receiver - the relational harm is assessed and addressed first." });
BANK.push({ cat: CA, type: "single", stem: "A nurse spends 20 minutes lecturing a newly diagnosed patient about diet while the patient says nothing, then the patient cannot name one change he will make at home. Which change would most improve this teaching interaction?", opts: [O("Pause throughout the teaching to seek the patient's input and feedback and check what he is taking in", true, "Correct. Two-way participation replaces talking to the patient. Framework: Nursing Process - evaluation requires feedback from the receiver."), O("Lengthen the lecture with more detailed examples, so the volume of information compensates for his silence", false, "More one-way volume deepens the original problem; the sender stayed in total control."), O("Give the patient a longer handout to read alone, so no conversation is needed to confirm his understanding", false, "A handout alone is still one-way and gives the nurse no feedback to evaluate."), O("Ask the patient to repeat the lecture back word for word at the end, to prove he was listening throughout", false, "Word-for-word recitation is not feedback about understanding or about what he will do at home.")], tp: "Framework: Nursing Process/ADPIE. A lecture is one-way communication - of limited use in the nurse-patient relationship." });
BANK.push({ cat: CA, type: "single", kt: ["connotative meaning"], stem: "A provider tells a wife her husband's condition is stable. She phones relatives saying he is out of danger and stops asking questions, while his pressures remain borderline. Which action should the nurse take first?", opts: [O("Clarify with the wife what stable means here - not deteriorating at this moment - and check her understanding", true, "Correct. The gap is connotative: her reading added a promise the word never made. Framework: safety first - a false sense of security can delay her reporting changes."), O("Reassure the wife that her reading is close enough, because correcting her could raise her anxiety tonight", false, "Letting an unsafe misreading stand puts the patient at risk if she stops watching for decline."), O("Ask the provider to avoid the word stable in the future, because the word itself caused the misunderstanding", false, "Avoiding one word does not repair the current misreading this family is acting on."), O("Document the wife's phone calls in the chart, so the team knows relatives received optimistic news tonight", false, "Documentation does not correct the misunderstanding driving her behavior right now.")], tp: "Framework: safety first. Connotative readings differ by person - the nurse verifies what the receiver actually understood." });
BANK.push({ cat: CA, type: "single", kt: ["jargon"], stem: "A patient admitted for dehydration has charted intake but tells the nurse, I have not peed since yesterday, looking confused when asked when he last voided. Which response is most appropriate?", opts: [O("Rephrase in plain words and ask when he last urinated, then confirm his answer back with him directly", true, "Correct. Jargon blocked the exchange; plain words restore a shared dictionary. Framework: Nursing Process - validate that the message received matches the message sent."), O("Repeat the word voided more slowly and loudly, because repetition usually resolves an unfamiliar term problem", false, "Repeating the same jargon louder does not give the patient the plain word he knows."), O("Chart that the patient cannot answer output questions, because his confusion suggests a cognitive problem", false, "The barrier is terminology, not cognition; he answered immediately in his own words."), O("Ask his visiting daughter to answer for him, because family members usually know a patient's output history", false, "He can answer himself once the question uses words familiar to him.")], tp: "Framework: Nursing Process/ADPIE. Voided and stool are jargon to many patients - use urinated and bowel movement instead." });
BANK.push({ cat: CA, type: "multi", stem: "A nurse is choosing how to open a first conversation with a withdrawn patient who has answered previous staff in single words. Which opening choices support two-way communication? Select all that apply.", opts: [O("Sit facing the patient and ask how he has been feeling about being in the hospital this week", true, "Correct. An open opening plus facing the patient invites participation and exchange."), O("State that the nurse will check back for his input after giving report, and then actually return to hear it", true, "Correct. Promising and seeking his input makes him a participant, not an audience."), O("Ask what concerns he has about going home, then wait through his pause without filling the silence", true, "Correct. An open question plus protected thinking time supports a genuine two-way exchange."), O("Deliver a complete explanation of his care plan first, then ask if he has any questions at the very end", false, "A full lecture followed by one closing question keeps the sender in control throughout."), O("Talk mainly to his wife during the visit, because she answers fully while he gives only single words", false, "Routing around the patient excludes the receiver whose input two-way care requires.")], tp: "Framework: Maslow - belonging and esteem grow when the patient participates. Two-way communication needs sender and receiver both participating." });
BANK.push({ cat: CA, type: "single", stem: "During handoff, a nurse says a patient is fine. The oncoming nurse hears no problems at all, but the patient has a new oxygen requirement and a rising heart rate of 118. Which lesson does this exchange best illustrate?", opts: [O("The message intended is not always the message received, so key changes need specific words, not vague labels", true, "Correct. A vague label carried a different message than intended. Framework: safety first - imprecise handoff language can hide deterioration."), O("Handoff should be given only in writing, because spoken exchanges between nurses always distort vital changes", false, "Written handoff has value, but the failure here was vague wording, not speech itself."), O("The receiving nurse should assume fine covers new oxygen needs, because senders summarize minor changes that way", false, "Assuming a vague label covers major changes is exactly how deterioration gets missed."), O("The patient should join every handoff, because only the patient can correct a vague summary between two nurses", false, "Patient presence is not the fix named; precise, specific sender language is.")], tp: "Framework: safety first. Sender and receiver must share the same meaning - replace labels like fine with the actual changes." });
BANK.push({ cat: CA, type: "single", stem: "A Spanish-speaking patient nods at discharge teaching given in English with several drug names and terms like contraindication. At home he takes a stopped medication. Which factor most directly undermined this communication?", opts: [O("Subjective variability and unfamiliar terminology, because nodding did not confirm he shared the nurse's definitions", true, "Correct. Familiarity is the key word - no guarantee existed that he assigned the same definitions. Framework: safety first - unverified understanding at discharge is a harm risk."), O("One-way fatigue from a long shift, because the nurse's tired voice made ordinary English harder to decode at discharge", false, "Fatigue is not described; unfamiliar terms and unverified understanding are."), O("The patient's hearing, because drug names spoken at normal volume are usually missed by patients at discharge time", false, "No hearing problem is described; the gap was language and terminology."), O("The timing of the teaching, because discharge information is always forgotten regardless of how it is delivered well", false, "Forgetting is not inevitable; the failure was sending terms with no shared meaning check.")], tp: "Framework: safety first. No guarantee exists that both parties know a word or assign it the same definition - verify understanding." });
BANK.push({ cat: CB, type: "single", kt: ["nonverbal communication"], stem: "A patient awaiting surgery speaks loudly and rapidly in a high voice, pacing by the bed. A coworker says she is clearly terrified. Which action should the nurse take first?", opts: [O("Assess the whole situation and ask the patient how she is feeling, rather than concluding terror from her voice", true, "Correct. Voice alone cannot be interpreted accurately. Framework: Nursing Process - assess before concluding."), O("Chart that the patient is terrified of surgery, because a loud rapid high voice is a reliable sign of fear", false, "Some people always speak this way; the chapter warns no conclusion is appropriate from voice alone."), O("Tell the patient to lower her voice and slow down, because her speech pattern is raising anxiety on the unit", false, "Correcting her speech pattern judges the cue instead of assessing what it means for her."), O("Offer a sedative before assessing further, because excitement and fear both respond to the same medication", false, "Medication before assessment treats a conclusion that was never verified.")], tp: "Framework: Nursing Process/ADPIE. Tone, volume, and rate are read in the context of the whole situation." });
BANK.push({ cat: CB, type: "single", kt: ["nonverbal communication"], stem: "A nurse maintains steady eye contact for about 20 seconds at a time while a patient describes chest discomfort. The patient looks away, gives shorter answers, and folds her arms. Which adjustment is most appropriate?", opts: [O("Soften to brief direct eye contact of about 2 to 6 seconds, paired with an open posture and a calm tone", true, "Correct. Extended contact can read as aggression and raise anxiety. Framework: safety first - anxiety is already narrowing this patient's reporting."), O("Hold the steady gaze longer, because breaking eye contact first could signal that the nurse lacks confidence", false, "Longer extended contact is the cue most likely driving her withdrawal and guarding."), O("Avoid eye contact for the rest of the visit, because this patient has shown that any gaze feels threatening", false, "Absent contact can read as disinterest or disrespect; brief direct contact is the middle course."), O("Stand while continuing the same gaze, because a standing position adds authority that helps anxious patients", false, "Standing over her adds authority and intimidation to an already tense exchange.")], tp: "Framework: safety first. Brief direct eye contact, 2 to 6 seconds, involves the patient without threatening." });
BANK.push({ cat: CB, type: "single", stem: "A nurse rushes in, grabs a water pitcher, and says through tight lips, It is no bother, I am happy to do it. The patient apologizes repeatedly and stops using his call light. Which interpretation is correct?", opts: [O("The patient received the nonverbal message of anger and frustration, because incongruent cues outweigh the words", true, "Correct. This is the Nurse M. and Mr. R. pattern. Framework: Nursing Process - the received message, not the spoken one, drives patient behavior."), O("The patient received the verbal message but is manipulating staff, because his apology shows he understood fine", false, "His stopped call light shows withdrawal after a hostile-feeling exchange, not manipulation."), O("The patient missed both messages entirely, because a busy nurse's cues are too mixed for a patient to read at all", false, "He read the nonverbal cues clearly enough to change his help-seeking behavior."), O("The patient reacted to the delay itself, because pitcher refills normally take longer than he expected that day", false, "No delay is described; the hurry, grip, posture, and tone carried the message.")], tp: "Framework: Nursing Process/ADPIE. If nonverbal cues are incongruent with the words, the nonverbal message is received." });
BANK.push({ cat: CB, type: "multi", stem: "A nurse notices she has been interviewing a patient with arms folded, body turned toward the door, glancing at her watch. Which corrections align her nonverbal message with interest and acceptance? Select all that apply.", opts: [O("Unfold her arms, face the patient directly, and lean slightly toward him during the conversation", true, "Correct. Unfolding, facing, and leaning in make up an open posture of warmth and acceptance."), O("Sit down at the patient's level in a relaxed posture instead of standing over the bed during the talk", true, "Correct. Same-level sitting removes the authority-and-control position of standing over him."), O("Put the watch checks away and give brief direct eye contact while the patient is speaking to her", true, "Correct. Removing the disinterest cue and adding 2-to-6-second contact supports the message."), O("Keep her arms folded for warmth but smile continuously, because facial expression outweighs posture readings", false, "A smile does not cancel a closed posture; receivers read the combined nonverbal message."), O("Stand closer to the door so the patient senses the visit is brief, because honesty about time builds trust", false, "Signaling brevity reinforces disinterest rather than correcting it.")], tp: "Framework: Maslow - acceptance supports belonging. Open posture: facing, unfolded, leaning slightly toward, same level." });
BANK.push({ cat: CB, type: "single", stem: "A 6-year-old cries and hides behind her mother whenever the tall nurse stands over the bed explaining procedures. Which action is most appropriate?", opts: [O("Sit or kneel at the child's level, facing her with an open posture, before explaining the next procedure step", true, "Correct. Same-level positioning is especially important with pediatric patients. Framework: safety first - a frightened child cannot process teaching from an intimidating position."), O("Continue standing so the child learns the nurse is in charge, because authority settles frightened children faster", false, "Standing over a patient reads as authority and intimidation, the opposite of settling."), O("Ask the mother to explain all procedures instead, because children cannot receive messages directly from nurses", false, "The nurse can communicate directly once position stops intimidating the child."), O("Explain more loudly from the doorway, because distance plus volume usually calms a child who hides from staff", false, "Distance and loudness add threat cues; level and closeness with open posture help.")], tp: "Framework: safety first. Whenever possible, be at the same level as the patient - especially with pediatric patients." });
BANK.push({ cat: CB, type: "single", stem: "A patient privately tells the nurse she doubts a heavily tattooed nurse's competence, although that nurse's care has been skilled and safe. Which response is most appropriate?", opts: [O("Acknowledge her perception without agreeing, and explain that appearance does not measure the nurse's competence", true, "Correct. Appearance strongly shapes perception even when unrelated to the intended message. Framework: Nursing Process - address the perception while protecting a colleague's standing."), O("Request that the tattooed nurse be removed from her care, because a patient's first impression settles the matter", false, "Removing a competent nurse validates a bias the chapter names as unrelated to competency."), O("Tell the patient her bias is offensive and must stop, because challenging prejudice directly restores trust fastest", false, "A confrontational lecture is arguing, a blocking response that will not rebuild trust."), O("Agree that tattoos look unprofessional, because validating her view keeps her cooperating with the care plan", false, "Agreeing endorses a false link between appearance and competence.")], tp: "Framework: Nursing Process/ADPIE. Appearance attributes can dominate a receiver's interpretation while having nothing to do with competency." });
BANK.push({ cat: CB, type: "matrix", kt: ["posture"], stem: "Classify each nurse behavior by the message a receiver is most likely to read from it, using Table 4.1.", cols: ["Warmth, acceptance, caring", "Disinterest, coldness, nonacceptance"], rows: [{t: "Relaxed stance, facing the patient, arms uncrossed, leaning slightly toward the patient", a: 0, r: "Correct. That cluster is the open-posture pattern read as warmth and acceptance."}, {t: "Arms and legs tightly crossed, formal distant stance, facing partly away from the patient", a: 1, r: "Correct. That cluster is the closed-posture pattern read as disinterest and nonacceptance."}, {t: "Smiling with direct brief eye contact while sitting at the patient's level at the bedside", a: 0, r: "Correct. Smile, brief direct contact, and same level all belong to the open pattern."}, {t: "Repeatedly checking a watch while the patient is mid-sentence during an admission interview", a: 1, r: "Correct. Watch-checking is the chapter's gesture example for disinterest and limited time."}], tp: "Framework: Nursing Process - assess the message your body sends. Table 4.1 pairs open cues with warmth and closed cues with nonacceptance." });
BANK.push({ cat: CB, type: "single", stem: "A nurse wears a wrinkled uniform and soiled shoes on a day a new patient is deciding whether this team cares about details. Which risk does the chapter attach to this appearance?", opts: [O("The patient may read the nurse as uncaring or incompetent, because appearance can signal the patient is not worth effort", true, "Correct. The chapter makes exactly that link. Framework: Nursing Process - the nurse's presentation is part of the message sent."), O("The patient may ask for a different nurse for infection reasons, because soiled shoes are mainly a contamination issue", false, "Infection is not the chapter's point here; perceived caring and competence are."), O("No risk attaches at all, because patients judge nurses only by technical outcomes once treatment has started well", false, "The chapter gives appearance a major impact on the receiver's interpretation."), O("The risk is limited to coworkers, because dress codes exist to impress supervisors rather than to signal patients", false, "Dress codes communicate professionalism and role to patients, not only to supervisors.")], tp: "Framework: Nursing Process/ADPIE. A professional appearance conveys self-respect and competence; scrub colors can also signal role." });
BANK.push({ cat: CB, type: "dropdown", stem: "Complete the plan for a conversation with an anxious patient who keeps glancing at the nurse's folded arms. The nurse will sit [[0]] and will hold eye contact [[1]].", blanks: [{o: [O("at the patient's level, facing him with arms unfolded", true, "Correct. Same level, facing, and unfolded arms form the open position."), O("standing at the foot of the bed with arms folded", false, "Standing over him with folded arms reads as authority and disinterest."), O("in the doorway, leaning back with legs crossed", false, "Doorway distance and leaning back read as detachment, not interest.")]}, {o: [O("briefly and directly, for about 2 to 6 seconds at a time", true, "Correct. That is the brief-but-direct band read as interest and caring."), O("steadily without breaks, for 20 seconds or longer at a time", false, "Extended unbroken contact can read as aggression and raise anxiety."), O("not at all during the visit, to avoid pressuring the patient", false, "Absent contact can read as disinterest, embarrassment, or disrespect.")]}], tp: "Framework: safety first - remove threat cues first. Open posture plus 2-to-6-second eye contact involves the patient without intimidating." });
BANK.push({ cat: CC, type: "single", kt: ["assertive communication"], stem: "A nurse must finish preoperative preparation for one patient when another, Mr. R., asks for fresh water. Which response is assertive as this chapter defines it?", opts: [O("Mr. R., if you can wait about 10 minutes I will gladly refill it, or an assistant can fill it for you now", true, "Correct. Her need and his need are both honored, with a time and an alternative. Framework: Maslow - both parties' needs count in an assertive exchange."), O("I am far too busy for water runs today, so you will simply have to wait until someone less important is free", false, "That meets her need at his expense and would leave him humiliated - the aggressive pattern."), O("Well, I am really busy, but I guess I can hurry, though I will never get my other patient ready in time now", false, "That agrees while pleading - the unassertive pattern that leaves resentment on both sides."), O("Of course, right away, every time, no matter what - said while abandoning the preoperative preparation entirely", false, "Abandoning a time-critical task sacrifices her legitimate responsibilities, not assertiveness.")], tp: "Framework: Maslow. Assertive = confident and direct while respecting the patient's rights; neither party feels belittled or guilty." });
BANK.push({ cat: CC, type: "single", stem: "A patient tells the nurse he plans to stop his heart medication and, if his family objects, to make sure they regret it, adding that he might hurt someone. Which action should the nurse take first?", opts: [O("Report the stated intent to harm others through the proper channels, despite the patient's expectation of privacy", true, "Correct. Intent to harm self or others is the stated limit of confidentiality. Framework: safety first - protection from harm outranks confidentiality."), O("Keep the statement confidential as promised, because breaking trust would end any chance of helping this patient", false, "Confidentiality has this exact printed exception; the obligation to report comes first."), O("Document the statement and raise it at the next routine team meeting, because no specific person was named yet", false, "A stated intent to hurt someone needs prompt reporting, not a routine-meeting delay."), O("Ask the patient to promise not to act on it, because a verbal promise restores safety without involving others", false, "A promise does not discharge the nurse's obligation to report intent to harm.")], tp: "Framework: safety first. Patients should be told up front that intent to harm self or others must be reported." });
BANK.push({ cat: CC, type: "single", stem: "A nurse promised a patient a bath in 15 minutes, then an admission consumed the next hour. The patient now says, You forgot me. Which action best rebuilds trust?", opts: [O("Explain what happened, apologize for the broken commitment, and set a new mutually agreed time for the bath", true, "Correct. Explanation plus a renegotiated plan is the chapter's follow-through repair. Framework: Nursing Process - evaluate the broken commitment and revise the plan with the patient."), O("Give the bath immediately without discussing the delay, because completing the task erases the broken promise", false, "The task matters, but the unexplained broken commitment is the trust injury to address."), O("Explain that admissions always outrank baths, because teaching the patient the unit's priorities rebuilds trust", false, "Ranking his need last explains the system, not a new mutual plan with him."), O("Avoid time promises with all patients from now on, because never committing is safer than risking a delay", false, "The chapter expects commitments to be made and kept or renegotiated, not avoided.")], tp: "Framework: Nursing Process/ADPIE. Failure to follow through erodes trust; an explained, mutually replanned commitment protects it." });
BANK.push({ cat: CC, type: "single", stem: "On entering a room, a nurse adjusts the IV pump and checks the monitor before greeting the patient, who later tells his wife the staff care more about machines than people. Which change matches the chapter?", opts: [O("Look at and address the patient first on entering, before assessing or adjusting any equipment in the room", true, "Correct. The patient is the focus of each interaction, not the equipment or the task. Framework: Maslow - feeling valued supports the relationship everything else depends on."), O("Explain the pump settings in detail first, because understanding the equipment helps patients feel included in care", false, "Equipment-first still centers the machine; greeting the person comes first."), O("Limit room entries to task times only, because fewer entries mean fewer chances to seem machine-focused today", false, "Fewer entries do not fix the order of attention during the entries that happen."), O("Ask the wife to relay greetings, because family presence already gives the patient enough personal attention daily", false, "The nurse's own first attention to the patient is the chapter's point.")], tp: "Framework: Maslow. Caring, sincerity, empathy, and trustworthiness must be sensed by the patient - hurry and detachment send the opposite message." });
BANK.push({ cat: CC, type: "single", stem: "A discharged patient asks his nurse for her personal cell number so he can text health questions, saying she is the only one he trusts. Which response maintains professional boundaries?", opts: [O("Decline to share personal contact information and direct him to the clinic's official channels for questions", true, "Correct. Sharing address or phone number is not advisable. Framework: safety first - boundaries protect both parties from situations the nurse cannot handle."), O("Share the number but set strict texting hours, because clear limits make personal contact safe after discharge", false, "Limits do not remove the boundary problem the chapter warns against."), O("Share a personal email instead of the number, because written contact is less personal and therefore acceptable", false, "The warning covers personal information such as address and phone number; swapping channels keeps the same risk."), O("Give the number this once because he trusts only her, because trust is the foundation of the relationship here", false, "Flattering trust is exactly how boundary crossings begin; official channels preserve care safely.")], tp: "Framework: safety first. Professional boundaries: personal address and phone number are not shared with patients." });
BANK.push({ cat: CC, type: "multi", stem: "A nurse supervises new unlicensed assistive personnel whose bedside manner with patients is rushed and dismissive. Which supervisory actions does the chapter support? Select all that apply.", opts: [O("Role model effective communication techniques during shared patient care, so the UAP sees the standard in action", true, "Correct. Role modeling is one of the two methods the chapter names for improving UAP communication."), O("Arrange or support in-service education programs that build the UAP's communication skills with patients", true, "Correct. In-service education is the second method named in the Coordinated Care box."), O("Monitor how effectively the UAP communicate with patients and with ancillary staff from other departments", true, "Correct. Monitoring UAP communication with patients and ancillary personnel is the nurse's responsibility."), O("Leave communication style entirely to each UAP, because interpersonal manner is personal and not a nursing concern", false, "The chapter makes monitoring and improving UAP communication an explicit nurse responsibility."), O("Restrict the UAP from speaking with patients at all, because new personnel cannot be trusted in any conversation", false, "Restriction removes care capacity; the chapter's route is modeling, monitoring, and education.")], tp: "Framework: Nursing Process - the nurse monitors, role models, and educates. Cross-cultural communication is called out as an area even experienced nurses keep developing." });
BANK.push({ cat: CC, type: "single", stem: "A patient shares highly sensitive information about his past and asks whether it will be repeated in the hallway. Which response best protects trust?", opts: [O("Assure him it stays confidential and is shared only with team members who need it to give him safe care", true, "Correct. That is the chapter's confidentiality standard. Framework: safety first - trust depends on information going only where care requires it."), O("Assure him nothing he says ever leaves the room, including information the rest of the care team needs to know", false, "That promise cannot be kept; the team needs information to provide safe, competent care."), O("Tell him hallway talk is common but harmless, because staff use initials when discussing sensitive patient details", false, "Hallway discussion of sensitive details is precisely what a trusting patient fears."), O("Suggest he keep sensitive details to himself, because the safest information is information never shared at all", false, "Discouraging disclosure undermines assessment and the therapeutic relationship.")], tp: "Framework: safety first. Trust is essential; sensitive information is shared only with those who need it for safe, competent care." });
BANK.push({ cat: CC, type: "matrix", kt: ["assertive communication"], stem: "Classify each nurse response to the same water-pitcher request by communication style.", cols: ["Assertive", "Aggressive", "Unassertive"], rows: [{t: "If you can wait about 10 minutes I will gladly fill it, or an assistant can fill it for you now", a: 0, r: "Correct. A time, a willing tone, and an alternative honor both parties' needs."}, {t: "I have a surgical patient to prepare, so your water will wait until I decide someone has time for it", a: 1, r: "Correct. Her need is met at his expense in an overpowering way."}, {t: "Well, I am really busy, but I guess I can hurry, though I will never finish my other work in time", a: 2, r: "Correct. Agreeing while pleading sacrifices her legitimate position and breeds resentment."}, {t: "You ring for water every hour, so from now on you can ask your family to bring it when they visit", a: 1, r: "Correct. Dismissing his need to serve her convenience is forceful and at his expense."}], tp: "Framework: Maslow - assertive honors both sets of needs; aggressive serves the nurse at the patient's expense; unassertive sacrifices the nurse and breeds resentment." });
BANK.push({ cat: CD, type: "single", kt: ["active listening"], stem: "A patient describes fears about tomorrow's surgery in fragments, pausing often. The nurse wants his full concern before responding. Which approach uses active listening correctly?", opts: [O("Give full attention, interpret what he is saying, then feed back her understanding so he can confirm or correct it", true, "Correct. Feedback the patient can validate is the active pattern. Framework: Nursing Process - validation confirms the assessment data before planning."), O("Nod, hold eye contact, and say Uh-huh and I see throughout, because those signals confirm she understood him fully", false, "Those signals show interest, but passive listening does not confirm the message was understood."), O("Take detailed notes without looking up, because a complete written record proves she captured every concern today", false, "Note-taking without attention to the speaker misses the nonverbal half of his message."), O("Plan her reassurance while he talks, because an experienced nurse can listen and compose a response at once", false, "Thinking ahead to a response is the novice trap the chapter names for missing the real message.")], tp: "Framework: Nursing Process/ADPIE. Active listening: hear, interpret, feed back. It is possible to hear without listening." });
BANK.push({ cat: CD, type: "single", kt: ["silence"], stem: "A patient's wife has just been told he died. She sits holding his hand, saying nothing. Which action best uses therapeutic silence?", opts: [O("Remain with her in silence, hand available for touch, letting her set when and whether conversation resumes", true, "Correct. Presence, silence, and touch convey support without talking the situation away. Framework: Maslow - grief support begins with presence, not words."), O("Fill the silence with a steady explanation of next steps, because information is the most comforting support now", false, "A stream of information talks away a moment that calls for silent presence."), O("Leave promptly so she can grieve privately, because a nurse's silent presence usually intrudes after bad news", false, "Remaining with the family after the news is the chapter's own example of effective silence."), O("Ask repeated gentle questions every minute, because silence longer than a few seconds signals abandonment to families", false, "Repeated questions deny her the thinking and feeling time silence protects.")], tp: "Framework: Maslow. Silence conveys support, compassion, and caring - especially with touch after a death." });
BANK.push({ cat: CD, type: "single", kt: ["touch"], stem: "A frightened patient who speaks little English faces a painful dressing change and keeps reaching toward the nurse. Which use of touch is most appropriate?", opts: [O("Hold her hand during the procedure if she welcomes it, because touch can comfort when words cannot reach her", true, "Correct. The chapter gives this exact situation: hand-holding during a difficult procedure can outperform verbal effort. Framework: safety first - comfort reduces distress when language cannot."), O("Avoid all touch beyond the dressing itself, because cross-language touch is always misread by patients in pain", false, "Touch is not always misread; held appropriately it conveys warmth and support across language gaps."), O("Pat her head repeatedly while working, because a parental gesture communicates caring in every culture equally", false, "Head pats can offend, and interpretation of touch varies by culture, body part, and relationship stage."), O("Ask her family to hold her instead in all cases, because nurse touch during procedures is never appropriate care", false, "Family presence can help, but nurse touch during care is inherent in nursing and can be therapeutic.")], tp: "Framework: safety first. Touch must fit sociocultural norms and be sincere - hesitant touch can send a message of rejection." });
BANK.push({ cat: CD, type: "single", stem: "A patient who smokes two packs daily after a heart attack expects the nurse to lecture him. He says, Go ahead, tell me I am killing myself. Which response conveys acceptance correctly?", opts: [O("Acknowledge his right to his choices without endorsing smoking, then offer a healthier alternative and help if he chooses it", true, "Correct. Acceptance without condoning, followed by an offered alternative. Framework: Nursing Process - change is facilitated while personal integrity is maintained."), O("Tell him his smoking is unacceptable on this unit, because firm disapproval is what finally motivates most patients", false, "Disapproval, verbal or nonverbal, is what acceptance is defined against."), O("Say nothing about smoking at all during his stay, because acceptance requires silence about harmful health behaviors", false, "Acceptance is followed by communicating a healthier alternative, not by silence."), O("Praise his honesty and drop the topic, because any follow-up suggestion would undo the acceptance just shown", false, "Offering an alternative is the next step after acceptance, not a contradiction of it.")], tp: "Framework: Nursing Process/ADPIE. Acceptance of the patient is not approval of the lifestyle - facilitate change while protecting integrity." });
BANK.push({ cat: CD, type: "single", kt: ["focusing"], stem: "A patient is circling a worry about going home, repeating fragments about stairs, a spouse at work, and a dog. The nurse needs one clear focus. Which response uses focusing correctly?", opts: [O("Ask him to pick the one concern to work through first, starting with what worries him most about the stairs", true, "Correct. Focusing selects one topic when a message is too vague. Framework: Nursing Process - specific data must be gathered before planning discharge support."), O("Summarize all three concerns at length, because a full review is the technique designed for a wandering message", false, "Summarizing reviews a completed discussion; this discussion has not found its focus yet."), O("Reflect his last fragment about the dog, because the most recent topic is always the one that matters most", false, "Recency does not set priority; focusing deliberately selects the primary topic."), O("Change to his discharge paperwork, because concrete forms will organize his thinking better than open discussion", false, "Changing the subject is a blocking response, not a focusing technique.")], tp: "Framework: Nursing Process/ADPIE. Focusing gathers specific information when the patient's message is too vague." });
BANK.push({ cat: CD, type: "single", kt: ["restating"], stem: "A patient says, My husband will expect me to cook and clean like always when I get home, two days after abdominal surgery. Which response is restating used correctly?", opts: [O("Your husband will expect you to do the cooking and cleaning when you get home, said with a slight rising tone", true, "Correct. That repeats her main point back so she can add information. Framework: Nursing Process - restating confirms the nurse heard the concern driving discharge planning."), O("So you are worried your recovery will be too slow, said as a settled conclusion about her feelings on discharge", false, "That adds an interpretation as fact; restating repeats her main point without settling her feelings for her."), O("What do you think you should do about that, asked so she solves the household problem without the nurse's input", false, "That is reflecting, which returns a decision question; it is not restating her point."), O("Many patients feel that way at discharge, said to normalize her worry before moving to the teaching checklist", false, "A general normalizing comment is an automatic-style reply, not a restatement of her point.")], tp: "Framework: Nursing Process/ADPIE. Restating repeats the main point with rising tone - used selectively, or it becomes parroting." });
BANK.push({ cat: CD, type: "single", stem: "A nurse has restated a patient's sentences back to her six times in five minutes. The patient snaps, Stop repeating everything I say. Which lesson applies?", opts: [O("Restating was overused and became parroting, which sounds planned and annoys the patient instead of helping her", true, "Correct. The chapter names this exact failure. Framework: Nursing Process - evaluate the technique by the patient's response and adjust."), O("Restating failed because the nurse used her own words, because restating requires exact repetition every single time", false, "Own-words restatement is paraphrasing; the failure here was frequency, not wording."), O("The patient's snap proves restating is a blocking response, because therapeutic techniques never irritate patients", false, "Restating is therapeutic when selective; irritation signals overuse, not a wrong category."), O("The nurse should switch to repeating with a flatter tone, because tone was the only flaw in an otherwise sound plan", false, "Tone is part of restating, but six repetitions in five minutes is the overuse problem.")], tp: "Framework: Nursing Process/ADPIE. Use restating selectively - overuse becomes parroting and sounds like a planned response." });
BANK.push({ cat: CD, type: "single", kt: ["paraphrasing"], stem: "A patient facing spinal anesthesia says, I keep thinking about not waking up right, or my legs not working after. Which response is paraphrasing used correctly?", opts: [O("You are concerned that you might have complications from the spinal anesthetic, restating his fear in her own words", true, "Correct. That is the chapter's own paraphrasing example. Framework: Nursing Process - paraphrasing verifies the nurse's interpretation before responding to it."), O("You said you keep thinking about not waking up right, repeating his exact sentence back without any change at all", false, "Exact repetition is closer to restating; paraphrasing uses the nurse's own words to verify interpretation."), O("Tell me exactly what the anesthesiologist said last time, asking for a precise account of a past conversation now", false, "That is focusing on a specific account, not paraphrasing the current message."), O("Most spinal anesthetics go smoothly, offered as reassurance before he finishes describing what frightens him", false, "Reassurance before verification risks false reassurance and cuts off his concern.")], tp: "Framework: Nursing Process/ADPIE. Paraphrasing verifies interpretation; it differs from restating in intent, not in topic." });
BANK.push({ cat: CD, type: "dropdown", kt: ["offering information", "summarizing"], stem: "Complete the discharge-teaching plan for a patient going home on a new inhaler. Before the procedure steps, the nurse will [[0]]. At the end of the session, the nurse will [[1]].", blanks: [{o: [O("offer information about what to expect and check his understanding as she goes", true, "Correct. Offering information pairs relevant data with feedback on understanding."), O("give advice about what he should decide, since she knows the regimen best", false, "Advice takes decision making away from the patient; information supports it."), O("offer reassurance that it will be fine, since confidence prevents most errors", false, "Blanket reassurance can be false reassurance, a blocking response.")]}, {o: [O("summarize the main points so he can separate essentials from nice-to-know details", true, "Correct. Summarizing closes a lengthy session by focusing key issues."), O("restate his first sentence from the session, so the teaching ends where it began", false, "Restating one sentence does not review the session's main ideas."), O("change the subject to his follow-up ride, so the session ends on a lighter topic", false, "Changing the subject blocks closure; summarizing provides it.")]}], tp: "Framework: Nursing Process - teaching ends with evaluation. Offering information teaches; summarizing separates essential from nice-to-know." });
BANK.push({ cat: CD, type: "single", kt: ["stating observations"], stem: "A patient says she feels fine while her posture is tense, her eye contact darts, and she fidgets with the blanket. Which technique addresses the mismatch?", opts: [O("State the observations back to her - tense posture, darting contact, fidgeting - and invite her to clarify them", true, "Correct. Stating observations is designed for verbal-nonverbal mismatch. Framework: Nursing Process - clarifying the mismatch lets the nurse address the real concern."), O("Accept her words at face value and chart that she feels fine, because verbal reports outrank observed behavior", false, "Her words and body disagree; the chapter directs the nurse to share the observations."), O("Ask why she is hiding her real feelings, because a direct why question will get an honest answer fastest now", false, "Why questions read as accusatory and put the patient on the defensive."), O("Tell her she is obviously anxious, because naming the emotion for her saves time in a busy assessment round", false, "Labeling her emotion as fact is a false assumption made without validation.")], tp: "Framework: Nursing Process/ADPIE. Stating observations allows clarification when verbal cues do not match nonverbal cues." });
BANK.push({ cat: CD, type: "single", stem: "Colleagues joke at the bedside of a patient who has just been told his cancer has spread. He turns to the wall and stops answering questions. Which analysis is correct?", opts: [O("Humor was mistimed for a serious moment and was read by the patient as the team laughing at his situation", true, "Correct. Timing and context govern humor; a new serious spread of disease is not the moment. Framework: safety first - withdrawal after mistimed humor can hide unreported symptoms and fears."), O("Humor failed only because the jokes were weak, because any well-delivered joke lifts a patient after hard news", false, "Delivery is not the issue; serious diagnoses make humor inappropriate regardless of quality."), O("The patient overreacted, because humor after bad news is a standard therapeutic tool nurses should use routinely", false, "The chapter warns the opposite: know the patient and the moment before using humor."), O("The nurse should joke more personally with him now, because doubling down usually repairs a humor misstep fast", false, "More humor after a mistimed attempt deepens the harm rather than repairing it.")], tp: "Framework: safety first. Laugh with the patient, never at the patient - and never as a way to avoid difficult emotions." });
BANK.push({ cat: CE, type: "single", stem: "A nurse will teach a patient wound care. He is grimacing, guarding his abdomen, and rating pain 8 of 10, and he keeps losing the thread of her sentences. Which action should the nurse take first?", opts: [O("Address his pain first, then begin the teaching once he can focus on something besides coping with pain", true, "Correct. Pain consumes all available energy for coping. Framework: ABCs-adjacent safety first becomes comfort first here - pain control before teaching, per the chapter's direct instruction."), O("Begin teaching slowly and repeat each step twice, because repetition compensates for a high pain rating in class", false, "Repetition does not restore attention that pain has fully occupied."), O("Shorten the teaching to the single most urgent step, because partial teaching is better than delaying it for analgesia", false, "Even one step will not land while his energy is entirely on coping with pain."), O("Ask his wife to learn the wound care instead today, because a patient in severe pain cannot be taught at any point", false, "He can be taught after his pain is addressed; substituting his wife skips that step.")], tp: "Framework: safety first. The LPN/LVN first addresses pain before communicating, especially before any patient teaching." });
BANK.push({ cat: CE, type: "order", stem: "Place the nurse's actions for a teaching conversation with a hard-of-hearing older patient in the best order.", items: [{t: "Get the patient's attention and face him before beginning to speak", r: "First: Box 4.5 begins with getting attention and facing the patient."}, {t: "Confirm his hearing aid and glasses are in place and working", r: "Second: assistive devices must be operating before the message is sent."}, {t: "Reduce environmental noise such as the television in the room", r: "Third: a quieter environment protects the message from competing sound."}, {t: "Speak at a normal volume with a lowered tone of voice", r: "Fourth: normal volume and lower tone suit high-pitch hearing loss."}, {t: "Rephrase, rather than repeat, any comment he still cannot follow", r: "Fifth: rephrasing is the chapter's fix when repetition is not working."}], tp: "Framework: Nursing Process - prepare the channel before sending the message. Never shout; hard-of-hearing patients struggle most with high-pitched sounds." });
BANK.push({ cat: CE, type: "single", stem: "A nurse must insert a urinary catheter, working within inches of a patient's face-to-body personal boundaries, and the patient tenses and apologizes for being a bother. Which action is most appropriate?", opts: [O("Proceed professionally, explain each step, and watch his nonverbal cues while working in his intimate space", true, "Correct. Intimate-space work is unavoidable in nursing; professionalism eases it. Framework: safety first - monitoring his cues protects dignity during an intrusive procedure."), O("Complete the insertion as silently and quickly as possible, because talking during intimate care embarrasses patients", false, "Silence without explanation leaves him guessing; explaining procedures is a Box 4.6 standard."), O("Ask a family member to stay and chat with him throughout, because distraction removes the uneasiness of close care", false, "Family presence during catheter insertion raises privacy problems rather than solving uneasiness."), O("Delay the catheter until he relaxes on his own, because tense patients should never receive intimate-space care yet", false, "Delay without a plan leaves a needed intervention undone; professional manner is the chapter's fix.")], tp: "Framework: safety first. Intimate space is face to about 18 inches - bathing, catheter care, and dressing changes all happen there." });
BANK.push({ cat: CE, type: "single", stem: "A diabetes class of eight patients sits in a circle about 6 feet from the nurse. One patient later says the class felt like a lecture to strangers rather than care for her. Which zone fact explains the setup?", opts: [O("At 4 to 12 feet the class sits in social space, suited to group teaching but not to intimate personal disclosure", true, "Correct. Social space is the chapter's group-class zone. Framework: Nursing Process - match the setting to the kind of exchange planned."), O("At 4 to 12 feet the class sits in personal space, which is why group teaching should always feel like bedside care", false, "Personal space is 18 inches to 4 feet and suits one-to-one conversation, not a class circle."), O("At 4 to 12 feet the class sits in intimate space, which is why patients in classes often feel crowded and exposed", false, "Intimate space ends at about 18 inches; a 6-foot circle is far outside it."), O("Distance zones stop mattering in group settings, because only one-to-one care is affected by how far people stand", false, "The chapter's class example is precisely a distance-zone example.")], tp: "Framework: Nursing Process/ADPIE. Zones: intimate to about 18 inches, personal 18 inches to 4 feet, social 4 to 12 feet, public beyond 12 feet." });
BANK.push({ cat: CE, type: "single", stem: "A patient shares a room with a talkative roommate and a blaring television. She lowers her voice to a whisper when the nurse asks about her fears of dying. Which action is most appropriate?", opts: [O("Move the conversation to a private conference room if her condition allows, or at minimum pull the privacy curtain", true, "Correct. Calm and privacy are key elements for this kind of interaction. Framework: safety first - she is already self-censoring a fear the team needs to hear."), O("Ask the roommate to turn the television down and continue, because a quieter shared room is private enough here", false, "A curtain is the minimum; a merely quieter shared room still lacks privacy for this topic."), O("Postpone all discussion of her fears until discharge, because shared rooms are never suitable for serious topics", false, "Postponing abandons a current fear; the chapter offers room and curtain solutions now."), O("Speak more loudly so she can be heard over the television, because audibility matters more than privacy in shared rooms", false, "Raising volume exposes her private fear to the roommate she is whispering to avoid.")], tp: "Framework: safety first. Ideal is a private room with the door closed; the privacy curtain is the minimum fallback." });
BANK.push({ cat: CE, type: "single", stem: "No trained interpreter is available for a newly admitted non-English-speaking patient, so the nurse considers the patient's 9-year-old granddaughter, who is fluent in both languages. Which action matches the chapter?", opts: [O("Avoid using the young child as interpreter and pursue other means such as social services and picture supports", true, "Correct. Younger children should not interpret, and family interpreting carries misinterpretation risk. Framework: safety first - an inaccurate channel can corrupt assessment and consent."), O("Use the granddaughter for the full admission, because a fluent family member is the chapter's preferred fallback plan", false, "Family is a cautious fallback, and younger children are specifically to be avoided."), O("Use the granddaughter only for medical history, because children interpret facts more accurately than feelings anyway", false, "The avoidance is not split by topic; the child should not be the interpreter."), O("Proceed in English with gestures only, because involving any family interpreter violates privacy rules in every case", false, "Family interpreting is allowed with caution and HIPAA compliance; it is not banned outright.")], tp: "Framework: safety first. Find an interpreter through all available means; use family cautiously, never younger children, and keep HIPAA in view." });
BANK.push({ cat: CE, type: "single", stem: "A nurse addresses all questions to the interpreter instead of the patient, watches the interpreter throughout, and finishes quickly to save time. The patient stops volunteering information. Which corrections match Box 4.3?", opts: [O("Address questions to the patient, allow extra time for translation, and choose a dialect-specific trained interpreter", true, "Correct. All three corrections come from Box 4.3. Framework: Nursing Process - the patient, not the interpreter, is the focus of the interaction."), O("Address questions to the interpreter, because the interpreter is the only person who can actually receive them here", false, "Box 4.3 directs questions to the patient, not the interpreter."), O("Finish faster at the next visit, because translation time is inefficiency the nurse should train herself to eliminate", false, "More time, not less, is needed when translation is part of the interaction."), O("Use a close relative as interpreter next time, because relatives are preferred over trained dialect-specific interpreters", false, "Box 4.3 says avoid children and relatives as interpreters where an interpreter is available.")], tp: "Framework: Nursing Process/ADPIE. Same-age and same-gender interpreters are preferred when possible; give patient and interpreter time together." });

  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
