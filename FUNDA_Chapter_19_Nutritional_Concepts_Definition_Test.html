BANK.push({"cat": CA, "type": "single", "stem": "Which statement about essential nutrients is accurate?", "opts": [{"t": "They must come from the diet because the body cannot make enough for health", "c": true, "r": "Correct. Essential nutrients cannot be made in amounts needed for health, so food must supply them."}, {"t": "They are stored in large amounts so that daily intake is never necessary", "c": false, "r": "Incorrect. Storage describes some fat-soluble vitamins, not the meaning of an essential nutrient."}, {"t": "They provide energy at nine kilocalories for every gram that is consumed", "c": false, "r": "Incorrect. Nine kilocalories per gram describes fat; vitamins, minerals and water give no energy."}, {"t": "They are limited to carbohydrates, proteins and fats found in animal foods", "c": false, "r": "Incorrect. There are six classes, including vitamins, minerals and water, from many food sources."}], "tp": "Essential nutrients must come from the diet; the six classes are carbohydrates, fats, proteins, vitamins, minerals and water."});

BANK.push({"cat": CA, "type": "multi", "stem": "Which of the following nutrients provide energy for the body? Select all that apply.", "opts": [{"t": "Carbohydrates, at about four kilocalories per gram of food eaten", "c": true, "r": "Correct. Carbohydrates are an energy nutrient at about 4 kcal/g."}, {"t": "Proteins, at about four kilocalories per gram of food eaten daily", "c": true, "r": "Correct. Protein is an energy nutrient at about 4 kcal/g, though its main job is building tissue."}, {"t": "Fats, at about nine kilocalories per gram of food eaten daily", "c": true, "r": "Correct. Fat is the most concentrated energy source at 9 kcal/g."}, {"t": "Vitamins, at about four kilocalories per gram of food eaten daily", "c": false, "r": "Incorrect. Vitamins regulate body processes and provide no energy at all."}, {"t": "Minerals, at about nine kilocalories per gram of food eaten daily", "c": false, "r": "Incorrect. Minerals regulate body processes and provide no energy at all."}, {"t": "Water, at about four kilocalories per gram of fluid taken in daily", "c": false, "r": "Incorrect. Water is essential for life but provides no energy at all."}], "tp": "Only carbohydrates, fats and proteins provide energy: 4, 9 and 4 kcal/g. Vitamins, minerals and water provide none."});

BANK.push({"cat": CA, "type": "single", "stem": "A meal contains 20 grams of carbohydrate. How much energy does that carbohydrate provide?", "opts": [{"t": "About 80 kilocalories, using four kilocalories for each gram eaten", "c": true, "r": "Correct. Carbohydrate provides about 4 kcal/g, so 20 g provides about 80 kcal."}, {"t": "About 180 kilocalories, using nine kilocalories for each gram eaten", "c": false, "r": "Incorrect. Nine kilocalories per gram is the value for fat, not for carbohydrate."}, {"t": "About 40 kilocalories, using two kilocalories for each gram eaten daily", "c": false, "r": "Incorrect. No energy nutrient is valued at 2 kcal/g in this chapter."}, {"t": "No kilocalories at all, because carbohydrate is never used for energy", "c": false, "r": "Incorrect. Providing energy is the main function of carbohydrate in the diet."}], "tp": "Use the 4-4-9 rule: carbohydrate 4 kcal/g, protein 4 kcal/g, fat 9 kcal/g."});

BANK.push({"cat": CA, "type": "single", "stem": "Which caloric distribution matches the pattern printed in the chapter?", "opts": [{"t": "Carbohydrate 45 to 65 percent, fat 20 to 35 percent, protein 10 to 35 percent", "c": true, "r": "Correct. Those are the chapter ranges for the three energy nutrients."}, {"t": "Carbohydrate 10 to 35 percent, fat 45 to 65 percent, protein 20 to 35 percent daily", "c": false, "r": "Incorrect. The carbohydrate and fat ranges have been swapped in this option."}, {"t": "Carbohydrate 20 to 35 percent, fat 10 to 35 percent, protein 45 to 65 percent daily", "c": false, "r": "Incorrect. The protein range here is actually the carbohydrate range in the chapter."}, {"t": "Carbohydrate, fat and protein each fixed at exactly one third of daily calories", "c": false, "r": "Incorrect. The chapter gives ranges for each nutrient, not equal fixed thirds."}], "tp": "Caloric distribution: carbohydrate 45%-65%, fat 20%-35%, protein 10%-35% of daily kcal."});

BANK.push({"cat": CA, "type": "single", "stem": "Which statement best describes glycogen in the body?", "opts": [{"t": "It is stored mainly in the liver and muscles and released when glucose falls", "c": true, "r": "Correct. Glycogen is the storage form, held in liver and muscle for low blood glucose."}, {"t": "It is a simple sugar found in fruit and honey that needs no digestion at all", "c": false, "r": "Incorrect. That describes fructose, a monosaccharide absorbed directly into the blood."}, {"t": "It is a plant fiber that cannot be digested and is excreted in the feces daily", "c": false, "r": "Incorrect. That describes dietary fiber, which provides bulk but no nutritive value."}, {"t": "It is a fat deposit stored under the skin that insulates against cold weather", "c": false, "r": "Incorrect. That describes adipose tissue, the stored form of fat in the body."}], "tp": "Glycogen is stored glucose in liver and muscle, released when blood glucose is low; leftover glucose beyond that becomes fat."});

BANK.push({"cat": CA, "type": "single", "stem": "Which food choice is the most nutrient dense?", "opts": [{"t": "A food giving large amounts of nutrients compared with its kilocalories", "c": true, "r": "Correct. Nutrient density compares nutrient content with kilocalorie content."}, {"t": "A food giving large amounts of kilocalories compared with its nutrients", "c": false, "r": "Incorrect. That pattern describes refined sugar: high in kcal, low in nutritive value."}, {"t": "A food that contains no carbohydrate, fat or protein in any serving at all", "c": false, "r": "Incorrect. A food with none of the energy nutrients cannot supply most needed nutrients."}, {"t": "A food that is low in kilocalories and also low in vitamins and minerals", "c": false, "r": "Incorrect. Low calorie alone does not make a food nutritious in this chapter."}], "tp": "Nutrient-dense foods carry large amounts of nutrients in relation to their kilocalories."});

BANK.push({"cat": CA, "type": "single", "stem": "Which statement about dietary fiber is accurate?", "opts": [{"t": "It has no nutritive value but provides the bulk the GI tract needs daily", "c": true, "r": "Correct. Fiber is not digested, is excreted in feces, and provides needed roughage."}, {"t": "It is digested in the small intestine and absorbed as glucose into the blood", "c": false, "r": "Incorrect. Fiber is the part of plant food humans cannot digest at all."}, {"t": "It provides nine kilocalories per gram, making it a concentrated energy food", "c": false, "r": "Incorrect. Fiber provides no nutritive value and no usable energy in this chapter."}, {"t": "It is found only in animal foods such as meat, milk, eggs and cheese products", "c": false, "r": "Incorrect. Fiber comes from plant foods such as bran, grains, fruits and vegetables."}], "tp": "Fiber: indigestible plant material, no nutritive value, essential bulk; DRI is 25 to 38 g/day."});

BANK.push({"cat": CA, "type": "multi", "stem": "Which statements about fiber are accurate? Select all that apply.", "opts": [{"t": "Insoluble fiber softens stools and speeds transit through the digestive tract", "c": true, "r": "Correct. Insoluble fiber softens stools, speeds transit and reduces pressure in the colon."}, {"t": "Soluble fiber binds bile acids and cholesterol so they are not absorbed well", "c": true, "r": "Correct. Soluble fiber binds bile acids and cholesterol and forms a gel that slows digestion."}, {"t": "Fiber should be increased gradually and taken with plenty of water each day", "c": true, "r": "Correct. A sudden increase causes bloating and gas, and fiber without water can constipate."}, {"t": "A sudden large increase in fiber is the safest way to relieve constipation", "c": false, "r": "Incorrect. Fiber is increased gradually; a sudden jump causes bloating, gas and constipation."}, {"t": "Excess fiber improves mineral absorption and protects bones and blood counts", "c": false, "r": "Incorrect. Excess fiber interferes with mineral absorption, linked to osteoporosis and anemia."}, {"t": "Fiber supplements are preferred over fruits and vegetables as the main source", "c": false, "r": "Incorrect. The chapter advises getting fiber from fruits and vegetables rather than supplements."}], "tp": "Insoluble fiber moves the bowel; soluble fiber binds cholesterol. Increase gradually with at least 8 glasses of water daily."});

BANK.push({"cat": CB, "type": "single", "stem": "Which statement about saturated fat is accurate?", "opts": [{"t": "It tends to increase blood cholesterol and comes mainly from animal foods", "c": true, "r": "Correct. Saturated fat is mainly animal in origin, solid at room temperature, and raises cholesterol."}, {"t": "It tends to lower LDL cholesterol and comes mainly from liquid plant oils", "c": false, "r": "Incorrect. Lowering LDL and plant origin describe unsaturated fat, not saturated fat."}, {"t": "It is made only by hydrogenation and is never found in any natural food", "c": false, "r": "Incorrect. Trans fat is the hydrogenated product; saturated fat occurs naturally in animal foods."}, {"t": "It contains no kilocalories and therefore cannot contribute to weight gain", "c": false, "r": "Incorrect. All fat provides 9 kcal/g, the most concentrated energy source."}], "tp": "Saturated fat: animal origin, solid at room temperature, tends to increase blood cholesterol."});

BANK.push({"cat": CB, "type": "single", "stem": "Which statement about LDL cholesterol is accurate?", "opts": [{"t": "It carries cholesterol toward the tissues, where plaque can build up in arteries", "c": true, "r": "Correct. LDL delivers cholesterol to tissues and increases plaque buildup, so it is called bad cholesterol."}, {"t": "It carries cholesterol to the liver, where it is broken down and then excreted", "c": false, "r": "Incorrect. Carrying cholesterol to the liver for disposal is the job of HDL, the good cholesterol."}, {"t": "It is found only in plant foods and is lowered by eating organ meats and yolks", "c": false, "r": "Incorrect. Cholesterol is found only in animal foods, and plant sterols can lower blood levels."}, {"t": "It is a protein-free form of cholesterol that the liver cannot make on its own", "c": false, "r": "Incorrect. Lipids travel as lipoproteins, and the liver does synthesize cholesterol itself."}], "tp": "LDL lays cholesterol down in tissues and plaque; HDL hauls it to the liver to be degraded and excreted."});

BANK.push({"cat": CB, "type": "single", "stem": "A total serum cholesterol result of 245 mg/dL is classified as which of the following?", "opts": [{"t": "High, because values of 240 mg/dL or more fall in the high range", "c": true, "r": "Correct. Below 200 is desirable, 200 to 239 is borderline high, and 240 or more is high."}, {"t": "Desirable, because values below 250 mg/dL are all in the desirable range", "c": false, "r": "Incorrect. Desirable is below 200 mg/dL; 245 mg/dL is above the high cutoff."}, {"t": "Borderline high, because that range runs from 240 to 259 mg/dL in adults", "c": false, "r": "Incorrect. Borderline high is 200 to 239 mg/dL; 245 mg/dL is already high."}, {"t": "Optimal, because only values above 300 mg/dL are treated as a health risk", "c": false, "r": "Incorrect. The chapter classifies 240 mg/dL or more as high total cholesterol."}], "tp": "Total cholesterol: below 200 desirable, 200-239 borderline high, 240 or more high. Dietary cholesterol averages no more than 300 mg/day."});

BANK.push({"cat": CB, "type": "single", "stem": "Which statement separates complete from incomplete protein?", "opts": [{"t": "Complete protein supplies all nine essential amino acids in sufficient amounts", "c": true, "r": "Correct. Complete proteins contain all nine essential amino acids in sufficient quantity and ratio."}, {"t": "Complete protein comes only from plants, while incomplete comes only from animals", "c": false, "r": "Incorrect. The pattern is reversed: animal foods and soy are complete; most plant proteins are incomplete."}, {"t": "Complete protein contains nitrogen, while incomplete protein contains no nitrogen", "c": false, "r": "Incorrect. All protein contains nitrogen; completeness is about the amino acid pattern."}, {"t": "Complete protein provides no kilocalories, while incomplete protein provides four", "c": false, "r": "Incorrect. Protein provides about 4 kcal/g whether the source is complete or incomplete."}], "tp": "Complete: all nine essential amino acids (animal foods plus soy). Incomplete: most plant proteins; combine varieties across the day."});

BANK.push({"cat": CB, "type": "multi", "stem": "Which findings fit a state of negative nitrogen balance? Select all that apply.", "opts": [{"t": "A burn patient who is breaking down more tissue than the body is building up", "c": true, "r": "Correct. Negative balance is catabolism, seen in undernutrition, illness, burns and trauma."}, {"t": "A patient with prolonged poor intake whose muscles are wasting over time daily", "c": true, "r": "Correct. Prolonged negative balance leads to muscle atrophy and poor function of all body systems."}, {"t": "A pregnant patient who is building more tissue than the body is breaking down", "c": false, "r": "Incorrect. Pregnancy is a positive-balance state, along with infancy, childhood and adolescence."}, {"t": "A healthy adult whose nitrogen intake exactly equals nitrogen excretion today", "c": false, "r": "Incorrect. Intake equal to excretion is nitrogen equilibrium, the healthy adult state."}, {"t": "An adolescent athlete who is growing and adding new tissue during training", "c": false, "r": "Incorrect. Growth states show positive nitrogen balance, not negative balance."}], "tp": "Negative nitrogen balance = catabolism (undernutrition, illness, burns, trauma). Positive balance is expected in growth and pregnancy."});

BANK.push({"cat": CB, "type": "single", "stem": "Which statement about protein-energy malnutrition is accurate?", "opts": [{"t": "Kwashiorkor can make a child look swollen even though protein intake is severely low", "c": true, "r": "Correct. Edema and ascites from low albumin make the kwashiorkor child look fat while protein starved."}, {"t": "Marasmus causes edema and a swollen abdomen from fluid held in the tissues", "c": false, "r": "Incorrect. Marasmus is the skin-and-bones picture: fat and then muscle stores are depleted."}, {"t": "Kwashiorkor results from missing every energy food, not just protein sources", "c": false, "r": "Incorrect. Total energy deficiency describes marasmus; kwashiorkor is severe protein restriction."}, {"t": "Protein-energy malnutrition occurs only in developing countries, never in hospitals", "c": false, "r": "Incorrect. In developed countries it appears most often in hospital settings and in older adults."}], "tp": "Marasmus = total energy lack, skin and bones. Kwashiorkor = severe protein lack with other calories present, edema makes the child look fat."});

BANK.push({"cat": CB, "type": "single", "stem": "Which element is found in protein but not in carbohydrate or fat?", "opts": [{"t": "Nitrogen, which makes protein foods the only external source of that element", "c": true, "r": "Correct. Protein contains nitrogen along with carbon, hydrogen and oxygen, unlike the other energy nutrients."}, {"t": "Oxygen, which makes protein the only nutrient able to carry gases in blood", "c": false, "r": "Incorrect. Carbohydrates and fats also contain oxygen in their chemical makeup."}, {"t": "Carbon, which makes protein the only nutrient built from living matter at all", "c": false, "r": "Incorrect. Carbohydrates are also organic compounds of carbon, hydrogen and oxygen."}, {"t": "Hydrogen, which makes protein the only nutrient that can be stored as tissue", "c": false, "r": "Incorrect. Fats are also built with hydrogen, in their fatty acids and glycerol."}], "tp": "Protein is the nitrogen-containing energy nutrient; protein foods are the body's only external source of nitrogen."});

BANK.push({"cat": CE, "type": "multi", "stem": "Which medication and nutrition pairings are accurate? Select all that apply.", "opts": [{"t": "Long-term aspirin use raises vitamin C losses, so a vitamin C rich diet helps", "c": true, "r": "Correct. Aspirin increases excretion and lowers serum ascorbic acid; a vitamin C rich diet is encouraged."}, {"t": "Antacids can reduce absorption of phosphorus, vitamin A and iron from foods", "c": true, "r": "Correct. Table 19.10 lists reduced phosphorus, vitamin A and iron absorption with antacids."}, {"t": "Laxatives can reduce absorption of calcium, potassium and fat-soluble vitamins", "c": true, "r": "Correct. Laxatives decrease absorption of calcium, potassium and fat-soluble vitamins, especially vitamin D."}, {"t": "Hydralazine therapy protects vitamin B6, so no attention to B6 is needed", "c": false, "r": "Incorrect. Antihypertensives such as hydralazine deplete vitamin B6; supplementation is encouraged with marginal diets."}, {"t": "Antibiotics raise vitamin K synthesis, so long-term therapy needs no review", "c": false, "r": "Incorrect. Long-term antibiotic therapy may decrease vitamin K synthesis in the body."}, {"t": "Potassium-wasting diuretics conserve potassium, magnesium and calcium fully", "c": false, "r": "Incorrect. Those diuretics increase excretion and deplete potassium, magnesium and calcium."}], "tp": "Table 19.10 pairings: aspirin-vitamin C, antacids-phosphorus/A/iron, laxatives-calcium/potassium/fat-soluble vitamins, hydralazine-B6."});

/* ============ ENGINE (ES5) ============ */
var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 19: Nutritional Concepts - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
