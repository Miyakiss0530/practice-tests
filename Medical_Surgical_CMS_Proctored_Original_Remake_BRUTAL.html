<style>

select.bad{border-color:#dc2626;background:#fef2f2}
.ddstem{font-size:17px;line-height:2.1;margin-bottom:10px}
.leg{background:#f5f2ff;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.leg div{margin:3px 0}
.mrow{display:flex;align-items:center;justify-content:space-between;border:2px solid #ddd5f7;border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:15px}

.tp{background:#eef2ff;border-left:4px solid #4338ca;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.nav{display:flex;flex-wrap:wrap}
.nav button{width:38px;height:38px;margin:3px;border-radius:9px;border:2px solid #ddd5f7;background:#fff;color:#3b1a8a;font-weight:700;font-size:13px}
.nav button.ans{background:#ddd5f7}
.nav button.fl{border-color:#f59e0b;box-shadow:inset 0 -4px 0 #f59e0b}
.nav button.cur{background:#6d28d9;color:#fff;border-color:#6d28d9}

.nav button.part{background:#fde68a;border-color:#f59e0b}
.nav button.bad{background:#fecaca;border-color:#dc2626}
.big{font-size:42px;font-weight:800;color:#4c1d95}

.cb div{height:12px;background:#6d28d9}
.small{font-size:13px;color:#5b5486}
.calcinput{font-size:17px;padding:8px 10px;border-radius:8px;border:2px solid #b9a8ee;width:140px}
.fw{background:#fdf2f8;border-left:4px solid #db2777;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}

</head>
<body>
<div id="app"></div>
<script>
/* ============ QUESTION BANK ============ */
/* PN Medical Surgical CMS - ORIGINAL remake: original questions on the verified core PN Med-Surg blueprint. Not ATI questions. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CATS = ["Perioperative & Postoperative Care", "Cardiovascular Disorders", "Respiratory Disorders", "Neurologic & Sensory Disorders", "Renal, Urinary & Fluid-Electrolyte Balance", "Endocrine & Metabolic Disorders", "Gastrointestinal, Hepatic, Hematologic & Immune Disorders", "Musculoskeletal, Integumentary & Cancer Care"];
var KEYTERMS = [];

/* PN Medical Surgical CMS Proctored - ORIGINAL remake: original questions on the verified core PN Med-Surg blueprint. Not ATI questions. */
/* Items 1-15 */

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is reinforcing teaching with a 54-year-old client who is scheduled for an abdominal hysterectomy in 5 days. The client has a BMI of 31, smokes half a pack of cigarettes daily, and takes lisinopril each morning. Which statement by the client indicates an understanding of the preoperative teaching?",
  opts: [
    O("I will stop smoking at least until my incision has healed.", false, "Stopping only until the incision heals misses the point. Quitting well before surgery improves oxygen delivery and lung function during anesthesia and recovery, and the benefit grows the longer the client stays quit."),
    O("I should quit smoking as many days before surgery as I can.", true, "Stopping smoking as early as possible before surgery lowers the risk of breathing complications during anesthesia and supports tissue oxygenation and wound healing afterward."),
    O("I can keep smoking if I cut back to two cigarettes a day.", false, "Cutting back still exposes the lungs and blood vessels to carbon monoxide and nicotine, which impair oxygen delivery. Complete stopping before surgery is the teaching goal."),
    O("I will take my lisinopril with a full meal that morning.", false, "Taking the blood pressure medication on the morning of surgery is a provider decision, and eating a full meal violates the NPO instruction. This statement shows two misunderstandings.")
  ],
  fw: "Health promotion — reduce modifiable risk before the procedure",
  tp: "Preop smoking teaching: quit as early and as completely as possible. Cutting down is not the goal, and food plus routine meds on surgery morning are provider and NPO issues, not client choices." });

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is assisting with the care of a 67-year-old client who returned to the surgical unit 30 minutes ago after a colon resection under general anesthesia. The client is drowsy, respirations are 9/min and shallow, oxygen saturation is 89% on room air, and snoring sounds are heard with each breath. Which action should the nurse take first?",
  opts: [
    O("Document the findings and recheck the client in 15 minutes.", false, "A respiratory rate of 9 with snoring respirations and saturation of 89% is an airway emergency in progress. Waiting to recheck lets hypoxia deepen without any intervention."),
    O("Position the client's head with the jaw lifted and support the airway.", true, "Snoring respirations right after general anesthesia usually mean the tongue is blocking the airway. Repositioning the head and lifting the jaw opens the airway, and oxygen and provider notification follow."),
    O("Encourage the client to cough and breathe deeply right away.", false, "Deep breathing exercises matter after surgery, but a drowsy client with an obstructed airway cannot perform them until the airway is open and oxygenation improves."),
    O("Raise the head of the bed fully and offer the client water.", false, "Oral fluids are dangerous for a drowsy postoperative client at risk for aspiration, and sitting fully upright does not clear a tongue obstruction.")
  ],
  fw: "ABCs — airway before breathing exercises, fluids, or charting",
  tp: "Snoring respirations plus rate under 10 plus low saturation after anesthesia equals an obstructed airway until proven otherwise. Open the airway first, then oxygen, then report." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is caring for a 72-year-old client who is on bed rest orders 1 day after a total hip arthroplasty. The client has sequential compression devices available in the room, prescribed heparin injections, and legs that are warm with 2+ pedal pulses. Which action should the nurse take to help prevent a deep vein thrombosis?",
  opts: [
    O("Massage both calves firmly during the morning assessment.", false, "Massaging the calves of an immobile postoperative client can dislodge a clot that has already formed and is never used as a prevention measure."),
    O("Keep the client flat in bed so the new hip stays protected.", false, "Strict immobility increases venous stasis, which is one of the main drivers of clot formation after hip surgery. The hip is protected with position precautions, not total bed rest."),
    O("Apply the compression devices and assist the client to walk.", true, "Compression devices squeeze the calves to keep blood moving, and early assisted ambulation activates the calf muscle pump. Together they directly counter the venous stasis that follows surgery and bed rest."),
    O("Apply a heating pad to each calf for 20 minutes per shift.", false, "Heat on the calves is not a clot prevention strategy and can burn skin with reduced sensation. It does nothing to move pooled venous blood.")
  ],
  fw: "Reduction of risk — attack venous stasis, the driver of the clot",
  tp: "DVT prevention bundle: compression devices actually applied, anticoagulant as prescribed, and early walking. Never massage postoperative calves." });

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is assisting with the care of a 58-year-old client who has an epidural infusion running for pain control after abdominal surgery. During the hourly round, the nurse collects data on the client's pain, breathing, circulation, and comfort. Which finding should the nurse report to the provider immediately?",
  opts: [
    O("The client reports new shortness of breath and labored breathing.", true, "New dyspnea in a client with an epidural infusion can signal that the block is rising too high and weakening the breathing muscles. Breathing problems outrank every other finding here and need an immediate report."),
    O("The client reports itching across the trunk and upper arms.", false, "Itching is a common, expected effect of the opioid medication used in epidural infusions. It is uncomfortable but manageable, and it does not threaten the client's breathing or circulation."),
    O("The client rates surgical pain as a 3 on a 0 to 10 scale.", false, "A pain rating of 3 shows the infusion is controlling pain reasonably well. Effective pain control is the goal of the therapy, not a danger sign."),
    O("The client's blood pressure is 104/66 mm Hg this hour.", false, "A pressure of 104/66 is acceptable for this client and mild decreases are expected with epidural therapy. It is not the finding that threatens the client right now.")
  ],
  fw: "ABCs — a breathing complaint outranks acceptable numbers",
  tp: "Epidural red flag: new dyspnea can mean a rising block reaching the respiratory muscles. Report the breathing complaint immediately; itching and a mild pressure dip are expected effects of the infusion." });

BANK.push({ cat: "Gastrointestinal, Hepatic, Hematologic & Immune Disorders", type: "single",
  stem: "A nurse is preparing to remove a nasogastric tube from a 63-year-old client 3 days after bowel surgery. Bowel sounds are present, the provider's order is written, and the client is alert and sitting up. Which action should the nurse take to decrease the risk of aspiration during the removal?",
  opts: [
    O("Lay the client flat and remove the tube as quickly as possible.", false, "Lying flat during removal lets any fluid in the tube drain toward the airway. Speed does not protect against aspiration in a flat position."),
    O("Have the client inhale deeply and bear down during removal.", false, "Bearing down raises abdominal pressure and can trigger gagging and vomiting while the tube is moving, which increases aspiration risk."),
    O("Ask the client to take a breath, hold it, and hum during removal.", false, "Humming requires exhaling through an open airway while the tube passes the pharynx, which does not close off the airway the way holding the breath does."),
    O("Pinch the tube closed and have the client hold a deep breath.", true, "Pinching the tube keeps its contents from draining into the throat, and removing it while the client holds a deep breath closes the airway during the pass, which together lower aspiration risk.")
  ],
  fw: "Safety — close the tube and close the airway during the pass",
  tp: "NG tube removal: sit the client up, pinch the tube so nothing drains, remove during a held deep breath. Flat positioning and bearing down both raise aspiration risk." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is reviewing the laboratory reports of a 59-year-old client who arrived 2 hours ago reporting pressure-like chest pain radiating to the left arm. The ECG shows nonspecific changes. Which laboratory result should the nurse identify as indicating the client is experiencing a myocardial infarction?",
  opts: [
    O("An elevated troponin level drawn after the chest pain began.", true, "Troponin is released from injured heart muscle and rises after myocardial damage, so an elevated level in a client with this pain pattern confirms heart muscle injury even when the ECG is not diagnostic."),
    O("A total cholesterol level above the expected reference range.", false, "Cholesterol reflects long-term cardiovascular risk, not an acute event. It cannot confirm that heart muscle is being injured today."),
    O("A white blood cell count at the upper end of the normal range.", false, "A borderline white count is nonspecific and can shift with stress or infection. It does not identify injury to heart muscle."),
    O("A blood glucose level that is moderately above normal today.", false, "Glucose often rises during acute illness from stress hormones. It says nothing specific about whether heart muscle has been damaged.")
  ],
  fw: "Data analysis — match the marker to the injured tissue",
  tp: "Troponin is the heart muscle injury marker. Cholesterol is long-term risk, glucose rises with stress, and white count is nonspecific — none of them confirm an MI." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is reinforcing discharge teaching with a 70-year-old client who has chronic heart failure and takes furosemide daily. The client's weight on discharge is 82 kg, blood pressure 118/74 mm Hg, and lungs are clear. Which instruction about daily weights should the nurse include in the teaching?",
  opts: [
    O("Weigh once a week, right after the evening meal each time.", false, "Weekly weights can miss several days of fluid buildup, and weighing after a meal adds food and fluid weight that hides the real trend the provider needs."),
    O("Weigh each morning after urinating and report a rapid gain.", true, "Morning weights after voiding, in similar clothing, give a consistent trend. A rapid gain over a day or two signals fluid retention in heart failure and should be reported before breathing symptoms appear."),
    O("Weigh only on days when the ankles look more swollen.", false, "Weight gain from fluid often shows up before visible swelling changes. Waiting for swollen ankles delays detection of a worsening failure picture."),
    O("Weigh at bedtime and subtract the weight of the meal eaten.", false, "Bedtime weights vary with the day's intake and cannot be corrected by guessing meal weights. Consistency of timing and conditions is what makes weights useful.")
  ],
  fw: "Patient teaching — catch fluid retention before symptoms declare it",
  tp: "Heart failure weights: same scale, same time, after urinating, similar clothing, every morning. A rapid gain means fluid, and fluid means call — before the dyspnea starts." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse in a provider's office is collecting data from a 61-year-old client who has stable angina and carries nitroglycerin tablets. Which statement by the client should prompt the nurse to report the change to the provider?",
  opts: [
    O("My chest tightness starts when I climb stairs and eases with rest.", false, "Pain brought on by exertion and relieved by rest is the classic stable angina pattern this client already has. It is expected and managed with the current plan."),
    O("The tablet under my tongue usually eases the pain within minutes.", false, "Prompt relief with nitroglycerin is the expected response in stable angina. Nothing about this statement suggests the pattern has changed."),
    O("The pain woke me from sleep and lasted about 25 minutes last night.", true, "Pain occurring at rest, waking the client, and lasting well beyond the usual few minutes signals that the angina pattern has become unstable. This change can precede an infarction and must be reported."),
    O("I get a headache for a short time after I take the nitroglycerin.", false, "A brief headache is a well-known effect of nitroglycerin from vessel dilation. It is uncomfortable but expected and not a sign of worsening disease.")
  ],
  fw: "Pattern recognition — rest pain and longer duration mean the disease moved",
  tp: "Stable angina: exertional, brief, relieved by rest or nitroglycerin. Pain at rest, pain that wakes the client, or pain lasting 20 minutes or more is a pattern change — report it." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is reinforcing teaching with a 66-year-old client who has atrial fibrillation and has taken warfarin for 3 months. The client's most recent INR is 2.4, and there is no bruising or bleeding reported. Which statement by the client indicates an understanding of the teaching?",
  opts: [
    O("I can stop the warfarin now that my INR is in a good range.", false, "An INR in range means the drug is working, not that the clotting risk has gone away. Stopping warfarin for atrial fibrillation exposes the client to stroke from a new clot."),
    O("I need regular blood tests to check how thin my blood is.", true, "Warfarin dosing is guided by the INR, so regular blood testing is essential. An INR of 2.4 sits in the usual therapeutic range for atrial fibrillation, and ongoing checks catch drift before bleeding or clotting occurs."),
    O("I should take an extra dose whenever I notice any bruising.", false, "Bruising can be a sign the blood is too thin, so extra warfarin would make bleeding worse. Bruising is something to report, not a reason to increase the dose."),
    O("I will switch to aspirin alone since it is easier to manage.", false, "Aspirin is not an equivalent substitute for warfarin in atrial fibrillation stroke prevention, and changing anticoagulants is a provider decision, not a client substitution.")
  ],
  fw: "Medication safety — the lab value steers the dose, ongoing",
  tp: "Warfarin lives and dies by the INR: regular blood draws, report bruising or bleeding, never stop or substitute on your own because one value looked good." });

BANK.push({ cat: "Cardiovascular Disorders", type: "multi",
  stem: "A nurse is collecting data from a 57-year-old client in a clinic whose blood pressure is 196/112 mm Hg on two readings 10 minutes apart. The client takes amlodipine and reports stopping it last week. Which of the following findings should the nurse report to the provider immediately? Select all that apply.",
  opts: [
    O("The client reports a severe, pounding headache.", true, "A severe headache at this pressure level can signal pressure effects on the brain and is one of the findings that moves high blood pressure into an emergency picture."),
    O("The client reports new blurred vision today.", true, "Blurred vision at this pressure suggests the high pressure is affecting the vessels of the eye and possibly the brain, which requires immediate provider attention."),
    O("The client reports tightness across the chest.", true, "Chest tightness with severely elevated pressure raises concern for strain or ischemia of the heart and must be reported at once."),
    O("The client reports new shortness of breath.", true, "Shortness of breath at this pressure can reflect fluid backing up into the lungs from a struggling heart and is an emergency cue."),
    O("The client reports a dry mouth this morning.", false, "A dry mouth is a minor, nonspecific complaint that can follow many medications or simple thirst. It does not signal target organ injury from the high pressure."),
    O("The client reports mild ankle swelling by evening.", false, "Mild ankle swelling by evening is common with amlodipine and with standing during the day. It is worth noting, but it is not an emergency finding at this visit.")
  ],
  fw: "Prioritization — separate target-organ cues from background noise",
  tp: "Severe pressure plus headache, vision change, chest tightness, or dyspnea equals target organs under attack — report immediately. Dry mouth and mild evening ankle swelling do not carry that weight." });

BANK.push({ cat: "Cardiovascular Disorders", type: "dropdown",
  stem: "A nurse on a medical unit is collecting data from two clients with leg circulation problems. Client A has shiny, hairless lower legs, cool skin, toenails that are thick, and calf pain that starts with walking and stops with rest. Client B has brown discoloration at both ankles, pitting edema that worsens through the day, and a shallow ulcer over the inner ankle that drains moderately.<br>The findings for Client A most likely indicate:<br>[[0]]<br><br>For Client B, the nurse should reinforce this instruction:<br>[[1]]",
  blanks: [
    { o: [
      O("arterial insufficiency in the lower legs", true, "Hair loss, shiny cool skin, thick nails, and pain that appears with walking and stops with rest form the classic arterial picture, because narrowed arteries cannot meet the extra demand of exercise."),
      O("venous insufficiency in the lower legs", false, "Venous disease produces edema, brown staining, and ankle ulcers rather than exertional calf pain and cool hairless skin. This set of findings points the other direction."),
      O("a blood clot in one of the deep calf veins", false, "A deep vein clot usually affects one leg with swelling and aching at rest, not both legs with exertional pain that reliably stops when walking stops.")
    ] },
    { o: [
      O("elevating the legs on pillows when sitting", true, "Elevation uses gravity to help venous blood and fluid return from the legs, which reduces the edema and supports healing of a venous ulcer at the ankle."),
      O("letting the legs hang down over the bed edge", false, "Dangling the legs pools more blood and fluid in the lower legs, which worsens venous edema and delays ulcer healing. Dependency helps arterial pain, not venous disease."),
      O("applying a heating pad over both ankle areas", false, "Heat over an ulcer and fragile stained skin risks burns and tissue injury and does nothing to correct the venous pooling that caused the problem.")
    ] }
  ],
  fw: "Contrast judgment — arterial and venous pictures are opposites",
  tp: "Arterial: cool, shiny, hairless, pain with walking that stops at rest. Venous: brown ankles, daytime edema, inner-ankle ulcer — and the fix is elevation, not dangling." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is assisting with the care of a 55-year-old client who reports an hour of intermittent chest discomfort and is scheduled for an ECG in the next few minutes. The client is diaphoretic and has applied body lotion this morning. Which action should the nurse take to prepare the client for the ECG?",
  opts: [
    O("Shave the client's entire chest before placing any electrodes.", false, "Only small patches of dense hair that block electrode contact may need clipping. Shaving the entire chest wastes time and irritates skin without improving the tracing."),
    O("Cleanse the skin where the electrodes will sit before placing them.", true, "Sweat and lotion prevent electrodes from adhering and conducting properly, which produces artifact and an unreadable tracing. Cleansing the placement sites first gives a clean signal for a client whose tracing matters now."),
    O("Have the client walk the hallway briefly to warm up the heart.", false, "Exertion before a resting ECG changes the heart rate and can provoke more ischemia in a client with chest discomfort. The client rests supine for this test."),
    O("Place the electrodes over the lotion to save time before the test.", false, "Electrodes placed over lotion lift, shift, and pick up muscle noise instead of the cardiac signal, which can force a repeat test and delay decisions.")
  ],
  fw: "Diagnostic accuracy — the tracing is only as good as the contact",
  tp: "ECG prep: clean, dry skin at each electrode site. Lotion and sweat equal artifact. No hallway warm-ups for a client with chest discomfort." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is reinforcing discharge teaching with a 69-year-old client who has COPD and a barrel chest. Oxygen saturation is 92% on room air, and the client breathes with a respiratory rate of 22/min at rest. Which statement by the client indicates an understanding of the pursed-lip breathing teaching?",
  opts: [
    O("I will breathe in quickly and blow out through an open mouth.", false, "Blowing out quickly through an open mouth collapses the small airways sooner and traps more air. The technique depends on a slow, resisted exhale."),
    O("I will hold my breath as long as I can after each breath in.", false, "Holding the breath does not help empty the lungs and can raise pressure in the chest. Air trapping in COPD is addressed during the exhale, not with a hold."),
    O("I will breathe in through my nose and out slowly through pursed lips.", true, "Breathing in through the nose and exhaling slowly against pursed lips keeps pressure in the airways longer, which holds them open, empties trapped air, and eases the work of breathing."),
    O("I will breathe out through my nose using short, rapid puffs.", false, "Rapid puffs through the nose do not create the sustained back pressure the technique requires and can tire the client without improving air emptying.")
  ],
  fw: "Patient teaching — the exhale is where the technique works",

    else if (q.type === "multi") { shuffle(q.opts); S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "calc") { S.resp.push(""); }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { shuffle(q.blanks[k].o); d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "calc") { return r !== "" && r !== null && r !== undefined; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "calc") { var v = parseFloat(r); return (!isNaN(v) && Math.abs(v - q.ans) < 0.051) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>PN Medical Surgical CMS — Proctored — Original Remake</h1>';
  h += '<div class="sub">Brutal mode | PN Adult Medical-Surgical — original questions on the verified core PN Med-Surg blueprint (proctored practice due Feb 15, 2027) | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together. Answer choices always shuffle, even when question shuffle is off.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  if (t === "calc") { return "Calculate and enter the number."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else if (q.type === "calc") {
    h += '<div class="stem">' + q.stem + '</div>';
    h += '<div><input class="calcinput" type="number" step="any" inputmode="decimal" value="' + (r === "" || r === null ? "" : r) + '"' + (lock ? ' disabled' : '') + ' oninput="pickC(this.value)"> <span style="font-size:16px">' + q.unit + '</span></div>';
    if (fb) { h += '<div class="fbx" style="margin-top:8px">Correct answer: ' + q.ans + ' ' + q.unit + '</div>'; }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
    h += '<div class="fw"><b>Priority framework:</b> ' + q.fw + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickC(v) { if (isLocked()) { return; } S.resp[S.cur] = v; updateBars(); }
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
