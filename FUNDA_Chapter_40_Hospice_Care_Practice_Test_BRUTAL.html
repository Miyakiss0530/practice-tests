<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Hospice Philosophy, History and Admission";
var CB = "Palliative Care and the Interdisciplinary Team";
var CC = "Pain Assessment and Management";
var CD = "Symptom Management: GI, Nutrition and Breathing";
var CE = "Approaching Death, Psychosocial, Spiritual and Ethics";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 6,
  "types": {
   "single": 5,
   "order": 1
  }
 },
 CB: {
  "name": CB,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 1,
   "matrix": 1
  }
 },
 CC: {
  "name": CC,
  "count": 11,
  "types": {
   "single": 7,
   "multi": 1,
   "order": 1,
   "dropdown": 1,
   "matrix": 1
  }
 },
 CD: {
  "name": CD,
  "count": 16,
  "types": {
   "single": 13,
   "dropdown": 1,
   "multi": 2
  }
 },
 CE: {
  "name": CE,
  "count": 10,
  "types": {
   "single": 9,
   "multi": 1
  }
 }
};

BANK.push({ cat: CD, type: "single",
  stem: "In the last two days, a dying patient has developed a coarse, loud rattling sound when breathing. His wife is frightened and asks the nurse to suction it away. Which action is most appropriate?",
  opts: [ O("Restrict fluids and family visits, because both make secretions worse in the final forty-eight hours before death occurs", false, "Incorrect. Neither restriction is a chapter intervention; head elevation, humidity, and anticholinergics are."), O("Tell her the sound means he is drowning in pain, and increase his opioid dose until the sound can no longer be heard", false, "Incorrect. The rattle is pooled pharyngeal secretions near death, not a pain signal requiring dose escalation."), O("Suction deeply every hour until the sound stops, because clearing the sound is the priority for the family's comfort now", false, "Incorrect. Suctioning increases mucus production and is very uncomfortable; it is done only for choking."), O("Explain the death rattle, elevate his head, use a cool-mist humidifier, and give the ordered anticholinergic if prescribed", true, "Correct. Death rattle care: positioning, humidifier, anticholinergics for secretions, reassurance; suctioning is minimized.") ],
  tp: "Framework: comfort first - death rattle (24-48 hours): elevate head, cool-mist humidifier, anticholinergic; suction only if choking." });

BANK.push({ cat: CB, type: "single",
  stem: "At a team meeting, the nurse reports a patient's pain plan is failing and his wife is overwhelmed. Which outcome reflects how the primary and interdisciplinary teams are meant to function?",
  opts: [ O("Each member documents separate goals privately, because a shared plan limits what individual experts may decide", false, "Incorrect. The team strives to function as a cohesive unit using all expertise for quality patient care."), O("The nurse revises the plan alone and informs the team at discharge, because meetings are only for new admissions", false, "Incorrect. Meetings are regular and frequent, and the team meeting is the forum for all members' observations."), O("The team reviews his physical, mental, and spiritual condition together and revises the plan of care as needed", true, "Correct. Regular frequent meetings review condition, revise the plan as needed, and judge its effectiveness."), O("The team keeps the original plan unchanged, because revising a hospice plan signals that the team made an error", false, "Incorrect. The plan of care is revised as needed; revision is expected functioning, not an admission of error.") ],
  tp: "Framework: Nursing Process/ADPIE - team meetings review, revise, and evaluate the shared plan of care." });

BANK.push({ cat: CA, type: "single",
  stem: "Mr. R.'s wife has provided all of his home hospice care for 6 weeks. She is exhausted, tearful, and says she has not left the house in 10 days. Which hospice option best addresses her situation?",
  opts: [ O("Suggest she hire private help at her own expense, because hospice provides no relief services for family caregivers", false, "Incorrect. Respite care and volunteer relief are hospice services; the benefit covers occasional respite periods."), O("Increase her husband's sedative dose so he sleeps longer, giving her rest without changing the current care plan at all", false, "Incorrect. Sedating the patient for caregiver convenience is not a hospice intervention; respite is the answer."), O("Tell her that leaving the house is not permitted while she is the designated primary caregiver for her husband", false, "Incorrect. Caregiver relief is a built-in hospice service; volunteers stay so the caregiver can leave briefly."), O("Arrange volunteer companionship visits and discuss a short inpatient respite stay of up to five days for Mr. R.", true, "Correct. Maslow framework: caregiver relief through respite care (up to 5 days in hospital) and volunteer support addresses burnout.") ],
  tp: "Framework: Maslow - caregiver respite (5-day stay, volunteers) prevents burnout; never medicate the patient for relief." });

BANK.push({ cat: CC, type: "single",
  stem: "A patient's pain is controlled at 2 of 10 on long-acting morphine every 12 hours, but twice daily he gets sudden severe spikes to 8 of 10 lasting about an hour. Which plan addresses these episodes?",
  opts: [ O("Ensure rescue medication is available and given as needed for the breakthrough episodes when they occur", true, "Correct. Breakthrough pain breaks through the regular regimen; medications should be available to manage episodes."), O("Stop the long-acting morphine, because spikes prove scheduled around-the-clock dosing has failed completely", false, "Incorrect. Baseline control at 2 of 10 shows the regimen works; spikes need rescue doses, not abandonment."), O("Double the long-acting dose at the next scheduled time and remove all as-needed medication from the home plan", false, "Incorrect. Removing rescue medication leaves breakthrough pain untreated; titration plus rescue is the plan."), O("Tell the patient to wait out each spike, because additional medication between scheduled doses causes addiction", false, "Incorrect. Fear of addiction drives undermedication; breakthrough episodes are treated, not endured by policy.") ],
  tp: "Framework: safety first - around-the-clock baseline plus available rescue medication for breakthrough pain." });

BANK.push({ cat: CC, type: "single",
  stem: "Mr. B., 74, with prostate cancer metastatic to bone, grimaces and guards his right leg. When the nurse arrives, he is quiet and says, 'It is fine.' Which of the following actions should the nurse take first?",
  opts: [ O("Increase his around-the-clock morphine dose before assessing, because bone metastasis pain is assumed severe in all cases", false, "Incorrect. Assessment precedes titration; the dose is adjusted to the reported severity and response."), O("Ask Mr. B. to rate his pain from 0 to 10 and describe it, because his self-report is the primary source of pain data", true, "Correct. Nursing Process/ADPIE, assessment first: pain assessment begins with self-report of intensity and quality."), O("Ask his wife to rate his pain for him, because the caregiver's estimate is more reliable than the patient's own report", false, "Incorrect. The patient's self-report provides the most significant data; the caregiver estimate does not replace it."), O("Accept his statement and chart pain as zero, because a quiet patient who denies pain requires no further assessment", false, "Incorrect. Guarding and grimacing conflict with the denial; self-report must be actively elicited and rated.") ],
  tp: "Framework: Nursing Process/ADPIE - assess first; self-report on 0-10 is the primary pain data." });

BANK.push({ cat: CC, type: "single",
  stem: "On admission and at each visit, a nurse has a patient rate pain, tiredness, drowsiness, appetite, breathlessness, mood, anxiety, and well-being from 0 to 10. What is the purpose of using this tool this way?",
  opts: [ O("It replaces the pain scale and care plan, because a single total score decides all medication changes for the patient", false, "Incorrect. The tool assesses comfort areas at each visit; it complements, not replaces, assessment and planning."), O("It is completed only at admission, because symptom severity in hospice rarely changes once the first scores are recorded", false, "Incorrect. The team assesses and reassesses comfort at admission and with each subsequent visit."), O("It measures the caregiver's burden, because the ratings are completed by the family rather than by the patient directly", false, "Incorrect. The patient rates each area; caregiver strain is assessed through other team pathways."), O("It lets the patient identify where the most discomfort or greatest concern is, so the team can target symptom control", true, "Correct. The Edmonton system has the patient rate each area 0 to 10, showing where discomfort is greatest.") ],
  tp: "Framework: Nursing Process/ADPIE - Edmonton ratings at admission and each visit target the patient's greatest discomfort." });

BANK.push({ cat: CE, type: "single",
  stem: "A weak hospice patient now spends most of the day reclining. His skin over the hips and elbows looks reddened. Which set of actions protects his skin?",
  opts: [ O("Apply harsh soap scrubs twice daily and leave reddened areas uncovered to air, because moisture from products causes ulcers", false, "Incorrect. Harsh soaps are to be avoided; skin is kept clean and dry with gentle hygiene, not scrubbing."), O("Wait until an ulcer opens before acting, because reddened skin in a reclining patient is not a warning sign worth charting", false, "Incorrect. Caregivers are taught to report erythema or impairment early; prevention precedes ulcer formation."), O("Inspect skin frequently, keep it clean and dry, reposition for comfort, and use an egg-crate or air mattress with protectors", true, "Correct. Skin plan: frequent inspection, cleanliness, repositioning, egg-crate/air-flotation mattress, heel and elbow protectors."), O("Keep him in one position all day to conserve his strength, because turning a weak patient causes more harm than redness", false, "Incorrect. Reclining without repositioning raises pressure ulcer risk; repositioning for comfort is required.") ],
  tp: "Framework: safety first - prevent pressure ulcers: inspect, clean/dry, reposition, support surfaces, report erythema." });

BANK.push({ cat: CE, type: "single",
  stem: "Three months after a patient's death, his widow is tearful on the anniversary of their wedding and says she feels forgotten. Which hospice action is appropriate?",
  opts: [ O("Re-enroll her as a hospice patient herself, because bereavement follow-up requires the survivor to meet admission criteria", false, "Incorrect. Bereavement follow-up is a benefit for the family; the survivor need not be a hospice patient."), O("Advise her that grief should be finished by three months, because four seasons is the maximum healthy mourning period allowed", false, "Incorrect. Four seasons is a belief about intense pain easing, and the period is different for everyone."), O("Tell her bereavement services ended at the funeral, and refer her to find private support entirely on her own from now on", false, "Incorrect. Hospice care for the family continues into the bereavement period; it does not end at the funeral."), O("Continue bereavement follow-up, with visits, calls, or cards remembering her on holidays and anniversaries, as the plan provides", true, "Correct. Bereavement care continues up to a year; volunteers and pastors keep in touch on holidays and anniversaries.") ],
  tp: "Framework: continuity of care - bereavement follow-up up to 1 year; contact on holidays and anniversaries." });

BANK.push({ cat: CE, type: "single",
  stem: "A patient completed an advance directive years ago and now, entering hospice, asks about a shorter form the provider can complete with him in minutes. Which information is correct?",
  opts: [ O("The POLST form is shorter, completed by provider and patient, and may be used in addition to or instead of the directive", true, "Correct. POLST: shorter, a few simple questions, minutes to complete, used with or instead of an advance directive."), O("The POLST form is longer than the directive and must be completed by the family alone after the patient becomes comatose", false, "Incorrect. POLST is the shorter form, completed by provider and patient while the patient can participate."), O("Completing either form is discouraged in hospice, because written wishes increase the risk of unwanted medical errors", false, "Incorrect. POLST has proven more effective in preventing errors from not following patients' wishes."), O("The forms matter only in the twenty-nine states using state forms, and have no use for nursing home or hospice patients", false, "Incorrect. All states use a version; completion is encouraged for nursing home, hospital, and hospice patients.") ],
  tp: "Framework: autonomy - POLST: shorter, provider + patient, minutes; advance directive prepared while alive and competent." });

BANK.push({ cat: CD, type: "single",
  stem: "Mr. B. is restless and dyspneic; oximetry reads 83 percent. After notifying the team, which set of measures is appropriate for his respiratory distress?",
  opts: [ O("Give oxygen by nasal cannula as ordered, sit him upright, use sublingual morphine as ordered, and ease his anxiety", true, "Correct. ABCs framework: oxygen as ordered (care plan used 3 L/min), positioning, morphine relaxing respiratory effort, anxiety relief."), O("Lay him flat and restrict visitors, because upright positioning and family presence both increase the work of breathing", false, "Incorrect. Positioning for comfort and elevating the head ease breathing; family support eases anxiety."), O("Withhold morphine, because opioids are prohibited when oxygen saturation is low in a hospice patient with dyspnea", false, "Incorrect. Sublingual morphine is a named dyspnea measure that relaxes respiratory effort and improves efficiency."), O("Begin deep suctioning every hour on schedule, because secretions are the assumed cause of every episode of dyspnea", false, "Incorrect. Suctioning is minimized; it increases mucus production and is done only if he is choking.") ],
  tp: "Framework: ABCs - oxygen as ordered, upright positioning, morphine for respiratory effort, anxiety support; minimize suctioning." });

BANK.push({ cat: CE, type: "single",
  stem: "A dying patient's daughter worries that her mother 'will starve' because she now eats and drinks almost nothing. Which response is correct?",
  opts: [ O("Reassure her that decreased need for food and drink is expected, and her mother will not starve to death or die of dehydration", true, "Correct. Table 40.4 states this reassurance directly; much reassurance is needed in this area for families."), O("Suggest she hide food in drinks so her mother takes in calories without knowing, preserving nutrition without any conflict", false, "Incorrect. Hidden feeding defeats the patient's choice; honest reassurance is the chapter intervention."), O("Tell her dehydration is the immediate cause to fear most, and request intravenous fluids to continue until death occurs", false, "Incorrect. The chapter reassurance is that death is not from dehydration; artificial hydration rarely helps."), O("Agree that she will starve unless the family feeds her on schedule, and teach them to wake her for meals every two hours", false, "Incorrect. Forcing intake is never acceptable, and waking for scheduled feeding contradicts the expected pattern.") ],
  tp: "Framework: patient teaching - decreased intake near death is expected; reassure, never force or hide food." });

BANK.push({ cat: CD, type: "single",
  stem: "A patient with mouth ulcerations has a dry, sore mouth and is eating less. Which oral care approach is most appropriate?",
  opts: [ O("Use mouthwash-soaked swabs with firm scrubbing, because stronger cleansing is needed when ulcerations are present now", false, "Incorrect. Patients with oral ulcerations may experience discomfort with mouthwash; water-soaked swabs are better."), O("Offer large glasses of water at each visit and require the patient to finish them to keep the mouth moist all day long", false, "Incorrect. Small frequent drinks and crushed ice are the measures; requiring large volumes forces intake."), O("Withhold all oral care until the ulcerations heal, because swabbing an ulcerated mouth spreads infection to the team", false, "Incorrect. Good oral hygiene is important when anorexia relates to stomatitis or infection; care continues gently."), O("Use water-soaked sponge swabs, small frequent drinks, and crushed ice, because mouthwash can hurt ulcerated tissue", true, "Correct. Chapter guidance: mouthwash-soaked swabs help some patients, but water-soaked swabs suit ulcerations better.") ],
  tp: "Framework: comfort first - ulcerated mouth: water-soaked swabs, small drinks, crushed ice, artificial saliva." });

BANK.push({ cat: CC, type: "single",
  stem: "A caregiver asks why the provider keeps raising her husband's morphine dose: 'Will he become addicted? Should we save it for when it gets really bad?' Which teaching is correct?",
  opts: [ O("Explain that addiction is expected at these doses, but the family should accept it as the price of any pain relief at all", false, "Incorrect. The chapter treats addiction fear as a myth to relieve with monitoring and reassurance, not a certainty."), O("Advise her to give half doses without telling the team, so tolerance develops more slowly over the coming weeks at home", false, "Incorrect. Caregivers follow the schedule and document response; the nurse monitors the record at each visit."), O("Explain that doses are titrated to control pain, large doses are common and necessary, and the team monitors him closely", true, "Correct. Teaching point: control is possible, large opioid doses are common and necessary, monitoring relieves fear."), O("Agree that saving medication is wise, because using opioids now will leave nothing effective when pain worsens later", false, "Incorrect. Withholding drives undermedication and suffering; doses are titrated as pain increases over time.") ],
  tp: "Framework: patient teaching - fears of addiction, tolerance, and respiratory depression are relieved by monitoring and support." });

BANK.push({ cat: CA, type: "single",
  stem: "At 2 a.m., a hospice patient's husband calls the agency: his wife's pain is suddenly severe and her scheduled dose is not helping. Which response reflects hospice service as described in the chapter?",
  opts: [ O("He should drive her to an emergency department, because hospice patients may not receive help outside scheduled visits", false, "Incorrect. The hospice team responds around the clock; scheduled visits are not the limit of the service."), O("Expert help is available to them now, by phone or in person, because hospice support runs twenty-four hours a day", true, "Correct. Hospice support is available 24 hours a day, 7 days a week, by phone or in person when needs arise."), O("He should wait until morning office hours, because hospice needs that arise at night are handled the next business day", false, "Incorrect. Needs may arise at any time; that is exactly why hospice care is available around the clock."), O("He should double her next dose on his own, because caregivers may adjust hospice medications without contacting the team", false, "Incorrect. Caregivers give medications as scheduled and contact the team; uncontrolled pain is reported to the team.") ],
  tp: "Framework: safety first - 24-hour hospice availability for acute symptom crises at home." });

BANK.push({ cat: CB, type: "multi",
  stem: "A primary hospice nurse is coordinating a home patient's care. Which actions fall within the primary nurse's role? Select all that apply.",
  opts: [ O("Evaluating the patient's response to treatment and assessing how well symptoms are being managed at home", true, "Correct. Response evaluation and symptom-management assessment are primary nurse functions."), O("Recruiting and training all hospice volunteers and assigning them to patients across the whole program", false, "Incorrect. Recruiting, training, and assigning volunteers belongs to the volunteer coordinator."), O("Certifying the patient's medical eligibility for hospice in place of the medical director and the team", false, "Incorrect. Eligibility certification belongs to the medical director with team consultation."), O("Serving as liaison among the patient, caregiver, health care provider, and the interdisciplinary team members", true, "Correct. The primary nurse is the liaison linking patient, caregiver, provider, and team."), O("Educating the patient and family about the disease process and how to provide care for the patient safely", true, "Correct. Teaching disease process and care is an explicit primary nurse responsibility.") ],
  tp: "Framework: Nursing Process/ADPIE - primary nurse: liaison, evaluation, symptom assessment, teaching, emotional support." });

BANK.push({ cat: CB, type: "single",
  stem: "A volunteer arrives for her first visit with a home hospice patient whose wife needs to shop for groceries. Which assignment fits the volunteer role?",
  opts: [ O("Stay with the patient for companionship while his wife shops, after completing the required volunteer training", true, "Correct. Good-neighbor services: companionship and caregiver relief for short periods, after training of about 30 hours."), O("Complete his bathing and personal care in place of the aide, because volunteer visits replace aide visits that day", false, "Incorrect. Personal care and bathing are the hospice aide's work under the nurse's supervision."), O("Administer his scheduled morphine while his wife is out, because volunteers may give medications when trained", false, "Incorrect. Volunteers do not administer medications; they provide companionship, respite, and emotional support."), O("Assess his pain and adjust his medication schedule, because volunteers report changes directly to the provider", false, "Incorrect. Pain assessment and schedule changes belong to the nurse and provider, not the volunteer role.") ],
  tp: "Framework: safety first - volunteers give companionship and respite only; medications and personal care stay with licensed/certified staff." });

BANK.push({ cat: CD, type: "single",
  stem: "A vomiting patient has become dehydrated, and oral intake is not keeping up. The provider orders subcutaneous fluids at home. Which statement about this therapy is correct?",

    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
