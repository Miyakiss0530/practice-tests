<script>
/* ============ QUESTION BANK — SITUATIONAL (BRUTAL) ============ */
/* Herlihy Chapter 11: Spinal Cord and Peripheral Nerves — situational items only, facts from the audited study guide. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Peripheral and Cranial Nerves";
var CB = "Reflexes and Anesthesia";
var CC = "Spinal Cord Structure";
var CD = "Spinal Nerves and Plexuses";
var CE = "Tracts Decussation and Cord Injury";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = ["Lumbar puncture", "Quadriplegia", "Paraplegia", "Decussate", "Reflex arc", "Babinski reflex", "Phrenic nerve", "Sciatic nerve", "Dermatome", "Cranial nerves"];
var BLUEPRINT = {};

/* ---------- CORD STRUCTURE / LP ---------- */
BANK.push({ cat: CC, type: "single", kt: ["Lumbar puncture", "Cauda equina"],
  stem: "A patient needs a lumbar puncture to sample cerebrospinal fluid. The nurse explains the needle is placed low in the back, below where the spinal cord ends. Which fact makes this lower site the safe choice?",
  opts: [
    O("Below the cord's end, the canal holds the cauda equina — loose nerve roots that move aside — and the subarachnoid space still holds CSF to sample.", true, "The cord ends and the cauda equina ('horse's tail') continues; an LP taps CSF from the subarachnoid space below the cord, avoiding cord injury. Framework: anatomy-based safety reasoning."),
    O("Below the cord's end, the canal is empty of all neural tissue, so the needle cannot touch any nerve structure at all.", false, "The cauda equina nerve roots are present there — they are simply loose and mobile rather than a solid cord."),
    O("The spinal cord runs the full length of the canal, but its lower end contains no functioning tracts to injure.", false, "The cord does not run the full canal length; it ends and the cauda equina continues below it."),
    O("CSF is found only in the lower canal, because the choroid plexus drains all fluid downward by gravity.", false, "CSF circulates around the whole cord and brain in the subarachnoid space; the lower site is chosen for safety, not because fluid exists only there.")
  ],
  tp: "LP = subarachnoid CSF sampled BELOW the cord's end, among the mobile cauda equina roots. Framework: anatomy-based safety reasoning." });
BANK.push({ cat: CC, type: "single", kt: ["Gray matter", "White matter"],
  stem: "A student compares cross-sections of the brain and spinal cord and notes the gray and white matter seem to swap places. Which statement is correct?",
  opts: [
    O("In the cord, gray matter is on the inside (butterfly-shaped) and white matter is on the outside — the reverse of the cerebrum's arrangement.", true, "Cord: gray inside, white outside. Cerebrum: gray cortex outside, white inside. Framework: structural comparison."),
    O("In the cord, white matter is on the inside and gray matter forms the outer layer, exactly as in the cerebrum.", false, "The cord is the reverse of the cerebrum: cord gray is central, not outer."),
    O("Both the cord and the cerebrum have gray matter on the inside and white matter arranged on the outside.", false, "The cerebrum's gray matter (cortex) is on the outside — the two structures differ."),
    O("The cord contains no white matter at all, because its tracts are unmyelinated throughout their length.", false, "The cord's outer white matter is made of myelinated and unmyelinated axons arranged in tracts.")
  ],
  tp: "Cord cross-section: gray butterfly INSIDE, white OUTSIDE — opposite of the cerebrum. Framework: structural comparison." });

/* ---------- TRACTS / DECUSSATION / INJURY ---------- */
BANK.push({ cat: CE, type: "single", kt: ["Decussate"],
  stem: "A patient has a stroke in the right side of the brain and now has paralysis of the left arm and leg. The family asks why the weakness is on the opposite side. Which explanation is correct?",
  opts: [
    O("Most tracts decussate — they cross over in the cord or brain stem — so the right brain controls the left side of the body, producing contralateral deficits.", true, "Decussation means each side of the brain serves the opposite (contralateral) side; one-sided loss is hemiparalysis. Framework: pathway reasoning."),
    O("The spinal cord rotates the sensory and motor pathways 180 degrees at the neck, swapping which brain side serves which body side.", false, "There is no rotation; fibers cross over (decussate) at specific points in the medulla/cord."),
    O("The right hemisphere always controls the left side because the corpus callosum transfers every signal across before it descends.", false, "The corpus callosum connects hemispheres; the crossing that matters here is decussation of the tracts themselves."),
    O("Weakness appears on the opposite side because ascending tracts carry motor commands down from the brain to the muscles.", false, "Ascending tracts are sensory (up); descending tracts carry motor commands (down).")
  ],
  tp: "Decussation → contralateral control; same side = ipsilateral. Ascending = sensory up; descending = motor down. Framework: pathway reasoning." });
BANK.push({ cat: CE, type: "single", kt: ["Quadriplegia", "Paraplegia"],
  stem: "Two patients are admitted after diving accidents. Patient A, injured in the cervical cord, cannot move his trunk, arms, or legs. Patient B, injured in the lower thoracic cord, cannot move her legs but has full arm function. Which documentation is correct?",
  opts: [
    O("Patient A has quadriplegia (trunk and all four extremities); Patient B has paraplegia (lower extremities only).", true, "Cervical injury → quadriplegia; lower injury sparing the arms → paraplegia. Framework: classification by level of injury."),
    O("Patient A has paraplegia (trunk and all four extremities); Patient B has quadriplegia (lower extremities only).", false, "The terms are reversed: quadri- = four limbs, para- = the lower pair."),
    O("Both patients have hemiparalysis, because cord injuries always affect one side of the body more than the other.", false, "Hemiparalysis is one-sided paralysis, typically from a brain lesion — not the pattern of these cord injuries."),
    O("Patient A has hemiparalysis and Patient B has quadriplegia, based on the total number of limbs involved in each case.", false, "Hemiparalysis is one side only; Patient B's leg-only pattern is paraplegia, not quadriplegia.")
  ],
  tp: "Quadriplegia = trunk + all 4 extremities (cervical). Paraplegia = lower extremities. Hemiparalysis = one side (brain). Framework: classification by injury level." });
BANK.push({ cat: CE, type: "multi", kt: ["Ascending tract", "Descending tract"],
  stem: "A nurse reviews cord pathways with a student. Which statements correctly pair a pathway with its job? Select all that apply.",
  opts: [
    O("Ascending tracts carry sensory information up the cord to the brain.", true, "Ascending = sensory, traveling up to the brain."),
    O("Descending tracts carry motor information down the cord from the brain.", true, "Descending = motor, traveling down from the brain."),
    O("A tract is a bundle of nerve axons located within the CNS.", true, "Tracts are CNS axon bundles — the cord's white matter is arranged in them."),
    O("Ascending tracts carry motor commands to the muscles of the arms and legs.", false, "Motor commands travel in descending tracts; ascending tracts are sensory."),
    O("Tracts are found only in the peripheral nervous system, bundled inside nerves.", false, "Bundles in the PNS are nerves; bundles within the CNS are tracts.")
  ],
  tp: "Ascending = sensory UP; descending = motor DOWN; tract = CNS bundle (PNS bundle = nerve). Framework: pathway classification." });

/* ---------- REFLEXES / ANESTHESIA ---------- */
BANK.push({ cat: CB, type: "single", kt: ["Babinski reflex"],
  stem: "During a neuro check, a nurse strokes the lateral sole of an adult patient's foot and the big toe dorsiflexes with the other toes fanning out. The nurse recognizes this response as which finding?",
  opts: [
    O("A positive Babinski reflex — normal in infants, but in an adult it is an abnormal finding that suggests CNS damage.", true, "In adults the expected response is toe flexion (negative Babinski); dorsiflexion with fanning (positive) after infancy signals CNS problems. Framework: finding interpretation."),
    O("A normal adult stretch reflex — the same class of response as the patellar and Achilles tendon reflexes.", false, "Stretch reflexes are tendon-tap responses; the Babinski is a sole-stroke response with a different meaning."),
    O("The withdrawal reflex — the foot is pulling away from a painful stimulus on the sole of the foot.", false, "Withdrawal pulls a limb away from pain; a Babinski test is a light stroke, and the toe pattern is the finding."),
    O("A positive ankle-jerk reflex — the Achilles tendon response measured at the back of the ankle.", false, "The ankle-jerk is the Achilles stretch reflex, tested by tapping the tendon, not stroking the sole.")
  ],
  tp: "Babinski: stroke lateral sole → adult toes should curl down (negative). Up-going big toe + fanning (positive) = normal only in infants; in adults = CNS damage. Framework: finding interpretation." });
BANK.push({ cat: CB, type: "single", kt: ["Spinal anesthesia", "Epidural anesthesia"],
  stem: "Two obstetric patients receive neuraxial anesthesia. Patient A's '-caine' drug is injected into the subarachnoid space; Patient B's drug is infused into the epidural space. Which statement correctly distinguishes the two?",
  opts: [
    O("Patient A's drug bathes the lumbar and sacral sensory nerves directly in the CSF space; Patient B's drug acts from the space outside the dura.", true, "Spinal anesthesia = into the subarachnoid space (with the CSF), deadening lumbar/sacral sensory nerves; epidural = into the epidural space. Framework: site-of-action discrimination."),
    O("Patient A's drug is placed in the epidural space; Patient B's drug is placed directly into the cerebrospinal fluid.", false, "The sites are reversed: spinal goes into the subarachnoid (CSF) space; epidural stays in the epidural space."),
    O("Both drugs are placed in the subarachnoid space; the only difference is the dose given to each patient.", false, "The defining difference is the space: subarachnoid vs epidural."),
    O("Patient A's drug blocks motor fibers only; Patient B's drug blocks sensory fibers only, by design.", false, "Spinal anesthesia is described by its sensory deadening of lumbar/sacral nerves; the motor/sensory-only split is not the distinction.")
  ],
  tp: "Spinal = subarachnoid space (CSF, '-caine' drugs, lumbar/sacral sensory block). Epidural = epidural space infusion. Framework: site-of-action discrimination." });
BANK.push({ cat: CB, type: "single", kt: ["Reflex arc"],
  stem: "A patient's patellar reflex is absent during assessment. The provider asks the nurse which component of the reflex arc could be interrupted at several possible points. Which list names the arc's components in signal order?",
  opts: [
    O("Sensory receptor → sensory neuron entering via the dorsal root → integrating center in cord gray matter → motor neuron exiting via the ventral root → effector (quadriceps).", true, "The reflex arc runs receptor → afferent (dorsal root in) → integrating center → efferent (ventral root out) → effector organ. Framework: pathway sequencing."),
    O("Motor neuron exiting via the dorsal root → sensory neuron → integrating center in cord white matter → receptor → effector (quadriceps).", false, "Dorsal root carries sensory IN, not motor out, and the integrating center is in gray matter, not white."),
    O("Sensory receptor → motor neuron entering via the ventral root → integrating center in the brain → sensory neuron → effector (quadriceps).", false, "A spinal reflex is integrated in the cord, not the brain, and the roots' roles are reversed here."),
    O("Effector (quadriceps) → sensory neuron → integrating center in cord gray matter → motor neuron → sensory receptor in the tendon.", false, "The arc begins at the receptor and ends at the effector — this list runs it backward.")
  ],
  tp: "Reflex arc: receptor → sensory (dorsal root IN) → integrating center (gray matter) → motor (ventral root OUT) → effector. Framework: pathway sequencing." });

/* ---------- CRANIAL / PERIPHERAL NERVES ---------- */
BANK.push({ cat: CA, type: "single", kt: ["Cranial nerves"],
  stem: "A nurse performs a cranial nerve screen: the patient identifies vanilla by smell, reads an eye chart, smiles and wrinkles her forehead, and shrugs her shoulders against resistance. Which set of nerves has been tested, in the order performed?",
  opts: [
    O("CN I (smell), CN II (vision), CN VII (facial expression), and CN XI (head turning and shoulder shrugging).", true, "Smell = I, vision = II, facial movement = VII, shrug/head rotation = XI. Framework: assessment-to-structure matching."),
    O("CN I (smell), CN II (vision), CN V (facial expression), and CN VII (head turning and shoulder shrugging).", false, "Facial expression is CN VII, not V (V gives facial sensation and chewing), and the shrug is CN XI, not VII."),
    O("CN II (smell), CN I (vision), CN VII (facial expression), and CN X (head turning and shoulder shrugging).", false, "Smell is I and vision is II — not reversed — and the shrug belongs to XI, not the vagus (X)."),
    O("CN I (smell), CN III (vision), CN IX (facial expression), and CN XII (head turning and shoulder shrugging).", false, "Vision is II (III moves the eye), facial expression is VII (IX is throat/taste), and tongue movement is XII — the shrug is XI.")
  ],
  tp: "CN screen anchors: I smell, II vision, V facial sensation, VII facial expression, VIII hearing/balance, XI shrug, XII tongue. Framework: assessment-to-structure matching." });
BANK.push({ cat: CA, type: "single", kt: ["Bell palsy"],
  stem: "A patient wakes with one side of her face drooping; she cannot smile, close the eye, or wrinkle the forehead on that side, but her arms and legs are strong and her speech is clear. Which nerve is most likely damaged?",
  opts: [
    O("CN VII, the facial nerve — its damage causes Bell palsy, loss of facial expression on the affected side.", true, "Bell palsy = facial nerve (VII) damage with one-sided loss of facial expression and normal limb strength. Framework: localization reasoning."),
    O("CN V, the trigeminal nerve — its damage causes loss of facial expression and drooping on the affected side.", false, "CN V damage gives facial paresthesias (tingling, numbness) and chewing problems, not loss of expression."),
    O("CN X, the vagus nerve — its damage causes facial drooping because it wanders through the face and neck.", false, "The vagus serves the throat and viscera (gag, swallowing, voice); it does not drive facial expression."),
    O("CN XII, the hypoglossal nerve — its damage paralyzes the face on the same side as the lesion.", false, "CN XII moves the tongue; facial expression is CN VII.")
  ],
  tp: "One-sided facial expression loss + normal limbs = CN VII (Bell palsy). CN V = facial sensation/paresthesias. Framework: localization reasoning." });
BANK.push({ cat: CD, type: "single", kt: ["Wristdrop", "Footdrop"],
  stem: "Patient A cannot lift or extend his hand at the wrist after a humerus fracture. Patient B cannot dorsiflex her foot after a leg cast was applied tightly below the knee. Which nerve injuries explain the two findings?",
  opts: [
    O("Patient A: radial nerve damage (wristdrop). Patient B: common peroneal nerve damage (footdrop).", true, "Radial palsy = wristdrop (cannot extend hand/fingers); peroneal damage = footdrop (cannot dorsiflex). Framework: deficit-to-nerve matching."),
    O("Patient A: ulnar nerve damage (wristdrop). Patient B: sciatic nerve damage (footdrop).", false, "Ulnar damage gives clawhand with inability to spread the fingers; sciatic inflammation gives buttock/posterior-thigh pain (sciatica)."),
    O("Patient A: axillary nerve damage (wristdrop). Patient B: phrenic nerve damage (footdrop).", false, "Axillary damage causes crutch palsy of the arm/shoulder; the phrenic nerve drives the diaphragm and breathing."),
    O("Patient A: median nerve damage (wristdrop). Patient B: ulnar nerve damage (footdrop).", false, "Neither pairing matches the guide's Table 11.6 deficits: wristdrop = radial, footdrop = peroneal.")
  ],
  tp: "Table 11.6 anchors: radial = wristdrop; ulnar = clawhand; peroneal = footdrop; axillary = crutch palsy; sciatic = sciatica. Framework: deficit-to-nerve matching." });
BANK.push({ cat: CD, type: "single", kt: ["Dermatome"],
  stem: "A patient develops a painful, blistering stripe of lesions wrapping one side of the waist, exactly along one dermatome, months after having chickenpox. Which explanation should the nurse give?",
  opts: [
    O("This is shingles: the virus reactivated in one spinal nerve, so lesions stripe along that nerve's dermatome, and postherpetic neuralgia may persist for months.", true, "Shingles follows one dermatome ('girdle' pattern) because the virus reactivates in that nerve; lingering pain = postherpetic neuralgia. Framework: pattern-recognition reasoning."),
    O("This is sciatica: the sciatic nerve is inflamed, and the lesions mark the skin over the inflamed nerve's path.", false, "Sciatica is pain in the buttock and posterior thigh without a blistering dermatome stripe."),
    O("This is a dermatome infection of the skin only, unrelated to any nerve, and it cannot cause pain after the lesions crust over.", false, "Shingles is a nerve-based reactivation and CAN leave months of postherpetic neuralgia after crusting."),
    O("This is footdrop of the trunk: the peroneal nerve has been damaged by pressure from tight clothing at the waist.", false, "Footdrop is peroneal damage at the leg causing inability to dorsiflex — unrelated to a waist-level lesion stripe.")
  ],
  tp: "Dermatome = skin area of one dorsal root, sensory only. Shingles stripes one dermatome; postherpetic neuralgia can persist for months. Framework: pattern recognition." });
BANK.push({ cat: CD, type: "multi", kt: ["Phrenic nerve", "Sciatic nerve", "Plexus"],
  stem: "A nurse teaches a patient with new crutches and a back-pocket wallet habit. Which teaching points are correct? Select all that apply.",
  opts: [
    O("Bear weight on the hands, not in the armpits — armpit pressure damages the axillary nerve and causes crutch palsy.", true, "The guide's own crutch teaching: axillary pressure → crutch palsy."),
    O("Move the wallet out of the back pocket — sitting on it squeezes the sciatic nerve.", true, "The guide's wallet teaching: chronic sciatic pressure from a back-pocket wallet."),
    O("A plexus is a network where nerve fibers converge and are sorted to a specific body part.", true, "That is the guide's definition of a plexus (cervical, brachial, lumbosacral)."),
    O("The phrenic nerve, from the brachial plexus, is the longest nerve in the body.", false, "The phrenic nerve comes from the CERVICAL plexus and drives the diaphragm; the SCIATIC nerve is the longest."),
    O("The sciatic nerve arises from the cervical plexus and stimulates the diaphragm.", false, "The sciatic arises from the lumbosacral plexus; the diaphragm belongs to the phrenic nerve.")
  ],
  tp: "Phrenic (cervical plexus) → diaphragm/breathing. Sciatic (lumbosacral) = longest nerve. Axillary pressure = crutch palsy. Framework: applied anatomy teaching." });

/* ---------- NGN CASE STUDY (grp) ---------- */
var CASE11 = "CASE11";
var CASESTEM = "CASE — A 24-year-old is admitted after a motorcycle crash with a cervical spinal cord injury at C5. Chart data: the patient cannot move the trunk, arms, or legs; respirations are shallow at 10/min with SpO2 89% on room air; the patient is anxious and says, 'I can't catch my breath.' HR 62, BP 104/68, T 98.4°F. ";
BANK.push({ cat: CE, type: "multi", grp: CASE11, kt: ["Quadriplegia"],
  stem: CASESTEM + "Which findings are the most significant cues in this presentation? Select all that apply.",
  opts: [
    O("Inability to move the trunk, arms, and legs after a cervical cord injury.", true, "Cervical injury with trunk + four-limb loss is quadriplegia — the defining cue of a high cord injury."),
    O("Shallow respirations at 10/min with SpO2 of 89% and air hunger.", true, "Breathing failure cues are the most dangerous findings in a high cervical injury."),
    O("The patient's statement that he cannot catch his breath.", true, "Subjective air hunger corroborates the objective respiratory cues."),
    O("Heart rate of 62 beats per minute with a blood pressure of 104/68 on admission.", false, "These values are near normal and are not the significant cues driving this presentation."),
    O("Temperature of 98.4°F recorded on admission to the emergency department.", false, "A normal temperature is an expected finding, not a significant cue.")
  ],
  tp: "NGN — Recognize cues: quadriplegia pattern + respiratory failure cues dominate. Framework: NGN (recognize cues)." });

/* ============ ENGINE (ES5) ============ */
var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {

  }
  h += '<div class="wrap"><div class="card">';

  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';

  } else if (q.type === "order") {

      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';

    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {

      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';

      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {

    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';

}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
