<script>
/* ============ QUESTION BANK — DEFINITION TEST ============ */
/* Herlihy Chapter 7: Integumentary System and Body Temperature — ABCD single-best + SATA
   items testing the definitions and meanings of the chapter's concepts.
   Facts ONLY from the verified Ch 7 guide content. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Skin Functions and Structure";
var CB = "Skin Stories, Routes, and Color";
var CC = "Hair and Nails";
var CD = "Skin Glands";
var CE = "Body Temperature and Thermoregulation";
var CF = "Burns";
var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = ["integumentary system", "epidermis", "dermis", "stratum germinativum", "stratum corneum", "keratin", "subcutaneous layer", "transdermal", "topical", "intradermal", "melanin", "bilirubin", "cyanosis", "pallor", "callus", "corn", "hirsutism", "alopecia", "arrector pili", "clubbing", "lunula", "sebum", "blackhead", "vernix caseosa", "apocrine glands", "eccrine glands", "cerumen", "core temperature", "shell temperature", "hypothalamus", "sensible perspiration", "insensible perspiration", "pyrexia", "hyperthermia", "antipyretic", "radiation", "conduction", "nonshivering thermogenesis", "eschar", "rule of nines"];
var BLUEPRINT = {
  CA: { name: CA, count: 8, types: { single: 5, multi: 2, dropdown: 1 } },
  CB: { name: CB, count: 8, types: { single: 6, multi: 1, dropdown: 1 } },
  CC: { name: CC, count: 7, types: { single: 6, multi: 1 } },
  CD: { name: CD, count: 7, types: { single: 6, multi: 1 } },
  CE: { name: CE, count: 10, types: { single: 9, multi: 1 } },
  CF: { name: CF, count: 4, types: { single: 3, multi: 1 } }
};

/* ---------- SKIN FUNCTIONS AND STRUCTURE ---------- */
BANK.push({ cat: CA, type: "multi", kt: ["integumentary system"],
  stem: "A nursing student lists the functions of the skin during a study review. Which entries belong on the list of seven functions? Select all that apply.",
  opts: [
    O("Acts as a mechanical and chemical barrier that keeps harmful substances out", true, "Barrier is function one: mechanically it keeps harmful substances out and retains water and electrolytes, and the acid pH of the surface adds a chemical barrier."),
    O("Synthesizes vitamin D when the skin is exposed to sunlight", true, "Vitamin D synthesis is one of the seven; the vitamin D made is necessary for absorption of calcium from the digestive tract."),
    O("Houses sensory receptors for touch, pressure, pain, and temperature", true, "Sensation is one of the seven functions, carried out by the receptors housed in the skin."),
    O("Produces red blood cells for the circulating blood volume", false, "Red blood cell production is a bone marrow function, not one of the seven skin functions in the guide."),
    O("Filters the blood and concentrates urine for excretion", false, "That describes the kidneys; the skin's excretory role is minor — water, salt, and small amounts of urea only."),
    O("Secretes insulin in response to rising blood glucose", false, "Insulin secretion belongs to the pancreas; the skin's gland-like act in the seven functions is vitamin D synthesis, not hormone secretion.")
  ],
  tp: "ANSWER KEY — Correct answers: barrier, vitamin D synthesis, and sensation. DETAILED RATIONALE — The seven functions are barrier, protection, immune response, excretion, vitamin D synthesis, sensation, and temperature regulation; blood-cell production, urine formation, and insulin secretion belong to other systems. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Terminology discrimination — exact guide lists over plausible functions of other organs." });

BANK.push({ cat: CA, type: "single", kt: ["epidermis"],
  stem: "The term avascular, applied to the epidermis, means that the epidermis:",
  opts: [
    O("Has no blood supply of its own and receives oxygen and nutrients by diffusion from the dermis", true, "Avascular means without its own vessels; the lower epidermis is nourished by diffusion from the rich blood supply of the underlying dermis."),
    O("Has the richest blood supply of any layer and feeds the dermis beneath it by diffusion", false, "This reverses the anatomy: the blood supply sits in the dermis and nourishment moves upward into the epidermis, not the reverse."),
    O("Contains blood vessels only in the stratum corneum, where shedding cells are produced", false, "The stratum corneum is dead, flattened cells; vessels are not located in the epidermis at any level, and new cells are produced in the deep layer."),
    O("Lacks nerve endings, so injuries limited to this layer cannot be detected by the patient", false, "Avascular describes blood supply, not innervation; first-degree burns limited to the epidermis are painful, which disproves this option.")
  ],
  tp: "ANSWER KEY — Correct answer: the epidermis has no blood supply of its own and is fed by diffusion from the dermis. DETAILED RATIONALE — Avascular is a blood-supply term; it explains why tattoo ink placed in the sloughing epidermis would be lost and must reach the dermis. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Terminology discrimination — word meaning tied to the guide's structure facts." });

BANK.push({ cat: CA, type: "single", kt: ["stratum germinativum", "stratum corneum"],
  stem: "Which pairing correctly states the meaning of the two named epidermal layers?",
  opts: [
    O("The germinativum grows new cells at the bottom; the corneum sheds dead cells at the surface", true, "The two named layers do opposite jobs: the deep germinativum continuously divides, and the surface corneum is about 30 layers of dead cells being sloughed off."),
    O("The germinativum sheds dead cells at the surface; the corneum grows new cells at the bottom", false, "The pairing is reversed: division happens deep, in the germinativum on the dermis, while shedding happens at the surface corneum."),
    O("The germinativum waterproofs the surface; the corneum produces millions of cells each day", false, "Waterproofing belongs to keratin deposited as cells rise, and the millions of new cells per day are produced by the germinativum, not the corneum."),
    O("The germinativum holds the blood vessels; the corneum holds the sensory receptors in place", false, "The epidermis is avascular and the vessels and most receptors sit in the dermis; neither named epidermal layer holds them.")
  ],
  tp: "ANSWER KEY — Correct answer: germinativum grows new cells at the bottom; corneum sheds dead cells at the surface. DETAILED RATIONALE — As cells leave the germinativum they die and undergo keratinization on the way up, arriving at the corneum as dead, flattened, keratinized cells. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Opposite-pair discrimination — paired structures learned by their opposing jobs." });

BANK.push({ cat: CA, type: "single", kt: ["keratin"],
  stem: "A classmate asks what it means that surface skin cells are keratinized. The correct meaning is that the cells:",
  opts: [
    O("Have filled with a tough protein that hardens and flattens them and makes the skin water resistant", true, "Keratinization is the deposit of the tough protein keratin within the cell as it moves toward the surface; it hardens and flattens the cell and waterproofs the skin."),
    O("Have filled with a dark pigment that stains them and protects the deeper layers from radiation", false, "That describes melanin from the melanocytes, a pigment story from the skin-color topic, not keratinization."),
    O("Have filled with an oily secretion that lubricates them and inhibits bacterial growth on the skin", false, "That describes sebum from the sebaceous glands; keratin is a protein deposited inside the epidermal cell itself."),
    O("Have filled with fluid and swollen, which is why the surface layer appears slightly edematous", false, "Surface cells are dead and flattened, not fluid-filled and swollen; edematous describes a swollen first-degree burn, not normal keratinization.")
  ],
  tp: "ANSWER KEY — Correct answer: the cells have filled with keratin, hardening and flattening them and waterproofing the skin. DETAILED RATIONALE — Keratin, melanin, and sebum are the chapter's three look-alike substances: a structural protein inside the cell, a pigment from melanocytes, and an oil from sebaceous glands. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Terminology discrimination — separating the chapter's three signature substances." });

BANK.push({ cat: CA, type: "single", kt: ["subcutaneous layer"],
  stem: "A subcutaneous injection is correctly understood to deposit medication:",
  opts: [
    O("Into the layer beneath the skin, after the needle passes through the epidermis and the dermis", true, "The subcutaneous layer lies under the skin; the needle must penetrate both skin layers so the tip is located in that layer where the medication is deposited."),
    O("Into the inner layer of the skin itself, between the dermis and its deepest blood vessels", false, "That location is still inside the dermis, a layer of the skin; subcutaneous means below the skin, not within it."),
    O("Into the surface layer of the skin, where the medication spreads across the stratum corneum", false, "Depositing medication on or in the surface layer describes topical or intradermal placement, not the subcutaneous route."),
    O("Into the muscle tissue beneath the fat, because the layer under the skin contains no tissue", false, "The layer under the skin is loose connective and adipose tissue and is exactly where the medication is deposited; it is not bypassed to reach muscle.")
  ],
  tp: "ANSWER KEY — Correct answer: into the layer beneath the skin, past the epidermis and dermis. DETAILED RATIONALE — Sub- means under: the hypodermis is under the skin and is not part of the skin, which is why the route is named for position rather than for a skin layer. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Terminology discrimination — route names read by their word parts and positions." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement correctly pairs a name with its meaning for the skin as a whole?",
  opts: [
    O("The integument is the skin, the largest organ in the body, and its study is called dermatology", true, "Integument (cutaneous membrane) names the skin itself — the largest organ — and dermatology is the study of the skin and skin disorders."),
    O("The integument is the layer under the skin, and its study is called dermatology because it anchors skin", false, "The layer under the skin is the subcutaneous layer or hypodermis; the integument is the skin itself, not the tissue beneath it."),
    O("The cutaneous membrane is the surface layer only, and dermatology is the study of its shedding cells", false, "The cutaneous membrane is the whole skin, both layers; dermatology covers the skin and skin disorders as a whole, not one layer or its shed cells."),
    O("The dermis is another name for the whole skin, and the integument refers only to hair and nails", false, "The dermis is one of the two layers; hair and nails are accessory structures of the integumentary system, not the meaning of integument.")
  ],
  tp: "ANSWER KEY — Correct answer: integument is the skin, the largest organ, and dermatology is its study. DETAILED RATIONALE — Integument, cutaneous membrane, and skin are three names for the same organ; dermis and hypodermis name parts or neighbors of it, never the whole. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Terminology discrimination — whole-organ names separated from layer names." });

BANK.push({ cat: CA, type: "multi", kt: ["dermis"],
  stem: "Which statements about the dermis are true? Select all that apply.",
  opts: [
    O("It is composed of dense fibrous connective tissue with collagen and elastin fibers", true, "That is the guide's composition statement; the fibers in their gel-like substance make the dermis strong and stretchable."),
    O("It holds blood vessels, nervous tissue, some muscle tissue, and sensory receptors", true, "The dermis is the populated layer: vessels, nerves, some muscle, and the receptors for pain, temperature, pressure, and touch."),
    O("It is the largest portion of the skin and lies beneath the epidermis", true, "The dermis is the inner layer and the largest portion of the skin, sitting under the epidermis."),
    O("It is avascular and receives its nourishment by diffusion from the epidermis", false, "Avascular describes the epidermis, and diffusion runs from the dermis upward — the dermis holds the blood supply."),
    O("It sheds about 40,000 dead cells each minute from its surface layer", false, "The shedding cells are epidermal, from the stratum corneum; the dermis does not slough from a surface layer."),
    O("It is not considered part of the skin and mainly anchors skin to bone", false, "That describes the subcutaneous layer beneath the skin; the dermis is one of the two true layers of the skin.")
  ],
  tp: "ANSWER KEY — Correct answers: dense fibrous tissue with collagen and elastin; holds vessels, nerves, muscle, and receptors; largest portion beneath the epidermis. DETAILED RATIONALE — Each false option donates a fact to the wrong layer: avascular and shedding belong to the epidermis, and not-part-of-the-skin belongs to the hypodermis. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Opposite-pair discrimination — the three layers kept separate by their defining facts." });

BANK.push({ cat: CA, type: "dropdown", kt: ["stratum germinativum", "subcutaneous layer"],
  stem: "Match each description with the correct structure. Each Select is on its own row, under its description.<br><br>Deep layer of the epidermis whose cells divide continuously and push older cells toward the surface<br>[[0]]<br><br>Layer under the skin, made of loose connective and adipose tissue, that insulates the body and anchors the skin<br>[[1]]",
  blanks: [
    { o: [O("Stratum germinativum", true, "The germinativum lies on the dermis and continuously divides, producing millions of cells per day that push older cells upward."),
           O("Stratum corneum", false, "The corneum is the surface layer of dead, flattened, keratinized cells being shed — it does not divide."),
           O("Subcutaneous layer", false, "The subcutaneous layer lies under the skin and insulates and anchors; it is not a dividing epidermal layer.")] },
    { o: [O("Subcutaneous layer", true, "Loose connective and adipose tissue under the skin; its two jobs are insulation from temperature extremes and anchoring the skin to underlying structures."),
           O("Stratum germinativum", false, "The germinativum is the dividing deep layer of the epidermis itself, not a layer beneath the skin."),
           O("Stratum corneum", false, "The corneum is the dead surface layer of the epidermis, not a layer beneath the skin at all.") ] }
  ],
  tp: "ANSWER KEY — Correct answers: stratum germinativum for the dividing deep layer; subcutaneous layer for the insulating layer under the skin. DETAILED RATIONALE — One answer lives at the bottom of the epidermis and grows; the other lives below the skin entirely and insulates and anchors without being part of the skin. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Terminology discrimination — position words (deep, surface, under) as the deciding clues." });

/* ---------- SKIN STORIES, ROUTES, AND COLOR ---------- */
BANK.push({ cat: CB, type: "single", kt: ["transdermal", "topical"],
  stem: "A nitroglycerin patch is prescribed for a patient. The patch works as intended only if the drug:",
  opts: [
    O("Crosses the skin, enters the dermal blood vessels, and is carried by the blood throughout the body", true, "That is the meaning of transdermal: across the skin into the dermal blood for a systemic effect — the guide's own example is the nitroglycerin patch."),
    O("Stays on the surface of the skin and acts only on the skin directly underneath the patch itself", false, "A surface-only, local action is topical delivery; a nitroglycerin patch is meant to reach the blood and act systemically."),
    O("Is injected into the skin in a small volume so that a visible skin reaction can be read later", false, "Injecting into the skin to read a reaction describes intradermal allergy testing, not patch delivery of a drug."),
    O("Is deposited under the skin by needle, where it is absorbed faster than from a surface patch", false, "Needle deposition under the skin is the subcutaneous route; the patch delivers across intact skin without a needle.")
  ],
  tp: "ANSWER KEY — Correct answer: the drug crosses the skin into the dermal blood and acts throughout the body. DETAILED RATIONALE — Route names state destinations: transdermal ends in the blood, topical ends on the surface, intradermal stays in the skin for testing, and subcutaneous is injected beneath the skin. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Terminology discrimination — the four skin routes separated by where the drug ends up." });

BANK.push({ cat: CB, type: "single", kt: ["intradermal"],
  stem: "After an intradermal allergy test, the site shows redness, swelling, and itching. The correct interpretation is that:",
  opts: [
    O("An allergic response has appeared as a skin reaction to the antigen placed in the skin", true, "Intradermal testing injects antigens into the skin to detect allergies; an allergic response appears exactly as redness, swelling, and itching."),
    O("The test has failed, because a correctly performed test never produces any visible skin change", false, "A visible reaction is the readable result the test is designed to produce, not evidence of failure."),
    O("The antigen has reached the blood and produced a systemic effect throughout the entire body", false, "The reaction described is local, at the test site; systemic delivery across the skin is the transdermal concept, not intradermal testing."),
    O("The findings show the patient is allergic to the needle, so the test must be repeated on the surface", false, "The antigen, not the needle, is the test substance, and repeating a surface application would be a different route with a different meaning.")
  ],
  tp: "ANSWER KEY — Correct answer: an allergic response has appeared as a skin reaction to the antigen. DETAILED RATIONALE — In this route the skin is the laboratory: the substance is placed in the skin precisely so the reaction can be read on the skin. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Terminology discrimination — test routes read by their intended observable result." });

BANK.push({ cat: CB, type: "single", kt: ["bilirubin"],
  stem: "A patient with liver disease develops yellow skin. The yellowing is correctly explained as:",
  opts: [
    O("Jaundice: bilirubin that the diseased liver cannot excrete is deposited in the skin", true, "Jaundice is the condition; bilirubin is the pigment. When the liver cannot excrete it, it is deposited in the skin and the skin turns yellow."),
    O("Cyanosis: bilirubin that the diseased liver cannot excrete makes the blood appear yellow", false, "Cyanosis is the bluish look of poorly oxygenated blood — a different pigment problem, a different color, and a different mechanism."),
    O("Carotene excess: the liver stores extra carotene, which is released into the skin in disease", false, "Carotene tint is a dietary and melanin-related effect, not a liver-excretion failure; the liver-disease pigment in the guide is bilirubin."),
    O("Vitiligo: the diseased liver destroys melanocytes in patches, and the patches appear yellow", false, "Vitiligo is patchy loss of melanin leaving white patches; it has no connection to liver excretion or to yellow discoloration.")
  ],
  tp: "ANSWER KEY — Correct answer: jaundice, from bilirubin deposited in the skin when the liver cannot excrete it. DETAILED RATIONALE — Color changes must be matched on all three axes: color, pigment, and mechanism. Only jaundice matches yellow + bilirubin + failed excretion. The option-by-option feedback explains why the correct choice works and why each distractor fails. PRIORITY FRAMEWORK — Terminology discrimination — color findings matched by pigment and mechanism, not color alone." });

BANK.push({ cat: CB, type: "single", kt: ["cyanosis", "pallor"],
  stem: "Two patients change color. One looks blue; the other looks pale and ashen after a fright. The correct pairing is:",
  opts: [
    O("Blue is cyanosis from poorly oxygenated blood; pale is pallor from constricted skin vessels", true, "Cyanosis names the blue of poorly oxygenated blood, and pallor names the pale, ashen look when fear constricts the skin vessels and oxygenated blood flow falls."),
    O("Blue is pallor from poorly oxygenated blood; pale is cyanosis from constricted skin vessels", false, "The names are swapped: pallor is the pale look, cyanosis is the blue look — the mechanisms given belong to the opposite terms."),
    O("Blue is flushing from dilated skin vessels; pale is jaundice from constricted skin vessels", false, "Flushing is reddening from dilation with embarrassment, and jaundice is yellowing from deposited bilirubin — neither matches these two patients."),

function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);

  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }

    else if (q.type === "dropdown") {

  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }

  if (q.type === "order") { return S.touched[i]; }

}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }

    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }

}

  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
