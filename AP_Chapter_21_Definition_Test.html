var KEYTERMS = ["Abscess", "Acid mantle", "Acquired immunity", "Agglutination", "Allergen", "Anaphylaxis", "Antibody-mediated immunity (AMI)", "Antigen", "Antitoxins", "Antivenoms", "Booster shot", "Cell-mediated immunity (CMI)", "Chemotaxis", "Complement proteins", "Contact dermatitis", "Diapedesis", "Febrile seizures", "Fever (pyrexia)", "Genetic immunity", "Graft-versus-host disease (GVHD)", "Granulocytopenia", "Helper T cells (CD4+ T cells)", "Herd immunity", "Hyperemia", "IgA", "IgD", "IgE", "IgG", "IgM", "Immune globulin", "Immune memory", "Immunoglobulins", "Immunology", "Immunotolerance", "Inflammation", "Interferons", "Kupffer cells", "Lysozyme", "Macrophages", "Natural killer (NK) cells", "Nonspecific immunity", "Phagocytosis", "Primary response", "Pus", "Pyrogens", "Secondary response", "Severe combined immunodeficiency (SCID)", "Specificity", "Suppressor T cells", "Toxoid", "Vaccine"];
var BLUEPRINT = {"Lines and Types of Immunity": {"name": "Lines and Types of Immunity", "count": 5, "types": {"single": 4, "multi": 1}}, "First and Second Lines of Defense": {"name": "First and Second Lines of Defense", "count": 8, "types": {"single": 7, "multi": 1}}, "Cells Involved in Immunity": {"name": "Cells Involved in Immunity", "count": 5, "types": {"single": 4, "multi": 1}}, "Antigens, Antibodies, and Immune Responses": {"name": "Antigens, Antibodies, and Immune Responses", "count": 8, "types": {"single": 7, "multi": 1}}, "Acquired Immunity, Vaccines, and Antibody Products": {"name": "Acquired Immunity, Vaccines, and Antibody Products", "count": 7, "types": {"single": 6, "multi": 1}}, "When Immunity Goes Wrong and Transplants": {"name": "When Immunity Goes Wrong and Transplants", "count": 6, "types": {"single": 5, "multi": 1}}};
BANK.push({"cat": "Lines and Types of Immunity", "type": "single", "stem": "Which statement correctly defines nonspecific (innate) immunity?", "opts": [{"t": "It protects against many different types of foreign agents, and the body does not need to recognize the specific agent.", "c": true, "r": "Nonspecific immunity is broad: it acts against many agents without identifying the specific one, and we are born with it."}, {"t": "It hones in on one specific substance and protects against that substance but not against others.", "c": false, "r": "That is the definition of specific (adaptive) immunity, the opposite arm."}, {"t": "It develops only after a first exposure and then responds faster on every later exposure.", "c": false, "r": "A faster second response describes immune memory, a trait of specific immunity, not innate defense."}, {"t": "It is carried out only by lymphocytes and macrophages working in the third line of defense.", "c": false, "r": "Lymphocytes and macrophages are the third (specific) line; nonspecific defense is the first and second lines."}], "tp": "Nonspecific = broad, born with it, no recognition needed. Specific = one target, specificity plus memory. [Framework: Nursing Process/ADPIE]", "kt": ["Nonspecific immunity"]});
BANK.push({"cat": "Lines and Types of Immunity", "type": "single", "stem": "Which pair of characteristics distinguishes specific immunity from nonspecific immunity?", "opts": [{"t": "Specificity and memory: it homes in on one foreign substance and responds faster and more robustly on re-exposure.", "c": true, "r": "The guide names exactly two distinguishing characteristics of specific immunity: specificity and memory."}, {"t": "Speed and strength: it reacts within minutes and destroys every type of pathogen it encounters.", "c": false, "r": "Specific immunity is not defined by minutes-fast, all-pathogen action; that breadth belongs to nonspecific defense."}, {"t": "Barriers and reflexes: it keeps pathogens out of the body with skin, mucus, sneezing, and coughing.", "c": false, "r": "Barriers and reflexes are the first line of nonspecific defense, not characteristics of specific immunity."}, {"t": "Fever and inflammation: it raises body temperature and produces redness, heat, swelling, and pain.", "c": false, "r": "Fever and inflammation are second-line nonspecific processes, not the defining traits of specific immunity."}], "tp": "Two words separate specific from nonspecific: specificity and memory. [Framework: Nursing Process/ADPIE]", "kt": ["Specificity", "Immune memory"]});
BANK.push({"cat": "Lines and Types of Immunity", "type": "single", "stem": "A child who had measles is exposed again years later and does not become ill. Which concept from the guide explains this protection?", "opts": [{"t": "Memory: on re-exposure, memory cells are activated very quickly and produce many antibody-secreting plasma cells.", "c": true, "r": "The guide's own example: later measles exposure finds memory cells that remember the first exposure and respond before illness develops."}, {"t": "Immunotolerance: the body has learned to perceive the measles virus as part of itself.", "c": false, "r": "Immunotolerance is recognition of self; treating a virus as self would prevent a response, not protect against illness."}, {"t": "Genetic immunity: the child was born with inherited immunity to the measles virus.", "c": false, "r": "Genetic (species) immunity covers diseases of other species, not protection gained after having measles."}, {"t": "Herd immunity: enough other children are immune, so the virus never reaches this child.", "c": false, "r": "Herd immunity is indirect population protection; this child is protected by his own memory cells from the first infection."}], "tp": "Had it once, immune later = memory cells and the secondary response. Tolerance, genetic, and herd immunity are different mechanisms. [Framework: Acute vs Chronic]", "kt": ["Immune memory", "Secondary response"]});
BANK.push({"cat": "Lines and Types of Immunity", "type": "single", "stem": "Which grouping correctly matches the three lines of defense with their members?", "opts": [{"t": "First: mechanical barriers, chemical barriers, reflexes. Second: phagocytosis, inflammation, fever, protective proteins, NK cells. Third: lymphocytes and macrophages.", "c": true, "r": "This is Fig. 21.2 exactly: lines one and two are nonspecific; line three is specific."}, {"t": "First: phagocytosis, inflammation, fever. Second: barriers, chemicals, reflexes. Third: lymphocytes and macrophages.", "c": false, "r": "The first two lines are swapped: barriers and reflexes come first; phagocytosis, inflammation, and fever are second."}, {"t": "First: barriers, chemicals, reflexes. Second: lymphocytes and macrophages. Third: phagocytosis, inflammation, fever, protective proteins.", "c": false, "r": "Lymphocytes are the third (specific) line, and the phagocyte processes are second, not third."}, {"t": "First: interferons and complement. Second: barriers, chemicals, reflexes. Third: inflammation, fever, and phagocytosis.", "c": false, "r": "Interferons and complement are second-line protective proteins; every line in this option is misplaced."}], "tp": "Lines 1-2 nonspecific, line 3 specific. Barriers first, eating/inflaming second, lymphocytes third. [Framework: Nursing Process/ADPIE]"});
BANK.push({"cat": "Lines and Types of Immunity", "type": "multi", "stem": "Which statements about the immune system as a whole are correct according to the guide? Select all that apply.", "opts": [{"t": "It defends the body against pathogens, foreign substances such as pollens, and cancer cells.", "c": true, "r": "The guide defines the immune system's targets as pathogens, foreign substances such as pollens, and cancer cells."}, {"t": "Its study is called immunology.", "c": true, "r": "The guide states directly: the study of the immune system is called immunology."}, {"t": "It is restricted to a single organ, the thymus gland.", "c": false, "r": "The guide stresses the opposite: immunity is not restricted to a single organ or tissue and is diffusely scattered through the body."}, {"t": "Its key specific-immunity cells are the lymphocytes and the macrophages.", "c": true, "r": "B and T lymphocytes plus macrophages are named as the key cells of specific immunity."}, {"t": "It stops working once the first line of defense is breached.", "c": false, "r": "A breach of line one simply hands the fight to lines two and three; the system fights in three lines."}], "tp": "Immune system: fights pathogens, pollens, cancer cells; scattered body-wide; key specific cells are lymphocytes and macrophages. [Framework: Nursing Process/ADPIE]", "kt": ["Immunology"]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "Which statement correctly describes the first line of defense?", "opts": [{"t": "Intact skin and mucous membranes block entry, supported by acid, enzymes, mucus, cilia, and reflexes such as sneezing and coughing.", "c": true, "r": "Line one is keep-them-out: mechanical barriers, chemical barriers, and reflexes."}, {"t": "Leukocytes ingest and digest any pathogen that enters, producing pus at the site of infection.", "c": false, "r": "Ingesting pathogens is phagocytosis, a second-line process that starts only after line one is penetrated."}, {"t": "Lymphocytes recognize a specific antigen and mount a targeted response against that substance alone.", "c": false, "r": "Targeted lymphocyte responses are the third line, not the first."}, {"t": "Proteins circulate in the blood and, when activated, punch holes in a bacterium's membrane.", "c": false, "r": "That describes complement proteins, part of the second line of defense."}], "tp": "First line = barriers, chemicals, reflexes. Destruction of these barriers is an invitation to invasion. [Framework: Safety First]"});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "What is the acid mantle, as defined in the guide?", "opts": [{"t": "An acid coating on the skin, formed by sebaceous and sweat gland secretions, that inhibits bacterial growth.", "c": true, "r": "The acid mantle is one of the skin's three defenses, alongside its intact surface and continuous sloughing."}, {"t": "A layer of mucus in the respiratory tract that traps inhaled foreign material until the cilia sweep it out.", "c": false, "r": "Mucus trapping is a respiratory chemical/mechanical defense; the acid mantle is on the skin."}, {"t": "An enzyme in tears and saliva that discourages the growth of pathogens on moist surfaces.", "c": false, "r": "That enzyme is lysozyme, a chemical barrier, not the acid mantle."}, {"t": "A cloud of bactericidal chemicals that a neutrophil secretes around itself when prompted to phagocytose.", "c": false, "r": "The bactericidal cloud is a neutrophil killing zone during phagocytosis, a second-line event."}], "tp": "Acid mantle = skin acid coating from sebaceous and sweat glands. Lysozyme is the enzyme in tears, saliva, and perspiration. [Framework: Nursing Process/ADPIE]", "kt": ["Acid mantle", "Lysozyme"]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "A phagocyte squeezes between the endothelial cells of a capillary wall to reach infected tissue. The guide names this process:", "opts": [{"t": "Diapedesis: traveling neutrophils and monocytes pass through the tiny gaps in capillary walls and enter the tissue spaces.", "c": true, "r": "Diapedesis is defined exactly as this squeezing-through movement toward the infection site."}, {"t": "Chemotaxis: chemicals released by injured cells attract the phagocytes toward the injured site.", "c": false, "r": "Chemotaxis is the attraction (the scent trail); diapedesis is the physical passage through the capillary wall."}, {"t": "Agglutination: antibodies bound to antigens clump together so phagocytes can destroy them more easily.", "c": false, "r": "Agglutination is an antibody action in specific immunity, not a phagocyte movement."}, {"t": "Hyperemia: increased blood flow brings more blood, and more phagocytes, into the injured tissue.", "c": false, "r": "Hyperemia explains redness and heat in inflammation; it is not the squeezing through the capillary wall."}], "tp": "Diapedesis = squeeze through. Chemotaxis = follow the chemical scent. Do not swap the pair. [Framework: Nursing Process/ADPIE]", "kt": ["Diapedesis", "Chemotaxis"]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "Which sequence correctly describes how a phagocyte destroys a pathogen?", "opts": [{"t": "Pseudopods surround the pathogen and fuse, enclosing it; a lysosome then fuses with it and releases potent enzymes that destroy it.", "c": true, "r": "The guide's mechanics: false feet enclose, lysosome fuses, enzymes destroy."}, {"t": "The phagocyte secretes antibodies that bind the pathogen, and the clumped pathogen is then filtered out by the spleen.", "c": false, "r": "Phagocytes do not secrete antibodies; plasma cells do. Phagocytosis is direct eating and enzyme digestion."}, {"t": "Complement attaches first and punches holes, and the phagocyte only disposes of the already-dead pathogen.", "c": false, "r": "Complement can enhance phagocytosis, but the phagocyte's own method is pseudopod enclosure plus lysosomal enzymes."}, {"t": "The phagocyte traps the pathogen in mucus and cilia sweep it toward the throat to be coughed up.", "c": false, "r": "Mucus and cilia are first-line respiratory barriers, not the mechanism of phagocytosis."}], "tp": "Eat it in three moves: pseudopods enclose, lysosome fuses, enzymes destroy. [Framework: Nursing Process/ADPIE]", "kt": ["Phagocytosis"]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "Which pairing of an inflammation sign with its cause is correct?", "opts": [{"t": "Redness and heat result from vasodilation and increased blood flow (hyperemia); swelling results when histamine makes vessel walls leak fluid.", "c": true, "r": "The guide assigns each classic sign a mechanism: dilation/hyperemia for redness and heat, leaky walls for swelling, accumulated fluid and chemicals stimulating pain receptors for pain."}, {"t": "Redness and heat result from pus collecting under the skin; swelling results from blood vessels constricting in the injured tissue.", "c": false, "r": "Pus is dead cells and secretions, not the cause of redness; vessels dilate, not constrict, in inflammation."}, {"t": "Swelling results from pyrogens resetting the hypothalamus; pain results from complement punching holes in tissue cells.", "c": false, "r": "Pyrogens cause fever, and complement attacks bacterial membranes, not the body's own tissue cells."}, {"t": "Pain results from the walled-off abscess pressing on the skin surface; heat results from fever reaching the injured area.", "c": false, "r": "Pain comes from fluid and irritating chemicals stimulating pain receptors at the site, not from abscess pressure."}], "tp": "Sign-to-cause: red/hot = dilated vessels and hyperemia; swelling = leaky walls; pain = fluid and chemicals on pain receptors. [Framework: Nursing Process/ADPIE]", "kt": ["Inflammation", "Hyperemia"]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "multi", "stem": "Which statements about fever (pyrexia) are correct according to the guide? Select all that apply.", "opts": [{"t": "Pyrogens released by phagocytes stimulate the hypothalamus to reset the body's temperature upward.", "c": true, "r": "Fever starts when phagocyte-released pyrogens reset the hypothalamic thermostat."}, {"t": "A fever stimulates phagocytosis and decreases the ability of certain pathogens to multiply.", "c": true, "r": "Those are the guide's two stated benefits of fever."}, {"t": "Reducing a fever always shortens an infection and should be done at any elevation.", "c": false, "r": "The guide states the opposite concern: evidence suggests reducing fever prolongs an infection; only a very high fever must be reduced."}, {"t": "A very high fever must be reduced because high body temperature may cause severe, irreversible brain damage.", "c": true, "r": "That caution is stated word-for-word in the guide."}, {"t": "Seizures caused by an elevated body temperature are called febrile seizures and occur especially in children.", "c": true, "r": "Febrile (fever) seizures are the guide's named risk of high fever in children."}], "tp": "Fever helps twice (more phagocytosis, slower pathogens) but a very high fever must come down: brain damage and febrile seizures. [Framework: Safety First]", "kt": ["Fever (pyrexia)", "Pyrogens", "Febrile seizures"]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "Which statement correctly defines interferons?", "opts": [{"t": "Proteins secreted by virus-infected cells that diffuse to neighboring cells and prevent viral replication there.", "c": true, "r": "Interferons are the viral alarm; they were named because they interfered with viral replication, and they also activate NK cells and macrophages."}, {"t": "Proteins that circulate in inactive form and, once activated, punch holes in a bacterium's outer membrane.", "c": false, "r": "Hole-punching describes complement proteins, not interferons."}, {"t": "Chemicals secreted by helper T cells that activate cytotoxic T cells and B cells.", "c": false, "r": "Those chemicals are cytokines, part of specific immunity."}, {"t": "Antibodies secreted by plasma cells that clump antigens together for easier phagocytosis.", "c": false, "r": "Antibodies are immunoglobulins from plasma cells; interferons come from virus-infected cells themselves."}], "tp": "Interferon = infected cell warns the neighbors and blocks viral replication. Complement = punches holes in bacteria. [Framework: Nursing Process/ADPIE]", "kt": ["Interferons", "Complement proteins"]});
BANK.push({"cat": "First and Second Lines of Defense", "type": "single", "stem": "An abscess is best defined as:", "opts": [{"t": "A walled-off area of infected debris that restricts the spread of infection throughout the body.", "c": true, "r": "The wall the cells build around pus and debris is the abscess, and its benefit is containment."}, {"t": "The accumulation of dead phagocytes, injured cells, pathogens, and secretions at an infected site.", "c": false, "r": "That accumulation is pus; the abscess is the walled-off area built around it."}, {"t": "A surgical procedure in which infected tissue is lanced and drained to relieve pressure.", "c": false, "r": "Lancing and draining is a treatment for a large abscess, not the definition of the abscess itself."}, {"t": "The increased blood flow to injured tissue that causes the redness and heat of inflammation.", "c": false, "r": "Increased blood flow is hyperemia, an inflammation mechanism, not an abscess."}], "tp": "Pus is the debris; abscess is the wall around it. Containment is the benefit; large abscesses get lanced and drained. [Framework: Safety First]", "kt": ["Abscess", "Pus"]});
BANK.push({"cat": "Cells Involved in Immunity", "type": "single", "stem": "According to Table 21.1, which cell is correctly matched with its function?", "opts": [{"t": "Eosinophils destroy parasites; basophils secrete histamine, leukotrienes, and heparin; neutrophils perform phagocytosis.", "c": true, "r": "All three granular leukocyte matches are exactly as Table 21.1 lists them."}, {"t": "Eosinophils secrete antibodies; basophils destroy parasites; neutrophils secrete histamine and heparin.", "c": false, "r": "Antibodies come from plasma cells; parasites are the eosinophils' target; histamine and heparin come from basophils."}, {"t": "Neutrophils remember antigens; eosinophils perform phagocytosis; basophils kill cells in cell-to-cell combat.", "c": false, "r": "Memory belongs to memory B and T cells; cell-to-cell killing belongs to cytotoxic T cells."}, {"t": "Basophils present antigens to lymphocytes; neutrophils destroy parasites; eosinophils transform into macrophages.", "c": false, "r": "Antigen presentation is a macrophage role; monocytes, not eosinophils, transform into macrophages."}], "tp": "Granular trio from Table 21.1: neutrophils eat, basophils secrete histamine/leukotrienes/heparin, eosinophils destroy parasites. [Framework: Nursing Process/ADPIE]"});
BANK.push({"cat": "Cells Involved in Immunity", "type": "single", "stem": "Which statement about macrophages is correct?", "opts": [{"t": "They are found in almost all organs and tissues, perform phagocytosis, and present antigens to lymphocytes.", "c": true, "r": "Table 21.1 lists macrophages in almost all organs and tissues with both jobs: phagocytosis and antigen presentation."}, {"t": "They make up 70% to 80% of the blood's lymphocytes and attack antigens by cell-to-cell contact.", "c": false, "r": "The 70%-80% figure and direct attack describe T cells, not macrophages."}, {"t": "They are derived from B cells and secrete large quantities of antibodies into the blood.", "c": false, "r": "Antibody secretion is the plasma cell's job; macrophages come from monocytes."}, {"t": "They exist only inside the liver, where they are attached to the walls of the sinusoids.", "c": false, "r": "Only Kupffer cells are the liver's fixed macrophages; macrophages in general are in almost all organs and tissues."}], "tp": "Macrophages: everywhere, big eaters, and antigen presenters. Kupffer cells are just the liver's named fixed macrophages. [Framework: Nursing Process/ADPIE]", "kt": ["Macrophages", "Kupffer cells"]});

BANK.push({"cat": "Antigens, Antibodies, and Immune Responses", "type": "single", "stem": "Which statement correctly defines an antigen?", "opts": [{"t": "A substance, generally a large molecule and usually a protein, that stimulates the formation of antibodies.", "c": true, "r": "Antigen literally points to antibody generating; most antigens are proteins, a few are polysaccharides and lipids."}, {"t": "A protein secreted by plasma cells that binds to foreign substances and marks them for destruction.", "c": false, "r": "That is an antibody (immunoglobulin); an antigen is what stimulates antibody formation."}, {"t": "Any substance produced by the body itself that the immune system learns to tolerate before birth.", "c": false, "r": "Self substances are nonantigenic because of immunotolerance; antigens are the foreign substances attacked."}, {"t": "A chemical released by injured cells that attracts phagocytes to the site of an infection.", "c": false, "r": "Attracting phagocytes is chemotaxis; it is not the definition of an antigen."}], "tp": "Antigen = antibody generator. Antibody = the protein made in response. Never swap the pair. [Framework: Nursing Process/ADPIE]", "kt": ["Antigen"]});

BANK.push({"cat": "When Immunity Goes Wrong and Transplants", "type": "multi", "stem": "Which statements about immunity in older adults are correct according to the guide? Select all that apply.", "opts": [{"t": "T-cell and B-cell function is somewhat deficient, and macrophage activity is decreased.", "c": true, "r": "The guide's aging section states depressed lymphocyte function with decreased macrophage activity."}, {"t": "Older adults are more prone to infections and recover from them more slowly.", "c": true, "r": "That consequence is stated directly in the As You Age box."}, {"t": "Older adults often have a reduced fever response to infection.", "c": true, "r": "A blunted fever response is listed and makes combating infection harder."}, {"t": "Circulating autoantibodies decrease with age, so autoimmune disease becomes less likely.", "c": false, "r": "The guide states the opposite: autoantibody levels increase, partly explaining more autoimmune disease in older adults."}, {"t": "Depressed lymphocyte function may help explain the higher incidence of cancer in older adults.", "c": true, "r": "The guide offers exactly that link between depressed lymphocyte function and cancer incidence."}], "tp": "Aging immune system: weaker T, B, and macrophage function; slower recovery; blunted fever; MORE autoantibodies; possibly more cancer. [Framework: Acute vs Chronic]"});
/* ============ ENGINE (ES5) ============ */
var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 21: Immune System</h1>';
  h += '<div class="sub">Brutal mode | Herlihy, Anatomy & Physiology | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
