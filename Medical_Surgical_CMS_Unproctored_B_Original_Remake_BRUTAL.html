<body>

<script>
/* ============ QUESTION BANK ============ */
/* PN Medical Surgical CMS - ORIGINAL remake: original questions on the verified core PN Med-Surg blueprint. Not ATI questions. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CATS = ["Perioperative & Postoperative Care", "Cardiovascular Disorders", "Respiratory Disorders", "Neurologic & Sensory Disorders", "Renal, Urinary & Fluid-Electrolyte Balance", "Endocrine & Metabolic Disorders", "Gastrointestinal, Hepatic, Hematologic & Immune Disorders", "Musculoskeletal, Integumentary & Cancer Care"];
var KEYTERMS = [];

/* Part 1 — original items 1-15 (PN Medical Surgical CMS Unproctored Practice B remake) */

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is reinforcing preoperative teaching with a client who is scheduled for abdominal surgery at 7 a.m. tomorrow. The client has eaten normally today and asks about eating and drinking tonight. Which statement by the client indicates an understanding of the teaching?",
  opts: [
    O("I can have a light breakfast as long as it is before dawn.", false, "Solid food is stopped well before surgery, usually at midnight, because food in the stomach raises the risk of aspiration during anesthesia."),
    O("I will stop eating and drinking at midnight tonight, including water.", true, "Remaining NPO from midnight, including water, keeps the stomach empty and lowers the risk of aspiration while the client is under anesthesia."),
    O("I may chew gum and sip water during the morning hours.", false, "Chewing gum and sipping water both count as intake and stimulate gastric secretions, so they are not allowed once the NPO period begins."),
    O("I will take my morning pills with a full glass of milk.", false, "A full glass of milk is a sizable intake that fills the stomach before anesthesia. Any essential morning medication is taken only as directed, with tiny sips of water.")
  ],
  fw: "Safety — aspiration prevention before anesthesia",
  tp: "NPO from midnight includes water, gum, and candy. An empty stomach is the protection against aspiration during anesthesia." });

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is assisting with preoperative care for a client who is scheduled for a colon resection. The nurse witnessed the client sign the consent form an hour ago. The client now says, 'I signed the paper, but I still do not really know what they are going to do to me.' Which action should the nurse take?",
  opts: [
    O("Explain the procedure and its risks to the client in detail.", false, "Explaining the procedure, its risks, and its alternatives is the provider's responsibility. The PN does not take over that teaching when a client reports not understanding."),
    O("Witness that the signature is complete and proceed as scheduled.", false, "A signature on the form does not settle the matter when the client states the procedure is still not understood. Proceeding would ignore information the nurse just collected."),
    O("Report the client's concern to the RN and the provider promptly.", true, "The PN who witnesses a signature also reports when the client says the procedure is not understood, so the provider can re-explain it before surgery proceeds."),
    O("Document the concern in the chart and proceed as scheduled.", false, "Charting the concern without reporting it leaves the problem unresolved while surgery moves forward. The concern must reach the RN and provider before the procedure.")
  ],
  fw: "Coordinated care — report data that changes the plan",
  tp: "PN role in consent: witness the signature, confirm the client says the procedure was explained, and report any stated lack of understanding to the RN and provider." });

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is assisting with the care of a client who is 2 days postoperative following bowel surgery. Data collected: bowel sounds are absent, the abdomen is distended and firm, the client reports nausea and has passed no flatus since surgery. Which contribution should the nurse make to the plan of care?",
  opts: [
    O("Offer clear liquids to stimulate bowel activity again.", false, "Oral fluids in a client with absent bowel sounds, distention, and nausea will collect in a non-moving bowel and can lead to vomiting and aspiration."),
    O("Encourage a high-fiber meal to move the bowel contents.", false, "Solid food and fiber cannot move through a bowel that is not functioning and will worsen the distention this client already shows."),
    O("Keep the client NPO and report the findings promptly.", true, "Absent bowel sounds with distention, nausea, and no flatus suggest a postoperative ileus. Keeping the client NPO and reporting the data protects the client while the provider directs treatment."),
    O("Insert a rectal tube to relieve the abdominal pressure.", false, "A rectal tube does not correct a paralyzed small bowel, and inserting one is not an independent action for this set of findings.")
  ],
  fw: "Nursing process — data collection before implementation",
  tp: "Postoperative ileus picture: silent abdomen, distention, nausea, no flatus. Response: NPO, report, and expect measures such as an NG tube per provider orders." });

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is collecting data from a client who is 5 days postoperative following abdominal surgery. The client's temperature is 38.6 C (101.5 F), and the incision is being checked before the dressing change. Which finding should the nurse report to the provider immediately?",
  opts: [
    O("Mild itching along the incision line during the shift.", false, "Mild itching along a healing incision is a common healing sensation and does not by itself signal a complication needing an immediate report."),
    O("Purulent drainage from the incision with surrounding warmth.", true, "Thick, cloudy drainage with warmth around the incision on day 5, together with the fever this client has, points to a wound infection that the provider needs to hear about now."),
    O("A small amount of thin, pink drainage on the dressing.", false, "A small amount of thin pink drainage is an expected finding in the first days after surgery and is monitored rather than reported as an emergency."),
    O("Decreased appetite reported by the client at breakfast.", false, "A reduced appetite several days after abdominal surgery is common and is addressed with routine nutritional support, not an immediate provider report.")
  ],
  fw: "Reduction of risk — separate infection data from expected healing data",
  tp: "Wound infection data set: fever around day 4 to 5, redness, warmth, swelling, rising pain, and purulent drainage. Report the cluster, not normal healing signs." });

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is reinforcing teaching with a client who is using a patient-controlled analgesia pump after surgery. The client can press the button for preset doses and asks how the pump should be used at home in the hospital bed tonight. Which statement by the client indicates an understanding of the teaching?",
  opts: [
    O("I should press the button when I start to feel pain.", true, "Pressing the button as pain begins keeps pain controlled at a lower level. Waiting until pain is severe makes it harder to bring back under control."),
    O("My spouse can press the button for me while I sleep.", false, "Only the client presses the button. A sleeping client who receives doses pressed by someone else can be over-sedated because the built-in safety check of being awake is lost."),
    O("I should wait until the pain is severe before pressing.", false, "Severe pain is much harder to control once established. The teaching is to dose when pain starts, not to endure it first."),
    O("I can override the lockout when I need an extra dose.", false, "The lockout interval is a safety feature that cannot be overridden by the client. It limits how often a dose can be delivered.")
  ],
  fw: "Medication safety — teach the safety features with the device",
  tp: "PCA rules: only the client presses, press when pain starts, and the lockout interval is a safety limit that stays in place." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is assisting with the care of a client who is 2 days postoperative following a total hip replacement. The nurse collects the following data: sudden shortness of breath, respiratory rate 28/min, heart rate 122/min, blood pressure 96/60 mm Hg, and a report of sharp chest pain when breathing in. Which action should the nurse take first?",
  opts: [
    O("Encourage the client to ambulate to improve circulation.", false, "Walking a client with sudden dyspnea, chest pain, tachycardia, and hypotension increases oxygen demand on an already compromised circulation and delays urgent treatment."),
    O("Sit the client up and report the findings to the provider.", true, "Sudden dyspnea, pleuritic chest pain, tachycardia, and hypotension after hip surgery suggest a pulmonary embolism. Sitting the client up eases breathing while the findings are reported for emergency treatment."),
    O("Give the prescribed oral pain medication and reassess later.", false, "Pain medication does not address a blocked pulmonary vessel, and waiting to reassess loses the window for anticoagulation and oxygen support."),
    O("Massage the client's calves to move any clot that formed.", false, "Massaging the calves of a client with a suspected clot can loosen it and send it to the lungs. Calf massage is avoided when a deep vein clot is suspected.")
  ],
  fw: "ABCs — breathing emergency data outranks routine comfort measures",
  tp: "Pulmonary embolism after hip surgery: sudden dyspnea, pleuritic pain, racing heart, falling pressure. Sit up, report at once, and never massage the calves." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is assisting with the care of a client who returned to the unit 1 hour ago following a bronchoscopy. The client is awake, vital signs are stable, and the client asks for a drink of water because the throat feels dry. Which finding must the nurse confirm before offering oral fluids?",
  opts: [
    O("The client reports feeling hungry after fasting.", false, "Hunger shows the client is awake and interested in intake, but it says nothing about whether the throat can protect the airway during swallowing."),
    O("The gag reflex has returned when tested gently.", true, "Local anesthetic used for a bronchoscopy numbs the throat and removes the gag reflex for a time. Fluids are withheld until the gag reflex returns so the client does not aspirate."),
    O("The client's oxygen saturation reads in normal range.", false, "A normal saturation is reassuring about oxygenation, but it does not show that the swallowing and gag mechanisms have recovered from the anesthetic."),
    O("The client can speak in a normal speaking voice.", false, "Speaking uses the vocal cords, which can work while the gag reflex is still absent. Voice quality is not the safety check for swallowing.")
  ],
  fw: "Safety — verify the protective reflex before the intake",
  tp: "After bronchoscopy: NPO until the gag reflex returns. Test the reflex first; hunger, voice, and saturation do not prove safe swallowing." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is collecting data from a client who has chronic obstructive pulmonary disease and is receiving oxygen by nasal cannula. A family member raised the flow rate to 5 L/min an hour ago because the client 'looked short of breath.' The nurse enters the room an hour later to collect the client's scheduled data. Which finding should the nurse report to the provider immediately?",
  opts: [
    O("Respiratory rate of 9/min with increasing drowsiness.", true, "A client with COPD who becomes drowsy with a respiratory rate of 9 after the oxygen flow was raised is showing carbon dioxide retention and respiratory depression, which must be reported at once."),
    O("Oxygen saturation of 93% on the current flow setting.", false, "A saturation of 93% falls within the target range commonly aimed for in COPD. The number alone is not the emergency in this data set."),
    O("Complaint of dryness inside the nose from the cannula.", false, "Nasal dryness is a comfort issue managed with humidification or water-soluble lubricant. It is not a priority finding compared with a falling respiratory rate."),
    O("Barrel-shaped chest noted during the morning rounds.", false, "A barrel chest is a long-standing structural change of chronic COPD. It is expected baseline data, not a new finding to report immediately.")
  ],
  fw: "ABCs — report the ventilatory failure data, not the chronic baseline",
  tp: "COPD oxygen caution: too much oxygen can blunt the drive to breathe. Drowsiness plus a respiratory rate under 12 is the report-now picture." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is reinforcing teaching with a client who will collect a sputum specimen for culture in the morning. The client will start an antibiotic after the specimen is obtained and asks when and how to collect it. Which instruction should the nurse include in the teaching?",
  opts: [
    O("Collect the specimen after breakfast and mouthwash.", false, "Eating and using mouthwash before collection contaminate or dilute the specimen and can kill organisms the laboratory is trying to grow."),
    O("Rinse with antiseptic mouthwash right before collecting.", false, "Antiseptic mouthwash can destroy the very organisms the culture is meant to identify, producing a misleading negative result."),
    O("Collect the specimen in the morning before the antibiotic dose.", true, "Sputum pools overnight, so an early-morning specimen is the richest sample, and collecting it before the antibiotic starts keeps the drug from suppressing the organisms being cultured."),
    O("Collect saliva in the cup a little at a time all day.", false, "Saliva is not sputum. The laboratory needs deep respiratory secretions coughed up from the lungs, collected at one time, not pooled saliva.")
  ],
  fw: "Diagnostics — protect the specimen before the treatment starts",
  tp: "Sputum culture: early morning, deep cough, rinse with water only, and collect before antibiotics begin whenever the timing allows." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is collecting data from a client who has a chest tube in place for a pneumothorax. While checking the drainage system, the nurse notes continuous bubbling in the water-seal chamber that does not stop between breaths. How should the nurse interpret and act on this finding?",
  opts: [
    O("It suggests an air leak and should be reported promptly.", true, "Continuous bubbling in the water-seal chamber means air is leaking into the system from the client or a connection. The connections are checked and the finding is reported so the leak is found."),
    O("It shows the lung has fully expanded during the shift.", false, "Lung re-expansion is shown by improved breathing and the water level settling, not by constant bubbling. Continuous bubbling points the other way, toward a leak."),
    O("It means the suction level needs to be increased today.", false, "Raising suction does not repair a leak and can add stress to lung tissue. The response is to check the system and report, not to change the suction setting."),
    O("It requires clamping the tube until the provider arrives.", false, "Clamping a chest tube can trap air in the chest and create a tension pneumothorax. The tube is not clamped as a response to bubbling.")
  ],
  fw: "Reduction of risk — read the drainage system data correctly",
  tp: "Water-seal rules: gentle fluctuation with breathing is expected; continuous bubbling is an air leak to check and report. Never clamp as a reflex." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is contributing to the plan of care for a client who had a total laryngectomy yesterday. The client is alert, breathing through a stoma, and is frustrated because attempts to speak produce no sound. Which intervention should the nurse recommend including in the plan?",
  opts: [
    O("Teach the client to whisper softly to protect the new stoma.", false, "After a total laryngectomy the vocal cords are removed and air no longer passes through them, so whispering cannot produce sound. This suggestion sets the client up to fail."),
    O("Cover the stoma opening each time the client tries to speak.", false, "The stoma is the client's airway. Covering it blocks breathing and does not restore speech, since the voice structures were removed."),
    O("Provide a communication board and keep the call light nearby.", true, "A communication board or writing tablet gives the client a working way to communicate now, and the call light within reach lets the client summon help without a voice."),
    O("Limit visitors until the client learns esophageal speech.", false, "Speech rehabilitation takes time, and isolating the client in the meantime harms coping. Communication aids and support are used from the start.")
  ],
  fw: "Psychosocial integrity — restore communication while healing proceeds",
  tp: "After total laryngectomy there is no voice from the cords. Start with a communication board, writing tools, and the call light in reach; speech training comes later." });

BANK.push({ cat: "Neurologic & Sensory Disorders", type: "multi",
  stem: "A nurse is assisting with the care of a client who was admitted yesterday with a head injury and is being monitored for rising pressure inside the skull. During evening rounds the nurse collects new data on the client. Which of the following findings should the nurse report to the provider? Select all that apply.",
  opts: [
    O("Vomiting that occurs without nausea beforehand.", true, "Projectile vomiting without warning nausea is a classic sign of rising intracranial pressure, because pressure on the brain's vomiting center triggers it directly."),
    O("Pupil on one side larger than the other pupil.", true, "A newly unequal pupil signals pressure affecting the nerve that controls pupil size and is one of the most urgent neurologic changes to report."),
    O("Temperature of 37.4 C (99.3 F) during the evening check.", false, "This temperature sits within the normal range and, by itself, is routine data. It does not belong to the pressure-rising picture in this client."),
    O("Widening pulse pressure with a slowing heart rate.", true, "A widening gap between systolic and diastolic pressures together with a slowing pulse is part of the late pressure response and must be reported."),
    O("Heart rate of 88/min with a regular rhythm noted.", false, "A heart rate of 88 with a regular rhythm is an unremarkable finding. The concerning pattern here would be a slowing rate paired with rising pressure readings."),
    O("Client reports feeling tired and wants to rest.", false, "Wanting to rest in the evening is ordinary. The reportable changes in level of alertness are new drowsiness, difficulty arousing, or confusion beyond baseline.")
  ],
  fw: "Clinical judgment — recognizing cues of rising intracranial pressure",
  tp: "Report-now ICP set: projectile vomiting, unequal pupils, widening pulse pressure with slowing heart rate, and falling level of consciousness." });

BANK.push({ cat: "Neurologic & Sensory Disorders", type: "order",
  stem: "A nurse is assisting with the care of a client who has a spinal cord injury above the mid-chest level. The nurse collects this data: blood pressure 210/110 mm Hg, pounding headache, flushed face, and sweating above the injury. Place the nurse's actions in the order they should be performed.",
  items: [
    { t: "Raise the head of the bed so the client is sitting upright", r: "Sitting the client up is the opening move because gravity helps lower the blood pressure while the trigger is hunted down." },
    { t: "Loosen tight clothing and any constrictive items on the body", r: "Removing constrictive items eliminates stimuli that can keep driving the reflex response that is pushing the pressure up." },
    { t: "Check the urinary catheter and bladder for a blockage or fullness", r: "A full bladder or kinked catheter is the most common trigger of this emergency, so the bladder is checked once the client is upright." },
    { t: "Notify the provider and report the blood pressure and findings", r: "With the client positioned and the likely trigger checked, the provider receives the pressure reading and the data collected so far." },
    { t: "Recheck the blood pressure after the bladder has been checked", r: "A repeat reading shows whether the pressure is falling after the trigger hunt, and that trend guides the provider's next orders." }
  ],
  fw: "ABCs and circulation — position first, then remove the trigger",
  tp: "Autonomic dysreflexia order: sit the client up, loosen clothing, check the bladder, notify the provider, then recheck the pressure." });

BANK.push({ cat: "Neurologic & Sensory Disorders", type: "single",
  stem: "A nurse is reinforcing teaching with a client who has migraine headaches twice a month and takes a prescribed preventive medication daily. The client describes a typical attack beginning with flashing lights followed by one-sided throbbing pain. Which statement by the client indicates an understanding of the teaching?",
  opts: [
    O("I should exercise vigorously to push through an attack quickly.", false, "Vigorous exercise during an attack intensifies the throbbing pain and nausea. Rest in a quiet setting is the taught response."),
    O("I will keep bright lights on so my eyes adjust to the glare.", false, "Bright light worsens migraine discomfort. Sensitivity to light is part of the attack, and exposure is reduced rather than increased."),
    O("I will lie down in a dark, quiet room when one starts.", true, "Resting in a dark, quiet room reduces the light and sound stimulation that intensify migraine pain while the prescribed medication takes effect."),
    O("I should skip my prescribed preventive dose on good days.", false, "Preventive medication works only when taken daily as prescribed, including pain-free days. Skipping doses on good days removes the protection.")
  ],
  fw: "Patient teaching — match the self-care plan to the attack pattern",
  tp: "Migraine self-care: dark, quiet room, rest, and the prescribed medication at the start. Preventive doses are taken every day, not only on bad days." });

BANK.push({ cat: "Neurologic & Sensory Disorders", type: "single",
  stem: "A nurse is reinforcing dietary teaching with a client who has Meniere disease and reports episodes of vertigo, ringing in one ear, and fluctuating hearing loss in that ear. The client cooks at home and asks how to season food. Which instruction should the nurse include in the teaching?",

  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together. Answer choices always shuffle, even when question shuffle is off.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  if (t === "calc") { return "Calculate and enter the number."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else if (q.type === "calc") {
    h += '<div class="stem">' + q.stem + '</div>';
    h += '<div><input class="calcinput" type="number" step="any" inputmode="decimal" value="' + (r === "" || r === null ? "" : r) + '"' + (lock ? ' disabled' : '') + ' oninput="pickC(this.value)"> <span style="font-size:16px">' + q.unit + '</span></div>';
    if (fb) { h += '<div class="fbx" style="margin-top:8px">Correct answer: ' + q.ans + ' ' + q.unit + '</div>'; }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
    h += '<div class="fw"><b>Priority framework:</b> ' + q.fw + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickC(v) { if (isLocked()) { return; } S.resp[S.cur] = v; updateBars(); }
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
</html>
