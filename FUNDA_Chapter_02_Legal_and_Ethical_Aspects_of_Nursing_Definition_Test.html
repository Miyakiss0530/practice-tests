/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Standards, Scope, and Patients' Rights";
var CB = "Consent, Confidentiality, and Records";
var CC = "Abuse Reporting, Insurance, and Discipline";
var CD = "Ethics, Values, and Advance Directives";
var CATS = [CA, CB, CC, CD];

 CA: {

 },
 CB: {

  }
 },
 CC: {

 },
 CD: {

 }
};
BANK.push({ cat: CA, type: "single", stem: "Which statement about standards of care is accurate?", opts: [{"t": "Standards define acts that are required, permitted, or prohibited in practice", "c": true, "r": "Correct. Standards of care define required, permitted, and prohibited acts."}, {"t": "Standards apply only inside large hospitals and teaching facilities", "c": false, "r": "Wrong. Standards follow state law and apply to practicing nurses generally."}, {"t": "Standards are set by each nurse for his or her own daily practice", "c": false, "r": "Wrong. Standards derive from laws, regulations, and professional organizations."}, {"t": "Standards can be ignored safely when a unit is very short-staffed", "c": false, "r": "Wrong. Short staffing increases liability risk rather than removing standards."}], tp: "Standards of care come from federal and state laws plus bodies such as the ANA and CNA." });
BANK.push({ cat: CA, type: "single", stem: "A nurse practice act is best described as which of the following?", opts: [{"t": "The law that formally defines and limits the scope of nursing practice", "c": true, "r": "Correct. Nurse practice acts formally define and limit the scope of practice."}, {"t": "A hospital policy manual covering schedules, breaks, and dress codes", "c": false, "r": "Wrong. That is an institutional policy manual, not a state practice act."}, {"t": "A professional code describing ethical duties owed to patients", "c": false, "r": "Wrong. That describes a code of ethics, not a practice act."}, {"t": "A federal insurance law governing disclosure of health information", "c": false, "r": "Wrong. That describes HIPAA, not a state nurse practice act."}], tp: "Every state, province, and territory has a nurse practice act; specifics vary by region." });
BANK.push({ cat: CA, type: "single", stem: "In a liability case, the nurse's actions are judged by comparison with which standard?", opts: [{"t": "Actions of a reasonably prudent nurse of similar education and experience", "c": true, "r": "Correct. The legal test compares the nurse with a reasonably prudent nurse of similar background."}, {"t": "Actions of the most experienced nurse employed on that hospital unit", "c": false, "r": "Wrong. The test uses a hypothetical prudent nurse, not the unit's most senior nurse."}, {"t": "Actions the nurse's own supervisor says she would have taken herself", "c": false, "r": "Wrong. A supervisor's personal opinion is not the legal comparison standard."}, {"t": "Actions of a physician managing the same patient at the same time", "c": false, "r": "Wrong. Nursing care is judged against a nursing standard, not a physician's actions."}], tp: "Nursing liability falls into practice, monitoring, and communication, judged by the reasonably prudent nurse test." });
BANK.push({ cat: CA, type: "single", stem: "Which statement about an employer's policies and the nurse practice act is accurate?", opts: [{"t": "An institution may limit practice further, but only within the state act", "c": true, "r": "Correct. Institutions may set policies within the confines of the state nurse practice act."}, {"t": "An institution may expand practice beyond what the state act allows", "c": false, "r": "Wrong. Institutional policy cannot widen practice past the state act."}, {"t": "An institution's policies replace the state act for its own employees", "c": false, "r": "Wrong. The state act still governs; the institution works within it."}, {"t": "An institution has no right to set policies for nursing activities", "c": false, "r": "Wrong. Institutions do have the right to establish policies and procedures."}], tp: "Know the practice act for your region; a free copy is available from the state board of nursing." });
BANK.push({ cat: CA, type: "multi", stem: "Which resources may a court use as evidence of the nursing standard of care? Select all that apply.", opts: [{"t": "Agency policy and procedure manuals used in the practice setting", "c": true, "r": "Correct. Agency manuals are listed evidence of nursing standards."}, {"t": "State nurse practice acts and the regulations that accompany them", "c": true, "r": "Correct. State practice acts and regulations are listed evidence."}, {"t": "Expert nurse witnesses, other experts, and testimony from peers", "c": true, "r": "Correct. Expert witnesses and peers are listed evidence sources."}, {"t": "Private opinions a nurse posts about a case on social media sites", "c": false, "r": "Wrong. Social media opinions are not listed evidence of the standard of care."}, {"t": "A patient's personal preference for how care should have been given", "c": false, "r": "Wrong. Patient preference alone is not listed evidence of the standard."}], tp: "Box 2.6 lists Joint Commission criteria, ANA documents, literature, education, experience, and more." });
BANK.push({ cat: CA, type: "single", stem: "In Darling v. Charleston Community Memorial Hospital, the court held that:", opts: [{"t": "Nurses were liable with the physician for failure to meet standards of care", "c": true, "r": "Correct. The Illinois Supreme Court held the nurses liable along with the physician."}, {"t": "Only the physician was liable because nurses follow physician orders", "c": false, "r": "Wrong. The nurses were held liable along with the physician."}, {"t": "No one was liable because the injury resulted from the fracture itself", "c": false, "r": "Wrong. Liability followed the failure to adhere to standards of care."}, {"t": "The hospital alone was liable and individual nurses were fully protected", "c": false, "r": "Wrong. The nursing staff themselves were held liable in the case."}], tp: "In Darling, nurses noted edematous, discolored toes and decreased feeling, gangrene followed, and the leg was amputated." });
BANK.push({ cat: CA, type: "single", stem: "Which is an example of a breach of the standard of care in the practice area?", opts: [{"t": "Practicing outside scope by writing orders instead of obtaining them", "c": true, "r": "Correct. Box 2.5 lists obtaining orders, not writing them, under practice breaches."}, {"t": "Restocking the crash cart promptly after it has been used on a code", "c": false, "r": "Wrong. Failure to restock is the breach; restocking is correct practice."}, {"t": "Honouring a patient's advance directive when planning daily care", "c": false, "r": "Wrong. Failure to honor advance directives is listed as a breach."}, {"t": "Detecting a documented allergy before a medication is administered", "c": false, "r": "Wrong. Failure to detect an allergy is the listed breach."}], tp: "Box 2.5 groups breaches under practice, monitoring, and communication." });
BANK.push({ cat: CA, type: "single", stem: "Which failure belongs in the monitoring area of Box 2.5?", opts: [{"t": "Failure to recognize and report signs of a deteriorating condition", "c": true, "r": "Correct. Recognizing and reporting deterioration is a monitoring duty."}, {"t": "Failure to document the chart in a timely and proper fashion", "c": false, "r": "Wrong. Timely documentation is listed under communication."}, {"t": "Failure to take an accurate and thorough history on admission", "c": false, "r": "Wrong. Taking the history is listed under practice."}, {"t": "Failure to properly give discharge instructions before discharge", "c": false, "r": "Wrong. Discharge instructions are listed under communication."}], tp: "Monitoring breaches include drug toxicity signs, polypharmacy effects, decubitus ulcers, and restraint use." });
BANK.push({ cat: CA, type: "multi", stem: "Which statements about patients' rights documents are accurate? Select all that apply.", opts: [{"t": "The AHA developed the Patient's Bill of Rights in 1972 for patients", "c": true, "r": "Correct. The AHA developed the Patient's Bill of Rights in 1972."}, {"t": "The 2003 modified version is called The Patient Care Partnership", "c": true, "r": "Correct. The 2003 version carries that name."}, {"t": "Mental health and pregnant patient bills of rights became law in 1980", "c": true, "r": "Correct. Both were adopted into law in 1980."}, {"t": "The Patient Care Partnership was written by The Joint Commission", "c": false, "r": "Wrong. It is the AHA document; The Joint Commission publishes Know Your Rights."}, {"t": "The Patient's Bill of Rights has never been revised since 1972", "c": false, "r": "Wrong. It has undergone revisions, including the 2003 version."}], tp: "The Joint Commission accredits more than 19,000 facilities and publishes the Know Your Rights brochure." });
BANK.push({ cat: CA, type: "single", stem: "Health care institutions are obligated to uphold the patient's right to:", opts: [{"t": "Access to health care without prejudice and treatment with dignity", "c": true, "r": "Correct. Access without prejudice and respectful, dignified treatment are listed rights."}, {"t": "A private room and a personal nurse for every shift of the stay", "c": false, "r": "Wrong. A private room and personal nurse are not listed institutional obligations."}, {"t": "Free treatment whenever the patient cannot afford to pay charges", "c": false, "r": "Wrong. Free treatment is not among the five listed rights."}, {"t": "Choice of any provider regardless of licensure or credentials held", "c": false, "r": "Wrong. That choice is not among the rights institutions must uphold."}], tp: "The five rights: access without prejudice, respect and dignity, privacy and confidentiality, personal safety, and complete information." });
BANK.push({ cat: CB, type: "single", stem: "The doctrine of informed consent requires full disclosure of which content?", opts: [{"t": "Benefits, risks, alternatives, and consequences of refusing treatment", "c": true, "r": "Correct. The patient must understand benefits, risks, alternatives, and refusal consequences."}, {"t": "The provider's training history, salary, and years in clinical practice", "c": false, "r": "Wrong. Provider biography is not part of the required disclosure."}, {"t": "Names of other patients who had the same procedure performed earlier", "c": false, "r": "Wrong. Other patients' information is confidential and not part of consent."}, {"t": "The hospital's cost for the procedure compared with other hospitals", "c": false, "r": "Wrong. Comparative hospital costs are not part of the required disclosure."}], tp: "Disclosure must be in nontechnical terms and in a language the patient can understand." });
BANK.push({ cat: CB, type: "single", stem: "Performing an invasive procedure without informed consent may result in:", opts: [{"t": "Civil liability for battery, the unlawful touching of another person", "c": true, "r": "Correct. Failure to secure consent may bring civil liability for battery."}, {"t": "Criminal charges in every case, even when no harm was intended", "c": false, "r": "Wrong. The chapter frames this as civil battery; intent to harm is not necessary."}, {"t": "No liability at all if the procedure helped the patient's condition", "c": false, "r": "Wrong. A good outcome does not erase the unlawful touching."}, {"t": "Liability only for the hospital and never for individual providers", "c": false, "r": "Wrong. Civil battery liability can attach to the person who acted."}], tp: "Civil, or technical, battery needs no intent to harm." });
BANK.push({ cat: CB, type: "single", stem: "Which minor may consent to treatment under the criteria in this chapter?", opts: [{"t": "A minor who is married or who serves in the armed forces", "c": true, "r": "Correct. Marriage and armed forces service are listed consent criteria for minors."}, {"t": "Any minor who is able to explain the treatment in simple words", "c": false, "r": "Wrong. Explaining the treatment is not a listed consent criterion."}, {"t": "Any minor whose friend or sibling is over eighteen years of age", "c": false, "r": "Wrong. A sibling's age is not a listed consent criterion."}, {"t": "Any minor who has a part-time job after school each weekday", "c": false, "r": "Wrong. Employment alone is not among the listed criteria."}], tp: "Other criteria: court-approved emancipation and living apart from parents for at least 60 days, independent of support." });
BANK.push({ cat: CB, type: "multi", stem: "In which situations may a minor consent to care as described in this chapter? Select all that apply.", opts: [{"t": "Treatment for a sexually transmitted infection needing care", "c": true, "r": "Correct. STI treatment is a listed minor-consent situation."}, {"t": "Treatment related to drug and alcohol abuse concerns", "c": true, "r": "Correct. Drug and alcohol abuse treatment is listed."}, {"t": "Care related to sexual assault and to family planning", "c": true, "r": "Correct. Both are listed minor-consent situations."}, {"t": "Elective cosmetic surgery requested without parental knowledge", "c": false, "r": "Wrong. Cosmetic surgery is not a listed minor-consent situation."}, {"t": "Routine dental cleaning scheduled at a private dental office", "c": false, "r": "Wrong. Routine dental cleaning is not a listed situation."}], tp: "Consent generally requires age 18 plus competence: sound mind, not impaired by alcohol or drugs." });
BANK.push({ cat: CB, type: "single", stem: "What is the nurse's role when a patient signs an informed consent form?", opts: [{"t": "The nurse's role is limited to witnessing the patient's signature only", "c": true, "r": "Correct. The nurse witnesses the signature; providing disclosure is not the nurse's role."}, {"t": "The nurse explains all risks, benefits, and alternatives to the patient", "c": false, "r": "Wrong. The provider performing the procedure gives that information."}, {"t": "The nurse decides whether the patient is competent to sign the form", "c": false, "r": "Wrong. Competence determination follows a legal process, not the witness."}, {"t": "The nurse answers every unanswered question about the procedure", "c": false, "r": "Wrong. Unanswered questions go to the provider who will perform it."}], tp: "Providing disclosure information can place the nurse in a position of liability." });
BANK.push({ cat: CB, type: "single", stem: "Which statement about consent is accurate?", opts: [{"t": "Consent may be withdrawn or limited by the patient at any time", "c": true, "r": "Correct. Patients may withdraw or limit consent at any time."}, {"t": "Once a consent form is signed, consent cannot be changed again", "c": false, "r": "Wrong. A signed form does not remove the right to withdraw consent."}, {"t": "Consent can never be implied by a patient's actions or words", "c": false, "r": "Wrong. Consent may be implied by actions or verbalized."}, {"t": "Telephone consent is never permitted under any circumstances", "c": false, "r": "Wrong. Telephone consent is used, traditionally for emergencies, under facility policy."}], tp: "Coercion negates the spirit of informed consent; consent must be given freely." });
BANK.push({ cat: CB, type: "single", stem: "HIPAA requires health care providers who handle health information to:", opts: [{"t": "Provide reasonable administrative, technical, and physical safeguards", "c": true, "r": "Correct. HIPAA requires reasonable and appropriate safeguards of those three kinds."}, {"t": "Share information freely with any staff member who asks for it", "c": false, "r": "Wrong. Access is limited to a need-to-know basis."}, {"t": "Keep all health information only in paper charts in locked rooms", "c": false, "r": "Wrong. HIPAA covers information however it is kept, including electronically."}, {"t": "Post patient information where families can check it conveniently", "c": false, "r": "Wrong. HIPAA sets limits on who may look at and receive information."}], tp: "HIPAA passed in 1996; agencies had until 2003 to comply, and wrongful disclosure carries penalties." });
BANK.push({ cat: CB, type: "multi", stem: "Which items count as protected health information identifiers? Select all that apply.", opts: [{"t": "A patient's social security number and medical record number", "c": true, "r": "Correct. Both are listed identifiers in Box 2.7."}, {"t": "Full-face photographic images and biometric identifiers such as fingerprints", "c": true, "r": "Correct. Both appear on the 18-identifier list."}, {"t": "Admission and discharge dates, and ages of patients over 89 years", "c": true, "r": "Correct. Dates and ages over 89 are listed identifiers."}, {"t": "The name of the hospital where a patient received treatment", "c": false, "r": "Wrong. The facility name alone is not on the identifier list."}, {"t": "A general description of a diagnosis with no identifying details", "c": false, "r": "Wrong. A non-identifying general description is not an identifier."}], tp: "Box 2.7 lists 18 identifiers, from names and zip codes to URLs, IP addresses, and device serial numbers." });
BANK.push({ cat: CB, type: "single", stem: "Patient information on a unit should be accessed only by personnel who:", opts: [{"t": "Are directly involved in that individual's care, on a need-to-know basis", "c": true, "r": "Correct. Access is limited to those directly involved in the patient's care."}, {"t": "Work anywhere in the facility, regardless of their assigned unit", "c": false, "r": "Wrong. Working in the facility does not create a need to know."}, {"t": "Are curious about a neighbour or a public figure admitted nearby", "c": false, "r": "Wrong. Curiosity is never a need-to-know basis."}, {"t": "Supervise staff, even when they play no part in the patient's care", "c": false, "r": "Wrong. Supervisory status alone does not grant access."}], tp: "Confidentiality duties are not limited to the work shift, and violations can justify termination." });
BANK.push({ cat: CB, type: "single", stem: "Which statement about medical records is accurate?", opts: [{"t": "Medical records are not public documents and must be kept secure", "c": true, "r": "Correct. Records are not public documents; breaches risk legal liability."}, {"t": "Medical records become public documents once a lawsuit is filed", "c": false, "r": "Wrong. In a lawsuit both parties may use the record, but it is not public."}, {"t": "Chart entries may be temporary notes that staff revise informally", "c": false, "r": "Wrong. Entries must be permanent, accurate, complete, and legible."}, {"t": "Only the patient may ever use the medical record in a court case", "c": false, "r": "Wrong. Both parties in a lawsuit are permitted to use the record."}], tp: "Chart entries often show whether the standards of care were met." });

    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
