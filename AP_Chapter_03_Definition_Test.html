<script>
/* ============ QUESTION BANK (DEFINITION TEST - HERLIHY A&P CHAPTER 3: CELLS) ============ */
/* Definitions/meanings of the chapter's concepts: single-best ABCD + SATA, plus
   row-format dropdowns, one matrix, one ordering item. Facts only from the verified guide. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Cell Basics and Membrane";
var CB = "Nucleus, Cytoplasm and Organelles";
var CC = "Transport and Tonicity";
var CD = "Cell Cycle, Mitosis and Differentiation";
var CE = "Growth, Death and Cancer Concepts";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = ["cell","cytology","cell membrane","selectively permeable","nucleus","chromatin","mitochondria","cristae","ribosomes","Golgi apparatus","lysosomes","microvilli","cilia","flagellum","diffusion","osmosis","isotonic","hypotonic","hypertonic","hemolysis","mitosis","cytokinesis","G0 phase","differentiation","stem cells","apoptosis","necrosis","metastasis"];
var BLUEPRINT = {
  CA: { name: CA, count: 9, types: { single: 7, multi: 1, dropdown: 1 } },
  CB: { name: CB, count: 13, types: { single: 9, multi: 2, dropdown: 1, matrix: 1 } },
  CC: { name: CC, count: 13, types: { single: 10, multi: 2, dropdown: 1 } },
  CD: { name: CD, count: 9, types: { single: 7, dropdown: 1, order: 1 } },
  CE: { name: CE, count: 6, types: { single: 4, multi: 2 } }
};

/* ---------- CELL BASICS AND MEMBRANE ---------- */
BANK.push({ cat: CA, type: "single", kt: ["cell"],
  stem: "What is the definition of a cell?",
  opts: [
    O("The structural and functional unit of all living matter, the level from which all other levels are built", true, "Correct - the guide defines the cell exactly this way; it is both the structure and the working unit of living matter."),
    O("The smallest particle of an element that can exist alone, carrying the chemical properties of that element", false, "That describes an atom, a chemical level below the cell; atoms are not alive and are not the unit of living matter."),
    O("A group of similar cells working together at one job, forming the second level of body organization", false, "That describes a tissue, which is built FROM cells; a tissue is a level above the cell, not the cell itself."),
    O("The gel-like fluid found inside a cell but outside its nucleus, holding the cytosol and the organelles", false, "That is the cytoplasm, a part inside the cell; the cell is the whole living unit, not one of its contents.")
  ],
  tp: "ANSWER KEY: The structural and functional unit of all living matter. DETAILED RATIONALE: The cell is the basic living unit; atoms sit below it, tissues are built from it, and cytoplasm is only one part inside it. PRIORITY FRAMEWORK: Levels of Organization - place the term on the correct level before choosing." });

BANK.push({ cat: CA, type: "single", kt: ["cytology"],
  stem: "What does the term cytology mean?",
  opts: [
    O("The study of cellular structure and function", true, "Correct - cytology is the study of how cells are built and how they work."),
    O("The study of body tissues and their layers", false, "That is histology, the study of tissues; cytology works one level lower, at the single cell."),
    O("The pinching division of a cell into two cells", false, "That is cytokinesis, the final split of the cytoplasm; its similar sound is the trap in this item."),
    O("The fluid medium inside the cell, called cytosol", false, "Cytosol is the fluid the organelles float in; cytology is a field of study, not a substance.")
  ],
  tp: "ANSWER KEY: The study of cellular structure and function. DETAILED RATIONALE: Cytology studies cells; histology studies tissues, cytokinesis is a division event, and cytosol is a fluid - three sound-alike traps. PRIORITY FRAMEWORK: Terminology Precision - separate the study, the process, and the substance." });

BANK.push({ cat: CA, type: "single", kt: ["selectively permeable"],
  stem: "A membrane described as selectively permeable is one that:",
  opts: [
    O("Chooses which substances are allowed to enter or leave the cell", true, "Correct - selective permeability is the membrane's chief function: it selects what crosses."),
    O("Allows every substance to cross freely in both directions at will", false, "A freely open barrier would select nothing; the membrane is a gatekeeper, not an open door."),
    O("Blocks every substance from crossing until the cell begins dividing", false, "The membrane never seals completely; exchange continues throughout the cell's life, including division."),
    O("Lets water cross in one direction only, from inside toward outside", false, "Water crosses through pores in either direction as conditions dictate; direction is not fixed one-way.")
  ],
  tp: "ANSWER KEY: Chooses which substances are allowed to enter or leave the cell. DETAILED RATIONALE: 'Selectively' is the key word - the membrane chooses; it is neither fully open nor fully closed, and it does not fix water to one direction. PRIORITY FRAMEWORK: Terminology Precision - the qualifier word carries the meaning." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement correctly describes the composition of the cell membrane?",
  opts: [
    O("Primarily phospholipids and protein, with a small amount of carbohydrate, the phospholipids in two layers", true, "Correct - the lipid bilayer is phospholipid plus protein as the main ingredients, with a little carbohydrate."),
    O("Primarily carbohydrate and protein, with a small amount of phospholipid, the proteins arranged in two layers", false, "The main ingredients are reversed here: phospholipids, not carbohydrates, form the bulk and the double layer."),
    O("A single layer of phospholipids with no protein, coated on the outside by a thick layer of carbohydrate", false, "The phospholipids form TWO layers, and membrane proteins are essential - they support, bind, and form pores."),
    O("Primarily protein fibers and microtubules, with phospholipids filling only the small spaces between them", false, "Microtubules belong to the cytoskeleton inside the cell; they are not the membrane's main building material.")
  ],
  tp: "ANSWER KEY: Primarily phospholipids and protein, small amount of carbohydrate, phospholipids in two layers. DETAILED RATIONALE: Bilayer means two phospholipid layers; protein is a main ingredient, carbohydrate is minor, and microtubules are cytoskeleton, not membrane. PRIORITY FRAMEWORK: Structure-Function - name the parts in their printed order and proportion." });

BANK.push({ cat: CA, type: "single",
  stem: "Which pairing of substance and membrane route is correct?",
  opts: [
    O("Oxygen dissolves in the lipid portion; sodium and chloride must pass through the membrane pores", true, "Correct - lipid-soluble oxygen and carbon dioxide dissolve through the lipid layer, while water and charged substances use the pores."),
    O("Oxygen must pass through the membrane pores; sodium and chloride dissolve in the lipid portion", false, "The routes are swapped: charged substances cannot penetrate the lipid layer, and oxygen does not need a pore."),
    O("Oxygen and sodium both dissolve in the lipid portion; only pure water must pass through the pores", false, "Sodium is charged and water-soluble, so it cannot dissolve in lipid; it travels with water through the pores."),
    O("Oxygen and sodium both pass through the membrane pores; only carbon dioxide dissolves in the lipid", false, "Carbon dioxide is lipid-soluble like oxygen; grouping oxygen with the pore route misclassifies a lipid-soluble gas.")
  ],
  tp: "ANSWER KEY: Oxygen dissolves in lipid; sodium and chloride use the pores. DETAILED RATIONALE: Two sieves decide the route - solubility and pore size. Lipid-soluble gases dissolve through; water and charged ions cannot penetrate lipid and must use pores. PRIORITY FRAMEWORK: Structure-Function - solubility decides the route across the membrane." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about cell size and shape is correct according to the chapter?",
  opts: [
    O("A single nerve cell may measure 4 feet in length, while a red blood cell is tiny and Frisbee-shaped to bend through vessels", true, "Correct - the chapter's anchor contrast: nerve cells can be extremely long for signaling, and the RBC's bendable disc shape fits squeezing through tiny vessels."),
    O("All cells are microscopic and nearly identical in size, differing only in the number of organelles each one contains inside", false, "The chapter stresses that cells vary considerably in size, shape, and function - a nerve cell 4 feet long disproves 'all cells are tiny.'"),
    O("The red blood cell is the longest cell in the body, and its rigid shape lets it push through vessels without bending at all", false, "The RBC is tiny and bends precisely because it is flexible; length belongs to the nerve cell, not the red blood cell."),
    O("Cell shape is decorative and unrelated to function, since every cell performs the same jobs regardless of its size or form", false, "Structure and function are closely related in this chapter - shape fits the job, from the RBC's disc to the nerve cell's length.")
  ],
  tp: "ANSWER KEY: Nerve cell up to 4 feet; RBC tiny and Frisbee-shaped. DETAILED RATIONALE: Size and shape vary by job - length for rapid long-distance signals, a bendable disc for squeezing through vessels. The distractors deny variation, swap the two cells, or deny the structure-function rule. PRIORITY FRAMEWORK: Structure-Function - match each cell's form to the work it performs." });

BANK.push({ cat: CA, type: "single",
  stem: "Membrane proteins perform which set of functions?",
  opts: [
    O("Structural support, binding sites for hormones, and pores that form channels for water and dissolved substances", true, "Correct - these are the three protein jobs printed in the guide: support, hormone binding sites, and pore channels."),
    O("Production of ATP, synthesis of ribosomes, and digestion of waste material that collects inside the aging cell", false, "ATP production belongs to mitochondria, ribosome synthesis to the nucleolus, and waste digestion to lysosomes - not membrane proteins."),
    O("Storage of the genetic code, copying of chromosomes, and pulling of chromatids to opposite ends of the cell", false, "Genetic storage belongs to the nucleus and chromatin, and chromatid pulling belongs to the spindle - none are membrane protein roles."),
    O("Folding to increase surface area, sweeping mucus across the surface, and propelling the cell through fluid media", false, "Folding describes microvilli, sweeping describes cilia, and propelling describes the flagellum - surface projections, not membrane proteins.")
  ],
  tp: "ANSWER KEY: Support, hormone binding sites, and pore channels. DETAILED RATIONALE: Each distractor set steals jobs from other structures - mitochondria/nucleolus/lysosomes, nucleus/spindle, or microvilli/cilia/flagellum. PRIORITY FRAMEWORK: Structure-Function - keep each structure's job list separate." });

BANK.push({ cat: CA, type: "multi",
  stem: "Which statements about the cell membrane are correct? Select all that apply.",
  opts: [
    O("It is also called the plasma membrane.", true, "Correct - cell membrane and plasma membrane are two names for the same structure."),
    O("It separates intracellular material from extracellular material.", true, "Correct - holding the cell together, it forms the boundary between inside and outside material."),
    O("It holds the cell together physically.", true, "Correct - the guide lists physically holding the cell together among the membrane's roles."),
    O("It allows water and charged ions to dissolve directly through its lipid layer.", false, "Water and charged substances such as sodium and chloride CANNOT penetrate the lipid layer; they must use the pores."),
    O("It contains the cell's genetic information and controls protein synthesis.", false, "Genetic information and control of protein synthesis belong to the nucleus, not the membrane.")
  ],
  tp: "ANSWER KEY: Plasma membrane name, inside/outside separation, and holding the cell together. DETAILED RATIONALE: The two false statements assign the membrane a route it does not allow (lipid penetration by water and ions) and a job it does not hold (genetic control, which is the nucleus). PRIORITY FRAMEWORK: Structure-Function - credit the membrane only with its printed roles." });

BANK.push({ cat: CA, type: "dropdown",
  stem: "For each substance, choose the route it uses to cross the cell membrane.<br><br>Oxygen<br>[[0]]<br><br>Sodium<br>[[1]]<br><br>Carbon dioxide<br>[[2]]<br><br>Water<br>[[3]]",
  blanks: [
    { o: [O("Dissolves in the lipid portion of the membrane", true, "Oxygen is lipid-soluble, so it dissolves in the lipid portion and crosses directly."),
           O("Flows through the protein pores of the membrane", false, "Oxygen does not need the pores; as a lipid-soluble gas it dissolves through the lipid layer.")] },
    { o: [O("Flows through the protein pores of the membrane", true, "Sodium is charged and water-soluble; it cannot penetrate lipid and must use the pores."),
           O("Dissolves in the lipid portion of the membrane", false, "Charged substances cannot dissolve in the lipid layer; sodium crosses through the pores.")] },
    { o: [O("Dissolves in the lipid portion of the membrane", true, "Carbon dioxide, like oxygen, is lipid-soluble and dissolves through the lipid portion."),
           O("Flows through the protein pores of the membrane", false, "Carbon dioxide is a lipid-soluble gas; the pore route is for water and water-soluble substances.")] },
    { o: [O("Flows through the protein pores of the membrane", true, "Water is water-soluble and cannot penetrate the lipid layer, so it flows through the pores."),
           O("Dissolves in the lipid portion of the membrane", false, "Water cannot dissolve in or penetrate the lipid layer; its route is through the pores.")] }
  ],
  tp: "ANSWER KEY: Oxygen - lipid; sodium - pores; carbon dioxide - lipid; water - pores. DETAILED RATIONALE: Lipid-soluble gases dissolve through the bilayer; water and charged, water-soluble substances are blocked by lipid and must use protein pores. PRIORITY FRAMEWORK: Structure-Function - solubility sorts every substance into its one correct route." });

/* ---------- NUCLEUS, CYTOPLASM AND ORGANELLES ---------- */
BANK.push({ cat: CB, type: "single", kt: ["nucleus"],
  stem: "What is the definition of the nucleus?",
  opts: [
    O("The control center of the cell, containing the genetic information and controlling all protein synthesis", true, "Correct - the nucleus holds the genetic information and runs all protein synthesis."),
    O("The gel located inside the cell but outside the nucleus, which contains the cytosol and the organelles", false, "That is the cytoplasm; the nucleus is one of the two compartments, not the gel surrounding it."),
    O("The site of ATP production, folded inside so that the cell can make most of the energy the body spends", false, "That describes the mitochondria; the nucleus controls, it does not generate the cell's energy supply."),
    O("A stack of flattened sacs that finishes protein, wraps it in membrane, and packages the protein for export", false, "That is the Golgi apparatus; it finishes protein the nucleus directed, but it holds no genetic information.")
  ],
  tp: "ANSWER KEY: The control center holding genetic information and controlling protein synthesis. DETAILED RATIONALE: Cytoplasm is the surrounding gel, mitochondria make ATP, and the Golgi packages protein - only the nucleus stores the code and directs synthesis. PRIORITY FRAMEWORK: Structure-Function - control belongs to the structure holding the code." });

BANK.push({ cat: CB, type: "single",
  stem: "Which cell is the chapter's named exception to the rule that adult cells have a nucleus?",
  opts: [
    O("The mature red blood cell, which has no nucleus at all", true, "Correct - most adult cells have one nucleus; the mature RBC is the only exception the chapter names, with none."),
    O("The mature nerve cell, which has no nucleus at all", false, "Nerve cells do have a nucleus; their division limit comes from lacking centrioles, not from lacking a nucleus."),
    O("The mature sperm cell, which has no nucleus at all", false, "The sperm carries a nucleus with its genetic contribution; the chapter names only the mature RBC as nucleus-free."),
    O("The mature bone cell, which has no nucleus at all", false, "Bone cells are nucleated; the chapter uses them as the low-mitochondria example, not the no-nucleus example.")
  ],
  tp: "ANSWER KEY: The mature red blood cell. DETAILED RATIONALE: One nucleus is the rule for most adult cells and zero is the mature RBC exception; nerve, sperm, and bone cells keep their nuclei. PRIORITY FRAMEWORK: Terminology Precision - exceptions are tested exactly as printed, one cell only." });

BANK.push({ cat: CB, type: "single",
  stem: "What is the function of the nucleolus?",
  opts: [
    O("It synthesizes ribosomes, which move through the nuclear pores into the cytoplasm for protein synthesis", true, "Correct - the 'little nucleus' makes ribosomes (and RNA), which exit through the nuclear pores to run protein synthesis."),
    O("It stores the strands of DNA that carry the genetic code and coil into chromosomes when the cell divides", false, "DNA storage describes chromatin; the nucleolus builds ribosomes, it does not store the genetic code itself."),
    O("It produces most of the cell's ATP along folded membranes, supplying energy for the work of the whole cell", false, "ATP production belongs to the mitochondria at the cristae; the nucleolus has no energy-producing role."),
    O("It digests worn-out organelles and intracellular waste, keeping the inside of the cell clean and orderly", false, "House cleaning and digestion belong to the lysosomes; the nucleolus builds ribosomes for the protein line.")
  ],
  tp: "ANSWER KEY: It synthesizes ribosomes that exit through the nuclear pores. DETAILED RATIONALE: Chromatin stores DNA, mitochondria produce ATP, and lysosomes digest waste - the nucleolus's single printed job is ribosome synthesis. PRIORITY FRAMEWORK: Structure-Function - one structure, one defining job; resist sound-alike swaps." });

BANK.push({ cat: CB, type: "single", kt: ["chromatin"],
  stem: "Which statement correctly relates chromatin and chromosomes?",
  opts: [
    O("They are the same DNA: tangled filaments called chromatin in a nondividing cell, coiled tight as chromosomes in a dividing cell", true, "Correct - chromatin and chromosomes are two states of one substance, loose threads at rest and tight coils during division."),
    O("They are two different substances: chromatin carries the genetic code, while chromosomes are made only of protein and carry none", false, "Chromosomes are not a separate protein substance; they are chromatin itself, coiled - the DNA is present in both states."),
    O("Chromatin is found only in dividing cells, while chromosomes are found only in cells that have permanently stopped dividing", false, "The timing is reversed: chromatin is the nondividing form and chromosomes appear when the cell divides."),
    O("Chromatin is the fluid filling the nucleus, while chromosomes are the small bodies floating freely within that nuclear fluid", false, "The nuclear fluid is nucleoplasm; chromatin is the DNA strands themselves, not the fluid they sit in.")
  ],
  tp: "ANSWER KEY: Same DNA in two states - loose chromatin at rest, coiled chromosomes in division. DETAILED RATIONALE: The distractors invent a second substance, reverse the timing, or confuse chromatin with nucleoplasm. PRIORITY FRAMEWORK: Terminology Precision - same material, different state; state changes with division." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement correctly distinguishes cytoplasm from cytosol?",
  opts: [
    O("The cytoplasm includes the cytosol plus the organelles; the cytosol alone is just the fluid medium of the cell", true, "Correct - cytoplasm is the whole gel region outside the nucleus; cytosol is only its fluid part, in which organelles are suspended."),
    O("The cytosol includes the cytoplasm plus the organelles; the cytoplasm alone is just the fluid medium of the cell", false, "The inclusion is reversed: cytosol is a component OF the cytoplasm, not the container of it."),
    O("The cytoplasm and the cytosol are two names for exactly the same fluid, and organelles float in the nucleus instead", false, "They are not identical, and organelles are suspended in the cytosol within the cytoplasm - never inside the nucleus."),
    O("The cytoplasm is the fluid inside the nucleus, while the cytosol is the gel found outside the cell membrane entirely", false, "Both terms describe material inside the cell; the nuclear fluid is nucleoplasm and outside material is extracellular.")
  ],
  tp: "ANSWER KEY: Cytoplasm = cytosol plus organelles; cytosol = the fluid alone. DETAILED RATIONALE: The trap options reverse the part-whole relationship, declare the terms identical, or move both fluids to the wrong compartments. PRIORITY FRAMEWORK: Terminology Precision - part versus whole decides this pair every time." });

BANK.push({ cat: CB, type: "single", kt: ["mitochondria"],
  stem: "What is the definition of mitochondria?",
  opts: [
    O("Tiny, slipper-shaped organelles that produce most of the body's energy, ATP, and are called the power plants of the cell", true, "Correct - mitochondria are the ATP-producing power plants; busier cells carry more of them."),
    O("Membranous sacs filled with powerful enzymes that digest intracellular waste, damaged organelles, and ingested bacteria", false, "That defines lysosomes, the clean-up sacs; mitochondria produce energy rather than digesting waste."),
    O("A network of membrane channels through which newly synthesized protein and other substances flow within the cytoplasm", false, "That defines the endoplasmic reticulum; its channels move substances, they do not generate ATP."),

  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
