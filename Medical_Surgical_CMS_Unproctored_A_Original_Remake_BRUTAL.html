<style>

.stem{font-size:17px;font-weight:600;margin-bottom:12px}

.oi .ot{flex:1;font-size:15px}
.oi button{border:1px solid #c9bdf0;background:#f5f2ff;border-radius:8px;font-size:16px;width:40px;height:40px;margin-left:6px;color:#4c1d95}
.oi.good{border-color:#16a34a;background:#ecfdf3}
.oi.bad{border-color:#dc2626;background:#fef2f2}
select{font-size:15px;padding:6px 8px;border-radius:8px;border:2px solid #b9a8ee;background:#fff;color:#1f1b3a;max-width:100%}
select.good{border-color:#16a34a;background:#ecfdf3}
select.bad{border-color:#dc2626;background:#fef2f2}
.ddstem{font-size:17px;line-height:2.1;margin-bottom:10px}
.leg{background:#f5f2ff;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}

.mrow.bad{border-color:#dc2626;background:#fef2f2}
.mrow span.mt{flex:1;margin-right:10px}
.fbx{font-size:13px;color:#3d3a55;margin:-2px 0 8px 4px}
.res{border-radius:10px;padding:8px 12px;font-weight:700;margin:10px 0 8px}
.res.ok{background:#dcfce7;color:#14532d}
.res.part{background:#fef3c7;color:#78350f}
.res.no{background:#fee2e2;color:#7f1d1d}
.tp{background:#eef2ff;border-left:4px solid #4338ca;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.nav{display:flex;flex-wrap:wrap}
.nav button{width:38px;height:38px;margin:3px;border-radius:9px;border:2px solid #ddd5f7;background:#fff;color:#3b1a8a;font-weight:700;font-size:13px}
.nav button.ans{background:#ddd5f7}
.nav button.fl{border-color:#f59e0b;box-shadow:inset 0 -4px 0 #f59e0b}
.nav button.cur{background:#6d28d9;color:#fff;border-color:#6d28d9}
.nav button.ok{background:#bbf7d0;border-color:#16a34a}
.nav button.part{background:#fde68a;border-color:#f59e0b}
.nav button.bad{background:#fecaca;border-color:#dc2626}
.big{font-size:42px;font-weight:800;color:#4c1d95}
.cb{height:12px;background:#e6e1f7;border-radius:6px;overflow:hidden;margin:3px 0 10px}
.cb div{height:12px;background:#6d28d9}
.small{font-size:13px;color:#5b5486}
.calcinput{font-size:17px;padding:8px 10px;border-radius:8px;border:2px solid #b9a8ee;width:140px}
.fw{background:#fdf2f8;border-left:4px solid #db2777;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px}

<body>
<div id="app"></div>
<script>
/* ============ QUESTION BANK ============ */
/* PN Medical Surgical CMS - ORIGINAL remake: original questions on the verified core PN Med-Surg blueprint. Not ATI questions. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CATS = ["Perioperative & Postoperative Care", "Cardiovascular Disorders", "Respiratory Disorders", "Neurologic & Sensory Disorders", "Renal, Urinary & Fluid-Electrolyte Balance", "Endocrine & Metabolic Disorders", "Gastrointestinal, Hepatic, Hematologic & Immune Disorders", "Musculoskeletal, Integumentary & Cancer Care"];
var KEYTERMS = [];

/* PN Medical Surgical CMS Unproctored Practice A — ORIGINAL remake: original questions on the verified core PN Med-Surg blueprint. Not ATI questions. */
/* Items 1-15 */

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is assisting with the care of a client who is 8 hours postoperative following abdominal surgery. The client last voided before surgery, the bladder is palpable above the symphysis pubis, and the client reports pressure and an urge to void but cannot start a stream. Which action should the nurse take first?",
  opts: [
    O("Encourage oral fluids and reassess the bladder in 4 hours.", false, "Adding more fluid to an already distended bladder worsens discomfort and risks bladder injury. The retention itself needs an intervention now, not more intake."),
    O("Assist the client to sit up and attempt to void in private.", true, "An upright position, privacy, and running water support the normal voiding reflex. This simple measure often resolves early retention and is tried before catheterization."),
    O("Insert a straight catheter to empty the bladder right away.", false, "Catheterization carries infection risk and is reserved for retention that persists after positioning, privacy, and other noninvasive measures have been tried."),
    O("Apply a cool compress over the lower abdomen for comfort.", false, "A cool compress does not relax the sphincter or promote voiding. Warmth and upright positioning are the measures that support the voiding reflex.")
  ],
  fw: "Nursing process — least invasive intervention before invasive procedures",
  tp: "Postoperative urinary retention: position upright, give privacy, run water, and have the client try to void before reaching for a catheter." });

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is reinforcing teaching with a client who is 1 day postoperative following a bowel resection. The client blows into the incentive spirometer quickly, takes a shallow breath, and does not hold the breath at the top. Which statement by the client indicates an understanding of the corrected teaching?",
  opts: [
    O("I will blow into the mouthpiece as hard as I can.", false, "The client inhales through the spirometer rather than blowing into it. Blowing out does not raise the indicator or expand the lungs."),
    O("I will use it once each morning before breakfast.", false, "Using the device once a day is far too infrequent to keep the alveoli open. Sessions are repeated about every hour while the client is awake."),
    O("I will breathe in slowly and hold for 3 to 5 seconds.", true, "A slow, deep inhalation that raises the piston, followed by a brief hold, keeps the alveoli inflated and helps prevent postoperative atelectasis and pneumonia."),
    O("I will stop using it when I can walk to the hallway.", false, "Ambulation and spirometry work together; one does not replace the other. The device is used until the client is breathing deeply and moving well.")
  ],
  fw: "Patient teaching — evaluate understanding through the client's own statement",
  tp: "Incentive spirometer: breathe IN slowly through the mouthpiece, raise the piston, hold 3 to 5 seconds, repeat about 10 times each hour while awake." });

BANK.push({ cat: "Gastrointestinal, Hepatic, Hematologic & Immune Disorders", type: "single",
  stem: "A nurse is preparing to care for a client following a descending colon resection with colostomy placement. The nurse reviews the surgical report to confirm where the new stoma was created. At which location should the nurse expect to collect data on the stoma?",
  opts: [
    O("The right lower quadrant of the abdomen.", false, "The right lower quadrant is the site of the appendix and the cecum, and it is where an ileostomy or cecostomy would sit, not a descending colostomy."),
    O("The left lower quadrant of the abdomen.", true, "The descending colon runs down the left side of the abdomen and ends in the left lower quadrant, so a descending colostomy opens at that location."),
    O("The upper midline just below the sternum.", false, "The upper midline lies over the stomach and transverse colon region. A descending colostomy is brought out much lower and to the left side."),
    O("The right upper quadrant near the ribs.", false, "The right upper quadrant contains the liver and gallbladder. The descending colon is on the opposite side of the abdomen from this location.")
  ],
  fw: "Nursing process — match the data collection site to the anatomy of the surgery",
  tp: "Descending colon colostomy = left lower quadrant. Ileostomy = right lower quadrant. The stoma sits over the bowel segment that was resected." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is reinforcing teaching with a client who has heart failure and a prescription for a low-sodium diet. The client says food tastes bland without salt and asks how to improve the flavor of meals at home. Which recommendation should the nurse make?",
  opts: [
    O("Switch to a salt substitute from the grocery store.", false, "Many salt substitutes replace sodium with potassium chloride. A client who may take potassium-sparing medications can develop a dangerously high potassium level."),
    O("Season foods with lemon juice, herbs, and spices.", true, "Lemon juice, vinegar, and salt-free herbs and spices add flavor without adding sodium or potassium, so they are the safe way to make a low-sodium diet taste better."),
    O("Rinse canned vegetables and keep using table salt.", false, "Rinsing canned vegetables lowers some sodium, but continuing to add table salt defeats the purpose of the low-sodium prescription for this client."),
    O("Use garlic salt and onion salt instead of plain salt.", false, "Garlic salt and onion salt are still sodium salts. The seasoning powder on top does not change the sodium load these products deliver.")
  ],
  fw: "Patient teaching — choose the seasoning that adds flavor without sodium or potassium risk",
  tp: "Low-sodium flavor fix: lemon, vinegar, herbs, spices. Salt substitutes hide potassium, and garlic salt and onion salt are still salt." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is collecting data from a client who takes digoxin 0.25 mg daily for heart failure. The client reports nausea, loss of appetite, and seeing yellow halos around lights, and the apical pulse is 54/min. Which finding should the nurse report to the provider immediately?",
  opts: [
    O("The combination of visual changes and a slow pulse.", true, "Nausea, anorexia, yellow-green halos, and bradycardia together form the classic picture of digoxin toxicity. The drug is held and the provider is notified right away."),
    O("The report of a decreased appetite at breakfast.", false, "Loss of appetite alone is nonspecific, but it gains meaning beside the visual changes and slow pulse. The full cluster, not one finding, signals toxicity."),
    O("The need for a routine refill of the digoxin dose.", false, "A refill request is routine business. Giving more digoxin to a client showing toxicity findings would compound a potentially lethal problem."),
    O("The client's request for an extra pillow at night.", false, "An extra pillow is a comfort preference and may reflect sleeping habits. It does not approach the urgency of toxicity signs with a pulse of 54.")
  ],
  fw: "Medication safety — recognize the toxicity cluster and hold, then report",
  tp: "Digoxin toxicity cluster: nausea, anorexia, yellow or green halos, pulse under 60. Hold the dose, check the level and potassium, and report." });

BANK.push({ cat: "Renal, Urinary & Fluid-Electrolyte Balance", type: "multi",
  stem: "A nurse is caring for a client who is receiving furosemide 40 mg IV twice daily for heart failure with fluid overload. The nurse reviews the care plan to confirm which data the team will track while the medication is working. Which data should the nurse collect and monitor? Select all that apply.",
  opts: [
    O("Serum potassium level with each set of labs.", true, "Furosemide wastes potassium in the urine. Falling potassium raises the risk of dysrhythmias, especially in a client who may also take digoxin."),
    O("Daily weight taken at the same time each day.", true, "Daily weight is the most reliable day-to-day measure of fluid loss. A change of about 1 kg reflects about 1 L of fluid gained or lost."),
    O("Intake and output totals for every shift.", true, "Comparing intake with the urine output the diuretic produces shows whether the medication is moving fluid as intended and guides the next dose."),
    O("Blood glucose before every meal and at bedtime.", false, "This client has no diabetes data in the plan. Glucose checks are not a routine monitoring item for furosemide therapy by itself."),
    O("Pupil size and reaction to light each hour.", false, "Pupillary checks belong to neurologic monitoring. Furosemide does not change pupil responses, so hourly pupil checks are not part of this care."),
    O("Apical pulse for a full minute before each dose.", false, "A full-minute apical pulse is the routine check before digoxin, not before furosemide. Blood pressure matters with a diuretic; this specific routine does not.")
  ],
  fw: "Medication safety — pair each high-alert medication with its own monitoring set",
  tp: "Furosemide monitoring trio: potassium, daily weights, intake and output — plus blood pressure. A diuretic that wastes potassium can drop it fast." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is reinforcing teaching with a client who has varicose veins and a prescription for elastic support stockings. The client plans to put the stockings on after sitting at the breakfast table each day. Which instruction should the nurse give about timing?",
  opts: [
    O("Apply the stockings after breakfast while seated.", false, "By the time the client has sat with the legs down, gravity has already pooled blood in the veins. Stockings applied then trap that extra fluid in the legs."),
    O("Put the stockings on before getting out of bed.", true, "Applying stockings in bed, before the legs are lowered, compresses veins while they hold the least blood and gives support through the whole day."),
    O("Wear the stockings only during the night shift.", false, "Support stockings work while the client is upright and active. Night wear is not the prescription and can wrinkle and bind during sleep."),
    O("Roll the stockings down whenever the legs ache.", false, "A rolled-down band acts like a tourniquet and worsens venous return. The stocking should be smoothed out or removed fully, never rolled.")
  ],
  fw: "Patient teaching — time the intervention to the physiology it supports",
  tp: "Support stockings go on in bed, before the legs come down for the day. Rolled stockings become tourniquets — smooth or remove, never roll." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is reinforcing teaching with a client who has mitral valve disease and takes an anticoagulant. The nurse reviews daily activities with the client. Which statement by the client indicates an understanding of the teaching?",
  opts: [
    O("I will use a soft toothbrush and an electric razor.", true, "A client on anticoagulation protects against bleeding by using a soft toothbrush for the gums and an electric razor instead of a blade for shaving."),
    O("I will take an extra dose if I notice any bruising.", false, "Bruising is a finding to report, not a reason to take more anticoagulant. Extra doses raise the bleeding risk further and are never self-prescribed."),
    O("I will stop the medication the day before dental work.", false, "Stopping an anticoagulant around a procedure is a provider decision. Stopping on her own exposes the client with valve disease to clot formation."),
    O("I will switch my green salads to avoid the vitamin K.", false, "The goal is a steady, consistent intake of vitamin K foods, not total avoidance. Sudden changes in intake are what destabilize the anticoagulant effect.")
  ],
  fw: "Patient teaching — bleeding precautions are the daily-life core of anticoagulant therapy",
  tp: "Anticoagulant daily life: soft toothbrush, electric razor, report bruising or bleeding, keep vitamin K intake steady, never adjust the dose alone." });

BANK.push({ cat: "Cardiovascular Disorders", type: "single",
  stem: "A nurse is preparing to administer metoprolol 50 mg PO to a client who had a myocardial infarction 3 days ago. Before giving the dose, the nurse checks the chart and collects vital signs. Which finding should cause the nurse to hold the dose and notify the provider?",
  opts: [
    O("Blood pressure of 128/76 mm Hg and a pulse of 76/min.", false, "These values sit in a comfortable range for a client recovering from a myocardial infarction. Beta blockade at this rate and pressure is expected therapy."),
    O("Respiratory rate of 18/min with clear breath sounds.", false, "A respiratory rate of 18 with clear lungs is an expected finding. It gives no reason to withhold a scheduled beta blocker dose."),
    O("Apical pulse of 52/min and blood pressure of 96/60.", true, "Beta blockers slow the heart and lower blood pressure. An apical pulse below 60 with a soft pressure means the dose is held and the provider is notified."),
    O("Temperature of 37.2 C and a report of mild fatigue.", false, "A near-normal temperature and mild fatigue are common after a myocardial infarction. Neither finding is a hold parameter for this medication.")
  ],
  fw: "Medication safety — check the hold parameters before the dose, not after",
  tp: "Beta blocker hold check: apical pulse under 60 or a low blood pressure means hold the dose and notify the provider. Check before every dose." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse in a clinic is collecting data from a client with a confirmed diagnosis of pertussis who has a harsh cough and post-tussive vomiting. A coworker asks what precautions apply while the client waits for an examination room. Which response should the nurse give?",
  opts: [
    O("Droplet precautions, with a mask on the client.", true, "Pertussis spreads in large respiratory droplets produced by coughing. Droplet precautions and a mask on the client during transport and waiting are required."),
    O("Airborne precautions, with a negative-pressure room.", false, "Airborne precautions with negative pressure are used for measles, tuberculosis, and varicella. Pertussis particles are larger droplets that fall quickly."),
    O("Standard precautions alone, with no mask needed.", false, "Standard precautions do not protect against droplet spread from a coughing client with pertussis. A mask and droplet precautions are added on top."),
    O("Contact precautions, with gloves for the visit only.", false, "Contact precautions target organisms spread by touch, such as wound drainage. Pertussis leaves the body in coughed droplets, so gloves alone miss the route.")
  ],
  fw: "Safety and infection control — match the precaution to the transmission route",
  tp: "Pertussis = droplet precautions. Airborne with negative pressure belongs to tuberculosis, measles, and varicella. Match the precaution to the route." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is reinforcing discharge teaching with a client who has chronic obstructive pulmonary disease. The client tires quickly, still smokes half a pack daily, and has not had any vaccines this year. Which teaching point should the nurse emphasize before discharge?",
  opts: [
    O("Use oxygen at the highest flow that feels comfortable.", false, "Oxygen in COPD is titrated to a prescribed target range, not to comfort. Uncontrolled high flow can blunt the drive to breathe in some clients."),
    O("Receive the influenza and pneumococcal vaccines.", true, "Respiratory infections are the most common trigger of COPD exacerbations. Annual influenza vaccine and the pneumococcal vaccine protect this vulnerable client."),
    O("Save energy by staying in bed most of the day.", false, "Prolonged bed rest deconditions the very muscles breathing depends on. Planned activity with rest periods conserves energy without losing conditioning."),
    O("Drink a large glass of water right before sleeping.", false, "A large fluid load at bedtime increases nighttime trips and coughing for this client and does nothing to thin secretions better than daytime hydration.")
  ],
  fw: "Health promotion — prevent the infection that triggers the exacerbation",
  tp: "COPD discharge bundle: influenza and pneumococcal vaccines, smoking cessation, planned activity with rest — infections trigger exacerbations." });

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is assisting with the preparation of a client who is scheduled for a bronchoscopy in 1 hour. The provider's orders include nothing by mouth after midnight, and the client asks for breakfast and a drink of water. Which action should the nurse take?",
  opts: [
    O("Give the client clear liquids until 30 minutes before.", false, "The throat is numbed during bronchoscopy, which removes the gag reflex. Anything taken by mouth close to the procedure creates an aspiration risk."),
    O("Keep the client nothing by mouth as prescribed.", true, "NPO status before bronchoscopy protects the airway because the topical anesthetic blunts the gag and cough reflexes during and after the procedure."),
    O("Offer a light breakfast since the test is brief.", false, "The length of the procedure does not change the risk. A numbed throat plus stomach contents is the combination that leads to aspiration."),
    O("Give ice chips to keep the client's mouth moist.", false, "Ice chips melt into water and count as intake. The NPO order covers ice as well as food and fluids before this procedure.")
  ],
  fw: "Reduction of risk — the numbed airway is the reason the stomach stays empty",
  tp: "Bronchoscopy: NPO beforehand, and afterward nothing by mouth until the gag reflex returns. The numbed throat is the whole reason." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is collecting data from a client with heart failure who has new shortness of breath when lying flat. Breath sounds are diminished at the right base, the right lower chest does not move well with breathing, and percussion over that area is dull. Which conclusion should the nurse draw from this data set?",
  opts: [
    O("The findings point to a pleural effusion on the right.", true, "Diminished breath sounds, reduced chest movement, and dullness to percussion over one base together point to fluid collected in the pleural space at that location."),
    O("The findings point to a pneumothorax on the right.", false, "A pneumothorax produces hyperresonance on percussion from trapped air, not dullness. Dullness means something dense, like fluid, occupies the space."),
    O("The findings point to pneumonia in the right base.", false, "Pneumonia typically brings fever, a productive cough, and crackles or bronchial sounds over the lobe. This data set describes absent sound and dullness instead."),
    O("The findings point to asthma affecting both lungs.", false, "Asthma is a bilateral airway problem with wheezing heard throughout the chest. These findings are one-sided, silent, and dull, which fits fluid rather than airways.")
  ],
  fw: "Nursing process — read the combined data pattern, not a single finding",
  tp: "Pleural effusion picture: one base, diminished breath sounds, dull percussion, reduced movement. Air above the lung sounds hollow; fluid sounds dull." });

BANK.push({ cat: "Respiratory Disorders", type: "single",
  stem: "A nurse is reinforcing teaching with a client who has obstructive sleep apnea and a new prescription for a CPAP machine. The client says the mask feels strange and he plans to use it only on weekends. Which statement should the nurse reinforce as correct use?",
  opts: [
    O("Use the machine only on nights before work days.", false, "Apnea events happen every night, not only before work. Skipping nights leaves the airway collapsing and the oxygen level falling on those nights."),
    O("Wear the mask every night for the whole sleep period.", true, "CPAP holds the airway open only while it is worn. Nightly use for the full sleep period is what prevents apnea, protects oxygen levels, and improves daytime alertness."),
    O("Turn the pressure higher when snoring gets louder.", false, "Pressure settings are prescribed and set by the provider and equipment supplier. The client does not adjust pressure based on snoring volume."),
    O("Skip the machine when taking a sleeping pill.", false, "Sedatives relax airway muscles and can worsen apnea. That is the night the machine matters most, and the concern should be reported to the provider.")
  ],
  fw: "Patient teaching — adherence every night is the therapy, not an option",
  tp: "CPAP works only while worn: every night, all night. The client never adjusts the prescribed pressure settings on his own." });

BANK.push({ cat: "Perioperative & Postoperative Care", type: "single",
  stem: "A nurse is contributing to the plan of care for a client who is 2 days postoperative with a dry, intact abdominal dressing that is due for a scheduled change. The nurse gathers supplies at the bedside. Which action by the nurse protects the wound during the change?",
  opts: [
    O("Open the sterile supplies after removing the old dressing with clean gloves.", false, "Opening sterile supplies after handling the soiled dressing forces contaminated hands near the sterile field. The field is prepared before the old dressing comes off."),

  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together. Answer choices always shuffle, even when question shuffle is off.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  if (t === "calc") { return "Calculate and enter the number."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else if (q.type === "calc") {
    h += '<div class="stem">' + q.stem + '</div>';
    h += '<div><input class="calcinput" type="number" step="any" inputmode="decimal" value="' + (r === "" || r === null ? "" : r) + '"' + (lock ? ' disabled' : '') + ' oninput="pickC(this.value)"> <span style="font-size:16px">' + q.unit + '</span></div>';
    if (fb) { h += '<div class="fbx" style="margin-top:8px">Correct answer: ' + q.ans + ' ' + q.unit + '</div>'; }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
    h += '<div class="fw"><b>Priority framework:</b> ' + q.fw + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickC(v) { if (isLocked()) { return; } S.resp[S.cur] = v; updateBars(); }
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
</html>
