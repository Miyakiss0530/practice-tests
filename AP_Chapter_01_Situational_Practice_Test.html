<script>
/* ============ QUESTION BANK (HARD / BRUTAL MODE) ============ */
/* Herlihy Ch 1 Situational Practice Test — BRUTAL vignettes + one unfolding NGN case study (grp NGN1, 6 linked questions). */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Foundations & Levels of Organization";
var CB = "Organ Systems";
var CC = "Homeostasis & Anatomical Position";
var CD = "Relative Positions & Planes";
var CE = "Regional Terms";
var CF = "Body Cavities, Quadrants & Regions";
var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = ["abdominopelvic-cavity", "allergens", "anatomical-position", "anatomy", "antecubital", "anterior", "axillary", "bone-marrow", "buccal", "cardiac-muscle", "cell", "central", "cephalic", "cranial-cavity", "distal", "endocrine-system", "four-quadrants", "frontal-coronal-plane", "function", "homeostasis", "homeostatic-mechanisms", "hormones", "immune-system", "inguinal", "integumentary-system", "lateral", "medial", "mediastinum", "midsagittal-section", "nervous-system", "organ-systems", "organs", "patellar", "pathophysiology", "pedal", "pericardial-cavity", "physiology", "plantar", "pleural-cavities", "popliteal", "posterior", "proximal", "respiratory-system", "sagittal-plane", "skeletal-muscle", "skeletal-system", "smooth-muscle", "spinal-vertebral-cavity", "structure", "superficial", "thoracic-cavity", "tissues", "transverse-plane", "urinary-system", "vascular-smooth-muscle", "ventral"];
var BLUEPRINT = {
  CA: { name: CA, count: 5, types: { "multi": 1, "order": 1, "single": 3 } },
  CB: { name: CB, count: 9, types: { "dropdown": 1, "matrix": 1, "multi": 1, "single": 6 } },
  CC: { name: CC, count: 5, types: { "multi": 1, "single": 4 } },
  CD: { name: CD, count: 6, types: { "dropdown": 1, "matrix": 1, "single": 4 } },
  CE: { name: CE, count: 5, types: { "multi": 1, "order": 1, "single": 3 } },
  CF: { name: CF, count: 11, types: { "dropdown": 2, "multi": 3, "single": 6 } },
};

BANK.push({ cat: CA, type: "single", kt: ["structure"], stem: "A patient asks why a heart valve that is built too stiffly makes her short of breath with activity. Which explanation by the nurse is correct?", opts: [
    O("The way a part is built decides the job it can do, so a stiff valve cannot move blood the way a normally built valve does", true, "Structure and function are closely related — the chapter's anchor idea: a part's build decides the job it can do, like the heart walls built for pumping."),
    O("The stiffness matters only because of her age, since a part's build has no real effect on the job that the part performs", false, "This denies the chapter's core link — shape is never random decoration; on any test, a structure's build is a clue to its function."),
    O("Her breathing problem is unrelated to the valve, because each body part works alone with no effect on any other system", false, "Systems work together — the circulatory problem shows up as a breathing complaint precisely because transport and intake systems are linked."),
    O("A stiff valve is a labeling problem only, and her symptoms will resolve once the chart uses a more accurate valve name", false, "Symptoms follow failed function, not wording — renaming a structure does not restore the job its build can no longer perform.")
  ], tp: "ANSWER KEY — Correct answer: The way a part is built decides the job it can do, so a stiff valve cannot move blood the way a normally built valve does. DETAILED RATIONALE — Form fits the job: hand built for grasping, heart walls built for pumping — a changed build means a changed job. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CA, type: "single", kt: ["anatomy", "physiology", "pathophysiology"], stem: "A nursing student is reviewing a patient's chart and must sort three notes: a description of the shape of a joint, a description of what that joint does, and a note about joint disease after years of improper use. Which sorting is correct?", opts: [
    O("Shape of the joint belongs with anatomy, what it does belongs with physiology, and the disease note belongs with pathophysiology", true, "Anatomy = structure, physiology = function, pathophysiology = consequences of improper functioning (disease) — the three boxes every term sorts into."),
    O("Shape of the joint belongs with physiology, what it does belongs with anatomy, and the disease note belongs with physiology as well", false, "This swaps the first two boxes — anatomy names structure and physiology names function; they are not interchangeable terms."),
    O("All three notes belong with pathophysiology, because any note written about a patient in a hospital chart concerns disease", false, "Only the disease note is pathophysiology; structure and function notes keep their own sciences even when charted on a patient."),
    O("The disease note belongs with anatomy, because disease changes the shape of a joint and anatomy covers anything structural", false, "Disease is filed under pathophysiology — the consequences of improper functioning — even when it later changes a structure.")
  ], tp: "ANSWER KEY — Correct answer: Shape of the joint belongs with anatomy, what it does belongs with physiology, and the disease note belongs with pathophysiology. DETAILED RATIONALE — Sort every word: structure (anatomy), function (physiology), gone-wrong (pathophysiology). The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CA, type: "order", kt: ["cell"], stem: "A patient asks how something as small as a molecule can affect her whole body. Place the levels of organization in the correct order, from smallest to largest, to build the nurse's explanation.", items: [
    { t: "Atoms", r: "Atoms are the smallest level — molecules are built from atoms." },
    { t: "Molecules", r: "Molecules are built from atoms and are used to build the larger molecules." },
    { t: "Macromolecules", r: "Macromolecules are the larger molecules, the level just below the cell." },
    { t: "Cells", r: "Cells are the basic unit of life — the level where living starts." },
    { t: "Tissues", r: "Tissues are specialized groups of cells performing specific functions." },
    { t: "Organs", r: "Organs are several tissue types working together." },
    { t: "Organ systems", r: "Organ systems are several organs working together." },
    { t: "Human organism", r: "The human organism is the whole person — all systems together." }
  ], tp: "ANSWER KEY — Correct answer: Atoms → Molecules → Macromolecules → Cells → Tissues → Organs → Organ systems → Human organism. DETAILED RATIONALE — Each level adds 'several of the level below, working together'; the cell is the basic unit of life. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Nursing Process — evaluation of learning: a correct statement proves understanding; a misconception names what to reteach." });

BANK.push({ cat: CA, type: "single", kt: ["function"], stem: "A patient with a fractured wrist cannot grip a cup. The nurse explains the problem to the patient. Which statement uses the chapter's structure–function examples correctly?", opts: [
    O("The hand is built for grasping, so a break in its structure takes away the job that its shape normally lets it perform", true, "The hand is the chapter's grasping example — built for grasping, so damaged structure means lost function, the pair asked together on tests."),
    O("The hand is built for pumping, so the fracture mainly threatens the blood supply rather than the patient's grip strength", false, "Pumping belongs to the heart walls, not the hand — misassigning the chapter's examples reverses the structure–function pairing."),
    O("Grip comes from the tail-like balance structures, so the nurse should assess the patient's balance before the wrist injury", false, "The monkey's tail is the chapter's animal example of a structure shaped by use — it has nothing to do with a human hand injury."),
    O("The fracture is only a function problem, because breaks change what a part does without changing how the part is built", false, "A fracture changes the BUILD first; the lost grip follows from the changed structure — the two are always asked as a pair.")
  ], tp: "ANSWER KEY — Correct answer: The hand is built for grasping, so a break in its structure takes away the job that its shape normally lets it perform. DETAILED RATIONALE — Hand = grasping, heart walls = pumping, monkey's tail = animal example of form shaped by use. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CA, type: "multi", kt: ["tissues", "organs", "organ-systems"], stem: "A patient is learning how her body is organized after a new diagnosis. Which statements by the nurse are correct? Select all that apply.", opts: [
    O("Your organs are built from several tissue types working together", true, "Correct — an organ is several tissue types together, which is what separates organs from tissues."),
    O("Your organ systems are built from several organs working together", true, "Correct — a system is several organs working together, one level below the whole organism."),
    O("The cell is the basic unit where living starts in your body", true, "Correct — only one level is named the basic unit of life: the cell."),
    O("A tissue is made of several organs grouped by location", false, "Reversed — tissues are groups of CELLS; organs, not tissues, sit above them in the chain."),
    O("An organ system is a single organ with several tissue types", false, "That describes an ORGAN, not a system — a system needs several organs working together.")
  ], tp: "ANSWER KEY — Correct answer: Your organs are built from several tissue types working together; Your organ systems are built from several organs working together; The cell is the basic unit where living starts in your body. DETAILED RATIONALE — Tissues = groups of cells; organs = several tissue types; systems = several organs; organism = whole person. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CB, type: "single", kt: ["bone-marrow", "skeletal-system"], stem: "A patient's laboratory report shows a low blood cell count, and the provider plans to examine the tissue that makes most blood cells. Which system should the nurse expect to be assessed?", opts: [
    O("The skeletal system, with attention to the marrow inside the patient's bones", true, "Bone marrow produces most blood cells, and marrow belongs to the skeletal system — bones, joints, and cartilage — not to the heart or vessels."),
    O("The circulatory system, with attention to the patient's heart as the maker of cells", false, "The heart pumps blood; it does not make it. Filing blood-cell production under the heart is the chapter's named trap."),
    O("The muscular system, with attention to the patient's largest skeletal muscles", false, "Muscles move the skeleton, pump blood, or move fluids — none of the three muscle types produces blood cells."),
    O("The lymphatic system, with attention to the patient's largest lymph nodes", false, "The lymphatic system handles fluid balance and defense; blood-cell production belongs to bone marrow in the skeletal system.")
  ], tp: "ANSWER KEY — Correct answer: The skeletal system, with attention to the marrow inside the patient's bones. DETAILED RATIONALE — Marrow makes most blood cells and marrow = skeletal system. The heart transports blood; it does not produce it. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CB, type: "single", kt: ["endocrine-system", "hormones"], stem: "A patient is being evaluated for slow growth, a change in metabolism, and a water-balance problem, all traced to chemical messengers in her blood. Which system is the nurse documenting?", opts: [
    O("The endocrine system, whose glands secrete the chemical messengers involved", true, "Hormones are chemical substances secreted by endocrine glands, and those glands regulate growth, reproduction, metabolism, and water balance."),
    O("The nervous system, whose nerves secrete the chemical messengers involved", false, "The nervous system works through nerve signals — sensory in, motor out. Hormones belong to the endocrine system only."),
    O("The circulatory system, whose vessels manufacture the chemical messengers", false, "Blood TRANSPORTS materials to all cells; the vessels do not secrete hormones — glands of the endocrine system do."),
    O("The urinary system, whose kidneys are the glands described in this scenario", false, "The kidneys excrete waste as urine and control water, electrolyte, and acid–base balance — they are not the hormone-secreting glands meant here.")
  ], tp: "ANSWER KEY — Correct answer: The endocrine system, whose glands secrete the chemical messengers involved. DETAILED RATIONALE — Hormones = endocrine only. The endocrine four: growth, reproduction, metabolism, water balance. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CB, type: "matrix", kt: ["respiratory-system", "urinary-system"], stem: "A nurse is matching each patient problem to the system whose job covers it. Match each system with its correct job.", cols: ["Brings oxygen in and removes carbon dioxide; helps regulate acid–base balance", "Excretes waste as urine; controls water, electrolyte, and acid–base balance", "Breaks food into absorbable substances and eliminates unabsorbed material as waste", "Transports nutrients and oxygen to all cells and waste to the organs of excretion"], rows: [
    { t: "Respiratory system", a: 0, r: "Lungs and conducting structures bring O2 in and remove CO2, with a key role in acid–base balance." },
    { t: "Urinary system", a: 1, r: "Kidneys and other urinary structures excrete waste as urine and control water, electrolyte, and acid–base balance." },
    { t: "Digestive system", a: 2, r: "The digestive system ingests food, breaks it into absorbable substances, and eliminates unabsorbed waste." },
    { t: "Circulatory system", a: 3, r: "Blood, heart, and vessels transport nutrients and oxygen to cells and waste to the organs of excretion." }
  ], tp: "ANSWER KEY — Correct answer: Respiratory → oxygen in / carbon dioxide out + acid–base; Urinary → urine + water, electrolyte, acid–base; Digestive → absorbable substances; Circulatory → transport to cells and to excretion organs. DETAILED RATIONALE — Acid–base is the shared job: respiratory AND urinary both regulate it — giving it to only one system is the trap. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CB, type: "single", kt: ["immune-system", "allergens"], stem: "A patient who was stung by a bee develops a reaction, and the nurse explains that the same body system that fights germs also reacted to the venom. Which statement is correct?", opts: [
    O("The immune system protects against pathogens, allergens such as bee venom, and the body's own abnormal cells", true, "Those are the immune system's three targets in the guide — bee venom is named as an allergen example alongside pollen."),
    O("The reaction came from the lymphatic system alone, because the immune system only reacts to living germs", false, "Both systems defend, and the immune system's targets are wider than germs — allergens and abnormal cells are on its list too."),
    O("The venom reaction is a circulatory problem, because anything carried in the blood is handled only by that system", false, "Blood is the transport medium; defense against allergens belongs to the immune system, which is widely distributed in the body."),
    O("A venom reaction cannot involve defense systems, because those systems shut down when a substance is not a germ", false, "The immune system reacts to allergens by design — pollen and bee venom are the chapter's own allergen examples.")
  ], tp: "ANSWER KEY — Correct answer: The immune system protects against pathogens, allergens such as bee venom, and the body's own abnormal cells. DETAILED RATIONALE — Immune targets, all three: pathogens, allergens (pollen, bee venom), abnormal (cancer) cells. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CB, type: "single", kt: ["respiratory-system", "urinary-system"], stem: "A patient's blood gas report shows an acid–base problem, and the student nurse insists only the lungs can correct it. Which correction by the nurse is right?", opts: [
    O("Both the respiratory system and the urinary system regulate acid–base balance, so either one may be involved here", true, "The guide gives acid–base to BOTH systems — lungs through breathing and kidneys through urine — one balance, two systems."),
    O("The student is right, because the urinary system controls water balance but has no role at all in acid–base balance", false, "The urinary system controls water, electrolyte, AND acid–base balance — dropping the third item is the trap in this option."),
    O("Neither system regulates it, because acid–base balance is maintained by the digestive system breaking down food acids", false, "The digestive system breaks food into absorbable substances; acid–base regulation belongs to respiratory and urinary systems."),
    O("Only the endocrine system regulates it, because its glands regulate every balance problem found in the blood", false, "Endocrine glands regulate growth, reproduction, metabolism, and water balance — acid–base is not on that list of four.")
  ], tp: "ANSWER KEY — Correct answer: Both the respiratory system and the urinary system regulate acid–base balance, so either one may be involved here. DETAILED RATIONALE — Shared job: respiratory + urinary both regulate acid–base balance. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CB, type: "multi", kt: ["nervous-system"], stem: "A patient steps on a sharp object and pulls her foot back before she is fully aware of it. Which statements about the control loop are correct? Select all that apply.", opts: [
    O("Sense organs picked up sensory information and sent it toward the brain and spinal cord", true, "Correct — the loop starts with sensory information in, toward the brain and spinal cord that interpret it."),
    O("The brain and spinal cord interpreted the information before any response was sent out", true, "Correct — interpretation by the brain and spinal cord is the middle step of the nervous loop."),
    O("Motor signals were sent out from the center to produce the withdrawal response", true, "Correct — motor signals out produce the response, completing the loop the chapter traces."),
    O("Glands released hormones that carried the withdrawal message to the leg muscles", false, "Hormones are the ENDOCRINE system's messengers — this fast loop ran on nerve signals, not gland secretions."),
    O("The response was limited to a reflex, so thinking and emotion played no possible role", false, "The nervous system is not shrunk to reflexes — the chapter also credits it with thinking and emotion.")
  ], tp: "ANSWER KEY — Correct answer: Sense organs picked up sensory information and sent it toward the brain and spinal cord; The brain and spinal cord interpreted the information before any response was sent out; Motor signals were sent out from the center to produce the withdrawal response. DETAILED RATIONALE — Nervous loop in order: sensory in → brain/spinal cord interpret → motor out → response. Hormones = endocrine, not this loop. The option-by-option feedback explains why each distractor is wrong. PRIORITY FRAMEWORK — Clinical Judgment (NCSBN) — recognize cues, analyze cues, and act on the analysis." });

BANK.push({ cat: CB, type: "single", kt: ["vascular-smooth-muscle"], stem: "A patient's chart notes narrowing of a blood vessel wall, which slowed the movement of blood through that vessel. Which muscle is documented as working in that wall?", opts: [
    O("Vascular smooth muscle, the kind found in blood vessel walls that moves blood", true, "The guide names vascular smooth muscle as the smooth muscle in vessel walls — the kind that moves blood through the vessels."),
    O("Cardiac muscle, the kind found in vessel walls wherever blood pressure is highest", false, "Cardiac muscle is found ONLY in the heart — it never appears in vessel walls at any pressure."),
    O("Skeletal muscle, the kind attached to the outside of vessels to squeeze them", false, "Skeletal muscle is attached to the skeleton and moves the skeleton; it is not the muscle of vessel walls."),

function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);

  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;

      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }

    }

function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }

}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }

    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }

  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
