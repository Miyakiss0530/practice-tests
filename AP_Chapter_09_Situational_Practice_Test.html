<script>
/* ============ QUESTION BANK — SITUATIONAL (BRUTAL) ============ */
/* Herlihy Chapter 9: Muscular System — situational items only, facts from the audited study guide. */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Contraction Mechanism";
var CB = "Motor Units and the NMJ";
var CC = "Muscle Responses and Energy";
var CD = "Muscle Roles and Naming";
var CE = "Muscle Structure and Fascia";
var CF = "Muscle Types and Functions";
var CG = "Muscles of Head Neck and Trunk";
var CH = "Muscles of the Limbs";
var CATS = [CA, CB, CC, CD, CE, CF, CG, CH];
var KEYTERMS = ["Myasthenia gravis", "Motor unit", "Recruitment", "Sliding filament mechanism", "Sarcomere", "Creatine phosphate", "Muscle tone", "Hypertrophy", "Rotator cuff", "Diaphragm"];
var BLUEPRINT = {};

/* ---------- CONTRACTION MECHANISM ---------- */
BANK.push({ cat: CA, type: "single", kt: ["Sliding filament mechanism"],
  stem: "During a physiology demonstration, a muscle fiber is exposed to a solution that floods the sarcomere with calcium but contains no ATP. The fiber begins to contract, then locks rigid and cannot relax. Which explanation should the nurse give for the rigid state?",
  opts: [
    O("Cross-bridges formed when calcium exposed the binding sites, but without ATP the myosin heads cannot detach, so the fiber stays locked.", true, "Calcium exposes actin's binding sites so cross-bridges form; ATP energy is required for the heads to disengage, so no ATP means no release — the basis of rigor mortis. Framework: mechanism-based reasoning (cause → effect)."),
    O("The actin filaments shrank when calcium touched them, and shrinking filaments cannot lengthen again without ATP present in the fiber.", false, "Filaments never shrink — they slide past one another; length change is in the sarcomere, not the filaments themselves."),
    O("Calcium destroyed the troponin-tropomyosin complex, so the binding sites stayed covered and the fiber froze in a relaxed position.", false, "Calcium binds troponin and moves tropomyosin OFF the binding sites — the sites are exposed, not covered, which is why bridges formed."),
    O("The sarcoplasmic reticulum pumped all the calcium back out of the fiber, and the empty fiber seized up from lack of stimulation.", false, "The scenario states calcium flooded the sarcomere; the lock is from bridges that cannot detach, not from calcium removal.")
  ],
  tp: "Calcium = exposes sites (bridges form); ATP = needed to form AND break cross-bridges. No ATP → rigor. Framework: cause-and-effect mechanism analysis." });
BANK.push({ cat: CA, type: "single", kt: ["Sarcomere"],
  stem: "A student examining a sarcomere under a microscope after contraction reports, 'The thin and thick filaments both got shorter.' Which correction by the instructor is accurate?",
  opts: [
    O("Neither filament shortens; the filaments slide past each other so the Z lines move closer together and the sarcomere shortens.", true, "In the sliding filament mechanism the filaments keep their length; actin slides inward over myosin, pulling Z lines closer. Framework: concept discrimination (sliding vs shrinking)."),
    O("Only the actin filaments shorten; the myosin filaments keep their length because their heads do the pulling during contraction.", false, "Actin does not shorten either — it slides. The myosin heads pull it inward."),
    O("Only the myosin filaments shorten; the actin filaments keep their length because they are pulled passively by the cross-bridges.", false, "Myosin does not shorten; its heads rotate and pull actin inward."),
    O("Both filaments shorten by about half, which is why the whole muscle can shorten by up to half its resting length.", false, "No filament shortens at all; attributing shortening to the filaments contradicts the sliding filament mechanism.")
  ],
  tp: "Sliding filament: filaments slide, Z lines approach, sarcomere shortens — filaments do NOT shrink. Framework: concept discrimination." });
BANK.push({ cat: CA, type: "multi", kt: ["Troponin", "Tropomyosin"],
  stem: "A patient asks why calcium is called the 'on switch' for skeletal muscle contraction. Which statements should the nurse include in the explanation? Select all that apply.",
  opts: [
    O("Calcium is released from the sarcoplasmic reticulum when the fiber is stimulated.", true, "The SR is the fiber's calcium store and releases Ca2+ on stimulation."),
    O("Calcium binds troponin, which moves tropomyosin away from the binding sites on actin.", true, "This is the switch itself: troponin binds calcium, tropomyosin shifts, sites are exposed."),
    O("With the binding sites exposed, myosin heads can form cross-bridges with actin.", true, "Exposed sites allow cross-bridge formation and the power stroke."),
    O("Calcium directly supplies the energy that makes the myosin heads rotate and pull.", false, "ATP supplies the energy for the heads; calcium only exposes the binding sites."),
    O("Calcium destroys acetylcholinesterase so the signal at the junction lasts longer.", false, "AChE handling is a junction event; calcium's switching role is at troponin inside the fiber.")
  ],
  tp: "Calcium's job: released from SR → binds troponin → tropomyosin moves → sites exposed → bridges form. ATP, not calcium, provides energy. Framework: mechanism sequencing." });

/* ---------- MOTOR UNITS AND THE NMJ ---------- */
BANK.push({ cat: CB, type: "single", kt: ["Myasthenia gravis"],
  stem: "A patient with myasthenia gravis reports that by evening her eyelids droop and her speech slurs, but she is strongest in the morning. Her provider starts neostigmine. Which outcome should the nurse expect if the drug is working?",
  opts: [
    O("More acetylcholine remains available at the junction, so more of her surviving receptors are activated and strength improves.", true, "Neostigmine inactivates acetylcholinesterase, so ACh is not destroyed as quickly and more ACh can bind the NM receptors that remain functional. Framework: pharmacology mechanism → expected effect."),
    O("The drug repairs the damaged receptors on her muscle membrane, permanently restoring normal receptor numbers within days.", false, "Neostigmine does not repair receptors; it only increases ACh availability at the junction."),
    O("The drug blocks the junction completely, resting the muscle so the receptors can recover their sensitivity overnight.", false, "Blocking the junction would paralyze, not strengthen — that is the action of curare-type blockers."),
    O("More motor neurons are recruited to each muscle, so each contraction uses additional motor units for extra force.", false, "Recruitment is a normal CNS grading mechanism, not an effect of an anticholinesterase drug.")
  ],
  tp: "MG = damaged ACh receptors. Neostigmine = anticholinesterase → more ACh available → stronger contraction. Framework: drug mechanism analysis." });
BANK.push({ cat: CB, type: "single", kt: ["Neurotoxins"],
  stem: "Two patients develop paralysis after eating improperly canned food (Patient A) and after a puncture wound contaminated with soil (Patient B). Patient A is limp and cannot contract her muscles; Patient B has rigid, spastic muscles. Which pairing of mechanisms is correct?",
  opts: [
    O("Patient A: botulinum toxin prevented ACh release, causing flaccid paralysis. Patient B: tetanus toxin caused excess ACh release, causing spastic paralysis.", true, "Botulinum toxin prevents ACh release → no signal → flaccid (limp) paralysis. Tetanus toxin causes too much ACh activity → continuous contraction → spastic paralysis. Framework: compare/contrast mechanism analysis."),
    O("Patient A: tetanus toxin blocked the ACh receptors, causing flaccid paralysis. Patient B: botulinum toxin destroyed AChE, causing spastic paralysis.", false, "The toxins are reversed: botulinum prevents release (flaccid); tetanus drives excess ACh activity (spastic)."),
    O("Patient A: curare prevented ACh release, causing flaccid paralysis. Patient B: botulinum toxin caused excess ACh release, causing spastic paralysis.", false, "Curare blocks receptors rather than release, and botulinum prevents release — it never causes excess ACh."),
    O("Patient A: botulinum toxin destroyed the ACh receptors, causing flaccid paralysis. Patient B: tetanus toxin repaired extra receptors, causing spastic paralysis.", false, "Receptor destruction describes myasthenia gravis, and tetanus toxin does not repair or add receptors.")
  ],
  tp: "Flaccid = ACh release prevented (botulinum). Spastic = excess ACh activity (tetanus toxin). Receptor damage = MG; receptor block = curare. Framework: differential mechanism matching." });
BANK.push({ cat: CB, type: "single", kt: ["Recruitment", "Motor unit"],
  stem: "A patient recovering from a stroke is relearning to pick up a pencil and then to lift a 10-lb weight. The therapist explains that the same muscles grade their force differently for the two tasks. Which explanation is correct?",
  opts: [
    O("Picking up the pencil activates only a few motor units; lifting the weight recruits many additional motor units for more force.", true, "Force is graded by recruitment — calling in additional motor units. Few units for a pencil, many for a heavy weight. Framework: application of a physiologic principle."),
    O("Picking up the pencil uses small motor neurons only; lifting the weight makes each individual fiber contract harder and faster.", false, "A single fiber's contraction is not graded this way; whole-muscle force rises by recruiting more motor units."),
    O("Lifting the weight switches the muscle from twitch contractions to a different kind of muscle tissue built for heavy loads.", false, "The tissue does not change; the number of active motor units changes."),
    O("The pencil task uses anaerobic energy and the weight task uses aerobic energy, and the energy source sets the force produced.", false, "Energy systems fuel contraction but do not grade force; recruitment does.")
  ],
  tp: "One motor unit = 1 motor neuron + all fibers it supplies. Force is graded by recruitment. Framework: principle application." });
BANK.push({ cat: CB, type: "order", kt: ["Neuromuscular junction"],
  stem: "A nurse is teaching a patient with a new neuromuscular diagnosis. Place the events at the neuromuscular junction in the order they occur during a normal contraction.",
  items: [
    { t: "The nerve impulse arrives at the axon terminal of the somatic motor neuron", r: "The junction sequence starts with the impulse arriving at the terminal." },
    { t: "Acetylcholine is released from vesicles into the synaptic cleft", r: "Vesicles release ACh into the cleft second." },
    { t: "ACh binds receptors on the muscle membrane and a signal forms in the fiber", r: "Binding generates the muscle signal third." },
    { t: "Acetylcholinesterase destroys the ACh, freeing the binding sites for the next signal", r: "AChE cleanup is the final step, resetting the junction." }
  ],
  tp: "NMJ order: impulse → ACh release → receptor binding/signal → AChE destruction. Framework: process sequencing (nursing process — assessment of understanding)." });

/* ---------- MUSCLE RESPONSES AND ENERGY ---------- */
BANK.push({ cat: CC, type: "single", kt: ["Creatine phosphate"],
  stem: "A sprinter explodes off the blocks and, about 15 seconds into an all-out effort, begins relying on a second fuel source as the first is depleted. A nursing student asks which fuel powered the first seconds and which takes over. Which answer is correct?",
  opts: [
    O("Creatine phosphate powered the first ~15 seconds; glycolysis then takes over for the next 30 to 40 seconds, producing lactic acid.", true, "The energy sequence is creatine phosphate (~15 s), then glycolysis (~30–40 s, makes lactic acid), then aerobic metabolism for sustained ATP. Framework: sequence application."),
    O("Glycolysis powered the first ~15 seconds; creatine phosphate then takes over once glucose breakdown reaches full speed.", false, "The order is reversed — stored creatine phosphate is spent first because it replenishes ATP fastest."),
    O("Aerobic metabolism powered the first ~15 seconds because oxygen delivery peaks at the start of maximal exercise.", false, "Aerobic metabolism produces large ATP amounts but ramps up later; it cannot supply the first seconds of maximal effort."),
    O("Lactic acid powered the first ~15 seconds; creatine phosphate then converts the lactic acid back into usable ATP.", false, "Lactic acid is a by-product of glycolysis, not a fuel, and creatine phosphate does not convert it to ATP.")
  ],
  tp: "Energy sequence: creatine phosphate (~15 s) → glycolysis (30–40 s, lactic acid) → aerobic metabolism. Leftover conversion afterward = oxygen debt. Framework: sequence application." });
BANK.push({ cat: CC, type: "single", kt: ["Muscle fatigue"],
  stem: "A patient who ran a marathon yesterday reports deep muscle soreness that peaked today, 24 hours later, and asks if it is 'lactic acid buildup.' Which response by the nurse is accurate?",
  opts: [
    O("Soreness appearing 1 to 3 days after exercise comes from tears in connective tissue and muscle cell membranes, not from lactic acid.", true, "Latent soreness (1–3 days) is caused by micro-tears; lactic acid explains only the immediate soreness felt 30–60 minutes after exercise. Framework: evidence-based patient teaching."),
    O("Yes — lactic acid remains trapped in the muscle for several days after hard exercise and slowly irritates the tissue.", false, "Lactic acid does not linger for days; blaming it for day-later soreness is the classic trap the guide flags."),
    O("The soreness means the muscles are in a state of tetanus from yesterday's rapid stimulation and have not relaxed yet.", false, "Tetanus is a sustained contraction during stimulation, not next-day soreness."),
    O("The soreness is caused by oxygen debt, which takes 24 to 48 hours to be repaid after prolonged exercise.", false, "Oxygen debt is the leftover fuel conversion after exercise, not the cause of latent soreness.")
  ],
  tp: "Immediate soreness (30–60 min) = lactic acid. Latent soreness (1–3 days) = micro-tears, NOT lactic acid. Framework: myth-versus-evidence teaching." });
BANK.push({ cat: CC, type: "multi", kt: ["Muscle tone"],
  stem: "A nurse assessing a healthy resting patient notes the muscles are firm even though the patient is not moving. Which statements about this finding are correct? Select all that apply.",
  opts: [
    O("It reflects tonus — a continuous partial contraction maintained by muscle fibers taking turns.", true, "Muscle tone (tonus) is a continuous partial contraction in which fibers alternate so no single fiber fatigues."),
    O("It helps maintain posture and joint stability even at rest, which is part of why a resting muscle still feels firm.", true, "Tone supports posture and stabilizes joints as part of normal muscle function."),
    O("It generates heat that contributes to body temperature, even while the patient is lying still and not moving.", true, "Even partial contraction produces heat, one of the four functions of muscle."),
    O("It indicates the muscles are in tetanus from continuous rapid stimulation.", false, "Tetanus is a sustained maximal contraction from stimuli too rapid to allow relaxation — not normal resting tone."),
    O("It means every fiber in the muscle is contracting at the same time at low force.", false, "Tone is maintained by fibers taking turns, not by all fibers firing together.")
  ],
  tp: "Tonus = continuous partial contraction, fibers taking turns; supports posture/joints and generates heat. Not tetanus. Framework: finding interpretation." });

/* ---------- STRUCTURE / TYPES ---------- */
BANK.push({ cat: CE, type: "single", kt: ["Fascia", "Epimysium"],
  stem: "During a wound-care rotation, a nurse palpates a patient's thigh muscle and reviews its connective tissue packaging from the surface inward. Which sequence is correct?",
  opts: [
    O("Epimysium around the whole muscle, then perimysium around fascicles, then endomysium around single fibers.", true, "Outside-in: epimysium (whole muscle) → perimysium (bundles/fascicles) → endomysium (individual fibers); all layers extend into the tendon. Framework: structural sequencing."),
    O("Perimysium around the whole muscle, then epimysium around fascicles, then endomysium around single fibers.", false, "Perimysium wraps fascicles, not the whole muscle; epimysium is the outermost layer."),
    O("Endomysium around the whole muscle, then perimysium around fascicles, then epimysium around single fibers.", false, "Endomysium is the innermost layer around single fibers — the sequence is exactly reversed."),
    O("Epimysium around fascicles, then endomysium around the whole muscle, then perimysium around single fibers.", false, "Each layer is misplaced: epimysium = whole muscle, perimysium = fascicles, endomysium = single fibers.")
  ],
  tp: "Fascia outside-in: epimysium → perimysium → endomysium; layers continue into the tendon. Framework: structural sequencing." });
BANK.push({ cat: CF, type: "single", kt: ["Cardiac muscle"],
  stem: "A patient who had a heart attack asks why the damaged heart muscle will not grow back the way his torn calf muscle partially did. Which response by the nurse is accurate?",
  opts: [
    O("Cardiac muscle has no capacity for regeneration, so the damaged area is permanent; skeletal muscle has limited regeneration and smooth muscle regenerates best.", true, "The regeneration ladder is smooth > skeletal (limited) > cardiac (none), so heart attack damage is permanent. Framework: compare/contrast patient teaching."),
    O("Heart muscle regenerates at the same rate as skeletal muscle; his heart will recover fully if he rests it long enough.", false, "Cardiac muscle has NO regeneration capacity — rest does not regrow it."),
    O("His calf muscle cannot regenerate either, because no type of muscle tissue has any capacity for regeneration after injury.", false, "Skeletal muscle has limited regeneration and smooth muscle regenerates better still; only cardiac has none."),
    O("The heart does not regenerate because it is voluntary muscle and voluntary muscles heal only by forming scar tissue.", false, "Cardiac muscle is involuntary, and its failure to regenerate is a property of the tissue, not of voluntary control.")
  ],
  tp: "Regeneration: smooth best, skeletal limited, cardiac NONE. Framework: comparative teaching." });
BANK.push({ cat: CF, type: "single", kt: ["Hypertrophy"],
  stem: "A patient has worn a cast on a fractured leg for 6 weeks. At cast removal the leg is visibly smaller and weaker than the other. Which explanation and plan should the nurse give?",
  opts: [
    O("This is disuse atrophy from immobilization; progressive exercise can rebuild size and strength over time.", true, "Underuse in a cast causes disuse atrophy — the guide's own example — and exercise reverses it. Framework: problem identification → intervention."),
    O("This is denervation atrophy, which means the nerves to the leg were severed by the fracture and recovery is unlikely.", false, "Denervation atrophy follows severed nerves; a routine cast causes disuse atrophy, which is reversible."),
    O("This is senile atrophy, a normal part of aging that exercise cannot delay or reverse at any age.", false, "Senile atrophy is age-related; a casted young leg shows disuse atrophy, and exercise does help."),
    O("This is hypertrophy in reverse, caused by the muscle producing too much lactic acid while trapped in the cast.", false, "Hypertrophy is growth from overuse; lactic acid does not shrink muscle. The cause is underuse.")
  ],
  tp: "Cast → disuse atrophy (reversible with exercise). Denervation = severed nerves; senile = aging. Framework: differential diagnosis of findings." });

/* ---------- ROLES / NAMING / REGIONS ---------- */
BANK.push({ cat: CD, type: "single", kt: ["Prime mover", "Antagonist"],
  stem: "While assessing elbow flexion, the nurse notes the biceps brachii contracting while the triceps brachii relaxes. The patient asks why the triceps must relax for the arm to bend. Which explanation is correct?",
  opts: [
    O("The biceps is the prime mover for flexion and the triceps is its antagonist; the antagonist must yield so the prime mover can pull the insertion toward the origin.", true, "Prime mover performs the movement; the antagonist opposes it and must relax. The insertion (radius) is pulled toward the origin (scapula). Framework: role-relationship reasoning."),
    O("The triceps is the prime mover for flexion and it relaxes so the biceps, acting as the antagonist, can take over the movement.", false, "Roles are reversed: biceps flexes (prime mover), triceps extends and antagonizes flexion."),
    O("Both muscles are synergists for flexion, and the triceps relaxes because synergists always rest during a movement.", false, "Synergists assist the prime mover; the triceps opposes flexion, so it is the antagonist, not a synergist."),
    O("The triceps relaxes because its origin is on the movable bone and its insertion is on the stationary bone during flexion.", false, "Origin is the stationary attachment and insertion the movable one — the statement reverses them, and attachment swap is not why the antagonist relaxes.")
  ],
  tp: "Biceps = prime mover (flexion), triceps = antagonist; origin stationary, insertion movable and pulled toward origin. Framework: role-relationship reasoning." });
BANK.push({ cat: CG, type: "single", kt: ["Diaphragm"],
  stem: "A patient with a high cervical injury is noted to have severely impaired breathing. The nurse reviews which muscle must be assisted by ventilation. Which muscle is the chief muscle of inhalation whose failure explains this finding?",
  opts: [
    O("The diaphragm, which is the chief muscle of inhalation and enlarges the thoracic cavity when it contracts.", true, "The diaphragm is the chief muscle of inhalation; when it fails, ventilation must be assisted. Framework: structure-function application."),
    O("The sternocleidomastoid, which is the chief muscle of inhalation and enlarges the thoracic cavity when it contracts.", false, "The SCM moves the head (flexion/rotation); it is not the chief muscle of inhalation."),
    O("The transversus abdominis, which is the chief muscle of inhalation and enlarges the thoracic cavity when it contracts.", false, "The transversus abdominis is an abdominal-wall muscle that compresses the abdomen, not the chief inhalation muscle."),

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
