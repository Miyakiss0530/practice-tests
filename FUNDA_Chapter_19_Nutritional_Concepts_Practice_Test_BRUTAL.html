<script>

/* ============ QUESTION BANK ============ */

 CA: {

 },
 CB: {

 CD: {

 }
};

BANK.push({"cat": CA, "type": "single", "stem": "A postoperative patient is weak, has lost 4 lb in a week, and eats only a few bites at meals. The provider orders a high-kilocalorie, high-protein diet. Which of the following actions should the nurse take first at the next meal?", "opts": [{"t": "Serve the protein portion first and keep calorie-dense snacks within reach at all times", "c": true, "r": "Correct. Protein first, small volumes and dense additions protect intake in a compromised patient. Framework: Nursing Process, implementation matched to the deficit."}, {"t": "Serve a large salad and broth first so the patient fills up on lighter foods before protein", "c": false, "r": "Incorrect. Filling up on low-density foods first defeats a high-kilocalorie, high-protein order."}, {"t": "Offer only a clear liquid tray until the provider rechecks the patient at the next visit", "c": false, "r": "Incorrect. A clear liquid diet is low in kcal and protein and moves this patient further into deficit."}, {"t": "Document the poor intake and wait for the dietitian visit scheduled later in the week", "c": false, "r": "Incorrect. Waiting leaves a known deficit unaddressed; bedside serving strategies start now."}], "tp": "High-kcal/high-protein: small volumes, protein foods first, snacks always available, butter/oil/cheese/cream additions. Framework: Nursing Process."});

BANK.push({"cat": CA, "type": "single", "stem": "A patient with burns over a large area is eating a regular diet in normal portions, yet keeps losing weight. Which explanation should guide the nurse's next action?", "opts": [{"t": "Stress from the burns has raised energy and protein needs above a normal intake level", "c": true, "r": "Correct. Surgery, sepsis, fractures, burns and pressure injuries raise BMR and protein needs significantly."}, {"t": "The regular diet must be defective, because normal portions always meet any patient need", "c": false, "r": "Incorrect. A normal intake can be a deficit diet when physiologic stress raises requirements."}, {"t": "Weight loss after burns is expected and needs no change in the nutrition care plan at all", "c": false, "r": "Incorrect. Unmet needs cost protein stores and weight, and both energy and nitrogen balance go negative."}, {"t": "The patient should be switched to a clear liquid diet until the weight loss stops completely", "c": false, "r": "Incorrect. Clear liquids are low in kcal and protein and would deepen this patient's deficit."}], "tp": "Physiologic stress raises BMR: a normal intake can be a deficit for a burn, sepsis, trauma or pressure-injury patient. Framework: acute vs chronic."});

BANK.push({"cat": CA, "type": "multi", "stem": "A nurse is teaching a patient who wants to add more fiber for constipation. Which statements should the nurse include? Select all that apply.", "opts": [{"t": "Increase the fiber gradually over days rather than adding a large amount all at once", "c": true, "r": "Correct. A sudden jump in fiber causes bloating, gas and constipation instead of relief."}, {"t": "Drink at least eight glasses of water a day while the fiber intake is increasing", "c": true, "r": "Correct. Fiber is paired with at least 8 glasses of water a day; fiber without water backfires."}, {"t": "Choose whole grains and fresh fruits and vegetables over processed food products", "c": true, "r": "Correct. Whole grains and fresh produce carry the fiber with less sodium and fewer preservatives."}, {"t": "Double the fiber today and expect bowel results by this evening without extra fluids", "c": false, "r": "Incorrect. Doubling fiber suddenly, without fluids, causes bloating, gas and worse constipation."}, {"t": "Use fiber supplements instead of food, because food sources of fiber work too slowly", "c": false, "r": "Incorrect. The chapter advises fiber from fruits and vegetables rather than fiber supplements."}, {"t": "Expect fiber to supply extra calories that will help with the weight gain goal too", "c": false, "r": "Incorrect. Fiber has no nutritive value and supplies no usable energy to the patient."}], "tp": "Fiber rules: gradual increase, at least 8 glasses of water daily, food sources first. Framework: safety first in patient teaching."});

BANK.push({"cat": CA, "type": "single", "stem": "A patient added a large bowl of bran and three fiber bars yesterday and now reports bloating, gas and no bowel movement. Which of the following actions should the nurse take first?", "opts": [{"t": "Review how quickly the fiber was added and how much fluid the patient drank with it", "c": true, "r": "Correct. Too much fiber added too fast, without water, produces exactly this picture. Framework: Nursing Process, assessment before intervention."}, {"t": "Encourage another large bran serving tonight so the bowel is pushed to move by morning", "c": false, "r": "Incorrect. More fiber on top of a sudden load worsens bloating, gas and constipation."}, {"t": "Tell the patient fiber does not affect the bowel and the symptoms must have another cause", "c": false, "r": "Incorrect. Fiber directly affects stool bulk and transit; the timing here points to the fiber load."}, {"t": "Stop all fiber permanently and document fiber intolerance in the patient care record today", "c": false, "r": "Incorrect. The problem is the speed and fluid pairing, not fiber itself; gradual use is therapeutic."}], "tp": "Fiber added too fast causes bloating, gas and constipation. Assess the pattern before changing the plan. Framework: Nursing Process/ADPIE."});

BANK.push({"cat": CB, "type": "single", "stem": "A patient's lipid panel shows total cholesterol 246 mg/dL and LDL 172 mg/dL. Which teaching point should the nurse emphasize first?", "opts": [{"t": "Replace solid fats with oils and unsaturated fats, and choose seafood over fatty meats", "c": true, "r": "Correct. Substituting unsaturated for saturated fat is the chapter's highest-yield fat intervention. Framework: Maslow, physiologic risk reduction."}, {"t": "Add organ meats and egg yolks several times a week to raise the total cholesterol further", "c": false, "r": "Incorrect. Organ meats and egg yolks are concentrated cholesterol sources and LDL is already high."}, {"t": "Stop eating all plant foods, because plant foods are the source of dietary cholesterol", "c": false, "r": "Incorrect. Cholesterol is found only in animal foods; plant sterols can lower blood cholesterol."}, {"t": "Rely on the next lipid panel in a year, because values in this range need no diet change", "c": false, "r": "Incorrect. Total cholesterol at or above 240 and LDL 160 to 189 are both in the high ranges."}], "tp": "LDL 160-189 is high and total cholesterol 240 or more is high. Swap unsaturated for saturated and trans fats. Framework: safety first."});

BANK.push({"cat": CB, "type": "single", "stem": "A patient with a swollen abdomen, edema in the feet and face, and low albumin is a young child whose family reports plenty of rice but almost no protein foods. Which condition should the nurse suspect?", "opts": [{"t": "Kwashiorkor, in which edema and ascites make a protein-starved child look well fed", "c": true, "r": "Correct. Severe protein restriction with other calories present causes edema and a fatty liver. Framework: Nursing Process, cue recognition."}, {"t": "Marasmus, in which fat and muscle stores waste away to a skin-and-bones appearance", "c": false, "r": "Incorrect. Marasmus is total energy deficiency and looks like wasting, not swelling."}, {"t": "Normal growth, because a rounded abdomen and full face show the child is well fed now", "c": false, "r": "Incorrect. The swelling is edema and ascites from low albumin, not healthy tissue gain."}, {"t": "Fluid overload from heart failure, which is the usual cause of swelling at this age group", "c": false, "r": "Incorrect. The diet history and low albumin point to protein-energy malnutrition instead."}], "tp": "Kwashiorkor looks fat but is protein starvation: edema, ascites, low albumin. Marasmus is skin and bones. Framework: Nursing Process."});

BANK.push({"cat": CB, "type": "multi", "stem": "A patient recovering from major trauma has poor intake, muscle wasting and delayed wound healing. Which actions support a positive nitrogen balance? Select all that apply.", "opts": [{"t": "Provide adequate protein so tissue building can exceed the tissue being broken down daily", "c": true, "r": "Correct. Positive balance means building more tissue than is broken down; protein intake drives it."}, {"t": "Provide adequate carbohydrate so protein is spared from being burned just for energy", "c": true, "r": "Correct. Enough carbohydrate keeps protein from being burned for energy, preserving its building job."}, {"t": "Track intake records and wound healing as markers of whether the plan is working well", "c": true, "r": "Correct. Intake records, weight and wound healing are the response markers the nurse monitors."}, {"t": "Restrict protein so the healing wound is not stressed by extra nitrogen in the diet", "c": false, "r": "Incorrect. Restriction deepens negative balance, muscle atrophy and poor function of body systems."}, {"t": "Expect the balance to stay negative until discharge, because trauma prevents any building", "c": false, "r": "Incorrect. Negative balance is seen in trauma, but the care goal is restoring intake to reverse it."}, {"t": "Skip one day of protein foods each week to rest the kidneys of this trauma patient now", "c": false, "r": "Incorrect. A prolonged protein deficit, not a single day, is the danger, and this patient needs protein."}], "tp": "Negative nitrogen balance is catabolism (illness, burns, trauma). Restore energy and protein early. Framework: Nursing Process."});

BANK.push({"cat": CB, "type": "single", "stem": "A 16-year-old girl wants to protect her future bone health. She eats little dairy. Which teaching is most accurate for her age group?", "opts": [{"t": "Her calcium target is 1300 mg a day, and fortified foods can help when dairy intake is low", "c": true, "r": "Correct. Older children and adolescents need 1300 mg/day, and the peak bone mass window is now."}, {"t": "Her calcium target is 800 mg a day, and bone density is mostly set by age twelve years", "c": false, "r": "Incorrect. The adolescent target is 1300 mg/day and peak bone mass is reached at 19 to 30 years."}, {"t": "She can wait until menopause to think about calcium, because loss only starts after age 50", "c": false, "r": "Incorrect. Bone is built from birth to early adulthood; waiting until menopause is damage control."}, {"t": "Calcium supplements should replace food sources so she does not need fortified products", "c": false, "r": "Incorrect. Supplements should never replace calcium-rich foods, which provide other nutrients too."}], "tp": "Fill the calcium bank early: 1300 mg/day for adolescents, peak bone mass at 19 to 30 years. Framework: health promotion."});

BANK.push({"cat": CB, "type": "matrix", "stem": "For each patient statement, select whether it describes LDL cholesterol or HDL cholesterol.", "cols": ["LDL cholesterol", "HDL cholesterol"], "rows": [{"t": "It carried cholesterol out to my tissues, where plaque built up in my artery walls", "a": 0, "r": "Correct. LDL delivers cholesterol to the tissues and increases plaque buildup."}, {"t": "It carried cholesterol back to my liver so it could be broken down and excreted", "a": 1, "r": "Correct. HDL carries cholesterol to the liver to be degraded and excreted."}, {"t": "Raising it is a goal of my diet plan, because it removes cholesterol from circulation", "a": 1, "r": "Correct. The teaching goal is to lower LDL and increase or maintain HDL."}, {"t": "Lowering it is a goal of my diet plan, because it lays cholesterol down in arteries", "a": 0, "r": "Correct. LDL is the bad cholesterol targeted for reduction."}], "tp": "LDL = bad, delivers cholesterol to tissues and plaque. HDL = good, hauls cholesterol to the liver for disposal."});

BANK.push({"cat": CC, "type": "single", "stem": "An older adult in long-term care is confined indoors, drinks no milk, and has new bone pain and a stooped posture. Which nutrient problem should the nurse consider first?", "opts": [{"t": "Vitamin D deficiency, because sunlight exposure and fortified dairy intake are both absent", "c": true, "r": "Correct. Vitamin D comes from fortified dairy and skin exposure to sunlight; deficiency in adults is osteomalacia."}, {"t": "Vitamin C deficiency, because bleeding gums and easy bruising are the classic bone signs", "c": false, "r": "Incorrect. Those are scurvy signs; this picture of bone pain fits vitamin D and bone softening."}, {"t": "Vitamin K deficiency, because impaired clotting factors cause bone loss in older adults", "c": false, "r": "Incorrect. Vitamin K deficiency impairs clotting factor formation, not bone softening."}, {"t": "Niacin deficiency, because dermatitis and dementia are the classic signs in this setting", "c": false, "r": "Incorrect. Those describe pellagra; the risk pattern here is no sunlight plus no milk."}], "tp": "Vitamin D: fortified dairy, fish liver oils, and sunlight synthesis. Older adults confined indoors who drink no milk are the classic risk. Framework: Nursing Process."});

BANK.push({"cat": CC, "type": "single", "stem": "A patient had a total gastrectomy last year and now has a macrocytic anemia with tingling in the hands. Which treatment should the nurse expect?", "opts": [{"t": "Vitamin B12 injections continued for a lifetime, because oral B12 cannot be absorbed now", "c": true, "r": "Correct. Without intrinsic factor from the stomach, oral B12 does not work; injections are lifelong."}, {"t": "Oral vitamin B12 tablets with breakfast, increased until the anemia fully resolves", "c": false, "r": "Incorrect. After gastrectomy there is no intrinsic factor, so oral B12 cannot be absorbed."}, {"t": "Folic acid alone in high doses, because it corrects both the anemia and nerve symptoms", "c": false, "r": "Incorrect. Folate can mask B12 deficiency while neurologic damage continues; B12 is the need."}, {"t": "Iron tablets with orange juice, because all macrocytic anemias are caused by iron lack", "c": false, "r": "Incorrect. Iron deficiency causes microcytic anemia; this picture is B12 deficiency."}], "tp": "Pernicious anemia after gastrectomy: B12 injections for life. Folate masking B12 is a trap. Framework: safety first."});

BANK.push({"cat": CC, "type": "single", "stem": "A patient taking warfarin reports she has started eating large kale salads some days and none on others, and her anticoagulation results are swinging. Which teaching should the nurse give first?", "opts": [{"t": "Keep the amount of vitamin K foods about the same from one day to the next each week", "c": true, "r": "Correct. Vitamin K counteracts warfarin; consistency, not avoidance, keeps therapy stable. Framework: safety first, medication teaching."}, {"t": "Stop eating all green vegetables so the warfarin can work at its full strength daily", "c": false, "r": "Incorrect. The chapter teaches consistent vitamin K intake, not elimination of vitamin K foods."}, {"t": "Double the vitamin K foods on days when a warfarin dose is accidentally missed at home", "c": false, "r": "Incorrect. Large fluctuations in vitamin K intake alter the drug effect and destabilize therapy."}, {"t": "Add high-dose vitamin E supplements, which will steady the anticoagulant effect daily", "c": false, "r": "Incorrect. High-dose vitamin A and E supplements are to be avoided with anticoagulants."}], "tp": "Warfarin plus vitamin K means consistency day to day. Framework: safety first."});

BANK.push({"cat": CC, "type": "single", "stem": "A pregnant patient in her first trimester asks how to take the iron supplement she was prescribed. Which instruction is correct?", "opts": [{"t": "Take it with orange juice, and keep coffee, bran and milk away from the dose timing", "c": true, "r": "Correct. Vitamin C enhances iron absorption; bran, coffee and milk or calcium inhibit it. Framework: patient teaching, medication timing."}, {"t": "Take it with a glass of milk, which protects the stomach and improves iron absorption", "c": false, "r": "Incorrect. Milk and calcium work against iron absorption at the same time as the dose."}, {"t": "Take it with a high-fiber bran cereal, which speeds the iron through the bowel faster", "c": false, "r": "Incorrect. Bran with meals inhibits iron absorption, lowering what the patient receives."}, {"t": "Take it with morning coffee, because caffeine helps the iron dissolve more completely", "c": false, "r": "Incorrect. Coffee with meals inhibits iron absorption and is kept away from the dose."}], "tp": "Iron rules: vitamin C helps, bran, coffee, milk and calcium hinder. Pregnancy iron need is 27 mg/day. Framework: Nursing Process."});

BANK.push({"cat": CC, "type": "multi", "stem": "A nurse reviews a patient who takes several vitamin supplements in large doses. Which findings should prompt a report to the provider? Select all that apply.", "opts": [{"t": "Flushing and itching after starting a large-dose niacin supplement this past month", "c": true, "r": "Correct. Niacin toxicity from supplements presents with flushing and pruritus."}, {"t": "New tingling and clumsiness after months of very large vitamin B6 supplement doses", "c": true, "r": "Correct. Vitamin B6 toxicity causes peripheral neuropathy and impaired coordination."}, {"t": "More bruising and bleeding tendency after starting large-dose vitamin E supplements", "c": true, "r": "Correct. Vitamin E excess increases the tendency for hemorrhage in patients."}, {"t": "A request to take one simple multivitamin each day under provider supervision", "c": false, "r": "Incorrect. A simple multivitamin under supervision follows the chapter supplement rule."}, {"t": "Eating fortified cereal and milk at breakfast while taking a basic multivitamin", "c": false, "r": "Incorrect. Food sources plus a simple supplement do not match the toxicity patterns listed."}, {"t": "Taking vitamin C at the printed dietary level with meals during the winter months", "c": false, "r": "Incorrect. Toxicity signs for vitamin C are abdominal cramps and diarrhea at large doses."}], "tp": "Supplement toxicity: niacin flushing, B6 neuropathy, vitamin E hemorrhage tendency, and stored A and D poisoning. Framework: safety first."});

BANK.push({"cat": CC, "type": "matrix", "stem": "For each patient, select the vitamin deficiency that best matches the findings.", "cols": ["Vitamin B3 niacin", "Vitamin C", "Vitamin D", "Vitamin A"], "rows": [{"t": "Dermatitis, diarrhea, dementia and depression in a patient with a very limited diet", "a": 0, "r": "Correct. Pellagra is niacin deficiency with the D pattern."}, {"t": "Bleeding gums, easy bruising and a wound that is healing very poorly over weeks", "a": 1, "r": "Correct. Scurvy is vitamin C deficiency with gingivitis, bruising and poor healing."}, {"t": "Soft, painful bones in an adult who gets no sunlight and drinks no fortified milk", "a": 2, "r": "Correct. Osteomalacia is vitamin D deficiency in adults."}, {"t": "Night blindness progressing toward dry, damaged eyes in a malnourished patient", "a": 3, "r": "Correct. Night blindness and xerophthalmia are vitamin A deficiency findings."}], "tp": "Deficiency map: pellagra-B3, scurvy-C, osteomalacia-D in adults, night blindness-A, beriberi-B1."});

  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
