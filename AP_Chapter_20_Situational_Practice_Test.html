BANK.push({"cat": "When Drainage or Filtering Fails", "type": "single", "stem": "A client is 2 days post-mastectomy with removal of the axillary lymph nodes on the right. The right arm and shoulder are visibly swollen, the client is afebrile, and the incision is clean and dry. Which interpretation should guide the nurse's next action?", "tp": "Post-mastectomy arm/shoulder swelling on the node-removal side = lymphedema from impaired drainage — assess it as drainage failure first. [Framework: Acute vs Chronic]", "kt": ["Lymphedema"], "opts": [{"t": "The swelling is lymphedema from impaired lymph drainage on the side where the nodes were removed", "c": true, "r": "Node removal frequently impairs drainage of that side; edema of the arm and shoulder on that side is the chapter's expected pattern."}, {"t": "The swelling is an incision infection that requires the nurse to start wound cultures before any assessment", "c": false, "r": "There is no fever, redness, or drainage in the data — and this swelling pattern follows node removal, not infection."}, {"t": "The swelling is fluid overload that requires the nurse to restrict all oral fluids for the next 24 hours", "c": false, "r": "The guide's teaching point is explicit: this edema is from impaired lymph drainage, not fluid overload."}, {"t": "The swelling is an allergic reaction that requires the nurse to stop all medications and monitor the airway", "c": false, "r": "No new drug, rash, or airway finding is given; the timing and one-sided pattern point to impaired drainage."}]});
BANK.push({"cat": "When Drainage or Filtering Fails", "type": "single", "stem": "During discharge teaching after mastectomy with axillary node removal, a client says, \"If my arm swells, it will mean I have an infection or too much fluid in my body.\" Which response by the nurse is correct?", "tp": "Teach it plainly: arm swelling after node removal is impaired lymph drainage (lymphedema), not infection or fluid overload. [Framework: Nursing Process/ADPIE]", "kt": ["Lymphedema"], "opts": [{"t": "Correct the statement: swelling there is lymphedema from impaired lymph drainage after node removal", "c": true, "r": "The guide's patient teaching states this edema is caused by impaired drainage of lymph, not by infection or fluid overload."}, {"t": "Agree with the statement and teach the client to watch for fever as the first sign of arm swelling later", "c": false, "r": "Agreeing leaves the core misconception in place — the client has named the two wrong causes the guide warns against."}, {"t": "Correct only the infection part: explain that the swelling is fluid overload and fluids should be limited", "c": false, "r": "Fluid overload is also wrong here; swapping one wrong cause for another fails the teaching goal."}, {"t": "Defer the question to the surgeon at the follow-up visit because arm swelling is outside nursing teaching", "c": false, "r": "This is core discharge teaching the nurse can and should correct now, before the client goes home."}]});
BANK.push({"cat": "When Drainage or Filtering Fails", "type": "single", "stem": "A client's sentinel lymph node biopsy after dye injection is reported negative. The client asks what this means for the rest of her care. Which explanation is most accurate?", "tp": "Sentinel negative = assumed no spread to axillary nodes, and it spares the extensive dissection. [Framework: Nursing Process/ADPIE]", "kt": ["Sentinel lymph node"], "opts": [{"t": "It is assumed the cancer has not spread to the axillary nodes, so an extensive node dissection may be avoided", "c": true, "r": "A negative sentinel node is taken to mean no spread to the axillary nodes — the point of the biopsy is to avoid extensive dissection."}, {"t": "It is assumed the cancer has spread to the axillary nodes, so an extensive node dissection will now be required", "c": false, "r": "That is the meaning of a positive, not a negative, sentinel result."}, {"t": "It means the breast tumor itself was benign, so no further follow-up of the breast will be needed at any point", "c": false, "r": "The biopsy samples the first draining node, not the tumor; it answers a spread question, not a benign-versus-malignant question about the tumor."}, {"t": "It means dye failed to reach any node, so the biopsy result cannot be used to guide any treatment decisions", "c": false, "r": "The node was identified by dye and biopsied; a negative result is usable and guides treatment."}]});
BANK.push({"cat": "When Drainage or Filtering Fails", "type": "single", "stem": "Pathology reports that of the axillary lymph nodes removed and biopsied for a client with breast cancer, several are positive. Which statement about the next phase of care is most accurate?", "tp": "Count the positive nodes — that number drives further treatment after biopsy. [Framework: Nursing Process/ADPIE]", "kt": ["Lymph node"], "opts": [{"t": "Further treatment will often depend on how many of the biopsied lymph nodes are positive for cancer", "c": true, "r": "The guide states further treatment often depends on how many removed nodes are positive (malignant)."}, {"t": "Further treatment is already fixed, because the number of positive lymph nodes never changes the care plan", "c": false, "r": "The node count is the key diagnostic finding that guides what comes next — it is not irrelevant."}, {"t": "A positive node result means all treatment can stop, because the surgery has removed every cancer cell present", "c": false, "r": "Positive nodes show cancer had already spread to them; that raises, not ends, the need for further treatment decisions."}, {"t": "A positive node result only affects the drainage of the arm and has no bearing on any cancer treatment choices", "c": false, "r": "Node positivity is a cancer-spread finding first; drainage effects are a separate consequence of node removal."}]});
BANK.push({"cat": "When Drainage or Filtering Fails", "type": "single", "stem": "A client with breast cancer asks how cancer cells from her breast were found in the nodes under her arm. Which explanation by the nurse is correct?", "tp": "Breast → lymphatic vessels → axillary nodes is the chapter's metastasis route. [Framework: Nursing Process/ADPIE]", "kt": ["Axillary lymph nodes"], "opts": [{"t": "Many cancers spread by way of the lymphatic vessels, and breast cancer commonly spreads to the axillary nodes", "c": true, "r": "The guide states cancers metastasize by way of lymphatic vessels, and breast cancer commonly metastasizes to axillary nodes, which drain the breast."}, {"t": "Cancer cells reached the armpit nodes by traveling backward through the valves of the blood capillaries nearby", "c": false, "r": "Lymphatic valves prevent backflow; the route described in the chapter is spread along the lymphatic vessels, not backward through blood vessels."}, {"t": "Cancer cells reached the armpit nodes because the spleen filtered them out of the blood and stored them there", "c": false, "r": "The spleen filters blood in the left upper abdomen; it does not deposit cells into axillary nodes."}, {"t": "Cancer cells reached the armpit nodes through the thoracic duct after it emptied lymph into the subclavian vein", "c": false, "r": "The duct empties lymph into venous blood at the end of the route; axillary nodes are the breast's regional filtering nodes along the way."}]});
BANK.push({"cat": "When Drainage or Filtering Fails", "type": "single", "stem": "In a clinic overseas, a client presents with one leg massively enlarged, resembling an elephant's leg, after an infestation of small worms blocked the lymphatic vessels of the limb. Which assessment is the priority?", "tp": "Blocked vessels → lymph cannot drain → fluid accumulates. Compare limb size with the unaffected side. [Framework: Safety First]", "kt": ["Elephantiasis", "Filariae"], "opts": [{"t": "Compare the size and swelling of the affected limb with the unaffected side and assess drainage status", "c": true, "r": "Limb size compared with the unaffected side is the guide's assessment for this drainage-failure condition."}, {"t": "Assess the client's spleen size first, because this swelling is caused by the spleen destroying red blood cells", "c": false, "r": "RBC destruction by an overactive spleen causes hemolytic anemia, not a massively swollen blocked limb."}, {"t": "Assess the client's tonsils first, because this swelling begins with pathogens entering through the mouth", "c": false, "r": "Tonsils filter nose/mouth pathogens in the throat; they do not explain a blocked, massively swollen leg."}, {"t": "Assess the client's thymus first, because this swelling is caused by thymosin hormones blocking the vessels", "c": false, "r": "Thymosins promote lymphocyte maturation; the stated cause here is worm blockage of lymphatic vessels."}]});
BANK.push({"cat": "When Drainage or Filtering Fails", "type": "single", "stem": "A client with elephantiasis asks why the blocked vessels made the leg swell so much. Which explanation by the nurse is correct?", "tp": "Elephantiasis mechanism: filariae block vessels → no drainage → fluid accumulates in tissues. [Framework: Nursing Process/ADPIE]", "kt": ["Elephantiasis"], "opts": [{"t": "With the vessels blocked, lymph cannot drain from the tissue spaces, so fluid accumulates in the tissues", "c": true, "r": "That is the chapter's mechanism: blockage prevents drainage and fluid accumulates, producing the massive swelling."}, {"t": "With the vessels blocked, the tissues make extra lymph each hour, so fluid accumulates in the tissues there", "c": false, "r": "The problem is failed drainage of normal lymph, not overproduction — about 3 L/day is the normal lymph volume."}, {"t": "With the vessels blocked, the veins return extra blood to the leg, so fluid accumulates in the tissues there", "c": false, "r": "About 85% of tissue fluid returns via blood capillaries normally; this swelling follows lymphatic blockage specifically."}, {"t": "With the vessels blocked, the lymph nodes filter extra platelets, so fluid accumulates in the tissues there", "c": false, "r": "Platelet handling belongs to the spleen; it does not explain fluid trapped behind blocked lymphatic vessels."}]});
BANK.push({"cat": "Thymus Gland and Spleen", "type": "single", "stem": "Three months after a splenectomy, a client calls reporting a fever, chills, and feeling 'like an infection is taking hold fast.' Which action is the priority?", "tp": "No spleen = lives well, but more vulnerable to infection. New fever/chills get evaluated promptly. [Framework: Safety First]", "kt": ["Spleen"], "opts": [{"t": "Direct the client to be evaluated promptly, because a person without a spleen is more vulnerable to infection", "c": true, "r": "The guide states the splenectomized patient may be more vulnerable to infection — new infection signs warrant prompt evaluation."}, {"t": "Reassure the client that people live quite well without a spleen, so a fever at home needs no evaluation today", "c": false, "r": "'Lives quite well' does not erase the stated infection vulnerability; dismissing a fever misses the one risk the guide names."}, {"t": "Tell the client the fever is expected after splenectomy and to recheck the temperature again in about one week", "c": false, "r": "Three months post-op, a new fever with chills is not an expected surgical finding to watch for a week."}, {"t": "Advise the client to double the next dose of any leftover antibiotic at home and call back only if pain develops", "c": false, "r": "Self-medicating with leftover antibiotics is unsafe and delays the prompt evaluation this vulnerability requires."}]});
BANK.push({"cat": "Thymus Gland and Spleen", "type": "single", "stem": "A client scheduled for splenectomy asks, \"Will I be able to live normally without a spleen?\" Which response by the nurse is most accurate?", "tp": "Splenectomy teaching: livable without it, more vulnerable to infection with it gone. [Framework: Nursing Process/ADPIE]", "kt": ["Spleen"], "opts": [{"t": "Yes — people can live quite well without a spleen, although they may be more vulnerable to infection", "c": true, "r": "That is the guide's exact balance: life without a spleen is quite livable, with added infection vulnerability."}, {"t": "No — the spleen is required for survival, so the surgery will be cancelled if the client asks about living without it", "c": false, "r": "The spleen is commonly removed when injured; survival without it is expected, not impossible."}, {"t": "Yes — removing the spleen changes nothing at all, and the client's infection risk will stay exactly the same afterward", "c": false, "r": "This over-reassures: the guide specifically adds greater vulnerability to infection after splenectomy."}, {"t": "No — without a spleen the body cannot make any lymphocytes, so the client will need lifelong lymphocyte transfusions", "c": false, "r": "The spleen continues lymphocyte work, but other lymphatic tissue remains; no such transfusion need is stated."}]});
BANK.push({"cat": "Thymus Gland and Spleen", "type": "single", "stem": "A client arrives after a blow to the left upper abdomen. The left upper quadrant is tender, the pulse is rising, and the client looks pale. Knowing the spleen's location and behavior, which concern is the priority?", "tp": "LUQ trauma + rising pulse + pallor: think spleen — protected by ribs, but commonly injured and prone to bleed. [Framework: ABCs]", "kt": ["Spleen"], "opts": [{"t": "The spleen is commonly injured, is prone to bleed, and is difficult to repair, so bleeding must be assessed first", "c": true, "r": "LUQ location beneath the diaphragm, common injury, bleeding tendency, and difficult repair are all stated in the guide."}, {"t": "The thymus is commonly injured in abdominal trauma, is prone to bleed, and must be assessed first at this visit", "c": false, "r": "The thymus sits in the mediastinum of the chest, not the left upper abdomen, and is not the bleeding concern here."}, {"t": "The appendix is commonly injured in left-sided trauma, is prone to bleed, and must be assessed first at this visit", "c": false, "r": "The appendix is an outpouching of the large intestine with lymphatic nodules; the LUQ bleeding organ in the guide is the spleen."}, {"t": "The tonsils are commonly injured in abdominal trauma, are prone to bleed, and must be assessed first at this visit", "c": false, "r": "Tonsils are in the throat filtering nose/mouth pathogens; they are unrelated to an LUQ blow."}]});
BANK.push({"cat": "Thymus Gland and Spleen", "type": "single", "stem": "Laboratory results for a client with an overactive spleen show a falling platelet count, and the client reports new gum bleeding. Which explanation connects these findings?", "tp": "Overactive spleen + platelets = thrombocytopenia and bleeding. Keep it separate from the RBC problem. [Framework: Acute vs Chronic]", "kt": ["Thrombocytopenia", "Spleen"], "opts": [{"t": "The overactive spleen is removing too many platelets from the circulation, causing thrombocytopenia and bleeding", "c": true, "r": "The guide: an overactive spleen removing platelets causes thrombocytopenia and bleeding — exactly this pairing."}, {"t": "The overactive spleen is destroying normal red blood cells too quickly, causing thrombocytopenia and bleeding here", "c": false, "r": "Destroying RBCs causes hemolytic anemia — a different overactivity problem with a different lab pattern."}, {"t": "The overactive spleen is storing too much of its 350 mL blood reserve, causing thrombocytopenia and bleeding here", "c": false, "r": "Releasing or storing reservoir blood is a separate spleen function; platelet removal is the mechanism named for this finding."}, {"t": "The overactive thymus is removing too many platelets from the circulation, causing thrombocytopenia and bleeding", "c": false, "r": "Platelet removal is a spleen function; the thymus matures T lymphocytes and secretes thymosins."}]});
BANK.push({"cat": "Thymus Gland and Spleen", "type": "single", "stem": "A client with an overactive spleen develops anemia, and testing shows normal red blood cells are being destroyed faster than they should be. Which term and mechanism are correct?", "tp": "Spleen overactivity splits two ways: platelets → thrombocytopenia/bleeding; RBCs → hemolytic anemia. [Framework: Nursing Process/ADPIE]", "kt": ["Hemolytic anemia", "Spleen"], "opts": [{"t": "Hemolytic anemia, because the overactive spleen is destroying normal red blood cells in the circulation", "c": true, "r": "The guide: an overactive spleen destroying normal RBCs causes hemolytic anemia."}, {"t": "Thrombocytopenia, because the overactive spleen is destroying normal red blood cells in the circulation", "c": false, "r": "Thrombocytopenia is the platelet-removal problem; RBC destruction produces hemolytic anemia."}, {"t": "Hemolytic anemia, because the overactive spleen is removing too many platelets from the client's circulation", "c": false, "r": "The term is right but the mechanism is the platelet one — the pairing must match to be correct."}, {"t": "Self-transfusion, because the overactive spleen is destroying normal red blood cells in the circulation now", "c": false, "r": "Self-transfusion is the release of stored splenic blood after blood loss, not a destruction process."}]});

    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
