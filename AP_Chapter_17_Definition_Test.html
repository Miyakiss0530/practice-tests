<style>

.mrow.bad{border-color:#dc2626;background:#fef2f2}

.nav button{width:38px;height:38px;margin:3px;border-radius:9px;border:2px solid #ddd5f7;background:#fff;color:#3b1a8a;font-weight:700;font-size:13px}

<body>
<div id="app"></div>
<script>
/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Cardiac Cycle and Diastole";
var CB = "Autonomic Control and Receptors";
var CC = "Cardiac Output and Heart Talk";
var CD = "Heart Failure Meanings";
var CE = "Takotsubo, Aging, and Exercise";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = ["systole","diastole","cardiac output","stroke volume","preload","afterload","ejection fraction","chronotropic","dromotropic","inotropic","vagomimetic","vagolytic","orthopnea","cor pulmonale"];
var BLUEPRINT = {
  CA: { name: CA, count: 7 },
  CB: { name: CB, count: 8 },
  CC: { name: CC, count: 8 },
  CD: { name: CD, count: 7 },
  CE: { name: CE, count: 4 }
};

BANK.push({ cat: CA, type: "single", kt: ["systole","diastole"],
  stem: "During ventricular systole, which event happens in the heart?",
  opts: [
    O("The ventricles contract, the AV valves snap shut, and the semilunar valves are pushed open", true, "Ventricular contraction forces blood against the AV valves, snapping them shut, then pushes the semilunar valves open into the pulmonary trunk and aorta."),
    O("The atria contract, the AV valves stay open, and the ventricles remain relaxed and filling", false, "That describes atrial systole, the first stage, not ventricular systole."),
    O("Both chambers relax together, the AV valves stay open, and blood flows into the atria", false, "That describes the diastole stage, when both chambers are relaxed."),
    O("The ventricles relax, the semilunar valves stay open, and blood flows back into the atria", false, "Semilunar valves do not stay open to let blood flow backward during relaxation.")
  ],
  tp: "Stage order matters: atrial systole fills, ventricular systole ejects, then diastole rests both chambers. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "single", kt: ["diastole"],
  stem: "Why does a very fast heart rate reduce coronary blood flow to the myocardium?",
  opts: [
    O("Coronary flow happens during diastole, and a fast rate shortens diastole the most", true, "As heart rate rises the cycle shortens and diastole shortens most; coronary flow occurs in diastole, so the muscle receives less oxygen."),
    O("Coronary flow happens during systole, and a fast rate shortens systole the most", false, "Coronary flow occurs during diastole, not systole."),
    O("Coronary flow stops during atrial systole, and a fast rate lengthens atrial systole", false, "Atrial systole is brief and is not the phase that governs coronary flow."),
    O("Coronary flow depends on the atrial kick, and a fast rate removes the atrial kick", false, "Loss of the atrial kick is a feature of atrial fibrillation, not of a fast rate itself.")
  ],
  tp: "Diastole is both the filling period and the coronary-flow period — shortening it cuts filling and oxygen together. [Framework: ABCs]" });

BANK.push({ cat: CA, type: "single", kt: ["diastole"],
  stem: "At a heart rate of 70 beats/min, how long does one cardiac cycle last, and how long do all chambers rest?",
  opts: [
    O("The cycle lasts 0.8 second, and all chambers rest together for 0.4 second", true, "At 70 beats/min the cycle is 0.8 second, with 0.4 second when all chambers rest."),
    O("The cycle lasts 0.8 second, and all chambers rest together for 0.8 second", false, "Only half the 0.8-second cycle is the all-chambers rest period."),
    O("The cycle lasts 0.4 second, and all chambers rest together for 0.8 second", false, "The rest period cannot be longer than the whole cycle."),
    O("The cycle lasts 1.2 seconds, and all chambers rest together for 0.4 second", false, "1.2 seconds is not the cycle length given for a rate of 70 beats/min.")
  ],
  tp: "At 70 beats/min: 0.8-second cycle, 0.4 second of complete rest — the numbers shrink as rate rises. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "multi", kt: ["systole","diastole"],
  stem: "Which statements about filling of the ventricles are correct? Select all that apply.",
  opts: [
    O("Much of the blood flows passively into the ventricles during diastole", true, "Because the AV valves are open in diastole, much filling is passive."),
    O("About 70% of blood flows passively from the atria into the ventricles", true, "Passive flow accounts for about 70% of ventricular filling."),
    O("Atrial contraction supplies the remaining 30% of ventricular filling", true, "The atrial kick supplies the remaining 30% after passive filling."),
    O("The ventricles fill mainly while they are contracting in ventricular systole", false, "Ventricular systole ejects blood; it does not fill the ventricles."),
    O("Filling requires the semilunar valves to open into the pulmonary trunk", false, "Open semilunar valves move blood out of the ventricles, not into them.")
  ],
  tp: "Filling is 70% passive in diastole plus a 30% atrial kick — systole is ejection, never filling. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "single",
  stem: "What makes the AV valves snap shut at the start of ventricular systole?",
  opts: [
    O("Blood forced against them by ventricular contraction, driven by pressure changes", true, "Heart valves open and close in response to pressure changes; ventricular contraction forces blood against the AV valves and snaps them shut."),
    O("A signal from the vagus nerve that pulls both AV valves closed together", false, "The vagus slows rate and conduction; it does not mechanically close valves."),
    O("Contraction of the atria that pushes both AV valves closed from above", false, "Atrial contraction occurs in atrial systole, when the AV valves are open."),
    O("Relaxation of the ventricles that drops pressure and pulls the valves shut", false, "Relaxation is diastole; the valves shut when ventricular pressure rises.")
  ],
  tp: "Valves are pressure-driven, not nerve-driven — rising ventricular pressure closes the AV valves. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "order",
  stem: "Place the three stages of the cardiac cycle in their correct order.",
  items: [
    { t: "Atrial systole — atria contract and pump blood into the ventricles", r: "Stage 1: the atria contract while the AV valves are open and the ventricles are relaxed." },
    { t: "Ventricular systole — ventricles contract and eject blood", r: "Stage 2: AV valves snap shut and blood pushes the semilunar valves open." },
    { t: "Diastole — both atria and ventricles relax and the atria fill", r: "Stage 3: both chambers rest briefly while blood flows into the atria." }
  ],
  tp: "Fill (atrial systole), eject (ventricular systole), rest and refill (diastole) — in that order, every beat. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "single", kt: ["diastole"],
  stem: "A tachycardia episode brings on chest pain. Which pair of reasons does the chapter give?",
  opts: [
    O("Less ventricular filling time and less coronary flow during shortened diastole", true, "Both reasons trace to shortened diastole: less filling time means less blood pumped, and coronary flow in diastole falls."),
    O("More ventricular filling time and more coronary flow during lengthened diastole", false, "Tachycardia shortens diastole; it does not lengthen it."),
    O("Loss of the atrial kick and backup of blood into the pulmonary capillaries", false, "Atrial-kick loss belongs to atrial fibrillation, and pulmonary backup belongs to left failure."),
    O("Excess vagal discharge and slowing of conduction through the AV node", false, "That pair describes excess vagal activity and bradycardia, not tachycardia pain.")
  ],
  tp: "Tachycardia chest pain = less filling plus less coronary flow, both from a shortened diastole. [Framework: ABCs]" });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement correctly describes what the autonomic nervous system does to the heart?",
  opts: [
    O("It changes firing rate, conduction speed, and force, but it does not cause the impulse", true, "The impulse arises in the SA node on its own; the ANS only adjusts rate, speed, and force."),
    O("It causes each impulse in the SA node, and the heart cannot beat without it firing", false, "Specialized cardiac tissue has automaticity; the ANS does not cause the impulse."),
    O("It changes only heart rate, and it never affects conduction speed or contractile force", false, "The ANS changes all three: rate, conduction speed, and force of contraction."),
    O("It supplies the ventricular myocardium through the vagus nerve to control force directly", false, "There is no vagal innervation of the ventricular myocardium at all.")
  ],
  tp: "The SA node fires itself; the ANS is a tuner of rate, speed, and force — not the starter. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single",
  stem: "A drug increases heart rate but produces no change in the strength of contraction through vagal pathways. What explains a vagal drug having no force effect?",
  opts: [
    O("The vagus nerve supplies the SA and AV nodes only, with no fibers to ventricular muscle", true, "No parasympathetic fibers innervate the ventricular myocardium, so vagal effects never change contraction force."),
    O("The vagus nerve supplies ventricular muscle only, with no fibers to the SA node itself", false, "The vagus does supply the SA node; it is the ventricular myocardium it does not supply."),
    O("Acetylcholine strengthens ventricular muscle, so vagal drugs cancel their own force effect", false, "Acetylcholine produces no inotropic effect through muscarinic activation."),
    O("Norepinephrine blocks every vagal fiber before it can reach any part of the heart muscle", false, "Norepinephrine is the sympathetic transmitter; it does not block vagal fibers.")
  ],
  tp: "No vagal fibers reach the ventricular myocardium — vagal effects are rate and conduction only. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "multi",
  stem: "Which effects follow sympathetic stimulation of the heart? Select all that apply.",
  opts: [
    O("Increased SA node activity, which increases heart rate", true, "Sympathetic stimulation increases SA node activity and heart rate."),
    O("Faster conduction from the SA node through the AV node and His-Purkinje system", true, "Sympathetic stimulation increases the speed of the cardiac impulse."),
    O("Increased force of myocardial contraction in the ventricular myocardium", true, "Sympathetic nerves supply the ventricular myocardium and increase force."),
    O("Decreased SA node activity, which lowers heart rate toward 72 beats/min", false, "Decreased SA activity is the vagal braking effect, not sympathetic."),
    O("No change in conduction speed through the AV node or His-Purkinje system", false, "Sympathetic stimulation speeds conduction; it does not leave it unchanged.")
  ],
  tp: "Sympathetic = three increases: rate, conduction speed, and force — all three, every time. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single",
  stem: "Without vagal braking, at about what rate would the SA node fire on its own, and what is the normal resting rate with vagal tone?",
  opts: [
    O("About 90 beats/min on its own, slowed by vagal tone to about 72 beats/min", true, "The SA node would fire near 90 beats/min alone; vagal braking slows it to the normal resting 72 beats/min."),
    O("About 72 beats/min on its own, slowed by vagal tone to about 60 beats/min", false, "72 beats/min is the resting rate after braking, not the unbraked rate."),
    O("About 100 beats/min on its own, raised by vagal tone to about 120 beats/min", false, "Vagal tone slows the rate; it never raises it."),
    O("About 60 beats/min on its own, raised by sympathetic tone to about 90 beats/min", false, "The 90 beats/min figure is the SA node's own rate without vagal braking.")
  ],
  tp: "SA node alone ≈ 90 beats/min; resting vagal brake brings it to ≈ 72 beats/min. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single", kt: ["vagomimetic","vagolytic"],
  stem: "Digoxin is classified as vagomimetic and atropine as vagolytic. What does that pairing mean?",
  opts: [
    O("Digoxin mimics vagal stimulation and slows the heart; atropine blocks vagal effects and speeds it", true, "Vagomimetic copies the vagus (digoxin decreases rate and slows conduction); vagolytic blocks the vagus (atropine increases rate)."),
    O("Digoxin blocks vagal stimulation and speeds the heart; atropine mimics vagal effects and slows it", false, "The two labels are reversed in this statement."),
    O("Both drugs mimic vagal stimulation, and both are used to slow a heart that is beating too fast", false, "Atropine blocks vagal effects; it does not mimic them."),
    O("Both drugs block vagal stimulation, and both are used to raise a heart rate that is too slow", false, "Digoxin mimics vagal effects; it does not block them.")
  ],
  tp: "Mimetic = mimics, lytic = blocks: digoxin copies the vagus, atropine blocks it. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single",
  stem: "Activation of beta1-adrenergic receptors produces which combination of effects?",
  opts: [
    O("Positive chronotropic, positive dromotropic, and positive inotropic effects together", true, "Beta1 activation raises rate, conduction speed, and force, so heart rate and stroke volume and cardiac output rise."),
    O("Negative chronotropic, negative dromotropic, and no inotropic effect of any kind", false, "That combination describes muscarinic activation, not beta1 activation."),
    O("Positive chronotropic effect only, with no change in conduction or in force", false, "Beta1 activation changes all three: rate, speed, and force."),
    O("Negative inotropic effect only, with no change in rate or in conduction speed", false, "Beta1 activation is positive inotropic, not negative.")
  ],
  tp: "Beta1 activation is the sympathetic package: + rate, + conduction, + force. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single",
  stem: "Activation of muscarinic receptors produces which combination of effects?",
  opts: [
    O("Negative chronotropic and negative dromotropic effects, with no inotropic effect", true, "Muscarinic activation slows rate and conduction speed and does not change contractile force."),
    O("Positive chronotropic and positive dromotropic effects, with a positive inotropic effect", false, "That combination describes beta1 activation, not muscarinic activation."),
    O("Negative inotropic effect only, with no change in rate or in conduction speed", false, "Muscarinic activation has no inotropic effect at all."),
    O("Positive inotropic effect only, with no change in rate or in conduction speed", false, "Muscarinic activation never strengthens contraction.")
  ],
  tp: "Muscarinic activation: − rate, − conduction, zero force — because the vagus never reaches the ventricles. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single",
  stem: "A patient taking propranolol starts exercising. Why does the heart rate fail to rise as expected?",
  opts: [
    O("Beta1 blockade prevents cardiac beta1 activation when the sympathetic nerves fire", true, "A beta1 blocker such as propranolol prevents beta1 activation, so sympathetic firing in exercise or stress does not raise the rate."),
    O("Muscarinic blockade removes the vagal brake that normally holds the rate down at rest", false, "Removing the vagal brake would raise the rate, not prevent it rising."),
    O("Beta1 agonist activity occupies the receptors so norepinephrine cannot bind to them", false, "Propranolol is a blocker, not an agonist."),
    O("Vagomimetic activity slows the SA node so strongly that exercise cannot overcome it", false, "Propranolol works by beta1 blockade, not by mimicking the vagus.")
  ],
  tp: "Block the beta1 receptor and sympathetic firing cannot raise rate, speed, or force. [Framework: Safety First]" });

BANK.push({ cat: CC, type: "single", kt: ["cardiac output","stroke volume"],
  stem: "A resting patient has a heart rate of 72 beats/min and a stroke volume of about 70 mL. Which statement about cardiac output is correct?",
  opts: [
    O("Cardiac output equals heart rate times stroke volume, giving about 5 L/min here", true, "CO = HR × SV; 72 × about 70 mL is about 5 L/min, the normal resting cardiac output."),
    O("Cardiac output equals stroke volume divided by heart rate, giving about 1 mL/min here", false, "Cardiac output is a product, not a quotient, of rate and stroke volume."),
    O("Cardiac output equals heart rate plus stroke volume, giving about 142 mL/min here", false, "The two factors are multiplied, not added."),
    O("Cardiac output is set by venous return alone, so rate and stroke volume do not matter", false, "Venous return is matched by output, but output itself is determined by HR and SV.")
  ],
  tp: "CO = HR × SV — exactly two factors, and changing either one changes output. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["stroke volume"],
  stem: "Under Starling's law, what happens when more blood returns to the ventricle?",
  opts: [
    O("The ventricle stretches more, contracts more strongly, and stroke volume increases", true, "Greater stretch from greater venous return increases contractile force and stroke volume, matching output to return."),
    O("The ventricle stretches more, contracts more weakly, and stroke volume decreases", false, "Starling's law links greater stretch to stronger, not weaker, contraction."),
    O("The ventricle stretches less, contracts more strongly, and stroke volume increases", false, "Less filling means less stretch and a smaller stroke volume."),
    O("The muscle contracts more strongly with no stretch, through a positive inotropic effect", false, "Force without stretch is the inotropic effect, not Starling's law.")
  ],
  tp: "Starling: stretch drives force. Inotropic: force changes without stretch. Never merge the two. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["preload"],
  stem: "A drug dilates the veins so blood pools in them. What happens to preload and cardiac output?",
  opts: [
    O("Venous return falls, so preload, stroke volume, and cardiac output all decrease", true, "Pooling blood in dilated veins decreases venous return, preload, stroke volume, and cardiac output together."),
    O("Venous return rises, so preload, stroke volume, and cardiac output all increase", false, "That chain follows a drug that constricts the veins, not one that dilates them."),
    O("Preload rises while stroke volume and cardiac output fall in the opposite direction", false, "Preload, stroke volume, and output move in the same direction in this chain."),
    O("Preload stays unchanged because preload is set only by resistance in the aorta", false, "Resistance in the aorta is afterload; preload is the EDV filling the ventricle.")
  ],
  tp: "Vein dilation → pooling → less return → less preload → less output. Vein constriction reverses every step. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["afterload"],
  stem: "Which change increases left-ventricular afterload?",
  opts: [
    O("Systemic hypertension, which raises the resistance the left ventricle pumps against", true, "Afterload is resistance to flow; systemic hypertension and aortic stenosis raise left-ventricular afterload."),
    O("Venodilation, which pools blood in the veins and lowers the return to the heart", false, "Venodilation lowers venous return and preload, not afterload."),
    O("A larger end-diastolic volume, which stretches the ventricle before it contracts", false, "A larger EDV is increased preload, not afterload."),
    O("A higher ejection fraction, which raises the percentage of EDV pumped out", false, "Ejection fraction is a percentage pumped out, not a resistance.")
  ],
  tp: "Preload = how full (EDV); afterload = what it pumps against (resistance, hypertension, stenosis). [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single", kt: ["ejection fraction"],
  stem: "Which ejection fraction pattern matches a healthy heart at rest, a healthy heart in exercise, and a failing heart?",
  opts: [
    O("About 67% at rest, up to about 90% with exercise, and as low as about 30% when failing", true, "Those are the chapter's three EF anchors: 67% rest, 90% exercise, 30% failing."),

    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
