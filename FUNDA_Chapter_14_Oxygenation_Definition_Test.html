<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Hypoxia, Oxygen Basics & Delivery Devices";

 },
 CB: {

   "single": 10,
   "multi": 1
  }
 },
 CC: {

 },
 CD: {

   "multi": 1

 }

BANK.push({ cat: CA, type: "single",
  stem: "Which statement best describes hypoxia?",
  opts: [O("Tissue and cells receive excess oxygen, so cell metabolism speeds up beyond normal limits", false, "Incorrect. Excess oxygen describes oxygen toxicity risk, not hypoxia; hypoxia is too little oxygen in tissue and cells."), O("Airway passages narrow from swelling, so less air moves in and out with each breath taken", false, "Incorrect. Airway narrowing can cause hypoxia but is not what the term itself describes in this chapter."), O("Blood carries reduced carbon dioxide, so the respiratory drive weakens and breathing slows", false, "Incorrect. Hypoxia is about oxygen content in tissue and cells, not a primary drop in carbon dioxide carriage."), O("Tissue and cells receive reduced oxygen, so cell metabolism slows and cells begin to die", true, "Correct. The chapter defines hypoxia as reduced oxygen content in tissue and cells; metabolism slows and cells begin to die.")],
  tp: "Hypoxia = reduced oxygen in tissue and cells; metabolism slows and cells begin to die." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about oxygen therapy is accurate?",
  opts: [O("Oxygen is treated as a drug and is given following the six rights of administration", true, "Correct. The chapter treats oxygen as a drug, so the six rights of drug administration apply."), O("Oxygen is treated as a comfort measure and may be started without any provider order", false, "Incorrect. Oxygen must be ordered by a health care provider; it is never a free-standing comfort measure."), O("Oxygen is treated as a supply item and needs no monitoring once the flow is first set", false, "Incorrect. The nurse closely monitors the patient and evaluates the response to oxygen therapy."), O("Oxygen is treated as a drug and may be titrated freely by any staff member on the unit", false, "Incorrect. Treating oxygen as a drug means the opposite: the flow is changed only within the provider order.")],
  tp: "Oxygen is a drug: provider order required, six rights apply, response is monitored." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about starting oxygen therapy is accurate?",
  opts: [O("Oxygen therapy must be ordered by the respiratory therapist and monitored by the nurse", false, "Incorrect. A respiratory therapist may initiate therapy, but the order comes from a health care provider."), O("Oxygen therapy must be ordered by a health care provider and monitored by the nurse", true, "Correct. A provider order is required, and the nurse monitors administration and response."), O("Oxygen therapy may be ordered by unlicensed staff and then monitored by the nurse daily", false, "Incorrect. Unlicensed staff cannot order oxygen; initiation requires a licensed provider with an order."), O("Oxygen therapy may be ordered by the family and then monitored by the nurse each shift", false, "Incorrect. Families do not order oxygen; a licensed provider order is required before therapy.")],
  tp: "Oxygen needs a provider order; a respiratory therapist, nurse, or EMT may initiate it with that order." });

BANK.push({ cat: CA, type: "single",
  stem: "What is the normal range for PaO2?",
  opts: [O("80 to 100 mm Hg in the arterial circulation of a healthy adult patient", true, "Correct. PaO2, the oxygen in arterial blood, normally runs 80 to 100 mm Hg."), O("100 to 120 mm Hg in the arterial circulation of a healthy adult patient", false, "Incorrect. 100 to 120 mm Hg sits above the normal arterial range printed in the chapter."), O("60 to 80 mm Hg in the arterial circulation of a healthy adult patient", false, "Incorrect. 60 to 80 mm Hg falls below the normal arterial range printed in the chapter."), O("40 to 60 mm Hg in the venous circulation of a healthy adult patient", false, "Incorrect. PaO2 is an arterial value, and 40 to 60 mm Hg is far below its normal range.")],
  tp: "PaO2 normal = 80 to 100 mm Hg; it is the amount of oxygen in the arterial circulation." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about PaO2 in older adults is accurate?",
  opts: [O("A 70-year-old may run 100 to 110 mm Hg without significant changes in health status", false, "Incorrect. 100 to 110 mm Hg exceeds the normal range; aging lowers PaO2 slightly, never raises it."), O("A 70-year-old may run 80 to 85 mm Hg without significant changes in health status", true, "Correct. The chapter notes a 70-year-old may have a PaO2 of 80 to 85 mm Hg without significant alterations in health."), O("A 70-year-old may run 60 to 65 mm Hg without significant changes in health status", false, "Incorrect. 60 to 65 mm Hg is well below what the chapter accepts for a healthy 70-year-old."), O("A 70-year-old may run 70 to 75 mm Hg only when a chronic lung disease is present", false, "Incorrect. The printed older-adult value is 80 to 85 mm Hg, and it applies without chronic lung disease.")],
  tp: "Older adult PaO2 may sit at 80 to 85 mm Hg and still be without significant health alteration." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about flow rate and FiO2 is accurate?",
  opts: [O("The percentage of oxygen delivered is set by the humidifier rather than by the device used", false, "Incorrect. The humidifier adds moisture; the delivery device determines the FiO2 percentage."), O("The liters per minute ordered always equal the percentage of oxygen delivered exactly", false, "Incorrect. The chapter stresses the numbers in L/min do NOT correlate directly with the percentage delivered."), O("The liters per minute ordered do not directly equal the percentage of oxygen delivered", true, "Correct. L/min and FiO2 are different measures; the device used determines the percentage delivered."), O("The liters per minute ordered matter only for masks and never for nasal cannula devices", false, "Incorrect. Flow rate matters for every device; each device converts flow to its own FiO2 range.")],
  tp: "Flow in L/min is not the FiO2; Table 14.1 gives each device its own flow-to-FiO2 range." });

BANK.push({ cat: CA, type: "single",
  stem: "How is a flowmeter with a metal ball read correctly?",
  opts: [O("The middle of the metal ball is lined up on the mark for the prescribed flow rate", true, "Correct. The oxygen is turned on until the middle of the metal ball sits on the line for the prescribed flow."), O("The metal ball is raised fully to the top before the tubing is attached to the patient", false, "Incorrect. The ball is set to the prescribed line, not raised fully; full flow could harm the patient."), O("The bottom of the metal ball is lined up on the mark for the prescribed flow rate", false, "Incorrect. Reading the bottom of the ball under-delivers; the chapter specifies the middle of the ball."), O("The top of the metal ball is lined up on the mark for the prescribed flow rate", false, "Incorrect. Reading the top of the ball over-delivers; the chapter specifies the middle of the ball.")],
  tp: "Flowmeter: set the flow until the MIDDLE of the metal ball is on the prescribed line." });

BANK.push({ cat: CA, type: "multi",
  stem: "Which statements about the nasal cannula are accurate? Select all that apply.",
  opts: [O("Is the most common method used to administer oxygen to patients", true, "Correct. The chapter names the nasal cannula as the most common way to administer oxygen."), O("Delivers 70% to 100% oxygen when the flow is set at 6 to 15 L/min", false, "Incorrect. 70% to 100% at 6 to 15 L/min describes the nonrebreather mask, not the cannula."), O("Delivers 24% to 44% oxygen when the flow is set at 1 to 6 L/min", true, "Correct. Table 14.1 pairs the cannula at 1 to 6 L/min with 24% to 44% oxygen."), O("Lets the patient eat and talk normally while oxygen is running", true, "Correct. The cannula leaves the mouth free, so the patient can eat and talk normally."), O("Uses a reservoir bag that must fill fully before it is placed on", false, "Incorrect. The cannula has no reservoir bag; bag-filling steps belong to reservoir masks.")],
  tp: "Cannula: 1 to 6 L/min = 24% to 44%, most common device, mouth stays free for eating and talking." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about the oxymizer is accurate?",
  opts: [O("It can be set no higher than 6 L/min even when higher flows are ordered", false, "Incorrect. The oxymizer can be set as high as 15 L/min, well above the cannula ceiling."), O("It delivers 7% less oxygen than a cannula when both are set at 6 L/min flow", false, "Incorrect. At 6 L/min the oxymizer delivers 7% MORE FiO2 than the nasal cannula, not less."), O("Its reservoirs collect and conserve oxygen, raising the percentage delivered", true, "Correct. The oxymizer reservoirs collect and conserve oxygen so a higher percentage can be delivered."), O("Its reservoirs collect and conserve carbon dioxide, lowering the delivered dose", false, "Incorrect. The reservoirs conserve oxygen, not carbon dioxide, and they raise the percentage delivered.")],
  tp: "Oxymizer: 1 to 15 L/min = 29% to 50%; at 6 L/min it gives 7% more FiO2 than a cannula; check reservoirs stay inflated." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about the Venturi mask is accurate?",
  opts: [O("It offers humidified oxygen only and cannot deliver a set concentration", false, "Incorrect. Delivering a set, controlled concentration is the defining strength of the Venturi mask."), O("It offers the highest concentration of oxygen of any device in the table", false, "Incorrect. The nonrebreather mask reaches 70% to 100%, higher than the Venturi range of 24% to 55%."), O("It offers a variable concentration that changes with each breath taken", false, "Incorrect. The Venturi is chosen precisely because its concentration stays controlled and precise."), O("It offers a precise, controlled concentration of oxygen for the patient", true, "Correct. The Venturi mask is the device used when a precise, controlled concentration is required.")],
  tp: "Venturi mask: 4 to 10 L/min = 24% to 55%, chosen for a precise, controlled concentration." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement compares the two reservoir masks accurately?",
  opts: [O("Both reservoirs stay fully inflated on inhalation when either mask is working properly", false, "Incorrect. The partial rebreather reservoir should almost collapse on inhalation when it works properly."), O("The partial reservoir never collapses on inhalation; the nonrebreather almost does fully", false, "Incorrect. That reverses the pair: the partial almost collapses, the nonrebreather never totally does."), O("Both reservoirs collapse completely on inhalation when either mask is working properly", false, "Incorrect. The nonrebreather reservoir never totally collapses on inhalation when it works properly."), O("The partial reservoir almost collapses on inhalation; the nonrebreather never fully does", true, "Correct. Partial rebreather: reservoir almost collapses on inhalation. Nonrebreather: it never totally collapses.")],
  tp: "Reservoir check: partial = almost collapses on inhalation; nonrebreather = never totally collapses." });

BANK.push({ cat: CA, type: "single",
  stem: "A simple face mask run at 5 to 8 L/min delivers which FiO2 range?",
  opts: [O("35% to 55% oxygen while it fits snugly over the nose and the mouth", true, "Correct. Table 14.1 pairs the simple face mask at 5 to 8 L/min with 35% to 55% oxygen."), O("60% to 90% oxygen while it fits snugly over the nose and the mouth", false, "Incorrect. 60% to 90% is the partial rebreather range at 6 to 12 L/min, not the simple mask range."), O("70% to 100% oxygen while it fits snugly over the nose and the mouth", false, "Incorrect. 70% to 100% is the nonrebreather range at 6 to 15 L/min, not the simple mask range."), O("24% to 44% oxygen while it fits snugly over the nose and the mouth", false, "Incorrect. 24% to 44% is the nasal cannula range at 1 to 6 L/min, not the simple mask range.")],
  tp: "Simple face mask: 5 to 8 L/min = 35% to 55% (Table 14.1). Skill 14.1 prints masks usually at 6 to 10 L/min." });

BANK.push({ cat: CA, type: "multi",
  stem: "Which findings are listed in the chapter as signs of hypoxia? Select all that apply.",
  opts: [O("Cardiac dysrhythmias and cyanosis are listed signs of hypoxia here", true, "Correct. Box 14.2 lists cardiac dysrhythmias and cyanosis among the signs of hypoxia."), O("Restlessness, apprehension, and anxiety are listed signs of hypoxia", true, "Correct. Box 14.2 lists apprehension, anxiety, and restlessness among the signs of hypoxia."), O("Decreased concentration and decreased consciousness are listed signs", true, "Correct. Box 14.2 lists decreased ability to concentrate and decreased level of consciousness."), O("Increased concentration and increased alertness are listed signs here", false, "Incorrect. Hypoxia decreases concentration and consciousness; it never sharpens alertness."), O("Pink mucous membranes with a calm affect are the earliest listed signs", false, "Incorrect. Early signs are neurologic and behavioral, with color changes such as pallor and cyanosis.")],
  tp: "Box 14.2 hypoxia signs: restlessness, anxiety, behavioral changes, dysrhythmias, cyanosis, falling concentration and consciousness, dyspnea, pallor, vertigo." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement describes how vital signs change as hypoxia advances?",
  opts: [O("Pulse stays unchanged while respirations alone signal advancing hypoxia", false, "Incorrect. Pulse changes are part of the pattern: tachycardia early, bradycardia as hypoxia advances."), O("Pulse falls first, respirations slow, then both rise as apnea develops", false, "Incorrect. The sequence runs the other way: rates rise first and only slow as hypoxia advances."), O("Pulse and respirations both fall steadily from the very start of hypoxia", false, "Incorrect. Both rise first as the body compensates; the fall comes later and signals worsening hypoxia."), O("Pulse rises first, respirations deepen, then both slow as apnea develops", true, "Correct. Early: pulse and respiratory rate/depth increase. Advancing: bradycardia, shallow slow respirations, then apnea.")],
  tp: "Hypoxia pattern: early tachycardia and deeper, faster breathing; late bradycardia, shallow slow breathing, then apnea." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about oxygen and fire is accurate?",
  opts: [O("Oxygen neither burns nor supports combustion, so fire precautions are minor", false, "Incorrect. Because oxygen supports combustion, smoking, sparks, and flammable products are strictly avoided."), O("Oxygen supports combustion only when it is delivered at flows above 10 L/min", false, "Incorrect. Combustion risk exists at any flow; safety precautions apply whenever oxygen is in use."), O("Oxygen does not burn or explode itself, but it strongly supports combustion", true, "Correct. Oxygen is colorless, odorless, and tasteless; it does not burn, but it enables combustion."), O("Oxygen burns and explodes by itself whenever it is exposed to open room air", false, "Incorrect. Oxygen alone does not burn or explode; it supports combustion when a spark or fire is present.")],
  tp: "Oxygen supports combustion at any flow: no smoking, no sparks, no petrolatum, grounded equipment." });

BANK.push({ cat: CB, type: "multi",
  stem: "Which items are avoided while oxygen is being administered? Select all that apply.",
  opts: [O("Wool blankets are avoided while oxygen is being administered", true, "Correct. Wool blankets are on the chapter list of items to avoid during oxygen administration."), O("Petrolatum products are avoided while oxygen is being administered", true, "Correct. Petroleum jelly and other petrolatum products are avoided because of combustibility."), O("Cotton gowns are avoided while oxygen is being administered", false, "Incorrect. Cotton gowns are not on the avoid list; non-fire-resistant clothing is the concern."), O("Electric razors are avoided while oxygen is being administered", true, "Correct. Electric razors can spark and are avoided; electrical appliances are kept away from oxygen."), O("Distilled water is avoided while oxygen is being administered", false, "Incorrect. Distilled water is required in humidifiers during oxygen therapy, never avoided.")],
  tp: "Avoid with oxygen: smoking, wool blankets, electric razors, friction toys, heating pads, petrolatum products." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about portable oxygen cylinders is accurate?",
  opts: [O("Portable cylinders are secured upright so they cannot fall and become projectiles", true, "Correct. Cylinders are secured in proper carriers and stored upright; a falling cylinder can become a projectile."), O("Portable cylinders are stored beside heat sources so the valves stay easy to open", false, "Incorrect. Cylinders are kept away from heat sources such as lamps and radiators, never beside them."), O("Portable cylinders are left unchained in hallways so staff can reach them quickly", false, "Incorrect. Unsecured cylinders can tip and become projectiles; they are chained or placed in proper holders."), O("Portable cylinders are laid flat on the floor so they cannot roll toward the patient", false, "Incorrect. Cylinders are secured upright in holders, not laid loose on the floor where they can roll.")],
  tp: "Cylinders: upright, secured or chained, away from heat; an unsecured cylinder can become a projectile." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about delegation and oxygen flow is accurate?",
  opts: [O("Adjusting the oxygen flow rate may be delegated after brief instruction to personnel", false, "Incorrect. Instruction allows delegation of device placement only; the flow rate itself is never delegated."), O("Adjusting the oxygen flow rate is delegated to family members in the home setting", false, "Incorrect. Families are taught to keep the set rate and change it only with provider knowledge and advice."), O("Adjusting the oxygen flow rate is never delegated to unlicensed assistive personnel", true, "Correct. Flow-rate adjustment stays with the nurse; it is NOT delegated to UAP."), O("Adjusting the oxygen flow rate is delegated whenever the nurse is busy with others", false, "Incorrect. Workload never expands UAP scope; flow-rate adjustment remains the nurse responsibility.")],

BANK.push({ cat: CB, type: "single",

}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 14: Oxygenation - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
