], tp: "ANSWER KEY — Correct answers: 120-150 kcal/kg per day; late hypocalcemia at about 1 week on cow's milk; calcium lactate as powder in formula. DETAILED RATIONALE — Each blank guards a pairing: the calorie target, the late pattern's timing and milk, and the lactate form. When the powder is later discontinued, the nurse watches again for signs of neonatal tetany. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): a plan is only right when its numbers, timing, and forms are all the chapter's." });

S(C5, "A preterm infant is receiving intravenous calcium gluconate for hypocalcemia. Midway through the infusion his heart rate falls to 88 beats/min. Which action is correct?", [
    ["Report the bradycardia at once and follow the provider's direction on the infusion — a falling heart rate is the named danger of this drug", true, "The book's Safety Alert for IV calcium gluconate: monitor the heart rate closely during the infusion and report bradycardia if it occurs."],
    ["Slow the infusion on your own and continue it, since a slower rate usually settles a preterm heart rate", false, "Bradycardia on this drug is a report-first event, not a nurse-titrated one; the alert assigns the nurse the watching and the reporting."],
    ["Finish the infusion quickly so the calcium is in, then recheck his heart rate at the end", false, "Speeding a drug whose danger is showing reverses the safety logic; the sign is answered when it appears, not after the dose."],
    ["Give his next feeding early, because feeding raises a preterm infant's heart rate back toward normal", false, "Feeding is not a treatment for drug-related bradycardia, and feeding into an unstable moment adds its own risks."]
  ], "ANSWER KEY — Correct answer: report the bradycardia at once. DETAILED RATIONALE — Early hypocalcemia rides on the missed third-trimester calcium transfer and a parathyroid that fails to respond; its high-risk list includes infants stressed by hypoxia or birth trauma, infants given sodium bicarbonate, infants of diabetic mothers, and infants whose mothers had low vitamin D intake. The IV treatment's watch is the heart rate, for the whole infusion. PRIORITY FRAMEWORK — Safety (Drug Alert): when a named drug danger appears, the assigned response is immediate reporting.");

M(C5, "A nurse reviews the nursery census for babies who need the closest glucose watching today. Which babies belong on that list? Select all that apply.", [
    ["A growth-restricted preterm infant born yesterday", true, "Growth restriction (IUGR) is on the higher-risk list — his stores were under-delivered before birth."],
    ["A newborn whose mother has diabetes mellitus", true, "Infants of diabetic mothers are named on the hypoglycemia higher-risk list."],
    ["A post-dates newborn admitted for observation", true, "Post-dates infants are on the list — reserves spent waiting to be born leave the tank low."],
    ["A preterm infant being treated for sepsis", true, "Sepsis raises the metabolic rate and drains glucose faster — a tank-drainer on top of thin stores."],
    ["A full-term infant feeding well every few hours with his mother", false, "A well-feeding term infant gets routine newborn monitoring, not a place on the closest-watch list."],
    ["A preterm infant with an unstable temperature this morning", true, "An unstable temperature raises the metabolic rate and drains the tank — the third named drainer beside sepsis and RDS."]
  ], "ANSWER KEY — Correct answers: the growth-restricted preterm infant, the infant of a diabetic mother, the post-dates infant, the septic preterm infant, and the preterm infant with an unstable temperature. DETAILED RATIONALE — The list has two halves: babies who start with thin stores (preterm, growth-restricted, diabetic mother's, post-dates) and babies whose tanks are being drained (sepsis, RDS, unstable temperature). The well-feeding term infant belongs to neither half. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): build a watch list from both the stores a baby started with and the drains acting on him now.");

S(C5, "A 1-week-old infant fed cow's milk is found to have a low serum calcium. His mother asks why this happened now and what will be added to his feeds. Which explanation is correct?", [
    ["This is late hypocalcemia — the milk raised his phosphate, which pulled his calcium down, and calcium lactate powder in the formula lowers the phosphate", true, "Timing, mechanism, and fix all match the late pattern: about 1 week, cow's milk, phosphate up and calcium down, powder in the formula."],
    ["This is early hypocalcemia — his parathyroid failed to answer his low calcium at birth, and intravenous calcium is the fix", false, "Early hypocalcemia is the birth-window parathyroid story; a 1-week-old on cow's milk is the late pattern with a formula-level fix."],
    ["This is late hypocalcemia, and crushed calcium lactate tablets stirred into each bottle will bring the phosphate down", false, "The pattern is named right and the form is wrong — the tablets are insoluble in milk and must not be used; the powder is the form."],
    ["His calcium fell because cow's milk contains no calcium at all, and switching him to water between feeds will correct it", false, "Cow's milk carries calcium; the problem is its phosphate load, and water between feeds is not a treatment in this chapter."]
  ], "ANSWER KEY — Correct answer: late hypocalcemia from cow's milk phosphate, treated with calcium lactate powder. DETAILED RATIONALE — Early and late hypocalcemia are told apart by the calendar and the mechanism: parathyroid lag right after birth versus phosphate pressure at about 1 week. The drug pair must stay unswapped — gluconate is intravenous, lactate is the formula powder. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): let the timing assign the pattern, then let the pattern assign the treatment.");

S(C5, "A preterm infant's calcium lactate powder is being slowly discontinued this week after treatment for late hypocalcemia. All of the following are correct nursing actions — which one comes FIRST in importance for this change?", [
    ["Watch him again for signs of neonatal tetany as the powder comes off", true, "The chapter attaches this exact watch to this exact moment: when the powder is discontinued, tetany signs are monitored for again."],
    ["Record the discontinuation schedule and his formula volumes in his chart", false, "Correct documentation of the change — it supports the watch, it does not replace it."],
    ["Teach his parents why the powder was added to his formula in the first place", false, "Correct teaching about the phosphate story — it proceeds in the same round, behind the surveillance the change demands."],
    ["Check that the pharmacy has removed the tablet form from his medication bin", false, "Correct safety housekeeping, since tablets must never be used — a background check, not the front-line watch for tetany."]
  ], "ANSWER KEY — Correct answer: watch again for signs of neonatal tetany as the powder is discontinued. All four options are correct nursing actions — the chapter's own sequencing decides the priority: a treatment being withdrawn reopens the window it was holding shut, so surveillance for the returning problem outranks the paperwork and teaching around the change. DETAILED RATIONALE — Calcium support is judged by what happens as it leaves; the tetany watch is the evaluation built into the discontinuation order itself. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): when a support is withdrawn, watch first for the problem it was treating.");

S(C5, "A nurse explains to a student why a preterm infant's glucose falls faster than a term infant's in the first hours. Which explanation is correct?", [
    ["His shorter stay in the uterus left him thin stores of glycogen and fat, so the normal early dip runs deeper and empties sooner", true, "Store size is the mechanism: the dip of the first 1-2 hours happens to every newborn, and thin stores make the preterm version deeper."],
    ["His kidneys waste glucose into his urine faster than a term infant's kidneys do", false, "Immature kidneys do handle fluids and salts poorly, but glucose wasting is not the chapter's mechanism for the early dip."],
    ["His liver makes too much insulin in response to his mother's blood sugar after birth", false, "Excess insulin belongs to another story; this chapter's mechanism is stores too small for the dip, not a hormone overshoot."],
    ["His feedings are delayed because his stomach is small, and delayed feeding is the only reason his glucose falls", false, "Feeding limits contribute to his nutrition problem, but the dip precedes feeding — it is driven by the stores he was born with."]
  ], "ANSWER KEY — Correct answer: thin glycogen and fat stores from a shortened stay in the uterus. DETAILED RATIONALE — That is why feedings for these infants aim at 120-150 kcal/kg per day and why gavage or parenteral routes are used when he is too weak to suck and swallow: the tank must be refilled by a route he can manage. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the right mechanism explains both the finding and the treatment plan built for it.");


/* ===== C6 standalones — Feeding, gavage, TPN ===== */
S(C6, "A 33-week infant, birth weight 1,800 g, is rooting weakly and tires after a few sucks. His mother wants to know why he cannot simply bottle-feed like his term cousin did. All of the following are correct explanations — which one should the nurse give FIRST?", [
    ["Breathing, sucking, and swallowing do not coordinate before about 34 weeks, so oral feeding must wait for, or work around, that milestone", true, "Coordination timing is the headline reason: at 33 weeks the pattern is not yet safe, and gavage, IV fluids, or TPN bridge the gap."],
    ["His stomach capacity is small and the sphincters at both ends are immature, so feeds come back up easily", false, "Correct gut facts that shape his feeding plan — they follow the coordination reason that decides the route today."],
    ["Feeding tires him out, and the energy it costs can itself cause early weight loss and keep watching him closely through the next care round", false, "Correct and worth teaching — it explains his weak effort, behind the safety reason his route is a tube for now."],
    ["His fat absorption is poor, so supplemental vitamins are usually prescribed for babies like him", false, "Correct nutrition detail for his plan — a supporting fact, not the answer to why the bottle must wait."]
  ], "ANSWER KEY — Correct answer: suck-swallow-breathe coordination arrives at about 34 weeks. All four options are correct chapter explanations — safety decides the teaching order: the coordination milestone is what makes oral feeding unsafe today, while stomach size, effort cost, and fat absorption shape the plan built around the tube. DETAILED RATIONALE — Infants over 1,500 g may bottle-feed with a small, soft nipple with a large hole when they are ready, because it costs less sucking effort and energy. PRIORITY FRAMEWORK — Safety First (Airway and Aspiration): the explanation that protects the airway leads the teaching.");

S(C6, "Before a gavage feed, a nurse aspirates a preterm infant's stomach and gets back a noticeable amount of liquid formula from the last feed. The infant is calm, with soft bowel sounds and a stable girth. Which action is correct?", [
    ["Notify the physician before feeding — a residual of liquid is the finding that gates the feed", true, "The aspirate rule is a matched pair: mucus or air only means feed as planned; liquid residual means notify the physician before feeding."],
    ["Feed as planned — only mucus or air in the aspirate would have been a reason to pause and call", false, "The pair is flipped exactly: mucus or air clears the feed, and liquid is the notify-first finding."],
    ["Discard the residual, give half the feed, and chart the amount for the next nurse", false, "Halving the feed on the nurse's own judgment skips the notification the rule assigns to this finding."],
    ["Switch him to bottle feeding for this feed, since his stomach clearly is not emptying by tube", false, "A liquid residual is not a route problem to solve by bottle; it is a report that precedes any feed by any route."]
  ], "ANSWER KEY — Correct answer: notify the physician before feeding. DETAILED RATIONALE — The pre-feed aspirate is a standing gate for every gavage feed, alongside girth measurement and bowel sounds — the same checks that catch NEC early. A calm baby does not cancel a rule written for exactly this result. PRIORITY FRAMEWORK — Safety (Follow the Gate): when a check exists to gate an action, its result decides, not the baby's mood.");

M(C6, "A nurse is planning the milk and feeding care for a 30-week infant whose mother is expressing milk. Which elements belong in the plan? Select all that apply.", [
    ["Use the mother's expressed milk, or donor milk from the NICU bank if her milk is not in", true, "Human milk is ideal — its fat absorbs readily — and donor milk is the chapter's backup when the mother's milk is not available."],
    ["Give him a pacifier during gavage feeds for nonnutritive sucking", true, "The pacifier during a tube feed gives comfort now and builds feeding skills for later."],
    ["Position him on his right side or abdomen after feeds", true, "That position promotes gastric emptying and reduces aspiration if vomiting occurs."],
    ["Substitute standard term formula freely whenever expressed milk runs short", false, "Formulas do not swap: term formula burdens preterm kidneys and can cause central nervous system problems."],
    ["Start feedings early once his gut is ready, with bowel sounds present and meconium passed", true, "Those two signs mark gut readiness, and early feeding reduces hypoglycemia, hyperbilirubinemia, and dehydration risks."],
    ["Feed him well past fullness at each feed so his weight gain stays ahead", false, "Overfeeding an immature stomach invites regurgitation and vomiting; his sphincters cannot hold an overloaded feed."]
  ], "ANSWER KEY — Correct answers: mother's expressed or donor milk, pacifier during gavage feeds, right-side or abdominal positioning after feeds, and early feeding once bowel sounds and meconium show readiness. DETAILED RATIONALE — Every element answers a named preterm feeding problem: milk choice for absorption, nonnutritive sucking for skill, position for emptying and aspiration, readiness signs for timing. The formula swap and the overfeed are the two directions the chapter forbids. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): assemble the plan element by element from the problems it must solve.");

S(C6, "A grandmother asks why the tube for her grandson's feeds goes into his mouth instead of his nose, 'where tubes usually go.' Which answer is correct?", [
    ["Newborns breathe through the nose, so a nasal tube would take up space he needs for breathing; the oral route leaves his airway's front door open", true, "Orogavage over nasogastric is one of the chapter's signature directions, and obligatory nose breathing is its whole reason."],
    ["His nose is too small for any tube until he reaches term age, so the mouth is the only route that physically fits", false, "Size is not the stated reason; nasal tubes fit, but they cost breathing space in a baby who breathes through his nose."],
    ["Oral tubes are changed less often, and his tube only needs replacing every few weeks instead of days", false, "The replacement window is every 3-7 days — the invented weeks stretch it well past the chapter's rule."],
    ["Feeds through the mouth digest faster, because the milk reaches his stomach already warmed by the mouth", false, "Digestion speed is not the chapter's reason; the airway space is."]
  ], "ANSWER KEY — Correct answer: orogavage protects the nasal airway of an obligatory nose breather. DETAILED RATIONALE — This is a right-route question, and the exam flips it by offering the nasal route as the 'usual' one. In the newborn, usual loses to anatomy: the nose is the breathing route, so the feeding tube goes through the mouth. PRIORITY FRAMEWORK — Safety (Airway First): a feeding decision never spends airway space.");

S(C6, "A nurse discovers that a 36-week infant who is now feeding orally has been kept on preterm formula past the point his team planned, and a term nursery baby was offered preterm formula by mistake. All of the following are correct statements — which risk should the nurse report FIRST?", [
    ["Preterm formula continued past 34 weeks, or given to term infants, is poorly tolerated and hypercalcemia may develop", true, "That is the chapter's named danger for this exact error, and both babies in the picture are inside it — the mineral risk leads the report."],
    ["Term formula given to a preterm infant burdens the kidneys and can cause central nervous system problems", false, "Correct danger, wrong direction — it describes the opposite swap from the one that happened here."],
    ["Any formula change requires the parents' teaching to be repeated before the next feed", false, "Correct practice around a change — teaching follows the safety report, it does not lead it."],
    ["Both babies' weights and intake should be rechecked and charted at the next round", false, "Correct monitoring after any feeding error — it proceeds once the named risk has been reported."]
  ], "ANSWER KEY — Correct answer: report the hypercalcemia risk of preterm formula used past its window. All four options are correct statements — matching the risk to the error that actually happened decides the priority: this swap's danger is hypercalcemia, while kidney and CNS harm belong to the reverse swap. DETAILED RATIONALE — Formulas do not swap in either direction, and each direction carries its own named harm; reporting the wrong direction's harm misdirects the whole response. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): name the risk that belongs to this error, not the nearest similar one.");

S(C6, "A preterm infant too ill to tolerate any oral feeding is receiving an intravenous infusion of lipids and nutrients. His father asks whether 'feeding through the vein' will be his permanent way of eating. Which answer is correct?", [
    ["It is a bridge — total parenteral nutrition meets his growth needs while he is too premature or too ill for mouth feeding, and oral feeding is built toward as he strengthens", true, "TPN is defined by its temporary job: nutrition for the infant who cannot yet feed by mouth, including bowel rest in NEC."],
    ["It is permanent if it lasts more than a few days, because his stomach will shrink and lose the ability to hold milk", false, "No such deadline exists in the chapter; IV fluids and TPN cover needs while feeding is established, not instead of it forever."],
    ["It will be replaced by bottle feeding tomorrow, because vein feeding is only ever a one-day emergency measure and keep watching him closely through the next care round", false, "The opposite invention — TPN runs as long as the gut cannot, and feeds advance on readiness signs, not on a one-day clock."],
    ["It means his digestive enzymes never developed, and babies older than 28 weeks are the only ones who can use breast milk", false, "Babies older than about 28 weeks usually DO have the enzymes for breast milk; enzyme absence is not what TPN declares."]
  ], "ANSWER KEY — Correct answer: TPN is a bridge while he is too ill to feed by mouth. DETAILED RATIONALE — The chapter pairs TPN with the gut-readiness story: bowel sounds, meconium passed, coordination near 34 weeks, and early small feeds when the gut allows. Vein feeding protects growth in the interval; it does not close the road to oral feeding. PRIORITY FRAMEWORK — Patient Teaching (Name the Bridge): parents tolerate a temporary route when its job and its exit are both named.");

/* ===== C7 standalones — ICH, sepsis/jaundice/kidneys ===== */
S(C7, "A 28-week infant, day 2, is noted to have a bulging fontanel, new lethargy, and poor feeding at his last two cares. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Report the findings at once — bulging fontanels, lethargy, and poor feeding are the report set for bleeding inside his head", true, "His fragile head capillaries and low prothrombin make intracranial hemorrhage the fear behind this exact sign set, and reporting it leads the response."],
    ["Position his bed in a slight Fowler position and keep watching him closely through the next care round", false, "Correct positioning for this problem — it is done in the same response, behind the report that mobilizes the team."],
    ["Avoid unnecessary stimulation that could raise the pressure inside his head", false, "Correct protective care, and cluster care serves it — it frames how everything is done, after the findings are escalated."],
    ["Arrange the head ultrasound that helps detect bleeding inside the head before the next scheduled assessment comes due", false, "Correct diagnostic step — ultrasonography detects the hemorrhage, and it is set in motion by the report that comes first."]
  ], "ANSWER KEY — Correct answer: report the sign set at once. All four options are correct nursing actions — safety and escalation decide the order: a possible intracranial hemorrhage is reported before its positioning, protection, and imaging are arranged. DETAILED RATIONALE — The preterm infant's neurological status is watched continuously precisely for this set; seizures join the report list when they appear. PRIORITY FRAMEWORK — Safety First (Escalate the Red-Flag Set): report the pattern that names an emergency before completing its supporting care.");

S(C7, "A preterm infant at 5 days has a low temperature, is irritable and then lethargic, feeds poorly, and has mild respiratory distress. There is no redness, drainage, or local finding anywhere on his body. His mother had a fever during labor. Which analysis is correct?", [
    ["This is the sepsis picture — a bloodstream infection that may show no local signs at all, with the vague set of low temperature, lethargy or irritability, poor feeding, and respiratory distress", true, "Every element fits: immature defenses that generalize infection, a mother with infection in labor raising his risk, and the vague four standing in for absent local signs."],
    ["This cannot be infection, because an infected baby always shows a hot, red source the nurse can point to and keep watching him closely through the next care round", false, "That expectation is the trap the chapter dismantles — in the preterm infant there may be no local signs of infection at all."],
    ["This is only cold stress, because a low temperature with lethargy is the cold stress list and nothing more needs considering", false, "Cold stress shares two of these signs, but it does not explain the feeding failure and distress in a baby whose mother labored with fever."],
    ["This is a feeding problem only, because poor feeding is the most concrete finding and the others are too vague to act on before the next scheduled assessment comes due", false, "Vagueness is the presentation, not a reason to dismiss it — in this population the vague set IS the alarm."]
  ], "ANSWER KEY — Correct answer: sepsis with no local signs, shown by the vague four. DETAILED RATIONALE — Treatment runs: blood cultures collected, intravenous antimicrobials given, warmth and nutrition maintained, vital signs monitored closely including blood pressure. Prevention lives in routine care — incubator separation, strict standard precautions, and organized handling. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): in a preterm infant, a vague pattern with a risk history is a finding, not an absence of one.");

S(C7, "Two jaundice pictures are charted on the same morning. Baby P, 18 hours old, is visibly yellow. Baby Q, 3 days old, has a bilirubin that rose 6 mg/dL in the last 24 hours and now reads 13.4 mg/dL. Which statement is correct?", [
    ["Both need careful investigation — jaundice inside the first day is the pathological pattern, and a rise over 5 mg/dL in 24 hours or a level past 12.9 mg/dL crosses the chapter's investigation lines", true, "Each baby crosses a different line: timing for Baby P (first 24 hours points to a cause such as blood-group incompatibility), and both the rise and the level for Baby Q."],
    ["Only Baby Q needs investigation, because jaundice in the first day is the normal newborn pattern that fades on its own and keep watching him closely through the next care round", false, "The timing direction is flipped — the first-day appearance is the abnormal one; the slower rise over days is the physiological story."],
    ["Only Baby P needs investigation, because a 3-day-old's bilirubin is expected to peak and no level at that age is concerning", false, "Bilirubin does peak at 3-5 days, and the chapter still sets investigation lines — a rise over 5 in a day, or past 12.9 — that Baby Q has crossed."],
    ["Neither needs investigation until the yellow reaches the feet, because spread to the feet is the first reliable sign of a high level", false, "Spread tracks the level (face, then abdomen, then feet means rising), but the timing and number lines fire well before the feet are reached."]
  ], "ANSWER KEY — Correct answer: both babies cross an investigation line. DETAILED RATIONALE — The preterm twist makes vigilance higher, not lower: the normal bilirubin rise in a preterm infant is slower but lasts longer, setting up hyperbilirubinemia, and the treatment goals are to prevent bilirubin brain damage and stop the climb. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): a finding can cross its line by timing, by rate, or by level — check all three.");

/* ===== C8 standalones — Developmental care, family, postterm, transport, discharge ===== */
S(C8, "A father stands at his preterm son's incubator saying, 'I want to see him, but I'm afraid to touch anything — he's so fragile, I might hurt him.' All of the following are correct nursing responses — which one comes FIRST?", [
    ["Name his fear as normal, explain that his gentle touch helps rather than harms, and stay beside him while guiding a first simple contact", true, "That is the care plan's critical-thinking answer: touch and immediate human contact are vital for the infant, and the nurse's presence turns fear into a first contact he can build on."],
    ["Teach him the full kangaroo care routine so he can hold his son skin-to-skin today", false, "Correct destination for this father — kangaroo care is built toward as the infant tolerates it, after the first guided touch lands."],
    ["Invite him to help with a diaper change at the next care time and keep watching him closely through the next care round", false, "Correct participation step — parents graduate from watching to doing one small task at a time, and touching comes before tasking."],
    ["Show him the pictures and progress notes the team keeps for the family before the next scheduled assessment comes due", false, "Correct family support — pictures and news help siblings and parents, but they do not answer the fear he just said out loud."]
  ], "ANSWER KEY — Correct answer: name the fear, teach that gentle touch helps, and guide a first contact at his side. All four options are correct nursing responses — therapeutic communication decides the order: the stated fear is answered first, and holding, helping, and information follow in the order he can absorb them. DETAILED RATIONALE — Families typically feel disheartened by how the baby looks, quietly blame themselves, and fear the baby will die; the nurse guides and supports them through the whole hospitalization. PRIORITY FRAMEWORK — Therapeutic Communication (Answer the Stated Fear First): the feeling in the room outranks the teaching plan.");

M(C8, "A nurse is building the developmental care plan for a 1,200 g preterm infant in an open NICU bay. Which elements belong in the plan? Select all that apply.", [
    ["Build a nest of rolled blankets around him to give him boundaries and a flexed posture", true, "Nesting is the chapter's calming, boundary-giving space, and blanket rolls are the tool that builds it."],
    ["Cluster his assessments and treatments so he gets long, uninterrupted rest blocks", true, "Cluster care is reorganized care — the same work, bunched so rest protects breathing and growth."],
    ["Cover the top of his incubator with a blanket and dim the lights to soften stimulation", true, "Blocking external stimulation helps establish a day-night rhythm and protects his immature nervous system."],
    ["Keep him in one position all shift so he is never disturbed by turning", false, "One position held too long is uncomfortable, can harm the lungs, and breaks down delicate skin under pressure."],
    ["Wake him slowly and gently, keeping his arms flexed close to his body's midline as he is moved", true, "Gentle waking and midline flexion are the chapter's handling rules for an easily overstimulated infant."],
    ["Use alkaline soap and medicated wipes at each diaper change to keep his skin sterile", false, "Preterm skin care forbids alkaline soap, alcohol, and medicated wipes; cleansing is gentle and baths run only a few times a week."]
  ], "ANSWER KEY — Correct answers: nesting with blanket rolls, cluster care, a covered incubator with dimmed lights, and gentle waking with arms flexed to the midline. DETAILED RATIONALE — Developmental care doses the care itself: boundaries, bunched handling, softened light and sound, and position changes that protect skin and lungs. Skin protection pairs with it — hydrocolloid or gauze under tape, as little tape as possible, and no hexachlorophene cleansers. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): build the environment around the nervous system the baby actually has.");

S(C8, "A preterm infant rests prone in the NICU with the head of his mattress slightly elevated. His parents, who just finished safe-sleep teaching, ask why he is 'allowed' on his stomach here. Which answer is correct?", [
    ["In the NICU, side-lying or prone positioning drains secretions, guards against aspiration, and improves oxygenation — and he will be weaned to his back well before discharge, because back-to-sleep is the rule at home", true, "Both halves are the chapter's position story: monitored prone positioning is treatment here, and the supine wean plus back-to-sleep teaching protect him at home against SIDS."],
    ["Prone is simply more comfortable for preterm infants, and the home rule is a preference parents may set aside for a fussy baby and tell the charge nurse what was decided at the bedside", false, "Comfort is not the reason, and back-to-sleep is a safety rule against sudden infant death, not a preference to waive."],
    ["He is prone because his mattress is elevated, and once the elevation stops he can stay prone at home as well before the next scheduled assessment comes due", false, "The elevation serves drainage in the NICU; it does not export the prone position to the home crib."],
    ["The NICU position is a mistake the nurse should correct now, since a baby must never be prone at any age and keep watching him closely through the next care round", false, "Monitored NICU positioning is deliberate care with named benefits; the never-prone rule belongs to unmonitored home sleep."]
  ], "ANSWER KEY — Correct answer: prone is monitored NICU treatment, weaned to supine before discharge, with back-to-sleep at home. DETAILED RATIONALE — Position is context: the same posture is therapy under continuous monitoring and a danger unmonitored at home. Parents must be able to hold both halves or the discharge teaching collapses at the first question. PRIORITY FRAMEWORK — Patient Teaching (Context Decides): teach the rule and its setting together, never the rule alone.");

S(C8, "A baby born at 43 weeks is long and thin, with loose skin over her thighs, dry peeling skin, long meconium-stained nails, and a thick head of hair. She looks alert. Which watch list belongs to her nursery care?", [
    ["Respiratory distress from aspirated meconium, hypoglycemia from depleted glycogen stores, and hyperbilirubinemia from polycythemia", true, "That is the postterm problem set whole: the aging placenta drove chronic hypoxia, meconium passage and aspiration, spent reserves, and extra red cells that break down into bilirubin."],
    ["Respiratory distress from missing surfactant, apnea from an immature nervous system, and bleeding from low prothrombin", false, "That is the preterm problem set — immaturity problems assigned to a baby whose problem is extra time, not missing time."],
    ["Cold stress only, because a baby this size has plenty of fat and no other postterm risks to watch", false, "Her fat stores were spent in the uterus — she is vulnerable to cold stress precisely because she is thin — and the watch list is longer than temperature."],
    ["Feeding intolerance only, because her size means her glucose and bilirubin will take care of themselves", false, "Size misleads again: her glycogen is depleted and her extra red cells raise bilirubin, so feeding is only one of three watches."]
  ], "ANSWER KEY — Correct answer: meconium-aspiration distress, hypoglycemia, and hyperbilirubinemia from polycythemia. DETAILED RATIONALE — The main goal with a postterm infant is identification — finding the babies not tolerating the extra time inside. Once she survives delivery her risks fall away, but the nursery watches run first. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): read the baby — thin, dry, peeling, long nails — not the scale.");

BANK.push({ cat: C8, type: "matrix", stem: "A nurse is sorting four nursery babies by the single fact that best explains each one's condition. Match each baby to the correct explanation.", cols: ["Aging placenta", "Immature organs", "Fast abnormal growth", "Immature kidneys"], rows: [
  { t: "A 43-week baby, long and thin, whose reserves were spent before birth", a: 0, r: "The postterm engine: the placenta aged out of its job and could no longer keep up." },
  { t: "A 30-week baby whose lungs, gut, and temperature control are all unfinished", a: 1, r: "One root cause sits under every preterm problem: organs that ran out of time." },
  { t: "A very large baby of a diabetic mother, born at 39 weeks and heavy for his age", a: 2, r: "Big is not postmature — his size came from rapid, abnormal growth before delivery, not extra time." },
  { t: "A preterm baby putting out far less urine than expected, with a sunken fontanel and poor skin turgor", a: 3, r: "Immature kidneys eliminate wastes poorly and dehydration arrives easily; expected output is 1-3 mL/kg per hour, measured as wet diaper weight minus dry diaper weight." }
], tp: "ANSWER KEY — Correct matches: postterm baby = aging placenta; 30-week baby = immature organs; large baby of a diabetic mother = fast abnormal growth; low-calcium preterm baby = missed third trimester. DETAILED RATIONALE — Four babies, four engines. The matrix's trap is the third row: a large baby invites the postmature label, and the chapter explicitly refuses it. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): assign each baby his own mechanism before assigning his care." });

S(C8, "Parents of a baby born at 36 weeks are upset at a follow-up visit: at 1 month old their son is 'behind' the milestone chart the clinic posted, and relatives keep commenting on his small size. Which counseling is correct?", [
    ["Judge him by corrected age — his age minus the 4 weeks he was born early — so at 1 month his expected level is a newborn's, and his growth should near the term pace by about his second year", true, "Corrected age is the fair yardstick the chapter defines, with the worked example matching this baby exactly; the correction protects both the baby and the parents from a calendar he never had."],
    ["Judge him by his calendar age, because using a corrected age will make the team miss real delays and keep watching him closely through the next care round", false, "The chapter's direction is the opposite: development is judged on the corrected scale precisely so expectations stay fair and follow-up stays accurate."],
    ["Tell them size comments mean he is failing to thrive, and his feeds should be doubled until he catches up this month", false, "Relatives' comments are a named stressor to prepare parents for, not a diagnosis — and doubling feeds is not a chapter intervention."],
    ["Reassure them he will catch up within a few weeks, since preterm growth matches term growth almost immediately before the next scheduled assessment comes due", false, "The chapter's horizon is about the second year without severe complications — a few-weeks promise sets the family up to feel failed again."]
  ], "ANSWER KEY — Correct answer: corrected age — 1 month minus 4 weeks early equals newborn expectations, with catch-up nearing the term pace by about the second year. DETAILED RATIONALE — Very-low-birth-weight infants may catch up more slowly, slowed further by chronic illness, poor intake, or inadequate caretaking — which is why follow-up, not reassurance alone, carries this family. PRIORITY FRAMEWORK — Patient Teaching (Use the Fair Yardstick): correct the ruler before judging the child.");

S(C8, "A high-risk newborn is being prepared for transport to a regional neonatal center. His mother, still in her hospital bed, cannot hold him. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Stabilize him and gather his baseline data — vital signs, blood work, blood gases, and glucose — before departure", true, "Stabilization with baseline data is the chapter's first transport rule: the receiving team inherits numbers, not surprises, and his condition is steadied before the road."],
    ["Place his identification band and verify its name and number against his mother's band", false, "Correct and required identification work — it is completed in the same preparation, behind the stabilization that makes him safe to move."],
    ["Wheel his transport incubator to his mother's bedside and give her a picture of him", false, "Correct and deeply important when she cannot hold him — it happens within the departure preparation, not ahead of his stabilization."],
    ["Give his parents the receiving hospital's name and location and a physician's name and number to call", false, "Correct family handoff information — it closes the preparation once he is stable, identified, and seen by his mother."]
  ], "ANSWER KEY — Correct answer: stabilize him and gather baseline data first. All four options are correct nursing actions — safety decides the order in transport: a life-support transport incubator, fully charged, carries a stabilized baby whose records, identification, and family connection travel with him. DETAILED RATIONALE — After he arrives safely, the parents are contacted by telephone, and receiving staff give the transport team feedback on how he did. PRIORITY FRAMEWORK — Safety First (Stabilize Before You Move): no handoff, however kind, outranks a stable patient.");

S(C8, "A preterm infant is nearing discharge. His parents have visited daily, learned his cares, and ask what must be in place before he goes home. Which discharge picture is correct?", [
    ["They demonstrate and practice both routine and specialized care, newborn CPR is reviewed with them, follow-up and immunizations are stressed, and they leave with a way to reach the team by phone", true, "That is the chapter's discharge set whole: demonstrated competence, CPR review, the follow-up spine of well-baby exams and immunizations, and warm or hot lines for contact."],
    ["They sign the discharge papers once his weight passes 2,500 g, since weight is the single discharge criterion for preterm infants", false, "No single weight criterion exists in the chapter; discharge planning begins at birth and is built on demonstrated care, not a scale reading."],
    ["They are given a printed sheet only, because practicing cares in the NICU might disturb his rest blocks and keep watching him closely through the next care round", false, "Demonstration and practice by the parents are required, not optional paperwork — cluster care protects his rest around their learning."],
    ["They are told follow-up can wait until he looks bigger, since preterm infants outgrow the need for close supervision before the next scheduled assessment comes due", false, "Continued medical supervision stays important after discharge; waiting for size reverses the chapter's follow-up spine."]
  ], "ANSWER KEY — Correct answer: demonstrated routine and specialized care, CPR review, stressed follow-up and immunizations, and phone access to the team. DETAILED RATIONALE — Home nurse visits, social services confirmation that the home can meet his needs, and support group referrals complete the picture, along with realistic expectations taught through corrected age. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): discharge is earned by demonstrated readiness, not by a date or a weight.");

/* ============ ENGINE (ES5) ============ */
var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { shuffle(q.opts); S.resp.push(-1); }
    else if (q.type === "multi") { shuffle(q.opts); S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { shuffle(q.blanks[k].o); d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>OB Chapter 13: Preterm and Postterm Newborns — Predicted Test</h1>';
  h += '<div class="sub">Brutal mode | Leifer, Introduction to Maternity and Pediatric Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order<br><span class="small">Answer choices always shuffle, even dropdowns. Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
</html>
