<script>
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
function S(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "single", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
function M(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "multi", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
var C1 = "Classification, Characteristics, Ballard Score, and Causes of Preterm Birth";
var C2 = "Respiratory Distress Syndrome, Oxygen, CPAP, and BPD";
var C3 = "Apnea of Prematurity, Hypoxia, and Pulse Oximetry";
var C4 = "Thermoregulation and Cold Stress";
var C5 = "Hypoglycemia and Hypocalcemia";
var C6 = "Feeding the Preterm Newborn — Gavage and TPN";
var C7 = "NEC, Intracranial Hemorrhage, ROP, Sepsis, Kidneys, and Jaundice";
var C8 = "Developmental Care, Family, the Postterm Newborn, Transport, and Discharge";
var CATS = [C1, C2, C3, C4, C5, C6, C7, C8];
var KEYTERMS = [];

/* ===== CASE 1 (PRED-CASE1) — Sofia, the preterm twin in the NICU ===== */
var CASE_P1 = "CASE STUDY — One Twin in the NICU. Sofia was born at 31 weeks, birth weight 1,450 g, one of twins; her brother is with their mother on the postpartum unit. Sofia showed respiratory distress at birth and was transported to the NICU in an incubator. On admission: respirations 68 breaths/min with grunting, nasal flaring, substernal retractions and see-saw respirations, color dusky, temperature 36.0°C. Her mother received an antenatal corticosteroid injection about 36 hours before delivery. A pulse oximeter sensor is on Sofia's foot.";

M(C2, "Which findings in Sofia's admission assessment require the nurse to act now? Select all that apply.", [
    ["Respirations of 68 breaths/min with grunting", true, "Tachypnea at or above 60 breaths/min with grunt-like sounds is the chapter's respiratory distress picture."],
    ["Nasal flaring and substernal retractions", true, "Flaring and retractions are named distress signs showing she is working hard to move air."],
    ["See-saw respirations and dusky color", true, "See-saw respirations and cyanosis complete the distress picture and signal falling gas exchange."],
    ["Birth weight of 1,450 g at 31 weeks", false, "That weight fits her gestational age; the number alone is her baseline, not the finding driving action now."],
    ["A twin brother rooming with their mother", false, "Multiple gestation helps explain the preterm birth, but his location is not a cue about Sofia's condition."],
    ["Temperature of 36.0°C on admission", true, "Below the preterm target band of 36.2-37°C, and cold stress further cuts surfactant production."]
  ], "ANSWER KEY — Correct answers: respirations 68 with grunting, flaring and retractions, see-saw respirations with dusky color, and temperature 36.0°C. DETAILED RATIONALE — Recognize Cues sorts the distress sign picture and the low temperature from baseline facts (an age-appropriate weight, a twin in another unit) that explain her story without changing her immediate needs. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): act on the cues that match the distress picture, not on the facts that only explain the history.", { scen: CASE_P1, grp: "PRED-CASE1" });

S(C2, "The nurse reviews why Sofia's lungs are failing her and what her mother's injection 36 hours before delivery was meant to do. Which analysis is correct?", [
    ["Her alveoli lack surfactant, and the steroid given to her mother 1-2 days before delivery was timed to raise fetal surfactant production", true, "RDS is deficient surfactant: alveoli cannot stay open. Antenatal betamethasone goes to the mother, and the 1-2 day window before delivery is when it reduces RDS."],
    ["Her alveoli lack surfactant, and the steroid given to her mother worked by thinning the mucus plugging her smallest airways after birth", false, "The steroid's job is surfactant production before birth, not mucus thinning after it; the timing and target are both flipped."],
    ["Her chest muscles failed first, and the steroid was given to Sofia after birth to mature her respiratory center in the brain", false, "Weak chest muscles contribute, but the core RDS defect is surfactant; the steroid goes to the mother before delivery, not to the baby after it."],
    ["Her lungs are filled with fluid, and the steroid's 36 hours means it arrived too late to have any effect on her surfactant at all", false, "Thirty-six hours sits inside the 1-2 day window that helps; calling it too late reverses the chapter's timing rule."]
  ], "ANSWER KEY — Correct answer: deficient surfactant is the defect, and the maternal steroid 1-2 days before delivery raises fetal surfactant production. DETAILED RATIONALE — Surfactant appears about 24 weeks and is adequate about 34 weeks; at 31 weeks Sofia is short. The drug pair must not be swapped: betamethasone to the mother before delivery, surfactant to the newborn through an endotracheal tube. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): match the mechanism and the drug timing to the same timeline.", { scen: CASE_P1, grp: "PRED-CASE1" });

S(C3, "Sofia's oximeter reads 94%, but the monitor's heart rate reads 122 while Sofia's palpated heart rate is 148. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Reapply or adjust the foot sensor so the two sensor halves line up opposite each other", true, "A saturation is trusted only when the monitor heart rate matches the infant's own rate; a mismatch means the sensor is misread, so it is reapplied or adjusted first."],
    ["Document the time, saturation, heart rate, sensor site, and any oxygen being given", false, "Correct documentation, and it belongs in her record — after the reading being documented is a valid one."],
    ["Report the 94% saturation to the provider as her current oxygen status", false, "Correct to report her status, but reporting an unvalidated number hands the provider a value the monitor itself is questioning."],
    ["Explain the oximeter's purpose and readings to her father at the bedside", false, "Correct family teaching for Skill 13.1 — it follows once the number he is being shown can be trusted."]
  ], "ANSWER KEY — Correct answer: reapply or adjust the sensor so the sensor halves line up. All four options are correct nursing actions — assessment validity decides the order: an unmatched heart rate invalidates the saturation, so the sensor is fixed before the value is charted, reported, or taught from. DETAILED RATIONALE — Skill 13.1 cross-checks the monitor rate against the infant's own rate; matching rates mean the reading is accurate. The sensor sits on the toe or side of the foot, flush to the skin, LED and photodetector opposite each other. PRIORITY FRAMEWORK — Assess Before You Act (Validate the Data): never chart, report, or teach from a number that failed its own check.", { scen: CASE_P1, grp: "PRED-CASE1" });

BANK.push({ cat: C3, type: "dropdown", stem: "The nurse completes Sofia's oxygen plan from the chapter's rules. For each statement, choose the correct completion.<br><br>A saturation reading is considered normal at<br>[[0]]<br><br>The oximeter alarm floor is set at about<br>[[1]]<br><br>Oxygen given to Sofia must always be<br>[[2]]", blanks: [
  { o: [O("92% or higher", true, "Pulse oximetry of 92% or higher is the chapter's normal reading."), O("88% or higher", false, "That floor is below the chapter's normal line; 92% is the number this chapter sets."), O("98% or higher", false, "The chapter does not demand near-perfect saturation; chasing it invites the oxygen toxicity behind BPD and ROP.")] },
  { o: [O("92% to 95%", true, "The alarm is set at the minimum acceptable saturation, approximately 92-95%."), O("85% to 88%", false, "That alarm would stay silent through saturations the chapter already calls abnormal."), O("96% to 100%", false, "That alarm would fire constantly at readings the chapter calls normal.")] },
  { o: [O("Warmed and humidified", true, "Oxygen for a newborn is warmed and humidified; cold, dry gas dries the mucous membranes."), O("Cold and dry", false, "The direction is flipped — cold, dry gas is exactly what the rule protects her membranes from."), O("Given at the highest flow she tolerates", false, "More oxygen is not automatically better; the blood level, not the delivered amount, is what is titrated.")] }
], tp: "ANSWER KEY — Correct answers: normal saturation is 92% or higher; the alarm floor is about 92-95%; oxygen is warmed and humidified. DETAILED RATIONALE — Each blank is a number or direction the chapter fixes: the normal line, the alarm floor just above it, and the warmed-and-humidified rule for every route from cannula to ventilator. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): build the plan from the chapter's set values, not from adult-unit habits.", scen: CASE_P1, grp: "PRED-CASE1" });

BANK.push({ cat: C4, type: "order", stem: "Two hours later Sofia's monitor alarms: she has not breathed for 25 seconds, her heart rate is 100 beats/min, and she looks dusky. Place the nurse's responses in the order they should be done.", items: [
  { t: "Rub her feet, ankles, and back gently to stimulate breathing", r: "Gentle stimulation is the first rung of the apnea response ladder." },
  { t: "Suction her nose and mouth and raise the head of her bed to a semi-Fowler position", r: "Clearing the airway and positioning come second, if stimulation alone has not restarted breathing." },
  { t: "Ventilate her with a bag-valve mask device", r: "If breathing does not begin after stimulation, suction, and positioning, bag ventilation is the third rung." }
], tp: "ANSWER KEY — Correct order: gentle stimulation of feet, ankles, and back, then suction the nose and mouth with the head of the bed raised to semi-Fowler, then bag-valve mask ventilation if breathing does not begin. DETAILED RATIONALE — A pause of 20 seconds or longer is apnea; with a heart rate under 110 beats/min it is bradycardia, and cyanosis travels with the pair. The ladder escalates one rung at a time and never starts at the bag. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): in an escalation ladder, the least invasive effective step goes first.", scen: CASE_P1, grp: "PRED-CASE1" });

S(C3, "On day 3, Sofia is weaning on CPAP, her temperature holds at 36.7°C in the incubator, and her saturations run 93-95% with quiet breathing at 48 breaths/min. How should the nurse evaluate her course?", [
    ["She is improving — temperature inside the target band, saturation at or above the normal line, and respirations below the distress rate", true, "Evaluation re-measures the admission cues: 36.0 to 36.7°C, dusky distress at 68 breaths/min to quiet breathing at 48, saturation holding at or above 92%."],
    ["She is not improving, because a saturation of 93-95% is still below the level a newborn should hold around the clock", false, "The chapter's normal line is 92% or higher; 93-95% clears it. Demanding more invites excess oxygen and its toxic effects."],
    ["She needs her oxygen increased, because CPAP on day 3 means her lungs have failed to respond to treatment", false, "CPAP is weaned gradually as the infant strengthens; still using it while every measured cue improves is a weaning course, not a failure."],
    ["Her temperature is now too high, because the incubator should hold her at the low end of the range to conserve her glucose stores", false, "36.7°C sits inside both the 36.2-37°C target and the care plan's 36.5-37°C goal; warmth at goal is the plan working."]
  ], "ANSWER KEY — Correct answer: she is improving on every admission cue. DETAILED RATIONALE — Evaluate Outcomes compares each original value with its line: temperature into band, respirations under 60 and quiet, saturation at or above 92%. The distractors move a line (saturation, temperature) or rename a gradual CPAP wean as failure. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): judge the course against the values that defined the problem.", { scen: CASE_P1, grp: "PRED-CASE1" });

/* ===== CASE 2 (PRED-CASE2) — The feed that changed: NEC unfolding ===== */
var CASE_P2 = "CASE STUDY — The Feed That Changed. Baby boy T. was born at 32 weeks, birth weight 1,700 g, and is now 6 days old, receiving orogavage feedings of his mother's expressed milk in the NICU. At this morning's feed check the nurse finds his abdominal girth has grown since yesterday, his bowel sounds are faint, and he vomited once after the last feed. His temperature is 36.4°C, he is sleepier than usual, and his last stool was loose. His gavage tube was last replaced 5 days ago.";

M(C7, "Which findings at this feed check require the nurse to act now? Select all that apply.", [
    ["Abdominal girth grown since yesterday", true, "A growing girth is half of the NEC early-warning pair — distention building feed by feed."],
    ["Bowel sounds faint while the belly grows", true, "Fading bowel sounds with a growing belly are the early NEC picture, ahead of the dramatic signs."],
    ["Vomiting after the last feed", true, "Vomiting in a preterm infant with a changing abdomen joins the warning picture and is watched at every feed."],
    ["Gavage tube last replaced 5 days ago", false, "The tube is replaced every 3-7 days, so day 5 is still inside its window — not a cue."],
    ["Sleepier than usual at 6 days old", true, "A behavior change in a preterm infant is a reportable observation; lethargy also travels with sepsis and NEC."],
    ["Feeding by orogavage rather than by bottle", false, "At 1,700 g on tube feeds, orogavage is the planned route; the route itself is not a warning sign."]
  ], "ANSWER KEY — Correct answers: grown abdominal girth, faint bowel sounds with a growing belly, vomiting after the last feed, and increased sleepiness. DETAILED RATIONALE — NEC whispers before it shouts: girth and bowel sounds change before bloody stools, diarrhea, and bilious vomitus appear. The tube at day 5 sits inside its 3-7 day replacement window, and orogavage is his prescribed route. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): catch the early-warning pair before the late signs arrive.", { scen: CASE_P2, grp: "PRED-CASE2" });

S(C7, "The nurse explains to a student how a baby like T. develops this bowel problem. Which chain is correct?", [
    ["Hypoxia or sepsis cuts blood flow to the bowel lining, the protective mucus thins, and bacteria invade the delicate bowel wall", true, "That is the chapter's NEC chain: lost blood supply, thinned mucus, bacterial invasion, inflammation progressing to necrosis."],
    ["An immature sphincter lets feeds reflux upward, and the backed-up milk inflames the stomach until the lining breaks down", false, "Immature sphincters explain regurgitation and vomiting, not bowel necrosis; the NEC chain starts with blood supply, not reflux."],
    ["Cow's milk raises his phosphate level, calcium falls, and the low calcium weakens the smooth muscle of his bowel wall", false, "That is the late hypocalcemia story borrowed into the wrong system; phosphate and calcium do not drive NEC."],
    ["High oxygen levels scar the bowel the way they scar the retina, and the damaged sections slowly lose their blood supply", false, "Oxygen toxicity injures lungs (BPD) and eyes (ROP); the bowel chain runs through hypoxia or sepsis, not oxygen scarring."]
  ], "ANSWER KEY — Correct answer: hypoxia or sepsis cuts bowel blood flow, mucus thins, and bacteria invade. DETAILED RATIONALE — Milk formula or a hypertonic gavage feeding gives the bacteria a place to grow, which is why feeds and the abdomen are assessed together. Each distractor imports a real mechanism from another topic in the chapter. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the right chain must start where this disease starts.", { scen: CASE_P2, grp: "PRED-CASE2" });

S(C7, "Which action should the nurse take FIRST for Baby T.?", [
    ["Stop the feed, notify the provider of the girth and bowel-sound changes, and keep him monitored", true, "The early-warning pair has fired; feeds are held and the provider notified before more milk reaches a bowel that may be losing its blood supply."],
    ["Give the next gavage feed more slowly and recheck his girth afterward to see the trend", false, "Feeding into a suspected NEC bowel feeds the bacteria growing there; a trend is not gathered by adding the next load."],
    ["Replace his gavage tube now, since a fresh tube may explain the vomiting and the faint sounds", false, "His tube is inside its replacement window, and a tube change does not address a growing belly with a quiet gut."],
    ["Burp him, place him on his right side, and restart the feed once he settles", false, "Right-side positioning after a feed aids gastric emptying for a routine spit-up — it is not the response to the NEC warning pair."]
  ], "ANSWER KEY — Correct answer: stop the feed and notify the provider of the girth and bowel-sound changes. DETAILED RATIONALE — Prioritization follows the warning that has already fired: distention plus fading bowel sounds in a preterm infant on feeds is NEC until proven otherwise, and oral fluids are resumed later only carefully and as ordered. PRIORITY FRAMEWORK — Prioritization (Clinical Judgment): when an early-warning pair fires, remove the load and escalate before gathering more routine data.", { scen: CASE_P2, grp: "PRED-CASE2" });

BANK.push({ cat: C6, type: "dropdown", stem: "The provider suspects necrotizing enterocolitis for Baby T. and rewrites his orders. For each statement, choose the correct completion.<br><br>His nutrition now comes from<br>[[0]]<br><br>Before any future gavage feed, the nurse aspirates the stomach; feeding proceeds as planned only when the aspirate is<br>[[1]]<br><br>His tube route, when feeds resume, stays orogavage because newborns are<br>[[2]]", blanks: [
  { o: [O("Total parenteral nutrition, to rest the bowel", true, "TPN feeds the veins while the bowel rests — its named role in NEC care."), O("Term formula by bottle, in smaller volumes", false, "Term formula burdens preterm kidneys, and oral feeding is what a suspected NEC bowel must be spared."), O("Glucose water between rest periods for the bowel", false, "Glucose water is not a bowel-rest treatment and is specifically warned against in newborn feeding care.")] },
  { o: [O("Mucus or air only", true, "Mucus or air only means feed as planned; a residual of liquid means notify the physician before feeding."), O("A large amount of liquid formula", false, "A liquid residual is the notify-first finding, not the feed-ahead finding — the pair is flipped."), O("Partly digested milk in any amount", false, "Any liquid residual, digested or not, is reported before feeding; only mucus or air clears the feed.")] },
  { o: [O("Obligatory nose breathers", true, "A nasal tube steals breathing space from a baby who breathes through the nose; the oral route leaves it open."), O("Mouth breathers when they are hungry", false, "Newborns breathe through the nose — that single fact is the whole reason orogavage is preferred."), O("Unable to swallow before 40 weeks", false, "Suck-swallow-breathe coordination arrives about 34 weeks; the nose-breathing fact, not swallowing, drives the route.")] }
], tp: "ANSWER KEY — Correct answers: TPN to rest the bowel; feed ahead only on mucus or air; orogavage because newborns are obligatory nose breathers. DETAILED RATIONALE — Generate Solutions assembles the NEC plan from three chapter rules: parenteral nutrition rests the bowel, the aspirate check gates every future feed, and the oral route protects the nasal airway. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): each element of the plan answers a specific mechanism in the case.", scen: CASE_P2, grp: "PRED-CASE2" });

BANK.push({ cat: C7, type: "order", stem: "Baby T.'s stools have turned bloody and his vomitus is bilious; the provider confirms necrotizing enterocolitis. Place the nurse's ongoing responsibilities in the order they should be carried out at this point.", items: [
  { t: "Observe his vital signs closely and maintain strict infection control techniques", r: "Close observation and infection control frame every other NEC responsibility." },
  { t: "Keep all oral fluids held, resuming them later only carefully and as ordered", r: "The bowel rests: nothing by mouth is restarted on the nurse's own timing." },
  { t: "Support the parenteral nutrition and antimicrobial therapy now running", r: "TPN feeds him while antimicrobials treat the invaded bowel wall." },
  { t: "Keep measuring abdominal girth and listening for bowel sounds at each assessment", r: "The early-warning pair stays on the chart until feeding is safely re-established." }
], tp: "ANSWER KEY — Correct order: close vital-sign observation with strict infection control, then oral fluids held and resumed only as ordered, then support for TPN and antimicrobials, then continued girth and bowel-sound measurement. DETAILED RATIONALE — NEC treatment in the chapter is antimicrobials plus parenteral nutrition to rest the bowel, with surgery if bowel has necrosed; the nurse's standing work is observation, infection control, careful fluids, and the girth-and-sounds watch. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): sequence the standing responsibilities around the treatment that is already running.", scen: CASE_P2, grp: "PRED-CASE2" });

S(C7, "A week later, T. is tolerating slow gavage feeds again, his girth is back to baseline, and bowel sounds are active in all areas the nurse checks. How should the nurse evaluate his recovery?", [
    ["His early-warning signs have reversed — girth at baseline and bowel sounds active are the same measures that first signaled the problem", true, "Evaluation returns to the measures that fired: girth trend and bowel sounds. Both back at baseline, with feeds tolerated, is recovery read on the right gauges."],
    ["He cannot be called improved until his stools are formed and his vomitus has been absent for a full week", false, "Formed stools are not a preterm recovery milestone, and no week-long vomit-free rule exists in the chapter; the gauges are girth and sounds."],
    ["His recovery is doubtful, because a baby who had NEC once will show a growing girth at every future feed check", false, "A girth at baseline today is today's finding; a past episode raises vigilance, it does not rewrite a normal measurement."],
    ["He is recovered because his temperature is normal, and temperature is the single measure that tracks bowel healing", false, "Temperature tracks infection broadly; the bowel-specific recovery gauges in this chapter are girth and bowel sounds."]
  ], "ANSWER KEY — Correct answer: the early-warning pair has reversed on the same measures that signaled NEC. DETAILED RATIONALE — Evaluate Outcomes closes the loop on the original cues: distention resolved to baseline and a quiet gut turned active, with feeds tolerated. The distractors substitute gauges the chapter never assigned to this problem. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): judge recovery with the measures that defined the problem.", { scen: CASE_P2, grp: "PRED-CASE2" });


/* ===== C1 standalones — Classification, characteristics, Ballard, causes ===== */
S(C1, "Two newborns are admitted together. Baby A was born at 35 weeks weighing 2,900 g; Baby B was born at 39 weeks weighing 2,400 g. Which classification is correct?", [
    ["Baby A is preterm but not low birth weight; Baby B is low birth weight and small for gestational age, but not preterm", true, "Preterm is time (before 37 weeks) and low birth weight is weight (2,500 g or less); Baby B also falls below the 10th percentile for his age."],
    ["Baby A is low birth weight because he came early; Baby B is preterm because his weight is below the cutoff", false, "The labels are swapped — the clock decides preterm and the scale decides low birth weight, never the reverse."],
    ["Both babies are preterm and low birth weight, because early birth and low weight always travel together", false, "They often arrive together, but each label is earned separately; these two babies split them in opposite directions."],
    ["Neither label applies, because classification today is based only on how mature the organs appear at examination", false, "Maturity guides care, but the labels themselves are set by gestational age and birth weight as defined."]
  ], "ANSWER KEY — Correct answer: Baby A is preterm only; Baby B is low birth weight and SGA only. DETAILED RATIONALE — A 35-week baby is preterm whatever he weighs; a 39-week 2,400 g baby is term, low birth weight, and below the 10th percentile. Gestational age and maturation predict what the organs can do, which is why the labels are assigned fast and separately. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): apply each label by its own ruler — time for one, weight for the other.");

S(C1, "A mother laboring at 33 weeks asks why her baby came early. Her chart shows twins, a urinary infection, and a history of smoking with no prenatal visits until last month. All of the following are correct explanations from the chapter — which cause should the nurse name FIRST when teaching her?", [
    ["Her twins — multiple gestation stretches and crowds the uterus", true, "Multiple gestation heads her personal list: it is a named cause acting directly on this pregnancy, and it is the cause her own chart makes undeniable."],
    ["Her urinary infection — maternal infectious conditions are a named cause family", false, "Correct cause, present in her chart — it is part of the teaching, behind the multiple gestation that defines this pregnancy."],
    ["Her smoking — a named social and substance link to preterm birth", false, "Correct cause, also hers — it belongs in the same teaching round, after the headline cause is named."],
    ["Her missed prenatal care — adequate prenatal care is the strongest prevention lever", false, "Correct and important for the future — prevention teaching follows the explanation of what drove this birth."]
  ], "ANSWER KEY — Correct answer: multiple gestation. All four options are correct chapter causes present in her chart — the teaching order names the cause most specific to this pregnancy first, then the infection, the substance link, and the prevention lever. DETAILED RATIONALE — The chapter's cause families are multiple gestation, maternal illness including infection, pregnancy hazards, placental problems, and social/substance links including smoking and lack of prenatal care; often the cause is never found. PRIORITY FRAMEWORK — Patient Teaching (Most Specific First): start with the cause this patient's own chart proves, then widen to the rest.");

S(C1, "A Ballard examination on a newly admitted newborn totals 20 points. His mother asks what the score means and how sure the team can be. Which answer is correct?", [
    ["It estimates him at about 32 weeks, accurate within about 1-2 weeks, and it is cross-checked against her last menstrual period and ultrasound", true, "On the rating table 20 points is about 32 weeks, every 5 points moves about 2 weeks, and the score is used with the menstrual history and ultrasound."],
    ["It estimates him at about 42 weeks, accurate within about 1-2 weeks, and it replaces the need for menstrual or ultrasound dating", false, "The anchor is flipped — 45 points is about 42 weeks, not 20 — and the score cross-checks the other methods rather than replacing them."],
    ["It estimates him at about 32 weeks, accurate to the exact day, because it scores both his skin and his reflexes directly", false, "The week estimate is right but the precision is invented; the Ballard is accurate within about 1-2 weeks, not to the day."],
    ["It estimates him at about 28 weeks, because each point on the total equals roughly one week of gestation", false, "The conversion is 5 points to about 2 weeks, not a point a week; that math lands four weeks too low."]
  ], "ANSWER KEY — Correct answer: about 32 weeks, within 1-2 weeks, cross-checked with menstrual history and ultrasound. DETAILED RATIONALE — The Ballard scores external features and neurological development; anchors are 20 points at about 32 weeks and 45 at about 42 weeks. Maturity, not size, is what the score predicts — how well the organs can function outside the uterus. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): convert the score with the chapter's own anchors and state its real margin.");

S(C1, "During a newborn examination, the examiner pulls a baby's elbow across his chest and it slides easily past his chin, and his heel reaches toward his ear with almost no resistance. His skin is thin with veins showing and his soles have almost no creases. Which pattern is this?", [
    ["A preterm pattern — little flexor tone, immature skin, and a near-smooth sole", true, "Past-the-chin scarf sign, easy heel-to-ear, transparent skin, and few sole creases are all immaturity findings that agree with each other."],
    ["A term pattern — strong flexor tone, mature skin, and deep creases over the whole sole", false, "Every element is reversed: the term elbow stops at the chin, the heel meets resistance, and the term sole is creased throughout."],
    ["A postterm pattern — dry peeling skin, long nails, and very little lanugo or vernix left", false, "Postterm skin is dry and parchment-like with long nails; this baby's thin, veiny skin and plentiful immaturity signs point the other way."],
    ["A normal variation pattern that appears in babies of every gestational age equally", false, "These maneuvers are maturity tests precisely because the findings change with age; they do not read the same at every age."]
  ], "ANSWER KEY — Correct answer: a preterm pattern. DETAILED RATIONALE — The Ballard neuromuscular signs (scarf sign, heel to ear) and physical signs (skin, plantar surface) mature together: resistance grows with age. A term infant's elbow stalls at the midline and a postterm infant looks long, thin, and dry — neither matches this baby. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): when every maneuver points the same direction, name the pattern they share.");

M(C1, "A nurse is completing the admission picture of a 30-week newborn, birth weight 1,350 g, in the NICU. Which findings match the expected preterm appearance? Select all that apply.", [
    ["Extended, sprawled posture with very little flexed tone", true, "The preterm infant rests extended; the flexed posture belongs to the term infant."],
    ["Abundant fine hair over the forehead, shoulders, and arms", true, "Lanugo is plentiful on the preterm infant and thins as gestation advances."],
    ["Thin, transparent skin with veins visible on the abdomen", true, "Preterm skin is thin and loose enough that superficial veins show through."],
    ["Deep creases covering the entire sole of the foot", false, "Creases over the whole sole are a mature finding; the preterm sole has few creases."],
    ["A thick head of hair with long, meconium-stained nails", false, "That pairing belongs to the postterm infant — the opposite end of the calendar."],
    ["Almost no padding of fat under the skin", true, "Subcutaneous fat is nearly absent in the preterm infant, which also drives his heat loss."]
  ], "ANSWER KEY — Correct answers: extended posture, abundant lanugo, thin transparent skin with visible veins, and almost no subcutaneous fat. DETAILED RATIONALE — The preterm look is one coherent picture: sprawled tone, downy hair, see-through skin, smooth soles, scant fat. The two distractors are maturity findings borrowed from the term sole and the postterm head and nails. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): judge each finding against the preterm picture as a whole.");

BANK.push({ cat: C1, type: "matrix", stem: "Four newborns are being classified on the nursery board. Match each baby to the correct classification.", cols: ["Late preterm", "Early term", "Full term", "Postterm"], rows: [
  { t: "Born at 35 weeks and 4 days, breathing with mild support in the NICU", a: 0, r: "Late preterm runs from 34 weeks to 36 weeks and 6 days." },
  { t: "Born at 38 weeks and 2 days after an uncomplicated labor", a: 1, r: "Early term runs from 37 weeks to 38 weeks and 6 days." },
  { t: "Born at 40 weeks and 1 day, feeding well with his mother", a: 2, r: "Full term runs from 39 weeks to 40 weeks and 6 days." },
  { t: "Born at 42 weeks and 3 days, long and thin with dry peeling skin", a: 3, r: "Postterm is birth beyond 42 weeks; his look matches the postmature picture." }
], tp: "ANSWER KEY — Correct matches: 35 weeks 4 days = late preterm; 38 weeks 2 days = early term; 40 weeks 1 day = full term; 42 weeks 3 days = postterm. DETAILED RATIONALE — The classification ladder is a set of windows, not one flat idea of term: every week up to 39 counts for development, and the windows on either side carry their own risks. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): place each baby inside his window before planning his care." });

S(C1, "A delivery is expected at 23 weeks. The parents ask the nurse what the team means when they call their baby periviable. All of the following are correct statements — which one should the nurse share FIRST?", [
    ["Their baby is at the very edge of viability, and births at this stage belong in a center with intensive care support", true, "Periviable means 20 to 25 weeks, the edge of viability; framing the setting and the support available is the first honest ground for every later decision."],
    ["Survival before 24 weeks is only about 5%, and it often comes with serious impairment", false, "Correct figures from the chapter — they belong in the conversation, after the framing that lets the parents hear them as information, not verdict."],
    ["Care before the birth may include medicines to hold off labor, steroids, and antibiotics", false, "Correct — tocolytics, antenatal steroids, and antibiotics for ruptured membranes may already have happened; the list follows the framing."],
    ["Their informed preferences will shape the plan of care, and the team will support and guide them", false, "Correct and central to this chapter — it is stated once the parents understand what periviable means for their baby."]
  ], "ANSWER KEY — Correct answer: the baby is at the edge of viability and belongs in a center with intensive care support. All four options are correct chapter statements — communication order puts the definition and the setting first, then the numbers, the care already given, and the family's role in the plan. DETAILED RATIONALE — About 0.5% of births occur before the third trimester; the agreed plan is respected and any change is communicated at hand-off. PRIORITY FRAMEWORK — Therapeutic Communication (Frame Before Figures): give the meaning and the setting before the statistics.");

/* ===== C2 standalones — RDS, oxygen, CPAP, BPD ===== */
S(C2, "A 29-week newborn is 3 hours old. His respirations have climbed to 64 breaths/min, he grunts with each breath, and retractions are deepening. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Support his oxygenation by the ordered route and keep him in a warm incubator with close vital-sign monitoring", true, "His distress picture is declaring itself; oxygen support matched to need, warmth, and close monitoring are the chapter's immediate RDS spine."],
    ["Analyze his arterial blood gases to track how his gas exchange is trending", false, "Correct and part of his care — the gases inform the support, they do not replace starting it."],
    ["Handle him gently and as little as possible, bunching his care into quiet sessions", false, "Correct energy-saving care for a preterm infant — it shapes how the first action is delivered, not whether it starts."],
    ["Confirm from the record whether his mother received her steroid doses before delivery", false, "Correct history to verify — it explains his risk, but a record check does not treat a baby whose retractions are deepening now."]
  ], "ANSWER KEY — Correct answer: support oxygenation by the ordered route, in a warm incubator, with close monitoring. All four options are correct nursing actions — ABCs decide the order: a worsening breathing picture is treated first, and gases, gentle handling, and history proceed around that support. DETAILED RATIONALE — Distress signs may show at delivery or take several hours to declare; worsening brings edema, lassitude, and apnea, and mechanical ventilation may become necessary in the NICU. PRIORITY FRAMEWORK — ABCs (Breathing First): treat the failing function before documenting its history.");

S(C2, "A preterm infant has been on high oxygen concentrations for many days for RDS. His nurse notes he now needs the oxygen longer than expected, and imaging suggests thickened lung membranes. Which problem has developed?", [
    ["Bronchopulmonary dysplasia — lung damage from the toxic response to prolonged high oxygen", true, "BPD is oxygen toxicity: atelectasis, edema, and thickened membranes that interfere with ventilation and prolong oxygen dependence."],
    ["Retinopathy of prematurity — abnormal vessel growth in his incompletely developed retina", false, "ROP is oxygen's eye injury, in the retina; this baby's injury is in his lungs, with thickened membranes and ventilator dependence."],
    ["Necrotizing enterocolitis — inflammation of his bowel progressing toward tissue death", false, "NEC is the bowel emergency driven by lost blood supply and bacteria; nothing in this picture is abdominal."],
    ["Intracranial hemorrhage — bleeding from the fragile capillaries inside his head", false, "That bleed announces itself with fontanel, behavior, and feeding changes — not with prolonged oxygen need and lung membrane changes."]
  ], "ANSWER KEY — Correct answer: bronchopulmonary dysplasia. DETAILED RATIONALE — Oxygen has toxic twins: BPD in the lungs and ROP in the eyes. The lung version follows long treatment with high concentrations and can mean long dependence on oxygen or a ventilator — the reason oxygen is titrated to the blood level, never simply maximized. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): match the injury to the organ the findings describe.");

S(C2, "A newborn on CPAP by nasal prongs is breathing more comfortably today, with saturations holding at 94% on less support than yesterday. His father asks what the prongs are doing and whether they can come off today. Which answer is correct?", [
    ["The prongs hold a constant air pressure that keeps his lungs open between breaths, and the pressure is weaned gradually as he strengthens", true, "CPAP is noninvasive constant pressure used with oxygen therapy, delivered by prongs or mask, and weaned gradually — not stopped at the first good day."],
    ["The prongs breathe for him completely, and they can be removed today now that his saturation has reached the normal range", false, "CPAP does not breathe for him — it holds his own lungs open — and a single good reading does not end a gradual wean."],
    ["The prongs deliver extra oxygen only, and they stay until his lungs make enough surfactant at about 40 weeks", false, "Pressure, not just oxygen, is the point of CPAP, and surfactant is adequate by about 34 weeks, not 40."],
    ["The prongs keep his airway dry, and they come off once his respiratory rate falls below 60 for a full shift", false, "Oxygen for a newborn is warmed and humidified, not drying, and no rate-for-a-shift rule governs the CPAP wean."]
  ], "ANSWER KEY — Correct answer: CPAP holds the lungs open with constant pressure and is weaned gradually. DETAILED RATIONALE — CPAP supports the same defect RDS creates — alveoli that will not stay open — from outside, without a ventilator. Its companions are careful oxygen titration and the saturation line of 92% or higher. PRIORITY FRAMEWORK — Patient Teaching (Mechanism Before Schedule): explain what the device does before discussing when it ends.");

M(C2, "A nurse is setting up oxygen for a 1,600 g preterm infant with RDS. Which elements belong in this baby's oxygen care? Select all that apply.", [
    ["Warm and humidify the oxygen before it reaches him", true, "Newborn oxygen is always warmed and humidified; cold, dry gas dries the mucous membranes."],
    ["Monitor his oxygen saturation continuously", true, "Saturation monitoring is continuous in this chapter, with the alarm floor set near the minimum acceptable level."],
    ["Choose the route — cannula, hood, incubator, or ventilator — by the concentration he needs", true, "Routes are matched to the concentration required; the route is a dose decision, not a habit."],
    ["Run the oxygen as high as the equipment allows so his saturation never dips", false, "Untitrated oxygen is the exposure behind BPD and ROP; the target is the blood level that sustains life and protects the brain."],
    ["Watch his fluids for both overhydration and dehydration while IV fluids run", true, "IV fluids are prescribed alongside oxygen, and the nurse watches both directions of fluid error."],
    ["Judge his oxygenation mainly by how pink his skin looks at each check", false, "Color is an unreliable witness — cyanosis needs a large amount of desaturated hemoglobin to show at all; the monitor carries this judgment."]
  ], "ANSWER KEY — Correct answers: warmed and humidified oxygen, continuous saturation monitoring, route matched to concentration, and watching fluids in both directions. DETAILED RATIONALE — Oxygen care in this chapter is a system: the gas is conditioned, the blood level is monitored, the route fits the need, and fluids are balanced. Maximizing flow and judging by color are the two habits the chapter explicitly dismantles. PRIORITY FRAMEWORK — Safety (Oxygen as a Drug): dose it, monitor it, and respect its toxic effects like any other drug.");

S(C2, "Amniotic fluid testing before a threatened 30-week delivery shows a low lecithin-to-sphingomyelin result. The mother asks what the test was looking for. Which answer is correct?", [
    ["How much surfactant the baby's lungs have made — a low result means the lungs are short of the chemical that keeps air sacs open", true, "The L/S ratio reports surfactant in the amniotic fluid; too little surfactant is the core defect behind RDS."],
    ["How much calcium the baby stored during the last trimester — a low result predicts jitteriness after birth", false, "Calcium transfer is a third-trimester event, but this fluid test reads lung maturity, not mineral stores."],
    ["Whether infection is present in the fluid — a low result means bacteria have reached the baby before birth", false, "Infection risk matters in this chapter, but the L/S result is a surfactant measurement, not a culture."],
    ["How well the placenta is aging — a low result means delivery should be delayed as long as possible", false, "Placental aging is the postterm story; this test answers a lung question for a baby threatening to come early."]
  ], "ANSWER KEY — Correct answer: the test measures surfactant through the lecithin-to-sphingomyelin ratio. DETAILED RATIONALE — Lecithin is the fatty component surfactant is rich in; when the ratio shows too little, the antenatal steroid window and newborn surfactant through an endotracheal tube become the plan, with lung improvement expected within about 72 hours of the newborn dose. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): name what a test measures before acting on its result.");

S(C2, "A preterm newborn received surfactant through his endotracheal tube 12 hours ago for RDS. His mother asks when the medicine should start helping and what the team watches meanwhile. Which answer is correct?", [
    ["Improvement in lung function is expected within about 72 hours, while the team protects his own surfactant by keeping him warm, oxygenated, and well perfused", true, "The 72-hour expectation is the chapter's figure, and cold stress, hypoxia, and poor perfusion all reduce his own surfactant production meanwhile."],
    ["Improvement is expected within about 12 hours, and his improving color is the main sign the team follows hour by hour", false, "The timeline is stretched wrong — the chapter allows about 72 hours — and color is the unreliable witness this chapter warns against."],
    ["Improvement is expected within about 72 hours, but only if his oxygen is kept at maximum until the medicine takes hold", false, "The timeline is right and the condition is wrong: maximum oxygen is the exposure behind BPD and ROP, not a partner to the drug."],
    ["Improvement cannot be judged for a week, because surfactant given this way works only after his lungs reach full maturity", false, "No week-long silence exists in the chapter; the drug is expected to improve lung function within about 72 hours."]
  ], "ANSWER KEY — Correct answer: improvement within about 72 hours, while warmth, oxygenation, and perfusion protect his own production. DETAILED RATIONALE — Surfactant replacement and surfactant protection are the same plan: the tube dose buys time, and keeping the baby out of cold stress, hypoxia, and poor perfusion keeps his own factory running. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): judge a drug by its named timeline and protect the physiology it depends on.");

/* ===== C3 standalones — Apnea, hypoxia, oximetry ===== */
S(C3, "A term newborn, 12 hours old and previously well, is found to have had a 30-second pause in breathing with a heart rate of 96 beats/min. All of the following are correct nursing actions — which consideration comes FIRST in the nurse's thinking?", [
    ["Apnea in a term infant is rare and usually signals serious pathology, so this episode is escalated as a warning sign, not a variation of prematurity", true, "The context flips the meaning: apnea of prematurity belongs to the immature nervous system, but in a term infant apnea points to serious pathology and drives the response."],
    ["Apnea is expected in the first day for babies of every gestational age, so the episode is charted with his routine observations", false, "Correct charting, wrong premise — a 30-second pause is never a routine finding in a term baby."],
    ["His mother should be taught the stimulation routine so she can manage episodes like this at the bedside herself", false, "Correct teaching for preterm parents later in the stay — it is not the first consideration for a term baby's first episode."],
    ["His temperature should be rechecked at the next round, since cold stress can bring on pauses in breathing", false, "Correct association for preterm cold stress — it does not outrank recognizing what apnea means in a term infant."]
  ], "ANSWER KEY — Correct answer: in a term infant, apnea signals serious pathology and is escalated. All four options contain correct actions or associations — context decides the priority: the same 20-second-plus pause that is expected immaturity in a preterm baby is a red flag in a term baby. DETAILED RATIONALE — Apnea is breathing stopped for 20 seconds or longer, traveling with bradycardia under 110 beats/min and cyanosis; its meaning is assigned by the baby it happens to. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): interpret the finding in the patient in front of you, not the population it usually belongs to.");

S(C3, "A pale, severely anemic preterm infant has a saturation reading of 95% and no blue color anywhere. A student says, 'At least his oxygen is fine — look how pink he is.' Which correction is right?", [
    ["Neither witness clears him — cyanosis needs at least 5 g/dL of desaturated hemoglobin to show, and fetal hemoglobin can hide tissue hypoxia behind a normal saturation", true, "Both traps in one baby: an anemic infant may never look blue however hypoxic he is, and fetal hemoglobin releases oxygen reluctantly, so tissues can starve behind a reassuring number."],
    ["The student is right about the color but wrong about the number, because saturation readings are never accurate in anemic infants", false, "The reading can be accurate as a blood value; the trap is that a normal blood value does not guarantee tissue oxygenation."],
    ["The student is right about the number but wrong about the color, because pink skin in a newborn always means the tissues are well supplied", false, "Pink skin is exactly what severe anemia can preserve while the tissues go short; color is the weak witness here."],
    ["Both witnesses clear him, and the real risk in anemia is a low heart rate, which should be the team's only oxygen concern", false, "Bradycardia matters in apnea, but it does not erase the two oxygen traps this baby demonstrates."]
  ], "ANSWER KEY — Correct answer: neither color nor a normal saturation alone clears him. DETAILED RATIONALE — Hypoxia is inadequate oxygenation at the cellular level, which is a tissue judgment, not a color or a single number. Trust the monitor and the baby together — never color alone. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): when two easy witnesses can both mislead, say so explicitly and widen the assessment.");

BANK.push({ cat: C3, type: "matrix", stem: "A nurse is reviewing four NICU monitor pictures at hand-off. Match each picture to the correct interpretation.", cols: ["Apnea with bradycardia", "Normal saturation", "Sensor problem", "Respiratory distress"], rows: [
  { t: "No breath for 25 seconds, heart rate 98 beats/min, dusky color", a: 0, r: "A pause of 20 seconds or longer with a heart rate under 110 beats/min is the apnea-bradycardia pair." },
  { t: "Saturation 94%, monitor heart rate matching the baby's own rate", a: 1, r: "At or above 92% is normal, and matching heart rates validate the reading." },
  { t: "Saturation 91%, monitor heart rate 40 beats/min off the baby's own rate", a: 2, r: "Mismatched heart rates mean the reading cannot be trusted — reapply or adjust the sensor." },
  { t: "Respirations 66 breaths/min, grunting, flaring, and retractions", a: 3, r: "Rate at or above 60 with grunting, flaring, and retractions is the distress sign picture." }
], tp: "ANSWER KEY — Correct matches: 25-second pause with rate 98 = apnea with bradycardia; saturation 94% with matching rates = normal; mismatched rates = sensor problem; rate 66 with grunting and retractions = respiratory distress. DETAILED RATIONALE — Each row is read with a different rule: the 20-second and 110 lines, the 92% line plus its validation check, and the distress sign set. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): apply the rule that belongs to the picture in front of you." });

S(C3, "A preterm infant's apnea monitor alarms for the third time in an hour. Each pause has ended with gentle stimulation of his feet and back. Between episodes he breathes at 44 breaths/min with a saturation of 93%. Which plan fits the chapter?", [
    ["Keep the apnea monitor on, respond to every alarm with the stimulation ladder, and track his rate, heart rate, and saturation together", true, "Apnea of prematurity is monitor-watched and ladder-treated; his between-episode numbers sit inside their lines, so vigilant monitoring is the plan."],
    ["Remove the monitor between episodes so the alarms stop disturbing his rest and his parents", false, "The monitor is what catches the next pause; removing it trades his safety for quiet and leaves the ladder with nothing to answer."],
    ["Start him on a medication the chapter names for apnea so the pauses stop recurring and keep watching him closely through the next care round", false, "The chapter names no drug for apnea of prematurity — the treatment is the response ladder plus monitoring."],
    ["Keep him flat and completely still after each episode, since any handling can trigger the next pause", false, "The ladder itself includes suction and raising the head of the bed to semi-Fowler; stillness is not the treatment, response is."]
  ], "ANSWER KEY — Correct answer: monitor on, ladder ready, rate and saturation tracked together. DETAILED RATIONALE — Recurrent apnea of prematurity is expected in this population; the chapter's answer is surveillance plus the stimulation, suction-and-position, then bag ladder — in that order, every time. Inventing a drug or removing the alarm both fail the chapter. PRIORITY FRAMEWORK — Safety (Surveillance): for a recurring event with a defined response, the monitor and the ladder stay in place.");

S(C3, "A nurse places a pulse oximeter on a preterm infant for continuous monitoring. Which placement and setup follow the chapter's skill?", [
    ["Sensor on the toe or side of the foot, flush to the skin and taped firmly, sensor halves opposite each other, alarm set near 92-95%", true, "That is Skill 13.1 whole: site, flush fit, aligned halves shown by the printed circles, and the alarm at the minimum acceptable saturation."],
    ["Sensor wrapped loosely around the ankle so it can be slid aside quickly during cares, alarm set near 85%", false, "A loose sensor misreads, and an 85% alarm floor stays silent through saturations the chapter calls abnormal."],
    ["Sensor on the palm under a mitten, sensor halves side by side, alarm set near 92-95%", false, "The site and the alignment are both wrong — foot or toe, with the two halves facing each other across the vascular bed."],
    ["Sensor on the toe, flush and aligned, with the alarm turned off so it does not wake him between checks", false, "Placement is right and the alarm rule is broken; the alarm floor is part of the skill, not an optional extra."]
  ], "ANSWER KEY — Correct answer: foot or toe, flush, aligned halves, alarm near 92-95%. DETAILED RATIONALE — The skill ends with documentation: start time, heart rate and saturation, sensor site, and any oxygen with its method. A reading is validated by matching the monitor's heart rate to the infant's own before any of it is charted. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): a monitoring skill is its setup rules, not just its device.");


/* ===== C4 standalones — Thermoregulation and cold stress ===== */
S(C4, "A 1,500 g preterm infant is found with mottled skin, a respiratory rate that has risen with brief pauses, a heart rate of 102 beats/min, and limp, sleepy behavior. His skin temperature is falling. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Restore his neutral thermal environment — adjust the incubator or warmer to hold his body temperature in the target band", true, "This is the cold stress sign set whole, and warmth is the treatment: the environment is corrected first so every other measure stops fighting an ongoing heat loss."],
    ["Check his blood glucose, since a cold baby burns glucose to stay warm and keep watching him closely through the next care round", false, "Correct and expected — cold burns glucose toward hypoglycemia — but the check proceeds while the heat loss driving it is being stopped."],
    ["Record both his temperature and the incubator's temperature on the chart", false, "Correct standing duty, done every 2 hours — documentation follows the hands-on correction of the environment."],
    ["Teach his parents the five signs of cold stress so they can spot them on visits", false, "Correct teaching for this family — it belongs after the baby in front of them is warm and stable."]
  ], "ANSWER KEY — Correct answer: restore the neutral thermal environment first. All four options are correct nursing actions — Maslow and safety decide the order: a baby showing decreased skin temperature, rising respirations with apnea, bradycardia, mottling, and lethargy is in cold stress, and the snowball (glucose burned, oxygen burned, surfactant suppressed) stops only when the heat loss stops. DETAILED RATIONALE — Early detection prevents the complications rather than chasing them; the glucose check, the paired temperature charting, and the parent teaching all proceed in the same round, behind the warmer. PRIORITY FRAMEWORK — Safety First (Stop the Ongoing Harm): interrupt the active process before measuring its effects.");

M(C4, "A student is listing why a preterm infant gets cold so much faster than a term infant. Which reasons belong on the list? Select all that apply.", [
    ["Little or no brown fat to insulate him", true, "The body's own insulation is missing in the preterm infant."],
    ["A surface area that is large for his body weight, with a large head surface", true, "Radiation loss runs off that large surface, and the head's share predisposes him further."],
    ["An immature heat-regulating center in the brain", true, "The control center itself is unfinished, so his temperature defense starts late and weak."],
    ["Muscles too weak to shiver, in an extended posture that exposes more surface", true, "He cannot shiver, and the sprawled preterm posture opens still more surface to the room."],
    ["Sweat glands that overwork and cool him whenever the room warms up", false, "His sweat glands are not functioning to capacity — underworking, not overworking; the direction is flipped."],
    ["A metabolic rate so low that he produces almost no heat of his own", false, "His metabolism runs high, which is why his glucose falls easily; low production is the opposite of his problem."]
  ], "ANSWER KEY — Correct answers: little brown fat, large surface area for weight with a large head, immature heat center, and weak muscles that cannot shiver in an extended posture. DETAILED RATIONALE — The factor list is a set of directions: insulation missing, surface too big, control immature, shivering absent, posture open, metabolism high. The two distractors each flip one direction on that list. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): learn the list by its directions, because the exam flips them one at a time.");

S(C4, "At a bedside check, a nurse finds a preterm infant's temperature probe taped over a rib, slipped under his diaper, with no cover on it under his radiant warmer. Which correction set is right?", [
    ["Move the probe to the right upper quadrant of his abdomen, off bone and out from under the diaper, and cover it with a protector under the warmer", true, "All three errors fixed at once: RUQ abdomen, never over a bony prominence or under a diaper, and a protector so the warmer's heat does not fake the reading."],
    ["Move the probe to his upper arm and cover it with a protector, since any flat skin site reads the same under a warmer", false, "The site is specific — right upper quadrant of the abdomen — because skin temperature there falls before core temperature does."],
    ["Leave the probe where it is but add the protector, since the cover is the only part that affects the reading", false, "A covered probe over a rib under a diaper still reads bone and diaper, not the early-warning skin site."],
    ["Remove the probe and rely on axillary temperatures every 2 hours, since skin probes cause too many errors", false, "Axillary readings have their place, but the probe exists because skin temperature drops before core temperature — removing it removes the early warning."]
  ], "ANSWER KEY — Correct answer: RUQ abdomen, off bone, out of the diaper, covered under the warmer. DETAILED RATIONALE — Probe rules are a matched set: site (right upper quadrant), exclusions (no bone, no diaper, no line of cool oxygen input), and the radiant-warmer protector. The probe also must not sit over brown fat areas, extremities, or broken skin. PRIORITY FRAMEWORK — Assess Before You Act (Validate the Data): a monitoring device placed wrong manufactures wrong numbers.");

S(C4, "A nurse is preparing a radiant warmer for a newly admitted preterm infant. A colleague suggests laying the clear plastic shield over the warmer to 'keep his heat in.' Which response is correct?", [
    ["Do not use the shield — it can block the infrared heat; instead, cover his temperature probe with a reflective patch", true, "The chapter's radiant-warmer pair: no Plexiglas shield over the baby, and a reflective patch over the probe so it reads the infant, not the warmer."],
    ["Use the shield — it holds his heat in the same way the incubator walls hold heat for babies inside them", false, "The incubator comparison fails: the shield sits between the heat source and the baby and blocks the infrared heat he needs."],
    ["Use the shield but leave the probe uncovered, so the probe can warn the team if he gets too warm", false, "An uncovered probe under a warmer reads the warmer's heat, not the baby's — the patch belongs on the probe either way."],
    ["Do not use the shield, and lay the reflective patch over his chest so his skin reflects the excess heat away", false, "The patch's job is to shield the probe's reading, not the baby's skin; moving it to his chest invents a use the chapter never gives it."]
  ], "ANSWER KEY — Correct answer: no shield over the warmer; reflective patch over the probe. DETAILED RATIONALE — Radiant warmers give easy access while holding a neutral thermal environment, but only if the infrared path stays open. Each distractor moves one object — shield or patch — to the wrong place. PRIORITY FRAMEWORK — Safety (Equipment Rules): in equipment items, every object has one assigned place; swapping them is the trap.");

S(C4, "A small preterm infant keeps drifting below his temperature target even though his incubator is set where his larger neighbor's is set. His nurse also notes the incubator humidity reads 45%. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Raise his incubator setting — smaller infants may need higher incubator temperatures to hold their optimal body temperature", true, "The chapter's rule is size-based: the incubator is set to whatever holds this infant's temperature, and smaller infants run higher settings."],
    ["Raise the humidity toward the desirable level of 60% or higher and keep watching him closely through the next care round", false, "Correct adjustment for his environment — it supports the same goal, behind the temperature setting that defines his thermal environment."],
    ["Record both his temperature and the incubator's temperature at this check", false, "Correct standing duty every 2 hours — the record follows the adjustment it documents."],
    ["Use discretion about his bath today, since a wet infant loses temperature fast by evaporation", false, "Correct heat-conserving judgment — a care decision that proceeds once his environment is set to hold him warm."]
  ], "ANSWER KEY — Correct answer: raise his incubator setting to hold his temperature. All four options are correct nursing actions — physiology first decides the order: the setting that holds his 36.2-37°C band is the intervention, and humidity, charting, and bath judgment arrange around it. DETAILED RATIONALE — Overheating is the opposite error and also raises oxygen and calorie needs, so the setting is titrated to the baby, never copied from a neighbor and never maximized. PRIORITY FRAMEWORK — Safety First (Individualize the Setting): the right setting is the one that holds this patient's target.");

S(C4, "Parents visiting their preterm daughter see her lying in an incubator dressed only in a diaper and ask why she cannot wear the clothes they brought. Which teaching is correct?", [
    ["The incubator holds a controlled temperature, air, and humidity so she stays warm while spending the least possible oxygen, and her team needs to see her skin and chest at all times", true, "That is the neutral thermal environment defined: normal temperature at minimum oxygen cost, with the observation access her care depends on."],
    ["Clothes would overheat her, because preterm infants produce more body heat than term infants and cannot shed it", false, "Her problem is the opposite — she loses heat faster than she makes it; overheating is a risk of the equipment, not of her own production."],
    ["Clothes are not allowed until she reaches 2,500 g, when hospital policy permits dressing NICU babies before the next scheduled assessment comes due", false, "No weight-for-clothes rule exists in the chapter; the diaper-only state serves the thermal environment and observation."],
    ["Her skin is too fragile for any fabric contact until it matures at about 34 weeks of age and keep watching him closely through the next care round", false, "Her skin does need gentle handling and little tape, but fabric is not banned to a week count; warmth control and visibility are the reasons."]
  ], "ANSWER KEY — Correct answer: the incubator is a neutral thermal environment holding her warm at the least oxygen cost, with her body visible for observation. DETAILED RATIONALE — Thermoregulation for the preterm infant is essential to survival, and the incubator also separates her from other infants as part of infection control. The teaching names both jobs so the parents read the setup as treatment, not deprivation. PRIORITY FRAMEWORK — Patient Teaching (Explain the Environment): parents cooperate with care they can explain back.");

/* ===== C5 standalones — Hypoglycemia and hypocalcemia ===== */
S(C5, "Two glucose results return together: 34 mg/dL for a term newborn and 34 mg/dL for a preterm newborn, both 3 hours old. Which interpretation and action are correct?", [
    ["Only the term infant crosses his cutoff — below 40 mg/dL — so he is treated as hypoglycemic, while the preterm infant's line is below 30 mg/dL and he is monitored closely", true, "The two cutoffs are the chapter's classic flipped pair: term below 40, preterm below 30. The same number flags one baby and not the other."],
    ["Both infants are hypoglycemic, because any newborn glucose under 40 mg/dL meets the definition regardless of gestation", false, "One cutoff for everyone erases the pair; the preterm line is drawn lower, at below 30 mg/dL."],
    ["Only the preterm infant is hypoglycemic, because his stores are thinner and any low value counts double for him", false, "His thinner stores raise his risk, but the definition still runs on the numbers — and his number does not cross his line."],
    ["Neither infant is hypoglycemic, because glucose normally dips in the first hours and results are not judged until the second day", false, "The dip is real and expected, and it is judged against the cutoffs from the start — the brain needs a steady glucose supply now."]
  ], "ANSWER KEY — Correct answer: the term infant only, by the below-40 line; the preterm line is below 30. DETAILED RATIONALE — Every newborn's glucose dips in the first 1-2 hours, and the preterm dip runs deeper because glycogen and fat stores are thin. Sepsis, RDS, and unstable temperature drain the tank faster by raising the metabolic rate. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): judge a value against the line drawn for that patient.");

S(C5, "A preterm infant shows tremors, a weak high-pitched cry, lethargy, and irritability, and his temperature is low. His glucose has not yet been checked this shift. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Check his blood glucose now — this sign set is the chapter's hypoglycemia picture, and his brain needs a steady glucose supply", true, "Tremors, weak or high-pitched cry, lethargy, convulsions, hypothermia, and irritability are the book's hypoglycemia sign list; the check that names the problem goes first."],
    ["Begin the ordered gavage or parenteral feeding to refill his fuel stores", false, "Correct treatment direction for hypoglycemia — it is dosed and confirmed against the glucose value the first action obtains."],
    ["Warm him in the incubator, since a low temperature can drain his glucose further", false, "Correct protective care — an unstable temperature raises his metabolic rate — and it proceeds alongside, behind the defining check."],
    ["Document the sign set and his feeding history for the provider's rounds and keep watching him closely through the next care round", false, "Correct record-keeping — it reports a problem that the glucose check has first confirmed and sized."]
  ], "ANSWER KEY — Correct answer: check his glucose first. All four options are correct nursing actions — assessment before intervention decides the order when a named sign set points at a measurable problem: the value confirms hypoglycemia and steers the feeding that treats it. DETAILED RATIONALE — Hypoglycemia in this population is anticipated and treated promptly, not watched; frequent glucose monitoring is a standing nursing responsibility, and preterm infants at highest risk are the growth-restricted, the post-dates, and those born to diabetic mothers. PRIORITY FRAMEWORK — Assess Before You Act (Confirm the Measurable Problem): when a sign set names a number, get the number first.");

BANK.push({ cat: C5, type: "dropdown", stem: "A nurse is teaching a student the fuel and mineral rules for preterm infants. For each statement, choose the correct completion.<br><br>The daily calorie target feedings aim at is<br>[[0]]<br><br>Late hypocalcemia appears at about<br>[[1]]<br><br>The calcium added to formula for late hypocalcemia must be the<br>[[2]]", blanks: [
  { o: [O("120-150 kcal/kg per day", true, "That is the fuel target the chapter sets for preterm feedings."), O("80-100 kcal/kg per day", false, "That range underfeeds the target; the preterm need runs higher because stores are thin and growth is the job."), O("180-200 kcal/kg per day", false, "That range overshoots the chapter's target; almost-right numbers on either side are the trap.")] },
  { o: [O("1 week of age, in infants fed cow's milk", true, "Late hypocalcemia arrives at about 1 week when cow's milk pushes phosphate up and calcium falls."), O("1 day of age, in infants fed breast milk", false, "The timing and the milk are both moved; the late pattern is a week out and rides on cow's milk."), O("1 month of age, in infants fed preterm formula", false, "No month-later calcium pattern exists in the chapter; the early-late pair is birth versus about 1 week.")] },
