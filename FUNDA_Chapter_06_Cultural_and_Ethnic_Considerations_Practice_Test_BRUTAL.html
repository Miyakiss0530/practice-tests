<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Culture, Bias, and Competence";
var CB = "Race, Ethnicity, Gender, and Disability";
var CC = "Communication, Space, and Time";
var CD = "Belief Systems and Culturally Congruent Care";
var CATS = [CA, CB, CC, CD];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 9,
  "types": {
   "single": 7,
   "multi": 1,
   "order": 1
  }
 },
 CB: {
  "name": CB,
  "count": 12,
  "types": {
   "single": 10,
   "dropdown": 1,
   "matrix": 1
  }
 },
 CC: {
  "name": CC,
  "count": 12,
  "types": {
   "single": 10,
   "multi": 1,
   "dropdown": 1
  }
 },
 CD: {
  "name": CD,
  "count": 21,
  "types": {
   "single": 15,
   "matrix": 1,
   "multi": 3,
   "order": 2
  }
 }
};
BANK.push({ cat: CA, type: "single", stem: "A nursing student says, 'America is a melting pot, so after a while my patients will all share the same values and health practices anyway.' Which response by the nurse preceptor is most accurate?", tp: "Melting pot implies complete blending; the soup image keeps each piece distinct.", opts: [O("Explain that distinct cultural pieces stay distinct, like vegetables in a soup", true, "Correct. The chapter replaces the melting pot image with a soup of distinct pieces. Framework: Nursing Process/ADPIE."), O("Agree, and advise the student to learn one standard routine for every patient", false, "Wrong. A single routine ignores the distinct values the soup image preserves."), O("Explain that new immigrants usually drop their customs within the first year", false, "Wrong. Customs continue even after people are removed from their original location."), O("Advise the student that only language, not values or beliefs, stays different", false, "Wrong. Values, beliefs, health practices, communication, and religion all stay distinct.")] });
BANK.push({ cat: CA, type: "single", stem: "A clinic's quality data show that patients from a low-income ethnic neighborhood have preventable complications at twice the rate of the rest of the panel, beyond any genetic explanation. Which of the following actions should the nurse take first?", tp: "Health disparities are preventable, negative outcomes hitting disadvantaged populations hardest.", opts: [O("Identify the disparity and push for targeted interventions for that population", true, "Correct. Health disparities call for specific interventions aimed at improving health. Framework: Nursing Process/ADPIE."), O("Attribute the gap to heredity and continue the same plan of care for everyone", false, "Wrong. The data extend beyond genetic differences, and identical care preserves the gap."), O("Wait for the next census report before raising the pattern with the care team", false, "Wrong. Delay leaves a preventable pattern unaddressed for years."), O("Move those patients to a different clinic so the panel numbers balance out", false, "Wrong. Shuffling patients hides the disparity instead of improving outcomes.")] });
BANK.push({ cat: CA, type: "single", stem: "A nurse notices she feels more at ease with patients whose backgrounds resemble her own and catches herself spending less time with a patient whose practices she finds strange. Which of the following actions should the nurse take first?", tp: "Unconscious bias is unintentional and nearly universal; awareness is the first countermeasure.", opts: [O("Complete a self-assessment of her own beliefs and how they limit her care", true, "Correct. Self-assessment identifies the personal beliefs that put limitations on caring for other cultures. Framework: Nursing Process/ADPIE."), O("Ask to be reassigned so a nurse from the patient's culture takes the case", false, "Wrong. Reassignment avoids the self-awareness work cultural competence requires."), O("Treat the patient exactly as she treats every other patient on the unit", false, "Wrong. Identical treatment is not individualized, holistic care."), O("Read the patient's chart notes from other nurses to confirm her impression", false, "Wrong. Other nurses' impressions do not examine her own bias.")] });
BANK.push({ cat: CA, type: "single", stem: "During report, a nurse says, 'People from that country never follow a diet plan, so do not waste time teaching him.' Which problem does this statement show, and what is the best response?", tp: "Never assume beliefs or practices from name, skin color, or language; assess the individual.", opts: [O("It shows a stereotype; assess this patient's own practices before planning teaching", true, "Correct. A stereotype is a fixed image not easily changed; the fix is individual assessment. Framework: safety first."), O("It shows cultural competence; shorten the teaching to save the patient time", false, "Wrong. Skipping teaching based on a group image is the opposite of competence."), O("It shows elasticity; reschedule the teaching for a better time of the day", false, "Wrong. Elasticity is a time pattern, not a group judgment about teaching."), O("It shows transcultural nursing; document the statement in the care plan", false, "Wrong. Documenting a stereotype does not convert it into transcultural care.")] });
BANK.push({ cat: CA, type: "single", stem: "Two patients on the unit identify with the same cultural group. The first keeps every custom of that group; the second has adopted many values of the current country, speaks a different dialect, and follows a different religion. Which conclusion is most accurate?", tp: "All members of a culture do not exhibit the same behaviors; treat each person individually.", opts: [O("Both patterns are expected, because members of one culture differ individually", true, "Correct. Variation within a group follows age, religion, dialect, adopted values, and more. Framework: Nursing Process/ADPIE."), O("The second patient is no longer a member of that cultural group at all", false, "Wrong. Adopting values of the current country is a listed source of variation, not an exit from the culture."), O("The first patient's care plan can simply be copied for the second patient", false, "Wrong. Copying a plan ignores the individual differences the chapter lists."), O("One of the two patients must be mistaken about their own cultural identity", false, "Wrong. Self-description helps determine cultural origin; neither patient is wrong.")] });
BANK.push({ cat: CA, type: "single", stem: "A new nurse asks how a 4-year-old patient is already learning the family's health customs before anyone formally teaches them. Which explanation is most accurate?", tp: "Behaviors, values, and beliefs are learned within the cultural family system.", opts: [O("Culture is learned from birth onward through language and family socialization", true, "Correct. Box 6.1: culture is learned beginning at birth, through language and socialization. Framework: Nursing Process/ADPIE."), O("Culture passes through heredity, so the child was born knowing the customs", false, "Wrong. Cultural behavior is socially acquired, not genetically inherited."), O("Culture is taught first at school, so the child must have learned it there", false, "Wrong. Learning begins at birth inside the cultural family system."), O("Culture is copied from television programs the child watches at home daily", false, "Wrong. The chapter names language and socialization in the family, not media.")] });
BANK.push({ cat: CA, type: "multi", stem: "A nurse is building a culturally competent assessment for a newly admitted patient. Which data belong in the cultural assessment? Select all that apply.", tp: "Box 6.2 also covers personal space practices and dietary practices that could interfere with treatment. Framework: Nursing Process/ADPIE.", opts: [O("The language the patient uses and the person relied on to translate information", true, "Correct. Language and translator dependence are Box 6.2 data."), O("Cultural practices that could interfere with receiving health care on this unit", true, "Correct. Practices with potential to interfere are Box 6.2 data."), O("Use of folk medicines or treatments the patient follows alongside directed care", true, "Correct. Folk medicine use is Box 6.2 data."), O("Modesty and privacy concerns and difficulty with care by the opposite sex", true, "Correct. Modesty, privacy, and opposite-sex care concerns are Box 6.2 data."), O("The patient's opinion of the hospital food served on the medical unit today", false, "Wrong. Food preference today is not the dietary-practice data Box 6.2 seeks."), O("The names of every relative the patient has living in the country of origin", false, "Wrong. Box 6.2 asks who makes decisions, not a full family census.")] });
BANK.push({ cat: CA, type: "single", stem: "A nurse manager reviews hiring data and finds Black, Hispanic, LGBT, and disabled workers are hired at rates far below their share of the local population. Which statement about this pattern is most accurate?", tp: "Greater provider diversity improves delivery, most notably for patients at risk of poor outcomes.", opts: [O("It reflects unconscious bias in hiring and contributes to health disparities overall", true, "Correct. The chapter links underrepresentation in hiring to unconscious bias and to disparities. Framework: Nursing Process/ADPIE."), O("It has no effect on patients, because hiring and health outcomes are unrelated", false, "Wrong. The chapter states this underrepresentation contributes to health disparities."), O("It proves the applicant pool contained no qualified candidates from those groups", false, "Wrong. The pattern is presented as a bias effect, not a qualification verdict."), O("It is corrected automatically once the facility hires one diversity coordinator", false, "Wrong. No single hire is presented as an automatic correction.")] });
BANK.push({ cat: CA, type: "order", stem: "A nurse plans her first encounter with a patient from a culture unfamiliar to her. Place the nurse's actions in the correct order.", tp: "Order follows ADPIE with self-assessment before patient assessment. Framework: Nursing Process/ADPIE.", items: [{"t": "Complete a self-assessment of her own cultural beliefs and practices first", "r": "Self-assessment comes first; personal beliefs can limit care for other cultures."}, {"t": "Ask the patient about cultural practices during the nursing process itself", "r": "Questions about cultural practices are built into the nursing process."}, {"t": "Integrate what she learns into every aspect of the plan of care for him", "r": "Understanding is integrated into all aspects of care; that integration is transcultural nursing."}, {"t": "Evaluate whether the care given was individualized and culturally fitting", "r": "Evaluation closes the loop on whether the integrated plan worked."}] });
BANK.push({ cat: CB, type: "single", stem: "An adult patient arrives for a visit about a personal health concern, accompanied by her 11-year-old granddaughter, who usually translates. Which of the following actions should the nurse take first?", tp: "Adults may withhold honest answers when children or grandchildren translate personal issues.", opts: [O("Arrange a professional interpreter for the visit and use the child only socially", true, "Correct. A professional interpreter prevents bias, inaccuracy, and confidentiality loss. Framework: safety first."), O("Let the granddaughter translate, because she knows the patient's words best", false, "Wrong. Family translation risks bias and inaccuracy, and the topic is personal."), O("Ask the granddaughter to wait outside and use gestures for the whole visit", false, "Wrong. Gestures alone cannot carry a personal health history safely."), O("Postpone all questions until a relative who is over eighteen can attend", false, "Wrong. A professional interpreter is available now and is the preferred route.")] });
BANK.push({ cat: CB, type: "single", stem: "A patient charted as MTF tells the nurse, 'Please call me Ana and use she and her for me.' The patient's outward appearance is masculine. Which of the following actions should the nurse take?", tp: "Preferred pronouns and respectful address increase access to and appropriate use of services.", opts: [O("Address the patient as Ana with she/her pronouns and update the care team", true, "Correct. Transgender patients are addressed with preferred pronouns regardless of appearance. Framework: Maslow."), O("Use the pronouns matching the patient's birth sex until surgery is completed", false, "Wrong. Pronoun use does not wait on surgery or appearance."), O("Avoid pronouns entirely and call the patient only by the legal surname", false, "Wrong. Avoidance is not the respectful address the chapter directs."), O("Ask the patient's visitors which pronouns the family prefers the staff to use", false, "Wrong. The patient's own stated preference governs, not the family's.")] });
BANK.push({ cat: CB, type: "dropdown", stem: "Complete the documentation for two patients using the chapter's terms. Patient 1, born with male genitalia, identifies as a woman: the nurse documents [[0]]. Patient 2, born with female genitalia, identifies as a man: the nurse documents [[1]].", tp: "Mirror the abbreviations: MTF = male to female; FTM = female to male. Framework: Nursing Process/ADPIE.", blanks: [{"o": [O("A trans woman, abbreviated MTF or M2F in the chart", true, "Correct. MTF / M2F is male to female, a trans woman."), O("A trans man, abbreviated FTM or F2M in the chart", false, "Wrong. That pairing describes a patient born with female genitalia."), O("A questioning patient, abbreviated LGBT in the chart", false, "Wrong. Questioning is an identity label, not this transition documentation.")]}, {"o": [O("A trans man, abbreviated FTM or F2M in the chart", true, "Correct. FTM / F2M is female to male, a trans man."), O("A trans woman, abbreviated MTF or M2F in the chart", false, "Wrong. That pairing describes a patient born with male genitalia."), O("A questioning patient, abbreviated LGBT in the chart", false, "Wrong. Questioning is an identity label, not this transition documentation.")]}] });
BANK.push({ cat: CB, type: "single", stem: "A nurse needs a sexual-health history from a patient. The presenting problem is an unrelated wrist fracture, and the history items would satisfy curiosity only. Which of the following actions should the nurse take?", tp: "Maintain appropriate dignity and privacy for all patients during any history.", opts: [O("Skip the sexual-health items, because the history taken must be necessary here", true, "Correct. Sexual-health histories must be necessary and free of curiosity-driven items. Framework: safety first."), O("Ask the items anyway, because a complete history always includes every section", false, "Wrong. Completeness does not justify irrelevant, curiosity-driven items."), O("Ask the items quietly so the patient will not notice the topic has changed", false, "Wrong. Quietly slipping in unneeded items still violates the necessity rule."), O("Ask the patient's partner the items instead, to protect the patient's privacy", false, "Wrong. Routing private questions to a partner breaches dignity and privacy.")] });
BANK.push({ cat: CB, type: "single", stem: "A young adult who identifies as gay tells the nurse he has stopped attending a support group after being threatened outside it, and admits he has been drinking more and sleeping poorly. Which risk pattern should guide the nurse's assessment?", tp: "Be respectful and aware of the specific challenges this culturally diverse group faces.", opts: [O("Assess for substance abuse, mental health problems, and suicide risk in this patient", true, "Correct. Stigma and discrimination raise risks of victimization, substance abuse, mental health problems, and suicide. Framework: Maslow."), O("Assess mainly for lactose intolerance, because diet is the priority concern here", false, "Wrong. Lactose intolerance is not the risk pattern attached to this community."), O("Document noncooperation, because missing group meetings shows poor follow-through", false, "Wrong. He stopped attending after a threat; safety and mental health come first."), O("Reassure him that acceptance by others has no effect on health or safety", false, "Wrong. The chapter states acceptance improves mental health and safety.")] });
BANK.push({ cat: CB, type: "single", stem: "A patient who uses a wheelchair arrives for a clinic visit accompanied by her sister. The nurse needs a health history. Which of the following actions shows the nurse avoiding ableism?", tp: "All conversations go to the patient, even with severe cognitive disability; encourage the patient to voice concerns.", opts: [O("Direct every conversation and health question to the patient herself first", true, "Correct. Directing questions to the companion instead of the patient is the chapter example of ableism. Framework: Maslow."), O("Direct questions to the sister, who can answer faster on the patient's behalf", false, "Wrong. That is exactly the ableism example the chapter gives."), O("Ask the sister to confirm each answer, because the patient may be mistaken", false, "Wrong. Checking every answer against the sister removes the patient's authority."), O("Speak only about the wheelchair and the condition that led to its daily use", false, "Wrong. Defining the patient by the disability is ableism itself.")] });
BANK.push({ cat: CB, type: "single", stem: "A patient with an intellectual disability is scheduled for a procedure discussion. He says he wants his longtime advocate present, and the nurse wonders how much he can decide himself. Which approach is most accurate?", tp: "If a patient does not request an advocate, the nurse can offer to contact one.", opts: [O("Presume he is competent, give him maximal decision authority, and include the advocate", true, "Correct. Presumed competence gives the patient as much decision authority as possible, and advocates may accompany patients who request one. Framework: Maslow."), O("Treat the advocate as the decision maker, because the disability limits authority", false, "Wrong. The advocate supports; the patient keeps decision authority."), O("Postpone the discussion until a formal competence ruling is entered in the chart", false, "Wrong. Competence is presumed unless there is reason to doubt it."), O("Exclude the advocate, because advocates are offered only to patients with autism", false, "Wrong. Advocates are not limited to autism, though they can be especially helpful there.")] });
BANK.push({ cat: CB, type: "matrix", stem: "A nurse reviews two patients adapting to disability. Classify each statement as describing the adult who acquired disability after a stroke or the adult who has lived with cerebral palsy since birth.", tp: "Same disability label, different life experience; disability culture is not one single culture. Framework: Nursing Process/ADPIE.", cols: ["Acquired after stroke", "Lived with cerebral palsy since birth"], rows: [{"t": "Is learning an entirely new set of skills to function at home and outside", "a": 0, "r": "Stroke adaptation: an entirely new skill set must be learned."}, {"t": "May aim at recovery of previous function and elimination of the disability", "a": 0, "r": "Stroke adaptation can carry a recovery and elimination goal."}, {"t": "Has established workarounds at home and in the community over many years", "a": 1, "r": "Cerebral palsy since birth: workarounds are long established."}, {"t": "May select universally designed products and an adapted home layout daily", "a": 1, "r": "Cerebral palsy since birth: adapted environments and universal design are chosen."}] });
BANK.push({ cat: CB, type: "single", stem: "A nurse is writing a care note and types 'wheelchair bound patient, mentally retarded, needs total help.' Which revision follows this chapter's language guidance?", tp: "Say 'a person with blindness,' not 'a blind person'; never 'wheelchair bound.'", opts: [O("Chart people-first wording: a person who uses a wheelchair, with intellectual disability", true, "Correct. People-first language names the person first; the outdated term is replaced by cognitive or intellectual disability. Framework: Nursing Process/ADPIE."), O("Keep the wording, because shorter chart phrases save time during a busy shift", false, "Wrong. Brevity does not excuse wording the chapter identifies as wrong."), O("Chart 'a blind-style label first' whenever the condition is easy to observe", false, "Wrong. The guidance is person first in every case, not label first."), O("Remove all mention of mobility and cognition so no label appears at all", false, "Wrong. Needed clinical information stays; only the wording changes.")] });
BANK.push({ cat: CB, type: "single", stem: "A nurse needs to move a patient's wheelchair to reach an outlet and starts pushing it while the patient is seated in it, then leans on the chair while charting. Which correction is required?", tp: "If assistive equipment is damaged or lost, the patient loses independence until it is replaced.", opts: [O("Stop, ask the patient's permission before pushing, and never lean on the chair", true, "Correct. Assistive equipment is personal property and an extension of the person; ask permission and do not lean or rest on it. Framework: safety first."), O("Push more slowly, because slow movement makes permission unnecessary here", false, "Wrong. Speed does not replace the patient's permission."), O("Lean on the chair only while the patient is looking in another direction", false, "Wrong. Leaning on the chair is prohibited regardless of attention."), O("Move the chair after the visit ends, when the patient has transferred out", false, "Wrong. The equipment is needed for independence; removing it strands the patient.")] });
BANK.push({ cat: CB, type: "single", stem: "A patient with long-standing fatigue and pain from a chronic condition looks well. A coworker says, 'She looks fine, so she can do the full activity schedule and needs no supports.' Which response is most accurate?", tp: "Mirror trap: visible disability invites underestimation of ability; invisible disability invites overexpectation.", opts: [O("Invisible disabilities can hide fatigue and pain, and supports may be wrongly denied", true, "Correct. Invisible disabilities subject patients to expectations beyond capability and denied supports. Framework: safety first."), O("Looking well rules out disability, so the full schedule is safe to assign", false, "Wrong. Appearance does not rule out an invisible disability."), O("Fatigue reported by the patient should be charted only if staff can see it", false, "Wrong. Unseen symptoms are still assessment data."), O("Supports are required only for disabilities that other people can observe", false, "Wrong. Support need follows the condition, not its visibility.")] });
BANK.push({ cat: CB, type: "single", stem: "A clinic serves many patients with disabilities who miss appointments. Review shows most travel by bus, several lack coverage for visit costs, and intake forms confuse many readers. Which barrier set should the clinic address?", tp: "People with disabilities have more modifiable risk factors, worsened by missed teaching opportunities.", opts: [O("Transportation difficulties, financial concerns, and communication challenges together", true, "Correct. Those three are the barriers the chapter lists for people with disabilities. Framework: Nursing Process/ADPIE."), O("Only the bus schedule, because cost and forms do not affect attendance rates", false, "Wrong. Financial and communication barriers are listed alongside transportation."), O("Patient motivation alone, because barriers outside the clinic are not real factors", false, "Wrong. The listed barriers are practical and external, not motivational."), O("Missed teaching opportunities only, because access itself is already fully equal", false, "Wrong. The chapter states people with disabilities have less access to health care.")] });
BANK.push({ cat: CC, type: "single", stem: "After 20 minutes of discharge teaching through gestures, a patient with limited English smiles, nods, and says 'yes, yes' to every point. His daughter later says he understood none of it. Which of the following actions should the nurse take first?", tp: "Questions and directions should be brief and simple; give more information later rather than one long session.", opts: [O("Restart the teaching with a professional interpreter and validate understanding", true, "Correct. Nodding can mean politeness or avoiding embarrassment; a professional interpreter plus validation is the fix. Framework: safety first."), O("Document that teaching was completed, because the patient confirmed with yes", false, "Wrong. A nod and 'yes' never prove understanding."), O("Repeat the teaching more loudly and slowly so the emphasis carries through", false, "Wrong. A raised voice reads as rudeness or aggression and shuts communication down."), O("Ask the daughter to reteach everything at home in her own words tonight", false, "Wrong. Family interpreting risks inaccuracy with essential medication information.")] });
BANK.push({ cat: CC, type: "single", stem: "A nurse is teaching a patient with limited English about a new medication. Which teaching approach best fits this chapter?", tp: "Patients must clearly understand why care is given and why medications are ordered.", opts: [O("Use brief, simple directions now, add pictures beside words, and continue later", true, "Correct. Brief and simple directions, pictures with words, and staged sessions fit the guidance. Framework: Nursing Process/ADPIE."), O("Deliver the entire medication lecture at once so nothing is left incomplete", false, "Wrong. Long explanations overload a patient who tires quickly in a second language."), O("Provide a detailed written handout only, since print is easier than speech", false, "Wrong. Written English may be understood less than spoken English."), O("Use full medical terminology so the patient learns the correct drug names", false, "Wrong. Medical terminology adds to the difficulty of communication.")] });
BANK.push({ cat: CC, type: "single", stem: "A patient's family keeps answering questions all at once, talking over one another, while the nurse tries to interview the patient. Which interpretation and action are most appropriate?", tp: "Some people answer only direct questions and seem rude to others; style differences cut both ways.", opts: [O("Recognize a possible cross-cultural mismatch and work patiently with the pattern", true, "Correct. Large family groups answering at once can be a cross-cultural mismatch, not rudeness. Framework: Maslow."), O("End the interview, because the family is being deliberately uncooperative", false, "Wrong. The pattern is a communication style difference, not defiance."), O("Raise her voice until one family member at a time can finally be heard", false, "Wrong. Louder speech reads as aggression and shuts communication down."), O("Ask the family to leave, because interviews require a single spokesperson", false, "Wrong. Family involvement in answers and decisions is culturally patterned.")] });
BANK.push({ cat: CC, type: "single", stem: "An older Asian patient sits silently for a long stretch after the nurse explains a procedure, looking down, while the nurse grows uncomfortable. Which of the following actions should the nurse take?", tp: "Silence can mean understanding gaps, apprehension, agreement, disagreement, respect, or disdain: read the culture first.", opts: [O("Allow the silence, understanding it can show respect and time to consider the words", true, "Correct. In Asian cultures silence toward elders and authority shows respect, and silence allows consideration. Framework: Maslow."), O("Fill the silence quickly with repeated explanations so the patient stays engaged", false, "Wrong. Filling respected silence with chatter overrides the patient's pattern."), O("Chart that the patient is being stubborn and uncooperative with the care team", false, "Wrong. Stubbornness is only one possible meaning and a harmful assumption here."), O("Ask the patient directly whether the silence means disagreement with the plan", false, "Wrong. Demanding a label for the silence pressures a respectful pattern.")] });
BANK.push({ cat: CC, type: "single", stem: "A nurse greets a Native American patient with a firm handshake and steady direct eye contact. The patient lightly touches her hand, looks away, and seems uneasy. Which of the following actions should the nurse take next?", tp: "Assess cultural factors first, then communicate at the patient's personal level of comfort.", opts: [O("Soften the greeting, accept the light hand touch, and ease off direct eye contact", true, "Correct. Many Native Americans see a firm handshake as aggression, extend a light touch instead, and avoid eye contact as respect. Framework: Maslow."), O("Strengthen the handshake and hold eye contact to show honesty and openness", false, "Wrong. That forces the nurse's own cultural signals onto the patient."), O("Chart that the patient appears evasive and possibly dishonest during intake", false, "Wrong. Avoided eye contact is a respect pattern here, not dishonesty."), O("Ask the patient to explain the greeting customs of the entire tribe today", false, "Wrong. The nurse adapts her behavior; the patient is not an instructor on demand.")] });
BANK.push({ cat: CC, type: "multi", stem: "A nurse applies Box 6.3 communication strategies with a patient from a different culture. Which actions fit the box? Select all that apply.", tp: "Box 6.3 also: learn key phrases, honor eye contact, touch, and seating comfort. Framework: Nursing Process/ADPIE.", opts: [O("Take extra time at first contact and use an unhurried, calm, relaxed manner", true, "Correct. Box 6.3 opens with comfort zone, unhurried and calm."), O("Rephrase when the patient's answer seems inconsistent with other information", true, "Correct. Rephrasing inconsistent answers is a Box 6.3 strategy."), O("Listen actively and attentively without anticipating the patient's responses", true, "Correct. Listening without anticipating responses is a Box 6.3 strategy."), O("Use validation techniques to check what the patient actually has understood", true, "Correct. Validation, not nodding, confirms understanding."), O("Use a nurse of the opposite gender for sexual concerns to broaden perspective", false, "Wrong. Box 6.3 suggests a nurse of the same gender may facilitate sexual-concern discussions."), O("Speak first and quickly so the patient can simply agree with the plan made", false, "Wrong. Speed and one-way talk contradict the unhurried, listening approach.")] });
BANK.push({ cat: CC, type: "single", stem: "A long-term care resident always sits in the same chair and eats at the same table, and becomes visibly upset when a new aide moves her to a different spot. Which interpretation is most accurate?", tp: "A nurse receptive to the patient's interpretation of comfortable space builds a therapeutic relationship.", opts: [O("The need for space can be shown by attachment to a certain chair, table, or area", true, "Correct. Wanting a particular chair, room area, or table expresses the need for space. Framework: Maslow."), O("The resident is manipulating staff and should be rotated to a new spot daily", false, "Wrong. Forced rotation ignores the space need the behavior expresses."), O("The resident's eyesight must be failing, because she cannot find a new seat", false, "Wrong. Nothing in the story points to vision loss."), O("The resident is refusing care and should be charted as noncooperative today", false, "Wrong. A space preference is not refusal of care.")] });
BANK.push({ cat: CC, type: "single", stem: "A Mexican American patient arrives 40 minutes late for a clinic appointment, explaining she stayed to finish helping her mother with a meal. The waiting room is behind schedule. Which of the following actions should the nurse take?", tp: "Long waits can read as disrespect for the patient's time; plan and communicate them honestly.", opts: [O("See the patient and review realistic wait times with her for future visits", true, "Correct. Elasticity focuses on the current activity; providers should communicate realistic wait times. Framework: Nursing Process/ADPIE."), O("Cancel the visit and rebook her as a consequence so she learns punctuality", false, "Wrong. Punishing a cultural time pattern damages trust and access."), O("Chart the patient as noncooperative for disregard of the appointment time", false, "Wrong. Lateness from elasticity is a time-orientation pattern, not defiance."), O("Double-book her next visit so the schedule absorbs her expected lateness", false, "Wrong. Double-booking does not address communication about wait times.")] });
BANK.push({ cat: CC, type: "single", stem: "A patient with hypertension tells the nurse she stopped her blood pressure pills because rent and groceries for her children came first this month, and she feels fine. Which of the following actions should the nurse take first?", tp: "Present orientation makes chronic follow-through difficult when future prevention competes with rent or food now.", opts: [O("Explore present needs with her and build a plan that fits both needs and treatment", true, "Correct. A present-oriented patient meets urgent current needs first; the plan must work with that reality. Framework: Maslow."), O("Chart the patient as noncooperative and notify the provider of the refusal", false, "Wrong. Labeling her noncooperative misreads a present-orientation pattern."), O("Tell her the pills matter more than groceries and she must choose the pills", false, "Wrong. Forcing a choice between food and medication ignores Maslow-level needs."), O("Discontinue the prescription, because she has decided against taking the pills", false, "Wrong. Stopping treatment abandons a chronic illness that needs follow-through.")] });
BANK.push({ cat: CC, type: "dropdown", stem: "Complete the nurse's reasoning. A patient who takes a daily pill now to prevent a stroke years later is showing a [[0]] pattern. A patient who spends today's money on food and rent instead of preventive pills is showing a [[1]] pattern.", tp: "United States patients are often future oriented; many African American, Hispanic, and American Indian patients are more present oriented. Framework: Maslow.", blanks: [{"o": [O("Future-oriented", true, "Correct. Taking medication now to prevent future illness is future orientation."), O("Present-oriented", false, "Wrong. Present orientation meets the current urgent need first."), O("Elastic", false, "Wrong. Elasticity concerns focus on the current activity and appointment timing.")]}, {"o": [O("Present-oriented", true, "Correct. Satisfying a current, urgent need over a less immediate one is present orientation."), O("Future-oriented", false, "Wrong. Future orientation prepares now for a less immediate need."), O("Elastic", false, "Wrong. Elasticity concerns focus on the current activity and appointment timing.")]}] });
BANK.push({ cat: CC, type: "single", stem: "A patient whose primary language is American Sign Language is admitted for surgery teaching. No staff member signs fluently. Which of the following actions should the nurse take?", tp: "Deaf culture is more than ASL; being deaf is not viewed there as a disability to fix.", opts: [O("Arrange an ASL interpreter, as for any patient whose primary language differs", true, "Correct. A patient with ASL as a primary language may need an interpreter like other primary-language patients. Framework: safety first."), O("Write all teaching on paper, because deaf patients read English most easily", false, "Wrong. ASL holds greater meaning than spoken or written English for many deaf patients."), O("Speak slowly toward the patient so lip reading can carry the entire teaching", false, "Wrong. Lip reading is not a substitute for the patient's primary language."), O("Ask the patient's hearing roommate to relay the teaching after the session", false, "Wrong. A roommate is not an interpreter and confidentiality is at stake.")] });
BANK.push({ cat: CC, type: "single", stem: "During a conversation, a nurse gives a thumbs-up sign to a patient from another culture, who looks offended and withdraws. Which lesson should guide the nurse's next step?", tp: "Do not judge a patient's behavior by your own practices; understand and accept differences.", opts: [O("Gestures carry different meanings across cultures; apologize and adjust the approach", true, "Correct. Thumbs-up signals approval in the United States but can offend elsewhere; the etiquette for a mistake is to apologize and continue the best care. Framework: Maslow."), O("Repeat the gesture more slowly so the patient can learn its American meaning", false, "Wrong. Teaching the gesture forces the nurse's culture onto the patient."), O("Avoid all gestures with every future patient, whatever culture they come from", false, "Wrong. The fix is cultural assessment, not blanket avoidance."), O("Chart the patient as hostile, because withdrawal followed a friendly gesture", false, "Wrong. Withdrawal followed a gesture whose meaning differs by culture.")] });
BANK.push({ cat: CD, type: "single", stem: "A patient's family asks the nurse to wait before deciding on a treatment because the oldest male relative has not yet been consulted, and his view will settle the matter. Which of the following actions should the nurse take?", tp: "Know who the patient depends on for comfort and decision making, and how the patient describes the family.", opts: [O("Respect the pattern, involve the oldest man in discussion within privacy rules", true, "Correct. In a patriarchal pattern men, often the oldest, make most decisions, and families may delay until he is consulted. Framework: Maslow."), O("Proceed with consent from the patient alone and note the family objection", false, "Wrong. Ignoring the decision structure jeopardizes acceptance of the plan."), O("Ask the oldest daughter to overrule the relative so care is not delayed", false, "Wrong. Female decision authority is the matriarchal pattern, not this family's."), O("Tell the family that only the patient may ever be consulted about treatment", false, "Wrong. The nurse works with the person the patient depends on for decisions.")] });
BANK.push({ cat: CD, type: "single", stem: "A patient tells the nurse she uses an herbal preparation from a folk healer for her stomach, alongside her prescribed medications, and asks the nurse not to mention it. Which of the following actions should the nurse take?", tp: "Patients who share beliefs openly are more likely to disclose other treatments they use.", opts: [O("Discuss it openly and share the information with the doctor to prevent conflicts", true, "Correct. Folk practice information must reach the doctor to prevent conflicts among treatments. Framework: safety first."), O("Promise secrecy, because disclosure would damage the trusting relationship", false, "Wrong. Secrecy leaves a possible treatment conflict hidden from the prescriber."), O("Tell her to stop the preparation at once, because folk remedies are dangerous", false, "Wrong. Some folk practices are safe or useful; the concern is identifying danger, not banning all."), O("Chart the preparation as noncooperation and notify the family of its use", false, "Wrong. Concurrent folk and biomedical use is common and is not defiance.")] });
BANK.push({ cat: CD, type: "matrix", stem: "A nurse matches patient statements to the health belief system each statement reflects, using Table 6.2. Classify each statement.", tp: "Four systems side by side in Table 6.2. Framework: Nursing Process/ADPIE.", cols: ["Biomedical", "Folk", "Holistic", "Alternative or complementary"], rows: [{"t": "Disease follows a specific cause in body structure, so treatment targets the body", "a": 0, "r": "Biomedical: disease is an alteration of structure and function with specific cause and physical treatment."}, {"t": "This illness came because nature's harmony was upset by forces beyond our control", "a": 1, "r": "Folk: unnatural events upset the harmony of nature and lie beyond mortal control."}, {"t": "Treatment should restore balance with the physical, social, and spiritual worlds", "a": 2, "r": "Holistic: treatment restores balance across physical, social, and metaphysical worlds."}, {"t": "Symptoms are the tip of the iceberg; mind and body work as one whole unit here", "a": 3, "r": "Alternative or complementary: symptoms signal change, and mind and body are one unit."}] });
BANK.push({ cat: CD, type: "single", stem: "A patient from a group with hot-and-cold beliefs refuses several menu items, saying the diet is out of balance for his illness, and his intake is falling short of basic needs. Which of the following actions should the nurse take first?", tp: "Chinese, Korean, Mexican, Puerto Rican, and Vietnamese groups hold hot-and-cold classifications.", opts: [O("Assess his hot-and-cold balance beliefs and adjust food choices within that frame", true, "Correct. Diet is adjusted by perceived balance; working within it protects nutritional needs. Framework: Nursing Process/ADPIE."), O("Serve the standard tray anyway, because nutritional content outranks belief here", false, "Wrong. Overriding the belief frame leaves intake falling and trust damaged."), O("Chart a dietary refusal and ask the provider to order a feeding supplement", false, "Wrong. Assessment of the belief pattern comes before escalation."), O("Tell him hot and cold describe food temperature and offer the tray warmed up", false, "Wrong. Hot and cold are classifications of diseases and foods, not serving temperature.")] });
BANK.push({ cat: CD, type: "single", stem: "A Muslim woman is admitted for a procedure. She asks to keep her head, arms, and legs covered, wants female staff when possible, and prays several times a day. Which plan best fits this chapter?", tp: "The nurse should be ready to extend similar accommodations in other culturally dependent situations.", opts: [O("Keep her covered, assign female staff when possible, and schedule care around prayer", true, "Correct. All three accommodations are the chapter's worked example for Muslim patients. Framework: Maslow."), O("Keep her covered, but schedule care at fixed times even when they fall in prayer", false, "Wrong. Care should be scheduled around prayer times to allow privacy and leisure to pray."), O("Assign whichever staff are free, because coverage matters more than staff gender", false, "Wrong. Every attempt should be made to assign female staff for Muslim women."), O("Ask her to uncover fully for the whole shift so assessments are never delayed", false, "Wrong. Modesty and coverage are obligatory to preserve in this pattern.")] });
BANK.push({ cat: CD, type: "single", stem: "A nurse charts 'Noncooperation' for a patient who missed follow-up visits while caring for grandchildren and choosing present family needs over preventive appointments. Which step should come before that label stands?", tp: "Caution labels: Insufficient Knowledge, Compromised Verbal Communication, Impaired Health Maintenance, Noncooperation.", opts: [O("Evaluate the patient's behavior from the perspective of the patient's own culture", true, "Correct. Behavior is judged inside the patient's cultural context; Noncooperation is a caution label. Framework: Nursing Process/ADPIE."), O("Add a second caution label so the pattern is documented from every angle now", false, "Wrong. Stacking labels deepens the mislabeling the chapter warns against."), O("Ask the family to confirm that the patient is difficult about appointments", false, "Wrong. Family opinion does not replace cultural evaluation of behavior."), O("Transfer the patient to another nurse who will accept the label as written", false, "Wrong. Transfer changes the nurse, not the flawed judgment in the chart.")] });
BANK.push({ cat: CD, type: "single", stem: "A family's loved one is dying. The family asks to pray at the bedside, keep vigil in turns, and later discuss viewing the body and organ donation at their own pace. Which of the following actions should the nurse take?", tp: "All study participants valued respect and protection of the dying person's soul.", opts: [O("Obtain the family's input, support bedside rituals, and stay sensitive on donation", true, "Correct. Families help plan bedside rituals, and the nurse stays sensitive about organ donation and viewing the body. Framework: Maslow."), O("Set fixed visiting turns for the family so the unit routine stays undisturbed", false, "Wrong. Vigil patterns belong to the family's rituals, not unit convenience."), O("Raise organ donation first, because consent windows close quickly after death", false, "Wrong. Leading with donation ignores the sensitivity the evidence box directs."), O("Limit prayer at the bedside to one short session at the start of each shift", false, "Wrong. Rituals for praying, remembering, and coping are the family's to shape.")] });
BANK.push({ cat: CD, type: "single", stem: "An older adult patient uses a home remedy passed down in her family for minor aches. The remedy is not harmful, and she becomes upset when a caregiver suggests replacing it with a clinic product. Which of the following actions should the nurse take?", tp: "Older adults may resist changes even to harmful practices; nonharmful ones are simply respected.", opts: [O("Leave the nonharmful practice alone out of respect for her wishes and values", true, "Correct. Practices that are not harmful are left alone out of respect for the older adult's wishes. Framework: Maslow."), O("Replace the remedy anyway, because clinic products are always more effective", false, "Wrong. Effectiveness claims do not override a respected, nonharmful practice."), O("Warn her that continued use will be charted as refusal of recommended care", false, "Wrong. A valued nonharmful remedy is not a refusal of care."), O("Ask her family to discard the remedy during the next visit to the home", false, "Wrong. Removing it behind her back violates respect for her wishes.")] });
BANK.push({ cat: CD, type: "single", stem: "An older adult patient with Alzheimer's disease makes a hurtful, culturally insensitive remark to a caregiver from a different background. Which interpretation best guides the nurse's response?", tp: "Older adults form a unique cultural group; shared history can outweigh ethnic differences between them.", opts: [O("Disturbed cognitive function can lead patients to speak without cultural sensitivity", true, "Correct. Alzheimer's and similar conditions can produce hurtful comments without regard for sensitivity. Framework: safety first."), O("The remark proves the patient holds lifelong prejudice that must be confronted", false, "Wrong. Cognitive disturbance, not settled belief, is the explanation offered."), O("The caregiver should be reassigned permanently away from all older patients", false, "Wrong. Reassignment of the caregiver is not the chapter's response."), O("The patient should be corrected firmly in front of the other patients nearby", false, "Wrong. Public correction does not fit the cognitive explanation given.")] });
BANK.push({ cat: CD, type: "single", stem: "A Mexican American patient avoids the nurse's eyes during teaching and flinches from sustained gaze, while her family touches her arm often and stays close. Which interpretation is most accurate?", tp: "Modesty is highly valued; exposure of the body can embarrass men and women in this group.", opts: [O("Sustained eye contact can feel rude or dangerous here; touch is valued and used often", true, "Correct. Table 6.3: sustained direct eye contact is rude, immodest, or dangerous, and touch can neutralize mal ojo. Framework: Maslow."), O("The patient is hiding symptoms, because avoided gaze signals dishonesty here", false, "Wrong. Avoided gaze in this pattern is modesty and protection, not deceit."), O("The family should be asked to stop touching her during teaching sessions", false, "Wrong. Touch is valued and may neutralize the evil eye in this pattern."), O("The nurse should hold the patient's gaze steadily to build trust over time", false, "Wrong. Forcing gaze against the pattern damages trust instead of building it.")] });
BANK.push({ cat: CD, type: "single", stem: "A Chinese American patient is uncomfortable face to face with the nurse, keeps a formal manner, and the family explains that loyalty to family outranks personal feelings. Which seating and approach fit best?", tp: "Taking care of family members brings honor to the family in this pattern.", opts: [O("Sit side to side or at a right angle, keep touch minimal, and honor family loyalty", true, "Correct. Table 6.3: side-to-side or right-angle seating is preferred, touching is not usual, and family loyalty outranks individual feelings. Framework: Maslow."), O("Sit directly face to face and use frequent touch to put the patient at ease", false, "Wrong. Face-to-face seating discomforts, and touch reads as disrespectful here."), O("Ask the patient to decide alone, because individual feelings outrank family here", false, "Wrong. That reverses the family-loyalty pattern in Table 6.3."), O("Hold steady eye contact throughout, because it shows the nurse is listening", false, "Wrong. Maintaining eye contact is often seen as ill-mannered and disrespectful here.")] });
BANK.push({ cat: CD, type: "single", stem: "A Muslim patient who is not ill asks why a tray with a pork entree arrived, and mentions he is observing daylight fasting this month. The nurse's best response set is which of the following?", tp: "Family may provide meals if allowed with treatment; pregnant women are exempt from the fast.", opts: [O("Replace the tray without pork and check whether a medical exemption applies to him", true, "Correct. No pork products may be included, fasting runs through Ramadan daylight hours, and medical conditions often exempt. Framework: safety first."), O("Keep the tray, because hospital menus cannot be changed for a single patient", false, "Wrong. Pork exclusion is a stated dietary requirement in Table 6.3."), O("Tell him fasting is not allowed on the unit, whatever the month happens to be", false, "Wrong. Fasting during Ramadan is accommodated, with exemptions assessed."), O("Offer alcohol-based mouth rinse and a pork gelatin dessert as substitutes now", false, "Wrong. Alcohol and drugs are forbidden, and pork stays excluded.")] });
BANK.push({ cat: CD, type: "single", stem: "An American Indian patient newly diagnosed with diabetes is offered a meal plan built around milk at every meal. He drinks little milk and pushes the tray away. Which fact should reshape the plan?", tp: "Contemporary diet mixes indigenous foods with processed foods; fat is mostly saturated and fiber is low.", opts: [O("Lactose intolerance is extremely prevalent in this population, affecting most adults", true, "Correct. Table 6.3 puts lactose intolerance at 79% of the American Indian population. Framework: Nursing Process/ADPIE."), O("Milk is a preferred food in this culture, so the plan only needs more time", false, "Wrong. Table 6.3 states milk is not a preferred food in this pattern."), O("Diabetes is rare in this population, so the meal plan matters very little", false, "Wrong. A predisposition to diabetes is part of the pattern described."), O("The patient is rejecting the diagnosis, so education should be repeated louder", false, "Wrong. The barrier is the food pattern itself, not volume or defiance.")] });
BANK.push({ cat: CD, type: "multi", stem: "A nurse plans care for a patient who defers decisions and uses folk practices alongside prescribed care. Which actions build a working alliance? Select all that apply.", tp: "A mutually acceptable alliance and mutual respect are imperative. Framework: Nursing Process/ADPIE.", opts: [O("Recognize the person the patient defers to and communicate respectfully with them", true, "Correct. Respecting the decision relationship protects compliance when conflicts arise."), O("Reprioritize nursing goals and change procedures where the culture requires it", true, "Correct. The nurse or the system may need to change to accommodate the patient's beliefs."), O("Adapt how an assessment is performed when the patient's background requires it", true, "Correct. Assessments and routines are adapted to the patient's cultural needs."), O("Allow nonharmful cultural practices alongside traditional care being delivered", true, "Correct. Cultural practices can continue without compromising either approach."), O("Insist the biomedical routine stay unchanged, because consistency ensures safety", false, "Wrong. Refusing all change breaks the alliance the chapter calls imperative."), O("Tell the patient folk practices must stop before any teaching can be offered", false, "Wrong. Teaching is rejected when the patient's own beliefs go unrecognized.")] });

      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
