<script>
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
function S(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "single", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
function M(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "multi", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
var C1 = "Uterus, Involution, and the Fundus Check";
var C2 = "Lochia — Reading the Discharge";
var C3 = "Routine Postpartum Assessment — BUBBLE-HE and Vital Signs";
var C4 = "Perineum, Cesarean Incision Care, and Postpartum Pain";
var C5 = "Circulation, Clots, Bladder, and Bowels";
var C6 = "Breasts and Breastfeeding Support";
var C7 = "Bonding, Blues, and Family Adaptation";
var C8 = "Discharge Teaching, Immunizations, and Contraception";
var CATS = [C1, C2, C3, C4, C5, C6, C7, C8];
var KEYTERMS = [];

/* ===== CASE 1 (PRED-CASE1) — PPH discrimination: bladder vs atony vs laceration ===== */
var CASE_P1 = "CASE STUDY — Three Bleeding Pictures, One Shift. Mrs. J. T., 29 years old, G3 P2, is 2 hours after a vaginal birth of a 4,100 g infant. Oxytocin is infusing. Assessment: fundus boggy and midline at the umbilicus, lochia heavy rubra, one pad saturated in 20 minutes, pulse 104, BP 112/70, respirations 18, temperature 37.0°C. She last voided 5 hours ago, before labor. Her perineum has a repaired second-degree laceration with no active trickle seen.";

M(C1, "Which findings in this assessment require the nurse to act now? Select all that apply.", [
    ["Boggy fundus at the umbilicus", true, "A soft, midline fundus points to poor uterine tone, and tone is what seals the vessels at the placental site."],
    ["One pad saturated in 20 minutes", true, "Flow at this rate is approaching the excessive line and, paired with a soft fundus, sets the urgency for this hour."],
    ["Pulse of 104 beats/min", true, "A fast pulse after birth flags volume loss or infection; the slow pulse is the expected one in this period."],
    ["Five hours since her last void", true, "A filling bladder can hold the uterus open, so the voiding history belongs in the action picture, not the background."],
    ["Repaired second-degree laceration", false, "A repaired laceration with no active trickle seen is a watch item; it does not explain a boggy midline fundus."],
    ["Temperature of 37.0°C", false, "She is afebrile, so fever and infection cues are not part of this presentation."],
    ["Birth weight of 4,100 g", false, "A large infant stretched the uterus and raised her risk, but a risk factor alone is not a cue to act on this minute."]
  ], "ANSWER KEY — Correct answers: boggy fundus, pad saturated in 20 minutes, pulse 104, and 5 hours since last void. DETAILED RATIONALE — Recognize Cues means sorting the changed, actionable findings (tone, flow rate, pulse, bladder interval) from background risk (large infant) and from findings that are currently quiet (afebrile, repaired laceration, no trickle). PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): act on the cues that changed, not on the history that only raised risk.", { scen: CASE_P1, grp: "PRED-CASE1" });

S(C1, "Which explanation best accounts for this woman's findings together?", [
    ["Her uterus is not holding its contraction after delivering a large infant, and a filling bladder is adding to the problem, so the placental site keeps oozing", true, "Tone plus bladder explains the boggy midline fundus, the heavy flow, and the rising pulse in one mechanism."],
    ["Blood is escaping from the repaired laceration line under the pad, and the soft fundus is a separate, unrelated finding from the long second stage", false, "Laceration bleeding presents as a steady bright trickle with a firm fundus; no trickle was seen and her fundus is soft."],
    ["An early uterine infection is weakening the contraction, and the pulse rise is the first sign of that infection taking hold after the birth", false, "She is 2 hours post-birth and afebrile; infection does not build this picture in this window."],
    ["The oxytocin infusion rate is too low to matter, and raising the rate alone will firm the uterus without any hands-on assessment first", false, "A drug adjustment may follow, but it does not replace assessing tone and bladder, the two drivers shown here."]
  ], "ANSWER KEY — Correct answer: poor uterine tone, worsened by a filling bladder. DETAILED RATIONALE — One mechanism must carry every cue: boggy and midline (tone), heavy flow (open placental-site vessels), pulse 104 (compensation), and 5 hours without voiding (a bladder that can block contraction). Laceration fails the fundus cue; infection fails the temperature and timing cues. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the right explanation fits all the data, not just the bleeding.", { scen: CASE_P1, grp: "PRED-CASE1" });

S(C1, "Which action should the nurse take FIRST for this woman?", [
    ["Massage the fundus with one hand anchored just above the symphysis pubis, continuing until the uterus becomes and stays firm", true, "Restoring tone is the fastest way to slow flow from the placental site, and the anchored hand protects the lower uterus during massage."],
    ["Help her walk to the bathroom to void first, then return to the bed and check whether the fundus has firmed on its own afterward", false, "Voiding matters and comes next, but walking a bleeding woman with a rising pulse away from the bed before tone is restored loses the first minutes."],
    ["Inspect the perineum and laceration line under bright light first, since repaired tissue can reopen and bleed without warning", false, "No trickle was seen and the fundus is soft; inspection is reasonable later, but the soft uterus is the active source to treat first."],
    ["Increase the oxytocin infusion and recheck her fundus and pad at the next routine assessment in about an hour", false, "Waiting an hour with this flow rate and pulse abandons the window in which tone can be restored at the bedside."]
  ], "ANSWER KEY — Correct answer: massage the fundus, with the lower uterus anchored, until it is firm. DETAILED RATIONALE — First means the action that changes the active mechanism: tone. Bladder emptying follows immediately, because a full bladder can undo the massage, and the uterotonic ladder follows if tone will not hold. PRIORITY FRAMEWORK — Take Action / Prioritization (Clinical Judgment + ABCs): treat the bleeding source before the contributing factor.", { scen: CASE_P1, grp: "PRED-CASE1" });

BANK.push({ cat: C1, type: "order", stem: "The nurse decides to perform fundal massage on this woman. Place the steps of a safe fundal massage in the correct order.", items: [
  { t: "Lower the perineal pad so the lochia can be watched while the fundus is palpated", r: "Opening step — fundus and flow are read together, so the effect of massage is visible as it happens." },
  { t: "Settle one hand just above the symphysis pubis to support the lower part of the uterus", r: "The support hand goes on before any pressure, and it stays there for the whole maneuver." },
  { t: "Massage the fundus with the flat fingers of the other hand in a firm circular motion", r: "Massage continues until the uterus answers with firmness; tone is the goal of the step." },
  { t: "With the uterus firm, press gently downward to expel pooled blood and clots", r: "Emptying comes after firmness, so the contracted uterus stays closed behind what leaves." }
], tp: "ANSWER KEY — Correct order: lower the pad and watch the lochia → support the lower uterus above the symphysis pubis → massage in a firm circular motion until firm → press gently down to expel pooled blood and clots. DETAILED RATIONALE — The sequence is the safety: see the flow, support the lower segment, create tone, then empty. Pressing down on an unsupported or still-soft uterus risks inversion and more bleeding. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): in a procedure item, the order of steps is itself the intervention.", scen: CASE_P1, grp: "PRED-CASE1" });

S(C1, "The fundus firms with massage and she voids 450 mL, but 40 minutes later the fundus is boggy again and will not stay firm with repeat massage. Which action is appropriate now?", [
    ["Give the ordered methylergonovine (Methergine) and notify the provider that the uterus will not hold its tone after massage", true, "The ladder has been climbed in order — massage, bladder emptied — and a uterus that still re-softens moves to the ordered uterotonic plus provider notice."],
    ["Repeat the massage in longer sessions through the next several hours, since drug treatment is reserved for a fundus that bleeds through two full pads", false, "Massage has already shown it cannot hold tone in this woman; repeating it for hours delays the step the ladder names next."],
    ["Place her flat, dim the room, and let her sleep, because a rested uterus often regains tone on its own by the next assessment round", false, "Sleep does not contract a uterus, and an unmonitored interval with this history invites a larger loss."],
    ["Catheterize her again to keep the bladder completely empty, since bladder pressure must still be the reason the tone will not hold", false, "She voided 450 mL and the fundus firmed afterward; the bladder step is done, and repeating it does not treat tone that will not hold."]
  ], "ANSWER KEY — Correct answer: give the ordered methylergonovine and notify the provider. DETAILED RATIONALE — Generate Solutions follows the step that just failed: massage worked briefly, voiding was completed, and tone still will not hold — the ordered uterotonic for a poorly contracted uterus is next, with the provider informed. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): match the next action to the step that just failed.", { scen: CASE_P1, grp: "PRED-CASE1" });

S(C1, "At the next check the fundus is firm and midline, the new pad shows a moderate stain after a full hour, her pulse is 88, and she is sitting up asking for juice. Which evaluation is correct?", [
    ["The response is effective: tone is holding, the flow rate has fallen well below the earlier rate, and her pulse is trending back toward her baseline", true, "Evaluation compares each cue with its starting value: boggy becomes firm, a pad in 20 minutes becomes a moderate stain in an hour, pulse 104 becomes 88."],
    ["The slower flow most likely means blood is now pooling inside the uterus, so the apparent improvement should be treated as concealed bleeding", false, "Concealed pooling would keep the fundus high or soft and the pulse climbing; all three measures moved the other way."],
    ["A pulse of 88 is still too fast for a postpartum woman, so the episode must be charted as unresolved and the massage schedule restarted", false, "The expected early pulse is 50 to 60, but evaluation follows the trend with the whole picture; 104 falling to 88 with a firm fundus is recovery."],
    ["She can now return to routine checks every 4 to 6 hours with no further fundal checks in between, since every value has normalized", false, "A uterus that softened twice earns continued closer observation; monitoring steps down gradually, it does not switch off."]
  ], "ANSWER KEY — Correct answer: the interventions were effective, judged cue by cue. DETAILED RATIONALE — Evaluate Outcomes means re-measuring the original problem list: tone, flow rate, and pulse all reversed direction. One improved number alone would not be enough; the pattern is what closes the episode, with surveillance continuing. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): judge the plan against each original cue, not against a single value.", { scen: CASE_P1, grp: "PRED-CASE1" });

/* ===== C1 standalone ===== */
S(C1, "On postpartum day 4, a woman's fundus is palpated 4 cm below the umbilicus and is firm and midline, and her lochia is pinkish and light. She asks if this is how it should be. Which response is correct?", [
    ["Reassure her: descent of about a finger's width a day with lightening flow is the expected pattern, and her findings match that pattern today", true, "Day 4, about 4 cm down, firm and midline, with serosa-stage flow is the textbook timetable playing out on schedule."],
    ["Tell her the fundus should already be impossible to feel through the abdomen by now, so the provider will need to examine her this afternoon", false, "The fundus leaves the abdomen at about day 10, not day 4; palpable and descending is expected at this point."],
    ["Explain that a firm fundus this low usually means the uterus has emptied too quickly, and ask her to report any cramping that starts today", false, "Firm and descending is the goal state, not a complication; cramping from afterpains is also expected and fades within about 48 hours."],
    ["Caution her that pinkish flow on day 4 is a day or two early, so she should rest in bed until the flow turns white later this week", false, "Pinkish serosa from about day 3 through day 10 is on time; bed rest is not prescribed for an on-schedule finding."]
  ], "ANSWER KEY — Correct answer: reassure her — the findings match the expected descent and lightening pattern. DETAILED RATIONALE — The yardsticks are about 1 cm of descent a day, not palpable by about day 10, and rubra giving way to serosa at about day 3. Her day-4 picture satisfies all three. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): measure the finding against the timetable before calling it abnormal.");

S(C1, "A nurse palpates the fundus of a woman 6 hours after birth and finds it firm but pushed well to the right of midline and higher than expected. The woman says she has not felt any urge to urinate. Which action should the nurse take first?", [
    ["Help her to void using privacy, running water, and warm water over the perineum, then palpate the fundus again once her bladder is empty", true, "High and deviated is the bladder pattern; the fundus can only be judged fairly after the bladder beside it is emptied."],
    ["Massage the fundus firmly in place until it moves back to the midline, since a firm uterus should sit in the center of the abdomen", false, "Massage treats softness; this fundus is already firm, and massaging cannot move a bladder that is displacing it."],
    ["Give the ordered methylergonovine (Methergine) now, because a fundus sitting above its expected level is treated as a contraction failure", false, "The drug contracts a uterus; it does not empty a bladder, and this firm, deviated fundus has not shown a contraction failure."],
    ["Document the finding and recheck at the next routine round, because she reports no urge and a firm fundus is a reassuring finding", false, "No urge is part of the problem — bladder tone is lowered after birth, so a full bladder can be silent while it displaces the uterus."]
  ], "ANSWER KEY — Correct answer: help her void, then reassess the fundus. DETAILED RATIONALE — Position is the discriminator here: firm but high and right-deviated routes to the bladder, while boggy routes to massage. Emptying first also protects against the bleeding that follows when a displaced uterus cannot stay contracted. PRIORITY FRAMEWORK — Assessment before implementation: remove the mechanical cause, then judge the uterus again.");

S(C1, "Six weeks after birth, a woman reports her flow never fully stopped and her provider finds the uterus still enlarged at her checkup. Which statement by the nurse correctly explains this finding to her?", [
    ["Her uterus has not returned to its prepregnant size on schedule, and the provider will look for a cause and follow the involution from here", true, "Failure to return to prepregnant size by 6 weeks is the chapter's definition-in-action for subinvolution, and it is a provider-evaluated finding."],
    ["This is a normal variation, because the uterus is allowed a full 12 weeks to finish shrinking before anyone considers it delayed", false, "The schedule in this chapter is 5 to 6 weeks to prepregnant size; an enlarged uterus at 6 weeks is behind it, not within it."],
    ["The enlarged uterus most likely means she conceived again in the first weeks, and a pregnancy test is the only follow-up she will need", false, "A test may be part of a workup, but presenting pregnancy as the likely explanation dismisses the involution finding she came in with."],
    ["Daily fundal massage at home will bring the uterus down at this stage, so she should massage firmly morning and evening until it feels smaller", false, "Massage is an immediate postpartum tone measure; it is not the home treatment for a uterus still enlarged at 6 weeks."]
  ], "ANSWER KEY — Correct answer: her uterus has not returned to prepregnant size on schedule and needs provider evaluation. DETAILED RATIONALE — Involution has a deadline in this chapter: prepregnant size by about 5 to 6 weeks, with the placental site healed by 6 to 7 weeks. Missing the deadline has a name and a workup; it is not watched for another 6 weeks. PRIORITY FRAMEWORK — Patient teaching: explain the finding against the normal timetable she was taught at discharge.");

/* ===== C2 Lochia ===== */
S(C2, "On postpartum day 7, a woman's lochia, which had become pinkish and light, is bright red again today and she is soaking a pad in about an hour. Her fundus is firm and midline. Which action should the nurse take first?", [
    ["Assess her vital signs and the amount of flow, and notify the provider that bright red bleeding has returned after the flow had lightened", true, "Color moving backward is a named danger sign; assessment plus provider notice is the response, whatever the fundus feels like."],
    ["Massage her fundus in a firm circular motion until the red flow slows, since bleeding after birth is treated as a tone problem first", false, "Her fundus is already firm and midline; massage treats a soft uterus and will not stop flow that is coming from elsewhere."],
    ["Reassure her that flow increases when she is active, change her pad, and plan to reassess the color again on the next routine round", false, "Activity raises the amount of normal flow; it does not turn lightened flow back to bright red, and that reversal is the flag."],
    ["Ask her to save every pad for the next 24 hours so the provider can judge the total loss before deciding whether she needs evaluation", false, "A day of collecting delays evaluation of a danger sign that is reportable when it appears, not after a full day of data."]
  ], "ANSWER KEY — Correct answer: assess vital signs and flow, and notify the provider. DETAILED RATIONALE — Lochia only moves forward: red, pink, white. A return to bright red after lightening, at a pad an hour, is reported even with a firm fundus, because a firm fundus rules the uterus out and points lower, toward a laceration source. PRIORITY FRAMEWORK — Safety: a named danger sign is assessed and reported, not watched.");

S(C2, "A woman 1 day after a cesarean birth is worried because her flow is much lighter than her sister's was after a vaginal birth. Her fundus is firm, her pad shows a light stain, and she feels well. Which response is correct?", [
    ["Reassure her: flow in the first day after a cesarean is expected to be lighter, because the uterine cavity was cleaned out during the surgery itself", true, "The chapter gives this exact comparison: cesarean mothers have less lochia in the first 24 hours because the cavity was sponged at surgery."],
    ["Tell her light flow this early can mean blood is collecting inside the uterus, so her fundus will be checked every 15 minutes through the shift", false, "Retained blood shows itself in fundal findings and symptoms; a firm fundus, a light stain, and a well mother do not build that picture."],
    ["Explain that her flow will catch up and become heavier than a vaginal birth flow by tomorrow, once the surgical effect wears off", false, "There is no catch-up surge in the chapter; her flow follows the same lightening sequence from a lighter start."],
    ["Ask the provider to examine her today, because any difference from an expected amount in the first day needs a direct uterine examination", false, "A lighter first-day flow after cesarean is an expected difference, not a deviation that triggers an examination by itself."]
  ], "ANSWER KEY — Correct answer: reassure her — lighter flow in the first 24 hours is expected after a cesarean birth. DETAILED RATIONALE — Discrimination items turn on one detail: the birth route. The same light flow that would prompt questions after a vaginal birth is explained, after cesarean, by the cavity being sponged during surgery. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): interpret the amount against how she gave birth.");

M(C2, "Which lochia findings should the nurse report to the provider? Select all that apply.", [
    ["A foul odor to the discharge on day 3", true, "Normal flow smells fleshy or menstrual; a foul odor is the infection flag in the lochia check."],
    ["Many large clots passed on day 2", true, "A few small clots can be normal; many or large clots are on the report list."],
    ["No lochia at all on day 2", true, "Absent flow is abnormal too; blood may be retained in the uterus, or infection may be present."],
    ["Bright red flow returning after it lightened", true, "Backward movement in the sequence is a named danger sign at any point in the puerperium."],
    ["A brief gush when she first stands up", false, "Flow pooled in the vagina while she lay flat drains on standing; a brief gush that settles is expected."],
    ["Pinkish flow on day 6", false, "Serosa, pinkish from about day 3 through day 10, is the on-schedule stage for day 6."],
    ["Flow that increases while she breastfeeds", false, "Suckling releases oxytocin and flow rises with feeding; the rise itself is expected physiology."]
  ], "ANSWER KEY — Correct answers: foul odor, many large clots, no lochia at all, and bright red flow returning after lightening. DETAILED RATIONALE — The report list is built from deviations in odor, clot burden, presence, and direction. The distractors are the chapter's expected patterns: pooling on standing, the serosa stage on schedule, and a feeding-related rise. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): report the deviations, document the expected patterns.");

S(C2, "A nurse weighs a woman's pads over 1 hour and finds they have gained 65 g. Her fundus is firm and midline and she reports passing two large clots in that hour. Which interpretation is correct?", [
    ["About 65 mL was lost in that hour, a heavy amount, and the large clots add to the concern, so the loss should be reported and rechecked closely", true, "Pad weight converts at about 1 g to 1 mL, so 65 g is about 65 mL in an hour, in the heavy band, with a clot finding that is reportable on its own."],
    ["About 65 mL is a moderate amount for an hour, and clots of any size are expected in the first days, so routine charting is all that is needed", false, "The chapter's bands place over 50 mL in an hour in the heavy range, and large clots are never filed as expected."],
    ["Pad weight cannot be converted to a volume, so the nurse should chart the flow by stain size alone and discard the weight she measured", false, "Weighing is the chapter's objective method precisely because it converts, at about 1 g for each 1 mL of blood."],
    ["The firm fundus proves the loss is coming from the perineum, so the nurse should apply a cold pack and stop measuring the pads for now", false, "A firm fundus points away from the uterus, but it does not end measurement or reporting of a heavy, clotting hour."]
  ], "ANSWER KEY — Correct answer: about 65 mL in an hour is heavy, and the large clots make it reportable. DETAILED RATIONALE — Numbers carry this item: 1 g ≈ 1 mL, and the hourly bands run scant under 10 mL, light 10 to 25, moderate 25 to 50, heavy over 50. Sixty-five sits in heavy, beside a second reportable cue. PRIORITY FRAMEWORK — Assessment accuracy: quantify the loss with the chapter's conversion before deciding its urgency.");

BANK.push({ cat: C2, type: "dropdown", stem: "A nurse reviews three women's flow pictures. For each woman, choose the correct interpretation.<br><br>A woman on day 2 whose pad shows a stain under 4 inches after 1 hour<br>[[0]]<br><br>A woman whose pad is saturated after 15 minutes<br>[[1]]<br><br>A woman on day 12 whose flow is white and light<br>[[2]]", blanks: [
  { o: [O("Light flow, within the expected range", true, "A stain under 4 inches in an hour is the light band, about 10 to 25 mL, an expected amount."), O("Excessive flow that must be reported now", false, "Excessive is defined by a pad saturated within 15 minutes, not by a small hourly stain."), O("Absent flow, suggesting retained blood", false, "Flow is present and measurable on the pad; absent flow means none is seen at all.")] },
  { o: [O("Excessive flow that must be reported now", true, "A pad saturated within 15 minutes is the chapter's line for excessive bleeding."), O("Light flow, within the expected range", false, "A 15-minute saturation is far beyond the light band's hourly stain."), O("Absent flow, suggesting retained blood", false, "The pad is saturated; the problem is too much flow, not too little.")] },
  { o: [O("Alba, the expected late stage of healing", true, "White flow from about day 10 through day 21 is alba, the final stage of the sequence."), O("Excessive flow that must be reported now", false, "White and light is the opposite of the excessive picture; amount and color are both calm."), O("Light flow, within the expected range", false, "The amount is light, but the stage name asked for on day 12 is alba, and color-stage is the teaching point.")] }
], tp: "ANSWER KEY — Correct answers: day-2 small stain = light flow; pad saturated in 15 minutes = excessive, report; day-12 white flow = alba. DETAILED RATIONALE — Amount and stage are two separate yardsticks: hourly stain bands quantify the loss, and the red-pink-white sequence dates it. Each woman's picture is read on the yardstick her data belongs to. PRIORITY FRAMEWORK — Assessment accuracy: quantify first, then place the finding in its stage." });

S(C2, "A woman on day 3 tells the nurse her flow has a strong, bad smell that was not there yesterday, and her temperature is 37.4°C. Her fundus is firm. Which action is correct?", [
    ["Report the change in odor to the provider, because flow should smell fleshy or menstrual and a foul odor suggests infection even without fever", true, "Odor is one of the five lochia checks, and foul is its abnormal pole; infection cues are reported as a pattern starts, not after fever completes it."],
    ["Reassure her that a stronger smell is expected as the flow changes stages, and suggest she change her pad more often for comfort", false, "Stage changes alter color, not odor into foulness; the chapter's normal smell is fleshy or menstrual at every stage."],
    ["Teach her to douche once daily until the smell clears, since keeping the vagina clean removes the source of the odor", false, "Douching is prohibited until after the 6-week checkup; it is never the treatment for a foul discharge."],
    ["Wait for the temperature to reach the fever line before reporting, because odor alone is too subjective a finding to act on", false, "Waiting for a second cue wastes the early one; the odor change is itself a charted, reportable assessment finding."]
  ], "ANSWER KEY — Correct answer: report the foul odor as a possible infection cue. DETAILED RATIONALE — The lochia check is character, amount, color, odor, and clots. Odor flipping from fleshy to foul is a deviation on its own axis, and deviations in this system are reported while they are single, not stockpiled until they are multiple. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): a single named deviation is enough to escalate.");

BANK.push({ cat: C2, type: "matrix", stem: "Match each flow picture to the correct nursing response.", cols: ["Reassure and continue routine checks", "Massage the fundus and reassess tone", "Report the finding to the provider", "Help her void, then reassess the fundus"], rows: [
  { t: "A brief gush of dark flow the first time she stands, which then slows", a: 0, r: "Pooled flow draining on standing, then settling, is the expected position effect." },
  { t: "Heavy flow with a soft, boggy fundus 3 hours after birth", a: 1, r: "Flow driven by a soft uterus is answered with massage until tone returns." },
  { t: "A steady trickle of bright blood while the fundus stays firm", a: 2, r: "A firm fundus with a bright trickle points to a cervical or vaginal source, which is reported, not massaged." },
  { t: "Flow increasing while the fundus sits high and pushed to the right", a: 3, r: "Height plus deviation is the bladder picture; emptying comes before the fundus is judged again." }
], tp: "ANSWER KEY — Correct matches: gush on standing = reassure; heavy flow with boggy fundus = massage; bright trickle with firm fundus = report; high right-deviated fundus = help her void, then reassess. DETAILED RATIONALE — Four bleeding pictures, four different first moves, and the fundus is the switch for three of them: soft routes to hands, firm routes to the provider, displaced routes to the bladder. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): pair each picture with the mechanism it shows." });

/* ===== C3 BUBBLE-HE / VS ===== */
S(C3, "Twelve hours after an uncomplicated vaginal birth, a woman's vital signs are temperature 37.5°C, pulse 54, BP 106/66, respirations 16. She feels well, her fundus is firm, and her flow is moderate and red. Which action is correct?", [
    ["Continue routine monitoring and reassure her, because a pulse in the 50s in the first 2 days is an expected finding after birth", true, "Increased stroke volume as uterine and placental blood returns to circulation produces this bradycardia; every other value and cue is calm."],
    ["Notify the provider of the low pulse now, because a rate in the 50s falls outside the normal adult range on the vital-sign chart", false, "Postpartum normals are shifted; the chapter names 50 to 60 in the first 48 hours as common and expected, not reportable."],
    ["Recheck the pulse in 15 minutes with her sitting up, because a lying pulse this slow can hide an early cardiac problem", false, "There is no supporting cue for a cardiac problem: no symptoms, no abnormal pressure, no bleeding picture."],
    ["Hold her routine ambulation until the pulse rises above 60, because walking with a slow pulse raises her risk of fainting today", false, "Ambulation is encouraged, with help for the first three times out of bed; a normal bradycardia is not a reason to keep her in bed."]
  ], "ANSWER KEY — Correct answer: continue routine monitoring; the slow pulse is expected. DETAILED RATIONALE — Postpartum numbers play by different rules: pulse 50 to 60 for about the first 48 hours is expected, and the white count can run 12,000 to 20,000 without infection. The number that should worry the nurse in this period is the fast pulse. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): read each value against the postpartum baseline, not the general adult chart.");

M(C3, "A nurse begins a routine postpartum check using the BUBBLE-HE routine. Which assessments belong in this check? Select all that apply.", [
    ["Breasts and nipples, for consistency, redness, and cracking", true, "Breasts open the routine, with nipple condition checked at every round."],
    ["Fundus, for firmness, height, and position", true, "The uterus check is the three-part fundal question: firmness, height, position."],
    ["Bladder, for distention and output", true, "Bladder status is its own letter, because distention changes the fundal findings."],
    ["Lochia, for character, amount, color, odor, and clots", true, "The flow check carries all five elements at every assessment."],
    ["Legs, for calf pain, redness, tenderness, and warmth", true, "The leg check screens for the clot findings that are reported when present."],
    ["Blood glucose, for recovery of pancreatic function", false, "Glucose is not a letter in this routine for the general postpartum woman."],
    ["Fundal height of the newborn, for growth tracking", false, "The routine assesses the mother; newborn growth is not measured by a fundal check."]
  ], "ANSWER KEY — Correct answers: breasts and nipples, fundus, bladder, lochia, and legs. DETAILED RATIONALE — BUBBLE-HE stands for Breasts, Uterus, Bladder, Bowels, Lochia, Episiotomy/perineum, Homans' sign, and Emotions/bonding, rounded out by vital signs. Each letter is a system that can turn in the first days, which is why the routine repeats every 4 to 6 hours. PRIORITY FRAMEWORK — Assessment: a named routine prevents the quiet systems from being skipped.");

S(C3, "On day 2, a woman's temperature is 38.7°C, her pulse is 116, and she says she feels chilled and achy. Her fundus is tender and her flow has a foul odor. Which action should the nurse take first?", [
    ["Assess the uterus, flow, perineum, breasts, and legs for the source, and report the fever pattern to the provider", true, "Fever after the first 24 hours with a fast pulse, uterine tenderness, and foul flow builds an infection picture that is assessed fully and reported."],
    ["Give her a warm blanket and recheck the temperature in an hour, because chills and shaking are common right after birth", false, "Chills without fever right after birth settle in about 20 minutes; chills with fever on day 2 belong to a different picture."],
    ["Encourage fluids and rest and chart the values, because a white count in this period can be high without any infection present", false, "A high white count alone can be normal, but this woman has fever, tachycardia, tenderness, and foul flow — a pattern, not a single number."],
    ["Massage her fundus until it is no longer tender, since uterine tenderness after birth usually reflects a uterus that needs to contract", false, "Tenderness with fever and foul flow is not a massage indication; massaging an infected, tender uterus delays the report."]
  ], "ANSWER KEY — Correct answer: complete the source assessment and report the infection pattern. DETAILED RATIONALE — Timing discriminates: shaking chills alone, right after birth, are expected and brief. Fever over 38°C after the first 24 hours, with tachycardia and localizing cues, is the infection pattern, and a fast pulse is never written off as normal recovery. PRIORITY FRAMEWORK — Safety: report the pattern, not just the temperature.");

S(C3, "A woman who received an epidural in labor gets out of bed for the first time 5 hours after birth, sits on the edge of the bed, and says the room is spinning. Her fundus is firm and her flow is moderate. Which action should the nurse take first?", [
    ["Keep her seated with support, then assist her back and supervise closely, because dizziness on first standing is a known fall risk in this period", true, "As the pelvis empties, resistance in the pelvic vessels drops; first stands, especially after an epidural, are assisted, and the first three times out of bed are supervised."],
    ["Walk her to the bathroom quickly while she is already up, because voiding now will keep her bladder from filling while she recovers", false, "A spinning woman is not walked anywhere; the fall she is warning about happens on the way, not in the bed."],
    ["Lay her flat and massage her fundus, because dizziness after birth most often means the uterus has relaxed and bleeding has started", false, "Her fundus is firm and her flow moderate; the picture fits position and vessels, not a new bleed, and massage treats neither."],
    ["Chart the episode as an expected reaction and leave her to stand again on her own at the next round, now that she knows how it feels", false, "A first episode earns more supervision, not less; unassisted standing after a warning spin is how postpartum falls happen."]
  ], "ANSWER KEY — Correct answer: support her, return her safely, and supervise her first times out of bed. DETAILED RATIONALE — Orthostatic dizziness after birth has a mechanism in the chapter: the emptied pelvis lowers vascular resistance, and epidural anesthesia raises the risk further. The intervention is assistance and supervision, repeated for the first three stands. PRIORITY FRAMEWORK — Safety / fall prevention: answer the symptom she is having, in the position she is in.");

BANK.push({ cat: C3, type: "order", stem: "A woman is 26 hours after birth and the nurse is planning the order of her routine care for this round. Place the actions in the order they should be done.", items: [
  { t: "Take her vital signs and ask about her pain level", r: "The round opens with the numbers and the pain score that frame everything after them." },
  { t: "Check the fundus and the lochia together with the pad lowered", r: "Tone and flow are read as one picture, before any intervention changes them." },
  { t: "Help her to void, then recheck the fundus position", r: "Bladder emptying comes before the fundus is finally judged, because a full bladder moves it." },
  { t: "Give the ordered analgesic right after she breastfeeds", r: "Medication timing closes the round: dosing after a feeding keeps the least drug reaching the newborn." }
], tp: "ANSWER KEY — Correct order: vital signs and pain → fundus and lochia together → void, then recheck fundus → analgesic after breastfeeding. DETAILED RATIONALE — Assessment precedes intervention, the bladder is cleared before the final fundal judgment, and analgesic timing is set by the feeding, not by the clock alone. PRIORITY FRAMEWORK — Nursing process: assess, remove the confounder, then medicate on the chapter's timing rule." });

S(C3, "A laboratory report shows a white blood cell count of 18,000/mm3 for a woman 1 day after birth. She is afebrile, her pulse is 62, her fundus is firm, and her flow smells fleshy. Which interpretation is correct?", [
    ["This value can be an expected response to the inflammation, pain, and stress of birth, so it is read with the whole picture, which here is calm", true, "The chapter allows 12,000 to 20,000 in this period without infection, and none of her other cues support infection."],
    ["A count this high proves a uterine infection is present, so the nurse should start the infection workup and notify the provider of the result", false, "One number is not a pattern; fever, fast pulse, tenderness, and foul flow are absent, and the value sits inside the stated postpartum range."],
    ["The count means her blood was drawn too early, so the nurse should request a repeat draw in 4 hours to get a trustworthy value", false, "The value is trustworthy; it is the interpretation that must use the postpartum range rather than the general range."],
    ["She should be placed on isolation precautions until the count falls, because a value this high means she is contagious to her newborn", false, "An elevated white count from birth stress is not a contagion finding and does not separate a mother from her newborn."]
  ], "ANSWER KEY — Correct answer: the count can be expected after birth and is read with the whole, calm picture. DETAILED RATIONALE — Infection is diagnosed from a pattern. A white count of 12,000 to 20,000 is the chapter's stated normal response to birth itself; with no fever, no tachycardia, and no localizing cue, the number stands alone and is documented, not escalated. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): a value is a cue, not a conclusion.");

BANK.push({ cat: C3, type: "matrix", stem: "Match each vital-sign picture to the correct nursing response.", cols: ["Reassure and continue routine checks", "Assess for a source and report it", "Massage the fundus until firm", "Assist her and supervise standing"], rows: [
  { t: "Pulse 56, comfortable and afebrile, 20 hours after birth", a: 0, r: "A pulse of 50 to 60 in the first 48 hours is the expected postpartum bradycardia." },
  { t: "Pulse 118 with temperature 38.6°C and chills on day 2", a: 1, r: "Fast pulse with fever after the first day builds the infection or volume-loss pattern that is reported." },
  { t: "Pulse 110 with a boggy fundus and heavy flow 1 hour after birth", a: 2, r: "Here the fast pulse rides with a soft uterus; restoring tone is the first move while help is called." },
  { t: "Dizzy and lightheaded the first time she sits up after an epidural birth", a: 3, r: "Position dizziness is answered with support and supervised first stands, not with a drug or a massage." }
], tp: "ANSWER KEY — Correct matches: slow comfortable pulse = reassure; fast pulse with fever = assess and report; fast pulse with boggy fundus = massage; dizziness on sitting = assist and supervise. DETAILED RATIONALE — The same fast pulse routes two different ways depending on its company: with fever it is an infection/volume flag to report, with a soft fundus it is a tone problem to treat at the bedside first. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the company a number keeps decides the response." });

/* ===== CASE 2 (PRED-CASE2) — post-cesarean day 1: lungs, clot, pain, catheter ===== */
var CASE_P2 = "CASE STUDY — The Morning After a Cesarean. Mrs. K. S., 32 years old, G2 P1, is on her first morning after a cesarean birth under epidural anesthesia; she also received an epidural narcotic for pain. Her incision is a low transverse skin incision with a dressing in place. Her indwelling catheter is still in, her IV is running, and she has pneumatic compression devices on her legs. Assessment: respirations 14 and shallow, breath sounds diminished at the bases, pain rated 7 of 10, fundus firm and midline, flow light, temperature 37.1°C, pulse 68. She says, 'It hurts too much to breathe deep or cough.'";

M(C4, "Which findings in this assessment require the nurse to act now? Select all that apply.", [
    ["Shallow respirations with diminished breath sounds at the bases", true, "Diminished sounds mean secretions are being retained; after cesarean the lungs are auscultated every shift for exactly this picture."],
    ["Pain rated 7 of 10 on the morning after surgery", true, "Unrelieved pain is itself an assessment finding, and here it is also blocking the breathing and coughing she needs to do."],
    ["Her statement that it hurts too much to breathe deeply or cough", true, "Her own words name the mechanism: pain is preventing the lung-clearing actions, so pain and lungs are one problem, not two."],
    ["Respirations of 14 per minute while an epidural narcotic is in effect", true, "Epidural narcotics can depress respirations hours after they are given, so her rate is monitored hourly with pulse oximetry."],
    ["Fundus firm and midline with light flow on the morning check", false, "This is the reassuring part of the picture; the uterus and flow need routine checks, not action this hour."],
    ["Pulse of 68 beats/min, steady and regular on the morning check", false, "A rate in the high 60s on the first morning is unremarkable and carries no action by itself."],
    ["Temperature of 37.1°C, unchanged since the recovery room check", false, "She is afebrile; fever is not part of this morning's picture."]
  ], "ANSWER KEY — Correct answers: diminished breath sounds with shallow breathing, pain 7 of 10, her statement that pain blocks deep breathing and coughing, and respirations of 14 while an epidural narcotic is in effect. DETAILED RATIONALE — The actionable cues cluster on one chain: surgery plus pain produces shallow breathing, shallow breathing retains secretions, and an epidural narcotic adds a respiratory watch of its own. The uterine picture is the calm part. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): group the cues into the chain they form before choosing any single action.", { scen: CASE_P2, grp: "PRED-CASE2" });

S(C4, "Which action should the nurse take FIRST for this woman?", [
    ["Relieve her pain per orders, then coach deep breathing and a cough with a pillow held firmly against her incision", true, "Pain control is what unlocks the breathing; splinting the incision with a pillow is the chapter's technique for coughing with less pain."],
    ["Remove the compression devices and walk her to the end of the hall now, because ambulation is the fastest way to clear her lungs", false, "Ambulation comes early and matters, but marching a woman in pain at 7 of 10 down the hall before relief sets her up to refuse the next walk."],
    ["Raise the head of the bed, give oxygen by nasal cannula, and call the provider to report a respiratory complication from the surgery", false, "Her rate and picture call for the bedside chain first — pain relief, deep breaths, splinted cough, turning — before escalation she has not yet needed."],
    ["Encourage her to rest undisturbed until the afternoon, because the first morning after surgery is when sleep heals the incision best", false, "Undisturbed rest is the opposite of her prescription: deep breaths and turning side to side every 2 hours while she is in bed."]
  ], "ANSWER KEY — Correct answer: relieve the pain, then coach deep breathing and a splinted cough. DETAILED RATIONALE — Prioritization here is sequencing: the pain is the lock, and breathing is behind it. The chapter's cesarean lung routine is deep breaths, turning every 2 hours, coughing with the incision splinted, an incentive spirometer for targets, and early ambulation — started in that order for a woman in pain. PRIORITY FRAMEWORK — Prioritization (Clinical Judgment): treat the barrier first, then the function it is blocking.", { scen: CASE_P2, grp: "PRED-CASE2" });

S(C4, "While coaching her, the nurse teaches the coughing technique. Which instruction is correct for this woman?", [
    ["Hold a small pillow or folded blanket firmly against the incision while coughing, and take deep breaths between coughs", true, "Splinting is the chapter's named technique: firm support on the incision reduces the pain of coughing so the cough can actually clear secretions."],
    ["Press the pillow loosely over the dressing only if the pain becomes severe, and breathe shallowly between coughs to protect the incision", false, "Shallow breathing is the problem being treated, and a loose pillow gives no support; the splint is firm and the breaths are deep."],
    ["Skip coughing today and rely on the incentive spirometer alone, because coughing in the first day can separate the incision edges", false, "The chapter prescribes coughing with support, not avoidance; avoiding it leaves the secretions her breath sounds are already showing."],
    ["Lean forward over the bed table without anything on the incision, so the abdominal muscles do the work of the cough by themselves", false, "Unsupported coughing is what she already told the nurse she cannot do; the pillow is what makes the technique possible for her."]
  ], "ANSWER KEY — Correct answer: splint the incision firmly with a pillow while coughing, with deep breaths between coughs. DETAILED RATIONALE — Technique items are won on the detail the stem is testing: firm splint, deep breaths, turn every 2 hours, spirometer targets. Each distractor removes or reverses one of those details. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): the correct technique is the one she can actually perform.", { scen: CASE_P2, grp: "PRED-CASE2" });

S(C4, "Her catheter is removed this morning, 20 hours after the birth. She voids 90 mL, then 110 mL an hour later. Which action is correct?", [
    ["Keep measuring her voids and report the pattern, because output is followed until she passes at least 150 mL at a void", true, "The chapter sets the yardstick plainly: after catheter removal, voids are measured until she urinates at least 150 mL, and small repeated voids are watched."],
    ["Chart that she is voiding and stop measuring, because any urine passed after catheter removal shows the bladder has recovered", false, "Passing some urine is not the endpoint; the measured threshold in the chapter is 150 mL, and she has not reached it yet."],
    ["Reinsert the catheter at once, because two voids under the threshold prove the bladder cannot empty after a cesarean birth", false, "Small early voids earn continued measurement and voiding support first; catheter decisions follow the full pattern and an order."],
    ["Restrict her fluids until the voids get larger, because a bladder filling more slowly will empty more completely each time", false, "Fluids are not restricted to fix void size; intake and output are measured until the IV and catheter are both discontinued."]
  ], "ANSWER KEY — Correct answer: keep measuring until she passes at least 150 mL. DETAILED RATIONALE — This item turns on a single chapter number: 150 mL is the void that ends close measurement after catheter removal, and the catheter itself is usually out within 24 hours, as hers was. Ninety and 110 are progress, not arrival. PRIORITY FRAMEWORK — Assessment: measure against the chapter's threshold, not against the presence of any output.", { scen: CASE_P2, grp: "PRED-CASE2" });

M(C4, "Which measures belong in this woman's clot-prevention plan today? Select all that apply.", [
    ["Pneumatic compression devices on her legs until she is ambulating well", true, "Compression devices are a mainstay after cesarean in this chapter, used until ambulation is established."],
    ["Early and frequent ambulation, starting as soon as she is able", true, "Walking is the big prevention, and after cesarean it also mobilizes the lung secretions she is retaining."],
    ["Simple leg exercises in bed, alternately flexing and extending her feet", true, "Foot flexion and extension while she is still in bed keep the leg muscles pumping between walks."],
    ["Strict bed rest until the incision check tomorrow, to protect the wound", false, "Bed rest feeds venous stasis, the very mechanism being prevented; her plan moves her, it does not park her."],
    ["Aspirin each morning as her clot prevention while she is in the hospital", false, "Aspirin is avoided postpartum in this chapter because it interferes with blood clotting; it is not her prevention plan."],
    ["Massaging her calves firmly at each round to move the blood along", false, "Calves are assessed for pain, redness, tenderness, and warmth; firm massage is not a prevention measure in this chapter."]
  ], "ANSWER KEY — Correct answers: compression devices, early frequent ambulation, and flex-and-extend leg exercises. DETAILED RATIONALE — Cesarean birth carries a greater clot risk than vaginal birth, and the chapter's United States mainstays are compression devices plus early ambulation, with leg exercises in bed; prophylactic heparin is noted as a European recommendation. Bed rest and aspirin each reverse a chapter rule. PRIORITY FRAMEWORK — Safety / prevention: match each measure to the mechanism of venous stasis.", { scen: CASE_P2, grp: "PRED-CASE2" });

S(C4, "Four hours later her respirations are 9 per minute and she is difficult to rouse, though her pain is now rated 2 of 10. Which action should the nurse take first?", [
    ["Support her breathing, call for help, and have naloxone (Narcan) ready, because this pattern fits respiratory depression from the epidural narcotic", true, "The chapter warns that epidural narcotics can depress respirations several hours after administration, with hourly respiratory checks, pulse oximetry, and naloxone kept readily available."],
    ["Let her sleep, because a pain rating of 2 means the medication plan is finally working and rest is what she asked for this morning", false, "A good pain score beside a rate of 9 and difficult arousal is not success; the breathing numbers outrank the pain numbers here."],
    ["Sit her upright and coach the splinted cough again, because retained secretions are still the most likely cause of a slow rate", false, "Coaching requires a patient who can respond; a woman who is difficult to rouse needs her breathing supported and reversed, not coached."],
    ["Document the rate and recheck in 1 hour, because slow respirations are expected while any narcotic is still wearing off", false, "Hourly monitoring exists to catch this exact change; documenting and waiting an hour spends the window the monitoring was built to protect."]
  ], "ANSWER KEY — Correct answer: support her breathing, call for help, and have naloxone ready. DETAILED RATIONALE — Evaluate the flip: the same drug class that fixed her pain can, hours later, depress her respirations. Rate 9 with difficult arousal is the chapter's named danger of epidural narcotics, and naloxone is the named antidote kept on hand for it. PRIORITY FRAMEWORK — ABCs: airway and breathing outrank a satisfactory pain score.", { scen: CASE_P2, grp: "PRED-CASE2" });

/* ===== C4 standalone ===== */
S(C4, "A nurse checks the perineum of a woman 5 hours after a vaginal birth with an episiotomy. The REEDA check shows mild edema, no discharge, and edges together, but the woman rates her pain 9 of 10 and says she feels pressure like she needs a bowel movement. Which action should the nurse take first?", [
    ["Look closely for a tense, bulging, discolored swelling, take her vital signs, and notify the provider about pain out of proportion to the findings", true, "Severe unrelieved pain with rectal pressure and a near-normal surface check points under the surface, to blood collecting in the tissue, and a rising pulse would support it."],
    ["Apply a warm sitz bath now, because warmth brings circulation to the perineum and is the chapter's main comfort measure for this degree of pain", false, "Warmth and sitz baths belong after 24 hours; in the first hours the chapter's measure is cold, and neither comfort measure answers pain at this level."],
    ["Give the ordered pain medication and reassess in 1 hour, because the surface check is reassuring and medication response will clarify the picture", false, "An hour of waiting spends the time in which hidden bleeding declares itself in her vital signs; the pain itself is the finding to escalate."],
    ["Teach her the buttock-squeeze sitting technique and pad her chair, because pressure feelings after an episiotomy usually come from how she sits", false, "Sitting technique eases ordinary perineal soreness; it does not explain pain of 9 with a pressure sensation hours after birth."]
  ], "ANSWER KEY — Correct answer: inspect for a tense bulging swelling, take vital signs, and notify the provider. DETAILED RATIONALE — REEDA reads the surface: redness, edema, bruising, discharge, approximation. A collection of blood forms deeper than the surface, so a calm REEDA cannot clear severe pain with rectal pressure; pain out of proportion is itself the cue. PRIORITY FRAMEWORK — Safety: escalate the cue that does not fit the reassuring findings.");

S(C4, "A woman with a vertical cesarean skin incision is due for her fundal check. Which technique is correct for her?", [
    ["Walk the fingers gently from the side of her abdominal midline toward the uterus, and if the fundus feels firm at its expected level, no massage is needed", true, "The chapter changes the approach for a vertical incision: approach from the side of the midline, and a firm fundus at level needs no massage."],
    ["Palpate straight down the midline with firm pressure, the same as after a vaginal birth, because the fundus sits in the same place either way", false, "Straight midline pressure crosses her vertical incision; the chapter's modification exists precisely to avoid that approach."],
    ["Skip the fundal check while a vertical incision is healing, because pressing near the incision risks separating the wound edges", false, "The uterus is still checked after cesarean and descends at a similar rate; the technique changes, the check does not disappear."],
    ["Massage the fundus through the dressing until it firms, because a cesarean uterus always needs massage at every check to stay contracted", false, "Massage answers softness, not surgery; if the fundus feels firm at its expected level, the chapter says no massage is necessary."]
  ], "ANSWER KEY — Correct answer: walk the fingers from the side of the midline, and leave a firm fundus unmassaged. DETAILED RATIONALE — One detail flips the technique: incision direction. Transverse incisions are checked much like a vaginal birth; vertical incisions are approached from the side, and firmness ends the maneuver. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): adapt the standard technique to the patient's surgical detail.");

M(C4, "Which findings at a cesarean incision check should the nurse report? Select all that apply.", [
    ["Drainage soaking through the dressing", true, "A dressing is checked for drainage while it is on; drainage is a reportable wound finding."],
    ["An incision that is not clean and dry once the dressing is off", true, "The chapter's expected wound is clean and dry; anything else at the incision is assessed and reported."],
    ["Staples that are no longer intact along the line", true, "Intact staples are part of the expected picture until they are removed, around day 3, and replaced with Steri-Strips."],
    ["Redness at the line together with increasing pain", true, "Redness alone can be healing inflammation; redness with pain points toward infection and is reported."],
    ["Mild swelling around the incision on the first day", false, "Mild edema is a common early finding at a fresh surgical or perineal site and is watched, not reported alone."],
    ["A pain rating of 2 of 10 an hour after her analgesic", false, "A rating under 3 without grimacing or restlessness meets the chapter's pain goal; it is the desired outcome."]
  ], "ANSWER KEY — Correct answers: drainage through the dressing, an incision not clean and dry, staples not intact, and redness with increasing pain. DETAILED RATIONALE — REEDA works for the incision as it does for the perineum, and its abnormal poles are discharge, separation, and redness that travels with pain. Mild edema and a met pain goal are the expected poles. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): report the poles that break the healing pattern.");

/* ===== C5 Circulation / Bladder / Bowels ===== */
S(C5, "A woman 2 days after a cesarean birth reports her left calf aches and feels tight. The nurse finds the calf reddened, tender, and warmer than the right, with swelling. Which action should the nurse take first?", [
    ["Keep her from bearing weight on that leg, assess both legs and her breathing, and report the calf findings to the provider now", true, "Calf pain with redness, tenderness, warmth, and swelling is the clot picture, and cesarean birth raises that risk above a vaginal birth."],
    ["Walk her up and down the hall several times, because ambulation is the chapter's clot treatment and movement will loosen the tight feeling", false, "Ambulation prevents clots; it is not the response to a calf that already shows the clot findings, and walking on it is the wrong first move."],
    ["Massage the calf firmly to work the tightness out, then recheck it at the next routine assessment round in a few hours", false, "A tender, reddened calf is assessed and reported, never massaged; hours of delay also miss the breathing check that belongs with it."],
    ["Apply a warm compress and reassure her, because calf discomfort after delivery positioning is usually a strained muscle that settles", false, "A strained muscle can explain discomfort on dorsiflexion alone; redness, warmth, tenderness, and swelling together build a different picture."]
  ], "ANSWER KEY — Correct answer: protect the leg, assess legs and breathing, and report the findings. DETAILED RATIONALE — Homans' discomfort alone has limited value after birth because positioning strains muscles. This woman has the fuller picture — pain plus redness, tenderness, warmth, and edema — which is the reportable pattern, confirmed by symptoms and venous ultrasound rather than by one sign. PRIORITY FRAMEWORK — Safety: report the pattern, and check the lungs that a clot would travel to.");

S(C5, "While assessing a woman 1 day after birth, the nurse notes she has voided five times in 2 hours, 30 to 50 mL each time, and her bladder is palpable above the symphysis. Which interpretation is correct?", [
    ["She is not emptying her bladder; the small frequent voids are overflow, and the retained urine raises her risks of infection and bleeding", true, "Frequency is not emptying: small voids with a palpable bladder mean retention with overflow, and stasis invites infection while the full bladder displaces the uterus."],
    ["She is showing normal postpartum diuresis, because frequent voiding in the first days is how the body unloads the fluid of pregnancy", false, "Diuresis is a volume pattern, reaching about 3,000 mL a day in large voids; 30 to 50 mL dribbles with a palpable bladder are its opposite."],
    ["Her kidneys are recovering slowly from labor, so the small amounts should be charted and her fluids increased to push the output up", false, "The bladder, not the kidneys, holds the problem here; the urine is being made and stored, it is not being emptied."],
    ["The perineal swelling is blocking the flow mechanically, so a catheter should be placed now without waiting for voiding measures or an order", false, "Voiding measures come first — privacy, running water, warm peribottle water — and catheterization follows an order when she still cannot empty."]
  ], "ANSWER KEY — Correct answer: retention with overflow — she is voiding often without emptying. DETAILED RATIONALE — Judge the bladder by amounts, not by trips. Diuresis produces large voids totaling about 3,000 mL a day; retention produces small, frequent voids over a palpable bladder. The two patterns share only the word frequent. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the volume pattern, not the frequency, names the problem.");

M(C5, "Which measures help a woman who has not had a bowel movement by day 3 and is afraid to strain against her sore perineum? Select all that apply.", [
    ["Fluids and fiber added to her diet each day", true, "Fluids with fiber are the chapter's foundation measures, working with the stool softener rather than instead of it."],
    ["Ambulation around the unit several times a day", true, "Walking supports bowel activity along with its clot and lung benefits in this period."],
    ["The ordered docusate stool softener, taken as scheduled", true, "Docusate is the usual first-line order; it softens the stool so she does not have to strain against a sore perineum."],
    ["A bisacodyl suppository, since she has a fourth-degree tear", false, "A third- or fourth-degree laceration is the chapter's hard stop: no suppository and no enema for that perineum."],
    ["Bearing down hard and holding her breath to pass the stool", false, "Straining against a sore, healing perineum is what she fears for good reason; the plan softens the stool instead."],
    ["Skipping meals until the bowels move, to rest the bowel", false, "She is usually hungry after birth and GI activity resumes as progesterone falls; fasting is not a bowel measure here."]
  ], "ANSWER KEY — Correct answers: fluids and fiber, ambulation, and the ordered docusate. DETAILED RATIONALE — The bowel ladder builds in order: fluids, fiber, and walking, then a softener, then a laxative or enema only as ordered and only when the perineum allows it. The suppository distractor fails on the one detail that matters, her fourth-degree tear. PRIORITY FRAMEWORK — Safety: climb the ladder, and check the perineum before any rectal measure.");

S(C5, "A woman suddenly reports difficulty breathing 2 days after a cesarean birth. Her respirations are 28, her pulse is 122, and she looks frightened. Which action should the nurse take first?", [
    ["Stay with her, support her breathing and position, and get emergency help, because fast breathing with difficulty breathing is the pulmonary embolus warning picture", true, "Dyspnea plus tachypnea is the chapter's named warning pair for a pulmonary embolus and needs immediate medical intervention."],
    ["Check her legs first for calf findings, because confirming a leg clot is required before any breathing problem is escalated after birth", false, "Leg findings would support the story, but the breathing emergency is escalated on its own cues; confirmation steps do not precede help."],
    ["Give her a paper bag to breathe into, because rapid breathing after surgery is most often anxiety and will slow as she calms", false, "Relabeling this picture as anxiety is the trap; after a cesarean, with a raised clot risk, this pair of signs is treated as an emergency first."],
    ["Recheck her respirations in 15 minutes, because a single fast reading in a frightened woman often settles without any intervention", false, "A quarter hour of watching spends the window in the one postpartum emergency the chapter says needs intervention now."]
  ], "ANSWER KEY — Correct answer: stay, support her breathing, and get emergency help now. DETAILED RATIONALE — Two signs carry this item: dyspnea and tachypnea, arriving in the woman whose birth route already raised her clot risk. The chapter's instruction for that pair is immediate medical intervention, not confirmation, calming, or rechecking. PRIORITY FRAMEWORK — ABCs: breathing emergencies are answered in the moment they are recognized.");

BANK.push({ cat: C5, type: "order", stem: "A woman cannot void 6 hours after birth and her fundus is high. Place the nurse's actions in the order they should be done.", items: [
  { t: "Give her privacy in the bathroom and run water in the sink while she tries", r: "The chapter's opening measures are privacy without rushing, plus the sound of running water." },
  { t: "Have her squirt warm water over the perineum with the peribottle as she tries", r: "Warm water over the perineum relaxes the sphincter; the water is measured first so it can be deducted from the void." },
  { t: "Measure the amount she voids and palpate the fundus again afterward", r: "Amounts judge success, and the fundus is only fairly judged once the bladder is emptied." },
  { t: "Catheterize her with a provider's order if she still cannot empty her bladder", r: "Catheterization is the ordered last step of the ladder, not its opening move." }
], tp: "ANSWER KEY — Correct order: privacy with running water → warm peribottle water over the perineum → measure the void and recheck the fundus → catheterize with an order if she still cannot empty. DETAILED RATIONALE — The voiding ladder starts with environment and relaxation measures, proves the result with a measurement, and reserves the invasive step for failure of the others, under an order. PRIORITY FRAMEWORK — Nursing process: least invasive first, with each step's result deciding the next." });

S(C5, "A woman reports burning when she urinates and a constant urge to go, 2 days after her catheter was removed. Her temperature is 37.6°C. Which action is correct?", [
    ["Report the continued burning and urgency, because those symptoms after catheter removal suggest a bladder infection rather than normal soreness", true, "Some discomfort with early urination is expected from edema and trauma, but continued burning with urgency is the chapter's UTI pattern, and catheterization raised that risk."],
    ["Reassure her that burning is expected for the whole first week after a catheter, so no report is needed unless a fever develops", false, "The chapter separates expected early discomfort from continued symptoms; persistence is exactly what moves it to a report."],
    ["Teach her to hold her urine longer between voids, so the bladder stretches back to its normal capacity and the urge settles", false, "Holding urine builds stasis, the condition that invites the infection her symptoms suggest; it is the opposite of the response."],
    ["Restrict her evening fluids so she voids less often overnight, because fewer voids will give the irritated bladder time to heal", false, "Fluid restriction does not treat a suspected infection and works against the fluids the bowel and bladder plans both call for."]
  ], "ANSWER KEY — Correct answer: report continued burning and urgency as a possible bladder infection. DETAILED RATIONALE — The discriminator is the word continued: early discomfort is expected, persistent burning with urgency is not, and her catheter history raises the pre-test concern. High fever with chills would point higher, toward the kidney. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): persistence converts an expected discomfort into a reportable pattern.");

S(C5, "A woman's blood loss at her cesarean birth was measured at 900 mL. The recovery nurse asks whether that amount counts as a hemorrhage. Which answer is correct?", [
    ["Not by amount alone: expected loss runs up to about 1,000 mL at a cesarean birth, so her cues and vital signs, not the number alone, decide the concern", true, "The chapter's expected losses are about 500 mL for a vaginal birth and up to 1,000 mL for a cesarean; 900 sits inside the cesarean expectation."],
    ["Yes: any loss over 500 mL is a hemorrhage after any birth, so her record should be flagged and the hemorrhage protocol started", false, "Five hundred is the vaginal yardstick; applying it to a cesarean birth misreads the chapter's two different numbers."],
    ["No loss at a cesarean can be judged until 24 hours have passed, because surgical losses are only counted at the first dressing change", false, "Loss is measured at the birth and judged with her ongoing cues; there is no 24-hour waiting rule for reading it."],
    ["Her loss counts as a hemorrhage only if her fundus is boggy, because tone is the sole test the chapter uses for surgical births", false, "Tone is one cue among several — flow, pulse, and symptoms all count — and a cesarean fundus can be firm while she still loses blood."]
  ], "ANSWER KEY — Correct answer: 900 mL is within the expected cesarean range of up to about 1,000 mL. DETAILED RATIONALE — Discrimination by birth route again: the same 900 mL would exceed the vaginal expectation of about 500 mL. Numbers in this chapter are always read with their route and with the woman's cues attached. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): match the number to the correct baseline before naming it abnormal.");

BANK.push({ cat: C5, type: "matrix", stem: "Match each woman's picture to the correct first response.", cols: ["Help her void, then recheck the fundus", "Report calf findings and protect the leg", "Escalate for emergency help now", "Reassure her and keep fluids coming"], rows: [
  { t: "Voids of 400 to 500 mL at a time, totaling about 2,800 mL in a day, fundus firm", a: 3, r: "Large-volume voiding near 3,000 mL a day is normal postpartum diuresis unloading pregnancy fluid." },
  { t: "Fundus high and to the right, with no void since the birth 5 hours ago", a: 0, r: "Height plus deviation plus no void is the bladder picture; emptying precedes the fundal verdict." },
  { t: "One calf reddened, tender, warm, and swollen on day 2 after cesarean", a: 1, r: "The full calf pattern after the higher-risk birth route is reported, and the leg is protected." },
  { t: "Sudden difficulty breathing with respirations of 28 after a cesarean birth", a: 2, r: "Dyspnea with tachypnea is the pulmonary embolus warning pair and is escalated immediately." }
], tp: "ANSWER KEY — Correct matches: large-volume voiding = reassure and keep fluids coming; high deviated fundus with no void = help her void, then recheck; full calf pattern = report and protect the leg; sudden breathing difficulty = escalate now. DETAILED RATIONALE — Four pictures that share body systems but not responses: volume separates diuresis from retention, and the breathing picture outranks every other item on the page. PRIORITY FRAMEWORK — Prioritization: sort by mechanism first, then by urgency." });

/* ===== C6 Breasts ===== */
S(C6, "On day 3, a breastfeeding woman's breasts are hard, tense, warm, and painful on both sides, and the swollen areola keeps her newborn from latching. Her temperature is 37.8°C. Which action should the nurse take first?", [
    ["Help her hand-express or pump a little milk to soften the areola, then latch the newborn and nurse frequently on both sides", true, "Both hard, tense breasts on the day milk comes in is engorgement; softening the areola restores the latch, and emptying is the treatment."],
    ["Apply cold packs and advise her to skip feedings until the swelling settles, because nursing on engorged breasts damages the tissue", false, "Cold belongs between feedings for comfort, but skipping feedings leaves the milk that is causing the swelling exactly where it is."],
    ["Report the picture as mastitis and ask for antibiotics, because warm, painful breasts with a raised temperature mean breast infection", false, "Mastitis is a localized picture: one tender red area on one breast, usually with higher fever and flu-like aching — hers is both breasts, generalized."],
    ["Give the newborn a bottle for the next several feedings, so her breasts can rest while the swelling goes down on its own", false, "A bottle rests nothing; milk not removed keeps the breast engorged and teaches the newborn an easier flow than the breast."]
  ], "ANSWER KEY — Correct answer: soften the areola by expressing a little milk, then nurse frequently. DETAILED RATIONALE — The discriminators are distribution and day: both breasts, hard and tense, on day 3 is engorgement, while one localized red tender area with higher fever and aching is the mastitis pattern. Engorgement is treated by moving milk: heat just before a feeding, cold between feedings. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): distribution and timing separate engorgement from infection.");

M(C6, "Which statements show a mother understands the teaching about storing her pumped milk? Select all that apply.", [
    ["A tightly capped container can stay at room temperature for 4 to 6 hours", true, "Room-temperature storage in a capped container is 4 to 6 hours in the chapter's table."],
    ["The back of the refrigerator keeps milk for up to 96 hours", true, "Refrigerated at 4°C in the back of the refrigerator, milk keeps up to 96 hours."],
    ["A refrigerator freezer keeps milk for up to 2 weeks, a deep freezer for up to 6 months", true, "The two freezer numbers are a pair in the chapter: 2 weeks in the refrigerator freezer, 6 months in a deep freezer."],
    ["Thawed milk can be used within 24 hours and must never be refrozen", true, "Thawed milk carries both rules together: use it within a day, and never return it to the freezer."],
    ["Warming milk in the microwave is fastest and keeps its protective parts intact", false, "Microwaving is prohibited: it destroys immune factors and creates hot spots that can burn the newborn."],
    ["Milk pumped in the morning can wait on the counter all day before storing", false, "Pumped milk is used or stored within 1 hour; an all-day counter wait breaks the first rule of the table."]
  ], "ANSWER KEY — Correct answers: room temperature 4 to 6 hours capped; refrigerator up to 96 hours; refrigerator freezer 2 weeks and deep freezer 6 months; thawed milk within 24 hours and never refrozen. DETAILED RATIONALE — Teaching items are checked statement by statement against the storage table. The two failures each break a named rule: the microwave prohibition and the 1-hour rule for using or storing pumped milk. PRIORITY FRAMEWORK — Patient teaching / evaluate understanding: correct statements are kept whole, wrong ones are corrected, not averaged.");

S(C6, "A mother watches her newborn feed and asks why the first part of the feeding looks watery while the baby seems satisfied only near the end. Which explanation is correct?", [
    ["The early milk quenches thirst, and the later milk is richer in fat and satisfies hunger, so feedings should last long enough to reach it", true, "Foremilk is the watery, thirst-quenching first milk; hindmilk is the higher-fat milk that satisfies hunger, which is why very short feedings are a problem."],
    ["The watery look means her milk has not come in properly yet, so she should pump and discard the first part of each feeding this week", false, "The watery first milk is a designed stage of every feeding, not a defect; discarding it removes the thirst-quenching part."],
    ["The baby is satisfied at the end because he is tired from sucking, not because the milk changes, so feeding length does not matter", false, "The milk does change across the feeding, and length matters precisely because the satisfying milk arrives later in it."],
    ["She should switch breasts every few minutes so the baby gets the rich milk from both sides before either side empties", false, "Switching early keeps the baby in the watery stage on both sides; a feeding side is finished before the switch is offered."]
  ], "ANSWER KEY — Correct answer: early milk quenches thirst, later milk is richer in fat and satisfies hunger. DETAILED RATIONALE — This pair explains two teaching points at once: why feedings are not cut short, and why skipped or very short feedings drop production, since supply follows the demand of milk actually removed. PRIORITY FRAMEWORK — Patient teaching: explain the mechanism in the order the baby experiences it.");

S(C6, "A nonnursing mother on day 3 has hard, painful breasts and asks what she should do. Which teaching is correct?", [
    ["Wear a supportive bra, use ice packs and analgesics for comfort, and avoid stimulating the nipples, because stimulation keeps lactation going", true, "Engorgement occurs in nonnursing mothers too; the plan is support, cold, and comfort, with no stimulation, while the breasts settle in about 1 to 2 weeks."],
    ["Pump both breasts twice a day to relieve the pressure, because leaving milk in a nonnursing breast will cause an infection", false, "Pumping removes milk and signals more production; for the mother who is not nursing, the breast must stay full to down-regulate supply."],
    ["Nurse the baby just until the hardness softens, then stop, because a partly emptied breast will stop making milk on its own", false, "Any regular removal restarts the supply-and-demand cycle she is trying to end; her plan avoids removal and stimulation together."],
    ["Take hot showers letting the water run over the breasts, because heat is the chapter's main treatment for breast hardness in any mother", false, "Heat promotes let-down and flow — useful before a feeding for a nursing mother, and the opposite of what a nonnursing mother needs."]
  ], "ANSWER KEY — Correct answer: supportive bra, ice, analgesics, and no nipple stimulation. DETAILED RATIONALE — The same hard breasts are treated in opposite directions depending on one detail: whether she is nursing. For the nursing mother, emptying is the treatment; for the nonnursing mother, emptying and stimulation prolong production, so comfort measures carry her through. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the feeding plan, not the breast finding, chooses the treatment.");
