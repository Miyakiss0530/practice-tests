BANK.push({ cat: C6, type: "dropdown", stem: "Complete each teaching statement about milk production with the correct choice.<br><br>The hormone that makes milk is produced by the<br>[[0]]<br><br>The hormone that releases milk in the let-down reflex comes from the<br>[[1]]<br><br>Milk production rises and falls mainly according to<br>[[2]]", blanks: [
  { o: [O("Anterior pituitary, which releases prolactin", true, "Prolactin, the milk-making hormone, comes from the anterior pituitary."), O("Posterior pituitary, which releases prolactin", false, "The posterior pituitary releases oxytocin; prolactin itself is an anterior pituitary hormone."), O("Placenta, which releases prolactin after birth", false, "Placental hormones blocked prolactin's effect during pregnancy; after the placenta delivers, production starts.")] },
  { o: [O("Posterior pituitary, which releases oxytocin", true, "Oxytocin from the posterior pituitary drives the let-down reflex that ejects milk into the ducts."), O("Anterior pituitary, which releases oxytocin", false, "The anterior pituitary makes prolactin; oxytocin is released from the posterior pituitary."), O("Breast tissue itself, which releases oxytocin", false, "The breast responds to oxytocin; it does not release it.")] },
  { o: [O("How much milk is removed, because supply follows demand", true, "Very little milk is stored between feedings; removal drives production, and skipped feedings drop it."), O("How much fluid the mother drinks each day", false, "Fluids support her, but the chapter's driver of production is milk removal, not intake volume."), O("How long each breast rests between feedings", false, "Rest without removal lowers production; the breast produces in response to being emptied.")] }
], tp: "ANSWER KEY — Correct answers: prolactin from the anterior pituitary makes milk; oxytocin from the posterior pituitary releases it; production follows milk removal. DETAILED RATIONALE — The memory pair is 'Prolactin Produces, Oxytocin pushes Out.' Swapping the glands is the classic trap, and the supply rule explains engorgement, weaning, and pumping teaching from one principle. PRIORITY FRAMEWORK — Patient teaching: anchor the pair once, then reuse it for every feeding decision." });

S(C6, "A mother who wants to wean her 8-month-old asks for the safest plan. Which teaching is correct?", [
    ["Drop one feeding at a time, starting with the feeding he cares about least and saving his favorite feeding for last", true, "Gradual weaning is the chapter's plan: one feeding at a time, least favorite first and favorite last, so supply steps down gently."],
    ["Stop all feedings on the same day, because a clean break ends production fastest and is easiest on her breasts", false, "Abrupt stopping is the uncomfortable route — supportive bra, ice, and analgesics — and is not the plan taught when time allows gradual."],
    ["Replace every feeding with pumped milk for a month, because his stomach needs a full month to adjust to any other milk", false, "Weaning replaces feedings with other nutrition and closeness; a month of pumping maintains the production she is ending."],
    ["Nurse only at night from now on, because night feedings do not count toward maintaining her milk supply", false, "Any feeding that remains maintains some demand; the gradual plan removes feedings by preference order, not by clock position."]
  ], "ANSWER KEY — Correct answer: wean gradually, one feeding at a time, least favorite first. DETAILED RATIONALE — Weaning follows the same supply-and-demand rule as building supply, run in reverse. Removing one feeding at a time lets production step down; abrupt stopping is managed with support, ice, and analgesics, and no pumping. PRIORITY FRAMEWORK — Patient teaching: give the plan in the order she will actually follow it.");

/* ===== C7 Bonding / Blues ===== */
S(C7, "A mother 10 hours after a long labor keeps handing her newborn back, holds him facing away, and asks the nurse to do his feeding and changing, saying, 'Just show me tomorrow.' Which interpretation and action are correct?", [
    ["This fits the taking-in phase: give her rest, food, and a chance to talk through the birth, and save the detailed teaching for when she starts reaching for the care herself", true, "Taking-in is passive, birth-story focused, and low in interest in learning; teaching saved for taking-hold is teaching that lands."],
    ["This is early rejection of the newborn: document poor bonding today and arrange for the newborn to stay in the nursery until she asks for him", false, "Dependence on others for the newborn's care is written into the taking-in phase itself; separation removes the contact that builds the tie."],
    ["This is the letting-go phase arriving early, because she is already giving up her old routine and handing his care to the staff", false, "Letting-go is about giving up the previous lifestyle and the fantasy child, not about handing a 10-hour-old newborn to the nurse."],
    ["She is ready for discharge teaching now, because a mother who asks few questions usually understands more than she shows", false, "Her behavior shows the opposite of readiness; nodding and quiet are not understanding, and this phase has little appetite for learning."]
  ], "ANSWER KEY — Correct answer: taking-in phase — support rest and listening, and time the teaching for taking-hold. DETAILED RATIONALE — Rubin's phases are a timing tool: taking-in (passive, retells the birth, wants food and sleep), taking-hold (initiates care, self-critical, ready to learn), letting-go (reconciles the real baby and real life with the fantasy). The same dependence that is normal in phase one would concern the nurse if it persisted as a pattern. PRIORITY FRAMEWORK — Patient readiness: the right teaching at the wrong phase is wasted teaching.");

S(C7, "On day 2, a mother is showering on her own, asks the nurse to show her how to bathe her newborn, and says, 'I keep doing it wrong, watch me and tell me.' Which response fits her phase?", [
    ["Teach now, using the moment: demonstrate, watch her practice, and reinforce what she does well, because she has entered the taking-hold phase", true, "Initiating care, asking to be shown, and criticizing her own ability are the taking-hold markers, and this phase is the chapter's teaching window."],
    ["Do the bath for her while she watches from the bed, because mothers this soon after birth should conserve energy for feeding only", false, "Doing it for her repeats the taking-in arrangement she has just grown out of; her request to practice is the cue to hand the care over."],
    ["Postpone the teaching until her 2-week visit, because hospital teaching this early is forgotten by the time she is home", false, "The chapter builds discharge teaching at every contact, and her readiness is highest now, in the phase that asks for it."],
    ["Reassure her that self-doubt means she is not ready, and ask her partner to learn the bath instead so it is done correctly", false, "Self-criticism is a phase marker, not a disqualification; routing the teaching around her undermines the confidence the phase builds."]
  ], "ANSWER KEY — Correct answer: teach now and reinforce her practice — she is in taking-hold. DETAILED RATIONALE — The flip from the previous pattern is the whole item: yesterday's 'show me tomorrow' was taking-in; today's 'watch me and tell me' is taking-hold. The nursing response flips with it, from protecting rest to structured, supportive teaching. PRIORITY FRAMEWORK — Patient readiness: match the teaching to the phase she is showing today.");

M(C7, "Which observations suggest a mother's bonding with her newborn is progressing? Select all that apply.", [
    ["She holds him face-to-face and makes eye contact while she talks to him", true, "En face holding with eye contact is one of the observed bonding behaviors in the chapter's assessment."],
    ["She points out that his chin looks like his father's and counts his fingers", true, "Claiming — naming his individual features and likening them to family — is a core bonding behavior."],
    ["She talks to him in a high-pitched voice while she holds him close", true, "Close holding with a high-pitched voice is part of the claiming and contact pattern the nurse watches for."],
    ["She asks that he spend the whole day in the nursery so she can rest", false, "A rest break with support is normal; a whole day of chosen separation removes the contact the assessment is looking for."],
    ["She has not yet commented on any of his features by day 2", false, "Silence about his features is the absence of claiming, one of the patterns that earns continued observation and support."],
    ["She lets her partner do all of the holding while she watches", false, "Watching a partner bond is not her own contact; her physical contact and interaction are what is being assessed."]
  ], "ANSWER KEY — Correct answers: en face eye contact, claiming his features, and close holding with a high-pitched voice. DETAILED RATIONALE — Bonding is assessed from what the nurse can observe: physical contact, eye-to-eye contact, claiming talk, and time spent interacting. Persistent indifference or rejection, as a pattern, is recorded and a social services referral is considered. PRIORITY FRAMEWORK — Assessment: judge the pattern of behaviors, never a single tired moment.");

S(C7, "A mother on day 5 is tearful and irritable and says she feels let down, but she smiles at her newborn, is enjoying her sister's visit, and her mood lifts between episodes. Which statement by the nurse is correct?", [

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { shuffle(q.opts); S.resp.push(-1); }
    else if (q.type === "multi") { shuffle(q.opts); S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { shuffle(q.blanks[k].o); d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}

  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
