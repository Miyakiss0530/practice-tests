<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Vital Signs Basics and Temperature";
var CB = "Fever, Temperature Measurement, and Stethoscope";
var CC = "Pulse and Apical Pulse";
var CD = "Respirations and Oxygen Saturation";
var CE = "Blood Pressure, Height and Weight";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 11,
  "types": {
   "single": 9,
   "multi": 2
  }
 },
 CB: {
  "name": CB,
  "count": 9,
  "types": {
   "single": 8,
   "multi": 1
  }
 },
 CC: {
  "name": CC,
  "count": 7,
  "types": {
   "single": 6,
   "multi": 1
  }
 },
 CD: {
  "name": CD,
  "count": 7,
  "types": {
   "single": 6,
   "multi": 1
  }
 },
 CE: {
  "name": CE,
  "count": 10,
  "types": {
   "single": 8,
   "multi": 2
  }
 }
};

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which statement most accurately describes what a baseline set of vital signs is used for?",
  opts: [ O("A first set taken at initial contact, compared with every later set of readings", true, "Correct. The baseline is obtained at initial contact and later readings are compared with it."), O("A single reading taken once, treated as proof that the patient is stable all day", false, "Incorrect. One set is a snapshot; values vary and are read with condition and history."), O("An average of readings from other patients of the same age on the same unit", false, "Incorrect. A baseline is this patient's own initial set, not a unit average."), O("A set taken only after surgery, used to judge whether anesthesia has worn off", false, "Incorrect. Baselines are taken at initial contact, before any procedure baseline is needed.") ],
  tp: "Baseline = first set at initial contact; every later reading is compared with it." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A temperature rise of 1 degree F is expected to change the other vital signs in which way?",
  opts: [ O("Pulse rises by about 4 beats per minute, and respirations and blood pressure rise too", true, "Correct. As printed: 1 degree F rise can increase pulse by 4 beats per minute; RR and BP also rise."), O("Pulse falls by about 4 beats per minute, and respirations and blood pressure fall too", false, "Incorrect. The direction is upward for pulse, respirations, and blood pressure."), O("Pulse stays unchanged, because temperature and pulse are regulated independently", false, "Incorrect. The chapter links a temperature rise to changes in the other vital signs."), O("Pulse rises by about 40 beats per minute, while respirations and blood pressure fall", false, "Incorrect. The printed pulse change is 4 beats per minute, not 40, and the others rise.") ],
  tp: "Trap number: 1 degree F up = pulse up about 4 beats/min; RR and BP rise as well." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which finding pattern matches the chapter description of hemorrhage?",
  opts: [ O("Blood pressure falls while pulse and respiratory rates rise and temperature falls", true, "Correct. With hemorrhage the BP falls, pulse and respirations increase, and temperature usually decreases."), O("Blood pressure rises while pulse and respiratory rates fall and temperature rises", false, "Incorrect. That reverses every direction the chapter gives for hemorrhage."), O("Blood pressure falls while pulse and respiratory rates fall and temperature rises", false, "Incorrect. Pulse and respirations rise to compensate; they do not fall."), O("Blood pressure stays normal while only the temperature changes in either direction", false, "Incorrect. Hemorrhage changes pressure, pulse, respirations, and temperature together.") ],
  tp: "Hemorrhage pattern: BP down, pulse up, respirations up, temperature usually down." });

BANK.push({ cat: CA, type: "multi", kt: [],
  stem: "Which are times the chapter lists for assessing vital signs? Select all that apply.",
  opts: [ O("On admission and discharge, and on a routine schedule ordered or set by policy", true, "Correct. Box 12.2 lists admission, discharge, and routine scheduled assessment."), O("Before and after surgery and before and after invasive diagnostic procedures", true, "Correct. Box 12.2 lists both surgical and invasive-procedure time points."), O("When the general condition changes, such as hemorrhage or loss of consciousness", true, "Correct. A change in condition is a listed trigger for vital sign assessment."), O("Only at the start of each shift, regardless of orders, procedures, or condition", false, "Incorrect. Frequency follows orders and policy, and many triggers occur mid-shift."), O("Only when the patient asks, because scheduled readings disturb rest and recovery", false, "Incorrect. Patient reports are one trigger, not the only time signs are taken.") ],
  tp: "Box 12.2 triggers: admission/discharge, routine schedule, surgery, procedures, medications, condition change, interventions, vague distress." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which statement about frequency of vital sign measurement is accurate for this chapter?",
  opts: [ O("Critical care and postanesthesia units may assess blood pressure every 5 minutes", true, "Correct. As printed, BP may be assessed as often as every 5 minutes in those units."), O("Long-term care and home patients are always assessed every 5 minutes around the clock", false, "Incorrect. In long-term care and home settings, signs may be assessed weekly."), O("Postoperative patients need readings only once a shift until they feel fully awake", false, "Incorrect. Postoperative or seriously ill patients need readings every 5 to 10 minutes until stable."), O("Every patient in every setting is assessed on the same fixed four-hour schedule", false, "Incorrect. Frequency is based on the patient's condition and the setting.") ],
  tp: "Frequency scales with acuity: every 5 min in critical care, every 5-10 min postop until stable, weekly in some long-term/home care." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "According to Table 12.1 as printed, which set matches the adult row?",
  opts: [ O("Heart rate 60 to 100, respirations 12 to 20, systolic 100 to 120, diastolic 70 to 80", true, "Correct. Those are the adult values printed in Table 12.1."), O("Heart rate 120 to 160, respirations 36 to 60, and a systolic pressure of only 20 to 60", false, "Incorrect. Those are the neonate values printed in Table 12.1."), O("Heart rate 90 to 120, respirations 20 to 30, and a systolic pressure of 80 to 100", false, "Incorrect. Those are the toddler values printed in Table 12.1."), O("Heart rate 60 to 100, respirations 12 to 18, systolic 130 to 140, diastolic 90 to 95", false, "Incorrect. That is the older adult row as printed, not the adult row.") ],
  tp: "Table 12.1 adult: HR 60-100, RR 12-20, BP systolic 100-120 / diastolic 70-80. Older adult BP is printed 130-140/90-95 - do not swap them." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Which statement about the hypothalamus and temperature is accurate?",
  opts: [ O("It balances heat lost and heat produced, and it sits in the brain at the third ventricle", true, "Correct. The hypothalamus regulates temperature and forms the floor and part of the lateral wall of the third ventricle."), O("It produces most body heat during exercise, digestion, and other metabolic activity daily", false, "Incorrect. A rise in metabolism generates heat; the hypothalamus regulates the balance."), O("It controls the respiratory rate, working together with the medulla oblongata center", false, "Incorrect. The medulla oblongata controls respiration; the hypothalamus regulates temperature."), O("It keeps surface temperature constant while allowing core temperature to vary widely", false, "Incorrect. Core temperature stays relatively constant; surface temperature varies with environment.") ],
  tp: "Hypothalamus = temperature regulator. Medulla oblongata = respiration control. Core stays constant; surface varies." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "Converting temperatures: which pair of formulas is printed in the chapter?",
  opts: [ O("Fahrenheit to Celsius: subtract 32, then multiply by 5/9; reverse: multiply by 9/5, add 32", true, "Correct. (98.6 - 32) x 5/9 = 37, and 37 x 9/5 + 32 = 98.6."), O("Fahrenheit to Celsius: add 32, then multiply by 5/9; reverse: multiply by 9/5, subtract 32", false, "Incorrect. The first step subtracts 32; adding 32 belongs to the reverse conversion."), O("Fahrenheit to Celsius: subtract 32, then multiply by 9/5; reverse: multiply by 5/9, add 32", false, "Incorrect. The fractions are swapped; F to C uses 5/9 and C to F uses 9/5."), O("Fahrenheit to Celsius: divide by 2 and add 30; reverse: subtract 30 and then double it", false, "Incorrect. That rough shortcut is not the formula the chapter prints.") ],
  tp: "Formulas: F to C = (F - 32) x 5/9. C to F = C x 9/5 + 32." });

BANK.push({ cat: CA, type: "multi", kt: [],
  stem: "Which factors that affect body temperature does Box 12.4 list? Select all that apply.",
  opts: [ O("Age, with labile regulation in infancy and a lower normal range in older adults", true, "Correct. Age is a listed factor at both ends of the lifespan."), O("Exercise, with prolonged strenuous exercise raising temperature as high as 105.8 F", true, "Correct. Prolonged strenuous exercise can temporarily raise temperature to 103.2-105.8 degrees F."), O("Diurnal variation, with the lowest reading between 1 and 4 a.m. each day", true, "Correct. The daily low averages 97.7 degrees F between 1 and 4 a.m., peaking at 4-6 p.m."), O("Hormonal changes during ovulation and menopause, and physical or emotional stress", true, "Correct. Hormonal influences and stress are both listed factors."), O("The color of the room and the type of thermometer used to take the reading", false, "Incorrect. Room color is not a factor, and the device affects accuracy, not body temperature.") ],
  tp: "Box 12.4 factors: age, exercise, hormones, diurnal variation, stress, environment, food/drink ingestion, smoking." });

BANK.push({ cat: CA, type: "single", kt: [],
  stem: "A night-shift worker sleeps during the day. Which statement about diurnal rhythm is accurate?",
  opts: [ O("The temperature cycle does not reverse at once; reversal generally takes 1 to 3 weeks", true, "Correct. Night workers' patterns do not reverse automatically; 1-3 weeks are needed."), O("The temperature cycle reverses on the first night shift, so readings can be compared", false, "Incorrect. Reversal is gradual over weeks, not immediate on the first shift."), O("Night workers have no diurnal variation at all, so time of day never matters for them", false, "Incorrect. The variation persists; it simply has not yet reversed to the new schedule."), O("The daily low moves to midday within two days, averaging 97.7 degrees at noon daily", false, "Incorrect. The printed low stays 1-4 a.m. on average until the cycle slowly reverses.") ],
  tp: "Diurnal trap: night-shift reversal takes 1-3 weeks, not one shift." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which statement accurately describes a constant fever, as the chapter classifies fevers?",
  opts: [ O("It remains elevated consistently over time and fluctuates very little from hour to hour", true, "Correct. A constant fever stays elevated with very little fluctuation."), O("It rises and falls each day, returning to normal or subnormal values in the morning", false, "Incorrect. That pattern is an intermittent fever, not a constant fever."), O("It fluctuates each day but never returns to normal until the patient becomes well again", false, "Incorrect. That pattern is a remittent fever, not a constant fever."), O("It alternates long periods of apnea with periods of deep and rapid breathing daily", false, "Incorrect. That describes Cheyne-Stokes respirations, a breathing pattern, not a fever.") ],
  tp: "Fever patterns: constant = stays up, little fluctuation. Intermittent = returns to normal/subnormal. Remittent = never returns to normal until well." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which set of signs belongs to Box 12.5, signs of elevated body temperature?",
  opts: [ O("Flushed warm skin, glassy eyes, headache, thirst, and increased pulse and respirations", true, "Correct. Box 12.5 lists flushed warm skin, glassy eyes/photophobia, headache, thirst, and faster pulse and respirations."), O("Pale cool skin, constricted pupils, slow pulse, and a strong appetite for large meals", false, "Incorrect. Elevated temperature produces flushed warm skin and anorexia, not cool pale skin and appetite."), O("Bradycardia, slow respirations, drowsiness from cold, and a temperature below 93 degrees", false, "Incorrect. Those point toward hypothermia, the opposite problem in this topic."), O("Cyanotic nail beds, stridorous respirations, confusion, and a productive morning cough", false, "Incorrect. Those are related signs of abnormal respirations in Box 12.12, not Box 12.5.") ],
  tp: "Box 12.5 fever signs: anorexia, flushed warm skin, glassy eyes/photophobia, headache, perspiration, faster pulse/RR, irritability or sleepiness, thirst." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which normal temperature values by site does Box 12.3 print?",
  opts: [ O("Oral 98.6, rectal 99.6, axillary 97.6, and tympanic or temporal 98.6 degrees F", true, "Correct. Box 12.3: oral 98.6, rectal 99.6, axillary 97.6, tympanic/temporal 98.6 degrees F."), O("Oral 99.6, rectal 98.6, axillary 98.6, and tympanic or temporal 97.6 degrees F", false, "Incorrect. Rectal is the higher reading and axillary the lower one; this set swaps them."), O("Oral 97.6, rectal 97.6, axillary 99.6, and tympanic or temporal 99.6 degrees F", false, "Incorrect. Axillary is 1 degree below oral, not the highest value in the box."), O("Oral 98.6, rectal 98.6, axillary 98.6, and tympanic or temporal 98.6 degrees F", false, "Incorrect. Only oral and tympanic/temporal share 98.6; rectal is higher and axillary lower.") ],
  tp: "Site normals (F): oral 98.6, rectal 99.6 (+1), axillary 97.6 (-1), tympanic/temporal 98.6." });

BANK.push({ cat: CB, type: "multi", kt: [],
  stem: "Which statements about temperature measurement sites are accurate? Select all that apply.",
  opts: [ O("Rectal readings run about 1 degree F higher than oral readings in the same patient", true, "Correct. Rectal is normally 1 degree F higher than oral."), O("Axillary readings run about 1 degree F lower than oral readings in the same patient", true, "Correct. Axillary is normally 1 degree F lower than oral."), O("The axillary method is the least accurate of the temperature measurement methods", true, "Correct. The chapter calls axillary the least accurate method."), O("Oral temperature may be used freely for a comatose or disoriented patient at any age", false, "Incorrect. Oral measurement requires cooperation and is not attempted on comatose or disoriented patients or small infants."), O("Rectal measurement is preferred right after rectal surgery or with a rectal tumor", false, "Incorrect. Rectal measurement is contraindicated after rectal surgery or with rectal disorders such as tumor or hemorrhoids.") ],
  tp: "Site rules: rectal +1, axillary -1 and least accurate; no oral for comatose/disoriented/infants; no rectal after rectal surgery/disorder." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which statement about tympanic temperature measurement is accurate?",
  opts: [ O("It measures infrared heat from the eardrum, which shares blood supply with the hypothalamus", true, "Correct. The tympanic membrane shares its blood supply with the hypothalamus, giving a core reading."), O("It measures heat from the skin of the forehead by brushing a sensor across the temple area", false, "Incorrect. That describes the temporal artery method, not the tympanic method."), O("It is the preferred method for infants younger than 6 months because it is most accurate", false, "Incorrect. Tympanic thermometers are suitable for all ages except infants less than 6 months."), O("Excessive cerumen improves the reading by holding heat close to the eardrum membrane", false, "Incorrect. Excessive cerumen can interfere with an accurate tympanic reading.") ],
  tp: "Tympanic: infrared from eardrum, core source; not for infants under 6 months; cerumen interferes; be indoors 10 min first." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "A patient just drank iced water. Which statement about the oral reading is accurate as printed?",
  opts: [ O("Iced water can shift an oral reading by 2.2 to 2.6 degrees F, so the nurse waits 20 to 30 minutes", true, "Correct. As printed, iced water shifts oral readings by 2.2-2.6 degrees F; wait 20-30 min after hot/cold intake or smoking."), O("Iced water changes an oral reading by only 0.2 degrees F, so the reading may be taken at once", false, "Incorrect. The 0.2 degree figure belongs to smoking; iced water shifts the reading far more."), O("Cold liquids affect only rectal readings, so an oral reading taken now is fully accurate", false, "Incorrect. Ingested hot or cold liquids are exactly why oral readings are delayed."), O("Waiting 5 to 10 minutes is enough for the mouth to return to a true temperature reading", false, "Incorrect. The printed wait after intake or smoking is 20-30 minutes; 5-10 min is the rest wait before respirations.") ],
  tp: "Wait traps: oral temp 20-30 min after intake/smoking; BP 30 min after caffeine/smoking; respirations 5-10 min rest after activity." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which statement about the stethoscope diaphragm and bell is accurate?",
  opts: [ O("The diaphragm transmits high-pitched sounds and is placed firmly; the bell transmits low-pitched sounds placed lightly", true, "Correct. Diaphragm = high-pitched, firm pressure. Bell = low-pitched, light placement; pressing the bell creates a diaphragm effect."), O("The diaphragm transmits low-pitched sounds placed lightly; the bell transmits high-pitched sounds placed firmly", false, "Incorrect. The two sides are swapped in this statement; diaphragm is high and firm, bell is low and light."), O("Both sides transmit the same sounds, so either side may be pressed with equal firm pressure", false, "Incorrect. The sides differ by pitch, and compressing the bell changes what it transmits."), O("The bell is covered with a thin plastic disk and must leave a red ring on the skin after use", false, "Incorrect. The diaphragm is the flat disk side that may leave a temporary red ring; the bell is bowl-shaped with a rubber ring.") ],
  tp: "Diaphragm: flat disk, high-pitched, firm (may leave red ring). Bell: bowl, low-pitched, light touch only." });

BANK.push({ cat: CB, type: "single", kt: [],
  stem: "Which statement about caring for a stethoscope is accurate?",
  opts: [ O("Earpieces are cleaned of cerumen and the chest piece of dust and oils after patient contact", true, "Correct. Clean earpieces regularly and bell/diaphragm after each patient contact for infection control."), O("The tubing should be cleaned with alcohol each day, because alcohol preserves the material", false, "Incorrect. Alcohol can dry and crack the material and is not recommended; mild soap and water are preferred."), O("Draping it around the neck next to the skin is the recommended way to carry it on the unit", false, "Incorrect. Do not drape it around the neck next to skin; carry it in your pocket."), O("Longer tubing improves sound, so tubing well over 18 inches gives the clearest heart sounds", false, "Incorrect. Tubing is usually 12-18 inches; longer tubing decreases sound transmission.") ],
  tp: "Stethoscope care: clean after each contact, mild soap and water (not alcohol), pocket not neck, tubing 12-18 inches." });

BANK.push({ cat: CC, type: "single", kt: [],

function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 12: Vital Signs - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
