<div id="app"></div>
<script>
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
function S(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "single", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
function M(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "multi", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
var C1 = "Uterus, Involution, and the Fundus Check";
var C2 = "Lochia — Reading the Discharge";
var C3 = "Routine Postpartum Assessment — BUBBLE-HE and Vital Signs";
var C4 = "Perineum, Cesarean Incision Care, and Postpartum Pain";
var C5 = "Circulation, Clots, Bladder, and Bowels";
var C6 = "Breasts and Breastfeeding Support";
var C7 = "Bonding, Blues, and Family Adaptation";
var C8 = "Discharge Teaching, Immunizations, and Contraception";
var CATS = [C1, C2, C3, C4, C5, C6, C7, C8];
var KEYTERMS = [];

/* ================= CASE STUDY 1 (CT-CASE1) — postpartum hemorrhage: boggy, displaced fundus ================= */
var CASE10_CT1 = "CASE STUDY — The Fundus That Would Not Stay Firm. Mrs. A. R., 34 years old, G5 P4, gave birth vaginally to twins 1 hour ago after a long labor; her uterus was greatly overdistended during the pregnancy. An oxytocin infusion is running. She has not emptied her bladder since before the birth. The nurse's assessment now: fundus boggy, about 3 cm above the umbilicus, and pushed to the right of midline; lochia heavy rubra with several large clots; one perineal pad saturated in 15 minutes; pulse 118, BP 104/68, respirations 20, temperature 37.2°C. She says she feels dizzy when she raises her head and complains of cramping.";

M(C1, "Which findings from this assessment require the nurse to act now? Select all that apply.", [
    ["Boggy fundus", true, "A soft uterus is not sealing the placental-site vessels — bleeding continues until tone returns."],
    ["Fundus pushed to the right of midline", true, "Deviation with height points to a full bladder displacing the uterus and blocking its contraction."],
    ["One pad saturated within 15 minutes", true, "That rate is the chapter's line for excessive bleeding — it sets the urgency of everything else."],
    ["Pulse of 118 beats/min", true, "Tachycardia after birth flags hypovolemia (or infection); the slow pulse is the normal one postpartum."],
    ["Dizziness when she raises her head", true, "A symptom that her volume loss is already affecting her — and it makes her a fall risk."],
    ["Cramping afterpains", false, "Afterpains are expected — stronger in multiparas and after an overdistended uterus; they are not the emergency here."],
    ["Blood pressure of 104/68", false, "This pressure is not yet abnormal; blood pressure is a late mover — her pulse and symptoms are telling the story first."],
    ["Temperature of 37.2°C", false, "She is afebrile; fever is not part of this picture."]
  ], "ANSWER KEY — Correct answers: boggy fundus, right-deviated fundus, pad saturated in 15 minutes, pulse 118, and dizziness. DETAILED RATIONALE — Cue recognition clusters the findings on one system: a uterus that is not contracting (boggy, displaced), the rate of loss (a pad in 15 minutes), and her body's response (rising pulse, dizziness). Background facts (parity, twins, long labor) explain her risk but are not cues to act on this minute. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): separate the findings that changed from the ones that are expected.", { scen: CASE10_CT1, grp: "CT-CASE1" });

S(C1, "Which explanation best accounts for ALL of this woman's findings together?", [
    ["Her uterus is too tired and stretched to contract well, and the full bladder beside it is holding it up and off to the side, so the placental site keeps bleeding", true, "One mechanism carries every cue: overdistension and fatigue weakened contraction, the bladder blocks what contraction remains, and the open vessels produce the flow, the clots, the pulse, and the dizziness."],
    ["A cervical or vaginal laceration is bleeding steadily lower down, and the fundus findings are a separate problem caused by the long labor", false, "Laceration bleeding is a trickle of bright red blood with a FIRM fundus; her fundus is boggy and displaced, which a laceration cannot explain."],
    ["She has developed a uterine infection from the long labor that is now preventing the uterus from contracting and is raising her pulse", false, "Infection needs time and signs — she is 1 hour post-birth and afebrile at 37.2°C; infection does not explain this picture."],
    ["The oxytocin infusion has stopped working because her body became used to it during the long labor, so the uterus no longer responds to it", false, "The problem is mechanical and muscular — a stretched, tired uterus plus a blocking bladder — not drug tolerance; the infusion is still part of the treatment."]
  ], "ANSWER KEY — Correct answer: the overdistended, fatigued uterus cannot contract, and the full bladder is displacing it. DETAILED RATIONALE — Analysis must explain every cue with one mechanism: tone (boggy), position (high and right = bladder), flow (heavy, clots, a pad in 15 minutes), and compensation (pulse 118, dizziness). Laceration and infection each fail at least one cue. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): one mechanism must carry every finding.", { scen: CASE10_CT1, grp: "CT-CASE1" });

S(C1, "Which action should the nurse take FIRST for this woman?", [
    ["Massage the fundus — one hand anchoring the lower uterus just above the symphysis pubis — until the uterus is firm", true, "With bleeding at the excessive rate and her pulse already up, restoring tone is the fastest way to close the placental-site vessels; the anchor hand protects the lower uterus while she massages."],
    ["Assist her to the bathroom to empty her bladder first, then reassess the fundus for firmness, height, and position", false, "The bladder does need emptying and it belongs to this same response — but she is dizzy and bleeding at the excessive rate, so tone comes first; voiding follows immediately, in bed if needed."],
    ["Increase the oxytocin infusion rate as ordered and recheck the fundus and pad in 30 minutes", false, "The infusion is already running and is not a substitute for hands on a boggy uterus; a 30-minute gap lets the loss continue at the excessive rate."],
    ["Apply a clean pad, weigh it to quantify the loss, and notify the provider of the amount", false, "Quantifying and reporting matter, but they measure and announce a problem nobody has treated yet — hands first, then measure and report."]
  ], "ANSWER KEY — Correct answer: massage the fundus to firmness first, with the lower uterus supported. DETAILED RATIONALE — She is past the 'void and reassess' situation: the flow is at the excessive rate (a pad in 15 minutes) and her pulse and dizziness show the loss is registering. Tone first, then expel clots, empty the bladder, and recheck on the 15-minute clock. PRIORITY FRAMEWORK — ABCs / circulation first: stop the ongoing loss before measuring it.", { scen: CASE10_CT1, grp: "CT-CASE1" });

BANK.push({ cat: C1, type: "order", stem: "The nurse performs fundal massage on this woman. Place the steps of safe fundal massage in the correct order.", items: [
  { t: "Lower the perineal pad and observe the lochia as the fundus is checked", r: "First — the fundus and lochia are always read together; the pad comes down before palpation so the flow is seen, not guessed." },
  { t: "Place one hand just above the symphysis pubis to anchor and support the lower uterus", r: "Second — the supporting hand stays in place so the uterus is never pushed down unsupported, which can invert it." },
  { t: "Palpate and massage the fundus with a firm circular motion until it becomes firm", r: "Third — massage continues until tone is achieved; firmness is the goal of the whole maneuver." },
  { t: "Once the uterus is firm, gently push down to expel the pooled blood and clots", r: "Fourth — clots are expelled only after firmness, so the uterus stays contracted behind them as they leave." }
], tp: "ANSWER KEY — Correct order: observe the lochia with the pad lowered → anchor the lower uterus above the symphysis pubis → massage with a firm circular motion until firm → gently push down to expel pooled blood and clots. DETAILED RATIONALE — The sequence is protective: see the flow, support the lower segment, create tone, and only then empty the cavity. Pushing down before firmness — or on an unsupported uterus — is how a uterus gets inverted. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): the order of the steps is itself a safety intervention.", scen: CASE10_CT1, grp: "CT-CASE1" });

S(C1, "Twenty minutes later the fundus is firm and midline and she has voided, but at the next check the fundus is boggy again despite massage. Which additional action should the nurse take?", [
    ["Give the ordered methylergonovine (Methergine), the uterotonic used when massage alone does not keep the uterus firm", true, "The chapter's ladder: massage first, and when massage alone cannot hold tone, the ordered methylergonovine is the next rung."],
    ["Continue massage continuously for the next hour, since persistence eventually restores lasting tone", false, "Massage that cannot hold firmness has already declared its limit; an hour of it delays the drug that addresses the problem."],
    ["Place a cold pack on the abdomen over the uterus to stimulate contraction the way cold firms tissue", false, "Cold is a perineal measure in this chapter, not a uterotonic — it does not contract a uterus."],
    ["Encourage her to rest and sleep, and recheck the fundus at the next routine round in 4 hours", false, "A uterus that re-softens after massage is a report-and-treat finding, not a wait-for-rounds finding."]
  ], "ANSWER KEY — Correct answer: give the ordered methylergonovine. DETAILED RATIONALE — Generate solutions means climbing the ladder the chapter builds: massage, bladder emptying, breastfeeding's natural oxytocin, and ordered uterotonics — methylergonovine is the one named for a uterus that massage cannot keep firm. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): match the next action to the step that just failed.", { scen: CASE10_CT1, grp: "CT-CASE1" });

S(C1, "Thirty minutes later: fundus firm and midline at the umbilicus, a fresh pad shows a light stain after 15 minutes, pulse is 90, and she denies dizziness. Which evaluation is correct?", [
    ["The plan worked — tone is restored, the flow rate has dropped well below the excessive line, and her pulse and symptoms have reversed", true, "Evaluate cue by cue against the starting picture: boggy/high/right becomes firm/midline; a pad in 15 minutes becomes a light stain in 15; pulse 118 becomes 90; dizzy becomes denies. Every goal is met."],
    ["The light stain means blood is now collecting inside the uterus instead, so the improvement should not be trusted without an ultrasound", false, "Concealed collection would keep her fundus abnormal and her pulse up; both have normalized along with the pad."],
    ["Her pulse of 90 is still abnormal postpartum, so the episode should be treated as unresolved", false, "The expected resting pulse early postpartum is 50–60, but evaluation follows the trend: 118 falling to 90 with a firm fundus is recovery, not deterioration."],
    ["She should now be moved to routine checks every 4 to 6 hours with no further close observation", false, "A uterus that softened twice earns continued close surveillance; stepping monitoring down is right, switching it off is not."]
  ], "ANSWER KEY — Correct answer: the interventions were effective — each original cue has reversed. DETAILED RATIONALE — Evaluation compares the after-picture with the before-picture item by item rather than by a single number. When tone, rate, pulse, and symptoms all reverse, the plan is judged effective and monitoring steps down, not off. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): judge the response against each original cue.", { scen: CASE10_CT1, grp: "CT-CASE1" });

/* ================= C1 standalone ================= */
S(C1, "At a home visit on postpartum day 5, the nurse palpates a woman's fundus at the level of the umbilicus, and her lochia is still red and moderate. She feels well and is afebrile. Which interpretation is correct?", [
    ["Involution is behind schedule — by day 5 the fundus should sit about 4 to 5 cm below the umbilicus and the lochia should have lightened, so this needs provider evaluation", true, "The yardstick is descent of about 1 cm a day with the lochia lightening on the same schedule; a fundus still at the umbilicus with red flow on day 5 has fallen off both."],
    ["This is expected — the fundus normally stays at the umbilicus for most of the first week and the lochia stays red for about two weeks, so nothing about it needs follow-up at this point", false, "Red lochia belongs to roughly the first 3 days, and the fundus leaves the umbilicus within the first day, descending daily after that."],
    ["Her bladder is probably full from the day's fluids — have her void and the fundus will settle back to its expected position", false, "A full bladder pushes the fundus up AND off to one side, usually the right; this fundus is midline, and a bladder does not explain five days of red flow."],
    ["The red flow means she is menstruating again, which can start as early as the first week after birth in some women", false, "Menstruation resumes at about 5 weeks in a woman who is not breastfeeding and about 8 weeks if she is — not on day 5."]
  ], "ANSWER KEY — Correct answer: involution is behind schedule and needs provider evaluation. DETAILED RATIONALE — Involution runs on a timetable: about 1 cm of descent per day, fundus no longer palpable by about day 10, lochia moving red to pink to white on schedule. A day-5 fundus at the umbilicus with red lochia is the pattern of subinvolution — the uterus is not returning to size on schedule. PRIORITY FRAMEWORK — Assessment accuracy: compare the finding against the normal timetable before naming a cause.");

M(C1, "Which fundal findings should the nurse act on or escalate? Select all that apply.", [
    ["Fundus that will not stay firm after massage", true, "A uterus that cannot hold tone after massage is a report finding — it is the chapter's named escalation trigger."],
    ["Fundus higher at this check than it was at the previous check", true, "The fundus should only move DOWN, about 1 cm a day; a rising fundus means blood or bladder is pushing it up."],
    ["Fundus high and pushed to the right in a woman who has not voided since delivery", true, "The full-bladder pattern — act by emptying the bladder first, then reassess before escalating further."],
    ["Fundus not palpable abdominally on postpartum day 10", false, "That is the schedule working — by about day 10 the fundus should be gone from the abdomen."],
    ["Fundus firm and midline at the umbilicus 1 hour after a vaginal birth", false, "Right after birth the fundus sits midline at or below the umbilicus, firm and about grapefruit size — the expected starting point."],
    ["Fundus one finger's width lower than at yesterday's check on day 3", false, "Descent of about one finger's width (1 cm) per day is exactly the expected rate of involution."]
  ], "ANSWER KEY — Correct answers: the fundus that will not stay firm, the rising fundus, and the high right-deviated fundus with no voiding. DETAILED RATIONALE — The fundus check asks three questions — firmness, height, position — and each wrong answer has its own first move: report the one that will not stay firm, find the blocker behind the one that rises, and empty the bladder behind the one that deviates. Findings that match the timetable are documented, not acted on. PRIORITY FRAMEWORK — Assessment: sort findings into 'matches the timetable' versus 'breaks it.'");

S(C1, "A woman who had a cesarean birth through a vertical abdominal incision needs her fundus checked. Which technique is correct?", [
    ["'Walk' the fingers from the side of the midline in toward the uterus; if the fundus is firm at the expected level, massage is not needed", true, "With a vertical incision the check approaches from the side of the midline; a firm fundus at the expected height needs documentation, not massage."],
    ["Palpate firmly straight down the midline directly over the incision until the fundus is located, then massage it firmly in a circular motion", false, "Pressing down the fresh vertical incision is the approach this technique exists to avoid, and a firm fundus does not get massaged."],
    ["Skip fundal checks after cesarean birth because the uterus was emptied and inspected at surgery", false, "Cesarean mothers are checked like everyone else — the uterus can still soften and bleed after surgery."],
    ["Massage the fundus at every check after cesarean birth to make up for the interrupted abdominal muscles", false, "Massage answers a boggy fundus only; a firm fundus at the expected level is left alone."]
  ], "ANSWER KEY — Correct answer: walk the fingers in from the side of the midline, and do not massage a firm fundus. DETAILED RATIONALE — The cesarean fundus check protects the incision while asking the same three questions — firmness, height, position. Technique changes with the incision; the standard for the answers does not. PRIORITY FRAMEWORK — Assessment before implementation: the finding decides the action, not the route of birth.");

/* ================= C2 — Lochia ================= */
S(C2, "Two hours after a vaginal birth, a woman's fundus is firm and midline at the umbilicus, but the nurse notes a steady trickle of bright red blood from the vagina that does not slow. Which conclusion should the nurse draw?", [
    ["The bleeding is most likely coming from a cervical or vaginal laceration, because the uterus itself is contracted — the provider should be notified", true, "The chapter's sorting rule: a trickle of brighter red blood with a FIRM fundus points away from the uterus and toward a laceration."],
    ["The uterus is bleeding from the placental site and the fundus finding must be wrong, so vigorous fundal massage should begin at once", false, "Placental-site bleeding comes with a soft, uncontracted uterus; this fundus is firm and midline, so the source sits lower."],
    ["This is normal rubra for the first day after a vaginal birth and should be documented without further action", false, "Rubra is red flow, but a continuous unslowing trickle is a pattern to explain, not a stage to chart."],
    ["Retained placental fragments are preventing full contraction, so a uterotonic should be requested from the provider", false, "Retained fragments declare themselves through a uterus that cannot stay contracted; this uterus is firm."]
  ], "ANSWER KEY — Correct answer: suspect a cervical or vaginal laceration and notify the provider. DETAILED RATIONALE — Read the fundus and the flow as one picture: firm fundus plus a steady bright trickle means the uterus has done its job and the blood is coming from below it. A boggy fundus with heavy flow would reverse the conclusion. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the combination of findings, not either one alone, names the source.");

S(C2, "Six hours after a cesarean birth, a first-time mother says, 'My sister bled a lot more than this after her baby. Is something wrong — I have almost no discharge.' Her fundus is firm, her vital signs are stable, and her pad shows a small amount of red lochia. Which response is correct?", [
    ["Reassure her: cesarean mothers typically have less lochia in the first 24 hours because the uterine cavity was sponged during surgery", true, "Less lochia in the first day after cesarean is the chapter's expected pattern — the cavity was cleaned at surgery; her firm fundus and stable signs fit it."],
    ["Suspect blood retained inside the uterus and notify the provider immediately for further evaluation", false, "Retained blood is the worry when there is NO lochia at all together with other abnormal findings; she has some lochia, a firm fundus, and stable signs."],
    ["Explain that the lochia will start once she begins walking and moving around, and encourage her to ambulate tonight for that reason", false, "Ambulation matters for clots and bowels, but the difference from her sister is explained by the surgery, not by her activity level."],
    ["Document possible infection and report it, because absent lochia in the first day can mean infection is present", false, "Infection is one cause of truly absent lochia — but she is not absent, she is light, afebrile, and otherwise normal; light-after-cesarean is expected."]
  ], "ANSWER KEY — Correct answer: less lochia in the first 24 hours is expected after cesarean birth. DETAILED RATIONALE — The same finding means different things by route of birth: the uterine cavity was sponged at cesarean surgery, so early lochia runs lighter than after a vaginal birth. Truly NO lochia at all is the abnormal version of this finding. PRIORITY FRAMEWORK — Assessment accuracy: interpret the finding against the patient's own context before alarming her.");

M(C2, "During a routine postpartum round, the nurse assesses several women's lochia. Which lochia findings must the nurse report? Select all that apply.", [
    ["A foul odor to the lochia", true, "Lochia should smell fleshy, like a menstrual flow; a foul odor is the chapter's infection flag."],
    ["Bright red bleeding returning after the lochia had lightened to pink", true, "The sequence only moves forward — red returning after serosa is a named report finding."],
    ["A pad saturated within 15 minutes", true, "That rate defines excessive bleeding and starts the 15-minute recheck pattern."],
    ["No lochia at all on the first postpartum day", true, "Absent lochia can mean blood retained in the uterus or infection — it is abnormal, not a bonus."],
    ["A few small clots during the first day", false, "A few small clots can be normal; it is many clots or large clots that get reported."],
    ["Flow that is briefly heavier the first time she stands up", false, "Blood pools in the vagina while she lies flat and drains when she stands — an expected brief increase."],
    ["Pinkish discharge on postpartum day 5", false, "Day 5 sits inside the serosa window (about day 3 through day 10) — pinkish is on schedule."]
  ], "ANSWER KEY — Correct answers: foul odor, bright red returning after lightening, a pad saturated in 15 minutes, and no lochia at all. DETAILED RATIONALE — Lochia is judged on five features — character, amount, color, odor, clots — and each feature has a report line: odor turns foul, color runs backward, amount hits a pad in 15 minutes, clots turn many or large, or the flow stops entirely. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): know each feature's normal range so the abnormal one stands out.");

S(C2, "The nurse checks a woman 3 hours after a vaginal birth. Her fundus is firm and midline. Her perineal pad, changed 1 hour ago, shows a stain just under 4 inches. Which documentation of the amount is correct?", [
    ["Light — about 10 to 25 mL in the hour", true, "The 1-hour stain guide: under 2 inches is scant (about 10 mL), under 4 inches is light (10–25 mL), under 6 inches is moderate (25–50 mL), over 6 inches is large/heavy (50–80 mL)."],
    ["Scant — under 10 mL in the hour", false, "Scant is a stain under 2 inches in an hour; this stain is bigger than that."],
    ["Moderate — about 25 to 50 mL in the hour", false, "Moderate is a stain under 6 inches; assigning it here overstates the loss by a full category."],
    ["Heavy — about 50 to 80 mL in the hour", false, "Heavy is a stain over 6 inches in the hour — nearly double the stain described."]
  ], "ANSWER KEY — Correct answer: light, about 10 to 25 mL in the hour. DETAILED RATIONALE — Amount is charted with the chapter's own yardstick, the 1-hour stain guide, so that every nurse reading the chart pictures the same loss. Guessing a category either hides bleeding or cries wolf. PRIORITY FRAMEWORK — Assessment accuracy: measure with the standard scale before judging the finding.");

BANK.push({ cat: C2, type: "dropdown", stem: "A nurse is teaching a new mother the lochia sequence she should expect at home. For each postpartum day, choose the discharge that belongs there.<br><br>Day 1 after birth<br>[[0]]<br><br>Day 9 after birth<br>[[1]]<br><br>Day 18 after birth<br>[[2]]", blanks: [
  { o: [O("Rubra", true, "Day 1 is rubra — red and mostly blood, the fresh shedding from the placental site, for about the first 3 days."), O("Serosa", false, "Serosa is the pinkish stage, about day 3 through day 10 — too late for day 1."), O("Alba", false, "Alba is the late white stage, about day 10 through day 21.")] },
  { o: [O("Serosa", true, "Day 9 sits inside the serosa window, about day 3 through day 10, when the flow is pinkish blood and mucus and lightens."), O("Rubra", false, "Rubra ends at about day 3; red flow still present on day 9 would be behind schedule."), O("Alba", false, "Alba begins around day 10; day 9 is just ahead of it.")] },
  { o: [O("Alba", true, "Day 18 is alba — clear or white, mostly mucus, the late healing stage from about day 10 through day 21."), O("Rubra", false, "Bright red on day 18 would be bleeding returning after lightening — a report finding, not a stage."), O("Serosa", false, "Serosa ends around day 10; day 18 belongs to alba.")] }
], tp: "ANSWER KEY — Correct answers: day 1 = rubra; day 9 = serosa; day 18 = alba. DETAILED RATIONALE — The sequence only moves one direction — red, then pink, then white — on a roughly first-3-days / day-3-to-10 / day-10-to-21 timetable. A mother who knows the schedule can spot the two danger patterns herself: flow that runs backward to red, and flow that stops entirely. PRIORITY FRAMEWORK — Patient teaching: give her the timetable so she can monitor her own healing at home." });

S(C2, "A woman stands up for the first time 4 hours after a vaginal birth and a gush of lochia runs down her leg. She is frightened. Her fundus is firm and midline, and the total amount is moderate. Which action is correct?", [
    ["Reassure her that blood pooled in the vagina while she was lying flat and drains on standing, help her clean up, and continue routine assessment", true, "A brief gush on first standing is the chapter's expected pooling pattern — with a firm fundus and a moderate total, the picture is normal."],
    ["Return her to bed at once, massage the fundus, and begin the 15-minute recheck cycle used for excessive bleeding, checking her vital signs each time", false, "That response belongs to a pad saturated in 15 minutes with a soft fundus; neither feature is present here."],
    ["Notify the provider that she may have a vaginal laceration that opened under pressure when she stood up", false, "Laceration bleeding is a steady bright trickle with a firm fundus — a one-time gush on standing with a moderate total is pooling."],
    ["Weigh all of her pads from the last 4 hours to calculate her total measured blood loss since delivery", false, "Weighing quantifies ongoing concern; a single explained gush with a firm fundus and moderate amount does not trigger a loss calculation."]
  ], "ANSWER KEY — Correct answer: reassure her — this is pooled blood draining on standing. DETAILED RATIONALE — Position changes the flow without changing the bleeding: blood collects in the vagina while she lies flat and empties when she stands. The discriminating data are the firm midline fundus and the moderate total amount. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): explain the finding with the whole picture before escalating it.");

S(C2, "A woman is using perineal pads that contain cold packs. The nurse estimates her lochia from the pad's appearance and charts 'light,' but the charge nurse questions the estimate. What is the concern?", [
    ["Pads with cold or warm packs inside absorb less, so the stain understates the loss — the pads should be counted or weighed to quantify it", true, "The chapter warns that pack-containing peripads absorb less; weighing converts the loss to volume at about 1 g = 1 mL and removes the guesswork."],
    ["Cold packs thin the lochia as they melt, so the stain spreads wider across the pad and the total loss is actually overstated, not understated", false, "The problem runs the other way — reduced absorbency makes the visible stain smaller than the true loss."],
    ["Cold packs are contraindicated while lochia is flowing because the cold slows uterine involution", false, "Cold packs are a first-day perineal comfort measure in this chapter; the issue is measurement, not safety."],
    ["Lochia estimates are unreliable in every patient, so amounts should never be charted in the record", false, "Amounts are charted at every assessment — the fix for a doubtful estimate is a better method (count or weigh), not silence."]
  ], "ANSWER KEY — Correct answer: pack-containing pads absorb less, so count or weigh the pads instead. DETAILED RATIONALE — Every estimate is only as good as its tool. When the tool changes — a peripad with a cold or warm pack inside — the stain-size guide no longer applies cleanly, and the objective methods (counting, weighing at 1 g ≈ 1 mL) take over. PRIORITY FRAMEWORK — Assessment accuracy: match the measurement method to the equipment actually in use.");

S(C2, "On postpartum day 10, a woman's lochia had become white and scant. Today she calls the unit: after carrying laundry up two flights of stairs, she is passing bright red blood again. Which advice is correct?", [
    ["Bright red bleeding returning after the lochia had lightened is a report finding — she should be evaluated rather than reassured", true, "Whatever the trigger, red flow after the sequence had advanced to alba is one of the chapter's named danger signs for discharge teaching."],
    ["This is expected, because lochia flow normally increases with exercise and activity", false, "Activity does raise normal flow — but it does not turn white lochia back to bright red; the color reversal is the flag, not the amount."],
    ["She has probably started her first menstrual period, which is common at about 10 days", false, "Menstruation resumes at about 5 weeks if she is not breastfeeding and about 8 weeks if she is — day 10 is far too early."],
    ["She should rest tonight, put on a fresh pad to measure the flow, and call back only if the red flow is still present or heavier in the morning", false, "A named danger sign is evaluated when it is reported; an overnight delay gambles on a bleeding problem stopping by itself."]
  ], "ANSWER KEY — Correct answer: bright red bleeding after the lochia had lightened must be evaluated. DETAILED RATIONALE — Two true facts compete here: flow rises with activity, and red-after-lightening is a report finding. The second one governs, because the sequence is only supposed to move forward. PRIORITY FRAMEWORK — Safety: when a benign explanation and a danger sign both fit, act on the danger sign.");

/* ================= C3 — BUBBLE-HE and Vital Signs ================= */
S(C3, "The nurse must decide which of four postpartum women to assess first at the start of the shift. Which woman takes priority?", [
    ["A woman on day 2 with a temperature of 38.7°C and a pulse of 118", true, "Fever above 38°C plus tachycardia is the flag pair for infection or hypovolemia — the two postpartum problems that cannot wait for rounds order."],
    ["A woman 36 hours after birth with a pulse of 54 who is resting comfortably", false, "A pulse of 50–60 in the first 48 hours is the expected postpartum bradycardia, not a problem to lead the shift with."],
    ["A woman on day 1 whose white blood cell count is 17,500/mm³ and who is afebrile", false, "A WBC of 12,000–20,000/mm³ is expected after birth from the stress and inflammation of labor; without fever it is not a flag."],
    ["A woman on day 1 with cramping pain each time she breastfeeds", false, "Afterpains that strengthen during breastfeeding are expected — suckling releases oxytocin; they fade within about 48 hours."]
  ], "ANSWER KEY — Correct answer: the day-2 woman with fever 38.7°C and pulse 118. DETAILED RATIONALE — Priority setting here is mostly about knowing which numbers are normal postpartum: the slow pulse and the high white count are expected findings wearing alarming costumes, while fever plus a fast pulse is the genuine flag. PRIORITY FRAMEWORK — Prioritize Hypotheses (Clinical Judgment): separate expected postpartum physiology from the findings that signal infection or volume loss.");

M(C3, "Which findings in the first 2 days after birth are EXPECTED and do not need to be reported? Select all that apply.", [
    ["Pulse of 56 beats/min at 24 hours", true, "Bradycardia of 50–60 beats/min for about the first 48 hours is expected — the higher stroke volume after birth slows the rate."],
    ["Urine output of about 2,800 mL over the second day", true, "Postpartum diuresis unloads pregnancy's extra fluid; output can reach about 3,000 mL/day."],
    ["White blood cell count of 18,000/mm³ on day 1", true, "The WBC may run 12,000–20,000/mm³ from the stress and inflammation of birth without infection being present."],
    ["Respirations of 16 breaths/min", true, "Respirations of 12–20/min are the expected range postpartum."],
    ["Temperature of 38.9°C on day 2", false, "Fever higher than 38°C (100.4°F) is a report finding at any point after birth."],
    ["Pulse of 124 beats/min at rest", false, "Tachycardia is never the expected postpartum pulse — it flags infection or hypovolemia."]
  ], "ANSWER KEY — Correct answers: pulse 56, urine output about 2,800 mL/day, WBC 18,000, and respirations 16. DETAILED RATIONALE — The postpartum body runs numbers that would alarm in any other patient: a slow pulse, liters of urine, and a white count near 20,000 can all be normal recovery. The two findings that never belong are fever over 38°C and a fast pulse. PRIORITY FRAMEWORK — Assessment accuracy: judge every value against postpartum norms, not general adult norms.");

S(C3, "A breastfeeding mother is due for her ordered pain medication. She is about to put the baby to the breast. When should the nurse give the medication?", [
    ["Immediately after the breastfeeding session, so the least amount of drug reaches the newborn", true, "The chapter's timing rule for analgesics in a nursing mother: dose right after a feeding to maximize the interval before the next one."],
    ["Immediately before the session, so she is comfortable and relaxed while she nurses", false, "Comfort matters, but dosing just before a feeding puts the drug's peak closest to the baby's intake — the timing works against the newborn."],
    ["At the midpoint of the session, splitting the exposure between two feedings", false, "There is no split-exposure strategy in the chapter; the rule is simply after the feeding."],
    ["Only after she has weaned, because analgesics cannot be given while breastfeeding", false, "Analgesics are used postpartum with timing precautions; withholding pain relief until weaning is neither required nor kind."]
  ], "ANSWER KEY — Correct answer: give the medication immediately after breastfeeding. DETAILED RATIONALE — The same dose can be timed well or badly. Dosing right after a feeding gives the longest drug-free interval before the baby eats again, which is why the chapter pairs every analgesic order in a nursing mother with this timing rule. PRIORITY FRAMEWORK — Safety: schedule the intervention to minimize the second patient's exposure.");

BANK.push({ cat: C3, type: "matrix", stem: "During one BUBBLE-HE round, the nurse makes four findings on four different women. Match each finding to the correct response.", cols: ["Massage the fundus until it is firm", "Help her empty her bladder, then reassess", "Report the finding to the provider now", "Reassure her and document it as expected"], rows: [

S(C3, "Thirty minutes after receiving her ordered analgesic, a cesarean mother still rates her pain 8 of 10. She is grimacing and keeps shifting position in bed. Which conclusion and action are correct?", [
    ["Her pain goal is not met — reassess and intervene per orders; the goal is pain under 3 without grimacing or repositioning", true, "The chapter's care-plan goal is explicit: pain rated <3 (or acceptable) with no grimacing, moaning, or frequent repositioning. At 30 minutes — the reassessment point — she meets none of it."],
    ["The medication needs more time to work; reassess her again in 4 hours at the next routine round", false, "Reassessment is set at 30 minutes after analgesics precisely so a failed dose is caught and acted on, not carried for hours."],
    ["Her behavior shows the pain is mostly anxiety about the incision, so offer reassurance and a quiet, dim room instead of more medication", false, "Grimacing and repositioning are the chapter's own objective markers of unrelieved pain; relabeling them as anxiety dismisses the assessment."],
    ["She should be taught to wait until pain is severe before asking for more, so each dose of medication lasts longer", false, "The teaching runs the opposite way — call when pain FIRST becomes uncomfortable, because severe pain is much harder to relieve."]
  ], "ANSWER KEY — Correct answer: the pain goal is unmet at the 30-minute reassessment — reassess and intervene. DETAILED RATIONALE — Pain is managed against a written target: a rating under 3 or 'acceptable,' with no grimacing, moaning, or frequent repositioning, checked 30 minutes after each dose. Her numbers and her body both say the dose failed. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): compare the response with the goal, not with the clock.");

S(C3, "A provider's postpartum order set for a woman with perineal pain includes aspirin. Based on this chapter's guidance, which action should the nurse take?", [
    ["Question the order — aspirin is not used postpartum in this chapter's guidance because it interferes with blood clotting", true, "The chapter's safety rule is explicit: aspirin is avoided after birth because of its effect on clotting, in a period when bleeding and clot balance are both delicate."],
    ["Give the aspirin as ordered, because it is the strongest available option for the inflammation and swelling of a healing perineum", false, "Strength is not the issue — the chapter removes aspirin from the postpartum analgesic list entirely."],
    ["Give the aspirin but time it right after breastfeeding so the baby is protected from exposure", false, "The after-feeding timing rule manages newborn exposure; it does not fix a drug the chapter says not to use postpartum at all."],
    ["Hold the aspirin only if her lochia becomes heavy, and give it on the days when her flow is light", false, "The guidance is not conditional on flow — aspirin is simply not part of postpartum analgesia in this chapter."]
  ], "ANSWER KEY — Correct answer: question the order; aspirin is avoided postpartum because it interferes with clotting. DETAILED RATIONALE — Nurses are the last check on an order set. This chapter's analgesic ladder runs from acetaminophen to combination narcotics, and aspirin is deliberately absent from it for a clotting reason. PRIORITY FRAMEWORK — Safety: verify every order against the population-specific rules before giving it.");

M(C3, "Which assessments belong in a complete routine postpartum (BUBBLE-HE) check? Select all that apply.", [
    ["Breasts, including the nipples, for redness, fissures, and soreness", true, "B is Breasts — consistency plus nipple condition at every check."],
    ["Fundus for firmness, height, and position", true, "U is Uterus — the three-part fundal question at every check."],
    ["Lochia for character, amount, color, odor, and clots", true, "L is Lochia — all five features, checked together with the fundus."],
    ["Legs for discomfort on dorsiflexion plus redness, tenderness, warmth, and circumference", true, "H is the legs — discomfort on dorsiflexion plus the visible and palpable clot signs."],
    ["Emotions and her interaction with the newborn", true, "E is Emotions/bonding — how she is coping and connecting rounds out every check."],
    ["The newborn's cord stump and temperature", false, "Those belong to the newborn's assessment, not to the mother's BUBBLE-HE — a complete maternal check does not include them."]
  ], "ANSWER KEY — Correct answers: breasts and nipples, fundus, lochia (all five features), legs, and emotions/bonding. DETAILED RATIONALE — BUBBLE-HE is the safety net that catches hemorrhage, infection, and clots early: Breasts, Uterus, Bladder, Bowels, Lochia, Episiotomy (perineum), Homans' sign, Emotions. A check that skips an area leaves the net with a hole in it. PRIORITY FRAMEWORK — Assessment completeness: run the whole routine every time, every 4 to 6 hours unless risk factors demand more.");

/* ================= C4 — Perineum, Cesarean Incision, Pain ================= */
S(C4, "On day 2, a woman's episiotomy shows redness along the suture line. She reports no increase in pain, there is no discharge, and the edges are together. Which interpretation is correct?", [
    ["Redness alone is probably the normal inflammation of healing — document the REEDA findings and continue routine checks", true, "The chapter's distinction: redness WITH pain is the worry; redness by itself, with edges approximated and no discharge, fits normal healing."],
    ["The suture line is infected and the provider should be notified for antibiotics", false, "Infection needs its companions — pain, discharge, separation; none is present, and fever is absent from the picture."],
    ["The wound is beginning to separate at the edges and she should be kept in bed, off the perineum, until the provider rechecks it", false, "Separation means edges not together or not intact; her edges are approximated, which is the A in REEDA reading normal."],
    ["A hematoma is forming under the suture line and ice should be applied continuously", false, "Nothing here describes a hematoma, and cold packs are used about 10 minutes at a time with a barrier — never continuously."]
  ], "ANSWER KEY — Correct answer: redness alone is expected healing inflammation; document and continue REEDA checks. DETAILED RATIONALE — REEDA (Redness, Edema, Ecchymosis, Discharge, Approximation) is read as a pattern, not a single letter: redness earns concern when pain, discharge, or separation travels with it. PRIORITY FRAMEWORK — Assessment accuracy: judge the whole pattern before naming a complication.");

S(C4, "During a perineal check, the nurse notes a small amount of discharge along a woman's episiotomy suture line. She is afebrile and her pain is unchanged. Which action is correct?", [
    ["Report it — there should be no discharge at all from a perineal suture line, even when she has no fever", true, "The chapter's line is absolute: ANY discharge from a perineal suture line is abnormal; fever is not required before it counts."],
    ["Document it as normal drainage and recheck at the next routine round", false, "Drainage is a finding tracked on a cesarean dressing; on a perineal suture line, discharge should not exist at all."],
    ["Apply a topical antibiotic ointment to the suture line and cover the area with a fresh pad, then recheck tomorrow", false, "Treating it locally buries a report finding; the perineal topicals in this chapter are for comfort (inflammation, pain, numbing), not for suture discharge."],
    ["Wait to see whether a fever develops before deciding whether it matters", false, "Fever would add urgency, but the discharge alone already crosses the report line."]
  ], "ANSWER KEY — Correct answer: report the discharge — a perineal suture line should have none. DETAILED RATIONALE — Some findings are flags by pattern and some by mere presence. Suture-line discharge is a presence flag: the expected amount is zero, so any amount is a deviation worth the provider's eyes. PRIORITY FRAMEWORK — Safety: act on zero-tolerance findings without waiting for a second sign.");

  { t: "Apply the prescribed topical medication to the perineum", r: "Third — medication goes on BEFORE the fresh pad; a pad applied first absorbs the medication instead of the skin." },

S(C4, "Six hours after a cesarean birth, a woman rates her incision pain as moderate, 5 of 10, and asks for relief. Following the chapter's care-plan ladder, which medication fits her pain level?", [
    ["Norco (hydrocodone-acetaminophen 5–325), 1–2 tablets by mouth — the rung for moderate pain", true, "Care Plan 10.1's ladder: acetaminophen alone is rung one for MILD pain; the hydrocodone-acetaminophen combination is the moderate-pain rung."],
    ["Acetaminophen (Tylenol) 650 mg by mouth — always the first choice regardless of level", false, "Acetaminophen is rung one for mild pain; a moderate rating has already outgrown it."],
    ["Aspirin by mouth, because incision pain is inflammatory", false, "Aspirin is not used postpartum under this chapter's guidance — it interferes with clotting."],
    ["An epidural narcotic dose, because she had epidural anesthesia for the surgery", false, "Epidural narcotics are a specific ordered therapy with their own monitoring burden (hourly respirations, pulse oximetry, naloxone on hand) — not the ladder's answer to moderate pain."]
  ], "ANSWER KEY — Correct answer: Norco 5–325 — the moderate rung of the chapter's pain ladder. DETAILED RATIONALE — The ladder matches drug strength to the rated level: acetaminophen 650 mg for mild, hydrocodone-acetaminophen for moderate, with sedation watched and doses timed around nursing. Rating first, then rung — never the reverse. PRIORITY FRAMEWORK — Assessment before implementation: the pain score selects the intervention.");

S(C4, "Five hours after a dose of epidural narcotic, a cesarean mother is difficult to arouse and her respirations are 9 breaths/min. Which action and understanding are correct?", [
    ["This is delayed respiratory depression from the epidural narcotic — give naloxone (Narcan) as ordered and monitor her closely", true, "The chapter warns that respiratory depression can occur several hours after epidural narcotics — which is why hourly respiratory checks, a pulse oximeter, and naloxone kept readily available are the standing safeguards."],
    ["She is finally sleeping off her exhaustion after surgery; let her rest undisturbed through the night and recheck her at the next hourly round instead", false, "Respirations of 9 with difficult arousal is not sleep; the hourly checks exist to catch exactly this, not to schedule the next look."],
    ["Her pain medication has worn off and she is guarding her incision and breathing shallowly in her sleep", false, "Guarding does not slow respirations to 9 or make a patient hard to arouse; this is a drug effect until proven otherwise."],
    ["Give the next ordered analgesic dose now, ahead of schedule, so she can rest more deeply", false, "Adding sedating medication to a respiratory rate of 9 compounds the problem the naloxone is there to reverse."]
  ], "ANSWER KEY — Correct answer: treat it as delayed respiratory depression from the epidural narcotic — naloxone available and given per orders, with close respiratory monitoring. DETAILED RATIONALE — Epidural narcotics give long relief with a long tail: depression can arrive several hours after the dose, after the patient looks settled. The chapter's safeguards (hourly respirations, pulse oximetry, naloxone at hand) are built for this exact hour. PRIORITY FRAMEWORK — ABCs: breathing outranks every other consideration in the room.");

M(C4, "Which measures protect a cesarean mother's lungs in the first days after birth? Select all that apply.", [
    ["Deep breaths and turning side to side every 2 hours in bed", true, "Part of the chapter's cesarean breathing routine — movement plus deep breathing keeps secretions from settling."],
    ["Coughing with a pillow splinted firmly over the incision", true, "Splinting supports the incision so she can cough effectively instead of guarding."],
    ["Using an incentive spirometer toward set targets", true, "The spirometer gives her measurable deep-breathing goals each shift."],
    ["Auscultating her lungs each shift for diminished sounds, crackles, or wheezes", true, "The assessment half of the plan — those sounds mean retained secretions and trigger more aggressive clearing."],
    ["Keeping her flat on her back between checks so the incision is not strained", false, "Flat immobility pools secretions; the plan is built on turning and breathing, not stillness."],
    ["Delaying her first shower until the staples are removed at about day 3", false, "She showers once she ambulates reliably — back to the water stream, dressing covered in plastic wrap; staple removal is not the gate."]
  ], "ANSWER KEY — Correct answers: deep breaths with turning every 2 hours, splinted coughing, incentive spirometer, and lung auscultation each shift. DETAILED RATIONALE — Cesarean lung care pairs prevention (breathe, turn, cough with support, spirometer targets) with surveillance (each-shift auscultation for diminished sounds, crackles, or wheezes that signal retained secretions). PRIORITY FRAMEWORK — Prevention plus assessment: do the measures and verify them with the stethoscope.");

S(C4, "A new mother refuses the ice pack offered for her perineal swelling. Her mother explains that in their culture, heat is what heals. Which response is best?", [
    ["Respect the belief and work with her preference — offer the warm measures she accepts and keep assessing the perineum", true, "The chapter names this exact situation: some cultures believe heat heals and resist the ice pack; the nurse respects it and works with her preference."],
    ["Explain that ice is medically required in the first 24 hours after birth and apply it quietly after she falls asleep tonight", false, "Applying a refused treatment during sleep violates her consent and her trust; cold is a comfort measure, not an emergency order."],
    ["Chart her as noncompliant and stop offering perineal comfort measures", false, "Refusing one measure is not refusing care; the warm measures (sitz bath, warm pack) remain available and effective for her goals."],
    ["Ask the provider to order the ice pack so she understands it is not optional", false, "An order does not convert a comfort preference into an obligation, and it spends provider authority on the wrong battle."]
  ], "ANSWER KEY — Correct answer: respect the belief and work with her preference for warm measures. DETAILED RATIONALE — Cultural humility is a clinical skill here: the goal is a healing, comfortable perineum, and more than one road reaches it. Forcing the refused road costs trust she will need for every teaching that follows. PRIORITY FRAMEWORK — Patient-centered care (Maslow): meet the need in the form the patient can accept.");

/* ================= CASE STUDY 2 (CT-CASE2) — suspected leg clot after cesarean ================= */
var CASE10_CT2 = "CASE STUDY — The Calf That Spoke First. Mrs. D. T., 41 years old, is on postpartum day 2 after a cesarean birth. She has spent most of the time since surgery in bed; the pneumatic compression devices were removed yesterday and were not replaced, and she has walked only once, briefly. Today's assessment: her right calf is reddened, tender, and warm, with slight swelling compared with the left; she reports discomfort in that calf when the foot is passively dorsiflexed. Her incision is clean and dry with staples intact. Temperature 37.4°C, pulse 88, respirations 16, BP 122/78.";

M(C5, "Which findings in this assessment are cues that require follow-up? Select all that apply.", [
    ["Right calf redness, tenderness, and warmth", true, "The chapter's leg flag cluster — a reddened, tender, warm area raises the question of a clot in that leg."],
    ["Slight swelling of the right calf compared with the left", true, "Unilateral edema travels with the deep-vein picture; it is the comparison with the other leg that makes this finding speak."],
    ["Discomfort when the right foot is passively dorsiflexed", true, "A positive Homans'-type finding is a cue to pursue — though the chapter warns it cannot settle the question by itself."],
    ["Most of her time spent in bed since a cesarean birth", true, "Venous stasis is the setup for clotting, and clotting factors stay elevated for weeks after birth; immobility after surgery is a risk cue, not background noise."],
    ["Incision clean and dry with staples intact", false, "That is the incision reading normal — reassuring, not a cue for follow-up."],
    ["Temperature 37.4°C and pulse 88", false, "Both values sit in the expected postpartum range; neither flags infection or volume problems here."]
  ], "ANSWER KEY — Correct answers: calf redness/tenderness/warmth, unilateral calf swelling, discomfort on dorsiflexion, and prolonged bed rest after cesarean birth. DETAILED RATIONALE — Cue recognition weighs the leg findings as a cluster (color, pain, warmth, size, provoked discomfort) against the setup that produced them — surgery plus immobility during the highest-risk window, which runs from about 12 hours before delivery through the first 48 hours after. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): cluster the findings with the risk context that gives them meaning.", { scen: CASE10_CT2, grp: "CT-CASE2" });

S(C5, "Which statement best interprets this woman's findings?", [
    ["Her leg symptoms point to a possible deep vein clot; the dorsiflexion discomfort alone cannot confirm it — symptoms plus venous ultrasound are the reliable check", true, "The chapter is explicit: Homans' sign has limited postpartum value, and the diagnosis rests on the symptom cluster confirmed by venous ultrasound."],
    ["The positive dorsiflexion sign confirms a deep vein thrombosis, so anticoagulant treatment can begin on that basis alone", false, "A positive sign can come from nothing more than a muscle strained in delivery positioning — it raises suspicion; it does not confirm."],
    ["The calf pain is most likely just a strained muscle from delivery positioning, because a strained muscle is a common and harmless cause of a positive dorsiflexion sign like this", false, "A strain explains the dorsiflexion discomfort but not the redness, warmth, and one-sided swelling riding with it; the cluster outvotes the single benign explanation."],
    ["A reddened, tender area means a superficial vein is involved, which is uncomfortable but never requires further workup", false, "Superficial involvement is one possibility in the chapter's leg picture, but edema and pain raise the deep-vein question, which only evaluation can settle."]
  ], "ANSWER KEY — Correct answer: possible deep vein clot — the symptom cluster needs venous ultrasound; the dorsiflexion sign alone proves nothing. DETAILED RATIONALE — Analysis here is about the weight of evidence: one soft sign (dorsiflexion discomfort) plus three hard ones (redness, warmth, unilateral swelling) in a high-risk window. The chapter's diagnostic rule — symptoms plus ultrasound over Homans' — decides the next step. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): let the whole cluster, not the loudest single sign, name the problem.", { scen: CASE10_CT2, grp: "CT-CASE2" });

S(C5, "Which action should the nurse take FIRST for this woman?", [
    ["Report the calf findings to the provider now so she can be evaluated for a clot", true, "Calf pain, redness, tenderness, and warmth form the chapter's possible-thrombus flag, and flags are reported when found — evaluation and ultrasound follow from the report."],
    ["Ambulate her in the hallway to improve venous circulation in the leg", false, "Walking is the great prevention BEFORE a clot is suspected; once one is suspected, evaluation comes before marching her on that leg."],
    ["Apply a warm compress to the calf and reassess it on the next shift", false, "Comfort measures do not evaluate a possible clot, and a shift is a long time to leave the question open in the highest-risk window."],
    ["Repeat the dorsiflexion check every hour to trend whether the sign is improving", false, "Trending a sign the chapter calls unreliable does not move her toward the ultrasound that actually answers the question."]
  ], "ANSWER KEY — Correct answer: report the calf findings to the provider now. DETAILED RATIONALE — The routine assessment exists to produce exactly this moment: a flag found, a report made, an evaluation started. Prevention measures belong to the hours before a flag exists; after it exists, they are no longer the first move. PRIORITY FRAMEWORK — Safety / escalation: a possible clot is reported when it is found, not at the end of the shift.", { scen: CASE10_CT2, grp: "CT-CASE2" });

M(C5, "The provider has evaluated her leg. For the REST of her stay, which measures belong in her clot-prevention plan once the provider clears her to move? Select all that apply.", [
    ["Early and regular ambulation", true, "The chapter's headline prevention — walking is the mainstay that keeps venous blood moving."],
    ["Pneumatic compression devices while she is in bed", true, "The mechanical mainstay after cesarean birth, used until ambulation is established — hers were removed and not replaced, a gap to close."],
    ["Simple leg exercises — flexing and extending the feet — until she is ambulating well", true, "The in-bed companion measure: ankle movement substitutes for walking until walking takes over."],
    ["Heparin prophylaxis if the provider orders it", true, "The chapter notes heparin prophylaxis is used especially after cesarean birth; when ordered, it pairs with — never replaces — the movement measures."],
    ["Strict bed rest so the leg is not disturbed", false, "Bed rest is the stasis that caused the problem; the plan moves her more, not less, once she is cleared."],
    ["Aspirin each day as her clot prophylaxis", false, "Aspirin is not used postpartum under this chapter's guidance because it interferes with clotting — it is not her prophylaxis."]
  ], "ANSWER KEY — Correct answers: regular ambulation, pneumatic compression devices in bed, foot flex-and-extend exercises, and heparin if ordered. DETAILED RATIONALE — Generate solutions means rebuilding the whole prevention set that failed her: movement (walking, leg exercises), mechanics (compression devices), and medication when ordered — each covering the hours the others cannot. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): layer the measures so no hour of the day is unprotected.", { scen: CASE10_CT2, grp: "CT-CASE2" });

S(C5, "Two hours later she presses the call light: 'I suddenly can't catch my breath.' Her respirations are 28, pulse 126, and she is anxious and restless. Which action is correct?", [
    ["Escalate immediately for medical intervention — sudden dyspnea with tachypnea is the pulmonary embolus warning pattern", true, "The chapter's rule is blunt: dyspnea plus tachypnea means a possible pulmonary embolus and needs immediate medical intervention."],
    ["Reassure her that anxiety after surgery commonly causes a passing feeling of breathlessness", false, "Anxiety is a diagnosis of exclusion here; with a suspected leg clot in her chart, breathlessness is an embolus until a provider says otherwise."],
    ["Give her ordered pain medication, because incision pain is splinting her breathing and making it rapid", false, "Splinting causes shallow, guarded breathing — not a sudden respiratory rate of 28 with a pulse of 126 and restlessness."],
    ["Sit her up in bed, encourage slow deep breaths, and reassess her in 30 minutes", false, "Positioning and coaching are comfort measures; the warning pattern buys escalation now, not a 30-minute observation window."]
  ], "ANSWER KEY — Correct answer: escalate immediately — dyspnea plus tachypnea is the pulmonary embolus warning pattern. DETAILED RATIONALE — Take action means matching the response to the worst credible explanation. A woman with a suspected leg clot who becomes suddenly dyspneic and tachypneic has the chapter's named emergency, and the nurse's move is immediate medical intervention. PRIORITY FRAMEWORK — ABCs: breathing problems outrank every other task on the unit.", { scen: CASE10_CT2, grp: "CT-CASE2" });

S(C5, "The provider evaluated her, imaging was done, and treatment and the prevention plan were started. At the next day's assessment, which finding best shows the plan is working?", [
    ["Her right calf is less red and tender, she is ambulating regularly, and her respirations are 16 with no breathlessness", true, "Evaluation reads the original cues in reverse: the leg cluster shrinking, the prevention behavior happening, and the breathing emergency absent."],
    ["Her dorsiflexion check is now negative, which confirms the leg problem has fully resolved and needs no further follow-up at all", false, "The chapter warns the sign is unreliable in both directions — its disappearance cannot confirm resolution any more than its presence could confirm the clot."],
    ["Her white blood cell count has fallen from 19,000 to 15,000 since yesterday's labs", false, "Both values sit inside the expected postpartum range of 12,000–20,000; the trend measures nothing about her leg or her breathing."],
    ["Her resting pulse is 56, showing that her circulation has returned to its normal state", false, "A pulse of 50–60 is expected postpartum physiology in the first 48 hours; it says nothing about whether the clot plan is working."]
  ], "ANSWER KEY — Correct answer: the calf cluster is shrinking, she is ambulating, and her breathing is normal. DETAILED RATIONALE — Evaluation compares today's picture with the cue list that started the episode — leg findings, mobility, respirations — and ignores the numbers that were never part of the problem (the white count, the dorsiflexion sign, the expected slow pulse). PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): judge the plan against its own original cues.", { scen: CASE10_CT2, grp: "CT-CASE2" });

/* ================= C5 standalone ================= */
S(C5, "On day 2, a woman reports that she is voiding very often but only small amounts each time, with burning and urgency that are getting worse, not better. Which interpretation is correct?", [
    ["Frequent small voidings with persistent, worsening burning and urgency point to a urinary tract infection — report it", true, "The chapter's sorting rule: early burning from edema and trauma is expected, but persistent or worsening burning and urgency — with small frequent voids — is the UTI pattern; urine stasis invites it."],
    ["This is normal soreness from delivery edema and tissue trauma, and it will fade on its own over the first week or so after birth", false, "Normal soreness improves; hers is worsening on day 2 and has changed her voiding pattern — that trajectory is the flag."],
    ["This is postpartum diuresis, which commonly causes frequent voiding in the first days", false, "Diuresis produces LARGE volumes — up to about 3,000 mL a day — not small frequent voids with burning."],
    ["She should practice stopping her urine stream mid-void to strengthen the bladder", false, "The chapter warns against exactly that: stopping the stream causes stasis, which feeds the infection she may already have."]
  ], "ANSWER KEY — Correct answer: possible urinary tract infection — report it. DETAILED RATIONALE — The discriminating details are pattern and direction: small amounts (not diuresis), frequency with urgency (not simple soreness), and worsening instead of fading (not healing). Catheterization and stasis both raise her risk. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the trajectory of a symptom is data, not decoration.");

BANK.push({ cat: C5, type: "order", stem: "A woman has not had a bowel movement by day 3 and is straining fearfully because of her sore perineum. Place the chapter's bowel measures in the order they should be used.", items: [

], tp: "ANSWER KEY — Correct order: fluids/fiber/ambulation → docusate → bisacodyl → enema only as ordered (never with a third- or fourth-degree tear). DETAILED RATIONALE — Bowel care climbs from physiology to pharmacology to procedure, and the last rung carries a hard stop: no suppository or enema crosses a third- or fourth-degree laceration. Knowing the ladder includes knowing where it ends. PRIORITY FRAMEWORK — Least invasive first (least restrictive): escalate only when the gentler rung has failed." });

/* ================= C6 — Breasts and Breastfeeding ================= */
S(C6, "On day 3, a nursing mother's breasts are hard, tense, and painful, and her baby cannot latch onto the swollen areola. Which plan is correct?", [
    ["Express a little milk to soften the areola for latch, use warm compresses for let-down, and nurse every 2 to 3 hours", true, "Engorgement care in the chapter: soften the tense areola so the baby can latch, warm for let-down (cold is for relief), and empty the breasts on a frequent schedule because supply follows demand."],
    ["Stop nursing for the next 24 hours to rest the breasts completely, and pump only when they become too painful to bear any longer", false, "Skipped and shortened feedings drop production and worsen engorgement; the treatment is more effective emptying, not less."],
    ["Bind the breasts tightly with a binder and apply ice packs until the milk supply decreases", false, "Binding, ice, and withholding emptying are the weaning and abrupt-stop measures — the opposite of what a mother who wants to nurse needs."],
    ["Apply cold compresses before each feeding to firm up the areola so the baby can latch", false, "Cold is for comfort relief; warmth is the pre-feeding tool because it promotes let-down, and latch needs a softened areola, not a firmer one."]
  ], "ANSWER KEY — Correct answer: soften the areola by expressing a little milk, warm compresses for let-down, and nurse every 2 to 3 hours. DETAILED RATIONALE — Engorgement is a traffic jam: production has arrived faster than removal. Every correct measure increases removal or makes removal possible; every wrong one reduces it. PRIORITY FRAMEWORK — Analyze to intervention: treat the mechanism (fullness blocking latch) rather than the symptom alone.");

S(C6, "A mother who is formula-feeding asks on day 3 why her breasts are hard and painful 'when I'm not even nursing,' and what she should do. Which teaching is correct?", [
    ["Engorgement happens to nonnursing mothers too: supportive (not tight) bra, ice packs, analgesics, no nipple stimulation — normal in about 1 to 2 weeks", true, "The chapter's nonnursing plan: support without stimulation, cold and analgesia for comfort, and time — production down-regulates when milk is not removed."],
    ["Pump a full session on both sides whenever the pressure becomes painful, because milk stored too long in the breast can thicken, block ducts, and become infected", false, "Pumping removes milk, and removal is the signal to produce more — it maintains the very supply she is trying to stop."],
    ["Take long warm showers twice a day and let the warm water run over the breasts to soften them and ease the pressure", false, "Warmth and stimulation promote let-down and production; her plan needs the opposite signals."],
    ["Wear the tightest bra she owns day and night, and bind the chest with an elastic wrap to compress the milk glands shut completely", false, "The chapter specifies a supportive bra that is NOT tight; tight binding is the outdated version of this advice."]
  ], "ANSWER KEY — Correct answer: supportive (not tight) bra, ice packs and analgesics, no nipple stimulation, normal again in about 1 to 2 weeks. DETAILED RATIONALE — Lactation runs on removal: milk taken out is milk replaced. For the mother who is not nursing, every correct measure sends the 'stop' signal — no stimulation, no emptying — while comfort measures carry her through the engorgement days. PRIORITY FRAMEWORK — Patient teaching: her plan works only if she understands the supply-and-demand rule behind it.");

M(C6, "Which of these are contraindications to breastfeeding under this chapter's guidance? Select all that apply.", [
    ["The mother is taking methotrexate", true, "Cytotoxic drugs such as methotrexate (and cyclosporine) are on the chapter's contraindicated list."],
    ["The mother takes bromocriptine for another condition", true, "Bromocriptine suppresses lactation itself — it is listed among the drugs contraindicated while breastfeeding."],
    ["The mother uses ergotamine for migraine headaches", true, "Ergotamine is named on the chapter's contraindicated list for nursing mothers."],
    ["The mother is HIV positive", true, "HIV (and HTLV-1/HTLV-2) is an absolute infection contraindication in the chapter."],
    ["The mother has active pulmonary tuberculosis and is isolated, but her pumped milk is available", false, "The chapter separates the mother, not the milk — there are no bacilli in the milk, so her pumped milk CAN be fed to the baby."],
    ["The mother has a herpes lesion on one breast and wants to feed from the other breast", false, "The rule is breast-specific: no feeding from a breast WITH lesions; the unaffected breast is not banned."]
  ], "ANSWER KEY — Correct answers: methotrexate, bromocriptine, ergotamine, and maternal HIV. DETAILED RATIONALE — The contraindication list mixes drugs that harm the baby or kill the supply (cytotoxics, bromocriptine, ergotamine) with infections that pass through milk (HIV, HTLV). The near-misses test precision: tuberculosis isolates the mother but not her pumped milk, and a herpes lesion closes one breast, not both. PRIORITY FRAMEWORK — Safety: know the absolute lines and the exact width of each one.");

BANK.push({ cat: C6, type: "matrix", stem: "Match each milk or feeding description to what the nurse should teach or expect.", cols: ["First days — yellowish, rich in antibodies, helps clear meconium", "About day 7 to 10 — the in-between milk", "The higher-fat milk at the end of a feeding — satisfies hunger", "Use within 24 hours, and never refreeze it"], rows: [
