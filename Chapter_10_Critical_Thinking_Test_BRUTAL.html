  { t: "Hindmilk", a: 2, r: "Hindmilk is the higher-fat milk late in a feeding; foremilk quenches thirst, hindmilk satisfies hunger — too-short feedings miss it." },
  { t: "Thawed breast milk", a: 3, r: "Thawed milk is used within 24 hours, is never refrozen, and is never microwaved (immune factors are destroyed and hot spots burn)." }
], tp: "ANSWER KEY — Correct matches: colostrum = first days, antibody-rich, clears meconium; transitional = about day 7–10; hindmilk = higher-fat, satisfies hunger; thawed milk = use within 24 hours, never refreeze. DETAILED RATIONALE — Milk changes across days and even within one feeding, and storage rules protect what the milk carries. Each row pairs a name with the property a mother actually uses at home. PRIORITY FRAMEWORK — Patient teaching: teach the property she will act on, not just the name." });

S(C6, "A mother pumped milk, froze it, and thawed it yesterday morning — about 30 hours ago. There is some left, and she asks whether she can refreeze it for next week. Which answer is correct?", [
    ["No — thawed milk must be used within 24 hours and is never refrozen; the leftover should be discarded", true, "The chapter's storage rules are exact: thawed milk has a 24-hour life and refreezing is never allowed."],
    ["Yes, once — milk can be refrozen a single time if it still smells normal", false, "There is no one-time exception; the rule is never refrozen, and smell is not the test."],
    ["Yes, if she first warms it in the microwave to kill any bacteria", false, "Microwaving is itself prohibited — it destroys immune factors and creates hot spots that can burn the baby."],
    ["No, but it can stay at room temperature for another day because it was frozen before", false, "Room-temperature life is 4 to 6 hours for fresh milk; previously frozen, thawed milk past 24 hours is done."]
  ], "ANSWER KEY — Correct answer: discard it — thawed milk is used within 24 hours and never refrozen. DETAILED RATIONALE — Storage numbers are safety numbers: room temperature 4–6 hours, refrigerator up to 96 hours, refrigerator freezer 2 weeks, deep freezer 6 months, thawed 24 hours and never refrozen or microwaved. Each limit protects the baby from bacterial growth or lost immune factors. PRIORITY FRAMEWORK — Safety: storage rules are followed by the clock, not by appearance or smell.");

S(C6, "A mother reports her baby nurses only about 5 minutes on each side, then seems hungry again within the hour, and she is worried her milk is 'not satisfying him.' Which explanation and advice are correct?", [
    ["Short feedings reach mainly foremilk, which quenches thirst; the fatty hindmilk that satisfies hunger comes later — nurse longer on one breast", true, "The chapter's foremilk/hindmilk rule: too-short feedings miss the hindmilk, so the fix is time at the breast, not a different milk."],
    ["Her milk has become too weak to satisfy him, and she should switch to formula for at least half of the feedings", false, "Nothing here shows a supply or quality failure — the pattern is explained by feeding length, and supplementing would cut the demand that builds supply."],
    ["She should pump before each feeding and discard the first milk that comes out, so he gets to the rich milk sooner", false, "Discarding foremilk throws away nutrition and hydration; the baby reaches hindmilk by nursing longer, not by pre-pumping."],
    ["She should space feedings out to every 4 to 5 hours, day and night, so the breasts fill completely and store a larger volume of richer milk between feedings", false, "Very little milk is stored between feedings and production follows removal — longer gaps shrink supply instead of enriching it."]
  ], "ANSWER KEY — Correct answer: he is getting mostly foremilk; longer feedings reach the satisfying hindmilk. DETAILED RATIONALE — Within one feeding, milk changes: foremilk for thirst first, fatty hindmilk for hunger later. A 5-minute pattern explains a hungry baby without blaming the mother's milk — and the remedy (stay longer on the breast) also protects her supply. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): explain the pattern with the mechanism before changing the plan.");

/* ================= C7 — Bonding, Blues, Family Adaptation ================= */
S(C7, "On her first day after birth, a mother is passive, asks for food and rest, and retells her birth story in detail to everyone who enters. She shows little interest in learning how to hold or feed the baby. Which interpretation and response are correct?", [
    ["She is in Rubin's taking-in phase — expected now; give rest, food, fluids, and sleep, and listen rather than push teaching", true, "Taking-in is the receiving phase: she recounts the birth and takes in care; the chapter's prescription is rest, food, fluids, sleep, and a listener."],
    ["She is showing poor bonding with the baby and should be referred for a psychological evaluation today", false, "Passivity and birth-story retelling on day 1 are the textbook picture of a normal phase, not a bonding failure."],
    ["She is in the taking-hold phase, so this is the right time to begin scheduling all of her discharge teaching sessions with the baby", false, "Taking-hold is when she INITIATES care and is ready to learn; a mother asking to be cared for is a phase earlier."],
    ["She is developing postpartum depression, and the provider should be notified about her mood today", false, "Depression is a persistent pattern — pervasive unhappiness, not enjoying life — not one day of normal receiving behavior."]
  ], "ANSWER KEY — Correct answer: taking-in phase — give rest, food, fluids, sleep, and a listening ear. DETAILED RATIONALE — Rubin's phases tell the nurse what a mother can take in: in taking-in she receives; in taking-hold she reaches; in letting-go she reconciles. Teaching aimed at the wrong phase lands on a closed door. PRIORITY FRAMEWORK — Patient-centered care: match the intervention to the phase she is actually in.");

S(C7, "On day 2, a mother begins initiating the baby's care, asks detailed questions, and criticizes her own technique ('I'm doing this wrong, aren't I?'). Which action fits her phase?", [
    ["Teach now — she is in taking-hold, initiating care and ready to learn; support her through the self-criticism", true, "Taking-hold is the chapter's TEACHING window: she reaches for the skills and judges herself as she learns them."],
    ["Take the baby's care back over for her so she can rest and recover through this phase", false, "Rest protection belongs to taking-in; taking over now would block the initiation that defines taking-hold."],
    ["Reassure her that this kind of self-criticism about her technique means she is entering an early postpartum depression", false, "Self-criticism while learning is a named feature of taking-hold, not a depression flag — depression is persistent and pervasive."],
    ["Delay all discharge teaching until the 6-week visit, when she has fully let go of the old life", false, "Letting-go is about reconciling the real baby with the fantasy, not the first readiness to learn; her window is open now and discharge is near."]
  ], "ANSWER KEY — Correct answer: teach now — taking-hold is the learning window. DETAILED RATIONALE — The same mother who could not absorb teaching yesterday is asking for it today. Discharge teaching is a summary built at every contact, and taking-hold contacts are where most of it lands. PRIORITY FRAMEWORK — Patient teaching: deliver instruction when the learner's phase makes her ready for it.");

BANK.push({ cat: C7, type: "dropdown", stem: "Complete each statement about family adaptation after birth.<br><br>The tearfulness and irritability of the postpartum blues most often peak at about<br>[[0]]<br><br>A mother whose unhappiness is persistent and who is generally not enjoying life should be<br>[[1]]<br><br>A father's intense interest in and preoccupation with the newborn is called<br>[[2]]", blanks: [
  { o: [O("Day 5", true, "Blues feelings often peak around day 5 and are self-limiting — tearfulness, irritability, and fatigue that still leave her able to enjoy life."), O("The first 24 hours", false, "Day 1 is dominated by the taking-in phase and physical recovery; the blues peak comes later."), O("Week 6", false, "By 6 weeks the blues should be long past; unhappiness then is a report finding, not a peak of normal blues.")] },
  { o: [O("Reported to the health care provider", true, "Persistent dysphoria crosses the blues line — it may be postpartum depression or even hypothyroidism, and the chapter's action is to report it."), O("Reassured that this is the normal blues and will pass", false, "Reassurance is for the self-limiting blues; persistent unhappiness with loss of enjoyment is exactly what must NOT be reassured away."), O("Treated by protecting her rest for a few more days", false, "Rest helps fatigue and the blues, but a persistent, pervasive mood is a provider-level finding, not a scheduling problem.")] },
  { o: [O("Engrossment", true, "Engrossment is the father's intense interest in the newborn — the paternal counterpart to early bonding."), O("Taking-hold", false, "Taking-hold is one of the MOTHER's Rubin phases — initiating care and readiness to learn."), O("Letting-go", false, "Letting-go is the mother's third phase — reconciling the real baby and experience with the fantasy.")] }
], tp: "ANSWER KEY — Correct answers: blues peak at about day 5; persistent unhappiness with loss of enjoyment is reported to the provider; the father's intense interest is engrossment. DETAILED RATIONALE — Adaptation is judged on timelines and depth: blues are brief, peak near day 5, and spare her enjoyment of life; the moment unhappiness becomes persistent and pervasive, it leaves the blues and becomes a report — with postpartum depression and hypothyroidism both on the table. PRIORITY FRAMEWORK — Assessment accuracy: the same sadness is normal or reportable depending on its duration and depth." });

S(C7, "Parents are worried about taking the baby home to their 3-year-old, who has started having toileting accidents since the birth. Which advice is best?", [
    ["Expect some regression — and at homecoming, have the father carry the newborn in so the mother's arms are free to hug the toddler", true, "The chapter's sibling guidance: toddler regression and accidents are expected, and the arms-free homecoming is its named practical tip."],
    ["Have the mother carry the baby in and greet the toddler while holding the newborn, to show there is enough of her for both", false, "The chapter's arrangement is the reverse — the newborn arrives in the father's arms precisely so the mother's first greeting is unencumbered."],
    ["Keep the toddler with grandparents for the first week so he does not feel displaced", false, "A week of absence deepens displacement rather than preventing it; the plan integrates him from the first hour."],
    ["Address the accidents firmly each time so the regression does not become a habit", false, "Regression is a stress response to the family change, not misbehavior to discipline away."]
  ], "ANSWER KEY — Correct answer: expect regression, and let the father carry the newborn in so the mother's arms are free. DETAILED RATIONALE — Sibling adaptation runs on the older child's security: regression (accidents, babyish behavior) signals the stress, and small choreography — free arms, first hugs — answers it better than rules. PRIORITY FRAMEWORK — Family-centered care: treat the family system, not just the mother-baby pair.");

M(C7, "A couple's baby was stillborn an hour ago. Which nursing actions support their grieving? Select all that apply.", [

var Q = [];
var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { shuffle(q.opts); S.resp.push(-1); }
    else if (q.type === "multi") { shuffle(q.opts); S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { shuffle(q.blanks[k].o); d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';

  } else if (q.type === "multi") {

      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
