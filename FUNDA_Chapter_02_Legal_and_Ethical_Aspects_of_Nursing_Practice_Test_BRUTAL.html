<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Standards, Scope, and Patients' Rights";
var CB = "Consent, Confidentiality, and Records";
var CC = "Abuse Reporting, Insurance, and Discipline";
var CD = "Ethics, Values, and Advance Directives";
var CATS = [CA, CB, CC, CD];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 7,
  "types": {
   "single": 6,
   "multi": 1
  }
 },
 CB: {
  "name": CB,
  "count": 14,
  "types": {
   "single": 11,
   "multi": 1,
   "dropdown": 1,
   "matrix": 1
  }
 },
 CC: {
  "name": CC,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 1,
   "order": 1
  }
 },
 CD: {
  "name": CD,
  "count": 18,
  "types": {
   "single": 13,
   "matrix": 1,
   "dropdown": 1,
   "multi": 3
  }
 }
};
BANK.push({ cat: CA, type: "single", stem: "A newly licensed LPN is assigned a procedure she has never performed and was not taught in orientation. The unit is short-staffed and the charge nurse says, 'Just do your best.' Which of the following actions should the nurse take first?", tp: "Unfamiliar practice: seek instruction and supervision. Short staffing raises liability risk; it never lowers the standard.", opts: [O("Seek additional instruction and supervision before attempting the procedure", true, "Correct. The chapter states the nurse must seek instruction and supervision for unfamiliar procedures. Framework: safety first."), O("Attempt the procedure slowly while watching a video on her phone", false, "Wrong. Attempting an unfamiliar procedure unsupervised risks patient harm and liability."), O("Ask an unlicensed assistant to perform it while she observes nearby", false, "Wrong. Delegating a task she cannot judge does not protect the patient or her license."), O("Document that the unit was short-staffed and proceed as assigned", false, "Wrong. Charting the staffing problem does not substitute for competence or supervision.")] });
BANK.push({ cat: CA, type: "single", stem: "A patient with a casted leg reports decreased feeling in his toes. The nurse notes the toes are edematous and discolored, but does not notify the provider or reassess for 2 days. This nurse's actions would be judged against:", tp: "Darling v. Charleston: nurses who noted edematous, discolored toes and decreased feeling were liable with the physician when gangrene led to amputation.", opts: [O("What a reasonably prudent nurse of similar education would have done", true, "Correct. That hypothetical comparison is the legal test for nursing liability. Framework: safety first."), O("What the busiest nurse on that shift would probably have done", false, "Wrong. Workload does not set the legal standard of comparison."), O("What the patient's family expected the nursing staff to do", false, "Wrong. Family expectation is not the legal test applied by courts."), O("What the physician on the case would have done at the bedside", false, "Wrong. Nursing actions are measured against a nursing standard.")] });
BANK.push({ cat: CA, type: "multi", stem: "A nurse reviews Box 2.5 before a shift. Which failures would count as breaches in the MONITORING area? Select all that apply.", tp: "Monitoring breaches also include polypharmacy effects, decubitus ulcers, and injuries from monitoring equipment. Framework: Nursing Process/ADPIE.", opts: [O("Missing early signs of drug toxicity in a patient on new medications", true, "Correct. Detecting drug toxicity signs is a monitoring duty."), O("Failing to recognize and report a patient's deteriorating condition", true, "Correct. Recognizing and reporting deterioration is listed under monitoring."), O("Using restraints on a confused patient without proper monitoring", true, "Correct. Proper restraint use is listed under monitoring."), O("Charting patient care the night before the care is actually given", false, "Wrong. Precharting is listed under communication breaches."), O("Writing a provider's orders instead of obtaining them as required", false, "Wrong. Practicing outside scope by writing orders is a practice breach.")] });
BANK.push({ cat: CA, type: "single", stem: "A patient's family asks why the nurse keeps repositioning him and checking his skin every 2 hours. The nurse knows failure to prevent pressure injuries falls under which liability area?", tp: "Know the three Box 2.5 areas cold: practice, monitoring, communication.", opts: [O("Monitoring, because detecting and preventing decubitus ulcers is listed there", true, "Correct. Decubitus ulcer detection and prevention appears under monitoring in Box 2.5. Framework: safety first."), O("Communication, because skin checks must be discussed with the family", false, "Wrong. Family discussion is not why skin surveillance is classified."), O("Practice, because repositioning is a hands-on nursing procedure done daily", false, "Wrong. The box places ulcer prevention under monitoring, not practice."), O("Documentation, because skin findings are recorded in the medical record", false, "Wrong. Recording findings does not determine the liability area.")] });
BANK.push({ cat: CA, type: "single", stem: "A new graduate asks where she can obtain a free copy of her state's nurse practice act. Which response is correct?", tp: "It is the nurse's own responsibility to know the practice act for her geographic region.", opts: [O("Write to the state board of nursing or access the act on its website", true, "Correct. The chapter gives the board of nursing and its website as the source. Framework: Nursing Process/ADPIE."), O("Ask the hospital librarian to lend her a personal copy for the year", false, "Wrong. The chapter names the board of nursing, not a hospital library."), O("Request a copy from the American Nurses Association national office", false, "Wrong. The ANA publishes codes and standards, not each state's act."), O("Buy the act from the facility's human resources department office", false, "Wrong. Human resources is not the source named in the chapter.")] });
BANK.push({ cat: CA, type: "single", stem: "A hospital policy allows LPNs on one unit to perform a task that the state nurse practice act prohibits. Which of the following actions should the nurse take?", tp: "Employers can narrow practice; they cannot expand it past the nurse practice act. Ignorance of limits does not absolve liability.", opts: [O("Refuse the task, because institutional policy cannot widen the state act", true, "Correct. Institutions may limit practice only within the confines of the state act. Framework: safety first."), O("Perform the task, because facility policy overrides state law on its units", false, "Wrong. Facility policy does not override the state practice act."), O("Perform the task once, then report the policy at the next staff meeting", false, "Wrong. Performing a prohibited act even once creates liability."), O("Delegate the task to an experienced unlicensed assistant on the unit", false, "Wrong. Delegation does not cure a task outside the legal scope.")] });
BANK.push({ cat: CB, type: "single", stem: "A patient scheduled for an invasive bowel procedure says, 'Nobody told me what could go wrong or what else could be done.' The consent form is unsigned. Which of the following actions should the nurse take first?", tp: "The nurse's consent role is limited to witnessing the signature. Unanswered questions belong to the provider performing the procedure.", opts: [O("Notify the provider who will perform the procedure to give the disclosure", true, "Correct. The performing provider must supply benefits, risks, alternatives, and refusal consequences. Framework: Nursing Process/ADPIE."), O("Explain the risks and alternatives herself so the schedule is not delayed", false, "Wrong. Disclosure is the performing provider's duty; the nurse explaining it risks liability."), O("Ask the patient to sign now and read the information sheet afterwards", false, "Wrong. Signing before disclosure is not informed consent."), O("Reassure the patient that the procedure is routine and very low risk", false, "Wrong. Reassurance is not disclosure and may amount to coercion.")] });
BANK.push({ cat: CB, type: "single", stem: "A nurse proceeds with an invasive procedure on a patient who never received disclosure and never consented. Legally, this act exposes the nurse to liability for:", tp: "Consent must be free; coercion negates it. Patients may withdraw or limit consent at any time.", opts: [O("Civil battery, because the touching was unlawful even without intent to harm", true, "Correct. Technical battery needs no intent to harm. Framework: safety first."), O("No liability, because the nurse intended to help the patient's condition", false, "Wrong. Good intent does not defeat a battery claim."), O("Criminal assault charges in every case where consent was not obtained", false, "Wrong. The chapter frames this as civil liability for battery."), O("Breach of contract, because the admission form serves as the contract", false, "Wrong. The admission form is not the basis described for this claim.")] });
BANK.push({ cat: CB, type: "single", stem: "A 16-year-old who is married requests treatment and asks to sign her own consent. Which statement guides the nurse's action?", tp: "Other minor criteria: emancipation, living apart 60+ days independently, armed forces service; plus STI, substance abuse, sexual assault, and family planning care.", opts: [O("She may consent, because marriage is a listed criterion for a minor", true, "Correct. Marriage is one of the printed criteria allowing a minor to consent. Framework: Nursing Process/ADPIE."), O("She may not consent until a parent signs, whatever her marital status", false, "Wrong. Marriage is expressly listed as a consent criterion."), O("She may consent only if her spouse also signs the consent form", false, "Wrong. A spouse co-signature is not a listed requirement."), O("She may consent only after a judge approves emancipation papers", false, "Wrong. Court emancipation is a separate criterion; marriage already qualifies her.")] });
BANK.push({ cat: CB, type: "single", stem: "A patient who has been drinking heavily and is slurring his words is asked to sign consent for an invasive procedure. Which of the following actions should the nurse take?", tp: "If a patient is incompetent, a legal process identifies who may consent, often the spouse first.", opts: [O("Hold the signing, because consent cannot come from an impaired patient", true, "Correct. Competence requires sound mind; consent cannot be taken from someone impaired by alcohol or drugs. Framework: safety first."), O("Have him sign slowly while a second nurse watches the signature", false, "Wrong. Witnesses do not cure a lack of competence."), O("Ask his visiting friend to sign the form on the patient's behalf", false, "Wrong. A friend has no legal standing to consent for him."), O("Proceed because he verbally said 'okay' before the drinks arrived", false, "Wrong. The chapter requires competent consent for the procedure.")] });
BANK.push({ cat: CB, type: "single", stem: "In the elevator, two nurses discuss a well-known patient's diagnosis and room number. A visitor overhears them. Which principle has been violated?", tp: "Use private conference rooms for patient discussions; log out of computers; store notes in restricted areas.", opts: [O("Confidentiality, because patient discussions belong in private settings", true, "Correct. Elevator and cafeteria discussions are expressly problematic. Framework: safety first."), O("Beneficence, because the nurses were not actively helping the patient", false, "Wrong. The violation is disclosure of patient information, not failure to do good."), O("Scope of practice, because discussion is outside the nurses' duties", false, "Wrong. Discussing care is within nursing work; the setting is the problem."), O("Justice, because other patients did not receive the same attention", false, "Wrong. Equal treatment is not the issue in this disclosure.")] });
BANK.push({ cat: CB, type: "multi", stem: "Which of the following actions protect patient confidentiality on a busy unit? Select all that apply.", tp: "Confidentiality is not limited to the work shift. Framework: safety first.", opts: [O("Logging out of the computer after viewing a patient's record", true, "Correct. Logging out prevents others from viewing the record."), O("Destroying report sheets before leaving the worksite at shift end", true, "Correct. Report sheets must be destroyed before leaving."), O("Holding patient conversations in a private conference room area", true, "Correct. Private rooms are the chapter's stated setting."), O("Leaving a chart open at the desk while answering a call light", false, "Wrong. Materials must be secured in restricted areas."), O("Confirming a patient's room number to any caller who asks politely", false, "Wrong. Callers should be referred to the charge nurse or family.")] });
BANK.push({ cat: CB, type: "single", stem: "A caller phones the unit asking whether a neighbour is a patient and what she is being treated for. Which of the following actions should the nurse take?", tp: "Consent for treatment does not waive privacy. Use of patient information without authorization violates legal rights.", opts: [O("Refer the call to the charge nurse or to available family members", true, "Correct. The chapter directs such calls to the charge nurse or family. Framework: safety first."), O("Confirm admission but decline to state the diagnosis or treatment", false, "Wrong. Even confirming information to callers can breach confidentiality."), O("Give the room number so the caller can ask the patient directly", false, "Wrong. Sharing location information is a disclosure to an unauthorized caller."), O("Ask the caller to call back during visiting hours for an update", false, "Wrong. A later call does not make the disclosure permissible.")] });
BANK.push({ cat: CB, type: "single", stem: "A nurse photographs a patient's full face to show a friend 'an interesting case,' using no name in the message. Which statement is accurate?", tp: "Box 2.8 myths: posts are not private, deletion is not easy, 'patient never found out' is not acceptable, and no-name does not protect privacy.", opts: [O("This is a violation, because full-face photos are protected identifiers", true, "Correct. Full-face photographic images are identifier 17 in Box 2.7. Framework: safety first."), O("This is acceptable, because no name accompanied the photograph sent", false, "Wrong. Omitting the name is Myth 4; photos still identify the patient."), O("This is acceptable if the friend deletes the message right away", false, "Wrong. Deletion does not undo the disclosure; content is not easily deleted."), O("This is a violation only if the patient later discovers the message", false, "Wrong. A violation does not depend on the patient finding out.")] });
BANK.push({ cat: CB, type: "single", stem: "An ED nurse posts a photo of an empty trauma room in disarray after a train-accident victim was treated, titled with a catchy hashtag. The chapter's outcome for this nurse was:", tp: "Boards may also sanction the license, from fines to status changes. Know your institution's social media policy.", opts: [O("Termination after 7 years on the job for the social media violation", true, "Correct. The chapter reports this nurse was terminated. Framework: safety first."), O("A verbal warning, because no patient appeared in the photograph", false, "Wrong. The chapter reports termination, not a warning."), O("Promotion, because the post raised public awareness of trauma care", false, "Wrong. The post cost the nurse her job."), O("No consequence, because the room itself contained no identifiers", false, "Wrong. Employers discipline up to termination for such posts.")] });
BANK.push({ cat: CB, type: "single", stem: "A lawyer in a lawsuit asks how the court will know what care a patient actually received. The best answer is:", tp: "'Care was not given if it was not charted.' Entries must be permanent, accurate, complete, and legible.", opts: [O("The medical record, whose entries show whether standards were met", true, "Correct. Both parties may use the record; entries show the level of care given. Framework: Nursing Process/ADPIE."), O("The memories of staff, recalled together at a unit meeting later", false, "Wrong. Recollection is not the evidence the chapter names."), O("The patient's diary, kept privately at home during the admission", false, "Wrong. The patient's private diary is not the legal record of care."), O("The staffing schedule, which shows who was assigned to the patient", false, "Wrong. The schedule shows assignments, not the care delivered.")] });
BANK.push({ cat: CB, type: "dropdown", stem: "A nurse completes admission tasks for a competent adult having an invasive procedure tomorrow. Complete each statement: The disclosure of benefits, risks, and alternatives must be given by [[0]]. The nurse's own role with the signed form is limited to [[1]]. If the patient changes her mind tonight, she may [[2]].", tp: "Framework: Nursing Process/ADPIE — disclosure by the performer, witnessing by the nurse, withdrawal always available.", blanks: [{"o": [O("the provider who will perform the procedure", true, "The performing physician or nurse practitioner provides the disclosure."), O("the nurse who witnesses the signature on the form", false, "The witnessing nurse does not provide disclosure."), O("the charge nurse assigned to the unit that day", false, "The charge nurse is not the disclosing provider.")]}, {"o": [O("witnessing the patient's signature on the form", true, "The nurse's responsibility is limited to witnessing the signature."), O("explaining each risk listed for the procedure", false, "Explaining disclosure elements is the provider's role."), O("deciding whether the patient is competent to sign", false, "Competence follows a legal process.")]}, {"o": [O("withdraw or limit her consent at any time", true, "Consent may be withdrawn or limited at any time."), O("withdraw consent only before midnight tonight", false, "No such deadline exists in the chapter."), O("do nothing, because signed consent is permanent", false, "A signed form does not make consent permanent.")]}] });
BANK.push({ cat: CB, type: "matrix", stem: "For each action, classify it as a BREACH of confidentiality/privacy or as PROTECTIVE practice.", tp: "Framework: safety first — PHI includes names, dates, photos, SSN, and 15 other identifiers.", cols: ["Breach", "Protective"], rows: [{"t": "Discussing a patient's condition with coworkers in the cafeteria", "a": 0, "r": "Cafeteria discussions are expressly problematic and should be avoided."}, {"t": "Storing written chart forms in a restricted area of the unit", "a": 1, "r": "Restricted storage is the chapter's protective practice."}, {"t": "Posting about a patient online without using the patient's name", "a": 0, "r": "No-name posting is Myth 4; identifiers extend far beyond names."}, {"t": "Logging out of the computer terminal after reading a patient file", "a": 1, "r": "Logging out prevents others from viewing the record."}, {"t": "Keeping change-of-shift notes in a pocket to review at home", "a": 0, "r": "Report sheets must be destroyed before leaving the worksite."}] });
BANK.push({ cat: CC, type: "single", stem: "A nurse suspects a 6-year-old's bruises in unusual places are from abuse. The parent begs her not to tell anyone. Which of the following actions should the nurse take first?", tp: "Child Abuse Prevention Treatment Act of 1973 made reporting mandatory; failure to report can bring fines or imprisonment. Good-faith mandated reports are protected from liability.", opts: [O("Report the suspicion to the supervisor or police per agency policy", true, "Correct. Reporting is mandatory for health care professionals. Framework: safety first."), O("Promise secrecy, because confidentiality protects the family's privacy", false, "Wrong. Mandated reporting is an exception to privacy."), O("Wait one week to see whether new bruises appear before deciding", false, "Wrong. Delay leaves the child at risk and violates the mandate."), O("Confront the parent with an accusation before making any report", false, "Wrong. The duty is to report through proper channels, not to accuse.")] });
BANK.push({ cat: CC, type: "single", stem: "An 82-year-old widow who is isolated, losing strength, and increasingly confused is brought in by a neighbour who reports the son 'handles her money.' The nurse knows these factors place older adults at risk for:", tp: "Watch for signs of abuse even when hearing loss, anxiety, and impaired communication make assessment harder.", opts: [O("Physical, emotional, or financial abuse requiring careful assessment", true, "Correct. The Lifespan box lists isolation, declining health and mental ability, and loss of independence as risk factors. Framework: Nursing Process/ADPIE."), O("No particular risk, because abuse mainly affects younger women", false, "Wrong. Women and older adults are the populations at increased risk."), O("Only medication errors, because confusion affects pill taking most", false, "Wrong. Confusion is one factor in a wider abuse-risk picture."), O("Falls only, because decreased strength and mobility are present", false, "Wrong. Falls are a concern, but the listed risk here is abuse.")] });
BANK.push({ cat: CC, type: "single", stem: "A nurse's claims-made liability policy ended when she changed jobs last year. A claim is filed now about care given while that policy was active, and she bought no tail. Her exposure is best described as:", tp: "Swap trap: claims-made = when the CLAIM is made; occurrence-basis = when the EVENT occurred. Tail = extended coverage after claims-made ends.", opts: [O("She may be unprotected, because claims-made covers claims made while in force", true, "Correct. Claims-made protection turns on the claim being made during the policy or extended coverage. Framework: Nursing Process/ADPIE."), O("She is fully covered, because the care occurred during the policy period", false, "Wrong. That reasoning fits an occurrence-basis policy, not claims-made."), O("Her new employer must pay, because she works there at claim time", false, "Wrong. Employment at claim time does not transfer the old claim."), O("The tail she declined would have removed all personal liability forever", false, "Wrong. A tail extends coverage time; it is not unlimited immunity.")] });
BANK.push({ cat: CC, type: "single", stem: "A nurse receives a letter from the board of nursing alleging she breached standards of care. Which of the following actions should the nurse take first?", tp: "Licensure issues fall under administrative law: investigation, meetings, hearings, then court appeals. Disciplinary defense insurance can supply an attorney, wage loss, travel, and legal fees.", opts: [O("Seek legal representation before responding to the board's allegations", true, "Correct. The chapter advises legal representation on receiving such a letter. Framework: Nursing Process/ADPIE."), O("Ignore the letter, because board matters resolve themselves over time", false, "Wrong. Ignoring board allegations risks far harsher sanctions."), O("Resign her license immediately so the investigation cannot proceed", false, "Wrong. Resignation is not the chapter's advised first step."), O("Call the patient involved to explain her side of the situation", false, "Wrong. Contacting the patient is not the advised response to a board letter.")] });
BANK.push({ cat: CC, type: "multi", stem: "Which nurse behaviours are listed grounds for licensure proceedings? Select all that apply.", tp: "Grounds span crimes and fraud, drugs and impairment, practice failures, and conduct such as patient abuse and sexual misconduct. Framework: safety first.", opts: [O("Diverting narcotics from the unit's controlled substance supply", true, "Correct. Diverting or stealing narcotics is a listed ground."), O("Falsifying information on a license renewal application form", true, "Correct. Falsifying renewal or application information is listed."), O("Practicing outside the scope of the nurse practice act rules", true, "Correct. Practicing outside scope is a listed ground."), O("Seeking supervision before performing an unfamiliar procedure", false, "Wrong. Seeking supervision is required safe practice, not a ground."), O("Reporting a coworker who practices while impaired by alcohol", false, "Wrong. Reporting impaired practice is a duty, not a ground.")] });
BANK.push({ cat: CC, type: "single", stem: "Off duty at a grocery store, a shopper collapses. A bystander asks the nurse, 'You have to help, right?' Which statement is accurate?", tp: "Know your own state's Good Samaritan law; provisions vary by state and province.", opts: [O("As a private citizen she is not required to help, but Good Samaritan laws may protect her", true, "Correct. No duty exists off duty; Good Samaritan statutes limit liability except for gross negligence. Framework: Maslow."), O("She is legally required to help in every public emergency she witnesses", false, "Wrong. The chapter states nurses are not required to assist as private citizens."), O("She is protected for any act, including grossly negligent care given", false, "Wrong. Gross negligence is the exception to Good Samaritan protection."), O("She must wait for EMS and may not touch the victim under any rule", false, "Wrong. She may choose to help; protection exists in certain circumstances.")] });
BANK.push({ cat: CC, type: "order", stem: "A nurse decides a coworker's unethical behaviour must be reported. Place the nurse's actions in the correct order:", tp: "Framework: Nursing Process/ADPIE — assess the facts first, then act through the chain of command. The first duty is always to the patient.", items: [{"t": "Gather the facts of what occurred, when, and where it happened", "r": "First, the screening and facts come before any report."}, {"t": "Screen the behaviour against the NCSBN issues, such as patient risk", "r": "The NCSBN questions frame whether reporting is warranted."}, {"t": "Report through the proper chain of command with clear facts", "r": "Reports follow the chain of command."}, {"t": "Document the incident objectively with pertinent facts included", "r": "Documentation must be objective and accurate."}] });
BANK.push({ cat: CD, type: "single", stem: "A nurse strongly believes a patient should accept a transfusion, but the competent patient, a Jehovah's Witness, refuses it. Which of the following actions should the nurse take?", tp: "Autonomy protects refusal even when refusal may result in death. Courts balance state interests, but competent refusal stands.", opts: [O("Support the patient's refusal and ensure the care team honours it", true, "Correct. Competent adults may refuse treatment, including on religious grounds. Framework: Maslow."), O("Persuade the family to override the patient's stated refusal today", false, "Wrong. Family cannot override a competent patient's refusal."), O("Chart that the patient is noncompliant and withdraw from the case", false, "Wrong. Refusal is a right, not noncompliance justifying abandonment."), O("Ask the provider to order the transfusion while the patient sleeps", false, "Wrong. Treating a refusing competent patient would violate autonomy and consent law.")] });
BANK.push({ cat: CD, type: "single", stem: "Parents refuse consent for lifesaving treatment for their minor child on religious grounds. The child will die without it. Which outcome does the chapter describe?", tp: "Courts balance patient interest against the state's interest in protecting life and innocent third parties.", opts: [O("A court order may allow the hospital and physicians to treat the child", true, "Correct. Children are innocent third parties; courts grant orders to treat them. Framework: safety first."), O("The parents' refusal ends the matter and treatment must be withheld", false, "Wrong. Courts do not extend adult refusal rights to deny children lifesaving care."), O("The nurse must decide alone whether the treatment proceeds tonight", false, "Wrong. This is a court determination, not a bedside nursing decision."), O("Treatment proceeds only if the child personally signs a consent form", false, "Wrong. A minor's signature is not the mechanism described.")] });
BANK.push({ cat: CD, type: "single", stem: "A terminally ill patient's living will refuses heroic measures, and the patient is now incompetent and unconscious. The daughter demands 'everything be done.' Which document and rule guide care?", tp: "Living wills need two witnesses who are neither relatives nor the physician. Competency termination is by a judge; capacity is judged by physician and family.", opts: [O("The living will guides care, and following it protects staff from liability", true, "Correct. Staff who follow a living will's directions are immune from liability. Framework: Nursing Process/ADPIE."), O("The daughter's demand governs, because family outrank written directives", false, "Wrong. The patient's own prior directive governs, not a relative's demand."), O("The DNR policy alone governs, because living wills are not enforceable", false, "Wrong. Living wills are enforceable once the patient lacks capacity."), O("Care continues fully until a judge reviews the daughter's complaint", false, "Wrong. The directive is implemented within the care team and institution.")] });
BANK.push({ cat: CD, type: "single", stem: "A patient wants one document that names her brother to give, withdraw, or withhold consent, access her records, and interpret her living will. Which document fits?", tp: "The durable power of attorney signature must be notarized; list backup proxies in priority order 1, 2, 3.", opts: [O("A durable power of attorney for health care naming him as her agent", true, "Correct. The agent or proxy holds exactly those listed powers. Framework: Nursing Process/ADPIE."), O("A living will, because it names the person who will decide for her", false, "Wrong. A living will directs treatment; it does not appoint a person."), O("A Patient Care Partnership form signed at the time of admission", false, "Wrong. That document states rights and responsibilities, not decision authority."), O("A HIPAA authorization form naming him as an emergency contact only", false, "Wrong. An emergency contact listing grants no decision authority.")] });
BANK.push({ cat: CD, type: "single", stem: "A nurse objects on moral grounds to assisting with an abortion scheduled this morning. Which of the following actions should the nurse take?", tp: "Diagnosis or lifestyle, such as HIV or sexual orientation, is never a legal basis to refuse care; standard precautions apply to every patient.", opts: [O("Tell the supervisor and request another assignment without abandoning the patient", true, "Correct. Communicate the objection and request reassignment; never abandon. Framework: safety first."), O("Leave the unit until the procedure is finished, without telling anyone", false, "Wrong. Leaving without notice abandons the patient."), O("Refuse all care for this patient for the rest of the entire stay", false, "Wrong. The right to step aside does not extend to avoiding all later care."), O("Counsel the patient that her decision is morally wrong this morning", false, "Wrong. Imposing personal values violates the patient's autonomy.")] });
BANK.push({ cat: CD, type: "single", stem: "A patient asks the nurse, 'What would you do about this surgery?' The nurse helps the patient talk through his own feelings without giving personal opinions. This is an example of:", tp: "Value clarification steps: examine the belief, decide its value, incorporate it into daily behaviour. Refer to clergy or the ethics committee when needed.", opts: [O("Assisting with value clarification while the patient uses his own values", true, "Correct. Nurses encourage expression without contributing personal opinions. Framework: Maslow."), O("Making the treatment decision jointly, as the autonomy principle allows", false, "Wrong. The nurse has no authority to decide for the patient."), O("Beneficence, because the nurse is steering the patient toward good", false, "Wrong. Steering by personal opinion is exactly what must be avoided."), O("A breach of confidentiality, because feelings were discussed openly", false, "Wrong. A private values discussion breaches nothing.")] });
BANK.push({ cat: CD, type: "single", stem: "A physician writes a DNR order after consulting the family of an incapacitated patient with little hope of recovery. During a later code situation, the nurse's duty is to:", tp: "The physician writes the DNR after family consultation and is responsible for following DNR policies.", opts: [O("Follow the DNR order as written in the patient's medical record", true, "Correct. When a DNR order is in the chart, the nurse must follow it. Framework: safety first."), O("Begin CPR anyway, because nurses cannot rely on DNR orders at codes", false, "Wrong. The chapter states the nurse has the duty to follow the order."), O("Ask the family at the bedside whether they still agree tonight", false, "Wrong. The written order governs; bedside polling does not."), O("Wait for the physician to arrive before honouring the written order", false, "Wrong. The order in the chart is the authority to follow.")] });
BANK.push({ cat: CD, type: "single", stem: "A patient with terminal cancer asks the nurse to 'help me end this now' by giving extra medication. The nurse knows practitioner-assisted suicide is viewed by the ANA as:", tp: "Nurses owe compassionate end-of-life care: comfort and pain relief. Proponents cite autonomy and self-determination; states decide legality.", opts: [O("Inconsistent with nursing philosophy under nonmaleficence and beneficence", true, "Correct. ANA objections rest on do-no-harm and the duty to protect life. Framework: Maslow."), O("Permitted whenever a competent patient requests it in writing first", false, "Wrong. A written request does not change the ANA position."), O("A form of passive euthanasia that nurses may support on request", false, "Wrong. PAS is active euthanasia, not passive."), O("A constitutional right the Supreme Court confirmed for all states", false, "Wrong. The 1997 rulings found no constitutional right to assisted suicide.")] });
BANK.push({ cat: CD, type: "matrix", stem: "For each situation, classify it under the ethical principle it best illustrates.", tp: "Framework: Maslow — respect for people underlies all five principles: autonomy, beneficence, nonmaleficence, justice, and respect.", cols: ["Autonomy", "Beneficence", "Nonmaleficence", "Justice"], rows: [{"t": "A competent patient declines a recommended procedure after full discussion", "a": 0, "r": "Free personal choice is autonomy."}, {"t": "A nurse repositions a patient on schedule to prevent skin breakdown injury", "a": 2, "r": "Preventing harm reflects nonmaleficence in this pairing."}, {"t": "A nurse gives the same quality of interventions to every assigned patient", "a": 3, "r": "Equal right to nursing interventions is justice."}, {"t": "A nurse acts to promote a patient's comfort, recovery, and overall wellbeing", "a": 1, "r": "Acting for the patient's good is beneficence."}] });
BANK.push({ cat: CD, type: "dropdown", stem: "Complete each statement about advance directive paperwork: A living will is generally signed before [[0]]. A durable power of attorney for health care requires the signature to be [[1]]. A living will should be reviewed, redated, and initialled [[2]].", tp: "Framework: Nursing Process/ADPIE — paperwork details are classic exam swaps; keep living will and power of attorney rules separate.", blanks: [{"o": [O("two witnesses who are not blood relatives", true, "Both documents use two witnesses who are not blood relatives."), O("the physician who will direct the patient's care", false, "The physician may not serve as a witness."), O("a judge in a court hearing about competency", false, "A judge terminates competency but does not witness signings.")]}, {"o": [O("notarized before it can take legal effect", true, "The chapter states the durable power signature must be notarized."), O("witnessed only by members of the care team", false, "Care team witnessing is not the stated requirement."), O("filed with the state board of nursing office", false, "Copies go to the physician and family, not the board.")]}, {"o": [O("once a year to show the wishes are unchanged", true, "Review yearly, redate, and initial."), O("only after every hospital admission occurs", false, "The printed rhythm is yearly review."), O("never, because changes invalidate the document", false, "Review and redating are expressly advised.")]}] });
BANK.push({ cat: CB, type: "single", stem: "A nurse gives a medication and provides care during a busy shift but forgets to chart either one. In a later lawsuit, the legal presumption applied to that care is:", tp: "Entries must be permanent, accurate, complete, and legible; the record is examined thoroughly in a lawsuit.", opts: [O("The care is presumed not given, because it was not charted in the record", true, "Correct. 'Care was not given if it was not charted' is the chapter's legal presumption. Framework: Nursing Process/ADPIE."), O("The care is presumed given, because the nurse remembers doing it clearly", false, "Wrong. Stating care was provided does not provide legal protection."), O("The charting gap helps the nurse, because less evidence can be used", false, "Wrong. Omissions in charting boost the team bringing the lawsuit."), O("The presumption applies only to medications and never to other care", false, "Wrong. The presumption concerns charted care generally.")] });
BANK.push({ cat: CC, type: "single", stem: "A staff nurse asks why she should consider her own liability policy when her employer already carries insurance for the facility. The best response is:", tp: "Review policy options carefully before purchase so the terms meet your individual needs.", opts: [O("Employer coverage protects the facility, and many experts support individual coverage too", true, "Correct. Employer insurance covers employees through the facility, yet individual coverage is widely supported. Framework: Nursing Process/ADPIE."), O("Employer coverage makes personal assets and wages completely safe in all cases", false, "Wrong. Insurance protects personal assets and wages; vulnerability must be evaluated personally."), O("Individual policies are illegal for nurses who are employed by a facility", false, "Wrong. Many nurses choose individual coverage; nothing prohibits it."), O("Only nurses in management roles ever need to consider liability insurance", false, "Wrong. The decision is personal for every practicing nurse.")] });
BANK.push({ cat: CD, type: "single", stem: "A patient's family and care team disagree about continuing treatment, and no law or policy settles the question. The nurse suggests involving the group the chapter identifies for such questions. That group is:", tp: "First identify the problem as ethical, gather a complete assessment, then consider the ethical principles that apply.", opts: [O("The institution's ethics committee, which helps resolve ethical questions", true, "Correct. Most institutions have an ethics committee that advises on such issues. Framework: Nursing Process/ADPIE."), O("The state board of nursing, which decides bedside treatment disputes daily", false, "Wrong. The board handles licensure, not bedside ethics disputes."), O("The hospital's insurance carrier, which decides disputed treatment questions", false, "Wrong. Insurers do not resolve bedside ethical questions."), O("A court-appointed attorney assigned to every admitted hospital patient", false, "Wrong. No such automatic assignment is described.")] });
BANK.push({ cat: CD, type: "multi", stem: "A nurse works through her own values about a patient's lifestyle before an assignment. Which actions match value clarification? Select all that apply.", tp: "Framework: Maslow — nurses clarify their own values so they do not transfer personal expectations to patients.", opts: [O("Selecting a belief she holds and consciously examining it closely", true, "Correct. That is step 1 of value clarification."), O("Deciding what value that belief actually holds for her personally", true, "Correct. That is step 2 of value clarification."), O("Incorporating the clarified value into her everyday responses", true, "Correct. That is step 3 of value clarification."), O("Requiring the patient to adopt the nurse's clarified values today", false, "Wrong. Patients must act on their own values, not the nurse's."), O("Avoiding any reflection, because values never influence nursing care", false, "Wrong. Values influence everyday decisions and must be examined.")] });
BANK.push({ cat: CA, type: "single", stem: "A float nurse is pressured to accept an expanded assignment during a staffing shortage and worries about liability. Which statement from the chapter applies?", tp: "Orientation gaps are a special challenge for entry-level nurses; seek instruction rather than silently expanding practice.", opts: [O("Short staffing and expanded duties increase a nurse's risk for liability considerably", true, "Correct. The chapter states this risk increase directly. Framework: safety first."), O("Short staffing suspends the standards of care until staffing improves again", false, "Wrong. Standards remain in force regardless of staffing levels."), O("Liability during shortages falls only on the hospital administrators involved", false, "Wrong. Individual nurses carry increased risk in this situation."), O("Accepting extra duties removes the need to know the nurse practice act", false, "Wrong. Knowing the act remains the nurse's own responsibility.")] });
BANK.push({ cat: CB, type: "single", stem: "A hospital system merger and a switch to computer-based records are planned together. The chapter warns these two trends together can:", tp: "Laws govern collection, maintenance, and disclosure of record information, and each institution adds its own policies.", opts: [O("Greatly increase the number of people with access to confidential information", true, "Correct. Both trends together create exactly that confidentiality risk. Framework: safety first."), O("Remove the need for HIPAA privacy standards in the merged system", false, "Wrong. Implementers must take HIPAA standards into consideration."), O("Make medical records public documents available across the new system", false, "Wrong. Records are not public documents, merged system or not."), O("Eliminate the need for log-out procedures on shared computer terminals", false, "Wrong. Computer access safeguards become more important, not less.")] });
BANK.push({ cat: CD, type: "single", stem: "CASE STUDY 1 of 6 — RECOGNIZE CUES: Which findings in this case are legally significant cues the nurse must act on? Select the single best answer.", tp: "PSDA: whether a patient has an advance directive must be documented in the record.", grp: "case1", scen: "CASE STUDY — Mr. Alvarez, 74, is admitted after a fall at home. He is alert and oriented and tells the nurse, 'I signed a living will years ago — no heroic measures if there is no reasonable hope of recovery.' His chart has no advance directive on file, and his daughter, who lives out of state, is listed as his contact. On day 2 he develops pneumonia, becomes confused and unable to state his wishes, and his oxygen saturation falls to 88% on room air. The daughter arrives, produces a copy of his living will, and also shows a durable power of attorney for health care naming her as agent, signed and notarized, with two non-relative witnesses. A nurse on the team is overheard discussing Mr. Alvarez's diagnosis in the cafeteria, and another nurse has posted a unit photo online in which his chart label is visible. The provider is considering an invasive procedure and asks the nurse to 'explain everything and get the consent signed quickly.'", opts: [O("The missing directive on file, the stated living will, and his new confusion", true, "Correct. Missing documentation, an existing directive, and loss of capacity are the key cues. Framework: Nursing Process/ADPIE — recognize cues."), O("His age of 74 years, his fall at home, and his daughter's travel distance", false, "Wrong. Age, fall, and travel are background facts, not the legal cues."), O("His oxygen saturation of 88%, his pneumonia, and his hospital room number", false, "Wrong. Clinical values matter for care, but the legal cues are the directive and capacity."), O("The cafeteria conversation, the unit photo, and the provider's hurry alone", false, "Wrong. Those are real violations, but they are not the first cues about BANK.push({ cat: CD, type: "multi", stem: "CASE STUDY 2 of 6 — ANALYZE CUES: Which problems do the cues support? Select all that apply.", tp: "Framework: Nursing Process/ADPIE — analyze cues before acting.", grp: "case1", scen: "CASE STUDY — Mr. Alvarez, 74, is admitted after a fall at home. He is alert and oriented and tells the nurse, 'I signed a living will years ago — no heroic measures if there is no reasonable hope of recovery.' His chart has no advance directive on file, and his daughter, who lives out of state, is listed as his contact. On day 2 he develops pneumonia, becomes confused and unable to state his wishes, and his oxygen saturation falls to 88% on room air. The daughter arrives, produces a copy of his living will, and also shows a durable power of attorney for health care naming her as agent, signed and notarized, with two non-relative witnesses. A nurse on the team is overheard discussing Mr. Alvarez's diagnosis in the cafeteria, and another nurse has posted a unit photo online in which his chart label is visible. The provider is considering an invasive procedure and asks the nurse to 'explain everything and get the consent signed quickly.'", opts: [O("His advance directive is not documented in the record as required", true, "Correct. The PSDA requires documenting whether a directive exists."), O("He now lacks capacity, so his written directives become enforceable", true, "Correct. Directives act when the patient is incompetent or lacks capacity."), O("Confidentiality has been breached by staff discussion and the photo", true, "Correct. Cafeteria talk and a visible chart label both breach confidentiality."), O("His daughter automatically gains authority because she is next of kin", false, "Wrong. Her authority comes from the durable power of attorney, not kinship alone."), O("His living will expired because it was signed several years ago", false, "Wrong. Directives are reviewed yearly but do not expire as described.")] });
BANK.push({ cat: CD, type: "single", stem: "CASE STUDY 3 of 6 — PRIORITIZE HYPOTHESES: Which issue takes priority for the nurse right now?", tp: "First duty is to the patient: his prior competent wishes control when he cannot speak.", grp: "case1", scen: "CASE STUDY — Mr. Alvarez, 74, is admitted after a fall at home. He is alert and oriented and tells the nurse, 'I signed a living will years ago — no heroic measures if there is no reasonable hope of recovery.' His chart has no advance directive on file, and his daughter, who lives out of state, is listed as his contact. On day 2 he develops pneumonia, becomes confused and unable to state his wishes, and his oxygen saturation falls to 88% on room air. The daughter arrives, produces a copy of his living will, and also shows a durable power of attorney for health care naming her as agent, signed and notarized, with two non-relative witnesses. A nurse on the team is overheard discussing Mr. Alvarez's diagnosis in the cafeteria, and another nurse has posted a unit photo online in which his chart label is visible. The provider is considering an invasive procedure and asks the nurse to 'explain everything and get the consent signed quickly.'", opts: [O("Ensuring his documented wishes and his agent's authority guide decisions", true, "Correct. With capacity lost, his directive and agent drive care decisions. Framework: Maslow."), O("Correcting the nurse who posted the unit photo during this same shift", false, "Wrong. The breach must be addressed, but his decision authority is the priority."), O("Explaining the invasive procedure so consent can be signed quickly", false, "Wrong. Disclosure is the provider's job, and he cannot consent while confused."), O("Asking the daughter to leave decisions entirely to the care team", false, "Wrong. She is his appointed agent and must be included.")] });
BANK.push({ cat: CD, type: "multi", stem: "CASE STUDY 4 of 6 — GENERATE SOLUTIONS: Which actions should the nurse plan? Select all that apply.", tp: "Framework: Nursing Process/ADPIE — generate solutions that honour the directive and the law.", grp: "case1", scen: "CASE STUDY — Mr. Alvarez, 74, is admitted after a fall at home. He is alert and oriented and tells the nurse, 'I signed a living will years ago — no heroic measures if there is no reasonable hope of recovery.' His chart has no advance directive on file, and his daughter, who lives out of state, is listed as his contact. On day 2 he develops pneumonia, becomes confused and unable to state his wishes, and his oxygen saturation falls to 88% on room air. The daughter arrives, produces a copy of his living will, and also shows a durable power of attorney for health care naming her as agent, signed and notarized, with two non-relative witnesses. A nurse on the team is overheard discussing Mr. Alvarez's diagnosis in the cafeteria, and another nurse has posted a unit photo online in which his chart label is visible. The provider is considering an invasive procedure and asks the nurse to 'explain everything and get the consent signed quickly.'", opts: [O("Place copies of the living will and power of attorney in his record", true, "Correct. Copies belong in the medical record and with his physician."), O("Communicate his advance directive status to the whole care team", true, "Correct. Communicating directives to personnel is required practice."), O("Refer the consent explanation to the provider performing the procedure", true, "Correct. Disclosure belongs to the performing provider."), O("Obtain his signature on a new consent form while he is confused", false, "Wrong. An impaired, confused patient cannot give competent consent."), O("Tell the daughter her documents arrived too late to be honoured", false, "Wrong. Valid directives are honoured when capacity is lost.")] });

BANK.push({ cat: CD, type: "single", stem: "CASE STUDY 6 of 6 — EVALUATE OUTCOMES: Which outcome shows the plan worked as intended?", tp: "Evaluate against the patient's own stated wishes — autonomy carried forward by his documents.", grp: "case1", scen: "CASE STUDY — Mr. Alvarez, 74, is admitted after a fall at home. He is alert and oriented and tells the nurse, 'I signed a living will years ago — no heroic measures if there is no reasonable hope of recovery.' His chart has no advance directive on file, and his daughter, who lives out of state, is listed as his contact. On day 2 he develops pneumonia, becomes confused and unable to state his wishes, and his oxygen saturation falls to 88% on room air. The daughter arrives, produces a copy of his living will, and also shows a durable power of attorney for health care naming her as agent, signed and notarized, with two non-relative witnesses. A nurse on the team is overheard discussing Mr. Alvarez's diagnosis in the cafeteria, and another nurse has posted a unit photo online in which his chart label is visible. The provider is considering an invasive procedure and asks the nurse to 'explain everything and get the consent signed quickly.'", opts: [O("His care follows his living will, with his agent deciding open questions", true, "Correct. Care matching his prior wishes, with his agent for gaps, is the intended outcome. Framework: Nursing Process/ADPIE — evaluate outcomes."), O("The team proceeded quickly because the provider's schedule was protected", false, "Wrong. Speed for the provider is not the outcome that matters."), O("The daughter reported satisfaction because staff made every decision for her", false, "Wrong. Staff deciding for her would defeat the power of attorney."), O("No documentation was needed because the family understood the plan", false, "Wrong. Directives and decisions must be documented in the record.")] });

  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 2: Legal and Ethical Aspects of Nursing</h1>';
  h += '<div class="sub">Brutal mode | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
