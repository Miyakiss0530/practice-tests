BANK.push({ cat: CA, type: "single", kt: ["alignment"], stem: "Which statement about alignment is accurate?", opts: [O("Alignment is the relationship of body parts to one another, and it balances and coordinates movement smoothly", true, "Correct. Alignment of the parts is what lets movement stay smooth, coordinated, and safe."), O("Alignment is the force a muscle group can produce when a nurse lifts a patient without any assistance at all", false, "That describes muscle strength, not the relationship of body parts to one another."), O("Alignment is the width between the feet while standing, widened to give the nurse stability and equilibrium", false, "That describes the base of support, a related but different body mechanics concept."), O("Alignment is the science of matching workplace conditions and job demands to the capabilities of workers", false, "That is the definition of ergonomics, not of body alignment.")], tp: "Alignment: parts in proper relationship to one another, balancing and coordinating movement." });
BANK.push({ cat: CA, type: "single", kt: ["base of support"], stem: "A nurse widens the base of support in the direction of a planned move. What does this change accomplish?", opts: [O("Less effort is needed to carry out the activity, because stability rises with a broader base of support", true, "Correct. A broader base in the direction of movement increases stability and cuts the effort needed."), O("The workload shifts onto the back muscles, because a wider stance reduces how much the legs can contribute", false, "A wider stance shifts work toward the large leg muscles, not onto the vulnerable back."), O("The patient becomes easier to lift overhead, because a broad base raises the safe lifting height to chest level", false, "A broad base does not raise lifting height; objects are never lifted higher than chest level."), O("Twisting of the spine becomes safer, because a wide stance absorbs rotation during a turn of the trunk", false, "Twisting is avoided outright; a wide stance does not make spinal twisting safe.")], tp: "Widen the base of support in the direction of movement: more stability, less effort." });
BANK.push({ cat: CA, type: "single", stem: "Which practice follows the chapter rule for lifting a heavy box of supplies from the floor?", opts: [O("Bend the knees and hips with the back kept straight, then lift using the large muscles of the legs", true, "Correct. Flexing knees and hips and lifting with leg muscles protects the lower back from strain."), O("Bend from the waist with the knees kept straight, then lift using the muscles of the lower back first", false, "Bending from the waist is the exact pattern the chapter says strains the lower back."), O("Keep the box at arm's length away from the body, then lift so the shoulders do most of the pulling work", false, "Objects are carried close to the midline; holding them away increases the lifter's workload."), O("Twist the trunk toward the shelf while lifting, then set the box down above shoulder height on the shelf", false, "Twisting the spine and reaching above the shoulders are both listed as practices to avoid.")], tp: "Lift with knees and hips flexed, back straight, large leg muscles doing the work, load close to the body." });
BANK.push({ cat: CA, type: "single", stem: "What does the instruction to lift twice, first mentally and then physically, accomplish?", opts: [O("It helps the nurse determine whether assistance is needed before the actual lift is attempted", true, "Correct. The mental lift is a planning step that reveals whether help or a device is required."), O("It doubles the strengthening benefit of the lift, because imagining a lift trains the same muscle groups", false, "Imagining the lift does not train muscles; its purpose is planning and safety judgment."), O("It satisfies the facility weight limit, because a mentally rehearsed lift counts as a two-person lift", false, "A mental rehearsal never substitutes for a second person or for a mechanical device."), O("It replaces the need to set the abdominal muscles, because preparation happens in the mind beforehand", false, "The abdominal and gluteal muscles are still set physically in preparation for the move.")], tp: "Lift twice: the mental lift comes first and tells you whether assistance is needed." });
BANK.push({ cat: CA, type: "single", stem: "Which pair of weight-limit statements matches what the chapter prints?", opts: [O("Many facilities suggest a 50-lb staff limit, while NIOSH advises never lifting over 35 lb of body weight", true, "Correct. The book prints both numbers from two different sources, and the question source decides."), O("Many facilities suggest a 35-lb staff limit, while NIOSH advises never lifting over 50 lb of body weight", false, "The two numbers are reversed here; the facility suggestion is 50 lb and the NIOSH figure is 35 lb."), O("Both the facilities and NIOSH advise the same 50-lb limit, and no other figure appears anywhere in print", false, "The chapter prints two different figures, which is exactly why this pair is a known trap."), O("Both the facilities and NIOSH advise the same 35-lb limit, and heavier loads always require three workers", false, "Again only one figure is used; the book gives a 50-lb facility suggestion and a 35-lb NIOSH limit.")], tp: "Trap pair: facilities suggest 50 lb; NIOSH says never lift more than 35 lb of a patient's body weight." });
BANK.push({ cat: CA, type: "single", kt: ["ergonomics"], stem: "Ergonomics, as the chapter defines it, is concerned primarily with which of the following?", opts: [O("Matching workplace conditions and job demands to worker capabilities, especially to prevent injury", true, "Correct. Ergonomics matches the job to the worker, with musculoskeletal injury prevention central."), O("Matching a patient's position to the angle of the bed, especially to prevent pressure injury to skin", false, "Positioning angles belong to patient positioning, not to the science of ergonomics."), O("Matching the sling size to the patient's body weight, especially before any mechanical lift transfer", false, "Sling fit is a lift skill detail, not the definition of ergonomics as a science."), O("Matching exercises to each joint in the body, especially to prevent contracture during immobility", false, "Joint-by-joint exercise matching describes range-of-motion planning, not ergonomics.")], tp: "Ergonomics: matching workplace conditions and job demands to the capabilities of workers." });
BANK.push({ cat: CA, type: "single", stem: "Which statement about injury rates matches the Bureau of Labor Statistics figures in the chapter?", opts: [O("Long-term care workers are injured at 174 per 10,000, more than three times the rate in other industries", true, "Correct. Long-term care carries the highest rate printed, at 174 per 10,000 workers."), O("Hospital workers are injured at 174 per 10,000, more than three times the rate in other industries today", false, "The 174 figure belongs to long-term care; the hospital worker rate printed is 68 per 10,000."), O("Hospital workers are injured at 34 per 10,000, about half the rate reported across other industries today", false, "The hospital rate is 68 per 10,000, which is twice the rate of other industries, not half."), O("Long-term care workers are injured at 68 per 10,000, about twice the rate reported in other industries", false, "The 68 per 10,000 figure and the twice-the-rate comparison both belong to hospital workers.")], tp: "Numbers: hospital workers 68 per 10,000 (twice other industries); long-term care 174 per 10,000." });
BANK.push({ cat: CA, type: "multi", stem: "Which statements about safe-lift programs match the evidence summary in the chapter? Select all that apply.", opts: [O("All facilities in the study reported fewer work injuries and compensation claims after the program began", true, "Correct. Every facility surveyed reported a decrease in injuries and worker's compensation claims."), O("Personnel should use mechanical lifting devices every time the patient's condition warrants a lift", true, "Correct. The standard printed is use of the device 100 percent of the time a lift is warranted."), O("All nursing personnel must be trained in the proper use of mechanical lifting devices on the unit", true, "Correct. Training of all nursing personnel in device use is a stated requirement."), O("Staff compliance with device use in the study reached 100 percent across all 200 facilities surveyed", false, "Compliance was 80 percent, not 100 percent; 95 percent of facilities had lifts available."), O("Injuries decreased in most facilities, but compensation claims rose because lifts slowed down care", false, "Claims decreased along with injuries; no rise in claims is reported in the study summary.")], tp: "Safe-lift evidence: 200 facilities, 95% had lifts, 80% compliance, injuries and claims down in all." });
BANK.push({ cat: CB, type: "single", stem: "Fowler's position is set by raising the head of the bed to which angle?", opts: [O("45 to 60 degrees, with a footboard or firm pillow placed so the patient does not slide down in bed", true, "Correct. Fowler's is 45 to 60 degrees, with supports that stop sliding and support the arms."), O("About 30 degrees, with pillow placement following the same steps used for the semi-upright positions", false, "About 30 degrees is semi-Fowler's, which is the halfway version of this same position family."), O("90 degrees, with a pillow on the overbed table so the patient can lean forward and rest the head down", false, "90 degrees with the overbed table describes the orthopneic position, used to ease breathing."), O("0 degrees, with the head of the bed kept fully flat and a small rolled towel placed under the back", false, "A flat bed with a lumbar roll describes the dorsal supine position, not Fowler's position.")], tp: "Angles: Fowler's 45-60 degrees; semi-Fowler's about 30 degrees; orthopneic 90 degrees." });
BANK.push({ cat: CB, type: "single", stem: "Which description matches the Sims position?", opts: [O("Side-lying, only partially on the abdomen, with knee and thigh drawn up near the abdomen on pillows", true, "Correct. Sims combines side-lying with a partial turn toward the abdomen and a flexed upper leg."), O("Face down in a horizontal position, with the face turned to one side and the arms flexed upward high", false, "Face down describes the prone position; Sims keeps the patient mostly on the side."), O("Flat on the side, with pillows behind the back and between the legs and the legs kept fully straight", false, "Flat side-lying with straight legs is the lateral position, without the partial abdominal turn."), O("On the back, with hips and knees flexed and the feet placed in stirrups on the examining table edge", false, "Supine with stirrups describes the lithotomy position used for examinations, not Sims.")], tp: "Sims: side-lying, partially on the abdomen, upper knee and thigh drawn up and supported." });
BANK.push({ cat: CB, type: "single", stem: "How does dorsal recumbent differ from dorsal supine?", opts: [O("In dorsal recumbent the head and shoulders rest on a pillow and the extremities are moderately flexed", true, "Correct. The pillow under head and shoulders plus flexed extremities separate it from flat supine."), O("In dorsal recumbent the patient lies face down, while in dorsal supine the patient lies flat on the back", false, "Face-down lying is the prone position; both dorsal positions keep the patient on the back."), O("In dorsal recumbent the head of the bed is at 60 degrees, while dorsal supine keeps it near 30 degrees", false, "Neither dorsal position uses those angles; those numbers belong to Fowler's and semi-Fowler's."), O("In dorsal recumbent the legs rest in stirrups, while in dorsal supine the legs rest flat on the mattress", false, "Stirrups belong to the lithotomy position, not to either of the dorsal positions.")], tp: "Dorsal recumbent is not flat: head and shoulders on a pillow, extremities moderately flexed." });
BANK.push({ cat: CB, type: "single", stem: "A trochanter roll placed for a supine patient serves which purpose?", opts: [O("It prevents external rotation of the legs by lying parallel to the lateral surface of the thighs", true, "Correct. The roll braces the lateral thigh so the hip cannot roll outward while the patient is supine."), O("It keeps the foot held in dorsiflexion by pressing the sole firmly against a rigid board all day", false, "Holding the foot in dorsiflexion is the job of foot drop boots or a foot board, not this roll."), O("It keeps the fingers slightly flexed by giving the hand something soft and round to rest around now", false, "Maintaining the hand and fingers is the job of a hand roll placed in the patient's palm."), O("It holds the legs apart in abduction by wedging a firm splint between them after hip surgery ends", false, "Holding the legs in abduction after hip replacement is the job of an abductor splint.")], tp: "Device match: trochanter roll prevents external rotation of the legs in supine position." });
BANK.push({ cat: CB, type: "single", stem: "Which device keeps the hand in a normal position and the fingers slightly flexed?", opts: [O("A hand roll, which also prevents skin-to-skin contact between the palm and the fingers of that hand", true, "Correct. The hand roll maintains hand position, slight finger flexion, and separation of skin surfaces."), O("A hand-wrist splint, which holds the lower arm aligned and the wrist in slight dorsiflexion all day", false, "The splint aligns the forearm and wrist; the slight finger flexion role belongs to the hand roll."), O("A trapeze bar, which the patient grips overhead to raise the trunk and strengthen the upper arm now", false, "The trapeze bar is for raising the trunk and arm exercise, not for resting hand position."), O("A foot board, which braces the hand at the side of the bed in a fixed neutral resting posture now", false, "A foot board braces the feet in dorsiflexion; it has no role in hand positioning at all.")], tp: "Device match: hand roll keeps the hand normal, fingers slightly flexed, palm skin separated." });
BANK.push({ cat: CB, type: "single", stem: "A trapeze bar is mounted over a patient's bed. What does this device allow the patient to do?", opts: [O("Raise the trunk from the bed to assist in movement, and perform exercises that strengthen upper arms", true, "Correct. The trapeze lets the patient lift the trunk to help with moves and build arm strength."), O("Hold the legs in abduction after hip surgery, keeping the new joint safely aligned during bed rest", false, "Abduction after hip replacement is maintained by an abductor splint, not an overhead bar."), O("Roll from side to side and sit up in bed, while also gaining a sense of security in the hospital bed", false, "Rolling and sitting up with a sense of security is the listed use of a side rail, not the trapeze."), O("Add firmness under the mattress, so the surface supports the body during long periods of bed rest", false, "Added mattress firmness is the purpose of a bed board placed under the mattress.")], tp: "Device match: trapeze bar - raise the trunk, assist movement, strengthen the upper arms." });
BANK.push({ cat: CB, type: "single", stem: "Which statement about lower-extremity positioning to prevent complications is accurate?", opts: [O("A pillow or wedge goes between the legs, and a pillow is never placed under the knees of the patient", true, "Correct. Between the legs is supported positioning; under the knees promotes venous pooling."), O("A pillow under the knees is preferred, because flexed knees keep venous blood moving out of the legs", false, "A pillow under the knees is specifically prohibited; it pools venous blood and feeds clot risk."), O("The legs should be crossed at the ankles, because crossing keeps the lower legs in neutral alignment", false, "Crossing the legs is taught against for thrombophlebitis prevention; it is never the plan."), O("The heels should rest directly on the mattress, because elevating them adds pressure to the calves", false, "Heels are elevated with a small pillow or roll under the ankle to reduce heel pressure.")], tp: "Pillow between the legs, never under the knees - under-knee support pools venous blood." });
BANK.push({ cat: CB, type: "multi", stem: "A nurse is setting up the dorsal supine position for an immobile patient. Which supports belong in this setup? Select all that apply.", opts: [O("A small rolled towel placed under the lumbar area of the back to maintain correct spinal alignment", true, "Correct. The lumbar roll maintains alignment and prevents flexion contractures of the spine."), O("Trochanter rolls placed parallel to the lateral thighs to reduce external rotation of the hips", true, "Correct. Lateral thigh rolls keep the hips from rotating outward while the patient lies supine."), O("A firm support at the feet holding them in dorsiflexion, such as a footboard or high-top sneakers", true, "Correct. Dorsiflexion support at the feet is the standing defense against foot drop."), O("A small pillow or roll under the ankle that elevates the heel and reduces pressure on the heels", true, "Correct. Elevating the heel off the surface reduces pressure and helps prevent skin impairment."), O("A pillow wedged firmly under both knees so the knees stay flexed and comfortable for long periods", false, "Knees are never propped on a pillow; that position pools venous blood in the lower legs."), O("Hand rolls left out of the hands so the fingers can rest fully extended flat against the mattress", false, "Supine setup includes hand rolls to reduce finger extension and thumb abduction problems.")], tp: "Supine setup: lumbar roll, trochanter rolls, heel elevation, dorsiflexion support, hand rolls." });
BANK.push({ cat: CB, type: "single", stem: "The orthopneic position is arranged by which setup?", opts: [O("Head of bed raised to 90 degrees, with a pillow on the overbed table for the patient to lean onto", true, "Correct. Orthopneic is fully upright at 90 degrees, leaning forward onto a pillow on the table."), O("Head of bed raised 45 to 60 degrees, with a footboard placed so the patient cannot slide downward", false, "That angle and footboard setup describes Fowler's position, not the orthopneic position."), O("Head lower than the body with the legs elevated on an incline, sometimes with the foot on blocks", false, "Head-low with elevated legs describes Trendelenburg's position, the opposite arrangement."), O("Kneeling on the bed with weight on the knees and chest, the abdomen raised and the head turned", false, "Kneeling with weight on knees and chest describes the knee-chest or genupectoral position.")], tp: "Orthopneic: 90 degrees upright, leaning forward over a pillow on the overbed table." });
BANK.push({ cat: CC, type: "single", kt: ["immobility"], stem: "Immobility leads to constipation through which mechanism?", opts: [O("Peristalsis slows so stool stays in the colon longer, while the abdominal muscles that expel stool weaken", true, "Correct. Slowed peristalsis plus atrophied abdominal muscles produce immobility constipation."), O("Appetite falls so less food enters the bowel, while the metabolic rate rises and speeds the bowel up", false, "Appetite and metabolic rate both fall; a rising metabolic rate is not part of this mechanism."), O("Urinary stasis changes the pH of the urine, while bacteria grow and back up into the lower colon area", false, "pH change and bacterial growth from stasis describe urinary tract infection, not constipation."), O("Venous blood pools in the lower legs, while vessel inflammation slows the return of blood upward now", false, "Pooling and vessel inflammation describe thrombophlebitis and clot formation in the legs.")], tp: "Constipation of immobility: slow peristalsis, longer colon time, weak abdominal muscles." });
BANK.push({ cat: CC, type: "single", kt: ["contracture"], stem: "A contracture develops in an immobile patient because of which process?", opts: [O("Muscles, ligaments, and tendons that are never shortened and lengthened by movement shorten permanently", true, "Correct. Without regular shortening and lengthening, these structures shorten for good."), O("Bones lose calcium without weight bearing, so the joints fuse in whatever position they rest in now", false, "Bone demineralization without weight bearing is disuse osteoporosis, a bone problem, not this one."), O("Secretions pool in the lungs without deep breathing, so inflammation stiffens the chest wall muscles", false, "Pooled secretions and lung inflammation describe hypostatic pneumonia, not contracture."), O("Blood pools in the veins of the legs, so clots form and block the joint from moving through its arc", false, "Pooled venous blood and clot formation describe thrombophlebitis, not a shortening contracture.")], tp: "Contracture: permanent shortening of muscle, ligament, and tendon that movement no longer stretches." });
BANK.push({ cat: CC, type: "single", stem: "Renal calculi in the immobile patient form through which chain?", opts: [O("Urinary stasis slows calcium metabolism, and the slowed handling of calcium leads to stone formation", true, "Correct. Stasis-driven change in calcium metabolism is the printed path to kidney stones."), O("Venous stasis inflames the vessel walls, and fragments of clot lodge in the filtering units of kidneys", false, "Inflamed vessels and traveling clots describe thrombophlebitis and pulmonary embolism instead."), O("Decreased aeration pools secretions in the kidney, and the pooled fluid hardens into small stones", false, "Decreased aeration and pooled secretions belong to the lungs and hypostatic pneumonia."), O("Unrelieved pressure cuts off blood flow to the kidney, and ischemic tissue calcifies into stones", false, "Tissue ischemia from unrelieved pressure is the mechanism of pressure ulcer formation.")], tp: "Renal calculi: urinary stasis slows calcium metabolism, which leads to stone formation." });
BANK.push({ cat: CC, type: "single", kt: ["orthostatic hypotension"], stem: "Which set of blood pressure changes meets the chapter definition of orthostatic hypotension?", opts: [O("Systolic falls 20 mm Hg, or diastolic falls 10 mm Hg, within 3 minutes of moving to standing", true, "Correct. Those are the printed thresholds and the printed time window for the diagnosis."), O("Systolic falls 10 mm Hg, or diastolic falls 20 mm Hg, within 3 minutes of moving to standing", false, "The two numbers are swapped; systolic is 20 and diastolic is 10 in the printed definition."), O("Systolic falls 20 mm Hg, or diastolic falls 10 mm Hg, within 30 minutes of moving to standing", false, "The time window is 3 minutes, not 30; late drops outside the window do not meet it."), O("Systolic rises 20 mm Hg, or diastolic rises 10 mm Hg, within 3 minutes of moving to standing", false, "The pressures fall in orthostatic hypotension; a rise on standing is the opposite pattern.")], tp: "Orthostatic hypotension: down 20 systolic or down 10 diastolic within 3 minutes of standing." });
BANK.push({ cat: CC, type: "single", kt: ["capillary refill"], stem: "Which capillary refill result is normal for an older adult patient?", opts: [O("Blood returns to the nail bed within 5 seconds after the nail bed was pressed for 3 to 5 seconds", true, "Correct. Older adults are allowed up to 5 seconds for return; the press itself lasts 3 to 5 seconds."), O("Blood returns to the nail bed within 3 seconds after the nail bed was pressed for 5 to 8 seconds", false, "The 3-second return is the standard for younger patients, and the press time tops out at 5 seconds."), O("Blood returns to the nail bed within 8 seconds after the nail bed was pressed for 3 to 5 seconds", false, "An 8-second return is delayed in any age group and signals circulatory impairment to report."), O("Blood returns to the nail bed within 5 seconds after the nail bed was pressed for 10 full seconds", false, "The press is approximately 3 to 5 seconds; holding pressure for 10 seconds is not the technique.")], tp: "Capillary refill: press 3-5 seconds; return within 3 seconds, or 5 seconds in older adults." });
BANK.push({ cat: CC, type: "multi", stem: "Which findings belong to the neurovascular (CMS) check the LPN/LVN performs on an injured limb? Select all that apply.", opts: [O("Skin color and skin temperature of the area distal to the injury, compared with the other side", true, "Correct. Color and temperature distal to the injury are the first two CMS characteristics."), O("Movement and sensation of the area distal to the injury, including any numbness or tingling felt", true, "Correct. Movement and sensation, including paresthesia, are core CMS characteristics."), O("Pulses distal to the injury and capillary refill of the nail beds beyond the injured area today", true, "Correct. Distal pulses and capillary refill complete the circulation side of the CMS check."), O("Pain, assessed by location, nature, and frequency, and rated by the patient on a pain scale now", true, "Correct. Pain location, nature, frequency, and a scale rating are part of the assessment."), O("Blood pressure and respiratory rate taken at the injury site, compared with the unaffected limb", false, "Vital signs are not CMS characteristics; CMS covers color, temperature, movement, sensation, pulses, refill, pain."), O("Range of motion of every joint in the body, measured in degrees and charted against the care plan", false, "A full-body ROM measurement is a mobility assessment, not the focused CMS check of one limb.")], tp: "CMS check: color, temperature, movement, sensation, pulses, capillary refill, and pain - always compared with the unaffected side." });
BANK.push({ cat: CC, type: "single", kt: ["compartment syndrome"], stem: "Which description fits chronic compartment syndrome rather than the acute form?", opts: [O("Pain and cramping during exercise with visible muscle bulging and numbness, relieved by rest", true, "Correct. The chronic form is exercise-driven, is not an emergency, and eases when activity stops."), O("Pain inside the muscle on stretch that is far more intense than the injury itself would explain", false, "Pain out of proportion, especially on stretch, is the earliest warning of the acute emergency."), O("A full, tight feeling in the muscle of a leg held inside a fresh long-leg cast after a fracture", false, "A tight, full feeling in a casted limb points to the acute form building under external pressure."), O("Numbness and paralysis in a limb six hours after a crushing injury to the muscles of that limb", false, "Numbness and paralysis are late signs of the acute form and may signal permanent damage done.")], tp: "Chronic compartment syndrome: exercise pain and cramping, bulging, numbness - relieved by rest; not an emergency." });
BANK.push({ cat: CC, type: "single", stem: "A pressure ulcer forms through which mechanism?", opts: [O("Unrelieved pressure causes tissue ischemia, a lack of blood flow to the area, and the skin breaks down", true, "Correct. Ischemia from unrelieved pressure is the printed mechanism of pressure ulcer formation."), O("Urinary stasis changes the pH at the skin surface, and bacterial growth breaks the skin down slowly", false, "Stasis, pH change, and bacterial growth describe urinary tract infection, not pressure injury."), O("Pooled venous blood inflames the vessel wall under the skin, and the inflamed area opens into an ulcer", false, "Inflamed vessels from pooled blood describe thrombophlebitis in the lower extremity veins."), O("Lack of stimulation lowers endorphin production, and the lowered production weakens the skin barrier", false, "Lowered stimulation and endorphins are listed under disorientation, not skin breakdown.")], tp: "Pressure ulcer: unrelieved pressure, tissue ischemia, skin breakdown." });
BANK.push({ cat: CC, type: "single", stem: "Which statement about thrombophlebitis in immobility is accurate?", opts: [O("Decreased venous circulation lets blood pool in the lower extremities, inflaming vessels and forming clots", true, "Correct. Pooling from decreased venous circulation drives the inflammation and clot formation."), O("Decreased arterial circulation lets blood pool in the lower extremities, inflaming vessels and forming clots", false, "The pooling is venous; arterial problems do not pool blood in the legs in this mechanism."), O("Increased venous return from the legs speeds blood past the valves, inflaming vessels and forming clots", false, "Immobility decreases venous circulation; increased return is the opposite of the mechanism."), O("Slowed peristalsis in the bowel backs pressure into the leg veins, inflaming vessels and forming clots", false, "Slowed peristalsis produces constipation; it does not drive the leg vein inflammation and clots.")], tp: "Thrombophlebitis/DVT: decreased venous circulation, pooling in the legs, inflamed vessels, clots." });
BANK.push({ cat: CC, type: "single", stem: "The chapter tracks immobility effects mainly with which kind of data?", opts: [O("Measurements such as orthostatic blood pressures, pain ratings, and neurovascular checks on the limbs", true, "Correct. The chapter follows immobility with measurements and checks, not with blood tests."), O("Blood tests such as calcium levels and white counts drawn each morning while the patient is immobile", false, "No blood test panel is assigned to immobility in this chapter; calcium appears in the stone mechanism only."), O("Imaging studies such as daily chest films and leg ultrasounds ordered for every patient on bed rest", false, "Routine daily imaging for every immobile patient is not the chapter's tracking method."), O("Culture results from urine and sputum samples collected at the start of every shift on the unit", false, "Cultures are not the tracking tool named; orthostatic pressures and CMS checks are.")], tp: "Immobility is tracked with measurements: orthostatic BP, pain 1-10, and CMS checks." });
BANK.push({ cat: CD, type: "single", kt: ["active ROM"], stem: "Active-assisted range of motion is best described as which arrangement?", opts: [O("The patient uses the strong arm to exercise the weaker or paralyzed arm through its range of motion", true, "Correct. In active-assisted ROM the patient's own strong limb does the assisting."), O("Caregivers move the patient's joints for the patient, who contributes no effort to the movement", false, "Caregivers moving every joint is passive ROM; the patient contributes nothing there."), O("The patient performs every movement alone, without any help from a limb or from a caregiver now", false, "Performing everything alone is active ROM, the fully independent form of the exercise."), O("The patient moves a limb partway, and the nurse then assists the patient to finish the full range", false, "Moving partway with the nurse finishing is passive-assisted ROM, a different arrangement.")], tp: "Four ROM kinds: active (patient), passive (caregiver), active-assisted (strong arm helps weak), passive-assisted (nurse finishes)." });
BANK.push({ cat: CD, type: "single", kt: ["passive ROM"], stem: "Which example shows passive-assisted range of motion?", opts: [O("A patient lifts her weak arm halfway through its arc, and the nurse helps her complete the full motion", true, "Correct. Partial patient movement finished with nurse assistance is passive-assisted ROM."), O("A patient raises her strong arm overhead repeatedly, following the exercise sheet taped to the wall", false, "Moving a strong limb alone through its arc is active ROM performed by the patient."), O("A nurse moves a comatose patient's arm through its full arc while the patient makes no effort at all", false, "No patient effort with the caregiver doing all movement is passive ROM, not this type."), O("A patient uses her strong arm to carry her weak arm through the full arc without any nurse helping", false, "The strong arm assisting the weak arm is active-assisted ROM, not passive-assisted.")], tp: "Passive-assisted: patient moves partially, nurse assists to finish the full ROM." });
BANK.push({ cat: CD, type: "single", stem: "During ROM exercises, the joint is moved to which endpoint?", opts: [O("To the point of resistance or pain, with avoidance of injury, increasing as tolerated over sessions", true, "Correct. Resistance or pain is the stopping point; range grows gradually as tolerated."), O("Past the point of resistance on the first session, so the full range is restored as quickly as possible", false, "Pushing past resistance risks injury and breaks the chapter's stopping rule outright."), O("To a fixed angle printed in the table for every patient, regardless of pain reported during motion", false, "The endpoint is the individual's resistance or pain point, not a universal printed angle."), O("Just short of any resistance at all times, so the joint never approaches its current end of range", false, "Stopping far short of resistance would never maintain or improve the joint's range.")], tp: "ROM endpoint: move each joint to the point of resistance or pain - never beyond it." });
BANK.push({ cat: CD, type: "single", stem: "What total amount of activity does the chapter say can prevent disuse syndrome?", opts: [O("Only about 2 hours of activity for every 24-hour period, scheduled spread throughout the day", true, "Correct. The printed total is surprisingly small: about 2 hours per 24 hours, spread out."), O("Only about 30 minutes of activity for every 24-hour period, done in one session each morning", false, "30 minutes in one block understates the total and ignores the spread-through-the-day plan."), O("About 8 hours of activity for every 24-hour period, done in long sessions between care tasks", false, "Eight hours far exceeds the printed total and would exhaust the immobile patient."), O("About 12 hours of activity for every 24-hour period, alternated hourly with full bed rest all day", false, "Half the day in activity is not the chapter figure; the figure is about 2 hours total.")], tp: "Disuse syndrome prevention: only about 2 hours of activity per 24 hours, scheduled through the day." });
BANK.push({ cat: CD, type: "single", stem: "A continuous passive motion machine is set according to which source?", opts: [O("The health care provider's orders for the degree and speed of flexion and extension for that patient", true, "Correct. CPM degree and speed are set per the provider's orders for each individual patient."), O("The patient's own comfort report alone, with the machine raised each day until the patient objects", false, "Comfort matters in care, but the machine settings follow the provider's ordered degree and speed."), O("A standard factory setting used for every knee patient, adjusted only when the machine alarms sound", false, "One factory setting for all patients ignores the individual orders the chapter requires."), O("The physical therapist's preference alone, with no order needed because the machine is not a treatment", false, "CPM is a treatment with ordered settings; physical therapy accompanies it rather than replacing orders.")], tp: "CPM: settings adjusted to the provider's orders for degree and speed of flexion and extension." });
BANK.push({ cat: CD, type: "single", stem: "Which finding during ROM exercises requires the nurse to stop the exercise?", opts: [O("The patient reports pain, or resistance or a muscle spasm occurs in the joint being exercised", true, "Correct. Pain, resistance, or spasm are the three printed stop signals for ROM exercise."), O("The patient completes five full repetitions of the sequence, reaching the printed repetition count", false, "Five repetitions is the planned dose of the exercise sequence, not a danger signal to stop for."), O("The patient asks a question about the exercise, pausing the movement while the nurse gives an answer", false, "A question pauses teaching, not the exercise itself; it is not one of the stop signals."), O("The joint moves smoothly through its full range, with the patient reporting the motion feels easier", false, "Smooth full movement with easing discomfort is the goal state, not a reason to discontinue.")], tp: "Stop ROM for pain, resistance, or muscle spasm - the sequence is repeated five times, head-to-toe." });
BANK.push({ cat: CD, type: "single", stem: "Pointing the toes upward toward the shin during ankle exercise is which movement?", opts: [O("Dorsiflexion, the backward flexion of the foot that a footboard also maintains to prevent foot drop", true, "Correct. Toes pointed upward is dorsiflexion, the position that prevents foot drop."), O("Plantar flexion, the movement that points the toes downward and produces foot drop if it is kept", false, "Toes downward is plantar flexion; the stem describes toes pointed upward instead."), O("Inversion, the movement that turns the sole of the foot medially toward the midline of the body", false, "Turning the sole medially is inversion, a sideways turn rather than an upward point."), O("Eversion, the movement that turns the sole of the foot laterally away from the midline of the body", false, "Turning the sole laterally is eversion, also a sideways turn and not an upward point.")], tp: "Ankle words: dorsiflexion toes up; plantar flexion toes down; inversion sole in; eversion sole out." });
BANK.push({ cat: CD, type: "multi", stem: "Which statements about CPM therapy match the chapter? Select all that apply.", opts: [O("Mobilization by the machine helps prevent joint contracture, atrophy of surrounding muscle, and clots", true, "Correct. CPM mobilization targets contracture, surrounding muscle atrophy, and thromboembolism."), O("The machine can be used on joints other than the knee, including the hip, the shoulder, and ankle", true, "Correct. Hip, shoulder, and ankle are all named as other joints the machine can serve."), O("Physical therapy typically accompanies CPM therapy while the patient is receiving the treatment", true, "Correct. Physical therapy alongside CPM is the typical arrangement described."), O("Some surgeons now use immediate physical therapy instead, as studies question whether CPM is needed", true, "Correct. The chapter prints this evidence wrinkle: immediate PT is replacing CPM for many surgeons."), O("The machine requires the patient to power each flexion cycle actively with the muscles of that leg", false, "CPM is passive mobilization; the machine moves the joint without the patient powering it."), O("CPM therapy can only be delivered inside a hospital surgical unit, never in a home care setting", false, "CPM can be done in a rehabilitation facility or at home under a home care agency.")], tp: "CPM: passive joint mobilization, most often after knee arthroplasty; settings per provider orders." });
BANK.push({ cat: CD, type: "single", stem: "Care Plan 8.1 times the analgesic for ROM exercises in which way?", opts: [O("Offered 30 minutes before the exercises, so peak action arrives as the patient begins the exercises", true, "Correct. Thirty minutes ahead puts the peak analgesic effect at the start of the exercise period."), O("Offered right after the exercises end, so the peak action arrives during the rest period that follows", false, "After-the-fact dosing misses the painful activity itself, which is when coverage is needed."), O("Offered 2 hours before the exercises, so the drug has fully cleared before movement of joints begins", false, "Two hours ahead lets the peak pass before the exercises even start, defeating the timing plan."), O("Offered only when the patient rates pain at 10, so medication is saved for the worst exercise sessions", false, "The plan schedules the dose ahead of known painful activity rather than waiting for a 10 rating.")], tp: "Analgesic 30 minutes before ROM, so the peak action lands as the exercises begin." });
BANK.push({ cat: CE, type: "single", stem: "A lift sheet used to move a patient up in bed serves which purposes?", opts: [O("It supports the patient, assists the staff, and prevents shearing of the patient's skin during the move", true, "Correct. Support, staff assistance, and shear prevention are the printed reasons for the lift sheet."), O("It replaces the need for a second nurse, because one nurse can slide any patient up alone with a sheet", false, "A lift sheet does not replace staffing; moves still use the help the patient's size requires."), O("It holds the patient in a sitting position after the move, keeping the head of the bed raised at 60 degrees", false, "Holding position after a move is done with pillows and bed angle, not with the lift sheet."), O("It measures how far the patient slid down, because the sheet is marked in inches along both long edges", false, "No measuring role exists for the sheet; its roles are support, assistance, and shear control.")], tp: "Lift (draw) sheet: supports the patient, assists staff, prevents shearing of the skin." });
BANK.push({ cat: CE, type: "single", stem: "Logrolling is required in which situation?", opts: [O("When a spinal condition or spinal injury or surgery makes keeping the spinal column aligned necessary", true, "Correct. Logrolling turns the patient as one unit precisely to protect spinal alignment."), O("When a patient needs an enema or a rectal suppository placed while lying on the left side of the body", false, "Enema and suppository placement use the left Sims position, not a logroll turn."), O("When a patient is being moved from the bed to a stretcher and is unable to assist with the transfer", false, "Bed-to-stretcher moves use the sheet-lift team method; logrolling is a turning technique."), O("When a patient is dangling at the bedside before a first walk after several days of complete bed rest", false, "Dangling is a sitting progression step, not a turn, and does not use the logroll method.")], tp: "Logrolling: at least one helper, pillow between legs, pull sheet shoulders to knees, turn on count of 3 as one unit." });
BANK.push({ cat: CE, type: "single", stem: "During a bed-to-chair transfer, the patient is instructed to place the hands where?", opts: [O("On the nurse's shoulders, never around the nurse's neck, because neck placement can injure the nurse", true, "Correct. Shoulders give the patient a hold without risking a neck injury to the nurse."), O("Around the nurse's neck, because that hold gives the patient the strongest pull into a standing pose", false, "Arms around the neck are specifically prohibited because they can injure the nurse's neck."), O("On the nurse's forearms, because gripping the arms keeps the patient's hands away from the gait belt", false, "Forearm gripping is not the taught hold; the hands go on the nurse's shoulders."), O("Behind the patient's own back, because the hands must stay clear while the nurse does all the lifting", false, "The patient actively pushes down on the mattress and holds the shoulders; hands are not parked away.")], tp: "Transfer rule: patient's hands on the nurse's shoulders - never around the nurse's neck." });
BANK.push({ cat: CE, type: "single", stem: "When pivoting a patient toward a chair during transfer, which side is kept toward the chair?", opts: [O("The patient's strong side, so the stronger limbs lead the pivot and bear the work of the transfer", true, "Correct. Strong side toward the chair lets the patient's best side do the most work."), O("The patient's weak side, so the weaker limbs are challenged and strengthened by leading the transfer", false, "Leading with the weak side risks collapse mid-pivot; the strong side leads for safety."), O("The side with the IV line, so the tubing stays in full view of the nurse throughout the whole pivot", false, "IV visibility is managed, but it does not choose the pivot side; limb strength does."), O("Either side equally, because pivot direction has no effect on the safety of a bed-to-chair transfer", false, "Direction matters: the strong side toward the chair is a printed step of the skill.")], tp: "Pivot rule: keep the patient's strong side toward the chair." });
BANK.push({ cat: CE, type: "single", stem: "Before dangling a patient at the bedside, the nurse first assesses which data?", opts: [O("Pulse and respirations, to provide a baseline for judging the patient's response to dangling", true, "Correct. Baseline pulse and respirations come first so the response to dangling can be judged."), O("Pain on a scale of 1 to 10, to decide whether the analgesic should be given before the legs swing down", false, "Pain rating is part of evaluation in mobility care, but the dangling baseline named is pulse and respirations."), O("Capillary refill of both feet, to confirm the circulation will tolerate the legs hanging downward", false, "Capillary refill belongs to the CMS limb check, not to the printed pre-dangling baseline."), O("The patient's weight in pounds, to confirm the transfer stays under the facility lifting limit today", false, "Weight informs lift planning generally, but the dangling step names pulse and respirations first.")], tp: "Dangling: assess pulse and respirations first for a baseline, then again after the move." });
BANK.push({ cat: CE, type: "multi", stem: "Which statements about mechanical lift transfers match the chapter? Select all that apply.", opts: [O("Most facilities require two staff members to be present during a transfer with a mechanical lift", true, "Correct. Two staff members during a mechanical lift transfer is the usual facility requirement."), O("When a sling lift is used, the patient's head must be supported during the transfer in the sling", true, "Correct. Head support during a sling transfer is a stated safety rule for mechanical lifts."), O("The patient should be told what is happening continually, because mechanical lifts can be frightening", true, "Correct. Continual explanation is required because the lift experience can frighten the patient."), O("One staff member can complete a sling transfer alone whenever the patient weighs under the limit", false, "Most facilities require two staff regardless; a weight figure does not waive the pairing rule."), O("The patient's arms should hang free outside the sling, because free arms help the patient balance", false, "During the lift sequence the patient's arms are folded over the chest to prevent patient injury.")], tp: "Mechanical lift: two staff, head supported in the sling, explain continually - lifts can frighten patients." });
BANK.push({ cat: CE, type: "single", stem: "A patient who cannot assist is moved from bed to gurney by which team arrangement?", opts: [O("Five nurses: two reaching over the bed, two close to the gurney, and a fifth at the foot for the feet", true, "Correct. The printed team for a patient who cannot assist is five nurses in those positions."), O("Three nurses: one at the head, one at the hips, and one at the feet, lifting together on a count of 3", false, "Three nurses is not the printed arrangement for a patient who cannot assist at all."), O("Two nurses: one on each side of the bed, sliding the patient across on a folded bath blanket alone", false, "Two nurses handle lesser moves; the non-assisting gurney transfer is staffed with five."), O("One nurse with a roller device, because roller devices remove the need for a lifting team entirely", false, "Roller devices exist in some facilities but do not erase the printed five-nurse arrangement.")], tp: "Gurney transfer, patient cannot assist: five nurses - two over the bed, two at the gurney, one at the feet." });

BANK.push({ cat: CF, type: "single", stem: "The LPN/LVN assessment for mobility focuses on which set of findings?", opts: [O("Range of motion, muscle strength, activity tolerance, gait, and posture observed during daily care", true, "Correct. Those five findings are the printed focus of the LPN/LVN mobility assessment."), O("Skin color, temperature, movement, sensation, pulses, capillary refill, and pain in one injured limb", false, "That set is the CMS neurovascular check of a single limb, not the whole mobility assessment."), O("Appetite, bowel pattern, bladder pattern, sleep pattern, and mood observed across the whole shift", false, "Those track immobility effects broadly; the assessment focus named is the five mobility findings."), O("Weight, height, body mass index, waist measure, and dietary recall taken at the admission interview", false, "Nutritional measures are not the mobility assessment focus printed in this chapter.")], tp: "LPN/LVN mobility assessment: ROM, muscle strength, activity tolerance, gait, and posture." });

BANK.push({ cat: CF, type: "single", stem: "Home caregivers are taught to change a patient's position on which schedule?", opts: [O("Every 1 to 2 hours, using a realistic turning schedule that is developed and posted in the home", true, "Correct. Home teaching sets position changes every 1 to 2 hours with a posted schedule."), O("Every 4 hours, using a turning schedule kept at the hospital and reviewed at each home visit now", false, "Four hours is too long for pressure relief teaching; the home interval printed is 1 to 2 hours."), O("Only when the patient complains of discomfort, using pillows to prop the new position in place", false, "Complaint-driven turning leaves pressure unrelieved for long stretches; the schedule is timed."), O("Every 30 minutes around the clock, using an alarm so no turn is ever missed during the night", false, "Thirty-minute turns exceed the printed home teaching and are not sustainable for caregivers.")], tp: "Home care: change position every 1 to 2 hours; post a realistic turning schedule." });
BANK.push({ cat: CF, type: "multi", stem: "Which instructions must UAP receive when position changes are delegated? Select all that apply.", opts: [O("Have the patient wear shoes with a nonslip surface during any transfer or ambulation activity", true, "Correct. Nonslip footwear is one of the printed information points for delegated position changes."), O("Make slow, gradual position changes, rather than quick moves from lying to sitting to standing", true, "Correct. Slow, gradual changes protect against orthostatic symptoms during delegated care."), O("Help the patient sit in a chair or return to bed if symptoms of orthostatic hypotension appear", true, "Correct. Sitting the symptomatic patient down, in a chair or back in bed, is the UAP instruction."), O("Teach the patient the correct use of the walker before the first ambulation attempt of the day", false, "Teaching device use is never delegated; it requires a nurse, so this stays off the UAP list."), O("Push joints past resistance during exercises whenever the patient seems close to full range today", false, "UAP are told the opposite: never exercise beyond resistance, fatigue, or pain; stop and alert the nurse.")], tp: "UAP position-change briefing: nonslip shoes, slow gradual changes, sit the patient down if orthostatic symptoms appear." });

var S = { screen: "start", mode: "practice", shuf: true, cur: 0, resp: [], touched: [], checked: [], flag: [], review: false, onlyMissed: false };

function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 8: Body Mechanics and Patient Mobility - Definition Practice Test</h1>';
  h += '<div class="sub">Definition practice test | Cooper, Foundations of Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
