<script>

/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Urinary Catheters and Drainage Systems";
var CB = "Catheterization, Catheter Care, and Removal";
var CC = "Incontinence, Bladder Training, and Irrigation";
var CD = "Nasogastric Tubes and Gastric Procedures";
var CE = "Bowel Elimination, Enemas, and Rectal Tubes";
var CF = "Ostomies and Ostomy Care";
var CATS = [CA, CB, CC, CD, CE, CF];
var KEYTERMS = [];
var BLUEPRINT = {
 CA: {
  "name": CA,
  "count": 16,
  "types": {
   "single": 11,
   "multi": 3,
   "dropdown": 1,
   "matrix": 1
  }
 },
 CB: {
  "name": CB,
  "count": 8,
  "types": {
   "single": 6,
   "multi": 1,
   "order": 1
  }
 },
 CC: {
  "name": CC,
  "count": 6,
  "types": {
   "single": 6
  }
 },
 CD: {
  "name": CD,
  "count": 10,
  "types": {
   "single": 5,
   "multi": 2,
   "order": 1,
   "dropdown": 1,
   "matrix": 1
  }
 },
 CE: {
  "name": CE,
  "count": 10,
  "types": {
   "multi": 1,
   "single": 6,
   "order": 1,
   "dropdown": 1,
   "matrix": 1
  }
 },
 CF: {
  "name": CF,
  "count": 6,
  "types": {
   "single": 6
  }
 }
};

BANK.push({ cat: CA, type: "single", kt: [], stem: "A 78-year-old man with a known enlarged prostate needs catheterization. Two attempts with a straight catheter meet resistance and no urine returns. Which action should the nurse take next?", opts: [ O("Stop advancing, then prepare the tapered coude catheter the provider ordered", true, "Correct. Safety first: never force past resistance. The coude tapered tip is the chapter choice when prostate enlargement is suspected, and inability to advance is reported."), O("Stop advancing, then push firmly with steady pressure until the tip passes by", false, "Incorrect. Forcing risks urethral trauma; resistance is a stop-and-reassess cue, not a push-harder cue."), O("Stop advancing, then switch to the smallest child-size catheter kept on the unit", false, "Incorrect. Size alone does not solve a prostate obstruction, and child sizes are 3 to 8 Fr for children."), O("Stop advancing, then inflate the balloon briefly to open the blocked passageway", false, "Incorrect. Inflating a balloon outside the bladder injures the urethra; the balloon inflates only after bladder placement.") ], tp: "Framework: safety first. Resistance plus enlarged prostate = coude tip and provider notification, never force." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "During ambulation, a patient carries the urinary drainage bag above waist level and the tubing trails near the floor. Urine in the tubing is flowing backward toward the bladder. Which action should the nurse take first?", opts: [ O("Lower the bag below the bladder level and keep it off the floor during the walk", true, "Correct. Safety first: a bag above the insertion level causes backflow that contaminates the tract, and the bag must also stay off the floor."), O("Lower the bag below the bladder level and open the system to drain it faster now", false, "Incorrect. Opening the closed system invites infection; repositioning alone corrects the backflow."), O("Raise the bag higher for a few minutes so gravity can clear the tubing quickly", false, "Incorrect. Raising the bag worsens backflow toward the bladder and contaminates the tract."), O("Clamp the tubing for the whole walk so no urine can move in either direction", false, "Incorrect. Clamping stops needed drainage and pooling; correct bag position is the fix.") ], tp: "Framework: safety first. Bag below bladder, off the floor, system closed." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "A school-age child needs a urinary catheter, and an adult on the same unit also needs one placed. Which size selection follows the chapter ranges?", opts: [ O("A 3 to 8 Fr catheter for the child and a 14 to 18 Fr catheter for the adult", true, "Correct. Children range 3 to 8 Fr and adults range 14 to 18 Fr in the French system as printed."), O("A 3 to 8 Fr catheter for the child and a 3 to 8 Fr catheter for the adult too", false, "Incorrect. The adult range is 14 to 18 Fr; child sizes are too small for routine adult use."), O("A 14 to 18 Fr catheter for the child and a 14 to 18 Fr catheter for the adult", false, "Incorrect. The child range is 3 to 8 Fr; adult sizes do not fit the child range."), O("A 20 to 24 Fr catheter for the child and a 20 to 24 Fr catheter for the adult", false, "Incorrect. Sizes above 18 Fr need a provider order and follow surgery or a stretched urethra.") ], tp: "Framework: Nursing Process - assessment of age and size drives size selection. Children 3-8 Fr, adults 14-18 Fr." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "A patient returns from prostate surgery with an order for a catheter larger than 18 Fr. The charge nurse asks why the larger size is acceptable here. Which response is accurate?", opts: [ O("Larger sizes are used after prostate surgery, and this one has a provider order", true, "Correct. Catheters larger than 18 Fr are typically used after urinary system or prostate surgery, and most facilities require a provider order - which this patient has."), O("Larger sizes are used after prostate surgery, and orders are never needed for them", false, "Incorrect. Most facilities do require a provider order for sizes larger than 18 Fr."), O("Larger sizes are routine for every adult, and this order simply confirms routine care", false, "Incorrect. Routine adult sizes are 14 to 18 Fr; larger is the exception, not the routine."), O("Larger sizes are used to stretch a normal urethra, and the order is a formality only", false, "Incorrect. A stretched urethra from repeated catheterization is one reason, but an order is still required.") ], tp: "Framework: Nursing Process. Over 18 Fr = post-surgical or stretched urethra plus a provider order." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "A patient with an indwelling catheter has had no drainage for 3 hours. The bladder feels distended on palpation, and the tubing under the patient is kinked where the patient is lying on it. Which action should the nurse take first?", opts: [ O("Reposition the patient off the tubing and straighten the kink, then reassess flow", true, "Correct. Nursing Process, assessment first: kinks and compression pool urine and stop drainage, so the mechanical cause is corrected and flow reassessed before escalation."), O("Reposition the patient off the tubing and disconnect the system to flush it open", false, "Incorrect. Disconnecting breaks the closed system; the visible kink is corrected first."), O("Encourage the patient to drink two large glasses of water and recheck in one shift", false, "Incorrect. More intake into a distended, non-draining bladder worsens distention; drainage is restored first."), O("Remove the catheter at once and plan to insert a larger size later in the shift", false, "Incorrect. Removal is premature before a simple mechanical cause is corrected and reassessed.") ], tp: "Framework: Nursing Process - fix the mechanical cause first. Report no output or distention despite a patent catheter immediately." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "The provider orders a urine specimen from a patient with an indwelling catheter. The drainage bag holds 400 mL of urine from the shift. Which action obtains the correct specimen?", opts: [ O("Cleanse the drainage port with alcohol and withdraw urine with a sterile syringe", true, "Correct. Specimens are collected from the cleansed port with a sterile needle and a 10-mL syringe per standard precautions - fresh urine, closed system intact."), O("Cleanse the drainage port with alcohol and pour bag urine into a sterile cup now", false, "Incorrect. Bag urine has sat collecting and is not the specimen source; the port is used."), O("Disconnect the catheter from the tubing and catch fresh urine dripping from it", false, "Incorrect. Disconnecting breaks the closed system and risks contaminating the tract."), O("Disconnect the catheter from the tubing and withdraw urine from the open bag port", false, "Incorrect. The bag is never the specimen source, and the system stays closed.") ], tp: "Framework: safety first - asepsis. Port specimen with sterile needle and 10-mL syringe; never from the bag." });

BANK.push({ cat: CA, type: "single", kt: [], stem: "A Purewick system is placed on a postoperative woman on bedrest. An hour later she reports she cannot void, her bladder is distended, and the provider wants exact hourly output. Which action should the nurse take?", opts: [ O("Remove the Purewick and notify the provider, because it fits neither new need now", true, "Correct. Safety first: the chapter states do not use Purewick for urinary retention or when output needs close monitoring - both now apply, so the device comes off and the provider is notified."), O("Remove the Purewick and leave it off overnight, then reapply it in the morning", false, "Incorrect. The problem is the device indication itself, not the time of day it is worn."), O("Tighten the Purewick suction and recheck the bladder again at the end of shift", false, "Incorrect. Higher suction does not make the device suitable for retention or precise monitoring."), O("Tighten the Purewick suction and add a urometer to the tubing for hourly totals", false, "Incorrect. A urometer belongs on a catheter drainage system; Purewick is not for close monitoring.") ], tp: "Framework: safety first. Purewick is for less mobile patients - never retention, never close output monitoring." });

BANK.push({ cat: CA, type: "multi", kt: [], stem: "An 84-year-old man uses a condom catheter. His skin is thin and friable, and the appliance has been on for 2 days without removal. Which actions should the nurse take? Select all that apply.", opts: [ O("Remove the appliance today for cleansing and careful inspection of the skin", true, "Correct. The appliance is removed daily for cleansing and skin inspection."), O("Assess for constriction, because a tight appliance can injure fragile older skin", true, "Correct. A disadvantage is that it can become too constrictive, and older skin breaks down easily."), O("Consider the infection advantage of an external system over an indwelling catheter", true, "Correct. External drainage limits the infection risk an indwelling catheter carries."), O("Leave the appliance in place for a full week to avoid disturbing fragile skin", false, "Incorrect. Daily removal is required; leaving it invites hidden breakdown."), O("Switch him to an indwelling catheter because external systems harm older adults", false, "Incorrect. For incontinent older men an external catheter may work well; indwelling raises infection risk.") ], tp: "Framework: safety first. Condom catheter: remove daily, watch thin older skin for breakdown, infection risk is lower than indwelling." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "While catheterizing a female patient, the nurse advances the catheter and no urine returns. Inspection shows the catheter tip is in the vagina. Which action should the nurse take?", opts: [ O("Leave that catheter in place as a landmark and insert another sterile catheter", true, "Correct. The misplaced catheter stays as a landmark while a new sterile catheter is inserted into the urethra; reusing the misplaced one would carry microorganisms into the bladder."), O("Leave that catheter in place as a landmark and reuse it after wiping it with antiseptic", false, "Incorrect. Wiping does not re-sterilize it; reuse introduces microorganisms into the bladder."), O("Remove that catheter at once and reinsert the same catheter into the urethra now", false, "Incorrect. The same catheter is contaminated once placed in the vagina and must not be reused."), O("Remove that catheter at once and abandon the procedure until the next shift starts", false, "Incorrect. The procedure continues with a new sterile catheter, using the first as a landmark.") ], tp: "Framework: safety first - asepsis. Vaginal placement: leave as landmark, new sterile catheter." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "An uncircumcised male patient has just been catheterized. Which closing action is required before the nurse leaves the bedside?", opts: [ O("Replace the foreskin over the glans after cleansing and catheter placement ends", true, "Correct. The foreskin is replaced when the procedure is completed; leaving it retracted risks injury."), O("Replace the foreskin over the glans only if the patient asks for it to be done", false, "Incorrect. Replacement is a required step after cleansing and insertion, not an optional comfort measure."), O("Leave the foreskin retracted so the meatus can be inspected again in one hour", false, "Incorrect. The chapter directs replacing the foreskin when the procedure is completed."), O("Leave the foreskin retracted and cover the area loosely with a sterile drape", false, "Incorrect. A drape does not substitute for replacing the foreskin at the end of the procedure.") ], tp: "Framework: safety first. Uncircumcised patient: retract to cleanse, replace when done. Also: bear down gently during insertion relaxes the external sphincter." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "A straight catheterization of a markedly distended bladder begins draining very rapidly, and the patient reports painful bladder cramping as the flow continues. Which action should the nurse take?", opts: [ O("Slow the drainage in a controlled manner following the facility policy in place", true, "Correct. Safety first: draining a distended bladder too rapidly can collapse it into painful spasms, so drainage is controlled per facility policy."), O("Slow the drainage by raising the collection container above the bladder level now", false, "Incorrect. Raising the container risks backflow; controlled drainage follows policy, not container height games."), O("Speed the drainage so the bladder empties before the spasms can get any worse", false, "Incorrect. Rapid emptying is what triggers the painful spasm cycle in the first place."), O("Speed the drainage and give the removed catheter a second insertion right away", false, "Incorrect. Reinsertion adds trauma and does nothing for the spasm mechanism.") ], tp: "Framework: safety first. Straight catheter reference volume is about 700-1000 mL; rapid drainage causes painful bladder spasms." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "During routine catheter care, the nurse finds malodorous exudate around the meatus. The patient has no fever at this visit. Which action should the nurse take next?", opts: [ O("Check the temperature every 4 hours for 24 hours and report the unusual finding", true, "Correct. Odor or exudate during catheter care triggers temperature checks every 4 hours for 24 hours, and unusual findings are reported immediately for possible infection."), O("Check the temperature every 4 hours for 24 hours and keep the finding to the team", false, "Incorrect. The finding must also be reported; malodorous exudate can signal infection needing more aggressive therapy."), O("Check the temperature once at the end of the shift and document the exudate only", false, "Incorrect. The printed monitoring is every 4 hours for 24 hours when odor or exudate is present."), O("Check the temperature once at the end of the shift and change the drainage bag now", false, "Incorrect. Bag change is not the response; scheduled temperature monitoring and reporting are.") ], tp: "Framework: Nursing Process - monitor and report. Temperature every 4 hours for 24 hours if odor or exudate is present." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "A catheter was removed at 8 a.m. By 4:30 p.m. the patient has not voided, reports lower abdominal pressure, and the bladder is palpably distended. Which action should the nurse take?", opts: [ O("Notify the health care provider and obtain further orders for the retention now", true, "Correct. Most patients void within 8 hours of removal; that window has passed with distention present, so the provider must be notified for further orders."), O("Notify the health care provider only if the patient still has not voided by morning", false, "Incorrect. Waiting overnight ignores the 8-hour standard and a distended bladder."), O("Encourage the patient to keep waiting, because voiding can take up to three days", false, "Incorrect. Three days is the delayed infection-sign window, not the voiding window."), O("Encourage the patient to keep waiting, because a full day without voiding is normal", false, "Incorrect. A full day exceeds the 8-hour expectation and needs provider notification.") ], tp: "Framework: acute vs chronic - new retention after removal is acute. Void expected within 8 hours; then notify." });

BANK.push({ cat: CB, type: "multi", kt: [], stem: "A patient is discharged the day after catheter removal. Which teaching points about infection should the nurse include? Select all that apply.", opts: [ O("Urgency, burning, and frequency with only small amounts can signal an infection", true, "Correct. Those are the chapter signs of urinary tract infection after removal."), O("Signs may not appear for 2 or more days, so watch for them after going home now", true, "Correct. Signs may develop 2-3 days after removal, possibly after the patient is already home."), O("Call the provider when these signs appear rather than waiting for a routine visit", true, "Correct. Because signs are delayed, the patient is taught the signs to watch for and when to call."), O("Drink at least 2 liters of fluid daily unless the condition contraindicates fluids", true, "Correct. Post-removal teaching is at least 2 L - eight 8-oz glasses - per day unless contraindicated."), O("Signs, if they come, will all appear before discharge, so no home watching is needed", false, "Incorrect. The delay is the whole point of the teaching; signs often start at home.") ], tp: "Framework: Maslow - safety through teaching. UTI is among the most common iatrogenic infections; signs can start 2-3 days after removal." });

BANK.push({ cat: CB, type: "single", kt: [], stem: "A charge nurse reviews assignments for catheter-related tasks on a busy unit. Which task must stay with the nurse rather than being delegated to unlicensed assistive personnel?", opts: [ O("Catheter irrigation for a patient whose tubing is blocked by sediment and clots", true, "Correct. Irrigation requires the knowledge of a nurse; delegation of this task is inappropriate."), O("Catheter irrigation teaching aside, perineal care for a stable patient with a catheter", false, "Incorrect. Perineal care and tubing cleaning may be delegated."), O("Catheter irrigation teaching aside, measuring output for a patient first voiding", false, "Incorrect. UAP can measure output and report time and amount to the nurse."), O("Catheter irrigation teaching aside, emptying a drainage bag at the end of a shift", false, "Incorrect. Emptying and recording output from the drainage system is routine delegated care.") ], tp: "Framework: safety first - scope of practice. Irrigation, first-time catheterization, trauma cases, and new suprapubic care stay with the nurse." });

BANK.push({ cat: CC, type: "single", kt: [], stem: "A woman leaks small amounts of urine when she coughs or lifts her grandchildren. She asks for an exercise plan. Which teaching indicates an understanding of the chapter method?", opts: [ O("Tighten the perineal muscles, hold 10 seconds, relax 10 seconds, many times daily", true, "Correct. That is the printed Kegel cycle, repeated multiple times several times a day, with results taking 4 to 6 weeks."), O("Tighten the perineal muscles, hold 10 seconds, relax 10 seconds, once each morning", false, "Incorrect. Once daily is too little; the exercises repeat multiple times, several times a day."), O("Tighten the abdominal muscles, hold 10 seconds, relax 10 seconds, many times daily", false, "Incorrect. The target is the perineal sphincter muscles, identified by stopping urine flow, not the abdominals."), O("Tighten the perineal muscles, hold 30 seconds, relax 30 seconds, many times daily", false, "Incorrect. The printed hold and relax are each 10 seconds, not 30 seconds.") ], tp: "Framework: Nursing Process - teaching evaluation. Stress pattern plus Kegels: hold 10, relax 10, expect 4 to 6 weeks." });

BANK.push({ cat: CC, type: "single", kt: [], stem: "A nurse sets up habit training for an older adult with decreased perception of bladder fullness. The patient voids most often mid-morning and after meals. Which schedule should the nurse start?", opts: [ O("Assisted voiding every 1.5 to 2 hours, timed around arising, meals, and bedtime", true, "Correct. Habit training begins every 1.5 to 2 hours, scheduled to coincide with the patient pattern and typical times - arising, before meals, bedtime - then lengthens."), O("Assisted voiding every 1.5 to 2 hours, timed only when the patient feels an urge", false, "Incorrect. Waiting for an urge defeats habit training for a patient with decreased perception of fullness."), O("Assisted voiding every 6 to 8 hours, timed around arising, meals, and bedtime now", false, "Incorrect. The starting interval is 1.5 to 2 hours; 6 to 8 hours guarantees wet episodes."), O("Assisted voiding every 6 to 8 hours, timed only when leakage is discovered later", false, "Incorrect. Both the interval and the reactive timing contradict the habit training method.") ], tp: "Framework: Nursing Process - plan from the assessed pattern. Habit training: start 1.5-2 hours, evaluate after a few days, modify until continence." });

BANK.push({ cat: CC, type: "single", kt: [], stem: "A paralyzed patient has overflow incontinence from an overfull bladder. A new nurse suggests the Crede maneuver. Which condition must be met before it is used?", opts: [ O("The provider must approve its use, and pressure must stay gentle to avoid injury", true, "Correct. The maneuver is performed only if the provider approves, and care is taken to prevent bladder injury from excess pressure."), O("The provider must approve its use, and pressure must be firm to empty it fully now", false, "Incorrect. Excess pressure can injure the bladder; firm emptying pressure is the danger, not the goal."), O("The family must approve its use, and pressure must stay gentle to avoid injury", false, "Incorrect. Approval comes from the provider, not the family."), O("The family must approve its use, and pressure must be firm to empty it fully now", false, "Incorrect. Both parts are wrong: provider approval and gentle pressure are required.") ], tp: "Framework: safety first. Crede: umbilicus toward bladder, provider approval only, excess pressure injures the bladder." });

BANK.push({ cat: CC, type: "single", kt: [], stem: "During open catheter irrigation, the nurse instills 30 mL of sterile saline gently, but no fluid returns. The patient reports increasing suprapubic discomfort. Which action should the nurse take first?", opts: [ O("Turn the patient onto the side facing the nurse and reassess for fluid return", true, "Correct. Nursing Process: if solution does not return, turning the patient to the side facing the nurse can move the catheter tip and let fluid flow out; non-return is also a reportable finding."), O("Turn the patient onto the side facing the nurse and inject another 30 mL firmly", false, "Incorrect. Forceful injection causes spasm and trauma, and adding fluid to a non-draining bladder worsens distention."), O("Inject another 60 mL rapidly to push the blockage through the catheter tubing", false, "Incorrect. Rapid, forceful instillation risks bladder spasm and injury; volume is never the first fix."), O("Inject another 60 mL rapidly and clamp the catheter so pressure builds up inside", false, "Incorrect. Clamping against non-return traps solution in the bladder and risks distention injury.") ], tp: "Framework: safety first. Non-return: reposition side-facing, then facility policy; report non-return, pain, occlusion, bleeding, or unrelieved spasms immediately." });

BANK.push({ cat: CC, type: "single", kt: [], stem: "A patient on continuous bladder irrigation has 2600 mL of total drainage this shift. The irrigating solution infused totals 1900 mL. What is the patient urine output for the shift?", opts: [ O("Seven hundred milliliters, after subtracting the irrigant from the total drainage", true, "Correct. Urine output equals total drainage minus irrigant infused: 2600 minus 1900 equals 700 mL."), O("Forty-five hundred milliliters, after adding the irrigant to the total drainage", false, "Incorrect. Adding gives 2600 plus 1900 equals 4500 mL and counts the irrigant as urine."), O("Nineteen hundred milliliters, recorded as the full amount that drained this shift", false, "Incorrect. 1900 mL is the irrigant infused, not the urine produced."), O("Twenty-six hundred milliliters, recorded as the full amount that drained this shift", false, "Incorrect. Recording total drainage overstates urine output by the entire irrigant volume.") ], tp: "Framework: Nursing Process - accurate I and O. Continuous irrigation: total drainage minus irrigant infused equals urine output." });

BANK.push({ cat: CC, type: "single", kt: [], stem: "Two days after catheter removal, a patient cannot void. The medication list shows a nightly over-the-counter sleep aid with diphenhydramine and a nasal decongestant started yesterday. Which action should the nurse take?", opts: [ O("Report the retention and flag both medications, which can cause urinary retention", true, "Correct. The chapter warns nasal decongestants and anticholinergic medications such as diphenhydramine can cause urinary retention and should be limited - a likely contributor to report."), O("Report the retention and increase both medications, which can cause urinary retention", false, "Incorrect. Increasing retention-causing medications would worsen the problem."), O("Reassure the patient that these medications protect voiding and no report is needed", false, "Incorrect. Retention after removal is reportable, and these drugs are a named cause."), O("Reassure the patient that these medications only affect sleep and nasal congestion", false, "Incorrect. Their urinary effect - retention - is exactly what the chapter warns about.") ], tp: "Framework: Nursing Process - connect the medication cause. Decongestants and anticholinergics can cause retention after removal." });

BANK.push({ cat: CD, type: "single", kt: [], stem: "A newly inserted NG tube is ready for its first feeding. Aspirate is scant and the patient is coughing intermittently. Which action should the nurse take before any feeding is given?", opts: [ O("Verify placement first, with x-ray as the most definitive check, before feeding", true, "Correct. Safety first and ABCs: before anything enters an NG tube, placement is verified to keep contents out of the lungs; x-ray is the most definitive verification."), O("Verify placement first by listening for injected air, then start the feeding slowly", false, "Incorrect. Auscultation while returning aspirate is only a further check; it is not the definitive verification for a doubtful tube."), O("Start a small test feeding and watch whether the patient coughs during the feeding", false, "Incorrect. Feeding to test placement can deliver formula into the lungs - aspiration is the harm to prevent."), O("Start a small test feeding of plain water and advance the tube if coughing worsens", false, "Incorrect. Nothing goes in before placement is verified, and worsening cough is a stop signal.") ], tp: "Framework: ABCs - airway first. Verify before anything goes in; x-ray most definitive; gastric pH less than 4 supports placement." });

BANK.push({ cat: CD, type: "single", kt: [], stem: "While a nurse advances an NG tube, the patient begins coughing, gagging, and choking and cannot speak clearly. Which action should the nurse take first?", opts: [ O("Stop advancing at once, let the patient breathe easily, and pull the tube back slightly", true, "Correct. ABCs: coughing, gagging, or choking means stop immediately; the tube may be in the larynx obstructing the airway, so pull back slightly and let the patient breathe and sip water."), O("Stop advancing at once, then push the tube forward quickly past the irritated area", false, "Incorrect. Advancing into a possible airway placement worsens obstruction; the tube comes back, not forward."), O("Keep advancing slowly, because gagging is expected until the tube reaches the stomach", false, "Incorrect. Continuous coughing and inability to talk are danger cues, not expected progress."), O("Keep advancing slowly, and check the posterior pharynx only after the full insertion", false, "Incorrect. The check for coiling and the pull-back happen when the danger cues appear, not after full insertion.") ], tp: "Framework: ABCs. Cannot talk suggests the tube crossed the vocal cords; stop, pull back slightly, check the pharynx for coiling if gagging continues." });

BANK.push({ cat: CD, type: "multi", kt: [], stem: "A Salem sump tube on intermittent suction has stopped draining. The abdomen is more distended and no hissing is heard at the blue vent. Which actions should the nurse take? Select all that apply.", opts: [ O("Check that the tubing is not kinked and the patient is not lying on the tubing", true, "Correct. Kinks and body weight on the tubing silently obstruct drainage."), O("Ask the patient to cough, or reposition the patient, to help the sump form again", true, "Correct. Coughing or repositioning - right side-lying or supine - can reposition the internal opening so a sump forms."), O("Report failure to drain with abdominal distention to the health care provider", true, "Correct. Failure to drain and abdominal distention are reportable abnormalities."), O("Irrigate through the blue pigtail with saline until the drainage starts moving", false, "Incorrect. The air vent is never used for irrigation; pressure there can cause gastric trauma."), O("Instill saline into the vent and clamp the suction tubing for the rest of shift", false, "Incorrect. The vent takes air, not saline, and clamping stops needed decompression.") ], tp: "Framework: safety first. Silent vent means no hiss; reposition and cough first, never irrigate the blue pigtail." });

BANK.push({ cat: CD, type: "single", kt: [], stem: "An order for gastric lavage for a bleeding patient specifies iced saline. Which action should the nurse take?", opts: [ O("Question the order and use room-temperature solution as the chapter directs here", true, "Correct. Safety first: iced or cooled solutions may cause hypothermia, impair platelet production, and increase bleeding - the opposite of the lavage goal in GI bleeding."), O("Question the order and use warmed solution well above body temperature instead", false, "Incorrect. The chapter directs room-temperature solution, not heated solution."), O("Follow the order as written, because lavage orders are never questioned by nurses", false, "Incorrect. A solution temperature that can increase bleeding must be questioned."), O("Follow the order as written, but instill the iced solution in smaller amounts only", false, "Incorrect. Smaller amounts of iced solution still carry the hypothermia and platelet risks.") ], tp: "Framework: safety first. Lavage: room temperature, usually 500 mL at a time, measure and evaluate every return." });

BANK.push({ cat: CD, type: "single", kt: [], stem: "Thirty minutes into a first tube feeding run at a fast rate with concentrated formula, a patient becomes pale, sweaty, and crampy with a racing pulse. Which action should the nurse take first?", opts: [ O("Slow or stop the feeding and notify the provider about this dumping presentation", true, "Correct. Dumping syndrome follows too-rapid infusion of highly concentrated feedings and looks like shock; stopping the cause and notifying the provider come first."), O("Slow or stop the feeding and increase the rate once the symptoms settle down fully", false, "Incorrect. Returning to a fast concentrated rate recreates dumping; feedings start slowly and increase gradually."), O("Raise the head of bed above 30 degrees and push the feeding faster to finish it", false, "Incorrect. Speed and concentration are the cause; pushing faster worsens the syndrome."), O("Raise the head of bed above 30 degrees and switch to an even richer formula mix", false, "Incorrect. A more concentrated formula at speed is exactly the dumping trigger.") ], tp: "Framework: acute vs chronic - acute shock-like symptoms act now. Dumping: start feedings slowly, increase gradually, head of bed at least 30 degrees." });

BANK.push({ cat: CD, type: "single", kt: [], stem: "An NG tube irrigation meets firm resistance. Saline will not flow in by gravity. Which action should the nurse take?", opts: [ O("Check for kinks, change the patient position, retry gently, then confer if it persists", true, "Correct. Nursing Process: resistance is met by checking kinks and repositioning, never by force; continued resistance goes to the RN or provider."), O("Check for kinks, then force the saline in with strong steady pressure on the plunger", false, "Incorrect. Forceful instillation causes gastric distention and trauma; solution must flow by gravity."), O("Pull the tube out completely and reinsert a new tube on the opposite nostril side", false, "Incorrect. Reinsertion is a bigger intervention than the printed troubleshooting sequence."), O("Pull the tube out completely and document the tube as permanently nonfunctional now", false, "Incorrect. Kink checks and repositioning come first; confer before abandoning the tube.") ], tp: "Framework: safety first. NG irrigation: 30 mL, tip toward the floor, gravity flow, never force." });

BANK.push({ cat: CD, type: "multi", kt: [], stem: "A patient has had an NG tube for 3 days. Which comfort and protection measures should the nurse include in care? Select all that apply.", opts: [ O("Provide mouth care at least every 2 hours for the dry mouth and cracked lips", true, "Correct. Mouth care at least every 2 hours is the printed comfort standard for NG patients."), O("Lubricate the nostrils and tube with water-soluble lubricant to prevent crusting", true, "Correct. Water-soluble lubricant prevents crusting of secretions around the nares and tube."), O("Secure the tube to the nose and then to the gown to prevent unnecessary movement", true, "Correct. Securing to nose and gown limits mucosal trauma from tube movement."), O("Remove excess secretions from around the nares during each round of tube care", true, "Correct. Clearing secretions protects the irritated nasal mucosa around the tube."), O("Offer frequent large drinks of water to keep the mouth moist between care rounds", false, "Incorrect. NG patients may rinse or use swabs without swallowing water; intake follows orders and NPO status.") ], tp: "Framework: Maslow - comfort and tissue protection. Mouth care every 2 hours, water-soluble lubricant, secure the tube." });

BANK.push({ cat: CE, type: "multi", kt: [], stem: "An older adult reports chronic constipation. History shows low fiber intake, about 800 mL of fluid daily, laxative use most days, and almost no walking. Which plan elements match the chapter? Select all that apply.", opts: [ O("Increase dietary bulk with at least 6 to 10 grams of fiber daily, as printed", true, "Correct. The chapter prints at least 6-10 g of dietary fiber per day for the older adult, as printed."), O("Increase fluid intake toward the normal 2000 to 3000 mL daily range if tolerated", true, "Correct. Normal bowel function rests on 2000 to 3000 mL of fluid daily."), O("Encourage activity as much as tolerated to maintain peristalsis and bowel tone", true, "Correct. Activity maintains peristalsis and decreases constipation risk."), O("Keep a week-long diary of meals and fluid intake to review the dietary pattern", true, "Correct. A week diary of meals and fluids lets the nurse judge whether diet contributes."), O("Continue daily laxatives as the main plan, because dependency is easy to reverse", false, "Incorrect. Laxative dependency develops and is often difficult to overcome.") ], tp: "Framework: Nursing Process - treat the cause. Also watch heart rate and rhythm in older adults during defecation because of vagal stimulation." });

BANK.push({ cat: CE, type: "single", kt: [], stem: "A patient has not passed stool in 6 days. Assessment finds a hard rectal mass the patient cannot pass, with new pain from bowel distention. Which intervention should the nurse anticipate?", opts: [ O("An oil retention enema to soften the stool and lubricate the bowel for passage", true, "Correct. The oil retention enema softens stool and lubricates the bowel - the enema type anticipated when fecal impaction is suspected."), O("An oil retention enema is wrong here; a potassium enema treats this presentation", false, "Incorrect. Potassium polystyrene sulfonate enemas treat extremely high potassium, not impaction."), O("A cleansing enema with the largest volume tolerated to blast the mass apart now", false, "Incorrect. The anticipated type for impaction is oil retention, softening before removal."), O("A cleansing enema with the largest volume tolerated, repeated until fully clear", false, "Incorrect. Until-clear cleansing is a preoperative pattern, not the impaction intervention.") ], tp: "Framework: Nursing Process. Impaction: rectal mass too hard to pass; oil retention softens and lubricates." });

BANK.push({ cat: CE, type: "single", kt: [], stem: "During an enema, a patient reports severe cramping that does not ease when the flow is slowed, and the returned fluid is bloody. Which action should the nurse take?", opts: [ O("Stop the enema at once and notify the health care provider about both findings", true, "Correct. Safety first: severe cramping unrelieved by slowing, bleeding, or sudden severe pain means stop the enema and notify the provider."), O("Stop the enema at once and restart it in 10 minutes with a cooler solution mix", false, "Incorrect. Restarting after bleeding is unsafe; the provider is notified, not the enema retried."), O("Slow the flow further and finish the full volume, because cramping is expected", false, "Incorrect. Cramping that persists despite slowing, plus bleeding, crosses the stop line."), O("Slow the flow further and raise the container higher to finish the volume faster", false, "Incorrect. Higher containers cause rapid infusion and painful distention - the opposite response.") ], tp: "Framework: safety first - stop rules. Severe cramping unrelieved, bleeding, or sudden severe pain: stop and notify." });

BANK.push({ cat: CE, type: "single", kt: [], stem: "Preoperative enemas are ordered until clear. After three consecutive enemas, the return is still brown with solid fecal material. Which action should the nurse take?", opts: [ O("Notify the health care provider before giving any further enemas to this patient", true, "Correct. After three enemas, colored or solid returns trigger provider notification before continuing, because repeated enemas risk dangerous electrolyte loss."), O("Notify the health care provider only after six enemas if returns are still brown", false, "Incorrect. The printed notification point is after three consecutive enemas, not six."), O("Continue enemas through the night until the return runs completely clear and clean", false, "Incorrect. Continuing without notifying risks excessive electrolyte loss."), O("Continue enemas through the night with a stronger soapsuds solution for effect", false, "Incorrect. Stronger solution and more enemas are not the rule; notify the provider.") ], tp: "Framework: safety first. Until clear usually takes three; still colored or solid after three = notify before continuing." });

BANK.push({ cat: CE, type: "single", kt: [], stem: "A nurse prepares to give an enema. The patient is sitting on the toilet and asks to stay there for convenience. Which action should the nurse take?", opts: [ O("Position the patient in Sims position so solution flows along the sigmoid curve", true, "Correct. Sims position lets solution flow by gravity along the natural curve of the sigmoid colon and rectum and improves retention; toilet sitting can abrade the rectal wall and force solution up."), O("Position the patient in Sims position only if the patient cannot sit up at all today", false, "Incorrect. Sims is the standard position for the enema, not a fallback for weakness."), O("Keep the patient on the toilet and raise the container well above 18 inches high", false, "Incorrect. Toilet sitting is avoided, and heights above 12 to 18 inches cause rapid painful infusion."), O("Keep the patient on the toilet and lower the container well below 12 inches low", false, "Incorrect. Toilet sitting itself is the problem the chapter warns against.") ], tp: "Framework: safety first - positioning. Enema: Sims, container 12-18 inches above the anus, retain at least 5 minutes, flow 5-10 minutes." });

BANK.push({ cat: CE, type: "single", kt: [], stem: "A patient with painful hemorrhoids needs flatus relief and has an order set that includes a rectal tube and a rectal temperature. Which action should the nurse take?", opts: [ O("Hold both rectal devices and notify the provider, using ambulation for the flatus", true, "Correct. Safety first: rectal tubes and rectal thermometers should not be used in patients with hemorrhoids; ambulation promotes peristalsis and relieves flatulence without rectal trauma."), O("Hold both rectal devices and insert a rectal suppository without any lubricant now", false, "Incorrect. Suppositories in hemorrhoid patients demand extreme caution and liberal lubricant, not dry insertion."), O("Insert the rectal tube gently with extra lubricant, because the order was written", false, "Incorrect. The chapter excludes rectal tubes in hemorrhoid patients regardless of lubricant."), O("Insert the rectal tube gently with extra lubricant and take the rectal temperature", false, "Incorrect. Both rectal devices are excluded for this patient population in the chapter.") ], tp: "Framework: safety first. Hemorrhoids: no rectal tubes, no rectal thermometers; suppositories only with extreme caution and liberal lubricant." });

BANK.push({ cat: CE, type: "single", kt: [], stem: "A postoperative patient on narcotics has mild to moderate cramping from flatus and has not ambulated yet. Which action should the nurse take first?", opts: [ O("Encourage the patient to ambulate to promote peristalsis and help relieve flatus", true, "Correct. Least restrictive first: ambulation promotes peristalsis and relieves flatulence before any device is considered."), O("Encourage the patient to ambulate only after a rectal tube session has been tried", false, "Incorrect. The rectal tube is used if ambulating does not help, not before ambulation."), O("Insert a rectal tube at once, because narcotic flatus never resolves with walking", false, "Incorrect. Ambulation is the first measure; the tube follows only if it does not help."), O("Insert a rectal tube at once and leave it in place for a full hour of drainage", false, "Incorrect. The tube is second-line and stays no more than 30 minutes in place.") ], tp: "Framework: least restrictive first. Flatus: ambulate first; rectal tube only if that fails, maximum 30 minutes." });

BANK.push({ cat: CF, type: "single", kt: [], stem: "A patient with a new ileostomy has frequent liquid output and red, irritated skin around the stoma on day 4 with the original pouch still in place. Which action should the nurse take?", opts: [ O("Change the pouch on schedule and protect the skin, because liquid stool injures it", true, "Correct. Safety first: skin impairment follows repeated exposure to liquid stool, especially with an ileostomy, and pouches are changed every 3 to 7 days to allow skin observation and protection."), O("Change the pouch on schedule and apply soap generously to clean the irritated skin", false, "Incorrect. Soap residue interferes with pouch adhesion; skin is cleansed with warm water and patted dry."), O("Leave the pouch in place another week, because frequent changes irritate the skin", false, "Incorrect. Even a well-adhering pouch is changed on schedule to observe stoma and skin."), O("Leave the pouch in place another week and add powder to absorb the liquid output", false, "Incorrect. Waiting worsens liquid-stool exposure, the main driver of ileostomy skin impairment.") ], tp: "Framework: safety first - skin integrity. Ileostomy output is liquid and more acidic and irritating; change pouch every 3-7 days." });

BANK.push({ cat: CF, type: "single", kt: [], stem: "During pouch care, a nurse notes a stoma that looks pale and dry, with a dusky edge. The patient reports no pain at the stoma. Which interpretation and action are correct?", opts: [ O("The appearance is abnormal, because a healthy stoma is moist and reddish pink", true, "Correct. The standard is moist and reddish pink; pale, dry, or dusky is abnormal and is assessed and reported. Lack of pain proves nothing - the stoma has no sensation."), O("The appearance is abnormal, because a healthy stoma is dry and light pink in color", false, "Incorrect. Healthy is moist and reddish pink, not dry and light pink."), O("The appearance is expected, because a healthy stoma is pale during the first week", false, "Incorrect. The chapter standard does not change by week; moist reddish pink is proper appearance."), O("The appearance is expected, because lack of pain confirms the stoma is perfused well", false, "Incorrect. The stoma has a blood and nerve supply but no sensation, so pain cannot confirm perfusion.") ], tp: "Framework: Nursing Process - assessment against the printed standard. Moist and reddish pink is healthy; the stoma has no sensation." });

BANK.push({ cat: CF, type: "single", kt: [], stem: "A patient cuts each new wafer opening exactly the same size as the stoma and now has a pressure sore at the stoma edge. Which teaching corrects the technique?", opts: [ O("Cut the wafer opening one sixteenth of an inch larger than the stoma each time", true, "Correct. The opening is cut 1/16 inch larger than the stoma to seal without pressure; an ill-fitting appliance can cause a pressure sore and lead to gangrene."), O("Cut the wafer opening one sixteenth of an inch larger only when the stoma swells", false, "Incorrect. The 1/16 inch allowance is the routine sizing rule, not a swelling exception."), O("Cut the wafer opening one half inch larger than the stoma each time for comfort", false, "Incorrect. Too large an opening breaks the seal and exposes skin to output."), O("Cut the wafer opening one half inch larger than the stoma each time for drainage", false, "Incorrect. Oversizing does not improve drainage; it destroys the seal.") ], tp: "Framework: safety first. Wafer opening 1/16 inch larger than the stoma; barrier 1/16 inch from the stoma; press 1-2 minutes." });

BANK.push({ cat: CF, type: "single", kt: [], stem: "A urostomy patient asks how to manage the appliance during the day and at night. Which teaching indicates an understanding of the chapter guidance?", opts: [ O("Empty it at one-third to one-half full and connect it to a container at night", true, "Correct. Emptying at one-third to one-half full keeps urine weight from loosening the seal, and a night collection container keeps urine from stagnating in the appliance."), O("Empty it at one-third to one-half full and disconnect it from any container nightly", false, "Incorrect. Night connection to a collection container is part of the teaching, not disconnection."), O("Empty it only when completely full and connect it to a container at night only", false, "Incorrect. Waiting until full lets urine weight loosen the seal during the day."), O("Empty it only when completely full and let urine collect in the pouch overnight", false, "Incorrect. Both parts fail: fullness timing and night stagnation are both addressed in teaching.") ], tp: "Framework: Nursing Process - teaching evaluation. Urostomy drains nearly continuously: empty at one-third to one-half, night drainage container." });

BANK.push({ cat: CF, type: "single", kt: [], stem: "Two patients request colostomy irrigation teaching: one with a transverse colostomy and one with a sigmoid colostomy. Which response is correct?", opts: [ O("Teach the sigmoid patient, because only descending or sigmoid sites are candidates", true, "Correct. Only descending or sigmoid colostomies are appropriate candidates, because stool there is more formed and less liquid."), O("Teach the sigmoid patient, because only ascending or transverse sites are candidates", false, "Incorrect. The candidate sites are descending or sigmoid, not ascending or transverse."), O("Teach the transverse patient, because liquid stool returns faster during irrigation", false, "Incorrect. Liquid stool is the reason transverse sites are not candidates."), O("Teach the transverse patient, because any colostomy segment can be irrigated safely", false, "Incorrect. Segment decides candidacy; only descending or sigmoid qualify.") ], tp: "Framework: Nursing Process. Colostomy irrigation: descending or sigmoid only, 1000 mL tepid water at shoulder level." });

BANK.push({ cat: CF, type: "single", kt: [], stem: "During colostomy irrigation with the container at shoulder level, the patient reports cramping as 600 mL has infused over 10 minutes. Which action should the nurse take?", opts: [ O("Stop the flow without removing the cone until the cramps subside, then resume slowly", true, "Correct. Cramping is managed by stopping or slowing the flow while keeping the cone in place until cramps subside, letting the patient adjust to the irrigation."), O("Stop the flow without removing the cone and raise the container above shoulder level", false, "Incorrect. Raising the container increases pressure and risks bowel damage; shoulder level is the limit."), O("Remove the cone at once and restart the full irrigation from the beginning again", false, "Incorrect. The cone stays in place during the pause; removal and restart are unnecessary."), O("Remove the cone at once and push the remaining volume in as one rapid instillation", false, "Incorrect. Rapid instillation and cone removal both contradict the irrigation safety steps.") ], tp: "Framework: safety first. Colostomy irrigation: 500-1000 mL over 15 minutes, container at shoulder level, pause for cramps with the cone in place." });

BANK.push({ cat: CB, type: "order", kt: [], stem: "Place the steps for removing an indwelling urinary catheter in the correct order.", items: [ { t: "Position the patient supine and place a waterproof pad under the patient", r: "First: positioning and pad protect linens if urine leaks during removal." }, { t: "Insert the syringe into the balloon port and aspirate until the tubing collapses", r: "Second: balloon deflation is verified by aspiration until collapse or resistance before withdrawal." }, { t: "Withdraw the catheter steadily and smoothly without using force at any point", r: "Third: steady withdrawal without force; resistance means repeat aspiration, never pull harder." }, { t: "Measure the urine, cleanse the perineum, and record the removal on the chart", r: "Fourth: output is measured and recorded and perineal care follows removal." }, { t: "Teach fluid intake and infection signs and monitor for the first voiding after", r: "Fifth: teaching covers fluids and delayed infection signs, and the first void is timed and measured." } ], tp: "Framework: Nursing Process - sequence. Remove as soon as possible; void expected within 8 hours." });

  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
