<script>
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
function S(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "single", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
function M(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "multi", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
var CATS = ["Postpartum Hemorrhage — Shock and First Response","Uterine Atony, Bladder, and Subinvolution","Lacerations and Hematomas — Concealed Bleeding","Postpartum Infections — Uterus, Wound, Urinary Tract, Breast","Thromboembolism — SVT, DVT, and Pulmonary Embolism","Clotting Problems and Hemorrhage Medications","Postpartum Mood Disorders — Blues, Depression, Psychosis"];
var KEYTERMS = [];

/* ================= NGN CASE 1 — postpartum hemorrhage (atony) ================= */
var CASE_CT1 = "CASE STUDY — The Fundus That Would Not Stay Firm. Mrs. D. A., 29 years old, G5 P4, gave birth vaginally to a 4,300 g baby 50 minutes ago after a long labor augmented with oxytocin. The placenta delivered intact. She has not voided since before the birth. On assessment now: the fundus is difficult to locate; when found it is soft, above the umbilicus, and pushed to the right of midline. Lochia is heavy and rubra with several large clots; one perineal pad saturated in 25 minutes. Pulse 112, blood pressure 122/80, respirations 20. She says she feels 'a little shaky and nervous.'";

S("Postpartum Hemorrhage — Shock and First Response", "CASE STUDY — The Fundus That Would Not Stay Firm. Which cluster of cues most strongly indicates that a hemorrhage is developing?", [
  ["The soft, high, displaced fundus with heavy rubra lochia, large clots, a pad saturated in 25 minutes, a pulse of 112, and new shakiness and nervousness", true, "Every cue points the same way: a uterus that is not clamping (soft, high, displaced), loss that is heavy with large clots and faster than one pad per hour, and the earliest volume signs — a rising pulse and restlessness — while the blood pressure still looks acceptable."],
  ["The firm, midline fundus at the umbilicus with moderate rubra lochia, a few small clots, a pulse of 84, and a mother who is resting comfortably after the birth", false, "That is the normal recovery picture — firm and midline, moderate flow, small clots only, a slow-normal postpartum pulse. It is the comparison picture, not Mrs. D. A.'s."],
  ["A continuous bright-red trickle with a firm fundus, severe perineal pain the analgesic has not touched, and lochia that looks normal in amount and color", false, "That cluster belongs to the trauma family — a laceration trickle or a hematoma's pain pattern. Mrs. D. A.'s fundus is soft and her flow is heavy, which is a different source."],
  ["A temperature of 38.1 °C with a tender, enlarged uterus, foul-smelling lochia, and prolonged severe cramping on the second postpartum day", false, "That is the endometritis picture, and it belongs to a later day. Her emergency at 50 minutes is bleeding, not infection."]
], "ANSWER KEY — Correct answer: the atony cluster — soft displaced fundus, heavy clots, fast pad saturation, pulse 112, restlessness. DETAILED RATIONALE — NGN step 1 (recognize cues): hemorrhage cues sort by pattern. Tone failure shows a soft, high, hard-to-find fundus with heavy flow; volume loss announces itself in pulse and behavior before the blood pressure moves. PRIORITY FRAMEWORK — Clinical Judgment (recognize cues): read the whole pattern, not the single worst number.", { scen: CASE_CT1, grp: "CT-CASE1" });

M("Postpartum Hemorrhage — Shock and First Response", "CASE STUDY — The Fundus That Would Not Stay Firm. Which findings in Mrs. D. A.'s picture are early evidence that her circulating volume is already falling? Select all that apply.", [
  ["A pulse of 112 in a postpartum woman, when a slow pulse is the expected pattern after birth", true, "Tachycardia is usually the FIRST sign of inadequate blood volume. Postpartum mothers often run slow pulses, so a pulse over 100 means suspect shock or infection — never reassurance."],
  ["New restlessness — she describes feeling shaky and nervous", true, "As volume falls, blood is shunted to protect the heart and brain, and the brain still gets less flow: anxiety, restlessness, and shakiness come before lethargy."],
  ["A perineal pad saturated in 25 minutes, faster than the one-saturated-pad-per-hour ceiling for the first hours", true, "Pad speed is a volume measurement: saturating in 15 minutes to 1 hour must be reported promptly. Her rate says the loss is outpacing replacement."],
  ["A blood pressure of 122/80, which confirms her circulating volume is still adequate", false, "The blood pressure is the trap. Pregnancy adds 1–2 L of volume, so pressure holds until it suddenly doesn't — pulse pressure narrows first, and the BP falls late."],
  ["Rubra lochia, which is the expected color in the first hours and therefore rules out significant loss", false, "The color is expected; the AMOUNT and the large clots are the problem. Blood can also pool inside a relaxed uterus and hide the true loss."],
  ["Large clots in the lochia, which are an expected finding in the first hours after any birth", false, "A few SMALL clots are acceptable. Large clots are not — they ride with atony bleeding and count as loss."]
], "ANSWER KEY — Correct answers: pulse 112, new restlessness/shakiness, and a pad saturated in 25 minutes. DETAILED RATIONALE — NGN step 2 (analyze cues): the body compensates and hides shock early. Heart and respiratory rates climb first, the brain shows restlessness, and the pad rate measures the loss — while the blood pressure, the number everyone wants to trust, changes last. PRIORITY FRAMEWORK — Clinical Judgment (analyze cues) + ABCs: trend the early signs, not the late one.", { scen: CASE_CT1, grp: "CT-CASE1" });

S("Uterine Atony, Bladder, and Subinvolution", "CASE STUDY — The Fundus That Would Not Stay Firm. What should the nurse do FIRST for Mrs. D. A.?", [
  ["Massage the uterus until it becomes firm", true, "Source control comes first: the open vessels at the placental site close only when the uterus clamps down. Massage to firm is the opening move of the atony sequence in this chapter."],
  ["Catheterize her to empty the bladder before touching the fundus", false, "The bladder matters — it is why the fundus sits high and to the right — but the bladder is emptied to KEEP the uterus firm. The sequence is massage to firm first, then empty the bladder so the firmness holds."],
  ["Press toward the vagina to expel the pooled clots and blood", false, "Clots are expressed only AFTER the uterus is firm. Pressing on a soft uterus risks more pooling, not less."],
  ["Weigh the saturated pad and chart the loss before intervening", false, "Quantification matters and runs alongside care, but weighing a pad does not stop bleeding. Firm the uterus first; measure as you go."]
], "ANSWER KEY — Correct answer: massage the uterus until it is firm. DETAILED RATIONALE — NGN step 3 (prioritize hypotheses/actions): atony care has a tested order — massage to firm FIRST, clots only once firm, bladder emptied to keep it firm. Her risk stack (grand multiparity, a 4,300 g baby stretching the uterus, a long oxytocin-augmented labor, a full bladder) all converges on tone. PRIORITY FRAMEWORK — Nursing Process (assessment to intervention): stop the loss at its source before supporting measures.", { scen: CASE_CT1, grp: "CT-CASE1" });

M("Postpartum Hemorrhage — Shock and First Response", "CASE STUDY — The Fundus That Would Not Stay Firm. The fundus firms with massage but softens again each time the nurse stops. Which actions should the nurse include in the plan now? Select all that apply.", [
  ["Empty her bladder — catheterize if she cannot void — so the firmness the massage won can hold", true, "A full bladder physically blocks contraction and is displacing her uterus. Emptying it removes the driver so tone can hold; many providers pre-order catheterization so this fix is not delayed."],
  ["Put the baby to breast so suckling releases her own oxytocin", true, "Suckling triggers the posterior pituitary to release oxytocin, which contracts the uterus — breastfeeding is a built-in uterotonic."],
  ["Notify the provider and prepare the first-line uterotonic, a dilute oxytocin IV infusion", true, "A uterus that will not stay firm escalates up the drug ladder, and oxytocin is the first-line drug. Notification and preparation happen together."],
  ["Keep her NPO until the provider has evaluated her", true, "Hemorrhage patients stay NPO until evaluated — repair, packing, or curettage under general anesthesia may follow, and an empty stomach is anesthesia safety."],
  ["Keep massaging continuously for the next hour so the uterus cannot relax again", false, "Overmassage is a named trap: the uterus is a muscle, overstimulation tires it, and a tired uterus contracts worse. Massage to firm, then stop."],
  ["Give her oral fluids and a meal to replace the volume she has lost by mouth", false, "She is NPO, and oral intake cannot replace volume at hemorrhage speed. Volume is replaced IV."]
], "ANSWER KEY — Correct answers: empty the bladder, baby to breast, notify the provider and prepare oxytocin, and keep her NPO. DETAILED RATIONALE — NGN step 4 (generate solutions): each driver gets its matched tool — bladder (empty it), physiology (suckling oxytocin), pharmacology (first-line uterotonic), and anesthesia safety (NPO) — while the two false actions attack the problem in ways the chapter warns against. PRIORITY FRAMEWORK — Clinical Judgment (generate solutions): one tool per driver, bundle underneath.", { scen: CASE_CT1, grp: "CT-CASE1" });

BANK.push({ cat: "Uterine Atony, Bladder, and Subinvolution", type: "order", stem: "CASE STUDY — The Fundus That Would Not Stay Firm. Place the nurse's actions in the correct order for Mrs. D. A.'s atony care.", items: [
  { t: "Massage the uterus until it is firm", r: "FIRST source control: the placental-site vessels close only when the muscle clamps. Massage to firm — and stop once it is firm." },
  { t: "Expel pooled clots and blood by pressing toward the vagina", r: "Clots are expressed only against a firm uterus; pressing on a soft one risks more pooling." },
  { t: "Empty the bladder, catheterizing if she cannot void, so the uterus stays firm", r: "Her fundus pushed high and to the right names the full bladder. Emptying it removes the driver so the firmness holds." },
  { t: "Give the ordered uterotonic and notify the provider that tone will not hold on its own", r: "Escalation: a uterus that re-softens needs the drug ladder and the provider in the loop." },
  { t: "Reassess fundus, lochia, and vital signs and compare them with the starting values", r: "Evaluation closes the sequence: is the fundus holding, the flow slowing, the pulse settling?" }
], tp: "ANSWER KEY — Correct order: massage to firm → expel clots once firm → empty the bladder to keep it firm → uterotonic and provider notification → reassess against baseline. DETAILED RATIONALE — NGN step 5 (take action): the chapter's sequence is a clinical decision — firm it, clear it, keep it firm, support it, re-judge it. PRIORITY FRAMEWORK — Clinical Judgment (take action): order is treatment, not paperwork.", scen: CASE_CT1, grp: "CT-CASE1" });

S("Postpartum Hemorrhage — Shock and First Response", "CASE STUDY — The Fundus That Would Not Stay Firm. Thirty minutes into treatment the nurse reassesses Mrs. D. A. Which set of findings shows the interventions are working?", [
  ["Fundus firm and midline at the umbilicus, lochia moderate with no new large clots, pulse down to 96, and she is calmer", true, "Every driver is answered: tone holds (firm, midline), loss has slowed (moderate flow, no new large clots), and the early volume signs are reversing (pulse settling, restlessness easing)."],
  ["Fundus firm, but her blood pressure has fallen to 96/60 and her pulse has climbed to 124", false, "That is deterioration wearing a firm fundus. A falling BP in hemorrhage is a LATE and ominous sign, and the climbing pulse says volume is still losing."],
  ["Fundus boggy again, but her blood pressure is unchanged at 122/80, so the picture is stable", false, "A re-softened uterus means the source is not controlled, and an unchanged BP does not clear her — pressure falls late in hypovolemia."],
  ["Lochia has stopped completely, the fundus can no longer be felt, and she says she feels fine", false, "Absent flow is not the goal picture. Blood can pool inside a relaxed uterus and hide the loss; the expected outcome is a firm, findable fundus with moderate flow."]
], "ANSWER KEY — Correct answer: firm midline fundus, moderate lochia without new large clots, pulse settling, restlessness easing. DETAILED RATIONALE — NGN step 6 (evaluate outcomes): improvement is measured per driver — tone, flow, and the early shock signs — against the starting values, not by any single reassuring number. PRIORITY FRAMEWORK — Clinical Judgment (evaluate outcomes): match each outcome to the intervention that was supposed to produce it.", { scen: CASE_CT1, grp: "CT-CASE1" });

/* ================= Category A standalone — shock and first response ================= */
S("Postpartum Hemorrhage — Shock and First Response", "A woman 3 hours after a vaginal birth has lost an estimated 900 mL of blood. Her pulse is 118, respirations 24, blood pressure 104/72 (baseline 128/84), skin pale and cool, and she is newly restless. Which statement about her condition is correct?", [
  ["She is showing compensated hypovolemic shock — her pulse rose first and her pulse pressure is narrowing while her blood pressure is only beginning to fall", true, "The compensation pattern is the chapter's core shock lesson: heart and respiratory rates climb first, pulse pressure narrows (systolic falls, diastolic rises), skin turns pale and cool as blood is shunted centrally, and the brain shows restlessness — all before the BP collapses."],
  ["She is not in shock, because her systolic pressure is still above 100 and has not yet fallen to a hypotensive level", false, "Waiting for hypotension waits for the late sign. By the time the BP cannot compensate, the loss is advanced and can become undetectable-pressure territory fast."],
  ["Her restlessness and fast pulse are explained by pain and the excitement of the birth rather than by volume loss", false, "In a woman who has lost 900 mL, restlessness is a brain-perfusion sign until proven otherwise. Naming it excitement dismisses the earliest alarm."],
  ["Her urine output is the first sign that will change in volume loss, and it has not been reported low, so she is still compensating fully", false, "The kidneys conserve fluid as volume falls, so output drops as part of the picture — but the pulse changes FIRST. An unreported output is not a clearance."]
], "ANSWER KEY — Correct answer: compensated hypovolemic shock with narrowing pulse pressure. DETAILED RATIONALE — Shock signs can look mild while the body compensates, then become life-threatening suddenly; the nurse's vigilance is the early-warning system. Read the pulse, the pulse pressure, the skin, and the behavior — not the reassuring systolic. PRIORITY FRAMEWORK — ABCs / circulation: recognize compensation before it fails.");

S("Postpartum Hemorrhage — Shock and First Response", "A woman after a cesarean birth has a measured blood loss of 850 mL. She is pale, her pulse is 116, and she feels faint when she sits up. How should the nurse classify and act on this picture?", [
  ["Treat it as postpartum hemorrhage — the cesarean threshold is over 1000 mL, but her signs of hypovolemia make it a hemorrhage now", true, "The chapter pairs the cesarean number with signs and symptoms of hypovolemia. Pallor, a pulse of 116, and faintness on sitting are volume signs — the picture, not the arithmetic alone, drives the response."],
  ["Reassure her — 850 mL is below the cesarean hemorrhage threshold, so this counts as expected surgical loss", false, "A threshold is a definition line, not a permission to ignore shock signs. Her body is already reporting the loss."],
  ["Classify it as late postpartum hemorrhage because she is now recovering on the postpartum unit", false, "Late PPH begins after 24 hours. Location on a unit does not change the clock."],
  ["Chart it as within normal limits and recheck her at the next routine round in 4 hours", false, "Routine rounds are for stable patients. Tachycardia with faintness after an 850 mL loss buys escalation and close trending, not a routine interval."]
], "ANSWER KEY — Correct answer: treat as PPH — hypovolemia signs with the loss. DETAILED RATIONALE — PPH is over 500 mL after a vaginal birth and over 1000 mL after a cesarean birth, and the definition travels with the signs of hypovolemia. Pregnancy's extra 1–2 L of volume hides loss until it doesn't. PRIORITY FRAMEWORK — Assessment accuracy: classify by the patient's picture, not by one number.");

S("Postpartum Hemorrhage — Shock and First Response", "A nurse is caring for a woman with early postpartum hemorrhage. Which practice gives the most accurate running total of her blood loss?", [
  ["Weigh every perineal pad and underpad and convert the added weight, counting each gram as 1 mL of blood", true, "The chapter's measurement rule is the scale: 1 g of weight ≈ 1 mL of blood. Weighed loss is the number the team can trend and act on."],
  ["Estimate the loss visually at each pad change and chart it as light, moderate, or heavy", false, "Visual estimates under-read blood loss, and descriptive words cannot be trended. Estimation is how a slow hemorrhage gets missed."],
  ["Count the pads used per hour and multiply by the capacity printed on the supply package", false, "Pads are rarely saturated to a standard capacity, and blood also lands on linens and pools internally. Pad counts are a screening cue, not a measurement."],
  ["Measure what collects in the bedpan at each voiding and add the pad count to that total", false, "Bedpan volume mixes urine with blood and misses everything on pads and linens. The weighed-pad method captures the loss where it lands."]
], "ANSWER KEY — Correct answer: weigh pads and underpads, 1 g = 1 mL. DETAILED RATIONALE — Quantification is a hemorrhage-bundle action, not paperwork: pad weights, vital signs every 15 minutes until stable, and strict intake and output are how the team sees the trend a single glance misses. One caution from the chapter: cold-pack perineal pads absorb less than regular pads, so an estimate built on them reads low. PRIORITY FRAMEWORK — Evidence Based Practice: measure with the validated method, not the convenient one.");

S("Postpartum Hemorrhage — Shock and First Response", "A woman with early postpartum hemorrhage is asking for a sandwich and juice. Which nursing action and reasoning are correct?", [
  ["Keep her NPO — she may need general anesthesia to correct the bleeding source, and oral intake cannot replace volume at hemorrhage speed", true, "The chapter's rule: keep the hemorrhaging patient NPO until the provider evaluates her. Repair, packing, or curettage may need general anesthesia, and an empty stomach is anesthesia safety."],
  ["Give her juice and ice chips only — clear liquids do not count against NPO status during a hemorrhage", false, "Clear liquids are still intake before possible general anesthesia. The NPO rule in hemorrhage has no juice exception."],
  ["Give her the meal — eating and drinking will raise her blood pressure and help replace the lost volume", false, "Oral intake cannot match hemorrhage-speed loss, and a full stomach adds anesthesia risk. Volume is replaced IV."],
  ["Keep her NPO because food in the stomach draws blood away from the uterus and worsens the bleeding", false, "The action is right but the reasoning is invented. The NPO rule exists for anesthesia safety and evaluation — teach the real reason."]
], "ANSWER KEY — Correct answer: keep her NPO for possible general anesthesia. DETAILED RATIONALE — Severe bleeding may need the provider to examine and fix the source in the delivery or operating room. NPO status is part of hemorrhage readiness, alongside IV access, oxygen, and quantified loss. PRIORITY FRAMEWORK — Safety: protect the next intervention before it is needed.");

M("Postpartum Hemorrhage — Shock and First Response", "A nurse is watching a postpartum woman for hypovolemic shock after a large blood loss. Which findings belong to the shock picture? Select all that apply.", [
  ["Rising pulse and respiratory rates as the first response to falling volume", true, "The first compensation: move the remaining blood faster and squeeze more oxygen from each red cell. Tachycardia is usually the first sign of inadequate volume."],
  ["Pale, cold, clammy skin and mucous membranes", true, "Blood is shunted away from 'nonessential' organs to protect the heart and brain — the skin shows the shunt."],
  ["Growing anxiety and restlessness, progressing toward lethargy", true, "The brain's flow falls in stages: anxiety, confusion, and restlessness first, then lethargy as compensation fails."],
  ["Falling urine output as the kidneys conserve fluid", true, "The kidneys hold fluid to defend volume, so output falls and can stop — which is why a catheter turns output into a continuous perfusion monitor."],
  ["A widening pulse pressure as the earliest blood pressure change", false, "The pulse pressure NARROWS first — systolic falls while diastolic rises. Widening is the backwards version of the chapter's sequence."],
  ["Warm, flushed skin from blood being shunted toward the skin surface", false, "Shunting runs the other way: away from skin and gut, toward heart and brain. Warm flushed skin argues against this picture."]
], "ANSWER KEY — Correct answers: rising pulse and respirations, pale cold clammy skin, restlessness progressing to lethargy, and falling urine output. DETAILED RATIONALE — Hypovolemic shock is a sequence, not a snapshot: rates climb, pulse pressure narrows, skin pales and cools, behavior changes, urine falls, and only late does the blood pressure give way. PRIORITY FRAMEWORK — ABCs: know the sequence so the early links trigger action.");

BANK.push({ cat: "Postpartum Hemorrhage — Shock and First Response", type: "matrix", stem: "Four postpartum women are in shock from different mechanisms. Match each woman to her shock type.", cols: ["Cardiogenic shock","Hypovolemic shock","Anaphylactic shock","Septic shock"], rows: [
  { t: "A woman collapses after a pulmonary embolism blocks blood flow through her lungs", a: 0, r: "Cardiogenic — a pump problem: the embolism (like severe anemia, hypertension, or cardiac disease) keeps the heart from delivering." },
  { t: "A woman bleeds heavily from uterine atony until her circulation can no longer fill", a: 1, r: "Hypovolemic — a volume problem: postpartum hemorrhage or a clotting disorder empties the system the pump depends on." },
  { t: "A woman develops a severe allergic reaction minutes after a medication is given", a: 2, r: "Anaphylactic — an allergic reaction to a drug that was given; the trigger is the medication, not the loss." },
  { t: "A woman with a puerperal infection deteriorates as the infection spreads through her body", a: 3, r: "Septic — driven by puerperal infection; the source is microbial, which is why containing local infection early matters." }
], tp: "ANSWER KEY — Correct matches: embolism collapse = cardiogenic; atony bleeding = hypovolemic; drug reaction = anaphylactic; spreading puerperal infection = septic. DETAILED RATIONALE — The four shock types sort by mechanism — pump, volume, allergic, septic — and the mechanism names the first fix. In this chapter the nurse most often meets the volume type, but the sort keeps the others from being missed. PRIORITY FRAMEWORK — Assessment accuracy: mechanism first, then management." });

BANK.push({ cat: "Postpartum Hemorrhage — Shock and First Response", type: "matrix", stem: "Four postpartum women are bleeding. Match each woman to the T of postpartum hemorrhage that fits her picture.", cols: ["Tone","Trauma","Tissue","Thrombin"], rows: [
  { t: "Boggy, high fundus with heavy lochia and large clots 40 minutes after a vaginal birth", a: 0, r: "Tone — uterine atony, the most common cause of early PPH: massage to firm, empty the bladder, uterotonics." },

S("Postpartum Hemorrhage — Shock and First Response", "Which mother's bleeding falls in the LATE postpartum hemorrhage window with its usual cause pattern?", [
  ["A woman on day 12 whose lochia had turned pale and is now bright red again with clots — the pattern of retained fragments and subinvolution", true, "Late PPH runs from after 24 hours to 6 weeks and usually declares itself at home. Its two usual drivers are retained placental fragments and subinvolution, and its signature is red returning after the lochia had faded."],
  ["A woman 90 minutes after birth with a boggy fundus and heavy flow — the pattern of retained fragments and subinvolution", false, "Ninety minutes is the EARLY window, and a boggy fundus with heavy flow is the tone pattern. The cause list belongs to a different clock."],
  ["A woman 2 hours after birth with a firm fundus and a steady bright-red trickle from a cervical tear", false, "That is early-window trauma — a tear bleeding while the uterus stays firm. Neither the timing nor the cause pattern is the late one."],
  ["A woman 30 minutes after a cesarean birth whose incision dressing is saturated and whose pulse is rising", false, "Thirty minutes after birth is early hemorrhage by definition, whatever the source. The late window starts after the first day."]
], "ANSWER KEY — Correct answer: the day-12 mother with red bleeding returning after fading. DETAILED RATIONALE — The early/late split is the chapter's sorting rule: early bleeding is the uterus failing to clamp or a fresh injury; late bleeding is something left behind or a uterus failing to involute. Discharge teaching is the safety net precisely because late PPH declares itself at home. PRIORITY FRAMEWORK — Assessment accuracy: timing plus the 'red after fading' signature names the category and its causes.");

S("Postpartum Hemorrhage — Shock and First Response", "A woman being treated for early postpartum hemorrhage has an indwelling catheter that drained 15 mL of urine in the last hour. How should the nurse interpret and use this finding?", [
  ["It is a perfusion alarm — her kidneys are conserving fluid because volume is down, and hourly output tracks whether replacement is working", true, "In the shock bundle, strict intake and output with an indwelling catheter tracks urine output as a kidney-function and perfusion window. Falling output in a bleeding woman is hypovolemia speaking."],
  ["It is expected — urine output normally falls to near zero for the first day after birth while the bladder recovers", false, "Postpartum bladders do the opposite — they fill, which is why distention is an atony driver. Near-zero output during hemorrhage is a shock sign, not a recovery pattern."],
  ["It proves the catheter is blocked, because a postpartum woman always produces more urine than this in an hour", false, "Patency is worth a check, but in active hemorrhage oliguria is read as volume loss until proven otherwise. Treating it as a plumbing problem first delays the volume response."],
  ["It is reassuring — low output shows her body is successfully holding on to fluid and compensating well", false, "Conservation is compensation, and compensation has a limit. Output that falls toward zero marks kidneys being underperfused, not a victory."]
], "ANSWER KEY — Correct answer: a perfusion alarm — oliguria tracks falling volume and response to replacement. DETAILED RATIONALE — The hemorrhage bundle runs source control, IV fluids and blood, oxygen with saturation monitoring, vital signs every 15 minutes until stable, and strict intake and output — each element watches a different part of the same failing system. PRIORITY FRAMEWORK — ABCs / circulation: urine output is a perfusion gauge, not a bladder note.");

S("Postpartum Hemorrhage — Shock and First Response", "A woman with early postpartum hemorrhage has received IV fluids, uterotonics, and one unit of blood. Which reassessment trend best shows she is responding to treatment?", [
  ["Pulse trending down toward her baseline, urine output rising, skin warming, and restlessness easing while the fundus stays firm", true, "Response is read across the systems that failed: rate settling, kidneys releasing urine again, skin reperfusing, brain clearing, and the source staying controlled."],
  ["Blood pressure unchanged from the reading taken when treatment started, with her pulse still at its peak", false, "Unchanged pressure with a peak pulse is a flat trend, not a response. The BP was never the early mover in either direction."],
  ["Lochia now absent on the pad at the last check, with the fundus no longer palpable", false, "Absent flow can mean blood is pooling inside a relaxed uterus, and an unfindable fundus is an assessment alarm — not a success marker."],
  ["She has fallen asleep, so her restlessness has resolved and her volume is recovering", false, "In the shock sequence, restlessness progresses to lethargy as perfusion worsens. New sleepiness in a bleeding woman is deterioration until assessed otherwise."]
], "ANSWER KEY — Correct answer: pulse settling, urine rising, skin warming, restlessness easing, fundus firm. DETAILED RATIONALE — Evaluation compares each system against its own baseline from the worst point: the trend is the finding. Single reassuring values — a held BP, an empty pad, a quiet patient — are the three classic false reassurances of this chapter. PRIORITY FRAMEWORK — Clinical Judgment (evaluate outcomes): improvement is a trend across systems, not one number.");

M("Postpartum Hemorrhage — Shock and First Response", "A nurse is planning assessments for four newly admitted postpartum mothers. Which mothers need the closest, most frequent fundus and lochia checks because of their hemorrhage risk? Select all that apply.", [
  ["A mother who has given birth five times before this birth", true, "Multiparity — five or more births — is a named atony risk: a uterus stretched by many pregnancies clamps less reliably."],
  ["A mother of twins whose uterus was stretched by two babies", true, "Overdistention is a core atony driver — twins, a large baby, or excess fluid stretch the muscle fibers that must contract."],
  ["A mother whose long labor was augmented with oxytocin and who has not yet voided since the birth", true, "Two stacked drivers: oxytocin used in labor is on the atony risk list, and her unemptied bladder can block contraction by itself."],
  ["A mother whose placenta was removed manually because it did not separate cleanly", true, "Manual removal raises the retained-fragment risk — fragments keep the uterus from sealing and drive later bleeding."],
  ["A first-time mother after an uncomplicated 6-hour labor who voided 500 mL an hour after the birth", false, "Her profile carries none of the chapter's risk stack, and she has already emptied the bladder that causes trouble. Routine checks fit her."],
  ["A mother whose fundus is firm and midline with moderate rubra lochia and no clots", false, "Those are normal findings, not risk factors. The question asks who needs closer watching because of risk — she is the comparison, not a candidate."]
], "ANSWER KEY — Correct answers: the grand multipara, the mother of twins, the oxytocin-augmented mother who has not voided, and the mother whose placenta was manually removed. DETAILED RATIONALE — Risk recognition is a chapter objective in its own right: every factor spotted buys that mother closer, more frequent assessment. The risk list clusters around a stretched or tired uterus, drugs that relax it, a full bladder, and tissue left behind. PRIORITY FRAMEWORK — Prevention / risk stratification: assess the high-risk mother more often, before she declares herself.");

/* ================= Category B standalone — atony, bladder, subinvolution ================= */
S("Uterine Atony, Bladder, and Subinvolution", "One hour after birth, a woman's fundus feels firm but sits well above the umbilicus and off to the right. She last voided 5 hours ago. Which action and reasoning are correct?", [
  ["Have her void or catheterize her, then reassess tone — a full bladder can make the uterus feel firm while displacing it, so tone is judged only after it is empty", true, "The chapter's bladder trap: distention pushes the uterus up and to one side, and the displaced uterus can feel firm against the full bladder. Empty the bladder first — it is also the cheapest hemorrhage prevention there is — then judge tone."],
  ["Chart the fundus as firm and adequate — a firm uterus is a contracted uterus, and its height and position do not change that", false, "Height and position are part of the assessment, not decoration. A high, displaced fundus is the bladder's signature, and charting it away leaves an atony driver in place."],
  ["Massage the fundus vigorously until it moves back to midline and descends to the umbilicus on its own", false, "The uterus already feels firm — massaging a contracted uterus is not the fix, and vigorous massage courts the overmassage trap. The displacement is mechanical: empty what is pushing it."],
  ["Give the ordered uterotonic now, because a high fundus means the uterus needs pharmacologic help to contract and hold", false, "Drugs come after the fixable cause is removed. A uterotonic cannot contract a uterus around a bladder that is physically blocking it."]
], "ANSWER KEY — Correct answer: empty the bladder, then reassess tone. DETAILED RATIONALE — A full bladder blocks contraction, can produce atony and hemorrhage by itself if left uncorrected, and fakes a firm feel while it displaces the uterus. Sequence protects the judgment: empty first, then decide whether tone is truly adequate. PRIORITY FRAMEWORK — Assessment before intervention: remove the confounder before judging the finding.");

S("Uterine Atony, Bladder, and Subinvolution", "A nurse massages a boggy uterus until it firms, then keeps massaging 'to make sure it stays that way' for several more minutes. The uterus then feels softer than before. What explains this?", [
  ["The uterus is a muscle and overstimulation tires it — overmassage worsens atony, so massage stops once the uterus is firm", true, "A named chapter trap. The fibers that clamp the placental-site vessels fatigue like any muscle; a tired uterus contracts worse than before the extra massage."],
  ["Clots have pooled inside the uterus, and the answer is to massage harder and longer to expel them", false, "Harder and longer is the error being repeated. Pooled clots are expressed only against a firm uterus — and this one was firm before the extra massage began."],
  ["The uterus has become resistant to touch and now needs a uterotonic before any further assessment", false, "Drug escalation is for a uterus that will not firm or hold with correct technique. Here the technique itself caused the softening."],
  ["The bladder filled during the massage and is now blocking contraction again", false, "The bladder is always worth checking — it is the other fixable driver — but the timeline names the mechanism: firm, then softer after minutes of continued massage. That is muscle fatigue."]
], "ANSWER KEY — Correct answer: overmassage tired the muscle and worsened the atony. DETAILED RATIONALE — The atony ladder is precise: massage until firm, never overmassage, leave a firmly contracted uterus alone, empty the bladder to keep it firm, put the baby to breast, and escalate to drugs when correct technique is not enough. PRIORITY FRAMEWORK — Safety: the right intervention at the wrong dose becomes the harm.");

S("Uterine Atony, Bladder, and Subinvolution", "At a clinic visit 12 days after birth, a woman's fundus is still palpable well above where it should be, her lochia is still rubra, and she reports pelvic heaviness and unusual fatigue. Which problem does this picture name, and what drives it most often?", [
  ["Subinvolution — the uterus is failing to return to its prepregnant state on schedule, most often because of infection or retained placental fragments", true, "The picture matches the definition and the clock: the uterus should descend about 1 cm a day and be nonpalpable by about 12 days, with lochia progressing through its phases. A high fundus, persistent rubra, heaviness, and fatigue are the stalled-return pattern."],
  ["Normal involution — the uterus is not expected to become nonpalpable until 6 weeks, and rubra at day 12 is within the normal range", false, "Six weeks is when the placental SITE has healed, not when the fundus disappears. By about day 12 the uterus should no longer be palpable, and rubra should have progressed."],
  ["Uterine atony — the same failure to contract that causes bleeding in the first hours after birth", false, "Atony is the first-hours event — a muscle that never clamps. This is a return that started and stalled, a different problem with different drivers."],
  ["A new pregnancy — a palpable uterus with bleeding at day 12 means she has conceived again", false, "Nothing in the picture supports conception, and the finding set is the textbook subinvolution cluster. Reaching for a rare explanation skips the common one."]
], "ANSWER KEY — Correct answer: subinvolution, driven most often by infection or retained fragments. DETAILED RATIONALE — Subinvolution usually declares itself after discharge, which is why discharge teaching is the safety net: fundal height higher than expected for the day, lochia rubra persisting or phases progressing too slowly, pelvic pain and heaviness, and fatigue. PRIORITY FRAMEWORK — Assessment accuracy: compare the finding against the day's expected value.");

S("Uterine Atony, Bladder, and Subinvolution", "A woman with subinvolution has a blood pressure of 118/76, no fever, and an ultrasound showing retained placental fragments. Which provider plan fits the cause?", [
  ["Methylergonovine to hold a firm contraction, with curettage to strip the retained fragments from the uterine wall", true, "Subinvolution care treats the cause: the ergot drug holds the contraction, and curettage (D&C or D&E) removes the fragments the ultrasound found. Her normal blood pressure clears the ergot's one big catch."],
  ["Methylergonovine alone for 2 weeks, because medication always clears fragments without a procedure", false, "'Always' fails here — a firm contraction often expels fragments, but when bleeding continues or fragments persist, curettage is the named removal step."],
  ["IV antibiotics as the only treatment, because fragments resolve once infection risk is covered", false, "Antibiotics treat the infection driver. She has no fever and a mechanical finding — fragments are tissue, and tissue is removed, not sterilized."],
  ["Reassurance with a recheck in 6 weeks, because subinvolution corrects itself once the placental site heals", false, "Subinvolution is by definition a return that has stalled. Watching a stalled process for 6 weeks invites the late hemorrhage it produces."]
], "ANSWER KEY — Correct answer: methylergonovine to hold contraction plus curettage for the fragments. DETAILED RATIONALE — The subinvolution plan is cause-matched: methylergonovine when contraction must be held, antibiotics when infection is the driver, curettage when fragments must come out. Her normal BP matters — the same drug would be forbidden if she were hypertensive. PRIORITY FRAMEWORK — Generate solutions matched to cause: drug for tone, procedure for tissue.");

M("Uterine Atony, Bladder, and Subinvolution", "A nurse is reviewing the admission chart of a woman who has just given birth vaginally and is flagging conditions that raise her risk for uterine atony. Which conditions should be flagged? Select all that apply.", [
  ["A uterus overdistended by a large baby, twins, or excess amniotic fluid", true, "Stretched fibers contract poorly — overdistention is a headline atony risk."],
  ["A labor in which a uterus-relaxing (tocolytic) drug was given", true, "A uterus still under a relaxing drug's effect may not clamp after birth; the chapter lists uterus-relaxing drugs on the atony risk list."],
  ["Five or more previous births", true, "Multiparity (5+ births) is a named risk — the much-used uterus clamps less reliably."],
  ["A bladder that has not been emptied since the birth", true, "The fixable driver: distention alone can produce atony and hemorrhage if left uncorrected."],
  ["A rapid labor with a firm fundus and a steady trickle of bright-red blood", false, "That is the laceration picture — rapid labor is listed as more of a laceration/hematoma risk, and the firm fundus with a trickle names trauma, not tone."],
  ["Breastfeeding started in the first hour, with the baby suckling well", false, "Suckling is protective — it releases her own oxytocin and contracts the uterus. It belongs on the treatment list, not the risk list."]
], "ANSWER KEY — Correct answers: overdistention, a tocolytic on board, five or more previous births, and an unemptied bladder. DETAILED RATIONALE — Atony risk clusters into a stretched uterus, a tired or much-used uterus, drugs that relax it, and the bladder that blocks it. Sorting risk by family keeps the trauma risks (rapid labor, instruments) from diluting the tone list. PRIORITY FRAMEWORK — Risk recognition: the risk list is the assessment schedule.");
