  { t: "Oxytocin used to augment a long labor", a: 0, r: "Atony — oxytocin used in labor sits on the atony risk list, alongside the tired uterus a long labor produces." }
], tp: "ANSWER KEY — Correct matches: twins = atony; rapid labor = laceration/hematoma; cracked nipples = infection; oxytocin-augmented long labor = atony. DETAILED RATIONALE — Risk factors are family-shaped: each one buys closer assessment for ITS complication. Sorting them correctly is what turns a history into a surveillance plan. PRIORITY FRAMEWORK — Risk stratification: the factor names the watch." });

BANK.push({ cat: "Uterine Atony, Bladder, and Subinvolution", type: "order", stem: "A woman's uterus will not stay firm despite massage, an empty bladder, and the baby at breast. Place the remaining steps of the atony ladder in order.", items: [
  { t: "Start a dilute oxytocin (Pitocin) IV infusion", r: "Oxytocin is the first-line drug for atony — the ladder starts with the drug that contracts the uterus with the fewest catches." },
  { t: "Move to an escalation uterotonic such as methylergonovine or a prostaglandin, checking her blood pressure before an ergot drug", r: "Escalation drugs come next — and the ergot carries the chapter's drug catch: it raises blood pressure, so the BP check gates it." },
  { t: "Prepare for uterine tamponade with packing or an intrauterine balloon if the bleeding continues", r: "When drugs are not enough, pressure from inside the uterus is the next rung — tamponade presses on the bleeding surface." },
  { t: "Prepare for the operating room for arterial intervention or, as a last resort, hysterectomy", r: "Embolization, artery ligation, and finally hysterectomy close the ladder — reserved for a uterus that answers nothing else." }
], tp: "ANSWER KEY — Correct order: oxytocin infusion → escalation uterotonic (BP checked before an ergot) → tamponade → operating room / last-resort hysterectomy. DETAILED RATIONALE — The ladder climbs from least to most invasive, and each rung is tried before the next is mounted. Skipping rungs costs the patient either a drug catch she did not need or a uterus she did. PRIORITY FRAMEWORK — Least invasive first: escalate in order, reassessing at every rung." });

/* ================= Category C — lacerations and hematomas ================= */
S("Lacerations and Hematomas — Concealed Bleeding", "Two hours after a forceps-assisted birth, a woman's fundus is firm and midline, but a continuous trickle of bright-red blood is running and she has soaked a pad in 40 minutes. What is the most likely source, and what is the priority action?", [
  ["A laceration of the reproductive tract — notify the provider to examine and repair it, and keep her NPO in case anesthesia is needed", true, "The signature is exact: bright-red blood in a continuous trickle while the uterus stays firm, after an instrument birth. Tears of the perineum, vagina, cervix, or periurethral area bleed profusely from pregnancy-engorged vessels, and repair is suturing — the provider's procedure, prepared for like any hemorrhage."],
  ["Uterine atony — massage the fundus firmly and give a uterotonic, because a firm feel can be deceptive", false, "A firm, midline fundus has already answered the tone question. Massage and uterotonics contract a uterus; neither sutures a tear. Treating this as atony delays the repair while the trickle adds up."],
  ["A hematoma forming in the tissues — apply a cold pack to the perineum and reassess her in an hour", false, "A hematoma hides: its lochia looks normal and its calling card is severe pain and pressure. Blood visibly trickling out is not collecting in the tissues."],
  ["Normal lochia for an instrument birth — change the pad, chart the amount, and reassess at the next round", false, "A continuous trickle is never charted away: the chapter warns a slow trickle can quietly add up to as much loss as dramatic atony bleeding."]
], "ANSWER KEY — Correct answer: laceration — notify the provider for repair and keep her NPO. DETAILED RATIONALE — Firm fundus plus bright-red trickle is the chapter's cleanest discriminator. The nurse's jobs are notification, NPO readiness, and continued quantification while the provider finds and sutures the tear. PRIORITY FRAMEWORK — Assessment to cause: the fundus feel splits tone from trauma.");

S("Lacerations and Hematomas — Concealed Bleeding", "A woman 4 hours after a vaginal birth rates her perineal pain 9 out of 10. Two doses of her prescribed analgesic have not touched it. Her lochia is moderate rubra and looks normal, and her fundus is firm. She says she feels pressure 'down there' and cannot urinate. What should the nurse suspect and do?", [
  ["A hematoma collecting in the tissues — report it promptly, apply a cold pack, and keep her NPO until the provider examines her", true, "The triad is the chapter's loudest clue: severe, poorly relieved pain, perineal or rectal pressure, and inability to void — with normal-looking lochia because the blood is collecting inside the tissues instead of draining out."],
  ["Normal afterpains and perineal soreness — reassure her and offer the next analgesic dose an hour early", false, "Normal post-birth discomfort is mild and eased by mild analgesics. Pain that analgesics do not touch is a finding, not a comfort problem."],
  ["A urinary tract infection — push fluids and obtain a urine specimen before reporting anything", false, "She cannot void because pressure from the collection blocks her — the pain pattern and the pressure name the hematoma first, and it is reportable now, not after a specimen."],
  ["Uterine atony with concealed pooling — massage the fundus firmly and express the pooled blood", false, "Her fundus is firm and her lochia is normal in amount. The concealed blood here is in the tissues of the vulva or vagina, not pooled in the uterus."]
], "ANSWER KEY — Correct answer: hematoma — report it, cold pack a small perineal one, NPO until examined. DETAILED RATIONALE — Pain out of proportion is the loudest clue in this chapter: severe unrelenting pain plus normal lochia means the blood is hiding in the tissues. Visible hematomas bulge blue-purple; deep vaginal ones cannot be seen from outside, which is why the symptom triad carries the diagnosis. PRIORITY FRAMEWORK — Safety: treat unexplained severe pain as a finding until a source is named.");

S("Lacerations and Hematomas — Concealed Bleeding", "A woman with a large vaginal hematoma has normal-looking lochia, but her pulse has risen from 88 to 118, her respirations from 16 to 24, and her blood pressure has fallen from 118/76 to 100/64. Which interpretation is correct?", [
  ["She is losing significant volume into the tissues — concealed bleeding produces the same shock progression as visible bleeding", true, "A large hematoma can hold a major volume. Her trend is the hypovolemia sequence — rates up first, pressure giving way — and the chapter is explicit that with a large hematoma, shock signs follow the concealed loss."],
  ["Her vital signs are explained by her severe pain alone, and they will settle once the pain is treated", false, "Pain can raise a pulse, but it does not explain a falling blood pressure in a woman with a known expanding collection. The volume reading must be excluded by action, not assumed away."],
  ["She cannot be in shock, because shock requires visible blood loss and her pads show only normal lochia", false, "That is the concealment trap in one sentence. Normal lochia does not rule out hemorrhage — the blood is in the tissues, not on the pad."],
  ["The falling blood pressure is the first sign of her volume loss, so the loss must have just started", false, "The order is backwards: her pulse climbed from 88 to 118 first. The BP falls LATE in hypovolemia — its fall means the loss is advanced, not new."]
], "ANSWER KEY — Correct answer: concealed volume loss with a shock trend. DETAILED RATIONALE — Hematoma surveillance is vital-sign surveillance: firm fundus, normal lochia, and hypovolemia signs anyway means suspect a large hematoma. The trend — pulse and respirations rising, pressure falling — is the same language as any hemorrhage. PRIORITY FRAMEWORK — ABCs / circulation: trend the vitals; the pad is not the patient.");

S("Lacerations and Hematomas — Concealed Bleeding", "The provider confirms a large vulvar hematoma that is still expanding. Which plan should the nurse anticipate?", [
  ["Incision and drainage of the collected clots, with the bleeding vessel ligated or the area packed, while she stays NPO", true, "Size decides hematoma management: larger ones are opened, the clots drained, and the bleeding vessel ligated or the area packed with hemostatic material. NPO and quantification run alongside, as in any hemorrhage."],
  ["A cold pack alone, because hematomas of every size resolve on their own without a procedure", false, "SMALL hematomas usually resolve on their own. An expanding large one is a bleeding vessel with a growing collection — it gets a procedure."],
  ["Firm fundal massage and a uterotonic, because bleeding after birth must be coming from the uterus", false, "Her uterus is not the source — the blood is collecting from injured tissue vessels. Contracting the uterus does nothing for a vulvar collection."],
  ["Warm compresses applied hourly to speed reabsorption of the collected blood", false, "Heat is the mastitis tool. For a hematoma, cold limits bleeding; warmth would feed the collection."]
], "ANSWER KEY — Correct answer: incision and drainage with ligation or packing, NPO, quantified loss. DETAILED RATIONALE — The hematoma ladder mirrors the atony ladder: conservative care (ice, observation) for the small and stable, procedural source control for the large or expanding. The nurse prepares the patient and tracks the volume story either way. PRIORITY FRAMEWORK — Least invasive first, escalated by size and trend: match the rung to the collection.");

M("Lacerations and Hematomas — Concealed Bleeding", "Which findings, taken together, point to a postpartum hematoma rather than ordinary perineal discomfort? Select all that apply.", [
  ["Severe perineal pain that prescribed analgesics do not relieve", true, "The lead discriminator: hematoma pain is severe and unrelenting, while normal discomfort is mild and eased by mild analgesics."],
  ["A report of pressure in the vulva, pelvis, or rectum", true, "A growing collection presses on everything near it — pressure is the mass announcing itself."],
  ["Inability to void despite the sensation of a full bladder", true, "Pressure from the collection can block urination; the triad of severe pain, pressure, and inability to void is the chapter's report set."],
  ["A bulging blue-purple mass visible on the vulva", true, "The visible form of the same problem: blood collecting under the skin shows as a bulging blue-purple mass."],
  ["Lochia that is heavier than expected and carries large clots", false, "That is the atony pattern — visible loss from an unclamped uterus. A hematoma's lochia looks normal because the blood never reaches the pad."],
  ["Mild perineal soreness that eases after a dose of analgesic", false, "That is ordinary post-birth discomfort — the comparison picture the hematoma must be separated from."]
], "ANSWER KEY — Correct answers: unrelieved severe pain, vulvar/pelvic/rectal pressure, inability to void, and a visible blue-purple bulge. DETAILED RATIONALE — The hematoma signature is a pain-and-pressure story with a quiet pad. Deep vaginal hematomas cannot be seen at all, so the symptom cluster — not inspection — carries the early diagnosis. PRIORITY FRAMEWORK — Recognize cues: pain out of proportion is data, not drama.");

BANK.push({ cat: "Lacerations and Hematomas — Concealed Bleeding", type: "matrix", stem: "Four postpartum women are bleeding or in pain. Match each woman to the source that fits her picture.", cols: ["Uterine atony","Laceration","Hematoma","Retained fragments"], rows: [
  { t: "Soft, high fundus; heavy lochia with large clots; bladder distention pushing the uterus to one side", a: 0, r: "Atony — the muscle is not clamping and the bladder is helping it fail: massage, empty the bladder, uterotonics." },
  { t: "Firm fundus; continuous bright-red trickle; the birth was rapid and instruments were used", a: 1, r: "Laceration — engorged torn vessels bleed steadily while the uterus stays contracted: provider repair." },
  { t: "Firm fundus; normal lochia; severe pain the analgesic does not touch; rectal pressure", a: 2, r: "Hematoma — the loss is concealed in the tissues; pain and pressure are the visible part." },
  { t: "Day 10; red bleeding returns after fading; pelvic heaviness; fundus higher than expected for the day", a: 3, r: "Retained fragments — tissue left behind sloughs and bleeds in the late window: uterotonics, ultrasound, curettage." }
], tp: "ANSWER KEY — Correct matches: soft/high/clots = atony; firm + trickle = laceration; firm + normal lochia + severe pain = hematoma; day-10 red return = retained fragments. DETAILED RATIONALE — One rule sorts the whole bleeding chapter: find which source is bleeding and fix THAT source. Fundus feel, flow pattern, pain, and timing are the four sorting questions. PRIORITY FRAMEWORK — Assessment to cause: the picture names the source, and the source names the fix." });

BANK.push({ cat: "Lacerations and Hematomas — Concealed Bleeding", type: "dropdown", stem: "Complete the care plan for three postpartum patients.<br>Patient 1 — A woman with a small perineal hematoma and severe localized pain receives:<br>[[0]]<br>Patient 2 — A woman whose fundus is firm while a continuous bright-red trickle continues receives:<br>[[1]]<br>Patient 3 — A woman with a large, expanding hematoma whose pulse is climbing receives:<br>[[2]]", blanks: [
  { o: [O("A cold pack applied to the area, which limits bleeding and numbs the pain", true, "For a small perineal hematoma an ice pack suffices — and it needs no provider order. Cold limits the bleeding while it numbs."), O("A warm pack applied to the area, which speeds reabsorption of the blood", false, "Warmth belongs to mastitis care. On a fresh hematoma, heat feeds bleeding instead of limiting it."), O("Fundal massage until the uterus firms, which stops the tissue bleeding", false, "The uterus is not the source of a perineal collection. Massage treats tone; this blood is in the tissues.")] },
  { o: [O("Provider notification for examination and suture repair, with NPO status kept", true, "Bleeding with a firmly contracted uterus means notify the provider — repair is suturing, usually in the delivery or operating room, so she stays NPO."), O("A uterotonic infusion, because a steady trickle means the uterus is relaxing", false, "Her fundus is firm — the uterus has done its job. A trickle with a firm fundus is a tear until proven otherwise."), O("Reassurance and a pad change, because a trickle is too slow to matter", false, "The chapter's warning: a slow trickle can quietly add up to as much loss as dramatic atony bleeding.")] },
  { o: [O("Preparation for incision and drainage, with vital signs and blood loss tracked closely", true, "Large or expanding hematomas are drained, the vessel ligated or the area packed — and a climbing pulse says the concealed loss is already costing volume."), O("Observation only, because large hematomas seal themselves once pressure builds", false, "SMALL hematomas resolve on their own. An expanding one with a climbing pulse is escalating, not sealing."), O("An ice pack alone, because procedures are reserved for uterine bleeding", false, "Procedures follow the source, not the organ. Tissue bleeding that expands gets drained like any other uncontrolled source.")] }
], tp: "ANSWER KEY — Correct answers: small perineal hematoma = cold pack; firm fundus + trickle = provider repair with NPO; large expanding hematoma = incision and drainage with close tracking. DETAILED RATIONALE — Three bleeding pictures, three different fixes — the chapter's one rule applied three ways: find the source, match the tool. Size and trend decide how far up each ladder the nurse prepares to climb. PRIORITY FRAMEWORK — Assessment to cause: same symptom family, different source, different fix." });

/* ================= NGN CASE 2 — late PPH with endometritis ================= */
var CASE_CT2 = "CASE STUDY — The Bleeding That Came Back. Mrs. R. T., 31 years old, G3 P2, had an uncomplicated vaginal birth 9 days ago and was discharged on day 2 with lochia that had faded to pale pink. She now presents to the clinic: since yesterday her bleeding has turned bright red again, she passed two large clots this morning, and she feels pelvic heaviness, deep fatigue, and cramping worse than her afterpains were. Her fundus is higher than expected for day 9, her lochia is rubra and foul-smelling, temperature 38.4 °C, pulse 108, blood pressure 118/74. An ultrasound has been ordered.";

S("Postpartum Hemorrhage — Shock and First Response", "CASE STUDY — The Bleeding That Came Back. Which finding cluster is the abnormal pattern that must be acted on today?", [
  ["Bright-red bleeding returning after the lochia had faded, with large clots, pelvic heaviness, worsening cramps, and deep fatigue", true, "That is the late-hemorrhage signature the discharge teaching warns about: red returning after fading, clots, heaviness, and fatigue — the pattern of tissue left behind and a uterus failing to involute."],
  ["The temperature of 38.4 °C by itself, because a single fever reading defines the whole problem", false, "The fever matters — it adds the infection family to her picture — but a lone reading does not define the emergency. The bleeding pattern is what cannot wait."],
  ["Cramping on day 9, because afterpains should be finished and any cramp at this point is abnormal", false, "Cramping alone is not the cluster. Prolonged, severe cramping joins the pattern only alongside the bleeding, the fundus, and the fever."],
  ["None of it — lochia color varies normally across the full 6 weeks, so day-9 changes are expected", false, "Color progressing forward is normal; color going BACKWARD — red after fading — is the chapter's named late alarm. Dismissing it wastes the early window."]
], "ANSWER KEY — Correct answer: the returning bright-red bleeding cluster. DETAILED RATIONALE — NGN step 1 (recognize cues): late hemorrhage declares itself at home, which is why discharge teaching is the safety net. The cues sort by pattern — the reversal of lochia progression is the cue that organizes all the others. PRIORITY FRAMEWORK — Clinical Judgment (recognize cues): pattern first, panic never.", { scen: CASE_CT2, grp: "CT-CASE2" });

M("Uterine Atony, Bladder, and Subinvolution", "CASE STUDY — The Bleeding That Came Back. Which problems belong on the working list for Mrs. R. T.? Select all that apply.", [
  ["Retained placental fragments keeping the uterus from sealing its vessels", true, "Fragments are a top late-PPH driver — clots form around them and slough off days later, and a fragment keeps the placental site from closing. The ordered ultrasound is hunting exactly this."],
  ["Subinvolution — her fundus is higher than expected for day 9 and her lochia has not progressed", true, "Both halves of the subinvolution picture are present: fundal height stalled above the day's expectation and lochia that went backward instead of progressing."],
  ["Endometritis — fever with foul-smelling lochia and worsening cramping in a uterus that is not shrinking", true, "The most common postpartum fever source is infection of the uterine lining, and it often travels with subinvolution — the infected uterus does not shrink on schedule. Her fever, foul lochia, and severe prolonged cramping fit."],
  ["Uterine atony of the first hours — her uterus has failed its first contraction after birth", false, "Atony is the first-hours failure to clamp. At day 9 the clock has re-sorted the causes: tissue and involution failure lead, tone of the first hours is history."],
  ["A vaginal laceration from the birth that has been bleeding steadily ever since delivery", false, "Her bleeding FADED and then returned — a tear bleeds continuously from the start. The stop-and-return pattern belongs to fragments sloughing, not to an unrepaired tear."]
], "ANSWER KEY — Correct answers: retained fragments, subinvolution, and endometritis. DETAILED RATIONALE — NGN step 2 (analyze cues): the late window re-sorts the differential — Tissue rises to the top, involution failure explains the fundus, and the fever/foul-lochia pair adds the infection family to the same uterus. Three problems, one organ, linked causes. PRIORITY FRAMEWORK — Clinical Judgment (analyze cues): timing re-ranks the differential.", { scen: CASE_CT2, grp: "CT-CASE2" });

S("Postpartum Hemorrhage — Shock and First Response", "CASE STUDY — The Bleeding That Came Back. Two problems are active at once — bleeding and infection. Which does the nurse prioritize, and why?", [
  ["The bleeding and volume threat — her pulse of 108 is the early sign of falling volume, and hemorrhage kills faster than infection", true, "Prioritization ranks by what kills fastest. Her blood pressure still reads 118/74, but the pulse has already announced the volume problem — and in hemorrhage, the pulse is the early warning the nurse acts on."],
  ["The infection — the fever proves a diagnosis, while the bleeding is still only a possibility", false, "The bleeding is not a possibility; it is observed — red flow, two large clots, a saturating pattern. Fever confirms a second problem, not the first priority."],
  ["Neither yet — repeat her vital signs in 4 hours to see which of the two problems declares itself", false, "Both problems have already declared themselves. A 4-hour watch spends the window in which uterotonics, cultures, and antibiotics work best."],
  ["Her fatigue and comfort first — rest and analgesics will clarify how serious the rest of the picture is", false, "Comfort matters and is part of her care, but physiologic threats outrank it. Rest does not clarify a hemorrhage; measurement and treatment do."]
], "ANSWER KEY — Correct answer: prioritize the hemorrhage/volume threat first. DETAILED RATIONALE — NGN step 3 (prioritize hypotheses): two emergencies share one patient — rank by speed of harm. Tachycardia is the early volume sign; infection care (culture, antibiotics) proceeds in the same plan but does not outrank stopping the loss. PRIORITY FRAMEWORK — Clinical Judgment (prioritize) + ABCs: circulation before comfort, bleeding before fever workup.", { scen: CASE_CT2, grp: "CT-CASE2" });

M("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "CASE STUDY — The Bleeding That Came Back. The provider suspects infection plus retained fragments. Which orders and preparations should the nurse anticipate? Select all that apply.", [
  ["A culture of the uterine cavity obtained before antibiotics are started", true, "Culture and sensitivity from the suspected site comes first — the sample picks the antibiotic that will actually work, and antibiotics started first can sterilize the specimen."],
  ["IV antibiotics as the first route for a uterine infection", true, "Endometritis is treated IV first. Route follows the site: oral is the mastitis pattern, not the uterine one."],
  ["A uterotonic, with her blood pressure checked before any ergot drug is given", true, "A firm contraction often expels retained fragments and ends the problem — and methylergonovine's catch (it raises blood pressure) makes the BP check a gate, not a courtesy."],
  ["Preparation for curettage, including NPO status, in case the fragments must be stripped", true, "If bleeding continues after uterotonics, curettage clears clots and fragments. NPO readiness keeps the procedure from waiting on her stomach."],
  ["Oral antibiotics started at home, because uterine infections are treated the same way as breast infections", false, "Route is site-specific: mastitis is usually oral; endometritis is IV first. Borrowing the breast's plan underdoses the uterus."],
  ["The culture drawn after the first antibiotic dose, so treatment is not delayed by the specimen", false, "The sequence protects the information: culture first, then the drug. A post-dose culture can come back empty and leave the team guessing."]
], "ANSWER KEY — Correct answers: uterine-cavity culture before antibiotics, IV antibiotics first, a uterotonic with the BP gate, and curettage preparation with NPO. DETAILED RATIONALE — NGN step 4 (generate solutions): every hypothesis earns a matched intervention — measure and culture the infection, contract the uterus, prepare to remove the tissue — with the hemorrhage bundle running underneath all of it. PRIORITY FRAMEWORK — Clinical Judgment (generate solutions): one tool per driver, sequence protected.", { scen: CASE_CT2, grp: "CT-CASE2" });

BANK.push({ cat: "Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", type: "order", stem: "CASE STUDY — The Bleeding That Came Back. The provider's plan is confirmed: infection plus retained fragments. Place the nurse's actions in the correct order.", items: [
  { t: "Weigh her pads, take a full set of vital signs, and assess fundus and lochia to baseline the bleeding", r: "FIRST: baseline the bleeding and the fundus before treatment — the numbers every later evaluation compares against." },
  { t: "Obtain the uterine-cavity culture from the suspected site", r: "Culture BEFORE antibiotics — the culture picks the drug; a dose given first can sterilize the specimen." },
  { t: "Start the ordered IV antibiotics and the uterotonic after checking her blood pressure", r: "Treatment follows the culture, and the blood pressure check is the ergot gate if that is the uterotonic ordered." },
  { t: "Prepare her for curettage to remove the retained fragments", r: "Source removal comes once antibiotics are running and she is anesthesia-ready, NPO included." },
  { t: "Reassess bleeding, fundus, temperature, and pulse against the baseline values", r: "Evaluation closes the loop: is the loss slowing, the fundus descending, the fever breaking, the pulse settling?" }
], tp: "ANSWER KEY — Correct order: baseline assessment → culture → IV antibiotics and uterotonic (BP checked) → prepare for curettage → reassess against baseline. DETAILED RATIONALE — NGN step 5 (take action): the sequence protects information (culture before drug), safety (BP before an ergot), and anesthesia readiness (NPO before curettage). PRIORITY FRAMEWORK — Clinical Judgment (take action): order is a clinical decision, not paperwork.", scen: CASE_CT2, grp: "CT-CASE2" });

S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "CASE STUDY — The Bleeding That Came Back. At discharge after treatment, which statement by Mrs. R. T. shows she understands the teaching that protects her at home?", [
  ["'I will call if the bleeding turns red again after it fades, and I will finish all of the antibiotic even after I feel better'", true, "Both halves of the safety net in one sentence: the late-hemorrhage warning sign she was taught to report, and the full antibiotic course — the chapter's must-teach, because stopping when symptoms fade is the infection family's classic failure."],
  ["'I can stop the antibiotic once the fever has been gone for a day, since the curettage removed the cause'", false, "The curettage removed fragments; the antibiotic treats the infection. Feeling better is not the finish line — the full course is."],
  ["'Red bleeding is only a problem if it soaks a pad in less than an hour, so that is the one thing I will watch for'", false, "Pad speed matters, but red RETURNING after fading is itself a report item — it was the sign that brought her in. Narrowing the watch to one threshold re-opens the gap."],
  ["'The fragments are out now, so I do not need follow-up unless I feel faint'", false, "Follow-up verifies the uterus finished involuting and the infection cleared. Faintness is a late sign — the teaching aims far earlier than that."]
], "ANSWER KEY — Correct answer: report red returning after fading, and finish the full antibiotic course. DETAILED RATIONALE — NGN step 6 (evaluate outcomes): understanding is proven by the safety behaviors she can state, not by her symptom story. Late complications declare themselves at home — her teaching is the monitoring system she takes with her. PRIORITY FRAMEWORK — Clinical Judgment (evaluate outcomes): teach-back on the warnings, not just the tasks.", { scen: CASE_CT2, grp: "CT-CASE2" });

/* ================= Category D standalone — infections ================= */
S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "On postpartum day 3, a woman has a temperature of 38.6 °C, a tender and enlarged uterus, foul-smelling lochia, and cramping that is severe and prolonged. Her WBC is 24,000/mm³. Which conclusion and plan are correct?", [
  ["Endometritis — obtain a uterine-cavity culture, begin IV antibiotics, and position her in Fowler's so the infected lochia drains", true, "The uterine picture is complete: tender enlarged uterus, foul lochia, prolonged severe cramping, fever. Management follows the site — culture the uterine cavity, IV antibiotics first, Fowler's position to drain infected lochia, and watch for spread."],
  ["A urinary tract infection — obtain a clean-catch urine culture and push fluids to 3 L/day as the main treatment", false, "The urinary picture is burning, urgency, and frequency. Her findings live in the uterus — the culture, the route, and the drainage all follow the site, and this site is uterine."],
  ["No infection — the WBC of 24,000 is the only hard value, and a day-3 fever is usually dehydration", false, "Two errors stack here: WBCs normally run 20,000–30,000/mm³ in the early postpartum period, so 24,000 neither proves nor excludes infection — and the dehydration story belongs to the first 24 hours, not day 3 with uterine signs."],
  ["Mastitis — examine the breasts and start oral antibiotics, because breast infection is the most common postpartum fever", false, "The most common postpartum fever source is endometritis, not mastitis — and her signs are uterine, with no breast findings at all."]
], "ANSWER KEY — Correct answer: endometritis — uterine culture, IV antibiotics first, Fowler's position. DETAILED RATIONALE — Endometritis often travels with subinvolution and declares itself after discharge, so the site sort matters: the site names the culture, the route, and the drainage. The WBC is this family's favorite trap — a normal-range count cannot clear a clinical picture. PRIORITY FRAMEWORK — Assessment to site: findings name the organ; the organ names the plan.");

S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "A woman's temperature is 38.2 °C on the evening of postpartum day 3 and 38.3 °C on day 4, with no localizing signs yet. Which statement is correct?", [
  ["She meets the puerperal fever definition — 38 °C or higher after the first 24 hours on at least 2 days in the first 10 days — so a full infection assessment is required", true, "The definition is met exactly: after the first 24 hours, two days at or above 38 °C (100.4 °F), inside the first 10 days. Meeting it triggers the hunt for the site — uterus, wound, urinary tract, breast — even before localizing signs appear."],
  ["She does not meet any fever definition until a single reading reaches 39 °C, no matter how many days it stays elevated", false, "The chapter's threshold is 38 °C with a pattern, not 39 °C once. Waiting for a higher spike waits out the definition she already meets."],
  ["This is the expected dehydration fever, because fevers throughout the first 10 days are attributed to fluid shifts", false, "A slight elevation in the FIRST 24 hours is often dehydration. Days 3 and 4 are outside that story — and any fever still earns a check for other infection signs whenever it occurs."],
  ["Fever cannot be assessed until the WBC result returns, because the white count is the deciding test in the postpartum period", false, "The white count cannot decide this: 20,000–30,000/mm³ is normal early postpartum. The fever definition is clinical — temperature, timing, and pattern."]
], "ANSWER KEY — Correct answer: she meets the puerperal fever definition and needs a full infection assessment. DETAILED RATIONALE — Puerperal sepsis is one of the leading causes of maternal death worldwide, and its doorway is a defined fever that gets assessed rather than watched. Hand hygiene remains the #1 defense against spreading the infection once found. PRIORITY FRAMEWORK — Evidence Based Practice: apply the definition as written; do not raise the bar at the bedside.");

S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "A cesarean mother on day 4 has an incision with redness and edema, a separating suture line, purulent drainage, and a hardened area beside the incision. Which actions are correct?", [
  ["Culture the wound drainage, begin antibiotics as ordered, and use sterile technique for wound care — and report the hardening beside the incision", true, "Wound infection care follows the family rule: culture the drainage so the drug matches the organism, antibiotics, sterile technique — and the chapter specifically flags hardening of the operative area as a finding to report."],
  ["Seat her in a sitz bath with the incision soaking, because warm water is the wound treatment this chapter teaches", false, "Sitz baths are the PERINEAL wound measure. A cesarean incision with separation, pus, and hardening needs culture, antibiotics, and sterile technique — not a soak."],
  ["Press the incision edges together to express the drainage, then cover it with a dry dressing", false, "Expressing drainage by hand contaminates and traumatizes the wound. Drainage is cultured and the wound is managed with sterile technique."],
  ["Teach her that separation and drainage are expected as an incision heals and need no culture or report", false, "A separating suture line with purulent drainage is the wound-infection picture, not healing. Teaching her to ignore it sends an infection home unmonitored."]
], "ANSWER KEY — Correct answer: culture the drainage, antibiotics, sterile technique, report the hardening. DETAILED RATIONALE — Wounds are assessed with REEDA — redness, edema, ecchymosis, discharge, approximation — and her incision fails on nearly every letter. Local infections can ascend and spread; containing the local infection before it reaches the blood is the family's standing goal. PRIORITY FRAMEWORK — Assessment to site: culture first, then the drug, with technique that adds no new organisms.");

S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "A postpartum woman reports burning and frequency when she voids. Her temperature is 39.4 °C with chills, and she has flank pain and nausea. How does her picture change the plan compared with simple cystitis?", [
  ["This is pyelonephritis, not simple cystitis — the high spiking fever, chills, flank pain, and nausea move treatment to IV antibiotics first", true, "Same family, different depth. Cystitis stays low-grade with bladder symptoms; flank (costovertebral) pain with a high spiking fever, chills, and nausea/vomiting names the kidney — and the kidney infection gets IV antibiotics first."],
  ["It is still simple cystitis — fever height does not change the site, so oral antibiotics and fluids are enough", false, "Fever height plus flank pain is exactly what changes the site. Treating a kidney infection with the bladder's plan underdoses the organ at risk."],
  ["This is endometritis — flank pain after birth comes from the uterus, so a uterine culture replaces the urine culture", false, "Endometritis announces itself with a tender uterus and foul lochia. Her symptoms are urinary, and the flank pain localizes upward along the urinary tract, not to the uterus."],
  ["Push fluids to 3 L/day and recheck tomorrow, because urinary infections are never emergencies after birth", false, "Fluids to 3 L/day are part of urinary care, but an ascending infection with systemic signs is how puerperal sepsis starts. Tomorrow is too late to start."]
], "ANSWER KEY — Correct answer: pyelonephritis — urine culture, then IV antibiotics first. DETAILED RATIONALE — The urinary family's sort is by level: bladder (low-grade fever, burning, urgency, frequency) versus kidney (high spiking fever, chills, flank pain, nausea). Level names the route — oral support and fluids below, IV first above. PRIORITY FRAMEWORK — Assessment to site and severity: depth decides the drug route.");

M("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "A breastfeeding mother is being treated for mastitis. Which teaching points should the nurse include? Select all that apply.", [
  ["Keep breastfeeding — the milk is not contaminated, and weaning would cause engorgement and stasis that make the infection worse", true, "The chapter's loudest mastitis rule. The infection sits outside the milk ducts; stopping drainage feeds the problem. If she must pause, she pumps instead."],
  ["Apply moist heat or a warm shower before nursing, and massage the tender area while the baby feeds", true, "Heat increases blood flow, comforts, and empties the breast more completely; massage moves milk out of the tender area while the baby nurses."],
  ["Start the feed on the uninfected side to trigger let-down, then empty the infected breast fully", true, "Let-down started on the comfortable side gets milk moving in both breasts, so the sore side empties with less pain — and emptying fully fights the stasis that feeds mastitis."],
  ["Wash hands before feeds, change breast pads often, and air the nipples when possible", true, "Straight from the book's patient-teaching list: hygiene at the entry point, clean pads, and air for the cracked nipples organisms slip through."],
  ["Stop nursing on the infected side and discard that milk until the antibiotic course is finished", false, "The classic trap. The milk is not contaminated, and discarding plus not draining produces engorgement and stasis — the setup for an abscess."],
  ["Wear the tightest supportive bra available to compress the infected area flat", false, "The bra should be supportive but NOT tight — a too-tight bra causes milk stasis. Compression is the opposite of drainage."]
], "ANSWER KEY — Correct answers: keep breastfeeding, moist heat and massage, start on the uninfected side and empty fully, and hand hygiene with pad changes and aired nipples. DETAILED RATIONALE — Mastitis care is drainage care: antibiotics (usually oral; IV first if an abscess forms) plus milk that keeps moving. Healing also needs fuel — protein, vitamin C, and iron — and the infection typically appears at 2–3 weeks, when mothers least expect a new problem. PRIORITY FRAMEWORK — Patient teaching: the home behaviors are half the prescription.");

BANK.push({ cat: "Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", type: "matrix", stem: "Four postpartum women have infections at different sites. Match each woman to her infection site.", cols: ["Endometritis","Wound infection","Urinary tract infection","Mastitis"], rows: [
  { t: "Tender, enlarged uterus with foul-smelling lochia, fever, and prolonged severe cramping on day 3", a: 0, r: "Endometritis — the most common postpartum fever source: uterine-cavity culture, IV antibiotics first, Fowler's to drain." },
  { t: "Cesarean incision with a separating suture line, purulent drainage, and hardening of the operative area", a: 1, r: "Wound infection — culture the drainage, antibiotics, sterile technique; sitz baths are the perineal-wound counterpart." },
  { t: "Burning, urgency, and frequency with a low-grade fever on day 4", a: 2, r: "Urinary tract infection (cystitis) — urine culture, antibiotics, fluids pushed to 3 L/day, urine-acidifying foods." },
  { t: "One hot, red, tender area on one breast with fever and chills in the third week after birth", a: 3, r: "Mastitis — antibiotics (usually oral; IV first if an abscess forms) and continued removal of milk; never wean." }
], tp: "ANSWER KEY — Correct matches: uterine signs = endometritis; separating purulent incision = wound infection; burning/frequency = UTI; one hot breast area at week 3 = mastitis. DETAILED RATIONALE — One family rule at every site: culture first (the culture picks the drug), antibiotics by the site's route, and keep drainage moving — lochia, urine, or milk. The site sort is the whole skill. PRIORITY FRAMEWORK — Assessment to site: the site names the culture, the route, and the drainage." });

/* ================= Category E — thromboembolism ================= */
S("Thromboembolism — SVT, DVT, and Pulmonary Embolism", "On day 3 after a cesarean birth, a woman who has mostly stayed in bed reports left leg pain. The left calf measures 3 cm larger than the right, with redness, tenderness, and edema. Dorsiflexing her foot produces no calf pain. Which conclusion is correct?", [
  ["Suspect deep venous thrombosis and report it promptly — the circumference difference with redness, tenderness, and edema is the reportable picture", true, "The chapter's measurement rule: a leg up more than 2 cm in circumference with redness, tenderness, and edema gets reported promptly. Her risk stack — cesarean vessel injury, bed rest, and pregnancy's hypercoagulable state — sits underneath the findings."],
  ["Rule out a clot — a negative Homans' sign means the calf pain is muscular from the birth position and needs only rest", false, "Homans' sign is NOT reliable postpartum and is not specific to clots in this period. A negative Homans' never rules out a DVT — that is the trap this question is built on."],
  ["Suspect superficial venous thrombosis, because calf tenderness with redness is a surface-vein problem", false, "SVT is a visible, hard, reddened saphenous vein you can easily see. A measured 3 cm difference with edema is the deep picture — and depth is what carries embolism risk."],
  ["Reassure her and recheck the leg tomorrow, because leg swelling is expected after a cesarean birth", false, "Unilateral swelling with a 3 cm difference is not 'expected swelling.' DVT is confirmed by ultrasound — which only happens if the findings are reported today."]
], "ANSWER KEY — Correct answer: suspect DVT and report promptly; the negative Homans' sign clears nothing. DETAILED RATIONALE — Pregnancy stacks all three clot ingredients: venous stasis from the heavy uterus, vessel injury (here, cesarean), and clotting factors that stay elevated for weeks. Trust circumference, symptoms, and ultrasound — never the dorsiflexion test. PRIORITY FRAMEWORK — Evidence Based Practice: use the measurement that discriminates, not the sign that decorates.");

S("Thromboembolism — SVT, DVT, and Pulmonary Embolism", "A woman has a painful, hard, reddened, warm saphenous vein visible on her lower leg. Her calf measurements are equal and she has no edema. Which treatment plan fits her problem?", [
  ["Analgesics, local heat, and leg elevation to encourage venous drainage — no anticoagulant is used for a superficial thrombosis", true, "That is the book's SVT prescription exactly: pain relief, heat, and elevation. Anticoagulation is the layer added when the clot is DEEP."],
  ["Subcutaneous heparin started today, because every postpartum clot is anticoagulated until it resolves", false, "'Every clot' flattens the chapter's central distinction. Depth decides the drug: SVT gets the comfort-and-drainage measures; DVT gets those PLUS heparin."],
  ["Strict bed rest with the leg kept flat and still until the vein softens and the pain resolves", false, "Flat and still works against venous drainage. Elevation encourages return flow, and immobility is itself a clot risk in this population."],
  ["Warfarin started today, with vitamin K kept available at the bedside in case she bleeds", false, "Warfarin is an oral anticoagulant from the deeper-disease shelf, and vitamin K is its ANTIDOTE — neither belongs in the SVT plan."]
], "ANSWER KEY — Correct answer: analgesics, local heat, and elevation — no anticoagulant for SVT. DETAILED RATIONALE — The thromboembolism family is sorted by anatomy: the saphenous surface vein (visible, hard, warm) versus the deep system (measured swelling, embolism potential). The sort is not academic — it decides whether an anticoagulant enters her body. PRIORITY FRAMEWORK — Assessment accuracy: depth decides the drug.");

S("Thromboembolism — SVT, DVT, and Pulmonary Embolism", "A woman on postpartum day 2 after a cesarean birth suddenly calls out with sharp chest pain, a cough, and difficulty breathing. Her pulse is 124, respirations 30, oxygen saturation 90%, and she seems less alert than an hour ago. What is the nurse's priority?", [
  ["Report the findings and activate emergency help at once while sitting her up and applying oxygen — this is the pulmonary embolism picture", true, "The chapter's standing rule: dyspnea, cough, or chest pain in a postpartum patient means possible PE — report immediately. A big PE adds falling consciousness and heart-failure signs; she is already less alert."],
  ["Complete a full head-to-toe assessment and repeat her vital signs in 15 minutes before deciding whether to report", false, "A solo workup spends the minutes the response team needs. Escalation is the first action; assessment continues alongside the response, not before it."],

M("Thromboembolism — SVT, DVT, and Pulmonary Embolism", "A charge nurse is writing the postpartum unit's clot-prevention checklist for mothers recovering after birth. Which measures belong on the checklist? Select all that apply.", [
  ["Early ambulation and range-of-motion exercises, continued through the weeks that clotting factors stay elevated", true, "The frontline defense: keep the blood moving. Pregnancy's hypercoagulable state lasts for weeks after birth, so flow-promoting measures continue during AND after the hospital stay."],
  ["Teaching her not to cross her legs, because crossing impedes venous return", true, "A small habit with a mechanical reason — crossed legs compress the veins the blood must return through."],
  ["Antiembolic stockings fitted correctly for a mother with varicose veins — never rolled or kinked", true, "Stockings help only when applied correctly; a rolled or kinked stocking makes flow worse than no stocking."],
  ["Pneumatic compression devices or prophylactic heparin for a cesarean mother or one on prolonged bed rest", true, "The chapter's escalation for the highest-risk legs: mechanical compression or prophylactic anticoagulation when surgery or bed rest stacks the risk."],
  ["Elevating her legs on pillows stacked to bend the leg sharply at the groin for better drainage", false, "Elevation has a geometry rule: no sharp bend at the groin and no pressure behind the knee. A sharply bent leg obstructs the return it was meant to help."],
  ["Keeping her in bed until discharge so her legs rest and a clot cannot break loose", false, "Bed rest is a risk STACKER, not a protection — stasis is one of the three clot ingredients. The prescription is movement, not rest."]
], "ANSWER KEY — Correct answers: early ambulation and ROM, no leg crossing, correctly fitted stockings, and compression devices or prophylactic heparin for cesarean/prolonged bed rest. DETAILED RATIONALE — Prevention is flow: movement, positioning that never kinks the return path, fitted stockings, and mechanical or drug prophylaxis for the surgical and bed-rest mothers. Even the stirrups used in birth and repair are padded so they do not press the popliteal angle. PRIORITY FRAMEWORK — Prevention: the cheapest clot is the one that never forms.");

S("Thromboembolism — SVT, DVT, and Pulmonary Embolism", "A woman is being discharged on anticoagulant therapy, with home nursing visits arranged for blood draws and support. Which statement shows she understands the safety teaching?", [
  ["'I will use a soft toothbrush, watch for bleeding gums and unexplained bruises, and report prolonged bleeding from minor injuries'", true, "That is the over-anticoagulation warning set from the book's home teaching, plus the soft toothbrush and trauma avoidance that go with it. She has converted the drug's risk into daily behaviors."],

BANK.push({ cat: "Clotting Problems and Hemorrhage Medications", type: "dropdown", stem: "Complete the uterotonic plan for three postpartum patients.<br>Patient 1 — A woman with an atonic uterus right after birth receives the first-line uterotonic:<br>[[0]]<br>Patient 2 — Her uterus still will not stay firm and her blood pressure is 172/108; the nurse must:<br>[[1]]<br>Patient 3 — A woman with subinvolution and a normal blood pressure needs the uterotonic that holds a sustained contraction:<br>[[2]]", blanks: [

S("Clotting Problems and Hemorrhage Medications", "A woman had a vaginal birth at 08:10 and is bleeding from atony that is answering uterotonics slowly. At 10:45 the provider orders tranexamic acid. Which action is correct?", [
  ["Give it now — tranexamic acid protects the clots that form from breaking down, and it must be given within 3 hours of the birth to keep its benefit", true, "TXA's timing is the test point: it blocks the breakdown of clots so bleeding sites can seal, and the window runs from the DELIVERY — 08:10 to 10:45 is inside it. It is given alongside the cause-specific interventions, not instead of them."],

S("Clotting Problems and Hemorrhage Medications", "A woman being treated for postpartum hemorrhage now has pinpoint spots on her skin, oozing from her IV puncture sites, and urine output that has nearly stopped. What do these new findings tell the nurse?", [

  { t: "Day 3: tearful, sad, anxious, appetite off, moods swinging — but she is caring for herself and the baby and knows everything around her is real", a: 0, r: "Blues — at least 50% of mothers, starting day 2–3, reality INTACT, self-resolving within about 2 weeks. Care: reassurance, rest, nutrition, and avoiding alcohol, which amplifies mood swings." },
  { t: "Week 3: long crying spells, sleeping almost all day, lost interest in everything, panic attacks, trouble deciding anything, struggling to care for the baby — reality still intact", a: 1, r: "Depression — onset usually 2–4 weeks and NOT self-limiting. Treatment pairs antidepressants with psychotherapy; the danger is dismissal." },

S("Postpartum Mood Disorders — Blues, Depression, Psychosis", "On day 3 a mother is tearful, anxious, and doubting herself, but she is feeding and caring for her baby well and knows her fears are exaggerated. Which nursing plan fits her picture?", [
  ["Support and encouragement, protected rest, good nutrition, and teaching her to avoid alcohol — while watching that the feelings lift within about 2 weeks", true, "That is the blues prescription: at least half of mothers get it, it starts on day 2–3, and it resolves on its own in about 2 weeks. The watch matters — feelings that persist and pervade get evaluated, not reassured away."],
  ["Start the depression pathway today — tearfulness on day 3 always becomes postpartum depression unless antidepressants begin early", false, "'Always' is wrong: the blues are common and self-resolving. Antidepressants belong to the depression picture — later onset, lingering course — not to day-3 tearfulness with intact coping."],
  ["Reassure her that nothing needs any follow-up, because feelings in the first 2 weeks never matter clinically", false, "That is the chapter's named dismissal trap in reverse. The blues are watched precisely because the nurse must catch the feelings that do NOT lift."],

], "ANSWER KEY — Correct answer: support, rest, nutrition, no alcohol — with a watch on the 2-week course. DETAILED RATIONALE — Blues care is supportive, but it is not a dismissal: the nurse's eyes are the screening tool, since there is no routine formal screening. The same visit that reassures also sets the expectation — if it is not lifting, it gets evaluated. PRIORITY FRAMEWORK — Maslow / psychosocial with safety watch: support the adjustment, surveil the course.");

S("Postpartum Mood Disorders — Blues, Depression, Psychosis", "At a 3-week visit, a mother reports crying most days, sleeping 14 hours yet feeling exhausted, losing interest in food, friends, and the baby, and having panic attacks. She knows her thoughts are 'not logical' but cannot shake them. Which action is correct?", [
  ["Arrange evaluation for postpartum depression — onset at 2–4 weeks with persistent, pervasive symptoms is not the blues, and treatment pairs psychotherapy with antidepressants", true, "Every discriminator points to depression: the 2–4 week onset window, symptoms that are persistent and pervasive, impaired functioning and bonding — and reality contact intact, since she knows her thoughts are not logical."],
  ["Reassure her this is still the baby blues and recheck her at the 6-week visit if she is not feeling better by then", false, "The blues resolve within about 2 weeks. At week 3 with pervasive symptoms, reassurance is the dismissal the chapter warns against — depression is not self-limiting."],
  ["Treat it as psychosis and arrange emergency psychiatric admission, because she has lost touch with reality and is a danger", false, "She has NOT lost touch with reality — she can judge her own thoughts as illogical. Reality contact is the dividing line, and she is on the depression side of it. Urgent evaluation, yes; the psychosis pathway, no."],
  ["Advise her to avoid alcohol and wait, because hormone levels settle by 6 weeks and the feelings will lift with them on their own", false, "Waiting is the blues plan applied to the wrong disorder. Depression lingers past the blues window and needs professional treatment, including for related anxiety and insomnia."]
], "ANSWER KEY — Correct answer: professional evaluation for postpartum depression. DETAILED RATIONALE — Depression can hide behind 'tired new mom,' and thoughts of harming herself or the baby can appear in this picture — which is why the assessment explores her feelings rather than reassuring them away. Setting (outpatient or inpatient) follows severity; light therapy and exercise may help as adjuncts. PRIORITY FRAMEWORK — Safety: persistent + pervasive + impairing = evaluate, never dismiss.");

S("Postpartum Mood Disorders — Blues, Depression, Psychosis", "On day 5, a mother is brought in hyperactive and euphoric. She insists her healthy baby died and was replaced, has not slept in 2 days, and is responding to voices she hears. Her partner reports she has bipolar disorder. What is the priority?", [
  ["She has lost contact with reality — psychosis can be fatal for mother and infant, and she needs inpatient psychiatric care with the baby kept supervised", true, "Hallucinations and a fixed delusion about the baby are lost reality contact — the psychosis dividing line. It often rides on bipolar disorder, danger peaks in manic episodes (poor judgment, feeling invulnerable), and the appropriate setting in many cases is inpatient psychiatric treatment."],
  ["Reassure the partner that vivid experiences and confusion are part of the baby blues and will resolve within 2 weeks on their own", false, "The blues never include delusions or voices. Reassuring this family sends a psychiatric emergency home with a newborn."],
  ["Arrange outpatient counseling for next week and send her home with the baby, because family support is present around the clock", false, "Supportive family does not convert an emergency into an outpatient problem. Psychosis can be fatal for mother and infant; the setting is inpatient."],
  ["Focus on sleep hygiene and nutrition teaching, because exhaustion and poor intake are driving the whole picture", false, "Rest and nutrition are blues-level supports. They are adjuncts at best here — they do not treat lost reality contact, and teaching is not supervision."]
], "ANSWER KEY — Correct answer: emergency — inpatient psychiatric care, baby supervised and safe. DETAILED RATIONALE — Psychosis is the rarest of the three (fewer than 3 per 1,000 births) and the only one that is an emergency by definition. The depressed mother knows what is real; the psychotic mother may not — and her delusion here is ABOUT the baby, which sets the safety plan. PRIORITY FRAMEWORK — Safety first: reality lost + infant involved = emergency containment before all else.");

S("Postpartum Mood Disorders — Blues, Depression, Psychosis", "A nurse is reviewing four postpartum mothers at a clinic. Which mother carries the strongest stack of risk factors for a postpartum mood disorder and needs the closest watching?", [

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { shuffle(q.opts); S.resp.push(-1); }
    else if (q.type === "multi") { shuffle(q.opts); S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { shuffle(q.blanks[k].o); d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>OB Ch 11 — Complications After Birth: Critical Thinking Test</h1>';
  h += '<div class="sub">Brutal mode | Leifer, Introduction to Maternity and Pediatric Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order<br><span class="small">Answer choices always shuffle, even dropdowns. Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
