<script>
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
function S(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "single", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
function M(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "multi", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
var CATS = ["Postpartum Hemorrhage — Shock and First Response","Uterine Atony, Bladder, and Subinvolution","Lacerations and Hematomas — Concealed Bleeding","Postpartum Infections — Uterus, Wound, Urinary Tract, Breast","Thromboembolism — SVT, DVT, and Pulmonary Embolism","Clotting Problems and Hemorrhage Medications","Postpartum Mood Disorders — Blues, Depression, Psychosis"];
var KEYTERMS = [];

/* ================= NGN CASE 1 — early PPH, cause shifts (twins, overdistention) ================= */
var CASE_MR1 = "CASE STUDY — Two Babies, One Tired Uterus. Mrs. J. M., 31 years old, G3 P2, gave birth vaginally to twins 40 minutes ago. The placenta delivered intact. She voided 350 mL just before the second stage and her bladder is not distended. On assessment now: the fundus is soft, difficult to locate, and above the umbilicus. Lochia is heavy rubra with large clots; a perineal pad saturated in 20 minutes. Pulse 114, blood pressure 118/76, respirations 22. She is restless and keeps asking for water.";

S("Postpartum Hemorrhage — Shock and First Response", "CASE STUDY — Two Babies, One Tired Uterus. Which cluster of cues most strongly indicates that a hemorrhage is developing?", [
  ["The soft, hard-to-locate fundus above the umbilicus with heavy rubra lochia, large clots, a pad saturated in 20 minutes, a pulse of 114, and new restlessness", true, "Every cue points the same way: a uterus that is not clamping (soft, high, hard to find), loss that is heavy with large clots and faster than one pad per hour, and the earliest volume signs — a rising pulse and restlessness — while the blood pressure still looks acceptable."],
  ["The firm, midline fundus at the umbilicus with moderate rubra lochia, a few small clots, a pulse of 82, and a mother resting comfortably after the birth", false, "That is the normal recovery picture — firm and midline, moderate flow, small clots only, a slow-normal postpartum pulse. It is the comparison picture, not Mrs. J. M.'s."],
  ["A continuous bright-red trickle with a firm fundus, severe perineal pain the analgesic has not touched, and lochia that looks normal in amount", false, "That cluster belongs to the trauma family — a laceration trickle or a hematoma pain pattern. Mrs. J. M.'s fundus is soft and her flow is heavy, which is a different source."],
  ["A temperature of 38.4 °C with a tender, enlarged uterus, foul-smelling lochia, and severe cramping on postpartum day 3", false, "That is the endometritis picture — an infection pattern on day 3. Mrs. J. M. is 40 minutes after birth with a tone problem, not a fever problem."]
], "ANSWER KEY — Correct answer: the atony cluster — soft high fundus, heavy clots, fast pad saturation, pulse 114, restlessness. DETAILED RATIONALE — NGN step 1 (recognize cues): hemorrhage cues sort by pattern. Tone failure shows a soft, high, hard-to-find fundus with heavy flow; volume loss announces itself in pulse and behavior before the blood pressure moves. Her bladder is empty, so the driver is the overstretched twin uterus, not distention. PRIORITY FRAMEWORK — Clinical Judgment (recognize cues): read the whole pattern, not the single worst number.", { scen: CASE_MR1, grp: "MR-CASE1" });

M("Postpartum Hemorrhage — Shock and First Response", "CASE STUDY — Two Babies, One Tired Uterus. Which findings are early evidence that Mrs. J. M.'s circulating volume is falling? Select all that apply.", [
  ["Her pulse has climbed to 114 beats per minute", true, "Tachycardia is usually the FIRST sign of inadequate volume — the heart speeds up to defend perfusion long before the pressure falls."],
  ["She has become restless and keeps asking for water", true, "Anxiety, restlessness, and thirst are early brain-and-volume cues in the shock sequence, ahead of confusion and lethargy."],
  ["Her perineal pad saturated in 20 minutes with large clots", true, "The pad rate measures the loss itself — saturation inside 15 minutes to 1 hour is report-level bleeding, and large clots are not a normal finding."],
  ["Her blood pressure has fallen to 118/76 from her usual 128/84", false, "Blood pressure falls LATE in hypovolemic shock, after pulse pressure narrows. A near-usual pressure in a bleeding woman is compensation, not safety."],
  ["Her pulse has slowed to 56 beats per minute since the birth", false, "A pulse of 50–60 is the expected postpartum bradycardia from increased stroke volume — the opposite direction from a volume alarm."]
], "ANSWER KEY — Correct answers: pulse 114, new restlessness and thirst, and a pad saturated in 20 minutes with large clots. DETAILED RATIONALE — NGN step 2 (analyze cues): the body compensates and hides shock early. Heart rate climbs first, the brain shows restlessness, and the pad rate measures the loss — while the blood pressure, the number everyone wants to trust, changes last. PRIORITY FRAMEWORK — Clinical Judgment (analyze cues) + ABCs: trend the early signs, not the late one.", { scen: CASE_MR1, grp: "MR-CASE1" });

S("Uterine Atony, Bladder, and Subinvolution", "CASE STUDY — Two Babies, One Tired Uterus. What should the nurse do FIRST for Mrs. J. M.?", [
  ["Massage the uterus until it is firm, supporting the lower uterus with the other hand", true, "Source control comes first: massage firms the uterus so its figure-eight fibers clamp the placental-site vessels. The supporting hand guards against inversion while pressure is applied."],
  ["Start the IV fluid infusion wide open and draw blood for type and crossmatch first", false, "Volume support matters and runs in the bundle — but fluids replace what is lost without stopping the loss. The bleeding source is a soft uterus that can be firmed by hand right now."],
  ["Give her the water she is asking for and reassess her fundus in 15 minutes", false, "A hemorrhage patient stays NPO until the provider evaluates, because general anesthesia may be needed. Waiting 15 minutes spends volume she cannot spare."],
  ["Catheterize her for strict intake and output before touching the fundus", false, "Her bladder is not distended and she voided before the second stage. Output monitoring belongs in the bundle, after the source is addressed."]
], "ANSWER KEY — Correct answer: massage the uterus until firm, with the lower uterus supported. DETAILED RATIONALE — NGN step 3 (prioritize hypotheses/actions): atony care has a tested order — massage to firm FIRST, clots only once firm, bladder emptied to keep it firm. Her risk stack (twins stretching the uterus) converges on tone. PRIORITY FRAMEWORK — Nursing Process (assessment to intervention): stop the loss at its source before supporting measures.", { scen: CASE_MR1, grp: "MR-CASE1" });

M("Postpartum Hemorrhage — Shock and First Response", "CASE STUDY — Two Babies, One Tired Uterus. The fundus firms with massage but softens again each time massage stops. Which actions belong in the nurse's plan now? Select all that apply.", [
  ["Notify the provider and prepare the ordered first-line uterotonic infusion", true, "A uterus that will not hold its contraction escalates to drugs — oxytocin is the first-line uterotonic, given as a dilute IV infusion."],
  ["Keep her NPO until the provider has evaluated her", true, "General anesthesia may be needed to fix the cause, so nothing by mouth until the provider evaluates — a standing rule for the hemorrhage patient."],
  ["Weigh every pad and keep vital signs every 15 minutes until she is stable", true, "Quantified loss (1 g of pad weight = 1 mL of blood) and a q15-minute vital-sign trend are how the team knows whether she is winning or losing."],
  ["Place the twins at her breast so suckling releases her own oxytocin", true, "Suckling triggers posterior-pituitary oxytocin release — a free uterotonic that helps hold the contraction the massage started."],
  ["Massage continuously for the next 30 minutes so the uterus cannot soften again", false, "Overmassage tires the muscle and worsens atony. Massage stops once the uterus is firm; holding the contraction is the drugs' and the baby's job."],
  ["Encourage her to get up and walk to the bathroom to empty her bladder", false, "She is bleeding with a rising pulse — ambulation risks a fall and delays the bundle. Her bladder is not the driver in this case."]
], "ANSWER KEY — Correct answers: notify the provider and prepare oxytocin, keep her NPO, weigh pads with q15-minute vitals, and put the twins to breast. DETAILED RATIONALE — NGN step 4 (generate solutions): each driver gets its matched tool — pharmacology for tone that will not hold, anesthesia safety (NPO), measurement for the trend, and physiology (suckling oxytocin) — while the two false actions attack the problem in ways the chapter warns against. PRIORITY FRAMEWORK — Clinical Judgment (generate solutions): one tool per driver, bundle underneath.", { scen: CASE_MR1, grp: "MR-CASE1" });

BANK.push({ cat: "Uterine Atony, Bladder, and Subinvolution", type: "order", stem: "CASE STUDY — Two Babies, One Tired Uterus. Place the nurse's actions in the correct order for Mrs. J. M.'s atony care.", scen: CASE_MR1, grp: "MR-CASE1", items: [
  { t: "Massage the uterus until it becomes firm", r: "Firm it first — nothing else in the sequence works against a soft uterus, and clots are expressed only once it is firm." },
  { t: "Expel pooled blood and clots once the uterus is firm", r: "Clots come out against a contracted uterus; expressing them against a soft one accomplishes nothing and wastes time." },
  { t: "Confirm the bladder is empty so the uterus can stay firm", r: "An empty bladder keeps the uterus contracted — the check protects the firmness the massage just bought." },
  { t: "Start the ordered uterotonic and notify the provider", r: "Drug support and provider notification follow the hands-on fix when the uterus will not hold on its own." },
  { t: "Reassess fundus, lochia, and vital signs against her starting values", r: "Evaluation closes the loop: is the loss slowing, the fundus holding, the pulse settling?" }
], tp: "ANSWER KEY — Correct order: massage to firm → expel clots once firm → confirm bladder empty → uterotonic and provider notification → reassess against baseline. DETAILED RATIONALE — NGN step 5 (take action): the chapter's sequence is a clinical decision — firm it, clear it, keep it firm, support it, re-judge it. PRIORITY FRAMEWORK — Clinical Judgment (take action): order is treatment, not paperwork." });

S("Clotting Problems and Hemorrhage Medications", "CASE STUDY — Two Babies, One Tired Uterus. The fundus is now firm and the flow has slowed, but the nurse notices pinpoint spots on Mrs. J. M.'s skin and oozing from her IV puncture site, and her urine output is falling. How should the nurse interpret and act on this change?", [
  ["A clotting problem may be developing — flag the petechiae and oozing to the provider at once while the hemorrhage bundle continues", true, "The book's cue is explicit: in any bleeding postpartum patient, petechiae plus oozing from puncture sites means think clotting problem. The T has shifted — sites that will not seal need the clotting arm treated, not more massage."],
  ["The atony is returning — resume continuous fundal massage and increase the oxytocin infusion rate on her own", false, "The fundus is firm and the flow has slowed — tone is controlled. Massage and oxytocin contract a uterus; neither seals puncture sites or explains pinpoint skin spots."],
  ["The IV site is simply infiltrated — restart the IV in the other arm and chart the skin spots as a rash to review tomorrow", false, "One oozing site could be local; oozing plus petechiae plus falling output in a bleeding woman is a pattern. Charting it away until tomorrow misses the one T that hides in plain sight."],
  ["She is reacting to the oxytocin — stop the infusion and give her a dose of her prescribed pain medication instead", false, "Nothing in the picture names a drug reaction, and stopping the uterotonic that is holding her uterus invites the bleeding back. The new cues name clotting, not allergy."]
], "ANSWER KEY — Correct answer: suspect a clotting problem — flag petechiae and puncture-site oozing to the provider while the bundle continues. DETAILED RATIONALE — NGN step 6 (evaluate outcomes): evaluation is not only 'did it work' — it is re-sorting the cause when new cues appear. Tone was fixed; the diffuse oozing pattern belongs to Thrombin, the fourth T. PRIORITY FRAMEWORK — Clinical Judgment (evaluate outcomes): when the picture changes, re-run the differential.", { scen: CASE_MR1, grp: "MR-CASE1" });

/* ================= NGN CASE 2 — day 9 infection discrimination (pyelonephritis) ================= */
var CASE_MR2 = "CASE STUDY — The Fever That Pointed to the Kidney. Mrs. S. N., 28 years old, is seen in the emergency department on postpartum day 9. For 2 days she has had burning and urgency when she voids. Now her temperature is 39.5 °C and spiking, with chills, right flank pain, nausea, and one episode of vomiting. Her uterus is nontender and normal in size, her lochia is pinkish with no foul odor, her breasts are soft with no red or tender area, and her perineum is healing cleanly.";

S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "CASE STUDY — The Fever That Pointed to the Kidney. Which problem does Mrs. S. N.'s cue cluster name?", [
  ["Pyelonephritis — her urinary infection is the source of this picture", true, "The discriminating cluster is exact: spiking high fever with chills, flank (costovertebral) pain, and nausea/vomiting layered on 2 days of burning and urgency. That is cystitis that climbed — a kidney infection, not a bladder one."],
  ["Endometritis — her uterus is the source of this picture", false, "Endometritis shows a tender, enlarged uterus, foul-smelling lochia, and prolonged severe cramping. Her uterus is nontender, normal in size, and her lochia has no foul odor."],
  ["Mastitis — her breast is the source of this picture", false, "Mastitis is one hot, red, tender area of breast, usually 2–3 weeks after birth. Her breasts are soft with no red or tender area, and she is on day 9."],
  ["Wound infection — her perineal repair is the source of this picture", false, "A wound infection declares itself at the site — redness, edema, heat, a separating suture line, purulent drainage. Her perineum is healing cleanly."]
], "ANSWER KEY — Correct answer: pyelonephritis — a urinary infection that has ascended to the kidney. DETAILED RATIONALE — NGN step 1 (recognize cues): the four infection sites sort by their signature findings. Systemic signs (spiking fever, chills, vomiting) plus flank pain move a urinary infection out of the bladder category, while the normal uterus, breasts, and perineum clear the other three sites. PRIORITY FRAMEWORK — Clinical Judgment (recognize cues): the site is named by what is present AND what is absent.", { scen: CASE_MR2, grp: "MR-CASE2" });

M("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "CASE STUDY — The Fever That Pointed to the Kidney. Which cues most strongly separate Mrs. S. N.'s kidney infection from a simple bladder infection? Select all that apply.", [
  ["A spiking temperature of 39.5 °C with chills", true, "Cystitis runs a low-grade fever. A high, spiking fever with chills is the systemic signature that the infection has ascended."],
  ["Pain in the right flank, over the kidney area", true, "Flank / costovertebral-angle pain localizes the infection to the kidney — the bladder does not produce pain there."],
  ["Nausea with an episode of vomiting", true, "Nausea and vomiting travel with pyelonephritis in the chapter's table — they are part of the kidney picture, not the bladder one."],
  ["Burning and urgency when she voids", false, "Burning, urgency, and frequency are the shared cystitis cues — they place her in the urinary family but cannot separate bladder from kidney."],
  ["A pinkish lochia with no foul odor on day 9", false, "That is a normal lochia finding for day 9. It helps clear the uterus as the source; it does not grade a urinary infection."]
], "ANSWER KEY — Correct answers: spiking fever with chills, flank pain, and nausea/vomiting. DETAILED RATIONALE — NGN step 2 (analyze cues): discrimination items turn on the cues that DIFFER, not the cues that are shared. Burning and urgency are common to both urinary levels; fever height, flank pain, and vomiting are the level-setters. PRIORITY FRAMEWORK — Clinical Judgment (analyze cues): shared cues name the family, differing cues name the member.", { scen: CASE_MR2, grp: "MR-CASE2" });

S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "CASE STUDY — The Fever That Pointed to the Kidney. Which action should the nurse take FIRST for Mrs. S. N.?", [
  ["Obtain a urine specimen for culture, then start the ordered IV antibiotics", true, "Culture first, then the drug — the culture picks the antibiotic that will actually work, and pyelonephritis is treated IV first. Sequence protects the information the whole plan depends on."],
  ["Push oral fluids to 3 L a day and recheck her temperature in the morning", false, "Fluids to 3 L/day are part of urinary care, but an ascending infection with systemic signs is how puerperal sepsis starts. Morning is too late to begin treatment."],
  ["Place her in Fowler's position so infected lochia can drain from the uterus", false, "Fowler's drains an infected uterus — endometritis care. Her uterus is nontender with normal lochia; positioning treats a site that is not infected."],
  ["Apply moist heat to her breast and have her nurse or pump before reassessing", false, "Heat and emptying are mastitis care. Her breasts are soft with no red or tender area — there is no breast source to treat."]
], "ANSWER KEY — Correct answer: urine culture first, then IV antibiotics as ordered. DETAILED RATIONALE — NGN step 3 (prioritize hypotheses/actions): every infection site in this family follows the same opening — culture the suspected site, then start antibiotics, with the goals of limiting spread and keeping the infection out of the blood. PRIORITY FRAMEWORK — Nursing Process + safety: culture before drug, IV first for the kidney.", { scen: CASE_MR2, grp: "MR-CASE2" });

M("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "CASE STUDY — The Fever That Pointed to the Kidney. Which actions belong in Mrs. S. N.'s plan of care? Select all that apply.", [
  ["Encourage fluids up to 3 L a day as tolerated", true, "Fluids to 3 L/day are the chapter's urinary-tract support measure — they dilute and flush while the antibiotics work."],
  ["Give IV antibiotics first rather than starting with oral tablets", true, "Pyelonephritis is in the IV-first group with endometritis. The kidney infection's systemic picture is what earns the IV route."],
  ["Teach her urine-acidifying foods — apricots, cranberry juice, plums, and prunes", true, "The chapter names these foods for urinary care: acidified urine is part of the UTI teaching package alongside fluids and the drug course."],
  ["Monitor her temperature and pulse together for spread of the infection", true, "Temperature and pulse travel together in infection — a higher-than-expected pulse plus fever is the spread watch, on the road to puerperal sepsis."],
  ["Stop the antibiotics as soon as her fever breaks and she feels better", false, "The family's #1 behavioral danger: stopping when symptoms fade lets the infection rebound. The full course is finished even when she feels well."],
  ["Restrict her fluids so her kidneys can rest while they are infected", false, "Restriction is the opposite of the plan — urinary care pushes fluids to 3 L/day. A rested, dry kidney is not a chapter intervention."]
], "ANSWER KEY — Correct answers: fluids to 3 L/day, IV antibiotics first, urine-acidifying foods, and temperature-plus-pulse monitoring. DETAILED RATIONALE — NGN step 4 (generate solutions): the urinary plan layers route (IV first), support (fluids), teaching (acidifying foods), and surveillance (fever with pulse) — while the two false actions reverse the family's standing rules. PRIORITY FRAMEWORK — Clinical Judgment (generate solutions): match each action to the site and the level.", { scen: CASE_MR2, grp: "MR-CASE2" });

BANK.push({ cat: "Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", type: "order", stem: "CASE STUDY — The Fever That Pointed to the Kidney. Place the nurse's actions in the correct order for Mrs. S. N.'s care.", scen: CASE_MR2, grp: "MR-CASE2", items: [
  { t: "Assess and record her temperature, pulse, flank pain, and voiding symptoms", r: "Baseline first — the fever pattern, pulse, and localizing pain are the values every later reassessment is judged against." },
  { t: "Collect a clean-catch or catheterized urine specimen for culture", r: "The culture must be captured before antibiotics start, or the organism that should choose the drug is lost." },
  { t: "Start the ordered IV antibiotics", r: "IV first for pyelonephritis — the drug follows the culture, never precedes it." },
  { t: "Encourage fluids up to the full daily goal for urinary care and support her nausea", r: "Supportive urinary care layers in once the culture and the drug are secured." },
  { t: "Reassess temperature, pulse, and flank pain against the baseline", r: "Evaluation closes the loop: is the fever breaking, the pulse settling, the flank pain easing?" }
], tp: "ANSWER KEY — Correct order: baseline assessment → urine culture → IV antibiotics → fluids and support → reassess against baseline. DETAILED RATIONALE — NGN step 5 (take action): the sequence protects information (culture before drug) and matches route to severity (IV first for the kidney). PRIORITY FRAMEWORK — Clinical Judgment (take action): order is a clinical decision, not paperwork." });

S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "CASE STUDY — The Fever That Pointed to the Kidney. At discharge, which statement by Mrs. S. N. shows she understands her teaching?", [
  ["I will finish all of the antibiotic, even after the fever is gone and I feel fine", true, "The family's discharge test: the course is finished even when symptoms fade, or the infection rebounds. She has named the exact behavior that prevents relapse."],
  ["I can stop the antibiotic once my temperature stays normal for a full day", false, "That is the rebound setup stated as a plan. A normal day of temperature is a symptom change, not the end of the course."],
  ["I should drink as little as possible so the medicine stays concentrated", false, "Urinary teaching pushes fluids to 3 L/day — dilution and flushing support the drug. Concentrating by restricting reverses the plan."],
  ["Burning when I void is expected for weeks, so I do not need to report it", false, "Continued burning and urgency are report findings — they can mean the infection persists or is climbing again. Expected-for-weeks is the dangerous version."]
], "ANSWER KEY — Correct answer: she will finish the full antibiotic course even after she feels fine. DETAILED RATIONALE — NGN step 6 (evaluate outcomes): understanding is proven by the safety behaviors she can state, not by her symptom story. The antibiotic-completion rule is the urinary family's headline teaching. PRIORITY FRAMEWORK — Clinical Judgment (evaluate outcomes): teach-back on the behaviors, not just the facts.", { scen: CASE_MR2, grp: "MR-CASE2" });

/* ================= PPH standalone ================= */
S("Postpartum Hemorrhage — Shock and First Response", "Four mothers are being assessed in the first hours after birth. Which mother meets the chapter's definition of postpartum hemorrhage?", [
  ["A vaginal-birth mother with a measured loss of 640 mL who is pale, with a pulse of 116 and a falling urine output", true, "PPH after a vaginal birth is blood loss over 500 mL — and she pairs the number with hypovolemia signs: pallor, tachycardia, and kidneys conserving fluid. Number plus signs is the complete picture."],
  ["A cesarean-birth mother with a measured loss of 820 mL who is comfortable, with a pulse of 88 and a firm fundus", false, "The cesarean threshold is higher — over 1000 mL — because the expected surgical loss is larger. Her volume and her signs both sit below the line."],
  ["A vaginal-birth mother with a measured loss of 310 mL who is anxious because her extended family has just arrived", false, "Her loss is well under the 500 mL vaginal threshold, and her anxiety has a stated social cause. Neither the number nor the signs qualify."],
  ["A cesarean-birth mother with a measured loss of 540 mL who is sleepy after a long labor and anesthesia", false, "Sleepiness after labor and anesthesia is expected, and 540 mL is far under the cesarean threshold. Expected recovery is not hemorrhage."]
], "ANSWER KEY — Correct answer: the vaginal-birth mother with 640 mL and hypovolemia signs. DETAILED RATIONALE — The definition is route-specific: over 500 mL vaginal, over 1000 mL cesarean, plus signs of hypovolemia. Discrimination items pair the number with the route — the same volume can be normal for one mother and hemorrhage for another. PRIORITY FRAMEWORK — Assessment accuracy: match the number to the birth route before naming the problem.");

S("Postpartum Hemorrhage — Shock and First Response", "A bleeding woman's readings over one hour read: blood pressure 118/76 with pulse 96, then 108/82 with pulse 112, then 102/86 with pulse 126. Her latest blood pressure is still above 100 systolic. How should the nurse read this trend?", [
  ["Her pulse pressure is narrowing while her pulse climbs — early shock is progressing even though the systolic has not collapsed", true, "Pulse pressure narrows first (systolic falls, diastolic rises) and tachycardia is the earliest volume sign. The trend across three readings is the finding — compensation is being spent, not holding."],
  ["She is stable — the systolic staying above 100 means her circulating volume is still adequate", false, "Systolic pressure is the late mover in hypovolemic shock. Waiting for it to collapse means waiting until compensation has already failed."],
  ["Her rising diastolic shows her vessels are clamping down well, so the bleeding is probably stopping", false, "Vasoconstriction is compensation, not recovery — and her pulse climbing alongside it says the loss is outpacing the compensation."],
  ["The readings are inconsistent and should be repeated in an hour before anyone is notified", false, "Three readings moving the same direction are a trend, not an inconsistency. An hour of delay spends the window the trend is warning about."]
], "ANSWER KEY — Correct answer: narrowing pulse pressure with a climbing pulse — early shock progressing. DETAILED RATIONALE — The chapter's shock sequence is ordered: pulse climbs, pulse pressure narrows, and only then does blood pressure fall — late and ominous. One acceptable number never outranks a deteriorating trend. PRIORITY FRAMEWORK — ABCs / circulation: trend the early signs, escalate before the late one arrives.");

S("Postpartum Hemorrhage — Shock and First Response", "A nurse weighs a bleeding woman's pads. A dry pad weighs 45 g. After one hour the used pads weigh 385 g in total. How much blood loss does this represent, and what does the method give the team?", [
  ["About 340 mL — weighing converts the loss into a number the whole team can trend and act on", true, "Pad weight converts at 1 g = 1 mL: 385 g of used pads minus 45 g of dry pad = 340 g, about 340 mL. The point of weighing is a running, objective total instead of a visual guess."],
  ["About 385 mL — the scale reads blood volume directly, so no adjustment for the pad is needed", false, "The scale weighs pad plus blood. Skipping the dry-pad subtraction overstates every total and corrupts the trend the method exists to create."],
  ["About 45 mL — only the weight above the first hundred grams counts as true blood loss", false, "There is no hundred-gram rule in the chapter. The conversion is simply 1 g = 1 mL after the dry weight is subtracted."],
  ["It cannot be calculated — lochia contains tissue and mucus, so weighing pads is not a used method", false, "Weighing is the chapter's bedside measurement method precisely because visual estimation undercounts. Lochia content does not cancel the conversion."]
], "ANSWER KEY — Correct answer: about 340 mL, and weighing gives the team a trendable number. DETAILED RATIONALE — Blood loss is measured at the bedside in this chapter: count and weigh pads, 1 g = 1 mL, dry weight subtracted. Quantification is what turns 'heavy' into a value that triggers escalation and measures response. PRIORITY FRAMEWORK — Assessment accuracy: measure the loss, do not estimate it.");

M("Postpartum Hemorrhage — Shock and First Response", "A nurse is watching a postpartum woman after a large blood loss. Which findings belong to the developing hypovolemic shock picture? Select all that apply.", [
  ["Skin and mucous membranes that are pale, cold, and clammy", true, "Peripheral shutdown is part of the picture — blood is shunted centrally, leaving skin and mucous membranes pale, cold, and clammy."],
  ["Anxiety and restlessness that progress toward confusion and lethargy", true, "The brain's sequence is ordered: anxiety, confusion, and restlessness first, lethargy as perfusion worsens. Direction matters — quieter is worse here."],
  ["Urine output that falls, and then stops, as the kidneys conserve fluid", true, "Falling output is the kidney window on volume — the kidneys conserve as volume drops, and output that stops marks severe underperfusion."],
  ["A pulse that climbs above 100 beats per minute and keeps rising", true, "A postpartum pulse over 100 means suspect shock or infection — tachycardia is usually the first sign of inadequate volume."],
  ["A blood pressure that falls as the very first change, before the pulse moves", false, "The order is reversed: BP falls late and ominously, after the pulse climbs and the pulse pressure narrows. First-change BP is the trap version."],
  ["A slow pulse of 54 with warm, dry skin in the first hours after birth", false, "A pulse of 50–60 with comfortable findings is expected postpartum bradycardia from increased stroke volume — the normal picture, not shock."]
], "ANSWER KEY — Correct answers: pale cold clammy skin, anxiety progressing toward lethargy, falling urine output, and a climbing pulse over 100. DETAILED RATIONALE — Shock is read as a system pattern: skin, brain, kidneys, and rate all fail in a known order, while the blood pressure — the value students watch — moves last. PRIORITY FRAMEWORK — ABCs / circulation: know the order of the signs, not just the list.");

S("Postpartum Hemorrhage — Shock and First Response", "A woman being treated for early postpartum hemorrhage asks for a sandwich and juice, saying she has had nothing since labor began. Which response by the nurse is correct?", [
  ["Nothing to eat or drink for now — if the bleeding source needs repair, general anesthesia may be needed, and I will keep checking whether that changes", true, "The hemorrhage patient stays NPO until the provider evaluates, because general anesthesia may be needed to fix the cause. The statement pairs the restriction with its reason and with follow-up."],
  ["A light meal is fine — she needs her strength back, and eating will help her blood volume recover", false, "Food does not replace circulating volume, and a full stomach ahead of possible general anesthesia is an aspiration risk. Strength comes from stopping the loss."],
  ["Clear juice only — liquids do not count as intake when anesthesia is being considered", false, "Liquids are intake. The NPO rule for a possible anesthetic does not have a juice exception in this chapter."],
  ["She can eat once her fundus feels firm at this check, since a firm fundus means the emergency is over", false, "One firm check does not close a hemorrhage — the fundus must stay firm and the trend must hold. Eating is cleared by the provider's evaluation, not by a single palpation."]
], "ANSWER KEY — Correct answer: keep her NPO and explain the anesthesia reason. DETAILED RATIONALE — Teaching items test whether the explanation carries the mechanism: NPO is not a punishment or a routine — it is anesthesia readiness for a cause that may need an operating room. PRIORITY FRAMEWORK — Safety: protect the next intervention while the current one runs.");

S("Postpartum Hemorrhage — Shock and First Response", "A woman who lost a large amount of blood is being monitored in a high-acuity setting, separated from her newborn. She is tearful and keeps asking whether her baby is all right. Which nursing action best fits her care?", [
  ["Update her about the baby regularly and plan for rooming-in to resume as soon as her condition allows", true, "The chapter names both halves: emotional support with clear explanations, updates about the baby when they are separated, and rooming-in resuming as soon as her condition allows. Separation is a care problem, not a footnote."],
  ["Limit baby updates so she rests — rest is the priority, and news about the baby will only keep her awake", false, "Withholding the information she is asking for feeds the anxiety that is keeping her awake. The chapter directs updates, not silence."],
  ["Bring the baby to stay at her bedside continuously so bonding is not interrupted at all", false, "Continuous rooming-in ignores her condition — she needs close monitoring first. The chapter's standard is rooming-in as soon as her condition allows, not immediately at any cost."],
  ["Ask the family to stop mentioning the baby until she is transferred back to a regular room", false, "The baby is her stated concern. Silencing the topic removes her support system from the one subject she needs addressed."]
], "ANSWER KEY — Correct answer: regular baby updates, with rooming-in resuming as soon as her condition allows. DETAILED RATIONALE — Severe hemorrhage care includes the family: support, explanations, baby updates during separation, and the earliest safe return to rooming-in — with ICU-level hemodynamic monitoring when the case is severe. PRIORITY FRAMEWORK — Maslow / family-centered care: physiologic rescue first, family connection protected inside it.");

S("Postpartum Hemorrhage — Shock and First Response", "A mother calls the unit on day 18 after birth: her lochia had faded to pale, but today it is bright red again with clots, and she feels pelvic heaviness. Which instruction should the nurse give her?", [
  ["Come in to be evaluated now — bright-red bleeding returning after the lochia had faded is a report-at-once finding", true, "Late PPH runs from after 24 hours to 6 weeks and usually declares itself at home. Red returning after fading, with clots and heaviness, is the late-hemorrhage signature — retained fragments and subinvolution lead the cause list."],
  ["Rest at home and call back tomorrow if the red color is still there in the morning", false, "Tomorrow spends the safety window. Discharge teaching exists precisely so this call is treated as an evaluation trigger, not a wait-and-see."],
  ["Take a warm bath and massage her fundus, then check the color again this evening", false, "Self-massage does not sort retained tissue, and an evening recheck delays the ultrasound and examination that name the cause."],
  ["Expect this — lochia normally turns red again once or twice before it stops for good", false, "Normal lochia moves in one direction: red, then pinkish, then white. A reversal of the sequence is the abnormal pattern, not a normal stage."]
], "ANSWER KEY — Correct answer: come in now — red returning after fading is a report-at-once finding. DETAILED RATIONALE — Discharge teaching is the safety net for late hemorrhage: every mother is taught the normal progression and the reversal alarm before she goes home, because late PPH's causes (retained fragments, subinvolution) declare themselves at home. PRIORITY FRAMEWORK — Safety / patient teaching: the taught warning sign, acted on the day it appears.");

S("Postpartum Hemorrhage — Shock and First Response", "A woman with early postpartum hemorrhage tells the nurse, 'You already gave me IV fluids — why do I need blood too?' Which statement by the nurse is correct?", [
  ["The fluids hold up your circulating volume, but they carry no red cells — the transfusion replaces the red cells you lost", true, "The chapter separates the tools by job: IV fluids hold circulating volume, blood transfusion replaces lost red cells, and oxygen raises the saturation of the cells that remain. Her question is answered by the division of labor."],
  ["The blood is mainly a precaution in case your blood pressure drops later tonight", false, "Transfusion is not a precaution against a later number — it replaces a measured loss now. Blood pressure, in any case, is the late sign, not the trigger to wait for."],
  ["The fluids and the blood do the same job — the blood is given because it works a little faster", false, "Same-job is the trap: fluids cannot carry oxygen because they contain no red cells. Speed is not the difference; content is."],
  ["You do not really need it — I can ask the provider to cancel it if you would rather not", false, "Cancelling a replacement therapy as a preference offer understates a physiologic need. Concerns are heard and explained; the red-cell deficit remains."]
], "ANSWER KEY — Correct answer: fluids hold volume, transfusion replaces red cells. DETAILED RATIONALE — Communication items in this chapter reward the mechanism in plain words. Each element of the bundle — fluids, blood, oxygen — does a different job, and the patient who understands the difference cooperates with all three. PRIORITY FRAMEWORK — Patient teaching: explain the job of each therapy, not just its name.");

S("Postpartum Hemorrhage — Shock and First Response", "One hour into treatment for early postpartum hemorrhage, a woman's single blood pressure reading is 116/74 — but her pulse has risen from 88 to 124 over the hour and she has grown restless. Which action is correct?", [
  ["Escalate now — a climbing pulse with new restlessness outranks one acceptable blood pressure reading", true, "Tachycardia is usually the first sign of inadequate volume, and restlessness is the brain's early cue. The trend and the behavior together say volume is still falling, whatever the single pressure shows."],
  ["Reassure her and recheck in an hour — the blood pressure is the deciding value and it is normal", false, "Blood pressure falls late in hypovolemic shock. Making it the deciding value repeats the chapter's central trap in its purest form."],
  ["Give her prescribed pain medication — restlessness in a postpartum woman is usually pain until proven otherwise", false, "Pain is worth assessing, but restlessness arriving with a 36-point pulse climb during active hemorrhage is a perfusion cue first. Sedating the cue delays the response."],
  ["Sit her up so she can see the baby — restlessness at this stage is usually separation anxiety", false, "Separation is real and is managed with updates and support — but not by sitting a bleeding, tachycardic woman up, and not before the volume trend is answered."]
], "ANSWER KEY — Correct answer: escalate — pulse trend and restlessness outrank one normal BP. DETAILED RATIONALE — The hemorrhage chapter's most-tested discrimination: early signs (pulse, behavior, output, skin) versus the late sign (blood pressure). Ms Rie-style items hand you the reassuring number and ask whether you will be reassured. PRIORITY FRAMEWORK — ABCs / circulation: the trend is the finding.");

M("Postpartum Hemorrhage — Shock and First Response", "A nurse is planning assessments for four newly delivered mothers. Which mothers need the closest fundus and lochia surveillance because of their hemorrhage risk? Select all that apply.", [
  ["A mother whose placenta implanted low in the uterus during this pregnancy", true, "Low placental implantation is on the chapter's hemorrhage risk list — the lower segment contracts poorly around the placental site."],
  ["A mother whose birth was operative, with instruments used to deliver the baby", true, "Operative birth is a named risk — it stacks tissue trauma on top of a uterus that must still clamp down."],
  ["A mother whose labor was abnormally long and difficult from the start", true, "Abnormal or prolonged labor tires the uterus — a fatigued muscle is the one that fails to contract after birth."],
  ["A mother whose placenta had grown deep into the uterine muscle wall", true, "A placenta grown deep into the muscle is a named risk — separation leaves a site that cannot seal cleanly and may leave fragments behind."],
  ["A mother who put her baby to breast in the first hour and is nursing well", false, "Suckling is protective — it releases her own oxytocin and contracts the uterus. It belongs on the treatment list, not the risk list."],
  ["A mother whose fundus is firm and midline, with moderate rubra and small clots only", false, "Those are normal findings, not risk factors. The question asks who needs closer watching because of risk — she is the comparison, not a candidate."]
], "ANSWER KEY — Correct answers: low implantation, operative birth, prolonged abnormal labor, and a placenta grown deep into the muscle. DETAILED RATIONALE — Risk recognition buys surveillance: every factor spotted earns that mother closer, more frequent assessment. The list clusters around a tired or overstretched uterus, a poorly placed or deeply grown placenta, and surgical or instrument trauma. PRIORITY FRAMEWORK — Prevention / risk stratification: assess the high-risk mother more often, before she declares herself.");
