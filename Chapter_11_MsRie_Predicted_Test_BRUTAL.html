], tp: "ANSWER KEY — Correct matches: 90-minute boggy bleeding = Early; day-16 red return = Late; day-6 pinkish lightening = Normal; 5-hour cesarean heavy flow with pulse 118 = Early. DETAILED RATIONALE — The early/late sort runs on the clock first (24 hours to 6 weeks) and the signature second (clamping failure early, left-behind tissue late, forward lightening always normal). PRIORITY FRAMEWORK — Assessment accuracy: timing plus signature names the category." });

BANK.push({ cat: "Postpartum Hemorrhage — Shock and First Response", type: "dropdown", stem: "Complete the hemorrhage assessment plan for three postpartum patients.<br>Patient 1 — To quantify a bleeding woman's loss objectively, the nurse will:<br>[[0]]<br>Patient 2 — To track whether her kidneys are being perfused during treatment, the nurse will watch:<br>[[1]]<br>Patient 3 — The earliest vital-sign warning that her volume is falling is:<br>[[2]]", blanks: [
  { o: [ { t: "Weigh the pads and convert at 1 g of weight to 1 mL of blood", c: true, r: "Weighing is the bedside measurement — 1 g = 1 mL — and it turns 'heavy' into a trendable number." }, { t: "Estimate the stain size by eye against the last nurse's estimate", c: false, r: "Visual estimation is what weighing replaces — it undercounts and cannot be trended between observers." }, { t: "Count clots only, since clots carry most of the lost volume", c: false, r: "Clots are counted as part of the picture, but liquid loss is volume too — the scale captures all of it." } ] },
  { o: [ { t: "Her hourly urine output through the indwelling catheter", c: true, r: "Strict intake and output with a catheter makes urine the kidney-perfusion gauge — falling output means falling volume." }, { t: "Her bowel sounds at each abdominal assessment", c: false, r: "Bowel sounds track infection spread toward peritonitis, not kidney perfusion during hemorrhage." }, { t: "Her lochia odor at each pad change", c: false, r: "Odor is an infection cue. It says nothing about whether the kidneys are being perfused." } ] },
  { o: [ { t: "A rising pulse, before the blood pressure changes", c: true, r: "Tachycardia is usually the first sign of inadequate volume; the pressure narrows and falls later." }, { t: "A falling blood pressure, before the pulse changes", c: false, r: "That reverses the chapter's order — the pressure is the late and ominous mover." }, { t: "A falling temperature, before either the pulse or pressure changes", c: false, r: "Temperature belongs to the infection family. It is not a volume gauge in this chapter." } ] }
], tp: "ANSWER KEY — Correct completions: weigh pads at 1 g = 1 mL; watch hourly urine output; earliest warning is a rising pulse. DETAILED RATIONALE — The hemorrhage bundle's measurement arm is three gauges — pad weights for the loss, urine output for the kidneys, pulse trend for the volume — each watching a different part of the same failing system. PRIORITY FRAMEWORK — Assessment accuracy: every gauge matched to what it actually measures." });

/* ================= Atony / bladder / subinvolution standalone ================= */
S("Uterine Atony, Bladder, and Subinvolution", "A nurse palpating after birth cannot locate a woman's fundus at all. The perineal pad is filling quickly with rubra lochia and clots. Which interpretation and action are correct?", [
  ["The uterus is likely soft and relaxed, with blood pooling inside it — massage to find and firm it, supporting the lower uterus", true, "A fundus that is difficult to locate is a listed atony sign: the relaxed uterus does not present as a firm mass, and blood pooling inside it blocks contraction further. Massage is both the search and the treatment."],
  ["The uterus has already involuted below the pelvis — document it as not palpable and continue routine checks", false, "Nonpalpable is the day-12 expectation, not the first-hours one. Right after birth the fundus should be a firm grapefruit-sized mass at or below the umbilicus."],
  ["Her bladder is overfull and hiding the fundus — catheterize her first and palpate again afterward", false, "A full bladder pushes the fundus UP and to one side — it makes the uterus easier to feel in the wrong place, not impossible to feel. The unfindable fundus is the tone problem."],
  ["The placenta must not have delivered — prepare her for manual removal before any fundal massage", false, "The placenta delivered; the problem is what the uterus is doing after it. Massage addresses the open vessels at the placental site now."]
], "ANSWER KEY — Correct answer: a soft, pooling uterus — massage to locate and firm it. DETAILED RATIONALE — Atony hides its own evidence: the fundus is difficult to find precisely because it is not contracted, and pooled blood inside the relaxed uterus deepens the failure. The assessment and the first treatment are the same hand. PRIORITY FRAMEWORK — Assessment to intervention: an absent finding is a finding.");

S("Uterine Atony, Bladder, and Subinvolution", "A woman's uterus stays boggy after massage and a first-line oxytocin infusion. Her blood pressure is 168/104 and she has a known hypertensive disorder. The provider's orders include methylergonovine (Methergine) 'if needed.' Which action is correct?", [
  ["Hold the methylergonovine and notify the provider — that drug raises blood pressure, and hers is already dangerously high", true, "Methylergonovine's chapter catch: it RAISES blood pressure and is never given to a hypertensive patient. The BP check gates the ergot drug every time — escalation moves to a prostaglandin instead."],
  ["Give the methylergonovine — a bleeding uterus outranks a blood pressure reading, and the order says 'if needed'", false, "'If needed' does not erase a contraindication the chapter states in one line. The drug that holds the contraction can drive her pressure into a stroke range."],
  ["Give half the dose — a reduced dose contracts the uterus with only a reduced effect on her pressure", false, "There is no half-dose workaround in the chapter. A contraindicated drug at half dose is still the contraindicated drug."],
  ["Give the methylergonovine and recheck her pressure in 30 minutes to see how much it rose", false, "Rechecking after the fact accepts the harm as the measurement. The gate is before the drug, not after it."]
], "ANSWER KEY — Correct answer: hold the methylergonovine and notify the provider. DETAILED RATIONALE — The uterotonic family rule: same job, different catches — and the test loves the catch. For the ergot drug the catch is hypertension; a prostaglandin (carboprost or misoprostol) is the escalation that remains open to her. PRIORITY FRAMEWORK — Medication safety: the contraindication check is part of the order.");

S("Uterine Atony, Bladder, and Subinvolution", "A tired mother whose uterus keeps softening says, 'Just give the baby a bottle — I am too exhausted to nurse right now.' Which statement by the nurse best addresses the bleeding risk?", [
  ["Nursing actually helps your uterus — when the baby suckles, your body releases its own oxytocin and the uterus contracts and stays firmer", true, "Suckling releases posterior-pituitary oxytocin — the free uterotonic. The statement connects the feeding choice to the bleeding problem she is being treated for, which is the information she needs."],
  ["Bottle feeding is fine — feeding method has nothing to do with how your uterus behaves after birth", false, "Feeding method has a direct physiologic link here: suckling contracts the uterus. 'Nothing to do with it' removes a treatment while calling it neutral."],
  ["You must breastfeed whether you are tired or not — it is part of your treatment plan now", false, "The fact is right but the framing is coercion. The chapter's tool is explanation — she is told why nursing helps, not ordered into it."],
  ["Rest first and nurse in a few hours — the oxytocin effect will be just as strong then", false, "Her uterus is softening now. Deferring the physiologic uterotonic by hours spends the window in which it was needed."]
], "ANSWER KEY — Correct answer: explain that suckling releases her own oxytocin and firms the uterus. DETAILED RATIONALE — Communication items reward the mechanism stated kindly and accurately. Breastfeeding sits on the atony treatment ladder alongside massage and drugs — the nurse who can say why can recruit the mother's own physiology. PRIORITY FRAMEWORK — Patient teaching + generate solutions: recruit every tool, including the free one.");

M("Uterine Atony, Bladder, and Subinvolution", "Which findings together describe subinvolution rather than normal involution? Select all that apply.", [
  ["Fundal height higher than expected for the number of days since the birth", true, "Subinvolution is a stalled return — the yardstick is the day: about 1 cm of descent per day, nonpalpable by about 12 days. Higher than the day allows is the definition in practice."],
  ["Lochia rubra that persists instead of progressing to pinkish and then white", true, "Persistent rubra is a named subinvolution sign — the lochia phases stall along with the uterus that produces them."],
  ["Pelvic pain with a heavy feeling, and unusual fatigue", true, "Pain, heaviness, and fatigue round out the subinvolution picture in the chapter — the cluster that brings her back to clinic."],
  ["A fundus that descends about a finger's width each day and is gone by day 12", false, "That is the normal yardstick itself — descent of about 1 cm a day, no longer palpable by about 12 days. It is the comparison, not the complication."],
  ["Lochia that is white and mucus-like during the third week after birth", false, "White, mostly-mucus lochia in the later weeks is the normal final phase (alba). Timing makes it expected, not stalled."]
], "ANSWER KEY — Correct answers: fundus higher than the day allows, persistent rubra, and pelvic pain with heaviness and fatigue. DETAILED RATIONALE — Subinvolution is judged against the schedule: descent rate, lochia phase, and symptoms all compared with what the day since birth predicts. Its usual drivers are infection and retained placental fragments. PRIORITY FRAMEWORK — Assessment accuracy: compare every finding against the day's expected value.");

BANK.push({ cat: "Uterine Atony, Bladder, and Subinvolution", type: "order", stem: "A nurse finds a newly delivered woman's fundus boggy and high, with heavy lochia. Place the nurse's actions in the correct order.", items: [
  { t: "Massage the uterus until it becomes firm", r: "Firm first — the contracted uterus is what clamps the placental-site vessels and stops the loss." },
  { t: "Expel pooled blood and clots against the now-firm uterus", r: "Clots are expressed only after the uterus is firm; against a soft uterus the maneuver does nothing." },
  { t: "Empty the bladder, by catheter if she cannot void", r: "An empty bladder keeps the uterus contracted — this step protects the firmness the massage bought." },
  { t: "Notify the provider and give the ordered uterotonic", r: "Drug support and notification follow the hands-on fix when the uterus needs help holding its contraction." },
  { t: "Reassess the fundus, lochia, and vital signs", r: "Reassessment judges the whole sequence: firmness held, flow slowing, pulse settling." }
], tp: "ANSWER KEY — Correct order: massage to firm → expel clots once firm → empty the bladder → notify provider and give uterotonic → reassess. DETAILED RATIONALE — The atony sequence is a clinical decision at every step: firm it, clear it, keep it firm, support it, re-judge it. Two classic errors are built into the order — clots before firm, and drugs before the fixable bladder. PRIORITY FRAMEWORK — Nursing Process: sequence is treatment." });

BANK.push({ cat: "Uterine Atony, Bladder, and Subinvolution", type: "matrix", stem: "Four postpartum mothers carry different atony risk factors. Match each factor to the mechanism by which it weakens uterine contraction.", cols: ["Fibers stretched too far to clamp","Uterus pharmacologically relaxed","Contraction blocked by a full bladder"], rows: [
  { t: "Twins grew in her uterus through the pregnancy", a: 0, r: "Overdistention — two babies stretched the figure-eight fibers that must squeeze the placental-site vessels shut." },
  { t: "A uterus-relaxing (tocolytic) drug was given during her labor", a: 1, r: "Drug relaxation — a uterus still under a relaxing drug's effect may not clamp after birth; calcium gluconate is the chapter's counteragent." },
  { t: "She has not emptied her bladder since before the birth", a: 2, r: "Mechanical block — the distended bladder displaces the uterus and blocks its contraction until it is emptied." },
  { t: "Excess amniotic fluid stretched her uterus through the pregnancy", a: 0, r: "Overdistention again — excess fluid stretches the same fibers by the same mechanism as twins or a large baby." }
], tp: "ANSWER KEY — Correct matches: twins = stretched fibers; tocolytic in labor = pharmacologically relaxed; unemptied bladder = mechanical block; excess fluid = stretched fibers. DETAILED RATIONALE — Atony risk is mechanism-shaped: stretched muscle, relaxed muscle, and blocked muscle each earn a different fix — which is why sorting the factor correctly is the first step of the plan. PRIORITY FRAMEWORK — Risk stratification: the mechanism names the fix." });

S("Uterine Atony, Bladder, and Subinvolution", "A woman's bleeding continues on day 8 and her provider orders an ultrasound of the uterus. Which explanation by the nurse is correct?", [
  ["The ultrasound looks for retained placental fragments — pieces left behind can keep the uterus from sealing and drive this bleeding", true, "The chapter assigns ultrasound one job here: locate retained fragments when bleeding continues. Fragments are the Tissue T — they hold the placental site open."],
  ["The ultrasound measures how much blood is pooled inside the uterus so it can be drained", false, "Pooling is assessed at the bedside by fundus feel and flow. The imaging order in continuing bleeding is a search for a cause, not a measuring cup."],
  ["The ultrasound checks whether her bladder is full enough to be blocking contraction", false, "Bladder distention is a palpation and history finding — fundus high and off midline with no voiding. It does not need imaging to be acted on."],
  ["The ultrasound will show whether the bleeding is coming from a laceration of the cervix", false, "Lacerations are diagnosed by direct examination of the birth canal by the provider — there is no lab or imaging shortcut for a tear."]
], "ANSWER KEY — Correct answer: the ultrasound looks for retained placental fragments. DETAILED RATIONALE — Each diagnostic in the chapter has one assigned job: ultrasound locates fragments, examination finds tears, culture names organisms, and leg ultrasound confirms clots. Matching the test to its job is the tested skill. PRIORITY FRAMEWORK — Assessment accuracy: the right test for the suspected T.");

/* ================= Lacerations & hematomas standalone ================= */
S("Lacerations and Hematomas — Concealed Bleeding", "After a rapid labor, a woman's fundus is firm and midline, but a steady trickle of bright-red blood continues and her periurethral area is swollen. What is the most likely source, and what is the priority action?", [
  ["A laceration of the birth canal — notify the provider to examine and repair it, and keep her NPO in case anesthesia is needed", true, "The signature is exact: bright-red blood in a continuous trickle while the uterus stays firm, after a rapid labor. Tears of the perineum, vagina, cervix, or periurethral area bleed from pregnancy-engorged vessels, and repair is suturing — the provider's procedure."],
  ["Uterine atony — massage the fundus firmly and give a uterotonic, because a firm feel can be deceptive", false, "A firm, midline fundus has already answered the tone question. Massage and uterotonics contract a uterus; neither sutures a tear. Treating this as atony delays the repair."],
  ["A hematoma forming in the tissues — apply a cold pack to the perineum and reassess her in an hour", false, "A hematoma hides: its lochia looks normal and its calling cards are severe pain and pressure. Blood visibly trickling out is not collecting inside the tissues."],
  ["Normal lochia after a fast labor — change the pad, chart the amount, and reassess at the next round", false, "A continuous trickle is never charted away: the chapter warns that a slow trickle can quietly add up to as much loss as dramatic atony bleeding."]
], "ANSWER KEY — Correct answer: a birth-canal laceration — notify the provider for repair and keep her NPO. DETAILED RATIONALE — Firm fundus plus bright-red trickle is the chapter's cleanest discriminator, and rapid labor is a named trauma risk. The nurse's jobs are notification, NPO readiness, and continued quantification while the provider finds and sutures the tear. PRIORITY FRAMEWORK — Assessment to cause: the fundus feel splits tone from trauma.");

S("Lacerations and Hematomas — Concealed Bleeding", "A woman has a small vulvar hematoma found on assessment. She is uncomfortable but her vital signs are stable, the mass is not growing, and her lochia is normal. Which plan should the nurse anticipate?", [
  ["A cold pack on the area, analgesics for comfort, and close watching — small hematomas usually resolve on their own", true, "Size and behavior decide the plan: a small, stable hematoma is managed conservatively — cold limits bleeding and numbs pain, and most small collections resolve without a procedure."],
  ["Immediate incision and drainage in the operating room, because every hematoma must be opened", false, "Incision and drainage is the plan for larger or expanding hematomas. 'Every' fails — opening a small stable one adds a wound without a benefit."],
  ["Fundal massage and a uterotonic, because a vulvar mass means the uterus is not contracted", false, "The mass is in the vulvar tissues, not the uterus, and her lochia is normal. Uterotonics contract a uterus; they do not shrink a tissue collection."],
  ["A warm sitz bath now to draw the collected blood out through the skin", false, "Cold is the early measure for a fresh hematoma — it limits bleeding. Heat and sitz baths belong to later perineal comfort, not to an active collection."]
], "ANSWER KEY — Correct answer: cold pack, comfort measures, and watching — small hematomas usually resolve. DETAILED RATIONALE — Hematoma care is size-sorted: small and stable earns conservative care; large or expanding earns incision and drainage, vessel ligation, or packing. The discrimination is the finding's behavior, not its name alone. PRIORITY FRAMEWORK — Least invasive first: match the intervention to the size and the trend.");

M("Lacerations and Hematomas — Concealed Bleeding", "A woman 5 hours after a vaginal birth keeps asking for stronger pain relief, and the nurse gathers a focused assessment. Which findings point to a hematoma rather than ordinary perineal discomfort? Select all that apply.", [
  ["Severe pain that her prescribed analgesic has not relieved", true, "Pain out of proportion is the loudest hematoma clue in the chapter — pain that does not respond to analgesics is itself a finding, not a dosing problem."],
  ["A feeling of pressure in the vulva, pelvis, or rectum", true, "Pressure is the collection announcing its location — blood occupying tissue space presses on everything around it, including the rectum."],
  ["Inability to urinate despite a full-feeling bladder", true, "Pressure from the collection can block urination — the third member of the chapter's hematoma triad: pain, pressure, inability to void."],
  ["A bulging blue-purple mass on the vulva", true, "A visible hematoma shows as a tense, bulging, blue-purple mass — collected blood visible through the skin of the vulva."],
  ["A boggy fundus with heavy lochia and large clots", false, "That is the atony picture — a tone failure with visible flow. A hematoma's lochia characteristically looks normal while the loss hides."],
  ["Foul-smelling lochia with a tender, enlarged uterus", false, "That pair belongs to endometritis — an infection of the uterine lining, days later, not a tissue blood collection in the first hours."]
], "ANSWER KEY — Correct answers: unrelieved severe pain, vulvar/pelvic/rectal pressure, inability to void, and a bulging blue-purple mass. DETAILED RATIONALE — The hematoma triad plus the visible mass is the chapter's concealed-bleed signature. Every correct item is a pressure or pain cue; every distractor belongs to a different T with visible or infectious evidence. PRIORITY FRAMEWORK — Recognize cues: pain out of proportion is data, not drama.");

S("Lacerations and Hematomas — Concealed Bleeding", "Six hours after a vacuum-assisted birth, a woman's lochia is scant and looks normal, but her pulse has risen from 86 to 120, her respirations are up, and she rates her deep pelvic pain 10 out of 10 despite analgesics. What should the nurse suspect and do?", [
  ["A deep vaginal hematoma collecting where it cannot be seen — report the vital-sign trend and the unrelieved pain to the provider now", true, "Deep vaginal hematomas cannot be seen — the evidence is the concealed-loss pattern: normal-looking lochia while pulse and respirations climb and pain breaks through analgesics. The visible pad number underestimates this loss."],
  ["Normal recovery from an instrument birth — reassure her that deep pain is expected and recheck at the next round", false, "Instrument births do hurt — mildly, and eased by mild analgesics. Pain at 10 out of 10 with a 34-point pulse climb is the chapter's escalation picture, not recovery."],
  ["A urinary tract infection starting — push fluids and obtain a urine specimen before notifying anyone", false, "There are no urinary cues — no burning, urgency, or fever — and the timeline is hours, not days. Fluids and a specimen do not answer a bleeding trend."],
  ["Uterine atony with blood pooling — massage the fundus and express any clots you find", false, "Her lochia is scant and there is no boggy-fundus cue; pooling inside a relaxed uterus shows a soft, high, unfindable fundus. The pain-plus-vitals pattern with normal lochia names tissue, not tone."]
], "ANSWER KEY — Correct answer: a concealed deep hematoma — report the trend and the unrelieved pain now. DETAILED RATIONALE — Concealed bleeding is the chapter's hardest discrimination: the pad lies, the vital signs tell the truth. Rising pulse and respirations with severe, poorly relieved pain and normal lochia is the hematoma signature until the provider proves otherwise. PRIORITY FRAMEWORK — ABCs / circulation: trust the trend over the pad.");

BANK.push({ cat: "Lacerations and Hematomas — Concealed Bleeding", type: "matrix", stem: "The nurse reviews four postpartum assessments from the night shift. Match each woman to the bleeding source her findings describe.", cols: ["Uterine atony","Laceration","Hematoma","Retained fragments"], rows: [
  { t: "Fundus soft and high, heavy lochia with large clots, 30 minutes after the birth of a very large baby", a: 0, r: "Atony — the overstretched uterus has not clamped; massage, bladder, and uterotonics are the fix." },
  { t: "Fundus firm, continuous bright-red trickle, 1 hour after a forceps-assisted birth", a: 1, r: "Laceration — a tear bleeding through engorged vessels while the uterus stays contracted; repair is suturing." },
  { t: "Fundus firm, lochia normal, pain 9 of 10 unrelieved, pressure in the rectum, cannot void", a: 2, r: "Hematoma — blood collecting in the tissues: the triad of severe pain, pressure, and inability to void." },
  { t: "Day 10: bright-red bleeding returns after lochia had faded, with pelvic heaviness and fatigue", a: 3, r: "Retained fragments — the late-bleeding tissue picture; fragments keep the uterus from sealing." }
], tp: "ANSWER KEY — Correct matches: soft + heavy + clots = atony; firm + trickle = laceration; firm + normal lochia + triad = hematoma; day-10 red return = retained fragments. DETAILED RATIONALE — Four sources, four signatures: fundus feel splits tone from trauma, lochia volume splits visible from concealed, and the calendar splits early from late. PRIORITY FRAMEWORK — Assessment to cause: find which source is bleeding and fix that one." });

BANK.push({ cat: "Lacerations and Hematomas — Concealed Bleeding", type: "dropdown", stem: "Complete the care plan for three postpartum patients.<br>Patient 1 — A woman with a small, stable perineal hematoma and severe localized pain receives first:<br>[[0]]<br>Patient 2 — A woman whose fundus is firm while a continuous bright-red trickle continues receives:<br>[[1]]<br>Patient 3 — A woman with a large, expanding hematoma whose pulse is climbing receives:<br>[[2]]", blanks: [
  { o: [ { t: "A cold pack on the hematoma, with analgesics and close watching", c: true, r: "Cold limits bleeding and numbs pain, and small hematomas usually resolve on their own — no provider order is needed to start." }, { t: "A warm sitz bath to increase circulation to the area", c: false, r: "Heat belongs to later perineal healing; on a fresh collection it encourages the bleeding the cold pack limits." }, { t: "Fundal massage until the uterus is firm", c: false, r: "Her problem is in the tissues, not the uterus — massage treats a soft fundus she does not have." } ] },
  { o: [ { t: "Provider notification to examine and suture the tear, keeping her NPO", c: true, r: "A firm fundus with a trickle names a laceration — repair is mechanical, and NPO protects a possible anesthetic." }, { t: "A uterotonic to contract the uterus more firmly", c: false, r: "The uterus is already firm. A uterotonic cannot close a tear in the birth canal." }, { t: "Reassurance that a trickle is too slow to matter, with a pad change", c: false, r: "The chapter warns a slow trickle can add up to as much loss as dramatic atony bleeding." } ] },
  { o: [ { t: "Preparation for incision and drainage of the clots, vessel ligation, or packing", c: true, r: "Large or expanding hematomas are opened and drained, with ligation or packing — size and growth change the plan." }, { t: "A cold pack alone, since all hematomas resolve without a procedure", c: false, r: "Small ones do. An expanding one with a climbing pulse is losing blood into tissue faster than conservative care can answer." }, { t: "Antibiotics, since an expanding mass with a rising pulse means infection", c: false, r: "Her pulse is climbing from volume loss, not fever — there are no infection cues, and antibiotics do not evacuate a collection." } ] }
], tp: "ANSWER KEY — Correct completions: small hematoma = cold pack and watching; firm fundus with trickle = provider repair, NPO; large expanding hematoma = incision and drainage / ligation / packing. DETAILED RATIONALE — Three patients, three sizes of the same family: conservative for small and stable, mechanical repair for a tear, surgical evacuation for large and growing. PRIORITY FRAMEWORK — Least invasive first, escalated by size and trend." });

S("Lacerations and Hematomas — Concealed Bleeding", "Before discharge, a woman who had a significant perineal laceration repaired asks what problems she should watch for in the months ahead. Which statement by the nurse is correct?", [
  ["Genital trauma can have late effects — a sagging of the bladder or uterus, or leaking urine — so report new pressure, bulging, or leaking", true, "The chapter names the long-term fallout of genital trauma: cystocele, prolapsed uterus, and urinary incontinence. Teaching her the late list is part of the repair's aftercare."],
  ["Once the sutures heal there are no late effects from a tear — the area returns completely to normal", false, "'No late effects' is the false reassurance. The chapter lists structural late effects precisely so they are watched for, not dismissed."],
  ["The main late effect to watch for is heavy bleeding returning in the first week at home", false, "Red bleeding returning in the first weeks is the late-PPH warning — a different list, for retained fragments and subinvolution. Her question is about the trauma she actually had."],
  ["Leaking urine after a repair always means the sutures have come apart and needs emergency care tonight", false, "Incontinence is listed as a late effect to report and evaluate — not as proof of a separated repair or a tonight emergency. Overstating it manufactures panic."]
], "ANSWER KEY — Correct answer: watch for cystocele, uterine prolapse, and urinary incontinence. DETAILED RATIONALE — Discharge teaching for trauma includes the long horizon: the same pelvic structures torn at birth support the bladder and uterus for years, and their late failures are named in the chapter. PRIORITY FRAMEWORK — Patient teaching: teach the timeline she will actually live, early and late.");

/* ================= Infections standalone ================= */
S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "Two mothers have elevated temperatures. Mother A: 38.1 °C once, 10 hours after birth, no other findings, drinking poorly. Mother B: 38.3 °C on day 3 and again on day 4, with a higher-than-expected pulse. Which interpretation is correct?", [
  ["Mother B meets the puerperal fever pattern and needs a workup; Mother A's single early elevation is often dehydration, still checked for infection signs", true, "Puerperal fever is 38 °C or higher after the first 24 hours, on at least 2 days within the first 10 days — Mother B's pattern exactly. A slight elevation in the first 24 hours is often dehydration, with infection signs checked whenever the temperature is up."],
  ["Both mothers have puerperal fever, because any single reading at or above 38 °C after birth qualifies on its own, whatever the day or the pattern", false, "The definition has three gates — height, timing after the first 24 hours, and repetition on at least 2 days. Mother A fails two of the three."],
  ["Neither mother is infected, because postpartum temperatures up to 38.5 °C in the first ten days are always dehydration and never need a workup", false, "'Always' fails on Mother B: her pattern meets the fever definition on days 3 and 4, and her pulse is traveling with it — the infection pair."],
  ["Mother A is the emergency — the earliest fever after birth is always the most dangerous one, and it should be treated as an infection until she delivers proof otherwise", false, "Earliest is not most dangerous; pattern is. A single first-day elevation with no other signs is the dehydration picture the chapter describes."]
], "ANSWER KEY — Correct answer: Mother B meets puerperal fever; Mother A's early single elevation is often dehydration, still checked. DETAILED RATIONALE — Definitions in this chapter are discrimination tools: height, timing, and repetition together separate a hydration footnote from an infection workup, and the pulse traveling with the fever strengthens the call. PRIORITY FRAMEWORK — Assessment accuracy: apply all three gates of the definition.");

S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "A woman on postpartum day 2 has a white blood cell count of 26,400/mm³. She is afebrile, her uterus is nontender, her lochia has no foul odor, and she feels well. How should the nurse interpret the count?", [
  ["It cannot prove infection by itself — white cells normally run 20,000–30,000/mm³ in the early postpartum period, so the whole picture decides", true, "The chapter's WBC trap: the early-postpartum range is 20,000–30,000/mm³, so the count alone cannot diagnose infection. Upper-range values grow more suspicious only when the clinical picture joins them — hers does not."],
  ["She has an infection — a count that high always means bacteria, so antibiotics should be started now", false, "'Always' is the trap word. In a non-postpartum patient this count would alarm; after birth it sits inside the stated normal range."],
  ["The count proves she is protected — white cells that high mean her body has already beaten any infection", false, "A normal-range count is neither an infection diagnosis nor a protection certificate. It is one value that must be read with temperature, tenderness, odor, and pulse."],
  ["The result must be a lab error — white cells never rise above 20,000 without an infection after birth", false, "The chapter's stated early-postpartum range reaches 30,000/mm³. Calling a normal value an error discards the chapter's own numbers."]
], "ANSWER KEY — Correct answer: the count alone cannot prove infection — the range is normally 20,000–30,000/mm³ early postpartum. DETAILED RATIONALE — Postpartum numbers play by shifted rules: the WBC that would diagnose infection elsewhere is physiology here. Infection is diagnosed by the pattern — fever by the definition, tenderness, odor, wound findings, and a pulse traveling with the temperature. PRIORITY FRAMEWORK — Assessment accuracy: a number is a cue, not a conclusion.");

BANK.push({ cat: "Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", type: "matrix", stem: "On morning rounds the nurse compares four febrile mothers. Match each mother to the infection site her findings name.", cols: ["Endometritis","Wound infection","Urinary tract infection","Mastitis"], rows: [
  { t: "Day 4: fever, tender enlarged uterus, foul-smelling lochia, prolonged severe cramping", a: 0, r: "Endometritis — the uterine cluster: tenderness, size, foul lochia, and cramping, treated with a uterine culture and IV antibiotics first." },
  { t: "Day 5 after cesarean birth: incision red and hot, suture line separating, purulent drainage", a: 1, r: "Wound infection — REEDA fails at the site: discharge and lost approximation, cultured from the drainage." },
  { t: "Day 3: burning, urgency, and frequency when voiding, with a low-grade fever", a: 2, r: "Cystitis — the bladder-level urinary picture: voiding symptoms with only a low-grade fever, before any ascent." },
  { t: "Week 3 of breastfeeding: one hot, red, tender patch on one breast, fever and chills", a: 3, r: "Mastitis — one localized breast area at 2–3 weeks, through the cracked-nipple door; keep the milk moving." }
], tp: "ANSWER KEY — Correct matches: uterine cluster = endometritis; separating purulent incision = wound; burning/urgency/frequency = urinary; one hot red breast patch at week 3 = mastitis. DETAILED RATIONALE — The four sites share one family rule — culture first, antibiotics, keep drainage moving (lochia, urine, or milk) — but each declares itself at its own address with its own signature. PRIORITY FRAMEWORK — Assessment to site: the address names the management." });

S("Postpartum Infections — Uterus, Wound, Urinary Tract, Breast", "A breastfeeding mother with mastitis in her left breast says, 'I am stopping nursing on that side until this clears — the milk must be infected.' Which statement by the nurse is correct?", [
  ["Keep nursing or pumping on that side — the milk itself is not contaminated, and stopping causes engorgement and stasis that make the infection worse", true, "The chapter's mastitis rule in one line: never wean during mastitis. Emptying is treatment, the milk is not contaminated, and starting the feed on the uninfected side triggers let-down before switching."],
  ["She is right — rest the infected breast completely and nurse only from the other side until the redness is gone", false, "A rested breast is a static breast: milk that is not emptied feeds the engorgement-and-stasis cycle that grows the infection. Rest is the trap answer."],
  ["Pump and discard the milk from that side until the antibiotic course is finished", false, "Discarding treats the milk as contaminated — the chapter states it is not. Pumping is right; the discard is the error."],
  ["Wean completely now — mastitis means breastfeeding has failed and formula is safer from here", false, "Mastitis is a complication of breastfeeding, not its failure. Abrupt weaning worsens stasis and is the opposite of the chapter's management."]
], "ANSWER KEY — Correct answer: keep emptying that breast — never wean during mastitis. DETAILED RATIONALE — Teaching items test the family's counterintuitive rule: at every infection site, drainage keeps moving. For the breast that means nursing or pumping often, moist heat before feeds, massage of the tender area, and a supportive — not tight — bra. PRIORITY FRAMEWORK — Patient teaching: correct the plan that would worsen the disease.");

/* ================= Thromboembolism standalone ================= */
S("Thromboembolism — SVT, DVT, and Pulmonary Embolism", "A woman on day 2 has a painful, hard, reddened, warm vein visible along her lower leg. Both calves measure the same, she has no calf tenderness or edema, and she is breathing comfortably. Which plan fits her problem?", [
  ["Analgesics, local heat, and leg elevation — a superficial vein thrombosis needs no anticoagulant", true, "The visible, hard, warm, reddened saphenous vein with equal leg measurements is SVT. The book's plan is analgesics, local heat, and elevation to encourage venous drainage — anticoagulation is the DVT layer, not this one."],
  ["Start heparin anticoagulation now — any postpartum leg vein finding is treated as a deep clot until imaging returns", false, "Depth is the discrimination: a visible superficial vein with no deep signs is a different member of the family with a different, lighter plan."],
  ["Measure her legs every hour and keep her in bed until the vein softens", false, "Bed rest feeds venous stasis — the family's first risk factor. Her plan is elevation plus the unit's early-ambulation prevention, not immobility."],
  ["Apply a cold pack and a tight compression wrap to shrink the vein", false, "The chapter's SVT measures are heat and elevation, and a tight or kinked wrap worsens flow — the stocking trap in another form."]
], "ANSWER KEY — Correct answer: analgesics, local heat, and leg elevation — no anticoagulant for SVT. DETAILED RATIONALE — The clot family is depth-sorted: superficial earns comfort measures, deep earns the same plus anticoagulation, and a traveled clot earns an emergency. The visible vein and equal measurements are the cues that keep her in the first row. PRIORITY FRAMEWORK — Assessment to depth: the depth names the drug decision.");

S("Thromboembolism — SVT, DVT, and Pulmonary Embolism", "A woman's leg ultrasound confirms a deep venous thrombosis. Earlier, her Homans' sign — calf pain on dorsiflexion — had been negative, and a colleague asks why the clot was not ruled out then. Which statement by the nurse is correct?", [
  ["Homans' sign is not reliable postpartum — a negative result never rules out a DVT; circumference, symptoms, and ultrasound make the call", true, "The chapter states the limit plainly: Homans' has limited postpartum value, and a positive can even be a strained muscle from delivery positioning. Imaging, not the maneuver, confirms the clot."],
  ["The Homans' must have been done incorrectly — a properly performed sign is positive in every deep clot", false, "'Every' is the error. The sign's unreliability is a property of the test, not of the technique — which is why the chapter demotes it."],
  ["The clot must have formed after the Homans' check, since a negative sign is valid for that day", false, "A negative sign carries no validity window because it carries no ruling-out power at all. The leg measurements and symptoms were the evidence to follow."],
  ["Ultrasound over-detects — a negative Homans' should outweigh one positive ultrasound image", false, "The hierarchy runs the other way: clinical symptoms plus venous ultrasound are the more reliable diagnostics the chapter names."]
], "ANSWER KEY — Correct answer: Homans' is unreliable postpartum — ultrasound confirms the DVT. DETAILED RATIONALE — This is the chapter's diagnostic trap in dialogue form: the traditional sign feels like an answer and is not one. Circumference difference over 2 cm with redness, tenderness, and edema earns the report; ultrasound earns the diagnosis. PRIORITY FRAMEWORK — Assessment accuracy: know what each test cannot do.");

S("Thromboembolism — SVT, DVT, and Pulmonary Embolism", "On day 5 after a cesarean birth, a woman reports feeling faint, with palpitations, a cough producing blood-streaked sputum, and a low-grade fever. She has no dramatic chest pain. Which action is correct?", [
  ["Report it at once as a possible pulmonary embolism — a small embolism can present vaguely, without dramatic chest pain", true, "The chapter's small-PE picture is exactly this: shortness of breath, palpitations, bloody sputum (hemoptysis), faintness, and low-grade fever. Vague does not mean safe — any dyspnea or chest symptom postpartum is PE until proven otherwise."],
  ["Reassure her — without sharp chest pain and severe breathlessness, an embolism is effectively ruled out", false, "That rules out only the large-PE picture. The chapter warns the small embolism whispers — and her whisper includes hemoptysis after a cesarean birth."],
  ["Give her prescribed pain medication and recheck her in an hour to see whether the symptoms settle", false, "An hour of watching is how a traveling clot wins. PE symptoms are reported immediately — the chapter's wording is 'do not wait and watch.'"],
  ["Sit her up and encourage fluids — faintness and palpitations on day 5 are usually dehydration", false, "Dehydration does not streak sputum with blood. The hemoptysis cue removes this from the fluids category and places it in the emergency one."]
], "ANSWER KEY — Correct answer: report at once — a small PE presents vaguely. DETAILED RATIONALE — PE has two volumes in this chapter: the collapse picture (sudden chest pain, cough, dyspnea, falling consciousness) and the vague picture (palpitations, hemoptysis, faintness, low-grade fever). Both earn the same immediate report. PRIORITY FRAMEWORK — ABCs / safety: the vague version of a lethal problem is still the lethal problem.");

M("Thromboembolism — SVT, DVT, and Pulmonary Embolism", "A charge nurse is writing the postpartum unit's clot-prevention checklist. Which measures belong on it? Select all that apply.", [
  ["Early and frequent ambulation for every mother, starting as soon as she is able", true, "Early ambulation is the family's big prevention — it attacks venous stasis, the first stacked risk factor, and continues for weeks while clotting factors stay elevated."],
  ["Range-of-motion and leg exercises — flexing and extending the feet — for mothers in bed", true, "Simple flex-and-extend leg exercises keep blood moving in the bed-bound mother until ambulation is established."],
  ["Teach her not to cross her legs, and avoid pressure behind the knee when her legs are elevated", true, "Crossed legs and popliteal pressure compress the veins she is trying to drain — the chapter names both in its prevention teaching."],
  ["Pad the stirrups so they do not press the angle behind the knee during repairs", true, "Pressure behind the knees from stirrup leg supports is a named, preventable contributor — padding is a checklist-level fix."],
  ["Keep mothers on strict bed rest for the first 48 hours to protect their repairs", false, "Bed rest is a risk factor, not a protection — the chapter stacks varicose veins and bed rest onto the risk side. Prevention is movement."],
  ["Roll antiembolic stockings down like a cuff when they feel too tight at the top", false, "A rolled or kinked stocking makes flow worse — correct application is the teaching point, and a cuff is the incorrect version."]
], "ANSWER KEY — Correct answers: early ambulation, leg exercises, no leg-crossing or popliteal pressure, and padded stirrups. DETAILED RATIONALE — Prevention is the real nursing win in this family: every correct item removes stasis or vessel pressure, and both distractors reverse a prevention rule into a risk. Clotting factors stay elevated for weeks, so the measures outlast the birth. PRIORITY FRAMEWORK — Prevention: the checklist is the treatment that happens before the disease.");

BANK.push({ cat: "Thromboembolism — SVT, DVT, and Pulmonary Embolism", type: "order", stem: "A postpartum woman reports new leg pain, and the nurse's measurement shows one calf more than 2 cm larger than the other, with redness and tenderness. Place the nurse's actions in the correct order.", items: [
  { t: "Measure both legs and compare circumference, redness, tenderness, and edema", r: "Comparison is the assessment: one leg against the other turns 'sore leg' into a reportable measurement." },

S("Postpartum Mood Disorders — Blues, Depression, Psychosis", "A husband calls the unit on day 7: his wife has not slept in two days, is hyperactive and euphoric, and insists their healthy baby died and was replaced. He asks whether they should 'watch it over the weekend.' Which response is correct?", [

function $(id) { return document.getElementById(id); }
function shuffle(a) { var i, j, t; for (i = a.length - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function copy(o) { return JSON.parse(JSON.stringify(o)); }
function letter(i) { return String.fromCharCode(65 + i); }

function build() {
  var units = [], gmap = {}, i, k, q, flat = [];
  for (i = 0; i < BANK.length; i++) {
    q = copy(BANK[i]);
    if (q.grp) {
      if (!gmap[q.grp]) { gmap[q.grp] = []; units.push(gmap[q.grp]); }
      gmap[q.grp].push(q);
    } else { units.push([q]); }
  }
  if (S.shuf) { shuffle(units); }
  for (i = 0; i < units.length; i++) { for (k = 0; k < units[i].length; k++) { flat.push(units[i][k]); } }
  Q = flat;
  S.resp = []; S.touched = []; S.checked = []; S.flag = [];
  for (i = 0; i < Q.length; i++) {
    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { shuffle(q.opts); S.resp.push(-1); }
    else if (q.type === "multi") { shuffle(q.opts); S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { shuffle(q.blanks[k].o); d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}

  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order<br><span class="small">Answer choices always shuffle, even dropdowns. Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
</body>
</html>
