BANK.push({ cat: CA, type: "single",
  stem: "Which statement accurately describes medical asepsis?",
  opts: [ O("It destroys every microorganism and spore on the objects and surfaces used", false, "That describes surgical asepsis, the sterile technique, not the clean technique."), O("It limits the growth and transmission of pathogenic microorganisms in care", true, "Correct. Medical asepsis is the clean technique used in many daily activities to limit growth and transmission."), O("It is reserved for the operating room and for major diagnostic procedure areas", false, "Sterile technique is the one used in specialized areas and invasive procedures."), O("It removes the need for hand hygiene whenever gloves are worn during patient care", false, "Hand hygiene remains essential; gloves never replace it in either technique.") ],
  tp: "Medical = clean, limits growth and transmission. Surgical = sterile, destroys all microorganisms and spores." });

BANK.push({ cat: CA, type: "single",
  stem: "Which procedure is performed using surgical asepsis?",
  opts: [ O("Assisting a stable patient with a morning bath and oral hygiene care", false, "Bathing and oral care are daily activities performed with medical asepsis."), O("Taking routine vital signs on a patient admitted for observation only", false, "Vital signs are routine care under clean technique, not sterile technique."), O("Inserting an indwelling urinary catheter into a postoperative patient", true, "Correct. Urinary catheter insertion is a chapter example of an invasive procedure requiring sterile technique."), O("Serving a meal tray and helping the patient sit up in a bedside chair", false, "Meal service and positioning are daily activities under medical asepsis.") ],
  tp: "Surgical asepsis examples: urinary catheter insertion, wound care, and injections." });

BANK.push({ cat: CA, type: "single",
  stem: "Which sequence correctly lists the six links of the chain of infection in order?",
  opts: [ O("Reservoir, agent, host, entry, transmission, and then the portal of exit last", false, "The agent comes first and the host is the final link, not an early one."), O("Agent, reservoir, portal of exit, transmission, portal of entry, and host", true, "Correct. Walk the chain in that order; breaking any single link stops transmission."), O("Transmission, entry, agent, reservoir, portal of exit, and the host last", false, "Transmission is the fourth link; it cannot precede the agent and reservoir."), O("Host, agent, portal of entry, reservoir, transmission, and portal of exit", false, "The host is the last link in the chain, the susceptible person or animal reached.") ],
  tp: "Chain order: Agent, Reservoir, Exit, Transmission, Entry, Host. Break one link and transmission stops." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement about a reservoir is accurate?",
  opts: [ O("It is any natural habitat promoting growth and reproduction of microorganisms", true, "Correct. A reservoir supplies the food, oxygen, water, light, temperature, and pH a pathogen needs to grow."), O("It is the route a pathogen uses to leave the body of an infected person or animal", false, "A route out of the reservoir is the portal of exit, a separate link in the chain."), O("It is an inanimate object that has been contaminated during routine patient care", false, "An inanimate carrier object is a fomite; a reservoir is the habitat where the pathogen grows."), O("It is the living person whose resistance determines whether infection develops", false, "That describes the host, the final link, whose susceptibility completes the chain.") ],
  tp: "Named reservoirs hiding in plain sight: unwashed hands, wound drainage, soiled linen, and decaying teeth." });

BANK.push({ cat: CA, type: "single",
  stem: "Which example belongs to the portal of exit link of the chain?",
  opts: [ O("A contaminated needle puncturing skin and entering the bloodstream directly", false, "Entry through punctured skin belongs to the portal of entry link."), O("Body fluids leaving through the gastrointestinal and genitourinary systems", true, "Correct. Exit routes are body fluids from the GI and genitourinary systems, or an open area on the body."), O("A blood pressure cuff carrying organisms from one patient across the unit", false, "A contaminated cuff is a fomite, part of the transmission link of the chain."), O("A patient with weakened immunity becoming infected after a brief exposure", false, "Weakened resistance describes the susceptible host, the final link in the chain.") ],
  tp: "Exit and entry use the same set of routes; direction decides the link." });

BANK.push({ cat: CA, type: "multi",
  stem: "Which factors increase a patient's risk of acquiring an infection in a health care facility? Select all that apply.",
  opts: [ O("Chemotherapy or radiation treatment for a diagnosed cancer condition", true, "Correct. Cancer treatments are printed risk boosters because they reduce immunologic function."), O("High blood glucose in a patient living with diabetes mellitus daily", true, "Correct. High glucose encourages bacterial growth, raising this patient's infection risk."), O("Open areas on the skin found during the admission skin assessment", true, "Correct. Open skin areas break the first line of defense and raise infection risk."), O("Immunosuppressant therapy given for an autoimmune disease process", true, "Correct. Immunosuppressant therapy is a printed risk booster in this chapter."), O("A fully intact skin barrier with no breaks, cuts, or abrasion present", false, "Intact skin is the body's first line of defense; it lowers risk rather than raising it."), O("Up-to-date immunizations documented in the patient's admission record", false, "Immunizations reduce susceptibility to infectious diseases; they do not raise risk.") ],
  tp: "Other printed risk boosters: lack of sleep, poor nutrition, increased stress, and certain antibiotics." });

BANK.push({ cat: CA, type: "single",
  stem: "Which statement accurately describes asepsis itself?",
  opts: [ O("It is the absence of pathogenic, disease-producing microorganisms", true, "Correct. Every infection-control practice in this chapter is a way of accomplishing asepsis."), O("It is the presence of infectious material on an object or a surface", false, "Presence of infectious material is contamination, the opposite condition."), O("It is a protective vascular reaction at the site of a cellular injury", false, "A protective vascular reaction at an injury site is inflammation, not asepsis."), O("It is the disease-causing power a microorganism shows inside a host", false, "Disease-causing power is virulence, a property of the microorganism itself.") ],
  tp: "Asepsis is the goal; medical and surgical asepsis are the two techniques that accomplish it." });

BANK.push({ cat: CB, type: "single",
  stem: "A slide keeps its color after the solvent step of a Gram stain. Which result is accurate?",
  opts: [ O("The organism is gram-negative because the solvent removed the dye color", false, "Gram-negative organisms lose the color when the solvent is applied to the slide."), O("The organism is gram-positive because the applied dye color was retained", true, "Correct. Retained color after solvent is gram-positive; removed color is gram-negative."), O("The organism requires acid-fast staining before any result can be reported", false, "Acid-fast staining is a special technique for organisms such as Mycobacterium tuberculosis."), O("The organism is a spore former because the capsule held the dye in place", false, "Gram results come from dye retention, not from spore or capsule formation.") ],
  tp: "Gram stain is the most common identification method: retained = gram-positive, removed = gram-negative." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about a bacterial spore is accurate?",
  opts: [ O("It is a round body, wrapped in a capsule, highly resistant to heat", true, "Correct. The spore enlarges to the size of the cell, gains a capsule, and resists heat and disinfectants."), O("It is a hairlike projection that propels the cell in a wavelike motion", false, "Hairlike projections that propel the cell are flagella, not spores."), O("It is a dye reaction that separates bacteria into two large groupings", false, "A dye reaction describes the Gram stain, an identification method."), O("It is a chain formation seen when spherical bacteria grow linked together", false, "Spherical bacteria growing in chains are streptococci, a growth pattern.") ],
  tp: "Spore-formers break shortcuts: agents and heat that kill ordinary bacteria do not reliably kill spores." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement explains how a bacterial capsule promotes antibiotic resistance?",
  opts: [ O("The capsule speeds the drug through the cell so it cannot act on it", false, "The capsule blocks the drug rather than speeding it through the cell."), O("The capsule prevents the drug from reaching the bacteria inside it", true, "Correct. The capsule shields the bacteria within it so the drug cannot reach and destroy them."), O("The capsule converts the antibiotic into a nutrient the bacteria use", false, "The chapter gives no conversion role to the capsule; it is a barrier."), O("The capsule raises the patient's temperature so the drug breaks down", false, "Fever is a host response; the capsule acts at the bacterial cell itself.") ],
  tp: "Capsule = shield. That is why the sensitivity report, not habit, decides the drug." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement accurately describes the sensitivity portion of a culture and sensitivity test?",
  opts: [ O("The laboratory tests the bacteria against several antibiotics and notes results", true, "Correct. Sensitivity testing shows which antibiotics work against the identified organism."), O("The nurse tests the patient's skin reaction before the first dose is administered", false, "Sensitivity here is a laboratory test on the bacteria, not a skin test on the patient."), O("The provider ranks antibiotics by cost before the culture result is available yet", false, "The first prescription is experience-based; the sensitivity report then guides adjustment."), O("The laboratory measures antibody levels in the blood of the exposed health worker", false, "Antibody measurement is titer testing, a different laboratory study in this chapter.") ],
  tp: "Sequence: collect, culture on a medium that promotes growth, sensitivity test, then prescribe or adjust." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about culture and sensitivity timing is accurate?",
  opts: [ O("Results are usually ready within one hour of the specimen reaching the laboratory", false, "Results may take up to 3 days; that delay is why response monitoring matters."), O("Results may take up to 3 days, so the first antibiotic is experience-based at first", true, "Correct. The practitioner prescribes first from experience, then adjusts when results return."), O("Antibiotics are withheld from every patient until the final report is on the chart", false, "Treatment starts on experience; it is not held for up to 3 days awaiting the report."), O("A later antibiotic change proves the first prescription was a medication error made", false, "A later change is the system working as designed, not evidence of an error.") ],
  tp: "Monitor the patient's response to the first antibiotic while the C&S is pending; alert the provider on a resistant report." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement accurately describes a virus?",
  opts: [ O("It is a complete cell carrying both RNA and DNA inside a protein shell wall", false, "Viruses are not complete cells and carry either RNA or DNA, never both."), O("It holds either RNA or DNA in a protein shell and must enter a cell to copy itself", true, "Correct. A virus depends on the metabolic processes of the cell it enters to reproduce."), O("It belongs to the plant kingdom and makes its own food from light and water daily", false, "That description fits fungi, which cannot produce their own food either."), O("It is a single-celled animal spread mainly by insects and animal carriers here", false, "Single-celled animals spread by insects and animals are protozoa, not viruses.") ],
  tp: "Viruses are the smallest known disease agents, and antibiotics are not effective against them." });

BANK.push({ cat: CB, type: "multi",
  stem: "Which illnesses does the chapter attribute to protozoa? Select all that apply.",
  opts: [ O("Malaria, carried to the patient through a mosquito vector exposure", true, "Correct. Plasmodium falciparum is the chapter's protozoan example for malaria."), O("Amebic dysentery, from a protozoan living in the large intestine", true, "Correct. Entamoeba histolytica in the large intestine causes diarrhea and colitis."), O("African sleeping sickness, spread as a parasitic protozoan disease", true, "Correct. African sleeping sickness is one of the three protozoan illnesses named."), O("Influenza, an illness of the respiratory tract during winter months", false, "Influenza is a viral illness, not a protozoan one."), O("Thrush of the mouth, a superficial infection of the mucous membranes", false, "Thrush is caused by Candida albicans, a fungus, not a protozoan.") ],
  tp: "Protozoa are single-celled animals; their parasitic forms are spread by insects and animals." });

BANK.push({ cat: CB, type: "single",
  stem: "Which statement about fungi is accurate?",
  opts: [ O("They produce their own food and rarely cause infection in any patient group", false, "Fungi cannot produce their own food, and they are among the most common infections."), O("They belong to the plant kingdom but cannot produce their own food supply", true, "Correct. Yeasts and molds cause the common superficial fungal infections."), O("They are the smallest agents known and must enter a living cell to reproduce", false, "Smallest agents that must enter a cell describes viruses, not fungi."), O("They respond reliably to the same antibiotics chosen for bacterial infections", false, "Fungal infections call for antifungal agents within the antimicrobial family, matched to the organism.") ],
  tp: "Superficial fungal infections can penetrate deeper and become fatal in an immunocompromised patient." });

BANK.push({ cat: CC, type: "single",
  stem: "Which item is a fomite in a patient care area?",
  opts: [ O("A blood pressure cuff carried from one patient's room to another room", true, "Correct. Cuffs, stethoscopes, keyboards, charts, and soiled linen are the chapter's named fomites."), O("A patient who contracted an illness and now transmits it to a roommate", false, "A person who transmits illness is a carrier, not an inanimate fomite."), O("A habitat where a pathogen finds food, water, and the right temperature", false, "A growth habitat is a reservoir; a fomite is the contaminated object itself."), O("A body fluid leaving through the genitourinary system of the patient", false, "Body fluid leaving the body belongs to the portal of exit link.") ],

BANK.push({ cat: CC, type: "single",
  stem: "Which statement accurately describes the urinary tract defense against infection?",
  opts: [ O("Gastric acidity chemically destroys organisms that reach the bladder daily", false, "Gastric acidity is the GI tract defense, not the urinary tract defense."), O("The flushing action of urine flow washes organisms off the bladder lining", true, "Correct. Urine flow washes microorganisms off the lining of the bladder and urethra."), O("Cilia and mucus trap organisms and sweep them outward from the urethra", false, "Cilia and mucus are the respiratory tract defense mechanism."), O("Sebum on the skin surface kills bacteria that contact the urinary meatus", false, "Sebum is part of the skin defense, not the urinary tract defense.") ],

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
