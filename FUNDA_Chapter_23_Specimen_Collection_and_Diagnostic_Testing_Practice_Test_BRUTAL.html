BANK.push({ cat: CE, type: "multi", grp: "case1", scen: "CASE STUDY — Mrs. Rosa Delgado, 71, is admitted with a temperature of 101.8 F (38.8 C), chills, a productive cough producing thick yellow-green sputum, and a leg wound draining purulent exudate. Her white blood cell count is elevated. Orders include blood cultures from two sites, a sputum culture, a wound culture, a midstream urine culture, and a first dose of IV antibiotic to be given as soon as the cultures are obtained.",
  stem: "CASE STUDY 1 of 6 — RECOGNIZE CUES: Which findings in Mrs. Delgado's presentation require follow-up by the nurse? Select all that apply.",
  opts: [ O("Temperature of 101.8 F with accompanying chills", true, "Correct. Fever with chills is the classic presentation that accompanies bacteremia and triggers blood cultures."), O("Thick, yellow-green sputum produced by her cough", true, "Correct. Thick, colored sputum is a true sputum finding pointing to a respiratory source."), O("Purulent exudate draining from the leg wound", true, "Correct. Purulent drainage signals wound infection and the need for a wound culture."), O("An elevated white blood cell count on her laboratory results", true, "Correct. An elevated WBC supports a possible systemic infection."), O("Her statement that she slept through the night without waking", false, "Incorrect. Sleeping through the night is not a cue of infection or deterioration.") ],
  tp: "Framework: Nursing Process/ADPIE (assessment first). Fever, chills, purulent drainage, colored sputum, and elevated WBC are the recognizable cues of infection in this chapter." });

BANK.push({ cat: CE, type: "single", grp: "case1", scen: "CASE STUDY — Mrs. Rosa Delgado, 71, is admitted with a temperature of 101.8 F (38.8 C), chills, a productive cough producing thick yellow-green sputum, and a leg wound draining purulent exudate. Her white blood cell count is elevated. Orders include blood cultures from two sites, a sputum culture, a wound culture, a midstream urine culture, and a first dose of IV antibiotic to be given as soon as the cultures are obtained.",
  stem: "CASE STUDY 2 of 6 — ANALYZE CUES: Which interpretation best links Mrs. Delgado's cues together?",
  opts: [ O("A systemic infection is likely, and cultures must identify the organism before treatment", true, "Correct. Fever, chills, elevated WBC, and two infected sites point to systemic infection; culture results guide accurate treatment. Framework: Nursing Process/ADPIE."), O("A local wound problem is likely, and the cough and fever are unrelated findings", false, "Incorrect. Chills and an elevated WBC connect the sites into one systemic picture."), O("A viral illness is likely, and bacterial cultures will not change her treatment", false, "Incorrect. Purulent exudate and thick colored sputum are bacterial cues, and culture results direct therapy."), O("A drug reaction is likely, and the drainage and sputum are expected side effects", false, "Incorrect. Nothing in the scenario links these cues to a medication effect.") ],
  tp: "Framework: Nursing Process/ADPIE (analysis). Infection cannot be confirmed or treated accurately without culture results." });

BANK.push({ cat: CE, type: "single", grp: "case1", scen: "CASE STUDY — Mrs. Rosa Delgado, 71, is admitted with a temperature of 101.8 F (38.8 C), chills, a productive cough producing thick yellow-green sputum, and a leg wound draining purulent exudate. Her white blood cell count is elevated. Orders include blood cultures from two sites, a sputum culture, a wound culture, a midstream urine culture, and a first dose of IV antibiotic to be given as soon as the cultures are obtained.",
  stem: "CASE STUDY 3 of 6 — PRIORITIZE HYPOTHESES: Which action should the nurse take first?",
  opts: [ O("Obtain all ordered cultures before the first antibiotic dose is given", true, "Correct. Antibiotics interrupt the organism's growth in the laboratory, so every culture comes first. Framework: safety first / Nursing Process."), O("Give the first antibiotic dose, then collect cultures within the hour", false, "Incorrect. Even one prior dose can stop organism growth and invalidate the cultures."), O("Collect the urine specimen first because it is the easiest to obtain", false, "Incorrect. Ease is not the priority; all cultures precede the antibiotic, and blood cultures carry the bacteremia question."), O("Wait for the next fever spike before drawing any of the culture specimens", false, "Incorrect. Cultures are drawn when fever and chills are present; delaying risks the antibiotic being due first.") ],
  tp: "Framework: safety first. Culture specimens are always obtained before antibiotic therapy is started; if that becomes impossible, notify the provider about holding the antibiotic." });

BANK.push({ cat: CE, type: "multi", grp: "case1", scen: "CASE STUDY — Mrs. Rosa Delgado, 71, is admitted with a temperature of 101.8 F (38.8 C), chills, a productive cough producing thick yellow-green sputum, and a leg wound draining purulent exudate. Her white blood cell count is elevated. Orders include blood cultures from two sites, a sputum culture, a wound culture, a midstream urine culture, and a first dose of IV antibiotic to be given as soon as the cultures are obtained.",
  stem: "CASE STUDY 4 of 6 — GENERATE SOLUTIONS: Which planned actions are correct for Mrs. Delgado's cultures? Select all that apply.",
  opts: [ O("Draw blood cultures from two different venipuncture sites", true, "Correct. At least two specimens, one from each of two different sites, are required."), O("Collect 10 to 15 mL of venous blood at each culture site", true, "Correct. That is the printed volume per site for blood cultures."), O("Take the wound culture from inside the wound at the dressing change", true, "Correct. Specimens come from inside the wound, never from old drainage."), O("Give her analgesic 30 minutes before the wound dressing change", true, "Correct. Analgesia given 30 minutes before peaks when the dressing change and culture are performed."), O("Swab the old drainage pooled on the dressing for the wound culture", false, "Incorrect. Resident bacterial colonies grow in old exudate; that specimen would be invalid."), O("Start the IV antibiotic first so treatment is not delayed at all", false, "Incorrect. Starting the antibiotic first defeats every culture that was just planned.") ],
  tp: "Framework: Nursing Process/ADPIE (planning). Each culture has its own validity rule, and all of them share one rule: before antibiotics." });

BANK.push({ cat: CE, type: "dropdown", grp: "case1", scen: "CASE STUDY — Mrs. Rosa Delgado, 71, is admitted with a temperature of 101.8 F (38.8 C), chills, a productive cough producing thick yellow-green sputum, and a leg wound draining purulent exudate. Her white blood cell count is elevated. Orders include blood cultures from two sites, a sputum culture, a wound culture, a midstream urine culture, and a first dose of IV antibiotic to be given as soon as the cultures are obtained.",
  stem: "CASE STUDY 5 of 6 — TAKE ACTION: Complete the blood culture plan for Mrs. Delgado. Number of culture sites: [[0]] Timing of the draw: [[1]] Volume drawn at each site: [[2]] Bottle inoculated first when both types are needed: [[3]]",
  blanks: [ { o: [ O("Two different sites", true, "Correct. Two specimens from two different sites are required."), O("One reliable site", false, "Incorrect. A single site cannot separate bacteremia from skin contamination."), O("Three different sites", false, "Incorrect. The chapter requires at least two sites, and two is the ordered plan.") ] }, { o: [ O("Before the antibiotic dose", true, "Correct. Blood cultures are always drawn before antibiotic therapy is started."), O("Right after the antibiotic dose", false, "Incorrect. A prior dose interferes with organism growth in the laboratory."), O("At the next routine lab draw", false, "Incorrect. Routine timing ignores the fever-and-chills window and the antibiotic deadline.") ] }, { o: [ O("10 to 15 mL from each site", true, "Correct. 10-15 mL of venous blood is collected from each venipuncture site."), O("2 to 3 mL from each site", false, "Incorrect. That volume is far below the printed culture volume."), O("30 to 40 mL from each site", false, "Incorrect. That volume far exceeds the printed culture volume.") ] }, { o: [ O("The anaerobic bottle first", true, "Correct. When aerobic and anaerobic cultures are needed, the anaerobic bottle is inoculated first."), O("The aerobic bottle first", false, "Incorrect. The printed order inoculates the anaerobic bottle first."), O("Either bottle, in any order", false, "Incorrect. The chapter specifies an order: anaerobic first.") ] } ],
  tp: "Framework: safety first. Sites prepared thoroughly, a new sterile needle is used before injecting blood into the culture bottle, and the medium is mixed gently after inoculation." });

BANK.push({ cat: CE, type: "single", grp: "case1", scen: "CASE STUDY — Mrs. Rosa Delgado, 71, is admitted with a temperature of 101.8 F (38.8 C), chills, a productive cough producing thick yellow-green sputum, and a leg wound draining purulent exudate. Her white blood cell count is elevated. Orders include blood cultures from two sites, a sputum culture, a wound culture, a midstream urine culture, and a first dose of IV antibiotic to be given as soon as the cultures are obtained.",
  stem: "CASE STUDY 6 of 6 — EVALUATE OUTCOMES: The next day Mrs. Delgado's temperature is 99.1 F. One blood culture set grows a skin organism, the other shows no growth, and the wound culture identifies the pathogen being treated. Which evaluation is correct?",
  opts: [ O("The single positive set is a skin contaminant; the wound result guides her treatment", true, "Correct. Bacteremia is confirmed only when both cultures grow the infecting agent; one of two is assumed to be a skin contaminant. Framework: Nursing Process/ADPIE (evaluation)."), O("The single positive set proves bacteremia, and the wound result can be disregarded", false, "Incorrect. One of two positive sets does not confirm bacteremia, and the wound culture identified the treated pathogen."), O("The single positive set means the antibiotic was given before cultures were drawn", false, "Incorrect. The timeline shows cultures were drawn first; a single growth has its own printed interpretation."), O("The single positive set means both culture bottles were filled with too much blood", false, "Incorrect. Volume error is not the interpretation the chapter gives a one-of-two result.") ],
  tp: "Framework: Nursing Process/ADPIE (evaluation). Falling temperature plus a one-of-two culture result equals contaminant, not confirmed bacteremia." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient signed consent for an invasive diagnostic procedure yesterday. This morning, fully alert, he tells the nurse, 'I've changed my mind. I don't want it.' Which action should the nurse take first?",
  opts: [ O("Honor the refusal, stop the preparation, and notify the provider", true, "Correct. The patient keeps the legal right to withdraw consent at any time, for any reason, and to refuse care. Framework: patient rights / safety first."), O("Explain the risks of refusing until the patient agrees to proceed", false, "Incorrect. Persuasion does not override a competent patient's right to withdraw consent."), O("Proceed because the signed form remains legally binding today", false, "Incorrect. A signed form does not lock the patient in; consent can be withdrawn at any time."), O("Ask the family to convince the patient to keep the appointment", false, "Incorrect. The decision belongs to the competent patient, not the family.") ],
  tp: "Framework: patient rights. Withdrawal of consent — verbal or written — is honored at any time, for any reason." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient is scheduled for an IVP this afternoon. During the pre-test assessment, which finding should the nurse report to the provider immediately?",
  opts: [ O("The patient reports a shellfish allergy and has never had dye studies", true, "Correct. Shellfish allergy predicts a likely iodine dye reaction, and the IVP dye contains iodine. Framework: safety first."), O("The patient reports feeling nervous about lying still on the table", false, "Incorrect. Nervousness calls for teaching and support, not an immediate provider report."), O("The patient reports drinking only clear liquids since early morning", false, "Incorrect. That fits the possible clear-liquid allowance some facilities use on the test day."), O("The patient reports that his BUN and creatinine were drawn yesterday", false, "Incorrect. Those labs are assessed before IVP; having them drawn is expected, not alarming.") ],
  tp: "Framework: safety first. Before any dye study: allergy to iodine and shellfish, plus renal function (BUN, creatinine), because abnormal renal function can deteriorate further with dye." });

BANK.push({ cat: CA, type: "multi",
  stem: "During a contrast study, a patient develops respiratory distress, a falling blood pressure, and signs of glottis swelling. Which immediate treatments does the chapter specify? Select all that apply.",
  opts: [ O("Administer epinephrine as part of the immediate treatment", true, "Correct. Epinephrine is part of the immediate treatment for a severe dye reaction."), O("Administer steroids as part of the immediate treatment", true, "Correct. Steroids are part of the immediate treatment."), O("Administer diphenhydramine as part of the immediate treatment", true, "Correct. Diphenhydramine is part of the immediate treatment."), O("Keep oxygen and endotracheal equipment on hand for immediate use", true, "Correct. Oxygen and endotracheal equipment are kept on hand for exactly this event."), O("Give the patient a glass of water and reassess in 30 minutes", false, "Incorrect. A life-threatening airway reaction cannot be managed with water and waiting.") ],
  tp: "Framework: ABCs. Severe dye reaction = respiratory distress, hypotension, shock; immediate treatment is epinephrine, steroids, and diphenhydramine, with oxygen and airway equipment ready." });

BANK.push({ cat: CA, type: "single",
  stem: "A patient ordered NPO after midnight for an 8 a.m. test is found finishing a full breakfast at 7 a.m. Which consequence does the nurse anticipate and report?",

  tp: "Framework: safety first. Broken fasting, insufficient bowel cleansing, delayed delivery, wrong timing or amount, and missing consent or requisition all destroy accuracy." });

BANK.push({ cat: CA, type: "order",
  stem: "Place the nurse's actions for preparing a patient for a diagnostic examination (Skill 23.1) in the correct order.",

BANK.push({ cat: CA, type: "matrix",

BANK.push({ cat: CA, type: "single",

  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var b, sel, j, bo, segs = q.stem.split(/\[\[\d+\]\]/), cTail, cHead, ctxTxt;
    h += '<div class="stem">' + q.stem.replace(/\[\[\d+\]\]/g, '______') + '</div>';
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      cTail = (segs[b] || '').split(/[;.]/); cTail = cTail[cTail.length - 1].replace(/\s+/g, ' ').trim();
      cHead = (segs[b + 1] || '').split(/[;.]/)[0].replace(/\s+/g, ' ').trim();
      ctxTxt = (cTail + ' ______ ' + cHead).trim();
      h += '<div class="ddrow"><div class="ddlabel">Blank ' + (b + 1) + ' \u2014 ' + ctxTxt + '</div>' + sel + '</div>';
    }
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
