<body>
<div id="app"></div>
<script>
/* ============ QUESTION BANK ============ */
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
var CA = "Cardiac Cycle in Action";
var CB = "Autonomic Effects at the Bedside";
var CC = "Output, Preload, and Afterload Decisions";
var CD = "Heart Failure Priorities";
var CE = "Special Situations: Stress, Age, and Exercise";
var CATS = [CA, CB, CC, CD, CE];
var KEYTERMS = ["diastole","vagomimetic","vagolytic","preload","afterload","ejection fraction","orthopnea","cor pulmonale","Starling's law","atrial kick"];
var BLUEPRINT = {
  CA: { name: CA, count: 7 },
  CB: { name: CB, count: 9 },
  CC: { name: CC, count: 8 },
  CD: { name: CD, count: 14 },
  CE: { name: CE, count: 5 }
};

BANK.push({ cat: CA, type: "single",
  stem: "A telemetry patient develops a sustained heart rate of 168 beats/min and reports chest pain. BP is 104/68. Which explanation should guide the nurse's first response?",
  opts: [
    O("Treat the rate as urgent, because shortened filling time and reduced coronary flow are now causing the pain", true, "At very high rates diastole shortens most: less blood fills the ventricles and less coronary flow reaches the myocardium, producing chest pain."),
    O("Reassure the patient, because a faster rate always raises output and improves flow to the heart muscle itself", false, "A dramatic rate rise shortens diastole so much that cardiac function falls rather than improves."),
    O("Treat the pain as unrelated, because coronary flow occurs in systole and is not affected by the heart rate", false, "Coronary flow occurs during diastole, so rate directly affects it."),
    O("Encourage slow walking, because exercise will lengthen the resting phase and restore flow to the heart muscle", false, "Walking raises demand during a symptomatic tachycardia episode instead of restoring diastole.")
  ],
  tp: "Extreme tachycardia shortens diastole twice over — less filling and less coronary flow — so chest pain is expected, not incidental. [Framework: ABCs]" });

BANK.push({ cat: CA, type: "single",
  stem: "A student watches a monitor: the atria contract while the ventricles are relaxed and the AV valves are open. Which conclusion is correct?",
  opts: [
    O("This is atrial systole, and the atria are completing the filling of the relaxed ventricles", true, "In atrial systole the atria contract and pump blood into relaxed ventricles through open AV valves."),
    O("This is ventricular systole, and the ventricles are ejecting blood into the aorta and pulmonary trunk", false, "In ventricular systole the ventricles contract; here they are relaxed."),
    O("This is the diastolic stage, and both chambers are resting while blood flows into the atria only", false, "In the diastolic stage both chambers relax; here the atria are contracting."),
    O("This is a conduction failure, and the AV valves should have snapped shut before the atria contracted", false, "AV valves snap shut in ventricular systole, after atrial filling is complete.")
  ],
  tp: "Atrial contraction with relaxed ventricles and open AV valves can only be atrial systole — stage 1 of the cycle. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "single",
  stem: "A patient's heart rate rises from 70 to 140 beats/min during a fever. Which change in the cardiac cycle is the nurse most concerned about?",
  opts: [
    O("Diastole shortens the most, cutting both ventricular filling and the heart muscle's own blood supply", true, "As rate increases the cycle shortens and diastole — the filling and coronary-flow phase — shortens most."),
    O("Atrial systole shortens the most, cutting the passive flow that provides most ventricular filling", false, "Passive flow occurs in diastole, and diastole is the phase that shortens most."),
    O("Ventricular systole shortens the most, cutting the ejection of blood into the aorta and pulmonary trunk", false, "Systole is not the phase identified as shortening most as rate rises."),
    O("The all-chambers rest period lengthens, cutting the number of ejections the heart completes each minute", false, "The rest period shortens as rate rises; it does not lengthen.")
  ],
  tp: "Rate up = diastole down. Protect the filling/coronary phase when you judge any tachycardia. [Framework: ABCs]" });

BANK.push({ cat: CA, type: "single",
  stem: "A patient in atrial fibrillation has a cardiac output well below baseline despite a controlled rate. Which finding best explains the drop?",
  opts: [
    O("Loss of the atrial contraction that normally adds the final portion of ventricular filling each beat", true, "With atrial fibrillation the atrial-kick contribution is missing, so filling and cardiac output decline."),
    O("Loss of the passive flow that normally occurs while the AV valves are closed during ventricular systole", false, "Passive flow occurs in diastole with the AV valves open, and it is not the lost portion here."),
    O("Gain of an extra contraction that empties the ventricles before the semilunar valves can open each beat", false, "Atrial fibrillation removes a contribution; it does not add an extra effective contraction."),
    O("Gain of coronary flow during a longer diastole that washes blood back out of the filling ventricles", false, "Coronary flow supplies the myocardium; it does not wash filling blood out of the ventricles.")
  ],
  tp: "Atrial fibrillation costs the atrial kick — about 30% of filling — so output falls even at a controlled rate. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "multi",
  stem: "A patient with a heart rate of 172 beats/min is pale, restless, and reports pressure-like chest pain. Which findings fit the physiology of this episode? Select all that apply.",
  opts: [
    O("Less blood enters the ventricles because filling time is shortened", true, "Shortened diastole leaves less time for blood to enter the ventricles."),
    O("Less blood is pumped out because less blood was available to eject", true, "Less filling means less blood is pumped with each beat."),
    O("Less oxygen reaches the heart muscle because coronary flow has fallen", true, "Coronary flow occurs in diastole, so a shorter diastole means less oxygen to the myocardium."),
    O("More blood pools in the atria because the AV valves remain shut all cycle", false, "The AV valves open in diastole and atrial systole; they are not shut all cycle."),
    O("More oxygen reaches the heart muscle because systole is now much longer", false, "Systole does not lengthen, and coronary flow occurs in diastole.")
  ],
  tp: "One shortened phase explains the whole picture: less filling, less ejection, less coronary oxygen. [Framework: ABCs]" });

BANK.push({ cat: CA, type: "order",
  stem: "A new nurse is tracing one heartbeat on a diagram. Place the events in the order they occur in one cardiac cycle.",
  items: [
    { t: "Atria contract and pump blood into the relaxed ventricles", r: "Atrial systole is first: AV valves open, ventricles relaxed and filling." },
    { t: "Ventricles contract and blood snaps the AV valves shut", r: "Ventricular systole begins with pressure forcing the AV valves closed." },
    { t: "Blood pushes the semilunar valves open into the great vessels", r: "Ejection follows AV closure as blood flows into the pulmonary trunk and aorta." },
    { t: "Both chambers relax and blood flows into the atria", r: "Diastole ends the cycle with both chambers resting and the atria filling." }
  ],
  tp: "Fill, close, eject, rest — pressure changes drive every valve event in that sequence. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CA, type: "single",
  stem: "During a sprint, a healthy student's heart beats faster and stronger. Which statement about the impulse behind this response is correct?",
  opts: [
    O("The impulse still starts in the SA node on its own; autonomic firing only tuned its rate and force upward", true, "The cardiac impulse arises in the SA node by automaticity; the ANS changes rate, conduction speed, and force."),
    O("The impulse now starts in the vagus nerve, which fires the SA node harder to meet the demand for oxygen", false, "The vagus slows the heart, and no nerve causes the impulse itself."),
    O("The impulse now starts in the ventricular muscle, which takes over pacing whenever oxygen demand is high", false, "The SA node remains the pacemaker; ventricular muscle does not take over in a healthy sprint."),
    O("The impulse is unchanged, and the faster, stronger beat comes only from blood stretching the ventricles more", false, "Autonomic firing does change rate and force during a sprint; stretch is only one mechanism.")
  ],
  tp: "Demand changes the tuning, not the origin — the SA node always fires its own impulse. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single",
  stem: "A patient having a panic attack reports a racing, pounding heart and is certain it is a heart attack. Vitals: HR 128, BP 148/88, SpO2 99%. Which interpretation fits the chapter?",
  opts: [
    O("Excess sympathetic firing in fight-or-flight commonly produces this picture and is often mistaken for a heart attack", true, "Very anxious people can have a racing, pounding heart from excess sympathetic firing; many ER trips for this picture are panic-related."),
    O("Excess vagal firing in fight-or-flight commonly produces this picture and is often mistaken for a heart attack", false, "Fight-or-flight is sympathetic; vagal firing slows the heart."),
    O("Loss of automaticity in the SA node commonly produces this picture and requires immediate pacing evaluation first", false, "The SA node is firing faster, not failing to fire."),
    O("Failure of the left ventricle commonly produces this picture and requires a pillow-count assessment first", false, "No pulmonary edema picture is described; the pattern fits sympathetic excess.")
  ],
  tp: "Racing, pounding heart with anxiety = sympathetic fight-or-flight until proven otherwise — still assess, never dismiss. [Framework: Stable vs Unstable]" });

BANK.push({ cat: CB, type: "single",
  stem: "A patient in circulatory shock is tachycardic with a weak, rapid pulse. The nurse recalls that most signs of shock come from which mechanism?",
  opts: [
    O("Excess sympathetic firing driving rate and vessel responses across the whole circulation", true, "Most of the signs and symptoms of circulatory shock are caused by excess sympathetic firing."),
    O("Excess vagal firing slowing the heart and dropping output across the whole circulation", false, "Vagal excess causes bradycardia and heart block, not the shock picture."),
    O("Loss of the atrial kick removing the final portion of filling across the whole circulation", false, "Atrial-kick loss lowers output in atrial fibrillation; it is not the stated cause of shock signs."),
    O("Failure of Starling's law removing the stretch response across the whole circulation", false, "Starling's law matches output to return; shock signs are attributed to sympathetic excess.")
  ],
  tp: "Shock signs are largely sympathetic signs — read tachycardia in shock as compensation, not coincidence. [Framework: ABCs]" });

BANK.push({ cat: CB, type: "single",
  stem: "A patient with worsening heart failure is started on a drug that minimizes sympathetic effects. What is the reason for this choice?",
  opts: [
    O("Persistent sympathetic stimulation drives much of the progressive deterioration in heart failure", true, "Progressive deterioration in heart failure is largely caused by persistent sympathetic nerve stimulation, so some failure drugs minimize sympathetic effects."),
    O("Persistent sympathetic stimulation is the only mechanism that strengthens a failing heart over time", false, "Persistent sympathetic activity harms the failing heart; it does not protect it."),
    O("Persistent vagal stimulation drives much of the deterioration, and the drug blocks the vagus nerve", false, "The deterioration driver named is sympathetic, and this drug class minimizes sympathetic effects."),
    O("Persistent vagal stimulation slows conduction, and the drug speeds conduction through the AV node", false, "Slowed conduction is a vagal issue; the stated rationale targets sympathetic deterioration.")
  ],
  tp: "In failure, chronic sympathetic drive is part of the disease — blocking it is treatment, not just rate control. [Framework: Acute vs Chronic]" });

BANK.push({ cat: CB, type: "single",
  stem: "After a myocardial infarction, a patient's heart rate falls to 44 beats/min with dizziness. Which mechanism should the nurse suspect first?",
  opts: [
    O("Excess vagal discharge slowing the SA node and conduction toward the ventricles", true, "Excess vagal discharge after a heart attack causes bradycardia and slows conduction, predisposing to heart block and lethal rhythms."),
    O("Excess sympathetic discharge speeding the SA node and conduction toward the ventricles", false, "Sympathetic excess raises rate; this patient is bradycardic."),
    O("Loss of venous return reducing stretch so the SA node fires at a much slower rate", false, "SA node rate is set by its rhythmic firing and autonomic tuning, not by stretch."),
    O("Gain of the atrial kick adding beats that the monitor is failing to count at this rate", false, "The atrial kick adds filling, not uncounted beats.")
  ],
  tp: "Post-MI bradycardia points first to vagal excess — rate down, conduction down, block risk up. [Framework: ABCs]" });

BANK.push({ cat: CB, type: "single",
  stem: "A frightened patient suddenly becomes pale and bradycardic at 38 beats/min, with BP 82/50 — a 'brady down' response. Which drug should the nurse anticipate?",
  opts: [
    O("Atropine, to block the vagal effects and restore the heart rate", true, "Atropine is vagolytic: it blocks vagal stimulation, increases HR, and is used to relieve bradycardia in a 'brady down' patient."),
    O("Digoxin, to mimic the vagal effects and slow conduction further", false, "Digoxin is vagomimetic; giving it would deepen the bradycardia."),
    O("Propranolol, to block beta1 receptors and lower the heart rate", false, "Beta1 blockade lowers rate and force — the opposite of what this patient needs."),
    O("Epinephrine given for its muscarinic action at the SA node", false, "Epinephrine acts as a sympathomimetic/beta1 agonist, not through muscarinic action.")
  ],
  tp: "Brady down = vagal surge: block the vagus with atropine; never add a vagomimetic or a beta blocker. [Framework: ABCs]" });

BANK.push({ cat: CB, type: "single",
  stem: "A patient on digoxin has a heart rate of 52 beats/min and a new slow conduction pattern. Which digoxin effect explains both findings, and what is the priority?",
  opts: [
    O("Its vagomimetic effect is slowing rate and conduction — hold and report before the next dose is given", true, "Digoxin mimics vagal stimulation: it decreases HR and slows the impulse from atria to ventricles, and HR must be monitored when such drugs are used."),
    O("Its beta1 agonist effect is speeding rate and conduction — give the dose early to restore the rhythm", false, "Digoxin is not a beta1 agonist, and the rate is slow, not fast."),
    O("Its muscarinic blocking effect is raising rate and pressure — check the blood pressure before giving it", false, "Muscarinic blockade is atropine's action and raises rate; this rate is low."),
    O("Its negative chronotropic effect is expected and harmless — document the findings and give the dose", false, "Bradycardia below 60 with slowed conduction on a vagomimetic drug is a reportable danger, not a harmless expectation.")
  ],
  tp: "Digoxin has two faces: stronger contraction and vagal slowing. HR 52 plus slow conduction = hold and report. [Framework: Safety First]" });

BANK.push({ cat: CB, type: "multi",
  stem: "A patient receives a sympathomimetic drug. Which responses should the nurse expect? Select all that apply.",
  opts: [
    O("Heart rate increases as SA node activity increases", true, "Sympathomimetic drugs such as epinephrine and dopamine increase HR."),
    O("Force of contraction increases in the ventricular myocardium", true, "Sympathomimetics increase contractile force."),
    O("Conduction through the AV node and His-Purkinje system speeds up", true, "Sympathetic stimulation increases the speed of the cardiac impulse."),
    O("Heart rate decreases as vagal tone at the SA node increases", false, "Decreased rate is a vagal effect, the opposite branch."),
    O("Force of contraction stays unchanged because no fibers reach the ventricles", false, "Sympathetic fibers do reach the ventricular myocardium; it is vagal fibers that do not.")
  ],
  tp: "Sympathomimetic = the sympathetic package: rate up, speed up, force up. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single",
  stem: "A tachycardic patient (HR 142) is given a beta1-adrenergic blocker. Which combined result should the nurse expect?",
  opts: [
    O("Heart rate and contractile force fall, so cardiac output and blood pressure decrease", true, "Beta1 blockade in excess-sympathetic tachycardia decreases HR and force of contraction, decreasing cardiac output and blood pressure."),
    O("Heart rate and contractile force rise, so cardiac output and blood pressure increase", false, "That is the beta1 agonist result, not blockade."),
    O("Heart rate falls but contractile force rises, so cardiac output stays exactly unchanged", false, "Blockade lowers force as well as rate."),
    O("Conduction speed rises but heart rate falls, so the rhythm becomes faster and irregular", false, "Beta1 blockade does not speed conduction.")
  ],
  tp: "Beta1 blockade reverses the whole sympathetic package — rate, force, output, and pressure all fall together. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CB, type: "single",
  stem: "A patient with heart block receives atropine and the rate rises with better conduction. Which receptor action explains this?",
  opts: [
    O("Muscarinic blockade removes the inhibiting effect of acetylcholine at the SA and AV nodes", true, "Atropine blocks ACh at muscarinic receptors, relieving vagal inhibition, increasing HR, and speeding the impulse from atria to ventricles."),
    O("Beta1 activation adds norepinephrine effect at the SA and AV nodes and ventricular muscle", false, "Atropine does not activate beta1 receptors; it blocks muscarinic receptors."),
    O("Muscarinic activation deepens the vagal effect at the SA and AV nodes during the block", false, "Muscarinic activation slows rate and conduction — the problem, not the treatment."),
    O("Beta1 blockade prevents sympathetic firing from reaching the SA and AV nodes at all", false, "Beta1 blockade would slow the heart further in heart block.")
  ],
  tp: "Atropine works by subtraction: remove the vagal brake at muscarinic receptors and rate and conduction recover. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single",
  stem: "A patient's stroke volume rises after a fluid bolus, with no drug given and no rate change. Which mechanism most likely explains the rise?",
  opts: [
    O("More venous return stretched the ventricle, so contraction strengthened and ejected more per beat", true, "Starling's law: more blood entering stretches the myocardium, increasing force and stroke volume, matching output to return."),
    O("More venous return blocked beta1 receptors, so contraction strengthened and ejected more per beat", false, "Beta1 blockade weakens contraction; it does not strengthen it."),
    O("Less venous return stretched the ventricle, so contraction strengthened and ejected more per beat", false, "Less return means less stretch and a smaller stroke volume."),
    O("A vagal discharge slowed conduction, so contraction strengthened and ejected more per beat", false, "Vagal discharge has no effect on contractile force.")
  ],
  tp: "Volume in, stretch up, force up — that is Starling's law doing its beat-to-beat matching job. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single",
  stem: "Two patients have the same end-diastolic volume. One, given digoxin, ejects far more per beat. Which concept explains the difference?",
  opts: [
    O("A positive inotropic effect produced by the digoxin this patient received", true, "Digoxin is the most famous positive inotropic drug: it strengthens contraction without stretching the muscle fibers."),
    O("A negative inotropic effect produced by the digoxin this patient received", false, "A negative inotropic effect would eject less, not more."),
    O("A positive chronotropic effect produced by the digoxin this patient received", false, "Chronotropic is about rate, and rate was not the difference described."),
    O("A positive dromotropic effect produced by the digoxin this patient received", false, "Dromotropic is about conduction speed, not ejection force.")
  ],
  tp: "Same stretch, different force = inotropic effect. Digoxin, epinephrine, and sympathetic firing are positive; failure is negative. [Framework: Nursing Process/ADPIE]" });

BANK.push({ cat: CC, type: "single",
  stem: "A patient with aortic valve stenosis has a thickened, enlarged left ventricle. Which workload concept explains the enlargement?",
  opts: [
    O("Raised afterload from the narrowed aortic valve opening", true, "Aortic stenosis raises left-ventricular afterload; the myocardium enlarges from the extra work and will eventually fail as a pump."),
    O("Raised preload from the narrowed aortic valve opening", false, "Preload is filling volume (EDV); stenosis is a resistance problem."),
    O("Lowered afterload from the narrowed aortic valve opening", false, "Stenosis raises resistance; lowered afterload reduces work."),
    O("Lowered preload from the narrowed aortic valve opening", false, "Less filling means less stretch, not hypertrophy from stenosis.")
  ],
  tp: "Stenosis and hypertension raise afterload; a ventricle pumping against resistance hypertrophies, then fails. [Framework: Acute vs Chronic]" });

    q = Q[i];
    S.touched.push(false); S.checked.push(false); S.flag.push(false);
    if (q.type === "single") { if (S.shuf) { shuffle(q.opts); } S.resp.push(-1); }
    else if (q.type === "multi") { if (S.shuf) { shuffle(q.opts); } S.resp.push(falseArr(q.opts.length)); }
    else if (q.type === "order") {
      var n = q.items.length, p = [], t, tries = 0, same;
      for (k = 0; k < n; k++) { p.push(k); }
      if (S.shuf) {
        do { shuffle(p); same = true; for (k = 0; k < n; k++) { if (p[k] !== k) { same = false; } } tries++; } while (same && tries < 20);
      } else { p.reverse(); }
      S.resp.push(p);
    }
    else if (q.type === "dropdown") {
      var d = [];
      for (k = 0; k < q.blanks.length; k++) { if (S.shuf) { shuffle(q.blanks[k].o); } d.push(-1); }
      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>Chapter 17: Function of the Heart</h1>';
  h += '<div class="sub">Brutal mode | Herlihy, Anatomy & Physiology | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order and answer choices<br><span class="small">Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
