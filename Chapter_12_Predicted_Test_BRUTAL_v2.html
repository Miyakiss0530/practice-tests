<script>
var BANK = [];
function O(t, c, r) { return { t: t, c: c, r: r }; }
function S(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "single", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
function M(cat, stem, opts, tp, extra) { var q = { cat: cat, type: "multi", stem: stem, opts: opts.map(function (o) { return O(o[0], o[1], o[2]); }), tp: tp }; if (extra) { for (var k in extra) q[k] = extra[k]; } BANK.push(q); }
var C1 = "Transition to Extrauterine Life — The First Hours";
var C2 = "Thermoregulation and the Four Heat-Loss Routes";
var C3 = "Vital Signs, Measurements, and the Apgar Score";
var C4 = "Head-to-Toe Assessment — Expected, Variation, or Deviation";
var C5 = "Reflexes and Newborn Pain";
var C6 = "Skin Findings and Physiologic Jaundice";
var C7 = "Feeding, Stools, and Digestion";
var C8 = "Circumcision, Infection Prevention, Screening, and Discharge Safety";
var CATS = [C1, C2, C3, C4, C5, C6, C7, C8];
var KEYTERMS = [];

/* ===== CASE 1 (PRED-CASE1) — The First Hour Decides: cold stress in the transition window ===== */
var CASE_P1 = "CASE STUDY — The First Hour Decides. Baby boy R. was born vaginally 25 minutes ago at 39 weeks; birth weight 3,400 g. For weighing he was placed, still wet and uncovered, on a scale beside an open window, and his bassinet now sits near that window. Assessment: temperature 36.0°C, apical pulse 148 beats/min, respirations 66 breaths/min with soft grunting, trunk pink, hands and feet blue, chin quivering. His head is uncovered and his skin is still damp.";

M(C1, "Which findings in this assessment require the nurse to act now? Select all that apply.", [
    ["Temperature of 36.0°C", true, "Below 36.2°C is a report value, and he is still losing heat — this number demands action, not observation."],
    ["Respirations of 66 breaths/min with grunting", true, "Above 60 breaths/min is always reported, and noisy respirations such as grunting are a report-now sign on their own."],
    ["Blue hands and feet with a pink trunk", false, "Acrocyanosis — blue extremities from sluggish peripheral circulation — is normal in the first week and is not central cyanosis."],
    ["Quivering chin", false, "A shivering-like chin tremor is an immature nervous system sign; it is not evidence that he is cold and not a distress cue by itself."],
    ["Apical pulse of 148 beats/min", false, "The normal apical range is 110–160 beats/min, so 148 sits inside the expected band."],
    ["Skin still damp with the head uncovered", true, "Wet skin keeps evaporation running and the uncovered head is the largest surface for heat loss — both are fixable causes acting right now."]
  ], "ANSWER KEY — Correct answers: temperature 36.0°C, respirations 66 with grunting, and damp skin with an uncovered head. DETAILED RATIONALE — Recognize Cues means separating the values outside their report lines (temperature below 36.2°C, respirations above 60, grunting) and the ongoing heat-loss causes from two normal findings (acrocyanosis, chin tremor) and one in-range value (pulse 148). PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): act on the cues that crossed a line, not on the findings that only look alarming.", { scen: CASE_P1, grp: "PRED-CASE1" });

S(C2, "The nurse explains to a student why this baby's temperature fell so fast, and why it matters beyond the number itself. Which explanation is correct?", [
    ["Chilling forces his metabolism and oxygen consumption up as he burns brown fat to make heat, because he cannot shiver like an adult", true, "Cold stress is exactly this: nonshivering thermogenesis burns brown fat and oxygen, raising metabolic demand in a baby whose reserves are small."],
    ["His sweat glands overworked in the warm delivery room and cooled his skin too quickly as the moisture evaporated", false, "Newborn sweat glands barely work in the neonatal period, so sweating is not the cooling mechanism here; the wet skin and the window are."],
    ["A temperature of 36.0°C is expected in the first hour and climbs on its own, so the only task is documenting it accurately", false, "The temperature does climb within a few hours, but 36.0°C is below the 36.2°C report line — it is a value to act on, not just to chart."],
    ["The blue hands and feet show cold blood returning from his limbs and pulling his core temperature down", false, "Blue extremities are acrocyanosis, a normal peripheral finding; warmth is never judged by the hands and feet, and they do not drive the core number."]
  ], "ANSWER KEY — Correct answer: chilling forces metabolism and oxygen consumption up as he burns brown fat, because he cannot shiver. DETAILED RATIONALE — The chapter's cold-stress mechanism is nonshivering thermogenesis in a baby with an immature heat-regulating system and small fat stores. Sweating is nearly absent in neonates, acrocyanosis does not chill the core, and 36.0°C sits below the report line. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the right explanation accounts for the mechanism, not just the number.", { scen: CASE_P1, grp: "PRED-CASE1" });

S(C2, "Which action should the nurse take FIRST for this baby?", [
    ["Dry him thoroughly, cover his head, and place him under the radiant warmer", true, "Drying stops evaporation, the covered head closes the largest heat-loss surface, and the warmer restores temperature — the immediate warmth sequence."],
    ["Give his first bath now to remove the vernix, then wrap him in double blankets", false, "The first bath waits until his temperature is stable, and vernix is protective — it is never scrubbed off; bathing a cold baby deepens the heat loss."],
    ["Recheck the temperature in 30 minutes before deciding whether to intervene", false, "His value is already below the report line with respirations above theirs; waiting lets cold stress keep burning oxygen and brown fat."],
    ["Leave him damp against his mother's skin, since body contact will dry and warm him at the same time", false, "Wet skin keeps evaporation running during any contact warming; drying and covering come first in the immediate-care sequence."]
  ], "ANSWER KEY — Correct answer: dry him thoroughly, cover his head, and place him under the radiant warmer. DETAILED RATIONALE — Take Action follows the mechanism: stop the losses first (drying ends evaporation; the covered head closes the largest surface), then add heat with the warmer or double blankets until the temperature is stable. Bathing waits for a stable temperature, and a below-line value with fast respirations is not a watch-and-recheck picture. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): fix the cause that is still running before re-measuring the result.", { scen: CASE_P1, grp: "PRED-CASE1" });

BANK.push({ cat: C1, type: "order", stem: "Across the room, a second newborn has just been delivered with mucus in the mouth and throat. Place the nurse's immediate actions in the order they should be done.", items: [
  { t: "Clear the mucus from the mouth and throat with gentle bulb suction", r: "The mouth and throat are cleared first, before anything can be inhaled." },
  { t: "Suction the nose gently with the bulb syringe", r: "Nasal suction comes second — it triggers a gasp, so it is safe only after the mouth is clear." },
  { t: "Dry the newborn thoroughly and remove the wet linen", r: "Drying stops evaporative heat loss, the fastest loss running right after birth." },
  { t: "Cover the head, position him on his back or side, and apply the identification bands", r: "Covering the head closes the largest heat-loss surface; back-or-side positioning keeps the lungs free to expand." }
], tp: "ANSWER KEY — Correct order: clear the mouth and throat → suction the nose → dry thoroughly → cover the head, position on back or side, apply ID bands. DETAILED RATIONALE — The sequence is the safety: nasal suction triggers a gasp, so the mouth is always cleared before the nose; drying follows to stop evaporation; covering, positioning, and identification close the immediate-care set. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): in a procedure item, the order of steps is itself the intervention.", scen: CASE_P1, grp: "PRED-CASE1" });

S(C2, "Baby R.'s bassinet sits beside the open window where he was weighed. Which change best addresses the heat losses built into that setup?", [
    ["Move the bassinet away from the window and out of the moving air", true, "Cold surroundings and windows pull heat by radiation, and moving air strips it by convection — relocating the bassinet closes both routes at once."],
    ["Lay him directly on the warmed metal scale for his next weight so the surface heats him while he lies there", false, "Direct contact with a surface is the conduction route; surfaces are a heat-loss risk to manage, not a warming tool to rely on."],
    ["Leave the window open for fresh air and add a second blanket over him where he lies", false, "Fresh air is part of room care, but the setup keeps drafts and cold surroundings acting on him; the bassinet's position is the problem to fix."],
    ["Judge his warmth by feeling his hands before deciding whether the window matters", false, "Warmth is never judged by the hands and feet — the extremities run cooler and show acrocyanosis; the temperature number judges warmth."]
  ], "ANSWER KEY — Correct answer: move the bassinet away from the window and out of the moving air. DETAILED RATIONALE — Radiation is heat lost toward cold surroundings such as a window, and convection is heat carried off by moving air; both are fixed by position. Conduction is the cold-surface route, and extremity feel is an invalid warmth check. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): match each fix to the route it actually closes.", { scen: CASE_P1, grp: "PRED-CASE1" });

S(C3, "Thirty minutes later: temperature 36.8°C, respirations 44 breaths/min and quiet, apical pulse 136 beats/min, hands and feet still blue. How should the nurse evaluate the response to care?", [
    ["The interventions are working — temperature is climbing into range and respirations have normalized; the blue extremities are expected", true, "Evaluation re-measures the original cues: temperature up from 36.0 into the 36.6–37.2 climb range, respirations back inside 30–60 and quiet, pulse in range. Acrocyanosis persists normally through the first week."],
    ["The interventions have failed, because his hands and feet are still blue after warming, and a baby who is truly warming should pink up evenly everywhere", false, "Blue hands and feet are acrocyanosis, a normal first-week finding; judging the outcome by the extremities misreads the one finding that was never a problem."],
    ["He needs escalation for cyanosis, since a blue color remains somewhere on his body and means blood is still bypassing his lungs", false, "Cyanosis as a danger sign is the central picture tied to blood bypassing the lungs; a pink trunk with blue extremities is the normal acrocyanosis pattern."],
    ["His temperature is still too low, because it has not yet reached the top of the normal range, so he should return to the warmer until it does", false, "36.8°C is inside the range he climbs to within hours of birth and within the discharge target band — direction and band both say improving."]
  ], "ANSWER KEY — Correct answer: the interventions are working; temperature and respirations have normalized and the blue extremities are expected. DETAILED RATIONALE — Evaluation compares each original cue against its line: 36.0 → 36.8°C, 66 and grunting → 44 and quiet, pulse in range throughout. The unchanged finding — blue hands and feet — is acrocyanosis, which was never a distress cue. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): judge the plan against each original cue, not against the finding that only looks wrong.", { scen: CASE_P1, grp: "PRED-CASE1" });


/* ===== CASE 2 (PRED-CASE2) — Day 2: Yellow, Sleepy, and Underfed ===== */
var CASE_P2 = "CASE STUDY — Day 2: Yellow, Sleepy, and Underfed. Baby girl S. is 52 hours old, born at term and breastfeeding. Her yellow color, first noted yesterday, is now visible below the sternum and on her arms. In the past 24 hours she has fed 5 times, with short, sleepy feeds; her documented LATCH score is 5. Her weight is down 8% from birth weight. She has had 3 wet diapers and 2 transitional stools in 24 hours. Her mother says, 'She's just a sleepy, good baby — she never cries to eat.'";

M(C6, "Which findings in this picture require action now? Select all that apply.", [
    ["Yellow color visible below the sternum and on the arms", true, "Jaundice spread below the sternum or into the arms and lower body is the chapter's trigger — a serum bilirubin test may be required."],
    ["LATCH score of 5", true, "The breastfeeding target is a LATCH of 7; below 7 triggers a lactation consultant referral — feeding support is an action item, not a footnote."],
    ["Weight down 8% from birth weight", false, "A loss of 5–10% on days 3–4 is the expected fluid-shift pattern, regained by day 10; 8% sits inside the expected band."],
    ["Two transitional stools in 24 hours", false, "Transitional stools — loose, greenish-yellow, with mucus — are the expected stage across the first week, between meconium and milk stools."],
    ["Short, sleepy feeds, 5 times in 24 hours", true, "Breastfeeding runs on demand every 2–3 hours; a sleepy baby who rarely cues and feeds briefly is underfeeding, which also lets bilirubin keep rising."]
  ], "ANSWER KEY — Correct answers: jaundice spread below the sternum and onto the arms, LATCH score of 5, and short sleepy feeds 5 times in 24 hours. DETAILED RATIONALE — The actionable cues are the spread (the serum-testing trigger), the below-target LATCH (the referral trigger), and a feeding pattern too infrequent and too weak for demand feeding every 2–3 hours. The 8% weight loss and the transitional stools both sit inside their expected patterns. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): act on the findings that crossed a named trigger, not on the ones inside their normal bands.", { scen: CASE_P2, grp: "PRED-CASE2" });

S(C6, "The mother asks whether the yellow color is 'the normal kind.' Which analysis is most accurate?", [
    ["The timing fits the normal pattern — evident on days 2–3 — but the spread below the sternum means the level must be checked with a serum bilirubin", true, "Physiologic jaundice is a timing pattern (days 2–3, lasting about a week), and the chapter adds a second rule: spread below the sternum or into the arms, lower abdomen, or feet can require a serum test regardless of timing."],
    ["It is the normal kind, because any jaundice appearing after the first day needs no testing at all and is simply watched until it fades", false, "Timing alone does not clear her — the head-to-foot spread is its own trigger for serum testing, and jaundice is charted and re-evaluated often."],
    ["It cannot be the normal kind, because normal jaundice stays on the face and never reaches a baby's arms or trunk", false, "The spread does not rename the jaundice — it raises the level estimate, since the yellow moves head-to-foot as bilirubin rises; testing, not renaming, is the response."],
    ["It is abnormal because it appeared on day 2; the normal kind starts on day 1 and is gone within about a week", false, "The direction is backwards — day-1 jaundice is the never-normal one; days 2–3 is the physiologic window."]
  ], "ANSWER KEY — Correct answer: the timing fits the physiologic pattern, but the spread below the sternum requires a serum bilirubin check. DETAILED RATIONALE — Two rules run at once: timing (day 1 = report; days 2–3 = physiologic pattern) and spread (cephalocaudal progression tracks the level; below the sternum = serum test may be required). Applying only one rule misjudges the case in one direction or the other. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the right explanation fits all the data, not just the calendar.", { scen: CASE_P2, grp: "PRED-CASE2" });

BANK.push({ cat: C7, type: "dropdown", stem: "The nurse builds the care plan for Baby S. and her mother. For each statement, choose the correct completion.<br><br>Because the LATCH score is 5, the nurse arranges<br>[[0]]<br><br>The feeding pattern to teach the mother is breast milk on demand, every<br>[[1]]<br><br>Once feeding is effective, the stools expected next are<br>[[2]]", blanks: [
  { o: [O("A lactation consultant referral", true, "The LATCH target is 7; a score below 7 is the chapter's trigger for the referral."), O("A switch to scheduled bottle feeding", false, "Nothing in her picture ends breastfeeding; the score triggers support for it, not replacement of it."), O("A glucose check before every feed", false, "The chapter orders a hypoglycemia protocol when indicated; a low LATCH score is a feeding-support trigger, not a glucose trigger.")] },
  { o: [O("2–3 hours", true, "Breastfeeding on demand runs every 2–3 hours; the bottle interval is the longer one."), O("3–4 hours", false, "Every 3–4 hours is the bottle-feeding interval — the classic flipped pair."), O("5–6 hours", false, "No feeding interval in the chapter runs this long for a newborn; her stomach empties in 2–3 hours.")] },
  { o: [O("Bright yellow, soft, pasty stools, 3–6 times a day", true, "Breastfed milk stools are bright yellow, soft, and pasty, 3–6 a day at first and at least 4 a day in the first month."), O("More solid, yellow-to-brown stools, 1–2 times a day", false, "Firmer, browner, less frequent stools are the bottle-fed pattern — the flipped pair again."), O("Dark greenish-black, thick, tarry stools", false, "That is meconium, the first stool of the first day; the stool sequence never runs backward.")] }
], tp: "ANSWER KEY — Correct answers: LATCH 5 = lactation consultant referral; breast on demand every 2–3 hours; next stools = bright yellow, soft, pasty, 3–6 a day. DETAILED RATIONALE — Each blank is a direction check: support escalates when the score falls below its target, the breast interval is the shorter of the pair, and stool character follows the feeding type. PRIORITY FRAMEWORK — Generate Solutions (Clinical Judgment): build the plan from the triggers the assessment actually fired.", scen: CASE_P2, grp: "PRED-CASE2" });

S(C6, "Which action should the nurse take FIRST for Baby S.?", [
    ["Notify the provider and obtain the serum bilirubin the spread calls for", true, "The spread below the sternum is the finding with a test attached to it; the level decides how urgent everything else becomes, so it is measured first."],
    ["Teach the mother the hunger cues and recheck the color at the next shift", false, "Feeding teaching belongs in the plan, but it does not measure the bilirubin that the spread is signaling; rechecking color alone delays the number that matters."],
    ["Begin discharge teaching so the family can leave on schedule this afternoon", false, "Discharge outcomes require no jaundice problem outstanding; her jaundice is unevaluated, so the schedule yields to the assessment."],
    ["Wake her for a long feeding now and hold the bilirubin unless the color deepens", false, "A feeding helps the long-term picture, but the trigger for the serum test has already fired — deepening color is not the threshold, spread is."]
  ], "ANSWER KEY — Correct answer: notify the provider and obtain the serum bilirubin. DETAILED RATIONALE — Prioritization follows the trigger that has already fired: jaundice below the sternum may require a serum bilirubin, and that result steers feeding urgency, follow-up, and discharge. Teaching and feeding support proceed, but after the measurement is set in motion. PRIORITY FRAMEWORK — Prioritization (Clinical Judgment): measure the value that decides the plan before polishing the plan.", { scen: CASE_P2, grp: "PRED-CASE2" });

S(C8, "The serum bilirubin returns within the range the provider accepts for her age, feeding is improving with support, and discharge is planned for this afternoon. Which finding would still block discharge if it were present?", [
    ["She has not yet voided and stooled since birth", true, "The discharge outcomes require that she has voided at least once and stooled at least once; an empty record on either one holds the discharge."],
    ["Her cord stump is still attached", false, "The stump usually falls off between 8 and 10 days — long after discharge; an attached stump at day 2 is the expected state."],
    ["Her weight is still below her birth weight", false, "Birth weight is regained by about day 10; leaving the hospital below birth weight inside the 5–10% loss band is expected."],
    ["She still startles when her crib is bumped", false, "A present Moro reflex is the expected finding at this age; it disappears at 3–6 months, not before discharge."]
  ], "ANSWER KEY — Correct answer: she has not yet voided and stooled since birth. DETAILED RATIONALE — The pathway's discharge outcomes are a checklist: temperature held without an external heat source, voided at least once, stooled at least once, no jaundice concern outstanding, no signs of infection. The stump (8–10 days), the weight (regained by day 10), and the Moro (gone at 3–6 months) all resolve on schedules that run past discharge. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): discharge is judged against the discharge criteria, not against every newborn timeline at once.", { scen: CASE_P2, grp: "PRED-CASE2" });

S(C8, "Before discharge, the nurse watches the mother care for Baby S. Which observation confirms the teaching has landed?", [
    ["The mother folds the diaper below the cord stump, keeps the stump dry and open to the air, and lays the baby in her own crib on a firm mattress with no pillow", true, "All three are the taught behaviors: diaper edge below the stump with dry, air-exposed cord care; safe sleep in her own crib, firm mattress, no pillow, no bed-sharing."],
    ["The mother rubs the cord stump with alcohol at each diaper change and tucks the diaper over it to keep it covered and protected", false, "Cord care is dry care — no alcohol or ointments — and the diaper folds below the stump so the stump stays exposed to air."],
    ["The mother plans to keep the baby in the parents' bed for the first week so she can watch her breathing closely all night", false, "Sleeping in the parents' bed is a named suffocation danger; the newborn sleeps in her own crib."],
    ["The mother says she will call the nursery only if the baby's temperature goes above 39°C, since small fevers are normal at home", false, "The home report line taught to parents is above 38°C by axilla — waiting for 39°C misses the threshold she was given."]
  ], "ANSWER KEY — Correct answer: diaper folded below the stump, stump dry and open to air, baby in her own crib on a firm mattress with no pillow. DETAILED RATIONALE — Discharge teaching is a handoff verified by return demonstration: cord care (dry, exposed, diaper below), safe sleep (own crib, firm mattress, no pillow, never bed-sharing), and the home report thresholds (temperature above 38°C axillary). Each wrong option flips one taught direction. PRIORITY FRAMEWORK — Evaluate Outcomes (Clinical Judgment): teaching is complete when the demonstrated behavior matches the taught behavior.", { scen: CASE_P2, grp: "PRED-CASE2" });


/* ===== C1 — Transition standalones ===== */
S(C1, "A newborn is 5 minutes old. He has mucus in his mouth, a weak cry, and sternal retractions are visible. He is still wet from the delivery. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Clear the mucus from his mouth and throat with gentle bulb suction", true, "Airway outranks every other newborn task: mucus plus retractions is the airway picture, and clearing the mouth and throat is the chapter's immediate first move."],
    ["Dry him thoroughly and place him under the radiant warmer", false, "Correct warmth care, and it follows within the same minutes — but drying does not open an airway, and ABC order puts the airway first."],
    ["Position him on his back with his lungs free to expand", false, "Correct positioning in immediate care; it supports breathing but does not remove the mucus that is obstructing it."],
    ["Complete his 5-minute Apgar scoring", false, "The Apgar is scored at 1 and 5 minutes and reviewed on admission — an assessment that proceeds after the airway is addressed, never instead of it."]
  ], "ANSWER KEY — Correct answer: clear the mucus from his mouth and throat with gentle bulb suction. All four options are correct nursing actions — the ABCs decide the order: airway before warmth, positioning, and scoring. DETAILED RATIONALE — Sternal retractions are a report-immediately sign and mucus is a removable obstruction; the chapter's immediate care opens with clearing the mouth and throat (before the nose, because nasal suction triggers a gasp). Drying, positioning, and the Apgar all belong to the same round, in that order behind the airway. PRIORITY FRAMEWORK — ABCs (Airway first): when several correct actions compete, the one protecting the airway wins.");

S(C1, "The handoff note for a term newborn reads: 'Significant bleeding from the cord stump — an estimated 40 mL on the blanket.' A student says, 'But 40 mL is a small amount. Why is everyone moving so fast?' Which explanation is correct?", [
    ["In test language, 'significant' means heavy and serious — and against his total blood volume of about 300 mL, 40 mL is a major fraction of all the blood he has", true, "Two locks on the same answer: the word 'significant' is the test's label for a serious amount, and the arithmetic agrees — roughly one-eighth of his entire circulation is on that blanket."],
    ["'Significant' describes how noticeable the bleeding looks, not how much there is — 40 mL is minor, so it is charted and rechecked at the next round", false, "This is the skim-reader's pick, and it reverses the word. On an exam, 'significant bleeding' is never the minor option — it is the amount that demands action."],
    ["His blood volume is about 3,000 mL, so 40 mL is under 2% of it — the team is moving fast only because a loose stump is quick to re-tie", false, "The volume is flipped by a factor of ten. The term newborn's circulating volume is about 300 mL, which is what makes the same 40 mL a large loss."],
    ["The amount matters because his kidneys cannot concentrate urine, so he cannot make up fluid losses of any size on his own", false, "Poor urine concentration is a real newborn limit, but it belongs to fluid balance over days; the emergency here is the fraction of his blood volume already lost."]
  ], "ANSWER KEY — Correct answer: 'significant' means heavy and serious, and 40 mL is a major fraction of a roughly 300 mL total blood volume. QUALIFIER TRAP — This item turns on one word. In everyday reading, 'significant' can sound vague, almost minor; in test language it is a severity label that means heavy, serious, act now. Darlene's real-exam miss came from reading it as 'not heavy' — the exam's usage is the opposite. The number backs the word up: newborn numbers run small (about 300 mL total), so a loss that looks trivial on an adult scale is proportionally major. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): read the qualifier the way the test uses it, then check the value against the newborn's own baseline, not the adult's.");

M(C1, "A nurse is reviewing the first 24 hours with a new mother. Which findings, if they appeared, are danger signs of the transition period that must be reported? Select all that apply.", [
    ["Sternal retractions", true, "Retractions are named in the chapter as a report-immediately sign of respiratory distress."],
    ["A weak or absent first cry", true, "The expected first sign is a strong, healthy cry; weak or absent is its danger opposite."],
    ["Cyanosis from blood bypassing the lungs", true, "When a fetal opening fails to close, blood keeps bypassing the lungs and the infant can be cyanotic — a transition danger sign."],
    ["Blue hands and feet in the first week", false, "Acrocyanosis is the normal vasomotor pattern of the first week, not a danger sign."],
    ["A strong, healthy cry at delivery", false, "That is the expected first sign of transition — the reassuring pole, not a report."],
    ["Respiratory distress with a change in behavior", true, "Abnormal rate or character of respirations with cyanosis or behavior change is the chapter's respiratory distress picture."]
  ], "ANSWER KEY — Correct answers: sternal retractions, weak or absent first cry, cyanosis from blood bypassing the lungs, and respiratory distress with behavior change. DETAILED RATIONALE — The first hour is the most critical period of transition and the first 24 hours the most dangerous; the reportable set is retractions, a weak or absent cry, cyanosis tied to bypassed lungs, and distress with behavior change. A strong cry and blue extremities are the normal poles of the same findings. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): in the transition window, sort every finding into expected or report-now before anything else.");

S(C1, "Two babies are born within the hour: Baby A vaginally, Baby B by cesarean. A nurse tells Baby A's parents, 'Her gut microbes will come from skin contact and will include more antibiotic-resistant organisms.' Which correction is right?", [
    ["That description belongs to Baby B — a vaginally born baby's microbes resemble the mother's vaginal flora at about 20 minutes; the skin-flora pattern is the cesarean one", true, "The chapter's contrast is a matched pair assigned by birth route: vaginal flora for the vaginal birth (at about 20 minutes), skin flora with more resistant organisms for the cesarean birth. The nurse handed Baby A her sister-baby's story."],
    ["No correction is needed — in the first day, the seeding pattern and the organisms picked up are the same for every birth route", false, "The route is the whole point of the chapter's contrast; erasing it makes both babies' teaching wrong at once."],
    ["The description fits Baby A, except the resistant organisms come from her erythromycin eye ointment rather than the birth route", false, "The ointment is immediate eye care; it does not seed the gut. The microbe difference is set by the route of birth, not by a medication."],
    ["Both babies' guts stay sterile for the first month, so neither description applies to either baby yet and no teaching is needed", false, "Neither baby is sterile — each is colonized from birth, from a different source. 'Sterile' is not part of the chapter's account for any newborn."]
  ], "ANSWER KEY — Correct answer: the skin-flora description belongs to the cesarean-born Baby B; Baby A's microbes resemble the mother's vaginal flora at about 20 minutes. RIGHT FACT, WRONG BABY — This is the DVT shape in newborn clothing: a statement that is completely correct — for the other patient. Ambulation is right care (for prevention) and wrong care (for the existing clot); skin-flora seeding is right teaching (for cesarean birth) and wrong teaching (for vaginal birth). Before accepting a familiar fact, check which baby, route, or moment it belongs to. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): match the fact to the case it was made for.");

S(C1, "A 1-hour-old term newborn is centrally cyanotic and working to breathe. The provider suspects a fetal opening has not closed. Which mechanism from the chapter explains the cyanosis?", [
    ["Blood keeps bypassing the lungs through the unclosed fetal opening, so too little blood reaches the lungs for oxygen", true, "The foramen ovale and ductus arteriosus are the fetal shortcuts that close soon after birth; one that fails to close leaves blood bypassing the lungs, and the infant can be cyanotic."],
    ["Cold stress has raised his oxygen consumption beyond what his lungs can supply in the first hour", false, "Cold stress does raise oxygen consumption — but its picture is a chilled baby burning brown fat, not a primary cyanosis mechanism at 1 hour."],
    ["His immature kidneys cannot concentrate urine, so fluid is backing up into his circulation", false, "Renal immaturity is real but belongs to fluid balance; it does not route blood around the lungs."],
    ["His digestive enzymes are too limited to absorb feeds, so his oxygen-carrying fuel is low", false, "Enzyme limits shape feeding, not pulmonary blood flow; the cyanosis mechanism is circulatory."]
  ], "ANSWER KEY — Correct answer: blood keeps bypassing the lungs through a fetal opening that failed to close. DETAILED RATIONALE — Transition is a circulatory switch: cord clamped, first breath opens the alveoli, and the fetal shortcuts close. A shortcut that stays open is the chapter's named cause of cyanosis; the other options are genuine newborn immaturities borrowed from the wrong systems. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the right mechanism must explain the headline finding, not just be true somewhere else.");

/* ===== C2 — Thermoregulation standalones ===== */
BANK.push({ cat: C2, type: "matrix", stem: "Four newborns are losing heat in four different setups. Match each setup to the heat-loss route it shows.", cols: ["Conduction", "Convection", "Radiation", "Evaporation"], rows: [
  { t: "He is placed on a cold metal scale for weighing", a: 0, r: "Direct contact with a cold surface is conduction — the fix is never to place him on a cold surface." },
  { t: "A fan is blowing air across his open crib", a: 1, r: "Moving air and drafts across the skin are convection — the fix is to prevent drafts and keep him covered." },
  { t: "His bassinet stands beside a cold window", a: 2, r: "Heat radiating toward cold surroundings is radiation — the fix is to keep the bed away from windows." },
  { t: "He is left wet after delivery while the room is prepared", a: 3, r: "Wet skin losing heat as moisture dries is evaporation — the fix is to keep him dry." }
], tp: "ANSWER KEY — Correct matches: cold scale = conduction; fan across the crib = convection; bassinet by a cold window = radiation; left wet = evaporation. DETAILED RATIONALE — The four routes are told apart by what carries the heat away: a surface (conduction), moving air (convection), cold surroundings (radiation), or drying moisture (evaporation). Each route has its own countermeasure, so naming the route correctly is what makes the fix correct. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): pair each picture with the mechanism it shows." });

S(C2, "A 6-hour-old newborn is found overdressed in a warm room: temperature 37.9°C and a red skin rash on his trunk. All of the following are correct nursing actions — which one is done IMMEDIATELY, on finding him?", [
    ["Loosen and remove the excess clothing and move him out of the overheated spot", true, "The heat load is external and visible; removing the cause is the least invasive first step and every later step (recheck, report) is judged against the corrected setup."],
    ["Report the temperature, because it is above the 37.7°C report line", false, "Correct and required — the value is over the line. It is done in the same round, but the hands-on cause is removed first rather than leaving him wrapped while the call is made."],
    ["Recheck his temperature once the room conditions are corrected", false, "Correct evaluation step — by definition it comes after the correction it evaluates."],
    ["Assess his skin and hydration while the temperature settles", false, "Correct supporting assessment; the rash and hydration are read after the heat load driving them is removed."]
  ], "ANSWER KEY — Correct answer: loosen and remove the excess clothing and move him out of the overheated spot. All four options are correct nursing actions — the qualifier picks the order. QUALIFIER TRAP — The stem's word is IMMEDIATELY. Reporting the 37.9°C is genuinely required (it is above the 37.7°C report line), and rechecking and assessing genuinely belong in his care — but none of them is the immediate act, because a phone call and a recheck leave the heat load on the baby while they happen. When a stem says 'immediately,' it is asking what your hands do in the first moment, and here that is removing the reversible cause at the bedside; the report is made in the same round, right behind it. DETAILED RATIONALE — The chapter names overdressing and an overheated room as the route to a high temperature with a red rash. PRIORITY FRAMEWORK — Least Invasive First / Remove the Cause: fix the reversible environmental cause at the bedside before escalating around it.");

S(C2, "A newborn arrives in the nursery from the delivery room still wet, with his head uncovered. His admission weight, measurements, and vital signs have not been taken yet. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Dry him thoroughly and cover his head", true, "Evaporation is running right now and the head is the largest heat-loss surface; stopping an ongoing loss outranks every admission task that can wait two minutes."],
    ["Take his temperature to establish the admission baseline", false, "Correct and required — but a baseline taken while he is still losing heat only documents the loss; the loss is stopped first, then measured."],
    ["Count his apical pulse and respirations while he is still quiet", false, "Correct order rule for the vital signs themselves; warmth still precedes the counts, because a chilling baby is an unstable baby."],
    ["Give him his first bath now, so he is clean before the admission assessment begins", false, "The first bath is correct newborn care — at the wrong time. Bathing waits until his temperature is stable; bathing a wet, uncovered baby deepens the evaporative loss that is already running."]
  ], "ANSWER KEY — Correct answer: dry him thoroughly and cover his head. All four options are correct nursing actions — safety first, in the form of stopping ongoing harm, decides the order. RIGHT ACTION, WRONG TIME — The bath is the trap in this item: it is real, chapter-taught care, offered in the one window where it harms. A first bath belongs after the temperature is stable, and the temperature, counts, and record all belong to the same admission round — sequenced behind the one action that changes his trajectory. DETAILED RATIONALE — The chapter's immediate warmth care is environmental: dry him, cover the head, warmer or double blankets until stable; evaporation from wet skin is the fastest loss running right after birth. PRIORITY FRAMEWORK — Safety First (Stop the Ongoing Harm): an active loss is interrupted before it is measured, documented, or bathed through.");

BANK.push({ cat: C2, type: "order", stem: "A newborn's temperature is now stable, and his mother is giving his first bath with the nurse coaching her. Place the steps in the order they should be done.", items: [
  { t: "Check that the bathwater is comfortably warm", r: "The water is tested before he touches it — his heat perception is poor, so an adult checks first." },
  { t: "Wash his body with plain warm water", r: "The body is washed while the head stays dry, because a wet head loses heat fastest." },
  { t: "Shampoo his head last", r: "Shampoo is last for the same reason — the head loses heat fast by evaporation." },
  { t: "Dry him and wrap him warmly", r: "Drying ends the evaporative loss the bath created, and wrapping holds his temperature." }
], tp: "ANSWER KEY — Correct order: test the water → wash the body → shampoo the head last → dry and wrap warmly. DETAILED RATIONALE — Bathing is a warmth procedure: the first bath waits until the temperature is stable, baths run only 2–3 times a week with plain warm water (about 37.8°C), and shampoo is last because the head loses heat fast by evaporation. PRIORITY FRAMEWORK — Take Action (Clinical Judgment): in a procedure item, the order of steps is itself the intervention." });

S(C2, "A grandmother proudly shows the nurse how she swaddled the baby: wrapped very tightly with both legs held straight so he 'cannot kick the blanket loose.' Which teaching corrects the technique?", [
    ["Swaddle snug, not tight, with the hips and knees kept in flexed abduction, and stop swaddling once he can roll over on his own", true, "All three elements are the chapter's swaddling rules: snug rather than tight, flexed abduction to help prevent hip dysplasia, and a hard stop at independent rolling."],
    ["Swaddle tightly enough that the legs stay straight, because a straight swaddle keeps the hips in line as they grow", false, "The direction is flipped — hips and knees are kept flexed and abducted; a tight, straight swaddle works against hip development."],
    ["Swaddle snug with the legs free to straighten, and continue swaddling until 6 months whether or not he rolls", false, "Two flips: the legs are held in flexed abduction, and swaddling stops when he can roll over independently, not at a fixed age."],
    ["Leave him unswaddled entirely, because swaddling of any kind interferes with hip development", false, "Swaddling itself is a chapter comfort and warmth measure; it is the tight, straight-leg technique that is wrong, not the swaddle."]
  ], "ANSWER KEY — Correct answer: snug, not tight, hips and knees in flexed abduction, and stop once he can roll over independently. DETAILED RATIONALE — The swaddling skill has three testable directions: tightness (snug, not tight), leg position (flexed abduction, protecting the hips), and the stop point (independent rolling). Each wrong option flips one direction while keeping the others plausible. PRIORITY FRAMEWORK — Safety (Patient Teaching): teach the technique with all three directions intact, because the exam flips them one at a time.");


/* ===== C3 — Vital signs, measurements, Apgar standalones ===== */
S(C3, "A newborn is asleep in his bassinet and the nurse begins his admission vital signs. All of the following are correct tasks — which one comes FIRST?", [
    ["Count the apical pulse while he is still quiet", true, "The counts are taken before anything disturbs him: once he is disturbed and crying, pulse and respiration counts stop being accurate. The apical pulse is also the most accurate heart rate."],
    ["Count his respirations, watching the chest rise and fall", false, "Correct, and it shares the counts-before-disturbing rule with the pulse — the chapter's sequence names the apical pulse with the counts that open the set, ahead of the temperature and the scale."],
    ["Take his temperature in the axilla, holding his arm firmly against his side", false, "Correct technique, wrong position in the order — the temperature check disturbs him, so it follows the quiet counts."],
    ["Weigh him and record the weight in kilograms", false, "Correct admission task, and the most disturbing one on the list; weighing waits until the quiet measurements are secured."]
  ], "ANSWER KEY — Correct answer: count the apical pulse while he is still quiet. All four options are correct tasks — assessment accuracy, in least-disturbing order, decides the sequence. DETAILED RATIONALE — The chapter's rule is explicit: count the apical pulse and respirations BEFORE taking the temperature, because once he is disturbed and crying the counts are no longer accurate. Weighing disturbs him most of all, so it closes the set. PRIORITY FRAMEWORK — Assess in Least-Disturbing Order (Assessment Accuracy): protect the measurements that crying would destroy.");

S(C3, "At the 2-hour transition check, a term newborn's apical pulse, counted for a full minute, is 168 beats/min. His respirations are 44, temperature 36.8°C, color pink, and he is calm. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Report the pulse to the provider", true, "Above 160 beats/min is an always-report value, and the count was already taken the accurate way — apically, for a full minute — so there is nothing left to verify before the report."],
    ["Continue the transition checks every 30 minutes and watch the trend", false, "Correct ongoing care for the transition period; a value outside its line is reported out of that routine, not absorbed into it."],
    ["Document the full set of vital signs in his record", false, "Correct and required — after the report is made, so the chart and the provider carry the same picture."],
    ["Recheck the pulse at the next scheduled transition check", false, "Rechecking belongs to follow-up; the chapter's rule for a pulse above 160 is report, and waiting a full interval delays it."]
  ], "ANSWER KEY — Correct answer: report the pulse to the provider. All four options are correct nursing actions — safety first decides the order: an out-of-line value is escalated, not scheduled. DETAILED RATIONALE — The newborn pulse band is 110–160; above 160 or below 110 is always reported. Because the stem's count is apical and complete, the assess-first step is already satisfied and escalation is the first remaining move. PRIORITY FRAMEWORK — Safety First (Escalate Out-of-Range Values): verified abnormal values are reported before routine care continues.");

S(C3, "A newborn's Apgar scores are 6 at 1 minute and 8 at 5 minutes. His mother, who heard the first score called out, keeps repeating, 'His FIRST score was only 6 — he failed, didn't he?' Which interpretation is correct?", [
    ["The pathway outcome is an Apgar greater than 7 at 5 minutes, and his 8 meets it — he recovered as expected and routine transition care continues", true, "The 5-minute score is the outcome measure; greater than 7 is the pathway's target, and the rise from 6 to 8 is the expected direction."],
    ["He did not meet the outcome, because the 1-minute score of 6 is the one the outcome is judged by and it falls below the line", false, "The outcome is written against the 5-minute score; the 1-minute score describes the starting point, not the verdict."],
    ["Both scores are too low, because a healthy term newborn should score a full 10 at 1 minute and hold it at 5 minutes", false, "Nothing in the chapter sets 10 as the expectation; the named outcome is greater than 7 at 5 minutes, which he has."],
    ["The scores cannot be interpreted until they are repeated at 10 minutes, when the transition picture is complete", false, "The Apgar is scored at 1 and 5 minutes — there is no 10-minute score in the chapter's scheme to wait for."]
  ], "ANSWER KEY — Correct answer: his 5-minute score of 8 meets the pathway outcome of greater than 7 at 5 minutes. QUALIFIER TRAP — The mother's word is FIRST, and it is doing all the damage. The first (1-minute) score is the starting line — it describes where he began, and a 6 there is common enough that the outcome is never judged on it. The pathway's verdict is written against the 5-minute score: greater than 7, and his 8 meets it. When a stem or a parent anchors on the 'first' value, check whether the rule you are applying is actually judged at that moment — here it is judged four minutes later. DETAILED RATIONALE — The Apgar's five signs (heart rate, respiration, muscle tone, reflexes, color) are scored at 1 and 5 minutes; each distractor moves the verdict to the wrong score, the wrong threshold, or a time point that does not exist. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): judge the outcome by the measure and moment the pathway names.");

M(C3, "During the 30-minute transition checks, a nurse collects the following findings from several newborns. Which of these findings are ALWAYS reported? Select all that apply.", [
    ["Noisy respirations", true, "Noisy respirations are on the chapter's always-report list, alongside flaring and retractions."],
    ["Nasal flaring", true, "Flaring is a named report-now respiratory sign."],
    ["Respirations of 28 breaths/min", true, "Below 30 breaths/min crosses the lower line — respirations above 60 or below 30 are always reported."],
    ["Apical pulse of 155 beats/min", false, "155 sits inside the 110–160 band; the report lines are above 160 and below 110."],
    ["Temperature of 37.5°C", false, "The report lines are above 37.7°C and below 36.2°C; 37.5°C is inside the range."],
    ["Chest retractions", true, "Retractions are a report-now sign of respiratory distress."]
  ], "ANSWER KEY — Correct answers: noisy respirations, nasal flaring, respirations of 28, and chest retractions. DETAILED RATIONALE — The always-report set is built from the lines: respirations above 60 or below 30, any noisy breathing, flaring, or retractions. The two distractors are near-miss numbers placed just inside their bands — 155 inside 110–160, 37.5°C inside the temperature range — the almost-right-number trap. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): a value is reportable only when it crosses its named line, not when it approaches it.");

S(C3, "A nurse weighs a newborn and tells the mother, 'She's 7 pounds 9 ounces,' then charts only '7 lb 9 oz' in the record. Which correction does the chapter require?", [
    ["The weight is documented in kilograms and reviewed at every hand-off; pounds are for family conversation", true, "The chapter's rule is explicit: document in kilograms, review at every hand-off — the pound figure is how the family hears it, not how the chart carries it."],
    ["The weight should be charted in both pounds and kilograms so either can be used for dosing", false, "Dual charting invites the wrong unit at the wrong moment; the chapter assigns kilograms to the record and pounds to family talk."],
    ["The weight only needs charting once, at admission, since daily weights use the same figure", false, "He is weighed at the same time each day — the daily trend is the point, and each weight enters the record in kilograms."],
    ["The charting is acceptable because the scale displayed pounds first", false, "The display unit does not set the documentation unit; the record's unit is kilograms regardless of what the scale showed."]
  ], "ANSWER KEY — Correct answer: document the weight in kilograms and review it at every hand-off. DETAILED RATIONALE — Birth weight runs 2722–4082 g and is tracked daily at the same time; the chart unit is kilograms, full stop. The distractors soften the rule (both units, once only, whatever the scale showed) instead of applying it. PRIORITY FRAMEWORK — Safety (Documentation Standards): the unit is part of the measurement, and the record's unit is fixed.");

S(C3, "On admission, a newborn's head circumference measures 37.5 cm and his chest measures 33 cm. Length is 51 cm and weight is 3,300 g. How should the nurse interpret the head and chest measurements?", [
    ["The head should equal the chest and be no more than 2 cm greater; at 4.5 cm greater, this is outside the expected relation and is reported for follow-up", true, "The chapter's relation is head = chest, up to 2 cm greater, holding until age 2. A 4.5 cm gap breaks the relation while length and weight sit in their normal ranges."],
    ["The measurements are expected, because the head is always the largest measurement until age 2 and needs no comparison with the chest", false, "Until age 2 the head may lead the chest — but only by up to 2 cm; 'always largest' erases the limit that makes the finding readable."],
    ["The chest should measure larger than the head at birth, so the tape placement on one of the two measurements must be wrong", false, "The direction is flipped — the head equals or slightly exceeds the chest at birth; the chest is not the larger one."],
    ["Only the head circumference matters at admission, because the chest is not part of the newborn's routine measurement set", false, "Both are measured — head from above the eyebrow to the widest occiput, chest at the nipple line — precisely so the relation can be read."]
  ], "ANSWER KEY — Correct answer: a head more than 2 cm greater than the chest is outside the expected relation and is reported. DETAILED RATIONALE — Head circumference runs 32–36 cm and is read against the chest: equal, or up to 2 cm greater, until age 2. His head also sits above the 32–36 cm band. The distractors remove the limit, reverse the direction, or discard half the measurement. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): some findings are read as relations between numbers, not as single numbers.");

BANK.push({ cat: C3, type: "dropdown", stem: "The nurse reviews three newborn pictures at the change of shift. For each one, choose the correct interpretation.<br><br>Blood pressure of 80/46 mm Hg on admission<br>[[0]]<br><br>A term newborn whose weight is down 12% on day 3<br>[[1]]<br><br>The admission vital-sign schedule for a stable newborn<br>[[2]]", blanks: [
  { o: [O("The average blood pressure at birth — expected", true, "80/46 mm Hg is the chapter's stated average at birth."), O("Low for a newborn — report it", false, "Newborn pressures run far below adult values; 80/46 is the average, not a low outlier."), O("High for a newborn — report it", false, "The same flip in the other direction — the value is the stated average, neither pole.")] },
  { o: [O("Beyond the expected loss — assess feeding and report", true, "The term expectation is 5–10% on days 3–4; 12% exceeds it and sends the nurse to the feeding, voiding, and stooling benchmarks."), O("Expected — preterm infants may lose this much, and the rule covers him", false, "The up-to-15% allowance belongs to the preterm infant; applying it to a term baby is the wrong-context trap."), O("Expected — any loss under 15% is normal in the first week", false, "There is no universal 15% line; the bands are 5–10% term and up to 15% preterm.")] },
  { o: [O("Every 30 minutes × 4, then each shift", true, "That is the chapter's admission schedule, with murmurs rechecked periodically."), O("Once a day unless he looks unwell", false, "The transition period is watched far more closely than daily; the schedule is fixed, not symptom-driven."), O("Every 15 minutes × 8, then hourly", false, "A doubled-intensity flip of the real schedule — plausible numbers, wrong ones.")] }
], tp: "ANSWER KEY — Correct answers: 80/46 = the average at birth; 12% loss in a term baby = beyond expected, assess and report; schedule = every 30 minutes × 4, then each shift. DETAILED RATIONALE — Each blank is a context check: a value read against the newborn average, a percentage read against the correct population's band, and a schedule read as written. The traps are the adult baseline, the preterm allowance applied to a term baby, and doubled numbers. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): the right band belongs to the right baby." });

/* ===== C4 — Head-to-toe standalones ===== */
S(C4, "On rounds, the nurse palpates the anterior fontanel of a quiet, calm newborn and finds it bulging above the contour of the skull. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Report the finding to the health care provider now", true, "A bulging fontanel can mean increased intracranial pressure; deviations from normal are reported, and a pressure sign is escalated before the routine round continues."],
    ["Assess his tissue turgor and hydration status", false, "Correct assessment family — but turgor and hydration are the workup of the sunken fontanel, the opposite pole; the bulging pole is reported first."],
    ["Recheck the fontanel at the next round to see whether it has settled", false, "He is already quiet and calm, so the finding is not a crying artifact; rechecking on a routine schedule delays a deviation report."],
    ["Document the finding along with his head circumference", false, "Correct and required — after the provider knows, so the escalation and the record move together."]
  ], "ANSWER KEY — Correct answer: report the bulging fontanel to the provider now. All four options are correct nursing actions — safety first decides the order: a deviation with a pressure mechanism is escalated before routine data collection. DETAILED RATIONALE — The fontanel's normal feel is flat, following the skull's contour. Bulging points up to increased intracranial pressure; depressed points down to dehydration. The chapter sorts every finding as expected, variation, or deviation — and deviations get reported. PRIORITY FRAMEWORK — Safety First (Escalate Deviations): report the deviation when it is found, not when the round is finished.");

S(C4, "A 3-day-old newborn's anterior fontanel feels sunken, and when the nurse grasps and releases his skin it stays tented instead of springing back. Which interpretation and action are correct?", [
    ["Both findings point to dehydration — the depressed fontanel and the poor turgor agree; report the picture to the provider", true, "A depressed (sunken) fontanel can mean dehydration, and well-hydrated skin springs back immediately while poor turgor stays tented — two independent checks, one conclusion."],
    ["Both findings point to increased intracranial pressure; report the picture to the provider", false, "Pressure is the bulging fontanel's meaning — the direction is flipped; this baby's fontanel is depressed, not raised."],
    ["The fontanel is a normal variation and the skin finding is unrelated; continue routine care", false, "Flat is the normal fontanel feel; sunken is a named deviation, and the tented skin confirms rather than cancels it."],
    ["The findings show overhydration from feeding too well; slow his feedings down", false, "Overhydration would not sink a fontanel or tent the skin — both signs point the same way, toward too little fluid, not too much."]
  ], "ANSWER KEY — Correct answer: the sunken fontanel and tented skin together point to dehydration and are reported. DETAILED RATIONALE — Fontanel direction and turgor direction are the chapter's paired hydration checks: bulging = pressure, depressed = dehydration; springs back = hydrated, stays tented = poor turgor. When two independent checks agree, the picture is reported as a pattern. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): converging findings from different systems carry more weight than either alone.");

BANK.push({ cat: C4, type: "matrix", stem: "Three newborns have three different head findings after vaginal births. Match each finding to the correct name.", cols: ["Caput succedaneum", "Cephalohematoma", "Molding"], rows: [
  { t: "Swelling of the scalp's soft tissues that crosses the suture lines", a: 0, r: "Edema of the presenting part spreads across suture lines — that crossing is caput's signature." },
  { t: "Blood collected under the periosteum of a skull bone, stopping at a suture line", a: 1, r: "Blood trapped under the periosteum is fenced in by the suture line — that boundary is cephalohematoma's signature." },
  { t: "Head shape changed by the skull bones overriding each other in the birth canal", a: 2, r: "Overriding bones shaping the head to fit the canal is molding — temporary, and the head rounds out on its own." },
  { t: "A scalp collection that recedes over a few weeks with no treatment", a: 1, r: "The few-weeks course belongs to cephalohematoma; caput subsides gradually over days, and neither is treated." }
], tp: "ANSWER KEY — Correct matches: crosses suture lines = caput succedaneum; blood under the periosteum stopping at a line = cephalohematoma; overriding bones = molding; recedes over a few weeks = cephalohematoma. DETAILED RATIONALE — The classic opposite pair is separated by one behavior: caput (edema) crosses suture lines, cephalohematoma (blood under periosteum) does not. Both resolve without treatment, so the exam tests the distinction, not the management. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): one discriminating feature, correctly read, names the finding." });

S(C4, "A newborn is 26 hours old and the record shows he has not yet had his FIRST void — not in the delivery room and not since. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Notify the health care provider", true, "The chapter's deadline is explicit: no voiding within the first 24 hours means notify the provider. At 26 hours the deadline has passed, and the notification is the first move."],
    ["Review his feeding record and count today's wet diapers", false, "Correct review — there are no wet diapers to count, which is the finding itself; the review supports the notification rather than preceding it."],
    ["Offer a feeding and reassess his voiding afterward", false, "Feeding support is correct ongoing care, and intake matters to urine output — it does not replace the notification the crossed deadline requires."],
    ["Document that the first void is still pending", false, "Correct charting, done after the provider knows, so the record reflects an escalated finding rather than a waiting one."]
  ], "ANSWER KEY — Correct answer: notify the health care provider. All four options are correct nursing actions — a crossed time deadline decides the order. QUALIFIER TRAP — The operative word is FIRST. The 24-hour deadline in the chapter attaches to the first void specifically: the first void may come in the delivery room or hours later, but no first void within the first 24 hours means notify the provider. A skim reader sees 'no voiding' as a watch item; the word FIRST is what converts it into a deadline that has already passed at 26 hours. Feeding review, feeding support, and documentation all continue, sequenced behind the notification. PRIORITY FRAMEWORK — Time-Critical Rule (Safety): when a named deadline has passed, escalation outranks further observation.");

S(C4, "During the admission assessment, the nurse draws an imaginary line from the outer canthus of a newborn's eye and finds the upper tip of the pinna sits well below it. An ear tag is also present. Which conclusion is correct?", [
    ["The low-set ears are a deviation that can flag a congenital abnormality elsewhere in the body and are reported; the ear tag is a variation to document", true, "Ear placement is read against the canthus line; low-set ears are the chapter's named flag for abnormality elsewhere, while a tag or pit is a variation that is documented and resolves into the record."],
    ["Both findings are variations of normal that are documented in the record, with no report needed for either one", false, "The tag earns that handling; the low placement does not — lumping the two together loses the one finding the chapter flags."],
    ["Both findings are deviations, and the provider should be called about the ear tag first because it is the visible one", false, "The priorities are reversed: the tag is the benign variation, the placement is the reportable deviation."],
    ["The ear position is a molding effect from the birth canal and will rise into place within a few days on its own", false, "Molding shapes the skull bones; it does not set ear placement, and low-set ears are not a wait-and-see finding."]
  ], "ANSWER KEY — Correct answer: low-set ears are a reportable deviation; the ear tag is a documented variation. DETAILED RATIONALE — Every assessment finding is sorted as expected, variation, or deviation. The ear tag sits in the variation column; ear placement below the canthus line sits in the deviation column because it can flag a congenital abnormality elsewhere. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): sort each finding into its own column before deciding what to do with it.");

M(C4, "Which findings from a newborn assessment are VARIATIONS of normal — documented, with no specific follow-up needed? Select all that apply.", [
    ["A small ear tag", true, "An ear tag or pit is a variation — documented, and it needs no specific follow-up."],
    ["A subconjunctival hemorrhage in one eye", true, "A named variation — documented, and it resolves on its own."],
    ["Thin, blood-tinged vaginal mucus in a newborn girl", true, "Pseudomenstruation — withdrawal of maternal hormones — is normal and is taught to parents as such."],
    ["A mild conjunctivitis appearing after the eye medication", true, "A reaction to the eye medication given at birth can produce a mild conjunctivitis — a variation that resolves on its own."],
    ["Constant tremors while he is asleep", false, "Tremors during crying are normal; constant tremors during sleep may be pathological and are reported."],
    ["A bulging anterior fontanel", false, "Bulging can mean increased intracranial pressure — a deviation that is reported, not filed as a variation."]
  ], "ANSWER KEY — Correct answers: ear tag, subconjunctival hemorrhage, pseudomenstruation, and mild conjunctivitis after eye medication. DETAILED RATIONALE — The variation column holds findings that are documented and left alone: ear tags, subconjunctival hemorrhage, hormone-withdrawal mucus, and medication-reaction conjunctivitis. The two distractors wear variation clothing but sit in the deviation column — sleep tremors and a bulging fontanel are both reported. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): the sort (expected / variation / deviation) is the decision; the action follows from it.");

S(C4, "The nurse performs the scarf sign on two newborns. On the first, the elbow resists before it can be pulled past the chest midline. On the second, the elbow crosses the midline easily. Which interpretation is correct?", [
    ["The first pattern fits the full-term infant; easy crossing fits the preterm pattern — resistance is the maturity sign", true, "The chapter's scarf sign: the full-term infant resists pulling one elbow past the midline; the preterm infant does not."],
    ["The first pattern fits the preterm infant, whose joints are stiffer from less time moving in the uterus", false, "The direction is flipped — it is the term infant who resists; the preterm infant's elbow travels."],
    ["Both patterns are normal at any gestational age, so the sign cannot be interpreted", false, "The sign exists precisely because the patterns differ by maturity; declaring it unreadable discards a working assessment."],
    ["Easy crossing means the second infant's arm was injured during the birth", false, "A one-sided injury picture belongs to the one-sided Moro and the clavicle; the scarf sign reads maturity, not injury."]
  ], "ANSWER KEY — Correct answer: resistance fits the full-term infant; easy crossing fits the preterm pattern. DETAILED RATIONALE — Maturity signs run in a direction: more resistance, more maturity. The flipped option is the trap — the same maneuver, the opposite reading. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): for direction-based signs, state the direction before stating the conclusion.");

S(C4, "A nurse notices that a 2-day-old newborn is always laid in the same position and one side of his head is beginning to look flatter than the other. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Change his position now and vary it frequently", true, "His bones are soft cartilage that molds under pressure; repositioning is the one action that stops the flattening process while it is still forming."],
    ["Teach the parents that molding is temporary and the head rounds out on its own", false, "Correct teaching about birth molding — but the flattening here is positional and ongoing, and teaching does not lift the pressure causing it."],
    ["Assess his fontanels and measure his head circumference at the next check", false, "Correct routine assessment; it measures a problem that repositioning is already able to change."],
    ["Document the head shape in the assessment record", false, "Correct charting — after the position has been changed, so the record shows a finding that was acted on."]
  ], "ANSWER KEY — Correct answer: change his position now and vary it frequently. All four options are correct nursing actions — acting on the ongoing cause decides the order. DETAILED RATIONALE — Soft bones mold under sustained pressure, and the chapter's management is positional: change his position frequently so the head cannot flatten. Teaching, measuring, and documenting all belong to the same round, behind the intervention that removes the pressure. PRIORITY FRAMEWORK — Act on the Ongoing Cause (Prevention): when a process is still running, the first action is the one that stops it.");


/* ===== C5 — Reflexes and pain standalones ===== */
S(C5, "The nurse jars the crib of a newborn to elicit the Moro reflex. His right arm fans out and then swings in toward the midline, but his left arm barely moves. Which conclusion should the nurse act on?", [
    ["A one-sided Moro points to a fractured clavicle on the quiet side — assess the left clavicle and report the pattern", true, "The chapter's rule: a unilateral Moro means think fractured clavicle on the side that does not move. The quiet side is the problem side."],
    ["A one-sided Moro is a normal variation, because most newborns favor one side", false, "There is no favored-side variation in the chapter; asymmetry in the Moro is a named injury flag, not a preference."],
    ["The absent movement on the left means the nervous system abnormality is on the right side", false, "Two errors in one option: a one-sided Moro is the clavicle pattern (absent Moro is the nervous-system one), and the side named is the moving side, not the quiet one."],
    ["The response is incomplete because he is sleepy; re-elicit it after his next feeding and chart it then", false, "Sleep state does not erase an asymmetric Moro; the pattern is assessed and reported now, not re-tested into a later shift."]
  ], "ANSWER KEY — Correct answer: a one-sided Moro points to a fractured clavicle on the quiet (left) side. DETAILED RATIONALE — The Moro has three readings: present and two-sided (expected), absent (nervous system), and one-sided (clavicle on the quiet side). This baby's pattern is the third, and the side that matters is the side that did not move. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): for paired responses, the asymmetry is the finding.");

S(C5, "A newborn shows no Moro response at all when the crib is jarred — no fanning out, no embrace — on two careful attempts. Which conclusion is correct?", [
    ["An absent Moro is a danger sign that suggests an abnormality of the nervous system and needs follow-up", true, "The chapter names it directly: absent Moro, suspect a nervous system abnormality; missing reflexes are reported and followed up."],
    ["An absent Moro points to a fractured clavicle, so both clavicles should be assessed first", false, "The clavicle pattern is the ONE-SIDED Moro; a totally absent Moro is the nervous-system pattern — the pair is flipped here."],
    ["The Moro is not expected until the second week, so no response is normal today", false, "The Moro is present from birth and disappears at 3–6 months; there is no late-arrival window."],
    ["He is probably in a deep sleep phase, and the reflex should simply be charted as 'sleeping'", false, "Sleep state explains many soft findings, but an absent protective reflex is charted as absent and followed up, not explained away."]
  ], "ANSWER KEY — Correct answer: an absent Moro suggests a nervous system abnormality and needs follow-up. DETAILED RATIONALE — Reflexes are survival equipment: missing ones, or ones that stay too long, can signal a neurological problem. Absent Moro is the chapter's named example, distinct from the one-sided Moro that points to the clavicle. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): an absent protective response is a finding, not a gap in the data.");

BANK.push({ cat: C5, type: "dropdown", stem: "A nurse is teaching a student the reflex timetable. For each statement, choose the correct completion.<br><br>The reflex that disappears first, at 3–4 months, is<br>[[0]]<br><br>At a 5-month visit, the reflex that can still normally be present is<br>[[1]]<br><br>Significant head lag still present after this age needs follow-up care<br>[[2]]", blanks: [
  { o: [O("Rooting", true, "Rooting goes first, at 3–4 months — the head-turning search for food is the earliest departure."), O("Moro", false, "Moro leaves next, at 3–6 months — close, but not first."), O("Tonic neck", false, "The fencing reflex leaves last of the three, at 5–7 months.")] },
  { o: [O("Tonic neck", true, "Fencing runs to 5–7 months, so its presence at 5 months is still inside its window."), O("Rooting", false, "Rooting is gone by 3–4 months; finding it at 5 months is a stays-too-long flag."), O("Palmar grasp", false, "The grasp leaves at 3 months, when a voluntary grasp takes over; at 5 months it should be gone.")] },
  { o: [O("6 months", true, "Head lag with hyperextension is normal in the newborn period; significant lag after 6 months is the follow-up point."), O("3 months", false, "At 3 months some head lag is still part of the normal picture — the danger point is later."), O("12 months", false, "Waiting to a year misses the chapter's line by half a year; the follow-up point is 6 months.")] }
], tp: "ANSWER KEY — Correct answers: rooting disappears first (3–4 months); tonic neck can still be present at 5 months (gone by 5–7 months); significant head lag after 6 months needs follow-up. DETAILED RATIONALE — The reflexes leave in a set order — rooting first, Moro next, fencing last — and a reflex that stays too long carries the same weight as one that is missing. Each blank tests one direction of that timetable. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): developmental findings are read against their windows, not against the calendar alone." });

S(C5, "A newborn lies with his head turned to the left. His left arm and leg are extended, and his right arm and leg are flexed. The mother asks whether something is wrong with his right side. Which response is correct?", [
    ["This is the tonic neck ('fencing') reflex and it is expected: the side the head turns toward extends, and the opposite side flexes", true, "The fencing posture matches the rule exactly — face side extends, back side flexes — and sleeping infants often assume it on their own."],
    ["Something is wrong: the flexed side should be assessed for a fracture before anything else, because one side is not moving like the other", false, "The injury pattern in this chapter is the one-sided Moro and the clavicle; a symmetric fencing posture with the head turned is the reflex itself, not an injury."],
    ["This is the Moro reflex, and it should disappear by 3–4 months, so she should watch for it to fade on that schedule", false, "Two flips: the posture is tonic neck, not Moro, and 3–4 months is rooting's window — tonic neck runs 5–7 months."],
    ["The posture means he is in pain on the right side and should be scored with a pain scale immediately and medicated", false, "Pain has its own face and body picture — furrowed brow, clenched fist, increased tone; a resting fencing posture is a named normal reflex."]
  ], "ANSWER KEY — Correct answer: this is the expected tonic neck (fencing) reflex — the side the head faces extends, the opposite side flexes. DETAILED RATIONALE — Direction is the whole sign: head left, left side extends, right side flexes. The distractors borrow the injury pattern, swap in the Moro with rooting's timetable, or read a normal posture as pain. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): state the direction rule first, then match the picture to it.");

S(C5, "One hour after a Gomco circumcision, a newborn is crying and hard to settle. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Check the circumcision site for bleeding", true, "Bleeding is the number-one watch-for after any circumcision device; a surgical complication is ruled out before the symptom (crying) is treated as pain alone."],
    ["Score his pain with a named scale and document the findings", false, "Correct and required — pain is scored and documented; it follows the seconds-long site check that rules out the complication."],
    ["Comfort him with swaddling, cuddling, and nonnutritive sucking", false, "Correct non-drug comfort measures from the chapter; they are applied once bleeding is excluded and the pain is scored."],
    ["Offer oral sucrose on a pacifier as the main relief for this post-procedure crying", false, "Sucrose is the chapter's reliever for minor procedures and a comfort used around the circumcision itself. An hour later, persistent crying is established pain to be scored and treated — the during-procedure comfort is the wrong tool as the whole aftercare plan."]
  ], "ANSWER KEY — Correct answer: check the circumcision site for bleeding. All four options are correct nursing actions — safety first decides the order: rule out the surgical complication before treating the symptom. RIGHT TOOL, WRONG MOMENT — The sucrose option is the trap: a genuinely chapter-taught comfort, offered an hour after its window. Sucrose belongs to minor procedures and the circumcision itself; it does not replace scoring and treating established post-procedure pain. DETAILED RATIONALE — The chapter's watch-for after circumcision is bleeding, infection, and irritation, with bleeding first. Pain care is real and layered (score it, comfort him, medicate as ordered), but a bleeding site would change the entire picture, so it is checked before the crying is attributed to pain. PRIORITY FRAMEWORK — Safety First (Rule Out the Complication): after a procedure, exclude the dangerous cause before managing the expected one.");

S(C5, "A heel stick is scheduled for a newborn in 10 minutes. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Give oral sucrose before the stick", true, "Pain relief is given when discomfort is anticipated, not after a full pain display — and oral sucrose is the chapter's reliever for minor procedures such as a heel stick."],
    ["Swaddle him with one hand kept near his mouth", false, "A correct non-drug comfort measure, used with and after the sucrose — it supports the analgesia rather than replacing the timed dose."],
    ["Plan the crying-calming hold to use during the procedure", false, "The hold (arms folded to the chest, face-down at 45 degrees, chin supported, hips rocked) is correct technique for during the stick; the pre-procedure step still comes first in time."],
    ["Give the oral sucrose as soon as the stick is done, to settle him afterward", false, "Sucrose is the right intervention at the wrong time. Given after the stick, it cannot relieve the stick — its analgesic window is before and during the procedure, which is the entire point of anticipating pain."]
  ], "ANSWER KEY — Correct answer: give oral sucrose before the stick. All four options are correct nursing actions — anticipate-and-medicate decides the order: relief precedes the painful event. RIGHT ACTION, WRONG TIME — The after-the-stick sucrose option is this item's DVT: the familiar, correct intervention placed on the wrong side of the event, exactly as ambulation is right before a clot and wrong as its aftercare. The chapter's rule is to medicate when discomfort is anticipated and not wait for a full pain display; sucrose covers minor procedures such as a heel stick. Swaddling and the calming hold complete the plan in their own positions. PRIORITY FRAMEWORK — Anticipate and Medicate (Pain Management): the analgesic step is scheduled before the stimulus, not after the response.");

M(C5, "A nurse is assessing whether a newborn is in pain after a procedure. Which findings belong to the newborn pain picture? Select all that apply.", [
