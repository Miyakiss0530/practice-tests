    ["Furrowed brow with tightly closed eyes", true, "The pain face: furrowed brow, tightly closed eyes, grimace, raised cheeks, deepened nasolabial fold, open mouth, chin quiver."],
    ["Clenched fist and increased muscle tone", true, "Body signs of pain in the chapter — clenched fist and increased tone travel with the pain face."],
    ["Diaphoresis with rapid, shallow respirations", true, "Sweating and rapid shallow breathing are listed pain responses, with increased heart rate and blood pressure."],
    ["Turning toward a touch on the cheek", false, "That is rooting — a feeding reflex hunting for food, not a pain sign."],
    ["Lying in a fencing posture while asleep", false, "Sleeping infants often assume the tonic neck posture on their own; it is a normal reflex picture, not pain."],
    ["Heart rate and blood pressure above his baseline", true, "Pain triggers catecholamine and cortisol release, so heart rate, respiratory rate, blood pressure, and glucose all rise."]
  ], "ANSWER KEY — Correct answers: furrowed brow with tightly closed eyes, clenched fist with increased muscle tone, diaphoresis with rapid shallow respirations, and heart rate and blood pressure above baseline. DETAILED RATIONALE — Newborn pain is read in two channels at once: behavioral (face, fist, tone, cry) and physiological (heart rate, respirations, blood pressure, saturation). Rooting and the sleeping fencing posture are the normal-reflex decoys. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): pain is a pattern across channels, not a single sign.");

S(C5, "A frail newborn who had a procedure an hour ago lies quiet and still, with no cry and little movement. A student says, 'At least he's not in pain — he's not crying.' Which response corrects the student?", [
    ["Some infants are too weak to show a visible response, so pain is monitored through behavioral AND physiological changes — the cry alone misses his pain", true, "The chapter's trap, stated plainly: relying on the cry alone misses the pain of infants too weak to respond visibly; vital signs and behavior are watched together."],
    ["The student is right — a newborn who is not crying after a procedure is comfortable, because crying is the newborn's pain signal", false, "That is the exact assumption the chapter warns against; quiet can mean exhaustion or weakness, not comfort."],
    ["The student should check again in about 4 hours, because pain this quiet always declares itself more clearly by then", false, "Untreated pain exhausts the infant and slows healing; waiting hours for a clearer display is the opposite of the chapter's anticipate-and-treat stance."],
    ["Quiet behavior after a procedure means he is sedated, and the pain scales do not apply to a baby in that state", false, "Scales such as NPASS span from sedated to agitated precisely so quiet infants are still scored; quiet is a score, not an exemption."]
  ], "ANSWER KEY — Correct answer: some infants are too weak to show a visible response — monitor behavioral and physiological changes, not the cry alone. DETAILED RATIONALE — Newborns feel pain (the pain fibers are in place early in fetal life), untreated pain has long-term effects, and the weakest infants show the least. The assessment therefore pairs behavior with heart rate, respirations, blood pressure, and saturation, scored on a named scale. PRIORITY FRAMEWORK — Recognize Cues (Clinical Judgment): absence of a signal is not absence of the problem — widen the channels you monitor.");

/* ===== C6 — Skin and jaundice standalones ===== */
S(C6, "At 14 hours of age — on her FIRST day of life — a newborn's skin has a definite yellow tinge that the evening nurse can see in normal light. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Record the finding and report it to the provider", true, "Jaundice on the first day of life is never normal and never charted as physiologic — the chapter's instruction is to record it and report it."],
    ["Assess how far down her body the yellow has spread", false, "Correct assessment — spread tracks the level and belongs in the same round; the day-1 rule fires the report regardless of how far the color reaches."],
    ["Review her feeding pattern and stooling since birth", false, "Correct supporting assessment; feeding affects the bilirubin story over days, while the report is due on the timing alone."],
    ["Reassure the parents that newborn jaundice is expected, and recheck the color at tomorrow's rounds", false, "This is the skim-reader's pick, and it is the dangerous one. Jaundice IS expected — on days 2–3. Reassurance is the right response to the right timing, and this baby's timing is the wrong one."]
  ], "ANSWER KEY — Correct answer: record the finding and report it. All four options are correct nursing actions — safety first decides the order. QUALIFIER TRAP — Everything in this item hangs on the word FIRST. Physiologic jaundice becomes evident between the 2nd and 3rd days and lasts about a week; jaundice on the first day of life is never physiologic and never simply reassured — it is recorded and reported. The reassurance option is not a bad action; it is the right action for a day-2 baby, offered for a 14-hour-old. Read the age in the stem before reaching for the familiar answer. The spread assessment, feeding review, and careful re-reading proceed around the report. PRIORITY FRAMEWORK — Safety First (Timing Rules): when the calendar itself is the red flag, escalate on the calendar.");

S(C6, "A 3-day-old newborn has a slate-gray mark over his sacrum that looks exactly as it did on day 1. His father, worried, asks whether it is a bruise from the delivery. Which explanation and action are correct?", [
    ["The mark's unchanged color fits a Mongolian spot, which keeps the same color and hue for years before fading; document precisely what is seen", true, "The distinguishing test is change over time: a healing bruise changes color and hue each day, while a Mongolian spot keeps the same color and hue — and precise documentation protects the infant and the family."],
    ["It is a bruise from delivery pressure, and it should change color over the next few days as it heals", false, "A bruise is the changing one; three days of identical color is the spot's pattern, not a bruise's."],
    ["It is a port wine stain, which also stays the same color, so it should be reported for laser treatment", false, "A port wine stain is flat red-purple, does not blanch, and darkens with age; a slate-gray sacral mark that will fade is the Mongolian spot picture."],
    ["The mark should be pressed to see whether it blanches before anyone decides what it is", false, "Blanching separates stork bites from port wine stains; the spot-versus-bruise question is answered by color change over days, which this history already gives."]
  ], "ANSWER KEY — Correct answer: the unchanged slate-gray mark fits a Mongolian spot — document it precisely. DETAILED RATIONALE — Look-alike lesions are separated by their behavior over time: bruises change color and hue daily as they heal; Mongolian spots (usually over the sacrum or buttocks) hold the same color for years, then fade. Because the look-alike here is an abuse bruise, the documentation itself is a safety action. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): when two findings share an appearance, find the feature that behaves differently.");

], tp: "ANSWER KEY — Correct matches: milia = leave alone, never squeeze; vernix = protect, do not scrub off; stork bites = blanch and fade, reassure; port wine stain = does not blanch, permanent. DETAILED RATIONALE — Four pale-or-pink findings, four different actions, and the discriminating tests are mechanical: squeeze nothing, scrub nothing, and press — the blanch test separates the fading stork bite from the permanent stain. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): match the action to the finding's behavior, not its color alone." });

S(C6, "On day 2, a newborn develops a splotchy red rash with firm yellow-white papules across his trunk. He is feeding well, afebrile, and otherwise calm. The mother asks whether it is an infection. Which response is correct?", [
    ["This is erythema toxicum — it appears around day 2 and clears on its own with no intervention; reassure her and keep observing", true, "The timing (about day 2), the look (splotchy red with firm yellow-white papules), and the well baby all fit the chapter's benign rash."],

S(C6, "A mother is alarmed by her 7-day-old's lab slip: hemoglobin 17 g/dL, hematocrit 44%, white blood cell count 12,000/mm³. She says, 'All his numbers are falling.' Which interpretation is correct?", [
    ["The falling values are the expected pattern — the newborn table runs hemoglobin 18.5 → 17, hematocrit 56% → 44%, and WBC 18,000 → 12,000 across the first week", true, "Every value on the slip matches the 7-day column of the chapter's changing-values table exactly; the direction is the physiology, not a decline to fear."],

/* ===== C7 — Feeding, stools, digestion standalones ===== */
S(C7, "A breastfed newborn is 40 minutes old. He is restless, sucking on his fist, and turning his head toward anything that touches his cheek. All of the following are correct nursing actions — which one comes FIRST?", [
    ["Put him to the breast now, using the rooting reflex as he turns toward the breast", true, "Breastfed infants go to the breast in the first hour after delivery — a time-boxed window that is open right now, with his hunger cues (restlessness, fist sucking, rooting) already showing."],

S(C7, "A mother is being taught to give her newborn the prescribed vitamin drops at home. Which instruction set is correct?", [

/* ===== C8 — Circumcision, infection prevention, screening, discharge standalones ===== */
S(C8, "A circumcision is booked for a newborn this afternoon. During the pre-procedure check, the nurse notes the urethral opening is on the undersurface of the penis. Which action is correct?", [
    ["Stop the booking and notify the provider — an infant with hypospadias is not circumcised, because the foreskin may be needed for surgical repair", true, "The chapter's hard stop: hypospadias (opening on the undersurface) means no circumcision; that skin is surgical material for the repair."],

    ["Proceed only with the Plastibell, since the ring method preserves more skin than the clamp methods do", false, "The prohibition is on the procedure, not on one device; Mogen, Gomco, and Plastibell are all circumcisions."],

  ], "ANSWER KEY — Correct answer: do not circumcise an infant with hypospadias — notify the provider. DETAILED RATIONALE — Contraindications outrank schedules and consents. The undersurface opening is the chapter's named hard stop because the foreskin may be needed for the surgical repair; no device choice or extra signature changes that. PRIORITY FRAMEWORK — Safety (Contraindication Check): verify the procedure is permitted before verifying that it is prepared.");

S(C8, "On day 3 after a Plastibell circumcision, a mother phones: the plastic ring has slipped down onto the shaft of the penis. All of the following are correct nursing actions — which one comes FIRST?", [

    ["Ask whether there is any redness, bleeding, or drainage at the circumcision site this morning", false, "Correct complication questions for routine post-procedure calls; a slipped ring is not a routine call, and the questions follow the emergency direction."],
    ["Ask how many wet diapers he has had today and whether the stream looks normal", false, "Correct post-procedure surveillance — edema can obstruct the urinary stream — but it is checked after the immediate call is set in motion."],
    ["Document the call, what the mother reported, and the instructions she was given", false, "Correct and required — after the instruction exists to document."]
  ], "ANSWER KEY — Correct answer: this needs the physician immediately. All four options are correct nursing actions — safety first decides the order. QUALIFIER TRAP — The chapter itself writes this item's qualifier: Plastibell timing has two different speeds. A rim still on after day 8 means 'call the physician'; a rim slipped onto the shaft means 'call IMMEDIATELY.' The word immediately is part of the finding's label, and a skim reader who files both under 'ring problem — ask the routine questions' misses the speed the stem is carrying. The redness, wet-diaper, and stream questions are correct post-procedure surveillance — checked after the immediate call is set in motion. PRIORITY FRAMEWORK — Safety First (Named Emergencies): when the chapter attaches 'immediately' to a finding, the finding sets the pace.");

S(C8, "A circumcision is scheduled for this morning and the nurse begins the preparation. All of the following are correct preparation steps — which one comes FIRST?", [
    ["Assess the parents' knowledge about the procedure", true, "The chapter assigns the opening move explicitly: assessing the parents' knowledge is the nurse's first role in circumcision care."],

S(C8, "A newborn's screening labs come back with an elevated IgM level. The parents ask what the result means. Which explanation is correct?", [
    ["IgM is the antibody the newborn makes himself, so an elevated level suggests a serious infection", true, "The antibody clock: IgG is given by the mother across the placenta, IgM is made by the newborn — and his own production rising is the infection signal."],
    ["IgM crossed the placenta from the mother, so a high level just shows her immunity was strong", false, "That is IgG's story — the placental crossing and the mother's immunity belong to IgG, which rarely lasts longer than 3 months."],
    ["IgM is the antibody in breast milk, so the level reflects how much milk he has taken in", false, "The milk antibody is IgA, produced after about 1 month and carried in breast milk for respiratory and GI resistance."],
    ["An elevated IgM is expected in the first days and falls as his IgG rises", false, "The directions are reversed — his borrowed IgG only falls with time (gone by about 3 months), and a high IgM is a flag, not a phase."]
  ], "ANSWER KEY — Correct answer: IgM is made by the newborn himself, and an elevated level suggests a serious infection. DETAILED RATIONALE — The three immunoglobulins are separated by source: G = given by mom (placenta, fades by ~3 months), M = made by me (danger if high), A = arrives in milk (from ~1 month). Each distractor hands IgM one of the other antibodies' biographies. PRIORITY FRAMEWORK — Analyze Cues (Clinical Judgment): for source-based findings, identify the maker before interpreting the level.");

      S.resp.push(d);
    }
    else { var m = []; for (k = 0; k < q.rows.length; k++) { m.push(-1); } S.resp.push(m); }
  }
}
function falseArr(n) { var a = [], i; for (i = 0; i < n; i++) { a.push(false); } return a; }

function isAnswered(i) {
  var q = Q[i], r = S.resp[i], k;
  if (q.type === "single") { return r >= 0; }
  if (q.type === "multi") { for (k = 0; k < r.length; k++) { if (r[k]) { return true; } } return false; }
  if (q.type === "order") { return S.touched[i]; }
  for (k = 0; k < r.length; k++) { if (r[k] < 0) { return false; } }
  return true;
}
function score(i) {
  var q = Q[i], r = S.resp[i], k, s = 0, tot = 0, hit = 0, wr = 0;
  if (q.type === "single") { return (r >= 0 && q.opts[r].c) ? 1 : 0; }
  if (q.type === "multi") {
    for (k = 0; k < q.opts.length; k++) { if (q.opts[k].c) { tot++; } if (r[k]) { if (q.opts[k].c) { hit++; } else { wr++; } } }
    return Math.max(0, (hit - wr) / tot);
  }
  if (q.type === "order") { for (k = 0; k < r.length; k++) { if (r[k] === k) { s++; } } return s / r.length; }
  if (q.type === "dropdown") { for (k = 0; k < q.blanks.length; k++) { if (r[k] >= 0 && q.blanks[k].o[r[k]].c) { s++; } } return s / q.blanks.length; }
  for (k = 0; k < q.rows.length; k++) { if (r[k] === q.rows[k].a) { s++; } }
  return s / q.rows.length;
}
function isLocked() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }
function showFb() { return S.review || (S.mode === "practice" && S.checked[S.cur]); }

/* ---------- screens ---------- */
function renderStart() {
  var counts = {}, i, k, h = "", kt = {};
  for (i = 0; i < CATS.length; i++) { counts[CATS[i]] = 0; }
  for (i = 0; i < BANK.length; i++) {
    counts[BANK[i].cat]++;
    if (BANK[i].kt) { for (k = 0; k < BANK[i].kt.length; k++) { kt[BANK[i].kt[k]] = (kt[BANK[i].kt[k]] || 0) + 1; } }
  }
  h += '<div class="wrap"><div class="card">';
  h += '<h1>OB Chapter 12: The Term Newborn — Predicted Test</h1>';
  h += '<div class="sub">Brutal mode | Leifer, Introduction to Maternity and Pediatric Nursing | ' + BANK.length + ' questions</div>';
  h += '<h2>Question blueprint</h2><table class="bp"><tr><th>Content area</th><th>Questions</th></tr>';
  for (i = 0; i < CATS.length; i++) { h += '<tr><td>' + CATS[i] + '</td><td>' + counts[CATS[i]] + '</td></tr>'; }
  h += '<tr><td><b>Total</b></td><td><b>' + BANK.length + '</b></td></tr></table>';
  h += '<div class="small"><b>Key Terms tested:</b> ';
  for (i = 0; i < KEYTERMS.length; i++) { h += KEYTERMS[i] + ' (' + (kt[KEYTERMS[i]] || 0) + ')' + (i < KEYTERMS.length - 1 ? ', ' : ''); }
  h += '</div>';
  h += '<div class="small" style="margin-top:6px"><b>Item formats:</b> single best answer, select all that apply, ordering, dropdown sentences, and matching tables. Select-all, ordering, dropdown, and matching items earn partial credit.</div>';
  h += '<h2>Mode</h2>';
  h += '<label class="modebox"><input type="radio" name="mode" value="practice" checked> <b>Practice mode</b><br><span class="small">Check each answer and see rationales right away.</span></label>';
  h += '<label class="modebox"><input type="radio" name="mode" value="exam"> <b>Exam mode</b><br><span class="small">No feedback until you finish. Full review afterward.</span></label>';
  h += '<label class="modebox"><input type="checkbox" id="shf" checked> <b>Shuffle</b> question order<br><span class="small">Answer choices always shuffle, even dropdowns. Case-study questions stay together.</span></label>';
  h += '<button class="btn" onclick="startTest()">Start test</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function startTest() {
  var ms = document.getElementsByName("mode"), i;
  for (i = 0; i < ms.length; i++) { if (ms[i].checked) { S.mode = ms[i].value; } }
  S.shuf = $("shf").checked;
  build();
  S.cur = 0; S.review = false; S.onlyMissed = false; S.screen = "quiz";
  renderShell();
  renderQ();
}

function renderShell() {
  var h = '<div class="top"><div class="pb"><div class="pf" id="pf"></div></div><div id="pt"></div></div>';
  h += '<div class="wrap"><div id="qarea"></div><div class="card"><div class="small" style="margin-bottom:6px">Question navigator</div><div class="nav" id="nav"></div></div></div>';
  h += '<div class="bot" id="bot"></div>';
  $("app").innerHTML = h;
}

function answeredCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (isAnswered(i)) { c++; } } return c; }
function flagCount() { var c = 0, i; for (i = 0; i < Q.length; i++) { if (S.flag[i]) { c++; } } return c; }

function updateBars() {
  var a = answeredCount(), n = Q.length, i, h = "", cls, pts = 0, cnt = 0, tot = 0;
  $("pf").style.width = Math.round(a / n * 100) + "%";
  $("pt").innerHTML = (S.review ? "Review mode" : (S.mode === "practice" ? "Practice mode" : "Exam mode")) + " | Question " + (S.cur + 1) + " of " + n + " | Answered " + a + " of " + n;
  for (i = 0; i < n; i++) {
    cls = "";
    if (S.review) { var sc = score(i); cls = sc === 1 ? "ok" : (sc > 0 ? "part" : "bad"); }
    else if (isAnswered(i)) { cls = "ans"; }
    if (S.flag[i]) { cls += " fl"; }
    if (i === S.cur) { cls += " cur"; }
    h += '<button class="' + cls + '" onclick="goTo(' + i + ')">' + (i + 1) + '</button>';
  }
  $("nav").innerHTML = h;
  var b = "";
  if (S.review) {
    for (i = 0; i < n; i++) { tot += score(i); }
    b = 'Final score: ' + tot.toFixed(1) + ' / ' + n + ' (' + Math.round(tot / n * 100) + '%) &nbsp; <button class="btn ghost" style="padding:6px 12px;font-size:13px;margin:0" onclick="renderResult()">Results</button>';
  } else if (S.mode === "practice") {
    for (i = 0; i < n; i++) { if (S.checked[i]) { pts += score(i); cnt++; } }
    b = cnt ? ('Running score: ' + pts.toFixed(1) + ' / ' + cnt + ' (' + Math.round(pts / cnt * 100) + '%) | Flagged ' + flagCount()) : ('Checked 0 | Flagged ' + flagCount());
  } else {
    b = 'Answered ' + a + ' of ' + n + ' | Flagged ' + flagCount();
  }
  $("bot").innerHTML = b;
}

function typeText(t) {
  if (t === "single") { return "Select the best answer."; }
  if (t === "multi") { return "Select all that apply."; }
  if (t === "order") { return "Arrange the items in the correct order using the arrows."; }
  if (t === "dropdown") { return "Choose the best option for each blank."; }
  return "Choose the best match for each item.";
}

function renderQ() {
  var i = S.cur, q = Q[i], r = S.resp[i], fb = showFb(), lock = isLocked(), h = "", k, o, cls;
  h += '<div class="card"><div class="qh"><span class="qn">Question ' + (i + 1) + ' of ' + Q.length + '</span><span class="chip">' + q.cat + '</span>';
  h += '<button class="flag' + (S.flag[i] ? ' on' : '') + '" onclick="toggleFlag()">' + (S.flag[i] ? 'Flagged' : 'Flag') + '</button></div>';
  if (q.scen) { h += '<div class="scen">' + q.scen + '</div>'; }
  h += '<div class="qt">' + typeText(q.type) + '</div>';

  if (q.type === "single") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r === k ? " sel" : "");
      if (fb) { if (o.c) { cls += " good"; } else if (r === k) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickS(' + k + ')"><span class="lt">' + letter(k) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? 'Correct. ' : (r === k ? 'Your answer. ' : '')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "multi") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < q.opts.length; k++) {
      o = q.opts[k]; cls = "opt" + (r[k] ? " sel" : "");
      if (fb) { if (o.c && r[k]) { cls += " good"; } else if (o.c && !r[k]) { cls += " miss"; } else if (!o.c && r[k]) { cls += " bad"; } }
      h += '<div class="' + cls + '" onclick="pickM(' + k + ')"><span class="lt">' + (r[k] ? '&#10003;' : letter(k)) + '</span><span class="ot">' + o.t;
      if (fb) { h += '<span class="rat">' + (o.c ? (r[k] ? 'Correct. ' : 'Missed - this is correct. ') : (r[k] ? 'Incorrect choice. ' : 'Not correct. ')) + o.r + '</span>'; }
      h += '</span></div>';
    }
  } else if (q.type === "order") {
    h += '<div class="stem">' + q.stem + '</div>';
    for (k = 0; k < r.length; k++) {
      cls = "oi"; if (fb) { cls += (r[k] === k ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="num">' + (k + 1) + '</span><span class="ot">' + q.items[r[k]].t + '</span>';
      if (!lock) { h += '<button onclick="mv(' + k + ',-1)">&#9650;</button><button onclick="mv(' + k + ',1)">&#9660;</button>'; }
      h += '</div>';
    }
    if (fb) {
      h += '<div class="small" style="margin:8px 0 4px"><b>Correct order:</b></div>';
      for (k = 0; k < q.items.length; k++) { h += '<div class="fbx">' + (k + 1) + '. ' + q.items[k].t + ' - ' + q.items[k].r + '</div>'; }
    }
  } else if (q.type === "dropdown") {
    var st = q.stem, b, sel, j, bo;
    for (b = 0; b < q.blanks.length; b++) {
      cls = ""; if (fb) { cls = (r[b] >= 0 && q.blanks[b].o[r[b]].c) ? "good" : "bad"; }
      sel = '<select class="' + cls + '"' + (lock ? ' disabled' : '') + ' onchange="pickD(' + b + ',this.value)"><option value="-1">Select...</option>';
      for (j = 0; j < q.blanks[b].o.length; j++) { sel += '<option value="' + j + '"' + (r[b] === j ? ' selected' : '') + '>' + q.blanks[b].o[j].t + '</option>'; }
      sel += '</select>';
      st = st.replace('[[' + b + ']]', sel);
    }
    h += '<div class="ddstem">' + st + '</div>';
    if (fb) {
      for (b = 0; b < q.blanks.length; b++) {
        h += '<div class="small" style="margin-top:6px"><b>Blank ' + (b + 1) + '</b></div>';
        for (j = 0; j < q.blanks[b].o.length; j++) {
          bo = q.blanks[b].o[j];
          h += '<div class="fbx">' + (bo.c ? 'Correct: ' : (r[b] === j ? 'Your choice: ' : '')) + bo.t + ' - ' + bo.r + '</div>';
        }
      }
    }
  } else {
    h += '<div class="stem">' + q.stem + '</div><div class="leg">';
    for (k = 0; k < q.cols.length; k++) { h += '<div><b>' + letter(k) + '.</b> ' + q.cols[k] + '</div>'; }
    h += '</div>';
    for (k = 0; k < q.rows.length; k++) {
      cls = "mrow"; if (fb) { cls += (r[k] === q.rows[k].a ? " good" : " bad"); }
      h += '<div class="' + cls + '"><span class="mt">' + q.rows[k].t + '</span><select' + (lock ? ' disabled' : '') + ' onchange="pickX(' + k + ',this.value)"><option value="-1">Select</option>';
      for (j = 0; j < q.cols.length; j++) { h += '<option value="' + j + '"' + (r[k] === j ? ' selected' : '') + '>' + letter(j) + '</option>'; }
      h += '</select></div>';
      if (fb) { h += '<div class="fbx">Answer: ' + letter(q.rows[k].a) + ' - ' + q.rows[k].r + '</div>'; }
    }
  }

  if (fb) {
    var sc = score(i);
    h += '<div class="res ' + (sc === 1 ? 'ok' : (sc > 0 ? 'part' : 'no')) + '">' + (sc === 1 ? 'Correct' : (sc > 0 ? 'Partial credit' : 'Incorrect')) + ' - ' + sc.toFixed(2) + ' / 1</div>';
    h += '<div class="tp"><b>Teaching point:</b> ' + q.tp + '</div>';
  }

  h += '<div>';
  h += '<button class="btn ghost" onclick="step(-1)">Back</button>';
  if (!S.review && S.mode === "practice" && !S.checked[i]) { h += '<button class="btn alt" onclick="checkAns()">Check answer</button>'; }
  if (!S.review && i === Q.length - 1) { h += '<button class="btn" onclick="finish()">Finish and score</button>'; }
  else { h += '<button class="btn" onclick="step(1)">Next</button>'; }
  h += '</div></div>';
  $("qarea").innerHTML = h;
  updateBars();
}

/* ---------- interactions ---------- */
function pickS(k) { if (isLocked()) { return; } S.resp[S.cur] = k; renderQ(); }
function pickM(k) { if (isLocked()) { return; } S.resp[S.cur][k] = !S.resp[S.cur][k]; renderQ(); }
function pickD(b, v) { if (isLocked()) { return; } S.resp[S.cur][b] = parseInt(v, 10); renderQ(); }
function pickX(rw, v) { if (isLocked()) { return; } S.resp[S.cur][rw] = parseInt(v, 10); renderQ(); }
function mv(pos, d) {
  var r = S.resp[S.cur], t, np = pos + d;
  if (isLocked() || np < 0 || np >= r.length) { return; }
  t = r[pos]; r[pos] = r[np]; r[np] = t; S.touched[S.cur] = true; renderQ();
}
function toggleFlag() { S.flag[S.cur] = !S.flag[S.cur]; renderQ(); }
function checkAns() {
  var i = S.cur;
  if (Q[i].type === "order") { S.touched[i] = true; }
  if (!isAnswered(i)) { alert("Select or complete your answer first."); return; }
  S.checked[i] = true; renderQ();
}
function goTo(i) { S.cur = i; renderQ(); window.scrollTo(0, 0); }
function step(d) {
  var n = S.cur + d;
  while (n >= 0 && n < Q.length && S.review && S.onlyMissed && score(n) === 1) { n += d; }
  if (n < 0 || n >= Q.length) { return; }
  S.cur = n; renderQ(); window.scrollTo(0, 0);
}
function finish() {
  var un = Q.length - answeredCount();
  if (un > 0 && !confirm(un + " question(s) are unanswered. Finish anyway?")) { return; }
  renderResult();
}

function renderResult() {
  var i, tot = 0, n = Q.length, cat = {}, h = "", c, fullyCorrect = 0;
  S.screen = "result"; S.review = false;
  for (i = 0; i < CATS.length; i++) { cat[CATS[i]] = { p: 0, n: 0 }; }
  for (i = 0; i < n; i++) { var sc = score(i); tot += sc; cat[Q[i].cat].p += sc; cat[Q[i].cat].n++; if (sc === 1) { fullyCorrect++; } }
  h += '<div class="wrap"><div class="card"><h1>Results</h1>';
  h += '<div class="big">' + Math.round(tot / n * 100) + '%</div>';
  h += '<div class="sub">' + tot.toFixed(1) + ' of ' + n + ' points (partial credit included) | ' + fullyCorrect + ' fully correct</div>';
  h += '<h2>By content area</h2>';
  for (i = 0; i < CATS.length; i++) {
    c = cat[CATS[i]];
    h += '<div class="small">' + CATS[i] + ': ' + c.p.toFixed(1) + ' / ' + c.n + ' (' + Math.round(c.p / c.n * 100) + '%)</div><div class="cb"><div style="width:' + Math.round(c.p / c.n * 100) + '%"></div></div>';
  }
  h += '<button class="btn" onclick="startReview(false)">Review all</button>';
  h += '<button class="btn alt" onclick="startReview(true)">Review missed only</button>';
  h += '<button class="btn ghost" onclick="renderStart()">Home</button>';
  h += '</div></div>';
  $("app").innerHTML = h;
  window.scrollTo(0, 0);
}
function startReview(missed) {
  var i, first = 0;
  S.review = true; S.onlyMissed = missed; S.screen = "quiz";
  if (missed) { for (i = 0; i < Q.length; i++) { if (score(i) < 1) { first = i; break; } } }
  S.cur = first;
  renderShell(); renderQ();
}

renderStart();
</script>
